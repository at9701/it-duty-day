['目錄服務',['AD 的網域控制站之間會互相複寫資料。','同一個站台內複寫很快；不同站台之間是依排程複寫，會有時間間隔。','所以在總公司新增的帳號，分公司要過一陣子才能使用。'],'在總公司建立新人的帳號，新人在分公司卻登不進去。等十五分鐘，或手動觸發複寫之後就可以了。','以為帳號一建立，所有地點立刻都能使用。然後把登入失敗當成帳號設定有問題，反覆重建。','站台之間的連線通常頻寬比較小、費用比較高，所以 AD 預設不會即時複寫，而是每隔一段時間批次處理。這是設計上的取捨。急用時可以手動觸發，或直接在當地的網域控制站上建立。','站台之間的複寫有時間間隔；急用可以手動觸發。',['f',['在總公司｜新增帳號','依排程複寫｜到分公司','分公司的｜網域控制站','過一陣子｜才能登入'],null,['','a','','']]],
['備份',['不可變備份是在設定的保存期限內，任何人都無法修改或刪除的備份。','連管理員也刪不掉。','它是為了防範勒索軟體：攻擊者拿到管理員權限之後，常常會先刪除備份。'],'備份系統設定三十天的不可變期間。攻擊者取得備份系統的管理員帳號，嘗試刪除所有備份，但期間內的備份無法被刪除。','認為備份放在另一台主機就安全了。攻擊者取得管理權限之後，可以用同樣的權限登入備份系統並刪除一切。','勒索軟體攻擊的目標是讓受害者別無選擇，所以破壞備份是他們的標準步驟。一般的備份保護依賴權限控管，而攻擊者拿到的正是最高權限。不可變備份的保護不依賴權限，而是技術上就不允許刪除。','不可變備份：期限內連管理員也刪不掉。',['c',[['一般備份','管理員可以刪｜攻擊者拿到權限也可以','w'],['不可變備份','期限內｜任何人都刪不掉','a']]]],
['虛擬化',['快照建立之後，所有的變更都寫在一個差異檔裡。','放得愈久，差異檔愈大，讀寫的效能愈差。','刪除快照時要把差異合併回去，檔案愈大，合併的時間和風險愈高。'],'一台虛擬機的快照放了八個月，差異檔已經比原本的磁碟還大。刪除快照的合併作業跑了六個小時，期間效能很差。','做完快照就忘了它的存在。等到儲存空間不足才發現有一堆放了很久的快照。','有快照的時候，虛擬機每次讀取都可能要同時查原本的磁碟和差異檔，寫入則全部進差異檔。這個結構本來就只適合短期使用。要定期清查有沒有超過期限的快照。','快照放久了差異檔愈來愈大；要定期清查並刪除。',['f',['建立快照','變更都寫進｜差異檔','放愈久檔案愈大','效能變差｜合併風險變高'],null,['','','w','w']]],
['雲端',['雲端帳單突然增加，最常見的原因是有資源開了沒有關。','例如測試用的機器、沒有掛載的磁碟、忘記刪除的快照。','預算警示和資源標籤是雲端管理的基本功。'],'設定每月預算的八成和全額各發一次警示，所有資源都標上專案和負責人。帳單異常時，馬上看得出是哪個專案的哪些資源。','沒有設定任何警示，月底看到帳單才發現。資源也沒有標籤，查不出是誰開的、能不能關。','雲端的資源是開著就持續計費，不管有沒有人在用。建立很容易，沒有實體的東西提醒你它還在。預算警示讓異常在發生時就被知道；標籤讓每一項費用都有人可以問。','雲端帳單暴增：查沒關的資源；設預算警示、打標籤。',['c',[['常見原因','測試機沒關｜沒掛載的磁碟｜忘了刪的快照','w'],['預算警示','超過門檻就通知'],['資源標籤','專案和負責人']]]],
['服務帳號',['排程工作和服務不要用個人的帳號來執行。','那個人離職、帳號被停用，或是他改了密碼，排程就會失敗。','要使用專用的服務帳號，權限給最小，密碼納入管理。'],'備份排程原本是用某位工程師的帳號執行的。他離職當天帳號被停用，當晚的備份就失敗了，而且過了一週才被發現。','設定時用自己的帳號「先讓它可以跑」，之後就沒有再改。','個人帳號是跟著人的，它的生命週期和系統無關。把系統的運作綁在一個人的帳號上，人員的任何異動都會影響系統，而且事先很難知道有哪些東西綁在上面。','排程和服務用專用的服務帳號，不要用個人帳號。',['c',[['個人帳號','離職或改密碼｜排程就失敗','w'],['專用的服務帳號','權限最小｜密碼納管','a']]]],
['容量規劃',['容量規劃看的是趨勢，不是當下的數字。','依成長的速度推估什麼時候會用完，提前規劃擴充或清理。','採購和擴充都需要時間，等告警響了通常來不及。'],'磁碟使用率 70%，過去半年每個月增加 5%。推估大約六個月後會滿，現在就開始編列預算和採購。','只設定「超過 90% 就告警」。告警響的時候只剩下很短的時間，來不及走完採購流程。','當下的使用率只告訴你現在還有多少空間，不能告訴你還能用多久。要回答後者，需要知道成長的速度。有了這個數字，就能把處理的時間點往前推到還有充裕時間的時候。','看成長趨勢推估何時用完，提前處理。',['f',['目前 70%','每月增加 5%','約六個月後滿','現在就規劃擴充'],null,['','','w','a']]],
['高可用與復原',['高可用、備份、災難復原解決的是三種不同的問題。','高可用處理單一設備的故障；備份處理資料的毀損或誤刪。','災難復原處理整個據點都不能使用的狀況。三者不能互相取代。'],'資料庫有兩台做高可用，但兩台在同一個機房。機房淹水時兩台一起停擺。這需要的是在另一個地點的災難復原。','「我們有高可用，所以不需要備份」或「有備份所以不需要災難復原」。每一種只涵蓋一種風險。','三者對應的是不同規模的失效。高可用讓服務在零件故障時不中斷，但它會忠實地複製錯誤的資料；備份能回到過去的時間點，但還原需要時間和一個可以還原的地方；災難復原準備的就是那個地方。','HA 防設備故障、備份防資料毀損、DR 防整個據點失效。',['c',[['高可用','單一設備故障'],['備份','資料毀損或誤刪'],['災難復原','整個據點｜不能用']],'三者不能互相取代']],
['更新管理',['伺服器安裝安全性更新，比使用者電腦要多考慮幾件事。','要安排維護時段、通知使用單位。','並且準備好更新失敗時怎麼退回。但也不能因此不裝。'],'每月固定一個週末的凌晨作為伺服器的維護時段，事前公告，更新前做快照，更新後確認服務正常才結束。','因為怕影響服務，伺服器好幾年都沒有更新。它最後不是因為更新出問題，而是因為被入侵而停擺。','伺服器重新開機會中斷所有使用者的服務，更新失敗影響的範圍也大。所以需要事前的安排和退路。但風險要兩邊一起看：更新可能造成短暫的問題，不更新則是讓已知的漏洞一直開著。','伺服器更新要排時段、要通知、要有退路；但不能不裝。',['f',['排定維護時段','事前通知','更新前準備退路','更新並驗證'],null,['','','a','']]]],
2:[
['目錄服務',['負責把地端 AD 帳號同步到雲端的那台伺服器，要當成和網域控制站同一個等級來保護。','同步用的帳號通常有權限讀取整個網域的密碼雜湊。','這台伺服器被入侵，等於雲端和地端一起失守。'],'同步伺服器只允許少數管理者從管理專用的主機登入，不安裝任何其他軟體，並納入和網域控制站相同的監控。','把它當成一般的應用伺服器，很多人可以登入，上面還裝了別的服務。','同步的工作需要讀取所有帳號的資料，包括用來同步密碼的資訊，所以它被賦予了非常高的權限。攻擊者只要取得這台伺服器的控制權，就能取得這些資料，並同時進入地端和雲端的環境。','同步伺服器等同網域控制站的等級來保護。',['c',[['當成一般伺服器','很多人可以登入｜被入侵後果嚴重','w'],['等同網域控制站','嚴格限制登入｜同等級監控','a']]]],
['備份',['備份的頻率直接決定了最多會遺失多久的資料（RPO）。','每天凌晨備份一次，下午四點故障，最多會遺失大約十六個小時的資料。','業務不能接受的話，就要加上交易紀錄備份或複寫。'],'業務單位表示最多只能接受遺失十五分鐘的資料。於是在每日完整備份之外，加上每十五分鐘一次的交易紀錄備份。','只排了每天一次的備份，卻沒有人問過業務單位「丟掉一整天的資料可不可以」。','備份是某個時間點的複本，那個時間點之後的變更都不在裡面。兩次備份之間的間隔，就是最壞情況下會遺失的資料量。這個數字應該由業務的需求決定，再反過來設計備份的方式。','備份間隔就是最多會丟的資料量。',['f',['凌晨 0 點｜備份','下午 4 點｜故障','遺失約｜16 小時的資料'],'不能接受就加交易紀錄備份或複寫',['a','w','w']]],
['高可用與復原',['只有兩個節點的高可用叢集，還需要一個第三方的見證（仲裁）。','兩個節點之間斷線時，用它來決定哪一邊可以繼續服務。','沒有它，兩邊都會以為自己該當主要節點，發生腦裂。'],'兩個節點加上一個放在第三個地點的見證。兩個節點之間的網路中斷時，還連得到見證的那一邊繼續服務，另一邊自動停止。','只有兩個節點而沒有見證。網路一中斷，兩邊各自接受寫入，資料分岔。','一個節點無法分辨「對方故障了」和「我們之間的網路斷了」。要避免兩邊同時服務，必須讓只有取得多數票的一邊可以運作。兩個節點各一票會平手，所以需要第三票。','兩節點叢集要有見證，避免腦裂。',['f',['節點甲','見證｜（第三票）','節點乙'],'斷線時，連得到見證的那一邊繼續服務',['','a','']]],
['基礎設施管理',['不可變基礎設施是伺服器部署之後就不再登入上去手動修改。','要改就改映像檔，重新部署一台，把舊的換掉。','好處是每一台都一致、可以重現，不會有人偷偷改了而沒有人知道。'],'要調整一個設定。修改映像檔的定義、建立新的映像檔、用它部署新的伺服器、把流量切過去、移除舊的伺服器。','伺服器上線之後持續有人登入去改東西。幾年後每一台都不一樣，沒有人說得清楚差在哪裡，也沒有人敢重建。','手動修改不會留下完整的紀錄，每一次修改都讓伺服器偏離原本的定義一點點。累積下來，它變成獨一無二的東西。如果規定只能透過映像檔來改變，伺服器的狀態就永遠等於映像檔的定義。','伺服器不手改；要改就改映像檔、重新部署。',['c',[['登入手動修改','每台愈來愈不一樣｜沒人敢重建','w'],['改映像檔重新部署','每台一致｜可以重現','a']]]],
['憑證',['自建內部憑證中心時，根憑證的私鑰要離線保存。','平常由下一層的中繼憑證中心來簽發憑證。','根私鑰一旦外洩，整個信任體系就毀了，所有憑證都要重新發放。'],'根憑證中心的主機平常關機並鎖在保險櫃裡，只有在簽發或更新中繼憑證中心時才啟動。日常的憑證都由線上的中繼憑證中心簽發。','只建一台憑證中心，它既是根又直接簽發所有憑證，而且一直連在網路上。','所有的信任最終都來自根憑證。根的私鑰外洩，攻擊者可以簽發任何會被信任的憑證，而要更換根憑證就得更新每一台設備。分成兩層之後，在線上有風險的只有中繼那一層，它出問題時可以由根來撤銷並重新簽發。','根憑證私鑰離線保存，日常由中繼憑證中心簽發。',['f',['根憑證中心｜離線保存','簽發中繼｜憑證中心','中繼憑證中心｜線上運作','簽發日常憑證'],null,['a','','','']]],
['雲端',['雲端帳號裡權限最高的根帳號（或全域管理員），不要拿來做日常的操作。','要開啟多因素驗證並嚴格保管。','日常工作使用權限剛好夠的帳號。'],'根帳號設定了實體金鑰的多因素驗證，密碼分開保管，並設定只要它一登入就發出告警。平常所有人都用自己的、權限有限的帳號。','用根帳號做所有的事，因為「它什麼都能做，最方便」。這個帳號的密碼外洩，整個雲端環境就完全失守。','最高權限的帳號可以刪除所有資源、關閉所有紀錄、修改所有權限，而且通常無法被限制。愈常使用，暴露的機會愈多。把它的使用降到幾乎為零，並讓每一次使用都被注意到。','雲端根帳號不做日常操作：開 MFA、嚴格保管、使用要告警。',['c',[['根帳號','不做日常操作｜開 MFA｜登入就告警','a'],['日常工作','用權限剛好夠的帳號']]]],
['虛擬化',['更新之前對虛擬機做快照，是為了更新失敗時可以退回。','更新確認沒問題之後，快照就要刪除。','快照是短期的保險，不是備份。'],'更新前建立快照，更新後觀察一天確認正常，就把快照刪除。作業流程裡把「刪除快照」列為最後一個步驟。','更新完成就結束，快照留著「以防萬一」。它持續變大、拖慢效能，而且給人一種已經有備份的錯覺。','快照記錄的是某一刻之後的變化，它依賴原本的磁碟檔，而且和虛擬機放在同一套儲存上。儲存設備故障時，快照和虛擬機一起消失。它能提供的保護只有「退回到剛才」這一件事。','快照是短期後悔藥：確認正常就刪，它不是備份。',['f',['更新前｜建立快照','更新','確認正常','刪除快照'],null,['','','','a']]],
['時間同步',['分散在不同地區的伺服器，全部都要校時。','紀錄的時間要統一使用同一個時區，通常是 UTC。','跨時區排查事件時，換算時間最容易出錯。'],'台北、東京和法蘭克福的伺服器，紀錄全部用 UTC 記錄。調查事件時把三地的紀錄直接依時間排序，不需要任何換算。','每台伺服器用當地的時區記錄。排查時要在腦中換算，還要考慮日光節約時間，很容易把先後順序弄錯。','時間軸要拼得起來有兩個條件：每台的時鐘是準的，而且用同一種方式表示時間。各地的時區不同，有些地方還有日光節約時間，把這些差異留到閱讀紀錄時才處理，錯誤幾乎無法避免。','跨地區的伺服器：都要校時，紀錄統一用 UTC。',['c',[['各用當地時區','排查時要換算｜容易出錯','w'],['統一用 UTC','直接依時間排序','a']]]]],
3:[
['特權管理',['即時權限是管理者平常沒有管理權限。','需要的時候提出申請，核准之後限時開通。','時間到了權限自動收回。'],'要維護資料庫的工程師提出申請並說明原因，主管核准後取得兩小時的管理權限，時間到自動失效，整個過程都有紀錄。','管理者的帳號長期擁有最高權限，「因為隨時可能要用」。帳號一被盜用，攻擊者立刻擁有全部的權限。','常駐的高權限帳號是攻擊者最想取得的東西，它二十四小時都有效，不論當下有沒有需要。改成臨時開通之後，帳號在大部分的時間裡沒有任何特權，被盜用時能做的事和可以利用的時間都很有限。','即時權限：平常沒有，需要時申請、限時開通。',['f',['平常｜沒有管理權限','需要時申請','核准後｜限時開通','時間到｜自動收回'],null,['a','','','']]],
['目錄服務',['整個 AD 被攻擊者完全掌控過，而且無法確認每一個後門都清除乾淨時，比較穩當的方向是重建。','在乾淨的環境重新建立信任的基礎。','再分階段把資源遷移過去。'],'無法確定攻擊者留下了哪些後門。決定建立一個新的網域，逐批把使用者、電腦和應用程式遷移過去，舊的網域最後停用。','把找到的後門清掉、重設密碼，就宣告恢復。攻擊者有完整控制權的期間可以留下的機制太多，很難全部找出來。','取得網域最高權限的攻擊者可以修改任何東西：帳號、權限、原則、信任關係，而且可以做得很隱密。無法證明環境是乾淨的，就只能當作它不乾淨。重建的代價很高，但只要殘留一個後門，所有的清除工作都白費了。','AD 被完全掌控又無法確認清乾淨：重建信任基礎，分階段遷移。',['f',['無法確認｜清乾淨','建立乾淨的｜新環境','分階段遷移','停用舊環境'],null,['w','a','','']]],
['高可用與復原',['災難復原演練的價值是找出承諾和實際之間的落差。','實際恢復的時間超過承諾的 RTO 時，要如實報告，由管理階層決定要投資改善還是調整承諾。','從備份重建時，要先恢復其他系統都依賴的基礎服務，例如身分驗證和 DNS。'],'演練實際花了 12 小時，承諾是 4 小時。報告列出時間花在哪些步驟，並提出兩個方案：投入多少資源可以縮短到 4 小時，或是把承諾調整為 12 小時。','為了讓報告好看，只演練最順利的部分，或是不把超時的結果往上報。真正發生災難時，業務單位才發現承諾是做不到的。','RTO 是對業務單位的承諾，他們據此安排自己的應變計畫。如果實際上做不到，這個承諾比沒有承諾更危險。差距的處理方式是資源和風險的取捨，應該由管理階層來決定。','演練發現做不到承諾的 RTO：如實報告，由管理階層決定。',['c',[['發現落差','如實報告'],['方案一','投資改善'],['方案二','調整承諾'],['復原順序','驗證和 DNS 最先','a']]]],
['自動化',['自動化會放大效率，也會放大錯誤。','一支寫錯的腳本同時套用到幾百台伺服器，會全部一起出問題。','預防的方法是先套用到少數幾台確認，再分批擴大。'],'變更先套用到兩台測試主機，再套用到正式環境的 5%，觀察一段時間沒有問題，才依 25%、50%、100% 逐步擴大。','因為「腳本在測試環境跑過了」就一次套用到全部。正式環境裡有一種測試環境沒有的設定，所有主機同時故障。','人工一台一台操作，錯誤在第一台就會被發現。自動化在幾秒內完成所有的主機，沒有發現的機會。分批執行等於把這個機會加回來：讓錯誤先在很小的範圍內顯現。','自動化變更要先少數幾台，再分批擴大。',['f',['先套用｜少數幾台','確認正常','分批擴大','全部完成'],null,['a','','','']]],
['服務水準',['錯誤預算是依服務目標算出來的、可以容許的失敗量。','目標是 99.9%，就代表有 0.1% 可以使用。','預算用完時，暫停新的變更，優先處理穩定性。'],'這個月的錯誤預算在第三週用完了。團隊暫停新功能的上線，把人力放在處理造成不穩定的問題，直到下個月。','把目標訂成「百分之百不中斷」。這個目標做不到，而且會讓團隊不敢做任何變更。','推出新功能和維持穩定是互相拉扯的，雙方很容易各說各話。錯誤預算提供了一個共同的數字：還有預算，可以承擔變更的風險；預算用完了，就應該把重心放在穩定上。','錯誤預算：目標 99.9% 就有 0.1% 可用；用完就先顧穩定。',['c',[['還有預算','可以推新的變更'],['預算用完','暫停變更｜優先顧穩定','w']]]],
['雲端',['雲端主機有隨需和預留兩種主要的計費方式。','預留比較便宜但要承諾使用期間；隨需有彈性但比較貴。','合理的搭配是：長期穩定的基本用量用預留，尖峰和臨時的用量用隨需。'],'分析過去一年的用量，發現無論何時至少都有二十台在運作。這二十台改用預留，超過的部分維持隨需，整體費用下降了三成。','全部用隨需，因為「雲端就是要有彈性」；或是全部用預留，結果需求減少時還在為沒有使用的容量付費。','兩種方式是在價格和彈性之間交換。大部分的系統都有一個不論何時都會用到的基本量，這一部分不需要彈性，可以用承諾來換取折扣。會變動的部分才需要彈性。','穩定的基本用量用預留，尖峰和臨時的用隨需。',['c',[['預留','便宜｜要承諾期間｜用在基本用量'],['隨需','彈性｜較貴｜用在尖峰和臨時']]]],
['虛擬化',['虛擬化平台升級版本時，穩當的做法是滾動升級。','一次升級一台主機：把上面的虛擬機移走、升級、驗證，再換下一台。','升級期間服務不中斷，遇到問題也只影響一台。'],'八台主機的叢集。第一台清空後升級並觀察一天，沒有問題再依序處理其餘七台。','一次把所有主機都升級。新版本有一個相容性的問題，整個叢集同時受到影響，沒有可以退回的主機。','滾動升級把一次大的變更拆成很多次小的。每一次只有一台主機處於變更中，其餘的照常運作。前提是叢集的餘裕要足夠：少了一台主機的時候，剩下的要撐得住所有的虛擬機。','平台升級一次一台：移走虛擬機、升級、驗證，再下一台。',['f',['把虛擬機｜移到別台','升級這一台','驗證','換下一台'],'前提：叢集的餘裕夠讓一台離線']]]};
LEARN.iam={0:[
['驗證與授權',['驗證是確認你是誰。','授權是決定你能做什麼。','登入成功只代表身分確認了，能不能看某份資料是授權在管。'],'用帳號密碼登入系統是驗證；登入之後能不能開啟薪資報表，是授權。','把兩者混為一談，認為「能登入就代表可以用」。有些系統只做了驗證，登入之後什麼都能看。','這是兩個獨立的問題，也由不同的機制處理。確認身分之後，系統還要查這個身分被允許做哪些事。只做前者而沒有後者，等於所有通過驗證的人都有全部的權限。','驗證：你是誰；授權：你能做什麼。',['f',['驗證｜確認你是誰','授權｜決定你能做什麼','存取資源']]],
['權限模型',['以角色為基礎的存取控制（RBAC）是把權限給角色。','再把人指派到角色。','人員會異動，角色相對穩定。'],'建立「會計人員」這個角色並賦予帳務系統的權限。新人到職時指派這個角色；他調到別的部門時，把角色換掉。','直接把權限一項一項給個人。人員調動時要逐項檢查和調整，很容易漏掉。','一個職務需要的權限是相對固定的，擔任這個職務的人則會變動。把權限定義在職務上，人員異動時只需要處理「這個人現在是什麼角色」這一件事。','RBAC：權限給角色，人指派到角色。',['f',['權限','角色','人'],'換職務只要換角色',['','a','']]],
['單一登入',['單一登入（SSO）讓使用者登入一次，就能使用多個系統。','使用者要記的密碼變少。','停用帳號也可以集中處理。'],'早上登入一次之後，開啟郵件、差勤系統、文件系統都不用再輸入密碼。員工離職時，停用這一個帳號，所有系統同時失效。','認為單一登入只是讓使用者方便。它對管理也很重要，但相對地那一組帳號變得非常關鍵，更要保護好。','每個系統各有一組帳號時，使用者會重複使用密碼或寫下來，離職時也要逐一停用。集中驗證之後這些問題都解決了。代價是這個帳號一旦被盜用，所有系統都受影響，所以要搭配多因素驗證。','SSO：登入一次用多個系統；那組帳號要保護好。',['c',[['好處','少記密碼｜停用可以集中處理'],['代價','那一組帳號更關鍵｜要加多因素驗證','w']]]],
['多因素驗證',['驗證的因素分成三類。','你知道的（密碼）、你擁有的（手機或金鑰）、你本身的特徵（指紋）。','多因素是使用兩種以上不同類別的因素。'],'輸入密碼之後，再用手機上的驗證器確認。這是「知道的」加上「擁有的」。','密碼加上安全提示問題。兩個都是「知道的」，只算一種因素。','不同類別的因素要用不同的方法才能取得。密碼可以從遠端被騙走或猜到，但手機要實際拿到。要求兩種類別，攻擊者就必須同時突破兩種不同性質的障礙。','三類因素：知道的、擁有的、本身的；多因素要跨類別。',['c',[['知道的','密碼、PIN 碼'],['擁有的','手機、實體金鑰'],['本身的特徵','指紋、臉']]]],
['帳號生命週期',['帳號的生命週期管理，是從到職建立、異動調整，到離職停用的整個過程。','三個時間點都要有流程。','最常出問題的是異動和離職：權限沒有收回、帳號沒有停用。'],'人事系統登錄到職、調動、離職時，自動通知資訊單位執行對應的動作：建立帳號、調整權限、停用帳號。','只有到職的流程很完整，因為新人沒有帳號會馬上來催。調動和離職沒有人催，就一直沒有處理。','建立帳號有明顯的需求推動。調整和停用則相反，不做也不會有人抱怨，所以需要流程來強制執行。而風險正好來自後兩者：多出來的權限和不該存在的帳號。','帳號三個時間點：到職建立、異動調整、離職停用。',['f',['到職｜建立帳號','異動｜調整權限','離職｜停用帳號'],'最常漏掉的是異動和離職',['','a','a']]],
['共用帳號',['好幾個人共用同一組帳號密碼，最大的問題是出事時無法知道是誰做的。','沒有可歸責性，稽核紀錄就失去意義。','而且有人離職時，密碼要更換並重新告知所有人。'],'一筆資料被刪除，紀錄顯示是「admin」做的，而這組帳號有六個人在用。沒有辦法確認是誰。','「大家都是同一個團隊，共用比較方便」。方便的代價是任何事都無法追查。','稽核紀錄記的是帳號。一個帳號對應一個人時，紀錄就等於「誰做了什麼」；對應很多人時，紀錄只能說明「這幾個人裡的某一個」。這也讓每個人都可以否認，責任無法落實。','共用帳號查不出是誰做的；每人要有自己的帳號。',['c',[['共用帳號','紀錄只知道帳號｜不知道是誰','w'],['個人帳號','每個動作｜對應到一個人','a']]]],
['服務帳號',['服務帳號是給程式或服務使用的帳號，不是給人登入操作的。','它通常不會過期、權限不小，又沒有人盯著。','所以要列冊管理，權限給最小。'],'建立一份服務帳號清冊，記錄每一個帳號是哪個系統在用、負責人是誰、有什麼權限、密碼上次什麼時候更換。','沒有人知道總共有多少服務帳號。有些是好幾年前離職的人建立的，權限很高，密碼從來沒換過。','人的帳號有人在使用，異常容易被察覺，離職時也會被處理。服務帳號沒有對應的人，建立之後就默默地運作，沒有任何事件會促使人去檢視它。它們因此成為攻擊者偏好的目標。','服務帳號給程式用：要列冊、有負責人、權限最小。',['c',[['用途','給程式或服務'],['風險','不過期、權限大｜沒人盯著','w'],['管理','列冊、負責人｜最小權限','a']]]],
['密碼管理',['要管理幾十組不同系統的密碼，要使用密碼管理工具。','每個系統使用不同的密碼，才不會一組外洩就全部淪陷。','這靠人腦記不住，要交給工具。'],'用密碼管理工具為每個系統產生一組很長的隨機密碼並保存。自己只需要記住打開工具的那一組主密碼。','所有系統用同一組密碼，或是把密碼記在試算表、便條紙上。','密碼外洩很常發生，常常不是你自己的問題，而是某個網站被入侵。如果你在其他地方用了同一組密碼，攻擊者會拿它去每一個地方嘗試。每個系統不同密碼可以把損害限制在那一個系統。','每個系統不同密碼，交給密碼管理工具。',['c',[['同一組密碼','一處外洩｜全部淪陷','w'],['密碼管理工具','每個系統｜不同的隨機密碼','a']]]]],
1:[
['權限累積',['員工每次調動都增加新的權限，舊的沒有收回，叫做權限累積。','一個人會擁有遠超過工作所需的權限。','異動時要「先收再給」。'],'一位員工待過會計、採購、人事三個部門，現在同時擁有三個部門的系統權限。他的帳號被盜用時，三個部門的資料都受影響。','調動時只處理「新部門需要什麼」，沒有人問「舊部門的權限還需不需要」。','新增權限有人申請，因為沒有就無法工作。收回舊的權限沒有人會提，因為多出來的權限不會造成任何不便。每一次調動都只加不減，權限自然不斷累積。','調動時先收回舊權限，再給新的。',['f',['調到新部門','先收回｜舊部門的權限','再給｜新部門的權限'],null,['','a','']]],
['特權帳號',['管理員日常收信、上網和做系統管理，要用兩個不同的帳號。','一般帳號做日常的工作，管理帳號只用來做管理。','收信和上網最容易中招，管理權限不在那個帳號上，損害就小很多。'],'管理員用一般帳號收信時點到惡意連結。因為這個帳號沒有任何管理權限，攻擊者只取得了一般使用者的存取。','用同一個擁有管理權限的帳號做所有的事。瀏覽網頁時中招，攻擊者直接取得管理員的權限。','惡意程式會以執行它的那個帳號的身分運作，擁有那個帳號的所有權限。日常的活動（郵件、網頁）是最主要的入侵管道。把高權限從這些活動中隔離出來，是成本很低而效果很大的做法。','管理員兩個帳號：日常用一般帳號，管理才用管理帳號。',['c',[['一般帳號','收信、上網'],['管理帳號','只做管理工作','a']]]],
['目錄服務',['LDAP 是用來查詢和存取目錄服務的協定。','目錄服務存放的是帳號、群組這類資料。','很多系統靠 LDAP 向目錄查詢帳號和群組，AD 也支援它。'],'一套內部系統設定為透過 LDAP 連到公司的目錄：使用者用公司的帳號登入，系統向目錄查詢他屬於哪些群組來決定權限。','使用沒有加密的 LDAP 連線。帳號密碼會以明文在網路上傳送，要改用加密的方式。','各種系統都需要知道「有哪些使用者、他們屬於哪些群組」。與其每個系統各自維護一份，不如都向同一個目錄查詢。LDAP 就是這個查詢所使用的共同語言。','LDAP：查詢目錄服務（帳號、群組）的協定。',['f',['應用系統','用 LDAP 查詢','目錄服務｜（帳號、群組）'],'連線要加密',['','a','']]],
['群組授權',['設定共用資料夾的權限時，要授權給群組，不要直接授權給個人。','人員異動時只需要調整群組的成員。','不必逐一去修改每一個資料夾。'],'「專案甲成員」這個群組有十個資料夾的權限。新人加入專案時，把他加進群組就可以了。','直接把個人加到資料夾的權限清單上。幾年後清單上有幾十個名字，沒有人說得清楚每個人為什麼有權限，離職的人也還在上面。','直接授權給個人時，權限的資訊分散在每一個資源上，要知道一個人有哪些權限得逐一檢查。授權給群組之後，資源上只有少數幾個群組，管理的重點變成「誰在這個群組裡」。','權限給群組不給個人；異動只要調整群組成員。',['c',[['授權給個人','清單愈來愈長｜沒人說得清楚','w'],['授權給群組','異動只調整成員','a']]]],
['多因素驗證',['MFA 疲勞攻擊是攻擊者拿到密碼之後，不斷送出手機的驗證推播。','使用者被吵到受不了，就按下了「允許」。','改善的方式是改用需要輸入畫面上數字的驗證方式，並教育使用者：不是自己發起的登入一律不要允許。'],'啟用數字比對：登入畫面顯示一個兩位數，使用者要在手機上輸入這個數字才能通過。攻擊者在遠端發起的登入，使用者看不到那個數字。','使用只需要按「允許」的推播。半夜手機一直跳出通知，使用者為了讓它停下來就按了。','只按一下的驗證方式沒有確認「這個登入是不是我發起的」。要求輸入登入畫面上的數字，等於要求使用者必須正在看著那個登入畫面。同時要讓使用者知道，收到非自己發起的驗證要求代表密碼已經外洩。','推播驗證改成數字比對；不是自己發起的不要按。',['c',[['只按「允許」','被吵到就按了','w'],['數字比對','要看著登入畫面｜才能通過','a']]]],
['權限審查',['定期的權限審查要確認「這個人該不該有這個權限」。','做這個判斷的應該是該系統或資料的擁有者，或是當事人的主管。','資訊人員知道誰有權限，但不知道業務上該不該有。'],'每半年把各系統的權限清單交給各部門主管，逐一確認每一位部屬的權限是否仍然需要，並簽核回覆。','由資訊單位自己審查。他們只能確認帳號存在，無法判斷業務上的必要性，審查流於形式。','「該不該有」取決於這個人現在的工作內容，這只有他的主管或資料的擁有者知道。資訊單位能提供的是清單，判斷必須回到業務端。審查也要讓主管容易做，否則會變成整批勾選。','權限審查由資料擁有者或主管判斷，不是資訊單位。',['f',['資訊單位｜提供權限清單','主管或資料｜擁有者確認','不需要的｜收回'],null,['','a','']]],
['帳號鎖定',['帳號鎖定的門檻設得太嚴，會有副作用。','錯三次就永久鎖定的話，別人可以故意輸錯來鎖住你的帳號。','通常設定合理的次數，加上自動解鎖的時間。'],'設定為十次失敗後鎖定十五分鐘。猜密碼的速度被大幅拖慢，而被惡意鎖住的帳號也會自動恢復。','認為門檻愈嚴愈安全。結果攻擊者不需要猜對密碼，只要故意輸錯就能讓很多人無法工作。','鎖定是為了阻止有人不斷嘗試密碼。但只要知道帳號名稱就能觸發它，所以它本身也可以被拿來攻擊。門檻要在兩者之間取得平衡。','鎖定門檻太嚴會被拿來鎖別人；設合理次數加自動解鎖。',['c',[['太嚴','被故意輸錯｜鎖住別人的帳號','w'],['太鬆','擋不住猜密碼','w'],['合理次數｜＋自動解鎖','兩者平衡','a']]]],
['緊急帳號',['緊急存取帳號是在正常的驗證機制故障時，讓管理者還能進得去的帳號。','例如單一登入或多因素驗證的服務中斷。','它要嚴格保管、平常不使用，一被使用就要發出告警。'],'準備兩個緊急帳號，密碼分成兩半由不同的人保管並鎖在保險櫃。設定只要這兩個帳號登入，就立刻通知資安單位。','沒有準備緊急帳號。身分驗證服務故障時，連管理者都無法登入去修復它。','所有的登入都經過同一套驗證機制時，這套機制故障，包括修復它的人在內所有人都會被擋在外面。緊急帳號是刻意繞過這套機制的通道。正因為它繞過了平常的保護，所以要用其他方式嚴加控管。','緊急帳號：驗證機制壞了時用；嚴管、平常不用、一用就告警。',['c',[['用途','驗證機制故障時｜還能進去'],['管理','嚴格保管｜平常不用｜一用就告警','a']]]]],
2:[
['聯合身分',['使用 SAML 或 OIDC 做單一登入時，身分提供者（IdP）負責驗證使用者。','並且告訴應用系統這個人是誰。','應用系統把驗證的工作交給 IdP，自己不需要儲存密碼。'],'使用者開啟一個雲端應用，被導向公司的 IdP 登入。登入成功後，IdP 發給應用一個經過簽章的聲明，說明這位使用者的身分。','每一個應用系統各自保存一份帳號密碼。密碼分散在很多地方，任何一個系統被入侵都會外洩。','讓每個應用自己處理驗證，等於每個應用都要把這件事做對，也都要保管密碼。把驗證集中到一個專門的系統，應用只需要信任它發出的聲明。IdP 因此成為最關鍵的系統之一。','IdP 負責驗證並告訴應用「這是誰」；應用不用存密碼。',['f',['使用者｜開啟應用','導向 IdP 登入','IdP 發出｜簽章的聲明','應用依聲明｜放行'],null,['','a','','']]],
['條件式存取',['條件式存取是依登入當下的條件，決定要不要放行。','條件包括：使用的裝置、所在的位置、風險的程度。','同一個人在不同的情境下，會得到不同的處理。'],'從公司管理的電腦登入，直接放行；從沒見過的裝置登入，要求多因素驗證；從高風險的地區登入，直接拒絕。','所有的登入都用同一套規則。不是對所有人都很嚴格而造成不便，就是對所有情況都很寬鬆而有風險。','帳號密碼正確，不代表登入的人就是本人。登入的情境提供了額外的線索：這是不是他平常使用的裝置、平常所在的地方。把這些納入判斷，可以在風險低的時候減少打擾，在風險高的時候提高要求。','條件式存取：依裝置、位置、風險決定放行、加驗或拒絕。',['c',[['公司的裝置','直接放行'],['陌生的裝置','要求加驗'],['高風險的情境','拒絕','w']]]],
['特權存取管理',['特權存取管理（PAM）系統有三個主要的功能。','保管特權帳號的密碼、定期自動更換密碼、側錄操作的過程。','管理員不需要知道真正的密碼，由系統代為登入。'],'管理員向 PAM 申請連線到資料庫伺服器。PAM 驗證他的身分後代他登入，整個操作過程被錄下來，結束後密碼自動更換。','特權帳號的密碼記在共用的檔案裡，很多人知道，從來不換，誰用過也沒有紀錄。','特權帳號的密碼是最有價值的秘密。只要有人知道它，就可能被外洩、被記下來、被離職的人帶走。讓人完全不接觸密碼，由系統在需要時代為使用，這個風險就不存在了。','PAM：保管特權密碼、定期輪替、側錄操作。',['c',[['保管密碼','人不需要｜知道密碼'],['定期輪替','用完就換'],['側錄操作','做了什麼｜都有紀錄']]]],
['職務區隔',['會互相制衡的權限，不能落在同一個人身上。','例如同一個角色既能建立廠商資料、又能核准付款，一個人就可以完成舞弊。','設計角色的時候就要檢查有沒有這種衝突。'],'建立廠商資料的人不能核准付款；核准付款的人不能建立廠商。要完成一筆不實的付款，至少需要兩個人共謀。','為了方便，給資深的員工所有的權限。這個人不論是出於故意或疏失，都可以獨自完成整個流程而沒有人發現。','很多流程的安全性來自「需要兩個人經手」：一個人提出，另一個人核准。如果兩個步驟由同一個人完成，核准就失去了意義。把這個原則落實在系統的權限上，流程的制衡才真的存在。','互相制衡的權限不能給同一個人。',['c',[['建立廠商','甲'],['核准付款','乙'],['同一人兩者都有','一個人就能舞弊','w']]]],
['孤兒帳號',['孤兒帳號是人已經離職、帳號卻還在的帳號。','找出它們最有效的方法，是定期把帳號清單和人事資料比對。','比對不上的帳號要逐一確認。'],'每個月把所有系統的帳號清單和人事系統的在職名單比對，列出沒有對應到在職人員的帳號，逐一確認並停用。','等待離職流程來通知。只要流程有任何一次遺漏，那個帳號就會一直存在。','人事資料是「誰應該存在」的依據。帳號清單是「誰實際存在」。兩者之間的差異就是問題所在。這個比對不依賴任何流程有沒有被正確執行，所以可以把流程漏掉的抓出來。','找孤兒帳號：定期拿帳號清單比對人事資料。',['f',['各系統的｜帳號清單','人事系統的｜在職名單','比對','對不上的｜逐一確認'],null,['','','a','w']]],
['機器身分',['程式使用的 API 金鑰、憑證這類機器身分，數量通常比人的帳號多好幾倍。','最常見的問題是沒有人列冊、從來不更換。','要有清冊、負責人，以及到期和輪替的機制。'],'盤點後發現有四百多把 API 金鑰，其中一半找不到負責人，有些已經五年沒有更換。建立清冊並逐步設定到期日和自動輪替。','只管理人的帳號。程式之間互相驗證用的金鑰散落在各個設定檔裡，沒有人知道全貌。','每一個系統之間的整合、每一個自動化的流程，都需要某種憑據。它們是由開發人員在需要時建立的，通常沒有流程管理。它們和人的帳號一樣可以被盜用，權限常常還更大。','機器身分要列冊、有負責人、會到期、會輪替。',['c',[['常見問題','數量多｜沒人列冊｜從不更換','w'],['管理','清冊、負責人｜到期和輪替','a']]]],
['權杖安全',['使用者登入之後，系統會發給他一個連線權杖，之後就不用再驗證。','攻擊者偷走這個權杖，等於直接跳過了驗證，包括多因素驗證。','降低風險的做法是縮短權杖的效期，並把權杖綁定在裝置上。'],'使用者的電腦中了竊取資料的惡意程式，瀏覽器裡的登入權杖被偷走。攻擊者在自己的電腦上使用這個權杖，直接進入了他的帳號。','「有多因素驗證就不會被盜用」。多因素驗證只保護登入的那一刻，之後的存取靠的是權杖。','每一次操作都重新驗證太不方便，所以登入成功後系統發給一個代表「已經驗證過」的憑據。這個憑據本身就成了目標。縮短效期可以限制被偷之後能用多久；綁定裝置讓它在別的裝置上無法使用。','權杖被偷會跳過驗證：縮短效期、綁定裝置。',['f',['登入並完成｜多因素驗證','取得權杖','權杖被偷','攻擊者直接｜使用，不用驗證'],null,['','','w','w']]],
['最小權限',['要把「權限給太多」的現況收斂成最小權限，一次全部收回會癱瘓業務。','可行的做法是依實際的使用紀錄。','把長期沒有用到的權限逐步移除。'],'分析過去九十天的紀錄，找出有權限但從未使用的項目。先通知當事人，沒有異議就移除，並保留快速恢復的方式。','訂一個日期，把所有人的權限重設為最低。隔天大量的人無法工作，最後只好全部恢復，改善完全沒有進展。','沒有人確切知道每個人實際需要哪些權限，包括當事人自己。但使用紀錄會顯示哪些權限真的有被使用。從沒有被使用的開始移除，影響最小、依據也最明確。','收斂權限看使用紀錄：長期沒用的逐步移除。',['f',['分析使用紀錄','找出長期｜沒用的權限','通知後移除','保留快速｜恢復的方式'],null,['a','','','']]]],
3:[
['零信任',['「身分是新的邊界」的意思是，系統和使用者都不在公司的網路裡了。','雲端服務和遠距工作讓網路的邊界失去意義。','能夠依靠的管制點變成了身分：每一次存取都依身分、裝置和情境來判斷。'],'員工在家用筆電直接連到雲端服務，流量完全沒有經過公司的網路。唯一能控制這次存取的，是他登入時的身分驗證和當下的條件。','繼續把所有資源投入在網路邊界的防護上。大部分的存取已經不經過那裡了。','過去所有的東西都在公司的網路裡，控制誰能進到網路就控制了存取。現在資源和使用者都分散在各處，沒有一個共同的入口可以管。唯一每一次存取都會經過的，就是「你是誰」這個步驟。','邊界不在了，身分成為主要的管制點。',['c',[['過去','管制點是｜網路的邊界','off'],['現在','管制點是身分｜加上裝置和情境','a']]]],
['可用性',['所有系統都接上同一套身分提供者之後，最大的架構風險是它成為單點。','它一故障，所有系統都無法登入。','要有備援、監控，以及不依賴它的緊急存取方式。'],'身分提供者部署在兩個地點互為備援；另外準備了不經過它的緊急帳號，並定期演練它故障時的處理流程。','享受了集中的好處，卻沒有為它的失效做準備。某天它中斷了四個小時，全公司沒有人能登入任何系統。','集中驗證讓管理變得容易，也把所有系統的可用性綁在同一個元件上。它的重要性等同於甚至超過任何一個業務系統，所以要用最高的標準來設計它的可用性。','身分提供者是單點：要有備援、監控和緊急存取。',['c',[['風險','它一故障｜所有系統都登不進去','w'],['因應','備援、監控｜不依賴它的緊急帳號','a']]]],
['身分整合',['兩家公司合併、各有一套目錄和身分系統時，一次切換的風險太高。','初期比較務實的做法是先建立信任關係或同步，讓雙方可以互相存取。','之後再規劃長期的整合。'],'合併後第一個月先在兩套目錄之間建立信任，讓雙方的員工可以使用對方必要的系統。完整的整合規劃為兩年，依業務的優先順序分階段進行。','為了盡快「變成一家公司」，要求在很短的時間內把所有人遷移到同一套系統。大量的應用程式出問題，業務受到影響。','每一套目錄後面都有大量依賴它的系統和設定，逐一遷移需要很長的時間。合併當下最迫切的需要只是「雙方能一起工作」，這可以用較輕的方式達成。把互通和整合分成兩個階段，業務不必等待。','合併先互通（信任或同步），再規劃長期整合。',['f',['建立信任｜或同步','雙方可以｜互相存取','規劃長期整合','分階段遷移'],null,['a','','','']]],
['無密碼驗證',['FIDO2 通行金鑰這類無密碼的驗證方式，能夠抵抗釣魚。','原因是驗證的過程綁定了正確的網站。','假的網站拿不到可以使用的憑證。'],'使用者被騙到一個外觀一模一樣的假登入頁。因為網址不同，他的通行金鑰不會對這個網站產生回應，登入無法進行。','認為簡訊驗證碼和驗證器的數字已經足以防止釣魚。這些都可以被使用者輸入到假網站上，再被攻擊者即時轉用。','密碼和驗證碼的弱點在於它們是由人輸入的，而人無法可靠地分辨真假網站。通行金鑰的驗證是由裝置依網站的實際位址來進行，裝置不會被外觀騙過。','通行金鑰綁定網站，假網站騙不到。',['c',[['密碼、驗證碼','人會輸入到假網站','w'],['通行金鑰','由裝置核對網址｜假網站得不到回應','a']]]],
['角色治理',['導入 RBAC 幾年後，角色的數量可能比員工還多，這叫角色爆炸。','原因是每遇到例外就新增一個角色。','治理的方式是定期檢視並合併相似的角色，並訂定新增角色的審核標準。'],'盤點後發現八百個角色中，有三百個只指派給一個人，兩百個的權限幾乎相同。合併整理成一百二十個，並規定新增角色要經過審核。','每一個「這個人需要多一點權限」的要求都用新增角色來解決。最後角色和直接授權給個人沒有差別，也沒有人知道每個角色代表什麼。','角色的價值在於它比人少、比人穩定。每一個例外都變成新的角色時，這個優點就消失了。角色也需要有人管理：為什麼存在、包含什麼、誰可以新增。','角色爆炸：定期合併相似角色，新增角色要審核。',['f',['盤點角色','合併相似的','移除沒人用的','新增要審核'],null,['','a','','']]],
['身分治理',['身分治理（IGA）系統和人事系統串接，最主要的價值是自動化。','到職、異動、離職時，帳號和權限會自動跟著調整。','離職當天帳號自動停用。'],'人事系統登錄某位員工的離職日。當天下班時間，IGA 系統自動停用他在所有系統的帳號，並通知主管。','依靠人事單位寄信通知資訊單位，再由資訊人員手動處理。只要有一封信沒寄或沒被看到，帳號就會被遺漏。','人員的異動是由人事系統記錄的，帳號的處理是由資訊單位執行的。中間靠人傳遞訊息，一定會有遺漏和延遲。讓人事系統的異動直接觸發帳號的動作，就不再依賴任何人記得通知。','人事異動直接驅動帳號：到職建立、異動調整、離職停用。',['f',['人事系統｜登錄異動','IGA 系統｜自動處理','各系統的｜帳號和權限'],'不依賴人工通知',['','a','']]],
['第三方存取',['給委外廠商的帳號，治理上最重要的有三件事。','專人專用：每一位廠商人員各自一個帳號，不共用。','設有期限：到期自動失效。行為有監控。'],'廠商的每位工程師各有自己的帳號，效期設定為合約期間，連線要經過跳板機並側錄。廠商人員異動時要通知並停用原帳號。','給廠商一組共用的帳號，沒有期限。合約結束多年後帳號還能用，而且不知道有多少人知道密碼。','廠商人員不在公司的人事系統裡，他們的到職和離職公司不會知道。他們又常常擁有很高的權限。所以需要另外的機制：設定期限讓帳號預設會失效，個人帳號和監控讓行為可以追查。','廠商帳號：專人專用、設有期限、行為有監控。',['c',[['專人專用','每人一個帳號'],['設有期限','到期自動失效'],['行為監控','連線有紀錄']]]],
['權限模型',['以屬性為基礎的存取控制（ABAC）是依多種條件動態判斷的。','例如使用者的部門、資料的分類、存取的時間。','它的彈性高，但也比較難管理和稽核。常見的做法是以 RBAC 為主，少數情境用屬性來補充。'],'規則是「醫療部門的人員，可以在上班時間存取分類為內部的文件」。這用屬性來描述很自然，用角色則需要建立很多個角色。','全面改用 ABAC。規則愈來愈多、彼此互相影響，沒有人能回答「這個人到底能存取什麼」。','RBAC 的問題是條件一多，角色的數量就會暴增。ABAC 直接用條件來表達。代價是權限不再是一份可以列出來的清單，而是即時計算的結果，要檢視和稽核就困難得多。','ABAC 依多種條件動態判斷；彈性高、難稽核；通常搭配 RBAC。',['c',[['RBAC','簡單、好稽核｜條件多時角色暴增'],['ABAC','彈性高｜難管理和稽核'],['常見做法','RBAC 為主｜ABAC 補充','a']]]]]};
LEARN.virt={0:[
['虛擬化基礎',['Hypervisor 是在實體主機上建立並管理多台虛擬機的軟體。','它把實體的 CPU、記憶體、磁碟分配給各台虛擬機，並讓它們彼此隔離。','虛擬化最主要的好處是一台實體主機可以執行多個系統，資源的利用率高、調度有彈性。'],'原本十台各只用到一成資源的實體伺服器，整併成兩台主機上的十台虛擬機。硬體、電力和空間都省了，建立新系統也從幾週變成幾分鐘。','認為虛擬化之後就不用管理硬體了。多了 Hypervisor 這一層要管理和更新，而且一台主機故障影響的系統變多了。','大部分的伺服器平常只用到很少的資源，但每一台都要完整的硬體。虛擬化讓多個系統共用同一套硬體，把閒置的資源利用起來。系統變成一組檔案，所以可以複製、搬移、快速建立。','Hypervisor 把一台主機分給多台虛擬機，並讓它們互相隔離。',['f',['實體主機','Hypervisor','虛擬機甲｜虛擬機乙｜虛擬機丙'],null,['','a','']]],
['範本',['虛擬機的範本是一個預先做好的標準版本。','作業系統、更新、基本的設定都已經完成。','用它建立新的虛擬機，幾分鐘就能上線，而且每一台都一致。'],'需要一台新的伺服器。從範本部署，五分鐘後就有一台已經安裝好系統、裝完更新、套好安全設定的虛擬機。','範本做好之後就不再更新。半年後從它部署的新虛擬機，一上線就缺了半年的修補。','每次從頭安裝既花時間，也很難保證每一台的設定相同。範本把這些工作做一次並保存下來。它需要定期更新，否則它的內容會愈來愈舊。','範本：快速建立設定一致的虛擬機；範本本身要定期更新。',['f',['做好標準的｜虛擬機','存成範本','從範本部署','幾分鐘上線｜每台一致'],null,['','a','','']]],
['資源配置',['分配給所有虛擬機的虛擬 CPU 總數，可以超過主機實體的核心數。','這叫超額配置，是虛擬化的常態。','因為虛擬機不會同時全部用滿。但超得太多，虛擬機會互相等待。'],'16 個核心的主機上配置了總共 40 個虛擬 CPU。平常運作正常，因為每台虛擬機大部分的時間都只用到一小部分。','看到虛擬機慢就給它更多的虛擬 CPU。主機整體的競爭變得更嚴重，所有的虛擬機都變得更慢。','CPU 是輪流使用的資源，一台虛擬機沒有在用的時候可以給別人用。超額配置利用的就是「大家不會同時用滿」。合適的比例取決於這些系統實際的負載型態。','CPU 可以超額配置，但超太多會互相等待。',['c',[['適度超額','虛擬機不會｜同時用滿'],['超額太多','互相等待｜每台都變慢','w']]]],
['容器',['容器和虛擬機最主要的差別，是容器共用主機的作業系統核心。','虛擬機各自有一套完整的作業系統。','容器只包含應用程式和它需要的東西，所以啟動快、佔用的資源少。'],'一台主機上跑十台虛擬機，每台都要載入自己的作業系統；同樣的主機可以跑上百個容器，啟動只要幾秒。','把容器當成比較輕的虛擬機，期待它有同等的隔離。容器共用核心，隔離的強度比虛擬機弱。','虛擬機模擬的是一台完整的電腦，所以每一台都要有自己的作業系統。容器只隔離出一個獨立的執行環境，底下的核心是共用的。省掉了重複的作業系統，換來的是輕量和速度。','容器共用主機的核心，所以輕、快，但隔離較弱。',['c',[['虛擬機','各有完整的作業系統｜隔離較強'],['容器','共用主機的核心｜輕量、啟動快']]]],
['虛擬網路',['虛擬交換器是在主機裡扮演交換器的角色。','它讓虛擬機之間，以及虛擬機和實體網路之間能夠連線。','VLAN 的設定在這一層也要對得上。'],'虛擬機設定在 VLAN 20，但虛擬交換器的那個連接埠群組沒有設定 VLAN 20，或是實體交換器的 trunk 沒有放行，虛擬機就連不上網路。','排查虛擬機的網路問題時只檢查實體交換器，忘了主機裡還有一層虛擬交換器。','虛擬機沒有實體的網路卡，它的網路卡是接在主機裡的虛擬交換器上，再由主機的實體網路卡連到外面。所以虛擬機的網路設定有三個地方要一致：虛擬機本身、虛擬交換器、實體交換器。','虛擬交換器連接虛擬機和實體網路；VLAN 三層都要對上。',['f',['虛擬機','虛擬交換器','主機的｜實體網路卡','實體交換器'],'VLAN 設定每一層都要對得上',['','a','','']]],
['虛擬磁碟',['精簡配置是宣告的容量很大，但實際使用多少才佔用多少。','好處是節省空間。','風險是所有虛擬機宣告的容量加起來，可能超過底層儲存實際的容量。'],'十台虛擬機各宣告 500 GB，但實際各只用了 100 GB，所以只佔用 1 TB。底層儲存只有 3 TB，如果大家都用滿就不夠了。','只看每台虛擬機裡面還有多少空間，沒有監控底層儲存的剩餘空間。','大部分的虛擬機不會用到宣告的全部容量，預先把空間全部保留下來是浪費。精簡配置把空間留到真的需要時才分配。這等於對儲存空間做了超額配置，所以必須看管實際的用量。','精簡配置省空間，但要監控底層儲存的實際剩餘。',['c',[['宣告的容量','可以很大'],['實際佔用','用多少佔多少'],['風險','加總超過實際容量','w']]]],
['客體工具',['客體工具是安裝在虛擬機裡面、由虛擬化平台提供的軟體。','它讓虛擬機和平台配合得更好：正常關機、時間同步、最佳化的驅動程式。','沒有安裝的話，效能比較差，備份時也無法通知系統先把資料寫入磁碟。'],'平台要關閉一台虛擬機。有客體工具時，它會通知作業系統正常關機；沒有的話，只能像拔掉電源一樣強制關閉。','覺得虛擬機能開機就好，不安裝客體工具，或是安裝之後從不更新。','平台和虛擬機裡的作業系統本來是互相不知道對方的。客體工具是兩者之間的溝通管道，讓平台可以請作業系統配合一些動作，也讓作業系統使用為虛擬環境設計的驅動程式。','客體工具讓虛擬機和平台能配合：正常關機、校時、一致性備份。',['c',[['有安裝','正常關機｜時間同步｜較好的效能'],['沒有安裝','只能強制關閉｜備份可能不一致','w']]]]],
1:[
['效能',['虛擬機的 CPU 使用率不高卻很慢，要看它「等待 CPU 的時間」。','這個數字高，表示主機上的虛擬 CPU 配置過多，大家在排隊。','解法是減少超額配置，或是把部分虛擬機移到別台主機。'],'虛擬機裡看 CPU 只用了 30%，但反應很慢。平台顯示它有 15% 的時間在等待 CPU。把兩台負載高的虛擬機移到別台主機之後恢復正常。','看到慢就給這台虛擬機更多的虛擬 CPU。它需要更多的實體核心同時有空才能執行，等待的時間反而變得更長。','虛擬機要執行時，需要主機上有空閒的實體核心。主機上的虛擬 CPU 太多時，每一台都要排隊。從虛擬機內部看不到這個等待，只會覺得慢，要從平台的角度才看得到。','CPU 不高卻很慢：看「等待 CPU 的時間」，是主機超額太多。',['c',[['虛擬機內看到的','CPU 使用率不高'],['平台看到的','等待 CPU 的時間很長','w'],['解法','減少超額配置｜或移走部分虛擬機']]]],
['高可用',['叢集的高可用功能是在主機故障時，把上面的虛擬機在其他主機上重新開機。','所以中間會中斷一小段時間，不是零中斷。','它需要共用儲存，其他主機才讀得到同一份虛擬機檔案。'],'一台主機突然故障。兩分鐘後，上面的虛擬機在其他主機上重新開機完成，服務恢復。','以為有高可用就不會中斷。虛擬機是被重新啟動的，記憶體中的內容會遺失，應用程式要能承受突然的重啟。','主機故障時，上面虛擬機的記憶體狀態跟著消失，沒有辦法在別台「接續」執行，只能重新開機。而要在別台開機，那台必須能讀到虛擬機的磁碟檔案，所以檔案要放在所有主機都連得到的共用儲存上。','HA 是在別台重啟，會短暫中斷；需要共用儲存。',['f',['主機故障','其他主機｜讀取共用儲存','重新開機｜虛擬機','服務恢復'],'中間會中斷一小段時間',['w','','a','']]],
['資源調度',['叢集的自動資源調度，是依各主機的負載，把虛擬機在主機之間移動。','目的是讓資源的使用比較平均。','管理者不需要手動調整。'],'某台主機的負載升高，調度功能自動把兩台虛擬機線上移轉到比較空閒的主機。','完全交給它而沒有設定任何規則。它可能把互為備援的兩台虛擬機排到同一台主機上。','虛擬機的負載隨時間變化，人工持續調整既不即時也不實際。調度功能持續量測並自動平衡。但它只看資源的使用，不了解系統之間的關係，這些要由管理者用規則告訴它。','自動調度平衡負載；規則要自己設。',['f',['持續量測｜各主機負載','負載不平均','自動線上移轉｜虛擬機','負載平均'],null,['','w','a','']]],
['儲存',['使用精簡配置的儲存空間被用滿時，虛擬機會寫不進去。','虛擬機可能被暫停，資料可能損毀。','而且會同時影響這套儲存上的很多台虛擬機。'],'底層儲存用到 100%，上面三十台虛擬機同時被暫停。清出空間之後才能逐一恢復。','虛擬機裡面顯示還有很多空間，所以沒有人注意到底層快滿了。','虛擬機以為自己擁有宣告的全部容量，會照常寫入。當底層實際上已經沒有空間可以分配時，這次寫入就無法完成。對虛擬機來說，這就像磁碟突然故障。','精簡配置的儲存滿了，上面的虛擬機會一起出事；要設容量告警。',['f',['底層儲存｜持續被使用','沒有告警','空間用完','多台虛擬機｜暫停或損毀'],'要設容量告警並預留空間',['','w','w','w']]],
['放置規則',['兩台互為備援的虛擬機，不能放在同一台實體主機上。','要設定規則讓它們分開，稱為反親和性規則。','否則主機一故障，兩台一起停擺。'],'兩台網域控制站都是虛擬機。設定反親和性規則之後，平台不論怎麼調度，都不會把它們放在同一台主機。','做了應用層的備援，卻沒有注意兩台虛擬機其實在同一台主機上。主機故障時備援完全沒有作用。','虛擬化之後，「兩台伺服器」不再保證是兩台獨立的硬體。自動調度還可能在你不知道的時候把它們搬到一起。備援的前提是兩者不會同時失效，這要用規則明確地告訴平台。','互為備援的虛擬機要設反親和性，不放同一台主機。',['c',[['放同一台主機','主機故障｜兩台一起倒','w'],['反親和性規則','強制分開在｜不同主機','a']]]],
['容器',['容器是可以隨時丟棄和重建的。','要更新程式的版本，正確的做法是建立一個新版本的映像檔，用它重新部署。','不要進到執行中的容器裡修改。'],'程式改版時，建置流程產生新版本的映像檔並給它一個版本編號，再用它替換掉舊的容器。要退版時，改回前一個版本的映像檔即可。','登入執行中的容器手動更新程式。容器一重啟，修改就消失了；而且沒有人知道這個容器和映像檔有什麼不同。','容器的設計理念是「映像檔定義了一切」。同一個映像檔在任何地方啟動都得到相同的結果。直接修改執行中的容器會破壞這個前提。所有的變更都進映像檔，環境才能重現、才能退版。','容器要更新就建新映像檔重新部署，不要進去手改。',['c',[['進容器手動修改','重啟就消失｜無法重現','w'],['建新映像檔｜重新部署','可重現｜可退版','a']]]],
['治理',['虛擬機很容易建立，時間久了會出現一堆沒有人知道用途的機器，叫做虛擬機蔓延。','這些機器佔用資源、沒有更新，是資安的破口。','預防的方式是建立時就登記負責人和用途，設定到期日，並定期清查。'],'每台虛擬機建立時必須填寫負責人、用途和到期日。到期前通知負責人，沒有回應就關機，一個月後刪除。','建立虛擬機不需要任何登記。三年後平台上有四百台虛擬機，其中一百台沒有人知道是誰的、能不能關。','實體伺服器要採購、要安裝，數量自然受到限制。虛擬機點幾下就有了，而且關掉它沒有人會主動去做。沒有負責人的機器不會被更新，也沒有人會注意它有沒有被入侵。','虛擬機要登記負責人和用途、設到期日、定期清查。',['f',['建立時登記｜負責人和用途','設定到期日','到期前通知','無人認領｜就回收'],null,['a','','','']]]],
2:[
['效能',['配置了很多 CPU 和記憶體的大型虛擬機，效能可能不如預期。','這和實體主機的 NUMA 架構有關：虛擬機的資源橫跨了多個節點。','跨節點存取記憶體比較慢。大型虛擬機的規格要配合主機的實體配置。'],'主機有兩顆處理器，每顆 16 核心。一台 24 核心的虛擬機會跨兩顆處理器；改成 16 核心，剛好在一顆之內，效能反而比較好。','認為給虛擬機愈多的 CPU 和記憶體就愈快。超過單一節點的範圍之後，可能得到反效果。','多處理器的主機裡，每顆處理器有自己鄰近的記憶體，存取它很快；存取另一顆處理器那邊的記憶體就比較慢。虛擬機如果大到必須同時使用兩邊的資源，就會經常發生比較慢的跨節點存取。','大型虛擬機的規格要配合主機的 NUMA 配置。',['c',[['在單一節點內','存取鄰近記憶體｜快','a'],['橫跨多個節點','跨節點存取｜較慢','w']]]],
['排錯',['虛擬機說磁碟很慢，延遲可能出在好幾層。','要依序檢查：虛擬機內部、主機、儲存網路、儲存設備。','逐層比較延遲的數字，才知道卡在哪裡。'],'虛擬機內看到磁碟延遲 80 毫秒。主機端看到的延遲也是 80 毫秒，儲存設備本身回報的卻只有 3 毫秒。問題在主機和儲存設備之間的網路。','直接認定是儲存設備太慢而要求升級。真正的原因可能在任何一層。','一次磁碟讀寫要經過很多層才到達實體的磁碟，每一層都可能增加延遲。每一層都有自己量到的延遲數字，把它們放在一起比較，數字突然變大的地方就是問題所在。','磁碟慢要逐層看延遲：虛擬機、主機、儲存網路、儲存設備。',['f',['虛擬機內部','主機','儲存網路','儲存設備'],'比較每一層的延遲，找出在哪一層變大']],
['容量',['叢集要能容忍一台主機故障，平常就要保留一台的餘裕。','八台主機的叢集，資源使用率要控制在大約八分之七以下。','升級和維護時也會用到這個空間。'],'八台主機平常用到 85%。一台故障時，剩下的七台正好接得下所有的虛擬機。','為了充分利用硬體把叢集用到 95%。一台主機故障時，有些虛擬機沒有地方可以重新啟動。','高可用的機制是把故障主機上的虛擬機搬到其他主機，這需要其他主機有足夠的空間。沒有預留這個空間，高可用就只是名義上的。同樣的空間也是滾動升級時讓一台主機離線所需要的。','要容忍一台故障，平常就要留一台的餘裕。',['c',[['留有餘裕','一台故障｜其他接得下來','a'],['用到快滿','一台故障｜有些虛擬機起不來','w']]]],
['安全',['虛擬化管理平台的安全等級要定為最高。','取得它的控制權，就等於取得上面所有的系統：可以複製磁碟、開啟主控台、關機。','Hypervisor 本身的安全性更新也特別重要，它的漏洞可能讓攻擊者從一台虛擬機跳到主機或其他虛擬機。'],'管理平台只能從管理專用的網段連線，登入要多因素驗證，操作都有紀錄。Hypervisor 的安全性更新列為優先處理。','管理平台放在一般的網段，使用網域帳號登入。網域被入侵之後，攻擊者登入管理平台，一次加密了所有虛擬機。','虛擬機內部的所有安全措施，對管理平台來說都不存在。它可以從外面直接讀取虛擬機的磁碟和記憶體。而虛擬機之間的隔離完全依靠 Hypervisor，它的漏洞影響的是整台主機上的所有系統。','管理平台是最高等級的資產；Hypervisor 的更新要優先。',['c',[['管理平台','拿到它｜等於拿到所有系統','w'],['Hypervisor 漏洞','可能從虛擬機｜跳到主機','w'],['做法','獨立管理網段｜MFA、優先更新','a']]]],
['容器編排',['在容器編排平台上，容器隨時可能被重建。','容器重建之後，裡面的檔案就不見了。','所以要保留的資料必須放在容器之外的持久儲存上。'],'資料庫以容器執行，資料檔放在掛載的持久儲存上。容器被重建到另一個節點，掛上同一份儲存，資料都還在。','把上傳的檔案存在容器自己的檔案系統裡。容器因為更新而被重建，使用者上傳的檔案全部消失。','編排平台會因為更新、節點故障、資源調度等原因，隨時把容器停掉並在別處重新建立。新的容器是從映像檔重新開始的。這種設計要求把「程式」和「資料」分開。','容器會被重建；要留的資料放在外部的持久儲存。',['c',[['存在容器裡','重建就消失','w'],['外部持久儲存','容器重建｜資料還在','a']]]],
['備份',['應用程式一致性的備份，是在備份之前先通知應用程式把記憶體中的資料寫入磁碟。','只做磁碟快照的話，資料庫可能有寫到一半的資料。','這需要虛擬機裡的客體工具配合。'],'備份資料庫的虛擬機時，備份軟體透過客體工具通知資料庫暫停寫入並把資料寫入磁碟，再建立快照，然後恢復。','只對虛擬機做快照式的備份，沒有確認應用程式的一致性。還原之後資料庫要做修復，甚至無法啟動。','應用程式為了效能，會把一部分資料暫時放在記憶體裡。備份的那一刻，磁碟上的內容可能是不完整的。先請應用程式把手上的東西寫完，磁碟上的狀態才是完整的。','資料庫的備份要做應用程式一致性，需要客體工具配合。',['f',['通知應用程式','把記憶體資料｜寫入磁碟','建立快照｜並備份','恢復運作'],null,['a','','','']]],
['授權',['虛擬化和資料庫這類軟體，常常依實體核心數或主機數來計費。','所以虛擬機可以在哪些主機上執行，會直接影響授權的成本。','把需要昂貴授權的系統集中在少數主機上，是常見的設計考量。'],'資料庫軟體依主機的實體核心數計費。把所有資料庫的虛擬機限制在兩台專用的主機上，只需要為這兩台購買授權。','讓資料庫的虛擬機可以在整個叢集的十台主機之間自由移動。依授權條款，十台主機全部都要購買授權。','很多軟體的授權看的是「這個軟體可能在哪些硬體上執行」，而不是實際用了多少。虛擬機可以移動到的每一台主機都可能被計入。搬移或擴充叢集之前，要先確認授權的條款。','授權常依實體核心或主機數計費；昂貴的系統集中在少數主機。',['c',[['可在整個叢集移動','可能每台主機｜都要授權','w'],['限制在少數主機','只需要這幾台｜的授權','a']]]]],
3:[
['平台策略',['評估要不要更換虛擬化平台時，授權費用只是成本的一部分。','最不能忽略的是遷移的人力和風險。','以及周邊工具和人員技能的重建：備份、監控、自動化腳本、人員的經驗都綁在現有的平台上。'],'評估報告除了比較授權費，還列出：遷移三百台虛擬機需要的人力和時程、備份和監控工具要更換或重新設定、人員需要的訓練、遷移期間的風險。','只比較兩個平台的授權報價就做決定。實際遷移時才發現周邊的成本比省下的授權費還高。','平台本身是可以替換的，但多年來圍繞著它建立的東西很難替換：整合的工具、寫好的腳本、團隊的處理經驗、已經摸熟的問題。這些才是真正把組織鎖定在一個平台上的東西。','換平台的成本不只授權費：遷移、周邊工具、人員技能。',['c',[['授權費用','看得到的成本'],['遷移的人力｜和風險','常被低估','w'],['周邊工具和技能','要重新建立','w']]]],
['架構選型',['超融合架構（HCI）是把運算和儲存整合在同一批節點裡。','好處是部署和擴充都簡單。','代價是運算和儲存要一起擴充：只缺儲存不缺運算時，還是得買整個節點。'],'公司的資料量成長很快但運算需求平穩。使用超融合架構的話，為了增加儲存空間必須不斷購買包含運算能力的節點。','因為超融合是比較新的架構就採用，沒有評估自己運算和儲存的成長是不是同步。','傳統架構中伺服器和儲存設備是分開的，可以各自擴充，但要整合和管理兩種設備。超融合用標準化的節點簡化了這件事。適不適合，要看兩種資源的需求是否大致等比例地成長。','超融合：簡單，但運算和儲存要一起擴。',['c',[['超融合','部署、擴充簡單｜兩者要一起擴'],['伺服器＋獨立儲存','可以分別擴充｜整合較複雜']]]],
['多站架構',['把一個叢集延伸到兩個機房，兩地之間的線路中斷時，兩邊都會以為對方故障了。','要避免兩邊同時運作，需要位於第三地的見證機制。','沒有見證，兩邊會各自啟動同一批虛擬機，資料就分岔了。'],'兩個機房之間的線路被挖斷。連得到第三地見證的那個機房繼續運作，另一個機房的虛擬機自動停止。','只有兩個機房而沒有第三地的見證。線路中斷時，兩邊各自把所有虛擬機都啟動起來，同一個系統有兩份在運作並各自接受寫入。','兩個機房無法分辨是對方故障還是之間的線路斷了。要保證只有一邊運作，需要一個第三方來做裁決，而且這個第三方不能和任何一邊有共同的故障原因，所以要在第三個地點。','跨機房的叢集要有第三地的見證。',['f',['機房甲','第三地｜見證','機房乙'],'線路中斷時，連得到見證的那一邊繼續運作',['','a','']]],
['容量規劃',['做多年期的平台容量規劃，只看過去的使用趨勢是不夠的。','還要納入業務的計畫。','例如新系統上線、併購、既有系統的汰換。'],'過去三年每年成長 10%。但明年有一個大型的新系統要上線，它需要的資源相當於現有平台的三成。規劃時把它一起算進去。','把過去的趨勢線直接往後延伸。新專案提出需求時才發現容量不夠，採購要等好幾個月。','趨勢反映的是既有系統的自然成長。真正造成容量大幅變動的，是業務上的決定。這些資訊不在監控數據裡，要主動去向業務和專案單位了解。','容量規劃除了趨勢，還要納入業務計畫。',['c',[['過去的趨勢','既有系統的｜自然成長'],['業務計畫','新系統、併購｜汰換','a']]]],
['技術選型',['新的應用要執行在虛擬機、容器還是無伺服器服務上，要看應用的特性和團隊的維運能力。','狀態多、難以修改的舊系統適合虛擬機。','無狀態、經常更新的適合容器；零星觸發的適合無伺服器。'],'一套十年的套裝軟體繼續放在虛擬機；新開發的網站服務用容器；每天只執行幾次的檔案處理用無伺服器。','因為容器是趨勢，就把所有系統都搬上去。舊系統不是為這種環境設計的，硬搬上去反而更難維運。','每一種方式是為不同型態的工作設計的。虛擬機提供和實體主機最相近的環境；容器要求應用可以隨時被重建；無伺服器適合短暫、獨立的工作。另外，團隊有沒有能力維運也是決定因素。','虛擬機、容器、無伺服器：看應用特性和團隊能力。',['c',[['虛擬機','狀態多、難改的｜舊系統'],['容器','無狀態｜常更新'],['無伺服器','零星觸發的工作']]]],
['升級策略',['規劃虛擬化平台的大版本升級時，最先要確認的是相容性。','硬體、備份軟體、監控工具等周邊，和新版本是不是相容。','要先核對相容矩陣。'],'升級前逐一確認：伺服器的型號和韌體在新版本的支援清單上、備份軟體目前的版本支援新平台、監控和自動化工具都有對應的版本。','平台升級完成後才發現備份軟體還不支援新版本。在備份軟體更新之前，所有虛擬機都沒有備份。','平台是很多工具共同依賴的基礎。它的版本改變時，每一個依賴它的工具都要能配合。這些工具的支援時程各不相同。升級的順序和時間，往往是由最慢支援的那一個周邊決定的。','平台升級前先對相容矩陣：硬體、備份、監控。',['f',['確認硬體｜相容','確認備份軟體｜相容','確認監控和｜自動化工具','再排升級'],null,['a','a','a','']]],
['多租戶',['同一個平台要服務好幾個部門或客戶，彼此不能互相影響，要隔離四個面向。','運算資源、網路、儲存、管理權限。','任何一個沒有隔離，就會互相影響。'],'每個部門有自己的資源配額、獨立的網段、獨立的儲存空間，管理者只看得到也只能操作自己部門的虛擬機。','只做了管理權限的區分。某個部門的虛擬機把主機的資源吃滿，其他部門的系統全部變慢。','共用平台的好處是資源可以共享，風險也來自共享。資源沒有限制，一個租戶可以拖垮別人；網路沒有隔離，租戶之間可以互相連線；管理權限沒有分開，一個租戶可以操作別人的系統。','多租戶要隔離：運算、網路、儲存、管理權限。',['c',[['運算資源','配額和上限'],['網路','各自獨立'],['儲存','各自獨立'],['管理權限','只能管自己的']]]],
['治理',['開放各單位自助申請虛擬機之後，速度變快了，浪費也會跟著來。','需要搭配三個機制：配額、到期回收、成本可視。','沒有上限和回收，資源很快就被佔滿。'],'每個部門有資源配額；每台虛擬機有到期日，到期要展延否則回收；每月公布各部門使用的資源和對應的成本。','只開放自助而沒有任何限制。半年內平台的資源被用完，其中很多是測試完沒有刪除的機器。','自助服務移除了申請的阻力，這是它的價值。但阻力同時也是一種節制。把節制的責任交還給使用者：讓他們有上限、看得到成本，並且預設資源是會被回收的。','自助申請要搭配：配額、到期回收、成本可視。',['c',[['配額','每個單位的上限'],['到期回收','不展延就收回'],['成本可視','知道自己用了多少']]]]]};
LEARN.bcdr={0:[
['備份觀念',['備份是為了出事時可以還原；封存是為了長期保存不常使用的資料。','備份會輪替覆蓋，重點是還原得回來。','會自動同步的雲端硬碟不算備份：刪除或被加密，也會同步過去。'],'檔案被勒索軟體加密。同步的雲端硬碟上的檔案也變成加密後的版本。只有獨立的備份可以回到加密之前的時間點。','「我的檔案都有同步到雲端，所以有備份」。同步讓各處保持一致，錯誤的狀態也一樣會被同步。','備份的本質是保留「過去某個時間點」的資料。同步和複寫保留的是「現在」的資料，只是放在不同的地方。資料被誤刪或被破壞時，需要的是過去的版本。','備份要能回到過去的時間點；同步不是備份。',['c',[['備份','保留過去的時間點｜可以還原','a'],['同步','各處保持一致｜錯的也一起同步','w'],['封存','長期保存｜不常用的資料']]]],
['復原目標',['RPO（復原點目標）問的是：出事時最多可以接受遺失多久的資料。','RTO（復原時間目標）問的是：出事之後多久之內要恢復服務。','RPO 決定備份的頻率，RTO 決定備援要做到什麼程度。'],'RPO 一小時：至少每小時要有一份可用的資料副本。RTO 四小時：要有辦法在四小時內把服務恢復。','把兩者混在一起，或是由資訊單位自己訂。這兩個數字應該由業務單位依可以承受的損失來決定。','中斷造成兩種不同的損失：遺失的資料，和停擺的時間。兩者的解法不同、成本也不同，所以要分開定義。數字愈小，需要的投資愈大。','RPO：最多丟多久的資料；RTO：多久內要恢復。',['c',[['RPO','最多遺失多久的資料｜決定備份頻率'],['RTO','多久內恢復服務｜決定備援程度']]]],
['異地備份',['備份要有一份放在異地。','同一個地點發生火災、水災或竊盜時，還有一份在別的地方。','主機和備份放在同一間機房，一場災害就一起沒了。'],'每天的備份除了存在機房的備份設備上，另外複製一份到另一個城市的資料中心。','備份設備就放在伺服器的旁邊。機房失火時，正式的資料和備份同時毀損。','備份是為了在原本的資料不見時可以救回來。如果造成資料不見的事件，同時也會影響備份，這份備份就沒有發揮作用。火災、淹水、地震、竊盜都是以「地點」為單位的。','備份要有一份在異地。',['c',[['同一個機房','一場災害｜一起沒了','w'],['異地','主機房出事｜還有一份','a']]]],
['備份監控',['備份的結果通知一定要有人看。','備份失敗了沒有人處理，等到需要還原時才會發現沒有備份。','失敗要有人追蹤、要有紀錄。'],'每天早上值班人員檢視備份的結果，失敗的項目當天就要處理並記錄原因。','通知信每天都寄，但寄到一個沒有人看的信箱。備份已經失敗了三個星期，直到硬碟故障才被發現。','備份失敗不會造成任何立即的影響，系統照常運作，沒有人會抱怨。這讓它很容易被忽略。而它的後果要等到最需要它的那一刻才會顯現，那時候已經無法補救。','備份結果每天要有人看，失敗要追。',['f',['備份執行','產生結果通知','有人檢視','失敗就處理｜並記錄'],null,['','','a','']]],
['還原測試',['要確認備份真的可以用，唯一可靠的方法是實際還原一次。','沒有還原過的備份只是一個檔案。','還原測試同時也讓人熟悉步驟，知道需要多久。'],'每季挑選幾個系統，把備份還原到測試環境，確認系統可以啟動、資料正確，並記錄花費的時間。','看到備份「成功」的訊息就放心。真正需要時才發現備份檔損壞、少備了東西，或是沒有人知道怎麼還原。','備份成功只代表備份軟體完成了它的工作，不代表備份的內容足以重建系統。備份的範圍不完整、資料不一致、缺少金鑰，這些問題從備份的結果看不出來。','沒還原過的備份不算數。',['c',[['備份成功','只是有一個檔案','off'],['實際還原成功','才是真的有備份','a']]]],
['保留期限',['備份的保留期限，是每一份備份要保留多久才可以刪除。','留得太短，發現問題時已經沒有夠早的版本。','留得太長，空間和成本會失控。也要對照法規的要求。'],'資料在兩個月前被悄悄改壞，現在才發現。如果備份只保留三十天，所有的備份裡都是已經壞掉的資料。','只保留最近幾天的備份，認為「最新的最重要」。很多問題是過了很久才被發現的。','問題發生和被發現之間常常有時間差：資料被誤改、攻擊者潛伏、程式的錯誤逐漸累積。保留期限要比「可能多久之後才會發現」更長。','保留期限要比「問題多久才會被發現」更長。',['c',[['留太短','發現問題時｜沒有夠早的版本','w'],['留太長','空間和成本失控','w'],['還要考慮','法規的保存要求']]]]],
1:[
['備份原則',['3-2-1-1-0 是 3-2-1 原則的延伸。','多出來的 1 是一份離線或不可變的備份。','0 是還原驗證零錯誤。'],'三份資料、兩種媒體、一份異地；另外有一份不可變的備份；每一份備份都經過自動驗證，確認可以還原。','認為做到 3-2-1 就足夠了。勒索軟體會刻意尋找並破壞連線中的備份。','原本的 3-2-1 是針對硬體故障和災害設計的。勒索軟體是有意圖的對手，會主動去刪除或加密備份，所以需要一份他們碰不到的。另外，沒有驗證過的備份等於沒有。','3-2-1-1-0：多一份離線或不可變的，還原驗證零錯誤。',['c',[['3-2-1','三份、兩種媒體｜一份異地'],['多的 1','一份離線｜或不可變的','a'],['0','還原驗證｜零錯誤','a']]]],
['輪替',['祖父-父-子的備份輪替，是每日、每週、每月的備份各保留不同的數量。','近期的備份留得密，久遠的留得疏。','在可以還原的時間範圍和儲存成本之間取得平衡。'],'保留最近七天的每日備份、最近四週的每週備份、最近十二個月的每月備份。總共二十三份，就能回到一年內的各個時間點。','每天的備份都保留一年，共三百六十五份，儲存成本很高；或是只保留最近七天，無法回到更早的時間。','愈近期的資料，愈需要精確地回到某一天；愈久遠的資料，通常只需要「大約那個月」的版本。依這個需求分配保留的密度，可以用很少的份數涵蓋很長的時間。','近期留得密、久遠留得疏。',['c',[['每日備份','保留最近幾天'],['每週備份','保留最近幾週'],['每月備份','保留最近幾個月']]]],
['備份視窗',['備份視窗是可以用來執行備份的時間，通常是夜間。','資料量愈來愈大，完整備份無法在夜間完成時，要減少每次需要搬的資料量。','常見的調整是平日做增量、週末做完整，或採用永久增量。'],'完整備份需要十四小時，夜間只有八小時。改成週六做完整備份，其他天做增量，每天只需要一小時。','讓完整備份跑到白天，和上班時間的業務搶資源；或是因為跑不完就減少備份的範圍。','每天變動的資料只佔全部的一小部分。完整備份每次都搬所有的資料，時間隨資料量成長；增量只搬變動的部分，時間和資料總量無關。','備份跑不完：平日增量、週末完整。',['c',[['每天完整備份','時間隨資料量成長','w'],['平日增量｜週末完整','每天只搬變動的部分','a']]]],
['備份安全',['備份伺服器不要加入正式的網域。','要使用獨立的管理帳號。','這樣網域被入侵時，攻擊者不會順便取得備份系統的控制權。'],'備份伺服器是獨立的，管理帳號和網域無關，並有多因素驗證。攻擊者取得網域管理員之後，仍然無法登入備份系統。','為了管理方便把備份伺服器加入網域，用網域管理員帳號管理。網域被拿下，備份跟著被刪除。','勒索軟體集團的標準做法是先取得網域的最高權限，再用它找到並破壞備份，最後才加密。備份系統如果信任同一套帳號體系，網域失守就等於備份失守。','備份系統和正式網域分開，用獨立的帳號。',['c',[['加入正式網域','網域被拿下｜備份跟著沒了','w'],['獨立的帳號體系','網域失守｜備份還在','a']]]],
['一致性',['當機一致性的備份，還原之後的狀態像是主機突然斷電後重新開機。','磁碟上的資料是一致的，但記憶體中還沒有寫入的就沒有了。','資料庫通常要做應用程式一致性的備份。'],'一般的檔案伺服器用當機一致性的備份就夠了；資料庫則要用應用程式一致性的方式，還原後才不需要修復。','所有系統都用同一種方式備份，沒有區分。資料庫還原後要花很長的時間修復，或是遺失了最後的交易。','應用程式會把資料暫存在記憶體裡。當機一致性不處理這一部分，所以還原後的系統要像斷電重開一樣自己復原。大部分的系統可以承受，但資料庫這類系統最好讓它先把資料寫完再備份。','當機一致性像斷電重開；資料庫要做應用程式一致性。',['c',[['當機一致性','像突然斷電後重開｜一般系統夠用'],['應用程式一致性','先把資料寫入磁碟｜資料庫需要','a']]]],
['儲存效率',['重複資料刪除是相同的資料區塊只儲存一份。','每天的備份大部分內容是相同的，去重之後佔用的空間少很多。','代價是需要運算資源，而且對索引有依賴。'],'保留三十天的完整備份，原本需要三十倍的空間；啟用重複資料刪除之後，只需要大約三倍。','認為去重沒有任何缺點。記錄「哪些區塊屬於哪份備份」的索引一旦損毀，所有依賴它的備份都無法還原。','連續幾天的備份之間，只有少部分的資料不同。把備份切成小區塊並比對，相同的區塊只保存一次。所有備份都指向同一批區塊，所以這批區塊和索引的完整性非常重要。','去重：相同區塊只存一份；索引要保護好。',['c',[['好處','大幅節省空間'],['代價','需要運算資源｜索引損毀影響所有備份','w']]]],
['備份監控',['備份失敗的通知不等於有人負責處理。','流程上要讓失敗自動開立工單並指派負責人。','超過期限沒有處理要往上通報。'],'備份失敗時自動開單給該系統的負責人，要求一個工作天內處理；連續失敗三天自動通報主管。','只有通知信。某台伺服器的備份連續失敗五天，每天都有通知，但每個人都以為別人會處理。','通知只是把資訊送出去，沒有規定誰要做什麼、什麼時候要完成。備份失敗又不會有人來催。把它變成有負責人、有期限的工單，才會真的被處理。','備份失敗要開單、有負責人、有期限、逾期往上報。',['f',['備份失敗','自動開單｜指派負責人','期限內處理','逾期往上通報'],null,['w','a','','']]],
['備份範圍',['新上線的系統沒有被納入備份，是很常見的遺漏。','預防的方法是把「納入備份」列為系統上線的必要檢查項目。','並且定期拿資產清冊和備份清單比對。'],'系統上線的檢查表上有一項「已設定備份並完成一次還原測試」，沒有完成就不能上線。每季再比對一次資產清冊和備份清單。','靠負責的人記得去設定。三個月後系統故障，才發現它從來沒有被備份過。','備份的設定是系統上線之後的另一件工作，不做也不會影響上線。依靠個人的記憶一定會有遺漏。把它變成上線流程的一個關卡，再用清單比對來抓出漏網的。','「納入備份」寫進上線檢查；定期比對資產和備份清單。',['f',['上線檢查項目：｜已納入備份','定期比對：｜資產清冊','備份清單','對不上的補上'],null,['a','','','']]]],
2:[
['勒索復原',['遭到勒索軟體加密後要從備份還原，第一件要確認的是還原點是不是在攻擊者入侵之前。','攻擊者常常潛伏好幾週，還原到已經有後門的時間點，等於把他請回來。','不確定備份是否乾淨時，先還原到隔離的環境檢查，確認之後再接回正式的網路。'],'調查顯示攻擊者在三週前就已經進入。選擇四週前的備份還原到隔離的網段，掃描確認沒有後門，再把這段期間的資料另外補回。','直接還原昨天的備份並接上網路。備份裡包含攻擊者留下的後門，幾天後又被加密一次。','加密是攻擊的最後一步。在那之前攻擊者已經在環境裡活動了一段時間，留下了可以再回來的機制，而這些都被備份進去了。所以還原前要知道入侵的時間，並在安全的環境裡先驗證。','還原前先確認還原點在入侵之前；不確定就先還原到隔離環境。',['f',['確認入侵的｜時間點','選擇更早的｜還原點','還原到｜隔離環境','檢查後再｜接回正式網路'],null,['a','','a','']]],
['備援站',['異地的備援站依準備的程度分成三種。','熱備援：設備和資料都隨時就緒，可以立刻接手，成本最高。','暖備援：有設備和較舊的資料，需要一些時間。冷備援：只有場地，要花很多時間才能啟用。'],'核心交易系統的 RTO 是一小時，使用熱備援；內部的行政系統 RTO 是三天，使用冷備援並搭配備份還原。','所有系統都要求熱備援，成本無法負擔；或是全部用冷備援，關鍵系統的恢復時間遠超過業務可以承受的。','備援站準備得愈充分，恢復得愈快，平時要付出的成本也愈高。選擇哪一種要對照每個系統的 RTO：業務能等多久，就準備到那個程度。','熱、暖、冷備援：準備愈充分愈快也愈貴；依 RTO 選。',['c',[['熱備援','隨時可接手｜最貴'],['暖備援','需要一些時間'],['冷備援','只有場地｜最慢、最便宜']]]],
['切換',['服務切換到備援站運作之後，容易被忽略的是怎麼切回主站。','切回時要把在備援站運作期間產生的資料同步回主站。','切回的計畫要和切換的計畫一起準備和演練。'],'演練包含切回：服務在備援站運作四小時後，把這段期間的資料同步回主站，再把服務切回，確認兩邊資料一致。','計畫只寫到「服務在備援站恢復運作」。主站修復之後才開始想怎麼切回，結果又造成一次中斷，還遺失了一部分資料。','切換到備援站只是暫時的狀態。在備援站運作期間新的資料持續產生，主站上的資料變成舊的。切回的複雜度不亞於切換，而且常常被留到最後才想。','切過去只做了一半；切回的計畫也要先想好並演練。',['f',['切換到備援站','在備援站｜運作','資料同步｜回主站','切回主站'],null,['','','a','a']]],
['相依關係',['災難復原計畫要列出系統之間的相依關係。','用途是決定還原的先後順序。','應用程式還原了，但它依賴的服務還沒有起來，一樣不能使用。'],'計畫上的還原順序：第一階段網路和 DNS；第二階段身分驗證；第三階段資料庫；第四階段應用系統。','依業務單位認為的重要性排序。最重要的應用系統最先還原，但它啟動時找不到驗證服務和資料庫。','每個系統都依賴其他的系統才能運作。還原的順序如果違反這些相依關係，先還原的系統只能空等。把相依關係畫出來，順序就很清楚。','列出相依關係，才排得出還原順序。',['f',['網路、DNS','身分驗證','資料庫','應用系統'],'被依賴的先還原']],
['金鑰管理',['備份有加密時，解密的金鑰要另外安全地保存。','金鑰本身也要有備份。','金鑰只存在正式環境的一台伺服器上的話，那台毀損，備份就永遠打不開。'],'備份的加密金鑰除了在金鑰管理系統裡，還有一份離線保存在異地的保險櫃，並定期確認可以使用。','備份都有加密，覺得很安全。災難發生時保管金鑰的伺服器也毀了，所有的備份都變成無法讀取的資料。','加密的備份需要兩樣東西才能還原：備份檔和金鑰。大家都記得保護備份檔，卻常常忘了金鑰。金鑰如果和正式環境放在一起，會在同一場災難中消失。','備份的金鑰要另外保存，而且金鑰也要備份。',['c',[['金鑰只在正式環境','災難時一起消失｜備份打不開','w'],['金鑰另外保存','異地、離線｜定期確認可用','a']]]],
['復原時間',['復原時間要用實際量測的數字，不是填寫的數字。','要算：資料量有多大、頻寬有多少、還原的速度有多快。','很多計畫上的 RTO，實際一算根本做不到。'],'計畫上的 RTO 是四小時。但要從異地傳回 20 TB 的資料，以現有的頻寬需要三天。於是改成在異地保留可以直接啟動的複本。','計畫上的數字是當初為了符合要求而填的，沒有人實際算過或測過。','還原大量資料受到物理條件的限制：線路的頻寬、磁碟的寫入速度。這些可以事先計算。如果算出來的時間遠超過目標，就要改變做法，例如把資料預先放在復原的地點。','RTO 要實際算過、測過：資料量、頻寬、還原速度。',['f',['資料量多大','頻寬多少','還原速度多快','算出實際｜需要的時間'],'算出來做不到，就要改變做法']],
['雲端服務',['郵件和文件放在 SaaS 雲端服務上，還是需要自己備份。','業者保證的是服務可以使用。','資料被誤刪或被加密，通常是客戶自己的責任。資源回收筒的保留期限一過，業者也救不回來。'],'員工離職前刪除了大量的文件，三個月後才被發現。雲端服務的資源回收筒只保留三十天，幸好公司另外有第三方的備份。','「資料在大型雲端業者那裡，他們會備份」。業者的備份是為了他們自己的災難復原，不是為了還原個別客戶誤刪的資料。','依共同責任模型，業者負責服務和基礎設施，資料是客戶的。對業者來說，使用者刪除檔案是正常的操作，它會忠實地執行。要回到過去的時間點，需要客戶自己準備。','SaaS 上的資料也要自己備份。',['c',[['業者負責','服務可以使用'],['客戶負責','資料的誤刪｜和被加密','w']]]]],
3:[
['計畫範圍',['營運持續計畫（BCP）涵蓋的是整個業務要怎麼繼續運作。','災難復原計畫（DRP）聚焦在資訊系統的復原。','系統恢復之前，業務要怎麼用人工或替代的方式撐住，是 BCP 的範圍。'],'系統中斷期間，櫃台改用紙本表單受理，事後再補登。這個做法由業務單位訂定並演練，是 BCP 的一部分。','認為營運持續是資訊單位的事。資訊單位只能負責把系統恢復，無法決定業務在這段期間要怎麼運作。','災難影響的不只是系統，還有人員、場地、供應商。即使系統很快恢復，中間還是有一段時間業務要在沒有系統的情況下進行。這需要業務單位自己規劃。','BCP 管整個業務怎麼撐下去；DRP 管系統怎麼復原。',['c',[['BCP','整個業務｜如何繼續運作'],['DRP','資訊系統｜如何復原']],'系統恢復前怎麼撐，是業務單位要規劃的']],
['分級保護',['不是所有系統都要採用最高等級的備援。','要先做業務衝擊分析，依衝擊的程度把系統分級。','把資源放在真正關鍵的系統上。'],'業務衝擊分析把系統分成三級：第一級四小時內恢復，使用熱備援；第二級一天；第三級一週，使用備份還原。','為了保險，要求所有系統都用最高等級。成本無法負擔，最後每個系統都只做了一半，關鍵的系統反而沒有得到足夠的保護。','資源是有限的，而不同系統停擺造成的損失差距很大。業務衝擊分析的作用就是把這個差距量化，讓資源的分配有依據。','依業務衝擊分級，資源放在關鍵系統。',['f',['業務衝擊分析','依衝擊分級','關鍵系統｜高等級備援','其他系統｜較低等級'],null,['a','','','']]],
['演練',['災難復原演練要由淺到深安排。','順序是：桌上推演、部分系統的測試、完整的切換。','先在會議桌上找出流程的問題，再動到系統。'],'第一年做桌上推演，找出計畫中的缺漏並修正；第二年實際還原幾個系統到備援環境；第三年才做完整的切換。','第一次演練就做完整的切換。計畫裡有很多沒有發現的問題，演練本身造成了實際的服務中斷。','每一種演練發現的問題不同，風險也不同。桌上推演幾乎沒有風險，可以發現流程和分工的問題；實際切換風險最高，應該在前面的問題都解決之後才做。','演練由淺到深：桌上推演、部分測試、完整切換。',['f',['桌上推演','部分系統測試','完整切換'],'先在會議桌上把流程的問題找出來']],
['區域風險',['主機房和備援機房如果距離很近，或是有共同的依賴，區域性的災害會同時影響兩邊。','例如接同一個變電所、位在同一個淹水潛勢區。','備援要考慮共同的依賴。'],'主機房和備援機房相距五公里，接同一個變電所。一次區域停電，兩邊同時斷電。','只確認備援機房是「另一棟建築」，沒有檢查電力、電信線路、地理風險是不是和主機房相同。','地震、淹水、大範圍停電的影響範圍常常是幾十公里。兩個機房的距離不夠遠，或共用某一項基礎設施，就可能同時失效。但距離愈遠，資料同步的延遲愈大，要取捨。','備援機房要避開共同的依賴：電力、線路、地理風險。',['c',[['距離太近','區域災害｜同時受影響','w'],['共同的依賴','同變電所｜同電信機房','w'],['要確認','電力、線路｜地理風險都分開','a']]]],
['人員',['復原計畫不能假設關鍵的人員都能到場。','災害發生時，人也可能受到影響。','計畫要考慮人員不可用的情況：要有代理人，要有別人看得懂的文件。'],'每一個關鍵的角色都指定兩位代理人，復原步驟寫成不熟悉的人也能照著做的文件，並由代理人實際演練過。','計畫的每一步都寫著某位資深工程師的名字。災害當天他聯絡不上，沒有人知道該怎麼做。','地震、疫情、交通中斷這類事件，影響的不只是設備，還有人。人員本身也是災難復原要考慮的資源，而且是最難備援的。把知識從個人轉移到文件和其他人身上。','計畫不能假設關鍵人員都在；要有代理人和看得懂的文件。',['c',[['假設人都在','聯絡不上｜就沒人會做','w'],['代理人＋文件','換人也能執行','a']]]],
['成本取捨',['業務單位要求資料不能掉、服務不能停時，資訊單位要說明達到這個目標需要的成本。','RPO 和 RTO 愈接近零，成本上升得愈快。','讓提出需求的人看到代價，再依實際的衝擊決定合理的目標。'],'提出三個方案：RTO 一天需要的成本、RTO 四小時需要的成本、接近零中斷需要的成本。業務單位看到第三個方案的金額後，選擇了第二個。','直接答應「零中斷、零遺失」，或是直接說「做不到」。前者承諾了無法兌現的事，後者沒有幫助對方做決定。','每個人都希望系統永遠不出問題，在不知道代價的時候，這是很自然的要求。把不同等級的保護和對應的成本並列，這個要求就會變成一個可以權衡的選擇。','要求零中斷時：攤開各等級的成本，讓業務單位選。',['f',['業務單位｜要求零中斷','列出幾個等級｜和各自的成本','對照實際的｜業務衝擊','決定合理的目標'],null,['','a','','']]],
['決策',['要不要宣布啟動災難復原，要事先指定決策者和判斷的標準。','事故當下資訊不完整，又有時間壓力。','沒有事先的授權，會猶豫不決，或是各做各的。'],'計畫寫明：主要系統中斷超過兩小時且預估無法在四小時內恢復時，由資訊長宣布啟動；資訊長聯絡不上時，由指定的代理人決定。','沒有事先約定。事故發生時大家都覺得「應該再等等看」，等到決定切換時已經錯過了承諾的恢復時間。','切換到備援站本身有成本和風險，所以大家會傾向等待。但等待的每一分鐘都在消耗恢復的時間。把判斷的標準和決策的人事先定好，讓這個決定可以依規則做出。','啟動災難復原的決策者和標準要事先定好。',['c',[['決策者','誰有權宣布｜代理人是誰'],['判斷標準','中斷多久｜預估多久能恢復']]]],
['持續改善',['演練結束後，最重要的是把發現的問題更新到計畫裡。','每一項都要追蹤到改善完成。','沒有修改計畫的演練，下次會在同一個地方卡住。'],'演練後列出八項問題，例如聯絡清單過期、某個步驟缺少必要的權限。每一項都指定負責人和期限，並在下一次演練時驗證。','演練完成、寫了報告就結束。報告裡提到的問題沒有人處理，隔年的演練遇到完全一樣的狀況。','演練的目的不是證明計畫可行，而是找出它不可行的地方。這些發現如果沒有轉換成計畫的修訂，演練就只是一次活動。計畫所描述的環境也一直在改變。','演練後把問題更新進計畫，並追蹤到改善完成。',['f',['演練','列出發現的問題','指定負責人｜和期限','更新計畫｜下次驗證'],null,['','','a','']]]]};
LEARN.storage={0:[
['儲存架構',['NAS 提供的是檔案分享，像一個共用的資料夾。','SAN 提供的是區塊層級的磁碟給主機使用。','主機看到的是一顆像本機的磁碟，自己格式化之後使用。'],'部門的共用資料夾放在 NAS 上，大家用網路磁碟的方式存取；資料庫伺服器的磁碟則來自 SAN。','把兩者當成同樣的東西。NAS 是很多人同時存取同一批檔案；SAN 的磁碟通常由單一台主機（或一個叢集）使用。','兩者提供的層次不同。NAS 幫你管理檔案系統，你直接存取檔案；SAN 只給你一塊原始的儲存空間，上面要怎麼使用由主機決定。需要多人共用檔案用 NAS，需要高效能的磁碟用 SAN。','NAS 給檔案分享，SAN 給主機一顆磁碟。',['c',[['NAS','檔案分享｜像共用資料夾'],['SAN','區塊層級的磁碟｜主機自己格式化']]]],
['儲存類型',['儲存有三種類型：區塊、檔案、物件。','物件儲存容量容易擴充、成本低，適合大量不常修改的資料，例如備份檔和影音檔。','資料庫這類需要頻繁讀寫的，適合區塊儲存。'],'資料庫的資料檔放在區塊儲存上；部門的文件放在檔案儲存上；幾百 TB 的備份和監視影像放在物件儲存上。','把所有資料都放在最快也最貴的區塊儲存上。大量很少讀取的資料佔用了昂貴的空間。','三種類型對應不同的使用方式。區塊儲存像磁碟，讀寫最快；檔案儲存有目錄結構，方便多人共用；物件儲存把每個檔案當成一個獨立的物件，沒有複雜的結構，所以可以擴充到非常大。','區塊適合資料庫、檔案適合共用、物件適合大量不常改的資料。',['c',[['區塊儲存','像磁碟｜適合資料庫'],['檔案儲存','有目錄結構｜適合共用'],['物件儲存','易擴充、成本低｜適合備份、影音']]]],
['容量',['磁碟陣列的可用容量，會少於所有硬碟容量的總和。','一部分的空間要用來存放備援用的資料。','保護的等級愈高、預留的熱備援愈多，可用的容量愈少。'],'十顆 4 TB 的硬碟。做 RAID 6 並保留一顆熱備援之後，可用容量大約是 28 TB，不是 40 TB。','用硬碟的原始容量來規劃。設備到貨設定完成後才發現可以使用的空間比預期少了三成。','容錯的原理是多存一些資料，讓任何一顆硬碟的內容都可以由其他的算回來。這些額外的資料要佔空間。規劃和採購時，要用實際可用的容量來計算。','規劃用可用容量算，不是硬碟的原始容量。',['c',[['原始容量','十顆 4 TB｜＝ 40 TB'],['扣除備援資料｜和熱備援','實際可用｜明顯較少','a']]]],
['機房環境',['機房要控制溫度和濕度。過熱會讓設備故障；太乾會產生靜電，太濕會結露。','冷熱通道的配置是讓機櫃正面對正面吸入冷空氣、背面對背面排出熱空氣。','這樣冷空氣和熱空氣不會混在一起，冷卻的效率才高。'],'機櫃排成一列列，冷氣從正面的通道送入，熱空氣從背面的通道排出並被回收。空的機櫃位置裝上擋板，避免熱空氣繞回正面。','機櫃的方向不一致，有的正面對著別台的背面。前一台排出的熱空氣直接被後一台吸進去。','設備是從正面吸入空氣、從背面排出。如果排出的熱空氣又被吸入，冷氣機要用更多的電才能維持溫度。把冷的和熱的分開在不同的通道，冷氣才能有效地送到設備。','機房要控溫控濕；冷熱通道讓冷熱空氣不混在一起。',['c',[['冷通道','機櫃正面對正面｜吸入冷空氣'],['熱通道','機櫃背面對背面｜排出熱空氣'],['溫濕度','要監控和告警','a']]]],
['機櫃',['1U 是設備高度的單位，大約 4.45 公分。','標準的機櫃常見的高度是 42U。','規劃機櫃時除了高度，還要計算重量和電力。'],'一台 2U 的伺服器佔兩個單位的高度。一個 42U 的機櫃理論上可以放二十一台，但實際上受限於電力和承重，放不到這麼多。','只算高度夠不夠放。設備都裝上去之後，才發現機櫃的電力不夠，或是樓板的承重有疑慮。','機櫃有三種容量：空間、電力、承重。任何一種先用完，就不能再放設備了。現在的設備密度很高，最先用完的通常不是空間。','1U 約 4.45 公分；機櫃還要算重量和電力。',['c',[['高度','1U 約 4.45 公分｜常見 42U'],['電力','夠不夠所有設備'],['重量','機櫃和樓板｜承受得住']]]],
['消防',['機房通常不使用灑水系統，而使用氣體滅火系統。','水會損壞運作中的電子設備。','氣體滅火不導電、不留殘渣，但要注意人員的安全。'],'機房的氣體滅火系統啟動前會有警報聲和倒數，讓裡面的人有時間撤離。平常要讓會進出機房的人都知道這件事。','只在意設備的保護，沒有訓練人員。有人聽到警報不知道代表什麼，繼續留在機房裡。','滅火的方式要考慮被保護的東西。氣體是藉由降低氧氣濃度或吸收熱量來滅火，不會傷害設備。但有些氣體在滅火的濃度下對人有危險，所以一定要有預警和撤離的時間。','機房用氣體滅火；啟動前人員要能撤離。',['c',[['灑水','損壞電子設備','w'],['氣體滅火','不導電、不留殘渣｜注意人員安全','a']]]],
['電力',['UPS 除了在停電時撐一段時間，還有穩定電壓的作用。','它會濾掉突波和瞬間的電力波動。','短暫的電壓不穩比完全停電更常發生，也會造成設備重開或損壞。'],'夏天的午後，電壓瞬間下降了零點幾秒。接在 UPS 後面的伺服器完全沒有受到影響；沒有接的設備重新開機了。','認為「我們這裡很少停電，所以不需要 UPS」。造成設備故障的更常是電壓不穩，而不是停電。','市電的電壓並不是完全穩定的，會有瞬間的下降、突波和雜訊，人感覺不到，但電子設備會受影響。UPS 位在市電和設備之間，可以把這些波動隔開。','UPS 也穩定電壓，擋掉瞬間的波動。',['c',[['停電時','用電池｜撐一段時間'],['平常','穩定電壓｜濾掉突波和波動','a']]]]],
1:[
['儲存網路',['iSCSI 是透過一般的 IP 網路傳送區塊儲存資料的協定。','主機用乙太網路就可以掛載遠端的磁碟。','不需要另外建置光纖通道的網路。'],'伺服器透過 iSCSI 連到儲存設備，在作業系統裡看到一顆新的磁碟，格式化之後就像本機磁碟一樣使用。','把 iSCSI 的流量和一般辦公的流量放在同一個網路。儲存的流量被干擾，延遲升高，上面的系統跟著變慢。','傳統的 SAN 使用專用的光纖通道網路，效能好但設備昂貴。iSCSI 把同樣的區塊存取指令包在 IP 封包裡，可以使用一般的乙太網路設備，成本低很多。','iSCSI：用 IP 網路掛載遠端的磁碟。',['f',['主機','IP 網路｜（iSCSI）','儲存設備'],'主機看到的是一顆像本機的磁碟',['','a','']]],
['可用性',['主機到儲存設備之間要設定多重路徑。','一條路徑故障時還有另一條。','平常也可以分散流量。'],'伺服器有兩張儲存用的網路卡，分別接到兩台交換器，再接到儲存設備的兩個控制器。任何一張卡、一條線或一台交換器故障，磁碟都不會消失。','儲存設備本身有雙控制器和磁碟備援，但主機只用一條線連到它。那條線或那張卡故障，主機就看不到磁碟。','備援要涵蓋從主機到資料的整條路徑。路徑上任何一個沒有備援的元件，都會讓其他地方的備援失去意義。多重路徑的軟體會把多條路徑合成一顆磁碟。','主機到儲存要有多重路徑，沿途不能有單點。',['c',[['單一路徑','一條線故障｜磁碟就不見了','w'],['多重路徑','一條斷了｜走另一條','a']]]],
['容量管理',['儲存設備使用精簡配置時，宣告出去的容量可以超過實體的容量。','最需要監控的數字是實體容量的實際使用率。','實體容量用完，所有掛載它的系統會一起出問題。'],'儲存設備的實體容量是 50 TB，宣告出去的總量是 120 TB。監控設定在實體使用率 70% 和 85% 各發一次告警。','只監控每一台主機裡看到的磁碟使用率。每一台都顯示還有很多空間，但儲存設備已經快滿了。','主機看到的是宣告的容量，它並不知道底層實際上還剩多少。這個資訊只有儲存設備知道。而實體空間用完的後果，是所有的主機同時無法寫入。','精簡配置要監控實體容量的使用率。',['c',[['主機看到的','宣告的容量｜還有很多空間','off'],['儲存設備上的','實體使用率｜這個才要監控','a']]]],
['資料保護',['儲存設備的快照建立得很快，但它依賴原始的資料。','複製則是完整、獨立的另一份。','原始資料毀損時，快照也跟著沒有用，所以快照不能取代放在另一套設備上的複本。'],'儲存設備每小時做一次快照，可以很快地回到一小時前；同時每天把資料複製到另一套儲存設備。','只做快照，認為有很多個時間點可以還原就夠了。儲存設備本身故障時，資料和所有的快照一起消失。','快照通常只記錄「從那一刻之後有哪些區塊改變了」，沒有改變的部分仍然指向原本的資料。它能保護的是資料被誤改或誤刪；它保護不了儲存設備本身的故障。','快照依賴原始資料；另一套設備上的複本才是獨立的。',['c',[['快照','很快、省空間｜依賴原始資料'],['複製','完整獨立的另一份｜放在另一套設備','a']]]],
['分層',['分層儲存是把常用的資料放在快速但昂貴的媒體上。','很少使用的資料移到比較慢但便宜的媒體。','大部分的資料寫入之後很少再被讀取。'],'最近三十天的資料放在 SSD；三十天到一年的自動移到大容量的硬碟；一年以上的移到物件儲存。','所有資料都放在同一個等級。不是全部用最貴的而成本太高，就是全部用最便宜的而效能不足。','資料的價值和存取的頻率會隨時間下降，而不同媒體的成本差距很大。讓資料依使用的頻率自動搬到合適的層級，可以用大幅降低的成本維持常用資料的效能。','常用的放快的，少用的移到便宜的。',['f',['常用的資料','快速但昂貴的層','少用的資料','便宜的層'],null,['','a','','']]],
['電力',['機房同時有 UPS 和發電機時，UPS 負責撐住瞬間的斷電。','發電機啟動後接手長時間的供電。','機櫃裡的兩條電源分配器（PDU）要各接到不同的電力迴路，設備的兩顆電源分別插在兩邊。'],'停電時 UPS 立刻供電，四十秒後發電機啟動並接手。發電機每個月帶載測試一次，並確認油料足夠。','兩條 PDU 都接到同一個迴路。那個迴路跳電時，所有設備的兩顆電源同時失去電力。','發電機啟動需要幾十秒，這段空檔要靠 UPS。發電機很久才用一次，沒有定期測試的話，真正需要時常常啟動不了。電力的備援要從設備的電源一路分開到上游。','UPS 撐瞬間、發電機撐長時間；兩條 PDU 接不同迴路。',['f',['停電','UPS 立刻供電','發電機啟動','發電機接手｜長時間供電'],'發電機要定期帶載測試並確認油料',['w','a','','a']]],
['維運',['機櫃裡的線材要整理並貼上標籤。','維修時才能很快找到正確的線，避免拔錯。','整齊的線材也不會擋住設備的散熱。'],'每一條線的兩端都貼著相同的編號，線材依長度束好、走在機櫃的兩側，設備的背面保持通風。','線材用現成的長度隨意垂掛，沒有標示。要更換一台設備時，得先花半小時找出哪幾條線是它的。','機櫃裡的作業常常是在有時間壓力的情況下進行的。線材混亂會讓每一個動作都變慢，而且增加拔錯線的機會。擋在設備背面的線材會阻礙熱空氣排出。','線材要整理和標示：好找、不拔錯、不擋散熱。',['c',[['有整理和標示','很快找到｜不會拔錯','a'],['亂成一團','維修變慢｜容易拔錯｜擋住散熱','w']]]]],
2:[
['資料保護',['磁碟的容量愈來愈大，RAID 重建的時間也跟著拉長，重建期間再壞一顆的風險升高。','所以大容量的陣列常採用雙重同位或其他的保護方式。','抹除碼是把資料切成多塊再加上校驗塊分散存放，用較少的額外空間達到很高的容錯。'],'十幾 TB 的硬碟重建可能需要好幾天。使用可以容忍兩顆同時故障的保護方式，重建期間還有一層保護。','沿用小容量硬碟時代的 RAID 5。重建的那幾天完全沒有保護，而同一批的硬碟常常在相近的時間故障。','重建是把一整顆硬碟的內容重新算出來並寫入，時間和容量成正比。這段時間愈長，其他硬碟在這期間故障的機率愈高。抹除碼提供了更有彈性的方式，代價是運算比較重。','大容量磁碟重建久；用雙重同位或抹除碼提高容錯。',['c',[['容量愈大','重建愈久｜期間風險愈高','w'],['雙重同位','可容忍｜同時壞兩顆'],['抹除碼','較少額外空間｜很高的容錯']]]],
['效能',['評估儲存效能有三個指標：IOPS、吞吐量、延遲。','最直接反映使用者感受的是延遲，也就是每一次讀寫要等多久。','IOPS 很高但每次都要等很久，應用程式還是慢。'],'儲存設備可以提供很高的 IOPS，但延遲是 30 毫秒。資料庫每一筆交易都要等，使用者覺得很慢。換成延遲 1 毫秒的儲存之後明顯改善。','只比較規格表上的最大 IOPS。那個數字是在特定條件下量到的，而且沒有說明當時的延遲是多少。','IOPS 是每秒可以完成多少次讀寫，吞吐量是每秒可以傳多少資料，這兩個描述的是「量」。延遲描述的是每一次要等多久。應用程式通常是做完一次才能做下一次，所以延遲直接決定了它的速度。','使用者感受的快慢看延遲。',['c',[['IOPS','每秒幾次讀寫'],['吞吐量','每秒傳多少資料'],['延遲','每次要等多久｜最貼近使用者感受','a']]]],
['儲存效率',['重複資料刪除和壓縮可以節省儲存空間。','但對已經加密或已經壓縮過的資料，效果最差。','規劃容量時不能假設所有資料都有同樣的節省率。'],'一般的文件和虛擬機映像檔，去重和壓縮後可以省下六成的空間；已經壓縮的影片和加密過的備份檔，幾乎省不到任何空間。','用廠商宣傳的節省率來規劃容量。實際的資料有很大一部分是壓縮過的影像，節省的空間遠低於預期。','去重是尋找重複的內容，壓縮是尋找有規律的內容。加密的目的就是讓資料看起來像隨機的，沒有任何規律和重複；壓縮過的資料已經把規律去掉了。','加密或壓縮過的資料幾乎省不到空間。',['c',[['一般文件｜虛擬機映像','效果好'],['已壓縮或｜已加密的資料','幾乎沒效果','w']]]],
['儲存網路',['儲存的流量建議放在獨立的網路，不要和一般的流量混用。','一是避免互相搶頻寬造成延遲。','二是方便隔離和保護，縮小能接觸到儲存的範圍。'],'儲存流量走專用的交換器和網段，只有伺服器的儲存網路卡和儲存設備接在上面。','為了節省設備，儲存流量和使用者的流量走同一組交換器。有人傳大檔案時，所有虛擬機的磁碟都變慢。','儲存流量對延遲非常敏感，延遲一升高，所有使用這套儲存的系統都會受影響。一般的流量則起伏很大、難以預測。另外，能連到儲存網路就可能直接存取磁碟上的資料，所以愈少設備在上面愈好。','儲存流量走獨立的網路：穩定，也縮小接觸面。',['c',[['和一般流量混用','互相搶頻寬｜延遲升高','w'],['獨立的儲存網路','延遲穩定｜範圍小、好保護','a']]]],
['電力規劃',['規劃機櫃時說的「每櫃幾 kW」，限制的是這個機櫃的電力和散熱能承受的設備總耗電。','空間還有不代表還能再放。','高密度的設備很容易先把電力和冷卻用完。'],'一個機櫃的限制是 6 kW。放了十二台各 450 瓦的伺服器之後已經接近上限，雖然機櫃還空了一半。','看到機櫃還有空位就繼續放設備。迴路過載跳電，或是機櫃的溫度超出範圍。','設備消耗的電力幾乎全部變成熱。每個機櫃能提供的電力和能帶走的熱都是有上限的，這是機房設計時就決定的。現在的伺服器密度很高，一個機櫃的空間可以裝下遠超過它能負擔的耗電量。','機櫃的限制常常是電力和散熱，不是空間。',['c',[['空間','還有空位'],['電力和散熱','可能已經到上限','w']]]],
['能源效率',['PUE 是資料中心的能源效率指標。','它是總用電量除以資訊設備的用電量。','愈接近 1，代表愈多的電真的用在運算上。'],'一個機房的總用電是 300 kW，其中資訊設備用了 200 kW。PUE 是 1.5，代表每用 1 度電在運算上，要另外用 0.5 度電在冷氣和電力轉換。','只看設備的耗電量來估算電費。冷氣和電力系統本身的耗電也很可觀。','機房的電不只用在伺服器上，還用在冷氣、UPS 的轉換損耗、照明。這些是為了讓設備運作所必須付出的額外成本。PUE 把這個額外的比例量化，可以用來比較不同機房的效率。','PUE＝總用電÷資訊設備用電，愈接近 1 愈好。',['f',['總用電量','除以','資訊設備用電量','＝ PUE'],'愈接近 1，花在冷氣和損耗的電愈少']],
['環境監控',['機房除了溫度和濕度，還要監控其他的環境項目。','包括：漏水、煙霧、門禁、電力的狀態。','這些感測都要接到告警，不能只靠人員巡視。'],'冷氣機底下和高架地板下裝有漏水感測線。某天半夜冷氣的排水管阻塞，感測器在水蔓延到機櫃之前就發出告警。','只監控溫度。冷氣漏水、有人未經授權進入、某一路電力中斷，都要等到造成明顯的問題才被發現。','機房的事故很多是由這些「周邊」的因素引起的。冷氣漏水是很常見的來源。這些事件在一開始都很小，及早發現可以完全避免損害。機房平常沒有人，所以只能靠感測器。','機房還要監控漏水、煙霧、門禁、電力。',['c',[['漏水','冷氣是常見來源'],['煙霧','及早偵測'],['門禁','誰進出'],['電力','每一路的狀態']]]]],
3:[
['生命週期',['儲存設備即將終止支援時，資料要遷移到新的設備。','規劃時最關鍵的是：遷移期間對服務的影響、資料的驗證、退回的方案。','常見的做法是分批進行、每一批都驗證，並保留舊設備一段時間。'],'遷移分成十批，每個週末一批。每一批完成後比對資料並觀察一週，舊設備上的資料保留一個月才清除。','一個週末把所有資料一次搬完，隨即拆除舊設備。週一發現有一個系統的資料不完整，已經沒有可以退回的地方。','儲存設備是很多系統共同的基礎，遷移會牽動上面所有的系統。資料量大，搬移需要時間，過程中可能出錯。分批把風險切小，驗證確認每一步都正確，保留舊設備則是在出錯時還有退路。','儲存遷移：分批、驗證、保留舊設備一段時間。',['f',['分批遷移','每批驗證資料','觀察一段時間','保留舊設備｜再清除'],null,['','a','','a']]],
['資料保護',['物件儲存的不可變（WORM）功能，是在設定的期限內不能修改也不能刪除。','適合用在備份和需要防止竄改的紀錄。','可以防範勒索軟體和內部的誤刪，也符合部分法規的留存要求。'],'備份寫入物件儲存時設定九十天的不可變期間。即使攻擊者取得儲存帳號的管理權限，這九十天內的備份也無法被刪除或覆寫。','不可變的期限設得太長又放了大量資料。期限內這些資料無法刪除，儲存成本持續累積。','一般的保護依賴權限，而權限可以被盜用或誤用。不可變是從儲存系統的層次保證資料不會被改變，不論操作的人有什麼權限。這也讓它可以用來證明紀錄從寫入之後沒有被動過。','不可變儲存：期限內不能改也不能刪，適合備份和稽核紀錄。',['c',[['防勒索軟體','備份刪不掉'],['防誤刪和竄改','紀錄可以被信任'],['注意','期限內無法刪除｜要算成本']]]],
['多站架構',['兩個機房之間做儲存的同步複寫，最大的限制是距離造成的延遲。','同步複寫的每一筆寫入，都要等對方確認之後才算完成。','距離愈遠延遲愈高。太遠就只能用非同步，接受少量的資料差異。'],'兩個機房相距三十公里，來回延遲不到一毫秒，可以做同步複寫。另一個備援點在三百公里外，只能用非同步，資料會落後幾秒。','要求在相距很遠的兩地做同步複寫。每一筆寫入都要多等幾十毫秒，資料庫的效能大幅下降。','同步的意思是兩邊都寫好了才告訴應用程式「完成」，所以寫入的時間包含了訊號來回的時間。這個時間受到距離的限制，無法靠設備縮短。這是資料零遺失和效能之間的取捨。','同步複寫受距離限制；太遠只能非同步。',['c',[['同步複寫','零遺失｜距離要近'],['非同步複寫','距離不限｜可能落後少量資料']]]],
['機房分級',['資料中心的分級（Tier I 到 IV）主要區分的是基礎設施的備援程度和可維護性。','基礎設施指的是電力和冷卻。','等級愈高，愈能在不停機的情況下維護設備和容忍故障，建置和營運的成本也愈高。'],'評估代管機房時，比較它們的等級：較高等級的機房可以在維護任何一套電力或冷卻設備時，不影響客戶的設備。','認為等級愈高愈好，沒有對照自己的需求。對於可以接受偶爾計畫性停機的系統，最高等級的機房是不必要的花費。','機房的可用性取決於電力和冷卻會不會中斷。分級描述的是這些系統有多少備援：只有單一路徑、有備援的元件、可以在維護時不停機、還是能容忍任何單一故障。','機房分級看電力和冷卻的備援程度；等級愈高愈貴。',['f',['Tier I｜基本','Tier II｜有備援元件','Tier III｜可不停機維護','Tier IV｜可容忍故障'],'等級愈高，可用性和成本都愈高']],
['部署策略',['系統要放在自建機房、代管機房還是公有雲，沒有一定最好的選項。','要比較的是：整體的成本、需要的維運能力、法規的要求、彈性。','負載穩定而且長期的，自建或代管可能比較省；變動大的，雲端比較有彈性。'],'穩定運作的核心資料庫留在代管機房；流量起伏很大的對外網站放在公有雲；受法規限制必須在境內的資料留在國內的機房。','因為「上雲是趨勢」就全部搬到雲端，或是因為「雲端很貴」就全部留在自己的機房。','每一種方式的成本結構不同。自建是前期投資大、之後的邊際成本低；雲端是沒有前期投資、依用量付費。對穩定的負載，長期下來前者可能比較便宜；對變動的負載，後者不用為尖峰準備閒置的設備。','自建、代管、雲端：比成本、維運能力、法規和彈性。',['c',[['整體成本','長期算下來'],['維運能力','團隊做得來嗎'],['法規要求','資料能放哪裡'],['彈性','負載變動大嗎']]]],
['可用性',['機房宣稱雙迴路供電時，要確認真的沒有單點，得一路追到源頭。','要檢查：配電盤、UPS、變壓器、進線是不是都分開。','很多所謂的雙迴路，在上游的某處匯集在同一台設備或同一條進線。'],'實地查看並對照電力系統圖：兩個迴路各有自己的配電盤和 UPS，但追到上游發現它們接在同一台變壓器。那台變壓器就是單點。','看到機櫃裡有兩條 PDU、合約上寫著雙迴路，就認為電力有完整的備援。','備援的價值取決於兩條路徑有多獨立。只要它們在某一點共用了同一個元件，那個元件故障時兩條路徑會同時失效。這種共用點通常在比較上游、不容易看到的地方。','雙迴路要追到源頭，確認上游沒有匯在同一點。',['f',['PDU','配電盤','UPS','變壓器','進線'],'每一層都要確認兩路是分開的']],
['容量規劃',['儲存容量持續成長時，預算要依成長率預估未來的需求。','分階段擴充，並提前編列。','採購有前置時間，等告警才買來不及；一次買太多又會遇到技術過時和保固到期。'],'容量每年成長 40%。規劃每年擴充一次，每次購買足夠使用十八個月的量，並在前一年就把預算編入。','一次買足五年的容量。前兩年大部分的空間閒置；等到真正用到的時候，設備已經接近保固到期，而且同樣的錢可以買到更好的東西。','儲存設備的價格持續下降、技術持續進步，買得愈早，同樣的容量花的錢愈多。但採購需要時間，不能等到快用完才開始。分階段擴充是在這兩者之間取得平衡。','依成長率分階段擴充，提前編預算；不要一次買太多。',['c',[['等告警才買','來不及','w'],['一次買太多','閒置、技術過時｜保固到期','w'],['分階段擴充','提前編列預算','a']]]],
['資料清除',['儲存設備退役時，不論是送回原廠還是報廢，資料都要依規定清除或銷毀。','並取得證明文件。','有加密的設備可以用銷毀金鑰的方式處理。'],'退役流程規定：設備離開機房前要完成資料清除並取得清除報告；無法清除的故障硬碟則由合格的廠商實體銷毀並出具證明。','故障的硬碟直接交給原廠更換。那顆硬碟雖然故障，裡面的資料大部分還是讀得出來。','設備離開之後，上面的資料就不在你的控制之下了。故障送修的硬碟、租約到期歸還的設備，都是常被忽略的外洩來源。資料一直是加密的話，只要金鑰被銷毀，資料就無法讀取。','設備退役要清除或銷毀資料並取得證明；加密的可銷毀金鑰。',['f',['設備要退役｜或送修','清除或｜實體銷毀','取得證明文件','才能離開機房'],null,['','a','a','']]]]};
LEARN.cloud={0:[
['部署模式',['混合雲是同時使用自有的機房和公有雲。','並且讓兩邊可以協同運作。','很多組織把核心或受法規限制的系統留在自有環境，其他的放在雲端。'],'核心資料庫留在公司的機房，對外的網站放在公有雲，兩邊用專線連接。','把「有些系統在機房、有些在雲端」就稱為混合雲。重點在於兩邊要能互通、能一致地管理。','不同的系統有不同的限制和需求。有些因為法規、延遲或既有的投資而適合留在自有環境；有些需要彈性或新的服務而適合雲端。混合雲讓組織可以依每個系統的情況選擇。','混合雲：自有機房和公有雲並用，而且互通。',['f',['自有機房｜核心、受法規限制','專線或 VPN','公有雲｜需要彈性的系統'],null,['','a','']]],
['基礎觀念',['雲端的一個區域裡，有多個彼此隔離的可用區。','每個可用區是獨立的機房群，有各自的電力和網路。','把系統分散在多個可用區，單一機房出事不會全部停擺。'],'網站的伺服器分別部署在同一個區域的兩個可用區。其中一個可用區因為電力問題中斷，另一個繼續服務。','所有的資源都放在同一個可用區，認為「雲端業者會處理可用性」。業者提供的是多個可用區，要不要用是客戶的設計。','雲端業者的機房一樣會故障。可用區的設計就是讓故障的影響限制在一個範圍內。同一個區域的可用區之間距離近、延遲低，所以可以把同一個系統分散在裡面。','一個區域有多個可用區；分散部署才不怕單一機房出事。',['c',[['區域','一個地理位置'],['可用區','區域內獨立的機房群｜彼此隔離'],['做法','系統分散在｜多個可用區','a']]]],
['計費',['雲端是用多少付多少，對用量起伏很大的負載最有利。','尖峰時擴充、離峰時縮減，不必為了尖峰長期維持閒置的設備。','虛擬機關機之後，掛載的磁碟、保留的 IP 這些資源仍然在計費。'],'測試用的虛擬機關機了三個月，帳單上每個月還是有它的磁碟費用。不需要的資源要刪除，不是只關機。','以為關機就不用付錢。只停掉了運算的費用，儲存和其他附屬的資源還在。','雲端的每一種資源是分開計費的。虛擬機的運算是依執行的時間，磁碟是依配置的容量。關機只是讓運算停止，磁碟上的資料還在佔用空間。','用多少付多少；關機不等於不收費，不用的要刪除。',['c',[['關機','只停掉運算的費用'],['磁碟、保留的 IP','繼續計費','w'],['不用的資源','要刪除，不是只關機','a']]]],
['資料保護',['雲端儲存桶最常見的資料外洩原因，是被設定成公開存取。','這是客戶自己的設定問題。','新建立的儲存桶應該預設封鎖公開存取。'],'在帳號層級開啟「封鎖所有公開存取」的設定。之後即使有人誤把某個儲存桶設成公開，設定也不會生效。','為了讓合作廠商下載檔案，把整個儲存桶設成公開。裡面的其他檔案也跟著全部公開了。','儲存桶可以透過網際網路存取，要不要驗證身分是由設定決定的。設成公開之後，任何知道或猜到網址的人都可以讀取，而且有工具持續在掃描。正確的做法是用有期限的分享連結或授權特定的帳號。','儲存桶外洩多半是被設成公開；預設要封鎖公開存取。',['c',[['設成公開','任何人都能讀取｜有工具在掃描','w'],['預設封鎖公開存取','需要分享時｜用有期限的連結','a']]]],
['網路安全',['雲端的安全群組，作用類似虛擬機層級的防火牆規則。','它控制哪些來源可以連到哪些連接埠。','最常見的錯誤是把管理用的連接埠對全世界開放。'],'網頁伺服器的安全群組只開放 443 給所有人；管理用的連接埠只開放給公司的 IP 位址。','為了方便把遠端管理的連接埠開放給所有來源。幾分鐘之內就會開始有來自各地的登入嘗試。','雲端上的虛擬機如果有公有 IP，就直接暴露在網際網路上。安全群組是它最主要的一道防護。預設的做法應該是全部不開，只開放確實需要的來源和連接埠。','安全群組是虛擬機的防火牆；管理埠不要對全世界開放。',['c',[['對外服務的埠','可以開放'],['管理用的埠','只開放給指定的來源','a'],['對所有來源開放管理埠','最常見的錯誤','w']]]],
['資源管理',['幫雲端資源加上標籤，例如專案、負責人、環境。','用途是知道這個資源是誰的、做什麼用。','也可以依標籤來分攤成本。'],'所有資源建立時必須標上專案、負責人和環境（正式或測試）。帳單可以依專案彙總，閒置的資源也找得到人詢問。','資源沒有任何標籤。帳單上有幾百項費用，沒有人知道各是誰的；想要清理，也沒有人敢刪。','雲端的資源很容易建立，數量會很快增加。資源本身的名稱通常無法說明它的來歷。標籤把管理上需要的資訊附加在資源上，讓人和工具都可以依這些資訊來篩選、統計和管理。','資源要打標籤：專案、負責人、環境。',['c',[['專案','屬於哪個專案'],['負責人','可以問誰'],['環境','正式或測試']]]],
['帳號安全',['登入雲端管理主控台的帳號，最基本的保護是啟用多因素驗證。','主控台的帳號被盜用，攻擊者可以刪除所有資源。','或是開啟大量的資源來挖礦，帳單由你支付。'],'公司規定所有可以登入主控台的帳號都必須啟用多因素驗證，沒有啟用的帳號無法做任何操作。','只用密碼保護主控台的帳號。密碼在別處外洩之後，攻擊者登入並開了上百台高規格的主機，幾天內產生鉅額的費用。','主控台的帳號可以控制整個雲端環境，而且它是直接暴露在網際網路上的，任何人都可以嘗試登入。只靠密碼保護這麼高價值的入口是不夠的。','主控台帳號一定要開多因素驗證。',['c',[['只有密碼','外洩就全盤失守｜還要付帳單','w'],['多因素驗證','拿到密碼也進不來','a']]]]],

['網路',['雲端的虛擬網路裡，公有子網路可以直接對外連線，私有子網路不行。','資料庫和應用程式放在私有子網路。','只有負載平衡器這類入口放在公有子網路。'],'負載平衡器在公有子網路接收外部的連線，轉給私有子網路裡的應用伺服器，應用伺服器再連到同樣在私有子網路的資料庫。','所有的主機都放在公有子網路並給公有 IP，只靠安全群組來保護。一個設定錯誤，資料庫就直接暴露在網際網路上。','不需要被外部直接連線的資源，就不應該有被連到的途徑。放在私有子網路，即使安全群組設定錯誤，外部也沒有路可以到達。','只有入口放公有子網路；資料庫和應用放私有子網路。',['f',['網際網路','公有子網路｜負載平衡器','私有子網路｜應用伺服器','私有子網路｜資料庫'],null,['','','a','a']]],
['身分',['雲端上的程式要存取其他的雲端服務，比較安全的方式是指派角色給資源。','程式會自動取得短期的憑證。','不需要自己保管金鑰，憑證也會自動輪替。'],'虛擬機被指派了一個「可以讀取某個儲存桶」的角色。上面的程式不需要任何金鑰就能讀取，憑證每幾個小時自動更換。','產生一把長期有效的存取金鑰，寫在程式的設定檔裡。設定檔被推到程式碼倉庫，金鑰就外洩了。','長期金鑰是一個永遠有效的秘密，它會被複製到設定檔、開發人員的電腦、備份裡。角色的做法是讓雲端平台直接辨識「這個資源是誰」，並發給它很快就會過期的憑證。','雲端程式用角色取得短期憑證，不要用長期金鑰。',['c',[['長期金鑰','要自己保管｜最常見的外洩來源','w'],['指派角色','自動取得短期憑證｜自動輪替','a']]]],
['彈性',['自動擴展是依負載自動增加或減少運算資源。','流量高時增加機器，流量低時收回。','前提是應用程式可以多台同時運作，而且不把狀態存在單一台機器上。'],'網站平常用兩台伺服器。促銷活動時流量上升，自動增加到十台；活動結束後又自動縮回兩台。','應用程式把使用者的登入狀態存在伺服器的記憶體裡。自動擴展增減機器時，使用者被登出或資料遺失。','自動擴展的運作方式是隨時新增和移除機器。任何一台機器都可能在任何時候被移除，所以機器上不能有不可取代的東西。狀態要放到所有機器共用的地方。','自動擴展依負載增減機器；應用不能把狀態存在單機。',['f',['負載升高','自動增加機器','負載降低','自動收回機器'],'前提：應用可以多台運作、狀態放在共用處']],
['可用性',['負載平衡器除了分散流量，還有一個重要的功能是健康檢查。','它會定時確認後端的伺服器是不是正常。','自動把故障的後端移出服務。'],'三台後端伺服器中有一台的程式當掉了。負載平衡器的健康檢查發現它沒有正常回應，不再把連線分給它。','部署了多台伺服器但沒有設定健康檢查。其中一台故障時，三分之一的使用者仍然被分配到它而看到錯誤。','有多台伺服器不等於有備援。備援要生效，必須有機制知道哪一台故障並避開它。健康檢查就是這個機制。','負載平衡器的健康檢查會自動移出故障的後端。',['f',['定時檢查後端','發現一台異常','不再分配給它','恢復後再加回來'],null,['a','w','','']]],
['託管服務',['使用雲端的託管資料庫服務，修補、備份、高可用這些維運工作由業者處理。','省下的是維運的人力。','代價是彈性比較低，有些設定不能更動。'],'使用託管資料庫之後，版本更新、每日備份、主備切換都由平台自動處理，團隊可以專注在資料庫的設計和查詢的調校。','以為用了託管服務就什麼都不用管。資料的結構、查詢的效能、權限的設定、要保留多久的備份，仍然是自己的責任。','維運資料庫有很多例行但重要的工作，每一項都需要專業的人力。託管服務把這些標準化的工作交給業者。因為是標準化的，所以無法像自己安裝一樣調整每一個細節。','託管服務省維運人力，代價是彈性較低。',['c',[['業者負責','修補、備份｜高可用'],['自己負責','資料結構、查詢｜權限、保留政策','a']]]],
['資料保護',['雲端資料的備份不能只放在同一個區域。','區域性的故障或帳號被入侵時，備份可能一起失去。','重要的資料要跨區域，甚至跨帳號保存。'],'備份除了保存在原本的區域，另外複製一份到另一個區域、另一個帳號裡，那個帳號的管理權限由不同的人持有。','備份和正式資料在同一個帳號、同一個區域。攻擊者取得帳號的管理權限之後，把資料和所有的備份一起刪除。','雲端上有兩種會同時影響資料和備份的風險：整個區域的服務中斷，以及帳號本身被入侵。跨區域處理前者；跨帳號處理後者。','重要的備份要跨區域、跨帳號。',['c',[['同區域、同帳號','一起失去的風險','w'],['跨區域','防區域性故障'],['跨帳號','防帳號被入侵','a']]]],
['成本管理',['要避免月底才發現雲端帳單暴增，最基本的設定是預算和費用警示。','費用達到預算的某個比例時發出通知。','異常通常是忘了關的資源或設定錯誤造成的，愈早知道損失愈小。'],'設定每月預算，在達到 50%、80%、100% 時各通知一次；另外啟用異常偵測，單日費用明顯高於平常時立刻通知。','沒有任何警示。一個設定錯誤的服務連續執行了三個星期，月底的帳單是平常的十倍。','雲端的費用是持續累積的，而且沒有上限。一個錯誤的設定可以在很短的時間內產生很高的費用。沒有主動的通知，唯一會讓人發現的就是帳單。','雲端一定要設預算和費用警示。',['f',['設定每月預算','達到比例就通知','發現異常','及早處理'],null,['a','','w','']]],
['稽核',['雲端帳號的操作稽核紀錄一定要開啟並妥善保存。','它記錄誰在什麼時候對哪些資源做了什麼。','紀錄要存放到攻擊者刪不到的地方。'],'稽核紀錄啟用在所有區域，並即時送到另一個專用的帳號保存，原本的帳號沒有權限刪除。','沒有啟用，或是只保留預設的短期間。資源被刪除、設定被修改，事後完全無法追查是誰做的。','雲端的一切都是透過管理介面的操作來完成的，所以這份紀錄等於是整個環境的完整歷史。攻擊者取得權限後通常會嘗試關閉或刪除紀錄。','開啟操作稽核紀錄，並存到另一個帳號。',['c',[['紀錄內容','誰、何時｜對什麼做了什麼'],['保存位置','另一個帳號｜原帳號刪不到','a']]]]],
2:[
['混合連線',['公司的機房要連到雲端，有 VPN 和專線兩種方式。','VPN 便宜而且建置快，但它經過網際網路，品質沒有保證。','專線穩定，但費用高而且建置的時間長。'],'一開始用 VPN 連線。隨著搬上雲端的系統變多、流量變大，改用專線作為主要的連線，並保留 VPN 作為備援。','只用一條專線，沒有任何備援。專線中斷時，機房和雲端之間完全無法連線。','VPN 是在網際網路上建立的加密通道，頻寬和延遲會受到網際網路狀況的影響。專線是專用的實體線路，品質穩定。兩者可以互補。','起步用 VPN；流量大或延遲敏感用專線，VPN 當備援。',['c',[['VPN','便宜、快｜品質不保證'],['專線','穩定｜貴、建置久'],['常見做法','專線為主｜VPN 備援','a']]]],
['高可用',['雲端上的系統要能承受單一機房的故障，最基本的設計是把資源分散在多個可用區。','資料庫、運算、負載平衡都要跨可用區。','單一可用區的故障並不罕見。'],'應用伺服器分布在三個可用區，資料庫在兩個可用區有主要和備用的節點，負載平衡器跨所有可用區。','只把應用伺服器分散，資料庫卻只在一個可用區。那個可用區中斷時，應用伺服器都還在，但沒有資料庫可以用。','系統是由很多元件組成的，可用性取決於最弱的那一個。每一個元件都要能在少了一個可用區的情況下繼續運作，整個系統才能承受這種故障。','每一層都要跨可用區，不是只有應用伺服器。',['c',[['負載平衡','跨可用區'],['運算','跨可用區'],['資料庫','跨可用區','a']],'任何一層沒有跨區，那一層就是單點']],
['治理架構',['組織使用雲端的規模變大之後，建議用多個帳號（或訂閱）分開管理。','目的是隔離不同的環境和團隊，限制出事時的影響範圍。','也方便分攤成本。'],'正式環境、測試環境、資安稽核各自在不同的帳號裡。測試帳號的一把金鑰外洩，攻擊者無法接觸到正式環境的資源。','所有的東西都放在同一個帳號裡，用權限來區分。一個權限設定的疏失，或一個管理帳號被盜用，就影響到所有的環境。','帳號是雲端上最強的隔離邊界：資源、權限、配額、帳單都是以帳號為單位。在同一個帳號裡用權限隔離，需要每一項設定都正確；用不同的帳號隔離，預設就是不通的。','用多個帳號隔離環境和團隊。',['c',[['同一個帳號','靠權限隔離｜一個疏失就波及全部','w'],['多個帳號','預設不互通｜影響範圍有限','a']]]],
['法規',['選擇雲端的區域時，法規上最需要確認的是資料是否被要求存放在特定的地區或境內。','個資、政府、金融、醫療的資料常常有落地的要求。','備份和複本存放的區域也要一併確認。'],'法規要求某類資料必須存放在境內。選擇境內的區域部署，並確認備份和災難復原用的複本也沒有被複製到境外的區域。','只確認了主要的區域。備份功能預設把資料複製到另一個國家的區域，違反了規定而沒有人注意到。','資料存放的地點決定了它受哪個國家的法律管轄。主管機關可能要求特定的資料留在境內。雲端的很多功能會自動把資料複製到其他區域，每一個副本所在的位置都要符合規定。','選區域先確認資料落地的要求，備份和複本也算。',['f',['確認法規｜對資料落地的要求','選擇符合的區域','檢查備份｜存放的區域','檢查複本｜存放的區域'],null,['a','','','']]],
['成本',['雲端帳單裡最容易被低估的是資料傳出雲端的流量費。','資料傳進去通常免費，傳出來要收費。','長期穩定運作的主機，可以用預留或承諾用量的方案降低費用。'],'把大量的影片放在雲端並提供下載，流量費比儲存費高出很多。另外，有一批主機確定會穩定運作三年，改用三年期的承諾方案之後節省了四成。','估算成本時只算了主機和儲存。上線後才發現流量費用是一筆可觀的支出。','傳出的流量費在試用和開發的階段很小，到了正式上線、資料量變大時才顯現。它也是搬離雲端時的一項成本。承諾方案則是用「保證會使用」來換取折扣，前提是用量真的穩定。','傳出的流量費最容易被低估；穩定的用量用承諾方案。',['c',[['傳入','通常免費'],['傳出','要收費｜容易被低估','w'],['穩定的用量','預留或承諾方案','a']]]],
['部署',['雲端的資源用主控台手動點選建立，規模變大之後問題很多。','無法重現、沒有變更的紀錄、不同環境之間不一致。','要改用程式碼來定義資源。'],'所有的資源都用程式碼定義並放進版本控制。建立測試環境時，用同一份定義換一組參數就可以了；每一次變更都經過審查並留有紀錄。','所有資源都是在主控台上手動建立的。沒有人說得清楚環境裡有什麼、設定是什麼，也無法在另一個區域重建一套一樣的。','手動操作的過程只存在於操作者的記憶裡。用程式碼定義，環境的每一個細節都被寫下來，可以被檢視、比較、重複執行。','雲端資源用程式碼定義，不要手動點。',['c',[['主控台手動建立','無法重現｜沒有紀錄','w'],['程式碼定義','可審查｜可重建｜可稽核','a']]]],
['身分',['公司已經有自己的身分系統時，員工登入雲端主控台應該和它整合。','用同一組身分登入。','離職時停用一個地方就可以了，權限也可以依公司的群組來管理。'],'員工用公司的帳號透過單一登入進入雲端主控台，權限依他在公司目錄裡的群組決定。他離職時公司帳號被停用，雲端的存取同時失效。','在雲端另外為每個人建立一組獨立的帳號。員工離職時公司的帳號停用了，雲端上的帳號卻沒有人記得去刪。','每多一套獨立的帳號系統，就多一個需要同步的地方，也多一個會被遺漏的地方。把雲端的登入交給公司既有的身分系統，帳號的生命週期就只需要在一個地方管理。','雲端主控台整合公司的身分系統，用同一組身分登入。',['c',[['另建獨立帳號','離職時容易漏掉｜孤兒帳號','w'],['整合公司身分','停用一處｜全部失效','a']]]]],
3:[
['遷移策略',['把很多系統搬到雲端，要逐一評估每一個系統。','選項包括：直接搬、調整之後搬、重構、改用現成的服務、留在原地。','每個系統的價值、技術和相依性都不同。'],'盤點一百個系統之後：三十個直接搬、二十個調整後搬、十個重構、十五個改用現成的雲端服務、十個留在機房、十五個直接汰除。','對所有系統採用同一種做法，例如全部直接搬或全部重寫。前者得不到雲端的好處，後者永遠做不完。','重構可以得到最多雲端的好處，但成本最高；直接搬最快，但效益最小。每個系統值得投入多少，取決於它的重要性和未來還會用多久。','上雲要逐一評估：直接搬、調整、重構、換現成服務或留下。',['c',[['直接搬','最快｜效益最小'],['重構','效益最大｜成本最高'],['改用現成服務','不用自己維運'],['留在原地或汰除','不是每個都要上雲']]]],
['多雲',['多雲是同時使用兩家以上的雲端業者。','最主要的代價是維運的複雜度和需要的技能加倍。','而且往往只能使用各家都有的共同功能。'],'為了避免被單一業者綁住而採用兩家雲端。團隊要同時熟悉兩套平台，兩邊的監控、權限、網路都要各做一次，還要讓它們互通。','認為多雲一定比較安全或比較有談判籌碼，沒有評估代價。','每一家業者的服務、介面、計費方式都不同。同時使用兩家，要嘛每一樣東西做兩次，要嘛只使用兩邊都有的基本功能。這些成本是確定的，換來的好處不一定用得到。','多雲的代價是複雜度加倍；要有明確的理由再做。',['c',[['好處','降低對單一業者的依賴'],['代價','複雜度和技能加倍｜只能用共同的功能','w']]]],
['退場',['評估雲端服務時，要先想好怎麼離開。','資料搬出的成本、格式和時間，決定了日後還有沒有選擇。','退場計畫不代表要離開，而是知道自己的依賴有多深。'],'採用前先確認：資料可以用什麼格式匯出、匯出全部需要多久和多少費用、哪些功能是這家業者獨有而離開時要重新開發。','導入時只評估功能和價格。幾年後想要更換，才發現資料無法完整匯出、搬出的費用非常高。','任何服務都可能因為價格調整、服務品質、公司政策而需要更換。離開的難度在一開始選擇的時候就決定了。事先評估，可以在還有選擇的時候做出知情的決定，日後和業者協商時也有實際的籌碼。','採用前先想好怎麼離開：資料的格式、成本和時間。',['c',[['資料格式','能不能完整匯出'],['搬出的成本','流量費和人力'],['需要的時間','要多久']]]],
['成本治理',['FinOps 的核心觀念是讓工程、財務和業務共同為雲端的成本負責。','並且持續地最佳化。','雲端的花費是工程決策的結果，要讓做決定的人看得到成本。'],'每個團隊每週都看得到自己服務的費用和趨勢。工程師在選擇架構時把成本列為考量，費用異常時自己會去查原因。','雲端的費用只由財務部門在月底審核。他們看得到金額，但不知道為什麼、也無法改變它。','傳統的採購是先核准再花錢，財務可以事前控管。雲端是工程師隨時可以開資源，錢就花出去了。能影響成本的人是工程師，所以要把成本的資訊和責任交給他們。','FinOps：讓做工程決定的人看得到成本並負責。',['c',[['工程','做決定的人｜要看得到成本','a'],['財務','提供資訊和分析'],['業務','決定值不值得']]]],
['架構',['把舊系統原封不動搬上雲端之後，費用常常比原本還高。','原因是架構沒有利用雲端的彈性，等於租了一批全年開機的機器。','還多了流量費。'],'照搬上雲的系統全年無休地使用固定數量的大型主機。改成可以依負載縮放、並把資料庫換成託管服務之後，費用下降了一半。','認為上雲就會自動省錢。雲端的單價通常比自有的設備高，它的優勢在於不用為沒有使用的資源付費。','自有設備是買斷的，全年開著的邊際成本很低。雲端是依時間計費，同樣的機器全年開著，長期下來通常比較貴。雲端省錢的方式是「不用的時候不付錢」，這需要架構能夠縮放。','照搬上雲常常更貴；要用到彈性和託管服務才划算。',['c',[['照搬','全年開機的租用主機｜常常更貴','w'],['利用彈性和託管服務','不用的時候不付錢','a']]]],
['災難復原',['跨可用區的設計可以防範單一機房的故障。','要承受整個區域長時間的中斷，需要跨區域的資料複寫和可以切換的部署。','成本高很多，要依業務的衝擊來決定。'],'核心系統的資料即時複寫到另一個區域，那裡預先部署了最小規模的環境。主要區域中斷時，把流量切過去並擴充規模。','認為跨可用區就足以應付所有狀況。整個區域的服務發生中斷時，所有的可用區同時受到影響。','同一個區域的可用區共用一些區域層級的服務和控制系統，這些出問題時整個區域都會受影響。跨區域的複寫延遲較高、要付跨區的流量費、要維護兩套環境。','跨可用區防機房故障，跨區域才防區域級災難。',['c',[['跨可用區','防單一機房故障'],['跨區域','防整個區域中斷｜成本高很多','a']]]],
['治理',['要讓各團隊自由使用雲端又不失控，最有效的做法是用政策設好護欄。','禁止的事由系統自動擋下，其餘的放手讓團隊自己決定。','護欄的例子：不可以公開儲存桶、只能使用核准的區域、資源必須加標籤。'],'在組織層級設定政策：任何帳號都無法把儲存桶設成公開、無法在未核准的區域建立資源。在這些界線之內，各團隊可以自行建立需要的資源。','每一項資源都要申請和審核，團隊等不及就想辦法繞過；或是完全不管，直到出事。','集中審核無法跟上雲端的速度，而且審核的人不可能了解每個團隊的需求。把真正不能做的事定義成自動執行的規則，就不需要逐案審查。團隊得到速度，組織得到確定性。','用政策當護欄：禁止的自動擋，其餘放手。',['c',[['逐案審核','太慢｜團隊會繞過','w'],['完全不管','出事才知道','w'],['政策護欄','禁止的自動擋下｜其餘放手','a']]]],
['廠商鎖定',['大量使用某一家雲端業者的專屬服務，日後會難以搬離。','這是一種取捨：換來的是開發的速度和比較少的維運。','重點是清楚自己依賴的程度，並且有意識地做決定。'],'團隊決定使用業者專屬的資料庫服務，因為它省下大量的維運工作。同時記錄下這個依賴，並評估過將來要更換時需要重寫哪些部分。','為了完全避免鎖定，所有東西都自己架設，只用最基本的虛擬機。放棄了雲端大部分的好處，維運的負擔也沒有減少。','雲端的價值很大一部分來自那些只有特定業者才有的服務。完全不使用它們，等於只是租用主機。使用它們，就產生了依賴。應該問的是：在哪些地方接受依賴是值得的。','鎖定是取捨：換來速度和省維運，要清楚依賴在哪。',['c',[['完全不鎖定','放棄很多好處','off'],['有意識地使用','知道鎖在哪｜搬離要付出什麼','a']]]]]};

['部署',['新進一批相同機型的電腦，最有效率的安裝方式是用做好的標準映像檔一次部署。','每台電腦的系統、軟體和設定都一致。','之後的維護也比較容易。'],'五十台新電腦接上網路，從部署伺服器套用標準映像檔，一個下午全部完成，每一台都有相同的軟體和設定。','一台一台手動安裝。花了一個星期，而且每台裝出來都有一點不一樣。','手動安裝的步驟很多，每一步都可能有差異。映像檔把一台設定好的電腦完整複製下來，所有電腦都從同一份複製而來。一致的環境出問題時也比較容易判斷。','大量安裝用標準映像檔。',['f',['做好一台｜標準的電腦','製成映像檔','部署到所有電腦','每台一致'],null,['','a','','']]],
['更新',['全公司電腦的系統更新要由資訊單位集中派送。','這樣才能掌握誰裝了、誰沒裝。','也可以控制更新的時間。'],'每月的更新由管理系統派送，報表顯示哪些電腦已完成、哪些失敗、哪些很久沒有連線。','讓每個人自己決定什麼時候更新。有些人一直按「稍後提醒」，好幾個月都沒有更新。','更新對使用者來說是打擾，所以會被一再延後。只要有一部分電腦沒有更新，它們就是整個組織的弱點。集中管理把「有沒有更新」從個人的選擇變成可以看到、可以追蹤的狀態。','更新集中派送，才知道誰沒裝。',['c',[['各自更新','有人永遠不更新｜沒人知道','w'],['集中派送','看得到整體狀況｜可以追蹤','a']]]],
['權限',['一般使用者的電腦帳號不給本機管理員權限。','避免隨意安裝軟體。','中毒時惡意程式也拿不到最高的權限。'],'使用者點到惡意附件。因為他的帳號沒有管理員權限，惡意程式無法安裝到系統裡、無法關閉防護軟體。','為了減少使用者來要求安裝軟體，直接給所有人管理員權限。任何一個人點到惡意程式，它就取得了這台電腦的完整控制。','程式執行時擁有的權限等於執行它的使用者的權限。大部分的惡意程式需要管理員權限才能做最有破壞性的事。拿掉這個權限，是成本最低、效果很好的防護。','一般使用者不給本機管理員權限。',['c',[['有管理員權限','惡意程式｜取得完整控制','w'],['一般權限','惡意程式｜能做的事有限','a']]]],
['加密',['筆記型電腦要啟用整顆磁碟加密。','遺失或被偷時，別人讀不到裡面的資料。','沒有加密的硬碟拆下來接到別台電腦就能讀取。'],'筆電在計程車上遺失。因為磁碟有加密，可以確定資料不會被讀取，這只是設備的損失。','認為「有設定開機密碼就安全了」。把硬碟拆下來接到另一台電腦，登入密碼完全沒有作用。','作業系統的登入密碼只在那個作業系統運作時才有保護作用。繞過作業系統直接讀取磁碟，檔案都是明文。加密之後，磁碟上的內容沒有金鑰就只是無法解讀的資料。','筆電要整碟加密；遺失時只是丟了設備，不是丟了資料。',['c',[['沒有加密','硬碟拆下來｜就能讀','w'],['整碟加密','沒有金鑰｜讀不出來','a']]]],
['管理',['電腦名稱和資產標籤要採用統一的命名規則。','看名稱就知道是誰的、在哪裡。','查問題和盤點都會快很多。'],'電腦名稱由地點、部門和流水號組成。告警顯示某個名稱有異常，一看就知道是哪一棟哪一個部門的電腦。','使用預設的隨機名稱，或是各自隨意取名。告警跳出一個看不懂的名稱，光是找出它在哪裡、是誰在用就要花半天。','電腦的名稱會出現在所有的紀錄、告警和清單上。名稱本身帶有資訊，很多查詢的步驟就可以省略。這在處理事件、需要快速反應的時候特別重要。','電腦名稱要有規則：看名稱就知道是誰的、在哪裡。',['c',[['有命名規則','看名稱就知道｜位置和單位','a'],['隨機名稱','出事時找不到人','w']]]],
['遠端支援',['用遠端工具連到使用者的電腦協助處理，要讓使用者知道並且同意。','處理完成就中斷連線。','遠端連線看得到對方的畫面和檔案。'],'連線前先打電話告知，使用者在畫面上按下同意才開始。處理完成後告知並中斷連線。','沒有告知就直接連到使用者的電腦查看。即使是為了處理問題，使用者也會覺得被監看。','遠端連線讓資訊人員看得到使用者當下螢幕上的一切，可能包括和工作無關或敏感的內容。事先告知並取得同意，是對使用者的尊重，也保護資訊人員自己。','遠端連線要先告知、取得同意，完成就中斷。',['f',['告知使用者','取得同意','處理問題','完成後｜中斷連線'],null,['a','a','','']]],
['軟體管控',['公司要管控員工電腦上可以安裝哪些軟體。','目的是避免惡意程式、授權的糾紛，以及無法支援的軟體。','做法是提供核准的軟體清單和申請的流程。'],'公司有一個自助的軟體中心，裡面是核准過的軟體，使用者可以自己安裝。需要清單以外的軟體時要提出申請。','完全不管，使用者想裝什麼就裝什麼。電腦上出現各種來路不明的工具和沒有授權的軟體。','每一個安裝的軟體都可能帶來風險：它本身可能是惡意的、可能有漏洞而沒有人更新、可能違反授權。資訊單位無法為沒有看過的軟體負責。','軟體要管控：防惡意程式、防授權糾紛。',['c',[['來路不明的軟體','中毒的大宗來源','w'],['沒有授權的軟體','法律風險','w'],['做法','核准清單｜和申請流程','a']]]],
['汰換',['電腦汰換或轉給別人使用之前，要確實抹除原使用者的資料。','一般的刪除是救得回來的。','要使用抹除工具，或是重新部署映像檔。'],'電腦要轉給新同事使用之前，先抹除磁碟再重新部署標準映像檔。','只把前一位使用者的檔案刪掉、清空資源回收筒，就交給下一個人。用救援工具可以把那些檔案找回來。','刪除只是把檔案標記為可以被覆蓋的空間，資料本身還在。前一位使用者的檔案裡可能有不該讓其他人看到的內容。','電腦轉手或汰換前要抹除資料，刪除不算。',['c',[['刪除檔案','救得回來','w'],['抹除或重新部署','資料無法復原','a']]]]],
