['SQL 語法',['<code>DELETE</code> 刪除資料列，可以加 <code>WHERE</code> 只刪一部分。','<code>TRUNCATE</code> 快速清空整張表的資料，資料表本身還在。','<code>DROP</code> 把整張資料表連同結構一起刪掉。','<code>NULL</code> 代表「沒有值」，判斷要用 <code>IS NULL</code>，不能用 <code>= NULL</code>。'],'要找沒填電子郵件的會員：<code>WHERE email IS NULL</code>。寫成 <code>= NULL</code> 不會報錯，但永遠查不到任何資料。','三個「刪除」差很多，打錯的後果完全不同。另外 <code>= NULL</code> 不會出現錯誤訊息，所以很容易誤以為「真的沒有這種資料」。','NULL 的意思是「不知道是什麼」。拿一個值去和「不知道」比較，結果也是「不知道」，而不是真或假，所以 <code>= NULL</code> 的條件永遠不成立。SQL 因此另外提供 <code>IS NULL</code> 來專門判斷。','DELETE 刪列、TRUNCATE 清空、DROP 連表都沒了；NULL 用 IS NULL。',['c',[['DELETE','刪資料列｜可加 WHERE'],['TRUNCATE','清空全部資料｜表還在'],['DROP','整張表｜連結構都刪','w']]]],
['資料表設計',['外鍵是一張表裡的欄位，用來指向另一張表的主鍵。','外鍵會確保這個欄位的值在另一張表裡真的存在。','所以不能新增一筆指向不存在客戶的訂單，也不能直接刪掉還有訂單的客戶。'],'訂單表的「客戶編號」設為外鍵指向客戶表。想新增一筆客戶編號 9999 的訂單，但客戶表沒有 9999，資料庫會拒絕。','不設外鍵、只靠程式檢查，時間久了一定會出現「找不到主人」的孤兒資料，報表的數字就對不起來。','資料分散在多張表裡，靠編號互相指認。如果沒有任何機制保證這些編號有效，就可能出現指向不存在資料的紀錄。外鍵把這個檢查交給資料庫，任何程式、任何人來改資料都會被檢查。','外鍵確保「指過去的那一筆」真的存在。',['f',['訂單表｜客戶編號 1001','外鍵檢查','客戶表｜有 1001 嗎？','有才允許寫入'],null,['','a','','']]],
['索引',['查詢條件寫 <code>LIKE \'%明\'</code>（百分號在最前面），用不到索引，只能整張表掃過。','<code>LIKE \'王%\'</code>（開頭是確定的字）則可以使用索引。','同樣地，對欄位做運算或套函式之後再比較，通常也用不到索引。'],'在一百萬筆的員工表查 <code>name LIKE \'%明\'</code> 要好幾秒；改成查 <code>name LIKE \'王%\'</code> 幾乎瞬間完成。','「有建索引」不等於「查詢會用到索引」。要用執行計畫（<code>EXPLAIN</code>）確認資料庫實際上怎麼查。','索引是依照欄位值由小到大排好的。就像字典依開頭排序，知道開頭是「王」可以直接翻到那一區；但只知道結尾是「明」，就只能從第一頁看到最後一頁。','LIKE 的 % 放最前面，索引就用不上。',['c',[["LIKE '王%'",'知道開頭｜可以用索引'],["LIKE '%明'",'不知道開頭｜整張表掃','w']],'用 EXPLAIN 看資料庫實際怎麼查']],
['交易',['在交易裡做的修改，還沒 <code>COMMIT</code> 之前都可以用 <code>ROLLBACK</code> 整個取消。','<code>COMMIT</code> 之後修改就正式生效，不能再 ROLLBACK。','所以改重要資料時，先開交易、改完檢查結果，確認沒問題再 COMMIT。'],'<code>BEGIN;</code> 之後執行 UPDATE，顯示影響了 5,000 筆，但預期只有 1 筆。馬上 <code>ROLLBACK;</code>，資料恢復原狀。','很多工具預設是「自動提交」，每一句執行完就直接生效，這時候 ROLLBACK 沒有作用。要先明確開啟交易。','交易開始後的修改先記在暫存的狀態裡，其他人還看不到。COMMIT 是把它們正式寫入，ROLLBACK 是把它們丟掉。這讓你有機會在生效之前先檢查「影響的筆數對不對」。','先 BEGIN，改完看筆數；對了 COMMIT，錯了 ROLLBACK。',['t',['BEGIN;','UPDATE staff SET dept = \'業務\';','-- 影響 5000 筆？！預期只有 1 筆','ROLLBACK;                      -- 全部取消，資料恢復原狀','','-- 確認無誤時才用 COMMIT; 正式生效']]],
['SQL 查詢',['<code>GROUP BY</code> 把資料依某個欄位分組。','<code>COUNT(*)</code>、<code>SUM()</code>、<code>AVG()</code> 這類彙總函式，會對每一組各算一個結果。','要篩選分組後的結果用 <code>HAVING</code>；<code>WHERE</code> 是在分組之前篩選資料列。'],'<code>SELECT dept, COUNT(*) FROM staff GROUP BY dept;</code> 會得到每個部門各有幾個人。','SELECT 裡列出的欄位，除了彙總函式以外，都要出現在 GROUP BY 裡，否則資料庫不知道該顯示那一組裡的哪一筆。','沒有 GROUP BY 時，彙總函式是把整張表算成一個數字。加上 GROUP BY 之後，資料庫先把相同值的列放在一起，再對每一堆分別計算，所以結果是「每一組一列」。','GROUP BY 分組，COUNT 算每組幾筆；篩選組別用 HAVING。',['f',['全部員工','GROUP BY dept｜依部門分堆','COUNT(*)｜每堆各數一次','每個部門｜一列結果']]],
['備份還原',['備份排程顯示成功，只代表「備份的動作做完了」，不代表備份檔可以用。','要定期實際還原到測試環境，確認資料完整、系統起得來。','還原演練也能量出實際需要多少時間，這是評估能不能在要求時間內恢復的依據。'],'每季把正式資料庫的備份還原到測試主機，檢查筆數並實際登入系統操作，同時記錄整個過程花了多久。','很多單位是真的出事那天，才發現備份檔損壞、少備了某個資料庫，或沒有人知道還原步驟。','備份的目的是還原。備份過程中可能出現檔案損壞、漏掉新增的資料庫、加密金鑰沒有一起保存等問題，這些從「排程成功」的訊息完全看不出來，只有真的還原一次才會發現。','備份成功不算數，還原成功才算。',['f',['每天備份｜顯示成功','定期還原到｜測試環境','檢查資料｜並實際操作','記錄花了多久'],null,['','a','','']]],
['權限',['應用程式連資料庫用的帳號，只給它需要的資料表和操作。','不要讓應用程式使用資料庫管理員帳號。','只需要查詢的功能就只給查詢權限；不需要刪除就不給刪除。'],'報表系統只需要讀資料，它的資料庫帳號就只給相關資料表的 SELECT 權限。','「先給全部權限比較不會出錯」是很常見的偷懶做法。等到程式有 SQL 注入漏洞，攻擊者就能刪掉整個資料庫。','應用程式的漏洞被利用時，攻擊者能做的事就是那個資料庫帳號能做的事。帳號只能讀三張表，他就只能讀三張表；帳號是管理員，他就是管理員。','應用程式的資料庫帳號，只給它用得到的表和操作。',['c',[['報表系統','只給 SELECT'],['訂單系統','訂單相關的表｜讀取、新增、修改'],['管理員帳號','不給應用程式用','w']]]]];
LEARN.code[1]=[
['程式基礎',['函式是把一段常用的程式包起來並取名字，之後可以重複呼叫。','好處是同樣的邏輯只維護一份，要改的時候只改一個地方。','串列（陣列）的位置從 0 開始算，第一個元素是 <code>[0]</code>。','指令或腳本的結束代碼是 0 代表成功，其他數字代表失敗。'],'<code>a = [10, 20, 30]</code>，<code>a[1]</code> 是 20，不是 10。','從 0 開始算是新手最常錯的地方。另外，腳本失敗卻回傳 0，排程工具會以為成功而繼續做下一步。','從 0 開始算，是因為位置代表「離開頭的距離」，第一個元素距離開頭是 0。結束代碼則是讓「程式」而不是「人」來判斷上一步的結果，所以自動化流程都靠它決定要不要繼續。','位置從 0 開始數；結束代碼 0 是成功。',['c',[['a[0]','10'],['a[1]','20'],['a[2]','30']],'a = [10, 20, 30]，位置從 0 開始']],
['資料格式',['JSON 是用純文字表示資料的格式，常用在系統之間交換資料。','大括號 <code>{}</code> 表示一個物件，裡面是「名稱：值」；中括號 <code>[]</code> 表示一串清單。','名稱和文字值要用雙引號；數字、<code>true</code>、<code>false</code>、<code>null</code> 不用引號。'],'<code>{"name": "王小明", "age": 30, "roles": ["admin", "user"]}</code> 表示一個人，有名字、年齡和兩個角色。','JSON 的格式很嚴格：不能用單引號、最後一個項目後面不能多逗號、也不能寫註解，錯一個符號整份就解析失敗。','不同程式語言、不同系統內部表示資料的方式都不一樣。約定一種大家都看得懂的文字格式，傳送的一方照格式寫，接收的一方照格式讀，就不用管對方是用什麼語言寫的。','JSON：大括號是物件，中括號是清單，文字用雙引號。',['t',['{','  "name": "王小明",          ← 名稱和文字用雙引號','  "age": 30,                 ← 數字不用引號','  "roles": ["admin", "user"] ← 中括號是清單','}']]],
['API',['API 是程式和程式之間溝通的窗口，照約定好的格式送出請求，就會得到約定好的回應。','網頁型的 API 多半透過 HTTP 傳送，資料格式常用 JSON。','回應會帶狀態碼：200 是成功，401 是沒有通過驗證，404 是找不到，500 是伺服器端錯誤。'],'排班系統要取得員工名單，不直接去讀人事系統的資料庫，而是呼叫人事系統提供的 API。','API 不是給人點的畫面。另外，呼叫 API 用的金鑰等同密碼，不能寫在前端網頁或公開的程式碼裡。','如果每個系統都直接去讀別人的資料庫，對方只要改一個欄位，所有讀它的系統都會壞掉。API 是一份「我保證會這樣回答」的約定，內部怎麼改都可以，只要窗口的格式不變。','API 是程式之間的窗口：照格式問，照格式答。',['f',['你的程式','送出請求｜（照約定格式）','對方的 API','回應資料｜＋狀態碼'],'200 成功・401 未通過驗證・404 找不到・500 伺服器錯誤',['','','a','']]],
['錯誤處理',['<code>try</code> 裡放可能出錯的程式，<code>except</code>（其他語言叫 catch）放出錯時要怎麼處理。','沒有被接住的錯誤，會讓整支程式直接中斷。','接住之後要做有意義的事：記錄下來、重試，或回報給使用者，而不是什麼都不做。'],'批次處理一千個檔案，其中一個格式錯誤。用 try 包住單一檔案的處理，出錯時記下檔名再繼續處理下一個。','把錯誤接住之後什麼都不做（吞掉錯誤）比不接更糟。程式看起來正常執行完，實際上有東西沒處理，而且沒有任何紀錄。','程式執行時會遇到寫程式當下無法保證的狀況：檔案不存在、網路斷線、資料格式不對。錯誤處理是事先決定「遇到這些狀況時要怎麼辦」，而不是讓程式自己倒下。','出錯要接住，接住要處理：記下來、重試或回報，不能吞掉。',['c',[['沒接住','程式直接中斷','w'],['接住但不處理','錯了沒人知道','w'],['接住並記錄','知道哪裡錯｜其他照常進行']]]],
['日誌',['排程自動執行的腳本沒有人在看畫面，出問題只能靠 log 回頭查。','至少要記：開始時間、結束時間、處理了幾筆、錯誤訊息。','log 要有時間戳記，並且定期清理或輪替，才不會把磁碟寫滿。'],'凌晨的匯入作業隔天被發現資料少了。看 log 寫著「02:00 開始、讀到 1,000 筆、第 437 筆格式錯誤、中止」，馬上知道問題在哪。','log 不要記錄密碼、完整的身分證字號這類敏感資料。log 檔的權限通常比資料庫寬鬆，很容易變成外洩的管道。','人在操作時可以看畫面判斷發生什麼事，自動執行的程式沒有這個機會。log 就是程式留給事後查問題的人的現場紀錄，記得愈清楚，查的時間愈短。','自動跑的程式一定要寫 log：何時開始、做了幾筆、錯在哪。',['t',['02:00:00 開始匯入 members.csv','02:00:03 讀到 1000 筆','02:00:05 第 437 筆格式錯誤：生日欄位空白','02:00:05 中止，已寫入 436 筆','02:00:05 結束（失敗）']]],
['版本控制',['多人一起改同一份程式時，各自開分支修改，彼此不會互相影響。','改完並測試沒問題之後，再合併回主線。','合併之前可以請別人審查修改的內容（合併請求）。'],'小明開一個分支修登入的錯誤，小華開另一個分支做新報表。兩人各自測完，分別合併回主線。','大家都直接改主線，容易把還沒做完或沒測過的修改帶進正式版本，主線隨時可能是壞的。','分支是從主線複製出來的一條獨立的修改歷史。在分支上怎麼改都不會影響主線和其他人，所以主線可以一直保持在可以上線的狀態，出問題時也知道是哪一次合併帶進來的。','各自開分支改，測過再合併；主線隨時保持可用。',['f',['從主線｜開分支','在分支上｜修改、測試','請別人審查','合併回主線'],null,['','','','a']]]];
LEARN.trouble[1]=[
['影響範圍',['很多人同時出問題，原因通常在他們共用的東西上。','先找共通點：同一層樓、同一台交換器、同一個系統、同一個時間點。','往上游查，不要一台一台修。'],'同一層樓十幾個人同時說網路不通。不去看每個人的電腦，直接去查那一層的交換器，發現它斷電了。','一個人有問題和一群人有問題，處理方向完全不同。把大範圍問題當成十幾件個別案件處理，會浪費大量時間。','十幾台電腦同時各自故障的機率極低，比較合理的解釋是它們共同依賴的某樣東西出了問題。找出共通點等於直接把範圍縮小到那一樣東西。','很多人同時壞＝查他們共用的上游。',['f',['多人同時｜出問題','找共通點｜樓層、設備、系統','往上游查','一次解決'],null,['w','a','','']]],
['間歇性問題',['時好時壞的問題，靠猜是猜不出來的。','每次發生都記下：時間、當時在做什麼、畫面上的訊息。','累積幾次之後找規律，再用時間去對系統和設備的 log。'],'使用者說系統「有時候會很慢」。請他記錄一週後發現都在整點前後，對照排程才知道是每小時的同步作業造成的。','「我去看的時候是好的」不代表沒問題。請使用者在發生的當下就記錄或截圖，比事後回想可靠得多。','問題能穩定重現時可以直接觀察；間歇性問題在你觀察時通常不會發生。唯一能掌握的就是每次發生的條件，資料夠多之後共同點才會浮現，例如固定的時間、特定的操作、某一台設備。','時好時壞的問題：記時間、記動作，找規律。',['c',[['時間','幾點發生'],['動作','當時在做什麼'],['訊息','畫面顯示什麼']],'累積幾次後找規律，再去對 log']],
['交叉測試',['交叉測試是把「確定正常的」零件換上去，用來分辨問題在哪一段。','換上去之後好了，就是原本那個壞；沒好，問題在別的地方。','一次只換一樣，而且用來測試的東西必須是確定正常的。'],'螢幕沒畫面：先接一台確定正常的螢幕，有畫面了，問題就在原本的螢幕；還是沒有，再換線，再往主機查。','拿一個「應該是好的」但沒驗證過的零件來測，如果它剛好也是壞的，結論就會完全錯誤。','一套設備是由好幾段串起來的，任何一段壞了結果都一樣。把其中一段換成已知正常的，等於把這一段的不確定性消除；一段一段換，就能定位出壞的是哪一段。','用確定是好的去換，一次換一樣。',['f',['換上確定｜正常的螢幕','有畫面？','有：原本的螢幕壞','沒有：往線｜和主機查']]],
['使用者設定檔',['同一台電腦，某個人登入有問題、換別人登入正常，問題在那個使用者的層級。','硬體、網路、程式的安裝都可以先排除。','往這位使用者的設定檔、個人化設定和權限查。'],'小陳登入後程式打不開，小林在同一台電腦登入卻正常。檢查後發現小陳的設定檔裡這支程式的設定損壞，重設後恢復。','看到「程式打不開」就重新安裝程式，往往沒有用，因為每個人的設定是分開存的，重裝不會動到它。','這是用「換一個條件」來縮小範圍。電腦相同、使用者不同而結果不同，差異就只可能出在跟著使用者走的東西：他的設定檔、他的權限、他的個人設定。','同一台電腦換人就正常＝問題跟著那個帳號走。',['c',[['換人登入也壞','問題在電腦｜程式或硬體'],['換人登入正常','問題在使用者｜設定檔或權限']]]],
['變更前備份',['動任何設定之前，先把原本的值記下來或備份。','這樣改壞了才有辦法改回去。','設定檔可以先複製一份；畫面上的設定可以先截圖。'],'要修改網站的設定檔，先執行 <code>cp nginx.conf nginx.conf.bak</code>。改完起不來，把備份複製回去就恢復了。','「只改一個小地方不用備份」是最常後悔的決定。尤其是不熟的設定，常常連原本的值是多少都不記得。','排除問題的底線是不要讓情況變得更糟。有了備份，每一次嘗試都是可以撤銷的，你才能放心去試；沒有備份，改錯之後就多了一個新的問題要解決。','動手之前先備份，確保改壞了回得去。',['f',['記下或備份｜原本的設定','修改','測試','不行就還原'],null,['a','','','']]],
['升級轉派',['把問題轉給資深同事或廠商時，要附上：現象、已經做過的檢查和結果。','也要附上發生時間、影響範圍和使用者的聯絡方式。','這樣接手的人可以從你停下來的地方繼續，不用從頭開始。'],'「三樓會計室五台電腦今天九點起連不到報表系統，其他系統正常。已確認網路可通、DNS 解析正常、伺服器的服務有在執行，錯誤訊息如附圖。」','只寫「報表系統不能用，請協助」是無效的轉派。對方會回頭問你一輪同樣的問題，使用者也要再回答一次。','每一項你已經做過的檢查，都排除了一種可能。把這些資訊交出去，接手的人就不用重做，可以直接往還沒排除的方向查，處理時間會短很多。','轉派要附：現象、做過什麼、結果是什麼。',['c',[['現象','看到什麼｜何時開始'],['範圍','影響哪些人'],['已做的檢查','做了什麼｜結果如何'],['聯絡','找誰確認']]]],
['根因與症狀',['讓服務恢復是處理「症狀」，找出為什麼會發生是處理「根因」。','只處理症狀，同樣的問題過一陣子會再出現。','恢復之後要繼續問：為什麼會這樣？會不會再發生？要怎麼預防？'],'硬碟滿了刪掉舊檔讓服務恢復之後，繼續查出是某支程式的 log 沒有輪替，設定好輪替並加上空間監控。','服務恢復就結案，是很多重複發生的事故的來源。但順序不能反過來：要先恢復服務，再查根因。','症狀是你看到的結果，根因是造成它的原因。同一個根因只要還在，就會持續產生同樣的症狀。處理一次根因，比處理十次症狀省事，也不會在半夜被叫起來。','先恢復服務，再找根因；只治症狀會再犯。',['f',['硬碟滿了｜（症狀）','刪舊檔｜先恢復服務','查出誰在寫｜（根因）','設輪替｜加監控'],null,['w','','a','a']]],
['因果驗證',['「做了某件事之後好了」不等於「因為那件事才好」。','問題再度出現，代表當初判斷的原因可能是錯的，要回頭重新驗證。','驗證方式是把改動還原，看問題會不會回來。'],'換了網路線之後正常，隔天又斷。回頭檢查才發現是交換器的那個埠接觸不良，換線時剛好動到所以暫時好了。','最容易犯的錯是把巧合當成原因，然後結案。這會讓真正的原因繼續存在，還會留下錯誤的處理紀錄誤導下一個人。','很多問題本來就會自己時好時壞，你做任何動作之後它都可能「剛好」恢復。要確定因果，需要能重現：把原本的東西換回去問題就出現、換新的問題就消失，才算驗證。','好了不一定是你修好的；能重現才算驗證。',['f',['換了線','問題消失','隔天又出現','原因不是線｜重新查'],null,['','a','w','w']]]];
LEARN.svc[1]=[
['維護公告',['停機維護的公告至少要寫清楚三件事：什麼時候、影響什麼、有問題找誰。','要提早發，而且在維護前再提醒一次。','結束後也要通知「已經恢復」，或說明延後到什麼時候。'],'「本週六 22:00 至週日 02:00 報表系統停機維護，期間無法登入與查詢，其他系統不受影響。如有問題請洽資訊單位分機某某某。」','公告裡寫一大段技術原因和升級內容，使用者反而找不到他要的資訊。他只想知道什麼時候不能用、會不會影響到自己。','公告的目的是讓使用者可以事先安排工作，例如提早把報表印出來。他需要的資訊是時間和影響範圍，技術細節對他安排工作沒有幫助。','公告三件事：什麼時候、影響什麼、找誰。',['c',[['什麼時候','開始和｜結束時間'],['影響什麼','哪些功能｜不能用'],['找誰','聯絡窗口']],'提早發、維護前再提醒、結束後通知恢復']],
['權限與流程',['你在技術上做得到，不代表你可以決定要不要做。','開放別人的信箱、檔案、紀錄，要有正式的申請和核准。','沒有流程的要求，就算來自主管，也要請對方走申請程序。'],'主管打電話要你馬上把某位同事的信箱開給他看。回覆：「這需要走資料調閱的申請流程，核准後我會立刻處理，我把申請表寄給您。」','「他是主管所以照做」是不對的。有沒有權限調閱，是由公司的規定和核准程序決定，不是由職位高低決定。','資訊人員手上的管理權限是為了維護系統，不是用來決定誰能看誰的資料。申請和核准的紀錄可以保護被調閱的人不被任意查看，也保護你在事後被問起時，能說明自己是依規定辦理。','技術上做得到≠可以做；調閱資料要有申請和核准。',['f',['有人要求｜調閱他人資料','請對方走｜申請流程','權責主管核准','依核准範圍｜處理並留紀錄'],null,['','a','','']]],
['書面溝通',['多數人只看主旨和前兩行，所以最重要的事要放在最前面。','開頭就講：要對方做什麼、期限是哪一天。','背景說明和細節放後面，想看的人再看。'],'主旨寫「【請於 6/30 前完成】更換電子郵件密碼」，第一段寫要做什麼和期限，第二段才是操作步驟。','主旨寫「重要通知」「公告」，內文從背景原因開始寫，真正要大家做的事在第三段，結果大部分的人沒做。','每個人每天收到很多信，會先用主旨和開頭判斷這封信和自己有沒有關係。如果在這裡沒看到「我需要做什麼」，信就會被略過，後面寫得再清楚也沒用。','通知信：主旨和第一段就講「做什麼、期限何時」。',['c',[['主旨','做什麼＋期限'],['第一段','要對方做的事'],['後面','步驟、背景｜想看再看','off']]]],
['知識文件',['同一個問題被問第三次，就該寫成文件。','文件要放在大家找得到的地方，而且標題要用使用者會搜尋的說法。','寫完之後，再有人問就直接給連結，並且依回饋持續修正。'],'這個月第三個人問怎麼設定手機收信，就寫一份有截圖的步驟說明放在內部網站，之後直接貼連結。','文件寫完沒人維護，很快就會過期。過期的文件比沒有文件更糟，因為照著做會出錯。','每回答一次同樣的問題都要花一次時間，寫成文件則只花一次時間。文件還有一個好處：答案不會因為回答的人不同而不一樣，新同事也能直接用。','被問三次就寫成文件，放在找得到的地方。',['f',['同樣問題｜問第三次','寫成文件｜附截圖','放在大家｜找得到的地方','之後直接｜貼連結']]],
['廠商溝通',['回報問題給廠商，要給具體的證據，不要只說「不能用」。','證據包括：發生的時間點、完整的錯誤訊息、畫面截圖、你做過哪些測試。','對方說「我們測試正常」時，補上更具體的資訊，並請對方對照他們那邊同一時間的紀錄。'],'「6/12 14:03 和 14:27 兩次呼叫貴公司 API 都收到 500 錯誤，請求編號如附，從我們另一條線路測試結果相同。」','只說「你們的系統有問題」，對方最簡單的回應就是「我們這邊正常」，然後事情就卡住了。','廠商要靠資料才能查。有了確切的時間點，他們可以去翻自己系統的紀錄；有了錯誤訊息，可以對應到程式的哪一段。證據愈具體，對方愈難推回來，也愈快找到原因。','回報廠商要給證據：時間點、錯誤訊息、做過的測試。',['c',[['時間點','幾點幾分發生'],['錯誤訊息','完整內容｜和截圖'],['做過的測試','怎麼測的｜結果如何']]]],
['優先順序',['同時有很多事要處理時，依影響範圍和急迫性排順序。','影響很多人工作的，優先於影響單一個人的；工作完全停擺的，優先於只是不方便的。','排在後面的案件，要告訴對方大概什麼時候會處理。'],'同時進來三件事：整個部門的系統不能用、一個人的印表機印不出來、一個人想換滑鼠。先處理整個部門的那件。','不是誰先來就先處理誰，也不是誰催得最兇就先處理誰。但排在後面的人如果沒有被告知，會以為自己被忽略。','處理的人力是固定的，先做哪一件決定了總共損失多少工作時間。一個部門二十個人停工一小時，損失遠大於一個人不方便一小時，所以用影響範圍和急迫性來排，整體損失最小。','先處理影響最多人、最急的；排後面的要告知。',['c',[['整個部門｜不能用','最優先','w'],['一個人｜印不出來','其次'],['想換滑鼠','排入時程','off']]]],
['錯誤處理',['自己造成的錯誤，要馬上讓主管和受影響的人知道。','通報的同時就開始處理：停止可能讓情況惡化的動作，確認有沒有備份。','事後檢討是怎麼發生的，並且改善流程避免再犯。'],'誤刪了使用者的資料夾。立刻告訴主管和使用者，請使用者先不要在那個位置存新檔案，同時從昨晚的備份還原。','想先自己偷偷救回來再說，是最危險的做法。拖延的時間裡資料可能被覆蓋、備份可能被輪替掉，最後救不回來又被發現隱瞞。','資料救援有時間性：被刪除的資料在被新資料覆蓋之前還有機會救回，備份也只保留一段時間。愈早通報，可以動用的人力和方法愈多。隱瞞失去的不只是資料，還有別人對你的信任。','自己出錯：馬上講、馬上救、事後檢討。',['f',['發現｜自己出錯','馬上通報｜主管和當事人','停止惡化｜開始救援','事後檢討｜改善流程'],null,['w','a','','']]],
['進度回報',['答應的時間來不及了，要在期限之前主動告訴對方。','說明目前的進度、卡在哪裡，以及新的預計時間。','不要等對方來問，更不要等時間過了才講。'],'答應今天下班前回覆，下午三點發現來不及，馬上告知：「目前還在等廠商回覆，今天應該來不及，我明天中午前再跟您回報。」','「還沒好所以沒什麼好講的」是錯的。對使用者來說，時間到了沒消息比「還沒好」更糟。','對方是依照你答應的時間在安排自己的工作。提早知道會延後，他可以調整；到了時間才發現落空，他的安排就全部打亂了。主動更新讓對方覺得事情有人在掌握。','來不及要在期限前主動講，並給新的時間。',['f',['答應今天｜下班前回覆','下午發現｜來不及','期限前｜主動告知','給新的｜預計時間'],null,['','w','a','a']]]];
LEARN.gov[1]=[
['個人資料保護法',['向當事人蒐集個資時，要明確告知：機關名稱、蒐集目的、資料類別、利用的期間地區對象方式、當事人可以行使的權利，以及不提供的影響（第 8 條）。','當事人有五項權利：查詢或閱覽、製給複製本、補充或更正、停止蒐集處理利用、刪除。這些權利不能預先拋棄，也不能用特約限制（第 3 條）。','個資被竊取、洩漏、竄改或受其他侵害時，要在查明後以適當方式通知當事人（第 12 條）。'],'報名表上寫明：「本公司蒐集您的姓名與電話，用於本次活動聯繫，保存至活動結束後三個月，您可以來信要求查詢、更正或刪除。」','在契約裡加一條「當事人同意放棄查詢及刪除的權利」是無效的。另外，「同意」不是唯一的蒐集依據，但不論依據是什麼，告知義務原則上都要做到。','個資屬於當事人，機關只是在特定目的下使用。告知是讓當事人知道資料被拿去做什麼；五項權利是讓他保有控制；外洩通知是讓他有機會自保，例如更換密碼或留意詐騙。','蒐集要告知、五項權利不能要人放棄、外洩要通知當事人。',['c',[['蒐集時','告知目的、類別｜利用方式、權利'],['當事人五項權利','不得預先拋棄｜或用特約限制'],['外洩時','查明後｜通知當事人']],'第 12 條已於 2025 年 11 月修正公布（增訂通報主管機關），施行日期尚待行政院訂定']],
['刑法與授權',['沒有經過對方授權就去測試別人的系統，可能觸犯刑法的妨害電腦使用罪。','第 358 條：無故輸入他人帳號密碼、破解保護措施或利用系統漏洞，入侵他人電腦。','第 359 條：無故取得、刪除或變更他人的電磁紀錄，致生損害。第 360 條：無故以程式或其他電磁方式干擾他人電腦，致生損害。','所以滲透測試、弱點掃描，動手之前一定要有書面授權，並且寫明範圍和時間。'],'公司請你測試自家的網站。動手前先取得主管簽核的授權書，上面寫明測試的主機、時間和可以使用的方法。','「我是好意幫他們找漏洞」不是免責的理由。有沒有授權，才是合法測試和入侵的分界。','同樣的技術動作，例如掃描連接埠、嘗試登入、利用漏洞，本身分不出是測試還是攻擊。法律用「無故」（沒有正當理由和權限）來區分，而書面授權就是你有正當權限的證明。','測試別人的系統先拿書面授權；沒授權就可能是妨害電腦使用罪。',['c',[['第 358 條','無故入侵｜他人電腦'],['第 359 條','無故取得、刪除｜變更電磁紀錄'],['第 360 條','無故干擾｜他人電腦']],'合法測試的前提：書面授權、明確的範圍和時間']],
['職業倫理',['系統管理員在技術上看得到很多資料，但權限只能用在業務需要的範圍。','不因為好奇、受人之託或私人理由去查看別人的信件、檔案和紀錄。','工作中因為維護需要而看到的內容，也不能對外談論。'],'處理信箱問題時必須打開某位同事的信箱確認設定，只看需要確認的部分，處理完就關閉，內容不對任何人提起。','「我有權限所以可以看」是錯的。系統給你權限，是讓你能維護系統，不是授權你閱讀內容。','組織把最高權限交給資訊人員，是基於信任。這份信任一旦被濫用，受影響的不只是當事人的隱私，還有整個資訊單位的公信力；而且存取通常會留下紀錄，可能涉及個資法或其他法律責任。','做得到≠可以做；管理權限只用在業務需要的範圍。',['c',[['業務需要','可以｜而且只看必要的部分'],['好奇、八卦','不可以','w'],['受人之託','請對方｜走申請流程','w']]]],
['ISO 27001',['ISO 27001:2022 的附錄 A 列出 93 項控制措施。','分成四個主題：組織（37 項）、人員（8 項）、實體（14 項）、技術（34 項）。','2022 年版是把舊版（2013 年版）的 114 項、14 個領域整併而來。'],'導入時要逐項檢視這 93 項，決定哪些適用、哪些不適用並說明理由，整理成「適用性聲明書」。','不是 93 項全部都一定要做。可以依風險評鑑的結果排除不適用的項目，但必須有合理的說明。','附錄 A 是一份「可能需要的控制措施」的參考清單，用來提醒組織不要漏掉重要的面向。實際要做哪些，是由組織自己的風險評鑑決定，這也是為什麼標準要求留下適用性聲明書作為紀錄。','ISO 27001:2022 附錄 A：93 項，分組織、人員、實體、技術四類。',['c',[['組織','37 項'],['人員','8 項'],['實體','14 項'],['技術','34 項']],'合計 93 項；舊版是 114 項、14 個領域']],
['資通安全管理法',['機關的「資通安全責任等級」分成 A、B、C、D、E 五級，A 級的要求最多。','等級是依機關的業務重要性、保有資料的機敏程度和規模來核定。','這和資通安全「事件」的第一級到第四級是兩套不同的分級，不要混在一起。'],'某機關被核定為 B 級，就要依 B 級的應辦事項執行，例如配置資安專職人員、核心資通系統導入資訊安全管理系統並通過第三方驗證。','最常見的混淆是把「責任等級 A 級」和「事件第四級」當成同一套。前者是機關平常該做到什麼程度，後者是單一事件有多嚴重。','不同機關出事的影響差很多，要求所有機關做一樣的事並不合理。分級是讓影響愈大的機關負擔愈高的要求，資源才會用在最需要的地方。','責任等級 A～E（A 最高）是管機關；事件 1～4 級（4 最重）是管事件。',['c',[['責任等級','A、B、C、D、E｜A 級要求最多'],['事件等級','第一級到第四級｜第四級最嚴重']],'一個管機關平常要做到什麼，一個管單一事件有多嚴重']],
['委外管理',['系統可以委外給廠商，但資安責任不能跟著委外出去。','機關要選任適當的受託者，並且監督它的資通安全維護情形。','實務上要在契約裡寫明資安要求、事件通報義務和稽核的權利，並且實際去查核。'],'委外維護的廠商發生資安事件導致機關資料外洩。機關仍然要負責通報和處理，並檢討對廠商的監督有沒有落實。','「已經委外給廠商了，出事是廠商的責任」是錯的。對主管機關和當事人來說，負責的是委外的機關。','資料和服務的對象是機關自己的民眾或客戶，他們信任的是機關而不是廠商。委外只是換一個方式完成工作，如果責任可以一起轉出去，機關就沒有動力去挑選和監督廠商。','工作可以委外，責任不能委外；要選對廠商並持續監督。',['f',['選任適當的｜受託者','契約寫明｜資安要求','定期稽核｜監督','出事仍由｜機關負責'],null,['','','a','w']]]];

['記憶體',['ECC 記憶體可以偵測並自動修正單一位元的錯誤，也能偵測到（但無法修正）兩個位元的錯誤。','伺服器長時間運作、記憶體容量大，偶發位元錯誤的機會比個人電腦高得多。','ECC 需要主機板和處理器都支援才有作用。'],'資料庫伺服器跑了半年，系統紀錄裡出現幾筆「已修正的記憶體錯誤」。服務沒受影響，但這是該排程更換那一條記憶體的訊號。','ECC 修正了錯誤不代表可以不管。同一條記憶體反覆出現已修正的錯誤，通常是快要壞掉的前兆。','記憶體裡的每個位元都可能因為宇宙射線或電氣干擾而偶然翻轉。一般記憶體不會發現，程式就拿著錯的資料繼續算，結果可能是當機，也可能是悄悄寫出錯的資料。ECC 多存幾個檢查用的位元，讀取時就能算出哪一個位元錯了並改回來。','ECC：單一位元錯誤自動修正；反覆出現就該換。',['c',[['一般記憶體','位元翻轉｜不會發現','w'],['ECC 記憶體','單一位元錯誤｜自動修正']],'ECC 需要主機板和處理器都支援']],
['磁碟陣列',['RAID 5 只容許壞一顆。壞一顆之後到重建完成之前，再壞任何一顆資料就全部沒了。','重建時所有硬碟都要全速讀取，同一批買的舊硬碟很容易在這時候跟著故障。','大容量硬碟重建時間長，所以常改用可以壞兩顆的 RAID 6。熱備援硬碟會在有硬碟故障時自動頂上開始重建。'],'八顆硬碟的 RAID 5 半夜壞了一顆，熱備援立刻自動開始重建，隔天上班只需要把壞的那顆換掉補回備援。','「壞一顆沒關係」只有在馬上處理的前提下才成立。放著不管等於在沒有任何保護的狀態下運作。','陣列在降級狀態下，每一次讀取都要用其他硬碟的資料即時算出缺的那一份，負擔本來就比較重；重建時更是要把每一顆從頭讀到尾。硬碟容量愈大，這段沒有保護的時間愈長，所以需要更多的容錯和更快的自動接手。','RAID 5 重建中再壞一顆就全沒了；大容量用 RAID 6，並設熱備援。',['f',['壞一顆｜（降級）','熱備援｜自動頂上','重建中｜全部硬碟全速讀','再壞一顆｜＝全部沒了'],'RAID 6 可以容許同時壞兩顆',['w','a','','w']]],
['電力與 UPS',['UPS 的電池只能撐一段有限的時間。','所以除了容量要夠，還要設定連動：電池電量低於某個程度時，自動通知伺服器正常關機。','關機要有順序：先關應用程式和資料庫，最後才是儲存設備；復電時順序相反。'],'停電後 UPS 開始供電。剩餘五分鐘時，UPS 透過網路通知各台伺服器依序關機，等電池耗盡時所有系統都已經安全關閉。','只買了 UPS 卻沒設連動關機，停電時間一超過電池能撐的長度，結果和沒有 UPS 一樣是硬斷電。','UPS 解決的是「瞬間斷電」和「爭取時間」。長時間停電時，重點是利用這段時間做正常關機，把記憶體裡的資料寫進磁碟。這個動作如果要靠人半夜趕到機房去做，通常來不及，所以要自動化。','UPS 要設連動關機，電池用完前讓伺服器自己正常關機。',['f',['停電','UPS 電池供電','電量低｜通知伺服器','依序正常關機'],'沒設連動，電池耗盡時一樣是硬斷電',['w','','a','a']]],
['虛擬化',['虛擬化把很多台伺服器集中到少數幾台實體主機上，節省硬體和電力。','代價是風險也集中了：一台實體主機故障，上面所有的虛擬機一起停擺。','正式環境至少要兩台以上的主機加上共用儲存，才能在一台故障時把虛擬機移到另一台繼續執行。'],'公司把十套系統虛擬化到三台主機組成的叢集。其中一台主機板故障，上面的虛擬機自動在另外兩台重新啟動。','為了省錢只買一台很強的主機來跑所有虛擬機，等於把所有系統的可用性都押在這一台上。另外，共用儲存本身也要有備援。','虛擬機其實就是儲存設備上的一組檔案加上主機的運算資源。只要檔案放在所有主機都讀得到的共用儲存上，任何一台主機都可以把它跑起來，這就是虛擬化能做到高可用的原因。','虛擬化把雞蛋放同一籃；至少兩台主機加共用儲存。',['c',[['只有一台主機','主機壞｜全部系統停擺','w'],['兩台以上＋共用儲存','一台壞｜虛擬機移到另一台']]]],
['大量部署',['大量安裝電腦時，先做好一份標準的映像檔，再用部署工具一次派送。','這樣每一台的系統、軟體、設定都一致，速度也快。','映像檔要定期更新，把新的修補程式和軟體版本放進去。'],'兩百台新電腦到貨。接上網路從部署伺服器開機，自動套用標準映像檔並加入網域，一個下午就完成。','一台一台手動安裝，不只是慢，更大的問題是每台都會有一點點不一樣，之後出問題很難判斷是不是安裝差異造成的。','一致性本身就是價值。所有電腦都從同一份映像檔來，出問題時可以確定「系統本身是一樣的」，排除問題和派送更新都單純很多；重灌一台電腦也只是再套一次映像檔。','大量安裝用標準映像檔加部署工具：快，而且每台都一樣。',['f',['做一份｜標準映像檔','放到｜部署伺服器','電腦從網路｜開機','自動安裝｜每台一致'],null,['a','','','a']]],
['更新管理',['安全性更新要先派給一小群測試用的電腦，確認沒有問題再全面派送。','這種分批的做法通常分成：測試群、先導群、全面派送。','同時要準備好退回的方法，並設定完成的期限，不能無限期拖延。'],'每月更新先派給資訊單位的二十台電腦，三天沒問題再派給各部門的先導使用者，一週後全面派送。','「怕出問題所以都不更新」和「不測試就全面派送」是兩個極端，都不對。分批的目的是又快又穩地更新完。','更新偶爾會和特定的軟體、驅動或硬體組合衝突，原廠不可能測過所有環境。先在小範圍試，等於用少數電腦幫全公司驗證；出問題只影響少數人，而且還來得及暫停。','更新分批派：測試群、先導群、全面；要有退回方法和期限。',['f',['測試群｜少數電腦','先導群｜各部門代表','全面派送','追蹤完成率'],'出問題可以在前兩階段喊停']],
['韌體更新',['更新 BIOS 或韌體時如果中途斷電，設備可能再也開不了機。','所以要排在維護時段，確認供電穩定（接 UPS），並先備份設定。','更新前要讀原廠的版本說明，確認有沒有指定的更新順序或必須先升到的中間版本。'],'要更新儲存設備的韌體：先看版本說明確認升級路徑，排在週六晚上的維護時段，備份設定，再依原廠步驟執行。','韌體更新不是「按下去等它跑完」這麼簡單。跳過中間版本、更新中強制重開，都可能讓設備無法啟動，而且很多設備沒辦法自己救回來。','韌體是設備最底層的程式，設備開機第一步就是執行它。更新時是把舊的整個擦掉再寫入新的，如果寫到一半中斷，設備手上只剩一份不完整的程式，連開機都做不到。','韌體更新：排維護時段、供電要穩、先備份設定、照原廠順序。',['f',['讀版本說明｜確認升級路徑','排維護時段｜接 UPS','備份設定','依原廠步驟｜更新'],'更新到一半斷電，設備可能再也開不了機']]];

['網域與驗證',['Kerberos 驗證預設只容許 5 分鐘的時間差，電腦和網域控制站的時間差太多就會登入失敗。','常見原因是主機板電池沒電造成時間跑掉，或時間同步服務沒有正常運作。','網域控制站至少要有兩台互相複寫，只有一台的話它一故障，全公司都無法登入。'],'一台放了很久的電腦開機後無法用網域帳號登入，訊息提到時間。把時間校正之後就正常了，再把主機板電池換掉。','看到「無法登入網域」先懷疑密碼或網路是合理的，但時間也是常見原因，而且很容易被忽略。','Kerberos 發出的票證上有時間戳記，用來防止有人把攔截到的票證拿來重複使用。接收的一方會檢查這個時間是不是「現在」，如果兩邊的時鐘差太多，就無法分辨是時鐘不準還是有人在重放舊的票證，只能拒絕。','網域登入失敗要查時間：Kerberos 只容許差 5 分鐘。',['c',[['時間差超過 5 分鐘','Kerberos 驗證失敗｜無法登入','w'],['只有一台網域控制站','它一壞｜全公司無法登入','w'],['正確做法','時間同步｜至少兩台控制站']]]],
['特權帳號',['每台電腦的本機 Administrator 都用同一組密碼，攻擊者只要拿到一台的密碼，就能登入所有電腦。','這是攻擊者在內網擴散最常走的路。','解法是用 LAPS 這類工具，讓每台電腦的本機管理員密碼都不一樣，而且定期自動更換。'],'導入 LAPS 之後，每台電腦的本機管理員密碼是各自隨機產生的，存放在目錄服務裡，只有被授權的人查得到。','「密碼夠複雜就安全」是不夠的。再複雜的密碼只要每台都一樣，被拿到一次就等於全部失守。','攻擊者入侵一台電腦後，可以從那台電腦取得本機帳號的密碼或它的雜湊值。如果這組憑證在其他電腦也通用，他不需要任何漏洞，直接用正常的登入方式就能進到下一台、再下一台。','本機管理員密碼每台都要不同：用 LAPS 自動管理。',['f',['拿下一台電腦','取得本機｜管理員密碼','每台都是｜同一組','全部電腦｜都能登入'],'LAPS：每台密碼不同，定期自動更換',['w','','w','w']]],
['群組原則',['群組原則的套用順序是：本機、站台、網域、組織單位（OU）。','後套用的會蓋掉先套用的，所以預設是離物件最近的 OU 層級生效。','例外是上層的原則設了「強制」，它就不會被下層蓋掉。'],'網域層級設定螢幕十分鐘鎖定，某個 OU 設定五分鐘。那個 OU 裡的電腦實際會是五分鐘。','不是「上層比較大所以上層贏」。預設正好相反，是愈靠近物件的設定愈優先，除非上層設了強制。','這樣設計是為了讓整個組織有共同的基本設定，同時允許各單位依需要調整。大範圍的原則先鋪底，小範圍的原則再覆蓋；真正不容許調整的項目，才用「強制」鎖住。','套用順序：本機、站台、網域、OU；後面的蓋掉前面的。',['f',['本機','站台','網域','OU｜（最後套用，生效）'],'上層設了「強制」就不會被下層蓋掉']],
['磁碟空間',['檔案系統除了空間，還有 inode 數量的限制。大量小檔案會把 inode 用完，這時候空間還有也建不了新檔案，用 <code>df -i</code> 檢查。','刪掉一個檔案後空間沒有釋放，通常是還有程式開著它。','這種情況要重新啟動那支程式，或是一開始就用清空內容的方式處理，不要直接刪除。'],'出現 <code>No space left on device</code> 但 <code>df -h</code> 顯示還有 30% 空間。執行 <code>df -i</code> 發現 inode 使用率 100%，原來是某個目錄累積了幾百萬個暫存小檔。','看到「空間不足」就只查 <code>df -h</code>，會查不出原因。inode 用完和檔案被佔住，是兩種常見但容易被忽略的情況。','每個檔案都需要一個 inode 來記錄它的資訊，inode 的總數在建立檔案系統時就固定了。另外，刪除檔案只是把它的名字移除；只要還有程式開著它，實際的內容就不會被回收，要等最後一個使用它的程式關閉。','空間還有卻寫不進去：查 <code>df -i</code>；刪了沒釋放：有程式還開著它。',['t',['$ df -h /data','/dev/sdb1  100G  70G  30G  70%     ← 空間還有','$ df -i /data','/dev/sdb1  6.5M  6.5M  0  100%     ← inode 用完了','','$ lsof | grep deleted              ← 找出還開著已刪除檔案的程式']]],
['SSH 安全',['對外的 SSH 服務每天都會有人不斷嘗試猜密碼。','基本的強化是：禁止 root 直接登入，改用金鑰驗證並關閉密碼登入。','再加上限制可以連線的來源位址，或是要求先連 VPN。'],'在 <code>sshd_config</code> 設定 <code>PermitRootLogin no</code> 和 <code>PasswordAuthentication no</code>，管理者用自己的帳號和金鑰登入，需要時再用 sudo。','把 SSH 改到別的連接埠只能減少紀錄裡的雜訊，不算防護。私密金鑰也要設通關密語，而且不能多人共用同一把。','密碼可以被猜，金鑰實際上猜不到。禁止 root 直接登入則有兩個作用：攻擊者連帳號名稱都要猜；每個管理者用自己的帳號登入再提權，紀錄上才分得出是誰做的。','對外 SSH：禁 root 登入、用金鑰、關密碼登入。',['t',['# /etc/ssh/sshd_config','PermitRootLogin no              ← 禁止 root 直接登入','PasswordAuthentication no       ← 關閉密碼登入','PubkeyAuthentication yes        ← 使用金鑰驗證']]],
['效能診斷',['load average 計算的是「正在執行和正在排隊的工作數」，在 Linux 上也包含正在等磁碟或網路讀寫的工作。','所以 load 很高但 CPU 使用率很低，通常代表很多程式卡在等 I/O。','接著要查磁碟是不是太慢、是不是有掛載的網路儲存沒有回應。'],'主機的 load 到 40，但 CPU 幾乎沒在用。<code>top</code> 顯示 I/O 等待（wa）很高，最後查到是掛載的網路磁碟連不上，所有存取它的程式都卡住。','看到 load 高就認為是 CPU 不夠而去加處理器，在這種情況下完全沒有幫助。','load 反映的是「有多少工作想做事但還沒做完」。它們可能是在等 CPU，也可能是在等磁碟回應。後者不會消耗 CPU，所以 CPU 使用率看起來很閒，但系統實際上卡住了。','load 高、CPU 低＝在等磁碟或網路；看 top 的 wa。',['c',[['load 高｜CPU 也高','運算量太大'],['load 高｜CPU 很低','在等磁碟｜或網路讀寫','w']],'top 裡的 wa 數值高，就是在等 I/O']]];
LEARN.net[2]=[
['VLAN',['不同 VLAN 之間要互通，必須經過有路由功能的設備，例如三層交換器或路由器。','access 埠只屬於一個 VLAN，用來接一般的電腦。','trunk 埠可以同時載送多個 VLAN，用在交換器之間，或接無線基地台、虛擬化主機。'],'兩台交換器之間用一條 trunk 線連接，上面同時跑 VLAN 10、20、30。兩邊的 trunk 允許的 VLAN 清單要一致。','新增了一個 VLAN，卻忘記在交換器之間的 trunk 上放行，結果這個 VLAN 只在單一台交換器上通。','trunk 線上的資料會加上一個標籤，寫明它屬於哪個 VLAN，對面的交換器看標籤就知道要送到哪個 VLAN 的埠。access 埠則不帶標籤，因為一般電腦不認得它，交換器是依埠的設定判斷它屬於哪個 VLAN。','access 一個 VLAN 接電腦，trunk 多個 VLAN 接交換器；跨 VLAN 要路由。',['c',[['access 埠','只屬於一個 VLAN｜接電腦'],['trunk 埠','載送多個 VLAN｜接交換器、基地台'],['跨 VLAN','要經過路由']]]],
['MTU 與 VPN',['MTU 是一個封包能承載的最大尺寸，乙太網路通常是 1500 位元組。','VPN 會在原本的封包外面多包一層，實際可用的尺寸就變小了。','徵狀很典型：ping 得到、小網頁正常，但大檔案傳輸或某些網站一直卡住。'],'連上 VPN 後某個內部系統登入頁正常，一下載報表就卡住。把 VPN 介面的 MTU 調小之後恢復正常。','因為「ping 得到」就排除網路問題是錯的。一般的 ping 封包很小，測不出大封包過不去的情況，要用指定大小且不分割的 ping 來測。','超過尺寸的封包本來可以被拆成小塊再送，但很多連線會標記「不可分割」。這種封包太大時，路上的設備應該回報一個訊息請來源改小；如果這個回報訊息被防火牆擋掉，來源永遠不知道，就一直重送同樣大小的封包。','VPN 連得上、小的通大的卡＝MTU。',['f',['原本的封包｜1500','VPN 多包一層','超過可通過｜的大小','大封包被丟棄'],'小封包正常、大封包卡住，是典型徵狀',['','','w','w']]],
['DHCP',['有人私接家用分享器，它會搶著回應 DHCP 請求，發出錯誤的位址和閘道。','附近的電腦拿到錯的設定就上不了網。','交換器的 DHCP Snooping 功能，只允許指定的信任埠回應 DHCP，其他埠送出的回應一律丟棄。'],'某個辦公室的電腦陸續拿到 192.168.0.x 的位址而斷線。查出是有人把家用分享器的區域網路埠接到牆上的網路孔。','這種情況重新開機、釋放再重新取得位址，都可能再拿到錯的。要找到並移除那台私接的設備，並在交換器上啟用防護。','DHCP 的運作方式是電腦廣播詢問，誰先回答就用誰的，電腦沒有能力分辨哪一台才是正牌的伺服器。DHCP Snooping 把這個判斷交給交換器：只有接著正牌伺服器的那個埠，才被允許送出回應。','私接分享器會亂發 IP；用 DHCP Snooping 擋。',['c',[['信任埠','接正牌 DHCP 伺服器｜允許回應'],['其他埠','送出的 DHCP 回應｜一律丟棄','w']],'DHCP Snooping 的運作方式']],
['存取控制',['802.1X 是在設備接上網路的時候，先驗證身分，通過才放行。','沒有它，任何人把電腦插上牆上的網路孔就進到內部網路。','驗證通常由後端的 RADIUS 伺服器處理，可以用帳號密碼或憑證。'],'訪客把筆電接上會議室的網路孔，因為沒有通過驗證，交換器把它放到只能上網的訪客 VLAN。','印表機、監視器這類設備多半不支援 802.1X，通常要用其他方式例外處理。這些例外如果管理不好，就會變成繞過驗證的漏洞。','傳統網路的假設是「能接上線的就是自己人」，所以實體的網路孔等於一扇沒有鎖的門。802.1X 把驗證提前到連線的第一步，交換器的埠在驗證通過之前不會放行任何一般流量。','802.1X：接上網路先驗證，通過才放行。',['f',['設備接上｜網路孔','交換器要求｜驗證','RADIUS 伺服器｜判斷','通過才放行'],'沒通過可以導到訪客 VLAN 或直接拒絕',['','a','','']]],
['實體層與雙工',['網路埠兩端的速度和雙工設定要一致。','一邊是全雙工、另一邊是半雙工時，線路會通，但錯誤和碰撞很多，速度非常慢。','做法是兩端都用自動協商，或者兩端都固定成相同的設定；不能一端固定、一端自動。'],'某台伺服器傳檔案特別慢。交換器上那個埠的錯誤計數不斷增加，查出是伺服器網路卡被固定成全雙工，交換器端卻是自動協商。','線路「有通」不代表正常。這種問題換線、換埠都不會好，因為原因是設定而不是硬體。','半雙工的一方認為同一時間只能有一邊傳送，發現對方也在傳就判定為碰撞並重傳；全雙工的一方則是隨時都在傳。兩邊對規則的認知不同，結果就是大量的重傳和錯誤。','兩端的速度和雙工要一致：都自動，或都固定成一樣。',['c',[['兩端都自動協商','正常'],['兩端固定成一樣','正常'],['一端固定｜一端自動','大量錯誤、很慢','w']]]],
['防火牆',['狀態式防火牆會記住每一條連線的狀態，只放行屬於已建立連線的封包。','如果去的封包走 A 防火牆、回來的封包走 B 防火牆，B 沒有這條連線的紀錄，就會把回程封包丟掉。','這種情況叫非對稱路由。'],'新增第二條對外線路之後，部分連線時通時不通。查出是去程和回程走了不同的防火牆。','看到連線不通就一直檢查防火牆規則，規則明明是放行的。問題不在規則，而在路由讓來回的路徑不一致。','狀態式防火牆的安全性來自「只接受我看過開頭的連線」。回程封包到了一台沒看過開頭的防火牆，在它眼中就是一個憑空出現的封包，正是它應該擋掉的東西。','狀態式防火牆要看到去和回；來回不同路就會被擋。',['f',['去程｜走防火牆 A','A 記下這條連線','回程｜走防火牆 B','B 沒有紀錄｜丟棄'],'這叫非對稱路由',['','a','w','w']]],
['鏈路聚合',['鏈路聚合（常用的協定是 LACP）把多條實體線路綁成一組邏輯線路。','好處是頻寬加總，而且其中一條斷掉時其他條繼續運作。','兩端的設備都要設定，而且設定要對應。'],'伺服器用兩條 10 Gbps 的線以 LACP 接到交換器。拔掉其中一條，連線不中斷，只是總頻寬減半。','綁兩條不代表單一連線的速度變兩倍。同一條連線的封包只會走其中一條線，總頻寬增加是指很多連線可以分散到不同的線上。','為了避免同一條連線的封包走不同的線而先後順序錯亂，設備會依來源和目的位址之類的資訊，決定某條連線固定走哪一條線。所以連線數愈多、來源愈分散，分攤的效果愈好。','鏈路聚合＝頻寬加總＋備援；單一連線不會變兩倍快。',['c',[['好處','總頻寬增加｜斷一條還能通'],['限制','單一連線｜只走其中一條','off']],'兩端設備都要設定 LACP']]];
LEARN.sec[2]=[
['事件應變',['資安事件應變的順序是：識別、圍堵、根除、復原、檢討。','圍堵是先不讓它擴大；根除是把入侵的管道和殘留物清乾淨；清乾淨之後才復原。','確認主機被入侵時，先把它從網路隔離，但不要關機也不要重灌，等鑑識人員處理。'],'發現一台伺服器有異常連線：把它移到隔離網段、保留現況、通報，並同時檢查其他主機有沒有同樣的跡象。','還沒根除就急著復原，攻擊者留下的後門還在，系統一上線又被打進來。另外，關機會讓記憶體裡的證據全部消失。','每個階段都是下一個階段的前提。沒有圍堵，在你處理的同時攻擊者還在擴散；沒有根除，復原的系統馬上又被入侵；沒有保留證據，就無法知道他是怎麼進來的、拿走了什麼，也無從根除。','識別、圍堵、根除、復原、檢討；被入侵先隔離，不關機不重灌。',['f',['識別','圍堵','根除','復原','檢討'],'順序不能亂：沒清乾淨就復原，會邊修邊被打',['','w','','a','']]],
['攻擊手法',['橫向移動是指攻擊者拿下一台主機之後，在內部網路往其他主機擴散。','攻擊者通常不會一次就打到目標，而是先進來一台，再一步步靠近重要的主機。','防禦的方法是切分網段、限制管理帳號的使用範圍、不讓每台電腦共用相同的本機管理員密碼。'],'攻擊者從一封釣魚信拿下一台一般員工的電腦，再用上面取得的憑證登入檔案伺服器，最後拿到網域控制站。','只防「不要被打進來」是不夠的。要假設總有一台會被拿下，然後讓攻擊者很難從那一台走到下一台。','內部網路的設備之間通常互相信任、限制很少。攻擊者一旦進到內部，就能利用這份信任，用正常的管理工具和偷來的帳號移動，看起來和一般的管理行為很像，不容易被發現。','攻擊者進來一台後會往內擴散；用網段切分和權限限制擋住。',['f',['釣魚信拿下｜一台電腦','取得憑證','登入其他主機｜（橫向移動）','到達重要主機'],null,['w','','w','w']]],
['端點防護',['傳統防毒主要靠特徵比對，擋的是已知的惡意程式。','EDR 會持續記錄端點上的行為，例如哪個程式啟動了什麼、連到哪裡、改了什麼檔案。','所以 EDR 可以發現沒見過的手法，事後也能追查過程，並從遠端隔離受害的電腦。'],'文書軟體啟動了命令列，接著從網路下載檔案。這些動作單獨看都不是病毒，但 EDR 會把這串行為判定為可疑並發出告警。','裝了 EDR 不等於安全。它會產生告警，但需要有人看、有人判斷、有人處理，否則只是多了一套沒人理的系統。','攻擊者愈來愈常利用系統內建的正常工具來做事，沒有任何惡意檔案可以比對。這種情況只能從「行為的組合」看出異常，所以必須先把行為記錄下來，才有東西可以分析。','防毒比對已知特徵，EDR 記錄並分析行為，還能追查和處置。',['c',[['傳統防毒','比對特徵｜擋已知的惡意程式'],['EDR','記錄並分析行為｜可追查、可遠端隔離']],'EDR 的告警要有人看、有人處理']],
['供應鏈安全',['供應鏈攻擊是攻擊者不直接打你，而是去打你信任的廠商或軟體。','典型的例子是廠商的更新伺服器被入侵，客戶安裝了「官方更新」反而被植入惡意程式。','因應的方向是：廠商管理、驗證更新的來源、限制廠商的權限、監控異常行為。'],'公司使用的一套管理軟體被植入後門，並透過正常的更新管道派送到所有客戶。','「這是原廠的更新所以一定安全」不再是可靠的假設。不過這不代表不要更新，而是要搭配其他防護，例如分批派送和行為監控。','直接攻擊一個防護良好的目標很困難，但它信任的廠商不一定有同樣的防護。攻下一家廠商，就能利用既有的信任關係一次進入它所有的客戶，而且是從一個不會被懷疑的管道進來。','供應鏈攻擊：打你信任的廠商，再從正常管道進來。',['f',['攻擊者入侵｜軟體廠商','在更新裡｜植入惡意程式','客戶安裝｜「官方更新」','客戶被入侵'],null,['w','w','','w']]],
['特權帳號',['網域管理員帳號不應該拿來登入一般使用者的電腦。','登入過的電腦會留下憑證，那台電腦如果已經被入侵，憑證就會被偷走。','做法是高權限帳號只在受保護的管理專用主機上使用，日常工作用另一個一般權限的帳號。'],'資訊人員有兩個帳號：一般帳號用來收信和上網；管理帳號只在管理專用的主機上登入，用來維護伺服器。','用網域管理員帳號遠端登入使用者的電腦幫忙處理問題，是很常見也很危險的做法。這等於把整個網域的鑰匙帶到最容易被入侵的地方。','為了讓使用者不用一直重新輸入密碼，系統會把驗證用的資料暫時放在記憶體裡。攻擊者只要取得那台電腦的管理權限，就能把這些資料取出來，直接冒用那個帳號的身分。','網域管理員帳號不登入一般電腦，只在管理專用主機上用。',['c',[['一般帳號','收信、上網｜日常工作'],['管理帳號','只在管理專用主機｜維護伺服器'],['不可以','用管理帳號｜登入使用者電腦','w']]]],
['防禦架構',['縱深防禦是疊上好幾層不同的防護，一層被突破，還有下一層。','這些防護包括：網路邊界、端點、身分與權限、監控、備份。','每一層要用不同的方法，才不會被同一種手法一次全部穿過。'],'釣魚信通過了郵件過濾，但使用者電腦的端點防護攔下了附件；就算沒攔下，他的帳號權限有限，重要資料也還有備份。','「我們有防火牆了」不是完整的防護。防火牆只處理網路邊界，從釣魚信、隨身碟或合法帳號進來的威脅它都看不到。','任何一種防護都有失效的時候：設定錯誤、出現新的手法、人為疏失。如果整體安全只靠一道防護，它失效的那一刻就全盤皆輸。多層防護是讓攻擊者必須連續突破好幾道，每一道都增加他被發現的機會。','縱深防禦：多層、不同方法，一層破了還有下一層。',['f',['網路邊界','端點防護','身分與權限','監控','備份'],'每一層都可能失效，所以不只靠一層']],
['威脅情資',['IoC（入侵指標）是可以用來判斷是否被入侵的線索。','常見的有：惡意的 IP 位址、網域名稱、檔案的雜湊值。','拿到 IoC 之後，要回頭查自己的紀錄：有沒有電腦連過這個位址、有沒有這個雜湊值的檔案。'],'收到情資通報某個網域是惡意程式的中繼站。查詢 DNS 和代理伺服器的紀錄，發現上週有一台電腦連過，立刻展開調查。','IoC 很容易過期，攻擊者換一個 IP 或重新編譯檔案就失效了。它適合用來查「過去有沒有被打過」，不能當成唯一的防護。','別人被攻擊時留下的痕跡，可以用來檢查自己。但這個方法有個前提：你必須保存了夠久的紀錄，才有東西可以回頭比對。沒有紀錄，再好的情資也無從使用。','IoC 是入侵的線索（IP、網域、雜湊值），拿到要回頭查紀錄。',['c',[['惡意 IP','查防火牆｜連線紀錄'],['惡意網域','查 DNS｜代理伺服器紀錄'],['檔案雜湊值','查端點上｜有沒有這個檔案']]]]];

['鎖定與並行',['交易修改資料時會鎖住它，其他要動同一筆資料的交易必須等待。','死結是兩個交易各自鎖住一筆資料，又都在等對方手上的那一筆。資料庫會偵測到並強制取消其中一個。','交易開了卻沒有結束，會一直握著鎖，其他人的操作就卡住。'],'有人在管理工具裡開了交易、修改資料，沒有提交就去開會，結果整個系統的相關功能都卡住，直到找到那個連線並結束它。','系統突然卡住不一定是資料庫效能不足。很多時候是有一個交易握著鎖沒放，其他人都在排隊。','鎖是為了避免兩個人同時改同一筆資料而互相蓋掉。代價是有人要等。交易的時間愈長，別人等得愈久，所以交易要盡量短，而且不要在交易進行中等人輸入或去做別的事。程式存取資料的順序固定，可以減少死結。','交易要短、要結束；死結會被資料庫取消其中一個，程式要能重試。',['c',[['交易沒結束','一直握著鎖｜別人卡住','w'],['死結','互相等對方｜資料庫取消其中一個','w'],['做法','交易要短｜存取順序固定｜能重試']]]],
['查詢調校',['查詢慢的時候，先看執行計畫（<code>EXPLAIN</code>），了解資料庫實際上怎麼執行。','執行計畫會顯示有沒有用到索引、是不是整張表掃、預估處理多少筆。','另一個常見問題是 N+1 查詢：先查出 N 筆，再用迴圈一筆一筆各查一次。改用 JOIN 或一次批次查回來。'],'程式列出 100 筆訂單要 5 秒。檢查後發現它查了 101 次資料庫，改成一個 JOIN 之後只查 1 次，不到 0.1 秒。','不看執行計畫就憑感覺加索引，常常加了沒用到，還拖慢寫入。N+1 查詢在測試時資料少看不出來，上線後資料一多就爆發。','同一句 SQL，資料庫可以有很多種執行方式，它會依統計資訊挑一種。調校就是先看它挑了哪一種、為什麼慢，再對症處理。N+1 的問題則在於每一次查詢都有固定的來回成本，一百次小查詢遠比一次大查詢慢。','查詢慢先看 EXPLAIN；迴圈裡查資料庫要改成 JOIN 或批次。',['c',[['N+1 查詢','查 1 次清單｜再查 N 次明細','w'],['改用 JOIN','1 次查回｜全部資料']],'調校第一步是看執行計畫，不是猜']],
['複寫與高可用',['複寫是把資料即時同步到另一台，目的是主機故障時另一台可以接手。','誤刪、錯誤的更新、程式的錯誤，也會即時同步過去，兩邊一起壞。','所以有複寫還是要備份。'],'有人不小心執行了沒有條件的 DELETE，不到一秒，備援資料庫上同一張表也被清空了。最後是靠備份還原。','「我們有兩台資料庫互相同步，所以不用備份」和「有 RAID 不用備份」是同一種誤解。','複寫的工作是讓另一台和主機保持一模一樣，它不判斷這個變更是不是你要的。備份保存的是過去某個時間點的狀態，所以才能回到出錯之前。兩者解決的是不同的問題：一個管硬體故障，一個管資料錯誤。','複寫防主機故障，備份防資料錯誤；有複寫還是要備份。',['c',[['主機故障','複寫 ✓｜另一台接手'],['誤刪資料','複寫 ✕｜錯誤一起同步','w'],['誤刪資料','備份 ✓｜回到出錯之前']]]],
['備份還原',['時間點還原是把資料庫還原到指定的某一個時刻，例如誤刪之前的那一分鐘。','做法是先還原完整備份，再把交易紀錄依序重播到指定的時間點。','所以交易紀錄的備份必須連續不中斷，中間缺一段就只能還原到缺口之前。'],'下午 2:15 誤刪資料。先還原凌晨的完整備份，再把交易紀錄重播到 2:14，損失的只有那一分鐘內的異動。','只做每天一次的完整備份，最多只能回到昨天晚上，今天一整天的資料都會遺失。','資料庫每一筆異動都會先寫進交易紀錄。完整備份是某個時刻的快照，交易紀錄則是快照之後發生的每一件事。有了兩者，就可以把資料庫「重播」到之後的任何一個時刻。','時間點還原＝完整備份＋連續的交易紀錄。',['f',['凌晨｜完整備份','交易紀錄｜持續備份','14:15｜誤刪','還原備份後｜重播到 14:14'],'交易紀錄的備份不能斷',['a','a','w','']]],
['索引',['每一個索引都要佔空間，而且每次新增、修改、刪除資料時都要一起更新。','索引太多，寫入會明顯變慢。','索引要針對實際常用的查詢來建，沒有在用的要定期找出來移除。'],'一張表有二十幾個索引，每新增一筆資料要更新二十幾個地方。檢查使用統計後發現一半以上從來沒被用過，移除之後寫入快了很多。','「多建幾個索引以防萬一」是錯的。沒用到的索引只有成本、沒有效益。','索引是為了讀取而預先做的整理工作，這份整理要在每次寫入時維持。讀多寫少的表可以多建一些；寫入頻繁的表，每多一個索引都是實際的負擔，所以要看這張表主要是被讀還是被寫。','索引不是愈多愈好：加快讀取、拖慢寫入，沒用的要清掉。',['c',[['索引少','查詢可能慢｜寫入快'],['索引剛好','常用查詢都快｜寫入可接受'],['索引太多','寫入很慢｜佔空間','w']]]],
['資料保護',['測試環境的權限和防護通常比正式環境寬鬆。','把含有個資的正式資料直接複製到測試環境，等於多了一個管得比較差的外洩點。','要先把個資欄位遮罩，或換成格式相同的假資料，再放進測試環境。'],'要把正式資料庫複製到測試環境之前，先用遮罩程序把姓名、電話、身分證字號換成假資料，資料筆數和關聯維持不變。','「只是測試環境，而且只有內部的人用」不是理由。測試環境常常開放給廠商、沒有稽核紀錄、密碼也比較簡單。','測試需要的是資料的「形狀」：筆數夠多、格式正確、關聯完整，並不需要知道真正是誰的資料。遮罩保留了形狀、去掉了真實性，測試一樣能做，外洩了也不會傷害到真實的人。','正式資料進測試環境前，個資先遮罩或換成假資料。',['f',['正式資料庫｜含真實個資','遮罩或｜換成假資料','測試環境','外洩也不會｜傷到真實的人'],null,['w','a','','']]]];

['自動化',['冪等是指同一個動作做一次和做很多次，結果都一樣。','自動化腳本具備這個特性，中途失敗時就可以放心重跑。','寫法的原則是「先檢查現況，再決定要不要做」，而不是直接做。'],'建立帳號的腳本先檢查帳號是否已存在，存在就略過。這樣重跑十次，也只會有一個帳號，不會報錯或重複建立。','很多腳本只考慮第一次執行。跑到一半失敗之後再執行，就因為「東西已經存在」而出錯，或是重複新增資料。','自動化環境裡，重複執行很常見：排程重複觸發、網路斷線後重試、有人不確定有沒有跑過就再跑一次。如果腳本描述的是「最後要變成什麼樣子」，而不是「要執行哪些動作」，不管從哪個狀態開始跑，結果都一樣。','冪等：跑一次和跑十次結果一樣，失敗了可以放心重跑。',['c',[['不冪等','重跑會重複建立｜或報錯','w'],['冪等','先檢查現況｜已經做過就略過']]]],
['輸入驗證',['把使用者輸入的文字直接組進系統指令，使用者就能在輸入裡夾帶其他指令。','這叫指令注入。例如輸入 <code>8.8.8.8; rm -rf /</code>，分號後面的會被當成另一個指令執行。','防範方式：驗證輸入的格式，並改用不經過 shell、把參數分開傳遞的呼叫方式。'],'<code>subprocess.run(["ping", "-c", "1", host])</code> 把主機名稱當成單一參數傳入，就算裡面有分號也不會被當成指令。','只過濾分號是不夠的，還有 <code>&amp;&amp;</code>、<code>|</code>、反引號等很多寫法。要從呼叫方式上根本避免，而不是列黑名單。','shell 會解讀字串裡的特殊符號，分號代表「接著執行下一個指令」。把輸入拼進指令字串再交給 shell，等於讓使用者有機會寫指令。改成直接執行程式並把參數逐一傳入，就沒有 shell 來解讀這些符號。','外部輸入不拼進指令；驗證格式，用參數分開傳的方式呼叫。',['t',['# 危險：輸入直接拼進指令字串','os.system("ping -c 1 " + host)','#   host = "8.8.8.8; rm -rf /"  → 多執行一個指令','','# 安全：參數分開傳，不經過 shell','subprocess.run(["ping", "-c", "1", host])']]],
['密碼與金鑰',['金鑰或密碼一旦推上版本控制，就要當作已經外洩。','第一件事是把那把金鑰作廢，換一把新的。','接著才是清理歷史紀錄，並檢查這段時間有沒有被異常使用。'],'不小心把雲端服務的金鑰推到程式碼倉庫。立刻到服務後台撤銷那把金鑰並產生新的，再檢查存取紀錄。','只是再提交一次把那一行刪掉，沒有用。舊的版本裡還看得到，而且公開的倉庫會被自動化工具持續掃描，幾分鐘內就可能被取走。','版本控制的設計就是保留所有歷史。你無法確定在發現之前有誰已經複製了這份歷史。唯一能確定讓外洩的金鑰失去作用的方法，就是讓它失效。','金鑰推上去了：先作廢換新，再清歷史、查紀錄。',['f',['金鑰被推上｜版本控制','立刻作廢｜換新金鑰','檢查｜存取紀錄','清理歷史｜加上掃描'],'刪掉那一行沒有用，歷史紀錄裡還在',['w','a','','']]],
['CI/CD',['CI（持續整合）是程式一有變更，就自動建置並執行測試。','CD（持續交付或部署）是通過測試後，自動部署到各個環境。','目的是減少人工步驟出錯，並且很快知道是哪一次變更造成問題。'],'開發人員提交程式後，系統自動編譯、跑測試、做安全掃描，全部通過才部署到測試環境。','CI/CD 不是「自動上線所以比較危險」。相反地，它讓每次上線都照同一套流程，比手動操作更可預測。前提是測試要寫得夠完整。','手動部署的步驟多，靠人記憶和操作，每次都可能有一點不同。自動化之後流程固定、可以重複。而且因為每次只部署一小部分變更，出問題時要檢查的範圍很小。','CI/CD：一有變更就自動建置、測試、部署。',['f',['提交程式','自動建置','自動測試｜與掃描','自動部署'],'任何一步失敗就停下來並通知',['','','a','']]],
['相依套件',['專案使用的第三方套件，要把確切的版本固定下來，記錄在 lock 檔裡。','這樣每個人、每個環境安裝到的都是同一個版本。','升級套件變成一個有意識、可以測試的決定，而不是不知不覺發生的事。'],'同事的電腦可以執行、你的卻出錯，比對後發現兩人安裝的某個套件版本不同。把 lock 檔納入版本控制之後就一致了。','只寫「需要某某套件」而不指定版本，今天安裝和下個月安裝會得到不同的結果。「昨天還好好的」常常就是這樣來的。','套件會持續發布新版，新版可能改變行為或引入錯誤。套件還會依賴其他套件，一層一層下去有幾十上百個。lock 檔把這整棵樹的每一個版本都記錄下來，才能保證重現同樣的環境。','套件版本要鎖定（lock 檔），每個環境才會一樣。',['c',[['沒鎖版本','每次安裝｜可能不同','w'],['有 lock 檔','每個環境｜都是同一版']],'升級套件要是有意識的決定，並且經過測試']],
['錯誤處理',['呼叫外部服務一定要設定逾時時間。','很多函式庫預設會無限期等下去，對方沒有回應時你的程式就一直卡著。','設了逾時之後，還要決定逾時時怎麼辦：重試幾次、間隔多久、最後失敗要怎麼回報。'],'呼叫外部 API 時設定 5 秒逾時、最多重試 3 次。對方故障時，程式會在十幾秒內回報錯誤，而不是永遠卡住。','沒設逾時的程式平常完全正常，直到某一天對方變慢。這時候等待中的連線愈積愈多，最後連自己的服務都被拖垮。','每一個等待中的呼叫都佔用著資源：一條執行緒、一個連線。對方沒回應而你又無限等待，這些資源就不會釋放。新的請求持續進來，資源很快耗盡，於是別人的故障變成了你的故障。','呼叫外部服務一定要設逾時，並想好逾時後怎麼辦。',['c',[['沒設逾時','對方卡住｜你也跟著卡住','w'],['有設逾時','幾秒後放棄｜重試或回報錯誤']]]],
['程式碼審查',['程式碼審查是在合併之前，請另一個人看過修改的內容。','主要價值是多一雙眼睛找出問題，以及讓團隊成員知道彼此改了什麼。','審查的重點是邏輯、安全性和可維護性；格式這類問題交給工具自動檢查。'],'審查時同事發現新增的查詢是把輸入直接拼進 SQL，在上線前就改成參數化查詢。','審查不是在挑毛病或評斷人。每次要審查的修改也不要太大，幾千行的變更沒有人能認真看完。','寫的人知道自己想做什麼，讀程式時會自動補上腦中的假設，所以看不到自己的盲點。另一個人沒有這些假設，只能照程式實際寫的內容理解。審查同時也讓知識擴散，不會只有一個人懂某一段程式。','上線前讓另一個人看過：找問題，也分享知識。',['f',['開分支｜完成修改','提出合併請求','同事審查｜提出意見','修正後合併'],null,['','','a','']]],
['執行環境',['「在我的電腦可以跑，到伺服器就出錯」的根源是環境不一致：版本、設定、安裝的套件不同。','解決方向是讓開發、測試、正式環境盡量一樣。','容器把程式和它需要的執行環境一起打包，所以到哪裡執行都一樣。'],'開發時用的是某個版本的執行環境，伺服器上卻是舊版。改用容器之後，開發和正式環境執行的是同一個映像檔。','容器不是虛擬機，它和主機共用作業系統核心，所以比較輕巧。另外，用了容器不代表不用管安全，映像檔裡的套件一樣要更新。','程式能不能正確執行，取決於它周圍的一大堆東西：語言版本、函式庫、設定檔、環境變數。任何一項不同都可能出錯。與其在每台機器上努力維持一致，不如把這整套東西連同程式一起封裝成一個可以搬動的單位。','環境不一致是「我這邊可以跑」的根源；容器把環境一起打包。',['c',[['沒有容器','每台機器的環境｜各自安裝、容易不同','w'],['使用容器','程式和環境｜一起打包、到處一樣']]]]];

['比較差異',['同一套系統有人正常、有人異常，這個差別本身就是最好的線索。','做法是比較兩群人的差異：網段、軟體版本、連到哪一台伺服器、使用的功能。','找出「異常的都有、正常的都沒有」的那個條件，範圍就大幅縮小。'],'一半的人說系統很慢。整理之後發現慢的人都被分配到同一台應用伺服器，那台的記憶體快用完了。','有好有壞時，不要只盯著壞的那一邊看。把好的一邊當成對照組，才看得出差別在哪裡。','如果系統本身有問題，應該所有人都受影響。只有一部分人受影響，代表有某個條件把他們區分開來，問題就藏在這個條件裡。比較差異是在找這個區分的條件。','有好有壞：比較兩群人差在哪。',['c',[['慢的一群','同一台伺服器？｜同一個網段？｜同一個版本？','w'],['正常的一群','當成對照組']],'找出「慢的都有、正常的都沒有」的條件']],
['恢復與調查',['線上服務大規模中斷時，恢復服務優先於查明原因。','但是在重開機或回復之前，要先把證據留下來：log、錯誤畫面、當下的系統狀態。','服務恢復之後，再用保留下來的資料調查原因。'],'網站掛了。先花一分鐘把錯誤紀錄和記憶體使用狀況存下來，再重新啟動服務，恢復後用這些資料找出是記憶體洩漏。','兩種極端都不對：堅持查出原因才處理，使用者要等很久；直接重開機什麼都沒留，事後完全無從查起，下次還會再發生。','重開機會清掉記憶體裡的狀態，log 也可能被新的紀錄蓋掉，所以證據只有在處理之前的那一刻拿得到。保存證據通常只要一兩分鐘，卻決定了事後能不能找到根因。','先留證據，再恢復服務，之後才調查。',['f',['服務中斷','先保存｜log 和現況','恢復服務','事後用證據｜調查原因'],'保存證據通常只要一兩分鐘',['w','a','','']]],
['無法重現',['問題無法重現，但使用者確定發生過，不能就此結案。','做法是先做好準備，讓下次發生時能抓到資料。','例如把紀錄的詳細程度調高、加上監控、設定封包擷取或效能紀錄。'],'使用者說系統偶爾會跳出錯誤，但測試時都正常。把那個功能的紀錄等級調高，三天後再次發生，紀錄裡就有完整的錯誤內容。','「我這邊試都正常，應該是你操作有問題」是最傷使用者信任的回答。重現不了只代表你還不知道觸發的條件。','很多問題只在特定條件的組合下才發生，例如特定的資料、同時上線的人數、某個時間點的排程。這些條件在測試時很難湊齊。既然無法主動重現，就改成被動等待，並確保它出現時留下足夠的資料。','重現不了就先設好紀錄和監控，等它下次出現。',['f',['無法重現','調高紀錄｜詳細程度','加上監控｜或擷取','下次發生｜就抓到資料']]],
['變因控制',['同時做了好幾項變更之後出問題，要一次退回其中一項，看問題有沒有消失。','這樣才能確定是哪一項造成的。','更好的做法是一開始就不要把不相關的變更排在同一次。'],'昨晚同時更新了應用程式並調整了防火牆規則，今早系統異常。先退回防火牆規則，問題還在；再退回應用程式，問題消失。','一次把所有變更都退回，系統是恢復了，但你仍然不知道原因，之後重新上線時還是會遇到同樣的問題。','每多一項變更，可能的原因就多一個，而且變更之間還可能互相影響。一次只動一項，結果的變化就只能歸因於那一項。這也是為什麼變更管理會要求把變更拆開、分次執行。','多項變更後出事：一次退一項，才知道是誰。',['f',['退回變更甲','問題還在？','再退回變更乙','問題消失｜＝原因是乙']]],
['監控盲點',['監控只能看到有設定監控的項目。','CPU 和記憶體都正常，不代表系統正常；瓶頸可能在磁碟讀寫、資料庫鎖定、網路或外部服務。','使用者說慢就是事實，要從他的操作開始，一段一段往後端量測。'],'監控畫面一片綠燈，但使用者抱怨查詢要等二十秒。從使用者的請求一路追下去，發現時間都花在等資料庫的鎖。','「監控顯示正常，所以沒問題」是錯的。監控是你事先猜想會出問題的地方，實際出問題的地方常常不在其中。','主機層級的監控看的是資源用量，但使用者感受到的是「一個操作要等多久」。兩者之間隔了很多層，任何一層變慢都可能不反映在資源用量上。所以除了看資源，也要直接量測使用者的操作花了多少時間。','監控綠燈不代表沒事；以使用者的體驗為準，一段一段量。',['f',['使用者操作','網頁伺服器','應用程式','資料庫｜外部服務'],'每一段各花多少時間？瓶頸可能在沒被監控的那一段']],
['根因分析',['「五個為什麼」是對每一個答案再問一次為什麼，從表面的現象一路往下追。','目的是找到真正該改的地方，通常是某個流程或機制的缺口。','追到「改了這裡，同類的問題就不會再發生」的那一層為止。'],'硬碟滿了 → 為什麼？log 沒清 → 為什麼？沒設輪替 → 為什麼？建置檢查表沒有這一項。把這一項加進檢查表，之後新建的主機都不會漏。','追到「某人疏忽了」就停下來是不夠的。人會疏忽是必然的，要再問：為什麼流程沒有擋住這個疏忽？','表面的原因修掉了，產生它的那個缺口還在，換一台主機、換一個人還是會再發生。往下追到流程或機制的層級，修一次可以防止整類的問題。','連問為什麼，追到流程的缺口為止。',['f',['硬碟滿了','log 沒清','沒設輪替','檢查表｜沒這一項'],'改檢查表才是根本，之後新建的主機都不會漏',['w','','','a']]],
['事後檢討',['重大事件結束後要開檢討會，原則是對事不對人。','目標是找出流程和機制上的漏洞，而不是找出該負責的人。','產出要有具體的改善項目、負責人和完成期限。'],'檢討會整理出事件的時間軸，討論「哪個環節可以更早發現」和「為什麼這個錯誤的操作沒有被流程擋下來」。','一旦檢討變成究責，大家為了自保就不會說出完整的經過，真正的原因反而被藏起來，下次還會再發生。','事故幾乎都是多個因素疊加的結果，當事人是在當時的資訊和壓力下做出當下看起來合理的決定。換一個人在同樣的處境多半也會犯同樣的錯，所以要改的是讓人容易犯錯的環境和流程。','事後檢討對事不對人：改流程，不是找人負責。',['c',[['究責','大家不敢講實話｜原因被藏起來','w'],['對事不對人','找出流程漏洞｜定出改善項目']]]],
['臨時解法',['為了先撐住而採用的臨時做法，一定要記錄下來並開一張追蹤單。','追蹤單上要寫明這是臨時解法、它在做什麼，以及要找出真正原因的後續工作。','設定期限，並在真正的原因解決之後把臨時解法移除。'],'為了讓服務不中斷，先設排程每小時重啟一次。同時開單追查記憶體洩漏，修正後把那個重啟排程移除。','臨時解法最常見的結局是變成永久的。過了一年沒有人記得為什麼要每小時重啟，也沒有人敢把它拿掉。','臨時解法會掩蓋問題，讓它看起來已經解決，於是大家的注意力就轉走了。但根因還在，而且這個臨時做法本身也成為系統的一部分，將來它失效或和別的變更衝突時，會非常難查。','臨時解法要記錄、開單追蹤、設期限，之後移除。',['f',['臨時解法｜先撐住','記錄並｜開追蹤單','找出並修正｜根因','移除｜臨時解法'],null,['w','a','','']]]];

['服務水準',['SLA（服務水準協議）是把服務要達到的標準寫成具體的數字。','常見的項目有：可用率、多久之內回應、多久之內修復。','有了數字，雙方對「多快算快」才有共同的標準，也才能衡量有沒有做到。'],'約定「重大異常 30 分鐘內回應、4 小時內恢復」，每個月統計實際達成的比率，沒達標就檢討原因。','可用率 99.9% 聽起來很高，換算起來一年仍然允許大約 8.8 小時的停機。訂數字之前要先算清楚它代表什麼。','沒有明確的標準時，使用者認為「應該馬上處理」，資訊單位認為「已經很快了」，雙方永遠沒有交集。把期待變成可以量的數字，討論才能從感受變成事實。','SLA 把「服務好不好」變成可以量的數字。',['c',[['可用率','例如 99.9%｜一年約可停 8.8 小時'],['回應時間','多久內｜有人開始處理'],['修復時間','多久內｜恢復服務']]]],
['變更管理',['變更申請一定要寫回復計畫：失敗的時候怎麼退回原狀。','回復計畫要包括：退回的步驟、需要多少時間、由誰決定要退、判斷的時間點。','重要的變更，回復步驟也要事先測試過。'],'資料庫升級排在凌晨 1 點到 4 點。計畫寫明：3 點前如果還沒完成就啟動回復，回復需要 40 分鐘，由值班主管決定。','「這個變更很簡單不會失敗」所以沒寫回復計畫，是最常見的事故前兆。沒有計畫，失敗時只能硬著頭皮往前修，維護時間就會超過。','變更進行到一半出問題時，人處在壓力之下，很難冷靜判斷該繼續還是該退。事先定好判斷的時間點和條件，等於在冷靜的時候先替那個當下的自己做好決定。','變更要有回復計畫：怎麼退、要多久、誰決定、何時判斷。',['c',[['怎麼退','具體步驟'],['要多久','回復所需時間'],['誰決定','有權責的人'],['何時判斷','最晚的決定時間點']]]],
['進度回報',['重大異常處理期間，要照固定的頻率對外更新，例如每 30 分鐘一次。','即使沒有新的進展，也要說明目前正在做什麼、下一次更新是什麼時候。','指定一個人專門負責對外溝通，讓處理問題的人可以專心。'],'「14:30 更新：仍在排查中，已排除網路因素，目前正在檢查資料庫。下次更新時間 15:00。」','「沒有進展所以不用更新」是錯的。沒有消息會被解讀成沒有人在處理，接著就是不斷的電話和訊息，反而干擾處理。','受影響的人需要決定自己該怎麼辦：要不要改用人工作業、要不要通知自己的客戶。固定頻率的更新讓他們知道什麼時候會有新資訊，可以安排自己的事，不用一直來問。','重大異常固定頻率更新，沒進展也要報，並預告下次時間。',['f',['現在的狀況','已排除什麼','正在做什麼','下次更新｜的時間'],'每次更新都包含這四項']],
['權限與流程',['熟識的同事私下請你幫忙，可以幫，但要補上報修紀錄。','並且請對方下次走正式的流程。','紀錄讓工作量看得見，也讓之後處理同一個問題的人查得到。'],'同事傳訊息說他的帳號登不進去。幫他處理好之後，自己補開一張案件記錄原因和處理方式，並提醒他下次從報修系統送出。','「只是小事，幫一下就好不用記錄」累積起來，就是資訊單位很忙，但從紀錄上看不出來。而且同一個問題反覆發生也沒有人會發現。','沒有紀錄的工作，在管理上等於不存在：主管評估人力時看不到、分析哪類問題最常發生時統計不到、日後同一台設備再出問題時查不到之前做過什麼。','私下的請託可以幫，但要補紀錄。',['f',['同事私下｜請你幫忙','先幫他處理','自己補上｜報修紀錄','請他下次｜走流程'],null,['','','a','']]],
['需求釐清',['使用者提出的通常是他想到的「解法」，不一定是他真正的「需求」。','先問他要用這個來做什麼、想解決什麼問題。','了解目的之後，有時候現有的功能就能解決，有時候他需要的其實是另一樣東西。'],'使用者要求加一個匯出按鈕。問了之後才知道他每個月要把資料交給會計對帳。直接做一份自動寄送的對帳報表，比匯出再手動整理更符合需要。','使用者說什麼就照做什麼，常常做完之後才發現沒有解決他的問題，然後再改一次。','使用者只知道自己的工作和他看得到的系統功能，所以會用他知道的東西拼出一個解法。資訊人員知道系統還能做什麼，但不知道使用者的工作。把兩邊的資訊合起來，才找得到最好的做法。','先問「你要拿它做什麼」，再決定怎麼做。',['f',['使用者說｜要某個功能','問他｜要拿來做什麼','找到｜真正的問題','提出更合適｜的做法'],null,['','a','','']]],
['跨單位協作',['問題落在兩個單位之間時，不要讓使用者在中間傳話。','主動找對方一起看現象，用實際的測試結果確認問題在哪一段。','先確認問題在哪裡，再談由誰處理。'],'系統單位和網路單位各說各話。兩邊的人一起到使用者的座位，同時從兩端測試，十分鐘就確定是防火牆規則擋住了。','「不是我們的問題」就算是事實，對使用者也沒有任何幫助。他要的是問題解決，不是知道該怪誰。','每個單位只看得到自己負責的那一段，用自己的資料都能證明「我這邊正常」。只有把兩邊的資料放在一起、同時觀察同一次操作，才看得到中間斷在哪裡。','跨單位的問題：一起看、一起測，不讓使用者傳話。',['c',[['互相推','使用者當傳話筒｜拖好幾天','w'],['一起測','兩邊同時看｜很快分出是哪一段']]]],
['風險溝通',['被要求開一個有資安風險的例外時，你的責任是把風險講清楚，並提出比較安全的替代做法。','如果對方了解風險後仍然要執行，請有權責的人正式核准並留下紀錄。','例外要設定期限，到期重新檢視。'],'主管要求把一台主機直接對外開放。說明這樣會被持續掃描和攻擊，建議改用 VPN；若仍要開放，請依例外流程簽核，並限定來源位址和期限。','直接拒絕和默默照做都不對。前者沒有解決對方的需要，後者是你個人替組織承擔了一個沒有人知道的風險。','要不要承擔某個風險，是業務和管理上的決定，應該由負得起這個責任的人來做。資訊人員的角色是提供足夠的資訊讓他做決定，並把這個決定記錄下來，讓它是看得見、有期限、可以追蹤的。','有風險的要求：講清楚風險、給替代方案、請有權責的人核准。',['f',['說明風險','提出｜替代方案','仍要執行｜就正式核准','設定期限｜到期重新檢視'],null,['','a','','']]],
['知識文件',['某個系統只有一個人會維護，是組織的風險。','預防的方法是把做法寫成文件，並且安排其他人實際操作。','只有文件不夠，要讓第二個人真的照著文件做過一次，才知道文件能不能用。'],'每一季安排另一位同事依照文件執行一次備份還原，執行中發現文件漏掉的步驟就當場補上。','「文件有寫」不等於「別人會做」。沒有人照著做過的文件，通常缺了作者認為理所當然而沒有寫的步驟。','熟練的人做事時有很多步驟是不經思考就完成的，所以寫文件時不會想到要寫下來。只有另一個不熟的人照著做，卡住的地方才會顯現。實際操作同時也讓第二個人真的具備處理的能力。','只有一個人會是風險：寫成文件，並讓別人實際做一次。',['f',['只有一個人會','寫成文件','另一個人｜照著實際操作','補上文件｜缺漏的步驟'],null,['w','','a','']]]];

['事件通報',['資通安全事件依嚴重程度分成第一級到第四級。','第一級、第二級事件，要在知悉後 72 小時內完成損害控制或復原。','第三級、第四級屬於重大事件，要在知悉後 36 小時內完成。','通報本身一律是知悉後 1 小時內；完成損害控制或復原之後，一個月內要送交調查、處理及改善報告。'],'週五晚上 8 點確認發生第三級事件：9 點前要完成通報，週日早上 8 點前要完成損害控制或復原。','時限不會因為遇到假日而順延。另外，事件的等級在處理過程中如果有變化，要依規定更新通報。','等級愈高代表影響愈大，例如涉及核心業務或機敏資料，所以要求更快控制住。把通報和復原分成兩個時限，是因為通報要盡早讓主管機關掌握狀況，而復原需要實際的處理時間。','通報 1 小時；復原：一、二級 72 小時，三、四級 36 小時；報告一個月。',['c',[['通報','知悉後｜1 小時內'],['第一、二級','72 小時內｜損害控制或復原'],['第三、四級','36 小時內｜損害控制或復原','w'],['報告','完成後｜1 個月內']]]],
['風險管理',['採取控制措施之後還是會剩下一些風險，稱為殘餘風險。','殘餘風險要讓管理階層知道，由他們確認並決定是否接受。','這個決定要留下紀錄，並且定期重新檢視。'],'舊系統無法修補，加上網路隔離之後風險降低但沒有消失。把剩下的風險寫成報告，由主管簽核接受，一年後重新評估。','「已經做了控制措施，所以沒有風險了」是錯的。風險不會歸零，沒有被明確接受的殘餘風險，等於沒有人負責。','風險管理的目的不是消除所有風險，而是讓組織清楚知道自己承擔了哪些風險，並且這是有人做過決定的結果。殘餘風險沒有經過確認，就會變成「大家都以為有人處理了」的灰色地帶。','殘餘風險要由管理階層確認、決定接不接受，並留下紀錄。',['f',['原本的風險','採取｜控制措施','剩下的｜殘餘風險','管理階層｜確認並接受'],null,['w','','','a']]],
['ISO 27001',['適用性聲明（SoA）是 ISO 27001 要求的文件。','內容是列出附錄 A 的每一項控制措施：有沒有採用、採用或排除的理由。','它把風險處理的結果對應到控制措施，稽核員會拿它來對照實際的執行狀況。'],'SoA 裡某一項寫著「不適用，本公司沒有自行開發軟體」。稽核員會確認是不是真的沒有任何開發活動。','SoA 不是把 93 項全部勾「適用」就好。寫了適用就必須有對應的做法和紀錄，被稽核時要拿得出來。','標準不規定每個組織都要做一樣的事，而是要求組織依自己的風險決定要做什麼。SoA 就是這個決定的正式紀錄，讓外部的人可以看出這個組織的資安管理涵蓋了哪些範圍、哪些沒有以及理由。','SoA：附錄 A 每一項有沒有做、為什麼。',['c',[['採用','寫明做法｜要有紀錄佐證'],['不採用','寫明排除的理由｜理由要站得住','off']],'稽核員會拿 SoA 對照實際狀況']],
['稽核',['內部稽核需要獨立性，稽核員不能稽核自己負責的業務。','稽核發現「不符合」時，只把被抓到的那一筆修好叫做「改正」。','「矯正措施」是找出為什麼會發生，並確認其他地方有沒有同樣的問題，讓它不再發生。'],'稽核發現某台伺服器沒有定期清查帳號。除了清查這一台，還要查出是清查流程沒有涵蓋新建的主機，修改流程並補查其他主機。','把被開出來的那一項修好就回覆「已完成矯正」，下一次稽核很可能在另一台主機上發現同樣的問題。','稽核是抽樣的，被抓到的那一筆只是剛好被抽到。它代表的是流程有缺口，同樣的缺口很可能也存在於沒被抽到的地方。只修那一筆，缺口還在，問題會持續產生。','不稽核自己的業務；矯正是處理原因，不只是修那一筆。',['c',[['改正','修好被發現的｜那一筆'],['矯正措施','找出原因｜確認其他地方｜防止再發生','a']],'兩個都要做']],
['個人資料保護法',['把個資委託給廠商處理，委託的公司仍然要負責。','個資法第 4 條：受委託蒐集、處理或利用個資的人，在本法適用範圍內視同委託機關。','委託的一方要對受託的廠商做適當的監督，例如約定處理的範圍、安全措施和事故通報。'],'公司把會員系統委外維運，廠商端發生外洩。對會員來說，要負責的是這家公司；公司也要檢視當初對廠商的監督有沒有做到。','「資料是在廠商那邊外洩的，不關我們的事」在法律上不成立。','當事人是把資料交給這家公司，不是交給廠商。如果委託出去就可以免責，等於讓公司可以藉由委外來規避保護個資的義務。所以法律把廠商的行為當成公司自己的行為來看待。','個資委外，責任還在自己；廠商視同委託機關，要監督。',['f',['公司委託｜廠商處理個資','廠商視同｜委託機關','廠商端外洩','公司仍要｜負責'],'委託方要監督：範圍、安全措施、事故通報',['','','w','w']]],
['營運持續',['RTO（復原時間目標）是服務中斷後，要在多久之內恢復。','RPO（復原點目標）是最多可以接受遺失多久的資料。','RPO 決定備份的頻率；RTO 決定備援要做到什麼程度。'],'某系統的 RPO 是 1 小時、RTO 是 4 小時：至少每小時要備份一次，而且要有辦法在 4 小時內把服務恢復。','RTO 和 RPO 不是由資訊單位自己訂的，而是由業務單位評估能承受多大的損失之後決定。數字訂得愈小，需要的成本愈高。','中斷造成兩種損失：服務停擺期間無法作業，以及最後一次備份之後的資料遺失。這兩種損失要分開衡量，因為解決的方法不同：一個靠更快的復原機制，一個靠更頻繁的備份或複寫。','RTO：多久要恢復；RPO：最多丟多久的資料。',['c',[['RPO','最多遺失多久的資料｜→ 決定備份頻率'],['RTO','多久內恢復服務｜→ 決定備援程度']],'由業務單位依可承受的損失來決定']],
['職業倫理',['負責採購評估的人，不能接受投標廠商的招待和餽贈。','遇到這種情況要婉拒，並依公司規定向主管報備。','如果自己和廠商有私人關係，要主動揭露並迴避。'],'廠商在評選期間邀請吃飯。回覆：「謝謝，但評選期間不方便，有需要說明的地方請在正式的會議上提出。」並向主管報備。','「我不會因此受影響」不是重點。重點是別人無從確認你有沒有受影響，採購結果的公信力就會受到質疑。','採購的公正性不只要實際上做到，還要讓人看得出來做到了。接受招待之後，不管你最後怎麼評，落選的廠商和其他同事都有理由懷疑。迴避和揭露保護的是採購案，也是你自己。','評選期間廠商的招待和禮品：婉拒並報備。',['f',['廠商邀約｜或送禮','婉拒','向主管報備','有私人關係｜主動迴避'],null,['w','a','','']]]];

['電力與 UPS',['伺服器的兩顆電源供應器，要分別接到不同的電力迴路，最好是不同的 UPS。','這樣其中一路斷電或 UPS 故障時，另一路還能供電。','兩顆電源都接到同一路，那一路一跳電就全部斷電，等於沒有備援。'],'機櫃兩側各有一排電源插座，分別來自 A、B 兩套 UPS。每台伺服器的兩顆電源一顆接 A、一顆接 B。','設備有雙電源不等於有電力備援，要看後面接到哪裡。另外，單一路的負載不能超過一半，否則另一路斷電時，剩下的這一路會過載跳電。','備援的意義在於「兩個元件不會因為同一個原因同時失效」。兩顆電源接同一個迴路，它們就共用了同一個失效原因。所以每一層都要分開：電源、插座、迴路、UPS，愈往上游分開，能承受的故障種類愈多。','雙電源要接不同迴路；每一路負載不超過一半。',['c',[['兩顆接同一路','那一路斷電｜就全滅','w'],['分接 A、B 兩路','一路斷電｜另一路撐住']],'每一路的負載不能超過一半']],
['備援設計',['N 是正常運作所需要的數量。N+1 是多準備一台當備援。','這樣任何一台故障或停機保養時，剩下的數量仍然足夠。','2N 是每一台都有一台對應的備援，也就是準備兩套完整的系統。'],'機房需要三台冷氣才夠冷，採用 N+1 就是安裝四台。其中一台故障時，其餘三台仍然足夠。','N+1 只能承受一台故障。保養其中一台的期間如果又壞一台，就不夠了，所以保養要排在風險比較低的時段。','設備一定會故障，也一定需要停機保養。如果數量剛好等於需求，任何一次故障或保養都會造成能力不足。多出來的那一台就是讓系統可以在少一台的情況下照常運作。備援程度愈高成本愈高，要依可以承受的風險來選。','N+1：需要 N 台就裝 N+1 台；2N 是準備兩套。',['c',[['N','剛好夠用｜壞一台就不夠','w'],['N+1','多一台備援｜可以壞一台'],['2N','兩套完整系統｜可以壞一整套']]]],
['儲存效能',['儲存設備除了容量，還要看效能。','IOPS 是每秒可以完成的讀寫次數；延遲是每一次讀寫要等多久。','資料庫這類系統需要的是高 IOPS 和低延遲，容量夠不代表速度夠。'],'資料庫很慢，儲存空間還剩六成。檢查後發現讀寫延遲高達幾十毫秒，原因是資料放在大容量但慢速的硬碟上，改放到 SSD 之後恢復正常。','採購儲存設備只看「多少 TB」是不夠的。同樣的容量，用慢速硬碟和用 SSD 組成，效能可以差上百倍。','資料庫的工作型態是大量、零散的小筆讀寫，每一筆都要等儲存設備回應。傳統硬碟每次讀寫都要移動讀寫頭，每秒能做的次數有限；這個上限和容量大小無關，而是由磁碟類型、數量和陣列配置決定。','儲存不只看容量，還要看 IOPS 和延遲。',['c',[['容量','能放多少資料'],['IOPS','每秒能讀寫幾次'],['延遲','每次讀寫要等多久']],'資料庫需要高 IOPS、低延遲']],
['產品生命週期',['設備過了原廠的支援年限，故障時可能沒有零件，發現漏洞也不會有修補。','不一定要立刻汰換，但要評估風險並排入汰換計畫。','汰換之前的過渡期，可以準備備品、延長維護合約，並把風險讓管理階層知道。'],'核心交換器明年終止支援。今年先編列預算、採購一台同型號的備品，並把這個風險列入風險登錄表。','「現在還好好的，壞了再說」對核心設備來說風險很高。等壞了才採購，停機時間是以星期計算的。','設備的故障率會隨使用年限上升，而原廠支援卻在這時候結束，兩件事疊在一起，風險最高。汰換需要預算、採購和施工，時間很長，所以必須在還能正常運作的時候就開始規劃。','過了支援年限：評估風險、排汰換、過渡期備好備品。',['f',['盤點支援｜到期日','評估風險','排入汰換計畫｜編預算','過渡期：備品｜延長維護'],'風險要讓管理階層知道']],
['虛擬化',['記憶體超額配置是指分配給所有虛擬機的記憶體總和，超過實體主機實際擁有的。','平常沒事是因為虛擬機不會同時用滿；一旦同時用滿，主機記憶體不足，上面的所有虛擬機一起變慢。','快照不能當成備份。它和虛擬機放在同一套儲存上，而且依賴原本的磁碟檔。'],'更新系統前先建立快照，更新完確認沒問題就刪除。快照留了三個月沒刪，結果佔掉大量空間並拖慢虛擬機。','「有快照就不用備份」是錯的，儲存設備一壞兩者一起消失。快照是變更前的短期保險，用完就要刪。','超額配置是在賭使用的尖峰不會同時發生，賭贏可以省硬體，賭輸就是整台主機上的系統一起出問題。快照則是記錄「從那一刻起的變化」，原本的磁碟檔損壞時，快照本身沒有完整的資料可以還原。','記憶體超配要有上限；快照是短期保險，不是備份。',['c',[['記憶體超額配置','同時用滿時｜全部一起變慢','w'],['快照','變更前的短期保險｜用完就刪'],['備份','放在另一套儲存｜可以獨立還原']]]],
['軟體資產',['定期比對「買了多少授權」和「實際安裝了多少」，可以避免授權爭議。','在資安上，盤點可以找出沒有人管理、沒有在更新的軟體。','出現重大漏洞時，要先知道哪些電腦裝了受影響的軟體，資產清單是第一個要查的。'],'某個常用元件爆出重大漏洞。有完整軟體清單的單位，半小時內就列出受影響的主機；沒有清單的單位花了好幾天逐台檢查。','盤點不是為了應付稽核一年做一次的事。清單如果不是持續更新，真正需要用的時候就已經不準了。','你沒辦法保護你不知道存在的東西。沒有被列管的軟體不會出現在更新計畫裡，也不會有人注意它的漏洞公告，卻一樣可以被攻擊者利用。','不知道裝了什麼，就不知道哪裡有漏洞；清單要持續更新。',['f',['持續盤點｜裝了什麼','出現重大漏洞','查清單找出｜受影響的主機','優先修補'],null,['a','w','','']]],
['資料銷毀',['刪除檔案和格式化，資料都還救得回來。','存放過機敏資料的儲存媒體要報廢時，要用認可的方式處理：覆寫抹除、消磁，或實體破壞。','SSD 的特性和傳統硬碟不同，要用它的安全抹除功能或實體破壞；消磁對 SSD 沒有作用。','處理過程要留下紀錄：哪一顆硬碟、誰處理的、什麼時候、用什麼方式。'],'報廢電腦之前把硬碟拆下，登記序號，交由合格廠商破碎並取得銷毀證明。','影印機、多功能事務機裡面也有硬碟，會保存掃描和列印過的文件。租約到期歸還時常常被忽略。','刪除只是把檔案的索引標記為可用空間，實際的資料還在磁碟上，直到被新的資料覆蓋。格式化通常也只是重建索引。用資料救援工具就能把這些內容讀出來。','報廢硬碟：覆寫、消磁或實體破壞，並留下紀錄。',['c',[['刪除、格式化','資料救得回來','w'],['覆寫、安全抹除','資料無法復原'],['實體破壞','最確定｜要留銷毀紀錄']],'消磁對 SSD 沒有作用']]];

['特權帳號',['AD 分層管理把資產分成三層：第 0 層是網域控制站這類身分系統，第 1 層是伺服器，第 2 層是使用者電腦。','每一層使用各自的管理帳號，高層的帳號不往低層登入。','這樣低層的電腦被入侵時，上面不會有高層帳號的憑證可以偷。'],'資訊人員有三個帳號：一般帳號做日常工作、伺服器管理帳號只登入伺服器、網域管理帳號只登入網域控制站。','只要有一次用網域管理帳號登入了使用者的電腦，那台電腦被入侵時，整個網域就可能失守。','攻擊者的典型路徑是先拿下最容易入侵的使用者電腦，再偷取上面留下的高權限憑證往上爬。分層就是切斷這條路：使用者電腦上永遠不會出現能管理伺服器或網域的帳號。','管理帳號分三層，高層帳號絕不往低層登入。',['c',[['第 0 層','網域控制站｜身分系統'],['第 1 層','伺服器'],['第 2 層','使用者電腦']],'每層各用自己的管理帳號，不往下登入']],
['網域與驗證',['krbtgt 是網域裡用來簽發 Kerberos 票證的帳號。','攻擊者取得它的密碼雜湊，就能偽造任何人的票證，稱為 Golden Ticket。','清除時 krbtgt 的密碼要重設兩次，因為 AD 會保留前一組密碼，只重設一次舊的票證仍然有效。'],'確認網域被入侵後，先重設 krbtgt 一次，等複寫完成到所有網域控制站之後，再重設第二次。','兩次重設之間要留足夠的間隔讓複寫完成。連續太快重設，可能造成各網域控制站之間不同步，正常的驗證也會失敗。','網域裡所有的票證都是用 krbtgt 的金鑰簽發的，其他系統看到這個簽章就相信票證的內容。為了讓更換密碼時還在使用中的票證不會立刻失效，AD 同時接受目前和前一組密碼。所以要換兩次，才能把攻擊者手上的那一組擠出去。','krbtgt 被拿走：密碼重設兩次，中間等複寫完成。',['f',['第一次重設','等複寫完成','第二次重設','舊票證｜全部失效'],'AD 會保留前一組密碼，所以要重設兩次']],
['AD 復原',['刪掉帳號之後再建一個同名的，是不同的帳號，因為安全識別碼（SID）不一樣。','權限是依 SID 設定的，所以重建的帳號原本的權限和群組關係全部對不上。','AD 資源回收筒可以把刪除的物件連同屬性和群組關係一起還原，但必須事先啟用。'],'有人誤刪了一個 OU 和裡面三百個帳號。因為事先啟用了資源回收筒，幾分鐘內就原樣還原，所有權限都不受影響。','資源回收筒是出事之前就要做的準備，出事之後才啟用，救不回已經刪掉的東西。另外它有保留期限，過期的物件一樣無法還原。','系統裡的每一個權限設定記的都是 SID 這串識別碼，不是帳號名稱。重建帳號會得到新的 SID，等於所有設定權限的地方都要重新設定一次。還原則是把原本的物件帶回來，SID 不變。','重建的帳號 SID 不同、權限全掉；AD 資源回收筒要事先啟用。',['c',[['重建同名帳號','SID 不同｜權限全部對不上','w'],['從資源回收筒還原','SID 相同｜權限和群組都在']],'必須事先啟用，而且有保留期限']],
['事件紀錄',['很多重要的稽核項目預設是關閉的。','例如記錄「執行了哪些程式」的程序建立稽核（事件識別碼 4688），要事先啟用才會有紀錄。','平時就要規劃好要記錄哪些事件，並確保紀錄的容量和保存期限足夠。'],'調查一台被入侵的主機，想知道攻擊者執行過什麼，安全性記錄裡卻完全沒有程序的紀錄，因為稽核原則從來沒有啟用。','「系統應該都有記錄」是錯誤的假設。預設的紀錄只涵蓋一部分，而且預設的容量很小，很快就被蓋掉。','紀錄愈詳細，佔用的空間和效能愈多，所以系統預設只開最基本的。哪些要開是管理者要決定的事。調查時最常遇到的遺憾，就是需要的那一種紀錄當初沒有開。','稽核要事先開：沒開 4688，就查不到執行過什麼程式。',['f',['平時啟用｜必要的稽核','紀錄集中保存','出事時｜有紀錄可查'],'預設很多稽核是關的，容量也很小',['a','','']]],
['記憶體管理',['Linux 的記憶體耗盡時，核心會挑選程序強制結束來釋放記憶體，這個機制叫 OOM Killer。','它傾向挑佔用記憶體最多的程序，所以常常是資料庫被選中。','用 <code>dmesg</code> 或系統紀錄可以查到是哪個程序在什麼時候被結束。'],'資料庫半夜突然停止，沒有任何錯誤訊息。<code>dmesg</code> 裡有一行寫著 Out of memory: Killed process，後面是資料庫的程序。','看到資料庫被砍掉就以為是資料庫的問題。實際上是整台主機的記憶體不夠，可能是另一支程式在吃記憶體，資料庫只是因為最大而被選中。','系統完全沒有記憶體時，任何動作都無法進行，連登入處理都做不到。核心寧可犧牲一個程序來換回整台主機的運作。它無法知道哪個程序對你比較重要，只能依記憶體用量這類指標來選。','程序無故消失，查 <code>dmesg</code> 有沒有 OOM Killer。',['t',['$ dmesg | grep -i "out of memory"','Out of memory: Killed process 2314 (postgres)','                              ← 核心為了自救砍掉它','$ free -h','          total   used   free','Mem:       16G    15G   120M']]],
['SELinux',['SELinux 是在一般檔案權限之外，再加一層強制的存取控制。','服務被 SELinux 擋下時，正確的做法是查看稽核紀錄，了解它擋了什麼，再針對這個服務調整。','常見的調整是修正檔案的安全標籤，或開啟對應的開關。'],'把網站檔案放到新的目錄後網頁伺服器讀不到。稽核紀錄顯示是標籤不對，修正那個目錄的標籤之後就正常了。','遇到問題就把 SELinux 整個關掉是最常見的做法，但等於拿掉一整層防護。而且大多數情況只要改一個標籤或一個開關。','一般的權限控制是「這個使用者能不能讀這個檔案」。SELinux 進一步限制「這支程式只能碰哪些類型的檔案和連接埠」。所以就算網頁伺服器被入侵，攻擊者也無法用它去讀系統上其他不相干的檔案。','被 SELinux 擋：看稽核紀錄、針對性調整，不要整個關掉。',['c',[['整個關掉','省事｜但少了一層防護','w'],['看稽核紀錄','知道擋了什麼'],['針對性調整','修正標籤｜或開啟對應開關']]]],
['權限提升',['sudo 可以設定得很細：哪個人、在哪台主機、可以用誰的身分、執行哪幾個指令。','只需要重啟某個服務的人，就只開放那一個指令。','設定檔要用 <code>visudo</code> 編輯，它會在存檔前檢查語法。'],'在 sudoers 加一行，讓某位同事只能執行 <code>systemctl restart nginx</code>，其他需要管理員權限的事都不能做。','為了省事直接給完整的 sudo 權限。另外要小心允許的指令本身能不能被用來做別的事，例如允許執行編輯器，就等於可以修改任何檔案。','完整的管理權限等於可以做任何事，帳號被盜用或操作失誤時損害沒有上限。把權限縮到剛好夠用，出事時能造成的損害也就限制在那個範圍內。','sudo 可以細到「誰能跑哪幾個指令」，需要什麼給什麼。',['t',['# 用 visudo 編輯','# 使用者    主機=(身分)   允許的指令','alice  ALL=(root)  /usr/bin/systemctl restart nginx','','# alice 只能重啟 nginx，其他管理指令都不行']]],
['設定管理',['設定管理工具（例如 Ansible）是把主機應該有的設定寫成檔案，再由工具套用到每一台。','最大的價值是每台主機的設定一致，而且每次修改都有紀錄。','設定檔放進版本控制，就能知道現在的設定、過去的歷史、是誰為了什麼改的。'],'要在五十台主機上調整一個參數。修改設定檔、經過審查、合併之後由工具套用，五十台的結果完全相同。','用了設定管理工具之後，還有人直接登入主機手動修改，主機的實際狀態就會和設定檔不一致，工具的價值就沒了。','主機一多，手動維護一定會產生差異：有幾台漏掉、有幾台改得不一樣、有人臨時改了沒記錄。這些差異平常看不出來，出問題時才發現「這台為什麼和別台不一樣」。把設定變成檔案，主機的狀態就變成可以檢視、比較和還原的東西。','設定寫成檔案、進版本控制：每台一致，改動有紀錄。',['f',['設定寫成檔案','進版本控制｜審查後合併','工具套用到｜所有主機','每台一致｜有紀錄可查'],'不要再直接登入主機手動改']]];

['備援設計',['單一台核心交換器是單點故障，它一停，整棟大樓的網路就中斷。','做法是雙核心，各樓層的交換器各用兩條上行線路分別接到兩台核心。','對外線路的備援，要確認兩條線是不同的業者，而且走不同的實體路徑和進線位置。'],'公司的兩條對外線路雖然是不同業者，卻從同一個管道進入大樓。道路施工挖斷管線，兩條同時中斷。','備援不是多買一台或多拉一條就完成了。要一路檢查到實體層：是不是同一個機櫃、同一條電源、同一個管道。','兩個元件只要共用任何一個東西，那個東西就是新的單點。設備可以備援，但如果兩台設備接同一個電源，或兩條線路走同一個管道，一次事故就能同時讓兩者失效。所以要找出並消除這些共同的依賴。','備援要連實體路徑都分開：雙核心雙上行，線路走不同管道。',['c',[['核心交換器','雙核心｜樓層交換器雙上行'],['對外線路','不同業者｜不同實體路徑'],['共同的依賴','同電源、同管道｜都是單點','w']]]],
['防火牆',['為了排除問題而臨時開的寬鬆規則，要設定到期日。','問題查清楚之後，改成只開放必要來源、目的和連接埠的最小範圍規則。','每一條規則都要記錄申請人和原因，並且定期清查。'],'為了確認是不是防火牆擋住，臨時開放一條全通的規則，設定兩小時後到期。確認之後改成只開放特定主機的特定連接埠。','「臨時」的規則最容易變成永久的。幾年後沒有人知道它為什麼存在，也沒有人敢刪。','防火牆的規則只會愈加愈多，因為新增有人申請，移除卻沒有人負責。每一條過度寬鬆的規則都是一條可以被利用的路。到期日把「移除」變成預設會發生的事，要保留的人必須主動延期並說明原因。','臨時規則要有到期日、申請人和原因；事後改成最小範圍。',['f',['臨時開放｜寬鬆規則','設定到期日｜記錄原因','查清楚後｜改成最小範圍','定期清查｜所有規則'],null,['w','a','','']]],
['網段隔離',['監視器、門禁、印表機這類連網設備，很少更新，而且常常使用預設密碼。','它們很容易被入侵，然後被當成進入內部網路的跳板。','要放在獨立的網段，只開放它們運作所必要的連線。'],'監視器放在專用的 VLAN，只能連到錄影主機，不能連到辦公室的電腦和伺服器，也不能直接連上網際網路。','「只是一台印表機」所以和電腦放在同一個網段。但它其實是一台很少更新的電腦，而且通常沒有任何防護軟體。','這類設備的設計重點是功能，不是安全，廠商提供更新的時間也很短。既然無法讓它本身變安全，就改為限制它能接觸的範圍，讓它就算被入侵，攻擊者也到不了重要的系統。','連網設備放獨立網段，只開必要的連線。',['c',[['同一個網段','被入侵後｜可以直接連到電腦','w'],['獨立網段','只能連到｜必要的主機']],'監視器、門禁、印表機、會議設備都適用']],
['封包分析',['TCP 重傳是指傳送的一方沒有收到對方的確認，所以再傳一次。','少量的重傳是正常的；大量的重傳代表路徑上有掉包或壅塞。','接著要找是哪一段：線路品質、頻寬滿載，或設備有錯誤。'],'使用者抱怨傳檔很慢。擷取封包後看到重傳的比例很高，再查交換器，發現某個埠的錯誤計數不斷增加，換掉那條光纖跳線後恢復。','重傳是結果不是原因。看到重傳之後還要繼續找是哪裡掉了封包，在兩端各擷取一次來比對是常用的方法。','TCP 保證資料會送達，方法是每一段資料都要對方確認，沒確認就重傳。每一次重傳都要先等一段時間，而且傳送的一方會認為網路壅塞而主動降低速度。所以只要有一點點掉包，速度就會明顯下降。','大量 TCP 重傳＝路上在掉包；再去找是哪一段。',['f',['送出資料','沒收到確認','重傳｜並降低速度','使用者覺得慢'],'少量正常，大量就要找是哪一段掉包',['','w','w','']]],
['流量分析',['想知道頻寬被誰用掉，要用 NetFlow、sFlow 這類流量分析。','它記錄的是每一條連線的摘要：來源、目的、協定、連接埠、傳了多少。','介面的流量圖只能告訴你「滿了」，流量分析才能告訴你「是誰、在做什麼」。'],'對外頻寬突然用滿。打開流量分析，依流量排序，馬上看到一台電腦正在對外上傳大量資料。','只有總流量的監控圖，看得到頻寬滿了，但找不到原因，只能一台一台去問。','設備在轉送封包時，可以順手把每條連線的基本資訊記錄下來並送到分析主機。它不保存封包的內容，所以資料量小，可以長時間保存，同時足以回答「誰和誰、用什麼、傳了多少」。','頻寬被吃滿：用流量分析找出是誰。',['c',[['流量圖','只知道｜頻寬滿了','off'],['流量分析','知道是哪個 IP｜哪種流量｜傳了多少']]]],
['變更安全',['遠端修改網路設備的設定，改錯可能讓自己連不進去。','動手前先備份目前的設定。','並利用設備的「定時自動還原」或「定時重新啟動」功能：改完如果沒有在時間內確認，設備會自動回到原本的設定。'],'修改異地交換器的管理介面設定之前，先設定十分鐘後自動重啟且不儲存新設定。改完確認連線正常，再取消重啟並存檔。','「只改一行不會有事」然後把自己鎖在外面，接著只能請人到現場接線處理。','遠端管理的連線本身就經過你正在修改的設備。改錯的那一刻連線就斷了，你也就失去了改回來的途徑。定時還原等於事先安排好一個不需要你連線就會發生的回復動作。','遠端改設定：先備份，並設定定時自動還原。',['f',['備份｜現有設定','設定定時｜自動還原','修改設定','確認正常後｜取消並存檔'],'沒在時間內確認，設備會自己回到舊設定',['','a','','']]],
['無線網路',['2.4GHz 頻段互不重疊的頻道只有 1、6、11。','基地台很多又任意設定頻道時，彼此的訊號互相干擾，訊號強度高但連線品質很差。','做法是只使用 1、6、11，相鄰的基地台錯開，並適度調低發射功率；能用 5GHz 的設備盡量用 5GHz。'],'辦公室無線網路很不穩。掃描後發現附近的基地台分別設在頻道 1、3、4、6、8，重新規劃成只用 1、6、11 之後明顯改善。','訊號格數滿格不代表連線品質好。把基地台功率調到最大，或是再多加幾台，常常讓干擾更嚴重。','同一個頻道上的設備要輪流發送。相鄰但部分重疊的頻道更糟：彼此聽不懂對方的訊號，只當成雜訊，於是資料錯誤要重傳。訊號愈強，互相干擾的範圍愈大。','2.4GHz 只用 1、6、11；訊號強不等於品質好。',['c',[['頻道 1','互不重疊'],['頻道 6','互不重疊'],['頻道 11','互不重疊']],'相鄰基地台錯開頻道，適度調低功率']]];

['攻擊手法',['MITRE ATT&amp;CK 是一個公開的知識庫，整理了攻擊者實際使用過的戰術和技術。','戰術是攻擊者在某個階段想達成的目的，例如取得初始存取、提升權限、橫向移動。','技術是達成目的的具體方法。可以用它來檢視自己的偵測涵蓋了哪些、缺了哪些。'],'把現有的偵測規則逐一對應到 ATT&amp;CK 的技術，畫出涵蓋圖，發現「橫向移動」這個戰術幾乎沒有任何偵測，就把它列為優先補強的項目。','ATT&amp;CK 不是一份要全部打勾的檢查表，也不是產品功能清單。涵蓋了某個技術不代表偵測得到它所有的變化。','過去描述攻擊常用的是 IP、檔案雜湊這類很容易改變的東西。ATT&amp;CK 描述的是攻擊者的行為方式，這比較難改變。有了共同的語言，不同單位才能比較「我們偵測得到哪些行為」，並有系統地找出缺口。','ATT&amp;CK：戰術是「要達成什麼」，技術是「怎麼做」；用來找偵測缺口。',['f',['初始存取','執行','提升權限','橫向移動','資料外傳'],'每個戰術底下有多種技術；拿來對照自己偵測得到哪些']],
['偵測調校',['一條規則每天產生大量誤報，值班的人就會習慣性忽略它。','沒有人看的告警等於沒有告警，真正的攻擊也會被淹沒在裡面。','處理方式是調整規則的條件、加上合理的排除清單，把告警量降到可以逐一處理的程度。'],'某條規則每天跳三百次，檢查後發現九成來自備份主機的正常行為。把這台主機的這個行為排除之後，剩下的每一筆都值得查。','直接把規則關掉，或是放著不管，結果都一樣是漏掉真正的攻擊。另外，排除條件要盡量窄，寫得太寬等於替攻擊者開了一個不會被偵測的洞。','人的注意力是有限的資源。告警的價值不在數量，而在「它響的時候有多大機率是真的」。這個比例太低，值班人員就會學到「這個可以忽略」，而這個習慣在真正的攻擊出現時不會自動改變。','告警要調到「響了就值得看」；沒人看的告警等於沒有。',['c',[['關掉規則','真的攻擊｜也看不到','w'],['放著不管','告警被忽略｜真的也被淹沒','w'],['調校','調整條件｜加上精確的排除']]]],
['紅隊與測試',['滲透測試的重點是在限定的範圍和時間內，盡量找出弱點。','紅隊演練是模擬真實的攻擊者，設定一個具體的目標，例如取得某份資料。','紅隊同時也在考驗防守方（藍隊）能不能發現並應變，所以通常不會事先告知防守人員。'],'紅隊的目標是「取得財務系統的資料」。他們從釣魚信開始，一路沒有觸發任何告警就達成目標，事後和藍隊一起檢視每一步為什麼沒有被發現。','紅隊演練的成果不是「找到幾個漏洞」，而是「防守方在哪些環節沒有發現、沒有擋住」。還沒有基本的偵測和應變能力就做紅隊演練，效益很低。','弱點清單只告訴你有哪些洞，不能告訴你真的被攻擊時整個組織的反應如何：有沒有人看到告警、通報流程通不通、多久才把攻擊者擋下來。這些只有在接近真實的情境下才驗證得出來。','滲透測試找弱點；紅隊設目標，考驗能不能被發現。',['c',[['滲透測試','限定範圍｜盡量找出弱點'],['紅隊演練','設定目標｜模擬真實攻擊者｜考驗偵測與應變']]]],
['威脅獵捕',['等告警響了才處理，只抓得到已經寫成規則的已知模式。','威脅獵捕是主動的：假設已經被入侵了，到資料裡去找還沒有觸發告警的跡象。','做法是先提出一個假設，再去紀錄裡驗證。找到的東西要回饋成新的偵測規則。'],'假設「有人用系統內建的遠端管理工具在橫向移動」，就去查過去一個月哪些電腦用這個工具連過其他電腦，再逐一確認是不是正常的管理行為。','威脅獵捕不是漫無目的地翻紀錄。沒有假設就不知道要找什麼。它也需要先有夠完整的紀錄才能進行。','偵測規則是把過去看過的攻擊寫成條件，新的手法或刻意避開規則的攻擊者不會觸發它。主動獵捕補的就是這一塊。就算最後沒有找到入侵，過程中也會發現紀錄的缺口和異常的設定。','威脅獵捕：先假設被入侵，帶著假設去紀錄裡找。',['f',['提出假設','到紀錄裡｜找證據','確認是否｜為惡意行為','寫成新的｜偵測規則'],null,['a','','','']]],
['特權帳號',['管理者要連進伺服器，建議一律經過跳板機或特權存取管理系統。','這樣所有的管理連線只有一個入口，可以強制多因素驗證、限制來源，並記錄或側錄操作。','伺服器的管理連接埠就只需要對跳板機開放，不必對整個內部網路開放。'],'伺服器的遠端管理只接受來自跳板機的連線。管理者先以多因素驗證登入跳板機，再從那裡連到伺服器，整個過程都有紀錄。','跳板機本身是高價值的目標，被入侵就能通往所有伺服器。所以它要比其他主機更嚴格地強化、更新和監控。','如果任何一台內部電腦都能直接連到伺服器的管理介面，攻擊者只要拿下任何一台，就能開始嘗試登入伺服器。把入口收斂到一個點，就可以把所有的管控和監視集中在那裡。','管理連線走跳板機：單一入口、強制 MFA、全程記錄。',['f',['管理者','跳板機｜MFA、側錄','伺服器'],'伺服器的管理埠只對跳板機開放',['','a','']]],
['事件應變',['攻擊者取得網域管理員權限之後，可以取出網域裡所有帳號的密碼雜湊。','所以清除階段要重設的範圍是：所有特權帳號、服務帳號、krbtgt（兩次），必要時是全部使用者。','同時要找出並移除攻擊者留下的其他後門。'],'確認網域管理員帳號被盜用後，不只重設那一個帳號，而是依計畫分批重設所有管理帳號和服務帳號，並重設 krbtgt 兩次。','只把被發現的那個帳號改密碼就宣告處理完畢。攻擊者手上還有其他帳號，換一個身分馬上就回來。','取得最高權限的攻擊者一定會預先準備好回來的路：多拿幾個帳號、建立新的帳號、留下排程或後門。清除要假設「所有他拿得到的東西都拿了」，全部一次處理，而不是逐一發現、逐一處理。','網域管理員權限被拿走：特權、服務帳號、krbtgt 都要重設。',['c',[['特權帳號','全部重設'],['服務帳號','全部重設'],['krbtgt','重設兩次'],['一般使用者','視情況｜全部重設']]]],
['資料外洩',['資料要被帶走，最後多半要經過網路往外傳。','監控對外流量的異常是最直接的偵測方式，例如離峰時段出現大量上傳，或是連到沒見過的目的地。','前提是要先建立平常的流量基準，才分辨得出異常。'],'監控發現某台伺服器在凌晨三點對一個境外的位址上傳了幾十 GB，而這台伺服器平常幾乎沒有對外流量，立刻展開調查。','只注意「進來」的流量是很常見的盲點。很多單位對外連出的流量幾乎完全不限制、也不監看。','攻擊者可以用各種方法躲過入侵時的偵測，但資料外傳這一步很難完全隱藏：量大、方向是往外、目的地通常不是業務往來的對象。只要知道每台主機正常情況下的對外行為，這一步就會顯得很突出。','看對外流量：離峰的大量上傳、沒見過的目的地。',['f',['建立平常的｜流量基準','監控對外流量','出現異常：｜離峰大量上傳','調查'],null,['','a','w','']]],
['補償性控制',['有些老舊系統無法更新修補，業務上又不能停用。','這時候要用補償性的控制來降低風險：放到隔離的網段、限制可以連線的來源、加強監控。','這個風險要記錄下來，由有權責的人確認接受，並且訂出汰換的時程。'],'一台控制設備的電腦只能執行已經終止支援的作業系統。把它放在獨立的網段，只允許兩台指定的電腦連線，不能上網，並監控所有進出的流量。','補償性控制不是永久的解決方案，也不是可以不汰換的理由。它只是在無法直接修正的期間，把風險壓在可以接受的範圍內。','風險來自弱點被接觸和利用的機會。弱點本身修不了的時候，可以改為減少能接觸到它的路徑，並提高出事時被發現的機會。這樣整體的風險下降了，但弱點還在，所以需要有人明確地接受這個剩下的風險。','修不了就圍起來：隔離、限制來源、加強監控，並由權責主管接受風險。',['c',[['隔離網段','減少能接觸｜它的路徑'],['限制來源','只有指定主機｜可以連線'],['加強監控','出事時｜能及早發現']],'風險要記錄、由權責主管接受，並訂出汰換時程']]];

['複寫與高可用',['腦裂是指叢集的節點之間通訊中斷，每一邊都以為對方故障，都開始接受寫入。','兩邊的資料會各自分岔，事後很難合併。所以叢集需要第三方仲裁，確保同一時間只有一邊是主要節點。','同步複寫要等備援節點也寫入完成才算成功，故障時不會遺失資料，但寫入比較慢。非同步複寫比較快，但故障時最後幾筆可能還沒傳到。'],'兩個節點的叢集加上一個仲裁節點。網路中斷時，只有還能聯絡到仲裁的那一邊繼續提供服務，另一邊自動停止接受寫入。','只有兩個節點而沒有仲裁的叢集，網路一中斷就無法判斷該由誰接手，不是兩邊都停，就是兩邊都寫。','節點無法分辨「對方當機了」和「只是我和對方之間的網路斷了」，從它的角度看起來一模一樣。所以需要一個多數決的機制：能聯絡到過半成員的那一邊才有資格運作，這樣最多只會有一邊符合條件。','叢集要有仲裁防腦裂；同步不掉資料但慢，非同步快但可能掉。',['c',[['同步複寫','零遺失｜寫入較慢'],['非同步複寫','寫入快｜故障時可能掉最後幾筆'],['仲裁','確保同時只有｜一邊是主要節點','a']]]],
['分割',['分割是把一張很大的資料表，依某個欄位（常用的是日期）切成多個區塊。','查詢近期資料時，資料庫只需要掃描相關的那幾個分割。','清除舊資料時，可以直接卸除整個分割，不用一筆一筆刪除。'],'一張十年的紀錄表依月份分割。查詢上個月的資料只掃一個分割；要清掉七年前的資料，直接卸除那十二個分割，幾秒鐘完成。','分割不是萬靈丹。查詢條件如果沒有包含分割用的那個欄位，資料庫還是要掃過每一個分割，可能比不分割更慢。','表愈大，索引也愈大，每一次查詢和維護的成本都跟著增加。用 DELETE 清幾千萬筆舊資料會產生大量的交易紀錄並長時間鎖定。分割讓資料庫可以把「整塊不相關的資料」直接跳過或整塊移除。','大表依日期分割：查近期只掃幾塊，清舊資料整塊卸掉。',['f',['十年的大表','依月份分割','查近期：｜只掃相關分割','清舊資料：｜整塊卸除'],'查詢條件要包含分割用的欄位才有效果']],
['連線管理',['資料庫的連線是有限的資源，應用程式通常用連線池來重複使用連線。','出現「無法取得連線」但資料庫負載不高，要檢查連線池的上限，以及程式有沒有用完連線卻沒有歸還。','連線沒有歸還稱為連線洩漏，常常發生在發生錯誤的那條程式路徑上。'],'尖峰時段應用程式一直出現無法取得連線的錯誤。追查後發現某個功能在發生例外時沒有關閉連線，每錯一次就少一條，最後池子被耗盡。','看到連不上就把連線池的上限調大，只是把問題往後延。如果有連線洩漏，再大的池子最後也會用完；而且連線太多反而會壓垮資料庫。','建立資料庫連線的成本很高，所以連線池預先建好一批、用完歸還、給下一個人用。這個模式的前提是「借了一定要還」。程式在正常流程通常會還，但在出錯提前離開的流程很容易忘記。','資料庫很閒卻連不上：查連線池上限和連線洩漏。',['c',[['池子太小','尖峰時不夠用'],['連線洩漏','用完沒歸還｜愈用愈少','w'],['上限調太大','連線過多｜壓垮資料庫','w']]]],
['升級',['資料庫的大版本升級可能改變語法、執行計畫的行為和相容性。','最穩當的做法是先用正式資料的複本完整演練一次。','演練可以知道升級要花多久、會遇到什麼問題，以及退回的方法行不行得通。'],'升級前把正式資料庫還原到測試環境，實際執行升級並讓應用程式跑一輪測試，發現有三支報表的查詢在新版變慢，先調整好再排正式升級。','只在空的或資料很少的測試資料庫上試過，是不夠的。很多問題只有在真實的資料量和真實的查詢下才會出現。','升級是很難回頭的變更：資料檔的格式一旦轉換，通常無法直接降回舊版。所以必須在動到正式環境之前，把所有會遇到的問題都先遇過一次，並確認真的失敗時有一條走得通的退路。','大版本升級：用正式資料的複本演練，並備好退路。',['f',['還原正式資料｜到測試環境','演練升級','應用程式｜完整測試','確認退回方法｜再排正式升級']]],
['稽核',['資料庫管理員（DBA）擁有最高的權限，風險也最高。','他們的存取行為要留下稽核紀錄。','而且紀錄要存放在 DBA 自己無法修改的地方，例如另一個單位管理的日誌系統。'],'資料庫的稽核紀錄即時送到由資安單位管理的集中日誌系統，DBA 對那裡只有查詢自己紀錄的權限。','「我們信任我們的 DBA」不是不需要稽核的理由。稽核紀錄同樣是在保護 DBA：發生資料外洩時，有紀錄可以證明不是他做的。','一個人如果既能存取資料、又能修改記錄他存取行為的紀錄，這份紀錄就沒有證明力。把這兩件事交給不同的人，稱為職務區隔。它讓任何一個人都無法獨自做出不被發現的事。','DBA 的操作要有稽核，紀錄放在 DBA 改不到的地方。',['c',[['紀錄和 DBA 同一處','可以被修改｜沒有證明力','w'],['紀錄另外保管','職務區隔｜也保護 DBA 自己']]]],
['加密',['透明資料加密（TDE）加密的是磁碟上的資料檔和備份檔。','它防的是有人把整份資料檔或備份檔偷走，偷走的檔案無法讀出內容。','透過資料庫正常登入查詢時，資料會自動解密，看到的仍然是明文。'],'備份磁帶在運送途中遺失。因為有啟用 TDE，磁帶上的內容沒有金鑰無法還原。','啟用 TDE 不代表「資料庫裡的個資有加密所以很安全」。有資料庫帳號的人，或是利用應用程式漏洞的攻擊者，看到的都是明文。','「透明」的意思是應用程式完全不需要修改，加解密都在資料庫寫入和讀取磁碟的時候自動完成。也因為如此，任何通過資料庫本身的存取都不受影響，所以它只處理「繞過資料庫、直接拿檔案」這一種威脅。金鑰要和備份分開保管。','TDE 防的是檔案被偷走，不防從資料庫正常登入的人。',['c',[['資料檔、備份被偷','TDE ✓｜讀不出內容'],['用帳號登入查詢','TDE ✕｜看到的是明文','w']],'所以不能取代權限控管；金鑰要和備份分開保管']],
['查詢調校',['資料庫依照統計資訊（各欄位資料的分布情形）來決定用什麼方式執行查詢。','統計資訊過期，或是執行計畫被重新產生，同一句 SQL 可能從使用索引變成整張表掃描。','所以查詢突然變慢而程式和資料量都沒有明顯變化時，要先檢查統計資訊和執行計畫。'],'一支跑了三年的報表某天從 2 秒變成 5 分鐘。比對執行計畫發現它不再使用原本的索引，更新統計資訊之後恢復正常。','「程式沒有改，所以不會是查詢的問題」是錯的。同一句 SQL 的執行方式是資料庫每次依當時的資訊決定的，不是固定的。','資料庫要在很多種執行方式中挑一種成本最低的，而成本是依統計資訊估算出來的。資料的分布會隨時間改變，如果統計資訊沒有跟著更新，估算就會出錯，挑到實際上很慢的方式。','查詢突然變慢：查統計資訊有沒有過期、執行計畫有沒有變。',['f',['統計資訊過期','估算錯誤','選到差的｜執行計畫','查詢突然變慢'],'更新統計資訊、比對前後的執行計畫',['w','','w','w']]]];

['技術債',['技術債是為了趕時間而選擇省事的做法，之後維護和修改時要付出更多的代價。','它可以是有意識的決定，重點是要知道自己欠了什麼。','要把它記錄下來，並且排進工作計畫裡逐步償還。'],'為了趕上線先把某個設定寫死在程式裡，同時開一張待辦事項寫明原因和之後要怎麼改，並在下一個版本排入修正。','技術債不等於「寫得很爛的程式」，也不是完全不能有。問題出在沒有人記得欠了什麼，而且從來不還。','每一次省事的做法都會讓程式變得比較難修改，之後每加一個功能都要多花力氣繞過它，這就是利息。債累積到一定程度，團隊大部分的時間都在處理舊問題，新的工作幾乎無法推進。','技術債像借錢：可以借，但要記帳、要還。',['f',['趕時間｜選省事的做法','之後每次修改｜都更費力','記錄下來','排入計畫｜逐步償還'],null,['w','w','a','a']]],
['部署策略',['金絲雀釋出是新版本先只開放給一小部分使用者或流量，觀察沒問題再逐步擴大。','功能開關是把新功能包在一個可以用設定開關的條件裡，程式先上線，功能之後再打開。','兩者的共同目的是縮小出問題時的影響範圍，並且能很快地退回。'],'新版本先讓 5% 的流量使用，觀察錯誤率和回應時間一小時，正常就提高到 25%、50%、100%。','功能開關用完要清理。程式裡累積幾十個沒有人敢移除的開關，本身就是一種技術債，也會讓測試變得很複雜。','一次對所有人上線，出問題時所有人都受影響，而且只能緊急退版。把「部署程式」和「開放給使用者」拆成兩個獨立的動作之後，每一步都可以很小、可以觀察、可以馬上取消。','金絲雀：先給少數人；功能開關：程式先上、功能後開。',['f',['5% 流量','觀察錯誤率｜和效能','25%、50%','100%'],'任何階段有問題就切回舊版',['a','','','']]],
['可觀測性',['可觀測性常用三種資料：紀錄（Log）、指標（Metric）、追蹤（Trace）。','指標是隨時間變化的數字，例如錯誤率、回應時間，用來發現「有問題」。','追蹤是記錄一個請求經過每一個服務各花了多少時間，用來找出「卡在哪一段」。','紀錄是事件的詳細內容，用來了解「當時發生了什麼」。'],'指標顯示錯誤率上升；從追蹤看到時間都卡在付款服務；再查付款服務的紀錄，找到實際的錯誤訊息。','只有紀錄是不夠的。系統由很多個服務組成時，光靠翻各個服務的紀錄，很難把同一個請求在不同服務裡的片段串起來。','監控回答的是事先想好的問題，例如「CPU 有沒有超過 80%」。可觀測性的目標是讓你能回答事先沒有想到的問題，這需要從數字、路徑、細節三個角度都留下資料，並且能互相對應。','指標看有沒有問題、追蹤看卡在哪、紀錄看發生什麼。',['c',[['指標','發現｜「有問題」'],['追蹤','找出｜「卡在哪一段」'],['紀錄','了解｜「發生了什麼」']]]],
['相依套件',['SBOM（軟體物料清單）是記錄每個系統使用了哪些套件和版本的清單。','重大漏洞公布時，有 SBOM 就能很快查出哪些系統受影響。','SBOM 要在建置時自動產生，並且隨著每次發布更新。'],'某個常用的套件公布重大漏洞。查詢所有系統的 SBOM，十分鐘內列出七個使用了受影響版本的系統。','只列出自己直接使用的套件是不夠的。套件還會使用其他套件，漏洞常常出現在這些間接使用、自己根本不知道存在的套件裡。','現代的軟體大部分是由別人寫的元件組合起來的，一個系統用到幾百個套件很常見。沒有清單，漏洞公布時只能逐一檢查每個系統；而攻擊者通常在公布後幾天內就會開始利用。','有 SBOM，漏洞公布時才能馬上知道誰受影響。',['f',['建置時自動｜產生 SBOM','集中保存','漏洞公布','查詢受影響｜的系統'],'要包含間接使用的套件',['a','','w','']]],
['基礎設施即程式碼',['基礎設施即程式碼（IaC）是用程式碼描述伺服器、網路、權限這些環境，再由工具自動建立。','環境的定義變成檔案之後，可以放進版本控制、經過審查、重複建立。','要重建一套一模一樣的環境，從幾天的手動作業變成幾分鐘。'],'用同一份定義檔分別建立測試環境和正式環境，兩者只有規模的參數不同，其餘設定完全相同。','用了 IaC 之後，還有人直接到管理介面手動修改，實際的環境就會和程式碼描述的不一致。下次工具執行時，可能把手動的修改蓋掉。','手動建立的環境，它的設定只存在於那個環境本身和當時操作的人的記憶裡，沒辦法審查、比較，也很難重現。把環境寫成程式碼，就能用管理程式碼的那一套方法來管理環境：審查、測試、追蹤歷史、退回上一版。','IaC：環境寫成程式碼，可審查、可重建、可追溯。',['c',[['手動建立','做法在人的記憶裡｜難以重現','w'],['寫成程式碼','進版本控制｜審查後自動建立']]]],
['密碼與金鑰',['密碼和金鑰散落在各個系統的設定檔裡，很難控管，更換一次要修改很多地方。','密鑰管理系統把它們集中保管，程式在執行時才去取用。','集中之後可以控制誰能取、記錄誰取過，並且定期自動更換。'],'應用程式啟動時向密鑰管理系統取得資料庫密碼，設定檔裡完全沒有密碼。資料庫密碼每三十天自動更換，應用程式不用修改。','密鑰管理系統本身會成為最重要的目標。它的存取權限、稽核和備援都要以最高標準處理。','密碼寫在設定檔裡，看得到設定檔的人就看得到密碼，而且沒有人知道它被誰看過。更換又很麻煩，所以實務上就是很多年都不換。集中管理把「能不能取得」變成一個可以授權、可以記錄、可以撤銷的動作。','密鑰集中管理：控管誰能取、留紀錄、自動更換。',['f',['程式啟動','向密鑰管理系統｜取得密碼','驗證身分｜並留下紀錄','取得後｜連線資料庫'],'設定檔裡不再有密碼',['','a','','']]],
['API',['API 是對呼叫端的承諾，已經發布的欄位和行為不能任意更改。','要做不相容的修改時，應該發布新的版本，舊版保留一段時間。','並且事先公告停用的時程，讓呼叫端有時間調整。'],'要把回應裡某個欄位從文字改成數字。發布 v2 提供新格式，v1 繼續運作，公告六個月後停用，並追蹤還有誰在呼叫 v1。','「只是改個欄位名稱」就直接修改，所有還在用舊名稱的系統會同時出錯，而你可能根本不知道有哪些系統在呼叫。','API 的提供者和呼叫者通常是不同的團隊，各自有自己的發布時程，不可能同時修改。版本機制讓雙方可以各自依照自己的步調更新。新增欄位通常是安全的，移除或改變既有欄位的意義則是破壞性的修改。','API 不能直接改壞；出新版本、舊版保留並公告停用時程。',['c',[['直接修改','既有呼叫端｜同時壞掉','w'],['發布新版本','舊版保留一段時間｜公告停用時程']],'新增欄位通常安全；移除或改變意義是破壞性修改']]];
LEARN.trouble[3]=[
['告警風暴',['短時間內跳出大量告警，通常是一個上游的問題拖垮了很多下游。','處理方式是依相依關係找出最上游的那一個，不要逐一處理每個告警。','常見的上游是：儲存設備、網路、驗證服務、DNS。'],'五十幾個告警涵蓋十幾台主機。依相依關係看，這些主機都使用同一台儲存設備，而它的告警是最早出現的。修好它，其他告警陸續消失。','從最嚴重或最新的告警開始一個一個處理，會把時間都花在症狀上。最早出現的告警，通常比最多的告警更接近原因。','系統之間有相依關係：應用程式依賴資料庫，資料庫依賴儲存和網路。底層出問題，上面每一層都會各自發出告警，數量會放大很多倍。所以要沿著相依關係往下找，並依時間順序看是誰先出事。','告警一大堆：找最上游、最早出現的那一個。',['f',['上游故障｜（儲存、網路）','下游全部｜跟著告警','依相依關係｜找最上游','修好源頭｜其他自己消失'],null,['w','w','a','']]],
['因果驗證',['兩件事同時發生，不代表其中一件造成另一件。','驗證的方法是把懷疑的因素拿掉，看結果有沒有改變。','更完整的做法是「關掉又打開」：拿掉之後問題消失，放回去問題又出現，因果才算成立。'],'大家認定是備份造成系統變慢。挑一天停掉備份，那個時段還是一樣慢，原來是同一時段的另一支排程造成的。','「大家都這麼認為」不是證據。沒有經過驗證就動手處理，可能花了很大的力氣卻發現原因根本不是那個。','同一個時段通常有很多事同時發生：備份、排程、使用高峰、其他系統的作業。光靠「時間對得上」沒辦法區分是哪一個。只有主動改變其中一項並觀察結果，才能把它和其他同時發生的事分開。','同時發生不等於因果：拿掉看看，再放回去看看。',['f',['懷疑是甲｜造成的','把甲拿掉｜問題消失？','把甲放回｜問題又出現？','兩者都是｜才算成立']]],
['二分法',['在很多個可能的原因裡找出是哪一個，二分法是最快的方法。','做法是每次測試中間的那一個，依結果把範圍縮小一半。','200 筆變更最多測試 8 次就能找到。Git 的 bisect 指令就是在做這件事。'],'上一版正常、這一版有問題，中間有 200 筆提交。用 <code>git bisect</code> 標記一個好的和一個壞的，工具每次挑出中間的版本讓你測試，8 次就定位到出問題的那一筆。','從頭一筆一筆檢查，或是憑感覺猜「應該是這一筆」，在變更很多的時候都很沒有效率。','每測試一次就排除一半的可能，所以需要的次數是以 2 為底的對數：200 筆要 8 次，1,000 筆也只要 10 次。這個方法不需要你了解每一筆變更的內容，只需要能判斷「這個版本是好的還是壞的」。','二分法：每次測中間，範圍砍半；200 筆最多 8 次。',['c',[['200 筆','→ 100'],['100','→ 50'],['50','→ 25'],['……','8 次找到']],'git bisect 會自動幫你挑中間的版本']],
['備援演練',['備援機制沒有實際切換過，就不知道真的出事時能不能運作。','定期演練會找出平常看不到的問題：設定沒有同步、授權過期、沒有人記得步驟。','演練也讓相關人員熟悉流程，並量出實際切換需要多少時間。'],'每半年把服務實際切換到備援站台運作一天再切回來。第一次演練發現備援站台的憑證已經過期，還有一支排程沒有同步過去。','「備援設備的燈號是綠的」不代表切換會成功。備援的設備正常，和整個服務能在那邊運作，是兩回事。','主要環境每天都在使用，所以問題會被發現並修正。備援環境平常沒有流量，設定的差異、過期的授權、遺漏的元件都會默默累積。這些問題只有在真正需要它的那一刻才會顯現，除非你事先主動去切換。','備援要實際切過才算數。',['f',['定期實際切換','發現｜沒同步的設定','修正並｜更新文件','量出實際｜切換時間'],null,['a','w','','']]],
['容量與週期',['問題如果有固定的週期，先對照業務上的週期：月初、月底、季末、申報期間。','這種情況通常是週期性的負載高峰超過了系統的容量。','它是容量規劃的問題，不是故障，處理方向是擴充容量、分散負載，或調整作業時間。'],'系統每個月初慢兩三天。對照後發現是月結作業和每月報表同時進行，把報表的排程移到晚上之後明顯改善。','每個月都把它當成新的故障來處理，查不出原因，過幾天自己就好了，於是不了了之，下個月再來一次。','系統的容量是固定的，而負載會隨業務的節奏起伏。平常夠用不代表尖峰夠用。只要把系統的負載和業務的行事曆放在一起看，這類問題的規律會很明顯，也就可以事先預測和準備。','固定時間變慢：對業務週期，是容量問題不是故障。',['f',['每月固定｜時間變慢','對照業務週期｜（月結、申報）','確認是｜負載高峰','擴充或｜錯開時間'],null,['w','a','','']]],
['事件指揮',['重大事件有很多人同時處理時，要先指定一位事件指揮官。','指揮官掌握全局、決定處理的順序，本身不動手操作。','所有人在動手之前都要先說出來，另外指定專人負責紀錄和對外溝通。'],'重大異常發生，資深工程師擔任指揮官，在通話中分派工作：一人查資料庫、一人查網路、一人記錄時間軸、一人負責每 30 分鐘對外更新。','最資深的人常常忍不住自己下去查，結果沒有人掌握全局。另外，好幾個人各自修改設定，會互相蓋掉，也分不出是哪個動作有效。','多人同時處理的風險是彼此不知道對方做了什麼。兩個人同時改不同的設定，結果好了或更糟了，都無法判斷原因。指揮官的作用是讓所有的動作經過同一個人，維持一個大家共同認知的現況。','重大事件先定指揮官：一個人統籌，動手前先講。',['c',[['指揮官','掌握全局｜決定順序｜不自己動手','a'],['處理人員','動手前先說'],['紀錄','記下時間軸'],['溝通','定時對外更新']]]],
['修復或重建',['排除問題本身有成本：花的時間、服務中斷的時間。','如果可以用自動化工具很快重建一台，就先重建來恢復服務。','把有問題的那一台保留下來，離線之後再慢慢分析原因。'],'一台應用伺服器行為異常，查了一小時沒有頭緒。先把它移出服務、用自動化重建一台新的上線，再對舊的那台做分析。','直接把有問題的主機刪掉重建，服務恢復了，但原因永遠不知道，下次還會再發生。重建之前要先把它保留下來。','當伺服器可以很快地被一模一樣地重建時，單一台主機就不再珍貴，「把這一台修好」不再是恢復服務的唯一途徑。這讓你可以把兩個目標分開處理：用重建來滿足「盡快恢復」，用保留現場來滿足「找出原因」。','能快速重建就先重建恢復服務，舊的留下來查。',['f',['查了很久｜沒頭緒','把舊的移出服務｜保留現場','重建一台｜恢復服務','事後分析｜舊的那台'],null,['w','a','a','']]]];
LEARN.svc[3]=[
['績效指標',['只用單一指標來考核，人的行為會朝那個指標扭曲。','只看結案數量，大家會挑簡單的案件做、草率結案，困難的問題沒有人願意碰。','要搭配幾個互相制衡的指標：數量、重複報修率、使用者滿意度、解決時間。'],'把「結案數」和「七天內同一問題再次報修的比率」一起看。草率結案會讓第二個數字變差，就無法靠衝數量取得好成績。','「先有一個指標總比沒有好」不一定成立。一個設計不好的指標會讓整體表現變得更差，因為它獎勵了錯誤的行為。','指標是真正目標的簡化，人會很自然地找出最省力的方式讓數字變好看。只有一個指標時，一定存在某種做法可以提高數字卻傷害真正的目標。用多個互相制衡的指標，就很難同時把每一個都做假。','量什麼就得到什麼；指標要多個、互相制衡。',['c',[['只看結案數','挑簡單的做｜草率結案','w'],['數量＋重複報修率｜＋滿意度','互相制衡｜較難扭曲']]]],
['問題管理',['事件管理的目標是盡快恢復服務；問題管理的目標是找出根本原因，讓它不再發生。','同一種故障反覆發生時，要把它當成一個「問題」來立案追查。','還沒有找到根因之前，可以先記錄已知的暫時處理方式，讓處理事件的人能更快恢復。'],'某個服務每個月都當掉幾次，每次重啟就好。立案追查後發現是記憶體洩漏，修正程式之後就不再發生。','「反正每次重啟就好了」讓大家習慣了這個故障，沒有人去追原因。直到有一天重啟也無法恢復。','事件處理講求速度，沒有時間深入追查，服務一恢復大家就回去做原本的事。如果沒有另一個專門的流程來處理「為什麼會發生」，這件事就永遠沒有人做，同樣的事件會一直消耗人力。','事件管理恢復服務，問題管理讓它不再發生。',['c',[['事件管理','盡快｜恢復服務'],['問題管理','找出根因｜不再發生','a']],'同一種故障反覆發生，就該立案為問題']],
['服務目錄',['服務目錄是把資訊單位提供的服務整理成一份清單。','每一項服務寫明：是什麼、誰可以申請、怎麼申請、多久可以完成。','它讓使用者知道可以期待什麼，也讓資訊單位的工作範圍變得明確。'],'服務目錄裡寫著：「新進人員帳號申請：由單位主管在人員到職三個工作天前提出，資訊單位於到職當天完成。」','服務目錄要用使用者的語言來寫。寫成「目錄服務帳號佈建」，使用者不會知道那就是他要找的東西。','使用者不知道資訊單位提供什麼、該找誰、要等多久，就只能到處問，然後對結果失望。資訊單位也會不斷接到不在職責範圍內的要求。把服務和標準公開，雙方的期待才有共同的基準。','服務目錄：有哪些服務、怎麼申請、多久完成。',['c',[['是什麼','服務的內容'],['誰能申請','對象與核准'],['怎麼申請','管道'],['多久完成','承諾的時間']]]],
['向上報告',['向高層爭取資源時，要把技術問題翻譯成業務影響。','說明：故障時會影響哪些業務、可能停多久、損失多少、發生的可能性。','同時提出選項和各自的成本，讓對方可以做選擇。'],'「核心交換器已經使用九年、原廠明年停止支援。它故障時全公司網路中斷，採購備品需要三週。汰換的費用是多少，另外有以下兩個替代方案。」','「設備太舊了、效能不好、已經終止支援」這些都是技術事實，但高層聽不出這和公司有什麼關係，也就無法排優先順序。','高層的工作是在有限的資源下，在很多個需求之間做取捨。他們比較的是風險和效益，而不是技術規格。你的提案如果沒有翻譯成他們衡量事情的單位：業務中斷、金額、法規責任，就無法和其他提案放在一起比較。','向高層報告：影響哪些業務、停多久、損失多少。',['f',['技術問題','會影響｜哪些業務','停多久｜損失多少','選項與｜各自的成本'],null,['off','a','a','']]],
['帶新人',['教會新人的有效順序是：先示範給他看，再陪著他做，最後放手讓他做，事後再一起檢視。','每一個階段都要給回饋。','放手的速度依他的表現調整，不是固定的時間表。'],'第一次由你處理、新人在旁邊看並聽你說明為什麼這樣做；第二次由他處理、你在旁邊；第三次他自己處理，結束後一起看紀錄。','只讓新人在旁邊看，他不會真的學會；直接丟給他做而沒有人看，他會養成錯誤的做法而且沒有人發現。','技能要靠實際操作才能學會，但沒有回饋的操作會把錯誤也一起練熟。逐步放手是讓新人在有安全網的情況下實作，並且在錯誤變成習慣之前就得到修正。','帶新人：示範、陪做、放手、檢視。',['f',['你做｜他看','他做｜你看','他自己做','事後｜一起檢視'],'每個階段都給回饋']],
['變更溝通',['會影響其他部門作業方式的變更，要從規劃階段就找他們一起討論。','討論時程和做法，了解他們的作業高峰和顧慮。','愈早讓對方參與，他們調整的空間愈大，也常常會提出你沒有想到的問題。'],'更換系統的專案在規劃時就邀請各部門的代表。會計部門提醒月底不能切換，這是資訊單位原本不知道的限制。','所有事情都決定好之後才「通知」受影響的部門，對方只能被動接受，容易反彈，而且這時候才發現的問題已經很難調整。','受影響的部門最了解自己的作業：什麼時候最忙、哪些步驟不能中斷、有哪些例外狀況。這些資訊在規劃階段取得，可以直接納入設計；上線前才取得，往往只能延期或硬著頭皮上線。','影響別人的變更，規劃階段就找他們一起談。',['c',[['規劃時就參與','納入對方的限制｜調整空間大'],['上線前才通知','對方只能接受｜容易反彈','w']]]],
['優先順序',['兩個部門的需求衝突而資源不夠時，執行的人不應該自己私下決定先做誰的。','有既定的優先規則就依規則判斷。','規則無法判斷時，往上請雙方共同的主管裁決，並把決定記錄下來。'],'兩個部門都說自己的專案最急。整理出兩邊的需求、期限和影響，送請共同的主管決定，並把結果通知雙方。','依照誰比較大聲、誰的職位比較高、或誰和你比較熟來決定。這會讓資訊單位變成被責怪的對象，也讓之後的每一次衝突都用同樣的方式解決。','先做哪一個，等於決定公司的資源要投在哪裡，這是管理上的決策，需要對兩邊的業務都有權責的人來做。執行的人的責任，是把兩邊的資訊整理清楚，讓這個決定可以很快做出來。','需求撞期：有規則照規則，沒有就往上裁決並留紀錄。',['f',['兩邊需求撞期','有優先規則？','沒有：請共同｜的主管裁決','記錄並｜通知雙方'],null,['w','','a','']]],
['值班制度',['緊急處理長期集中在同一個人身上，他會過勞，而且他不在的時候沒有人能接手。','值班要由多人輪替，並且有交接的機制和可以依循的文件。','也要有後援：值班的人處理不了時，知道可以找誰。'],'四個人每週輪流值班，交班時說明進行中的事項。常見問題都有處理手冊，處理不了時有第二線可以聯絡。','「他最熟，所以都找他」短期最有效率，長期是在累積風險。這個人離職或生病的那一天，問題會一次爆發。','人在長期睡眠不足和持續待命的狀態下，判斷力會下降，更容易犯錯。而所有的處理經驗只存在一個人身上，組織其實沒有這個能力，只是暫時借用了他的。輪替會迫使知識被寫下來並擴散。','值班要輪替、有交接、有文件、有後援。',['c',[['一個人長期值班','過勞｜他不在就沒人能接','w'],['多人輪替','有交接和文件｜有第二線後援']]]]];
LEARN.gov[3]=[
['資通安全管理法',['公務機關和特定非公務機關都要訂定、修正並實施資通安全維護計畫，並依規定提出實施情形。','責任等級 A 級和 B 級的機關，全部核心資通系統要導入 CNS 27001 或 ISO 27001 等資訊安全管理系統標準，並通過公正第三方驗證。','資通系統另外要做防護需求分級，依機密性、完整性、可用性、法律遵循性評估，分成普、中、高三級。'],'某機關是 B 級。它的核心資通系統要在核定後兩年內導入資訊安全管理系統、三年內通過第三方驗證；每個系統再各自評定防護需求等級，對應不同的防護基準。','責任等級（A 到 E）是對「機關」的分級；防護需求等級（普、中、高）是對「系統」的分級。兩者是不同的東西，同一個機關裡的不同系統可以有不同的防護需求等級。','一個機關裡的系統重要性差很多，用同一套標準要求所有系統並不合理。所以制度分成兩層：先依機關的重要性決定整體要做到什麼程度，再依每個系統的重要性決定它個別需要多強的防護。','A、B 級核心系統要導入 ISMS 並通過第三方驗證；系統防護需求分普、中、高。',['c',[['責任等級','對機關｜A、B、C、D、E'],['防護需求等級','對系統｜普、中、高'],['A、B 級','核心系統導入 ISMS｜通過第三方驗證','a']],'A、B 級：兩年內導入、三年內通過驗證']],
['個人資料保護法',['個資外洩時，被害人常常很難證明自己實際損失了多少。','個資法規定這種情況可以請求法院依侵害情節酌定賠償，每人每一事件新臺幣 500 元以上、2 萬元以下（第 28 條；非公務機關依第 29 條適用）。','單看每個人的金額不大，但外洩常常是幾萬、幾十萬筆。'],'一起外洩事件有十萬名當事人，即使以每人最低的 500 元計算，總額就是五千萬元。','「每個人賠幾百元而已」是低估了風險。除了賠償之外，還有行政罰鍰、通知當事人的成本、商譽的損失和後續的訴訟。','個資外洩的損害很難量化：資料被拿去做什麼、造成多少損失，被害人通常無從得知。如果一定要證明實際損害才能求償，這個權利幾乎無法行使。法定的賠償範圍讓被害人有實際可行的救濟途徑，也讓保有個資的單位有明確的財務風險。','個資外洩難證明損害時：每人每事件 500 到 2 萬元，乘上人數很可觀。',['c',[['每人每一事件','新臺幣 500 元以上｜2 萬元以下'],['十萬筆外洩','最低也是｜五千萬元','w']],'另外還有罰鍰、通知成本和商譽損失']],
['治理架構',['三道防線是把風險管理的責任分成三層。','第一道是業務單位和資訊單位，在日常作業中做好控制。','第二道是風險管理、資安、法遵這類單位，負責訂定規範並監督第一道。','第三道是內部稽核，獨立地檢視前兩道有沒有發揮作用。'],'資訊單位依規定管理帳號（第一道）；資安單位訂定帳號管理的規範並定期檢視執行情形（第二道）；稽核單位每年獨立查核整個機制（第三道）。','三道防線不是把工作往下一道推。第一道不能因為「反正有稽核會查」就放鬆自己的控制，大部分的風險是在第一道被擋下來的。','只靠執行的人自我管理，容易有盲點，也有利益衝突；只靠外部檢查，又離實際作業太遠。分成三層讓每一層有不同的距離和獨立性：愈後面的防線愈獨立，但也愈不即時。','第一道自己做好、第二道監督、第三道獨立稽核。',['c',[['第一道','業務與資訊單位｜日常控制'],['第二道','風險管理、資安｜法遵：監督'],['第三道','內部稽核｜獨立檢視']]]],
['文件管理',['資安管理的文件通常分成四階。','第一階是政策，說明方向和原則；第二階是程序，說明誰在什麼時候做什麼。','第三階是作業說明，說明具體怎麼做；第四階是紀錄，證明真的做了。'],'政策寫「存取權限應定期審查」；程序寫「各系統負責人每半年執行一次」；作業說明寫審查的操作步驟；紀錄是每次審查留下的清單和簽核。','文件寫得很完整但沒有照著做，或是有做但沒有留下紀錄，在稽核時都會被開出不符合。稽核是從政策一路對到紀錄的。','愈上層的文件愈穩定、愈少修改，愈下層的愈詳細、愈常更新。分層讓更換工具或調整步驟時只需要修改下層的文件。紀錄則是唯一能證明「制度有在運作」的東西。','四階文件：政策、程序、作業說明、紀錄。',['f',['政策｜方向','程序｜誰、何時、做什麼','作業說明｜怎麼做','紀錄｜證明有做'],'稽核會從政策一路對到紀錄']],
['法規遵循',['法規和主管機關的要求會持續變動。','組織要指定權責單位，定期鑑別有哪些適用的法規和契約要求。','每次有變動，就要評估對內部規定的影響並更新。'],'資通安全管理法修正之後，法遵單位整理出修正的重點，逐一對照內部規定，列出需要修改的條文和完成期限。','「制度建立的時候都對過了」不代表現在還符合。沒有人負責追蹤的話，內部規定就會繼續引用已經修正的舊條文。','法規的變動不會主動通知每一個受規範的單位，而不知道並不能免責。追蹤法規變動如果不是某個人明確的工作，每個人都會以為有別人在注意，結果就是沒有人注意。','指定專人定期追法規變動，並更新內部規定。',['f',['指定｜權責單位','定期鑑別｜適用的法規','評估對內部｜規定的影響','更新並｜宣導']]],
['職業倫理',['依法應該通報的資安事件，通報義務不會因為有人不想通報就消失。','遇到主管要求不要通報時，適當的做法是循內部的正式管道，向資安專責人員或更高的層級反映。','同時保留自己已經反映過的紀錄。'],'直屬主管要你先不要通報。你以書面向機關的資安專責人員說明事件的經過，以及依規定應該通報的理由。','默默照做，或是直接對外爆料，都不是好的第一步。前者讓你成為沒有通報的一份子，後者跳過了內部應有的處理程序。','通報義務是機關的法定責任，知情不報的後果由機關和相關人員承擔。內部的正式管道存在的目的，就是處理直屬主管的指示可能有問題的情況。留下紀錄，可以證明你盡了自己的責任。','被要求隱匿應通報的事件：走內部正式管道反映，並留下紀錄。',['f',['主管要求｜先不要通報','循內部｜正式管道反映','向資安專責人員｜或更高層級','保留反映｜的紀錄'],null,['w','a','','']]]];
// ===== 進階專科重點卡：資訊安全路線 =====
LEARN.blue={0:[
['SIEM',['SIEM 把防火牆、端點、身分系統等各種來源的紀錄集中收集起來。','它會把不同來源的紀錄關聯在一起分析，符合條件時產生告警。','單看一台設備的紀錄常常看不出問題，放在一起才拼得出完整的攻擊過程。'],'防火牆看到一次對外連線、端點看到一支程式啟動、AD 看到一次登入，三筆分開看都很普通；SIEM 把它們依時間和主機串起來，才發現是同一次入侵。','SIEM 不是買來裝好就會自己抓到攻擊。它只是工具，要有人接入對的紀錄來源、寫規則、看告警。','攻擊會在很多設備上各留下一小段痕跡。每台設備只看得到自己的那一段，沒有任何一台知道全貌。集中之後才能用「同一個帳號」「同一個時間」「同一個位址」把片段連起來。','SIEM：集中收紀錄、關聯分析、產生告警。',['f',['防火牆、端點｜AD 的紀錄','集中到 SIEM','關聯分析','產生告警'],null,['','a','','']]],
['告警分析',['收到告警的第一步是分流：確認它是不是真的，以及影響到哪些主機和帳號。','判斷真假之後，再決定優先順序和要不要升級處理。','過程和結論都要記錄，不論最後是不是誤報。'],'收到「可疑登入」告警：先查這個帳號平常從哪裡登入、這次的來源是什麼、登入之後做了什麼，再判斷是本人還是被盜用。','看到告警就直接隔離主機，或是看到很像誤報就直接關掉，都跳過了判斷這一步。','告警只是「可能有事」的訊號，裡面有相當比例是誤報。人力有限，所以要先用最少的時間判斷真假和範圍，才能把時間花在真正的事件上。','告警第一步是分流：是不是真的、影響到誰。',['f',['收到告警','是不是真的？','影響哪些｜主機和帳號','決定優先順序｜或升級'],null,['','a','a','']]],
['釣魚分析',['判斷釣魚信要看比較難造假的東西：寄件者實際的網域、連結真正指向的網址。','還可以看信件標頭裡 SPF、DKIM 的驗證結果。','顯示名稱、公司標誌、文筆這些都很容易仿冒，不能當依據。'],'信件顯示寄件者是「資訊部」，但實際的寄件地址是一個免費信箱；連結上顯示的是公司網址，滑鼠移過去看到的卻是另一個網域。','「看起來很正式、沒有錯字」不代表是真的。現在的釣魚信常常做得和真的一模一樣。','信件裡使用者看得到的部分幾乎都可以任意填寫。但信是從哪台伺服器寄出的、連結實際要連到哪裡，這些是技術上的事實，寄件者比較難掩蓋。','釣魚信看兩樣：實際的寄件網域、連結真正的去向。',['c',[['容易仿冒','顯示名稱｜標誌、文筆','w'],['比較可靠','實際寄件網域｜連結真正的網址｜SPF、DKIM 結果']]]],
['威脅情資',['把攻擊者用過的 IP 加進黑名單，效果有限，因為他換一個 IP 非常容易。','「痛苦金字塔」說明這件事：檔案雜湊值、IP、網域都很容易更換。','能夠偵測攻擊者的工具特徵、手法和行為，他才很難改變。'],'封鎖了攻擊者的中繼站 IP，隔天他換了一個新的又回來。改成偵測「文書軟體啟動命令列再對外下載」這個行為，他換多少個 IP 都會被發現。','黑名單不是沒有用，它便宜又快，可以擋掉大量低階的攻擊。問題是只靠黑名單，遇到稍微用心的攻擊者就完全無效。','對攻擊者來說，換一個 IP 只要幾分鐘，但要改變他習慣的工具和做事方法，等於要重新學習和開發。防禦的一方應該把力氣放在讓攻擊者付出最大代價的地方。','擋 IP 他馬上換；偵測手法和行為，他才換不掉。',['f',['雜湊值｜（最好換）','IP、網域','工具特徵','手法與行為｜（最難換）'],'愈往右，攻擊者愈難改變，偵測的價值愈高',['off','off','','a']]],
['時間同步',['調查事件要靠時間把不同設備的紀錄排出先後順序。','各台設備的時間如果不一致，就排不出正確的順序。','所以所有設備都要和同一個 NTP 來源校時，時區的設定也要一致或在紀錄中標明。'],'防火牆的紀錄顯示 10:05 有連線，伺服器的紀錄卻是 10:01 就有對應的動作。後來才發現兩台的時間差了五分鐘。','時間不準平常完全沒有影響，所以很容易被忽略，往往到了調查的時候才發現，而那時候已經來不及了。','事件調查的核心是重建「先發生什麼、後發生什麼」。攻擊的各個步驟可能只相隔幾秒，設備之間差幾分鐘，就足以讓因果關係完全顛倒。','所有設備跟同一個 NTP 來源校時，紀錄才對得起來。',['c',[['時間不一致','排不出先後順序','w'],['同一個 NTP 來源','紀錄可以互相對照']]]],
['偵測品質',['誤報是沒有攻擊卻產生告警；漏報是真的有攻擊卻沒有告警。','誤報浪費人力；漏報是被攻擊了卻完全不知道。','兩者是互相拉扯的，把誤報壓到零，通常代表漏報變多了。'],'為了不要有誤報，把一條規則的條件設得非常嚴格。結果告警是變少了，但稍微變化一下的真實攻擊也不會觸發。','「這個月沒有告警」不一定是好消息，可能是什麼都沒偵測到。偵測好不好，不能只看告警的數量。','偵測規則是在「正常行為」和「攻擊行為」之間畫一條線，而兩者有重疊的部分。線畫得寬，會把正常的也算進來；畫得窄，會把攻擊漏掉。所以要依後果的嚴重程度決定線畫在哪裡。','誤報是沒事卻響，漏報是有事沒響；兩個要一起看。',['c',[['誤報','沒有攻擊｜卻產生告警'],['漏報','真的有攻擊｜卻沒有告警','w']],'把誤報壓到零，通常代表漏報變多']],
['證據保全',['蒐集證據要依「揮發性」的順序，愈容易消失的愈先取。','順序大致是：記憶體內容、網路連線和執行中的程序，然後才是硬碟。','關機之後記憶體裡的東西就沒有了，所以不要先關機。'],'確認主機被入侵後，先擷取記憶體的內容，記錄目前的連線和程序，再製作硬碟的映像檔。','直覺上會想「先關機，免得被繼續破壞」。但是很多攻擊的痕跡只存在記憶體裡，一關機就永遠消失。','不同的資料存在的時間不同。硬碟上的檔案可以放很久，記憶體的內容隨時在變、斷電就清空。蒐集的動作本身也會改變系統的狀態，所以要先拿最容易消失、最容易被影響的東西。','取證順序：記憶體、連線與程序、最後才是硬碟；不要先關機。',['f',['記憶體內容','網路連線｜執行中的程序','硬碟'],'愈容易消失的愈先取',['a','','']]],
['通報文化',['同仁回報自己點了可疑連結時，資安單位應該感謝他並立刻協助處理。','不要責備。責備會讓大家下次不敢說。','應該處罰的是隱瞞，不是誠實回報。'],'同仁坦承點了連結並輸入了密碼。資安人員說：「謝謝你馬上告訴我們，我們現在先幫你重設密碼並檢查帳號。」','「讓他被罵一次，大家才會小心」的效果正好相反：大家學到的是點了不要講。','使用者的回報是成本最低、速度最快的偵測來源，很多攻擊是因為有人回報才被發現的。一個人回報通常代表還有其他人也中了但沒說。這個管道一旦因為怕被責罵而關閉，就只能靠技術偵測，會慢很多。','回報要感謝不要責備；該罰的是隱瞞。',['c',[['責備回報的人','下次沒有人敢說｜失去早期警報','w'],['感謝並協助','大家願意回報｜更早發現']]]]],
1:[
['帳號異常',['同一個帳號在不可能的時間內，從距離很遠的兩個地點登入，叫做「不可能的移動」，要懷疑帳號被盜。','要先排除 VPN 或代理伺服器造成的假象。','密碼噴灑是用少數幾組常見密碼去試很多個帳號，每個帳號只試一兩次，不會觸發鎖定。'],'紀錄顯示同一個來源位址，在一小時內對三百個不同的帳號各登入失敗一次。單看任何一個帳號都很正常，合起來看就是密碼噴灑。','只監控「單一帳號連續失敗幾次」會完全看不到密碼噴灑。要從來源的角度看：同一個來源對多少個帳號失敗。','帳號鎖定機制是針對「同一個帳號被反覆嘗試」設計的。攻擊者反過來做，固定密碼、更換帳號，就繞過了這個機制。只要帳號夠多，總有人用的是那幾組常見的密碼。','密碼噴灑：少數密碼試很多帳號；要看「同一來源對多少帳號失敗」。',['c',[['暴力破解','一個帳號｜試很多密碼'],['密碼噴灑','很多帳號｜各試一兩組密碼','w'],['不可能的移動','短時間內｜兩個遠距地點登入','w']]]],
['端點行為',['文書軟體正常情況下不會啟動命令列工具。','Office 程式啟動了 PowerShell，後面還帶著一長串編碼過的參數，是很典型的惡意文件行為。','「哪個程式啟動了哪個程式」的父子關係，是端點偵測很重要的線索。'],'使用者打開一份附件，端點紀錄顯示文書軟體啟動了 PowerShell，接著 PowerShell 連到外部下載了一個檔案。','PowerShell 本身不是惡意的，管理人員每天都在用。重點不是「有人用了 PowerShell」，而是「誰啟動它、帶什麼參數、在什麼情況下」。','惡意文件的目的是讓受害者的電腦執行攻擊者的指令，而最方便的方法就是呼叫系統內建的工具。把參數編碼是為了不讓指令的內容被直接看出來。這個組合在正常工作中幾乎不會出現，所以很適合當成偵測條件。','文書軟體叫出命令列＋編碼參數＝很可疑。',['f',['開啟附件','文書軟體｜啟動 PowerShell','帶編碼過的參數','對外下載檔案'],null,['','w','w','w']]],
['基準線',['要偵測異常，要先知道正常是什麼樣子。','基準線是記錄平常的行為：哪些主機會對外連線、哪些帳號在什麼時間登入、流量大約多少。','有了基準線，才能判斷某個行為是不是偏離了常態。'],'一台主機半夜對外傳了大量資料。如果它是每天半夜執行異地備份的主機，這很正常；如果它是一台平常不對外連線的資料庫，就非常可疑。','沒有基準線時，分析人員只能用通用的印象判斷「這看起來怪不怪」，結果不是誤報太多，就是真的異常被當成正常。','同一個行為在不同的環境裡意義完全不同。攻擊者的行為常常和正常的管理行為很像，區別只在於「這台主機、這個帳號平常不會這樣做」。這種判斷必須建立在對自己環境的了解上。','先知道平常的樣子，才看得出哪裡不正常。',['f',['記錄平常的｜行為','建立基準線','比對現在的｜行為','偏離就是｜異常'],null,['','a','','']]],
['偵測品質',['偵測規則的前提是有對應的資料。','規則寫好卻從來不響，要先確認：對應的稽核紀錄有沒有開、有沒有送進 SIEM、欄位有沒有正確解析。','每條規則上線前都要實際觸發一次，確認它真的會響。'],'寫了一條偵測「新增管理員帳號」的規則，一直沒響。實際在測試機上新增一個帳號，還是沒響，才發現伺服器的帳號管理稽核從來沒有啟用。','「規則沒有響」很容易被解讀成「沒有發生」。在確認資料來源完整之前，這個結論並不成立。','偵測是一條很長的鏈：系統要產生紀錄、紀錄要被送出、要被收進來、要被正確解析、規則的條件要寫對。任何一環斷掉，結果都是一樣的安靜。唯一能確認整條鏈都通的方法，就是實際做一次那個行為。','規則不響不代表沒事；先確認紀錄有開、有收，並實際測試。',['f',['稽核有開？','紀錄有送進｜SIEM？','欄位有｜正確解析？','實際觸發｜測試一次'],'任何一環斷掉，規則都不會響']],
['圍堵決策',['隔離被入侵的主機可以阻止擴散，但可能中斷業務。','這個取捨應該由有權責的人來決定，不是由值班的分析人員獨自承擔。','誰可以決定、多快要決定、什麼情況可以先做再報，都要在平時就訂好。'],'事先訂好的流程寫明：一般使用者電腦，分析人員可以直接隔離；核心業務主機，要由資安主管和業務主管在 30 分鐘內共同決定。','平時沒有講好，出事時才開始找人、開會、討論誰有權決定，攻擊者就多了好幾個小時可以行動。','圍堵是在兩種損失之間做選擇：不隔離，攻擊可能擴散；隔離，業務會中斷。這需要同時了解資安風險和業務影響，而且要對結果負責。在壓力下臨時決定容易出錯，所以要把決定的規則事先定好。','圍堵要權衡止血和業務中斷；誰決定，平時就講好。',['c',[['一般電腦','分析人員｜可直接隔離'],['重要業務主機','由權責主管｜在時限內決定','a']],'授權和流程要事先訂好']],
['事件報告',['事件報告至少要有：時間軸、影響範圍、根本原因、處置過程、後續改善。','報告的讀者是管理階層，以及日後回頭查閱的人。','重點是：發生了什麼、為什麼會發生、之後怎麼避免。'],'報告的第一頁用半頁說明事件摘要和影響；接著是時間軸；然後是根因分析；最後列出改善事項、負責人和期限。','把報告寫成操作的流水帳，或是充滿技術細節，管理階層看不出重點。另一個常見問題是只寫到「已恢復」，沒有根因和改善。','事件處理完之後，當時的細節會很快被遺忘，報告是唯一留下來的東西。管理階層要用它來決定要不要投入資源改善；未來發生類似事件的人，要用它了解上次是怎麼處理的。','事件報告五項：時間軸、範圍、根因、處置、改善。',['c',[['時間軸','何時發生什麼'],['影響範圍','哪些系統和資料'],['根本原因','為什麼會發生'],['處置','做了什麼'],['改善','負責人和期限']]]],
['釣魚分析',['釣魚信很少只寄給一個人。','有人回報時，要查出還有誰收到同一封信，從所有人的信箱移除它。','同時封鎖信裡的網址和寄件來源，並查出有誰已經點了連結。'],'一位同仁回報釣魚信。用寄件者和主旨搜尋郵件系統，發現共有四十二個人收到。全部移除之後，再從代理伺服器的紀錄找出有三個人已經連過那個網址。','只處理回報的那個人，然後結案。其他收到信的人裡，很可能有人已經點了連結卻沒有說。','回報的人是整個攻擊裡最不需要擔心的一個，因為他已經察覺了。真正的風險在於那些沒有察覺、已經輸入密碼或開了附件的人。一個人的回報，是讓你有機會找到其他所有受害者的線索。','一人回報＝很多人收到；查全部收件人、移除信件、封鎖網址。',['f',['一個人回報','查出所有｜收件人','從信箱移除｜封鎖網址','找出誰｜已經點了'],null,['','a','','w']]]],
2:[
['AD 攻擊偵測',['Kerberoasting 是攻擊者用一般帳號，請求大量服務帳號的服務票證，帶回去離線破解服務帳號的密碼。','徵兆是一個帳號在短時間內請求很多服務票證，而且加密類型偏舊。防禦上，服務帳號要用很長的隨機密碼。','DCSync 是攻擊者假裝成網域控制站，要求複寫來取得全網域的密碼雜湊。徵兆是不是 DC 的主機對 DC 發出目錄複寫的請求。'],'紀錄顯示一台一般的工作站對網域控制站發出目錄複寫請求。這不可能是正常行為，立即當成重大事件處理。','這兩種攻擊使用的都是 AD 正常的功能，不會觸發防毒，也不需要利用任何漏洞。只能從「誰在做、做了多少」看出異常。','任何網域使用者都可以請求服務票證，票證的一部分是用服務帳號的密碼加密的，所以可以拿來離線猜密碼。複寫則是 DC 之間同步資料的正常機制，問題在於有複寫權限的帳號被攻擊者取得之後，就能要求 DC 把密碼資料交出來。','大量請求服務票證＝Kerberoasting；非 DC 要求複寫＝DCSync。',['c',[['Kerberoasting','一個帳號大量請求｜服務票證','w'],['DCSync','非 DC 的主機｜要求目錄複寫','w']],'服務帳號用很長的隨機密碼；複寫只該發生在 DC 之間']],
['端點行為',['「就地取材」是攻擊者不帶自己的惡意程式，只使用系統內建的工具行動。','常用的有 PowerShell、排程工作、遠端管理工具。','因為都是合法的工具，特徵比對擋不到，要從行為和脈絡判斷：誰、在哪台主機、什麼時間、執行了什麼。'],'攻擊者用內建的遠端管理工具，從一台會計人員的電腦連到檔案伺服器。工具是合法的，但會計人員的電腦平常不會這樣做。','「沒有偵測到惡意程式」不代表沒有被入侵。這種攻擊從頭到尾可能沒有任何一個檔案會被判定為惡意。','防毒軟體的原理是辨識「壞的檔案」。攻擊者不使用壞的檔案，改用系統本來就有、管理人員每天都在用的工具，就讓這個原理失效了。剩下能用來區分的，只有「這個行為在這個情境下合不合理」。','就地取材用的全是合法工具；看行為和脈絡，不是看檔案。',['c',[['傳統惡意程式','有惡意檔案｜特徵比對可以擋'],['就地取材','只用內建工具｜要靠行為和基準線','w']]]],
['偵測品質',['新的偵測規則上線前，要先拿過去一段時間的紀錄回測。','回測可以知道這條規則會響多少次、其中有多少是真的。','同時也能確認需要的資料來源是不是真的存在。'],'新規則用過去三十天的紀錄回測，結果會產生兩千多次告警。檢視後加上三個排除條件，剩下每週兩三次，再正式上線。','沒有回測就直接上線，常見的結果是一天響幾千次把值班人員淹沒，或是因為欄位名稱不對而完全不響。','寫規則的時候心裡想的是攻擊的樣子，但環境裡有大量合法的行為看起來也是那個樣子。這些只有對著真實的資料跑一次才看得出來。回測等於是在不影響任何人的情況下，先預演這條規則上線之後會發生什麼。','規則上線前先回測：會響幾次、準不準、資料在不在。',['f',['寫好規則','用過去的｜紀錄回測','調整條件｜和排除清單','正式上線'],null,['','a','','']]],
['自動化',['SOAR 是把告警處理的步驟自動化的工具。','最適合先自動化的是蒐集和補充資訊：查 IP 的信譽、查帳號屬於誰、查主機的用途。','會影響業務的處置動作（例如隔離主機、停用帳號），要等規則夠準確、流程夠成熟再逐步自動化。'],'告警一產生，系統自動附上來源 IP 的信譽、帳號的部門和主管、主機的負責人和重要性。分析人員打開就能直接判斷。','一開始就把「偵測到就自動隔離」打開。規則如果有誤報，會自動把正常的主機或主管的帳號停掉。','補充資訊這類動作沒有副作用，做錯了也沒有損失，卻佔了分析人員大部分的時間，所以自動化的效益最高、風險最低。處置動作正好相反，錯一次的代價很高，需要先累積對規則準確度的信心。','先自動化「查資料」，再逐步自動化「做處置」。',['c',[['蒐集補充資訊','沒有副作用｜先自動化','a'],['處置動作','會影響業務｜成熟後再放手','w']]]],
['日誌保存',['攻擊者常常在環境裡潛伏好幾個月才被發現。','紀錄如果只保存 30 天，發現的時候，最初入侵的紀錄已經不在了。','保存期限要考慮攻擊者可能的潛伏時間，以及法規的要求。'],'發現入侵時往回追，追到四十天前紀錄就斷了。只知道攻擊者那時候已經在裡面，不知道他是怎麼進來的。','儲存空間不夠就把保存期限縮短，是很常見的決定。可以改成分級：近期的完整保存，較舊的只保留重要的類型或移到便宜的儲存。','調查的目標之一是找出最初的入侵管道，因為那個洞不補上，攻擊者清掉之後還能再進來。而最初入侵發生的時間點，往往比發現的時間早很多。紀錄的保存期限比潛伏時間短，這個問題就永遠沒有答案。','紀錄保存要比攻擊者潛伏的時間長。',['f',['最初入侵','潛伏好幾個月','被發現','往回查：｜紀錄已經不在'],null,['w','','','w']]],
['誘餌',['誘餌是故意放置、但正常情況下沒有人會使用的東西，例如一個看起來權限很高的帳號。','只要它被存取，幾乎就可以確定有問題。','它的誤報非常低，是少數「一響就要認真看」的告警。'],'在 AD 裡建立一個名稱看起來像備份管理員的帳號，沒有任何人或系統使用它，並監控任何對它的登入嘗試或票證請求。','誘餌要看起來像真的，而且不能讓內部人員誤用，否則就會產生誤報。另外它只能偵測到「碰了誘餌」的攻擊者，不能取代其他偵測。','一般的偵測難在要從大量正常行為裡分辨出異常。誘餌把這個問題反過來：它本身沒有任何正常的用途，所以任何存取都是異常，不需要基準線也不需要調校。','誘餌沒有人會碰，一響就是真的。',['f',['放置誘餌帳號','正常人｜不會碰它','攻擊者探索時｜碰到','高可信度｜告警'],null,['a','','w','a']]],
['成效指標',['MTTD 是平均偵測時間：從事件發生到被發現，平均要多久。','MTTR 是平均回應時間：從發現到處置完成，平均要多久。','這兩個數字愈短，攻擊者能造成的損害愈小。'],'去年平均要 20 天才發現入侵，今年縮短到 3 天；處置時間從 5 天縮短到 1 天。這比「今年擋下幾萬次攻擊」更能說明進步。','「擋下的攻擊次數」這類數字看起來很大，但大部分是自動掃描，不能反映真正的防護能力，也很難比較。','攻擊者從進來到達成目的需要時間，他要探索環境、提升權限、找到資料。防守的一方只要在這段時間內發現並處理，就能阻止損害。所以真正決定損害大小的是速度。','MTTD 多久發現，MTTR 多久處理完；愈短損害愈小。',['c',[['MTTD','從發生到發現｜平均多久'],['MTTR','從發現到處置完成｜平均多久']]]]],
3:[
['偵測品質',['評估偵測能力，要對照攻擊手法的知識庫（例如 MITRE ATT&amp;CK），逐項盤點哪些偵測得到、哪些是缺口。','盤點之後要實際測試，確認寫著「有涵蓋」的項目真的會響。','找出的缺口依風險排序，決定接下來先補哪裡。'],'把現有的規則對應到攻擊手法之後，發現「初始存取」有很多規則，「橫向移動」和「資料外傳」幾乎是空的，就把後兩者列為下一季的重點。','告警很多不代表看得到很多。可能有幾百條規則集中在少數幾種手法，其他大片範圍完全沒有涵蓋。','沒有一個參照的架構，偵測能力只能用「感覺」來評估，容易把力氣一直花在熟悉的地方。對照完整的手法清單，才看得出哪些地方從來沒有人想過要偵測。','偵測能力要對照攻擊手法逐項盤點，並實際測試。',['f',['對照攻擊手法｜知識庫','逐項盤點｜有沒有偵測','實際測試','依風險｜補上缺口'],null,['','a','','']]],
['事件應變',['攻擊者在內部有多個立足點時，最忌諱發現一個清除一個。','這樣會讓攻擊者察覺自己被發現，改用其他方式躲起來。','正確做法是先摸清楚全部的範圍，再選定時間一次同步處理：封鎖管道、重設憑證、移除後門。'],'發現三台被入侵的主機。先不動聲色地監控一週，確認共有七台主機和四個帳號受影響，再在同一個晚上全部同時處理。','直覺上會想「發現了就趕快處理」。但只處理看得到的那一部分，攻擊者會從沒被發現的地方回來，而且這次會更小心。','有經驗的攻擊者會準備好幾條回來的路。你只切斷其中一條，等於告訴他你知道了，但他還有其他的路。同步處理是讓他在來不及反應的情況下，一次失去所有的立足點。這段觀察期間要評估風險，如果他正在造成重大損害就不能等。','先摸清全部範圍，再一次同步清除；不要發現一個清一個。',['c',[['發現一個清一個','打草驚蛇｜他換方式躲起來','w'],['先摸清範圍','選定時間｜一次同步處理']],'若攻擊者正在造成重大損害，就不能等']],
['威脅情資',['情資的來源很多，每天可以有幾千筆，不可能全部處理。','要優先處理和自己的產業、使用的技術環境相關的。','而且要把情資轉成可以執行的東西：偵測規則、封鎖清單、修補的優先順序。'],'收到一份針對同產業的攻擊報告。從中整理出攻擊者使用的手法，檢查自己能不能偵測到，並針對其中兩項新增偵測規則。','訂閱了很多情資來源，全部匯入系統，結果產生大量無關的告警。情資沒有經過篩選，只是製造雜訊。','情資的價值不在於數量，而在於能不能回答「這和我有關嗎」和「我應該做什麼」。一份關於你沒有使用的系統的漏洞情資，對你沒有任何用處。把情資和自己的資產清單、產業對照之後，才知道哪些值得花時間。','情資要篩選：和我有關嗎？我該做什麼？',['f',['大量情資','篩選：和我的｜產業、環境有關？','轉成偵測規則｜或修補順序','執行'],null,['off','a','','']]],
['內部威脅',['為了偵測內部威脅而監控員工的行為，要在資安需求和員工隱私之間取得平衡。','監控要有政策依據，目的和範圍要明確，並且事先告知員工。','誰可以查看監控資料要有限制，每一次調閱都要留下紀錄。'],'公司的資訊使用規範明確寫出：公司設備上的活動會被記錄，目的是資訊安全；調閱個人的紀錄需要經過核准並留存紀錄。員工到職時簽署知悉。','「公司的設備，公司想怎麼看就怎麼看」是有風險的想法。沒有告知、沒有限定目的的監控，可能有法律問題，也會嚴重傷害員工的信任。','監控資料本身就是高度敏感的資料，裡面有員工的各種活動。它如果被濫用，造成的傷害不亞於它想要防範的威脅。所以要把目的限定清楚、把能看的人限制到最少，並讓「看」這個動作也被記錄。','監控員工要有依據、限定目的、事先告知、調閱留紀錄。',['c',[['政策依據','明文規定'],['目的與範圍','限定且明確'],['事先告知','員工知悉'],['調閱控管','核准並｜留下紀錄']]]],
