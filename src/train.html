 {q:"為什麼「人登入用的帳號」和「程式連線用的帳號」要分開？",a:["才能分辨操作是誰做的，權限也能各自給最小的","分開之後查詢會比較快","因為授權費是依帳號數量計算的","這樣程式的帳號就可以不用設定密碼，連線的時候比較方便"],why:"大家都用同一組程式帳號登入，紀錄上就看不出是程式還是哪個人做的，出事也無從追查。"},
 {q:"資料庫的備份檔，就放在資料庫所在的同一台主機上。最大的問題是？",a:["主機壞掉或被加密，備份會跟著一起沒有","備份的速度會變慢","還原的時候會需要比較多記憶體","沒有什麼問題，放在同一台主機還原的時候最快也最方便"],why:"備份要防的就是那台主機出事。至少要有一份在別的機器，最好還有一份離線或異地。"},
 {q:"要在一張幾千萬筆的資料表上新增欄位或索引。應該注意什麼？",a:["可能會長時間鎖住資料表，要安排在離峰並先測試","隨時都可以做，不會有任何影響","做之前要先把整張表清空","一定要在業務最繁忙的尖峰時段做，這樣才能確認新的欄位有沒有問題"],why:"結構變更在大表上可能跑很久，期間其他操作被擋住。先在複本上測要多久，再決定怎麼做。"},
 {q:"資料庫的交易紀錄檔越長越大，快把磁碟撐滿。最常見的原因是？",a:["一直沒有做交易紀錄的備份","資料表的數量太多","使用者的密碼太長","資料庫伺服器的時間設定錯誤，導致每一筆交易都被重複記錄了兩次"],why:"在需要保留完整紀錄的模式下，紀錄檔要備份之後才會釋放空間。沒排這個備份，它就只會一直長。"},
 {q:"月底跑大型報表時，線上交易就變得很慢。架構上常見的解法是？",a:["把報表查詢導到唯讀的複本","禁止任何人跑報表","把報表改到上班的尖峰時段跑","把交易資料全部刪除，只保留最近一個星期的資料，報表就會跑得比較快"],why:"報表是大範圍的讀取，會跟交易搶資源。讀寫分離讓兩種負載各走各的。"},
 {q:"資料庫裡早已超過保存期限的資料，應該怎麼處理？",a:["依規定歸檔或刪除，並留下處理紀錄","永遠留著，資料越多越好","想到的時候再隨意刪","複製一份給每一個部門各自保管，避免之後有人需要的時候找不到"],why:"過期的個資繼續留著，只有風險沒有用處，個資法也要求目的消失或期限屆滿後要刪除或停止利用。"},
 {q:"正式資料庫的結構要變更（加欄位、改預存程序）。比較好的管理方式是？",a:["寫成腳本，進版本控制並經過審查再執行","直接用管理工具點一點改掉","請開發人員各自上去改","先在正式環境改好，之後有空的時候再回頭把測試環境改成一樣的"],why:"手動改的東西沒有紀錄、無法重現，測試和正式環境很快就不一致。腳本化之後，每次變更都查得到。"}
],[
 {q:"一個只用來產生報表的帳號，資料庫權限應該怎麼給？",a:["只給需要的資料表或檢視表的讀取權限","給資料庫擁有者權限，免得報表跑不出來","跟應用程式共用同一組帳號","先給它全部的權限，等到哪一天稽核提出意見的時候再慢慢收回來"],why:"報表只需要讀。用檢視表還能進一步只開放需要的欄位，把個資欄位排除在外。"},
 {q:"備份檔有加密，但解密的金鑰就放在備份檔的同一個資料夾。這樣的問題是？",a:["拿到備份的人同時拿到金鑰，等於沒有加密","沒有問題，這樣還原最方便","備份檔會變得比較大","加密過的備份檔沒有辦法複製到其他地方，所以只能把金鑰放在一起"],why:"金鑰要和資料分開保管，而且自己也要備份。金鑰弄丟，加密的備份就永遠打不開。"},
 {q:"資料庫為什麼需要定期做索引維護和更新統計資訊？",a:["資料變動後索引會破碎、統計會失準，查詢效能會慢慢變差","這是為了讓資料庫看起來比較忙","為了減少使用者數量","因為沒有定期維護的索引，超過一個月之後就會被資料庫自動刪除"],why:"資料庫靠統計資訊決定怎麼執行查詢。長期不維護，會出現「什麼都沒改卻越來越慢」的狀況。"},
 {q:"監控資料庫時，下列哪一組指標最能提早發現問題？",a:["連線數、鎖定等待時間、空間成長、慢查詢數量","機房的溫度和濕度","伺服器機殼的顏色","資料庫管理工具的視窗目前是開在螢幕的左邊還是右邊"],why:"CPU 和記憶體只是表面。連線快滿、鎖等待變長、空間成長加速，都是出事前的徵兆。"},
 {q:"做備份還原演練，還原完成後要驗證什麼才算數？",a:["資料庫開得起來、資料筆數和內容正確、應用程式連得上","還原指令沒有出現錯誤訊息就好","備份檔的檔名正確","還原所花的時間有沒有比上一次演練的時間還要短"],why:"指令成功不代表資料可用。要實際查幾筆資料、讓應用程式連上去測，並記下花了多久。"},
 {q:"要一次更新 500 萬筆資料。比較好的做法是？",a:["分批執行，每批提交一次","一個交易全部更新完","挑尖峰時段做","先把資料庫所有的索引和備份都刪除掉，這樣更新起來才會比較快"],why:"單一巨大交易會長時間鎖住資料、撐爆交易紀錄，失敗時回復也很久。分批可以隨時停、影響也小。"},
 {q:"法規或稽核要求能回答「誰在什麼時候查過這張客戶資料表」。資料庫要具備什麼？",a:["針對敏感資料表的存取稽核紀錄","更大的硬碟","更快的 CPU","每一位使用者在查詢資料之前都先用電子郵件向資料庫管理員報備"],why:"一般的紀錄只記錯誤和登入。要能追到「誰讀了哪些資料」，必須另外啟用稽核，並把紀錄妥善保存。"},
 {q:"資料庫軟體的版本已經過了原廠的支援期限。最主要的風險是？",a:["新的漏洞不會再有修補","資料會自動消失","查詢語法會全部失效","原廠會從遠端把資料庫鎖起來，直到客戶付費升級之後才會解開"],why:"跟作業系統一樣，終止支援後漏洞沒人修。資料庫放的又是最重要的資料，升級要提早規劃。"}
],[
 {q:"同一個交易裡，同一筆資料查了兩次，結果不一樣，因為中間被別的交易改掉並提交了。要避免這個現象，應該調整什麼？",a:["提高交易的隔離等級","加大硬碟空間","把查詢改寫成大寫","把資料庫的連線數上限調高到目前的十倍"],why:"這叫不可重複讀。隔離等級越高，交易之間越看不到彼此，但鎖定和衝突也越多，要依需求取捨。"},
 {q:"「樂觀鎖定」的做法是什麼？",a:["不先鎖資料，更新時檢查版本，發現被別人改過就失敗重來","讀取時就把資料鎖住，別人完全不能動","完全不做任何檢查","假設所有的使用者都很小心，所以不需要任何的並行控制機制"],why:"衝突不多時，樂觀鎖的效能好很多。常見做法是加一個版本欄位，更新時比對。"},
 {q:"在 (部門, 到職日) 兩個欄位上建了一個複合索引。下列哪一個查詢用不到這個索引的主要效果？",a:["只用到職日當條件","只用部門當條件","部門和到職日都當條件","先用部門當作條件篩選，然後再依照到職日排序"],why:"複合索引像電話簿先排姓再排名。沒給第一個欄位，就沒辦法利用排序直接定位。"},
 {q:"「覆蓋索引」是什麼意思？",a:["查詢需要的欄位索引裡都有，不必再回資料表讀","一個索引蓋掉另一個索引","把所有欄位都建索引","把舊的索引整個刪除之後，用相同的名稱再重新建立一個"],why:"少了回表這一步，讀取量大幅減少。常用且固定欄位的查詢，很適合這樣設計。"},
 {q:"資料庫的瓶頸是「寫入」量太大，單一主機已經撐不住。增加唯讀複本有幫助嗎？",a:["幫助有限，寫入還是集中在主要節點，要考慮分片或調整架構","有，複本越多寫入越快","有，只要把複本改成可寫入","沒有幫助，而且只要增加任何一台複本就一定會造成資料全部遺失"],why:"複本分擔的是讀取。寫入要分散，得把資料依某個鍵拆到多台（分片），代價是架構複雜很多。"},
 {q:"採用「完整備份＋多份交易紀錄備份」。中間有一份紀錄備份損毀了，會怎樣？",a:["只能還原到損毀那一份之前的時間點","完全沒有影響","全部的備份都不能用","資料庫會自動從其他的備份推算出損毀的那一份內容並且補上"],why:"紀錄備份是一條鏈，斷了就接不下去。所以備份要驗證完整性，並定期重做完整備份縮短鏈的長度。"},
 {q:"要把一個欄位改名，但服務不能停。比較安全的步驟是？",a:["先新增欄位並同時寫入兩邊，程式都改用新的之後再移除舊的","直接改名，程式報錯再修","先把服務停掉一整天","先把舊的欄位刪除，等使用者反應有問題的時候再把新的欄位加上去"],why:"這叫「擴充、遷移、收縮」。每一步新舊版程式都能正常運作，任何一步出問題都可以退。"},
 {q:"要定期更換應用程式連資料庫的密碼，又不想造成服務中斷。常見的做法是？",a:["準備兩組帳號輪替，或由密鑰管理系統讓程式動態取得","永遠不換，最安全","更換的同時把所有應用程式一起重啟","把新的密碼用電子郵件寄給每一位開發人員，請他們各自找時間修改"],why:"直接改密碼，還在用舊密碼的程式會全部斷線。雙帳號輪替讓新舊可以重疊一段時間。"}
],[
 {q:"分散式資料庫的 CAP 定理說，網路分割發生時，只能在哪兩者之間選一個？",a:["一致性和可用性","速度和容量","價格和品質","備份和還原，兩者之中只能選擇保留其中一個功能"],why:"節點之間連不上時，要嘛拒絕服務以保證資料一致，要嘛繼續服務但可能讀到舊資料。"},
 {q:"「最終一致性」是什麼意思？",a:["更新後各節點可能短暫不同步，但一段時間後會趨於一致","資料永遠不一致","每次讀取都保證是最新的","資料只會在每一年的最後一天才進行一次同步"],why:"它用短暫的不一致換來高可用和效能。適不適合要看業務：按讚數可以，帳戶餘額通常不行。"},
 {q:"兩個資料中心都可以寫入（多主架構）。最難處理的問題是什麼？",a:["兩邊同時改了同一筆資料時，衝突要怎麼解決","硬碟顏色不一樣","查詢語法會不同","兩個資料中心的資料庫管理員彼此不認識，所以沒有辦法合作"],why:"以最後寫入為準會默默丟掉一邊的修改。衝突的處理規則要在設計時就決定，而且業務單位要同意。"},
 {q:"要儲存大量的感測器讀數，每秒寫入很多筆，查詢多半是「某段時間的趨勢」。哪一類資料庫比較適合？",a:["時序資料庫","傳統的試算表","圖形資料庫","任何一種都一樣，資料庫的種類對效能完全沒有影響"],why:"時序資料庫針對依時間寫入、壓縮和區間彙總做了最佳化。選型要看資料的形狀和查詢方式。"},
 {q:"使用者送出修改後，馬上重新整理卻看到舊資料，過幾秒才變新的。架構是主要節點寫入、複本讀取。原因是？",a:["複寫有延遲，讀取剛好被導到還沒同步的複本","使用者的螢幕太舊","資料庫壞了","使用者重新整理的動作太快，瀏覽器來不及把畫面畫出來"],why:"這叫「讀不到自己剛寫的」。常見解法是剛寫入的使用者短時間內改讀主要節點。"},
 {q:"資料庫要跨大版本升級，又幾乎不能停機。常見的做法是？",a:["建一套新版本，用複寫同步資料，驗證後把流量切過去","直接在正式環境原地升級","先把資料全部匯出成文字檔，停機一週","在使用量最高的時段直接升級，這樣才能立刻知道有沒有問題"],why:"新舊兩套並存，切換只要幾分鐘，有問題還能切回舊的。原地升級失敗就只能還原備份。"},
 {q:"「這個欄位能不能開放給行銷部門查詢？」這個問題，應該由誰決定？",a:["資料的擁有者，也就是負責這份資料的業務單位","資料庫管理員自己決定","誰先問就給誰","由資料庫軟體的原廠工程師依照技術上的可行性來決定"],why:"DBA 是保管者，負責照決定去落實權限。資料能給誰用，是業務和法遵的判斷。"},
 {q:"搬到依查詢量計費的雲端資料倉儲後，帳單暴增。最該先檢查什麼？",a:["有沒有查詢在掃描不必要的大量資料，例如沒有篩選分割區","雲端業者的地址","資料表的名稱","公司同仁每天登入系統的時間是不是都集中在早上"],why:"依掃描量計費時，一個沒加日期條件的查詢就可能很貴。分割、只選需要的欄位、設用量上限是基本功。"}
]]},
{id:'dev',lv:[[
 {q:"需求還講不清楚就開始寫程式，最常見的後果是什麼？",a:["做出來的不是對方要的，整個重做","程式的執行速度會比較慢","會用掉比較多的硬碟空間","沒有什麼後果，寫出來之後使用者自然就會知道自己到底想要什麼"],why:"先確認「做到什麼程度算完成」。花一小時問清楚，常常可以省掉一個星期的重工。"},
 {q:"單元測試的主要目的是什麼？",a:["確認每一小段程式的行為符合預期，改動時能馬上發現改壞了","測試使用者會不會操作","測試伺服器的硬體夠不夠力","取代所有其他種類的測試，有了單元測試之後系統就可以直接上線"],why:"有測試保護，才敢放心改舊程式。它不能取代整合測試和實際操作的驗證。"},
 {q:"Git 合併時出現「衝突」（Conflict），代表什麼？",a:["兩邊改到同一段程式，Git 沒辦法自動決定要留哪個","儲存庫壞掉了","有人把分支刪除了","網路連線中斷，導致有一部分的檔案沒有成功下載到自己的電腦上"],why:"衝突不是錯誤，是 Git 請你來判斷。看懂兩邊各改了什麼再決定，不要直接整段蓋掉別人的。"},
 {q:"HTTP 狀態碼 404 和 500，差別是什麼？",a:["404 是找不到這個資源，500 是伺服器端的程式出錯","兩個都代表成功","404 是伺服器錯誤，500 是找不到資源","404 代表使用者的網路斷線了，500 則代表使用者的瀏覽器版本太舊"],why:"4 開頭通常是請求這邊的問題（網址錯、沒權限），5 開頭是伺服器那邊的問題。排錯時先看這個。"},
 {q:"設計 API 時，為什麼「刪除資料」不應該用 GET 來做？",a:["GET 應該只用來讀取，瀏覽器或爬蟲可能會自動去觸發它","GET 的速度比較慢","GET 沒辦法帶參數","因為 GET 的請求一定會被防火牆擋下來，沒有辦法送到伺服器"],why:"GET 被預期是安全、可重複的。預先載入、搜尋引擎、防毒掃描都可能去打連結，資料就莫名被刪了。"},
 {q:"寫 log 時，下列哪一種資料不應該寫進去？",a:["密碼、金鑰、完整的身分證字號這類敏感資料","錯誤訊息","發生的時間","是哪一支程式、哪一個功能在什麼情況之下產生了這一筆紀錄"],why:"log 的權限通常比資料庫鬆，還會被送到別的系統。敏感資料寫進去，等於多一個外洩的地方。"},
 {q:"網頁上已經用 JavaScript 檢查過輸入格式了，後端還需要再檢查一次嗎？",a:["需要，前端的檢查可以被繞過","不需要，檢查一次就夠了","看使用者有沒有登入","不需要，而且重複檢查會讓系統慢很多，使用者會明顯感覺到延遲"],why:"前端的檢查是為了使用體驗。攻擊者可以直接對 API 送請求，完全不經過你的網頁。"},
 {q:"為什麼要把開發、測試、正式環境分開？",a:["避免還沒測好的程式或測試資料影響到正式的服務","這樣可以多買幾台伺服器","只是業界的習慣，沒有實際的作用","分開之後開發人員就不需要寫測試，因為測試環境會自動幫忙測試所有的功能"],why:"在正式環境直接改，一個小錯就是線上事故。分開之後，可以放心試、試壞了也沒關係。"}
],[
 {q:"網頁把使用者輸入的留言原封不動顯示出來，結果別人打開頁面時被執行了惡意的 JavaScript。這是什麼漏洞？該怎麼防？",a:["XSS，輸出到頁面時要做編碼","SQL Injection，要用參數化查詢","暴力破解，要鎖定帳號","阻斷服務攻擊，要增加伺服器的頻寬並且多買幾台主機來分散流量"],why:"跨站腳本（XSS）的根本解法是輸出時依情境編碼，讓瀏覽器把它當成文字而不是程式。"},
 {q:"程式出錯時，把完整的錯誤堆疊和 SQL 語句直接顯示在使用者的畫面上。這樣有什麼問題？",a:["洩漏系統內部的結構，給攻擊者線索","沒有問題，這樣使用者才能自己解決","會讓網頁變慢","使用者會因為看不懂這些訊息而感到困擾，除此之外並沒有其他的問題"],why:"詳細的錯誤寫進 log 給自己看；給使用者的只要一句看得懂的訊息和一個可以回報的代碼。"},
 {q:"正式環境出現嚴重的 bug 要緊急修。而開發分支上已經有一堆還沒測完的新功能。該怎麼做？",a:["從正式版本開一個修補分支，修好後合併回正式和開發兩邊","直接把開發分支整個上線","等新功能全部測完再一起修","直接登入正式環境的伺服器手動修改程式，之後有空再補回版本控制"],why:"修補只帶必要的改動，不夾帶沒測過的東西。修完也要合回開發分支，不然下次上版 bug 又回來。"},
 {q:"版本號 <code>2.4.1</code> 升到 <code>3.0.0</code>，依語意化版本的慣例，代表什麼？",a:["有不相容的重大變更","只修了小 bug","只加了新功能，完全相容","代表這已經是這個軟體的第三次發行，跟內容有沒有變更沒有關係"],why:"格式是「主版號.次版號.修訂號」。主版號變動表示可能要改程式才能升級，升之前要先看變更說明。"},
 {q:"儲存使用者密碼，為什麼不該用 MD5 或 SHA-1，而要用 bcrypt、Argon2 這類演算法？",a:["後者是刻意設計得很慢，讓暴力破解的成本變高","後者產生的字串比較短","MD5 需要付授權費","因為後者可以把密碼解密還原回來，使用者忘記密碼的時候比較方便查詢"],why:"一般的雜湊算得很快，顯示卡一秒能試幾十億組。密碼專用的演算法又慢又可調，還內建加鹽。"},
 {q:"使用者登入後，把網址上的 <code>id=1001</code> 改成 <code>id=1002</code>，就看到別人的資料。問題出在哪？",a:["只檢查了有沒有登入，沒檢查這筆資料是不是他的","密碼太短","網站沒有用 HTTPS","資料庫的編號不應該使用連續的數字，改成用亂數編號就可以完全解決"],why:"驗證是「你是誰」，授權是「你能做什麼」。每次存取資料都要在後端檢查擁有者，不能只靠隱藏網址。"},
 {q:"你的程式要呼叫第三方的金流 API。自動化測試時應該怎麼處理？",a:["用模擬的替身或對方提供的測試環境","每次測試都真的刷一筆","跳過這段不測","請第三方廠商在我們每一次執行測試之前，先暫時把他們的收費功能關閉"],why:"測試要能重複跑、不產生真實的副作用。把外部服務隔開，也才能測到「對方回錯誤或逾時」的情況。"},
 {q:"一個專案的 README，最基本應該讓讀的人做到什麼？",a:["知道這是什麼，並且能把它跑起來","了解作者的心路歷程","背下所有的程式碼","知道這個專案從開始到現在的每一次會議上，大家各自說了什麼話"],why:"接手的人（包括半年後的自己）最需要的是：這做什麼、怎麼安裝、怎麼啟動、設定放哪裡。"}
],[
 {q:"使用者登入網路銀行後，又點了惡意網站，該網站偷偷以他的身分送出轉帳請求。這是什麼攻擊？常見的防護是？",a:["CSRF，用防偽權杖和 SameSite Cookie","XSS，把輸出編碼","SQL Injection，用參數化查詢","暴力破解，限制密碼輸入錯誤的次數並且鎖定帳號"],why:"跨站請求偽造利用的是瀏覽器會自動帶上 Cookie。伺服器要能確認請求真的來自自己的頁面。"},
 {q:"付款 API 因為網路逾時，用戶端自動重送了一次。要避免扣兩次款，API 應該怎麼設計？",a:["讓用戶端帶一個唯一的請求識別碼，伺服器對同一個識別碼只處理一次","禁止用戶端重送","每次都直接扣款","在扣款之後等待十分鐘，確認沒有重複的請求之後再回覆結果"],why:"這是冪等鍵。網路不可靠，重送一定會發生，所以要讓「重送」是安全的。"},
 {q:"為了加速，把查詢結果放進快取。最需要小心處理的是什麼？",a:["原始資料變更時，快取要怎麼更新或失效","快取的名稱要取得好聽","快取要放在最貴的伺服器上","快取裡面的資料要定期全部列印出來，交由主管逐筆核對簽名"],why:"快取沒更新，使用者就會看到舊資料。要想清楚多久過期、資料改了誰去清、能接受多舊。"},
 {q:"兩個系統之間改用「訊息佇列」傳遞工作，而不是直接互相呼叫。主要的好處是？",a:["對方暫時掛掉或變慢時，工作先排著，不會一起被拖垮","傳輸的速度一定比較快","不需要寫任何程式","兩個系統之間就再也不需要約定資料的格式和欄位"],why:"佇列讓兩邊解耦：送的人不必等、收的人依自己的速度處理，尖峰時還能當緩衝。"},
 {q:"這次上版同時改了資料庫結構和程式。部署時應該注意什麼順序？",a:["資料庫的變更要同時相容新舊版程式，才能逐步切換或退版","先刪掉舊欄位，再部署新程式","順序不重要","先把正式環境的資料全部清空，這樣結構的變更才不會發生衝突"],why:"部署期間新舊版程式會同時存在，退版時舊程式還要能跑。不相容的變更要拆成多次上版。"},
 {q:"對外開放的 API 加上「速率限制」（Rate Limiting），是為了防什麼？",a:["單一來源短時間內大量呼叫，拖垮服務或暴力嘗試","使用者輸入錯別字","資料庫欄位太多","開發人員在下班之後還繼續加班修改程式"],why:"沒有限制，一支寫壞的程式或一個攻擊者就能把服務打掛，登入類的 API 也會被拿來猜密碼。"},
 {q:"一個請求會經過好幾個服務。排查問題時，怎麼把各個服務的紀錄串在一起？",a:["每個請求帶一個追蹤識別碼，一路傳下去並寫進每筆紀錄","用時間大概對一下","每個服務各自看各自的","請使用者把他當時的操作步驟重新做一遍，同時所有人盯著螢幕看"],why:"有了同一個識別碼，用它一搜就能看到這個請求在每個服務發生了什麼。靠時間對，量一大就對不起來。"},
 {q:"系統需要登入和授權功能。比較穩當的做法是？",a:["採用成熟的標準和框架（例如 OAuth 2.0、OpenID Connect）","自己設計一套加密和驗證的方法","把密碼用 Base64 編碼就好","為了方便使用者，登入之後就不再檢查任何權限"],why:"身分驗證的細節非常容易出錯，自己發明幾乎一定有洞。用經過大量檢驗的標準和函式庫。"}
],[
 {q:"把單體系統拆成微服務，最主要的代價是什麼？",a:["部署、監控、除錯和資料一致性都變得複雜很多","程式一定會變慢","不能再用資料庫","每一個微服務都必須要使用不同的程式語言來開發"],why:"微服務換來的是團隊可以獨立部署和擴充。團隊小、系統不大時，單體通常更簡單也更可靠。"},
 {q:"一筆訂單要依序呼叫付款、庫存、出貨三個服務，中途可能失敗，又沒辦法用同一個資料庫交易包起來。常見的設計是？",a:["每一步都有對應的補償動作，失敗時反向取消已完成的步驟","失敗就算了","讓使用者自己打電話處理","把三個服務的程式碼全部複製到同一個檔案裡面"],why:"這是 Saga 模式。跨服務沒有真正的回滾，只能靠「退款」「釋放庫存」這類補償，把狀態拉回來。"},
 {q:"呼叫的下游服務開始大量逾時。為什麼需要「斷路器」（Circuit Breaker）？",a:["暫時停止呼叫並快速失敗，避免自己的資源被耗盡、連鎖倒下","讓呼叫的次數變多","把下游服務關機","讓每一個失敗的請求都自動重試一千次，直到成功為止"],why:"一直等逾時，自己的執行緒和連線會被占滿。斷路器先擋掉，過一陣子再試探對方恢復了沒。"},
 {q:"「威脅建模」最應該在開發流程的哪個階段做？",a:["設計階段，還沒開始寫程式之前","上線之後","被攻擊之後","專案結束、開發人員都已經調到其他專案之後"],why:"設計上的問題最貴，越晚發現越難改。先問「誰會想攻擊這裡、怎麼攻擊、我們怎麼擋」。"},
 {q:"系統很慢，團隊想開始優化。第一步應該是什麼？",a:["先量測，找出時間實際花在哪裡","把所有程式重寫一遍","換更貴的伺服器","請每一位開發人員各自猜一個最可能的原因，然後大家同時動手修改"],why:"憑感覺優化常常改錯地方。有了量測數據，才知道瓶頸在哪，改完也才知道有沒有效。"},
 {q:"一套十幾年的舊系統要汰換。比起「全部重寫、一次切換」，哪一種做法風險比較低？",a:["逐步把功能一塊一塊搬到新系統，新舊並行直到舊的可以關掉","全部重寫，三年後一次上線","不汰換","先把舊系統關掉，讓使用者暫時改用紙本作業直到新系統完成"],why:"這叫絞殺者模式。每次只換一小塊，隨時可以調整方向，不會賭一把大的。"},
 {q:"事件驅動架構中，事件的格式要增加欄位。怎麼做才不會弄壞還沒更新的訂閱者？",a:["只新增選填欄位，不移除或改變既有欄位的意義","直接改掉原本的欄位名稱","通知大家當天一起更新","每一次修改格式的時候都同時把所有的歷史事件刪除"],why:"發布者和訂閱者不會同時升級。向後相容的演進（只加不改）讓雙方可以各自的步調更新。"},
 {q:"建置和部署的管線（CI/CD）為什麼是重要的保護對象？",a:["它能把程式送上正式環境，被入侵等於可以在所有產出裡植入惡意程式","因為它很貴","因為它跑得很慢","因為管線的設定畫面很複雜，一般的開發人員看不懂"],why:"管線握有金鑰和部署權限。要用最小權限、保護密鑰、審查變更，並對產出的成品簽章。"}
]]},
{id:'grc',lv:[[
 {q:"管理系統常講的 PDCA 是指什麼？",a:["規劃、執行、檢查、改善的循環","四種加密演算法","四個資安等級","採購、開發、建置、驗收這四個資訊專案一定要經過的階段"],why:"ISO 27001 的精神就是這個循環：訂計畫、照著做、檢查有沒有效、把問題改掉，然後再來一輪。"},
 {q:"建立 ISMS 時，為什麼通常從「資產清冊」開始？",a:["不知道有什麼要保護，就沒辦法評估風險","因為稽核員只看這一份文件","因為它是所有文件裡最簡單的","清冊可以取代風險評鑑，有了清冊之後就不需要再另外評估每一項的風險"],why:"資產、威脅、弱點合起來才是風險。清冊漏掉的系統，後面的風險評鑑和控制也都不會涵蓋到它。"},
 {q:"風險評鑑時，風險值最常見的算法是？",a:["發生的可能性 × 造成的衝擊","資產的購買價格 × 使用年限","員工人數 ÷ 電腦數量","去年發生的資安事件件數，加上今年預計會發生的資安事件件數"],why:"很可能發生但影響很小、和很少發生但一發生就很嚴重，都要考慮。兩個乘起來才能排出先後順序。"},
 {q:"稽核員問：「帳號有定期清查嗎？」你回答「有」。接下來稽核員會要什麼？",a:["可以證明有做的紀錄","你的口頭保證","主管的簽名照","一份由你當場寫下來的切結書，保證每一季都有確實執行帳號的清查"],why:"稽核看的是證據。說有做但拿不出紀錄，在稽核上等同沒有做。"},
 {q:"稽核發現「整個帳號清查的程序從來沒有執行過」。這比較可能被判定成什麼？",a:["主要不符合","觀察事項","改善建議","符合事項，因為程序文件已經有訂定出來了，只是還沒有時間開始執行"],why:"整個控制沒有運作，屬於系統性的失效，是主要不符合。偶發的單一缺漏通常才是次要不符合。"},
 {q:"ISO 27001 要求定期召開「管理審查」。它的目的是什麼？",a:["讓最高管理階層檢視 ISMS 的成效，並決定資源和改善方向","讓資訊人員互相檢查彼此的工作","審查員工的出勤狀況","由外部的驗證公司來決定組織下一個年度的資訊安全預算應該編列多少"],why:"資安要有效，高層必須知道現況並給資源。管理審查就是把這件事固定下來的機制。"},
 {q:"組織的資訊安全政策，應該由誰核准？",a:["最高管理階層","資訊單位的承辦人","委外的廠商","每一位員工各自決定自己要遵守哪些規定，再彙整起來成為政策"],why:"政策代表組織的承諾，也是往下訂所有程序的依據。由高層核准，推動時才有正當性。"},
 {q:"內部稽核和外部的驗證稽核，主要差別是什麼？",a:["內稽是組織自己查自己有沒有做到，驗證稽核是第三方來判斷能否發證","內稽不需要留紀錄","外部稽核只看文件，不會到現場","內部稽核的結果在法律上具有強制力，外部的驗證稽核則只是僅供參考"],why:"內稽是自己先找問題並改善；驗證稽核由驗證機構執行，結果決定證書的發放和維持。"}
],[
 {q:"公司替機房買了火災保險。在風險處理的四種選項裡，這屬於哪一種？",a:["轉移","降低","避免","接受"],why:"保險是把財務損失轉給保險公司，風險本身還在。降低是做控制措施，避免是乾脆不做那件事。"},
 {q:"機房裝了監視器並且錄影。依控制措施的類型，這主要屬於哪一種？",a:["偵測性控制","預防性控制","矯正性控制","補償性控制"],why:"門禁是預防（不讓進），監視器是偵測（發生了看得到），備份還原是矯正（事後復原）。"},
 {q:"「職務區隔」的目的是什麼？",a:["不讓一個人能獨自完成整個敏感流程，降低舞弊和錯誤","讓每個人的工作量平均","減少加班","讓各個部門之間彼此不需要溝通，各自把份內的事情做好就可以"],why:"例如申請權限的人不能自己核准、寫程式的人不能自己上線。要兩個人串通才能出事，風險就低很多。"},
 {q:"把系統委外給廠商。合約裡最應該放進哪一類條款？",a:["資安要求、事件通報義務和稽核權","廠商的公司沿革","廠商員工的服裝規定","廠商每一年都要寄送賀卡和月曆給機關的每一位承辦人員"],why:"沒寫進合約，出事時就沒有依據要求對方配合。稽核權讓你能確認廠商真的有做到。"},
 {q:"要評估資安教育訓練有沒有效，哪一種方式比較好？",a:["看實際行為有沒有改變，例如釣魚演練的點擊率和回報率","看簽到表的出席率","看教材的頁數","看講師的學歷和年資，以及這一堂課總共上了幾個小時"],why:"出席不等於學會。訓練的目的是改變行為，所以要量行為。"},
 {q:"某個單位因為業務需要，確實無法遵守一項資安規定。正確的處理方式是？",a:["提出例外申請，載明原因、期限和補償措施，經核准後列管","私下不遵守就好","把那項規定整個廢除","要求這個單位的同仁簽署切結書，保證以後如果出事的話會自行負責"],why:"規定不可能涵蓋所有狀況。例外要看得見、有期限、有人核准，到期重新檢視，才不會變成永久的漏洞。"},
 {q:"「營運衝擊分析」（BIA）主要是在分析什麼？",a:["各項業務中斷後的影響，以及能容忍中斷多久","競爭對手的營運狀況","員工的滿意度","公司過去五年的財務報表，以及未來五年預估的營業收入成長率"],why:"BIA 的結果決定哪些系統要優先恢復、RTO 和 RPO 要訂多少。沒有它，備援的投資就是憑感覺。"},
 {q:"稽核紀錄和系統日誌，在保存上最重要的兩件事是？",a:["保存夠久，而且不能被竄改","字體要好看","檔案越小越好","每一天都要列印成紙本，並且由承辦人和主管逐頁蓋章之後歸檔"],why:"紀錄留不夠久，事後查不到；可以被改，就失去證據力。保存期限要依法規和內部規定。"}
],[
 {q:"「風險胃納」是指什麼？",a:["組織為了達成目標，願意承擔多少風險","風險發生的機率","資安預算的金額","稽核人員在一次稽核當中，最多可以開出幾項不符合"],why:"它是管理階層訂的上限。風險評鑑的結果要拿來跟它比，超過的才需要處理，否則永遠做不完。"},
 {q:"稽核一項控制措施時，「設計有效」和「執行有效」的差別是？",a:["前者看規定寫得對不對，後者看實際上有沒有照做","兩者是同一件事","前者看預算，後者看人力","前者是由外部稽核負責，後者則一律由內部稽核負責"],why:"規定寫得再好，沒人照做就沒用；照做了但規定本身有漏洞也沒用。兩個都要成立，控制才算有效。"},
 {q:"「關鍵風險指標」（KRI）的用途是什麼？",a:["提早顯示風險正在升高的訊號","計算員工的績效獎金","記錄已經發生的損失","統計公司每一年總共通過了多少張國際標準的驗證證書"],why:"例如「逾期未修補的高風險弱點數」持續上升，就該在出事前處理。它是往前看的指標。"},
 {q:"公司有上百家供應商。資安管理上比較實際的做法是？",a:["依接觸的資料和系統重要性分級，高風險的才做深入評估","每一家都做同樣完整的實地稽核","全部都不管","只評估合約金額最高的前三家，其他的供應商都可以直接略過"],why:"資源有限。能碰到核心系統或大量個資的廠商要嚴格管，送便當的廠商不需要填資安問卷。"},
 {q:"稽核時沒辦法檢查每一筆紀錄，所以用「抽樣」。抽樣最重要的原則是？",a:["樣本要有代表性，而且由稽核員決定抽哪些","由受稽單位挑最好的給稽核員看","只抽最近一天的","每一次都固定抽同樣的那幾筆，這樣才能前後比較"],why:"讓受稽方自己挑，看到的當然都沒問題。抽樣的方法和範圍也要記錄，結論才站得住腳。"},
 {q:"ISO 27001 的驗證範圍只涵蓋「資訊機房」。對外宣稱時要注意什麼？",a:["只能說範圍內通過驗證，不能講成整個組織都通過","可以說全公司都通過","範圍不需要讓別人知道","只要通過一個範圍，其他所有的部門也會自動被視為通過"],why:"證書上會載明範圍。範圍外的系統沒有被稽核過，客戶或主管機關問起來要講清楚。"},
 {q:"公司同時要符合資安法、個資法、ISO 27001 和客戶的要求，條文很多重疊。比較有效率的做法是？",a:["建立一份控制措施對照表，一項控制對應多個要求","每一個法規各做一套獨立的制度","只挑最簡單的一個做","等到每一個要求各自來稽核的時候，再臨時準備那一份需要的文件"],why:"「帳號定期清查」可能同時滿足四個來源的要求。對照之後做一次、留一份證據，各方來查都能用。"},
 {q:"發生一件同時涉及系統被入侵和個資外洩的事件。在法遵上要注意什麼？",a:["資安法和個資法的義務要分別檢視，可能都要通報或通知","只要擇一處理即可","等媒體報導之後再決定","只要內部有開過檢討會議並且留下會議紀錄，就不需要再對外通報"],why:"兩部法管的面向不同：一個是資通系統的事件通報，一個是個資事故的通報和通知當事人，時限和對象也不一樣。"}
],[
 {q:"向董事會或最高管理階層報告資安，最有效的方式是？",a:["用業務風險和影響來說明，並提出需要他們決定的事","詳細說明每一項技術細節","只報告好消息","把過去一年所有的告警紀錄全部列印出來，請他們逐筆閱讀"],why:"他們的角色是決定風險胃納和資源。把技術問題翻成營運、財務、法遵和商譽的影響，他們才能做決定。"},
 {q:"「合規不等於安全」是什麼意思？",a:["通過稽核只代表符合條文的最低要求，不代表擋得住實際的攻擊","合規的組織一定不會被入侵","安全的組織不需要合規","只要拿到證書，之後就可以不用再投入任何資源在資安上面"],why:"標準是通用的底線，攻擊者不看你的證書。要以實際風險為出發點，合規是順帶的結果。"},
 {q:"量化風險時，常用「單次損失 × 每年發生次數」來估年度預期損失。這個數字主要用來做什麼？",a:["和控制措施的成本比較，判斷投資值不值得","用來決定員工的薪水","向客戶收費","用來決定公司的股價，並且每一季公告給所有的投資人"],why:"花 500 萬去降低一個每年預期損失 50 萬的風險，通常不划算。數字不精確沒關係，重點是有比較的基礎。"},
 {q:"要建立資安文化，下列哪一件事影響最大？",a:["高層自己遵守規定，並公開支持","多貼幾張海報","把規定寫得更厚","每一年舉辦一次資安口號比賽，並且頒發獎金給第一名"],why:"主管要求特權、帶頭繞過規定，其他人就知道規定是可以不理的。文化是看上面怎麼做，不是怎麼說。"},
 {q:"組織裡開始有人自行使用生成式 AI 工具處理公務。治理上第一步應該做什麼？",a:["訂出使用政策：哪些資料可以輸入、哪些工具可以用，並評估風險","全面禁止，不討論","完全不管","等到有同仁把機密資料輸入進去並且造成外洩之後再開始討論"],why:"禁不了，也不該放任。先講清楚界線（特別是個資和機密），再依風險逐步開放和管理。"},
 {q:"組織要同時維持資訊安全、個資保護、營運持續好幾套管理系統。怎麼做比較不會重工？",a:["整合成一套：共用政策架構、風險評鑑、內部稽核和管理審查","每一套各由不同的團隊獨立運作","只維持其中一套","每一套管理系統各自使用不同的文件格式，以方便區分"],why:"這些標準的骨架相同。整合後同一場稽核、同一份風險登錄可以服務多個標準，承辦人也不必重複準備。"},
 {q:"同一項稽核缺失連續三年都被開出來。這代表什麼？",a:["矯正機制本身失效了，要提升到管理階層處理","稽核員太挑剔","明年再改就好","這一項缺失其實並不重要，所以可以請稽核員以後不要再開"],why:"個別缺失是執行問題，重複發生是治理問題：沒人負責、沒資源、或根本原因沒處理。"},
 {q:"資安投資很難算出「賺了多少」。爭取預算時，比較站得住腳的論述是？",a:["說明降低了哪些風險的可能性和衝擊，以及不做的後果","保證以後絕對不會出事","強調別人都有買","告訴高層如果不通過這一筆預算，資安團隊就會全體離職"],why:"資安是在買風險的降低，不是買報酬。沒有人能保證不出事，但可以說清楚風險從哪裡降到哪裡。"}
]]},
{id:'mgmt',lv:[[
 {q:"ITIL 是什麼？",a:["一套 IT 服務管理的實務做法","一種程式語言","一個資安漏洞的編號","政府規定所有資訊人員上班之前都必須要先考取的一張專業證照"],why:"ITIL 整理了事件、問題、變更、服務台這些流程的做法。不必全部照抄，挑適合自己組織的用。"},
 {q:"「我的電腦開不了機」和「我要申請一個新帳號」，在服務管理上分別屬於什麼？",a:["前者是事件，後者是服務請求","兩個都是事件","兩個都是變更","前者是問題管理的範圍，後者則是屬於重大資安事故，需要立即通報"],why:"事件是「本來能用的壞了」，要盡快恢復。服務請求是「申請一項標準的服務」，照流程處理就好。"},
 {q:"專案管理常說的三個互相牽動的限制是什麼？",a:["範圍、時間、成本","硬體、軟體、網路","開發、測試、上線","老闆、主管、同事，這三種人的意見只要有一方不同意專案就無法進行"],why:"範圍變大，時間或成本一定要跟著動。只加需求、不加時間也不加人，最後犧牲的就是品質。"},
 {q:"採購規格如果寫成只有某一家廠牌的產品才能符合，會有什麼問題？",a:["沒有競爭，價格和服務都容易被牽著走，也可能違反採購規定","沒有問題，這樣品質最有保障","驗收會比較簡單","交貨的時間會變得比較長，因為指定廠牌的產品通常都需要從國外進口"],why:"規格應該寫「需要的功能和效能」，不是抄某一家的型錄。綁規格在很多組織也是稽核的重點。"},
 {q:"簽訂系統的維護合約時，下列哪一項最需要白紙黑字寫清楚？",a:["服務水準：多久回應、多久到場、沒做到怎麼辦","廠商業務人員的姓名","合約書的紙張大小","廠商公司的成立年份、資本額，以及歷年來得過哪些業界的獎項"],why:"「盡快處理」不是承諾。回應和修復時間、服務時段、罰則都寫明，出事時才有依據。"},
 {q:"評估要買哪一套系統時，「總持有成本」（TCO）是指什麼？",a:["購買、建置、維護、人力、汰換全部加起來的成本","只有購買當下的價格","每年的電費","這一套系統預計在未來五年之內可以替公司多賺進來的營業收入"],why:"買的時候便宜，維護費、授權費和需要的人力可能貴得多。要看整個使用年限的總花費。"},
 {q:"「廠商鎖定」（Vendor Lock-in）是指什麼風險？",a:["太依賴單一廠商的技術或格式，之後想換會非常困難又昂貴","廠商把機房的門鎖起來","廠商不願意報價","廠商派來的工程師因為簽了保密合約，所以不可以在其他的公司兼職"],why:"資料格式、專屬技術、只有原廠會維護，都會讓你失去談判籌碼。評估時要先想「退場要怎麼退」。"},
 {q:"幫團隊訂 KPI，下列哪一個原則最重要？",a:["量得出來，而且真的跟要達成的目標有關","越多項越好","只挑一定能達成的","每一年都要訂得比前一年更高，不論實際的資源和工作量有沒有改變"],why:"量不出來的指標沒辦法追蹤；跟目標無關的指標會把大家帶去做沒有意義的事。"}
],[
 {q:"變更諮詢委員會（CAB）存在的目的是什麼？",a:["讓相關的人在變更前一起評估風險和影響","增加行政流程","決定誰要負責","讓所有的變更都延後至少一個月才能執行，藉此降低變更的次數"],why:"做變更的人常看不到對別的系統的影響。找相關單位一起看，可以避開撞期和沒想到的連鎖反應。"},
 {q:"半夜為了搶修做了一項緊急變更，來不及走正常的審核。事後應該怎麼做？",a:["補上變更紀錄並做事後審查","既然修好了就不用補","當作沒發生過","把那一項變更還原回去，等白天走完完整的審核流程之後再重新做一次"],why:"緊急變更可以先做，但不能沒有紀錄。事後審查也能檢討：這次緊急是不是本來可以避免的。"},
 {q:"專案進行到一半，使用單位不斷追加「順便做一下」的小需求。這叫範圍蔓延。該怎麼處理？",a:["走變更請求流程，評估對時程和成本的影響後再決定","全部答應，客戶至上","全部拒絕","先全部答應下來，等到專案快要結束的時候再告訴對方來不及做"],why:"每個「順便」都有成本。讓提出的人看到代價，由有權責的人決定要不要加、要不要延期或加資源。"},
 {q:"專案的「風險登錄表」是用來做什麼的？",a:["事先列出可能出問題的地方、負責人和因應方式","記錄誰遲到","登記設備的財產編號","在專案失敗之後，用來記錄每一個人應該要負擔多少比例的責任"],why:"風險先講出來、有人盯著，發生時就不是意外。定期檢視，新的加進來、解除的劃掉。"},
 {q:"廠商說「系統已經建置完成」。驗收時應該依據什麼？",a:["合約和規格書上寫明的驗收條件，逐項實際測試","廠商的口頭說明","廠商提供的簡報","專案的款項是否已經全部付清，以及廠商的工程師是否已經撤離現場"],why:"驗收是付款前最後的把關。沒有逐項測試就簽收，之後發現問題就變成「另外報價」。"},
 {q:"買斷一批伺服器，和改用每月付費的雲端服務。在預算上分別屬於什麼？",a:["前者是資本支出，後者是營運支出","兩者都是資本支出","兩者都是人事費用","前者屬於業務部門的行銷預算，後者則是屬於總務部門的雜項支出"],why:"資本支出一次投入、分年折舊；營運支出逐期認列。兩者在預算編列、核准流程和稅務上都不同。"},
 {q:"資深同仁即將退休，很多系統只有他最熟。最該優先做什麼？",a:["安排交接期，把知識寫成文件並讓接手的人實際操作","請他退休後隨時接電話","等他走了再說","請他把所有的資料都列印出來裝箱，放在倉庫裡面以備不時之需"],why:"知識在人腦裡，人走就沒了。文件加上實作，而且要趁他還在的時候讓接手的人問問題。"},
 {q:"為什麼要定期評核維護廠商的表現？",a:["確認服務有達到合約水準，並作為續約或更換的依據","為了找理由扣款","只是例行公事","讓廠商知道機關有在注意他們，除此之外評核的結果並不會有任何用途"],why:"沒有評核，續約就只憑印象。把回應時間、修復時間、重複故障這些數字留下來，談判才有依據。"}
],[
 {q:"訂定資訊部門的年度計畫時，最應該先對齊什麼？",a:["組織的業務目標和優先順序","最新、最熱門的技術","其他公司買了什麼","資訊部門的同仁各自最想要學習和嘗試的技術項目"],why:"資訊是為了支持業務。先知道組織今年要做什麼，才知道資源該放哪裡，也才爭取得到支持。"},
 {q:"一項新需求，要自己開發、買現成的產品，還是委外？判斷時最關鍵的問題是？",a:["這是不是我們的核心能力，以及長期誰來維護","哪一個最便宜","哪一個最快","哪一個做法可以讓資訊部門的編制人數增加得最多"],why:"核心、差異化的東西值得自己掌握；通用的功能買現成的。不管哪一種，都要先想清楚三年後誰在顧。"},
 {q:"要留住技術人才，除了薪資，哪一件事最有幫助？",a:["讓人看得到成長的路徑，並有機會做有挑戰性的事","規定離職要賠償違約金","增加打卡的次數","把所有重要的工作都集中交給最資深的那一位同仁來處理"],why:"技術人員很在意「有沒有在進步」。沒有往上的路、每天只做重複的事，待遇再好也留不久。"},
 {q:"明年想做的專案有二十個，資源只夠做八個。應該怎麼決定？",a:["用一致的標準（效益、風險、法規要求、成本）評分排序","先做最早提出來的","先做提案人職位最高的","二十個專案全部同時啟動，每一個都先做一點點再說"],why:"沒有共同標準，就變成誰聲音大誰贏。同時做太多，結果是每個都延誤。"},
 {q:"老舊系統的技術債越積越多，但每年預算都被新專案用光。比較可行的做法是？",a:["固定保留一定比例的資源，專門用來償還技術債","等系統完全不能用再處理","全部停下來，花一年重寫","規定以後所有的新專案都不可以再使用任何新的技術"],why:"技術債不會自己消失，只會越來越貴。固定撥出一部分，才不會永遠被「更急的事」擠掉。"},
 {q:"發生重大資安事件，媒體開始打電話到各個部門詢問。組織應該怎麼應對？",a:["由指定的單一窗口統一對外說明","各部門各自回答自己知道的","一律不回應","請最了解技術細節的那一位工程師直接接受媒體的採訪"],why:"多頭對外，說法不一致，會讓事情更糟。對外的內容要和法務、公關、管理階層確認過。"},
 {q:"把資訊成本依使用量攤給各部門（或至少讓各部門看到自己用了多少）。這樣做的目的是？",a:["讓使用單位知道資源有成本，需求會比較實際","讓資訊部門賺錢","增加會計的工作量","讓各個部門以後都自己去採購電腦和軟體，不需要再經過資訊部門"],why:"資源免費時，需求是無限的。看得到成本，各單位才會自己衡量「這個需求值不值得」。"},
 {q:"主管出國兩週，期間有需要核准的緊急變更。事前應該安排什麼？",a:["明確指定代理人和授權範圍","請大家等他回來","讓每個人自己決定","請同仁在需要核准的時候，直接模仿主管的筆跡代為簽名"],why:"決策權沒有交代清楚，緊急時不是沒人敢決定，就是有人越權決定。授權範圍要事先講明。"}
],[
 {q:"很多「數位轉型」專案最後失敗。最常見的主因是什麼？",a:["流程和人沒有跟著改變，只是把舊做法搬上新系統","買的伺服器不夠快","網路頻寬不足","專案的名稱取得不夠響亮，所以沒有辦法吸引同仁的注意"],why:"技術通常不是問題。流程不重新設計、使用者不買單、主管不支持，再好的系統也只是多一個要填的東西。"},
 {q:"資訊人力要「集中在總部」還是「分散到各單位」？兩者的取捨是什麼？",a:["集中容易統一標準和省成本，分散比較貼近現場需求","集中一定比較好","分散一定比較好","兩種做法完全沒有差別，只是組織圖畫起來的樣子不一樣"],why:"沒有標準答案。常見的折衷是：基礎設施和資安集中，貼近業務的應用和支援放在單位裡。"},
 {q:"決定哪些工作可以委外時，哪一類最不適合全部交出去？",a:["對組織很關鍵、需要自己掌握判斷的核心能力","例行、標準化的作業","短期的尖峰人力","辦公室的清潔工作以及影印機的定期保養"],why:"核心能力全部委外，組織就失去判斷廠商做得好不好的能力，也很難再收回來。"},
 {q:"兩個組織合併，各有一套系統。整合規劃時最先要釐清的是什麼？",a:["業務上要整合到什麼程度，再決定系統怎麼併","哪一邊的伺服器比較新","哪一邊的工程師比較多","兩邊的系統哪一套的畫面比較漂亮，以及使用的顏色是不是一致"],why:"系統整合是手段。業務流程要不要統一、資料要不要合併、多久完成，這些決定了技術方案。"},
 {q:"資安主管直接向資訊主管報告。這個組織設計有什麼潛在問題？",a:["資安的風險意見，可能被資訊部門的時程和成本壓力蓋掉","沒有任何問題","資安主管會太忙","兩位主管的辦公室距離太近，討論事情的時候容易被別人聽到"],why:"監督者向被監督者報告，是利益衝突。所以很多組織讓資安有獨立向最高管理階層報告的管道。"},
 {q:"OKR 和傳統 KPI 在使用上最大的不同是？",a:["OKR 強調有挑戰性的目標和方向對齊，通常不直接綁考績","OKR 就是 KPI 的另一個名字","OKR 只能用在業務部門","OKR 規定每一個人每一季都至少要達成百分之兩百才算及格"],why:"綁考績的目標，大家會訂保守的。OKR 是用來讓團隊知道往哪衝，達成七成也可能是很好的結果。"},
 {q:"導入新系統時，使用單位強烈抗拒。比較有效的處理方式是？",a:["及早讓他們參與設計，說明改變的原因，並提供訓練和過渡期的支援","直接強制上線","取消專案","等到新系統上線之後，再把舊系統的電源線直接拔掉"],why:"抗拒通常來自「沒被問過」和「怕不會用」。讓人參與、被聽見、有準備，比事後安撫有效得多。"},
 {q:"某項關鍵服務完全依賴單一家供應商，沒有任何替代方案。在管理上這是什麼風險？應該怎麼做？",a:["集中度風險，要評估替代方案或至少準備退場計畫","沒有風險，專心跟一家合作最好","價格風險，每年砍價就好","這是供應商自己的風險，跟我們沒有關係，所以不需要處理"],why:"那家倒閉、漲價、被併購或出資安事件時，你沒有選擇。不一定要馬上換，但要知道怎麼換、要多久。"}
]]},
{id:'law',lv:[[
 {q:"《資通安全管理法》2025 年修正後，主管機關是哪一個？",a:["數位發展部","行政院","內政部警政署","各縣市政府各自擔任主管機關，分別管理轄區內的公務機關和民間企業"],why:"2025 年 9 月修正公布，主管機關由行政院改為數位發展部，由資通安全署負責執行。"},
 {q:"下列哪一類屬於《資通安全管理法》所稱的「特定非公務機關」？",a:["關鍵基礎設施提供者","所有在國內設立登記的公司","一般的網路商店","只要公司裡有使用電腦和網路，不論規模大小都自動屬於特定非公務機關"],why:"特定非公務機關包含關鍵基礎設施提供者、公營事業和政府捐助的財團法人，不是所有民間企業都適用。"},
 {q:"依《個人資料保護法》，什麼樣的資料算「個人資料」？",a:["能直接或間接識別出特定個人的資料","只有身分證字號才算","只有紙本的資料才算","只有經過當事人親自簽名確認過的資料才算，其他的都不在保護的範圍之內"],why:"姓名、電話、病歷、帳號，甚至和其他資料對照後能認出某個人的，都算。所以 log 和資料庫裡到處都是個資。"},
 {q:"依《個人資料保護法》，蒐集、處理、利用個資的基本原則是？",a:["要有特定目的，而且不能超出必要的範圍","只要資料是公開的就可以任意使用","只要沒有拿去賣就沒有限制","只要公司內部有需要，可以先盡量多蒐集起來，之後再決定要用在哪裡"],why:"個資法第 5 條：應尊重當事人權益，依誠實信用方法，不得逾越特定目的之必要範圍，並與目的有正當合理的關聯。"},
 {q:"沒有經過同意，用猜到的密碼登入別人的帳號或主機。在我國可能觸犯什麼？",a:["刑法的妨害電腦使用罪","只違反公司的內部規定","沒有任何法律責任，只要沒有破壞東西","只有在對方因此損失超過新臺幣一百萬元的時候，才會有法律上的責任"],why:"刑法第 358 條：無故輸入他人帳號密碼、破解保護措施或利用系統漏洞入侵他人電腦，就有刑責，不必等到造成損害。"},
 {q:"《電子簽章法》的主要作用是什麼？",a:["讓電子文件和電子簽章在符合條件時，具有法律上的效力","規定所有文件都必須改成電子檔","禁止使用紙本簽名","規定只有政府機關可以使用電子簽章，民間的公司和個人都不可以使用"],why:"有了這部法，線上簽核、電子契約才有法律依據。系統設計上要能確認簽署人的身分和文件有沒有被改過。"},
 {q:"工程師離職時，把公司的原始碼和客戶名單複製一份帶到新公司使用。最可能違反什麼？",a:["營業秘密法","道路交通管理處罰條例","沒有違反任何法律，那是他自己寫的","只有在新公司跟原公司是同一個產業的情況之下，才會有違法的問題"],why:"具有秘密性、經濟價值，而且公司有採取保密措施的資訊，就受營業秘密法保護，違反有民事和刑事責任。"},
 {q:"員工在職務上寫的程式，沒有特別約定的話，著作財產權歸誰？",a:["雇用人（公司）","寫程式的員工本人","政府","由員工和公司各持有一半，任何一方要使用都必須經過另一方的書面同意"],why:"著作權法第 11 條：受雇人職務上完成的著作，以受雇人為著作人，但著作財產權歸雇用人，契約另有約定的從其約定。"}
],[
 {q:"依 2025 年修正的《資通安全管理法》，特定非公務機關應該設置什麼職位，負責推動和監督資安事務？",a:["資通安全長","法務長","財務長","不需要設置任何職位，只要每一年委託外部的廠商做一次檢測就可以"],why:"修正後明定特定非公務機關應設置資通安全長；符合特定責任等級的還要配置資安專職人員。"},
 {q:"依 2025 年修正的《資通安全管理法》，特定非公務機關未依規定通報資安事件，罰鍰上限提高到多少？",a:["新臺幣 1,000 萬元","新臺幣 1 萬元","新臺幣 10 萬元","沒有罰鍰的規定，主管機關只能發函要求改善"],why:"修正前上限是 500 萬元。隱匿不報的代價變得很高，所以通報流程一定要事先訂好、演練過。"},
 {q:"2025 年修正的《資通安全管理法》對「危害國家資通安全產品」做了什麼規定？",a:["把公務機關不得使用的規定，從行政命令提升到法律位階","全面開放使用","只限制個人不能購買","規定所有的民間企業在三個月之內都必須全面汰換，否則一律停業"],why:"公務機關不得下載、安裝或使用；中央目的事業主管機關也可以限制或禁止特定非公務機關使用。"},
 {q:"2025 年修正的《個人資料保護法》，設立了哪一個獨立的監督機關？",a:["個人資料保護委員會","國家通訊傳播委員會","公平交易委員會","沒有設立新的機關，仍然由各個部會各自負責自己主管的產業"],why:"修法後由個資會統一受理個資事故通報，並對公務和非公務機關做稽核和行政檢查。施行日期和子法要留意後續公告。"},
 {q:"依《個人資料保護法》，保有個資檔案的非公務機關，在安全上有什麼義務？",a:["採行適當的安全措施，防止個資被竊取、竄改、毀損、滅失或洩漏","只要不主動對外公開就可以","沒有義務，出事再處理","只需要在公司的網站上公告隱私權政策，其他的不需要再做任何事情"],why:"個資法第 27 條。主管機關還可以要求訂定個資檔案安全維護計畫，沒做到會被罰。"},
 {q:"依 2025 年修正的《資通安全管理法》，公務機關把資通安全相關業務委外，明定要怎麼做？",a:["和受託者簽訂書面契約，載明權利義務和違約責任","口頭約定就可以","完全不可以委外","只要受託的廠商在業界的名氣夠大，就可以不用另外簽訂任何的契約"],why:"委外不等於責任轉移。契約要寫明資安要求、通報義務和違約責任，機關也要持續監督。"},
 {q:"員工離職前，把部門共用資料夾裡的檔案全部刪掉洩憤。可能觸犯刑法的哪一類規定？",a:["無故刪除他人電腦的電磁紀錄，致生損害","沒有法律問題，那些檔案是他自己做的","只有民事賠償的問題","只有在公司事先和他簽過保密合約的情況之下，才會有刑事上的責任"],why:"刑法第 359 條：無故取得、刪除或變更他人電腦或相關設備的電磁紀錄，致生損害於公眾或他人，有刑責。"},
 {q:"公司的內部資安規定，和《資通安全管理法》的要求不一樣時，以哪一個為準？",a:["法律優先，內部規定不能牴觸法律","內部規定優先，因為比較貼近實務","看哪一個比較新","由每一個部門的主管依照當時的實際狀況，各自決定要遵守哪一個"],why:"位階是法律、法規命令（各種辦法）、再來才是機關或公司的內部規定。法規修正後，內部規定要跟著檢視。"}
],[
 {q:"依 2025 年修正的《資通安全管理法》，特定非公務機關發生重大資安事件時，中央目的事業主管機關可以做什麼？",a:["進行調查，包括通知到場陳述、要求提出報告或派員檢查","只能發新聞稿","沒有任何權限","直接接管該機關全部的資訊系統，並且指派人員進駐一年"],why:"修正後明定調查權。規避、妨礙或拒絕調查，可處新臺幣 10 萬元以上、100 萬元以下罰鍰。"},
 {q:"依 2025 年修正的《資通安全管理法》，符合特定資通安全責任等級的特定非公務機關，在人力上應該配置什麼？",a:["資通安全專職人員","至少十位律師","專職的總務人員","不需要配置任何人力，全部委託給外部的廠商處理即可"],why:"資安不能只靠兼辦。修正後把專職人員和資通安全長都寫進法律，組織要有對應的編制。"},
 {q:"依 2025 年修正的《個人資料保護法》，公務機關應指派人員擔任什麼角色，統籌個資保護事務？",a:["個人資料保護長","資料庫管理員","發言人","不需要指派任何人，由每一位承辦人各自對自己經手的資料負責"],why:"由機關首長指派人員兼任，負責統籌規劃和督導考核，並應配給適當的人力和資源。"},
 {q:"依 2025 年修正的《個人資料保護法》，下列哪一種違規，主管機關可以不必先要求限期改正就直接處罰？",a:["違反事故通報、應變或紀錄留存的義務","違反通知當事人的義務","兩者都要先限期改正","兩者都不會被處罰，主管機關只能提出改善的建議"],why:"依修法說明，未通知當事人是先限期改正、不改才罰；未通報、未應變或未留存紀錄則可以直接處罰。"},
 {q:"依 2025 年修正的《資通安全管理法》，違反資通安全維護計畫等規定，經限期改正仍未改正，罰鍰上限提高到多少？",a:["新臺幣 500 萬元","新臺幣 5 千元","新臺幣 5 萬元","新臺幣 5 億元，並且得按日連續處罰到改正為止"],why:"未通報資安事件的上限是 1,000 萬元，未依規定改正的上限是 500 萬元。兩個數字不要混在一起。"},
 {q:"當事人要求刪除自己的個資，但依其他法令，這筆資料的保存期限還沒到。機關應該怎麼處理？",a:["可以不刪除，但要說明原因，期限屆滿後再處理","一定要立刻刪除","不需要回覆當事人","先把資料刪除掉，等到主管機關來檢查的時候再想辦法重新補回去"],why:"個資法第 11 條：目的消失或期限屆滿應刪除，但因執行職務或業務所必須，或經當事人書面同意者不在此限。"},
 {q:"公司懷疑員工外洩資料，想調閱他公務電腦上的操作紀錄。在法律風險上，最重要的前提是什麼？",a:["事前有明確的規定並告知員工，調閱也依內部程序進行","只要主管口頭同意就可以","公司的電腦隨時都可以任意查看","先偷偷安裝側錄軟體蒐集一個月，確定有問題之後再補辦程序"],why:"沒有依據的監看，可能涉及隱私和妨害秘密的問題，取得的證據也可能有爭議。規定、告知、程序三者要齊。"},
 {q:"法規修正公布了，但「施行日期由行政院定之」。資訊單位這段期間應該做什麼？",a:["先盤點差距並開始準備，同時追蹤施行日期和子法","還沒施行就不用理會","等被罰了再說","立刻依照自己對條文的理解對外宣布已經全部符合新的規定"],why:"公布到施行通常有緩衝期，就是給機關準備的。等施行那天才開始，人力、預算、制度都來不及。"}
],[
 {q:"公司想把含有個資的系統搬到國外的雲端機房。依《個人資料保護法》，最需要先確認什麼？",a:["有沒有主管機關限制國際傳輸的情形，以及接收地對個資的保護是否足夠","雲端機房的建築外觀","當地的天氣","只要雲端業者的價格比較便宜，就不需要再確認其他事情"],why:"個資法第 21 條：涉及國家重大利益、接受國保護不完善等情形，主管機關得限制國際傳輸。各產業可能還有自己的規定。"},
 {q:"一家設在台灣的公司，網站有對歐盟居民提供服務並蒐集他們的個資。法規上要注意什麼？",a:["除了我國個資法，還可能要遵守歐盟的 GDPR","只要遵守台灣的法律","完全不受任何法律管","只需要在網站的最下方加上一行英文的免責聲明就可以了"],why:"GDPR 有域外效力，對歐盟境內的人提供商品或服務，就算公司不在歐盟也可能適用。"},
 {q:"同一件資安事件，機關可能同時面對哪幾種法律責任？",a:["行政罰鍰、民事賠償、刑事責任，可能同時成立","只會有其中一種","完全沒有責任","只會有主管口頭上的責備，除此之外不會有任何後果"],why:"主管機關開罰是行政責任，當事人求償是民事責任，有人涉及犯罪是刑事責任。三者各走各的程序。"},
 {q:"一個產業同時適用《資通安全管理法》、《個人資料保護法》和該產業主管機關的規定。應該怎麼遵循？",a:["各項要求都要符合，產業的特別規定比較嚴格時依特別規定","只挑最寬鬆的一個","只看最新公布的那一個","由公司內部投票決定今年要遵守哪一部，明年再換另外一部"],why:"這些法規是疊加的，不是擇一。實務上會整理成對照表，取各項要求中最嚴格的來設計制度。"},
 {q:"要讓電腦上取得的紀錄在法律程序上被採信，蒐集時最重要的是什麼？",a:["確保完整性（例如計算雜湊值）並記錄取得的過程","檔案要用彩色列印","檔名要取得很長","由年資最深的同仁負責操作，並且在旁邊拍照留念"],why:"對方一定會質疑「這是不是被改過」。能證明從取得到提出都沒變動，證據才有力量。"},
 {q:"和委外廠商簽約時，關於資安事件的條款，最應該談清楚什麼？",a:["通報的時限、配合調查的義務、損害賠償的責任和上限","廠商員工的制服顏色","簽約典禮的地點","廠商每一年要贈送多少份禮品給負責這個案子的承辦人"],why:"出事才發現合約沒寫，就只能協商。特別是責任上限，廠商的範本常寫得很低，要在簽約前談。"},
 {q:"法規修正後，組織內部規章的更新，比較完整的流程是？",a:["差距分析、修訂規章、核准公告、教育訓練、留下紀錄","等稽核開缺失再修","只改文件上的日期","把新的法規條文直接轉寄給全體同仁，請大家自行閱讀並且遵守"],why:"改了文件但沒人知道、沒人照做，等於沒改。稽核會一路看到「同仁知不知道、有沒有照新的做」。"},
 {q:"發生應通報的事件，有人建議通報內容「寫輕一點」，淡化影響範圍。這樣做的風險是？",a:["事後被查出不實，法律責任和信任的損失都比事件本身更嚴重","沒有風險，可以減少麻煩","主管機關不會查","只要通報的文字寫得夠通順，主管機關就不會再進一步追問"],why:"事件會過去，隱匿和不實會留下來。如實通報、後續更新，是對組織最有利的做法。"}
]]},
{id:'iam',lv:[[
 {t:"驗證與授權",q:"「驗證」和「授權」的差別是什麼？",a:["驗證是確認你是誰，授權是決定你能做什麼","兩個是同一件事","驗證是給權限，授權是輸入密碼","驗證只用在網站，授權只用在作業系統，兩者不會同時出現"],why:"登入成功只代表身分確認了。能不能看某份資料、能不能改設定，是授權在管。"},
 {t:"權限模型",q:"「以角色為基礎的存取控制」（RBAC）是怎麼給權限的？",a:["把權限給角色，再把人指派到角色","每個人各自設定不同的權限","所有人都給一樣的權限","由每一位使用者自己決定自己需要哪些權限，再自行開通"],why:"人會異動，角色相對穩定。換職務時只要換角色，不必一項一項調權限。"},
 {t:"單一登入",q:"單一登入（SSO）對使用者最直接的好處是？",a:["登入一次就能使用多個系統","再也不需要密碼","上網速度變快","每個系統都可以設定一組完全不同的密碼來提高安全性"],why:"少記幾組密碼，也讓停用帳號可以集中處理。相對地，那一組帳號更要保護好。"},
 {t:"多因素驗證",q:"多因素驗證的「因素」分成哪三類？",a:["你知道的、你擁有的、你本身的特徵","帳號、密碼、驗證碼","電腦、手機、平板","早上、中午、晚上三個不同的時段各登入一次"],why:"密碼是知道的，手機或金鑰是擁有的，指紋是特徵。兩組密碼只算一種因素。"},
 {t:"帳號生命週期",q:"帳號的「生命週期管理」指的是什麼？",a:["從到職建立、異動調整到離職停用的整個過程","帳號的密碼長度","帳號每天登入的次數","帳號建立之後永久保留，不需要再做任何的調整"],why:"三個時間點都要有流程。最常出問題的是異動和離職，權限沒收、帳號沒停。"},
 {t:"共用帳號",q:"好幾個人共用同一組帳號密碼，最大的問題是？",a:["出事時無法知道是誰做的","登入會比較慢","密碼比較難記","系統的授權費用會因為登入的人數變多而增加"],why:"沒有可歸責性，稽核紀錄就失去意義。而且有人離職時，密碼得全部重發。"},
 {t:"服務帳號",q:"「服務帳號」和一般人員帳號的差別是？",a:["給程式或服務用的，不是給人登入操作的","權限一定比較低","不需要密碼","只有在國定假日或是公司停班的時候才可以拿出來使用"],why:"它通常不會過期、權限不小、又沒人盯著，所以要列冊管理、權限給最小。"},
 {t:"密碼管理",q:"要管理幾十組不同系統的密碼，比較好的做法是？",a:["使用密碼管理工具","全部設成同一組","寫在筆記本放桌上","存在瀏覽器的書籤名稱裡面，這樣每次打開就看得到"],why:"每個系統不同密碼才不會一組外洩全部淪陷，靠人腦記不住，交給工具。"}
],[
 {t:"權限累積",q:"員工調過三個部門，每次都加新權限，舊的沒收。這種現象會造成什麼風險？",a:["一個人擁有遠超過工作所需的權限","帳號會自動被鎖定","電腦會變慢","他會因為權限太多而無法登入任何一個系統"],why:"這叫權限累積。帳號一旦被盜，損害範圍是他待過的所有部門。異動時要「先收再給」。"},
 {t:"特權帳號",q:"管理員日常收信、上網，和做系統管理，應該怎麼使用帳號？",a:["分成兩個帳號，管理帳號只做管理工作","都用管理員帳號比較方便","都用一般帳號","借用同事的帳號來做管理工作，自己的帳號只用來收信"],why:"收信上網最容易中招。管理權限不在那個帳號上，中招時損害就小很多。"},
 {t:"目錄服務",q:"LDAP 是什麼？",a:["查詢和存取目錄服務（例如帳號、群組資料）的協定","一種防毒軟體","一種備份格式","一種專門用來在不同國家之間傳送大型影片檔案的網路協定"],why:"很多系統靠 LDAP 向目錄查帳號和群組，AD 也支援它。"},
 {t:"群組授權",q:"設定共用資料夾權限時，為什麼建議授權給「群組」而不是個人？",a:["人員異動時只要調整群組成員，不必逐一改資料夾","群組的速度比較快","個人帳號不能設權限","因為作業系統規定每一個資料夾最多只能授權給一個人"],why:"直接授權給個人，幾年後沒人說得清楚誰為什麼有權限。"},
 {t:"多因素驗證",q:"攻擊者拿到密碼後，不斷送出手機驗證推播，使用者被吵到按了「允許」。要怎麼降低這種風險？",a:["改用需要輸入畫面數字的驗證方式，並教育使用者不是自己發起的不要按","把推播通知關掉","取消多因素驗證","請使用者把手機交給主管統一保管"],why:"這叫 MFA 疲勞攻擊。數字比對讓使用者必須看著登入畫面才能通過。"},
 {t:"權限審查",q:"定期的權限審查，應該由誰確認「這個人該不該有這個權限」？",a:["該系統或資料的擁有者，或當事人的主管","資訊人員自己判斷","當事人自己確認","由系統每一季隨機挑選一位同仁來負責確認所有人的權限"],why:"資訊人員知道誰有權限，但不知道業務上該不該有。這個判斷要回到業務端。"},
 {t:"帳號鎖定",q:"帳號鎖定門檻設成「錯 3 次就永久鎖定」，會有什麼副作用？",a:["容易被人故意輸錯來鎖住別人的帳號","完全沒有副作用","密碼會變簡單","使用者會因此連自己的帳號名稱都一起忘記"],why:"太嚴會變成阻斷服務的工具，太鬆又擋不住猜密碼。通常設合理次數加上自動解鎖時間。"},
 {t:"緊急帳號",q:"「緊急存取帳號」（Break Glass）是用來做什麼的？",a:["正常的驗證機制故障時，讓管理者還能進得去","讓使用者忘記密碼時使用","給廠商長期使用","讓每一位員工在趕時間的時候可以跳過驗證直接登入"],why:"例如 SSO 或 MFA 服務掛了。它要嚴格保管、平常不用，一被使用就要告警。"}
],[
 {t:"聯合身分",q:"使用 SAML 或 OIDC 做單一登入時，「身分提供者」（IdP）的角色是？",a:["負責驗證使用者，並告訴應用系統這個人是誰","負責儲存應用系統的資料","負責備份","負責向每一位使用者按月收取使用各個系統的費用"],why:"應用系統把驗證交給 IdP，自己不用存密碼。IdP 因此成為最關鍵的系統之一。"},
 {t:"條件式存取",q:"「條件式存取」是依據什麼來決定要不要放行？",a:["登入當下的條件，例如裝置、位置、風險程度","只看密碼對不對","只看使用者的職稱","只看使用者當天的出勤紀錄上面有沒有遲到或早退"],why:"同一個人從公司電腦登入直接放行，從陌生國家的陌生裝置登入就要求加驗或擋下。"},
 {t:"特權存取管理",q:"特權存取管理（PAM）系統通常提供哪些功能？",a:["保管特權密碼、定期輪替、側錄操作過程","加快電腦的開機速度","自動撰寫程式","統計每位員工每天使用電腦的時數來計算薪資"],why:"管理員不必知道真正的密碼，由系統代為登入並留下紀錄。"},
 {t:"職務區隔",q:"設計角色時發現，同一個角色既能「建立廠商資料」又能「核准付款」。問題是什麼？",a:["違反職務區隔，一個人就能完成舞弊","角色名稱太長","權限太少","這樣的設計會讓系統的執行速度明顯變慢"],why:"會互相制衡的權限不能落在同一個人身上。角色設計時就要檢查衝突。"},
 {t:"孤兒帳號",q:"要找出「人已經離職但帳號還在」的孤兒帳號，最有效的方法是？",a:["定期把帳號清單和人事資料比對","等使用者自己回報","看帳號名稱是不是很舊","把所有超過一年的帳號全部刪除，不論還有沒有人在使用"],why:"人事資料是「誰該存在」的依據。比對不上的帳號就要逐一確認。"},
 {t:"機器身分",q:"程式用的 API 金鑰、憑證這類「機器身分」，管理上最常見的問題是？",a:["數量很多、沒人列冊、從不更換","太容易記住","用完就自動消失","只能在每個月的第一天使用，其他時間會自動失效"],why:"機器身分往往比人的帳號多好幾倍。要有清冊、負責人、到期和輪替機制。"},
 {t:"權杖安全",q:"使用者已經用了多因素驗證，攻擊者仍然進得來，因為偷走了登入後的連線權杖。可以怎麼降低風險？",a:["縮短權杖效期，並把權杖綁定在裝置上","取消多因素驗證","把密碼改長","請使用者每天上班之前先把瀏覽器重新安裝一次"],why:"驗證只發生在登入那一刻。權杖被偷等於直接跳過驗證，所以權杖本身也要保護。"},
 {t:"最小權限",q:"要把「權限給太多」的現況收斂成最小權限，比較可行的做法是？",a:["依實際的使用紀錄，把長期沒用到的權限逐步移除","一次把所有人的權限全部收回","維持現狀","請每一位使用者自己申報覺得不需要的權限，沒申報的就全部保留"],why:"一次全收會癱瘓業務。看紀錄知道哪些真的沒在用，移除的風險最低。"}
],[
 {t:"零信任",q:"為什麼說「身分是新的邊界」？",a:["系統和使用者都不在公司網路裡了，能依靠的管制點變成身分","因為防火牆已經被禁用","因為身分證字號很重要","因為公司的辦公室已經不再設置實體的大門"],why:"雲端服務和遠距工作讓網路邊界失去意義。每次存取都依身分、裝置和情境判斷。"},
 {t:"可用性",q:"所有系統都接上同一套身分提供者之後，最大的架構風險是什麼？",a:["它一故障，所有系統都無法登入","使用者會太方便","密碼會變短","每個系統的畫面顏色和字型都會變得一模一樣"],why:"集中帶來單點失效。要有備援、監控，以及不依賴它的緊急存取方式。"},
 {t:"身分整合",q:"兩家公司合併，各有一套目錄和身分系統。初期比較務實的做法是？",a:["先建立信任或同步讓雙方能互相存取，再規劃長期整合","第一天就把其中一套關掉","永遠各用各的","請兩邊的員工都各自申請對方公司的帳號，每人維護兩組"],why:"一次切換風險太高。先讓業務能運作，再依優先順序逐步收斂。"},
 {t:"無密碼驗證",q:"FIDO2 通行金鑰這類「無密碼」驗證，為什麼能抵抗釣魚？",a:["驗證會綁定正確的網站，假網站拿不到可用的憑證","因為使用者記不住","因為它沒有任何加密","因為釣魚網站依照法律規定不可以要求使用者插入實體金鑰"],why:"密碼和簡訊驗證碼都能被騙去輸入在假網站上；綁定網域的金鑰不會對假網站回應。"},
 {t:"角色治理",q:"導入 RBAC 幾年後，角色數量比員工人數還多。這個問題要怎麼治理？",a:["定期檢視合併相似角色，並訂定新增角色的審核標準","再多建一些角色","取消 RBAC","把所有角色的名稱都改成數字編號，這樣可以節省資料庫的空間"],why:"這叫角色爆炸。每個例外都開新角色，最後跟直接授權給個人沒兩樣。"},
 {t:"身分治理",q:"身分治理（IGA）系統和人事系統串接，最主要的價值是？",a:["到職、異動、離職時，帳號和權限自動跟著調整","讓人事系統跑得更快","取代人事部門","讓員工可以自行登入修改自己的到職日期、部門和職稱"],why:"靠人工通知一定會漏。由人事異動直接驅動帳號，離職當天自動停用。"},
 {t:"第三方存取",q:"給委外廠商的帳號，治理上最重要的三件事是？",a:["專人專用、設有期限、行為有監控","共用一組、永久有效、不留紀錄","權限給最大方便作業","由廠商自己決定需要哪些權限並自行開通"],why:"廠商帳號是常見的入侵管道。合約結束或人員異動時要能即時停用。"},
 {t:"權限模型",q:"RBAC 之外，「以屬性為基礎」（ABAC）的存取控制適合什麼情況？",a:["規則要依部門、資料分類、時間等多種條件動態判斷時","使用者人數很少時","完全不需要權限控管時","所有的使用者都需要完全相同的權限時"],why:"ABAC 彈性高但也難管理和稽核。常見做法是 RBAC 為主，少數情境用屬性補充。"}
]]},
{id:'virt',lv:[[
 {t:"虛擬化基礎",q:"Hypervisor 是什麼？",a:["在實體主機上建立並管理多台虛擬機的軟體","一種高速的硬碟","一種網路線","一種專門用來測試螢幕顯示品質和色彩準確度的工具"],why:"它把實體的 CPU、記憶體、磁碟分配給各台虛擬機，並讓它們彼此隔離。"},
 {t:"虛擬化基礎",q:"把伺服器虛擬化，最主要的好處是什麼？",a:["一台實體主機可以跑多個系統，資源利用率高、調度彈性","每個系統一定會變快","不再需要備份","完全不需要任何實體的伺服器"],why:"省硬體、省電、省空間，建立和搬移也快。代價是多了一層要管理。"},
 {t:"範本",q:"虛擬機「範本」的用途是？",a:["快速建立設定一致的新虛擬機","加密虛擬機","刪除虛擬機","讓虛擬機可以在沒有電力的情況下繼續運作"],why:"作業系統、更新、基本設定都先做好，新機器幾分鐘就能上線，而且每台一致。"},
 {t:"資源配置",q:"一台實體主機有 16 個核心，上面的虛擬機總共配置了 40 個虛擬 CPU。這可行嗎？",a:["可行，因為虛擬機不會同時全部用滿，但超太多會互相等待","不可行，一定會當機","可行，而且不論配多少都不會有影響","不可行，法規禁止配置超過實體核心的數量"],why:"這叫超額配置，是虛擬化的常態。比例要看負載，過高時每台都會變慢。"},
 {t:"容器",q:"容器和虛擬機最主要的差別是？",a:["容器共用主機的作業系統核心，比較輕量","容器一定比較安全","容器不能跑程式","容器只能在筆記型電腦上面執行，伺服器不支援"],why:"虛擬機各有完整的作業系統；容器只包應用程式和它需要的東西，啟動快、佔用少。"},
 {t:"虛擬網路",q:"虛擬交換器的作用是？",a:["讓虛擬機之間、以及虛擬機和實體網路之間能夠連線","讓虛擬機的螢幕變大","取代防火牆","讓虛擬機可以不需要網路卡、也不需要設定 IP 位址就能上網"],why:"它在主機裡扮演交換器，VLAN 的設定也要在這一層對得上。"},
 {t:"虛擬磁碟",q:"虛擬磁碟的「精簡配置」是什麼意思？",a:["宣告的容量很大，但實際用多少才佔多少","磁碟一建立就佔滿全部容量","磁碟不能寫入","磁碟裡面的資料每天晚上都會被自動清空一次"],why:"省空間，但所有虛擬機加起來可能超過實際容量，要監控底層儲存的剩餘空間。"},
 {t:"客體工具",q:"在虛擬機裡安裝平台提供的客體工具（Guest Tools），主要目的是？",a:["讓虛擬機和平台配合得更好，例如正常關機、時間同步、驅動程式","讓虛擬機可以玩遊戲","取代防毒軟體","讓虛擬機可以不用安裝作業系統"],why:"沒裝的話，效能較差，備份時也無法通知系統先把資料寫入磁碟。"}
],[
 {t:"效能",q:"虛擬機的 CPU 使用率不高，但反應很慢，平台顯示它「等待 CPU 的時間」很長。原因是？",a:["主機上的虛擬 CPU 配置過多，大家在排隊","虛擬機的硬碟太大","網路線太短","虛擬機的螢幕解析度設定得太高"],why:"虛擬機想用 CPU 卻排不到。解法是減少超額配置，或移走部分虛擬機。"},
 {t:"高可用",q:"虛擬化叢集要做到主機故障時自動在別台重啟虛擬機，為什麼通常需要共用儲存？",a:["其他主機要能讀到同一份虛擬機檔案","共用儲存比較便宜","為了省電","因為共用儲存可以讓虛擬機不需要記憶體"],why:"虛擬機檔案如果只在壞掉的那台主機裡，別台就無從啟動它。"},
 {t:"高可用",q:"叢集的高可用（HA）功能在主機故障時，虛擬機會怎麼樣？",a:["在其他主機上重新開機，中間會中斷一小段時間","完全不中斷，使用者毫無感覺","永久消失","自動變成實體伺服器"],why:"HA 是重啟，不是不中斷。要零中斷得用容錯功能或在應用層做叢集。"},
 {t:"資源調度",q:"叢集的自動資源調度功能在做什麼？",a:["依負載把虛擬機在主機之間移動，讓資源使用平均","自動刪除不用的虛擬機","自動購買新主機","自動把所有的虛擬機都集中到同一台主機上面，以節省其他主機的電力"],why:"管理者不必手動調整。但規則沒設好時，也可能把不該放一起的虛擬機排在一起。"},
 {t:"儲存",q:"使用精簡配置的儲存空間被用滿了。虛擬機會發生什麼事？",a:["寫不進去，可能暫停或損毀","自動多出空間","速度變快","自動把最舊的資料刪除來騰出空間"],why:"這是精簡配置最大的風險，而且會同時影響很多台。要設容量告警並預留空間。"},
 {t:"放置規則",q:"兩台互為備援的伺服器（例如兩台網域控制站）都是虛擬機。放置上要注意什麼？",a:["設定規則讓它們不要在同一台實體主機上","放在同一台主機比較好管理","沒有需要注意的","讓它們共用同一顆虛擬磁碟以確保資料一致"],why:"放同一台，主機一壞兩台一起倒，備援就白做了。這叫反親和性規則。"},
 {t:"容器",q:"容器映像檔建好之後，要更新程式版本。正確的做法是？",a:["建一個新版本的映像檔，用它重新部署","登入正在執行的容器裡面直接改","把舊映像檔覆蓋掉且不留版本","請使用者自己進到正在執行的容器裡面手動下載更新"],why:"容器是可拋棄的。改動要進映像檔，才能重現、退版，每個環境也才一致。"},
 {t:"治理",q:"虛擬機很容易建立，幾年後出現一堆沒人知道用途的機器。要怎麼預防？",a:["建立時就登記負責人和用途，設到期日並定期清查","禁止建立虛擬機","不用管，反正是虛擬的","每個月隨機刪除一部分的虛擬機"],why:"這叫虛擬機蔓延。沒人管的機器吃資源、沒更新，還是資安的破口。"}
],[
 {t:"效能",q:"一台配置了很多 CPU 和記憶體的大型虛擬機，效能卻不如預期。和實體主機的哪個架構特性有關？",a:["NUMA，虛擬機的資源橫跨了多個節點","螢幕更新率","鍵盤配置","主機機殼的顏色，以及它在機櫃裡面擺放的方向"],why:"跨節點存取記憶體比較慢。大型虛擬機的規格要配合主機的實體配置。"},
 {t:"排錯",q:"虛擬機反應說磁碟很慢。排查時應該依序看哪幾層？",a:["虛擬機內部、主機、儲存網路、儲存設備","只看虛擬機內部","只看儲存設備","只看使用者的鍵盤和滑鼠有沒有接好、電池有沒有電"],why:"延遲可能出在任何一層。逐層比較延遲數字，才知道卡在哪。"},
 {t:"容量",q:"八台主機的叢集，為了能容忍一台故障，平常的資源使用率應該控制在多少以下？",a:["大約八分之七，留一台的餘裕","100%，全部用滿最有效率","10%","只要每一台主機都有開機就不需要控制使用率"],why:"沒留餘裕，一台故障時其他台接不下來，HA 就是空談。升級維護時也要用到這個空間。"},
 {t:"安全",q:"虛擬化的管理平台（管理所有主機和虛擬機的那套系統），安全等級應該怎麼定？",a:["最高等級，拿到它就等於拿到上面所有系統","跟一般辦公電腦一樣","不需要保護","只需要每一年更換一次管理者的密碼，其他的不需要特別處理"],why:"可以直接複製磁碟、開主控台、關機。攻擊者常以它為目標來加密整個環境。"},
 {t:"容器編排",q:"在容器編排平台上，容器隨時可能被重建。這對資料存放有什麼影響？",a:["要保留的資料必須放在容器之外的持久儲存","資料放在容器裡最安全","不需要儲存資料","資料會自動複製一份到每一位使用者的個人電腦上"],why:"容器重建後，裡面的檔案就不見了。資料庫檔案、上傳的檔案都要掛外部儲存。"},
 {t:"安全",q:"為什麼 Hypervisor 本身的安全性更新特別重要？",a:["它的漏洞可能讓攻擊者從一台虛擬機跳到主機或其他虛擬機","因為更新後畫面比較好看","因為不更新會過保固","因為更新可以讓虛擬機的數量自動增加"],why:"虛擬機之間的隔離全靠它。這類「逃逸」漏洞雖少見，但影響的是整台主機。"},
 {t:"備份",q:"備份虛擬機時，「應用程式一致性」的備份是指什麼？",a:["備份前先通知應用程式把記憶體中的資料寫入磁碟","備份檔的檔名一致","每次備份的大小一致","所有的虛擬機都在同一秒鐘開始備份"],why:"只做磁碟快照，資料庫可能有寫到一半的資料。需要客體工具配合才做得到。"},
 {t:"授權",q:"虛擬化和資料庫軟體常依「實體核心數」或「主機數」計費。這對架構設計有什麼影響？",a:["虛擬機能在哪些主機上跑，會直接影響授權成本","沒有任何影響","只影響畫面顏色","只會影響採購單位的作業，跟負責設計架構的技術人員沒有關係"],why:"把需要昂貴授權的系統集中在少數主機上，是常見的設計考量。搬移前要先確認授權。"}
],[
 {t:"平台策略",q:"評估要不要更換虛擬化平台。除了授權費，最不能忽略的成本是？",a:["遷移的人力和風險，以及周邊工具和人員技能的重建","新平台的標誌設計","機櫃的顏色","新平台的說明文件總共有幾頁"],why:"備份、監控、自動化腳本、人員經驗都綁在現有平台上。這些才是鎖定的來源。"},
 {t:"架構選型",q:"超融合架構（HCI）相對於「伺服器＋獨立儲存」的傳統架構，主要取捨是？",a:["部署和擴充簡單，但運算和儲存要一起擴","一定比較便宜","不需要網路","只能使用一台主機，無法擴充"],why:"只缺儲存不缺運算時，還是得整個節點一起買。適不適合要看兩者成長是否同步。"},
 {t:"多站架構",q:"把一個叢集延伸到兩個機房。兩地之間的線路中斷時，最需要靠什麼避免雙邊同時運作？",a:["位於第三地的見證機制","兩邊各派一個人講電話","把兩邊都關機","讓兩邊都繼續運作，等線路恢復之後再人工合併資料"],why:"沒有見證，兩邊都會以為對方掛了而各自啟動同一批虛擬機，造成資料分岔。"},
 {t:"容量規劃",q:"做三年的平台容量規劃，除了過去的使用趨勢，還要納入什麼？",a:["業務計畫，例如新系統上線、併購、汰換","只要看趨勢就夠了","同業買了幾台","機房管理人員個人對於未來三年的直覺判斷"],why:"趨勢只能反映過去。一個新專案的需求可能比三年的自然成長還多。"},
 {t:"技術選型",q:"一個新應用要選擇跑在虛擬機、容器還是無伺服器服務上。判斷的關鍵是？",a:["應用的特性和團隊的維運能力","哪一個最新","哪一個名稱最好聽","哪一種技術在最近一年的研討會上被提到最多次"],why:"狀態多、難改的舊系統適合虛擬機；無狀態、常更新的適合容器；零星觸發的適合無伺服器。"},
 {t:"升級策略",q:"規劃虛擬化平台的大版本升級時，最先要確認的是什麼？",a:["硬體、備份、監控等周邊和新版本的相容性","新版本的圖示好不好看","升級當天的天氣","新版本的安裝檔案大小是不是比舊的版本還要小"],why:"平台升上去了，備份軟體卻還不支援，就等於沒有備份。相容矩陣要先對過。"},
 {t:"多租戶",q:"同一個平台要同時服務好幾個部門或客戶，彼此不能互相影響。設計上要隔離哪些面向？",a:["運算資源、網路、儲存和管理權限","只要帳號名稱不同就好","只要放在不同的資料夾","只要讓每個部門使用不同的桌面背景圖片"],why:"資源沒限制，一個部門吃滿會拖垮別人；網路沒隔離，就能互相連線。"},
 {t:"治理",q:"開放讓各單位自助申請虛擬機之後，最需要搭配什麼機制？",a:["配額、到期回收和成本可視","取消所有限制","每台都由主管手動建立","規定每一個單位每天至少要申請一台"],why:"自助帶來速度，也帶來浪費。沒有上限和回收，資源很快被佔滿。"}
]]},
{id:'bcdr',lv:[[
 {t:"備份觀念",q:"「備份」和「封存」的目的有什麼不同？",a:["備份是為了出事時能還原，封存是為了長期保存不常用的資料","兩者完全一樣","備份是刪除資料，封存是複製資料","備份只能用在伺服器，封存只能用在個人電腦"],why:"備份會輪替覆蓋，重點是還原得回來；封存是把資料移到長期存放的地方，重點是查得到。"},
 {t:"復原目標",q:"RPO 是在問什麼？",a:["出事時，最多可以接受遺失多久的資料","多久之內要恢復服務","備份要花多少錢","備份的檔案總共要保留幾份"],why:"RPO 一小時，代表至少每小時要有一份可用的資料副本。"},
 {t:"復原目標",q:"RTO 是在問什麼？",a:["出事後，多久之內要恢復服務","最多可以遺失多少資料","備份要放在哪裡","一年之內總共可以發生幾次故障"],why:"RTO 決定備援要做到什麼程度：能等一天，還是只能等十分鐘，成本差很多。"},
 {t:"異地備份",q:"為什麼備份要有一份放在「異地」？",a:["同一個地點發生火災、水災或竊盜時，還有一份在別處","異地的電費比較便宜","為了讓備份跑得比較快","因為法律規定備份媒體不可以和伺服器放在同一個縣市之內"],why:"主機和備份放同一間機房，一場災害就一起沒了。"},
 {t:"備份觀念",q:"檔案放在會自動同步的雲端硬碟，算不算有備份？",a:["不算，刪除或被加密也會同步過去","算，而且是最好的備份","算，只要網路夠快","算，只要同步的資料夾名稱裡面有「備份」兩個字"],why:"同步是讓各處保持一致，錯的也一起一致。備份要能回到過去某個時間點。"},
 {t:"備份監控",q:"備份排程每天都有寄結果通知。為什麼一定要有人看？",a:["失敗了沒人處理，等到要還原時才發現沒有備份","因為信件會佔空間","因為要回信給系統","因為沒有人看通知的話，備份的執行速度會一天比一天慢"],why:"備份悄悄失敗好幾週，是很常見的事故原因。失敗要有人追、有紀錄。"},
 {t:"還原測試",q:"確認備份真的可以用，唯一可靠的方法是？",a:["實際還原一次","看備份檔的大小","看排程顯示成功","請廠商出具一份保證備份可以使用的書面文件"],why:"沒還原過的備份只是一個檔案。還原測試同時也讓人熟悉步驟、知道要花多久。"},
 {t:"保留期限",q:"備份的「保留期限」是在決定什麼？",a:["每一份備份要留多久才能刪除","備份要在幾點執行","備份要用哪個廠牌","備份檔的檔名最多可以有幾個字"],why:"留太短，發現問題時已經沒有夠早的版本；留太長，空間和成本會失控。也要對照法規要求。"}
],[
 {t:"備份原則",q:"「3-2-1-1-0」比 3-2-1 多出來的「1」和「0」是指什麼？",a:["一份離線或不可變的備份，以及還原驗證零錯誤","一位管理員和零預算","一台主機和零停機","一個星期只備份一次，以及完全不需要任何異地備份"],why:"多的那份是為了勒索軟體，零錯誤是要求備份都經過驗證。"},
 {t:"輪替",q:"「祖父-父-子」的備份輪替方式，是在做什麼？",a:["每日、每週、每月各保留不同數量的備份","由三個人輪流負責備份","一次備份三份","讓三台伺服器輪流當備份主機"],why:"近期的留得密、久遠的留得疏，在可還原的時間範圍和儲存成本之間取得平衡。"},
 {t:"備份視窗",q:"資料量越來越大，完整備份已經無法在夜間跑完。常見的調整是？",a:["改成平日增量、週末完整，或採用永久增量","不備份了","改到白天尖峰時段跑","把一半的資料刪除，讓備份可以在時間內跑完"],why:"備份視窗不夠時，減少每次要搬的資料量是最直接的方法。"},
 {t:"備份安全",q:"為什麼建議備份伺服器不要加入正式的網域，並使用獨立的管理帳號？",a:["網域被拿下時，攻擊者不會順便拿到備份","這樣備份比較快","為了節省授權","因為備份伺服器加入網域之後就不能備份了"],why:"勒索軟體集團會先找備份系統。和正式環境的帳號體系分開，才留得住最後一條路。"},
 {t:"一致性",q:"「當機一致性」的備份，還原後像是什麼狀態？",a:["像是主機突然斷電後重開","像是正常關機後開機","像是全新安裝","像是資料已經自動更新到最新的版本"],why:"磁碟上的資料是一致的，但記憶體中還沒寫入的就沒了。資料庫通常要做應用程式一致性的備份。"},
 {t:"儲存效率",q:"備份系統的「重複資料刪除」是怎麼省空間的？",a:["相同的資料區塊只存一份","把檔案壓縮成圖片","刪除較舊的檔案","只備份檔名，不備份檔案的內容"],why:"每天的完整備份大部分內容相同，去重後佔用的空間少很多。代價是運算資源和對索引的依賴。"},
 {t:"備份監控",q:"某台伺服器的備份已經連續失敗五天，沒有人處理。流程上應該補什麼？",a:["失敗要自動開單並指派負責人，超過期限要往上通報","把失敗通知關掉","等它自己好","把那一台伺服器從備份的清單中移除"],why:"通知不等於有人負責。要有明確的負責人和時限，備份失敗才不會變成背景雜訊。"},
 {t:"備份範圍",q:"新上線的系統三個月後出事，才發現從來沒被備份。應該怎麼預防？",a:["把「納入備份」列為系統上線的必要檢查項目","請大家多注意","每年檢查一次就好","規定所有的新系統都要等上線滿一年之後才開始備份"],why:"靠記得一定會漏。寫進上線流程，並定期拿資產清冊和備份清單比對。"}
],[
 {t:"勒索復原",q:"遭勒索軟體加密後要從備份還原。第一件要確認的事是什麼？",a:["要用的還原點是不是在攻擊者入侵之前","備份軟體的版本","還原要用哪一台螢幕","備份檔的檔名裡面有沒有包含當天的日期和星期"],why:"攻擊者常潛伏數週。還原到已經有後門的時間點，等於把他請回來。"},
 {t:"勒索復原",q:"不確定備份乾不乾淨時，比較安全的還原方式是？",a:["先還原到隔離的環境檢查，確認後再接回正式網路","直接還原到正式環境","不還原","還原之後立刻對外開放，請所有的使用者一起幫忙測試有沒有問題"],why:"隔離環境讓你可以掃描、檢查，不怕殘留的惡意程式再次擴散。"},
 {t:"備援站",q:"熱備援、暖備援、冷備援三種異地備援站，差別在哪裡？",a:["設備和資料準備的程度不同，恢復時間和成本也不同","機房的溫度不同","使用的廠牌不同","負責管理的人員的年資不同"],why:"熱備援隨時可接手、最貴；冷備援只有場地，要花很多時間才能啟用。依 RTO 選擇。"},
 {t:"切換",q:"服務已經切換到備援站運作。接下來容易被忽略的是什麼？",a:["怎麼切回主站，包含把這段期間的資料同步回去","慶祝切換成功","把主站報廢","通知所有的使用者，從今以後都永久改用備援站的系統"],why:"切過去只做了一半。切回的計畫沒想好，可能再造成一次中斷或資料遺失。"},
 {t:"相依關係",q:"災難復原計畫要列出系統之間的相依關係。主要是為了什麼？",a:["決定還原的先後順序","計算電費","安排座位","決定哪一個系統的畫面要優先重新設計"],why:"應用程式還原了，但它依賴的驗證、名稱解析、資料庫還沒起來，一樣不能用。"},
 {t:"金鑰管理",q:"備份有加密，而解密金鑰只存在正式環境的一台伺服器上。這有什麼風險？",a:["那台伺服器毀損，備份就永遠打不開","沒有風險","備份會變慢","備份檔的大小會因此變成原本的兩倍以上"],why:"金鑰要另外安全保存，並且自己也要有備份。災難時金鑰一起消失是很常見的疏忽。"},
 {t:"復原時間",q:"計畫上寫 RTO 四小時，但要從異地把 20TB 的資料傳回來。評估時最該確認什麼？",a:["以實際的頻寬和還原速度算，傳得完嗎","文件的格式對不對","備份軟體的介面語言","異地機房的工作人員在還原的當天有沒有排班上班"],why:"很多計畫的數字是填的，不是量的。資料量、頻寬、還原速度一算，可能要好幾天。"},
 {t:"雲端服務",q:"公司的郵件和文件都在 SaaS 雲端服務上。還需要自己備份嗎？",a:["需要，業者保證的是服務可用，資料誤刪或被加密通常是客戶的責任","不需要，雲端不會出事","不需要，業者會無限期保留所有版本","需要，但只要把帳號密碼抄下來就算是備份"],why:"共同責任模型下，資料是客戶的。資源回收筒的保留期限一過，業者也救不回來。"}
],[
 {t:"計畫範圍",q:"營運持續計畫（BCP）和災難復原計畫（DRP）的範圍有什麼不同？",a:["BCP 涵蓋整個業務怎麼繼續運作，DRP 聚焦在資訊系統的復原","兩者完全相同","DRP 的範圍比較大","BCP 只處理火災，DRP 只處理地震"],why:"系統恢復之前，業務要怎麼用人工或替代方式撐住，是 BCP 的事，不是資訊單位單獨能決定的。"},
 {t:"分級保護",q:"所有系統都採用最高等級的備援，是好的策略嗎？",a:["不是，應依業務衝擊分析分級，把資源放在真正關鍵的系統","是，越高越好","是，這樣最簡單","不是，所有的系統都應該一律採用最低的保護等級來節省成本"],why:"資源有限。全部最高等級不是做不到就是做不好，結果關鍵系統反而沒顧好。"},
 {t:"演練",q:"災難復原演練通常由淺到深安排。順序是？",a:["桌上推演、部分系統測試、完整切換","直接做完整切換","只做桌上推演","先做完整切換，如果失敗的話再回頭做桌上推演"],why:"先在會議桌上找出流程的問題，再動系統。一開始就完整切換，演練本身可能變成災難。"},
 {t:"區域風險",q:"主機房和備援機房相距五公里，接同一個變電所。這個設計的弱點是？",a:["區域性的災害或停電會同時影響兩邊","距離太遠","維護太方便","兩個機房的門牌號碼太過相近容易送錯貨"],why:"地震、淹水、大範圍停電的影響範圍常超過幾公里。備援要考慮共同的依賴。"},
 {t:"人員",q:"復原計畫假設「關鍵的五位工程師都能到場」。這個假設有什麼問題？",a:["災害時人可能也到不了，計畫要考慮人員不可用","沒有問題","五位太少，應該假設五十位","工程師到場之後可能會找不到停車位"],why:"疫情、地震、交通中斷時，人也是受影響的資源。要有代理人和別人看得懂的文件。"},
 {t:"成本取捨",q:"業務單位要求「一筆資料都不能掉、一秒都不能停」。資訊單位應該怎麼回應？",a:["說明要達到的成本，讓他們依實際衝擊決定合理的目標","直接答應","直接拒絕","先口頭答應下來，等到哪一天真的出事的時候再向他們解釋做不到"],why:"RPO 和 RTO 越接近零，成本上升得越快。要讓提出需求的人看到代價再決定。"},
 {t:"決策",q:"發生重大事故時，「要不要宣布啟動災難復原」為什麼要事先指定決策者和判斷標準？",a:["當下資訊不完整又有壓力，沒有授權會猶豫或各做各的","因為表單需要簽名","為了事後究責","因為宣布的時候需要有人負責拍照和錄影"],why:"切換有成本和風險，太早太晚都不好。誰能決定、依據什麼，要在平時講好。"},
 {t:"持續改善",q:"演練結束後，最重要的後續動作是什麼？",a:["把發現的問題更新到計畫並追蹤改善","把報告歸檔","慶功","明年用完全相同的劇本和人員再演練一次"],why:"演練的價值在找到落差。沒有改計畫的演練，下次會在同一個地方卡住。"}
]]},
{id:'itsm',lv:[[
 {t:"服務台",q:"設立「服務台」作為單一窗口，主要的好處是？",a:["使用者只要找一個地方，每件事也都有紀錄和追蹤","讓資訊人員不用接電話","增加部門人數","讓使用者必須等待比以前更久的時間，才能夠得到資訊人員的協助"],why:"沒有單一窗口，使用者各找各的熟人，沒紀錄、沒優先順序，也看不出整體狀況。"},
 {t:"工單",q:"很小的問題兩分鐘就處理完了，還需要開工單嗎？",a:["需要，才有紀錄可以統計和追溯","不需要，浪費時間","看心情","只有主管交辦的事情才需要開立工單"],why:"小問題累積起來才看得出趨勢。也許同一個小問題一個月發生了五十次。"},
 {t:"優先度",q:"工單的優先度通常由哪兩個因素決定？",a:["影響範圍和急迫程度","報修人的職位和年資","工單的編號和日期","報修人打電話來的時候說話的音量大小"],why:"一個人的小問題和整個部門停擺，處理順序不同。標準一致，才不會誰大聲誰優先。"},
 {t:"事件與問題",q:"在服務管理裡，「事件」和「問題」的差別是？",a:["事件是服務中斷要盡快恢復，問題是找出造成事件的根本原因","兩者一樣","問題比較小，事件比較大","事件是使用者造成的，問題則是資訊人員造成的"],why:"重開機讓服務恢復是處理事件；查出為什麼一直要重開，是處理問題。"},
 {t:"變更",q:"服務管理裡的「變更」是指什麼？",a:["對正式環境的新增、修改或移除","更換辦公室座位","修改工單的標題","資訊人員調整自己每天上下班的時間"],why:"很多事故是變更造成的，所以變更要評估、核准、記錄，並且能退回。"},
 {t:"組態管理",q:"CMDB（組態管理資料庫）記錄的是什麼？",a:["有哪些設備和系統，以及它們之間的關係","員工的薪資","使用者的密碼","公司每一年的營業收入、支出以及獲利的明細"],why:"知道「這台交換器後面接了哪些系統」，出事或變更時才評估得出影響範圍。"},
 {t:"知識管理",q:"把常見問題的處理方式寫進知識庫，最直接的效益是？",a:["同樣的問題不必每次重新摸索，新人也能處理","讓文件變多","讓稽核滿意","讓資深的同仁從此可以不用再回答任何人的問題"],why:"知識留在個人腦中，人不在就卡住。寫下來也是在減少自己被重複打擾。"},
 {t:"結案",q:"工單要結案之前，應該做什麼？",a:["和使用者確認問題已經解決","直接結案","等一個月","請主管代替使用者確認問題已經解決"],why:"資訊人員認為好了，不代表使用者能用了。沒確認就結案，只是讓他再報一次。"}
],[
 {t:"變更類型",q:"「標準變更」是指哪一種？",a:["風險低、做法固定、已經預先核准的例行變更","最重要的變更","最緊急的變更","任何一位資深同仁自己認為不需要經過審核的變更"],why:"例如照既定程序開通帳號。不必每次送審，審核的力氣就能放在真正有風險的變更上。"},
 {t:"變更管理",q:"月底結帳期間設定「變更凍結」，目的是什麼？",a:["在業務關鍵時段降低因變更造成中斷的風險","讓資訊人員放假","節省電費","因為每到月底的時候，系統就不允許任何人登入"],why:"這段期間出事的代價特別高。只允許緊急修復，其他的排到之後。"},
 {t:"重大事件",q:"什麼情況應該啟動「重大事件」的處理流程？",a:["影響範圍大或衝擊關鍵業務，需要跨團隊協調和專人指揮時","任何一張工單","只有主管報修時","只有在事件發生的時間剛好是上班時間的時候"],why:"重大事件要有指揮者、固定的溝通節奏和升級路徑。標準要事先定義，不能臨時判斷。"},
 {t:"升級",q:"工單的「功能性升級」和「階層性升級」有什麼不同？",a:["前者是轉給更專業的技術團隊，後者是往上通報管理階層","兩者相同","前者比較慢","前者是提供給內部人員使用，後者則是專門提供給外部廠商使用"],why:"技術上解不了就轉專業；時限快到或影響擴大就讓主管知道。兩者可以同時發生。"},
 {t:"組態管理",q:"CMDB 的資料長期沒更新、不準確。最直接的後果是什麼？",a:["評估變更影響和排查事件時，依據的資訊是錯的","資料庫會變大","沒有後果","使用者會因此無法登入自己的電腦"],why:"不準的 CMDB 比沒有還糟，因為大家會相信它。資料要有負責人和更新機制。"},
 {t:"服務水準",q:"工單在等使用者回覆資訊，SLA 的時間通常怎麼算？",a:["暫停計時，等使用者回覆後再繼續","繼續計時","直接算逾時","重新從零開始計算並且自動延長一倍的時間"],why:"等待不在資訊單位的掌控中。但暫停要有規則，避免被拿來規避時限。"},
 {t:"已知錯誤",q:"根本原因還沒解決，但已經有暫時的處理方式。這個狀態應該記錄成什麼？",a:["已知錯誤，並附上暫時的解決方法","已結案","新的事件","不需要記錄，等根本原因解決之後再一起補"],why:"第一線遇到同樣的問題可以直接套用，不必重查，也讓問題持續被追蹤。"},
 {t:"服務請求",q:"申請帳號、申請軟體這類重複性很高的請求，比較好的處理方式是？",a:["放進服務目錄，用固定的表單和流程，能自動化的就自動化","每次都用電話溝通","每次都開會討論","每一次都請使用者親自到資訊單位的辦公室填寫紙本的申請單"],why:"固定的流程才能量時間、自動核准、自動執行。人力留給真正需要判斷的事。"}

 COURSES.forEach((c,i)=>{const b=document.createElement('button');b.className='npc';b.style.left=P[i][0]+'%';b.style.top=(P[i][1]/62*100)+'%';b.dataset.c=c.id;b.style.setProperty('--rc',c.rc);b.onclick=()=>openTalk(c);st.appendChild(b);});}
function renderHub(){let ts=0,sc=0;const n=doneN();
 ALLC.forEach(c=>{for(let l=0;l<4;l++){const r=rec(c.id,l);ts+=r.stars;sc+=r.best;}});
 $('sDone').textContent=n+'／'+COURSES.length;$('sStar').textContent=ts;$('sScore').textContent=sc.toLocaleString();
 const ch=$('chips');ch.innerHTML='';
 COURSES.forEach(c=>{const t=titleOf(c),b=document.createElement('button');b.className='chip';b.innerHTML='<span class="ic" style="background:'+c.col+'">'+c.ic+'</span><span style="min-width:0"><b>'+c.name+'</b><small>'+c.npc+'・'+(t||'還沒有等級')+'</small></span>';b.onclick=()=>openTalk(c);ch.appendChild(b);});
 const ad=$('adv');ad.innerHTML='';
 TRACKS.forEach(tk=>{const h=document.createElement('h3');h.className='trk';h.innerHTML=tk+'<small>常見職稱：'+JOBS[tk]+'</small>';ad.appendChild(h);ADV.filter(c=>c.track===tk).forEach(c=>{const lk=lockedBy(c),t=titleOf(c),b=document.createElement('button');b.className='chip'+(lk.length?' lock':'');b.innerHTML='<span class="ic" style="background:'+(lk.length?'var(--panel2)':c.col)+'">'+(lk.length?'🔒':c.ic)+'</span><span style="min-width:0"><b>'+c.name+'</b><small>'+c.npc+'・'+(lk.length?'先修：'+lk.map(x=>x.name).join('、'):(t||'還沒有等級'))+'</small></span>';b.onclick=()=>openTalk(c);ad.appendChild(b);});});
 document.querySelectorAll('.npc').forEach(b=>{const c=COURSES.find(x=>x.id===b.dataset.c),t=tierOf(c);b.setAttribute('aria-label','找'+c.npc+'學'+c.name);
  b.innerHTML=(t>=0?'<span class="mk done">'+TIER[t]+'</span>':'<span class="mk">！</span>')+'<span class="roof"></span><span class="hut">'+c.ic+'</span><span class="tag">'+c.npc+'<small>'+c.name+'</small></span>';});
 const hn=$('hallN');if(hn)hn.textContent='已通過 '+n+'／'+COURSES.length+' 門';
 if(window.v3dRefresh)v3dRefresh();}
function closeTalk(){talk.hidden=true;talk.innerHTML='';}
function openTalk(c){sfx.talk();const t=tierOf(c),ttl=titleOf(c),lk=lockedBy(c);
 const say=lk.length?'想走這一科，基礎要先夠。先去把「'+lk.map(x=>x.name).join('」「')+'」考過，再回來找我。':t<0?c.hi:t<3&&pool(c,t+1).length<NQ?TIER[t]+'過了，不錯。'+TIER[t+1]+'的題目我還在準備，好了再來找我。':t===3?'你已經是專家了，我沒什麼好教的，想複習隨時來。':TIER[t]+'過了，要不要挑戰'+TIER[t+1]+'？';
 const btn=[0,1,2,3].map(l=>{const has=pool(c,l).length>=NQ,open=!lk.length&&(l===0||rec(c.id,l-1).stars>=2),r=rec(c.id,l);
  return '<button data-l="'+l+'" '+(has&&open?'':'disabled')+'>'+TIER[l]+(has?(open?starsHTML(r.stars):'<span class="n">'+(lk.length?'🔒 未開放':'🔒 前一級先過')+'</span>'):'<span class="n">製作中</span>')+'</button>';}).join('');
 talk.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-label="'+c.npc+'"><div class="who"><span class="face" style="background:'+c.col+'">'+c.ic+'</span><div style="min-width:0"><h2>'+c.npc+'</h2><small>'+c.name+'</small></div></div><p class="say">'+say+'</p><div class="ttl">'+(ttl?'你的技能等級：'+ttl:'通過初級，這項技能就會記上「初級」')+'</div><div class="tiers">'+btn+'</div><label class="prac"><input type="checkbox" id="prac">練習模式：不扣命、不計成績，可以放心看解說</label><div class="row"><button class="btn ghost" id="tClose">先不要</button></div></div>';
 talk.hidden=false;talk.querySelectorAll('.tiers button').forEach(b=>b.onclick=()=>{const pr=$('prac').checked;closeTalk();start(c,+b.dataset.l,pr);});
 $('tClose').onclick=closeTalk;talk.onclick=e=>{if(e.target===talk)closeTalk();};(talk.querySelector('.tiers button:not(:disabled)')||$('tClose')).focus();}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!talk.hidden)closeTalk();});
// ===== 作答 =====
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let G=null;
function start(d,l,practice){G={d,l,practice:!!practice,qs:shuf(pool(d,l)).slice(0,NQ),i:0,lives:3,combo:0,score:0,right:0,miss:[]};hub.hidden=true;hub.style.display='none';play.hidden=false;ask();scrollTo(0,0);}
function ask(){const g=G,q=g.qs[g.i];const opts=shuf(q.a.map((t,k)=>({t,ok:k===0})));
 play.innerHTML='<div class="bar"><span class="name">'+g.d.ic+' '+g.d.name+'・'+TIER[g.l]+(g.practice?'・練習':'')+'</span>'+(g.practice?'':'<span class="hearts" aria-label="剩 '+g.lives+' 條命">'+'❤️'.repeat(g.lives)+'<i>'+'❤️'.repeat(3-g.lives)+'</i></span>')+'<span class="combo">'+(g.combo>=2?'連對 ×'+g.combo:'')+'</span></div><div class="prog"><i style="width:'+(g.i/g.qs.length*100)+'%"></i></div>'+
  '<div class="qcard" id="qc"><span class="qno">第 '+(g.i+1)+'／'+g.qs.length+' 題　分數 '+g.score.toLocaleString()+'</span><p class="q">'+q.q+'</p>'+(q.code?'<pre>'+q.code+'</pre>':'')+'<div class="opts" id="opts"></div><div id="fb"></div></div>';
 const box=$('opts');opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t.replace(/&(?!amp;|lt;|gt;)/g,'&amp;');b.onclick=()=>answer(o,b,opts,q);box.appendChild(b);});}
function answer(o,btn,opts,q){const g=G;[...$('opts').children].forEach((b,k)=>{b.disabled=true;if(opts[k].ok)b.classList.add('right');});const qc=$('qc');
 if(o.ok){g.combo++;g.right++;const mul=g.combo>=6?2:g.combo>=4?1.5:g.combo>=2?1.2:1;g.score+=Math.round(100*mul);qc.classList.add('ok');sfx.good();}
 else{btn.classList.add('wrong');g.combo=0;if(!g.practice)g.lives--;g.miss.push(q);qc.classList.add('ng');sfx.bad();}
 const last=g.i===g.qs.length-1||g.lives<=0;
 $('fb').innerHTML='<div class="why'+(o.ok?'':' bad')+'"><b>'+(o.ok?'✔ 答對了':g.practice?'✘ 答錯了':'✘ 答錯了，扣一條命')+'</b>'+q.why+'</div><button class="btn" id="nx" style="margin-top:12px">'+(last?'看結果':'下一題')+'</button>';
 const nx=$('nx');nx.onclick=()=>{if(last)finish();else{g.i++;ask();scrollTo(0,0);}};nx.focus();}
function finish(){const g=G,n=g.qs.length,dead=g.lives<=0;const stars=dead?0:g.right===n?3:g.right>=n-1?2:1;
 const before=tierOf(g.d);if(!g.practice){SAVE[g.d.id]=SAVE[g.d.id]||{};const old=rec(g.d.id,g.l);SAVE[g.d.id][g.l]={stars:Math.max(old.stars,stars),best:Math.max(old.best,dead?0:g.score)};save();}(dead?sfx.lose:sfx.win)();
 const up=tierOf(g.d)>before,pass=stars>=2;
 const weak=[...new Set(g.miss.map(q=>q.t).filter(Boolean))];
 const head=g.practice?'練習結束':dead?'三條命用完了，這次沒過':pass?(up?'通過！技能升到「'+titleOf(g.d)+'」':'通過！'):'考完了，但錯超過一題，這一級還不算通過';
 play.innerHTML='<div class="qcard"><span class="qno">'+g.d.ic+' '+g.d.name+'・'+TIER[g.l]+'　'+g.d.npc+'</span><p class="q">'+head+'</p>'+(g.practice?'':'<div class="big">'+'★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i></div>')+'<div>答對 '+g.right+'／'+n+' 題'+(g.practice?'　<span class="note">練習不計成績</span>':'　分數 '+g.score.toLocaleString())+'</div>'+(up&&!g.practice?'<div class="note">技能等級代表通過這一級的知識測驗，不等於實作能力的認證。</div>':'')+(weak.length?'<div><b>這次比較弱的主題</b>：'+weak.join('、')+'</div>':'')+
  (g.miss.length?'<div><b>答錯的題目</b>'+g.miss.map(q=>'<div class="miss">'+q.q+'<small>正確答案：'+q.a[0]+'</small><small>'+q.why+'</small></div>').join('')+'</div>':'')+
  '<div class="row"><button class="btn" id="again">'+(g.practice?'再練一次':'再考一次')+'</button><button class="btn ghost" id="home">回職訓中心</button></div></div>';
 $('again').onclick=()=>start(g.d,g.l,g.practice);$('home').onclick=()=>{play.hidden=true;hub.hidden=false;hub.style.display='flex';renderHub();scrollTo(0,0);};}
if(window.initVillage3D)initVillage3D({courses:COURSES,adv:ADV,locked:c=>lockedBy(c).length>0,talk:openTalk,tier:tierOf,TIER,busy:()=>!talk.hidden||hub.hidden});else build2D();
renderHub();
</script>
</body>
</html>
