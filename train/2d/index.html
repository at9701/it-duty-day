{id:'db',ic:'🗄️',col:'#f0e6fa',name:'資料庫',desc:'SQL 基礎、交易、索引、備份和安全',ranks:['資料庫見習','資料管理員','DBA'],lv:[[
 {t:"資料表設計",q:'關於主鍵（Primary Key），哪一個敘述正確？',a:['值必須唯一，而且不能是 NULL','值可以重複，但不能是 NULL','值必須唯一，但可以是 NULL','同一張表可以設定很多個主鍵'],why:'主鍵用來唯一識別每一筆資料。一張表只有一個主鍵（可以由多個欄位組成）。'},
 {t:"SQL 查詢",q:'要從 members 資料表取出 age 大於 65 的資料，哪一句 SQL 正確？',a:['SELECT * FROM members WHERE age > 65;','SELECT members WHERE age > 65;','GET * FROM members IF age > 65;','FIND members HAVING age > 65;'],why:'基本語法是 SELECT 欄位 FROM 資料表 WHERE 條件。'},
 {t:"資料異動安全",q:'執行 UPDATE 或 DELETE 之前，最重要的檢查是？',a:['確認有 WHERE 條件，並先用 SELECT 看會影響幾筆','先把資料庫主機重開機','先把其他使用者全部踢下線','不需要特別檢查，萬一執行錯了再用另一句 SQL 改回來'],why:'沒有 WHERE 的 UPDATE／DELETE 會動到整張表，這是最常見的資料事故。'},
 {t:"交易",q:'交易（Transaction）的 ACID 特性中，A 代表什麼？',a:['原子性：全部成功，或全部不做','可用性：系統隨時可以使用','授權：只有授權的人可以執行','自動化：系統會自動執行'],why:'Atomicity。另外三個是一致性、隔離性、持久性。'},
 {t:"索引",q:'在欄位上建立索引（Index），效果和代價是？',a:['查詢變快，但寫入變慢，也多佔空間','寫入變快，但查詢變慢，佔用空間減少','自動把資料壓縮','自動把資料加密'],why:'索引像書的目錄：找得快，但每次新增修改都要一起維護。'},
 {t:"SQL 查詢",q:'要把兩張資料表依照關聯欄位合起來查詢，用哪一個語法？',a:['JOIN','UNION','GROUP BY','ORDER BY'],why:'JOIN 是依欄位把兩張表的資料列對起來；UNION 是把兩個查詢結果上下接起來。'},
 {t:"SQL 注入",q:'防範 SQL Injection 最有效的做法是？',a:['使用參數化查詢，不要把使用者輸入直接串成 SQL','把資料庫的錯誤訊息隱藏起來','網站改用 HTTPS 連線','把資料庫的連接埠改成別的號碼，讓外面找不到'],why:'參數化查詢讓輸入只會被當成資料，不會被當成指令執行。'},
 {t:"備份還原",q:'平常做「完整備份＋差異備份」。要還原到最新狀態，需要哪些備份？',a:['最近一次完整備份，加上最近一次差異備份','最近一次完整備份，加上之後每一次差異備份','只需要最近一次差異備份','只需要最近一次完整備份'],why:'差異備份記錄的是「上次完整備份之後的所有變動」，所以只要最新一份。每一份都要的是增量備份。'},
],[
 {t:"SQL 語法",q:"要清空一張資料表的資料，<code>DELETE</code>、<code>TRUNCATE</code>、<code>DROP</code> 哪個會連資料表本身都刪掉？",a:["DROP","DELETE","TRUNCATE","三個都會"],why:"DELETE 刪資料列（可加條件）；TRUNCATE 快速清空但表還在；DROP 是整張表連結構一起消失。"},
 {t:"資料表設計",q:"外鍵（Foreign Key）的作用是？",a:["確保這個欄位的值，在另一張表裡真的存在","讓查詢的速度變快","把欄位的內容加密起來，沒有權限的帳號就算查到資料也看不懂","限制一張表最多只能有幾筆資料"],why:"例如訂單表的客戶編號，一定要是客戶表裡有的。外鍵是用來守住資料之間的關聯。"},
 {t:"索引",q:"這個查詢在資料量很大的表上跑得很慢，name 欄位明明有索引。最可能的原因是？",code:"SELECT * FROM staff WHERE name LIKE '%明';",a:["開頭是 % 的 LIKE 用不到索引，只能整張表掃","SELECT * 的寫法是錯的","資料表的名稱取得太短了，資料庫需要花比較多時間才找得到這張表","中文字不能當查詢條件"],why:"索引像字典的部首排序，要知道開頭才查得快。<code>%</code> 放在最前面，就只能一筆一筆比。"},
 {t:"交易",q:"在交易裡執行了 UPDATE，發現改錯了，而且還沒 COMMIT。該下什麼指令？",a:["ROLLBACK","COMMIT","DROP","再下一次相反的 UPDATE 把值一筆一筆改回來，然後再 COMMIT"],why:"還沒 COMMIT 的變更，ROLLBACK 就能整個取消。所以改重要資料時，先開交易再動手。"},
 {t:"SQL 查詢",q:"這個查詢會得到什麼結果？",code:"SELECT dept, COUNT(*) FROM staff GROUP BY dept;",a:["每個部門各有幾個人","全公司總共有幾個人","每個人屬於哪一個部門","人數最多的那一個部門"],why:"<code>GROUP BY dept</code> 把資料依部門分組，<code>COUNT(*)</code> 算每一組有幾筆。"},
 {t:"備份還原",q:"資料庫每天晚上都有備份，而且排程都顯示成功。這樣夠安心了嗎？",a:["不夠，要定期實際還原一次，確認備份真的能用","夠了，排程顯示成功就代表備份檔沒有問題，需要的時候拿出來用就好","夠了，只要備份檔的大小有在增加","不夠，應該改成每小時備份一次"],why:"沒還原過的備份，只能算「希望它能用」。很多單位是出事那天才發現備份檔壞的或缺東西。"},
 {t:"權限",q:"應用程式連資料庫用的帳號，權限應該怎麼給？",a:["只給它需要的資料表和操作","直接用資料庫最高權限的管理員帳號，免得之後功能增加又要重新調整權限","每個程式都共用同一組帳號比較好管理","不用設密碼，反正在內網"],why:"程式被打穿時，攻擊者拿到的就是那個帳號的權限。權限越小，損害越小。"},
 {t:"SQL 語法",q:"要找出 email 欄位沒有填的資料，條件要怎麼寫？",a:["<code>WHERE email IS NULL</code>","<code>WHERE email = NULL</code>","<code>WHERE email = 0</code>","<code>WHERE NOT email</code>"],why:"NULL 代表「不知道」，不能用等號比，要用 <code>IS NULL</code>。用 <code>= NULL</code> 永遠查不到東西。"}
],[
 {t:"鎖定與並行",q:"兩個交易各自鎖住一筆資料，又都在等對方手上那一筆。這個狀況叫什麼？",a:["死結（Deadlock）","髒讀（Dirty Read）","資料庫當機","索引損毀"],why:"資料庫會偵測到死結，挑其中一個交易強制取消。程式要能接住這個錯誤並重試，也盡量用固定的順序存取資料。"},
 {t:"鎖定與並行",q:"有人在管理工具裡開了交易、改了資料，沒有 COMMIT 就去開會了。其他人會遇到什麼？",a:["要動到同一批資料的操作會被卡住，一直等","完全沒有影響","其他人會馬上看到他改到一半的資料，而且可以繼續接著改","資料庫會自動幫他 COMMIT"],why:"沒結束的交易會一直握著鎖。正式環境查「系統突然卡住」，常常最後找到的就是一個忘了提交的連線。"},
 {t:"查詢調校",q:"查詢很慢，想知道資料庫實際是怎麼執行它的（有沒有用到索引、掃了多少筆）。該看什麼？",a:["執行計畫（EXPLAIN）","資料表的建立日期","資料庫軟體的授權合約和報價單","伺服器的機殼溫度"],why:"執行計畫會告訴你它走哪個索引、是不是整張表掃。調校查詢的第一步是看它，不是猜。"},
 {t:"複寫與高可用",q:"資料庫已經設了即時複寫到另一台。有人說「這樣就不需要備份了」，問題在哪？",a:["誤刪或錯誤的更新會同步到另一台，兩邊一起壞","沒有問題，複寫就是即時的備份，比每天備份還要好","複寫的那一台不能讀取資料","複寫只能用在測試環境"],why:"複寫是為了主機故障時能接手。人為的錯誤、程式的 bug、勒索軟體，都會被忠實地複寫過去。"},
 {t:"備份還原",q:"想把資料庫還原到「今天下午 2 點 15 分，誤刪之前」的狀態。需要具備什麼？",a:["完整備份，加上到那個時間點為止的交易紀錄","只要有昨天晚上的完整備份就可以","只要資料庫有設定複寫，就可以直接指定任何時間點倒回去","做不到，只能還原到備份當下的時間"],why:"這叫時間點還原。先還原完整備份，再把交易紀錄重播到指定時間。所以交易紀錄的備份不能斷。"},
 {t:"索引",q:"為了讓查詢變快，在一張表上建了二十幾個索引。可能造成什麼副作用？",a:["新增、修改、刪除會變慢，也佔更多空間","查詢會全部變慢","資料會開始遺失","沒有副作用，索引越多越好，資料庫會自動挑選最適合的來用"],why:"每次寫入都要更新所有相關的索引。索引要針對實際常用的查詢建，沒在用的要清掉。"},
 {t:"查詢調校",q:"程式先查出 100 筆訂單，再用迴圈對每一筆各查一次客戶資料，總共 101 次查詢。這個問題怎麼改善？",a:["改成用 JOIN 或一次查回來","把迴圈改成跑 200 次","把資料庫伺服器的記憶體加大一倍，查詢的次數多一點也沒有關係","每次查詢之間加上延遲"],why:"這叫 N+1 查詢，資料一多就非常慢。大部分情況一個 JOIN 或一次批次查詢就能解決。"},
 {t:"資料保護",q:"開發人員想把正式資料庫整份複製到測試環境，方便測試。裡面有大量個資，應該怎麼處理？",a:["先把個資欄位遮罩或換成假資料，再放進測試環境","直接複製，測試環境在內網所以沒有關係","請開發人員簽一張保密切結書，簽完就可以整份複製過去使用","把測試環境的密碼設得跟正式環境一樣"],why:"測試環境的權限和防護通常比正式環境鬆。真實個資放進去，等於多一個管得比較差的外洩點。"}
],[
 {t:"複寫與高可用",q:"資料庫高可用叢集的兩個節點之間網路斷了，兩邊都以為對方掛了、都開始接受寫入。這個狀況叫什麼？",a:["腦裂（Split-Brain）","死結","全表掃描","冷備份"],why:"兩邊各寫各的，資料就分岔、很難合回來。所以叢集需要第三方仲裁，確保同一時間只有一邊是主要節點。"},
 {t:"複寫與高可用",q:"資料庫複寫可以選「同步」或「非同步」。同步複寫的取捨是什麼？",a:["主機故障時不會掉資料，但每次寫入要等對方確認，比較慢","速度最快，但可能會掉資料","不需要網路就可以運作","沒有任何取捨，同步複寫在速度和資料安全兩方面都比非同步來得好"],why:"同步是等備援那邊也寫好才算完成，所以零遺失但受網路延遲影響。非同步快，但故障時最後幾筆可能沒傳到。"},
 {t:"分割",q:"一張十年累積的紀錄表有幾億筆，查詢和清舊資料都很慢。哪一種設計最有幫助？",a:["依日期做分割（Partition）","把所有欄位都改成文字型別","把資料表的名稱改短一點，這樣資料庫找這張表的時候可以節省時間","每天把整張表重建一次"],why:"依日期分割後，查近期資料只掃那幾個分割；清舊資料直接卸掉整個分割，不用一筆一筆刪。"},
 {t:"連線管理",q:"尖峰時段應用程式大量出現「無法取得資料庫連線」的錯誤，資料庫本身負載卻不高。最該檢查什麼？",a:["連線池的上限，以及程式有沒有用完連線沒歸還","資料庫的磁碟空間","資料庫伺服器的時區設定是不是跟應用程式伺服器的時區完全一致","資料表的欄位數量"],why:"連線是有限的資源。程式拿了不還（連線洩漏）或池子設太小，就會出現資料庫很閒、程式卻連不上。"},
 {t:"升級",q:"要把正式資料庫升級到新的大版本。最穩當的做法是？",a:["先用正式資料的複本完整演練一次，並準備好退回的方法","挑離峰時間直接升級，有問題再上網查","先升級正式環境，確認一切都沒有問題之後，再回頭去升級測試環境","升級前不要備份，以免拖慢速度"],why:"大版本升級可能改變語法、執行計畫和相容性。演練過才知道要多久、會遇到什麼，以及退不退得回來。"},
 {t:"稽核",q:"資料庫裡有大量個資。對 DBA 這種最高權限的帳號，應該有什麼樣的控管？",a:["存取行為要留下稽核紀錄，而且紀錄要放在 DBA 改不到的地方","DBA 是可以信任的，不需要控管","不讓 DBA 登入資料庫","請 DBA 每個月自己寫一份報告，說明這個月有沒有查詢過不應該查詢的個資"],why:"權限最高的人，風險也最高。紀錄和被記錄的人分開，是職務區隔的基本原則，也保護 DBA 自己。"},
 {t:"加密",q:"資料庫啟用了透明資料加密（TDE）。它主要防的是什麼？",a:["資料檔或備份檔被整份偷走時，內容讀不出來","有權限的帳號用 SQL 查詢個資","SQL Injection 攻擊","使用者輸入錯誤的資料，或者不小心把重要的資料表整張刪除掉的情況"],why:"TDE 加密的是磁碟上的檔案。透過資料庫正常登入查詢，資料還是明文，所以它不能取代權限控管。"},
 {t:"查詢調校",q:"一個跑了好幾年的查詢，程式沒改、資料量也沒暴增，某天突然變得很慢。最該懷疑什麼？",a:["統計資訊過期或執行計畫改變了","資料庫中毒了","使用者的螢幕解析度太高，畫面需要比較長的時間才能把查詢結果顯示出來","SQL 語法過期了"],why:"資料庫依統計資訊決定怎麼執行查詢。統計不準或計畫被重新產生，同一句 SQL 可能從用索引變成整張表掃。"}
]]},
{id:'gov',ic:'📜',col:'#fbf1d9',name:'法規與治理',desc:'資安法、個資法、ISO 27001 和稽核',ranks:['法遵見習','受稽人員','治理推手'],lv:[[
 {t:"資通安全管理法",q:'《資通安全管理法》規範的對象包含哪些？',a:['公務機關和特定非公務機關','只有中央政府機關','只有金融業者','所有在國內使用電腦的個人'],why:'特定非公務機關包含關鍵基礎設施提供者、公營事業、特定財團法人，以及受政府控制的事業、團體或機構。'},
 {t:"事件通報",q:'依資通安全事件通報應變及演練辦法，知道發生資安事件後，要在多久之內通報？',a:['1 小時內','24 小時內','72 小時內','一個星期內'],why:'知悉後一小時內要完成通報，所以值班人員要知道通報的流程和窗口。'},
 {t:"個人資料保護法",q:'在《個人資料保護法》中，病歷、醫療、基因、健康檢查這類資料屬於？',a:['特種個人資料，原則上不得蒐集、處理或利用','一般個人資料，取得當事人口頭同意就可以使用','已經公開的資料','不屬於個人資料'],why:'個資法第 6 條。除非符合法定例外（例如醫療目的、當事人書面同意），否則不能用。'},
 {t:"ISO 27001",q:'ISO 27001 是什麼的標準？',a:['資訊安全管理系統（ISMS）','品質管理系統','環境管理系統','醫療器材品質管理系統'],why:'品質是 ISO 9001、環境是 ISO 14001、醫療器材是 ISO 13485。'},
 {t:"風險管理",q:'評估出一項風險之後，處理的方式有哪四種？',a:['降低、移轉、避免、接受','忽略、隱藏、刪除、否認','記錄、通報、開會、結案','加密、備份、防毒、更新'],why:'降低（加控制措施）、移轉（保險或委外）、避免（不做那件事）、接受（主管核可後承擔）。'},
 {t:"稽核",q:'稽核時被問到一項還沒有做到的要求，應該怎麼回應？',a:['如實說明現況，並提出改善計畫和預計完成時間','先回答有做，稽核結束之後再想辦法補上','當場趕快補一份文件出來','說那是其他單位負責的'],why:'稽核看的是管理是否有效。隱瞞被查到會變成更嚴重的缺失。'},
 {t:"事件通報",q:'我國的資通安全事件分成幾級？哪一級最嚴重？',a:['分成四級，第四級最嚴重','分成三級，第一級最嚴重','分成五級，第五級最嚴重','分成四級，第一級最嚴重'],why:'依機密性、完整性、可用性受影響的程度分一到四級，數字越大越嚴重。'},
 {t:"存取權限",q:'帳號和存取權限為什麼要定期清查？',a:['人員調動或離職後，常會留下不該有的權限','清查之後系統的負載降低，跑得比較快','可以節省軟體授權費用','只是為了應付稽核'],why:'沒收回的權限是內部風險和入侵後擴散的常見來源。'},
],[
 {t:"個人資料保護法",q:"依《個人資料保護法》，向當事人蒐集個資時，原則上應該告知他什麼？",a:["蒐集的目的、資料怎麼利用，以及他可以行使哪些權利","只要告知公司的名稱","不用特別告知，只要資料有妥善保管、沒有外洩，就符合法律的要求","告知系統使用的資料庫廠牌"],why:"個資法第 8 條規定了蒐集時的告知事項：機關名稱、目的、資料類別、利用的期間地區對象方式、當事人權利等。"},
 {t:"個人資料保護法",q:"公司發現保有的個資被竊取或外洩。依《個人資料保護法》，對當事人應該怎麼做？",a:["查明後，以適當方式通知當事人","只要內部檢討改善，為了避免引起恐慌，不需要讓當事人知道這件事","等當事人自己來問再回答","在公司內部公告就可以"],why:"個資法第 12 條：個資被竊取、洩漏、竄改或其他侵害時，應查明後以適當方式通知當事人。"},
 {t:"個人資料保護法",q:"當事人依《個人資料保護法》可以要求查詢、更正、刪除自己的個資。公司可以在契約裡寫「當事人同意放棄這些權利」嗎？",a:["不行，這些權利不能預先拋棄，也不能用特約限制","可以，只要當事人有親筆簽名同意，雙方你情我願，契約就有效力","可以，但要給當事人折扣","只有政府機關不行，民間公司可以"],why:"個資法第 3 條：查詢閱覽、製給複本、補充更正、停止蒐集處理利用、刪除，這五項權利不得預先拋棄或以特約限制。"},
 {t:"刑法與授權",q:"你發現別家公司的網站好像有漏洞，想「幫他們測試一下」。沒有對方授權就動手，會有什麼問題？",a:["可能觸犯刑法的妨害電腦使用罪","沒有問題，只要是出於善意，而且事後有把發現的漏洞告訴對方就可以","只要沒有成功入侵就沒事","只有造成對方金錢損失才有問題"],why:"刑法第 358 條以下：無故入侵他人電腦、取得或變更電磁紀錄、干擾系統都有刑責。測試一定要先拿到書面授權。"},
 {t:"職業倫理",q:"你是系統管理員，技術上看得到所有人的信件和檔案。同事之間有八卦，你很好奇。可以去看嗎？",a:["不行，權限只能用在業務需要的範圍","可以，管理員本來就有這個權限，系統也沒有擋，代表公司允許","看一下沒關係，不要講出去就好","可以，但要先備份"],why:"「做得到」和「可以做」是兩回事。超出業務目的去看別人的資料，是職業倫理問題，也可能有法律責任。"},
 {t:"ISO 27001",q:"ISO 27001:2022 的附錄 A，控制措施有幾項、分成哪幾類？",a:["93 項，分成組織、人員、實體、技術四類","114 項，分成 14 個領域","10 項，分成高、中、低三類","沒有固定的數量，由各家驗證公司依照受稽單位的規模和產業自行決定"],why:"2022 年版把舊版的 114 項、14 個領域，整併成 93 項、四大主題：組織、人員、實體、技術。"},
 {t:"資通安全管理法",q:"我國《資通安全管理法》體系下，機關的「資通安全責任等級」分成哪幾級？哪一級要求最高？",a:["A 到 E 五級，A 級最高","1 到 4 四級，4 級最高","甲、乙、丙三級，甲級最高","只分成公務機關和非公務機關兩種，兩種的要求完全相同"],why:"責任等級分 A、B、C、D、E，A 級要求最多。這和「資安事件」的 1 到 4 級是兩件不同的事，不要搞混。"},
 {t:"委外管理",q:"系統委外給廠商維護，結果廠商那邊出了資安事件。委外的機關有責任嗎？",a:["有，機關對委外廠商負有監督責任","沒有，合約已經簽了，系統交給廠商維護，出事就完全是廠商的責任","要看廠商的規模","只有機關自己的人員也犯錯才有"],why:"工作可以委外，責任不能委外。資通安全管理法也要求機關選任適當的受託者，並監督它的資安維護情形。"}
],[
 {t:"事件通報",q:"依我國《資通安全事件通報應變及演練辦法》，第三級或第四級的資安事件，應該在知悉後多久內完成損害控制或復原？",a:["36 小時","72 小時","7 天","沒有時限的規定，由各機關依照事件的複雜程度自行決定"],why:"第一、二級是 72 小時內，第三、四級比較嚴重，要在 36 小時內完成損害控制或復原作業。"},
 {t:"風險管理",q:"風險評鑑之後，採取控制措施還是會剩下一些風險，叫「殘餘風險」。它應該怎麼處理？",a:["由管理階層確認並決定是否接受","由承辦人自己判斷，不需要讓主管知道","不需要處理，做了控制措施就代表風險已經歸零","一律買保險"],why:"風險不可能降到零。剩下的要讓有權責的人知道、決定接不接受並留下紀錄，這是風險管理的核心。"},
 {t:"ISO 27001",q:"ISO 27001 要求的「適用性聲明」（SoA）是什麼文件？",a:["列出附錄 A 每一項控制措施是否採用，以及採用或排除的理由","員工簽署的保密切結書","公司向驗證機構聲明自己完全沒有任何資安風險、也不會發生資安事件的保證文件","防火牆規則的清單"],why:"SoA 把風險處理的結果對應到控制措施：哪些有做、哪些不適用、為什麼。稽核員會拿它對照實際狀況。"},
 {t:"稽核",q:"安排內部稽核時，為什麼不能讓人稽核自己負責的業務？",a:["稽核需要獨立性，自己查自己很難客觀","因為稽核員的職等一定要比受稽人員高","這只是慣例，實務上自己稽核自己最有效率，因為最了解狀況","因為這樣稽核的時間會太短"],why:"自己做的事，自己最難看出問題，也有利益衝突。ISO 27001 要求稽核員的選任要確保客觀和公正。"},
 {t:"個人資料保護法",q:"公司把含有個資的系統委託廠商處理，結果廠商那邊發生外洩。依《個人資料保護法》，責任怎麼算？",a:["委託的公司仍要負責，受託廠商在法律上視同委託機關","全部由廠商負責，委託的公司沒有責任","只要合約有寫免責條款，委託的公司就完全不需要負任何責任","雙方都沒有責任，由當事人自行負擔"],why:"個資法第 4 條：受委託蒐集、處理或利用個資的人，在本法適用範圍內視同委託機關。施行細則也要求委託方要監督。"},
 {t:"營運持續",q:"營運持續計畫裡的 RTO 和 RPO，分別代表什麼？",a:["RTO 是多久內要恢復服務，RPO 是最多能接受遺失多久的資料","RTO 是備份的次數，RPO 是還原的次數","兩個是一樣的意思","RTO 是每年資訊預算可以動用的上限，RPO 則是每年資安人力編制的人數上限"],why:"RPO 決定備份要多頻繁（能丟一小時的資料，就至少每小時備份），RTO 決定備援要做到什麼程度。"},
 {t:"稽核",q:"稽核開出一項「不符合」：某台伺服器的帳號沒有定期清查。只把那台伺服器清查完，算是完成矯正嗎？",a:["不算，要找出為什麼會漏掉，並確認其他伺服器有沒有同樣的問題","算，稽核員指出的那一台處理好就可以結案","算，只要在期限內回覆","不算，應該把那台伺服器直接下線報廢，這樣帳號沒清查的問題就徹底不存在了"],why:"只修被抓到的那一筆叫「改正」。矯正措施要處理原因，例如清查流程沒涵蓋到新建的主機，否則下次還會再發生。"},
 {t:"職業倫理",q:"你負責一項採購的規格評估，其中一家投標廠商想請你吃飯、送你禮品。該怎麼處理？",a:["婉拒，並依公司規定向主管報備","收下來，但評估的時候保持公正就好","先收下，等採購案結束之後再還給對方，這樣就不算有影響到評估","只吃飯、不收禮品就沒有關係"],why:"就算你自認不受影響，別人也無從相信。利益衝突要迴避、要揭露，這是保護採購案，也是保護你自己。"}
],[
 {t:"資通安全管理法",q:"依《資通安全管理法》，特定非公務機關應該訂定並實施什麼？",a:["資通安全維護計畫","年度員工旅遊計畫","只要有購買防毒軟體就符合規定，不需要另外再訂定任何的計畫或文件","資訊設備採購計畫"],why:"公務機關和特定非公務機關都要訂定、修正及實施資通安全維護計畫，並依規定提出實施情形。"},
 {t:"資通安全管理法",q:"依資通安全責任等級的要求，A 級和 B 級機關的核心資通系統，在資訊安全管理系統（ISMS）方面要做到什麼？",a:["導入 CNS 27001 或 ISO 27001，並通過公正第三方驗證","只要內部自己宣告符合即可","不需要導入管理系統","每五年請原廠工程師到場檢查一次硬體設備，並且出具設備運作正常的證明文件"],why:"A、B 級除了導入，還要通過第三方驗證並持續維持有效；C 級要導入但不強制驗證。"},
 {t:"個人資料保護法",q:"依《個人資料保護法》，個資外洩的被害人不易證明實際損害金額時，可以請求法院依情節酌定賠償。每人每一事件的範圍是？",a:["新臺幣 500 元以上、2 萬元以下","固定新臺幣 100 元","沒有規定，由公司自行決定","新臺幣 100 萬元以上，而且每一位被害人都可以請求相同的最高金額"],why:"個資法第 28 條。單看一人金額不大，但外洩常是幾萬、幾十萬筆，乘起來就很可觀。"},
 {t:"治理架構",q:"風險管理常講「三道防線」。第三道防線是誰？",a:["內部稽核","第一線的作業人員","防火牆","負責訂定政策並監督執行情形的風險管理單位以及法令遵循單位"],why:"第一道是業務和資訊單位自己做好控制，第二道是風險管理和法遵的監督，第三道是獨立的內部稽核。"},
 {t:"資通安全管理法",q:"我國規定資通系統要做「防護需求分級」。分成哪幾級？",a:["普、中、高三級","A、B、C、D、E 五級","1 到 4 四級","不分級，所有的資通系統不論重要性高低，一律都適用完全相同的防護基準"],why:"依機密性、完整性、可用性、法律遵循性評估，分成普、中、高，再對應不同強度的防護基準。責任等級 A 到 E 是指機關，不是系統。"},
 {t:"文件管理",q:"資安管理的文件通常分四階。由上到下的順序是？",a:["政策、程序、作業說明、紀錄","紀錄、作業說明、程序、政策","四階之間沒有上下關係","合約、發票、收據、保固書，這四種是稽核的時候一定會被要求出示的文件"],why:"政策講方向，程序講誰在什麼時候做什麼，作業說明講怎麼做，紀錄證明真的有做。稽核會一路對下去。"},
 {t:"法規遵循",q:"法規和主管機關的要求一直在變。組織要確保自己持續符合，最基本的機制是？",a:["指定權責單位定期鑑別適用的法規，並評估對內部規定的影響","等主管機關來稽核時再確認","每五年檢視一次","由每一位員工自己留意新聞，看到跟工作有關的法規修正再自己調整做法"],why:"ISO 27001 也要求鑑別法律和契約上的要求。沒有人負責追，就會出現內部規定還在引用舊條文的狀況。"},
 {t:"職業倫理",q:"你知道發生了依法應該通報的資安事件，但直屬主管要你「先不要報」。比較適當的做法是？",a:["依內部的正式管道，向資安專責人員或更高層級反映","照主管說的做，責任就在主管身上","自己私下向媒體爆料","當作自己完全不知道這件事，之後如果有人問起來，就說當時沒有接到任何通知"],why:"法定的通報義務不會因為有人不想報就消失。先走內部的正式管道，並保留自己反映過的紀錄。"}
]]},
{id:'code',lv:[[
 {t:"自動化",q:'每天早上都要手動把同一份報表複製到另一個資料夾。比較好的做法是？',a:['寫成腳本，交給排程每天自動跑','請同事輪流做，這樣比較不會有人忘記','繼續手動做，做久了自然就會越來越快','買一套更貴的軟體來做'],why:'重複、固定、有規則的事最適合自動化：省時間，也不會因為人忘記而漏掉。'},
 {t:"程式基礎",q:'這段 Python 會印出什麼？',code:'for i in range(3):\n    print(i)',a:['0、1、2 各一行','1、2、3 各一行','只印一個 3','印三次 i 這個字'],why:'<code>range(3)</code> 是從 0 開始數三個數：0、1、2。很多語言都是從 0 開始算。'},
 {t:"除錯",q:'腳本跑到一半出錯，畫面噴了一大串錯誤訊息。先看哪裡？',a:['最後幾行：錯誤的種類，還有是哪個檔案的第幾行','不用看，整段複製起來直接重跑一次，通常第二次就會過','只看第一行就好','把訊息清掉，免得被別人看到'],why:'大部分語言的錯誤訊息，最關鍵的錯誤種類和行號都在最後面。'},
 {t:"測試環境",q:'寫好一支會改資料的腳本，第一次執行應該在哪裡跑？',a:['測試環境，或先拿一份複本來跑','直接在正式環境跑，有問題再說','找離峰時間在正式環境跑就很安全了，因為那時候沒有人在用','在主管的電腦上跑'],why:'會改資料的東西先在不怕壞的地方試。離峰只是影響的人少，資料壞了一樣是壞了。'},
 {t:"版本控制",q:'版本控制（例如 Git）最主要是幫你做什麼？',a:['記錄每一次改了什麼、誰改的，改壞了可以退回去','讓程式執行的速度變快','自動幫你把程式裡的錯誤修好','把程式碼加密，讓別人沒有辦法看到內容'],why:'版本控制記的是「變更的歷史」。出事時能知道是哪一次改動造成的，也能退回上一版。'},
 {t:"密碼與金鑰",q:'腳本需要連資料庫，帳號密碼要怎麼處理？',a:['不要寫死在程式裡，放在權限管好的設定檔或密碼管理工具','直接寫在腳本最上面，這樣之後要改密碼的時候最好找','寫在註解裡提醒自己','用檔名來記'],why:'密碼寫死在程式裡，程式傳到哪、密碼就外流到哪。分開放，並且把那個檔案的權限管好。'},
 {t:"腳本安全",q:'這行指令如果 <code>DIR</code> 這個變數剛好是空的，會發生什麼事？',code:'rm -rf "$DIR"/*',a:['變成 rm -rf /*，從根目錄開始刪','什麼事都不會發生，因為沒有指定目錄','系統會跳出確認視窗問你要不要刪','只會刪掉目前所在的這個目錄，其他地方的檔案都不受影響'],why:'變數是空的，路徑就變成 <code>/*</code>。動到刪除的腳本，執行前一定要先檢查變數有沒有值。'},
 {t:"程式基礎",q:'程式裡的 <code>if</code> 是用來做什麼的？',a:['依條件決定要不要執行某段程式','把同一段程式重複執行很多次','宣告一個新的變數來存放資料','結束整支程式'],why:'<code>if</code> 是條件判斷。重複執行是迴圈（<code>for</code>、<code>while</code>）的工作。'}
],[
 {t:"程式基礎",q:"把一段常用的程式包成「函式」，最主要的好處是？",a:["可以重複使用，要改的時候只要改一個地方","程式執行的速度會變快很多","包成函式之後別人就看不到裡面的內容，可以保護自己寫的程式不被抄走","檔案會變小"],why:"同樣的邏輯到處複製貼上，之後要改就得改很多處、還會漏。包成函式只維護一份。"},
 {t:"程式基礎",q:"這段 Python 會印出什麼？",code:"a = [10, 20, 30]\nprint(a[1])",a:["20","10","30","會出錯"],why:"串列的位置從 0 開始算，<code>a[0]</code> 是 10，<code>a[1]</code> 是 20。"},
 {t:"資料格式",q:"JSON 是什麼？",a:["一種用文字表示資料的格式，常用在系統之間交換資料","一種程式語言","微軟推出的一套資料庫管理軟體，主要用來儲存大量的結構化資料","一種加密的方法"],why:"JSON 用大括號、中括號和「名稱：值」來表示資料，人看得懂、程式也好處理，API 幾乎都用它。"},
 {t:"API",q:"「API」是用來做什麼的？",a:["讓程式和程式之間，用約定好的方式互相要資料或下指令","讓使用者用滑鼠點選操作的畫面","用來測試網路速度的工具","一種專門用來掃描電腦病毒並且自動把受感染檔案隔離起來的防護軟體"],why:"API 是給程式用的窗口：照規定的格式送出請求，就會拿到約定好的回應。"},
 {t:"錯誤處理",q:"程式裡的 <code>try</code>／<code>except</code>（其他語言叫 try／catch）是用來做什麼的？",a:["出錯的時候接住它，自己決定要怎麼處理","讓程式重複執行","讓這一段程式執行得比較快，因為系統會優先處理包在裡面的指令","把變數的值清空"],why:"沒接住的錯誤會讓整支程式直接中斷。接住之後可以記 log、重試，或給使用者看得懂的訊息。"},
 {t:"日誌",q:"排程自動執行的腳本，為什麼應該把執行過程寫成 log？",a:["沒人在看畫面，出事時要靠紀錄才知道做到哪、錯在哪","這樣腳本會跑得比較快","因為沒有寫 log 的腳本，作業系統的排程功能會拒絕執行它","可以讓檔案看起來比較專業"],why:"半夜自己跑的東西，隔天有問題只能靠 log。至少要記開始、結束、處理了幾筆、錯誤訊息。"},
 {t:"版本控制",q:"多人一起改同一份程式，用 Git 時比較好的做法是？",a:["各自開分支修改，測試沒問題再合併回主線","大家都直接改主線，誰先改完就誰先上傳，有衝突的時候再說","每個人各自複製一份資料夾來改","用通訊軟體把檔案傳來傳去"],why:"分支讓每個人的修改互不干擾，合併前還可以先讓別人看過。主線就能一直保持在可以用的狀態。"},
 {t:"程式基礎",q:"指令或腳本執行完的「結束代碼」（exit code）是 0，代表什麼？",a:["執行成功","執行失敗","沒有任何輸出","被使用者中斷"],why:"慣例上 0 是成功，其他數字代表各種錯誤。排程和自動化工具就是靠它判斷上一步有沒有成功。"}
],[
 {t:"自動化",q:"一支自動化腳本「跑一次和跑很多次，結果都一樣」，這個特性叫冪等。為什麼它很重要？",a:["腳本中途失敗時可以放心重跑，不會重複建立或出錯","腳本的執行速度會變快","這樣腳本就不需要寫任何錯誤處理，因為它保證永遠不會失敗","可以讓腳本佔用比較少的硬碟空間"],why:"排程重複觸發、執行到一半斷線都很常見。能安全重跑的腳本，出事時只要「再跑一次」就好。"},
 {t:"輸入驗證",q:"這段程式把使用者輸入的主機名稱直接組進指令。有什麼問題？",code:"os.system(\"ping -c 1 \" + host)",a:["使用者可以在輸入裡夾帶其他指令，讓系統執行","ping 指令的參數寫錯了","沒有問題，這是很常見的寫法","這樣寫只能在 Windows 上執行，換到 Linux 就會出現錯誤"],why:"輸入 <code>8.8.8.8; rm -rf /</code> 就會多執行一個指令。外部輸入一律要驗證，並改用不經過 shell 的呼叫方式。"},
 {t:"密碼與金鑰",q:"你不小心把 API 金鑰 commit 並 push 到 Git 了。第一件事該做什麼？",a:["馬上把那把金鑰作廢，換一把新的","再 commit 一次把那一行刪掉就好","把儲存庫改成私人的，這樣外面的人就再也看不到那把金鑰了","等看看有沒有人發現"],why:"推上去的那一刻就要當作已經外洩。刪掉那行沒有用，歷史紀錄裡還在，而且可能早就被掃走了。"},
 {t:"CI/CD",q:"CI/CD 的目的是什麼？",a:["程式一有變更就自動建置、測試、部署，減少人工出錯","讓程式碼自動加密，沒有經過授權的人就沒有辦法閱讀內容","取代版本控制","讓工程師不需要寫測試"],why:"手動部署的步驟多，容易漏。自動化之後每次都照同一套流程走，出問題也能很快知道是哪次變更。"},
 {t:"相依套件",q:"專案用了很多第三方套件。為什麼要把每個套件的版本固定下來（lock 檔）？",a:["確保每個人、每個環境裝到的都是同一個版本","固定版本之後套件就不會有任何安全漏洞","這樣安裝的速度比較快","因為沒有固定版本的套件依照授權條款是不可以用在公司專案裡的"],why:"沒鎖版本，今天裝和下個月裝的可能不同，「昨天還好好的」就是這樣來的。固定之後，升級是有意識的決定。"},
 {t:"錯誤處理",q:"程式要呼叫外部的 API。為什麼一定要設定逾時（timeout）？",a:["對方沒回應時，程式才不會一直卡在那裡等","設了逾時對方的回應會比較快","這樣可以省下網路流量的費用，因為超過時間的部分不會計費","逾時是 API 金鑰的有效期限"],why:"很多函式庫預設會無限等下去。對方一卡，你的程式跟著卡，連帶拖垮整個服務。"},
 {t:"程式碼審查",q:"程式碼審查（Code Review）最主要的價值是什麼？",a:["上線前多一雙眼睛找問題，也讓團隊知道彼此改了什麼","讓主管有機會挑出每個人寫程式的毛病，並且當作年度考核扣分的依據","證明寫程式的人很厲害","拖慢上線的速度，避免變更太頻繁"],why:"自己很難看出自己的盲點。審查同時也是知識分享，不會變成只有一個人懂那段程式。"},
 {t:"執行環境",q:"「在我的電腦上明明可以跑」，但放到伺服器就出錯。要從根本避免這種事，最有效的方向是？",a:["讓開發、測試、正式環境盡量一致，例如用容器","規定所有人都要用同一個品牌的筆電","直接把開發人員的那台電腦搬進機房，接上網路當作正式的伺服器","出錯的時候多重試幾次"],why:"環境不一樣（版本、設定、套件）是這類問題的根源。容器把執行環境一起打包，到哪裡跑都一樣。"}
],[
 {t:"技術債",q:"「技術債」指的是什麼？",a:["為了趕時間選了省事的做法，之後要花更多力氣維護或修改","公司買軟體還沒付清的款項","程式設計師積欠公司的加班時數，需要在專案結束之後補回來","使用太新的技術造成的風險"],why:"技術債像借錢：現在快一點，之後每次改都要付利息。可以借，但要知道自己借了、有計畫地還。"},
 {t:"部署策略",q:"「金絲雀釋出」（Canary Release）是怎麼做的？",a:["新版本先只給一小部分使用者，確認沒問題再逐步擴大","新舊版本同時全面上線，讓使用者自己選","先在開發人員自己的電腦上執行一個星期，沒有問題再一次全面開放","只在半夜釋出新版本"],why:"先讓 5% 的流量走新版，觀察錯誤率和效能。有問題只影響少數人，而且可以馬上切回去。"},
 {t:"部署策略",q:"「功能開關」（Feature Flag）的好處是什麼？",a:["程式可以先上線，功能用設定決定開或關，出問題不必重新部署就能關掉","可以讓程式的檔案變小","使用者可以自己決定要不要付費","讓程式碼不需要經過測試就可以直接上線，因為有問題的話反正隨時都可以關掉"],why:"把「部署程式」和「開放功能」分開。新功能出事時，關掉開關只要幾秒，不用緊急退版。"},
 {t:"可觀測性",q:"系統「可觀測性」常說的三種資料是？",a:["紀錄（Log）、指標（Metric）、追蹤（Trace）","帳號、密碼、權限","開發環境、測試環境、正式環境這三套彼此完全獨立的系統","CPU、記憶體、硬碟"],why:"指標告訴你「有問題」，追蹤告訴你「卡在哪一段」，紀錄告訴你「當時發生什麼」。三個一起才看得清楚。"},
 {t:"相依套件",q:"某個常用的開源套件爆出重大漏洞。要快速回答「我們有沒有受影響」，前提是什麼？",a:["平常就有清單記錄每個系統用了哪些套件和版本","請每個開發人員回想自己用過哪些套件","等廠商主動通知","把所有系統全部重新安裝一次，這樣就可以確定用到的套件都是最新的版本"],why:"這份清單叫 SBOM（軟體物料清單）。沒有它，漏洞一公布就只能一個一個系統去翻，慢好幾天。"},
 {t:"基礎設施即程式碼",q:"「基礎設施即程式碼」（IaC）指的是什麼？",a:["用程式碼描述伺服器、網路這些環境，由工具自動建立","把程式碼印出來放在機房","所有的基礎設施都由程式設計師負責採購和上架，不再需要系統和網路人員","用程式語言寫作業系統"],why:"環境寫成檔案後可以進版本控制、審查、重複建立。重建一套一模一樣的環境，從幾天變成幾分鐘。"},
 {t:"密碼與金鑰",q:"很多系統都需要資料庫密碼和 API 金鑰。比起寫在各自的設定檔裡，更好的做法是？",a:["集中放在密鑰管理系統，程式執行時才去取","統一寫在一個共用的文字檔","把所有系統的密碼都設成同一組，這樣要更換的時候只需要記得改一個地方","寫在程式碼裡並加上註解"],why:"集中管理才能控管誰能取、留下紀錄、定期自動更換。散在各處的設定檔，換一次密碼要改幾十個地方。"},
 {t:"API",q:"要修改一支已經有很多系統在呼叫的 API。最該避免的是什麼？",a:["直接改掉原本的欄位或行為，讓既有的呼叫端壞掉","新增一個版本","先通知使用這支 API 的單位","在文件上寫清楚新版和舊版之間的差異，並且提供一段時間讓呼叫端轉換"],why:"API 是對別人的承諾。要改就出新版本、舊版保留一段時間並公告，不能讓別人的系統莫名其妙壞掉。"}
]]},
{id:'svc',lv:[[
 {t:"問診",q:'使用者打來只說「電腦怪怪的」。你應該先問什麼？',a:['什麼時候開始、做什麼動作時出現、畫面上寫什麼','你的電腦是哪一年買的、當初是跟哪一家廠商買的','你有沒有亂裝東西','先不問，直接遠端進去看'],why:'先把「怪」變成具體的現象：時間、動作、訊息。這三樣問到，方向通常就出來了。'},
 {t:"進度回報",q:'問題一時解決不了，還要再查。這時候該跟使用者說什麼？',a:['現在查到哪、接下來要做什麼、大概什麼時候會回覆','跟他說這個問題很複雜，請他耐心等，有結果一定會通知','先不講，等修好再一次說明','請他自己先上網查查看'],why:'使用者最怕的是「不知道現在怎樣」。講清楚現況、下一步、回覆時間，他才有辦法安排自己的工作。'},
 {t:"交接",q:'下班前手上有一件沒處理完的案子要交接。交接內容最重要的是？',a:['已經做了什麼、目前狀態、還沒做的、要找誰','只要寫案件編號，接手的人自己去翻紀錄就看得懂了','口頭講一下就好','把使用者的電話留給下一班'],why:'交接是讓下一個人不用從頭來。做過的、現況、待辦、聯絡人，四樣缺一樣就會重工或漏接。'},
 {t:"向上報告",q:'要跟不懂技術的主管報告一件系統異常。怎麼講最好？',a:['先講影響到誰、現在怎麼處理、需要他決定什麼','從技術原因開始完整說明，把每個細節都交代清楚，這樣才顯得專業','盡量多用專有名詞','等他問了再回答'],why:'主管要的是「影響」和「需要我做什麼」。技術細節他有興趣再補。'},
 {t:"情緒處理",q:'使用者很生氣，一接起來就開始罵。比較好的第一步是？',a:['先聽完，再把他的問題重述一次確認','馬上打斷他，跟他解釋這不是資訊部門的問題','請他冷靜一點再打來','直接把電話轉給主管處理，這種情況不是第一線該面對的'],why:'人在氣頭上聽不進解釋。先讓他講完、確認你有聽懂，後面才談得下去。'},
 {t:"結案確認",q:'你處理完了，覺得應該修好了。結案之前還要做什麼？',a:['請使用者實際操作一次，確認真的可以用','直接結案就好，如果還有問題使用者自己會再打電話進來報修','拍照留存當作證明','重開機三次確保穩定'],why:'你覺得好了不算，使用者能做完他要做的事才算。當場確認，省掉第二次報修。'},
 {t:"誠實回覆",q:'使用者問了一個你不確定答案的問題。該怎麼回？',a:['「這個我確認一下再回覆你」，然後真的回覆','憑印象先給一個聽起來合理的答案，免得讓對方覺得你不專業','跟他說這不歸你管','請他去問別人'],why:'不確定就說不確定。猜錯的代價比晚一點回答大很多，尤其對方會照你說的去做。'},
 {t:"通報",q:'你發現一個可能影響很多人的異常，但還沒查出原因。什麼時候該通報主管？',a:['現在就先通報，邊查邊更新','等查出原因之後再報，資訊不完整的時候報上去只會被問倒','等修好再一起報告','等有使用者來抱怨的時候再通報，這樣才能確認真的有影響'],why:'影響範圍大的事，通報要比查原因早。主管需要時間調人、對外說明，不能最後一個知道。'}
],[
 {t:"維護公告",q:"週末要停機維護一個大家都在用的系統。事前公告至少要寫清楚什麼？",a:["停機的時間、影響範圍、有問題找誰","這次維護會用到的技術細節和詳細的操作步驟，讓大家知道我們在做什麼","負責維護的工程師名單","系統的版本編號"],why:"使用者只關心：什麼時候不能用、影響到我什麼、出事找誰。其他的他們不需要。"},
 {t:"權限與流程",q:"一位主管打來，要你直接把某位同事的信箱開給他看。該怎麼處理？",a:["請他走正式的申請流程，核准後再處理","他是主管，照做就對了","偷偷開給他看，但是提醒他不要跟別人說是資訊單位幫忙開的","直接拒絕，然後掛電話"],why:"你有技術上的權限，不代表可以決定誰能看誰的資料。有申請和核准的紀錄，是保護當事人，也保護你自己。"},
 {t:"書面溝通",q:"要寫一封給全體同仁的通知信。最重要的內容應該放在哪？",a:["主旨和第一段","最後一段","信的中間，前面要先把事情的背景和來龍去脈完整交代清楚，大家才看得懂","附件裡"],why:"大部分的人只看主旨和前兩行。要他們做什麼、期限是哪天，一開頭就講。"},
 {t:"知識文件",q:"同一個問題，這個月已經有第三個人來問了。比較好的做法是？",a:["寫成說明文件或常見問題，放在大家找得到的地方","每一次都很有耐心地從頭再講解一遍，這是資訊人員應該提供的服務","跟主管反應使用者素質太差","請他們去問上一個問過的人"],why:"一直被問同一件事，代表缺一份說明。寫一次，之後貼連結就好，新同事也用得到。"},
 {t:"廠商溝通",q:"你回報問題給廠商，廠商回：「我們這邊測試都正常」。接下來最有效的做法是？",a:["提供具體的證據：發生時間、錯誤訊息、你做過的測試","把同樣的內容再寄一次，並且把雙方的主管都加進收件人，讓對方有壓力","算了，自己想辦法","打電話去罵"],why:"「不能用」對方沒辦法查。給時間點、畫面、log，對方才能對到自己的紀錄，也比較難再推回來。"},
 {t:"優先順序",q:"同時進來三件事：一個人的印表機印不出來、一個部門的系統全部不能用、一個人想換新滑鼠。先處理哪一件？",a:["整個部門不能用的那件","最早進來的那件","聲音最大、催得最兇的那個人，先把他處理掉後面才能安心做事","最簡單的那件"],why:"排順序看的是影響範圍和急迫性：很多人的工作停擺，優先於單一個人的不方便。"},
 {t:"錯誤處理",q:"你不小心刪掉了使用者的一個資料夾。第一件事該做什麼？",a:["馬上讓主管和使用者知道，同時開始想辦法救","先自己偷偷試著救，救得回來就當作沒發生過，救不回來再說","跟使用者說是系統自己出問題","等使用者自己發現"],why:"越早講，能救的機會越大（備份還在、資料還沒被覆蓋）。隱瞞之後被發現，失去的是信任。"},
 {t:"進度回報",q:"你答應使用者今天下班前回覆，但到了下午發現來不及。該怎麼做？",a:["在期限之前主動告訴他現在的進度，和新的預計時間","先不講，明天早上處理好了再一起跟他說，反正只差幾個小時而已","等他打來問再說明","隨便先給一個答案交差"],why:"時間到了沒消息，比「還沒好」更讓人不滿。主動更新，對方才能調整自己的安排。"}
],[
 {t:"服務水準",q:"SLA（服務水準協議）是在約定什麼？",a:["服務要達到的具體標準，例如可用率、多久內回應和修復","資訊人員每天的上下班時間","採購軟體時的價格上限和付款方式，以及保固年限的計算基準","使用者不可以抱怨的事項"],why:"SLA 把「服務好不好」變成可以量的數字。雙方對「多快算快」有共識，才不會各說各話。"},
 {t:"變更管理",q:"提出變更申請時，為什麼一定要寫「回復計畫」？",a:["變更失敗時，知道怎麼在時限內退回原狀","只是表單的必填欄位，內容寫什麼都沒有關係","讓審核的人覺得你有想很多","回復計畫是給稽核人員看的文件，實際執行變更的時候並不會用到"],why:"沒有回復計畫的變更，失敗了只能硬著頭皮往前修。先想好怎麼退、退要多久、誰決定退。"},
 {t:"進度回報",q:"重大異常處理中，已經半小時沒有新進展。對外的溝通應該怎麼做？",a:["照固定的頻率更新，沒有進展也說明目前在做什麼","沒有新消息就先不要講，免得被追問","等完全修好再一次說明","跟使用者說快好了，雖然其實還不確定，但這樣可以先安撫大家的情緒"],why:"沒消息會被解讀成沒人在處理。固定更新讓對方能安排自己的事，也不會一直打電話進來問。"},
 {t:"權限與流程",q:"熟識的同事私下傳訊息請你幫忙處理問題，沒有走報修流程。比較好的做法是？",a:["可以幫，但要補上報修紀錄，並請他下次走正式流程","一律拒絕，沒有開單就不處理，不管事情有多緊急都一樣","幫他處理，不用留紀錄","跟他說你很忙，請他找別人"],why:"沒有紀錄的工作，別人不知道、主管看不到、之後出事也查不到。幫忙和留紀錄並不衝突。"},
 {t:"需求釐清",q:"使用者說：「幫我在系統上加一個匯出的按鈕。」比較好的回應是？",a:["先問他匯出來要做什麼，了解真正想解決的問題","照他說的加一個按鈕","跟他說系統不能改","請他寫一份完整的規格書，包含畫面設計和資料庫欄位，寫好再來談"],why:"使用者講的是他想到的解法，不一定是最好的。問到目的，有時現有的功能就能解決，有時需要的根本是另一樣東西。"},
 {t:"跨單位協作",q:"系統單位說是網路的問題，網路單位說是系統的問題，使用者夾在中間。你是其中一方，該怎麼做？",a:["主動找對方一起看現象，用測試結果確認是哪一段","堅持不是我方的問題，請使用者自己去找對方","把案子退回去，等對方先證明","請使用者自己判斷是哪邊的問題，再決定要找哪一個單位處理"],why:"讓使用者當傳話筒是最糟的。兩邊坐下來一起測，通常十分鐘就分出來，比互踢三天快。"},
 {t:"風險溝通",q:"主管要求你開一個有資安風險的例外（例如把某台主機直接對外開放）。你應該怎麼回應？",a:["說明風險和替代方案，若仍要執行就請有權責的人正式核准","他是主管，直接照做","直接拒絕，不需要說明原因","先答應下來，但是實際上不去做，等他哪一天自己忘記這件事"],why:"你的責任是把風險講清楚、提出比較安全的做法。要不要承擔風險，是有權責的人來決定並留下紀錄。"},
 {t:"知識文件",q:"某個系統只有一位同事會維護，他請長假時出了問題沒人會處理。要怎麼預防？",a:["把做法寫成文件，並安排其他人輪流實際操作","規定那位同事不可以請假","請他把手機 24 小時開著，休假的時候也一樣要隨時接電話處理","等真的出事再想辦法"],why:"只有一個人會，是組織的風險，不是那個人的榮耀。文件加上實際輪替操作，知識才真的傳得出去。"}
],[
 {t:"績效指標",q:"主管只用「每人每月結案數」考核維護人員。最可能出現什麼副作用？",a:["大家挑簡單的案子做、草率結案，難的問題沒人碰","所有人的技術能力都會快速提升","使用者的滿意度一定會跟著上升","完全不會有副作用，因為數字是最客觀的，結案數越多就代表服務做得越好"],why:"量什麼就得到什麼。只看數量，品質就被犧牲。要搭配重複報修率、滿意度這類指標一起看。"},
 {t:"問題管理",q:"同一種故障每個月都發生好幾次，每次都能很快修好。接下來該做的是？",a:["當成一個「問題」立案，找出根本原因讓它不再發生","維持現狀，反正每次都修得很快","把修復的步驟寫成手冊發給使用者，請他們之後遇到的時候自己處理就好","要求使用者不要再報修"],why:"事件管理是把服務恢復，問題管理是讓它不再發生。一直修同一件事，是在浪費人力，也是在等它哪天出大事。"},
 {t:"服務目錄",q:"資訊單位整理一份「服務目錄」，主要的用途是什麼？",a:["讓使用者知道有哪些服務、怎麼申請、多久會完成","記錄每一位資訊人員的個人資料","列出公司所有電腦設備的財產編號、購買日期以及目前的保管人","取代報修系統"],why:"使用者不知道你提供什麼、該找誰，就只能亂問。服務目錄把範圍和期待講清楚，雙方都省事。"},
 {t:"向上報告",q:"要向高層爭取預算汰換老舊的核心設備。哪一種說法最有效？",a:["說明故障時會影響哪些業務、停多久、損失多少","詳細解釋新設備的技術規格比舊的好多少","強調別家公司都已經換了","表示如果公司不同意這筆預算的話，資訊單位就沒有辦法再繼續維護下去了"],why:"高層做的是風險和資源的決定。把技術問題翻譯成業務影響和金額，才是他們能判斷的語言。"},
 {t:"帶新人",q:"帶一位新人學會處理某類問題。比較有效的順序是？",a:["先示範給他看，再陪他做，最後放手讓他做並事後檢視","直接丟給他一個案子，做錯了再糾正","給他一疊文件，請他先自己讀一個月，全部讀完之後才可以開始接觸實際的工作","讓他一直在旁邊看，不要動手"],why:"只看不做學不會，只做沒人看會養成錯的習慣。逐步放手，並在每個階段給回饋。"},
 {t:"變更溝通",q:"一項系統更換會影響好幾個部門的作業方式。溝通應該從什麼時候開始？",a:["規劃階段就找受影響的部門一起談時程和做法","上線前一天發公告","上線之後看有誰來反應再個別說明","等全部都做完、確定不會再有任何變動的時候，再一次向所有部門完整說明"],why:"越晚講，對方越沒有調整的空間，反彈也越大。早一點參與，他們提的問題常常是你沒想到的。"},
 {t:"優先順序",q:"兩個部門的需求撞期，雙方都堅持自己最急，你的人力只夠做一件。該怎麼處理？",a:["依既定的優先規則判斷，定不了就請雙方共同的主管裁決","先做跟你交情比較好的那個部門","兩件都接下來，然後兩件都延遲","自己憑感覺決定先做哪一邊，另外一個部門如果來問，就說技術上有困難沒辦法做"],why:"資源衝突是管理決策，不該由執行的人私下決定。有規則照規則，沒有就往上升級，並留下紀錄。"},
 {t:"值班制度",q:"團隊裡只有一個人長期負責夜間和假日的緊急處理。這個安排最大的問題是？",a:["人會過勞，而且他一不在就沒有人能接","沒有問題，同一個人處理最熟悉狀況","加班費的計算會比較複雜","其他同事會因為沒有機會在半夜接到電話，而覺得自己在團隊裡不受到重視"],why:"值班要輪替、要有交接和文件。把壓力集中在一個人身上，遲早會出錯或走人，兩種都是組織的損失。"}
]]},
{id:'sys',lv:[[
 {t:"目錄服務",q:"AD 裡的 OU 和群組，用途上最主要的差別是？",a:["OU 用來套用群組原則和委派管理，群組用來授予權限","兩個完全一樣，只是名稱不同","OU 用來授予資料夾權限，群組用來套用原則","OU 只能放電腦，群組只能放使用者，兩者不能混用也不能互相包含"],why:"要對一批物件套原則，放進 OU；要讓一批人能存取某個資源，加進群組。"},
 {t:"虛擬化",q:"虛擬化平台的「線上移轉」（Live Migration／vMotion）是用來做什麼的？",a:["不停機把虛擬機搬到另一台實體主機","把虛擬機轉成實體機","幫虛擬機做備份","在虛擬機關機的狀態下，把它的磁碟檔案複製一份到另外一個儲存位置"],why:"實體主機要維護或負載不均時，可以把上面的虛擬機線上搬走，使用者不會感覺到中斷。"},
 {t:"雲端",q:"在雲端租一台虛擬機，自己安裝作業系統和軟體。這屬於哪一種服務模式？",a:["IaaS","PaaS","SaaS","On-premises"],why:"IaaS 給你運算、儲存、網路，上面的系統自己管。PaaS 連執行環境都幫你顧，SaaS 是直接用現成的軟體。"},
 {t:"雲端",q:"雲端的「共同責任模型」裡，下列哪一項通常是客戶自己的責任？",a:["資料的保護和存取權限的設定","機房的門禁和電力","實體伺服器的硬體維修","以上全部都是雲端業者的責任，客戶把系統搬上雲端之後就不需要再負責任何事情"],why:"業者負責雲「本身」的安全，客戶負責自己放在雲「上面」的東西。儲存桶設成公開而外洩，是客戶的責任。"},
 {t:"備份",q:"「增量備份」備的是什麼？",a:["上一次備份（不管哪一種）之後有變動的資料","每次都備份全部的資料","上一次完整備份之後所有變動的資料","只備份作業系統的檔案，使用者的資料不在備份的範圍之內"],why:"增量只備上次以來的變動，最省空間，但還原時要完整備份加上每一份增量。「上次完整備份以來的變動」是差異備份。"},
 {t:"儲存",q:"Linux 使用 LVM 管理磁碟，最主要的好處是？",a:["可以彈性調整空間大小，不用重新分割","讀寫速度會變成兩倍","資料會自動加密","可以取代備份，因為 LVM 會自動把每個檔案都另外保存一份在不同的磁碟上面"],why:"LVM 在實體磁碟上多一層抽象，空間不夠時加一顆磁碟進來就能線上擴充。"},
 {t:"目錄服務",q:"AD 環境中，用戶端電腦是靠什麼找到網域控制站的？",a:["DNS","DHCP","NTP","用戶端會對整個網路廣播，逐一詢問每一台電腦是不是網域控制站"],why:"AD 高度依賴 DNS 的 SRV 紀錄。用戶端的 DNS 指到外面的伺服器，是「無法登入網域」最常見的原因之一。"},
 {t:"憑證",q:"公司網站某天早上突然全部跳出憑證錯誤的警告，前一天還好好的。最可能的原因是？",a:["TLS 憑證到期了","網站被改成 HTTP","使用者的瀏覽器同時壞了","網站伺服器的硬碟空間已經用完，沒有辦法再存放新的連線紀錄"],why:"憑證有期限，到期當天所有人同時出錯。應該把到期日放進監控，至少提前一個月提醒。"}
],[
 {t:"目錄服務",q:"在總公司新增的 AD 帳號，分公司要過一陣子才能登入。最可能的原因是？",a:["不同站台的網域控制站之間，複寫有時間間隔","分公司的電腦太舊","帳號的密碼設得太長","分公司的使用者沒有先重新開機，所以電腦還不知道有這個新的帳號存在"],why:"同一站台內複寫很快，站台之間是照排程複寫。急的話可以手動觸發，或直接在分公司的 DC 上建立。"},
 {t:"備份",q:"為了防勒索軟體，備份策略裡加一份「不可變」（Immutable）備份。它的特性是？",a:["在設定的保存期限內，任何人都無法修改或刪除","備份速度特別快","不需要儲存空間","只有系統管理員可以刪除，一般的使用者帳號沒有辦法刪除或修改"],why:"攻擊者拿到管理員權限後常先刪備份。不可變備份連管理員也刪不掉，才是最後一道保險。"},
 {t:"虛擬化",q:"一台虛擬機的快照已經開了八個月。會有什麼問題？",a:["差異檔越來越大、拖慢效能，合併時風險和時間也變高","沒有問題，快照留越久越安全","虛擬機會自動關機","快照超過半年之後會自動變成完整的備份，可以拿來做異地的還原"],why:"快照之後的所有變更都寫在差異檔裡。放太久，檔案巨大、讀寫變慢，刪除快照時的合併還可能失敗。"},
 {t:"雲端",q:"公司這個月的雲端帳單比平常多一倍。最常見的原因是？",a:["有資源開了沒關，或用量暴增卻沒有設預算警示","雲端業者算錯了","匯率變動","因為雲端的價格每個月都會固定自動調漲一倍，這是合約裡的正常現象"],why:"測試用的機器、沒掛載的磁碟、忘了刪的快照都在計費。預算警示和資源標籤是雲端管理的基本功。"},
 {t:"服務帳號",q:"排程工作是用某位工程師的個人帳號執行的。這樣有什麼風險？",a:["他離職或改密碼時，排程就會失敗","沒有風險，這樣最方便","排程會跑得比較慢","排程執行的結果只有他本人看得到，其他同事完全沒有辦法查看"],why:"服務和排程要用專用的服務帳號，權限給最小，密碼納入管理。這樣人員異動不會影響系統。"},
 {t:"容量規劃",q:"磁碟使用率現在 70%，過去半年每個月增加 5%。這個資訊應該怎麼用？",a:["推估大約六個月後會滿，提前規劃擴充或清理","還有 30%，不用管","等到 95% 告警響了再處理","把監控的告警門檻從 90% 調高到 99%，這樣就不會那麼快收到告警通知"],why:"容量規劃看的是趨勢，不是當下的數字。採購和擴充都需要時間，等告警響通常來不及。"},
 {t:"高可用與復原",q:"高可用（HA）、備份、災難復原（DR），哪一個是為了「整個機房都不能用」的狀況？",a:["災難復原","高可用","備份","三個都是，而且只要有做其中任何一個，另外兩個就可以省略不用做"],why:"HA 處理單一設備故障，備份處理資料毀損或誤刪，DR 處理整個據點失效。三個解決的問題不同，不能互相取代。"},
 {t:"更新管理",q:"伺服器要安裝安全性更新。和一般使用者的電腦相比，要多考慮什麼？",a:["要排維護時段、通知使用單位，並準備好失敗時怎麼退回","伺服器不需要安裝更新","可以隨時直接重開機","伺服器的更新一律要等到上市滿五年、確定完全沒有問題之後才可以安裝"],why:"伺服器重開會中斷服務，更新失敗影響的是所有使用者。但也不能因此不裝，漏洞一樣會被打。"}
],[
 {t:"目錄服務",q:"負責把地端 AD 帳號同步到雲端的那台伺服器，安全等級應該怎麼看待？",a:["當成和網域控制站同一級來保護","當成一般的檔案伺服器","當成使用者的個人電腦","它只負責傳資料，本身沒有任何權限，所以不需要特別保護"],why:"同步用的帳號通常能讀取整個網域的密碼雜湊。這台被拿下，等於雲端和地端一起失守。"},
 {t:"備份",q:"資料庫每天凌晨備份一次，沒有其他機制。下午四點硬碟毀損，最多會遺失多久的資料？",a:["大約十六個小時","完全不會遺失","一個星期","只會遺失最後一分鐘的資料，因為作業系統會自動保留其餘的部分"],why:"備份頻率直接決定 RPO。業務不能接受丟十幾個小時的資料，就要加上交易紀錄備份或複寫。"},
 {t:"高可用與復原",q:"只有兩個節點的高可用叢集，為什麼還需要第三方的「見證」（仲裁）？",a:["兩邊斷線時，用來決定哪一邊可以繼續服務","用來分擔運算的負載","用來存放備份","沒有實際作用，只是廠商為了多賣一套授權所設計出來的東西"],why:"沒有第三票，兩個節點互相看不到時都會以為自己該當主要節點，就會發生腦裂。"},
 {t:"基礎設施管理",q:"伺服器不再登入上去手動修改，要改就改映像檔、重新部署一台換掉舊的。這種做法的好處是？",a:["每台都一致、可重現，不會有人偷改而沒人知道","可以省下作業系統的授權費","伺服器的效能會變好","這樣就完全不需要再做備份，因為伺服器永遠都可以重新建立"],why:"這叫不可變基礎設施。手動改久了，每台都變成獨一無二、沒人敢動的「雪花」。"},
 {t:"憑證",q:"公司自建內部憑證中心（CA）。根憑證的私鑰應該怎麼保管？",a:["離線保存，平常由下層的 CA 簽發憑證","放在網站伺服器上方便使用","寄給每位管理員各留一份","放在共用資料夾並設定密碼，這樣需要簽發憑證的人可以隨時取用"],why:"根私鑰外洩，整個信任體系就毀了，所有憑證都要重發。所以根 CA 離線，日常用中繼 CA。"},
 {t:"雲端",q:"雲端帳號裡權限最高的那個根帳號（全域管理員），平常應該怎麼用？",a:["不拿來做日常操作，開啟多因素驗證並嚴格保管","大家共用，比較方便","拿來跑自動化排程","每天都用它登入，這樣才能確定這個帳號沒有被別人盜用"],why:"日常工作用權限剛好夠的帳號。最高權限帳號只在緊急或極少數操作時使用，而且每次使用都要有紀錄。"},
 {t:"虛擬化",q:"更新前先對虛擬機做快照，更新確認沒問題之後，這個快照該怎麼處理？",a:["確認正常後就刪除","永久保留","再多做幾個","把它轉成正式的備份，之後就不需要再另外排程備份這一台"],why:"快照是短期的後悔藥，用完就刪。留著會持續長大、拖慢效能，而且它不是備份。"},
 {t:"時間同步",q:"分散在不同地區的伺服器，紀錄的時間最好怎麼處理？",a:["全部校時，並統一用同一個時區（通常是 UTC）記錄","各自用當地時間就好","不需要記錄時間","每台伺服器都故意差幾分鐘，這樣攻擊者比較不容易看懂紀錄的順序"],why:"跨時區排查事件時，換算時間最容易出錯。統一時區加上校時，時間軸才拼得起來。"}
],[
 {t:"特權管理",q:"「即時權限」（Just-in-Time）的管理方式是什麼？",a:["平常沒有管理權限，需要時申請、核准後限時開通","每個人永久擁有最高權限","權限每十年檢查一次","只要是資訊部門的同仁，一到職就自動取得所有系統的管理權限"],why:"常駐的高權限帳號是攻擊者最想要的。改成臨時開通，帳號被盜時能做的事和時間都很有限。"},
 {t:"目錄服務",q:"整個 AD 被攻擊者完全掌控過，而且無法確認每一個後門都清乾淨了。比較穩當的復原方向是？",a:["在乾淨的環境重建信任基礎，再分階段把資源遷過去","把所有人的密碼改一次就好","把網域控制站重開機","維持現狀繼續觀察半年，如果沒有再出現異常就代表已經安全了"],why:"無法證明乾淨，就只能當作不乾淨。重建代價很高，但殘留一個後門，等於整個清除白做。"},
 {t:"高可用與復原",q:"災難復原演練發現，實際恢復要 12 小時，但承諾的 RTO 是 4 小時。應該怎麼處理？",a:["如實報告，由管理階層決定要投資改善還是調整承諾","把演練紀錄改成 4 小時","以後不要再演練","請同仁在下一次演練的時候動作快一點，其他的不需要調整"],why:"演練的價值就是找出落差。要嘛投資縮短時間，要嘛讓業務單位知道真實數字並調整期待。"},
 {t:"高可用與復原",q:"機房全毀後要從備份重建。下列哪一類系統應該最先恢復？",a:["其他系統都依賴的基礎服務，例如身分驗證和 DNS","使用人數最少的系統","最新上線的系統","介面設計得最漂亮、平常最常被高層主管稱讚的那一套系統"],why:"還原順序要照相依關係排。驗證和名稱解析沒起來，後面的應用就算還原了也沒人能登入。"},
 {t:"自動化",q:"一支自動化腳本寫錯了，同時套用到 500 台伺服器，全部出問題。流程上應該怎麼預防？",a:["先套用少數幾台確認，再分批擴大","不要使用自動化","一次全部套用才有效率","把腳本交給最資深的同仁執行，資深的人寫的腳本就不需要測試"],why:"自動化放大效率，也放大錯誤。分批和金絲雀的觀念，在基礎設施變更上一樣適用。"},
 {t:"服務水準",q:"「錯誤預算」（Error Budget）的概念是什麼？",a:["依服務目標算出可容許的失敗量，用完就暫停變更、優先顧穩定","每年可以犯錯的人數","修 bug 的預算金額","只要這一年的預算還沒有用完，就代表系統完全沒有任何問題需要處理"],why:"目標 99.9% 就代表有 0.1% 可以用。它讓「要多快推新功能」和「要多穩」有共同的數字可以談。"},
 {t:"雲端",q:"雲端主機有「隨需」和「預留」兩種計費。怎麼搭配比較合理？",a:["長期穩定的基本用量用預留，尖峰和臨時的用隨需","全部用隨需","全部用預留三年","每個月的月初用預留，到了月底再全部改成隨需的方式"],why:"預留便宜但要綁約，隨需彈性但貴。先看過去的用量曲線，把一定會用到的那一段鎖起來。"},
 {t:"虛擬化",q:"虛擬化平台要升級版本，叢集裡有八台主機。比較穩當的做法是？",a:["一次升一台，把虛擬機移走、升級、驗證後再換下一台","八台同時升級比較快","全部關機再一起升","先升級其中七台，剩下的那一台永遠保持在舊版以防萬一"],why:"滾動升級期間服務不中斷，遇到問題也只影響一台。前提是叢集的餘裕夠讓一台離線。"}
]]},
{id:'neteng',lv:[[
 {t:"路由",q:"OSPF 是什麼？",a:["一種內部使用的動態路由協定","一種無線網路的加密方式","一種網路線的規格","防火牆廠商推出的一套專門用來過濾惡意網站的黑名單訂閱服務"],why:"OSPF 讓路由器自動交換路由資訊、計算最佳路徑，線路斷掉時會自動改走別條。"},
 {t:"路由",q:"靜態路由和動態路由相比，最主要的缺點是？",a:["線路中斷時不會自動改道，要人去改","比較耗費路由器的 CPU","安全性比較差","只能用在 IPv6 的網路環境，傳統的 IPv4 網路沒有辦法設定靜態路由"],why:"靜態路由簡單、好預測，但不會隨網路變化調整。規模一大或需要備援時就要用動態路由。"},
 {t:"存取控制清單",q:"ACL（存取控制清單）的規則是怎麼比對的？",a:["由上往下，符合第一條就執行並停止","全部比對完，取最嚴格的那一條","由下往上比對","隨機挑一條規則開始比對，所以每一次的結果都有可能會不一樣"],why:"順序決定結果，範圍大的規則放前面會把後面的蓋掉。而且清單最後通常有一條看不見的「全部拒絕」。"},
 {t:"交換與 STP",q:"STP（擴張樹協定）會選出一台根橋接器（Root Bridge）。它是依什麼選的？",a:["Bridge ID 最小的（先比優先權，再比 MAC）","開機時間最早的那一台","連接埠數量最多的那一台","價格最貴、效能最好的那一台交換器會自動被選出來"],why:"沒設定優先權的話，可能是 MAC 最小的那台舊交換器當選。核心交換器應該手動把優先權調低。"},
 {t:"閘道備援",q:"HSRP 或 VRRP 的用途是什麼？",a:["讓兩台設備共用一個閘道 IP，一台故障另一台接手","加快無線網路的漫遊速度","把多條網路線綁成一條","自動幫用戶端的電腦分配 IP 位址以及 DNS 伺服器的設定"],why:"用戶端的預設閘道指向虛擬 IP，背後由兩台設備輪值。主要的那台掛了，使用者不用改任何設定。"},
 {t:"無線網路",q:"企業無線網路用 WPA2／WPA3-Enterprise，和大家共用一組密碼（PSK）相比，最大的好處是？",a:["每個人用自己的帳號驗證，可以個別停用和追查","訊號涵蓋的範圍比較大","不需要無線基地台","連線的速度會比較快，因為不需要花時間輸入那一組很長的共用密碼"],why:"共用密碼只要一個人外流或離職就得全部換掉。個別帳號驗證（802.1X）才知道是誰連的。"},
 {t:"VPN",q:"Site-to-Site VPN 和 Remote Access VPN 的差別是？",a:["前者連接兩個據點的網路，後者讓個人裝置連回公司","前者比較便宜，後者比較貴","前者不加密，後者有加密","前者只能在同一棟大樓裡面使用，後者則只能在國外的時候才可以使用"],why:"分公司和總公司之間的固定通道是 Site-to-Site；同仁在家用筆電連回公司是 Remote Access。"},
 {t:"日誌",q:"網路設備的紀錄，為什麼要用 Syslog 送到集中的伺服器？",a:["設備本身存得少、重開就不見，集中才能保存和交叉比對","這樣設備的轉送效能會提升","因為 Syslog 會自動修復設備上的設定錯誤","集中之後就不需要再對每一台設備做設定檔的備份，因為紀錄裡面都有"],why:"交換器的緩衝區很小，出事時紀錄常常已經被蓋掉。集中保存後，還能把多台設備的時間軸放在一起看。"}
],[
 {t:"路由",q:"路由表裡的 <code>0.0.0.0/0</code> 代表什麼？",a:["預設路由，找不到更明確的路徑時就走它","這條路由已經失效","只給網路管理用的路徑","代表這台路由器目前沒有設定任何的 IP 位址，需要重新設定"],why:"所有目的地都符合 0.0.0.0/0，但它的前綴最短，所以只有在沒有其他更明確的路由時才會用到。"},
 {t:"路由",q:"路由表同時有 <code>10.1.0.0/16</code> 和 <code>10.1.1.0/24</code> 兩條。要送往 10.1.1.50 的封包會走哪一條？",a:["/24 那一條","/16 那一條","兩條輪流走","先設定的那一條，路由器會依照每一條路由被加入的先後順序來決定"],why:"路由器選的是「最長前綴匹配」，也就是範圍最精確的那條。"},
 {t:"交換與 STP",q:"交換器的 Port Security 功能可以做到什麼？",a:["限制一個連接埠只能讓指定或一定數量的 MAC 位址使用","加快連接埠的速度","自動備份交換器的設定","把連接埠上面所有經過的流量都加密起來，防止被旁邊的人側錄"],why:"可以防止有人拔掉電腦改接自己的設備，或私接小型交換器。違規時可以設定關閉該埠或只發告警。"},
 {t:"VLAN",q:"新增了一個 VLAN，同一台交換器上的電腦互通正常，但到另一台交換器的同 VLAN 電腦就不通。最該檢查什麼？",a:["兩台交換器之間的 trunk 有沒有放行這個 VLAN","電腦的螢幕解析度","DNS 伺服器","兩台交換器的韌體版本是不是完全一樣，不一樣的話就沒有辦法互通"],why:"很多環境的 trunk 只允許清單上的 VLAN 通過。新增 VLAN 時，沿途每一段 trunk 都要加。"},
 {t:"無線網路",q:"使用者拿著筆電從辦公室走到會議室，明明旁邊就有基地台，筆電卻一直連著原本很遠的那一台、訊號很差。可能的原因是？",a:["基地台的發射功率設太大，裝置不願意換","筆電的硬碟快滿了","會議室的網路線太短","無線網路本來就不支援移動，每換一個地方都需要手動重新連線一次"],why:"這叫「黏著」。功率太大讓遠處的訊號看起來還可以，裝置就不漫遊。功率和最低連線速率要一起調。"},
 {t:"VPN",q:"兩個據點之間的 IPsec VPN 通道一直建不起來。最常見的原因是？",a:["兩端的加密參數、金鑰或對端網段設定不一致","兩邊的網路線顏色不同","VPN 只能在晚上建立","兩個據點所在的縣市不同，所以依規定沒有辦法直接建立通道"],why:"IPsec 要求兩端的加密演算法、驗證方式、金鑰、保護的網段完全對得上。差一個就談不成。"},
 {t:"服務品質",q:"網路上設定 QoS，主要是為了什麼？",a:["頻寬不夠時，讓語音、視訊這類即時流量優先通過","讓所有流量都變快","阻擋病毒","讓每一位使用者不論在做什麼，都能平均分配到完全相同的頻寬"],why:"QoS 不會生出頻寬，它是在壅塞時決定誰先走。語音延遲一點就聽得出來，檔案下載慢幾秒沒差。"},
 {t:"文件與標示",q:"為什麼網路設備的連接埠、線路都要標示，並維護一份拓樸圖？",a:["出問題時才能很快知道哪條線接到哪裡、影響到誰","只是為了看起來整齊","稽核規定要有圖","因為標示之後訊號比較不會衰減，網路的速度也會明顯變得比較快"],why:"半夜出事時，沒有標籤和圖，光是找線就要花掉大半時間，還可能拔錯。"}
],[
 {t:"路由",q:"BGP 主要用在什麼情境？",a:["不同網路營運者（自治系統）之間交換路由，例如同時接兩家 ISP","同一台交換器上的 VLAN 之間","無線基地台之間的漫遊","只用在家用的分享器上，企業的網路環境並不會使用到"],why:"網際網路就是靠 BGP 串起來的。企業有自己的 IP 區段、要接多家業者做備援時就會用到。"},
 {t:"路由",q:"OSPF 把網路切成多個區域（Area），主要目的是？",a:["縮小路由計算的範圍，一個區域變動不會讓全網重算","讓不同區域使用不同的密碼","增加網路的頻寬","讓每個區域可以各自使用不同廠牌的設備，否則不同廠牌無法互通"],why:"網路一大，每次變動全部重算會很耗資源。分區之後，區域內的細節不外傳，只交換彙整後的路由。"},
 {t:"資料中心架構",q:"資料中心常見的 Spine-Leaf 架構，相對於傳統三層式架構的優點是？",a:["任兩台伺服器之間的路徑長度固定，容易橫向擴充","需要的線路比較少","不需要設定路由","只需要一台交換器就可以完成，所以建置的成本是最低的"],why:"每台 Leaf 都接到每台 Spine，伺服器之間最多經過固定的跳數。流量不夠就加 Spine，埠不夠就加 Leaf。"},
 {t:"網路存取控制",q:"網路存取控制（NAC）除了驗證身分，還常用來做什麼？",a:["檢查設備是否合規，不合規的放到隔離網段","加快上網的速度","備份使用者的檔案","自動幫每一台連上網路的設備安裝公司指定的所有應用程式"],why:"沒裝防毒、沒更新的電腦先隔離，修好再放行。這樣一台有問題的設備就不會直接接上內網。"},
 {t:"路由",q:"IP 封包標頭裡的 TTL 欄位，主要是為了解決什麼問題？",a:["路由迴圈時，讓封包不會無限繞下去","讓封包傳得比較快","加密封包的內容","記錄這個封包的傳送總共花掉了多少電費，方便之後向使用者收費"],why:"每經過一台路由器 TTL 就減一，減到零就丟掉。<code>tracert</code> 也是利用這個機制找出每一站。"},
 {t:"防火牆",q:"兩台防火牆做主備援（Active-Passive）。要讓切換時使用者的連線不中斷，兩台之間必須同步什麼？",a:["連線狀態表","風扇的轉速","管理者的登入密碼","兩台設備的外殼序號以及出廠的日期"],why:"備援機接手時如果不認得既有的連線，所有人都得重新連。所以除了設定，連線狀態也要即時同步。"},
 {t:"IPv6",q:"公司只管理 IPv4，但電腦預設都開著 IPv6。這有什麼風險？",a:["有人可以利用沒在管的 IPv6 繞過既有的防護或進行攔截","完全沒有風險","網路會變慢一倍","電腦會因為同時使用兩種協定而經常當機，需要每天重新開機"],why:"防火牆規則、監控如果只看 IPv4，IPv6 就是一條沒人看的路。要嘛納管，要嘛明確關閉。"},
 {t:"廣域網路",q:"SD-WAN 相較於傳統固定專線的做法，主要的特點是？",a:["集中管理，依線路品質和應用類型動態選擇路徑","只能使用一條線路","不需要任何設備","它是一種新的網路線材質，可以讓傳輸的距離變成原本的十倍"],why:"把多條線路（專線、寬頻、行動網路）當成資源池，重要的應用走品質好的，壞掉自動切換。"}
],[
 {t:"路由",q:"有業者錯誤宣告了不屬於自己的 IP 區段，導致流量被導走。網際網路上用什麼機制降低這種風險？",a:["RPKI，驗證路由宣告的來源是否有權宣告該區段","DHCP","NAT","請每一家業者的工程師每天互相打電話確認彼此的路由"],why:"BGP 本身是基於信任的。RPKI 讓 IP 持有者簽署「誰可以宣告我的位址」，其他業者就能據此過濾。"},
 {t:"網段隔離",q:"「微分段」和傳統只在邊界放防火牆相比，差別是什麼？",a:["連內部主機之間的連線也逐一控管，只允許必要的","把防火牆換成更大台的","把內網全部開放","把每一台伺服器都搬到各自獨立的機房，彼此之間完全不連線"],why:"傳統做法進了內網就暢行無阻。微分段讓攻擊者拿下一台之後，橫向移動的每一步都被擋。"},
 {t:"網路自動化",q:"用程式自動派送網路設備的設定。除了效率，最重要的保護機制是什麼？",a:["套用前自動檢查和模擬，並保留可以快速回復的版本","不需要任何保護機制","每次都由不同的人手動再打一次","只在星期五下班前執行，這樣出問題的話有整個週末可以處理"],why:"設定進版本控制、套用前驗證、分批推送、一鍵回復。少了這些，自動化只是讓出錯更快更廣。"},
 {t:"DDoS",q:"遭到大流量的 DDoS 攻擊，自己的對外線路已經被塞滿。這時最有效的緩解方式是？",a:["請上游業者或流量清洗服務，在流量進來之前就過濾掉","在自己的防火牆上加規則","把伺服器重開機","請公司內部的同仁暫時都不要上網，把頻寬讓給外面的使用者"],why:"線路都滿了，在自己這端擋已經太晚。要在更上游、頻寬更大的地方處理，所以要事先簽好服務。"},
 {t:"流量可視性",q:"邊界防火牆只看得到進出的流量。要發現內部主機之間的異常，還需要什麼？",a:["內部東西向流量的可視性，例如流量紀錄或內部感測點","更高的對外頻寬","更長的網路線","每個月請各個部門的主管回報一次，他們有沒有覺得網路怪怪的"],why:"攻擊者進來之後的活動都在內網。看不到東西向流量，就等於只在大門裝監視器。"},
 {t:"備援設計",q:"為了「絕對不能斷」，網路設計了非常多層的備援和自動切換機制。可能有什麼反效果？",a:["太複雜，故障時行為難以預測，也沒人看得懂","完全沒有反效果","速度會變成兩倍","設備的保固期限會因為備援的層數太多而被原廠縮短"],why:"很多大型故障是備援機制本身造成的。簡單、可理解、有測試過的設計，往往比花俏的更可靠。"},
 {t:"加密流量",q:"要不要對員工上網的加密流量做解密檢查（TLS Inspection）？決定前必須考慮什麼？",a:["隱私和法律、憑證信任的管理、效能，以及哪些類別要排除","沒有什麼需要考慮的，直接全部解密","只要考慮設備的顏色","只需要考慮這個功能在目前設備的授權裡面是不是已經免費提供"],why:"不解密看不到內容，解密又碰到隱私和技術問題。通常會排除金融、醫療等類別，並事先告知員工。"},
 {t:"容量規劃",q:"規劃對外頻寬時，看「平均使用率」為什麼不夠？",a:["平均值會蓋掉尖峰，尖峰時段才是使用者覺得慢的時候","平均值永遠是零","因為頻寬不需要規劃","因為平均使用率這個數字，依規定只有電信業者才可以計算"],why:"平均 30% 可能代表白天滿載、半夜全空。規劃要看尖峰和高百分位數（例如第 95 百分位）。"}
]]},
{id:'blue',lv:[[
 {t:"SIEM",q:"SIEM 的主要功能是什麼？",a:["集中收集各種紀錄，關聯分析後產生告警","取代防火牆","自動幫所有電腦安裝更新","把公司所有的檔案都加密起來，只有通過驗證的人才可以解開閱讀"],why:"單看一台設備的紀錄常看不出問題。SIEM 把防火牆、端點、AD 的紀錄放在一起，才能拼出完整的攻擊過程。"},
 {t:"告警分析",q:"收到一個資安告警。分析的第一步是什麼？",a:["確認是不是真的，以及影響到哪些主機和帳號","馬上把那台電腦重灌","直接結案，告警大多是誤報","先寫一份完整的報告呈給主管，等主管批示之後再開始看告警的內容"],why:"這個步驟叫分流（Triage）。先判斷真假和範圍，才知道要投入多少人力、要不要升級處理。"},
 {t:"釣魚分析",q:"判斷一封信是不是釣魚信，下列哪一項最可靠？",a:["寄件者的實際網域，和連結真正指向的網址","信件的文筆通不通順","有沒有公司的標誌","信件裡面有沒有寫出收件人的全名，以及內容看起來是不是很緊急"],why:"顯示名稱、標誌、文筆都可以仿冒。網域和連結的真實目的地，還有 SPF、DKIM 的驗證結果比較難造假。"},
 {t:"威脅情資",q:"把攻擊者用的 IP 加進黑名單，這個防禦的效果為什麼有限？",a:["換一個 IP 對攻擊者來說非常容易","防火牆的黑名單最多只能放十筆","IP 位址沒辦法被封鎖","因為只要封鎖了一個 IP，防火牆的效能就會明顯下降，所以不建議使用"],why:"這是「痛苦金字塔」的概念：雜湊值、IP、網域都很好換。能偵測攻擊者的手法和行為，才會讓他真的痛。"},
 {t:"時間同步",q:"調查事件時，發現各台設備的紀錄時間對不起來，差了好幾分鐘。平時應該做好什麼？",a:["所有設備都跟同一個 NTP 來源校時","每台設備使用不同的時區","每天手動調整一次時間","把所有設備的紀錄功能都關掉，只保留防火牆一台的紀錄，就不會有對不起來的問題"],why:"時間不準，就排不出事件的先後順序。校時是最基本、也最容易被忽略的調查前提。"},
 {t:"偵測品質",q:"偵測上所說的「漏報」（False Negative）是指什麼？",a:["真的有攻擊，但沒有產生告警","沒有攻擊，卻產生了告警","告警產生得太慢","告警的內容寫得太過簡略，值班的人員看不懂到底發生了什麼事情"],why:"誤報浪費人力，漏報則是完全不知道被打了。兩個要一起看，把誤報壓到零通常代表漏報變多。"},
 {t:"證據保全",q:"要從一台被入侵的主機蒐集證據。依「揮發性」的順序，應該先取哪一種？",a:["記憶體內容","硬碟上的檔案","備份磁帶","列印出來的紙本文件，以及這台主機的採購和保固相關資料"],why:"越容易消失的越先取：記憶體、網路連線、執行中的程序，再來才是硬碟。關機後記憶體裡的東西就沒了。"},
 {t:"通報文化",q:"同仁回報收到可疑信件，結果有一位坦承自己已經點了連結。資安單位比較好的態度是？",a:["感謝他回報並立刻協助處理，不要責備","公開檢討他，讓其他人引以為戒","記一次缺失","告訴他下次如果再發生同樣的事情，就不需要再特地回報給資安單位了"],why:"回報會被罵，下次就沒人敢說，資安單位就少了最重要的早期警報。要罰的是隱瞞，不是誠實。"}
],[
 {t:"帳號異常",q:"同一個帳號，10 分鐘前在台北登入，現在又從國外的 IP 登入成功。這個現象最需要懷疑什麼？",a:["帳號密碼已經外洩","使用者的電腦時間不準","網路速度太快","這是正常現象，使用者只要搭飛機的話十分鐘之內就可以抵達國外"],why:"這叫「不可能的移動」。先確認是不是 VPN 造成的，不是的話就要當成帳號被盜處理。"},
 {t:"端點行為",q:"端點紀錄裡看到 Office 程式啟動了 PowerShell，後面還帶一長串編碼過的參數。這代表什麼？",a:["很可疑，常見於惡意文件執行後續的指令","這是 Office 的正常更新","使用者在寫程式","代表這台電腦的 Office 授權已經過期，系統正在自動重新啟用授權"],why:"文件軟體正常不會叫出命令列工具，編碼參數又是為了躲避檢查。這個父子程序的組合是很經典的偵測點。"},
 {t:"帳號異常",q:"「密碼噴灑」和一般的暴力破解，差別在哪裡？",a:["用少數幾組常見密碼去試很多個帳號，避免觸發鎖定","針對一個帳號試幾百萬組密碼","直接偷走密碼檔","先用電話假冒資訊人員，騙使用者親口把自己的密碼講出來"],why:"每個帳號只試一兩次，不會被鎖。所以要看的是「同一來源對很多帳號失敗」，不是單一帳號的失敗次數。"},
 {t:"基準線",q:"偵測異常之前，為什麼要先建立「基準線」？",a:["要先知道平常是什麼樣子，才看得出哪裡不正常","基準線是防火牆的一種規則","為了減少紀錄的儲存量","因為法規要求每一年都要畫一條基準線，並且送交主管機關備查"],why:"半夜有主機大量對外連線算不算異常？要看它平常會不會這樣。沒有基準，告警只能靠猜。"},
 {t:"偵測品質",q:"想偵測「有人在伺服器上新增管理員帳號」，寫好規則卻從來沒響過，實際上明明有人加過。最可能的原因是？",a:["相關的稽核紀錄根本沒有開，或沒有送進 SIEM","規則寫得太好了","攻擊者很有禮貌","SIEM 的授權只能同時啟用一條規則，其他的規則都會自動被停用"],why:"偵測的前提是有資料。每條規則都要確認對應的紀錄來源有開、有收、欄位有解析，並實際測試觸發一次。"},
 {t:"圍堵決策",q:"確認一台重要的業務主機疑似被入侵，隔離它會中斷服務。這個決定應該怎麼做？",a:["依事先訂好的授權和流程，由有權責的人決定","值班人員自己決定就好","不管影響，一律馬上隔離","先觀察一個星期看看，等到確定真的有資料外洩之後再來討論要不要隔離"],why:"圍堵常常要在「止血」和「業務中斷」之間取捨。誰能決定、多快要決定，要在平時就講好。"},
 {t:"事件報告",q:"一份好的資安事件報告，至少應該包含什麼？",a:["時間軸、影響範圍、根本原因、處置過程和後續改善","只要寫「已處理完畢」","犯錯人員的姓名和處分","攻擊者使用的工具的完整原始碼，以及重現整個攻擊的詳細操作步驟"],why:"報告是給管理階層做決定、也是給未來的自己查的。重點是發生了什麼、為什麼、之後怎麼不再發生。"},
 {t:"釣魚分析",q:"有一位同仁回報收到釣魚信。除了處理他的電腦，還應該做什麼？",a:["查還有誰收到同一封信，從信箱移除並封鎖相關網址","請他把信刪掉就結束","把他的信箱停用","回信給寄件者，請對方以後不要再寄這種信件到公司的信箱"],why:"釣魚信很少只寄一個人。一個人回報，代表可能有幾十個人收到、其中有人已經點了卻沒說。"}
],[
 {t:"AD 攻擊偵測",q:"AD 紀錄顯示，一個普通帳號在短時間內對大量服務帳號請求了服務票證，而且加密類型偏舊。最該懷疑什麼攻擊？",a:["Kerberoasting","釣魚郵件","阻斷服務","網站被置換首頁"],why:"攻擊者要票證是為了帶回去離線破解服務帳號的密碼。防禦上，服務帳號要用很長的隨機密碼。"},
 {t:"AD 攻擊偵測",q:"偵測到一台「不是網域控制站」的主機，對 DC 發出目錄複寫的請求。這代表什麼？",a:["可能有人在用 DCSync 倒出全網域的密碼雜湊","這是正常的備份行為","這台主機需要更新","代表這一台主機即將被自動升級成為新的網域控制站"],why:"複寫只該發生在 DC 之間（和少數已知的同步伺服器）。其他來源出現這個行為，是非常嚴重的警訊。"},
 {t:"端點行為",q:"攻擊者不帶自己的惡意程式，只用系統內建的工具（PowerShell、排程、遠端管理）行動。這種手法為什麼難偵測？",a:["用的都是合法工具，要從行為和脈絡才看得出異常","因為內建工具不會留下任何紀錄","因為防毒軟體會自動放行攻擊者","因為這些工具只能在半夜執行，而值班的人員那個時候通常都在休息"],why:"這叫「就地取材」。特徵比對擋不到，要靠基準線和行為規則：誰、在哪、什麼時間、叫了什麼。"},
 {t:"偵測品質",q:"一條新的偵測規則上線前，最應該先做什麼？",a:["拿過去一段時間的紀錄回測，看會響多少次、準不準","直接上線，有問題再說","先關掉其他所有規則","請每一位同事各自提供一個他們覺得適合的告警門檻，再取平均值"],why:"沒回測就上線，常見結果是一天響幾千次或完全不響。回測也能順便確認資料來源是不是真的有。"},
 {t:"自動化",q:"導入 SOAR 自動化處理告警。哪一類動作最適合先自動化？",a:["蒐集和補充資訊，例如查 IP 信譽、查帳號和資產資料","自動隔離任何觸發告警的主機","自動刪除使用者的檔案","自動把觸發告警的員工帳號永久刪除，並且通知人事單位"],why:"補充資訊沒有副作用，又最耗人工。會影響業務的處置動作，要等規則夠準、流程夠成熟再逐步放手。"},
 {t:"日誌保存",q:"紀錄只保存 30 天。對事件調查最大的限制是什麼？",a:["攻擊者常潛伏好幾個月，等發現時最初入侵的紀錄已經沒了","紀錄檔會太小","調查會變得太快","沒有任何限制，因為所有的攻擊都會在三十天之內被發現"],why:"查不到最初怎麼進來的，就不知道洞在哪、有沒有補上。保存期限要考慮潛伏時間和法規要求。"},
 {t:"誘餌",q:"在 AD 裡放一個看起來很有價值、但實際沒人會用的帳號，並監控它有沒有被存取。這種做法的價值是？",a:["正常人不會碰它，一有動靜幾乎就確定有問題","可以增加帳號的總數","讓網域的效能變好","讓攻擊者以為公司的規模很大，因此不敢發動攻擊"],why:"這是誘餌（Honeytoken）。誤報極低，是少數「一響就要認真看」的告警。"},
 {t:"成效指標",q:"衡量資安監控成效的指標 MTTD 和 MTTR，分別是指？",a:["平均多久偵測到，以及平均多久完成處置","平均每天的告警數，以及平均每天的結案數","防火牆和防毒的授權到期日","資安人員平均每個月的加班時數，以及平均每年的離職率"],why:"攻擊者得手需要時間。偵測和回應越快，他能造成的損害越小。這兩個數字比「擋了幾次攻擊」更有意義。"}
],[
 {t:"偵測品質",q:"要評估一個資安監控團隊的偵測能力夠不夠，比較好的方法是？",a:["對照攻擊手法的知識庫，盤點哪些偵測得到、哪些是缺口","看每天產生多少告警","看買了幾套產品","看資安監控中心的螢幕牆總共有幾面，以及畫面夠不夠壯觀"],why:"告警多不代表看得到。逐項盤點、實際測試，才知道下一步該補哪裡。"},
 {t:"事件應變",q:"確認攻擊者還在內部活動，而且掌握了多個立足點。清除時最忌諱什麼？",a:["發現一個清一個，讓攻擊者察覺後換個方式躲起來","事先規劃","同時行動","在行動之前先確認每一個立足點的位置和攻擊者使用的管道"],why:"要先摸清楚範圍，再選定時間一次同步處理：封鎖管道、重設憑證、移除後門。零散地清，只是提醒他躲好。"},
 {t:"威脅情資",q:"威脅情資來源很多、每天幾千筆。怎麼用才有效？",a:["優先處理和自己產業、技術環境相關的，並轉成可以執行的偵測","全部匯入就好，越多越好","完全不用，自己看紀錄就夠了","每天挑選數量最多的那一類情資，全部列印出來給全公司的同仁傳閱"],why:"不相關的情資只會製造雜訊。情資的價值在於能回答「這跟我有關嗎、我該做什麼」。"},
 {t:"內部威脅",q:"監控員工行為來偵測內部威脅時，最需要平衡的是什麼？",a:["資安需求和員工隱私，監控的範圍和目的要明確並事先告知","監控畫面的解析度","監控人員的座位","監控系統的報表要用什麼顏色，以及每個月的報表總共要印成幾份"],why:"過度監控傷害信任，也有法律風險。要有政策依據、限定目的、限制誰能看，並留下調閱紀錄。"},
 {t:"演練",q:"「桌上演練」（Tabletop Exercise）是在做什麼？",a:["相關人員坐下來，照假想的情境討論每一步誰做什麼決定","把桌子搬到機房","實際攻擊正式系統","請資安廠商派人到公司來，展示他們最新推出的產品有哪些功能"],why:"不用動到系統，就能發現「誰有權決定斷網」「誰對外發言」這類流程上的漏洞。要找管理階層一起參加。"},
 {t:"弱點管理",q:"查出攻擊者是利用某台伺服器的一個漏洞進來的，修補了那一台。這樣夠了嗎？",a:["不夠，要清查其他主機有沒有同樣的漏洞，以及為什麼沒被修補","夠了","不夠，應該把那台伺服器丟掉","夠了，而且這一台伺服器從今以後都不需要再安裝任何的安全性更新"],why:"一台有洞，通常不只一台。更重要的是修補流程哪裡漏掉了它，不解決這個，下次還是同樣的故事。"},
 {t:"證據保全",q:"數位證據的「保管鏈」（Chain of Custody）是在記錄什麼？",a:["證據從取得到提交，經過誰的手、何時、做了什麼","證據的檔案大小","證據要用什麼顏色的袋子裝","參與這次調查的每一位人員的年資、學歷以及持有的專業證照"],why:"證據如果說不清楚中間有沒有被動過，在法律程序上就可能不被採信。雜湊值加上交接紀錄是基本要求。"},
 {t:"團隊管理",q:"監控人員長期輪大夜班、每天看上千個告警，離職率很高。管理上最該優先改善什麼？",a:["減少無效告警和重複的人工作業，並調整輪值制度","提高告警的數量","禁止離職","在監控中心裡面多放幾台電視，讓值班人員可以一邊看一邊工作"],why:"疲勞會讓人漏看真正的攻擊。調校規則、自動化、合理輪值，是在保護人，也是在保護偵測能力。"}
]]},
{id:'red',lv:[[
 {t:"授權與範圍",q:"滲透測試開始之前，最重要的一件事是什麼？",a:["取得書面授權，並確認範圍和規則","先偷偷掃一下看有沒有洞","準備最新的攻擊工具","先在社群網站上公開宣布即將要對這個目標進行測試，以示透明"],why:"沒有授權就是入侵，在台灣會觸犯刑法妨害電腦使用罪。範圍、時間、禁止事項、緊急聯絡人都要白紙黑字。"},
 {t:"偵察",q:"「被動偵察」（OSINT）的特點是什麼？",a:["只用公開資訊，不直接碰目標的系統","對目標做完整的連接埠掃描","直接嘗試登入目標的系統","寄送大量的釣魚信件給目標公司的全體員工，觀察有多少人會點擊"],why:"查公開的網域紀錄、徵才訊息、社群貼文，目標不會察覺。主動掃描才會在對方的紀錄上留下痕跡。"},
 {t:"授權與範圍",q:"測試過程中，你發現一台「不在授權範圍內」的主機似乎有嚴重漏洞。該怎麼做？",a:["不要動它，記錄下來並告知客戶","既然發現了就順便測一下","當作沒看到","先把它打下來取得證據，這樣向客戶報告的時候才會比較有說服力"],why:"範圍外的系統可能屬於別人，碰了就是未授權存取。告知客戶，由他們決定要不要擴大範圍。"},
 {t:"弱點識別",q:"CVE 是什麼？",a:["公開漏洞的統一編號","一種加密演算法","一套防毒軟體","漏洞嚴重程度的評分，分數的範圍是從 0 分到 10 分"],why:"CVE 讓大家講同一個漏洞時有共同的名字。嚴重程度的分數是另一套，叫 CVSS。"},
 {t:"資料處理",q:"測試時你成功進入資料庫，裡面有大量真實的個資。正確的做法是？",a:["只取得足以證明的最少證據，不下載、不外流，如實記錄","全部下載回去當作成果","把資料分享給同事看","挑幾筆知名人士的資料截圖放進報告的封面，讓客戶感受到問題有多嚴重"],why:"目的是證明「拿得到」，不是真的去拿。證據截到欄位名稱和筆數就夠，內容要遮蔽。"},
 {t:"報告",q:"一份好的滲透測試報告，最重要的內容是什麼？",a:["每個弱點的風險、重現步驟和修補建議","測試人員用了多厲害的手法","使用的工具清單","攻擊畫面的截圖越多越好，文字的說明可以盡量省略以節省篇幅"],why:"報告是寫給要修的人看的。對方能照著重現、知道先修哪個、怎麼修，這份報告才有價值。"},
 {t:"弱點識別",q:"OWASP Top 10 是什麼？",a:["最常見的網站應用程式安全風險清單","十大駭客組織的排名","十種最好用的攻擊工具","全世界前十名最安全的網站，每一年由各國政府共同評選出來"],why:"它是網站安全的入門地圖，像存取控制失效、注入攻擊都在上面。開發和測試人員都該看過。"},
 {t:"授權與範圍",q:"測試進行中，客戶的正式系統開始變慢、出現異常。你應該怎麼做？",a:["立刻停止測試，通知客戶的緊急聯絡人","繼續測完，結束後再一起報告","加快速度趕快測完","先不要講，默默觀察看看系統會不會自己恢復正常"],why:"測試不能造成實際損害。事前就要約定好緊急聯絡人和停止條件，出狀況第一時間通報。"}
],[
 {t:"測試類型",q:"「黑箱」和「白箱」滲透測試，差別在哪裡？",a:["黑箱事先不知道內部資訊，白箱會拿到架構、帳號甚至原始碼","黑箱在晚上做，白箱在白天做","黑箱不需要授權","黑箱只測試網路設備，白箱則是只測試網站，兩者的測試對象完全不同"],why:"黑箱接近外部攻擊者的視角；白箱效率高、涵蓋深。介於中間、給部分資訊的叫灰箱。"},
 {t:"弱點識別",q:"弱點掃描工具回報了 200 個弱點。寫進報告之前應該做什麼？",a:["人工驗證，排除誤判並確認實際的風險","全部照抄進報告","只挑前十個","把工具的掃描強度調到最高之後重新再掃描一次，以數量比較多的那一次為準"],why:"掃描工具常靠版本號推測，誤判很多。沒驗證的報告會讓客戶花時間追不存在的問題，也失去信任。"},
 {t:"社交工程",q:"客戶委託做社交工程測試（釣魚演練）。下列哪一個原則最重要？",a:["同樣要有授權和範圍，而且不能對個人造成實質傷害","為了逼真，什麼手段都可以用","不需要告訴任何人","測試結束之後要公布每一位中招員工的姓名，這樣才能達到警惕的效果"],why:"演練的目的是找出流程和訓練的缺口，不是羞辱人。主題要避開會造成恐慌或傷害的內容，結果也不該針對個人。"},
 {t:"資料處理",q:"測試中你取得並破解了一批使用者的密碼。這些密碼應該怎麼處理？",a:["只用於授權範圍內的測試，報告中遮蔽，結束後銷毀","留著以後可能用得到","整份明文貼進報告","寄一封信給每一位使用者，信中附上他們的密碼，提醒他們密碼太弱了"],why:"這些是真實的憑證。報告只需要證明「破解得出來」和統計數字，明文留在你手上就是多一個外洩點。"},
 {t:"清理",q:"滲透測試結束後，為什麼一定要做「清理」？",a:["移除測試時建立的帳號、上傳的工具和修改的設定，避免變成真的漏洞","讓客戶看不出來你做過什麼","減少報告的頁數","把客戶系統上所有的紀錄檔都清除乾淨，這樣系統的硬碟空間才不會不足"],why:"忘了刪的測試帳號和後門，之後被真正的攻擊者撿去用，責任就在測試團隊。清理的項目也要列在報告裡。"},
 {t:"報告",q:"三個單獨看都只是「低風險」的弱點，串在一起卻能拿到管理員權限。報告應該怎麼呈現？",a:["說明整條攻擊鏈，並以串起來之後的實際風險評級","各自列為低風險就好","不用寫，客戶看不懂","只寫其中最嚴重的那一個，另外兩個因為風險比較低所以可以省略"],why:"真實的攻擊都是串起來打的。只看單點分數會嚴重低估風險，也讓客戶不知道為什麼要優先修。"},
 {t:"弱點識別",q:"實務上，下列哪一種是最常見、也最容易得手的突破口？",a:["沒改掉的預設帳號密碼和弱密碼","全新的零時差漏洞","破解加密演算法","攻擊者親自潛入機房，把伺服器的硬碟直接拆下來帶走"],why:"大部分的入侵靠的不是高深技術，而是沒改的預設密碼、沒修的舊漏洞和設定錯誤。"},
 {t:"複測",q:"客戶修補完成後，安排一次「複測」。它的目的是什麼？",a:["確認弱點真的修好了，而且沒有因為修補產生新的問題","再收一次費用","重新做一次完整的測試","確認客戶有沒有把上一次的測試報告外流給其他的資安廠商"],why:"說修好了和真的修好了是兩回事。常見的狀況是只擋了報告裡的那個測試字串，換個寫法還是打得進去。"}
],[
 {t:"測試類型",q:"「假設已被入侵」（Assumed Breach）的測試，是從什麼狀態開始？",a:["直接給測試人員一個內部的立足點，例如一台電腦或一組一般帳號","從完全不知道目標是誰開始","從取得管理員權限之後開始","從客戶的系統已經全部被加密、業務完全停擺的狀態開始"],why:"邊界遲早會被突破。這種測試把時間花在「進來之後能走多遠、防守方看不看得到」。"},
 {t:"攻擊手法",q:"受駭主機會定期對外連到攻擊者的控制伺服器（C2）領取指令。防守方可以從什麼特徵發現它？",a:["固定間隔、規律的對外連線","連線的次數是偶數","主機的螢幕變暗","主機的硬碟容量會在每一次連線之後自動增加一倍"],why:"這種規律的「心跳」叫 Beaconing。就算內容加密，時間間隔和目的地的異常仍然看得出來。"},
 {t:"授權與範圍",q:"交戰規則（RoE）裡的「禁止事項」，通常會包含什麼？",a:["阻斷服務攻擊、異動或刪除正式資料","撰寫測試報告","使用筆記型電腦","在測試期間和客戶的窗口保持聯絡，並且定期回報測試的進度"],why:"測試是為了證明風險，不是造成損害。會讓服務中斷或資料毀損的動作，預設都不做，除非另外書面同意。"},
 {t:"紫隊",q:"「紫隊」演練是怎麼進行的？",a:["攻擊方和防守方一起，逐項執行手法並確認偵測和回應有沒有作用","攻擊方和防守方互不溝通","只有防守方參加","由第三方的裁判來決定攻擊方和防守方哪一邊獲勝，並且頒發獎金"],why:"目的是一起把偵測補起來：打一招、看有沒有告警、沒有就當場調整規則再打一次。"},
 {t:"授權與範圍",q:"測試目標是「證明能取得財務系統的資料」。你在過程中拿到了網域管理員權限。接下來應該怎麼做？",a:["完成約定的目標就停，不去碰範圍和目標以外的系統","既然有最高權限，把所有系統都逛一遍","順便幫客戶修改一些設定","把網域裡所有人的密碼都改掉，藉此向客戶證明問題的嚴重性"],why:"權限越大越要克制。多做的每一步都可能造成意外，也超出授權。把取得的過程記錄清楚就夠了。"},
 {t:"授權與範圍",q:"測試時，你發現系統裡有不是你留下的後門和可疑帳號。應該怎麼做？",a:["立刻暫停，通知客戶，這可能是真正的入侵","當作沒看到，繼續測試","把它刪掉","利用那一個後門繼續往內部深入，這樣可以節省很多測試的時間"],why:"這已經不是測試的範圍，而是事件應變。要保留現場，你繼續操作可能破壞證據，或被誤認是你做的。"},
 {t:"報告",q:"滲透測試報告通常分成「管理摘要」和「技術細節」。為什麼要分開？",a:["決策的人和動手修的人，需要的資訊不一樣","為了讓報告看起來比較厚","因為法律規定","因為管理階層依規定不可以閱讀任何含有技術內容的文件"],why:"主管要知道整體風險和該投入什麼資源；工程師要知道在哪、怎麼重現、怎麼修。混在一起兩邊都看不下去。"},
 {t:"漏洞揭露",q:"你在測試之外，發現某個常用軟體的未公開漏洞。比較負責任的做法是？",a:["通報廠商或 TWCERT/CC 這類協調單位，給合理的修補時間再公開","立刻把細節公布在社群上","賣給出價最高的人","先用這個漏洞測試幾家不相關的公司，確認真的有效之後再說"],why:"這叫負責任的揭露。讓廠商有時間修、使用者有時間更新，公開細節才不會變成幫攻擊者的忙。"}
],[
 {t:"演練目標",q:"規劃紅隊演練時，目標最好怎麼訂？",a:["以業務衝擊為目標，例如「取得某項核心資料」或「能中斷某項關鍵服務」","找到越多漏洞越好","拿到任何一台電腦","讓客戶的資訊人員在整個演練的期間都盡可能地感到緊張，這樣他們才會重視資安"],why:"紅隊是模擬真實的對手，對手要的是結果。目標對準組織最在意的東西，演練的結論才有意義。"},
 {t:"演練目標",q:"紅隊在演練中途就被藍隊發現並擋下了。這個結果應該怎麼看？",a:["這是有價值的結果，代表偵測和應變在這條路徑上有效","演練失敗，要重新來過","紅隊的能力太差","代表藍隊事先偷看了紅隊的計畫，所以這一次的結果不算數"],why:"演練的目的是驗證防禦，不是讓紅隊贏。被抓到的地方和沒被抓到的地方，都是要記錄的成果。"},
 {t:"演練管理",q:"紅隊演練時，組織內只有少數人（控制小組）事先知情。這個小組的作用是什麼？",a:["掌握進度、處理意外，並在必要時喊停","幫紅隊偷偷開後門","事先通知所有員工","在演練結束之後決定要處分哪幾位沒有發現攻擊的同仁"],why:"防守方不知情才測得出真實反應，但必須有人能分辨「這是演練還是真的」，並避免演練引發不必要的通報。"},
 {t:"授權與範圍",q:"演練計畫包含網路滲透、寄釣魚信、還有人員實地進入辦公室。授權上要注意什麼？",a:["每一種方式都要明確寫進授權，實體的部分還要準備可供查證的授權文件","只要網路的部分有授權就全部涵蓋","實體進入不需要授權","只要參與演練的人員穿著整齊並且態度有禮貌，被發現時好好解釋，就不需要額外的授權"],why:"實體滲透可能遇到保全甚至警察。身上要有授權書和緊急聯絡人，否則會變成真的刑事案件。"},
 {t:"測試類型",q:"「威脅模擬」（Threat Emulation）和一般滲透測試的差別是？",a:["刻意照某個真實攻擊族群的手法來做，測試對那個對手的防禦","只用自動化工具掃描","完全隨機地攻擊","模仿電影裡面駭客的打字速度、說話方式和螢幕上的畫面效果"],why:"如果情資顯示某個族群專打你的產業，用他們的手法演一遍，比泛泛的測試更能回答「我們擋不擋得住」。"},
 {t:"報告",q:"演練找到二十條可以打到核心系統的攻擊路徑。給修補建議時，怎麼排最有效？",a:["找出很多條路徑都會經過的共同關鍵點，優先處理","依發現的先後順序","先修最簡單的","二十條路徑各自獨立修補，而且全部都要在同一天完成"],why:"很多路徑會匯集在少數幾個點，例如某個權限過大的帳號。處理一個點，可能同時切斷十條路。"},
 {t:"紫隊",q:"演練結束後，紅隊和藍隊一起開檢討會。最有價值的做法是？",a:["把雙方的時間軸對起來：哪一步有被看到、哪一步沒有、為什麼","由紅隊展示自己有多厲害","只發書面報告，不必開會","由雙方的主管各自上台發表感想，然後請大家投票決定哪一隊表現比較好"],why:"紅隊知道自己做了什麼，藍隊知道自己看到了什麼。兩邊對起來，偵測的缺口就一目了然。"},
 {t:"授權與範圍",q:"客戶的系統架在公有雲上。測試之前，除了客戶的授權，還要確認什麼？",a:["雲端業者的測試政策允許哪些行為","雲端機房的地址","雲端業者的股價","不需要再確認任何事情，只要客戶同意就可以對雲端上的任何東西測試"],why:"底層設施是業者的，也跟其他客戶共用。超出業者允許的範圍（例如阻斷服務），客戶授權也沒有用。"}
]]},
{id:'dba',lv:[[
 {t:"查詢調校",q:"資料庫的「慢查詢紀錄」是用來做什麼的？",a:["找出執行時間過長的 SQL，當作調校的依據","記錄誰登入過資料庫","讓查詢故意變慢","把執行太久的查詢自動刪除，避免佔用資料庫的儲存空間"],why:"調校要從最花時間、最常執行的查詢下手。沒有紀錄就只能憑感覺猜。"},
 {t:"權限",q:"為什麼「人登入用的帳號」和「程式連線用的帳號」要分開？",a:["才能分辨操作是誰做的，權限也能各自給最小的","分開之後查詢會比較快","因為授權費是依帳號數量計算的","這樣程式的帳號就可以不用設定密碼，連線的時候比較方便"],why:"大家都用同一組程式帳號登入，紀錄上就看不出是程式還是哪個人做的，出事也無從追查。"},
 {t:"備份還原",q:"資料庫的備份檔，就放在資料庫所在的同一台主機上。最大的問題是？",a:["主機壞掉或被加密，備份會跟著一起沒有","備份的速度會變慢","還原的時候會需要比較多記憶體","沒有什麼問題，放在同一台主機還原的時候最快也最方便"],why:"備份要防的就是那台主機出事。至少要有一份在別的機器，最好還有一份離線或異地。"},
 {t:"結構變更",q:"要在一張幾千萬筆的資料表上新增欄位或索引。應該注意什麼？",a:["可能會長時間鎖住資料表，要安排在離峰並先測試","隨時都可以做，不會有任何影響","做之前要先把整張表清空","一定要在業務最繁忙的尖峰時段做，這樣才能確認新的欄位有沒有問題"],why:"結構變更在大表上可能跑很久，期間其他操作被擋住。先在複本上測要多久，再決定怎麼做。"},
 {t:"備份還原",q:"資料庫的交易紀錄檔越長越大，快把磁碟撐滿。最常見的原因是？",a:["一直沒有做交易紀錄的備份","資料表的數量太多","使用者的密碼太長","資料庫伺服器的時間設定錯誤，導致每一筆交易都被重複記錄了兩次"],why:"在需要保留完整紀錄的模式下，紀錄檔要備份之後才會釋放空間。沒排這個備份，它就只會一直長。"},
 {t:"複寫與高可用",q:"月底跑大型報表時，線上交易就變得很慢。架構上常見的解法是？",a:["把報表查詢導到唯讀的複本","禁止任何人跑報表","把報表改到上班的尖峰時段跑","把交易資料全部刪除，只保留最近一個星期的資料，報表就會跑得比較快"],why:"報表是大範圍的讀取，會跟交易搶資源。讀寫分離讓兩種負載各走各的。"},
 {t:"資料保存",q:"資料庫裡早已超過保存期限的資料，應該怎麼處理？",a:["依規定歸檔或刪除，並留下處理紀錄","永遠留著，資料越多越好","想到的時候再隨意刪","複製一份給每一個部門各自保管，避免之後有人需要的時候找不到"],why:"過期的個資繼續留著，只有風險沒有用處，個資法也要求目的消失或期限屆滿後要刪除或停止利用。"},
 {t:"結構變更",q:"正式資料庫的結構要變更（加欄位、改預存程序）。比較好的管理方式是？",a:["寫成腳本，進版本控制並經過審查再執行","直接用管理工具點一點改掉","請開發人員各自上去改","先在正式環境改好，之後有空的時候再回頭把測試環境改成一樣的"],why:"手動改的東西沒有紀錄、無法重現，測試和正式環境很快就不一致。腳本化之後，每次變更都查得到。"}
],[
 {t:"權限",q:"一個只用來產生報表的帳號，資料庫權限應該怎麼給？",a:["只給需要的資料表或檢視表的讀取權限","給資料庫擁有者權限，免得報表跑不出來","跟應用程式共用同一組帳號","先給它全部的權限，等到哪一天稽核提出意見的時候再慢慢收回來"],why:"報表只需要讀。用檢視表還能進一步只開放需要的欄位，把個資欄位排除在外。"},
 {t:"備份還原",q:"備份檔有加密，但解密的金鑰就放在備份檔的同一個資料夾。這樣的問題是？",a:["拿到備份的人同時拿到金鑰，等於沒有加密","沒有問題，這樣還原最方便","備份檔會變得比較大","加密過的備份檔沒有辦法複製到其他地方，所以只能把金鑰放在一起"],why:"金鑰要和資料分開保管，而且自己也要備份。金鑰弄丟，加密的備份就永遠打不開。"},
 {t:"索引",q:"資料庫為什麼需要定期做索引維護和更新統計資訊？",a:["資料變動後索引會破碎、統計會失準，查詢效能會慢慢變差","這是為了讓資料庫看起來比較忙","為了減少使用者數量","因為沒有定期維護的索引，超過一個月之後就會被資料庫自動刪除"],why:"資料庫靠統計資訊決定怎麼執行查詢。長期不維護，會出現「什麼都沒改卻越來越慢」的狀況。"},
 {t:"監控",q:"監控資料庫時，下列哪一組指標最能提早發現問題？",a:["連線數、鎖定等待時間、空間成長、慢查詢數量","機房的溫度和濕度","伺服器機殼的顏色","資料庫管理工具的視窗目前是開在螢幕的左邊還是右邊"],why:"CPU 和記憶體只是表面。連線快滿、鎖等待變長、空間成長加速，都是出事前的徵兆。"},
 {t:"備份還原",q:"做備份還原演練，還原完成後要驗證什麼才算數？",a:["資料庫開得起來、資料筆數和內容正確、應用程式連得上","還原指令沒有出現錯誤訊息就好","備份檔的檔名正確","還原所花的時間有沒有比上一次演練的時間還要短"],why:"指令成功不代表資料可用。要實際查幾筆資料、讓應用程式連上去測，並記下花了多久。"},
 {t:"資料異動安全",q:"要一次更新 500 萬筆資料。比較好的做法是？",a:["分批執行，每批提交一次","一個交易全部更新完","挑尖峰時段做","先把資料庫所有的索引和備份都刪除掉，這樣更新起來才會比較快"],why:"單一巨大交易會長時間鎖住資料、撐爆交易紀錄，失敗時回復也很久。分批可以隨時停、影響也小。"},
 {t:"稽核",q:"法規或稽核要求能回答「誰在什麼時候查過這張客戶資料表」。資料庫要具備什麼？",a:["針對敏感資料表的存取稽核紀錄","更大的硬碟","更快的 CPU","每一位使用者在查詢資料之前都先用電子郵件向資料庫管理員報備"],why:"一般的紀錄只記錯誤和登入。要能追到「誰讀了哪些資料」，必須另外啟用稽核，並把紀錄妥善保存。"},
 {t:"升級",q:"資料庫軟體的版本已經過了原廠的支援期限。最主要的風險是？",a:["新的漏洞不會再有修補","資料會自動消失","查詢語法會全部失效","原廠會從遠端把資料庫鎖起來，直到客戶付費升級之後才會解開"],why:"跟作業系統一樣，終止支援後漏洞沒人修。資料庫放的又是最重要的資料，升級要提早規劃。"}
],[
 {t:"鎖定與並行",q:"同一個交易裡，同一筆資料查了兩次，結果不一樣，因為中間被別的交易改掉並提交了。要避免這個現象，應該調整什麼？",a:["提高交易的隔離等級","加大硬碟空間","把查詢改寫成大寫","把資料庫的連線數上限調高到目前的十倍"],why:"這叫不可重複讀。隔離等級越高，交易之間越看不到彼此，但鎖定和衝突也越多，要依需求取捨。"},
 {t:"鎖定與並行",q:"「樂觀鎖定」的做法是什麼？",a:["不先鎖資料，更新時檢查版本，發現被別人改過就失敗重來","讀取時就把資料鎖住，別人完全不能動","完全不做任何檢查","假設所有的使用者都很小心，所以不需要任何的並行控制機制"],why:"衝突不多時，樂觀鎖的效能好很多。常見做法是加一個版本欄位，更新時比對。"},
 {t:"索引",q:"在 (部門, 到職日) 兩個欄位上建了一個複合索引。下列哪一個查詢用不到這個索引的主要效果？",a:["只用到職日當條件","只用部門當條件","部門和到職日都當條件","先用部門當作條件篩選，然後再依照到職日排序"],why:"複合索引像電話簿先排姓再排名。沒給第一個欄位，就沒辦法利用排序直接定位。"},
 {t:"索引",q:"「覆蓋索引」是什麼意思？",a:["查詢需要的欄位索引裡都有，不必再回資料表讀","一個索引蓋掉另一個索引","把所有欄位都建索引","把舊的索引整個刪除之後，用相同的名稱再重新建立一個"],why:"少了回表這一步，讀取量大幅減少。常用且固定欄位的查詢，很適合這樣設計。"},
 {t:"複寫與高可用",q:"資料庫的瓶頸是「寫入」量太大，單一主機已經撐不住。增加唯讀複本有幫助嗎？",a:["幫助有限，寫入還是集中在主要節點，要考慮分片或調整架構","有，複本越多寫入越快","有，只要把複本改成可寫入","沒有幫助，而且只要增加任何一台複本就一定會造成資料全部遺失"],why:"複本分擔的是讀取。寫入要分散，得把資料依某個鍵拆到多台（分片），代價是架構複雜很多。"},
 {t:"備份還原",q:"採用「完整備份＋多份交易紀錄備份」。中間有一份紀錄備份損毀了，會怎樣？",a:["只能還原到損毀那一份之前的時間點","完全沒有影響","全部的備份都不能用","資料庫會自動從其他的備份推算出損毀的那一份內容並且補上"],why:"紀錄備份是一條鏈，斷了就接不下去。所以備份要驗證完整性，並定期重做完整備份縮短鏈的長度。"},
 {t:"結構變更",q:"要把一個欄位改名，但服務不能停。比較安全的步驟是？",a:["先新增欄位並同時寫入兩邊，程式都改用新的之後再移除舊的","直接改名，程式報錯再修","先把服務停掉一整天","先把舊的欄位刪除，等使用者反應有問題的時候再把新的欄位加上去"],why:"這叫「擴充、遷移、收縮」。每一步新舊版程式都能正常運作，任何一步出問題都可以退。"},
 {t:"權限",q:"要定期更換應用程式連資料庫的密碼，又不想造成服務中斷。常見的做法是？",a:["準備兩組帳號輪替，或由密鑰管理系統讓程式動態取得","永遠不換，最安全","更換的同時把所有應用程式一起重啟","把新的密碼用電子郵件寄給每一位開發人員，請他們各自找時間修改"],why:"直接改密碼，還在用舊密碼的程式會全部斷線。雙帳號輪替讓新舊可以重疊一段時間。"}
],[
 {t:"分散式資料庫",q:"分散式資料庫的 CAP 定理說，網路分割發生時，只能在哪兩者之間選一個？",a:["一致性和可用性","速度和容量","價格和品質","備份和還原，兩者之中只能選擇保留其中一個功能"],why:"節點之間連不上時，要嘛拒絕服務以保證資料一致，要嘛繼續服務但可能讀到舊資料。"},
 {t:"分散式資料庫",q:"「最終一致性」是什麼意思？",a:["更新後各節點可能短暫不同步，但一段時間後會趨於一致","資料永遠不一致","每次讀取都保證是最新的","資料只會在每一年的最後一天晚上才進行一次全部的同步"],why:"它用短暫的不一致換來高可用和效能。適不適合要看業務：按讚數可以，帳戶餘額通常不行。"},
 {t:"複寫與高可用",q:"兩個資料中心都可以寫入（多主架構）。最難處理的問題是什麼？",a:["兩邊同時改了同一筆資料時，衝突要怎麼解決","硬碟顏色不一樣","查詢語法會不同","兩個資料中心的資料庫管理員彼此不認識，所以沒有辦法合作"],why:"以最後寫入為準會默默丟掉一邊的修改。衝突的處理規則要在設計時就決定，而且業務單位要同意。"},
 {t:"資料庫選型",q:"要儲存大量的感測器讀數，每秒寫入很多筆，查詢多半是「某段時間的趨勢」。哪一類資料庫比較適合？",a:["時序資料庫","傳統的試算表","圖形資料庫","任何一種都一樣，資料庫的種類對效能完全沒有影響"],why:"時序資料庫針對依時間寫入、壓縮和區間彙總做了最佳化。選型要看資料的形狀和查詢方式。"},
 {t:"複寫與高可用",q:"使用者送出修改後，馬上重新整理卻看到舊資料，過幾秒才變新的。架構是主要節點寫入、複本讀取。原因是？",a:["複寫有延遲，讀取剛好被導到還沒同步的複本","使用者的螢幕太舊","資料庫壞了","使用者重新整理的動作太快，瀏覽器來不及把畫面畫出來"],why:"這叫「讀不到自己剛寫的」。常見解法是剛寫入的使用者短時間內改讀主要節點。"},
 {t:"升級",q:"資料庫要跨大版本升級，又幾乎不能停機。常見的做法是？",a:["建一套新版本，用複寫同步資料，驗證後把流量切過去","直接在正式環境原地升級","先把資料全部匯出成文字檔，停機一週","在使用量最高的時段直接升級，這樣才能立刻知道有沒有問題"],why:"新舊兩套並存，切換只要幾分鐘，有問題還能切回舊的。原地升級失敗就只能還原備份。"},
 {t:"資料治理",q:"「這個欄位能不能開放給行銷部門查詢？」這個問題，應該由誰決定？",a:["資料的擁有者，也就是負責這份資料的業務單位","資料庫管理員自己決定","誰先問就給誰","由資料庫軟體的原廠工程師依照技術上的可行性來決定"],why:"DBA 是保管者，負責照決定去落實權限。資料能給誰用，是業務和法遵的判斷。"},
 {t:"成本",q:"搬到依查詢量計費的雲端資料倉儲後，帳單暴增。最該先檢查什麼？",a:["有沒有查詢在掃描不必要的大量資料，例如沒有篩選分割區","雲端業者的地址","資料表的名稱","公司同仁每天登入系統的時間，是不是都集中在早上剛上班的那一個小時"],why:"依掃描量計費時，一個沒加日期條件的查詢就可能很貴。分割、只選需要的欄位、設用量上限是基本功。"}
]]},
{id:'dev',lv:[[
 {t:"需求",q:"需求還講不清楚就開始寫程式，最常見的後果是什麼？",a:["做出來的不是對方要的，整個重做","程式的執行速度會比較慢","會用掉比較多的硬碟空間","沒有什麼後果，寫出來之後使用者自然就會知道自己到底想要什麼"],why:"先確認「做到什麼程度算完成」。花一小時問清楚，常常可以省掉一個星期的重工。"},
 {t:"測試",q:"單元測試的主要目的是什麼？",a:["確認每一小段程式的行為符合預期，改動時能馬上發現改壞了","測試使用者會不會操作","測試伺服器的硬體夠不夠力","取代所有其他種類的測試，有了單元測試之後系統就可以直接上線"],why:"有測試保護，才敢放心改舊程式。它不能取代整合測試和實際操作的驗證。"},
 {t:"版本控制",q:"Git 合併時出現「衝突」（Conflict），代表什麼？",a:["兩邊改到同一段程式，Git 沒辦法自動決定要留哪個","儲存庫壞掉了","有人把分支刪除了","網路連線中斷，導致有一部分的檔案沒有成功下載到自己的電腦上"],why:"衝突不是錯誤，是 Git 請你來判斷。看懂兩邊各改了什麼再決定，不要直接整段蓋掉別人的。"},
 {t:"HTTP",q:"HTTP 狀態碼 404 和 500，差別是什麼？",a:["404 是找不到這個資源，500 是伺服器端的程式出錯","兩個都代表成功","404 是伺服器錯誤，500 是找不到資源","404 代表使用者的網路斷線了，500 則代表使用者的瀏覽器版本太舊"],why:"4 開頭通常是請求這邊的問題（網址錯、沒權限），5 開頭是伺服器那邊的問題。排錯時先看這個。"},
 {t:"API",q:"設計 API 時，為什麼「刪除資料」不應該用 GET 來做？",a:["GET 應該只用來讀取，瀏覽器或爬蟲可能會自動去觸發它","GET 的速度比較慢","GET 沒辦法帶參數","因為 GET 的請求一定會被防火牆擋下來，沒有辦法送到伺服器"],why:"GET 被預期是安全、可重複的。預先載入、搜尋引擎、防毒掃描都可能去打連結，資料就莫名被刪了。"},
 {t:"日誌",q:"寫 log 時，下列哪一種資料不應該寫進去？",a:["密碼、金鑰、完整的身分證字號這類敏感資料","錯誤訊息","發生的時間","是哪一支程式、哪一個功能在什麼情況之下產生了這一筆紀錄"],why:"log 的權限通常比資料庫鬆，還會被送到別的系統。敏感資料寫進去，等於多一個外洩的地方。"},
 {t:"輸入驗證",q:"網頁上已經用 JavaScript 檢查過輸入格式了，後端還需要再檢查一次嗎？",a:["需要，前端的檢查可以被繞過","不需要，檢查一次就夠了","看使用者有沒有登入","不需要，而且重複檢查會讓系統慢很多，使用者會明顯感覺到延遲"],why:"前端的檢查是為了使用體驗。攻擊者可以直接對 API 送請求，完全不經過你的網頁。"},
 {t:"執行環境",q:"為什麼要把開發、測試、正式環境分開？",a:["避免還沒測好的程式或測試資料影響到正式的服務","這樣可以多買幾台伺服器","只是業界的習慣，沒有實際的作用","分開之後開發人員就不需要寫測試，因為測試環境會自動幫忙測試所有的功能"],why:"在正式環境直接改，一個小錯就是線上事故。分開之後，可以放心試、試壞了也沒關係。"}
],[
 {t:"網站安全",q:"網頁把使用者輸入的留言原封不動顯示出來，結果別人打開頁面時被執行了惡意的 JavaScript。這是什麼漏洞？該怎麼防？",a:["XSS，輸出到頁面時要做編碼","SQL Injection，要用參數化查詢","暴力破解，要鎖定帳號","阻斷服務攻擊，要增加伺服器的頻寬並且多買幾台主機來分散流量"],why:"跨站腳本（XSS）的根本解法是輸出時依情境編碼，讓瀏覽器把它當成文字而不是程式。"},
 {t:"錯誤處理",q:"程式出錯時，把完整的錯誤堆疊和 SQL 語句直接顯示在使用者的畫面上。這樣有什麼問題？",a:["洩漏系統內部的結構，給攻擊者線索","沒有問題，這樣使用者才能自己解決","會讓網頁變慢","使用者會因為看不懂這些訊息而感到困擾，除此之外並沒有其他的問題"],why:"詳細的錯誤寫進 log 給自己看；給使用者的只要一句看得懂的訊息和一個可以回報的代碼。"},
 {t:"版本控制",q:"正式環境出現嚴重的 bug 要緊急修。而開發分支上已經有一堆還沒測完的新功能。該怎麼做？",a:["從正式版本開一個修補分支，修好後合併回正式和開發兩邊","直接把開發分支整個上線","等新功能全部測完再一起修","直接登入正式環境的伺服器手動修改程式，之後有空再補回版本控制"],why:"修補只帶必要的改動，不夾帶沒測過的東西。修完也要合回開發分支，不然下次上版 bug 又回來。"},
 {t:"版本控制",q:"版本號 <code>2.4.1</code> 升到 <code>3.0.0</code>，依語意化版本的慣例，代表什麼？",a:["有不相容的重大變更","只修了小 bug","只加了新功能，完全相容","代表這已經是這個軟體的第三次發行，跟內容有沒有變更沒有關係"],why:"格式是「主版號.次版號.修訂號」。主版號變動表示可能要改程式才能升級，升之前要先看變更說明。"},
 {t:"密碼儲存",q:"儲存使用者密碼，為什麼不該用 MD5 或 SHA-1，而要用 bcrypt、Argon2 這類演算法？",a:["後者是刻意設計得很慢，讓暴力破解的成本變高","後者產生的字串比較短","MD5 需要付授權費","因為後者可以把密碼解密還原回來，使用者忘記密碼的時候比較方便查詢"],why:"一般的雜湊算得很快，顯示卡一秒能試幾十億組。密碼專用的演算法又慢又可調，還內建加鹽。"},
 {t:"授權檢查",q:"使用者登入後，把網址上的 <code>id=1001</code> 改成 <code>id=1002</code>，就看到別人的資料。問題出在哪？",a:["只檢查了有沒有登入，沒檢查這筆資料是不是他的","密碼太短","網站沒有用 HTTPS","資料庫的編號不應該使用連續的數字，改成用亂數編號就可以完全解決"],why:"驗證是「你是誰」，授權是「你能做什麼」。每次存取資料都要在後端檢查擁有者，不能只靠隱藏網址。"},
 {t:"測試",q:"你的程式要呼叫第三方的金流 API。自動化測試時應該怎麼處理？",a:["用模擬的替身或對方提供的測試環境","每次測試都真的刷一筆","跳過這段不測","請第三方廠商在我們每一次執行測試之前，先暫時把他們的收費功能關閉"],why:"測試要能重複跑、不產生真實的副作用。把外部服務隔開，也才能測到「對方回錯誤或逾時」的情況。"},
 {t:"文件",q:"一個專案的 README，最基本應該讓讀的人做到什麼？",a:["知道這是什麼，並且能把它跑起來","了解作者的心路歷程","背下所有的程式碼","知道這個專案從開始到現在的每一次會議上，大家各自說了什麼話"],why:"接手的人（包括半年後的自己）最需要的是：這做什麼、怎麼安裝、怎麼啟動、設定放哪裡。"}
],[
 {t:"網站安全",q:"使用者登入網路銀行後，又點了惡意網站，該網站偷偷以他的身分送出轉帳請求。這是什麼攻擊？常見的防護是？",a:["CSRF，用防偽權杖和 SameSite Cookie","XSS，把輸出編碼","SQL Injection，用參數化查詢","暴力破解，限制密碼輸入錯誤的次數並且鎖定帳號"],why:"跨站請求偽造利用的是瀏覽器會自動帶上 Cookie。伺服器要能確認請求真的來自自己的頁面。"},
 {t:"API",q:"付款 API 因為網路逾時，用戶端自動重送了一次。要避免扣兩次款，API 應該怎麼設計？",a:["讓用戶端帶一個唯一的請求識別碼，伺服器對同一個識別碼只處理一次","禁止用戶端重送","每次都直接扣款","在扣款之後等待十分鐘，確認沒有重複的請求之後再回覆結果"],why:"這是冪等鍵。網路不可靠，重送一定會發生，所以要讓「重送」是安全的。"},
 {t:"快取",q:"為了加速，把查詢結果放進快取。最需要小心處理的是什麼？",a:["原始資料變更時，快取要怎麼更新或失效","快取的名稱要取得好聽","快取要放在最貴的伺服器上","快取裡面的資料要定期全部列印出來，交由主管逐筆核對簽名"],why:"快取沒更新，使用者就會看到舊資料。要想清楚多久過期、資料改了誰去清、能接受多舊。"},
 {t:"系統整合",q:"兩個系統之間改用「訊息佇列」傳遞工作，而不是直接互相呼叫。主要的好處是？",a:["對方暫時掛掉或變慢時，工作先排著，不會一起被拖垮","傳輸的速度一定比較快","不需要寫任何程式","兩個系統之間就再也不需要約定資料的格式和欄位"],why:"佇列讓兩邊解耦：送的人不必等、收的人依自己的速度處理，尖峰時還能當緩衝。"},
 {t:"部署策略",q:"這次上版同時改了資料庫結構和程式。部署時應該注意什麼順序？",a:["資料庫的變更要同時相容新舊版程式，才能逐步切換或退版","先刪掉舊欄位，再部署新程式","順序不重要","先把正式環境的資料全部清空，這樣結構的變更才不會發生衝突"],why:"部署期間新舊版程式會同時存在，退版時舊程式還要能跑。不相容的變更要拆成多次上版。"},
 {t:"API",q:"對外開放的 API 加上「速率限制」（Rate Limiting），是為了防什麼？",a:["單一來源短時間內大量呼叫，拖垮服務或暴力嘗試","使用者輸入錯別字","資料庫欄位太多","開發人員在下班之後還繼續加班修改程式"],why:"沒有限制，一支寫壞的程式或一個攻擊者就能把服務打掛，登入類的 API 也會被拿來猜密碼。"},
 {t:"可觀測性",q:"一個請求會經過好幾個服務。排查問題時，怎麼把各個服務的紀錄串在一起？",a:["每個請求帶一個追蹤識別碼，一路傳下去並寫進每筆紀錄","用時間大概對一下","每個服務各自看各自的","請使用者把他當時的操作步驟重新做一遍，同時所有人盯著螢幕看"],why:"有了同一個識別碼，用它一搜就能看到這個請求在每個服務發生了什麼。靠時間對，量一大就對不起來。"},
 {t:"身分驗證",q:"系統需要登入和授權功能。比較穩當的做法是？",a:["採用成熟的標準和框架（例如 OAuth 2.0、OpenID Connect）","自己設計一套加密和驗證的方法","把密碼用 Base64 編碼就好","為了方便使用者，登入之後就不再檢查任何權限"],why:"身分驗證的細節非常容易出錯，自己發明幾乎一定有洞。用經過大量檢驗的標準和函式庫。"}
],[
 {t:"架構",q:"把單體系統拆成微服務，最主要的代價是什麼？",a:["部署、監控、除錯和資料一致性都變得複雜很多","程式一定會變慢","不能再用資料庫","每一個微服務都必須要使用不同的程式語言來開發"],why:"微服務換來的是團隊可以獨立部署和擴充。團隊小、系統不大時，單體通常更簡單也更可靠。"},
 {t:"系統整合",q:"一筆訂單要依序呼叫付款、庫存、出貨三個服務，中途可能失敗，又沒辦法用同一個資料庫交易包起來。常見的設計是？",a:["每一步都有對應的補償動作，失敗時反向取消已完成的步驟","失敗就算了","讓使用者自己打電話處理","把三個服務的程式碼全部複製貼到同一個檔案裡面，這樣就不會有呼叫失敗的問題"],why:"這是 Saga 模式。跨服務沒有真正的回滾，只能靠「退款」「釋放庫存」這類補償，把狀態拉回來。"},
 {t:"錯誤處理",q:"呼叫的下游服務開始大量逾時。為什麼需要「斷路器」（Circuit Breaker）？",a:["暫時停止呼叫並快速失敗，避免自己的資源被耗盡、連鎖倒下","讓呼叫的次數變多","把下游服務關機","讓每一個失敗的請求都立刻自動重試一千次，一直到成功為止"],why:"一直等逾時，自己的執行緒和連線會被占滿。斷路器先擋掉，過一陣子再試探對方恢復了沒。"},
 {t:"安全開發",q:"「威脅建模」最應該在開發流程的哪個階段做？",a:["設計階段，還沒開始寫程式之前","上線之後","被攻擊之後","專案結束、開發人員都已經調到其他專案之後"],why:"設計上的問題最貴，越晚發現越難改。先問「誰會想攻擊這裡、怎麼攻擊、我們怎麼擋」。"},
 {t:"效能",q:"系統很慢，團隊想開始優化。第一步應該是什麼？",a:["先量測，找出時間實際花在哪裡","把所有程式重寫一遍","換更貴的伺服器","請每一位開發人員各自猜一個最可能的原因，然後大家同時動手修改"],why:"憑感覺優化常常改錯地方。有了量測數據，才知道瓶頸在哪，改完也才知道有沒有效。"},
 {t:"架構",q:"一套十幾年的舊系統要汰換。比起「全部重寫、一次切換」，哪一種做法風險比較低？",a:["逐步把功能一塊一塊搬到新系統，新舊並行直到舊的可以關掉","全部重寫，三年後一次上線","不汰換","先把舊系統整個關掉，讓使用者暫時改用紙本作業，一直到新系統全部開發完成"],why:"這叫絞殺者模式。每次只換一小塊，隨時可以調整方向，不會賭一把大的。"},
 {t:"系統整合",q:"事件驅動架構中，事件的格式要增加欄位。怎麼做才不會弄壞還沒更新的訂閱者？",a:["只新增選填欄位，不移除或改變既有欄位的意義","直接改掉原本的欄位名稱","通知大家當天一起更新","每一次修改格式的時候都同時把所有的歷史事件刪除"],why:"發布者和訂閱者不會同時升級。向後相容的演進（只加不改）讓雙方可以各自的步調更新。"},
 {t:"供應鏈安全",q:"建置和部署的管線（CI/CD）為什麼是重要的保護對象？",a:["它能把程式送上正式環境，被入侵等於可以在所有產出裡植入惡意程式","因為它很貴","因為它跑得很慢","因為管線的設定畫面非常複雜，一般的開發人員看不懂，所以要找專人保護它不被亂改"],why:"管線握有金鑰和部署權限。要用最小權限、保護密鑰、審查變更，並對產出的成品簽章。"}
]]},
{id:'grc',lv:[[
 {t:"管理系統",q:"管理系統常講的 PDCA 是指什麼？",a:["規劃、執行、檢查、改善的循環","四種加密演算法","四個資安等級","採購、開發、建置、驗收這四個資訊專案一定要經過的階段"],why:"ISO 27001 的精神就是這個循環：訂計畫、照著做、檢查有沒有效、把問題改掉，然後再來一輪。"},
 {t:"資產管理",q:"建立 ISMS 時，為什麼通常從「資產清冊」開始？",a:["不知道有什麼要保護，就沒辦法評估風險","因為稽核員只看這一份文件","因為它是所有文件裡最簡單的","清冊可以取代風險評鑑，有了清冊之後就不需要再另外評估每一項的風險"],why:"資產、威脅、弱點合起來才是風險。清冊漏掉的系統，後面的風險評鑑和控制也都不會涵蓋到它。"},
 {t:"風險管理",q:"風險評鑑時，風險值最常見的算法是？",a:["發生的可能性 × 造成的衝擊","資產的購買價格 × 使用年限","員工人數 ÷ 電腦數量","去年發生的資安事件件數，加上今年預計會發生的資安事件件數"],why:"很可能發生但影響很小、和很少發生但一發生就很嚴重，都要考慮。兩個乘起來才能排出先後順序。"},
 {t:"稽核",q:"稽核員問：「帳號有定期清查嗎？」你回答「有」。接下來稽核員會要什麼？",a:["可以證明有做的紀錄","你的口頭保證","主管的簽名照","一份由你當場寫下來的切結書，保證每一季都有確實執行帳號的清查"],why:"稽核看的是證據。說有做但拿不出紀錄，在稽核上等同沒有做。"},
 {t:"稽核",q:"稽核發現「整個帳號清查的程序從來沒有執行過」。這比較可能被判定成什麼？",a:["主要不符合","觀察事項","改善建議","符合事項，因為程序文件已經有訂定出來了，只是還沒有時間開始執行"],why:"整個控制沒有運作，屬於系統性的失效，是主要不符合。偶發的單一缺漏通常才是次要不符合。"},
 {t:"管理審查",q:"ISO 27001 要求定期召開「管理審查」。它的目的是什麼？",a:["讓最高管理階層檢視 ISMS 的成效，並決定資源和改善方向","讓資訊人員互相檢查彼此的工作","審查員工的出勤狀況","由外部的驗證公司來決定組織下一個年度的資訊安全預算應該編列多少"],why:"資安要有效，高層必須知道現況並給資源。管理審查就是把這件事固定下來的機制。"},
 {t:"政策",q:"組織的資訊安全政策，應該由誰核准？",a:["最高管理階層","資訊單位的承辦人","委外的廠商","每一位員工各自決定自己要遵守哪些規定，再彙整起來成為政策"],why:"政策代表組織的承諾，也是往下訂所有程序的依據。由高層核准，推動時才有正當性。"},
 {t:"稽核",q:"內部稽核和外部的驗證稽核，主要差別是什麼？",a:["內稽是組織自己查自己有沒有做到，驗證稽核是第三方來判斷能否發證","內稽不需要留紀錄","外部稽核只看文件，不會到現場","內部稽核的結果在法律上具有強制力，外部的驗證稽核則只是僅供參考"],why:"內稽是自己先找問題並改善；驗證稽核由驗證機構執行，結果決定證書的發放和維持。"}
],[
 {t:"風險管理",q:"公司替機房買了火災保險。在風險處理的四種選項裡，這屬於哪一種？",a:["轉移","降低","避免","接受"],why:"保險是把財務損失轉給保險公司，風險本身還在。降低是做控制措施，避免是乾脆不做那件事。"},
 {t:"控制措施",q:"機房裝了監視器並且錄影。依控制措施的類型，這主要屬於哪一種？",a:["偵測性控制","預防性控制","矯正性控制","補償性控制"],why:"門禁是預防（不讓進），監視器是偵測（發生了看得到），備份還原是矯正（事後復原）。"},
 {t:"控制措施",q:"「職務區隔」的目的是什麼？",a:["不讓一個人能獨自完成整個敏感流程，降低舞弊和錯誤","讓每個人的工作量平均","減少加班","讓各個部門之間彼此不需要溝通，各自把份內的事情做好就可以"],why:"例如申請權限的人不能自己核准、寫程式的人不能自己上線。要兩個人串通才能出事，風險就低很多。"},
 {t:"供應商管理",q:"把系統委外給廠商。合約裡最應該放進哪一類條款？",a:["資安要求、事件通報義務和稽核權","廠商的公司沿革","廠商員工的服裝規定","廠商每一年都要寄送賀卡和月曆給機關的每一位承辦人員"],why:"沒寫進合約，出事時就沒有依據要求對方配合。稽核權讓你能確認廠商真的有做到。"},
 {t:"教育訓練",q:"要評估資安教育訓練有沒有效，哪一種方式比較好？",a:["看實際行為有沒有改變，例如釣魚演練的點擊率和回報率","看簽到表的出席率","看教材的頁數","看講師的學歷和年資，以及這一堂課總共上了幾個小時"],why:"出席不等於學會。訓練的目的是改變行為，所以要量行為。"},
 {t:"例外管理",q:"某個單位因為業務需要，確實無法遵守一項資安規定。正確的處理方式是？",a:["提出例外申請，載明原因、期限和補償措施，經核准後列管","私下不遵守就好","把那項規定整個廢除","要求這個單位的同仁簽署切結書，保證以後如果出事的話會自行負責"],why:"規定不可能涵蓋所有狀況。例外要看得見、有期限、有人核准，到期重新檢視，才不會變成永久的漏洞。"},
 {t:"營運持續",q:"「營運衝擊分析」（BIA）主要是在分析什麼？",a:["各項業務中斷後的影響，以及能容忍中斷多久","競爭對手的營運狀況","員工的滿意度","公司過去五年的財務報表，以及未來五年預估的營業收入成長率"],why:"BIA 的結果決定哪些系統要優先恢復、RTO 和 RPO 要訂多少。沒有它，備援的投資就是憑感覺。"},
 {t:"紀錄管理",q:"稽核紀錄和系統日誌，在保存上最重要的兩件事是？",a:["保存夠久，而且不能被竄改","字體要好看","檔案越小越好","每一天都要列印成紙本，並且由承辦人和主管逐頁蓋章之後歸檔"],why:"紀錄留不夠久，事後查不到；可以被改，就失去證據力。保存期限要依法規和內部規定。"}
],[
 {t:"風險管理",q:"「風險胃納」是指什麼？",a:["組織為了達成目標，願意承擔多少風險","風險發生的機率","資安預算的金額","稽核人員在一次稽核當中，最多可以開出幾項不符合"],why:"它是管理階層訂的上限。風險評鑑的結果要拿來跟它比，超過的才需要處理，否則永遠做不完。"},
 {t:"控制措施",q:"稽核一項控制措施時，「設計有效」和「執行有效」的差別是？",a:["前者看規定寫得對不對，後者看實際上有沒有照做","兩者是同一件事","前者看預算，後者看人力","前者是由外部稽核負責，後者則一律由內部稽核負責"],why:"規定寫得再好，沒人照做就沒用；照做了但規定本身有漏洞也沒用。兩個都要成立，控制才算有效。"},
 {t:"風險管理",q:"「關鍵風險指標」（KRI）的用途是什麼？",a:["提早顯示風險正在升高的訊號","計算員工的績效獎金","記錄已經發生的損失","統計公司每一年總共通過了多少張國際標準的驗證證書"],why:"例如「逾期未修補的高風險弱點數」持續上升，就該在出事前處理。它是往前看的指標。"},
 {t:"供應商管理",q:"公司有上百家供應商。資安管理上比較實際的做法是？",a:["依接觸的資料和系統重要性分級，高風險的才做深入評估","每一家都做同樣完整的實地稽核","全部都不管","只評估合約金額最高的前三家，其他的供應商都可以直接略過"],why:"資源有限。能碰到核心系統或大量個資的廠商要嚴格管，送便當的廠商不需要填資安問卷。"},
 {t:"稽核",q:"稽核時沒辦法檢查每一筆紀錄，所以用「抽樣」。抽樣最重要的原則是？",a:["樣本要有代表性，而且由稽核員決定抽哪些","由受稽單位挑最好的給稽核員看","只抽最近一天的","每一次都固定抽同樣的那幾筆，這樣才能前後比較"],why:"讓受稽方自己挑，看到的當然都沒問題。抽樣的方法和範圍也要記錄，結論才站得住腳。"},
 {t:"驗證範圍",q:"ISO 27001 的驗證範圍只涵蓋「資訊機房」。對外宣稱時要注意什麼？",a:["只能說範圍內通過驗證，不能講成整個組織都通過","可以說全公司都通過","範圍不需要讓別人知道","只要通過一個範圍，其他所有的部門也會自動被視為通過"],why:"證書上會載明範圍。範圍外的系統沒有被稽核過，客戶或主管機關問起來要講清楚。"},
 {t:"法規遵循",q:"公司同時要符合資安法、個資法、ISO 27001 和客戶的要求，條文很多重疊。比較有效率的做法是？",a:["建立一份控制措施對照表，一項控制對應多個要求","每一個法規各做一套獨立的制度","只挑最簡單的一個做","等到每一個要求各自來稽核的時候，再臨時準備那一份需要的文件"],why:"「帳號定期清查」可能同時滿足四個來源的要求。對照之後做一次、留一份證據，各方來查都能用。"},
 {t:"法規遵循",q:"發生一件同時涉及系統被入侵和個資外洩的事件。在法遵上要注意什麼？",a:["資安法和個資法的義務要分別檢視，可能都要通報或通知","只要擇一處理即可","等媒體報導之後再決定","只要內部有開過檢討會議並且留下會議紀錄，就不需要再對外通報"],why:"兩部法管的面向不同：一個是資通系統的事件通報，一個是個資事故的通報和通知當事人，時限和對象也不一樣。"}
],[
 {t:"向上報告",q:"向董事會或最高管理階層報告資安，最有效的方式是？",a:["用業務風險和影響來說明，並提出需要他們決定的事","詳細說明每一項技術細節","只報告好消息","把過去一年所有的告警紀錄全部列印出來，請他們逐筆閱讀"],why:"他們的角色是決定風險胃納和資源。把技術問題翻成營運、財務、法遵和商譽的影響，他們才能做決定。"},
 {t:"法規遵循",q:"「合規不等於安全」是什麼意思？",a:["通過稽核只代表符合條文的最低要求，不代表擋得住實際的攻擊","合規的組織一定不會被入侵","安全的組織不需要合規","只要順利拿到驗證證書，之後就可以不用再投入任何資源在資安上面"],why:"標準是通用的底線，攻擊者不看你的證書。要以實際風險為出發點，合規是順帶的結果。"},
 {t:"風險管理",q:"量化風險時，常用「單次損失 × 每年發生次數」來估年度預期損失。這個數字主要用來做什麼？",a:["和控制措施的成本比較，判斷投資值不值得","用來決定員工的薪水","向客戶收費","用來決定公司的股價，並且每一季公告給所有的投資人"],why:"花 500 萬去降低一個每年預期損失 50 萬的風險，通常不划算。數字不精確沒關係，重點是有比較的基礎。"},
 {t:"資安文化",q:"要建立資安文化，下列哪一件事影響最大？",a:["高層自己遵守規定，並公開支持","多貼幾張海報","把規定寫得更厚","每一年舉辦一次資安口號比賽，並且頒發獎金給第一名"],why:"主管要求特權、帶頭繞過規定，其他人就知道規定是可以不理的。文化是看上面怎麼做，不是怎麼說。"},
 {t:"AI 治理",q:"組織裡開始有人自行使用生成式 AI 工具處理公務。治理上第一步應該做什麼？",a:["訂出使用政策：哪些資料可以輸入、哪些工具可以用，並評估風險","全面禁止，不討論","完全不管","等到真的有同仁把機密資料輸入進去、並且造成外洩之後，再開始討論要怎麼管"],why:"禁不了，也不該放任。先講清楚界線（特別是個資和機密），再依風險逐步開放和管理。"},
 {t:"管理系統",q:"組織要同時維持資訊安全、個資保護、營運持續好幾套管理系統。怎麼做比較不會重工？",a:["整合成一套：共用政策架構、風險評鑑、內部稽核和管理審查","每一套各由不同的團隊獨立運作","只維持其中一套","每一套管理系統各自使用完全不同的文件格式和編號方式，以方便區分"],why:"這些標準的骨架相同。整合後同一場稽核、同一份風險登錄可以服務多個標準，承辦人也不必重複準備。"},
 {t:"稽核",q:"同一項稽核缺失連續三年都被開出來。這代表什麼？",a:["矯正機制本身失效了，要提升到管理階層處理","稽核員太挑剔","明年再改就好","這一項缺失其實並不重要，所以可以請稽核員以後不要再開"],why:"個別缺失是執行問題，重複發生是治理問題：沒人負責、沒資源、或根本原因沒處理。"},
 {t:"資安預算",q:"資安投資很難算出「賺了多少」。爭取預算時，比較站得住腳的論述是？",a:["說明降低了哪些風險的可能性和衝擊，以及不做的後果","保證以後絕對不會出事","強調別人都有買","告訴高層如果不通過這一筆預算，資安團隊就會全體離職"],why:"資安是在買風險的降低，不是買報酬。沒有人能保證不出事，但可以說清楚風險從哪裡降到哪裡。"}
]]},
{id:'mgmt',lv:[[
 {t:"服務管理",q:"ITIL 是什麼？",a:["一套 IT 服務管理的實務做法","一種程式語言","一個資安漏洞的編號","政府規定所有資訊人員上班之前都必須要先考取的一張專業證照"],why:"ITIL 整理了事件、問題、變更、服務台這些流程的做法。不必全部照抄，挑適合自己組織的用。"},
 {t:"服務管理",q:"「我的電腦開不了機」和「我要申請一個新帳號」，在服務管理上分別屬於什麼？",a:["前者是事件，後者是服務請求","兩個都是事件","兩個都是變更","前者是問題管理的範圍，後者則是屬於重大資安事故，需要立即通報"],why:"事件是「本來能用的壞了」，要盡快恢復。服務請求是「申請一項標準的服務」，照流程處理就好。"},
 {t:"專案管理",q:"專案管理常說的三個互相牽動的限制是什麼？",a:["範圍、時間、成本","硬體、軟體、網路","開發、測試、上線","老闆、主管、同事，這三種人的意見只要有一方不同意專案就無法進行"],why:"範圍變大，時間或成本一定要跟著動。只加需求、不加時間也不加人，最後犧牲的就是品質。"},
 {t:"採購",q:"採購規格如果寫成只有某一家廠牌的產品才能符合，會有什麼問題？",a:["沒有競爭，價格和服務都容易被牽著走，也可能違反採購規定","沒有問題，這樣品質最有保障","驗收會比較簡單","交貨的時間會變得比較長，因為指定廠牌的產品通常都需要從國外進口"],why:"規格應該寫「需要的功能和效能」，不是抄某一家的型錄。綁規格在很多組織也是稽核的重點。"},
 {t:"合約",q:"簽訂系統的維護合約時，下列哪一項最需要白紙黑字寫清楚？",a:["服務水準：多久回應、多久到場、沒做到怎麼辦","廠商業務人員的姓名","合約書的紙張大小","廠商公司的成立年份、資本額，以及歷年來得過哪些業界的獎項"],why:"「盡快處理」不是承諾。回應和修復時間、服務時段、罰則都寫明，出事時才有依據。"},
 {t:"成本",q:"評估要買哪一套系統時，「總持有成本」（TCO）是指什麼？",a:["購買、建置、維護、人力、汰換全部加起來的成本","只有購買當下的價格","每年的電費","這一套系統預計在未來五年之內可以替公司多賺進來的營業收入"],why:"買的時候便宜，維護費、授權費和需要的人力可能貴得多。要看整個使用年限的總花費。"},
 {t:"供應商管理",q:"「廠商鎖定」（Vendor Lock-in）是指什麼風險？",a:["太依賴單一廠商的技術或格式，之後想換會非常困難又昂貴","廠商把機房的門鎖起來","廠商不願意報價","廠商派來的工程師因為簽了保密合約，所以不可以在其他的公司兼職"],why:"資料格式、專屬技術、只有原廠會維護，都會讓你失去談判籌碼。評估時要先想「退場要怎麼退」。"},
 {t:"績效指標",q:"幫團隊訂 KPI，下列哪一個原則最重要？",a:["量得出來，而且真的跟要達成的目標有關","越多項越好","只挑一定能達成的","每一年都要訂得比前一年更高，不論實際的資源和工作量有沒有改變"],why:"量不出來的指標沒辦法追蹤；跟目標無關的指標會把大家帶去做沒有意義的事。"}
],[
 {t:"變更管理",q:"變更諮詢委員會（CAB）存在的目的是什麼？",a:["讓相關的人在變更前一起評估風險和影響","增加行政流程","決定誰要負責","讓所有的變更都延後至少一個月才能執行，藉此降低變更的次數"],why:"做變更的人常看不到對別的系統的影響。找相關單位一起看，可以避開撞期和沒想到的連鎖反應。"},
 {t:"變更管理",q:"半夜為了搶修做了一項緊急變更，來不及走正常的審核。事後應該怎麼做？",a:["補上變更紀錄並做事後審查","既然修好了就不用補","當作沒發生過","把那一項變更還原回去，等白天走完完整的審核流程之後再重新做一次"],why:"緊急變更可以先做，但不能沒有紀錄。事後審查也能檢討：這次緊急是不是本來可以避免的。"},
 {t:"專案管理",q:"專案進行到一半，使用單位不斷追加「順便做一下」的小需求。這叫範圍蔓延。該怎麼處理？",a:["走變更請求流程，評估對時程和成本的影響後再決定","全部答應，客戶至上","全部拒絕","先全部答應下來，等到專案快要結束的時候再告訴對方來不及做"],why:"每個「順便」都有成本。讓提出的人看到代價，由有權責的人決定要不要加、要不要延期或加資源。"},
 {t:"專案管理",q:"專案的「風險登錄表」是用來做什麼的？",a:["事先列出可能出問題的地方、負責人和因應方式","記錄誰遲到","登記設備的財產編號","在專案失敗之後，用來記錄每一個人應該要負擔多少比例的責任"],why:"風險先講出來、有人盯著，發生時就不是意外。定期檢視，新的加進來、解除的劃掉。"},
 {t:"採購",q:"廠商說「系統已經建置完成」。驗收時應該依據什麼？",a:["合約和規格書上寫明的驗收條件，逐項實際測試","廠商的口頭說明","廠商提供的簡報","專案的款項是否已經全部付清，以及廠商的工程師是否已經撤離現場"],why:"驗收是付款前最後的把關。沒有逐項測試就簽收，之後發現問題就變成「另外報價」。"},
 {t:"成本",q:"買斷一批伺服器，和改用每月付費的雲端服務。在預算上分別屬於什麼？",a:["前者是資本支出，後者是營運支出","兩者都是資本支出","兩者都是人事費用","前者屬於業務部門的行銷預算，後者則是屬於總務部門的雜項支出"],why:"資本支出一次投入、分年折舊；營運支出逐期認列。兩者在預算編列、核准流程和稅務上都不同。"},
 {t:"知識傳承",q:"資深同仁即將退休，很多系統只有他最熟。最該優先做什麼？",a:["安排交接期，把知識寫成文件並讓接手的人實際操作","請他退休後隨時接電話","等他走了再說","請他把所有的資料都列印出來裝箱，放在倉庫裡面以備不時之需"],why:"知識在人腦裡，人走就沒了。文件加上實作，而且要趁他還在的時候讓接手的人問問題。"},
 {t:"供應商管理",q:"為什麼要定期評核維護廠商的表現？",a:["確認服務有達到合約水準，並作為續約或更換的依據","為了找理由扣款","只是例行公事","讓廠商知道機關有在注意他們，除此之外評核的結果並不會有任何用途"],why:"沒有評核，續約就只憑印象。把回應時間、修復時間、重複故障這些數字留下來，談判才有依據。"}
],[
 {t:"策略",q:"訂定資訊部門的年度計畫時，最應該先對齊什麼？",a:["組織的業務目標和優先順序","最新、最熱門的技術","其他公司買了什麼","資訊部門的同仁各自最想要學習和嘗試的技術項目"],why:"資訊是為了支持業務。先知道組織今年要做什麼，才知道資源該放哪裡，也才爭取得到支持。"},
 {t:"自建或外購",q:"一項新需求，要自己開發、買現成的產品，還是委外？判斷時最關鍵的問題是？",a:["這是不是我們的核心能力，以及長期誰來維護","哪一個最便宜","哪一個最快","哪一個做法可以讓資訊部門的編制人數增加得最多"],why:"核心、差異化的東西值得自己掌握；通用的功能買現成的。不管哪一種，都要先想清楚三年後誰在顧。"},
 {t:"人才",q:"要留住技術人才，除了薪資，哪一件事最有幫助？",a:["讓人看得到成長的路徑，並有機會做有挑戰性的事","規定離職要賠償違約金","增加打卡的次數","把所有重要的工作都集中交給最資深的那一位同仁來處理"],why:"技術人員很在意「有沒有在進步」。沒有往上的路、每天只做重複的事，待遇再好也留不久。"},
 {t:"專案管理",q:"明年想做的專案有二十個，資源只夠做八個。應該怎麼決定？",a:["用一致的標準（效益、風險、法規要求、成本）評分排序","先做最早提出來的","先做提案人職位最高的","二十個專案全部同時啟動，每一個都先做一點點再說"],why:"沒有共同標準，就變成誰聲音大誰贏。同時做太多，結果是每個都延誤。"},
 {t:"技術債",q:"老舊系統的技術債越積越多，但每年預算都被新專案用光。比較可行的做法是？",a:["固定保留一定比例的資源，專門用來償還技術債","等系統完全不能用再處理","全部停下來，花一年重寫","規定以後所有的新專案都不可以再使用任何新的技術"],why:"技術債不會自己消失，只會越來越貴。固定撥出一部分，才不會永遠被「更急的事」擠掉。"},
 {t:"危機溝通",q:"發生重大資安事件，媒體開始打電話到各個部門詢問。組織應該怎麼應對？",a:["由指定的單一窗口統一對外說明","各部門各自回答自己知道的","一律不回應","請最了解技術細節的那一位工程師直接接受媒體的採訪"],why:"多頭對外，說法不一致，會讓事情更糟。對外的內容要和法務、公關、管理階層確認過。"},
 {t:"成本",q:"把資訊成本依使用量攤給各部門（或至少讓各部門看到自己用了多少）。這樣做的目的是？",a:["讓使用單位知道資源有成本，需求會比較實際","讓資訊部門賺錢","增加會計的工作量","讓各個部門以後都自己去採購電腦和軟體，不需要再經過資訊部門"],why:"資源免費時，需求是無限的。看得到成本，各單位才會自己衡量「這個需求值不值得」。"},
 {t:"授權與代理",q:"主管出國兩週，期間有需要核准的緊急變更。事前應該安排什麼？",a:["明確指定代理人和授權範圍","請大家等他回來","讓每個人自己決定","請同仁在需要核准的時候，直接模仿主管的筆跡代為簽名"],why:"決策權沒有交代清楚，緊急時不是沒人敢決定，就是有人越權決定。授權範圍要事先講明。"}
],[
 {t:"數位轉型",q:"很多「數位轉型」專案最後失敗。最常見的主因是什麼？",a:["流程和人沒有跟著改變，只是把舊做法搬上新系統","買的伺服器不夠快","網路頻寬不足","專案的名稱取得不夠響亮，所以沒有辦法吸引同仁的注意"],why:"技術通常不是問題。流程不重新設計、使用者不買單、主管不支持，再好的系統也只是多一個要填的東西。"},
 {t:"組織設計",q:"資訊人力要「集中在總部」還是「分散到各單位」？兩者的取捨是什麼？",a:["集中容易統一標準和省成本，分散比較貼近現場需求","集中一定比較好","分散一定比較好","兩種做法完全沒有差別，只是組織圖畫起來的樣子不一樣"],why:"沒有標準答案。常見的折衷是：基礎設施和資安集中，貼近業務的應用和支援放在單位裡。"},
 {t:"委外策略",q:"決定哪些工作可以委外時，哪一類最不適合全部交出去？",a:["對組織很關鍵、需要自己掌握判斷的核心能力","例行、標準化的作業","短期的尖峰人力","辦公室的清潔工作、飲水機的濾心更換以及影印機的定期保養"],why:"核心能力全部委外，組織就失去判斷廠商做得好不好的能力，也很難再收回來。"},
 {t:"系統整合",q:"兩個組織合併，各有一套系統。整合規劃時最先要釐清的是什麼？",a:["業務上要整合到什麼程度，再決定系統怎麼併","哪一邊的伺服器比較新","哪一邊的工程師比較多","兩邊的系統哪一套的畫面比較漂亮，以及使用的顏色是不是一致"],why:"系統整合是手段。業務流程要不要統一、資料要不要合併、多久完成，這些決定了技術方案。"},
 {t:"組織設計",q:"資安主管直接向資訊主管報告。這個組織設計有什麼潛在問題？",a:["資安的風險意見，可能被資訊部門的時程和成本壓力蓋掉","沒有任何問題","資安主管會太忙","兩位主管的辦公室距離太近，討論事情的時候容易被別人聽到"],why:"監督者向被監督者報告，是利益衝突。所以很多組織讓資安有獨立向最高管理階層報告的管道。"},
 {t:"績效指標",q:"OKR 和傳統 KPI 在使用上最大的不同是？",a:["OKR 強調有挑戰性的目標和方向對齊，通常不直接綁考績","OKR 就是 KPI 的另一個名字","OKR 只能用在業務部門","OKR 規定每一個人每一季都至少要達成百分之兩百才算及格"],why:"綁考績的目標，大家會訂保守的。OKR 是用來讓團隊知道往哪衝，達成七成也可能是很好的結果。"},
 {t:"變革管理",q:"導入新系統時，使用單位強烈抗拒。比較有效的處理方式是？",a:["及早讓他們參與設計，說明改變的原因，並提供訓練和過渡期的支援","直接強制上線","取消專案","什麼都不用說，等到新系統上線的那一天，再把舊系統的電源線直接拔掉，大家自然就會改用"],why:"抗拒通常來自「沒被問過」和「怕不會用」。讓人參與、被聽見、有準備，比事後安撫有效得多。"},
 {t:"供應商管理",q:"某項關鍵服務完全依賴單一家供應商，沒有任何替代方案。在管理上這是什麼風險？應該怎麼做？",a:["集中度風險，要評估替代方案或至少準備退場計畫","沒有風險，專心跟一家合作最好","價格風險，每年砍價就好","這是供應商自己的風險，跟我們沒有關係，所以不需要處理"],why:"那家倒閉、漲價、被併購或出資安事件時，你沒有選擇。不一定要馬上換，但要知道怎麼換、要多久。"}

{id:'law',lv:[[
 {t:"資通安全管理法",q:"《資通安全管理法》2025 年修正後，主管機關是哪一個？",a:["數位發展部","行政院","內政部警政署","各縣市政府各自擔任主管機關，分別管理轄區內的公務機關和民間企業"],why:"2025 年 9 月修正公布，主管機關由行政院改為數位發展部，由資通安全署負責執行。"},
 {t:"資通安全管理法",q:"下列哪一類屬於《資通安全管理法》所稱的「特定非公務機關」？",a:["關鍵基礎設施提供者","所有在國內設立登記的公司","一般的網路商店","只要公司裡有使用電腦和網路，不論規模大小都自動屬於特定非公務機關"],why:"特定非公務機關包含關鍵基礎設施提供者、公營事業、特定財團法人，以及受政府控制的事業、團體或機構，不是所有民間企業都適用。"},
 {t:"個人資料保護法",q:"依《個人資料保護法》，什麼樣的資料算「個人資料」？",a:["能直接或間接識別出特定個人的資料","只有身分證字號才算","只有紙本的資料才算","只有經過當事人親自簽名確認過的資料才算，其他的都不在保護的範圍之內"],why:"姓名、電話、病歷、帳號，甚至和其他資料對照後能認出某個人的，都算。所以 log 和資料庫裡到處都是個資。"},
 {t:"個人資料保護法",q:"依《個人資料保護法》，蒐集、處理、利用個資的基本原則是？",a:["要有特定目的，而且不能超出必要的範圍","只要資料是公開的就可以任意使用","只要沒有拿去賣就沒有限制","只要公司內部有需要，可以先盡量多蒐集起來，之後再決定要用在哪裡"],why:"個資法第 5 條：應尊重當事人權益，依誠實信用方法，不得逾越特定目的之必要範圍，並與目的有正當合理的關聯。"},
 {t:"刑法",q:"沒有經過同意，用猜到的密碼登入別人的帳號或主機。在我國可能觸犯什麼？",a:["刑法的妨害電腦使用罪","只違反公司的內部規定","沒有任何法律責任，只要沒有破壞東西","只有在對方因此損失超過新臺幣一百萬元的時候，才會有法律上的責任"],why:"刑法第 358 條：無故輸入他人帳號密碼、破解保護措施或利用系統漏洞入侵他人電腦，就有刑責，不必等到造成損害。"},
 {t:"電子簽章法",q:"《電子簽章法》的主要作用是什麼？",a:["讓電子文件和電子簽章在符合條件時，具有法律上的效力","規定所有文件都必須改成電子檔","禁止使用紙本簽名","規定只有政府機關可以使用電子簽章，民間的公司和個人都不可以使用"],why:"有了這部法，線上簽核、電子契約才有法律依據。系統設計上要能確認簽署人的身分和文件有沒有被改過。"},
 {t:"營業秘密法",q:"工程師離職時，把公司的原始碼和客戶名單複製一份帶到新公司使用。最可能違反什麼？",a:["營業秘密法","道路交通管理處罰條例","沒有違反任何法律，那是他自己寫的","只有在新公司跟原公司是同一個產業的情況之下，才會有違法的問題"],why:"具有秘密性、經濟價值，而且公司有採取保密措施的資訊，就受營業秘密法保護，違反有民事和刑事責任。"},
 {t:"著作權法",q:"員工在職務上寫的程式，沒有特別約定的話，著作財產權歸誰？",a:["雇用人（公司）","寫程式的員工本人","政府","由員工和公司各持有一半，任何一方要使用都必須經過另一方的書面同意"],why:"著作權法第 11 條：受雇人職務上完成的著作，以受雇人為著作人，但著作財產權歸雇用人，契約另有約定的從其約定。"}

 {t:"資通安全管理法",q:"依 2025 年修正的《資通安全管理法》，特定非公務機關應該設置什麼職位，負責推動和監督資安事務？",a:["資通安全長","法務長","財務長","不需要設置任何職位，只要每一年委託外部的廠商做一次檢測就可以"],why:"修正後明定特定非公務機關應設置資通安全長；符合特定責任等級的還要配置資安專職人員。"},
 {t:"資通安全管理法",q:"依 2025 年修正的《資通安全管理法》，特定非公務機關未依規定通報資安事件，罰鍰上限提高到多少？",a:["新臺幣 1,000 萬元","新臺幣 1 萬元","新臺幣 10 萬元","沒有罰鍰的規定，主管機關只能發函要求改善"],why:"修正前上限是 500 萬元。隱匿不報的代價變得很高，所以通報流程一定要事先訂好、演練過。"},
 {t:"資通安全管理法",q:"2025 年修正的《資通安全管理法》對「危害國家資通安全產品」做了什麼規定？",a:["把公務機關不得使用的規定，從行政命令提升到法律位階","全面開放使用","只限制個人不能購買","規定所有的民間企業在三個月之內都必須全面汰換，否則一律停業"],why:"公務機關不得下載、安裝或使用；中央目的事業主管機關也可以限制或禁止特定非公務機關使用。"},
 {t:"個人資料保護法",q:"2025 年修正的《個人資料保護法》，設立了哪一個獨立的監督機關？",a:["個人資料保護委員會","國家通訊傳播委員會","公平交易委員會","沒有設立新的機關，仍然由各個部會各自負責自己主管的產業"],why:"修法後由個資會統一受理個資事故通報，並對公務和非公務機關做稽核和行政檢查。施行日期和子法要留意後續公告。"},
 {t:"個人資料保護法",q:"依《個人資料保護法》，保有個資檔案的非公務機關，在安全上有什麼義務？",a:["採行適當的安全措施，防止個資被竊取、竄改、毀損、滅失或洩漏","只要不主動對外公開就可以","沒有義務，出事再處理","只需要在公司的網站上公告隱私權政策，其他的不需要再做任何事情"],why:"這是個資法對非公務機關的基本要求，沒做到主管機關可以處罰。2025 年修正後條次有調整，引用時要對照當時的條文。"},
 {t:"資通安全管理法",q:"依 2025 年修正的《資通安全管理法》，公務機關把資通安全相關業務委外，明定要怎麼做？",a:["和受託者簽訂書面契約，載明權利義務和違約責任","口頭約定就可以","完全不可以委外","只要受託的廠商在業界的名氣夠大，就可以不用另外簽訂任何的契約"],why:"委外不等於責任轉移。契約要寫明資安要求、通報義務和違約責任，機關也要持續監督。"},
 {t:"刑法",q:"員工離職前，把部門共用資料夾裡的檔案全部刪掉洩憤。可能觸犯刑法的哪一類規定？",a:["無故刪除他人電腦的電磁紀錄，致生損害","沒有法律問題，那些檔案是他自己做的","只有民事賠償的問題","只有在公司事先和他簽過保密合約的情況之下，才會有刑事上的責任"],why:"刑法第 359 條：無故取得、刪除或變更他人電腦或相關設備的電磁紀錄，致生損害於公眾或他人，有刑責。"},
 {t:"法規位階",q:"公司的內部資安規定，和《資通安全管理法》的要求不一樣時，以哪一個為準？",a:["法律優先，內部規定不能牴觸法律","內部規定優先，因為比較貼近實務","看哪一個比較新","由每一個部門的主管依照當時的實際狀況，各自決定要遵守哪一個"],why:"位階是法律、法規命令（各種辦法）、再來才是機關或公司的內部規定。法規修正後，內部規定要跟著檢視。"}

 {t:"資通安全管理法",q:"依 2025 年修正的《資通安全管理法》，特定非公務機關發生重大資安事件時，中央目的事業主管機關可以做什麼？",a:["進行調查，包括通知到場陳述、要求提出報告或派員檢查","只能發新聞稿","沒有任何權限","直接接管該機關全部的資訊系統，並且指派人員進駐一年"],why:"修正後明定調查權。規避、妨礙或拒絕調查，可處新臺幣 10 萬元以上、100 萬元以下罰鍰。"},
 {t:"資通安全管理法",q:"依 2025 年修正的《資通安全管理法》，符合特定資通安全責任等級的特定非公務機關，在人力上應該配置什麼？",a:["資通安全專職人員","至少十位律師","專職的總務人員","不需要配置任何人力，全部委託給外部的廠商處理即可"],why:"資安不能只靠兼辦。修正後把專職人員和資通安全長都寫進法律，組織要有對應的編制。"},
 {t:"個人資料保護法",q:"依 2025 年修正的《個人資料保護法》，公務機關應指派人員擔任什麼角色，統籌個資保護事務？",a:["個人資料保護長","資料庫管理員","發言人","不需要指派任何人，由每一位承辦人各自對自己經手的資料負責"],why:"由機關首長指派人員兼任，負責統籌規劃和督導考核，並應配給適當的人力和資源。"},
 {t:"個人資料保護法",q:"依 2025 年修正的《個人資料保護法》，下列哪一種違規，主管機關可以不必先要求限期改正就直接處罰？",a:["違反事故通報、應變或紀錄留存的義務","違反通知當事人的義務","兩者都要先限期改正","兩者都不會被處罰，主管機關只能提出改善的建議"],why:"依修法說明，未通知當事人是先限期改正、不改才罰；未通報、未應變或未留存紀錄則可以直接處罰。"},
 {t:"資通安全管理法",q:"依 2025 年修正的《資通安全管理法》，違反資通安全維護計畫等規定，經限期改正仍未改正，罰鍰上限提高到多少？",a:["新臺幣 500 萬元","新臺幣 5 千元","新臺幣 5 萬元","新臺幣 5 億元，並且得按日連續處罰到改正為止"],why:"未通報資安事件的上限是 1,000 萬元，未依規定改正的上限是 500 萬元。兩個數字不要混在一起。"},
 {t:"個人資料保護法",q:"當事人要求刪除自己的個資，但依其他法令，這筆資料的保存期限還沒到。機關應該怎麼處理？",a:["可以不刪除，但要說明原因，期限屆滿後再處理","一定要立刻刪除","不需要回覆當事人","先把資料刪除掉，等到主管機關來檢查的時候再想辦法重新補回去"],why:"個資法第 11 條：目的消失或期限屆滿應刪除，但因執行職務或業務所必須，或經當事人書面同意者不在此限。"},
 {t:"數位證據與隱私",q:"公司懷疑員工外洩資料，想調閱他公務電腦上的操作紀錄。在法律風險上，最重要的前提是什麼？",a:["事前有明確的規定並告知員工，調閱也依內部程序進行","只要主管口頭同意就可以","公司的電腦隨時都可以任意查看","先偷偷安裝側錄軟體蒐集一個月，確定有問題之後再補辦程序"],why:"沒有依據的監看，可能涉及隱私和妨害秘密的問題，取得的證據也可能有爭議。規定、告知、程序三者要齊。"},
 {t:"法規遵循",q:"法規修正公布了，但「施行日期由行政院定之」。資訊單位這段期間應該做什麼？",a:["先盤點差距並開始準備，同時追蹤施行日期和子法","還沒施行就不用理會","等被罰了再說","立刻依照自己對條文的理解對外宣布已經全部符合新的規定"],why:"公布到施行通常有緩衝期，就是給機關準備的。等施行那天才開始，人力、預算、制度都來不及。"}
