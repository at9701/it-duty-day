<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>資訊職訓中心</title>
<style>
/* 版面：上方進度，中間訓練村（2D 地圖或 3D 場景），下方課程一覽；作答時換成單一題目卡 */
:root{--bg:#eaf0f4;--panel:#ffffff;--panel2:#f0f5f8;--line:#d2dde6;--fg:#1c2a36;--muted:#617384;--accent:#17a07a;--warn:#c9860c;--crit:#d6453d;--info:#2a7fd4;
 --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Consolas,"Courier New",monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
header h1{font-size:24px;margin:0;flex:1 1 160px}
a.back{color:var(--muted);text-decoration:none;font-size:14px}a.back:hover{color:var(--fg)}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.pill b{color:var(--accent)}
.lead{color:var(--muted);margin:0;max-width:68ch}.lead a{color:var(--accent)}
h2.sec{font-size:16px;margin:6px 0 0}
.stars{color:var(--warn);letter-spacing:2px;font-size:14px}.stars i{color:var(--line);font-style:normal}
button:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--info);outline-offset:2px}
/* 2D 職訓中心地圖：深色底、發光線路 */
.map{position:relative;width:100%;aspect-ratio:100/62;border-radius:18px;overflow:hidden;border:1px solid #24405c;box-shadow:0 8px 24px rgba(28,42,54,.18);background:#0e1626}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.npc{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;font:inherit;color:#eaf8ff;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:112px}
.npc .roof{width:74px;height:5px;border-radius:3px;box-shadow:0 0 10px 1px var(--rc);background:var(--rc)}
.npc .hut{width:66px;height:46px;margin-top:3px;background:#1b2a40;border:1.5px solid var(--rc);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .15s,box-shadow .15s}
.npc:hover .hut{transform:translateY(-3px);box-shadow:0 0 14px var(--rc)}
.npc .tag{margin-top:4px;background:rgba(10,22,40,.88);border:1px solid #39d6ff88;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;line-height:1.35;text-align:center;white-space:nowrap}
.npc .tag small{display:block;font-weight:400;color:#7fdcff;font-size:11px}
.npc .mk{position:absolute;top:-10px;right:8px;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:0 7px;line-height:18px}
.npc .mk.done{background:var(--accent)}
.hall{position:absolute;left:50%;top:54.8%;transform:translate(-50%,-50%);background:rgba(10,22,40,.9);color:#eaf8ff;border:1.5px solid #39d6ff;border-radius:12px;padding:6px 14px;text-align:center;font-weight:800;line-height:1.3;box-shadow:0 0 16px #39d6ff66}
.hall small{display:block;font-weight:400;color:#7fdcff;font-size:12px}
.gate{position:absolute;background:rgba(10,22,40,.9);color:#f2c14e;border:1px solid #f2c14e;border-radius:8px;padding:3px 12px;font-size:12px;line-height:1.5;text-align:center}
@keyframes flow{to{stroke-dashoffset:-41.2}}
.map .flow{stroke-dasharray:1.2 40;animation:flow 9s linear infinite}
@media (prefers-reduced-motion:reduce){.map .flow{animation:none}}
@media (max-width:700px){.map{display:none}}
/* 3D 訓練村 */
.v3d{position:relative;width:100%;aspect-ratio:16/9;max-height:72vh;min-height:300px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 24px rgba(28,42,54,.1);background:#0e1626;touch-action:none}
.v3d canvas{display:block;width:100%;height:100%}
.v3d .tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2}
.v3d .how{position:absolute;left:12px;top:10px;background:rgba(10,22,40,.7);border:1px solid #39d6ff55;border-radius:10px;padding:3px 10px;font-size:12px;color:#bfefff;pointer-events:none}
/* 課程一覽 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;color:var(--fg);cursor:pointer;min-width:0}
.chip:hover{border-color:var(--accent)}
.chip .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.chip b{display:block;line-height:1.3}.chip small{color:var(--muted);display:block;line-height:1.3}
.chip.lock{opacity:.7;border-style:dashed}
/* 跟師傅對話 */
.talk{position:fixed;inset:0;z-index:20;background:rgba(28,42,54,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.talk .box{background:var(--panel);border-radius:18px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 40px rgba(28,42,54,.3)}
.talk .who{display:flex;gap:12px;align-items:center}
.talk .face{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.talk h2{margin:0;font-size:18px}.talk .who small{color:var(--muted)}
.talk .say{background:var(--panel2);border-radius:4px 14px 14px 14px;padding:10px 14px;margin:0}
.talk .ttl{font-weight:700;color:var(--accent)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiers button{min-width:0;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:12px;padding:8px 2px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tiers button:hover:not(:disabled){border-color:var(--accent)}
.tiers button:disabled{opacity:.5;cursor:not-allowed}
.tiers button span.n{font-size:11px;font-weight:400;color:var(--muted)}
/* 作答 */
#play{display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto;width:100%}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .name{font-weight:700;flex:1 1 140px}
.hearts{font-size:20px;letter-spacing:3px}.hearts i{font-style:normal;opacity:.2}
.combo{font-weight:800;color:var(--warn);min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(28,42,54,.1);display:flex;flex-direction:column;gap:14px}
.qno{color:var(--muted);font-size:13px}
.q{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
pre{margin:0;background:#16212b;color:#d7e3ee;border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13px;overflow-x:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--info)}
.opt.right{border-color:var(--accent);background:#dcf3ea}.opt.wrong{border-color:var(--crit);background:#fbe6e3}.opt:disabled{cursor:default}
.opt code,.q code,.why code{font-family:var(--mono);font-size:.92em;background:rgba(28,42,54,.08);border-radius:4px;padding:1px 5px}
.why{border-left:5px solid var(--accent);background:var(--panel2);border-radius:8px;padding:10px 14px}
.why.bad{border-color:var(--crit)}.why b{display:block;margin-bottom:2px}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;border-radius:12px;padding:11px 20px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big{font-size:44px;color:var(--warn);letter-spacing:8px;line-height:1}.big i{color:var(--line);font-style:normal}
.miss{border-top:1px solid var(--line);padding-top:10px}.miss small{color:var(--muted);display:block}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qcard.ok{animation:pop .25s}.qcard.ng{animation:shake .25s}
@media (prefers-reduced-motion:reduce){.qcard.ok,.qcard.ng{animation:none}.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
 <header><a class="back" href="../">← 回首頁</a><h1>資訊職訓中心</h1><div class="sum"><span class="pill">基礎課程 <b id="sDone">0</b></span><span class="pill">星星 <b id="sStar">0</b></span><span class="pill">總分 <b id="sScore">0</b></span><button class="btn ghost" id="snd" style="padding:4px 12px;border-radius:999px" aria-label="音效開關">🔊</button></div></header>
 <div id="hub" style="display:flex;flex-direction:column;gap:16px">
  <p class="lead">中庭周圍是九間實習教室，九位師傅各教一門每個資訊人員都該會的基礎課；基礎考到中級，就能去進階專科大樓找各科主任。找師傅說話就能考試：一次 8 題、三條命，錯一題以內就拿到稱號，從初級一路考到專家。電腦比較舊的話，可以改用 <a href="2d/">2D 地圖版</a>，進度是共用的。</p>
  <div id="stage"></div>
  <h2 class="sec">基礎課程</h2>
  <div class="chips" id="chips"></div>
  <h2 class="sec">進階課程（專科）</h2>
  <div class="chips" id="adv"></div>
 </div>
 <div id="play" hidden></div>
</div>
<div class="talk" id="talk" hidden></div>

 addEventListener('keydown',e=>{if(api.busy())return;if(KM[e.code]){keys[e.code]=1;target=null;want=null;ring.visible=false;if(e.code.startsWith('Arrow'))e.preventDefault();}
  if((e.code==='KeyE'||e.code==='Enter')&&(near||nearL)&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();act();}});
 addEventListener('keyup',e=>{delete keys[e.code];});addEventListener('blur',()=>{for(const k in keys)delete keys[k];});
 const ray=new THREE.Raycaster(),gp=new THREE.Plane(new THREE.Vector3(0,1,0),0),v2=new THREE.Vector2(),hit=new THREE.Vector3();
 R.domElement.addEventListener('pointerdown',e=>{if(api.busy())return;const b=R.domElement.getBoundingClientRect();v2.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(v2,cam);
  if(!ray.ray.intersectPlane(gp,hit))return;let s=stalls.find(s=>Math.hypot(hit.x-s.x,hit.z-s.z)<3.2);
  if(s){target=[s.fx,s.fz];want=s;}else{target=[hit.x,hit.z];want=null;}ring.position.set(target[0],.05,target[1]);ring.visible=true;});
 tip.onclick=act;
 function step(dt){let dx=0,dz=0;for(const k in keys){dx+=KM[k][0];dz+=KM[k][1];}
  if(!dx&&!dz&&target){dx=target[0]-me.position.x;dz=target[1]-me.position.z;if(Math.hypot(dx,dz)<.25){target=null;ring.visible=false;dx=dz=0;if(want){const w=want;want=null;api.talk(w.c);}}}
  const l=Math.hypot(dx,dz),mv=l>0;
  if(mv){dx/=l;dz/=l;let nx=me.position.x+dx*6.5*dt,nz=me.position.z+dz*6.5*dt;
   (zone?blocks2:blocks).forEach(b=>{const d=Math.hypot(nx-b[0],nz-b[1]),r=b[2]+.35;if(d<r&&d>0){nx=b[0]+(nx-b[0])/d*r;nz=b[1]+(nz-b[1])/d*r;}});
   if(zone){nx=Math.max(OX-21.5,Math.min(OX+21.5,nx));nz=Math.max(-16,Math.min(12.5,nz));}else{const d=Math.hypot(nx,nz);if(d>21.8){nx*=21.8/d;nz*=21.8/d;}}
   if(Math.hypot(nx-me.position.x,nz-me.position.z)<.01*dt*60&&target){target=null;ring.visible=false;}
   me.position.x=nx;me.position.z=nz;let da=Math.atan2(dx,dz)-me.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));me.rotation.y+=da*Math.min(1,dt*12);}
  const t=performance.now()/1000,sw=mv?Math.sin(t*11)*.6:0;me.userData.L[0].rotation.x=sw;me.userData.L[1].rotation.x=-sw;me.userData.A[0].rotation.x=-sw;me.userData.A[1].rotation.x=sw;
  anim.forEach(f=>f(t));near=null;let bd=3.4;stalls.forEach((s,i)=>{const d=Math.hypot(me.position.x-s.fx,me.position.z-s.fz);if(d<bd){bd=d;near=s;}s.m.position.y=(s.adv?.16:.12)+Math.sin(t*2+i)*.03;if(s.mk)s.mk.position.y=s.my+Math.sin(t*3+i)*.08;});
  nearL=null;if(!near)lifts.forEach(L=>{if(Math.hypot(me.position.x-L.x,me.position.z-L.z)<1.5)nearL=L;});
  if(near){tip.textContent='跟'+near.c.npc+'說話（E）';tip.hidden=false;}else if(nearL){tip.textContent=nearL.txt+'（E）';tip.hidden=false;}else tip.hidden=true;
  if(zone){const fx=OX+(me.position.x-OX)*.6,fz=me.position.z*.5-3;cam.position.set(fx,22,fz+23);cam.lookAt(fx,1,fz);}else{const fx=me.position.x*.6,fz=me.position.z*.55-5.5;cam.position.set(fx,29,fz+29);cam.lookAt(fx,1,fz);}}
 function size(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<1.1?52:38;cam.updateProjectionMatrix();}
 if(window.ResizeObserver)new ResizeObserver(size).observe(host);addEventListener('resize',size);size();
 let last=performance.now();(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(!host.clientWidth)return;if(!api.busy())step(dt);R.render(sc,cam);})(last);
 window.v3dState=()=>({x:me.position.x,z:me.position.z,zone,near:near&&near.c.id,lift:!!nearL});window.v3dRide=()=>ride(lifts[zone?1:0]);
};

{id:'trouble',ic:'🛠️',col:'#dcf3ea',name:'電腦異常排除',desc:'現場報修的判斷順序：先問、先分、再動手',ranks:['報修見習','現場工程員','排除高手'],lv:[[
 {q:'使用者只說「電腦開不了機」。你第一件事該確認什麼？',a:['電源燈有沒有亮、按了有沒有任何反應，分清楚是沒電、沒畫面還是進不了系統','不用問太多，直接幫他把作業系統重灌一次，重灌完大部分的問題都會消失','先把主機板換掉，開不了機最常見就是主機板壞','進 BIOS 把韌體更新到最新版本再說'],why:'「開不了機」可能是三種完全不同的狀況，先分清楚才知道往哪查。'},
 {q:'主機有電、風扇在轉，但螢幕完全沒畫面。最先檢查哪裡？',a:['螢幕的電源、訊號線有沒有鬆，輸入來源有沒有切對','把硬碟拆下來換一顆新的','把作業系統整個重灌一次','電源可能不夠力，換一顆瓦數更大的電源供應器'],why:'沒畫面最常見的原因是線鬆了或輸入來源切錯，先查最簡單、最便宜的。'},
 {q:'開機後畫面顯示 <code>No bootable device</code>，最可能的方向是？',a:['開機磁碟沒有被偵測到，或 BIOS 的開機順序設錯','記憶體容量不夠，系統載入不了','顯示卡驅動程式版本太舊','網路線沒有接好，電腦抓不到開機需要的資訊'],why:'這個訊息代表找不到可以開機的磁碟：先看 BIOS 有沒有認到硬碟、開機順序對不對。'},
 {q:'排除問題時，為什麼要「一次只改一個地方」？',a:['這樣才能確定是哪一個改動讓問題消失或出現','因為一次改太多設定，會讓電腦變得比較耗電','因為公司規定每次只能改一項設定','因為這樣做整體速度會比較快'],why:'同時改好幾樣，就算好了也不知道是哪一樣造成的，下次遇到還是不會。'},
 {q:'使用者說電腦突然變得很慢。你先看什麼？',a:['開工作管理員，看 CPU、記憶體、磁碟哪個被佔滿，是哪個程式','直接申請加裝記憶體，電腦變慢通常都是因為記憶體不夠用','直接重灌，重灌完一定會變快','換一條新的網路線試試看'],why:'先看是什麼資源被吃光、被誰吃光，再決定怎麼處理。'},
 {q:'使用者說「昨天還好好的」。最有用的追問是哪一句？',a:['從昨天到現在，有沒有裝過、改過、搬動過什麼東西？','這台電腦當初是哪一年買的？','你登入的密碼是多少？','你們單位總共有幾個人在用電腦，平常都用來做什麼？'],why:'昨天正常、今天不正常，中間的變動就是最大的線索。'},
 {q:'電腦出現藍底白字的當機畫面（BSOD）。處理前應該先記下什麼？',a:['畫面上的停止代碼，以及當機前正在做什麼','螢幕的廠牌和型號','鍵盤和滑鼠是有線的還是無線的','電腦主機外殼的顏色'],why:'停止代碼可以直接查到方向（驅動、記憶體、磁碟…），當機前的動作可以重現問題。'},
 {q:'問題處理完了。結案前最重要的一步是？',a:['請使用者實際操作一次確認正常，並把原因和處理方式記下來','趁使用者還沒發現其他問題之前趕快離開，免得被留下來','提醒使用者下次不要再打電話來','把電腦連續重開三次確保穩定'],why:'使用者確認才算修好；原因寫下來，下次自己或同事遇到就不用重查。'},
],[
 {q:"同一層樓有十幾個人同時說網路不通。比較好的處理方向是？",a:["找這些人的共通點，往上游的交換器或線路查","照報修順序，一台一台去現場把每台電腦的網路設定重新檢查過","請大家先重開機，沒好再說","先處理職位最高的那一位"],why:"很多人同時出事，問題通常在他們共用的東西上。一台一台修只是在浪費時間。"},
 {q:"問題「有時候會、有時候不會」。這種間歇性的問題，最有用的做法是？",a:["記下每次發生的時間和當時在做什麼，找出規律","等它完全壞掉再來修，那時候原因比較明顯","直接重灌，一次解決","跟使用者說這是正常現象，電腦用久了難免都會這樣，不用太在意"],why:"間歇性問題靠猜是猜不到的。有了時間和動作的紀錄，才能對到 log 或找出共同條件。"},
 {q:"螢幕沒畫面，你拿一台確定是好的螢幕和線來接。這個動作叫交叉測試，目的是？",a:["用確定正常的東西，分出問題在哪一段","順便幫使用者把螢幕換成新的","證明使用者沒有說謊","先讓使用者有螢幕可以用，至於真正壞在哪裡之後有空再慢慢查"],why:"把「確定好的」換上去：好了，就是原本那個壞；沒好，問題在別段。一次只換一樣。"},
 {q:"某位使用者登入後程式打不開，但換別人登入同一台電腦就正常。問題比較可能在哪？",a:["這個使用者的帳號設定或權限","主機板","這台電腦的記憶體有一條快要壞掉，剛好只有他登入的時候會用到","網路線"],why:"同一台電腦、不同人結果不同，硬體和網路就可以先排除，往使用者層級的設定檔和權限查。"},
 {q:"要動一項你不熟的設定之前，最該先做的是？",a:["把原本的設定記下來或備份，確保改壞了能改回去","先改改看，有問題再上網查怎麼復原","找一個沒人的時間偷偷改","問使用者同不同意"],why:"排除問題的底線是不要越修越糟。能還原，才敢動手。"},
 {q:"這個問題你處理不了，要往上轉給資深同事或廠商。轉的時候最該附上什麼？",a:["現象、已經做過的檢查和結果","只要案件編號","使用者的抱怨內容原文，一字不漏地轉過去，讓對方感受一下現場的壓力","你覺得是誰的錯"],why:"附上已做的檢查，接手的人才不用從頭再問一次、再做一次。"},
 {q:"伺服器硬碟滿了，你刪掉一些舊檔案，服務恢復了。這樣算處理完了嗎？",a:["還沒，要查是什麼一直在寫、之後會不會再滿","算，服務已經恢復，使用者也沒有再反應，可以結案了","算，但要記得下個月再來刪一次","不算，應該順便把硬碟換成更大的"],why:"刪檔是解決症狀。沒找到是誰在寫（log 沒輪替？程式異常？），過幾天一樣會再滿。"},
 {q:"你換了一條網路線之後問題好了，隔天同樣的問題又出現。這代表什麼？",a:["網路線可能不是原因，昨天好了也許只是巧合","新的網路線又壞了，再換一條","使用者一定又動了什麼","這種事情本來就查不出原因，只能等它下次再發生的時候再處理"],why:"「做了某件事之後好了」不等於「因為那件事才好」。問題重現，就要回頭重新驗證當初的判斷。"}
],[
 {q:"同一套系統，一半的人說很慢，另一半完全正常。最有效的切入點是？",a:["比較兩群人的差異：網段、版本、連到哪一台伺服器","既然有一半的人正常，代表系統本身沒問題，請慢的人各自重開機","直接重開伺服器","先加大頻寬"],why:"有好有壞是最好的線索。找出「慢的都有、快的都沒有」的那個條件，範圍就縮小了。"},
 {q:"線上服務突然大規模中斷。先恢復服務，還是先查出原因？",a:["先恢復服務，但動手前把 log、畫面這些證據留下來","一定要先查到根本原因才能動手，否則服務恢復之後就再也查不出來了","先開會討論責任歸屬","等廠商到場再決定"],why:"使用者在等，恢復優先。但重開或回復前先把紀錄留下，不然事後就沒東西可以查。"},
 {q:"一個問題怎麼試都無法重現，但使用者確定發生過。接下來比較好的做法是？",a:["把紀錄開詳細一點或加上監控，等下次發生時抓到資料","無法重現就代表沒有問題，直接結案","每天去使用者旁邊坐著等它發生，這樣才不會錯過任何細節","把整個系統重裝一次"],why:"重現不了，就讓下次發生時有東西可看：詳細 log、封包擷取、效能紀錄。"},
 {q:"昨晚同時做了兩項變更，今天早上系統出問題。怎麼判斷是哪一項造成的？",a:["一次退回其中一項，看問題有沒有消失","兩項都退回，問題解決了就好，不需要知道是哪一項","看哪一項是比較資淺的人做的","再做第三項變更試試看"],why:"一次只動一個變數才分得出因果。兩項一起退雖然快，但之後重做時還是不知道哪個有問題。"},
 {q:"主機監控上 CPU、記憶體都很正常，但使用者一直說系統很慢。這代表什麼？",a:["瓶頸可能在沒被監控到的地方，例如磁碟讀寫、資料庫鎖定、網路","監控數字都正常，所以是使用者自己的感覺有問題，請他們先提出具體的證明再說","監控系統壞了，重裝監控","使用者的電腦太舊"],why:"監控只看得到有監控的項目。使用者的體驗才是事實，要從他的操作一路往後端量。"},
 {q:"用「連問五次為什麼」做根因分析，目的是什麼？",a:["從表面的現象一路往下追，找到真正該改的地方","找出是哪一個人犯的錯","把報告的篇幅寫到夠長，讓主管覺得這次的檢討有做得很深入","證明問題不是資訊單位造成的"],why:"「硬碟滿了」→ 為什麼滿？log 沒清 → 為什麼沒清？沒設輪替 → 為什麼沒設？建置清單沒這項。改清單才是根本。"},
 {q:"重大事件結束後的檢討會，最重要的原則是？",a:["對事不對人，找出流程和機制上的漏洞","先確定這次是誰的責任，處分完之後再來談改善","只要寫報告交差，不需要真的開會","只邀請主管參加，第一線的人不用到"],why:"一究責，大家就不敢講實話，真正的原因反而被藏起來。要改的是讓人會犯錯的流程。"},
 {q:"你用一個臨時的方法先讓系統撐住了（例如排程每小時重啟服務）。接下來最該做什麼？",a:["記錄下來並開一張追蹤單，安排找出真正的原因","已經不會出問題了，可以結案","把重啟的頻率從每小時改成每十分鐘一次，這樣會更保險","不要告訴別人，免得被問"],why:"臨時解法最怕變成永久的。沒人記得它存在，哪天它失效或造成別的問題，就更難查了。"}
],[
 {q:"監控畫面一下子跳出五十幾個告警，涵蓋十幾台主機。最有效率的處理方式是？",a:["依相依關係找最上游的那一個","照告警跳出來的時間順序，從第一個開始一個一個處理","先把告警全部關掉，畫面乾淨了再說","每台主機各派一個人去看"],why:"告警風暴通常是一個上游問題（儲存、網路、驗證）拖垮下游。修好源頭，其他告警會自己消失。"},
 {q:"每次備份執行時系統就變慢，大家都認定是備份造成的。要怎麼確認？",a:["挑一天停掉備份，看那個時段還會不會慢","不用確認，時間點完全吻合就代表一定是備份造成的","把備份改到白天執行","直接買更快的備份設備"],why:"同時發生不等於因果，也可能是同一時段的別支排程。拿掉懷疑的因素看結果，才算驗證。"},
 {q:"上次正常的版本和現在出問題的版本之間，有 200 筆變更。要最快找出是哪一筆造成的，用什麼方法？",a:["二分法：每次測中間那一筆，把範圍砍半","從第 1 筆開始，一筆一筆依序測到第 200 筆","請每個改過的人自己檢查","憑經驗猜最可疑的那幾筆，猜不到就整批退回上一個正常的版本"],why:"二分法最多測 8 次就能從 200 筆裡找到。Git 的 <code>bisect</code> 就是做這件事。"},
 {q:"你改了一項設定，問題消失了。要怎麼確定真的是這項設定造成的？",a:["把設定改回去，看問題會不會再出現","觀察一個星期沒有再發生，就可以確定","問其他同事的看法","不需要確定，問題已經解決了，知不知道原因並沒有差別"],why:"能「關掉又打開」重現問題，因果才算成立。只是沒再發生，可能只是觸發條件剛好沒出現。"},
 {q:"明明有備援機制，為什麼還要定期做切換演練？",a:["沒實際切過，不知道真的出事時它會不會動","演練是為了讓稽核有紀錄可以看，實際上備援一定會正常運作","讓備援設備的保固可以延長","因為主要設備需要定期休息"],why:"備援沒演練過，常見結局是出事那天才發現設定沒同步、授權過期、沒人記得步驟。"},
 {q:"系統每個月初都會慢兩三天，其他時間正常。這比較像是什麼問題？",a:["週期性的負載高峰，容量不夠","硬體快要故障的前兆","有人在月初攻擊系統","作業系統的排程功能有 bug，每到月初就會自動降低效能"],why:"有固定週期的問題，先對業務的週期（月結、申報、報表）。這是容量規劃的問題，不是故障。"},
 {q:"重大事件發生，五六個工程師同時上去處理。最需要先確立的是什麼？",a:["指定一個人統籌指揮，其他人的動作都要先講","每個人各自從自己熟悉的地方開始修，誰先修好就算誰的","先確定事後檢討報告由誰寫","所有人一起盯同一個畫面"],why:"多人各改各的，會互相蓋掉、也分不清是哪個動作有效。要有一個人掌握全局、決定順序、對外溝通。"},
 {q:"一台應用伺服器出了怪問題，查了三個小時還沒頭緒，而用自動化工具重建一台只要二十分鐘。比較合理的決定是？",a:["先重建恢復服務，把舊的那台留下來慢慢查","堅持查到原因為止，沒有找到原因就重建等於是認輸","把兩台都關掉","再多找幾個人一起查三個小時"],why:"排查也有成本。能快速重建就先恢復，保留現場事後再分析，兩邊都顧到。"}
]]},
{id:'hw',ic:'🖥️',col:'#e3ecf8',name:'硬體',desc:'主機裡有什麼、壞掉會怎樣、怎麼安全地動它',ranks:['硬體見習','維修員','硬體達人'],lv:[[
 {q:'關於記憶體（RAM），下列哪一個敘述正確？',a:['斷電之後，裡面的資料就會消失','斷電之後資料仍然會保留','只能讀取，不能寫入','主要用來長期保存檔案'],why:'RAM 是揮發性儲存，只在通電時暫存運作中的資料。'},
 {q:'SSD 相對於傳統硬碟（HDD），最主要的優點是？',a:['沒有機械結構，隨機讀寫快，也比較耐震','同樣價格下容量一定比較大','每 GB 的價格一定比較便宜','使用壽命無限，不會損壞'],why:'SSD 沒有碟片和讀寫頭，所以快、安靜、耐震，但每 GB 通常比較貴，也有寫入壽命。'},
 {q:'開機時主機連續嗶嗶叫，而且沒有畫面。通常先檢查什麼？',a:['記憶體有沒有插好，或是不是壞了','鍵盤有沒有接上','主機喇叭的音量是不是調太大','網路卡的燈有沒有亮'],why:'連續嗶聲是主機板的自我檢測警告，最常見是記憶體接觸不良。'},
 {q:'RAID 1 的作用是什麼？',a:['兩顆磁碟互為鏡像，一顆壞掉資料還在','把資料拆開寫入加快速度，但沒有備援','自動壓縮資料節省空間','把整顆磁碟的內容加密'],why:'RAID 1 是鏡像；加快速度但沒有備援的是 RAID 0。'},
 {q:'RAID 5 最少需要幾顆磁碟？最多可以壞幾顆而資料不遺失？',a:['最少 3 顆，可以壞 1 顆','最少 2 顆，可以壞 1 顆','最少 4 顆，可以壞 2 顆','最少 3 顆，可以壞 2 顆'],why:'RAID 5 用一顆磁碟的容量存同位元資料，所以最少 3 顆、容許壞 1 顆。可壞 2 顆的是 RAID 6。'},
 {q:'不斷電系統（UPS）的主要用途是？',a:['停電時撐一小段時間，讓設備正常關機或等發電機接手','提升網路的傳輸速度，讓伺服器的回應變得比較快','降低機房的溫度','攔截病毒和惡意程式'],why:'UPS 靠電池供電，只能撐幾分鐘到幾十分鐘，重點是爭取時間。'},
 {q:'要打開主機更換零件之前，應該先做什麼？',a:['關機、拔掉電源線，並先摸金屬釋放身上的靜電','讓電腦保持開機，更換時比較方便測試','只要戴上橡膠手套就可以直接動手','先把硬碟格式化避免資料外洩'],why:'帶電操作會燒零件，靜電也會打壞記憶體和主機板。'},
 {q:'電腦用一陣子就自動關機，摸起來很燙。最常見的原因是？',a:['風扇或散熱片積滿灰塵，或散熱膏乾掉了','硬碟的容量太大','螢幕的亮度調得太高，連帶讓主機溫度上升','鍵盤有按鍵卡住'],why:'過熱保護會強制關機。清灰塵、確認風扇有轉、必要時重塗散熱膏。'},
],[
 {q:"電腦跳出硬碟 S.M.A.R.T. 警告，但目前還能正常開機。該怎麼做？",a:["先把資料備份出來，再安排換硬碟","還能開機就代表沒事，等真的壞了再處理就好","重灌作業系統","把警告關掉"],why:"S.M.A.R.T. 警告是硬碟在預告自己快壞了。趁還讀得到，先救資料。"},
 {q:"電腦記憶體長期用到九成以上，硬碟燈一直閃，整台很慢。最直接有效的改善是？",a:["加記憶體","換一顆更快的 CPU","把螢幕解析度調低，減少顯示卡的負擔，系統就會有比較多資源","換一條網路線"],why:"記憶體不夠時，系統會拿硬碟當記憶體用（虛擬記憶體），速度差非常多，所以硬碟燈狂閃又很慢。"},
 {q:"要幫一台電腦加裝 M.2 的 SSD，購買前最需要確認什麼？",a:["主機板的 M.2 插槽支援 SATA 還是 NVMe","SSD 的外殼顏色","只要是 M.2 的規格就一定都能用，挑容量最大、價格最便宜的買就可以了","電源供應器的瓦數"],why:"M.2 只是插槽的形狀，裡面走的可能是 SATA 或 NVMe，主機板不支援就抓不到。"},
 {q:"有人說「我們有做 RAID 1，所以不用備份」。這句話哪裡有問題？",a:["RAID 只防硬碟故障，誤刪和勒索軟體會同步到另一顆","沒有問題，RAID 1 就是兩顆硬碟互相備份，壞一顆還有另一顆","RAID 1 的速度太慢","RAID 1 至少要三顆硬碟"],why:"RAID 是為了硬碟壞掉時不中斷服務。檔案被刪、被加密，兩顆會一起變，所以不能取代備份。"},
 {q:"拿記憶體、介面卡這類零件之前，為什麼要先摸一下機殼的金屬？",a:["把身上的靜電放掉","確認主機有沒有漏電","讓手的溫度降下來，避免手太熱把零件上的晶片燙壞","這只是習慣，沒有實際作用"],why:"靜電可能把晶片打壞，而且當下看不出來。冬天和冷氣房特別容易帶靜電。"},
 {q:"公司買了一套單機版授權的軟體，同事想裝在部門的十台電腦上。可以嗎？",a:["不行，超出授權範圍，違反授權合約也可能違反著作權法","可以，反正是公司付錢買的，裝在公司的電腦上都算合理使用","可以，只要不要同時開就好","只要主管口頭同意就可以"],why:"買幾套授權就只能裝幾台（依合約）。超裝在台灣一樣有著作權的法律責任，公司和個人都可能被追究。"},
 {q:"作業系統「終止支援」（例如 Windows 10 在 2025 年 10 月終止支援）之後，繼續使用最大的問題是？",a:["不再有安全性更新，新的漏洞不會修","電腦當天就會無法開機","所有的軟體都會立刻不能執行，資料也會被微軟鎖起來不能存取","螢幕解析度會被限制"],why:"終止支援後系統還是能用，但新發現的漏洞不會再修補，等於門壞了沒人修。"},
 {q:"更新顯示卡驅動程式之後，畫面開始閃爍。最快的處理方式是？",a:["在裝置管理員把驅動程式回復到上一版","整台重灌","馬上把顯示卡送修，更新後才出問題代表硬體本來就快要壞了","換一台螢幕"],why:"更新後才出問題，先退回上一版確認。Windows 的裝置管理員有「回復驅動程式」可以用。"}
],[
 {q:"伺服器用的 ECC 記憶體，和一般記憶體最大的差別是？",a:["可以偵測並修正記憶體的位元錯誤","速度是一般記憶體的兩倍","容量比較大，而且可以拿來當硬碟用","比較省電"],why:"伺服器長時間運作，記憶體偶發的位元錯誤可能讓資料悄悄出錯。ECC 能自動修正單一位元的錯誤。"},
 {q:"RAID 5 壞了一顆硬碟，換上新硬碟開始重建。這段期間最大的風險是？",a:["再壞一顆，整組資料就沒了","重建期間完全不能讀寫","新硬碟會把舊資料蓋掉","沒有風險，RAID 5 在重建的期間還是可以再容許一顆硬碟損壞"],why:"RAID 5 只容許壞一顆。重建時每顆硬碟都在全力讀取，同批的舊硬碟很容易跟著壞，所以大容量常改用 RAID 6。"},
 {q:"磁碟陣列裡設定「熱備援」（Hot Spare）硬碟的用途是？",a:["有硬碟故障時，自動頂上去開始重建","平常用來加快讀取速度","存放每天的備份檔案，等於多一份資料保障","讓陣列的可用容量變大"],why:"熱備援平常閒置，一有硬碟壞掉就自動接手重建，不用等人半夜來換，縮短沒有保護的時間。"},
 {q:"幫機房的伺服器配 UPS，除了容量夠不夠，還有一件事很重要，是什麼？",a:["設定讓伺服器在電池快用完前自動正常關機","UPS 的顏色要跟機櫃一樣","一定要買最貴的品牌","把 UPS 放在離伺服器越遠越好的地方，避免電磁波干擾"],why:"UPS 只能撐一段時間。沒設連動關機，電池耗盡時一樣是硬斷電，資料照樣損毀。"},
 {q:"把十台實體伺服器虛擬化，集中到一台主機上。這樣做最需要注意的風險是？",a:["這台主機一壞，上面的十個系統會同時停擺","虛擬機不能安裝 Windows","虛擬機的資料沒辦法備份","每一台虛擬機的速度一定會比原本的實體機快十倍，使用者會不習慣"],why:"虛擬化把雞蛋放進同一個籃子。正式環境至少要兩台主機加共用儲存，才能在一台故障時把虛擬機移走。"},
 {q:"要幫兩百台新電腦安裝一模一樣的系統和軟體。比較好的做法是？",a:["做好一份標準映像檔，用部署工具一次派送","請五個同事分頭一台一台手動安裝，裝完再互相檢查","請使用者自己安裝","先裝好一台，其他的等有人報修再裝"],why:"手動裝兩百台既慢又難保每台一樣。映像檔加部署工具，才能做到快、一致、之後可重複。"},
 {q:"每個月的安全性更新，要派送到全公司電腦。比較穩當的做法是？",a:["先派給一小群測試的電腦，確認沒問題再全面派送","更新釋出的當天就讓全公司的電腦一起安裝，越快裝完越安全","等到半年後累積多一點再一次裝","讓使用者自己決定要不要裝"],why:"更新偶爾會跟某些軟體或驅動衝突。先小範圍試，出事只影響少數人，還來得及喊停。"},
 {q:"要更新伺服器的 BIOS 或韌體。為什麼一定要排在維護時段，而且確認供電穩定？",a:["更新到一半如果斷電，設備可能再也開不了機","韌體更新需要用到很大的網路頻寬","更新的時候機房的溫度會明顯升高，白天冷氣負荷不了","只是慣例，其實隨時都可以更新"],why:"韌體寫到一半中斷，設備可能直接變磚。而且更新通常要重開機，本來就會中斷服務。"}
],[
 {q:"伺服器有兩顆電源供應器。機房配電時應該怎麼接？",a:["分別接到不同的電力迴路或不同的 UPS","兩顆都接在同一條延長線上，方便管理","只接一顆，另一顆留著當備品","兩顆接到同一台 UPS 的相鄰插座，這樣線材最短也最整齊"],why:"雙電源是為了其中一路斷電還能活。兩顆接同一路，那一路跳掉就全滅，等於沒有備援。"},
 {q:"機房冷氣採「N+1」配置，意思是？",a:["比實際需要的數量多準備一台當備援","每一台冷氣都有一台一模一樣的備援","總共只有一台冷氣","冷氣的數量是伺服器數量再加一"],why:"需要 N 台才夠，就裝 N+1 台，任何一台故障或保養時仍然足夠。每台都配一台備援的叫 2N。"},
 {q:"資料庫很慢，儲存設備的容量還剩一半以上。問題可能出在儲存的哪個指標？",a:["IOPS 或延遲，也就是讀寫的速度不夠","剩餘容量太多，資料太分散","硬碟的外觀尺寸","儲存設備的保固年限快要到期，效能會跟著自動下降"],why:"容量夠不代表夠快。資料庫吃的是每秒讀寫次數和延遲，這要看磁碟類型和陣列配置。"},
 {q:"一台核心設備已經過了原廠保固和支援年限，但目前運作正常。應該怎麼處理？",a:["評估風險並排入汰換計畫，汰換前準備備品或延長維護","還能用就繼續用，壞了再買","立刻關機停用","把它搬到比較涼的位置，設備的壽命就可以再延長好幾年"],why:"過了支援年限，壞了沒零件、有漏洞沒修補。不一定要馬上換，但風險要有人知道、要有計畫。"},
 {q:"虛擬化平台上，分配給所有虛擬機的記憶體加起來，超過實體主機的記憶體。會有什麼風險？",a:["虛擬機同時吃滿時，主機記憶體不足，全部一起變慢","完全沒有風險，虛擬化平台會自動變出更多的記憶體","虛擬機會無法開機","實體主機的硬碟會壞掉"],why:"超額配置是賭大家不會同時用滿。賭輸時主機開始搶記憶體，上面所有系統的效能一起崩。"},
 {q:"虛擬機的「快照」可以當作備份嗎？",a:["不行，快照和虛擬機放在同一套儲存上，儲存壞了一起消失","可以，快照就是備份的另一種說法","可以，只要快照的數量夠多","不行，因為快照只會記錄虛擬機的名稱和設定，不包含磁碟裡的任何資料"],why:"快照是變更前的臨時保險，用完就該刪。留太久會拖慢效能、吃掉空間，而且它依賴原本的磁碟。"},
 {q:"定期盤點「買了多少授權」和「實際裝了多少」，除了避免授權糾紛，還有什麼資安上的價值？",a:["找出沒人管、沒在更新的軟體","讓電腦的開機速度變快","可以向軟體廠商要求退還多買的授權費用，並且爭取下一年度的折扣","沒有資安上的價值"],why:"不知道裝了什麼，就不知道哪裡有漏洞。出現重大漏洞時，資產清單是第一個要翻的東西。"},
 {q:"存放過個資的硬碟要報廢。正確的處理方式是？",a:["用認可的方式抹除或實體破壞，並留下紀錄","格式化之後交給回收商","直接丟進資源回收桶","把檔案全部刪除並清空資源回收筒，確認資料夾是空的就可以交出去"],why:"刪除和格式化都救得回來。要用覆寫、消磁或實體破壞，並記錄是哪顆硬碟、誰處理、什麼時候。"}
]]},
{id:'sw',ic:'📦',col:'#fbf1d9',name:'軟體',desc:'安裝、驅動、更新、相容性和授權',ranks:['軟體見習','安裝員','軟體達人'],lv:[[
 {q:'驅動程式（driver）是做什麼用的？',a:['讓作業系統能夠控制並使用硬體裝置','讓電腦上網和下載的速度變得比較快','偵測並清除電腦病毒','定期備份使用者的檔案'],why:'沒有正確的驅動，硬體接上去作業系統也不會用。'},
 {q:'廠商定期釋出的軟體更新（修補程式），最主要的目的是？',a:['修正安全漏洞和程式錯誤','讓程式的圖示變得比較好看','增加硬碟可以使用的容量','降低電腦的耗電量'],why:'沒修補的漏洞是被入侵最常見的入口，所以更新要按時上。'},
 {q:'程式安裝完打不開，訊息說缺少某個 DLL 或執行環境。先怎麼處理？',a:['安裝它需要的執行環境，例如 VC++ 可轉散發套件或 .NET','表示系統已經損壞，要把 Windows 整個重灌一次','換一台新的電腦再安裝','把防毒軟體關掉再開一次'],why:'很多程式依賴共用的執行環境，補裝對應版本就能執行。'},
 {q:'在公司的電腦上安裝軟體，哪一個做法正確？',a:['只安裝經過核准、有合法授權、來源可信的軟體','網路上找得到安裝檔的就可以裝','試用版到期後，用破解的方式延長使用沒有關係','同事用隨身碟給的版本最快最方便'],why:'來路不明或盜版軟體是惡意程式的主要來源，也有法律責任。'},
 {q:'Windows 的「相容模式」是用來做什麼的？',a:['讓舊版程式用舊版 Windows 的方式執行','加快電腦的開機速度','讓筆電的電池撐比較久','切換作業系統和程式的顯示語言'],why:'有些老程式在新版 Windows 跑不起來，可以先試相容模式。'},
 {q:'用瀏覽器開內部系統，畫面顯示怪怪的，但別人的電腦正常。先試什麼？',a:['清除快取，或用無痕視窗開一次，看是不是快取或擴充套件造成','把作業系統重灌','換一台解析度比較高、尺寸比較大的螢幕再試','換一條新的網路線'],why:'無痕視窗不帶快取和擴充套件，能很快分出是不是瀏覽器本身的問題。'},
 {q:'32 位元和 64 位元作業系統，最主要的差別是？',a:['64 位元可以使用超過 4GB 的記憶體','64 位元的系統耗電量比較低','32 位元的安全性比較高','兩者在功能上沒有任何差別'],why:'32 位元的定址空間只有 4GB，裝再多記憶體也用不到。'},
 {q:'「開源軟體」（open source）指的是？',a:['原始碼公開，依照授權條款可以使用和修改','一定免費，而且使用上沒有任何限制','沒有著作權，任何人都可以佔為己有','只能個人使用，不可以用在商業用途'],why:'開源仍然有著作權和授權條款（GPL、MIT…），用之前要看清楚條款。'},
]]},
{id:'net',ic:'🌐',col:'#dcefff',name:'網路',desc:'IP、DNS、DHCP、交換器和基本排錯',ranks:['網路見習','網路值班','網路負責人'],lv:[[
 {q:'IP 位址寫成 <code>192.168.1.10/24</code>，它的子網路遮罩是？',a:['255.255.255.0','255.255.0.0','255.0.0.0','255.255.255.255'],why:'/24 代表前 24 個位元是網路位址，也就是 255.255.255.0。'},
 {q:'DNS 的功能是什麼？',a:['把網域名稱轉換成 IP 位址','自動分配 IP 位址給電腦','把傳輸的資料加密','過濾網路上的病毒'],why:'電腦靠 IP 連線，人記名稱，DNS 負責中間的翻譯。'},
 {q:'DHCP 的功能是什麼？',a:['自動分配 IP、遮罩、閘道、DNS 給設備','把使用者輸入的網域名稱解析成 IP 位址','決定封包要往哪一條路送','阻擋外部不明的連線'],why:'沒有 DHCP 的話，每台設備都要手動設定網路參數。'},
 {q:'電腦的 IP 變成 <code>169.254.x.x</code>，代表什麼？',a:['沒有從 DHCP 拿到位址，系統自己給了一個','一切正常，這是公司內部網路常用的私有網段','這台電腦被防火牆封鎖了','DNS 伺服器故障了'],why:'169.254.0.0/16 是 APIPA：要不到 DHCP 時自動產生的位址，通常代表線路或 DHCP 有問題。'},
 {q:'用 IP 可以 ping 到伺服器，但用名稱就連不上。最可能是哪裡的問題？',a:['DNS 解析有問題','網路線接觸不良','交換器整台故障','預設閘道設定錯誤'],why:'IP 通代表線路和路由沒事，只有名稱不通就是名稱解析的問題。'},
 {q:'交換器（switch）主要是依據什麼來轉送資料？',a:['MAC 位址','IP 位址','連接埠號碼','網域名稱'],why:'一般交換器工作在第二層，靠 MAC 位址表決定從哪個埠送出。'},
 {q:'「預設閘道」（default gateway）的作用是？',a:['把要送到其他網段的封包轉送出去','把網域名稱轉換成 IP 位址','自動發放 IP 位址給電腦','把封包內容加密'],why:'同網段直接送；不同網段的封包都交給預設閘道。閘道設錯會變成只能連同網段。'},
 {q:'HTTPS 預設使用哪一個連接埠？',a:['TCP 443','TCP 80','TCP 22','TCP 3389'],why:'80 是 HTTP、22 是 SSH、3389 是遠端桌面。'},
],[
 {q:"<code>192.168.10.0/26</code> 這個網段，可以分配給主機使用的 IP 有幾個？",a:["62","64","126","254"],why:"/26 剩 6 個位元給主機，2 的 6 次方是 64，扣掉網路位址和廣播位址，可用 62 個。"},
 {q:"VLAN 的作用是什麼？",a:["在同一批交換器上切出彼此隔開的網段","讓網路的速度變成兩倍","把無線網路的訊號延伸到比較遠的樓層和角落，改善收訊不良的問題","幫每台電腦自動分配 IP"],why:"VLAN 把一台實體交換器在邏輯上切成好幾個廣播網域，不同 VLAN 要互通得經過路由。"},
 {q:"電腦 ping <code>168.95.1.1</code> 會通，但瀏覽器打網址全部開不了。最可能是哪裡有問題？",a:["DNS","網路線","網路卡壞了","電腦完全沒有連上網路，所以不管是用 IP 還是用網址都一樣連不出去"],why:"168.95.1.1 是中華電信的 DNS，ping 得到代表對外是通的。IP 通、名稱不通，就往 DNS 設定查。"},
 {q:"<code>tracert</code>（Linux 是 <code>traceroute</code>）主要用來看什麼？",a:["封包一路經過哪些節點、卡在哪一站","這台電腦開了哪些連接埠","目前的下載和上傳速度","網域名稱對應到的 IP"],why:"它會列出到目的地沿途的每一站。從哪一站開始沒回應，就是往哪裡查的線索。"},
 {q:"NAT 的主要用途是？",a:["讓使用私有 IP 的內部電腦，共用對外的 IP 上網","把網址轉換成 IP 位址","幫內部的電腦自動分配 IP、遮罩、閘道和 DNS 這些網路設定","防止交換器之間形成迴圈"],why:"私有 IP（像 192.168.x.x、10.x.x.x）在網際網路上不能直接用，出去時由 NAT 轉成對外的 IP。"},
 {q:"兩台電腦被設成同一個 IP。會出現什麼狀況？",a:["兩台的網路都會時通時不通","兩台都完全正常，速度各分一半","交換器會自動幫其中一台換一個沒有人在用的 IP，使用者不會有感覺","整個網段的電腦都會當機"],why:"IP 衝突時，網路上其他設備一下認這台、一下認那台，所以兩邊都斷斷續續。"},
 {q:"有人把一條網路線的兩頭都插在同一台交換器上，結果整層樓網路癱瘓。原因是？",a:["形成迴圈，造成廣播風暴","那條線太長，訊號衰減","交換器的連接埠全部被這一條線佔滿了，其他電腦沒有位置可以用","DHCP 的 IP 發完了"],why:"迴圈會讓廣播封包無限繞圈、越來越多。交換器開啟 STP 或迴圈偵測就是為了防這個。"},
 {q:"DNS 的 MX 紀錄是用來指定什麼？",a:["這個網域的郵件要送到哪台主機","網域名稱對應的 IPv4 位址","這個網域的別名","負責這個網域的名稱伺服器"],why:"MX 管收信。對應 IPv4 是 A 紀錄、別名是 CNAME、名稱伺服器是 NS。"}
],[
 {q:"兩個不同 VLAN 的電腦要互相連線，需要什麼？",a:["有路由功能的設備，例如三層交換器或路由器","接在同一台交換器上就可以","把兩台電腦的 MAC 位址改成一樣","一條跳線把兩個 VLAN 的連接埠直接對接，這是標準的做法"],why:"VLAN 之間是隔開的二層網段，要互通必須經過第三層的路由。"},
 {q:"交換器的 trunk 埠和 access 埠，差別在哪裡？",a:["trunk 可以同時載送多個 VLAN，access 只屬於一個 VLAN","trunk 的速度一定比 access 快十倍","trunk 給無線網路用，access 給有線網路用","兩者其實沒有任何差別，只是不同廠牌的交換器對同一種連接埠各自取了不一樣的名稱"],why:"交換器之間、交換器到無線基地台或虛擬化主機通常用 trunk，一條線帶多個 VLAN；接一般電腦用 access。"},
 {q:"連上 VPN 之後，ping 得到對方、小網頁也開得了，但大檔案傳輸和某些網站一直卡住。最該懷疑什麼？",a:["MTU 的問題，大封包過不去","DNS 設定錯誤","對方的伺服器當機了","VPN 的帳號權限不夠，只開放了瀏覽小型網頁的功能"],why:"VPN 會多包一層，可用的封包大小變小。小封包沒事、大封包被丟掉，就是典型的 MTU 症狀。"},
 {q:"有人在辦公室私接一台家用分享器，結果附近的電腦都拿到奇怪的 IP、上不了網。交換器上哪個功能可以防止？",a:["DHCP Snooping","Spanning Tree","Port Mirroring","PoE"],why:"私接的分享器會搶著發 IP。DHCP Snooping 只允許指定的連接埠回應 DHCP，其他埠發的一律丟掉。"},
 {q:"802.1X 在企業網路裡的用途是？",a:["設備接上網路時，先驗證身分才放行","讓無線網路的速度變快","自動幫交換器備份設定檔，設備故障的時候可以直接還原","防止交換器之間產生迴圈"],why:"沒有 802.1X，隨便一台電腦插上牆上的網路孔就進內網。有了它，要通過驗證才能連線。"},
 {q:"一條線路換過線、換過埠還是很慢，交換器上看到這個埠有大量錯誤和碰撞。最可能的原因是？",a:["兩端的速度或雙工設定不一致","IP 位址衝突","DNS 伺服器回應太慢","這條線路的使用者太多，頻寬已經被完全用滿了"],why:"一邊全雙工、一邊半雙工，線路會通但錯誤很多、非常慢。兩端都設自動協商，或兩端都固定成一樣。"},
 {q:"狀態式防火牆環境中，封包去的時候走 A 防火牆，回來卻走 B 防火牆。會發生什麼事？",a:["B 沒有這條連線的紀錄，回程封包會被丟掉","沒有影響，防火牆只檢查出去的方向","速度會變成兩倍","兩台防火牆會自動互相同步所有的連線狀態，使用者不會有任何感覺"],why:"這叫非對稱路由。狀態式防火牆要看到連線的開頭才認得後面的封包，來回不同路就會被擋。"},
 {q:"把兩條網路線綁成一組（Link Aggregation／LACP），主要的好處是？",a:["頻寬加總，而且其中一條斷了還能繼續通","可以把網路線的長度限制延長一倍","讓兩個不同的 VLAN 不需要經過路由就可以直接互相連線","自動擋掉網路上的病毒"],why:"鏈路聚合同時提供更大的頻寬和備援。伺服器到交換器、交換器之間的上行都很常用。"}
],[
 {q:"整棟大樓的網路都經過同一台核心交換器。架構上最該改善的是？",a:["做成雙核心，各樓層交換器雙上行","把那一台換成更貴的型號","多買一台放在倉庫當備品，壞掉的時候再拿出來換上去，設定到時候再重新輸入","把核心交換器的風扇轉速調高"],why:"再貴的單一設備還是單點。雙核心加雙上行，一台故障或升級時流量可以走另一邊。"},
 {q:"為了趕快解決問題，防火牆臨時開了一條 any 到 any 的規則。之後最重要的是什麼？",a:["設定到期日，問題查清楚後改成最小範圍的規則","既然通了就留著，免得以後又出一樣的問題","再多開幾條 any 的規則，避免其他系統之後也遇到同樣被擋的狀況","把這條規則移到最下面"],why:"「臨時」的規則最容易變成永久的漏洞。要有到期日、申請人和原因，並定期清查。"},
 {q:"監視器、門禁、印表機這類連網設備，網路上應該怎麼規劃？",a:["放在獨立的網段，只開放必要的連線","跟辦公室的電腦放在同一個網段，管理比較方便","直接給它們對外的固定 IP，這樣廠商遠端維護的時候比較快","不需要特別規劃"],why:"這類設備很少更新、常有預設密碼，很容易被當成入侵內網的跳板。隔離起來，被打下也走不遠。"},
 {q:"公司拉了兩條對外線路做備援。規劃時最該確認什麼？",a:["兩條是不是走不同的業者和不同的實體路由","兩條的月租費是不是一樣","兩條線路用的數據機是不是同一個廠牌、同一個型號，方便日後維護","兩條的 IP 是不是連號"],why:"兩條線如果進同一個管道、同一個機房，一次施工挖斷就一起斷。備援要連實體路徑都分開。"},
 {q:"用 Wireshark 擷取封包，看到大量的 TCP Retransmission（重傳）。這代表什麼？",a:["路徑上有掉包或壅塞","連線被加密了","DNS 伺服器設定錯誤","這是正常現象，所有的 TCP 連線本來就都會把每個封包重新傳送好幾次"],why:"對方沒確認收到，才會重傳。少量正常，大量就表示中間有掉包：線路品質、壅塞或設備問題。"},
 {q:"對外頻寬突然被用滿，想知道是哪個 IP、哪種流量佔掉的。最適合的工具是？",a:["NetFlow／sFlow 這類流量分析","ping","nslookup","逐一打電話問每個部門的同事，現在是不是有人正在下載比較大的檔案"],why:"流量分析會記錄誰跟誰、用什麼協定、傳了多少。幾分鐘就能找到那個佔頻寬的來源。"},
 {q:"要遠端修改一台異地交換器的設定，改錯可能會把自己擋在外面。動手前應該先做什麼？",a:["備份現有設定，並設定一段時間後自動還原或重啟","先改改看，連不上再請當地的人去重開機","把所有設定一次全部貼上去，速度越快越不容易出錯","先把遠端管理的功能關掉"],why:"很多設備有「幾分鐘後自動重啟回復舊設定」的功能。改完確認沒問題再取消，就不會把自己鎖在外面。"},
 {q:"辦公室的 2.4GHz 無線網路很不穩，基地台很多、訊號也強。最可能的原因是？",a:["頻道互相重疊干擾","基地台的數量太少","使用者的電腦記憶體不足，沒有辦法同時處理這麼多個無線基地台的訊號","網路線太短"],why:"2.4GHz 互不重疊的頻道只有 1、6、11。基地台多又亂設頻道，訊號強反而互相蓋台。"}
]]},
{id:'sec',ic:'🛡️',col:'#fbe6e3',name:'資訊安全',desc:'基本觀念、常見攻擊，以及遇到事情的第一步',ranks:['資安見習','資安值班','資安守門員'],lv:[[
 {q:'資訊安全的三個基本要素（CIA）是？',a:['機密性、完整性、可用性','控制性、識別性、稽核性','加密、身分、授權','成本、效益、風險'],why:'Confidentiality、Integrity、Availability：不外洩、不被竄改、要用的時候用得到。'},
 {q:'收到一封信說「帳號異常，請立即點連結重設密碼」。應該怎麼做？',a:['不點連結，自己從官方管道登入確認，並通報資訊單位','馬上點連結把密碼改掉比較安全','先轉寄給其他同事，問他們有沒有收到一樣的信再決定','直接回信問寄件人是不是真的'],why:'這是典型的釣魚信。不點、不回、通報；轉寄會讓更多人中招。'},
 {q:'「多因素驗證」（MFA）指的是？',a:['用兩種以上不同類型的方式驗證身分，例如密碼加手機','設定兩組不同的密碼，登入時兩組都要輸入才能通過','使用一組非常長的密碼','規定每天都要更換一次密碼'],why:'因素分三類：你知道的、你持有的、你本身的。兩組密碼都屬於同一類，不算多因素。'},
 {q:'懷疑電腦中了勒索軟體。第一步應該做什麼？',a:['馬上斷開網路，不要關機，然後通報資安人員','依照畫面上的指示先付贖金，把檔案救回來再說','把電腦重新開機看會不會恢復','先把手上的工作做完再處理'],why:'斷網是為了不要擴散到別台；不關機是為了保留記憶體裡的證據。'},
 {q:'「最小權限原則」是什麼意思？',a:['只給完成工作所需要的最低權限','為了方便，每個人都給管理員權限','權限給得越多，工作效率越高','只有主管才可以擁有系統權限'],why:'權限越大，帳號被盜時的損害越大。'},
 {q:'弱點掃描和滲透測試，差別在哪裡？',a:['掃描是工具自動找已知弱點；滲透測試是人實際嘗試入侵來驗證','兩個是同一件事的不同說法','弱點掃描一定會真的入侵系統；滲透測試只是看報告','滲透測試不需要事先取得授權'],why:'兩者都要授權。掃描廣而淺，滲透測試深而有針對性。'},
 {q:'「社交工程」是什麼？',a:['利用人的信任、恐懼或好奇，騙取資料或讓人做出某些操作','一種把資料加密的技術','在社群網站上經營帳號、吸引人點擊的行銷方法','一種防火牆的規則設定'],why:'攻擊的對象是人，不是系統，所以技術再好也擋不住，要靠訓練和流程。'},
 {q:'備份的「3-2-1 原則」是指？',a:['3 份資料、2 種不同的儲存媒體、1 份放在異地','每 3 天備份 2 次，保留 1 個月','3 個人保管 2 把鑰匙，開 1 個機櫃','3 台伺服器、2 條線路、1 台 UPS'],why:'避免單一故障或單一地點的災害讓所有備份一起消失。'},
],[
 {q:"系統儲存使用者密碼，正確的做法是？",a:["存加鹽之後的雜湊值，不存密碼本身","用可以解回來的加密方式存，這樣使用者忘記密碼的時候才查得到","存明碼，但資料庫設密碼","存在只有管理員知道的 Excel 檔"],why:"雜湊不能還原，就算資料庫外洩，攻擊者也拿不到原本的密碼。加鹽是讓相同的密碼算出不同結果。"},
 {q:"手機收到簡訊：「您的 ETC 通行費逾期未繳，請點以下連結繳費」，後面是一串短網址。該怎麼做？",a:["不點連結，自己開官方 App 或官網查","點進去看看，沒有輸入資料就沒關係","趕快繳一繳，逾期會被罰錢，金額也不大，就算是假的損失也有限","回覆簡訊問對方是不是真的"],why:"這是台灣很常見的釣魚簡訊。要查就自己從官方管道進去，不確定可以打 165 反詐騙專線。"},
 {q:"弱點掃描報告有上百項。哪一種應該排最前面處理？",a:["CVSS 分數高，而且是對外服務的主機","出現次數最多的那一種弱點，因為影響的主機數量最多","修起來最簡單的","報告上排在第一頁的"],why:"優先順序看的是「嚴重程度」加上「暴露程度」。高風險又直接對外，被打的機會最大。"},
 {q:"「零信任」（Zero Trust）最核心的觀念是？",a:["不因為連線來自內部網路就直接信任，每次存取都要驗證","公司內所有人彼此都不要互相信任","完全不讓任何外部的連線進到公司，所有系統都只能在辦公室裡面使用","只信任資安人員"],why:"傳統做法是「進了內網就可信」。零信任是不管在哪，都要看身分、裝置狀態和權限再決定放不放行。"},
 {q:"關於密碼，下列哪一個做法比較安全？",a:["長的密碼片語，再加上多因素驗證","8 個字的複雜密碼，每個月強制換一次","每個系統都用同一組很複雜的密碼，這樣比較不會忘記，也就不用抄下來","把密碼寫在便條紙貼在螢幕旁"],why:"長度比複雜更有用。太常強迫更換，大家只會改尾數；再加上 MFA，密碼外洩也不會直接失守。"},
 {q:"在公司停車場撿到一支隨身碟。該怎麼處理？",a:["不要插任何電腦，交給資安或資訊單位","插到自己的電腦看看是誰的，好還給他","插到沒有連網路的舊電腦上看，這樣就算裡面有病毒也傳不出去","格式化之後自己留著用"],why:"故意丟隨身碟是很老但很有效的攻擊手法。交給有隔離環境的人處理。"},
 {q:"員工離職，他的帳號應該什麼時候停用？",a:["離職當天","等下個月帳號定期清查的時候，跟其他要停用的帳號一起處理","等接手的人說不需要了再停","不用停，把密碼改掉就好"],why:"離職後還能用的帳號，是很常見的入侵和資料外洩管道。要有人事通知資訊單位的流程。"},
 {q:"系統的 log 為什麼要另外集中保存，不只放在原本的主機上？",a:["主機被入侵時，攻擊者可能把上面的紀錄刪掉","這樣原本的主機可以跑得比較快","因為法規規定所有的紀錄都必須用紙本列印出來，並且由主管逐頁簽名","為了讓所有員工都能自己上去查"],why:"攻擊者常會清掉自己的足跡。log 另外送到集中的地方，事後才有東西可以查。"}
],[
 {q:"資安事件應變的階段，順序是？",a:["識別、圍堵、根除、復原、檢討","復原、識別、檢討、圍堵、根除","檢討、根除、識別、復原、圍堵","先根除和復原讓服務上線，其他的階段可以視情況省略"],why:"先確認發生什麼事、不讓它擴大，再清乾淨、恢復服務，最後檢討。順序亂了常會邊修邊被打。"},
 {q:"確認一台主機被入侵了。在鑑識人員到之前，比較正確的處理是？",a:["把它從網路隔離，但不要關機也不要重灌","馬上重灌，越快恢復乾淨的狀態越好","立刻關機，把電源線拔掉","繼續讓它正常運作，以免打草驚蛇，等攻擊者自己離開"],why:"隔離是為了止血。關機會讓記憶體裡的證據消失，重灌更是把入侵的路徑和範圍全部抹掉。"},
 {q:"「橫向移動」（Lateral Movement）指的是什麼？",a:["攻擊者拿下一台之後，在內網往其他主機擴散","員工在部門之間調動","把伺服器從一個機房搬到另一個機房，過程中資料可能外洩","資料在兩台主機之間同步"],why:"攻擊者很少一次就打到目標，通常先拿下一台再往內走。網段切分、限制管理帳號就是在擋這一步。"},
 {q:"EDR 和傳統防毒軟體，最主要的差別是？",a:["EDR 會記錄並分析端點上的行為，事後可以追查和處置","EDR 只是比較貴的防毒軟體，功能完全一樣","EDR 不需要安裝在電腦上","傳統防毒可以防所有的新型攻擊，EDR 只能防已知的病毒"],why:"傳統防毒主要靠特徵比對擋已知的惡意程式。EDR 看的是行為，能發現沒見過的手法，也留下調查用的紀錄。"},
 {q:"一家軟體廠商的更新伺服器被駭，客戶裝了「官方更新」反而中毒。這種攻擊叫什麼？",a:["供應鏈攻擊","阻斷服務攻擊","暴力破解","社交工程"],why:"攻擊者不直接打你，改打你信任的廠商。所以廠商管理、更新驗證、最小權限都是資安的一部分。"},
 {q:"網域管理員帳號，為什麼不應該拿來登入一般使用者的電腦？",a:["那台電腦如果已經被入侵，管理員的憑證會被偷走","一般電腦的效能不夠，登入會很慢","網域管理員帳號在一般電腦上本來就登入不了，系統會自動擋下來","這樣會佔用使用者的授權數量"],why:"登入過的地方會留下憑證。高權限帳號只在受保護的管理主機上使用，是防止整個網域被拿下的基本功。"},
 {q:"「縱深防禦」的意思是？",a:["疊好幾層不同的防護，一層被突破還有下一層","把所有的預算集中買一台最好的防火牆","把機房設在地下室比較深的樓層，降低被實體入侵的機會","只保護最重要的那一台伺服器"],why:"沒有任何單一防護是百分之百的。防火牆、端點防護、權限控管、監控、備份，各自補別人的洞。"},
 {q:"資安情資裡常提到的 IoC（入侵指標）是什麼？",a:["可以用來判斷是否被入侵的線索，例如惡意 IP、網域、檔案雜湊值","評估公司資安成熟度的分數","攻擊者組織的正式名稱以及成員名單，每一年由各國政府共同彙整之後統一對外公布","防火牆的一種授權模式"],why:"拿到 IoC 就能回頭查自己的 log：有沒有人連過這個 IP、有沒有這個雜湊值的檔案。"}
],[
 {q:"MITRE ATT&CK 是什麼？",a:["整理攻擊者戰術和手法的知識庫","一套防毒軟體","一張資安證照","美國政府規定所有企業都必須通過的一項資訊安全強制驗證標準"],why:"它把攻擊拆成戰術（要達成什麼）和技術（怎麼做）。可以用來檢視自己的偵測涵蓋了哪些、缺哪些。"},
 {q:"一條偵測規則每天跳幾百個告警，幾乎都是誤報，值班的人已經不看了。該怎麼處理？",a:["調整規則的條件和排除清單，讓它只在該響的時候響","把這條規則直接關掉","維持現狀，寧可多報也不要漏報","規定值班人員每一個告警都一定要逐一點開來看，並且寫下判斷的理由"],why:"沒人看的告警等於沒有告警，真的攻擊也會被淹沒。關掉會漏、放著也會漏，要調到可以處理的量。"},
 {q:"紅隊演練和一般的滲透測試，主要差別在哪裡？",a:["紅隊模擬真實攻擊者達成特定目標，同時考驗防守方能不能發現","紅隊演練不需要取得授權","兩者只是名稱不同","滲透測試是由公司內部的人來做，紅隊演練則一定要找國外的廠商"],why:"滲透測試重點是盡量找出弱點；紅隊是設定目標（例如拿到某份資料），看整個偵測和應變能不能擋下來。"},
 {q:"「威脅獵捕」（Threat Hunting）和等告警響再處理，差別是什麼？",a:["主動假設已經被入侵，去資料裡找還沒觸發告警的跡象","威脅獵捕是把攻擊者抓去報警","威脅獵捕只能在事件發生後做","沒有差別，兩個名詞講的是同一件事，只是不同廠商各自的行銷用語而已"],why:"偵測規則只抓得到已知的模式。獵捕是帶著假設（例如「有人用合法工具在橫向移動」）去翻紀錄。"},
 {q:"管理者要連進伺服器，為什麼建議一律經過跳板機（或特權存取管理系統）？",a:["集中管控和記錄所有的管理連線","連線速度會比較快","這樣管理者就可以不用記密碼，所有伺服器都可以直接登入而不需要驗證","可以節省伺服器的授權費用"],why:"管理連線只剩一個入口，可以強制 MFA、側錄操作、限制來源。伺服器也就不必對整個內網開管理埠。"},
 {q:"確認 AD 被攻擊者取得網域管理員權限。清除階段的密碼重設，範圍應該是？",a:["所有特權帳號、服務帳號和 krbtgt，必要時全部使用者","只要重設那一個被盜用的帳號","不用重設，把攻擊者的 IP 封鎖就可以","只需要重設資訊部門同仁的帳號，一般使用者的帳號因為權限很低所以不受影響"],why:"拿到網域管理員就能把所有帳號的雜湊倒出來。只換一個帳號，攻擊者用另一個再進來就好。"},
 {q:"要及早發現「有人正在把大量資料往外傳」，哪一種做法最直接？",a:["監控對外流量的異常，例如離峰時段的大量上傳","定期更換所有人的密碼","把所有員工的 USB 連接埠全部用膠封死，並且禁止任何人攜帶手機進辦公室","每年做一次弱點掃描"],why:"資料外洩最後都要經過網路出去。平常有流量基準，突然多出來的上傳量就很顯眼。"},
 {q:"一台老舊系統因為相容性，完全無法更新修補，業務上又不能停用。比較合理的做法是？",a:["用補償性的控制：隔離網段、限制可連線的來源、加強監控","既然不能修補，就當作沒有這個風險","不管業務的影響，直接關機","把它直接接上網際網路，方便原廠工程師隨時從遠端連進來協助處理問題"],why:"修不了就把它圍起來，減少能碰到它的路徑並盯緊它。這個風險也要記錄下來，由有權責的人接受。"}
]]},

 {q:'要查看這台電腦完整的 IP 設定（含 DNS、MAC），用哪個指令？',a:['ipconfig /all','ping -t','nslookup','tasklist'],why:'<code>ipconfig /all</code> 會列出每張網卡的 IP、遮罩、閘道、DNS、MAC。'},
 {q:'電腦加入網域後，使用者登入時，帳號密碼是由誰驗證？',a:['網域控制站（Active Directory）','這台電腦本機的帳號資料庫（SAM）','DNS 伺服器','DHCP 伺服器'],why:'網域帳號集中在 AD，由網域控制站負責驗證。'},
 {q:'群組原則（GPO）是用來做什麼的？',a:['集中對網域內的電腦和使用者套用設定和限制','定期備份網域內所有電腦和使用者的檔案','掃描並清除電腦上的病毒','遠端連線操作使用者的桌面'],why:'例如密碼規則、禁用 USB、桌布、軟體派送，都可以用 GPO 一次套用。'},
 {q:'改了群組原則之後，想讓這台電腦立刻重新套用。用哪個指令？',a:['gpupdate /force','gpresult /r','sfc /scannow','chkdsk /f'],why:'<code>gpresult /r</code> 是查看目前套用了哪些原則，不是重新套用。'},
 {q:'要查 Windows 的系統錯誤、服務啟動失敗的紀錄，應該看哪裡？',a:['事件檢視器（Event Viewer）','記事本','小畫家','控制台裡的「程式和功能」'],why:'系統、應用程式、安全性的紀錄都在事件檢視器。'},
 {q:'<code>sfc /scannow</code> 這個指令的用途是？',a:['檢查並修復受損的 Windows 系統檔案','重組磁碟裡的檔案','掃描整台電腦有沒有病毒和惡意程式','釋放被佔用的記憶體'],why:'System File Checker：系統檔案被改壞或遺失時用它修。'},
 {q:'遠端桌面（RDP）預設使用哪一個連接埠？',a:['TCP 3389','TCP 22','TCP 445','TCP 5900'],why:'22 是 SSH、445 是 SMB 檔案共用、5900 是 VNC。3389 不應該直接對網際網路開放。'},
 {q:'一個共用資料夾同時設了「共用權限」和「NTFS 權限」。使用者從網路連進來時，實際的權限是？',a:['兩者之中比較嚴格的那一個','兩者之中比較寬鬆的那一個','只看共用權限','只看 NTFS 權限'],why:'兩層都要通過，所以取交集，也就是較嚴格的結果。'},

 {q:"使用者說帳號被鎖住了。除了幫他解鎖，還應該查什麼？",a:["是哪一台裝置一直用錯的密碼在試","不用查，幫他解鎖之後請他下次輸入密碼的時候小心一點就好","他的電腦型號","他今天幾點上班"],why:"常見原因是手機、另一台電腦或網路磁碟還記著舊密碼一直試。沒找到來源，解鎖完馬上又鎖。"},
 {q:"想知道這台電腦和使用者實際套用到哪些群組原則，用哪個指令？",a:["<code>gpresult /r</code>","<code>ipconfig /all</code>","<code>chkdsk</code>","<code>tasklist</code>"],why:"<code>gpresult /r</code> 會列出已套用的 GPO。原則沒生效時，先用它確認到底有沒有套到。"},
 {q:"Windows 安全性記錄裡的事件識別碼 4625 代表什麼？",a:["登入失敗","登入成功","電腦開機","帳號被刪除"],why:"4625 是登入失敗，4624 是登入成功。短時間大量 4625 通常是有人或程式在猜密碼。"},
 {q:"Windows 的「安全模式」主要用來做什麼？",a:["只載入最基本的驅動和服務，用來判斷問題是不是驅動或軟體造成的","讓電腦上網的時候比較安全，不會中毒","在執行重要工作的時候把所有檔案都加密保護起來，結束之後再解開","讓電腦跑得比較快"],why:"安全模式下正常、一般模式下出事，代表問題在額外載入的驅動、服務或開機程式。"}
],[
 {q:"一台電腦突然無法用網域帳號登入，訊息提到時間有問題。原因是？",a:["電腦的時間和網域控制站差太多，Kerberos 驗證會失敗","使用者的密碼太短","這台電腦的硬碟空間已經不足，沒有辦法再替這位使用者建立新的設定檔","螢幕解析度設定錯誤"],why:"Kerberos 預設只容許 5 分鐘的時間差，超過就拒絕。主機板電池沒電、時間跑掉是常見原因。"},
 {q:"公司的 AD 只有一台網域控制站（DC）。最大的問題是？",a:["這台一壞，全公司都沒辦法登入和驗證","一台 DC 最多只能管理 100 個帳號","沒有問題，一台最好管理，設定也不會有不同步的狀況","群組原則會沒辦法使用"],why:"DC 是驗證的核心，至少要兩台互相複寫。只有一台等於整個公司的登入都押在一台機器上。"},
 {q:"全公司電腦的本機 Administrator 都用同一組密碼。為什麼這很危險？",a:["攻擊者拿到一台的密碼，就能登入所有電腦","密碼會比較容易忘記","Windows 不允許這樣設定","沒有什麼危險，這樣資訊人員到現場維修的時候才方便"],why:"這是內網橫向移動最常見的路。用 LAPS 這類工具讓每台的本機管理員密碼都不同，而且定期自動更換。"},
 {q:"網域層級和 OU 層級的群組原則，對同一個項目設了不同的值。預設哪一個會生效？",a:["OU 層級的","網域層級的","兩個都不生效","看哪一個原則的名稱排在前面"],why:"套用順序是本機、站台、網域、OU，後套用的蓋掉前面的，所以離物件最近的 OU 贏（沒有設強制的話）。"}
],[
 {q:"AD 的「分層管理」（Tier 0／1／2）在防什麼？",a:["高權限帳號的憑證，被留在比較容易被入侵的機器上","使用者安裝太多軟體","伺服器的硬碟空間不足","防止不同部門的使用者互相看到對方共用資料夾裡的檔案"],why:"網域控制站、伺服器、使用者電腦各用不同的管理帳號，不往下登入。這樣一台電腦被打下，拿不到上層的憑證。"},
 {q:"確認攻擊者已經取得網域的 krbtgt 帳號雜湊。清除時這個帳號的密碼要怎麼處理？",a:["重設兩次","重設一次就夠了","不用重設，改名就好","把這個帳號刪除"],why:"拿到 krbtgt 就能偽造任何人的票證（Golden Ticket）。AD 會保留前一組密碼，所以要重設兩次才會讓舊票證全部失效。"},
 {q:"有人誤刪了一整個 OU，裡面有三百個使用者帳號。最快、最完整的復原方式是？",a:["從 AD 資源回收筒還原（前提是事先有啟用）","照人事名單重新建立三百個帳號","把網域控制站重開機","請每一位使用者自己到資訊單位重新申請帳號，並且重新設定所有權限"],why:"重建的帳號 SID 不同，原本的權限全都對不上。AD 資源回收筒能連屬性和群組關係一起還原，但要事先啟用。"},
 {q:"事件調查時想查「這台電腦當時執行了哪些程式」，但安全性記錄裡什麼都沒有。最可能的原因是？",a:["沒有事先啟用程序建立的稽核（事件 4688）","Windows 本來就不會記錄這種資訊，任何設定都做不到","記錄檔被防毒軟體隔離了","使用者的權限太低"],why:"很多關鍵的稽核預設是關的。平時沒開，出事時就沒有紀錄可以查，這是調查最常遇到的遺憾。"}
]]},
{id:'linux',ic:'🐧',col:'#dcf3ea',name:'Linux 系統',desc:'檔案、權限、服務、紀錄和常用指令',ranks:['Linux 見習','系統值班','Linux 管理員'],lv:[[
 {q:'要列出目前目錄下所有檔案（含隱藏檔）和詳細資訊，用哪個指令？',a:['ls -la','ls -h','dir /a','cat .'],why:'<code>-l</code> 顯示詳細資訊，<code>-a</code> 連同以 . 開頭的隱藏檔一起列出。'},
 {q:'<code>chmod 755 run.sh</code> 設定之後，權限是？',a:['擁有者可以讀、寫、執行；群組和其他人可以讀和執行','所有人都可以讀、寫、執行','只有擁有者可以讀和寫；群組和其他人完全不能存取','所有人都只能讀取'],why:'7=rwx、5=r-x、5=r-x，三個數字依序是擁有者、群組、其他人。'},
 {q:'要持續看一個正在增加內容的 log 檔，用哪個指令？',a:['tail -f /var/log/syslog','head -n 10 /var/log/syslog','cat /var/log/syslog','touch /var/log/syslog'],why:'<code>tail -f</code> 會停在檔尾，有新內容就即時顯示。'},
 {q:'在使用 systemd 的系統上，要重新啟動 nginx 服務，用哪個指令？',a:['systemctl restart nginx','nginx --reboot','kill nginx','service nginx open'],why:'啟動、停止、重啟、看狀態分別是 <code>systemctl start / stop / restart / status</code>。'},
 {q:'要看各個磁碟分割區還剩多少空間，用哪個指令？',a:['df -h','free -h','lsblk','uname -a'],why:'<code>df -h</code> 看磁碟空間；<code>free -h</code> 是看記憶體。'},
 {q:'<code>sudo</code> 的作用是什麼？',a:['用其他使用者（預設是 root）的權限執行一個指令','切換到另一個使用者的家目錄，之後都在那裡工作','把系統關機','安裝作業系統'],why:'平常用一般帳號，需要時才用 sudo 提權，而且會留下紀錄。'},
 {q:'要在 app.log 裡找出含有 error 的行，用哪個指令？',a:['grep error app.log','find error app.log','ls error app.log','cd error app.log'],why:'<code>grep</code> 搜尋檔案內容；<code>find</code> 是依檔名、時間等條件找檔案。'},
 {q:'要即時看哪個程式吃掉最多 CPU，用哪個指令？',a:['top','pwd','whoami','uname'],why:'<code>top</code>（或 htop）會即時列出各程序的 CPU、記憶體用量。'},
],[
 {q:"磁碟快滿了，想知道目前目錄下哪個資料夾最佔空間，用哪個指令？",a:["<code>du -sh *</code>","<code>df -h</code>","<code>ls -la</code>","<code>free -h</code>"],why:"<code>df</code> 看的是整個分割區剩多少；<code>du</code> 才是看每個資料夾各用了多少。"},
 {q:"nginx 服務啟動失敗，想看它的詳細紀錄，用哪個指令？",a:["<code>journalctl -u nginx</code>","<code>cat /etc/passwd</code>","<code>uname -a</code>","<code>history</code>"],why:"systemd 管的服務，紀錄用 <code>journalctl -u 服務名稱</code> 看。"},
 {q:"一支程式卡住了要結束它。<code>kill</code> 和 <code>kill -9</code> 應該先用哪個？",a:["先用 kill，讓程式有機會自己收尾；沒反應才用 -9","直接用 kill -9，比較快也比較乾淨，不會留下任何東西","兩個完全一樣","都不要用，直接重開機"],why:"一般的 <code>kill</code> 是請程式自己結束，它可以先存檔、關連線。<code>-9</code> 是強制砍掉，可能留下寫到一半的資料。"},
 {q:"crontab 裡這一行代表什麼時候執行？",code:"0 2 * * * /opt/backup.sh",a:["每天凌晨 2 點","每 2 分鐘一次","每個月 2 號","每個星期二"],why:"五個欄位依序是分、時、日、月、星期。<code>0 2 * * *</code> 就是每天 2 點 0 分。"}
],[
 {q:"寫檔案時出現 <code>No space left on device</code>，但 <code>df -h</code> 顯示還有空間。最可能的原因是？",a:["inode 用完了","記憶體不足","這個目錄的權限設定不對","硬碟故障了"],why:"大量小檔案會把 inode 用光，空間還有也建不了新檔。用 <code>df -i</code> 確認。"},
 {q:"刪掉一個 20GB 的 log 檔，但 <code>df</code> 顯示空間沒有變多。為什麼？",a:["還有程式開著這個檔案，空間要等它關閉才會釋放","Linux 刪除檔案之後一定要重新開機，空間才會真的還回來","檔案其實進了資源回收筒","df 這個指令的數字每天才更新一次"],why:"檔案被刪了，但程式還握著它，空間就不會還回來。重啟那支服務，或一開始就用清空內容的方式處理。"},
 {q:"一台對外的 Linux 主機，SSH 最基本的強化是？",a:["禁止 root 直接登入，並改用金鑰驗證","把 root 的密碼設長一點就好","把 SSH 服務關掉，要管理主機的時候再請機房的人去現場接螢幕鍵盤","改用 Telnet"],why:"對外的 SSH 每天都有人在猜密碼。金鑰驗證加上禁止 root 直接登入，就擋掉絕大部分的暴力嘗試。"},
 {q:"主機的 load average 很高，但 CPU 使用率卻很低。比較可能是什麼狀況？",a:["很多程式在等磁碟或網路的讀寫","CPU 快要壞了，所以不敢全力運轉","記憶體裝太多","系統時間不準"],why:"load 算的是「在排隊的工作數」，包含等 I/O 的。CPU 很閒但 load 高，通常是磁碟太慢或掛載的網路儲存卡住。"}
],[
 {q:"主機記憶體用光，核心自動砍掉了資料庫的程序。這個機制叫什麼？",a:["OOM Killer","SELinux","cron","swap"],why:"記憶體耗盡時，核心會挑程序砍掉來自救，常常挑中吃最多的資料庫。<code>dmesg</code> 或系統紀錄裡查得到。"},
 {q:"服務啟動失敗，查出是被 SELinux 擋下來。比較正確的處理是？",a:["看稽核紀錄，針對這個服務調整規則","直接把 SELinux 整個關掉，以後就不會再遇到這種問題","重灌作業系統","改用 root 身分執行這個服務"],why:"整個關掉最省事，但也把一層防護拿掉了。稽核紀錄會寫明擋了什麼，照它調整標籤或規則即可。"},
 {q:"要讓一位同事可以重啟網站服務，但不該有完整的管理權限。sudo 應該怎麼設？",a:["只允許他執行重啟那個服務的指令","直接給他 ALL 的權限，比較方便","把 root 的密碼告訴他","把他的帳號加進所有的系統群組，這樣他需要做什麼的時候都不會被擋"],why:"sudoers 可以細到「哪個人、能跑哪幾個指令」。需要什麼給什麼，帳號被盜時損害才有限。"},
 {q:"用 Ansible 這類設定管理工具管理五十台主機，最大的價值是什麼？",a:["每台的設定一致，而且改了什麼都有紀錄可查","主機的硬體效能會提升","可以完全不需要了解 Linux，工具會自動判斷每一台主機應該要怎麼設定","主機就不需要再安裝安全性更新"],why:"手動改五十台，一定會有幾台漏掉或改得不一樣。設定寫成檔案、進版本控制，才知道現況和歷史。"}
]]},
{id:'db',ic:'🗄️',col:'#f0e6fa',name:'資料庫',desc:'SQL 基礎、交易、索引、備份和安全',ranks:['資料庫見習','資料管理員','DBA'],lv:[[
 {q:'關於主鍵（Primary Key），哪一個敘述正確？',a:['值必須唯一，而且不能是 NULL','值可以重複，但不能是 NULL','值必須唯一，但可以是 NULL','同一張表可以設定很多個主鍵'],why:'主鍵用來唯一識別每一筆資料。一張表只有一個主鍵（可以由多個欄位組成）。'},
 {q:'要從 patients 資料表取出 age 大於 65 的資料，哪一句 SQL 正確？',a:['SELECT * FROM patients WHERE age > 65;','SELECT patients WHERE age > 65;','GET * FROM patients IF age > 65;','FIND patients HAVING age > 65;'],why:'基本語法是 SELECT 欄位 FROM 資料表 WHERE 條件。'},
 {q:'執行 UPDATE 或 DELETE 之前，最重要的檢查是？',a:['確認有 WHERE 條件，並先用 SELECT 看會影響幾筆','先把資料庫主機重開機','先把其他使用者全部踢下線','不需要特別檢查，萬一執行錯了再用另一句 SQL 改回來'],why:'沒有 WHERE 的 UPDATE／DELETE 會動到整張表，這是最常見的資料事故。'},
 {q:'交易（Transaction）的 ACID 特性中，A 代表什麼？',a:['原子性：全部成功，或全部不做','可用性：系統隨時可以使用','授權：只有授權的人可以執行','自動化：系統會自動執行'],why:'Atomicity。另外三個是一致性、隔離性、持久性。'},
 {q:'在欄位上建立索引（Index），效果和代價是？',a:['查詢變快，但寫入變慢，也多佔空間','寫入變快，但查詢變慢，佔用空間減少','自動把資料壓縮','自動把資料加密'],why:'索引像書的目錄：找得快，但每次新增修改都要一起維護。'},
 {q:'要把兩張資料表依照關聯欄位合起來查詢，用哪一個語法？',a:['JOIN','UNION','GROUP BY','ORDER BY'],why:'JOIN 是依欄位把兩張表的資料列對起來；UNION 是把兩個查詢結果上下接起來。'},
 {q:'防範 SQL Injection 最有效的做法是？',a:['使用參數化查詢，不要把使用者輸入直接串成 SQL','把資料庫的錯誤訊息隱藏起來','網站改用 HTTPS 連線','把資料庫的連接埠改成別的號碼，讓外面找不到'],why:'參數化查詢讓輸入只會被當成資料，不會被當成指令執行。'},
 {q:'平常做「完整備份＋差異備份」。要還原到最新狀態，需要哪些備份？',a:['最近一次完整備份，加上最近一次差異備份','最近一次完整備份，加上之後每一次差異備份','只需要最近一次差異備份','只需要最近一次完整備份'],why:'差異備份記錄的是「上次完整備份之後的所有變動」，所以只要最新一份。每一份都要的是增量備份。'},
],[
 {q:"要清空一張資料表的資料，<code>DELETE</code>、<code>TRUNCATE</code>、<code>DROP</code> 哪個會連資料表本身都刪掉？",a:["DROP","DELETE","TRUNCATE","三個都會"],why:"DELETE 刪資料列（可加條件）；TRUNCATE 快速清空但表還在；DROP 是整張表連結構一起消失。"},
 {q:"外鍵（Foreign Key）的作用是？",a:["確保這個欄位的值，在另一張表裡真的存在","讓查詢的速度變快","把欄位的內容加密起來，沒有權限的帳號就算查到資料也看不懂","限制一張表最多只能有幾筆資料"],why:"例如訂單表的客戶編號，一定要是客戶表裡有的。外鍵是用來守住資料之間的關聯。"},
 {q:"這個查詢在資料量很大的表上跑得很慢，name 欄位明明有索引。最可能的原因是？",code:"SELECT * FROM staff WHERE name LIKE '%明';",a:["開頭是 % 的 LIKE 用不到索引，只能整張表掃","SELECT * 的寫法是錯的","資料表的名稱取得太短了，資料庫需要花比較多時間才找得到這張表","中文字不能當查詢條件"],why:"索引像字典的部首排序，要知道開頭才查得快。<code>%</code> 放在最前面，就只能一筆一筆比。"},
 {q:"在交易裡執行了 UPDATE，發現改錯了，而且還沒 COMMIT。該下什麼指令？",a:["ROLLBACK","COMMIT","DROP","再下一次相反的 UPDATE 把值一筆一筆改回來，然後再 COMMIT"],why:"還沒 COMMIT 的變更，ROLLBACK 就能整個取消。所以改重要資料時，先開交易再動手。"},
 {q:"這個查詢會得到什麼結果？",code:"SELECT dept, COUNT(*) FROM staff GROUP BY dept;",a:["每個部門各有幾個人","全公司總共有幾個人","每個人屬於哪一個部門","人數最多的那一個部門"],why:"<code>GROUP BY dept</code> 把資料依部門分組，<code>COUNT(*)</code> 算每一組有幾筆。"},
 {q:"資料庫每天晚上都有備份，而且排程都顯示成功。這樣夠安心了嗎？",a:["不夠，要定期實際還原一次，確認備份真的能用","夠了，排程顯示成功就代表備份檔沒有問題，需要的時候拿出來用就好","夠了，只要備份檔的大小有在增加","不夠，應該改成每小時備份一次"],why:"沒還原過的備份，只能算「希望它能用」。很多單位是出事那天才發現備份檔壞的或缺東西。"},
 {q:"應用程式連資料庫用的帳號，權限應該怎麼給？",a:["只給它需要的資料表和操作","直接用資料庫最高權限的管理員帳號，免得之後功能增加又要重新調整權限","每個程式都共用同一組帳號比較好管理","不用設密碼，反正在內網"],why:"程式被打穿時，攻擊者拿到的就是那個帳號的權限。權限越小，損害越小。"},
 {q:"要找出 email 欄位沒有填的資料，條件要怎麼寫？",a:["<code>WHERE email IS NULL</code>","<code>WHERE email = NULL</code>","<code>WHERE email = 0</code>","<code>WHERE NOT email</code>"],why:"NULL 代表「不知道」，不能用等號比，要用 <code>IS NULL</code>。用 <code>= NULL</code> 永遠查不到東西。"}
],[
 {q:"兩個交易各自鎖住一筆資料，又都在等對方手上那一筆。這個狀況叫什麼？",a:["死結（Deadlock）","髒讀（Dirty Read）","資料庫當機","索引損毀"],why:"資料庫會偵測到死結，挑其中一個交易強制取消。程式要能接住這個錯誤並重試，也盡量用固定的順序存取資料。"},
 {q:"有人在管理工具裡開了交易、改了資料，沒有 COMMIT 就去開會了。其他人會遇到什麼？",a:["要動到同一批資料的操作會被卡住，一直等","完全沒有影響","其他人會馬上看到他改到一半的資料，而且可以繼續接著改","資料庫會自動幫他 COMMIT"],why:"沒結束的交易會一直握著鎖。正式環境查「系統突然卡住」，常常最後找到的就是一個忘了提交的連線。"},
 {q:"查詢很慢，想知道資料庫實際是怎麼執行它的（有沒有用到索引、掃了多少筆）。該看什麼？",a:["執行計畫（EXPLAIN）","資料表的建立日期","資料庫軟體的授權合約和報價單","伺服器的機殼溫度"],why:"執行計畫會告訴你它走哪個索引、是不是整張表掃。調校查詢的第一步是看它，不是猜。"},
 {q:"資料庫已經設了即時複寫到另一台。有人說「這樣就不需要備份了」，問題在哪？",a:["誤刪或錯誤的更新會同步到另一台，兩邊一起壞","沒有問題，複寫就是即時的備份，比每天備份還要好","複寫的那一台不能讀取資料","複寫只能用在測試環境"],why:"複寫是為了主機故障時能接手。人為的錯誤、程式的 bug、勒索軟體，都會被忠實地複寫過去。"},
 {q:"想把資料庫還原到「今天下午 2 點 15 分，誤刪之前」的狀態。需要具備什麼？",a:["完整備份，加上到那個時間點為止的交易紀錄","只要有昨天晚上的完整備份就可以","只要資料庫有設定複寫，就可以直接指定任何時間點倒回去","做不到，只能還原到備份當下的時間"],why:"這叫時間點還原。先還原完整備份，再把交易紀錄重播到指定時間。所以交易紀錄的備份不能斷。"},
 {q:"為了讓查詢變快，在一張表上建了二十幾個索引。可能造成什麼副作用？",a:["新增、修改、刪除會變慢，也佔更多空間","查詢會全部變慢","資料會開始遺失","沒有副作用，索引越多越好，資料庫會自動挑選最適合的來用"],why:"每次寫入都要更新所有相關的索引。索引要針對實際常用的查詢建，沒在用的要清掉。"},
 {q:"程式先查出 100 筆訂單，再用迴圈對每一筆各查一次客戶資料，總共 101 次查詢。這個問題怎麼改善？",a:["改成用 JOIN 或一次查回來","把迴圈改成跑 200 次","把資料庫伺服器的記憶體加大一倍，查詢的次數多一點也沒有關係","每次查詢之間加上延遲"],why:"這叫 N+1 查詢，資料一多就非常慢。大部分情況一個 JOIN 或一次批次查詢就能解決。"},
 {q:"開發人員想把正式資料庫整份複製到測試環境，方便測試。裡面有大量個資，應該怎麼處理？",a:["先把個資欄位遮罩或換成假資料，再放進測試環境","直接複製，測試環境在內網所以沒有關係","請開發人員簽一張保密切結書，簽完就可以整份複製過去使用","把測試環境的密碼設得跟正式環境一樣"],why:"測試環境的權限和防護通常比正式環境鬆。真實個資放進去，等於多一個管得比較差的外洩點。"}
],[
 {q:"資料庫高可用叢集的兩個節點之間網路斷了，兩邊都以為對方掛了、都開始接受寫入。這個狀況叫什麼？",a:["腦裂（Split-Brain）","死結","全表掃描","冷備份"],why:"兩邊各寫各的，資料就分岔、很難合回來。所以叢集需要第三方仲裁，確保同一時間只有一邊是主要節點。"},
 {q:"資料庫複寫可以選「同步」或「非同步」。同步複寫的取捨是什麼？",a:["主機故障時不會掉資料，但每次寫入要等對方確認，比較慢","速度最快，但可能會掉資料","不需要網路就可以運作","沒有任何取捨，同步複寫在速度和資料安全兩方面都比非同步來得好"],why:"同步是等備援那邊也寫好才算完成，所以零遺失但受網路延遲影響。非同步快，但故障時最後幾筆可能沒傳到。"},
 {q:"一張十年累積的紀錄表有幾億筆，查詢和清舊資料都很慢。哪一種設計最有幫助？",a:["依日期做分割（Partition）","把所有欄位都改成文字型別","把資料表的名稱改短一點，這樣資料庫找這張表的時候可以節省時間","每天把整張表重建一次"],why:"依日期分割後，查近期資料只掃那幾個分割；清舊資料直接卸掉整個分割，不用一筆一筆刪。"},
 {q:"尖峰時段應用程式大量出現「無法取得資料庫連線」的錯誤，資料庫本身負載卻不高。最該檢查什麼？",a:["連線池的上限，以及程式有沒有用完連線沒歸還","資料庫的磁碟空間","資料庫伺服器的時區設定是不是跟應用程式伺服器的時區完全一致","資料表的欄位數量"],why:"連線是有限的資源。程式拿了不還（連線洩漏）或池子設太小，就會出現資料庫很閒、程式卻連不上。"},
 {q:"要把正式資料庫升級到新的大版本。最穩當的做法是？",a:["先用正式資料的複本完整演練一次，並準備好退回的方法","挑離峰時間直接升級，有問題再上網查","先升級正式環境，確認一切都沒有問題之後，再回頭去升級測試環境","升級前不要備份，以免拖慢速度"],why:"大版本升級可能改變語法、執行計畫和相容性。演練過才知道要多久、會遇到什麼，以及退不退得回來。"},
 {q:"資料庫裡有大量個資。對 DBA 這種最高權限的帳號，應該有什麼樣的控管？",a:["存取行為要留下稽核紀錄，而且紀錄要放在 DBA 改不到的地方","DBA 是可以信任的，不需要控管","不讓 DBA 登入資料庫","請 DBA 每個月自己寫一份報告，說明這個月有沒有查詢過不應該查詢的個資"],why:"權限最高的人，風險也最高。紀錄和被記錄的人分開，是職務區隔的基本原則，也保護 DBA 自己。"},
 {q:"資料庫啟用了透明資料加密（TDE）。它主要防的是什麼？",a:["資料檔或備份檔被整份偷走時，內容讀不出來","有權限的帳號用 SQL 查詢個資","SQL Injection 攻擊","使用者輸入錯誤的資料，或者不小心把重要的資料表整張刪除掉的情況"],why:"TDE 加密的是磁碟上的檔案。透過資料庫正常登入查詢，資料還是明文，所以它不能取代權限控管。"},
 {q:"一個跑了好幾年的查詢，程式沒改、資料量也沒暴增，某天突然變得很慢。最該懷疑什麼？",a:["統計資訊過期或執行計畫改變了","資料庫中毒了","使用者的螢幕解析度太高，畫面需要比較長的時間才能把查詢結果顯示出來","SQL 語法過期了"],why:"資料庫依統計資訊決定怎麼執行查詢。統計不準或計畫被重新產生，同一句 SQL 可能從用索引變成整張表掃。"}
]]},
{id:'med',ic:'🏥',col:'#fbe6e3',name:'醫療資訊系統',desc:'HIS、PACS、LIS，以及醫院特有的規則',ranks:['醫資見習','醫資工程員','醫資專家'],lv:[[
 {q:'HIS 指的是什麼？',a:['醫療資訊系統，處理掛號、醫囑、批價等院內作業','醫療影像儲存與傳輸系統','檢驗資訊系統','人事薪資系統，處理員工的出勤、排班和薪水'],why:'Hospital Information System，是醫院運作的核心系統。'},
 {q:'PACS 指的是什麼？',a:['醫療影像儲存與傳輸系統','藥局的調劑與給藥系統','門診的掛號系統','醫院的會計系統'],why:'Picture Archiving and Communication System，X 光、CT、MRI 的影像都存在這裡。'},
 {q:'DICOM 是什麼？',a:['醫療影像的檔案格式和傳輸標準','檢驗數據的單位和換算標準','健保費用的申報格式','紙本病歷的歸檔規則'],why:'影像儀器和 PACS 之間靠 DICOM 溝通，設定時會用到 AE Title、IP、Port。'},
 {q:'HL7 和 FHIR 主要是用來做什麼？',a:['讓不同的醫療系統之間交換資料的標準','壓縮醫療影像檔案的演算法','加密網路傳輸的協定','醫療儀器的電源規格'],why:'例如 HIS 把醫囑傳給 LIS、LIS 把報告傳回 HIS。'},
 {q:'LIS 指的是什麼？',a:['檢驗資訊系統','放射資訊系統','護理資訊系統','藥品庫存系統'],why:'Laboratory Information System。放射資訊系統是 RIS。'},
 {q:'醫療儀器旁邊附的那台電腦，資訊人員可以自己更新或安裝軟體嗎？',a:['不行，它是醫材的一部分，要先經過原廠和醫工確認','可以，它就是一般的電腦，照院內規定更新就好','只要有裝防毒軟體就可以','只要在下班時間做就可以'],why:'醫材附屬電腦自行更動可能讓儀器異常，也會影響保固和醫材許可。'},

 {q:'HIS 當機時，臨床單位應該依據什麼繼續作業？',a:['事先訂好的停機應變程序（紙本作業）','先等資訊室把系統修好，再繼續作業','暫停所有看診和治療','各單位自己想辦法'],why:'醫療不能停。停機應變程序要事先訂好、定期演練，系統恢復後再補登。'},
],[
 {q:"依我國《醫療法》，醫療機構的病歷至少要保存多久？",a:["7 年；未成年人的病歷要保存到成年後 7 年","1 年","3 年","沒有規定保存的期限，由各家醫療機構依照自己的儲存空間自行決定"],why:"醫療法第 70 條。資訊系統的保存、備份和汰換規劃，都要把這個期限算進去。"},
 {q:"電子病歷寫錯了要修正。依《醫療法》的精神，系統應該怎麼設計？",a:["保留原本的內容，並記錄是誰、在什麼時候修改的","直接覆蓋掉原本的內容","讓資訊人員從資料庫後端改","把整份病歷刪除之後重新建立一份新的，舊的那一份不需要保留"],why:"醫療法第 68 條：病歷增刪要註明並簽章、註記日期，原內容不得塗燬。電子病歷也要留下完整的修改軌跡。"},
 {q:"醫療院所和健保署之間的連線（查詢、申報、健保卡資料上傳），是透過什麼網路？",a:["健保資訊網服務系統的專屬 VPN","一般的網際網路就可以，不需要特別的線路","電話撥接","院所之間自己架設的無線網路，再由其中一家醫院統一轉送到健保署"],why:"健保 VPN 一斷，過卡、查詢雲端藥歷、申報都受影響，是醫院對外最關鍵的線路之一。"},
 {q:"HL7 v2 和 FHIR 都是醫療資料交換標準。FHIR 比較新，它的特點是？",a:["採用網站常見的 RESTful API 和 JSON 格式","只能用在影像","用紙本傳遞","只能在同一家醫院的內部使用，沒有辦法跟其他的醫療機構交換資料"],why:"HL7 v2 是用分隔符號的訊息格式，很多舊系統還在用。FHIR 把資料拆成「資源」，用一般網站技術就能串接。"},
 {q:"研究單位想把一批 DICOM 影像帶出院外做研究。資訊上最需要先處理什麼？",a:["去識別化，移除檔頭裡的病人姓名、病歷號等資料","把影像壓縮得小一點","改成彩色","把檔案的副檔名改掉，這樣別人就不會知道這些其實是醫療影像"],why:"DICOM 檔頭帶有大量病人資訊，有時連影像畫面上都燒著姓名。除了技術處理，也要走院內的審查程序。"},
 {q:"檢驗科反應：儀器做完的報告沒有進到 LIS。資訊人員應該怎麼處理？",a:["先分清楚是儀器端、傳輸介面還是網路的問題；儀器本身找醫工或廠商","直接打開儀器的機殼檢查","重灌儀器旁邊那台工作站","請檢驗科的同仁先暫停所有的檢驗工作，等到資訊人員查出原因之後再繼續"],why:"資訊單位負責網路和系統介面。醫療儀器本身是醫材，檢測後聯繫醫工或原廠，不自己動手。"},
 {q:"醫院為什麼要定期做 HIS 停機演練？",a:["確認系統停擺時，臨床單位真的能用紙本或備援流程繼續作業","讓資訊人員休息","測試電費","為了讓臨床單位的同仁了解資訊人員平常的工作有多麼辛苦"],why:"應變程序寫在紙上不代表做得出來：表單在哪、誰來發、恢復後資料怎麼補登，都要實際走過才知道。"},
 {q:"衛生福利部設立的 H-ISAC，主要功能是什麼？",a:["醫療領域的資安情資分享和事件通報","審核健保給付","發放醫師執照","統一採購全國所有醫院的電腦設備，並且負責後續的保固和維修"],why:"醫院收到的情資和要通報的資安事件，會經過這個醫療領域的資安資訊分享與分析中心。"}
]]},

 {q:'在《個人資料保護法》中，病歷、醫療、基因、健康檢查這類資料屬於？',a:['特種個人資料，原則上不得蒐集、處理或利用','一般個人資料，取得當事人口頭同意就可以使用','已經公開的資料','不屬於個人資料'],why:'個資法第 6 條。除非符合法定例外（例如醫療目的、當事人書面同意），否則不能用。'},
 {q:'ISO 27001 是什麼的標準？',a:['資訊安全管理系統（ISMS）','品質管理系統','環境管理系統','醫療器材品質管理系統'],why:'品質是 ISO 9001、環境是 ISO 14001、醫療器材是 ISO 13485。'},
