<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>資訊職訓中心</title>
<style>
/* 版面：上方進度，中間訓練村（2D 地圖或 3D 場景），下方課程一覽；作答時換成單一題目卡 */
:root{--bg:#eaf0f4;--panel:#ffffff;--panel2:#f0f5f8;--line:#d2dde6;--fg:#1c2a36;--muted:#617384;--accent:#17a07a;--warn:#c9860c;--crit:#d6453d;--info:#2a7fd4;
 --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Consolas,"Courier New",monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
header h1{font-size:24px;margin:0;flex:1 1 160px}
a.back{color:var(--muted);text-decoration:none;font-size:14px}a.back:hover{color:var(--fg)}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.pill b{color:var(--accent)}
.lead{color:var(--muted);margin:0;max-width:68ch}.lead a{color:var(--accent)}
h2.sec{font-size:16px;margin:6px 0 0}
.stars{color:var(--warn);letter-spacing:2px;font-size:14px}.stars i{color:var(--line);font-style:normal}
button:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--info);outline-offset:2px}
/* 2D 職訓中心地圖：深色底、發光線路 */
.map{position:relative;width:100%;aspect-ratio:100/62;border-radius:18px;overflow:hidden;border:1px solid #24405c;box-shadow:0 8px 24px rgba(28,42,54,.18);background:#0e1626}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.npc{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;font:inherit;color:#eaf8ff;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:112px}
.npc .roof{width:74px;height:5px;border-radius:3px;box-shadow:0 0 10px 1px var(--rc);background:var(--rc)}
.npc .hut{width:66px;height:46px;margin-top:3px;background:#1b2a40;border:1.5px solid var(--rc);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .15s,box-shadow .15s}
.npc:hover .hut{transform:translateY(-3px);box-shadow:0 0 14px var(--rc)}
.npc .tag{margin-top:4px;background:rgba(10,22,40,.88);border:1px solid #39d6ff88;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;line-height:1.35;text-align:center;white-space:nowrap}
.npc .tag small{display:block;font-weight:400;color:#7fdcff;font-size:11px}
.npc .mk{position:absolute;top:-10px;right:8px;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:0 7px;line-height:18px}
.npc .mk.done{background:var(--accent)}
.hall{position:absolute;left:50%;top:54.8%;transform:translate(-50%,-50%);background:rgba(10,22,40,.9);color:#eaf8ff;border:1.5px solid #39d6ff;border-radius:12px;padding:6px 14px;text-align:center;font-weight:800;line-height:1.3;box-shadow:0 0 16px #39d6ff66}
.hall small{display:block;font-weight:400;color:#7fdcff;font-size:12px}
.gate{position:absolute;background:rgba(10,22,40,.9);color:#f2c14e;border:1px solid #f2c14e;border-radius:8px;padding:3px 12px;font-size:12px;line-height:1.5;text-align:center}
@keyframes flow{to{stroke-dashoffset:-41.2}}
.map .flow{stroke-dasharray:1.2 40;animation:flow 9s linear infinite}
@media (prefers-reduced-motion:reduce){.map .flow{animation:none}}
@media (max-width:700px){.map{display:none}}
/* 3D 訓練村 */
.v3d{position:relative;width:100%;aspect-ratio:16/9;max-height:72vh;min-height:300px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 24px rgba(28,42,54,.1);background:#0e1626;touch-action:none}
.v3d canvas{display:block;width:100%;height:100%}
.v3d .tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2}
.v3d .how{position:absolute;left:12px;top:10px;background:rgba(10,22,40,.7);border:1px solid #39d6ff55;border-radius:10px;padding:3px 10px;font-size:12px;color:#bfefff;pointer-events:none}
/* 課程一覽 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;color:var(--fg);cursor:pointer;min-width:0}
.chip:hover{border-color:var(--accent)}
.chip .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.chip b{display:block;line-height:1.3}.chip small{color:var(--muted);display:block;line-height:1.3}
.chip.lock{opacity:.7;border-style:dashed}
h3.trk small{font-weight:400;margin-left:10px}
h3.trk{grid-column:1/-1;margin:8px 0 0;font-size:14px;color:var(--muted);font-weight:700;border-left:4px solid var(--accent);padding-left:8px}
.prac{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}.prac input{width:18px;height:18px;flex:none}
.note{font-size:13px;color:var(--muted)}
/* 跟師傅對話 */
.talk{position:fixed;inset:0;z-index:20;background:rgba(28,42,54,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.talk .box{background:var(--panel);border-radius:18px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 40px rgba(28,42,54,.3)}
.talk .who{display:flex;gap:12px;align-items:center}
.talk .face{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.talk h2{margin:0;font-size:18px}.talk .who small{color:var(--muted)}
.talk .say{background:var(--panel2);border-radius:4px 14px 14px 14px;padding:10px 14px;margin:0}
.talk .ttl{font-weight:700;color:var(--accent)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiers button{min-width:0;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:12px;padding:8px 2px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tiers button:hover:not(:disabled){border-color:var(--accent)}
.tiers button:disabled{opacity:.5;cursor:not-allowed}
.tiers button span.n{font-size:11px;font-weight:400;color:var(--muted)}
/* 作答 */
#play{display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto;width:100%}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .name{font-weight:700;flex:1 1 140px}
.hearts{font-size:20px;letter-spacing:3px}.hearts i{font-style:normal;opacity:.2}
.combo{font-weight:800;color:var(--warn);min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(28,42,54,.1);display:flex;flex-direction:column;gap:14px}
.qno{color:var(--muted);font-size:13px}
.q{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
pre{margin:0;background:#16212b;color:#d7e3ee;border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13px;overflow-x:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--info)}
.opt.right{border-color:var(--accent);background:#dcf3ea}.opt.wrong{border-color:var(--crit);background:#fbe6e3}.opt:disabled{cursor:default}
.opt code,.q code,.why code{font-family:var(--mono);font-size:.92em;background:rgba(28,42,54,.08);border-radius:4px;padding:1px 5px}
.why{border-left:5px solid var(--accent);background:var(--panel2);border-radius:8px;padding:10px 14px}
.why.bad{border-color:var(--crit)}.why b{display:block;margin-bottom:2px}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;border-radius:12px;padding:11px 20px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big{font-size:44px;color:var(--warn);letter-spacing:8px;line-height:1}.big i{color:var(--line);font-style:normal}
.miss{border-top:1px solid var(--line);padding-top:10px}.miss small{color:var(--muted);display:block}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qcard.ok{animation:pop .25s}.qcard.ng{animation:shake .25s}
@media (prefers-reduced-motion:reduce){.qcard.ok,.qcard.ng{animation:none}.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
 <header><a class="back" href="{{HOME}}">← 回首頁</a><h1>資訊職訓中心</h1><div class="sum"><span class="pill">基礎課程 <b id="sDone">0</b></span><span class="pill">星星 <b id="sStar">0</b></span><span class="pill">總分 <b id="sScore">0</b></span><button class="btn ghost" id="snd" style="padding:4px 12px;border-radius:999px" aria-label="音效開關">🔊</button></div></header>
 <div id="hub" style="display:flex;flex-direction:column;gap:16px">
  <p class="lead">中庭周圍是九間實習教室，九位師傅各教一門每個資訊人員都該會的基礎課；基礎考過，就能去進階專科大樓，照六條專業路線找各科主任。技能等級代表通過知識測驗，不等於實作能力的認證。找師傅說話就能考試：一次 8 題、三條命，錯一題以內就算通過，每一項技能從初級一路考到專家。{{ALT}}</p>
  <div id="stage"></div>
  <h2 class="sec">基礎課程</h2>
  <div class="chips" id="chips"></div>
  <h2 class="sec">進階課程（六條專業路線）</h2>
  <div class="chips" id="adv"></div>
 </div>
 <div id="play" hidden></div>
</div>
<div class="talk" id="talk" hidden></div>
<!--V3D-->
<script>
// ===== 題庫：每題 {q 題目, code 可省略, a 四個選項（第一個是正確答案，出題時會打亂）, why 解說} =====
const DOMAINS=[
{id:'trouble',ic:'🛠️',col:'#dcf3ea',name:'電腦異常排除',desc:'現場報修的判斷順序：先問、先分、再動手',ranks:['報修見習','現場工程員','排除高手'],lv:[[
 {q:'使用者只說「電腦開不了機」。你第一件事該確認什麼？',a:['電源燈有沒有亮、按了有沒有任何反應，分清楚是沒電、沒畫面還是進不了系統','不用問太多，直接幫他把作業系統重灌一次，重灌完大部分的問題都會消失','先把主機板換掉，開不了機最常見就是主機板壞','進 BIOS 把韌體更新到最新版本再說'],why:'「開不了機」可能是三種完全不同的狀況，先分清楚才知道往哪查。'},
 {q:'主機有電、風扇在轉，但螢幕完全沒畫面。最先檢查哪裡？',a:['螢幕的電源、訊號線有沒有鬆，輸入來源有沒有切對','把硬碟拆下來換一顆新的','把作業系統整個重灌一次','電源可能不夠力，換一顆瓦數更大的電源供應器'],why:'沒畫面最常見的原因是線鬆了或輸入來源切錯，先查最簡單、最便宜的。'},
 {q:'開機後畫面顯示 <code>No bootable device</code>，最可能的方向是？',a:['開機磁碟沒有被偵測到，或 BIOS 的開機順序設錯','記憶體容量不夠，系統載入不了','顯示卡驅動程式版本太舊','網路線沒有接好，電腦抓不到開機需要的資訊'],why:'這個訊息代表找不到可以開機的磁碟：先看 BIOS 有沒有認到硬碟、開機順序對不對。'},
 {q:'排除問題時，為什麼要「一次只改一個地方」？',a:['這樣才能確定是哪一個改動讓問題消失或出現','因為一次改太多設定，會讓電腦變得比較耗電','因為公司規定每次只能改一項設定','因為這樣做整體速度會比較快'],why:'同時改好幾樣，就算好了也不知道是哪一樣造成的，下次遇到還是不會。'},
 {q:'使用者說電腦突然變得很慢。你先看什麼？',a:['開工作管理員，看 CPU、記憶體、磁碟哪個被佔滿，是哪個程式','直接申請加裝記憶體，電腦變慢通常都是因為記憶體不夠用','直接重灌，重灌完一定會變快','換一條新的網路線試試看'],why:'先看是什麼資源被吃光、被誰吃光，再決定怎麼處理。'},
 {q:'使用者說「昨天還好好的」。最有用的追問是哪一句？',a:['從昨天到現在，有沒有裝過、改過、搬動過什麼東西？','這台電腦當初是哪一年買的？','你登入的密碼是多少？','你們單位總共有幾個人在用電腦，平常都用來做什麼？'],why:'昨天正常、今天不正常，中間的變動就是最大的線索。'},
 {q:'電腦出現藍底白字的當機畫面（BSOD）。處理前應該先記下什麼？',a:['畫面上的停止代碼，以及當機前正在做什麼','螢幕的廠牌和型號','鍵盤和滑鼠是有線的還是無線的','電腦主機外殼的顏色'],why:'停止代碼可以直接查到方向（驅動、記憶體、磁碟…），當機前的動作可以重現問題。'},
 {q:'問題處理完了。結案前最重要的一步是？',a:['請使用者實際操作一次確認正常，並把原因和處理方式記下來','趁使用者還沒發現其他問題之前趕快離開，免得被留下來','提醒使用者下次不要再打電話來','把電腦連續重開三次確保穩定'],why:'使用者確認才算修好；原因寫下來，下次自己或同事遇到就不用重查。'},
],[
 {q:"同一層樓有十幾個人同時說網路不通。比較好的處理方向是？",a:["找這些人的共通點，往上游的交換器或線路查","照報修順序，一台一台去現場把每台電腦的網路設定重新檢查過","請大家先重開機，沒好再說","先處理職位最高的那一位"],why:"很多人同時出事，問題通常在他們共用的東西上。一台一台修只是在浪費時間。"},
 {q:"問題「有時候會、有時候不會」。這種間歇性的問題，最有用的做法是？",a:["記下每次發生的時間和當時在做什麼，找出規律","等它完全壞掉再來修，那時候原因比較明顯","直接重灌，一次解決","跟使用者說這是正常現象，電腦用久了難免都會這樣，不用太在意"],why:"間歇性問題靠猜是猜不到的。有了時間和動作的紀錄，才能對到 log 或找出共同條件。"},
 {q:"螢幕沒畫面，你拿一台確定是好的螢幕和線來接。這個動作叫交叉測試，目的是？",a:["用確定正常的東西，分出問題在哪一段","順便幫使用者把螢幕換成新的","證明使用者沒有說謊","先讓使用者有螢幕可以用，至於真正壞在哪裡之後有空再慢慢查"],why:"把「確定好的」換上去：好了，就是原本那個壞；沒好，問題在別段。一次只換一樣。"},
 {q:"某位使用者登入後程式打不開，但換別人登入同一台電腦就正常。問題比較可能在哪？",a:["這個使用者的帳號設定或權限","主機板","這台電腦的記憶體有一條快要壞掉，剛好只有他登入的時候會用到","網路線"],why:"同一台電腦、不同人結果不同，硬體和網路就可以先排除，往使用者層級的設定檔和權限查。"},
 {q:"要動一項你不熟的設定之前，最該先做的是？",a:["把原本的設定記下來或備份，確保改壞了能改回去","先改改看，有問題再上網查怎麼復原","找一個沒人的時間偷偷改","問使用者同不同意"],why:"排除問題的底線是不要越修越糟。能還原，才敢動手。"},
 {q:"這個問題你處理不了，要往上轉給資深同事或廠商。轉的時候最該附上什麼？",a:["現象、已經做過的檢查和結果","只要案件編號","使用者的抱怨內容原文，一字不漏地轉過去，讓對方感受一下現場的壓力","你覺得是誰的錯"],why:"附上已做的檢查，接手的人才不用從頭再問一次、再做一次。"},
 {q:"伺服器硬碟滿了，你刪掉一些舊檔案，服務恢復了。這樣算處理完了嗎？",a:["還沒，要查是什麼一直在寫、之後會不會再滿","算，服務已經恢復，使用者也沒有再反應，可以結案了","算，但要記得下個月再來刪一次","不算，應該順便把硬碟換成更大的"],why:"刪檔是解決症狀。沒找到是誰在寫（log 沒輪替？程式異常？），過幾天一樣會再滿。"},
 {q:"你換了一條網路線之後問題好了，隔天同樣的問題又出現。這代表什麼？",a:["網路線可能不是原因，昨天好了也許只是巧合","新的網路線又壞了，再換一條","使用者一定又動了什麼","這種事情本來就查不出原因，只能等它下次再發生的時候再處理"],why:"「做了某件事之後好了」不等於「因為那件事才好」。問題重現，就要回頭重新驗證當初的判斷。"}
],[
 {q:"同一套系統，一半的人說很慢，另一半完全正常。最有效的切入點是？",a:["比較兩群人的差異：網段、版本、連到哪一台伺服器","既然有一半的人正常，代表系統本身沒問題，請慢的人各自重開機","直接重開伺服器","先加大頻寬"],why:"有好有壞是最好的線索。找出「慢的都有、快的都沒有」的那個條件，範圍就縮小了。"},
 {q:"線上服務突然大規模中斷。先恢復服務，還是先查出原因？",a:["先恢復服務，但動手前把 log、畫面這些證據留下來","一定要先查到根本原因才能動手，否則服務恢復之後就再也查不出來了","先開會討論責任歸屬","等廠商到場再決定"],why:"使用者在等，恢復優先。但重開或回復前先把紀錄留下，不然事後就沒東西可以查。"},
 {q:"一個問題怎麼試都無法重現，但使用者確定發生過。接下來比較好的做法是？",a:["把紀錄開詳細一點或加上監控，等下次發生時抓到資料","無法重現就代表沒有問題，直接結案","每天去使用者旁邊坐著等它發生，這樣才不會錯過任何細節","把整個系統重裝一次"],why:"重現不了，就讓下次發生時有東西可看：詳細 log、封包擷取、效能紀錄。"},
 {q:"昨晚同時做了兩項變更，今天早上系統出問題。怎麼判斷是哪一項造成的？",a:["一次退回其中一項，看問題有沒有消失","兩項都退回，問題解決了就好，不需要知道是哪一項","看哪一項是比較資淺的人做的","再做第三項變更試試看"],why:"一次只動一個變數才分得出因果。兩項一起退雖然快，但之後重做時還是不知道哪個有問題。"},
 {q:"主機監控上 CPU、記憶體都很正常，但使用者一直說系統很慢。這代表什麼？",a:["瓶頸可能在沒被監控到的地方，例如磁碟讀寫、資料庫鎖定、網路","監控數字都正常，所以是使用者自己的感覺有問題，請他們先提出具體的證明再說","監控系統壞了，重裝監控","使用者的電腦太舊"],why:"監控只看得到有監控的項目。使用者的體驗才是事實，要從他的操作一路往後端量。"},
 {q:"用「連問五次為什麼」做根因分析，目的是什麼？",a:["從表面的現象一路往下追，找到真正該改的地方","找出是哪一個人犯的錯","把報告的篇幅寫到夠長，讓主管覺得這次的檢討有做得很深入","證明問題不是資訊單位造成的"],why:"「硬碟滿了」→ 為什麼滿？log 沒清 → 為什麼沒清？沒設輪替 → 為什麼沒設？建置清單沒這項。改清單才是根本。"},
 {q:"重大事件結束後的檢討會，最重要的原則是？",a:["對事不對人，找出流程和機制上的漏洞","先確定這次是誰的責任，處分完之後再來談改善","只要寫報告交差，不需要真的開會","只邀請主管參加，第一線的人不用到"],why:"一究責，大家就不敢講實話，真正的原因反而被藏起來。要改的是讓人會犯錯的流程。"},
 {q:"你用一個臨時的方法先讓系統撐住了（例如排程每小時重啟服務）。接下來最該做什麼？",a:["記錄下來並開一張追蹤單，安排找出真正的原因","已經不會出問題了，可以結案","把重啟的頻率從每小時改成每十分鐘一次，這樣會更保險","不要告訴別人，免得被問"],why:"臨時解法最怕變成永久的。沒人記得它存在，哪天它失效或造成別的問題，就更難查了。"}
],[
 {q:"監控畫面一下子跳出五十幾個告警，涵蓋十幾台主機。最有效率的處理方式是？",a:["依相依關係找最上游的那一個","照告警跳出來的時間順序，從第一個開始一個一個處理","先把告警全部關掉，畫面乾淨了再說","每台主機各派一個人去看"],why:"告警風暴通常是一個上游問題（儲存、網路、驗證）拖垮下游。修好源頭，其他告警會自己消失。"},
 {q:"每次備份執行時系統就變慢，大家都認定是備份造成的。要怎麼確認？",a:["挑一天停掉備份，看那個時段還會不會慢","不用確認，時間點完全吻合就代表一定是備份造成的","把備份改到白天執行","直接買更快的備份設備"],why:"同時發生不等於因果，也可能是同一時段的別支排程。拿掉懷疑的因素看結果，才算驗證。"},
 {q:"上次正常的版本和現在出問題的版本之間，有 200 筆變更。要最快找出是哪一筆造成的，用什麼方法？",a:["二分法：每次測中間那一筆，把範圍砍半","從第 1 筆開始，一筆一筆依序測到第 200 筆","請每個改過的人自己檢查","憑經驗猜最可疑的那幾筆，猜不到就整批退回上一個正常的版本"],why:"二分法最多測 8 次就能從 200 筆裡找到。Git 的 <code>bisect</code> 就是做這件事。"},
 {q:"你改了一項設定，問題消失了。要怎麼確定真的是這項設定造成的？",a:["把設定改回去，看問題會不會再出現","觀察一個星期沒有再發生，就可以確定","問其他同事的看法","不需要確定，問題已經解決了，知不知道原因並沒有差別"],why:"能「關掉又打開」重現問題，因果才算成立。只是沒再發生，可能只是觸發條件剛好沒出現。"},
 {q:"明明有備援機制，為什麼還要定期做切換演練？",a:["沒實際切過，不知道真的出事時它會不會動","演練是為了讓稽核有紀錄可以看，實際上備援一定會正常運作","讓備援設備的保固可以延長","因為主要設備需要定期休息"],why:"備援沒演練過，常見結局是出事那天才發現設定沒同步、授權過期、沒人記得步驟。"},
 {q:"系統每個月初都會慢兩三天，其他時間正常。這比較像是什麼問題？",a:["週期性的負載高峰，容量不夠","硬體快要故障的前兆","有人在月初攻擊系統","作業系統的排程功能有 bug，每到月初就會自動降低效能"],why:"有固定週期的問題，先對業務的週期（月結、申報、報表）。這是容量規劃的問題，不是故障。"},
 {q:"重大事件發生，五六個工程師同時上去處理。最需要先確立的是什麼？",a:["指定一個人統籌指揮，其他人的動作都要先講","每個人各自從自己熟悉的地方開始修，誰先修好就算誰的","先確定事後檢討報告由誰寫","所有人一起盯同一個畫面"],why:"多人各改各的，會互相蓋掉、也分不清是哪個動作有效。要有一個人掌握全局、決定順序、對外溝通。"},
 {q:"一台應用伺服器出了怪問題，查了三個小時還沒頭緒，而用自動化工具重建一台只要二十分鐘。比較合理的決定是？",a:["先重建恢復服務，把舊的那台留下來慢慢查","堅持查到原因為止，沒有找到原因就重建等於是認輸","把兩台都關掉","再多找幾個人一起查三個小時"],why:"排查也有成本。能快速重建就先恢復，保留現場事後再分析，兩邊都顧到。"}
]]},
{id:'hw',ic:'🖥️',col:'#e3ecf8',name:'硬體',desc:'主機裡有什麼、壞掉會怎樣、怎麼安全地動它',ranks:['硬體見習','維修員','硬體達人'],lv:[[
 {q:'關於記憶體（RAM），下列哪一個敘述正確？',a:['斷電之後，裡面的資料就會消失','斷電之後資料仍然會保留','只能讀取，不能寫入','主要用來長期保存檔案'],why:'RAM 是揮發性儲存，只在通電時暫存運作中的資料。'},
 {q:'SSD 相對於傳統硬碟（HDD），最主要的優點是？',a:['沒有機械結構，隨機讀寫快，也比較耐震','同樣價格下容量一定比較大','每 GB 的價格一定比較便宜','使用壽命無限，不會損壞'],why:'SSD 沒有碟片和讀寫頭，所以快、安靜、耐震，但每 GB 通常比較貴，也有寫入壽命。'},
 {q:'開機時主機連續嗶嗶叫，而且沒有畫面。通常先檢查什麼？',a:['記憶體有沒有插好，或是不是壞了','鍵盤有沒有接上','主機喇叭的音量是不是調太大','網路卡的燈有沒有亮'],why:'連續嗶聲是主機板的自我檢測警告，最常見是記憶體接觸不良。'},
 {q:'RAID 1 的作用是什麼？',a:['兩顆磁碟互為鏡像，一顆壞掉資料還在','把資料拆開寫入加快速度，但沒有備援','自動壓縮資料節省空間','把整顆磁碟的內容加密'],why:'RAID 1 是鏡像；加快速度但沒有備援的是 RAID 0。'},
 {q:'RAID 5 最少需要幾顆磁碟？最多可以壞幾顆而資料不遺失？',a:['最少 3 顆，可以壞 1 顆','最少 2 顆，可以壞 1 顆','最少 4 顆，可以壞 2 顆','最少 3 顆，可以壞 2 顆'],why:'RAID 5 用一顆磁碟的容量存同位元資料，所以最少 3 顆、容許壞 1 顆。可壞 2 顆的是 RAID 6。'},
 {q:'不斷電系統（UPS）的主要用途是？',a:['停電時撐一小段時間，讓設備正常關機或等發電機接手','提升網路的傳輸速度，讓伺服器的回應變得比較快','降低機房的溫度','攔截病毒和惡意程式'],why:'UPS 靠電池供電，只能撐幾分鐘到幾十分鐘，重點是爭取時間。'},
 {q:'要打開主機更換零件之前，應該先做什麼？',a:['關機、拔掉電源線，並先摸金屬釋放身上的靜電','讓電腦保持開機，更換時比較方便測試','只要戴上橡膠手套就可以直接動手','先把硬碟格式化避免資料外洩'],why:'帶電操作會燒零件，靜電也會打壞記憶體和主機板。'},
 {q:'電腦用一陣子就自動關機，摸起來很燙。最常見的原因是？',a:['風扇或散熱片積滿灰塵，或散熱膏乾掉了','硬碟的容量太大','螢幕的亮度調得太高，連帶讓主機溫度上升','鍵盤有按鍵卡住'],why:'過熱保護會強制關機。清灰塵、確認風扇有轉、必要時重塗散熱膏。'},
],[
 {q:"電腦跳出硬碟 S.M.A.R.T. 警告，但目前還能正常開機。該怎麼做？",a:["先把資料備份出來，再安排換硬碟","還能開機就代表沒事，等真的壞了再處理就好","重灌作業系統","把警告關掉"],why:"S.M.A.R.T. 警告是硬碟在預告自己快壞了。趁還讀得到，先救資料。"},
 {q:"電腦記憶體長期用到九成以上，硬碟燈一直閃，整台很慢。最直接有效的改善是？",a:["加記憶體","換一顆更快的 CPU","把螢幕解析度調低，減少顯示卡的負擔，系統就會有比較多資源","換一條網路線"],why:"記憶體不夠時，系統會拿硬碟當記憶體用（虛擬記憶體），速度差非常多，所以硬碟燈狂閃又很慢。"},
 {q:"要幫一台電腦加裝 M.2 的 SSD，購買前最需要確認什麼？",a:["主機板的 M.2 插槽支援 SATA 還是 NVMe","SSD 的外殼顏色","只要是 M.2 的規格就一定都能用，挑容量最大、價格最便宜的買就可以了","電源供應器的瓦數"],why:"M.2 只是插槽的形狀，裡面走的可能是 SATA 或 NVMe，主機板不支援就抓不到。"},
 {q:"有人說「我們有做 RAID 1，所以不用備份」。這句話哪裡有問題？",a:["RAID 只防硬碟故障，誤刪和勒索軟體會同步到另一顆","沒有問題，RAID 1 就是兩顆硬碟互相備份，壞一顆還有另一顆","RAID 1 的速度太慢","RAID 1 至少要三顆硬碟"],why:"RAID 是為了硬碟壞掉時不中斷服務。檔案被刪、被加密，兩顆會一起變，所以不能取代備份。"},
 {q:"拿記憶體、介面卡這類零件之前，為什麼要先摸一下機殼的金屬？",a:["把身上的靜電放掉","確認主機有沒有漏電","讓手的溫度降下來，避免手太熱把零件上的晶片燙壞","這只是習慣，沒有實際作用"],why:"靜電可能把晶片打壞，而且當下看不出來。冬天和冷氣房特別容易帶靜電。"},
 {q:"公司買了一套單機版授權的軟體，同事想裝在部門的十台電腦上。可以嗎？",a:["不行，超出授權範圍，違反授權合約也可能違反著作權法","可以，反正是公司付錢買的，裝在公司的電腦上都算合理使用","可以，只要不要同時開就好","只要主管口頭同意就可以"],why:"買幾套授權就只能裝幾台（依合約）。超裝在台灣一樣有著作權的法律責任，公司和個人都可能被追究。"},
 {q:"作業系統「終止支援」（例如 Windows 10 在 2025 年 10 月終止支援）之後，繼續使用最大的問題是？",a:["不再有安全性更新，新的漏洞不會修","電腦當天就會無法開機","所有的軟體都會立刻不能執行，資料也會被微軟鎖起來不能存取","螢幕解析度會被限制"],why:"終止支援後系統還是能用，但新發現的漏洞不會再修補，等於門壞了沒人修。"},
 {q:"更新顯示卡驅動程式之後，畫面開始閃爍。最快的處理方式是？",a:["在裝置管理員把驅動程式回復到上一版","整台重灌","馬上把顯示卡送修，更新後才出問題代表硬體本來就快要壞了","換一台螢幕"],why:"更新後才出問題，先退回上一版確認。Windows 的裝置管理員有「回復驅動程式」可以用。"}
],[
 {q:"伺服器用的 ECC 記憶體，和一般記憶體最大的差別是？",a:["可以偵測並修正記憶體的位元錯誤","速度是一般記憶體的兩倍","容量比較大，而且可以拿來當硬碟用","比較省電"],why:"伺服器長時間運作，記憶體偶發的位元錯誤可能讓資料悄悄出錯。ECC 能自動修正單一位元的錯誤。"},
 {q:"RAID 5 壞了一顆硬碟，換上新硬碟開始重建。這段期間最大的風險是？",a:["再壞一顆，整組資料就沒了","重建期間完全不能讀寫","新硬碟會把舊資料蓋掉","沒有風險，RAID 5 在重建的期間還是可以再容許一顆硬碟損壞"],why:"RAID 5 只容許壞一顆。重建時每顆硬碟都在全力讀取，同批的舊硬碟很容易跟著壞，所以大容量常改用 RAID 6。"},
 {q:"磁碟陣列裡設定「熱備援」（Hot Spare）硬碟的用途是？",a:["有硬碟故障時，自動頂上去開始重建","平常用來加快讀取速度","存放每天的備份檔案，等於多一份資料保障","讓陣列的可用容量變大"],why:"熱備援平常閒置，一有硬碟壞掉就自動接手重建，不用等人半夜來換，縮短沒有保護的時間。"},
 {q:"幫機房的伺服器配 UPS，除了容量夠不夠，還有一件事很重要，是什麼？",a:["設定讓伺服器在電池快用完前自動正常關機","UPS 的顏色要跟機櫃一樣","一定要買最貴的品牌","把 UPS 放在離伺服器越遠越好的地方，避免電磁波干擾"],why:"UPS 只能撐一段時間。沒設連動關機，電池耗盡時一樣是硬斷電，資料照樣損毀。"},
 {q:"把十台實體伺服器虛擬化，集中到一台主機上。這樣做最需要注意的風險是？",a:["這台主機一壞，上面的十個系統會同時停擺","虛擬機不能安裝 Windows","虛擬機的資料沒辦法備份","每一台虛擬機的速度一定會比原本的實體機快十倍，使用者會不習慣"],why:"虛擬化把雞蛋放進同一個籃子。正式環境至少要兩台主機加共用儲存，才能在一台故障時把虛擬機移走。"},
 {q:"要幫兩百台新電腦安裝一模一樣的系統和軟體。比較好的做法是？",a:["做好一份標準映像檔，用部署工具一次派送","請五個同事分頭一台一台手動安裝，裝完再互相檢查","請使用者自己安裝","先裝好一台，其他的等有人報修再裝"],why:"手動裝兩百台既慢又難保每台一樣。映像檔加部署工具，才能做到快、一致、之後可重複。"},
 {q:"每個月的安全性更新，要派送到全公司電腦。比較穩當的做法是？",a:["先派給一小群測試的電腦，確認沒問題再全面派送","更新釋出的當天就讓全公司的電腦一起安裝，越快裝完越安全","等到半年後累積多一點再一次裝","讓使用者自己決定要不要裝"],why:"更新偶爾會跟某些軟體或驅動衝突。先小範圍試，出事只影響少數人，還來得及喊停。"},
 {q:"要更新伺服器的 BIOS 或韌體。為什麼一定要排在維護時段，而且確認供電穩定？",a:["更新到一半如果斷電，設備可能再也開不了機","韌體更新需要用到很大的網路頻寬","更新的時候機房的溫度會明顯升高，白天冷氣負荷不了","只是慣例，其實隨時都可以更新"],why:"韌體寫到一半中斷，設備可能直接變磚。而且更新通常要重開機，本來就會中斷服務。"}
],[
 {q:"伺服器有兩顆電源供應器。機房配電時應該怎麼接？",a:["分別接到不同的電力迴路或不同的 UPS","兩顆都接在同一條延長線上，方便管理","只接一顆，另一顆留著當備品","兩顆接到同一台 UPS 的相鄰插座，這樣線材最短也最整齊"],why:"雙電源是為了其中一路斷電還能活。兩顆接同一路，那一路跳掉就全滅，等於沒有備援。"},
 {q:"機房冷氣採「N+1」配置，意思是？",a:["比實際需要的數量多準備一台當備援","每一台冷氣都有一台一模一樣的備援","總共只有一台冷氣","冷氣的數量是伺服器數量再加一"],why:"需要 N 台才夠，就裝 N+1 台，任何一台故障或保養時仍然足夠。每台都配一台備援的叫 2N。"},
 {q:"資料庫很慢，儲存設備的容量還剩一半以上。問題可能出在儲存的哪個指標？",a:["IOPS 或延遲，也就是讀寫的速度不夠","剩餘容量太多，資料太分散","硬碟的外觀尺寸","儲存設備的保固年限快要到期，效能會跟著自動下降"],why:"容量夠不代表夠快。資料庫吃的是每秒讀寫次數和延遲，這要看磁碟類型和陣列配置。"},
 {q:"一台核心設備已經過了原廠保固和支援年限，但目前運作正常。應該怎麼處理？",a:["評估風險並排入汰換計畫，汰換前準備備品或延長維護","還能用就繼續用，壞了再買","立刻關機停用","把它搬到比較涼的位置，設備的壽命就可以再延長好幾年"],why:"過了支援年限，壞了沒零件、有漏洞沒修補。不一定要馬上換，但風險要有人知道、要有計畫。"},
 {q:"虛擬化平台上，分配給所有虛擬機的記憶體加起來，超過實體主機的記憶體。會有什麼風險？",a:["虛擬機同時吃滿時，主機記憶體不足，全部一起變慢","完全沒有風險，虛擬化平台會自動變出更多的記憶體","虛擬機會無法開機","實體主機的硬碟會壞掉"],why:"超額配置是賭大家不會同時用滿。賭輸時主機開始搶記憶體，上面所有系統的效能一起崩。"},
 {q:"虛擬機的「快照」可以當作備份嗎？",a:["不行，快照和虛擬機放在同一套儲存上，儲存壞了一起消失","可以，快照就是備份的另一種說法","可以，只要快照的數量夠多","不行，因為快照只會記錄虛擬機的名稱和設定，不包含磁碟裡的任何資料"],why:"快照是變更前的臨時保險，用完就該刪。留太久會拖慢效能、吃掉空間，而且它依賴原本的磁碟。"},
 {q:"定期盤點「買了多少授權」和「實際裝了多少」，除了避免授權糾紛，還有什麼資安上的價值？",a:["找出沒人管、沒在更新的軟體","讓電腦的開機速度變快","可以向軟體廠商要求退還多買的授權費用，並且爭取下一年度的折扣","沒有資安上的價值"],why:"不知道裝了什麼，就不知道哪裡有漏洞。出現重大漏洞時，資產清單是第一個要翻的東西。"},
 {q:"存放過個資的硬碟要報廢。正確的處理方式是？",a:["用認可的方式抹除或實體破壞，並留下紀錄","格式化之後交給回收商","直接丟進資源回收桶","把檔案全部刪除並清空資源回收筒，確認資料夾是空的就可以交出去"],why:"刪除和格式化都救得回來。要用覆寫、消磁或實體破壞，並記錄是哪顆硬碟、誰處理、什麼時候。"}
]]},
{id:'sw',ic:'📦',col:'#fbf1d9',name:'軟體',desc:'安裝、驅動、更新、相容性和授權',ranks:['軟體見習','安裝員','軟體達人'],lv:[[
 {q:'驅動程式（driver）是做什麼用的？',a:['讓作業系統能夠控制並使用硬體裝置','讓電腦上網和下載的速度變得比較快','偵測並清除電腦病毒','定期備份使用者的檔案'],why:'沒有正確的驅動，硬體接上去作業系統也不會用。'},
 {q:'廠商定期釋出的軟體更新（修補程式），最主要的目的是？',a:['修正安全漏洞和程式錯誤','讓程式的圖示變得比較好看','增加硬碟可以使用的容量','降低電腦的耗電量'],why:'沒修補的漏洞是被入侵最常見的入口，所以更新要按時上。'},
 {q:'程式安裝完打不開，訊息說缺少某個 DLL 或執行環境。先怎麼處理？',a:['安裝它需要的執行環境，例如 VC++ 可轉散發套件或 .NET','表示系統已經損壞，要把 Windows 整個重灌一次','換一台新的電腦再安裝','把防毒軟體關掉再開一次'],why:'很多程式依賴共用的執行環境，補裝對應版本就能執行。'},
 {q:'在公司的電腦上安裝軟體，哪一個做法正確？',a:['只安裝經過核准、有合法授權、來源可信的軟體','網路上找得到安裝檔的就可以裝','試用版到期後，用破解的方式延長使用沒有關係','同事用隨身碟給的版本最快最方便'],why:'來路不明或盜版軟體是惡意程式的主要來源，也有法律責任。'},
 {q:'Windows 的「相容模式」是用來做什麼的？',a:['讓舊版程式用舊版 Windows 的方式執行','加快電腦的開機速度','讓筆電的電池撐比較久','切換作業系統和程式的顯示語言'],why:'有些老程式在新版 Windows 跑不起來，可以先試相容模式。'},
 {q:'用瀏覽器開內部系統，畫面顯示怪怪的，但別人的電腦正常。先試什麼？',a:['清除快取，或用無痕視窗開一次，看是不是快取或擴充套件造成','把作業系統重灌','換一台解析度比較高、尺寸比較大的螢幕再試','換一條新的網路線'],why:'無痕視窗不帶快取和擴充套件，能很快分出是不是瀏覽器本身的問題。'},
 {q:'32 位元和 64 位元作業系統，最主要的差別是？',a:['64 位元可以使用超過 4GB 的記憶體','64 位元的系統耗電量比較低','32 位元的安全性比較高','兩者在功能上沒有任何差別'],why:'32 位元的定址空間只有 4GB，裝再多記憶體也用不到。'},
 {q:'「開源軟體」（open source）指的是？',a:['原始碼公開，依照授權條款可以使用和修改','一定免費，而且使用上沒有任何限制','沒有著作權，任何人都可以佔為己有','只能個人使用，不可以用在商業用途'],why:'開源仍然有著作權和授權條款（GPL、MIT…），用之前要看清楚條款。'},
]]},
{id:'net',ic:'🌐',col:'#dcefff',name:'網路',desc:'IP、DNS、DHCP、交換器和基本排錯',ranks:['網路見習','網路值班','網路負責人'],lv:[[
 {q:'IP 位址寫成 <code>192.168.1.10/24</code>，它的子網路遮罩是？',a:['255.255.255.0','255.255.0.0','255.0.0.0','255.255.255.255'],why:'/24 代表前 24 個位元是網路位址，也就是 255.255.255.0。'},
 {q:'DNS 的功能是什麼？',a:['把網域名稱轉換成 IP 位址','自動分配 IP 位址給電腦','把傳輸的資料加密','過濾網路上的病毒'],why:'電腦靠 IP 連線，人記名稱，DNS 負責中間的翻譯。'},
 {q:'DHCP 的功能是什麼？',a:['自動分配 IP、遮罩、閘道、DNS 給設備','把使用者輸入的網域名稱解析成 IP 位址','決定封包要往哪一條路送','阻擋外部不明的連線'],why:'沒有 DHCP 的話，每台設備都要手動設定網路參數。'},
 {q:'電腦的 IP 變成 <code>169.254.x.x</code>，代表什麼？',a:['沒有從 DHCP 拿到位址，系統自己給了一個','一切正常，這是公司內部網路常用的私有網段','這台電腦被防火牆封鎖了','DNS 伺服器故障了'],why:'169.254.0.0/16 是 APIPA：要不到 DHCP 時自動產生的位址，通常代表線路或 DHCP 有問題。'},
 {q:'用 IP 可以 ping 到伺服器，但用名稱就連不上。最可能是哪裡的問題？',a:['DNS 解析有問題','網路線接觸不良','交換器整台故障','預設閘道設定錯誤'],why:'IP 通代表線路和路由沒事，只有名稱不通就是名稱解析的問題。'},
 {q:'交換器（switch）主要是依據什麼來轉送資料？',a:['MAC 位址','IP 位址','連接埠號碼','網域名稱'],why:'一般交換器工作在第二層，靠 MAC 位址表決定從哪個埠送出。'},
 {q:'「預設閘道」（default gateway）的作用是？',a:['把要送到其他網段的封包轉送出去','把網域名稱轉換成 IP 位址','自動發放 IP 位址給電腦','把封包內容加密'],why:'同網段直接送；不同網段的封包都交給預設閘道。閘道設錯會變成只能連同網段。'},
 {q:'HTTPS 預設使用哪一個連接埠？',a:['TCP 443','TCP 80','TCP 22','TCP 3389'],why:'80 是 HTTP、22 是 SSH、3389 是遠端桌面。'},
],[
 {q:"<code>192.168.10.0/26</code> 這個網段，可以分配給主機使用的 IP 有幾個？",a:["62","64","126","254"],why:"/26 剩 6 個位元給主機，2 的 6 次方是 64，扣掉網路位址和廣播位址，可用 62 個。"},
 {q:"VLAN 的作用是什麼？",a:["在同一批交換器上切出彼此隔開的網段","讓網路的速度變成兩倍","把無線網路的訊號延伸到比較遠的樓層和角落，改善收訊不良的問題","幫每台電腦自動分配 IP"],why:"VLAN 把一台實體交換器在邏輯上切成好幾個廣播網域，不同 VLAN 要互通得經過路由。"},
 {q:"電腦 ping <code>168.95.1.1</code> 會通，但瀏覽器打網址全部開不了。最可能是哪裡有問題？",a:["DNS","網路線","網路卡壞了","電腦完全沒有連上網路，所以不管是用 IP 還是用網址都一樣連不出去"],why:"168.95.1.1 是中華電信的 DNS，ping 得到代表對外是通的。IP 通、名稱不通，就往 DNS 設定查。"},
 {q:"<code>tracert</code>（Linux 是 <code>traceroute</code>）主要用來看什麼？",a:["封包一路經過哪些節點、卡在哪一站","這台電腦開了哪些連接埠","目前的下載和上傳速度","網域名稱對應到的 IP"],why:"它會列出到目的地沿途的每一站。從哪一站開始沒回應，就是往哪裡查的線索。"},
 {q:"NAT 的主要用途是？",a:["讓使用私有 IP 的內部電腦，共用對外的 IP 上網","把網址轉換成 IP 位址","幫內部的電腦自動分配 IP、遮罩、閘道和 DNS 這些網路設定","防止交換器之間形成迴圈"],why:"私有 IP（像 192.168.x.x、10.x.x.x）在網際網路上不能直接用，出去時由 NAT 轉成對外的 IP。"},
 {q:"兩台電腦被設成同一個 IP。會出現什麼狀況？",a:["兩台的網路都會時通時不通","兩台都完全正常，速度各分一半","交換器會自動幫其中一台換一個沒有人在用的 IP，使用者不會有感覺","整個網段的電腦都會當機"],why:"IP 衝突時，網路上其他設備一下認這台、一下認那台，所以兩邊都斷斷續續。"},
 {q:"有人把一條網路線的兩頭都插在同一台交換器上，結果整層樓網路癱瘓。原因是？",a:["形成迴圈，造成廣播風暴","那條線太長，訊號衰減","交換器的連接埠全部被這一條線佔滿了，其他電腦沒有位置可以用","DHCP 的 IP 發完了"],why:"迴圈會讓廣播封包無限繞圈、越來越多。交換器開啟 STP 或迴圈偵測就是為了防這個。"},
 {q:"DNS 的 MX 紀錄是用來指定什麼？",a:["這個網域的郵件要送到哪台主機","網域名稱對應的 IPv4 位址","這個網域的別名","負責這個網域的名稱伺服器"],why:"MX 管收信。對應 IPv4 是 A 紀錄、別名是 CNAME、名稱伺服器是 NS。"}
],[
 {q:"兩個不同 VLAN 的電腦要互相連線，需要什麼？",a:["有路由功能的設備，例如三層交換器或路由器","接在同一台交換器上就可以","把兩台電腦的 MAC 位址改成一樣","一條跳線把兩個 VLAN 的連接埠直接對接，這是標準的做法"],why:"VLAN 之間是隔開的二層網段，要互通必須經過第三層的路由。"},
 {q:"交換器的 trunk 埠和 access 埠，差別在哪裡？",a:["trunk 可以同時載送多個 VLAN，access 只屬於一個 VLAN","trunk 的速度一定比 access 快十倍","trunk 給無線網路用，access 給有線網路用","兩者其實沒有任何差別，只是不同廠牌的交換器對同一種連接埠各自取了不一樣的名稱"],why:"交換器之間、交換器到無線基地台或虛擬化主機通常用 trunk，一條線帶多個 VLAN；接一般電腦用 access。"},
 {q:"連上 VPN 之後，ping 得到對方、小網頁也開得了，但大檔案傳輸和某些網站一直卡住。最該懷疑什麼？",a:["MTU 的問題，大封包過不去","DNS 設定錯誤","對方的伺服器當機了","VPN 的帳號權限不夠，只開放了瀏覽小型網頁的功能"],why:"VPN 會多包一層，可用的封包大小變小。小封包沒事、大封包被丟掉，就是典型的 MTU 症狀。"},
 {q:"有人在辦公室私接一台家用分享器，結果附近的電腦都拿到奇怪的 IP、上不了網。交換器上哪個功能可以防止？",a:["DHCP Snooping","Spanning Tree","Port Mirroring","PoE"],why:"私接的分享器會搶著發 IP。DHCP Snooping 只允許指定的連接埠回應 DHCP，其他埠發的一律丟掉。"},
 {q:"802.1X 在企業網路裡的用途是？",a:["設備接上網路時，先驗證身分才放行","讓無線網路的速度變快","自動幫交換器備份設定檔，設備故障的時候可以直接還原","防止交換器之間產生迴圈"],why:"沒有 802.1X，隨便一台電腦插上牆上的網路孔就進內網。有了它，要通過驗證才能連線。"},
 {q:"一條線路換過線、換過埠還是很慢，交換器上看到這個埠有大量錯誤和碰撞。最可能的原因是？",a:["兩端的速度或雙工設定不一致","IP 位址衝突","DNS 伺服器回應太慢","這條線路的使用者太多，頻寬已經被完全用滿了"],why:"一邊全雙工、一邊半雙工，線路會通但錯誤很多、非常慢。兩端都設自動協商，或兩端都固定成一樣。"},
 {q:"狀態式防火牆環境中，封包去的時候走 A 防火牆，回來卻走 B 防火牆。會發生什麼事？",a:["B 沒有這條連線的紀錄，回程封包會被丟掉","沒有影響，防火牆只檢查出去的方向","速度會變成兩倍","兩台防火牆會自動互相同步所有的連線狀態，使用者不會有任何感覺"],why:"這叫非對稱路由。狀態式防火牆要看到連線的開頭才認得後面的封包，來回不同路就會被擋。"},
 {q:"把兩條網路線綁成一組（Link Aggregation／LACP），主要的好處是？",a:["頻寬加總，而且其中一條斷了還能繼續通","可以把網路線的長度限制延長一倍","讓兩個不同的 VLAN 不需要經過路由就可以直接互相連線","自動擋掉網路上的病毒"],why:"鏈路聚合同時提供更大的頻寬和備援。伺服器到交換器、交換器之間的上行都很常用。"}
],[
 {q:"整棟大樓的網路都經過同一台核心交換器。架構上最該改善的是？",a:["做成雙核心，各樓層交換器雙上行","把那一台換成更貴的型號","多買一台放在倉庫當備品，壞掉的時候再拿出來換上去，設定到時候再重新輸入","把核心交換器的風扇轉速調高"],why:"再貴的單一設備還是單點。雙核心加雙上行，一台故障或升級時流量可以走另一邊。"},
 {q:"為了趕快解決問題，防火牆臨時開了一條 any 到 any 的規則。之後最重要的是什麼？",a:["設定到期日，問題查清楚後改成最小範圍的規則","既然通了就留著，免得以後又出一樣的問題","再多開幾條 any 的規則，避免其他系統之後也遇到同樣被擋的狀況","把這條規則移到最下面"],why:"「臨時」的規則最容易變成永久的漏洞。要有到期日、申請人和原因，並定期清查。"},
 {q:"監視器、門禁、印表機這類連網設備，網路上應該怎麼規劃？",a:["放在獨立的網段，只開放必要的連線","跟辦公室的電腦放在同一個網段，管理比較方便","直接給它們對外的固定 IP，這樣廠商遠端維護的時候比較快","不需要特別規劃"],why:"這類設備很少更新、常有預設密碼，很容易被當成入侵內網的跳板。隔離起來，被打下也走不遠。"},
 {q:"公司拉了兩條對外線路做備援。規劃時最該確認什麼？",a:["兩條是不是走不同的業者和不同的實體路由","兩條的月租費是不是一樣","兩條線路用的數據機是不是同一個廠牌、同一個型號，方便日後維護","兩條的 IP 是不是連號"],why:"兩條線如果進同一個管道、同一個機房，一次施工挖斷就一起斷。備援要連實體路徑都分開。"},
 {q:"用 Wireshark 擷取封包，看到大量的 TCP Retransmission（重傳）。這代表什麼？",a:["路徑上有掉包或壅塞","連線被加密了","DNS 伺服器設定錯誤","這是正常現象，所有的 TCP 連線本來就都會把每個封包重新傳送好幾次"],why:"對方沒確認收到，才會重傳。少量正常，大量就表示中間有掉包：線路品質、壅塞或設備問題。"},
 {q:"對外頻寬突然被用滿，想知道是哪個 IP、哪種流量佔掉的。最適合的工具是？",a:["NetFlow／sFlow 這類流量分析","ping","nslookup","逐一打電話問每個部門的同事，現在是不是有人正在下載比較大的檔案"],why:"流量分析會記錄誰跟誰、用什麼協定、傳了多少。幾分鐘就能找到那個佔頻寬的來源。"},
 {q:"要遠端修改一台異地交換器的設定，改錯可能會把自己擋在外面。動手前應該先做什麼？",a:["備份現有設定，並設定一段時間後自動還原或重啟","先改改看，連不上再請當地的人去重開機","把所有設定一次全部貼上去，速度越快越不容易出錯","先把遠端管理的功能關掉"],why:"很多設備有「幾分鐘後自動重啟回復舊設定」的功能。改完確認沒問題再取消，就不會把自己鎖在外面。"},
 {q:"辦公室的 2.4GHz 無線網路很不穩，基地台很多、訊號也強。最可能的原因是？",a:["頻道互相重疊干擾","基地台的數量太少","使用者的電腦記憶體不足，沒有辦法同時處理這麼多個無線基地台的訊號","網路線太短"],why:"2.4GHz 互不重疊的頻道只有 1、6、11。基地台多又亂設頻道，訊號強反而互相蓋台。"}
]]},
{id:'sec',ic:'🛡️',col:'#fbe6e3',name:'資訊安全',desc:'基本觀念、常見攻擊，以及遇到事情的第一步',ranks:['資安見習','資安值班','資安守門員'],lv:[[
 {q:'資訊安全的三個基本要素（CIA）是？',a:['機密性、完整性、可用性','控制性、識別性、稽核性','加密、身分、授權','成本、效益、風險'],why:'Confidentiality、Integrity、Availability：不外洩、不被竄改、要用的時候用得到。'},
 {q:'收到一封信說「帳號異常，請立即點連結重設密碼」。應該怎麼做？',a:['不點連結，自己從官方管道登入確認，並通報資訊單位','馬上點連結把密碼改掉比較安全','先轉寄給其他同事，問他們有沒有收到一樣的信再決定','直接回信問寄件人是不是真的'],why:'這是典型的釣魚信。不點、不回、通報；轉寄會讓更多人中招。'},
 {q:'「多因素驗證」（MFA）指的是？',a:['用兩種以上不同類型的方式驗證身分，例如密碼加手機','設定兩組不同的密碼，登入時兩組都要輸入才能通過','使用一組非常長的密碼','規定每天都要更換一次密碼'],why:'因素分三類：你知道的、你持有的、你本身的。兩組密碼都屬於同一類，不算多因素。'},
 {q:'懷疑電腦中了勒索軟體。第一步應該做什麼？',a:['馬上斷開網路，不要關機，然後通報資安人員','依照畫面上的指示先付贖金，把檔案救回來再說','把電腦重新開機看會不會恢復','先把手上的工作做完再處理'],why:'斷網是為了不要擴散到別台；不關機是為了保留記憶體裡的證據。'},
 {q:'「最小權限原則」是什麼意思？',a:['只給完成工作所需要的最低權限','為了方便，每個人都給管理員權限','權限給得越多，工作效率越高','只有主管才可以擁有系統權限'],why:'權限越大，帳號被盜時的損害越大。'},
 {q:'弱點掃描和滲透測試，差別在哪裡？',a:['掃描是工具自動找已知弱點；滲透測試是人實際嘗試入侵來驗證','兩個是同一件事的不同說法','弱點掃描一定會真的入侵系統；滲透測試只是看報告','滲透測試不需要事先取得授權'],why:'兩者都要授權。掃描廣而淺，滲透測試深而有針對性。'},
 {q:'「社交工程」是什麼？',a:['利用人的信任、恐懼或好奇，騙取資料或讓人做出某些操作','一種把資料加密的技術','在社群網站上經營帳號、吸引人點擊的行銷方法','一種防火牆的規則設定'],why:'攻擊的對象是人，不是系統，所以技術再好也擋不住，要靠訓練和流程。'},
 {q:'備份的「3-2-1 原則」是指？',a:['3 份資料、2 種不同的儲存媒體、1 份放在異地','每 3 天備份 2 次，保留 1 個月','3 個人保管 2 把鑰匙，開 1 個機櫃','3 台伺服器、2 條線路、1 台 UPS'],why:'避免單一故障或單一地點的災害讓所有備份一起消失。'},
],[
 {q:"系統儲存使用者密碼，正確的做法是？",a:["存加鹽之後的雜湊值，不存密碼本身","用可以解回來的加密方式存，這樣使用者忘記密碼的時候才查得到","存明碼，但資料庫設密碼","存在只有管理員知道的 Excel 檔"],why:"雜湊不能還原，就算資料庫外洩，攻擊者也拿不到原本的密碼。加鹽是讓相同的密碼算出不同結果。"},
 {q:"手機收到簡訊：「您的 ETC 通行費逾期未繳，請點以下連結繳費」，後面是一串短網址。該怎麼做？",a:["不點連結，自己開官方 App 或官網查","點進去看看，沒有輸入資料就沒關係","趕快繳一繳，逾期會被罰錢，金額也不大，就算是假的損失也有限","回覆簡訊問對方是不是真的"],why:"這是台灣很常見的釣魚簡訊。要查就自己從官方管道進去，不確定可以打 165 反詐騙專線。"},
 {q:"弱點掃描報告有上百項。哪一種應該排最前面處理？",a:["CVSS 分數高，而且是對外服務的主機","出現次數最多的那一種弱點，因為影響的主機數量最多","修起來最簡單的","報告上排在第一頁的"],why:"優先順序看的是「嚴重程度」加上「暴露程度」。高風險又直接對外，被打的機會最大。"},
 {q:"「零信任」（Zero Trust）最核心的觀念是？",a:["不因為連線來自內部網路就直接信任，每次存取都要驗證","公司內所有人彼此都不要互相信任","完全不讓任何外部的連線進到公司，所有系統都只能在辦公室裡面使用","只信任資安人員"],why:"傳統做法是「進了內網就可信」。零信任是不管在哪，都要看身分、裝置狀態和權限再決定放不放行。"},
 {q:"關於密碼，下列哪一個做法比較安全？",a:["長的密碼片語，再加上多因素驗證","8 個字的複雜密碼，每個月強制換一次","每個系統都用同一組很複雜的密碼，這樣比較不會忘記，也就不用抄下來","把密碼寫在便條紙貼在螢幕旁"],why:"長度比複雜更有用。太常強迫更換，大家只會改尾數；再加上 MFA，密碼外洩也不會直接失守。"},
 {q:"在公司停車場撿到一支隨身碟。該怎麼處理？",a:["不要插任何電腦，交給資安或資訊單位","插到自己的電腦看看是誰的，好還給他","插到沒有連網路的舊電腦上看，這樣就算裡面有病毒也傳不出去","格式化之後自己留著用"],why:"故意丟隨身碟是很老但很有效的攻擊手法。交給有隔離環境的人處理。"},
 {q:"員工離職，他的帳號應該什麼時候停用？",a:["離職當天","等下個月帳號定期清查的時候，跟其他要停用的帳號一起處理","等接手的人說不需要了再停","不用停，把密碼改掉就好"],why:"離職後還能用的帳號，是很常見的入侵和資料外洩管道。要有人事通知資訊單位的流程。"},
 {q:"系統的 log 為什麼要另外集中保存，不只放在原本的主機上？",a:["主機被入侵時，攻擊者可能把上面的紀錄刪掉","這樣原本的主機可以跑得比較快","因為法規規定所有的紀錄都必須用紙本列印出來，並且由主管逐頁簽名","為了讓所有員工都能自己上去查"],why:"攻擊者常會清掉自己的足跡。log 另外送到集中的地方，事後才有東西可以查。"}
],[
 {q:"資安事件應變的階段，順序是？",a:["識別、圍堵、根除、復原、檢討","復原、識別、檢討、圍堵、根除","檢討、根除、識別、復原、圍堵","先根除和復原讓服務上線，其他的階段可以視情況省略"],why:"先確認發生什麼事、不讓它擴大，再清乾淨、恢復服務，最後檢討。順序亂了常會邊修邊被打。"},
 {q:"確認一台主機被入侵了。在鑑識人員到之前，比較正確的處理是？",a:["把它從網路隔離，但不要關機也不要重灌","馬上重灌，越快恢復乾淨的狀態越好","立刻關機，把電源線拔掉","繼續讓它正常運作，以免打草驚蛇，等攻擊者自己離開"],why:"隔離是為了止血。關機會讓記憶體裡的證據消失，重灌更是把入侵的路徑和範圍全部抹掉。"},
 {q:"「橫向移動」（Lateral Movement）指的是什麼？",a:["攻擊者拿下一台之後，在內網往其他主機擴散","員工在部門之間調動","把伺服器從一個機房搬到另一個機房，過程中資料可能外洩","資料在兩台主機之間同步"],why:"攻擊者很少一次就打到目標，通常先拿下一台再往內走。網段切分、限制管理帳號就是在擋這一步。"},
 {q:"EDR 和傳統防毒軟體，最主要的差別是？",a:["EDR 會記錄並分析端點上的行為，事後可以追查和處置","EDR 只是比較貴的防毒軟體，功能完全一樣","EDR 不需要安裝在電腦上","傳統防毒可以防所有的新型攻擊，EDR 只能防已知的病毒"],why:"傳統防毒主要靠特徵比對擋已知的惡意程式。EDR 看的是行為，能發現沒見過的手法，也留下調查用的紀錄。"},
 {q:"一家軟體廠商的更新伺服器被駭，客戶裝了「官方更新」反而中毒。這種攻擊叫什麼？",a:["供應鏈攻擊","阻斷服務攻擊","暴力破解","社交工程"],why:"攻擊者不直接打你，改打你信任的廠商。所以廠商管理、更新驗證、最小權限都是資安的一部分。"},
 {q:"網域管理員帳號，為什麼不應該拿來登入一般使用者的電腦？",a:["那台電腦如果已經被入侵，管理員的憑證會被偷走","一般電腦的效能不夠，登入會很慢","網域管理員帳號在一般電腦上本來就登入不了，系統會自動擋下來","這樣會佔用使用者的授權數量"],why:"登入過的地方會留下憑證。高權限帳號只在受保護的管理主機上使用，是防止整個網域被拿下的基本功。"},
 {q:"「縱深防禦」的意思是？",a:["疊好幾層不同的防護，一層被突破還有下一層","把所有的預算集中買一台最好的防火牆","把機房設在地下室比較深的樓層，降低被實體入侵的機會","只保護最重要的那一台伺服器"],why:"沒有任何單一防護是百分之百的。防火牆、端點防護、權限控管、監控、備份，各自補別人的洞。"},
 {q:"資安情資裡常提到的 IoC（入侵指標）是什麼？",a:["可以用來判斷是否被入侵的線索，例如惡意 IP、網域、檔案雜湊值","評估公司資安成熟度的分數","攻擊者組織的正式名稱以及成員名單，每一年由各國政府共同彙整之後統一對外公布","防火牆的一種授權模式"],why:"拿到 IoC 就能回頭查自己的 log：有沒有人連過這個 IP、有沒有這個雜湊值的檔案。"}
],[
 {q:"MITRE ATT&CK 是什麼？",a:["整理攻擊者戰術和手法的知識庫","一套防毒軟體","一張資安證照","美國政府規定所有企業都必須通過的一項資訊安全強制驗證標準"],why:"它把攻擊拆成戰術（要達成什麼）和技術（怎麼做）。可以用來檢視自己的偵測涵蓋了哪些、缺哪些。"},
 {q:"一條偵測規則每天跳幾百個告警，幾乎都是誤報，值班的人已經不看了。該怎麼處理？",a:["調整規則的條件和排除清單，讓它只在該響的時候響","把這條規則直接關掉","維持現狀，寧可多報也不要漏報","規定值班人員每一個告警都一定要逐一點開來看，並且寫下判斷的理由"],why:"沒人看的告警等於沒有告警，真的攻擊也會被淹沒。關掉會漏、放著也會漏，要調到可以處理的量。"},
 {q:"紅隊演練和一般的滲透測試，主要差別在哪裡？",a:["紅隊模擬真實攻擊者達成特定目標，同時考驗防守方能不能發現","紅隊演練不需要取得授權","兩者只是名稱不同","滲透測試是由公司內部的人來做，紅隊演練則一定要找國外的廠商"],why:"滲透測試重點是盡量找出弱點；紅隊是設定目標（例如拿到某份資料），看整個偵測和應變能不能擋下來。"},
 {q:"「威脅獵捕」（Threat Hunting）和等告警響再處理，差別是什麼？",a:["主動假設已經被入侵，去資料裡找還沒觸發告警的跡象","威脅獵捕是把攻擊者抓去報警","威脅獵捕只能在事件發生後做","沒有差別，兩個名詞講的是同一件事，只是不同廠商各自的行銷用語而已"],why:"偵測規則只抓得到已知的模式。獵捕是帶著假設（例如「有人用合法工具在橫向移動」）去翻紀錄。"},
 {q:"管理者要連進伺服器，為什麼建議一律經過跳板機（或特權存取管理系統）？",a:["集中管控和記錄所有的管理連線","連線速度會比較快","這樣管理者就可以不用記密碼，所有伺服器都可以直接登入而不需要驗證","可以節省伺服器的授權費用"],why:"管理連線只剩一個入口，可以強制 MFA、側錄操作、限制來源。伺服器也就不必對整個內網開管理埠。"},
 {q:"確認 AD 被攻擊者取得網域管理員權限。清除階段的密碼重設，範圍應該是？",a:["所有特權帳號、服務帳號和 krbtgt，必要時全部使用者","只要重設那一個被盜用的帳號","不用重設，把攻擊者的 IP 封鎖就可以","只需要重設資訊部門同仁的帳號，一般使用者的帳號因為權限很低所以不受影響"],why:"拿到網域管理員就能把所有帳號的雜湊倒出來。只換一個帳號，攻擊者用另一個再進來就好。"},
 {q:"要及早發現「有人正在把大量資料往外傳」，哪一種做法最直接？",a:["監控對外流量的異常，例如離峰時段的大量上傳","定期更換所有人的密碼","把所有員工的 USB 連接埠全部用膠封死，並且禁止任何人攜帶手機進辦公室","每年做一次弱點掃描"],why:"資料外洩最後都要經過網路出去。平常有流量基準，突然多出來的上傳量就很顯眼。"},

{id:'linux',ic:'🐧',col:'#dcf3ea',name:'Linux 系統',desc:'檔案、權限、服務、紀錄和常用指令',ranks:['Linux 見習','系統值班','Linux 管理員'],lv:[[

 {q:'<code>sudo</code> 的作用是什麼？',a:['用其他使用者（預設是 root）的權限執行一個指令','切換到另一個使用者的家目錄，之後都在那裡工作','把系統關機','安裝作業系統'],why:'平常用一般帳號，需要時才用 sudo 提權，而且會留下紀錄。'},
 {q:'要在 app.log 裡找出含有 error 的行，用哪個指令？',a:['grep error app.log','find error app.log','ls error app.log','cd error app.log'],why:'<code>grep</code> 搜尋檔案內容；<code>find</code> 是依檔名、時間等條件找檔案。'},

 {q:"磁碟快滿了，想知道目前目錄下哪個資料夾最佔空間，用哪個指令？",a:["<code>du -sh *</code>","<code>df -h</code>","<code>ls -la</code>","<code>free -h</code>"],why:"<code>df</code> 看的是整個分割區剩多少；<code>du</code> 才是看每個資料夾各用了多少。"},

 {q:"crontab 裡這一行代表什麼時候執行？",code:"0 2 * * * /opt/backup.sh",a:["每天凌晨 2 點","每 2 分鐘一次","每個月 2 號","每個星期二"],why:"五個欄位依序是分、時、日、月、星期。<code>0 2 * * *</code> 就是每天 2 點 0 分。"}
],[
 {q:"寫檔案時出現 <code>No space left on device</code>，但 <code>df -h</code> 顯示還有空間。最可能的原因是？",a:["inode 用完了","記憶體不足","這個目錄的權限設定不對","硬碟故障了"],why:"大量小檔案會把 inode 用光，空間還有也建不了新檔。用 <code>df -i</code> 確認。"},
 {q:"刪掉一個 20GB 的 log 檔，但 <code>df</code> 顯示空間沒有變多。為什麼？",a:["還有程式開著這個檔案，空間要等它關閉才會釋放","Linux 刪除檔案之後一定要重新開機，空間才會真的還回來","檔案其實進了資源回收筒","df 這個指令的數字每天才更新一次"],why:"檔案被刪了，但程式還握著它，空間就不會還回來。重啟那支服務，或一開始就用清空內容的方式處理。"},
 {q:"一台對外的 Linux 主機，SSH 最基本的強化是？",a:["禁止 root 直接登入，並改用金鑰驗證","把 root 的密碼設長一點就好","把 SSH 服務關掉，要管理主機的時候再請機房的人去現場接螢幕鍵盤","改用 Telnet"],why:"對外的 SSH 每天都有人在猜密碼。金鑰驗證加上禁止 root 直接登入，就擋掉絕大部分的暴力嘗試。"},
 {q:"主機的 load average 很高，但 CPU 使用率卻很低。比較可能是什麼狀況？",a:["很多程式在等磁碟或網路的讀寫","CPU 快要壞了，所以不敢全力運轉","記憶體裝太多","系統時間不準"],why:"load 算的是「在排隊的工作數」，包含等 I/O 的。CPU 很閒但 load 高，通常是磁碟太慢或掛載的網路儲存卡住。"}
],[
 {q:"主機記憶體用光，核心自動砍掉了資料庫的程序。這個機制叫什麼？",a:["OOM Killer","SELinux","cron","swap"],why:"記憶體耗盡時，核心會挑程序砍掉來自救，常常挑中吃最多的資料庫。<code>dmesg</code> 或系統紀錄裡查得到。"},
 {q:"服務啟動失敗，查出是被 SELinux 擋下來。比較正確的處理是？",a:["看稽核紀錄，針對這個服務調整規則","直接把 SELinux 整個關掉，以後就不會再遇到這種問題","重灌作業系統","改用 root 身分執行這個服務"],why:"整個關掉最省事，但也把一層防護拿掉了。稽核紀錄會寫明擋了什麼，照它調整標籤或規則即可。"},
 {q:"要讓一位同事可以重啟網站服務，但不該有完整的管理權限。sudo 應該怎麼設？",a:["只允許他執行重啟那個服務的指令","直接給他 ALL 的權限，比較方便","把 root 的密碼告訴他","把他的帳號加進所有的系統群組，這樣他需要做什麼的時候都不會被擋"],why:"sudoers 可以細到「哪個人、能跑哪幾個指令」。需要什麼給什麼，帳號被盜時損害才有限。"},
 {q:"用 Ansible 這類設定管理工具管理五十台主機，最大的價值是什麼？",a:["每台的設定一致，而且改了什麼都有紀錄可查","主機的硬體效能會提升","可以完全不需要了解 Linux，工具會自動判斷每一台主機應該要怎麼設定","主機就不需要再安裝安全性更新"],why:"手動改五十台，一定會有幾台漏掉或改得不一樣。設定寫成檔案、進版本控制，才知道現況和歷史。"}
]]},

 {q:'執行 UPDATE 或 DELETE 之前，最重要的檢查是？',a:['確認有 WHERE 條件，並先用 SELECT 看會影響幾筆','先把資料庫主機重開機','先把其他使用者全部踢下線','不需要特別檢查，萬一執行錯了再用另一句 SQL 改回來'],why:'沒有 WHERE 的 UPDATE／DELETE 會動到整張表，這是最常見的資料事故。'},
 {q:'交易（Transaction）的 ACID 特性中，A 代表什麼？',a:['原子性：全部成功，或全部不做','可用性：系統隨時可以使用','授權：只有授權的人可以執行','自動化：系統會自動執行'],why:'Atomicity。另外三個是一致性、隔離性、持久性。'},
 {q:'在欄位上建立索引（Index），效果和代價是？',a:['查詢變快，但寫入變慢，也多佔空間','寫入變快，但查詢變慢，佔用空間減少','自動把資料壓縮','自動把資料加密'],why:'索引像書的目錄：找得快，但每次新增修改都要一起維護。'},
 {q:'要把兩張資料表依照關聯欄位合起來查詢，用哪一個語法？',a:['JOIN','UNION','GROUP BY','ORDER BY'],why:'JOIN 是依欄位把兩張表的資料列對起來；UNION 是把兩個查詢結果上下接起來。'},
 {q:'防範 SQL Injection 最有效的做法是？',a:['使用參數化查詢，不要把使用者輸入直接串成 SQL','把資料庫的錯誤訊息隱藏起來','網站改用 HTTPS 連線','把資料庫的連接埠改成別的號碼，讓外面找不到'],why:'參數化查詢讓輸入只會被當成資料，不會被當成指令執行。'},
 {q:'平常做「完整備份＋差異備份」。要還原到最新狀態，需要哪些備份？',a:['最近一次完整備份，加上最近一次差異備份','最近一次完整備份，加上之後每一次差異備份','只需要最近一次差異備份','只需要最近一次完整備份'],why:'差異備份記錄的是「上次完整備份之後的所有變動」，所以只要最新一份。每一份都要的是增量備份。'},
],[
 {q:"要清空一張資料表的資料，<code>DELETE</code>、<code>TRUNCATE</code>、<code>DROP</code> 哪個會連資料表本身都刪掉？",a:["DROP","DELETE","TRUNCATE","三個都會"],why:"DELETE 刪資料列（可加條件）；TRUNCATE 快速清空但表還在；DROP 是整張表連結構一起消失。"},
 {q:"外鍵（Foreign Key）的作用是？",a:["確保這個欄位的值，在另一張表裡真的存在","讓查詢的速度變快","把欄位的內容加密起來，沒有權限的帳號就算查到資料也看不懂","限制一張表最多只能有幾筆資料"],why:"例如訂單表的客戶編號，一定要是客戶表裡有的。外鍵是用來守住資料之間的關聯。"},
 {q:"這個查詢在資料量很大的表上跑得很慢，name 欄位明明有索引。最可能的原因是？",code:"SELECT * FROM staff WHERE name LIKE '%明';",a:["開頭是 % 的 LIKE 用不到索引，只能整張表掃","SELECT * 的寫法是錯的","資料表的名稱取得太短了，資料庫需要花比較多時間才找得到這張表","中文字不能當查詢條件"],why:"索引像字典的部首排序，要知道開頭才查得快。<code>%</code> 放在最前面，就只能一筆一筆比。"},
 {q:"在交易裡執行了 UPDATE，發現改錯了，而且還沒 COMMIT。該下什麼指令？",a:["ROLLBACK","COMMIT","DROP","再下一次相反的 UPDATE 把值一筆一筆改回來，然後再 COMMIT"],why:"還沒 COMMIT 的變更，ROLLBACK 就能整個取消。所以改重要資料時，先開交易再動手。"},
 {q:"這個查詢會得到什麼結果？",code:"SELECT dept, COUNT(*) FROM staff GROUP BY dept;",a:["每個部門各有幾個人","全公司總共有幾個人","每個人屬於哪一個部門","人數最多的那一個部門"],why:"<code>GROUP BY dept</code> 把資料依部門分組，<code>COUNT(*)</code> 算每一組有幾筆。"},
 {q:"資料庫每天晚上都有備份，而且排程都顯示成功。這樣夠安心了嗎？",a:["不夠，要定期實際還原一次，確認備份真的能用","夠了，排程顯示成功就代表備份檔沒有問題，需要的時候拿出來用就好","夠了，只要備份檔的大小有在增加","不夠，應該改成每小時備份一次"],why:"沒還原過的備份，只能算「希望它能用」。很多單位是出事那天才發現備份檔壞的或缺東西。"},
 {q:"應用程式連資料庫用的帳號，權限應該怎麼給？",a:["只給它需要的資料表和操作","直接用資料庫最高權限的管理員帳號，免得之後功能增加又要重新調整權限","每個程式都共用同一組帳號比較好管理","不用設密碼，反正在內網"],why:"程式被打穿時，攻擊者拿到的就是那個帳號的權限。權限越小，損害越小。"},
 {q:"要找出 email 欄位沒有填的資料，條件要怎麼寫？",a:["<code>WHERE email IS NULL</code>","<code>WHERE email = NULL</code>","<code>WHERE email = 0</code>","<code>WHERE NOT email</code>"],why:"NULL 代表「不知道」，不能用等號比，要用 <code>IS NULL</code>。用 <code>= NULL</code> 永遠查不到東西。"}
],[
 {q:"兩個交易各自鎖住一筆資料，又都在等對方手上那一筆。這個狀況叫什麼？",a:["死結（Deadlock）","髒讀（Dirty Read）","資料庫當機","索引損毀"],why:"資料庫會偵測到死結，挑其中一個交易強制取消。程式要能接住這個錯誤並重試，也盡量用固定的順序存取資料。"},
 {q:"有人在管理工具裡開了交易、改了資料，沒有 COMMIT 就去開會了。其他人會遇到什麼？",a:["要動到同一批資料的操作會被卡住，一直等","完全沒有影響","其他人會馬上看到他改到一半的資料，而且可以繼續接著改","資料庫會自動幫他 COMMIT"],why:"沒結束的交易會一直握著鎖。正式環境查「系統突然卡住」，常常最後找到的就是一個忘了提交的連線。"},
 {q:"查詢很慢，想知道資料庫實際是怎麼執行它的（有沒有用到索引、掃了多少筆）。該看什麼？",a:["執行計畫（EXPLAIN）","資料表的建立日期","資料庫軟體的授權合約和報價單","伺服器的機殼溫度"],why:"執行計畫會告訴你它走哪個索引、是不是整張表掃。調校查詢的第一步是看它，不是猜。"},
 {q:"資料庫已經設了即時複寫到另一台。有人說「這樣就不需要備份了」，問題在哪？",a:["誤刪或錯誤的更新會同步到另一台，兩邊一起壞","沒有問題，複寫就是即時的備份，比每天備份還要好","複寫的那一台不能讀取資料","複寫只能用在測試環境"],why:"複寫是為了主機故障時能接手。人為的錯誤、程式的 bug、勒索軟體，都會被忠實地複寫過去。"},
 {q:"想把資料庫還原到「今天下午 2 點 15 分，誤刪之前」的狀態。需要具備什麼？",a:["完整備份，加上到那個時間點為止的交易紀錄","只要有昨天晚上的完整備份就可以","只要資料庫有設定複寫，就可以直接指定任何時間點倒回去","做不到，只能還原到備份當下的時間"],why:"這叫時間點還原。先還原完整備份，再把交易紀錄重播到指定時間。所以交易紀錄的備份不能斷。"},
 {q:"為了讓查詢變快，在一張表上建了二十幾個索引。可能造成什麼副作用？",a:["新增、修改、刪除會變慢，也佔更多空間","查詢會全部變慢","資料會開始遺失","沒有副作用，索引越多越好，資料庫會自動挑選最適合的來用"],why:"每次寫入都要更新所有相關的索引。索引要針對實際常用的查詢建，沒在用的要清掉。"},
 {q:"程式先查出 100 筆訂單，再用迴圈對每一筆各查一次客戶資料，總共 101 次查詢。這個問題怎麼改善？",a:["改成用 JOIN 或一次查回來","把迴圈改成跑 200 次","把資料庫伺服器的記憶體加大一倍，查詢的次數多一點也沒有關係","每次查詢之間加上延遲"],why:"這叫 N+1 查詢，資料一多就非常慢。大部分情況一個 JOIN 或一次批次查詢就能解決。"},
 {q:"開發人員想把正式資料庫整份複製到測試環境，方便測試。裡面有大量個資，應該怎麼處理？",a:["先把個資欄位遮罩或換成假資料，再放進測試環境","直接複製，測試環境在內網所以沒有關係","請開發人員簽一張保密切結書，簽完就可以整份複製過去使用","把測試環境的密碼設得跟正式環境一樣"],why:"測試環境的權限和防護通常比正式環境鬆。真實個資放進去，等於多一個管得比較差的外洩點。"}
],[
 {q:"資料庫高可用叢集的兩個節點之間網路斷了，兩邊都以為對方掛了、都開始接受寫入。這個狀況叫什麼？",a:["腦裂（Split-Brain）","死結","全表掃描","冷備份"],why:"兩邊各寫各的，資料就分岔、很難合回來。所以叢集需要第三方仲裁，確保同一時間只有一邊是主要節點。"},
 {q:"資料庫複寫可以選「同步」或「非同步」。同步複寫的取捨是什麼？",a:["主機故障時不會掉資料，但每次寫入要等對方確認，比較慢","速度最快，但可能會掉資料","不需要網路就可以運作","沒有任何取捨，同步複寫在速度和資料安全兩方面都比非同步來得好"],why:"同步是等備援那邊也寫好才算完成，所以零遺失但受網路延遲影響。非同步快，但故障時最後幾筆可能沒傳到。"},
 {q:"一張十年累積的紀錄表有幾億筆，查詢和清舊資料都很慢。哪一種設計最有幫助？",a:["依日期做分割（Partition）","把所有欄位都改成文字型別","把資料表的名稱改短一點，這樣資料庫找這張表的時候可以節省時間","每天把整張表重建一次"],why:"依日期分割後，查近期資料只掃那幾個分割；清舊資料直接卸掉整個分割，不用一筆一筆刪。"},
 {q:"尖峰時段應用程式大量出現「無法取得資料庫連線」的錯誤，資料庫本身負載卻不高。最該檢查什麼？",a:["連線池的上限，以及程式有沒有用完連線沒歸還","資料庫的磁碟空間","資料庫伺服器的時區設定是不是跟應用程式伺服器的時區完全一致","資料表的欄位數量"],why:"連線是有限的資源。程式拿了不還（連線洩漏）或池子設太小，就會出現資料庫很閒、程式卻連不上。"},
 {q:"要把正式資料庫升級到新的大版本。最穩當的做法是？",a:["先用正式資料的複本完整演練一次，並準備好退回的方法","挑離峰時間直接升級，有問題再上網查","先升級正式環境，確認一切都沒有問題之後，再回頭去升級測試環境","升級前不要備份，以免拖慢速度"],why:"大版本升級可能改變語法、執行計畫和相容性。演練過才知道要多久、會遇到什麼，以及退不退得回來。"},
 {q:"資料庫裡有大量個資。對 DBA 這種最高權限的帳號，應該有什麼樣的控管？",a:["存取行為要留下稽核紀錄，而且紀錄要放在 DBA 改不到的地方","DBA 是可以信任的，不需要控管","不讓 DBA 登入資料庫","請 DBA 每個月自己寫一份報告，說明這個月有沒有查詢過不應該查詢的個資"],why:"權限最高的人，風險也最高。紀錄和被記錄的人分開，是職務區隔的基本原則，也保護 DBA 自己。"},
 {q:"資料庫啟用了透明資料加密（TDE）。它主要防的是什麼？",a:["資料檔或備份檔被整份偷走時，內容讀不出來","有權限的帳號用 SQL 查詢個資","SQL Injection 攻擊","使用者輸入錯誤的資料，或者不小心把重要的資料表整張刪除掉的情況"],why:"TDE 加密的是磁碟上的檔案。透過資料庫正常登入查詢，資料還是明文，所以它不能取代權限控管。"},
 {q:"一個跑了好幾年的查詢，程式沒改、資料量也沒暴增，某天突然變得很慢。最該懷疑什麼？",a:["統計資訊過期或執行計畫改變了","資料庫中毒了","使用者的螢幕解析度太高，畫面需要比較長的時間才能把查詢結果顯示出來","SQL 語法過期了"],why:"資料庫依統計資訊決定怎麼執行查詢。統計不準或計畫被重新產生，同一句 SQL 可能從用索引變成整張表掃。"}
]]},
{id:'gov',ic:'📜',col:'#fbf1d9',name:'法規與治理',desc:'資安法、個資法、ISO 27001 和稽核',ranks:['法遵見習','受稽人員','治理推手'],lv:[[
 {q:'《資通安全管理法》規範的對象包含哪些？',a:['公務機關和特定非公務機關','只有中央政府機關','只有金融業者','所有在國內使用電腦的個人'],why:'特定非公務機關包含關鍵基礎設施提供者、公營事業、政府捐助的財團法人。'},
 {q:'依資通安全事件通報及應變辦法，知道發生資安事件後，要在多久之內通報？',a:['1 小時內','24 小時內','72 小時內','一個星期內'],why:'知悉後一小時內要完成通報，所以值班人員要知道通報的流程和窗口。'},
 {q:'在《個人資料保護法》中，病歷、醫療、基因、健康檢查這類資料屬於？',a:['特種個人資料，原則上不得蒐集、處理或利用','一般個人資料，取得當事人口頭同意就可以使用','已經公開的資料','不屬於個人資料'],why:'個資法第 6 條。除非符合法定例外（例如醫療目的、當事人書面同意），否則不能用。'},
 {q:'ISO 27001 是什麼的標準？',a:['資訊安全管理系統（ISMS）','品質管理系統','環境管理系統','醫療器材品質管理系統'],why:'品質是 ISO 9001、環境是 ISO 14001、醫療器材是 ISO 13485。'},
 {q:'評估出一項風險之後，處理的方式有哪四種？',a:['降低、移轉、避免、接受','忽略、隱藏、刪除、否認','記錄、通報、開會、結案','加密、備份、防毒、更新'],why:'降低（加控制措施）、移轉（保險或委外）、避免（不做那件事）、接受（主管核可後承擔）。'},
 {q:'稽核時被問到一項還沒有做到的要求，應該怎麼回應？',a:['如實說明現況，並提出改善計畫和預計完成時間','先回答有做，稽核結束之後再想辦法補上','當場趕快補一份文件出來','說那是其他單位負責的'],why:'稽核看的是管理是否有效。隱瞞被查到會變成更嚴重的缺失。'},
 {q:'我國的資通安全事件分成幾級？哪一級最嚴重？',a:['分成四級，第四級最嚴重','分成三級，第一級最嚴重','分成五級，第五級最嚴重','分成四級，第一級最嚴重'],why:'依機密性、完整性、可用性受影響的程度分一到四級，數字越大越嚴重。'},
 {q:'帳號和存取權限為什麼要定期清查？',a:['人員調動或離職後，常會留下不該有的權限','清查之後系統的負載降低，跑得比較快','可以節省軟體授權費用','只是為了應付稽核'],why:'沒收回的權限是內部風險和入侵後擴散的常見來源。'},
],[
 {q:"依《個人資料保護法》，向當事人蒐集個資時，原則上應該告知他什麼？",a:["蒐集的目的、資料怎麼利用，以及他可以行使哪些權利","只要告知公司的名稱","不用特別告知，只要資料有妥善保管、沒有外洩，就符合法律的要求","告知系統使用的資料庫廠牌"],why:"個資法第 8 條規定了蒐集時的告知事項：機關名稱、目的、資料類別、利用的期間地區對象方式、當事人權利等。"},
 {q:"公司發現保有的個資被竊取或外洩。依《個人資料保護法》，對當事人應該怎麼做？",a:["查明後，以適當方式通知當事人","只要內部檢討改善，為了避免引起恐慌，不需要讓當事人知道這件事","等當事人自己來問再回答","在公司內部公告就可以"],why:"個資法第 12 條：個資被竊取、洩漏、竄改或其他侵害時，應查明後以適當方式通知當事人。"},
 {q:"當事人依《個人資料保護法》可以要求查詢、更正、刪除自己的個資。公司可以在契約裡寫「當事人同意放棄這些權利」嗎？",a:["不行，這些權利不能預先拋棄，也不能用特約限制","可以，只要當事人有親筆簽名同意，雙方你情我願，契約就有效力","可以，但要給當事人折扣","只有政府機關不行，民間公司可以"],why:"個資法第 3 條：查詢閱覽、製給複本、補充更正、停止蒐集處理利用、刪除，這五項權利不得預先拋棄或以特約限制。"},
 {q:"你發現別家公司的網站好像有漏洞，想「幫他們測試一下」。沒有對方授權就動手，會有什麼問題？",a:["可能觸犯刑法的妨害電腦使用罪","沒有問題，只要是出於善意，而且事後有把發現的漏洞告訴對方就可以","只要沒有成功入侵就沒事","只有造成對方金錢損失才有問題"],why:"刑法第 358 條以下：無故入侵他人電腦、取得或變更電磁紀錄、干擾系統都有刑責。測試一定要先拿到書面授權。"},
 {q:"你是系統管理員，技術上看得到所有人的信件和檔案。同事之間有八卦，你很好奇。可以去看嗎？",a:["不行，權限只能用在業務需要的範圍","可以，管理員本來就有這個權限，系統也沒有擋，代表公司允許","看一下沒關係，不要講出去就好","可以，但要先備份"],why:"「做得到」和「可以做」是兩回事。超出業務目的去看別人的資料，是職業倫理問題，也可能有法律責任。"},
 {q:"ISO 27001:2022 的附錄 A，控制措施有幾項、分成哪幾類？",a:["93 項，分成組織、人員、實體、技術四類","114 項，分成 14 個領域","10 項，分成高、中、低三類","沒有固定的數量，由各家驗證公司依照受稽單位的規模和產業自行決定"],why:"2022 年版把舊版的 114 項、14 個領域，整併成 93 項、四大主題：組織、人員、實體、技術。"},
 {q:"我國《資通安全管理法》體系下，機關的「資通安全責任等級」分成哪幾級？哪一級要求最高？",a:["A 到 E 五級，A 級最高","1 到 4 四級，4 級最高","甲、乙、丙三級，甲級最高","只分成公務機關和非公務機關兩種，兩種的要求完全相同"],why:"責任等級分 A、B、C、D、E，A 級要求最多。這和「資安事件」的 1 到 4 級是兩件不同的事，不要搞混。"},
 {q:"系統委外給廠商維護，結果廠商那邊出了資安事件。委外的機關有責任嗎？",a:["有，機關對委外廠商負有監督責任","沒有，合約已經簽了，系統交給廠商維護，出事就完全是廠商的責任","要看廠商的規模","只有機關自己的人員也犯錯才有"],why:"工作可以委外，責任不能委外。資通安全管理法也要求機關選任適當的受託者，並監督它的資安維護情形。"}
],[
 {q:"依我國《資通安全事件通報及應變辦法》，第三級或第四級的資安事件，應該在知悉後多久內完成損害控制或復原？",a:["36 小時","72 小時","7 天","沒有時限的規定，由各機關依照事件的複雜程度自行決定"],why:"第一、二級是 72 小時內，第三、四級比較嚴重，要在 36 小時內完成損害控制或復原作業。"},
 {q:"風險評鑑之後，採取控制措施還是會剩下一些風險，叫「殘餘風險」。它應該怎麼處理？",a:["由管理階層確認並決定是否接受","由承辦人自己判斷，不需要讓主管知道","不需要處理，做了控制措施就代表風險已經歸零","一律買保險"],why:"風險不可能降到零。剩下的要讓有權責的人知道、決定接不接受並留下紀錄，這是風險管理的核心。"},
 {q:"ISO 27001 要求的「適用性聲明」（SoA）是什麼文件？",a:["列出附錄 A 每一項控制措施是否採用，以及採用或排除的理由","員工簽署的保密切結書","公司向驗證機構聲明自己完全沒有任何資安風險、也不會發生資安事件的保證文件","防火牆規則的清單"],why:"SoA 把風險處理的結果對應到控制措施：哪些有做、哪些不適用、為什麼。稽核員會拿它對照實際狀況。"},
 {q:"安排內部稽核時，為什麼不能讓人稽核自己負責的業務？",a:["稽核需要獨立性，自己查自己很難客觀","因為稽核員的職等一定要比受稽人員高","這只是慣例，實務上自己稽核自己最有效率，因為最了解狀況","因為這樣稽核的時間會太短"],why:"自己做的事，自己最難看出問題，也有利益衝突。ISO 27001 要求稽核員的選任要確保客觀和公正。"},
 {q:"公司把含有個資的系統委託廠商處理，結果廠商那邊發生外洩。依《個人資料保護法》，責任怎麼算？",a:["委託的公司仍要負責，受託廠商在法律上視同委託機關","全部由廠商負責，委託的公司沒有責任","只要合約有寫免責條款，委託的公司就完全不需要負任何責任","雙方都沒有責任，由當事人自行負擔"],why:"個資法第 4 條：受委託蒐集、處理或利用個資的人，在本法適用範圍內視同委託機關。施行細則也要求委託方要監督。"},
 {q:"營運持續計畫裡的 RTO 和 RPO，分別代表什麼？",a:["RTO 是多久內要恢復服務，RPO 是最多能接受遺失多久的資料","RTO 是備份的次數，RPO 是還原的次數","兩個是一樣的意思","RTO 是每年資訊預算可以動用的上限，RPO 則是每年資安人力編制的人數上限"],why:"RPO 決定備份要多頻繁（能丟一小時的資料，就至少每小時備份），RTO 決定備援要做到什麼程度。"},
 {q:"稽核開出一項「不符合」：某台伺服器的帳號沒有定期清查。只把那台伺服器清查完，算是完成矯正嗎？",a:["不算，要找出為什麼會漏掉，並確認其他伺服器有沒有同樣的問題","算，稽核員指出的那一台處理好就可以結案","算，只要在期限內回覆","不算，應該把那台伺服器直接下線報廢，這樣帳號沒清查的問題就徹底不存在了"],why:"只修被抓到的那一筆叫「改正」。矯正措施要處理原因，例如清查流程沒涵蓋到新建的主機，否則下次還會再發生。"},
 {q:"你負責一項採購的規格評估，其中一家投標廠商想請你吃飯、送你禮品。該怎麼處理？",a:["婉拒，並依公司規定向主管報備","收下來，但評估的時候保持公正就好","先收下，等採購案結束之後再還給對方，這樣就不算有影響到評估","只吃飯、不收禮品就沒有關係"],why:"就算你自認不受影響，別人也無從相信。利益衝突要迴避、要揭露，這是保護採購案，也是保護你自己。"}
],[
 {q:"依《資通安全管理法》，特定非公務機關應該訂定並實施什麼？",a:["資通安全維護計畫","年度員工旅遊計畫","只要有購買防毒軟體就符合規定，不需要另外再訂定任何的計畫或文件","資訊設備採購計畫"],why:"公務機關和特定非公務機關都要訂定、修正及實施資通安全維護計畫，並依規定提出實施情形。"},
 {q:"依資通安全責任等級的要求，A 級和 B 級機關的核心資通系統，在資訊安全管理系統（ISMS）方面要做到什麼？",a:["導入 CNS 27001 或 ISO 27001，並通過公正第三方驗證","只要內部自己宣告符合即可","不需要導入管理系統","每五年請原廠工程師到場檢查一次硬體設備，並且出具設備運作正常的證明文件"],why:"A、B 級除了導入，還要通過第三方驗證並持續維持有效；C 級要導入但不強制驗證。"},
 {q:"依《個人資料保護法》，個資外洩的被害人不易證明實際損害金額時，可以請求法院依情節酌定賠償。每人每一事件的範圍是？",a:["新臺幣 500 元以上、2 萬元以下","固定新臺幣 100 元","沒有規定，由公司自行決定","新臺幣 100 萬元以上，而且每一位被害人都可以請求相同的最高金額"],why:"個資法第 28 條。單看一人金額不大，但外洩常是幾萬、幾十萬筆，乘起來就很可觀。"},
 {q:"風險管理常講「三道防線」。第三道防線是誰？",a:["內部稽核","第一線的作業人員","防火牆","負責訂定政策並監督執行情形的風險管理單位以及法令遵循單位"],why:"第一道是業務和資訊單位自己做好控制，第二道是風險管理和法遵的監督，第三道是獨立的內部稽核。"},
 {q:"我國規定資通系統要做「防護需求分級」。分成哪幾級？",a:["普、中、高三級","A、B、C、D、E 五級","1 到 4 四級","不分級，所有的資通系統不論重要性高低，一律都適用完全相同的防護基準"],why:"依機密性、完整性、可用性、法律遵循性評估，分成普、中、高，再對應不同強度的防護基準。責任等級 A 到 E 是指機關，不是系統。"},
 {q:"資安管理的文件通常分四階。由上到下的順序是？",a:["政策、程序、作業說明、紀錄","紀錄、作業說明、程序、政策","四階之間沒有上下關係","合約、發票、收據、保固書，這四種是稽核的時候一定會被要求出示的文件"],why:"政策講方向，程序講誰在什麼時候做什麼，作業說明講怎麼做，紀錄證明真的有做。稽核會一路對下去。"},
 {q:"法規和主管機關的要求一直在變。組織要確保自己持續符合，最基本的機制是？",a:["指定權責單位定期鑑別適用的法規，並評估對內部規定的影響","等主管機關來稽核時再確認","每五年檢視一次","由每一位員工自己留意新聞，看到跟工作有關的法規修正再自己調整做法"],why:"ISO 27001 也要求鑑別法律和契約上的要求。沒有人負責追，就會出現內部規定還在引用舊條文的狀況。"},
 {q:"你知道發生了依法應該通報的資安事件，但直屬主管要你「先不要報」。比較適當的做法是？",a:["依內部的正式管道，向資安專責人員或更高層級反映","照主管說的做，責任就在主管身上","自己私下向媒體爆料","當作自己完全不知道這件事，之後如果有人問起來，就說當時沒有接到任何通知"],why:"法定的通報義務不會因為有人不想報就消失。先走內部的正式管道，並保留自己反映過的紀錄。"}
]]},
{id:'code',lv:[[
 {q:'每天早上都要手動把同一份報表複製到另一個資料夾。比較好的做法是？',a:['寫成腳本，交給排程每天自動跑','請同事輪流做，這樣比較不會有人忘記','繼續手動做，做久了自然就會越來越快','買一套更貴的軟體來做'],why:'重複、固定、有規則的事最適合自動化：省時間，也不會因為人忘記而漏掉。'},
 {q:'這段 Python 會印出什麼？',code:'for i in range(3):\n    print(i)',a:['0、1、2 各一行','1、2、3 各一行','只印一個 3','印三次 i 這個字'],why:'<code>range(3)</code> 是從 0 開始數三個數：0、1、2。很多語言都是從 0 開始算。'},
 {q:'腳本跑到一半出錯，畫面噴了一大串錯誤訊息。先看哪裡？',a:['最後幾行：錯誤的種類，還有是哪個檔案的第幾行','不用看，整段複製起來直接重跑一次，通常第二次就會過','只看第一行就好','把訊息清掉，免得被別人看到'],why:'大部分語言的錯誤訊息，最關鍵的錯誤種類和行號都在最後面。'},
 {q:'寫好一支會改資料的腳本，第一次執行應該在哪裡跑？',a:['測試環境，或先拿一份複本來跑','直接在正式環境跑，有問題再說','找離峰時間在正式環境跑就很安全了，因為那時候沒有人在用','在主管的電腦上跑'],why:'會改資料的東西先在不怕壞的地方試。離峰只是影響的人少，資料壞了一樣是壞了。'},
 {q:'版本控制（例如 Git）最主要是幫你做什麼？',a:['記錄每一次改了什麼、誰改的，改壞了可以退回去','讓程式執行的速度變快','自動幫你把程式裡的錯誤修好','把程式碼加密，讓別人沒有辦法看到內容'],why:'版本控制記的是「變更的歷史」。出事時能知道是哪一次改動造成的，也能退回上一版。'},
 {q:'腳本需要連資料庫，帳號密碼要怎麼處理？',a:['不要寫死在程式裡，放在權限管好的設定檔或密碼管理工具','直接寫在腳本最上面，這樣之後要改密碼的時候最好找','寫在註解裡提醒自己','用檔名來記'],why:'密碼寫死在程式裡，程式傳到哪、密碼就外流到哪。分開放，並且把那個檔案的權限管好。'},
 {q:'這行指令如果 <code>DIR</code> 這個變數剛好是空的，會發生什麼事？',code:'rm -rf "$DIR"/*',a:['變成 rm -rf /*，從根目錄開始刪','什麼事都不會發生，因為沒有指定目錄','系統會跳出確認視窗問你要不要刪','只會刪掉目前所在的這個目錄，其他地方的檔案都不受影響'],why:'變數是空的，路徑就變成 <code>/*</code>。動到刪除的腳本，執行前一定要先檢查變數有沒有值。'},
 {q:'程式裡的 <code>if</code> 是用來做什麼的？',a:['依條件決定要不要執行某段程式','把同一段程式重複執行很多次','宣告一個新的變數來存放資料','結束整支程式'],why:'<code>if</code> 是條件判斷。重複執行是迴圈（<code>for</code>、<code>while</code>）的工作。'}
],[
 {q:"把一段常用的程式包成「函式」，最主要的好處是？",a:["可以重複使用，要改的時候只要改一個地方","程式執行的速度會變快很多","包成函式之後別人就看不到裡面的內容，可以保護自己寫的程式不被抄走","檔案會變小"],why:"同樣的邏輯到處複製貼上，之後要改就得改很多處、還會漏。包成函式只維護一份。"},
 {q:"這段 Python 會印出什麼？",code:"a = [10, 20, 30]\nprint(a[1])",a:["20","10","30","會出錯"],why:"串列的位置從 0 開始算，<code>a[0]</code> 是 10，<code>a[1]</code> 是 20。"},
 {q:"JSON 是什麼？",a:["一種用文字表示資料的格式，常用在系統之間交換資料","一種程式語言","微軟推出的一套資料庫管理軟體，主要用來儲存大量的結構化資料","一種加密的方法"],why:"JSON 用大括號、中括號和「名稱：值」來表示資料，人看得懂、程式也好處理，API 幾乎都用它。"},
 {q:"「API」是用來做什麼的？",a:["讓程式和程式之間，用約定好的方式互相要資料或下指令","讓使用者用滑鼠點選操作的畫面","用來測試網路速度的工具","一種專門用來掃描電腦病毒並且自動把受感染檔案隔離起來的防護軟體"],why:"API 是給程式用的窗口：照規定的格式送出請求，就會拿到約定好的回應。"},
 {q:"程式裡的 <code>try</code>／<code>except</code>（其他語言叫 try／catch）是用來做什麼的？",a:["出錯的時候接住它，自己決定要怎麼處理","讓程式重複執行","讓這一段程式執行得比較快，因為系統會優先處理包在裡面的指令","把變數的值清空"],why:"沒接住的錯誤會讓整支程式直接中斷。接住之後可以記 log、重試，或給使用者看得懂的訊息。"},
 {q:"排程自動執行的腳本，為什麼應該把執行過程寫成 log？",a:["沒人在看畫面，出事時要靠紀錄才知道做到哪、錯在哪","這樣腳本會跑得比較快","因為沒有寫 log 的腳本，作業系統的排程功能會拒絕執行它","可以讓檔案看起來比較專業"],why:"半夜自己跑的東西，隔天有問題只能靠 log。至少要記開始、結束、處理了幾筆、錯誤訊息。"},
 {q:"多人一起改同一份程式，用 Git 時比較好的做法是？",a:["各自開分支修改，測試沒問題再合併回主線","大家都直接改主線，誰先改完就誰先上傳，有衝突的時候再說","每個人各自複製一份資料夾來改","用通訊軟體把檔案傳來傳去"],why:"分支讓每個人的修改互不干擾，合併前還可以先讓別人看過。主線就能一直保持在可以用的狀態。"},
 {q:"指令或腳本執行完的「結束代碼」（exit code）是 0，代表什麼？",a:["執行成功","執行失敗","沒有任何輸出","被使用者中斷"],why:"慣例上 0 是成功，其他數字代表各種錯誤。排程和自動化工具就是靠它判斷上一步有沒有成功。"}
],[
 {q:"一支自動化腳本「跑一次和跑很多次，結果都一樣」，這個特性叫冪等。為什麼它很重要？",a:["腳本中途失敗時可以放心重跑，不會重複建立或出錯","腳本的執行速度會變快","這樣腳本就不需要寫任何錯誤處理，因為它保證永遠不會失敗","可以讓腳本佔用比較少的硬碟空間"],why:"排程重複觸發、執行到一半斷線都很常見。能安全重跑的腳本，出事時只要「再跑一次」就好。"},
 {q:"這段程式把使用者輸入的主機名稱直接組進指令。有什麼問題？",code:"os.system(\"ping -c 1 \" + host)",a:["使用者可以在輸入裡夾帶其他指令，讓系統執行","ping 指令的參數寫錯了","沒有問題，這是很常見的寫法","這樣寫只能在 Windows 上執行，換到 Linux 就會出現錯誤"],why:"輸入 <code>8.8.8.8; rm -rf /</code> 就會多執行一個指令。外部輸入一律要驗證，並改用不經過 shell 的呼叫方式。"},
 {q:"你不小心把 API 金鑰 commit 並 push 到 Git 了。第一件事該做什麼？",a:["馬上把那把金鑰作廢，換一把新的","再 commit 一次把那一行刪掉就好","把儲存庫改成私人的，這樣外面的人就再也看不到那把金鑰了","等看看有沒有人發現"],why:"推上去的那一刻就要當作已經外洩。刪掉那行沒有用，歷史紀錄裡還在，而且可能早就被掃走了。"},
 {q:"CI/CD 的目的是什麼？",a:["程式一有變更就自動建置、測試、部署，減少人工出錯","讓程式碼自動加密，沒有經過授權的人就沒有辦法閱讀內容","取代版本控制","讓工程師不需要寫測試"],why:"手動部署的步驟多，容易漏。自動化之後每次都照同一套流程走，出問題也能很快知道是哪次變更。"},
 {q:"專案用了很多第三方套件。為什麼要把每個套件的版本固定下來（lock 檔）？",a:["確保每個人、每個環境裝到的都是同一個版本","固定版本之後套件就不會有任何安全漏洞","這樣安裝的速度比較快","因為沒有固定版本的套件依照授權條款是不可以用在公司專案裡的"],why:"沒鎖版本，今天裝和下個月裝的可能不同，「昨天還好好的」就是這樣來的。固定之後，升級是有意識的決定。"},
 {q:"程式要呼叫外部的 API。為什麼一定要設定逾時（timeout）？",a:["對方沒回應時，程式才不會一直卡在那裡等","設了逾時對方的回應會比較快","這樣可以省下網路流量的費用，因為超過時間的部分不會計費","逾時是 API 金鑰的有效期限"],why:"很多函式庫預設會無限等下去。對方一卡，你的程式跟著卡，連帶拖垮整個服務。"},
 {q:"程式碼審查（Code Review）最主要的價值是什麼？",a:["上線前多一雙眼睛找問題，也讓團隊知道彼此改了什麼","讓主管有機會挑出每個人寫程式的毛病，並且當作年度考核扣分的依據","證明寫程式的人很厲害","拖慢上線的速度，避免變更太頻繁"],why:"自己很難看出自己的盲點。審查同時也是知識分享，不會變成只有一個人懂那段程式。"},
 {q:"「在我的電腦上明明可以跑」，但放到伺服器就出錯。要從根本避免這種事，最有效的方向是？",a:["讓開發、測試、正式環境盡量一致，例如用容器","規定所有人都要用同一個品牌的筆電","直接把開發人員的那台電腦搬進機房，接上網路當作正式的伺服器","出錯的時候多重試幾次"],why:"環境不一樣（版本、設定、套件）是這類問題的根源。容器把執行環境一起打包，到哪裡跑都一樣。"}
],[
 {q:"「技術債」指的是什麼？",a:["為了趕時間選了省事的做法，之後要花更多力氣維護或修改","公司買軟體還沒付清的款項","程式設計師積欠公司的加班時數，需要在專案結束之後補回來","使用太新的技術造成的風險"],why:"技術債像借錢：現在快一點，之後每次改都要付利息。可以借，但要知道自己借了、有計畫地還。"},
 {q:"「金絲雀釋出」（Canary Release）是怎麼做的？",a:["新版本先只給一小部分使用者，確認沒問題再逐步擴大","新舊版本同時全面上線，讓使用者自己選","先在開發人員自己的電腦上執行一個星期，沒有問題再一次全面開放","只在半夜釋出新版本"],why:"先讓 5% 的流量走新版，觀察錯誤率和效能。有問題只影響少數人，而且可以馬上切回去。"},
 {q:"「功能開關」（Feature Flag）的好處是什麼？",a:["程式可以先上線，功能用設定決定開或關，出問題不必重新部署就能關掉","可以讓程式的檔案變小","使用者可以自己決定要不要付費","讓程式碼不需要經過測試就可以直接上線，因為有問題的話反正隨時都可以關掉"],why:"把「部署程式」和「開放功能」分開。新功能出事時，關掉開關只要幾秒，不用緊急退版。"},
 {q:"系統「可觀測性」常說的三種資料是？",a:["紀錄（Log）、指標（Metric）、追蹤（Trace）","帳號、密碼、權限","開發環境、測試環境、正式環境這三套彼此完全獨立的系統","CPU、記憶體、硬碟"],why:"指標告訴你「有問題」，追蹤告訴你「卡在哪一段」，紀錄告訴你「當時發生什麼」。三個一起才看得清楚。"},
 {q:"某個常用的開源套件爆出重大漏洞。要快速回答「我們有沒有受影響」，前提是什麼？",a:["平常就有清單記錄每個系統用了哪些套件和版本","請每個開發人員回想自己用過哪些套件","等廠商主動通知","把所有系統全部重新安裝一次，這樣就可以確定用到的套件都是最新的版本"],why:"這份清單叫 SBOM（軟體物料清單）。沒有它，漏洞一公布就只能一個一個系統去翻，慢好幾天。"},
 {q:"「基礎設施即程式碼」（IaC）指的是什麼？",a:["用程式碼描述伺服器、網路這些環境，由工具自動建立","把程式碼印出來放在機房","所有的基礎設施都由程式設計師負責採購和上架，不再需要系統和網路人員","用程式語言寫作業系統"],why:"環境寫成檔案後可以進版本控制、審查、重複建立。重建一套一模一樣的環境，從幾天變成幾分鐘。"},
 {q:"很多系統都需要資料庫密碼和 API 金鑰。比起寫在各自的設定檔裡，更好的做法是？",a:["集中放在密鑰管理系統，程式執行時才去取","統一寫在一個共用的文字檔","把所有系統的密碼都設成同一組，這樣要更換的時候只需要記得改一個地方","寫在程式碼裡並加上註解"],why:"集中管理才能控管誰能取、留下紀錄、定期自動更換。散在各處的設定檔，換一次密碼要改幾十個地方。"},
 {q:"要修改一支已經有很多系統在呼叫的 API。最該避免的是什麼？",a:["直接改掉原本的欄位或行為，讓既有的呼叫端壞掉","新增一個版本","先通知使用這支 API 的單位","在文件上寫清楚新版和舊版之間的差異，並且提供一段時間讓呼叫端轉換"],why:"API 是對別人的承諾。要改就出新版本、舊版保留一段時間並公告，不能讓別人的系統莫名其妙壞掉。"}
]]},
{id:'svc',lv:[[
 {q:'使用者打來只說「電腦怪怪的」。你應該先問什麼？',a:['什麼時候開始、做什麼動作時出現、畫面上寫什麼','你的電腦是哪一年買的、當初是跟哪一家廠商買的','你有沒有亂裝東西','先不問，直接遠端進去看'],why:'先把「怪」變成具體的現象：時間、動作、訊息。這三樣問到，方向通常就出來了。'},
 {q:'問題一時解決不了，還要再查。這時候該跟使用者說什麼？',a:['現在查到哪、接下來要做什麼、大概什麼時候會回覆','跟他說這個問題很複雜，請他耐心等，有結果一定會通知','先不講，等修好再一次說明','請他自己先上網查查看'],why:'使用者最怕的是「不知道現在怎樣」。講清楚現況、下一步、回覆時間，他才有辦法安排自己的工作。'},
 {q:'下班前手上有一件沒處理完的案子要交接。交接內容最重要的是？',a:['已經做了什麼、目前狀態、還沒做的、要找誰','只要寫案件編號，接手的人自己去翻紀錄就看得懂了','口頭講一下就好','把使用者的電話留給下一班'],why:'交接是讓下一個人不用從頭來。做過的、現況、待辦、聯絡人，四樣缺一樣就會重工或漏接。'},
 {q:'要跟不懂技術的主管報告一件系統異常。怎麼講最好？',a:['先講影響到誰、現在怎麼處理、需要他決定什麼','從技術原因開始完整說明，把每個細節都交代清楚，這樣才顯得專業','盡量多用專有名詞','等他問了再回答'],why:'主管要的是「影響」和「需要我做什麼」。技術細節他有興趣再補。'},
 {q:'使用者很生氣，一接起來就開始罵。比較好的第一步是？',a:['先聽完，再把他的問題重述一次確認','馬上打斷他，跟他解釋這不是資訊部門的問題','請他冷靜一點再打來','直接把電話轉給主管處理，這種情況不是第一線該面對的'],why:'人在氣頭上聽不進解釋。先讓他講完、確認你有聽懂，後面才談得下去。'},
 {q:'你處理完了，覺得應該修好了。結案之前還要做什麼？',a:['請使用者實際操作一次，確認真的可以用','直接結案就好，如果還有問題使用者自己會再打電話進來報修','拍照留存當作證明','重開機三次確保穩定'],why:'你覺得好了不算，使用者能做完他要做的事才算。當場確認，省掉第二次報修。'},
 {q:'使用者問了一個你不確定答案的問題。該怎麼回？',a:['「這個我確認一下再回覆你」，然後真的回覆','憑印象先給一個聽起來合理的答案，免得讓對方覺得你不專業','跟他說這不歸你管','請他去問別人'],why:'不確定就說不確定。猜錯的代價比晚一點回答大很多，尤其對方會照你說的去做。'},
 {q:'你發現一個可能影響很多人的異常，但還沒查出原因。什麼時候該通報主管？',a:['現在就先通報，邊查邊更新','等查出原因之後再報，資訊不完整的時候報上去只會被問倒','等修好再一起報告','等有使用者來抱怨的時候再通報，這樣才能確認真的有影響'],why:'影響範圍大的事，通報要比查原因早。主管需要時間調人、對外說明，不能最後一個知道。'}
],[
 {q:"週末要停機維護一個大家都在用的系統。事前公告至少要寫清楚什麼？",a:["停機的時間、影響範圍、有問題找誰","這次維護會用到的技術細節和詳細的操作步驟，讓大家知道我們在做什麼","負責維護的工程師名單","系統的版本編號"],why:"使用者只關心：什麼時候不能用、影響到我什麼、出事找誰。其他的他們不需要。"},
 {q:"一位主管打來，要你直接把某位同事的信箱開給他看。該怎麼處理？",a:["請他走正式的申請流程，核准後再處理","他是主管，照做就對了","偷偷開給他看，但是提醒他不要跟別人說是資訊單位幫忙開的","直接拒絕，然後掛電話"],why:"你有技術上的權限，不代表可以決定誰能看誰的資料。有申請和核准的紀錄，是保護當事人，也保護你自己。"},
 {q:"要寫一封給全體同仁的通知信。最重要的內容應該放在哪？",a:["主旨和第一段","最後一段","信的中間，前面要先把事情的背景和來龍去脈完整交代清楚，大家才看得懂","附件裡"],why:"大部分的人只看主旨和前兩行。要他們做什麼、期限是哪天，一開頭就講。"},
 {q:"同一個問題，這個月已經有第三個人來問了。比較好的做法是？",a:["寫成說明文件或常見問題，放在大家找得到的地方","每一次都很有耐心地從頭再講解一遍，這是資訊人員應該提供的服務","跟主管反應使用者素質太差","請他們去問上一個問過的人"],why:"一直被問同一件事，代表缺一份說明。寫一次，之後貼連結就好，新同事也用得到。"},
 {q:"你回報問題給廠商，廠商回：「我們這邊測試都正常」。接下來最有效的做法是？",a:["提供具體的證據：發生時間、錯誤訊息、你做過的測試","把同樣的內容再寄一次，並且把雙方的主管都加進收件人，讓對方有壓力","算了，自己想辦法","打電話去罵"],why:"「不能用」對方沒辦法查。給時間點、畫面、log，對方才能對到自己的紀錄，也比較難再推回來。"},
 {q:"同時進來三件事：一個人的印表機印不出來、一個部門的系統全部不能用、一個人想換新滑鼠。先處理哪一件？",a:["整個部門不能用的那件","最早進來的那件","聲音最大、催得最兇的那個人，先把他處理掉後面才能安心做事","最簡單的那件"],why:"排順序看的是影響範圍和急迫性：很多人的工作停擺，優先於單一個人的不方便。"},
 {q:"你不小心刪掉了使用者的一個資料夾。第一件事該做什麼？",a:["馬上讓主管和使用者知道，同時開始想辦法救","先自己偷偷試著救，救得回來就當作沒發生過，救不回來再說","跟使用者說是系統自己出問題","等使用者自己發現"],why:"越早講，能救的機會越大（備份還在、資料還沒被覆蓋）。隱瞞之後被發現，失去的是信任。"},
 {q:"你答應使用者今天下班前回覆，但到了下午發現來不及。該怎麼做？",a:["在期限之前主動告訴他現在的進度，和新的預計時間","先不講，明天早上處理好了再一起跟他說，反正只差幾個小時而已","等他打來問再說明","隨便先給一個答案交差"],why:"時間到了沒消息，比「還沒好」更讓人不滿。主動更新，對方才能調整自己的安排。"}
],[
 {q:"SLA（服務水準協議）是在約定什麼？",a:["服務要達到的具體標準，例如可用率、多久內回應和修復","資訊人員每天的上下班時間","採購軟體時的價格上限和付款方式，以及保固年限的計算基準","使用者不可以抱怨的事項"],why:"SLA 把「服務好不好」變成可以量的數字。雙方對「多快算快」有共識，才不會各說各話。"},
 {q:"提出變更申請時，為什麼一定要寫「回復計畫」？",a:["變更失敗時，知道怎麼在時限內退回原狀","只是表單的必填欄位，內容寫什麼都沒有關係","讓審核的人覺得你有想很多","回復計畫是給稽核人員看的文件，實際執行變更的時候並不會用到"],why:"沒有回復計畫的變更，失敗了只能硬著頭皮往前修。先想好怎麼退、退要多久、誰決定退。"},
 {q:"重大異常處理中，已經半小時沒有新進展。對外的溝通應該怎麼做？",a:["照固定的頻率更新，沒有進展也說明目前在做什麼","沒有新消息就先不要講，免得被追問","等完全修好再一次說明","跟使用者說快好了，雖然其實還不確定，但這樣可以先安撫大家的情緒"],why:"沒消息會被解讀成沒人在處理。固定更新讓對方能安排自己的事，也不會一直打電話進來問。"},
 {q:"熟識的同事私下傳訊息請你幫忙處理問題，沒有走報修流程。比較好的做法是？",a:["可以幫，但要補上報修紀錄，並請他下次走正式流程","一律拒絕，沒有開單就不處理，不管事情有多緊急都一樣","幫他處理，不用留紀錄","跟他說你很忙，請他找別人"],why:"沒有紀錄的工作，別人不知道、主管看不到、之後出事也查不到。幫忙和留紀錄並不衝突。"},
 {q:"使用者說：「幫我在系統上加一個匯出的按鈕。」比較好的回應是？",a:["先問他匯出來要做什麼，了解真正想解決的問題","照他說的加一個按鈕","跟他說系統不能改","請他寫一份完整的規格書，包含畫面設計和資料庫欄位，寫好再來談"],why:"使用者講的是他想到的解法，不一定是最好的。問到目的，有時現有的功能就能解決，有時需要的根本是另一樣東西。"},
 {q:"系統單位說是網路的問題，網路單位說是系統的問題，使用者夾在中間。你是其中一方，該怎麼做？",a:["主動找對方一起看現象，用測試結果確認是哪一段","堅持不是我方的問題，請使用者自己去找對方","把案子退回去，等對方先證明","請使用者自己判斷是哪邊的問題，再決定要找哪一個單位處理"],why:"讓使用者當傳話筒是最糟的。兩邊坐下來一起測，通常十分鐘就分出來，比互踢三天快。"},
 {q:"主管要求你開一個有資安風險的例外（例如把某台主機直接對外開放）。你應該怎麼回應？",a:["說明風險和替代方案，若仍要執行就請有權責的人正式核准","他是主管，直接照做","直接拒絕，不需要說明原因","先答應下來，但是實際上不去做，等他哪一天自己忘記這件事"],why:"你的責任是把風險講清楚、提出比較安全的做法。要不要承擔風險，是有權責的人來決定並留下紀錄。"},
 {q:"某個系統只有一位同事會維護，他請長假時出了問題沒人會處理。要怎麼預防？",a:["把做法寫成文件，並安排其他人輪流實際操作","規定那位同事不可以請假","請他把手機 24 小時開著，休假的時候也一樣要隨時接電話處理","等真的出事再想辦法"],why:"只有一個人會，是組織的風險，不是那個人的榮耀。文件加上實際輪替操作，知識才真的傳得出去。"}
],[
 {q:"主管只用「每人每月結案數」考核維護人員。最可能出現什麼副作用？",a:["大家挑簡單的案子做、草率結案，難的問題沒人碰","所有人的技術能力都會快速提升","使用者的滿意度一定會跟著上升","完全不會有副作用，因為數字是最客觀的，結案數越多就代表服務做得越好"],why:"量什麼就得到什麼。只看數量，品質就被犧牲。要搭配重複報修率、滿意度這類指標一起看。"},
 {q:"同一種故障每個月都發生好幾次，每次都能很快修好。接下來該做的是？",a:["當成一個「問題」立案，找出根本原因讓它不再發生","維持現狀，反正每次都修得很快","把修復的步驟寫成手冊發給使用者，請他們之後遇到的時候自己處理就好","要求使用者不要再報修"],why:"事件管理是把服務恢復，問題管理是讓它不再發生。一直修同一件事，是在浪費人力，也是在等它哪天出大事。"},
 {q:"資訊單位整理一份「服務目錄」，主要的用途是什麼？",a:["讓使用者知道有哪些服務、怎麼申請、多久會完成","記錄每一位資訊人員的個人資料","列出公司所有電腦設備的財產編號、購買日期以及目前的保管人","取代報修系統"],why:"使用者不知道你提供什麼、該找誰，就只能亂問。服務目錄把範圍和期待講清楚，雙方都省事。"},
 {q:"要向高層爭取預算汰換老舊的核心設備。哪一種說法最有效？",a:["說明故障時會影響哪些業務、停多久、損失多少","詳細解釋新設備的技術規格比舊的好多少","強調別家公司都已經換了","表示如果公司不同意這筆預算的話，資訊單位就沒有辦法再繼續維護下去了"],why:"高層做的是風險和資源的決定。把技術問題翻譯成業務影響和金額，才是他們能判斷的語言。"},
 {q:"帶一位新人學會處理某類問題。比較有效的順序是？",a:["先示範給他看，再陪他做，最後放手讓他做並事後檢視","直接丟給他一個案子，做錯了再糾正","給他一疊文件，請他先自己讀一個月，全部讀完之後才可以開始接觸實際的工作","讓他一直在旁邊看，不要動手"],why:"只看不做學不會，只做沒人看會養成錯的習慣。逐步放手，並在每個階段給回饋。"},
 {q:"一項系統更換會影響好幾個部門的作業方式。溝通應該從什麼時候開始？",a:["規劃階段就找受影響的部門一起談時程和做法","上線前一天發公告","上線之後看有誰來反應再個別說明","等全部都做完、確定不會再有任何變動的時候，再一次向所有部門完整說明"],why:"越晚講，對方越沒有調整的空間，反彈也越大。早一點參與，他們提的問題常常是你沒想到的。"},
 {q:"兩個部門的需求撞期，雙方都堅持自己最急，你的人力只夠做一件。該怎麼處理？",a:["依既定的優先規則判斷，定不了就請雙方共同的主管裁決","先做跟你交情比較好的那個部門","兩件都接下來，然後兩件都延遲","自己憑感覺決定先做哪一邊，另外一個部門如果來問，就說技術上有困難沒辦法做"],why:"資源衝突是管理決策，不該由執行的人私下決定。有規則照規則，沒有就往上升級，並留下紀錄。"},
 {q:"團隊裡只有一個人長期負責夜間和假日的緊急處理。這個安排最大的問題是？",a:["人會過勞，而且他一不在就沒有人能接","沒有問題，同一個人處理最熟悉狀況","加班費的計算會比較複雜","其他同事會因為沒有機會在半夜接到電話，而覺得自己在團隊裡不受到重視"],why:"值班要輪替、要有交接和文件。把壓力集中在一個人身上，遲早會出錯或走人，兩種都是組織的損失。"}
]]},
{id:'sys',lv:[[
 {q:"AD 裡的 OU 和群組，用途上最主要的差別是？",a:["OU 用來套用群組原則和委派管理，群組用來授予權限","兩個完全一樣，只是名稱不同","OU 用來授予資料夾權限，群組用來套用原則","OU 只能放電腦，群組只能放使用者，兩者不能混用也不能互相包含"],why:"要對一批物件套原則，放進 OU；要讓一批人能存取某個資源，加進群組。"},
 {q:"虛擬化平台的「線上移轉」（Live Migration／vMotion）是用來做什麼的？",a:["不停機把虛擬機搬到另一台實體主機","把虛擬機轉成實體機","幫虛擬機做備份","在虛擬機關機的狀態下，把它的磁碟檔案複製一份到另外一個儲存位置"],why:"實體主機要維護或負載不均時，可以把上面的虛擬機線上搬走，使用者不會感覺到中斷。"},
 {q:"在雲端租一台虛擬機，自己安裝作業系統和軟體。這屬於哪一種服務模式？",a:["IaaS","PaaS","SaaS","On-premises"],why:"IaaS 給你運算、儲存、網路，上面的系統自己管。PaaS 連執行環境都幫你顧，SaaS 是直接用現成的軟體。"},
 {q:"雲端的「共同責任模型」裡，下列哪一項通常是客戶自己的責任？",a:["資料的保護和存取權限的設定","機房的門禁和電力","實體伺服器的硬體維修","以上全部都是雲端業者的責任，客戶把系統搬上雲端之後就不需要再負責任何事情"],why:"業者負責雲「本身」的安全，客戶負責自己放在雲「上面」的東西。儲存桶設成公開而外洩，是客戶的責任。"},
 {q:"「增量備份」備的是什麼？",a:["上一次備份（不管哪一種）之後有變動的資料","每次都備份全部的資料","上一次完整備份之後所有變動的資料","只備份作業系統的檔案，使用者的資料不在備份的範圍之內"],why:"增量只備上次以來的變動，最省空間，但還原時要完整備份加上每一份增量。「上次完整備份以來的變動」是差異備份。"},
 {q:"Linux 使用 LVM 管理磁碟，最主要的好處是？",a:["可以彈性調整空間大小，不用重新分割","讀寫速度會變成兩倍","資料會自動加密","可以取代備份，因為 LVM 會自動把每個檔案都另外保存一份在不同的磁碟上面"],why:"LVM 在實體磁碟上多一層抽象，空間不夠時加一顆磁碟進來就能線上擴充。"},
 {q:"AD 環境中，用戶端電腦是靠什麼找到網域控制站的？",a:["DNS","DHCP","NTP","用戶端會對整個網路廣播，逐一詢問每一台電腦是不是網域控制站"],why:"AD 高度依賴 DNS 的 SRV 紀錄。用戶端的 DNS 指到外面的伺服器，是「無法登入網域」最常見的原因之一。"},
 {q:"公司網站某天早上突然全部跳出憑證錯誤的警告，前一天還好好的。最可能的原因是？",a:["TLS 憑證到期了","網站被改成 HTTP","使用者的瀏覽器同時壞了","網站伺服器的硬碟空間已經用完，沒有辦法再存放新的連線紀錄"],why:"憑證有期限，到期當天所有人同時出錯。應該把到期日放進監控，至少提前一個月提醒。"}
],[
 {q:"在總公司新增的 AD 帳號，分公司要過一陣子才能登入。最可能的原因是？",a:["不同站台的網域控制站之間，複寫有時間間隔","分公司的電腦太舊","帳號的密碼設得太長","分公司的使用者沒有先重新開機，所以電腦還不知道有這個新的帳號存在"],why:"同一站台內複寫很快，站台之間是照排程複寫。急的話可以手動觸發，或直接在分公司的 DC 上建立。"},
 {q:"為了防勒索軟體，備份策略裡加一份「不可變」（Immutable）備份。它的特性是？",a:["在設定的保存期限內，任何人都無法修改或刪除","備份速度特別快","不需要儲存空間","只有系統管理員可以刪除，一般的使用者帳號沒有辦法刪除或修改"],why:"攻擊者拿到管理員權限後常先刪備份。不可變備份連管理員也刪不掉，才是最後一道保險。"},
 {q:"一台虛擬機的快照已經開了八個月。會有什麼問題？",a:["差異檔越來越大、拖慢效能，合併時風險和時間也變高","沒有問題，快照留越久越安全","虛擬機會自動關機","快照超過半年之後會自動變成完整的備份，可以拿來做異地的還原"],why:"快照之後的所有變更都寫在差異檔裡。放太久，檔案巨大、讀寫變慢，刪除快照時的合併還可能失敗。"},
 {q:"公司這個月的雲端帳單比平常多一倍。最常見的原因是？",a:["有資源開了沒關，或用量暴增卻沒有設預算警示","雲端業者算錯了","匯率變動","因為雲端的價格每個月都會固定自動調漲一倍，這是合約裡的正常現象"],why:"測試用的機器、沒掛載的磁碟、忘了刪的快照都在計費。預算警示和資源標籤是雲端管理的基本功。"},
 {q:"排程工作是用某位工程師的個人帳號執行的。這樣有什麼風險？",a:["他離職或改密碼時，排程就會失敗","沒有風險，這樣最方便","排程會跑得比較慢","排程執行的結果只有他本人看得到，其他同事完全沒有辦法查看"],why:"服務和排程要用專用的服務帳號，權限給最小，密碼納入管理。這樣人員異動不會影響系統。"},
 {q:"磁碟使用率現在 70%，過去半年每個月增加 5%。這個資訊應該怎麼用？",a:["推估大約六個月後會滿，提前規劃擴充或清理","還有 30%，不用管","等到 95% 告警響了再處理","把監控的告警門檻從 90% 調高到 99%，這樣就不會那麼快收到告警通知"],why:"容量規劃看的是趨勢，不是當下的數字。採購和擴充都需要時間，等告警響通常來不及。"},
 {q:"高可用（HA）、備份、災難復原（DR），哪一個是為了「整個機房都不能用」的狀況？",a:["災難復原","高可用","備份","三個都是，而且只要有做其中任何一個，另外兩個就可以省略不用做"],why:"HA 處理單一設備故障，備份處理資料毀損或誤刪，DR 處理整個據點失效。三個解決的問題不同，不能互相取代。"},
 {q:"伺服器要安裝安全性更新。和一般使用者的電腦相比，要多考慮什麼？",a:["要排維護時段、通知使用單位，並準備好失敗時怎麼退回","伺服器不需要安裝更新","可以隨時直接重開機","伺服器的更新一律要等到上市滿五年、確定完全沒有問題之後才可以安裝"],why:"伺服器重開會中斷服務，更新失敗影響的是所有使用者。但也不能因此不裝，漏洞一樣會被打。"}
],[
 {q:"負責把地端 AD 帳號同步到雲端的那台伺服器，安全等級應該怎麼看待？",a:["當成和網域控制站同一級來保護","當成一般的檔案伺服器","當成使用者的個人電腦","它只負責傳資料，本身沒有任何權限，所以不需要特別保護"],why:"同步用的帳號通常能讀取整個網域的密碼雜湊。這台被拿下，等於雲端和地端一起失守。"},
 {q:"資料庫每天凌晨備份一次，沒有其他機制。下午四點硬碟毀損，最多會遺失多久的資料？",a:["大約十六個小時","完全不會遺失","一個星期","只會遺失最後一分鐘的資料，因為作業系統會自動保留其餘的部分"],why:"備份頻率直接決定 RPO。業務不能接受丟十幾個小時的資料，就要加上交易紀錄備份或複寫。"},
 {q:"只有兩個節點的高可用叢集，為什麼還需要第三方的「見證」（仲裁）？",a:["兩邊斷線時，用來決定哪一邊可以繼續服務","用來分擔運算的負載","用來存放備份","沒有實際作用，只是廠商為了多賣一套授權所設計出來的東西"],why:"沒有第三票，兩個節點互相看不到時都會以為自己該當主要節點，就會發生腦裂。"},
 {q:"伺服器不再登入上去手動修改，要改就改映像檔、重新部署一台換掉舊的。這種做法的好處是？",a:["每台都一致、可重現，不會有人偷改而沒人知道","可以省下作業系統的授權費","伺服器的效能會變好","這樣就完全不需要再做備份，因為伺服器永遠都可以重新建立"],why:"這叫不可變基礎設施。手動改久了，每台都變成獨一無二、沒人敢動的「雪花」。"},
 {q:"公司自建內部憑證中心（CA）。根憑證的私鑰應該怎麼保管？",a:["離線保存，平常由下層的 CA 簽發憑證","放在網站伺服器上方便使用","寄給每位管理員各留一份","放在共用資料夾並設定密碼，這樣需要簽發憑證的人可以隨時取用"],why:"根私鑰外洩，整個信任體系就毀了，所有憑證都要重發。所以根 CA 離線，日常用中繼 CA。"},
 {q:"雲端帳號裡權限最高的那個根帳號（全域管理員），平常應該怎麼用？",a:["不拿來做日常操作，開啟多因素驗證並嚴格保管","大家共用，比較方便","拿來跑自動化排程","每天都用它登入，這樣才能確定這個帳號沒有被別人盜用"],why:"日常工作用權限剛好夠的帳號。最高權限帳號只在緊急或極少數操作時使用，而且每次使用都要有紀錄。"},
 {q:"更新前先對虛擬機做快照，更新確認沒問題之後，這個快照該怎麼處理？",a:["確認正常後就刪除","永久保留","再多做幾個","把它轉成正式的備份，之後就不需要再另外排程備份這一台"],why:"快照是短期的後悔藥，用完就刪。留著會持續長大、拖慢效能，而且它不是備份。"},
 {q:"分散在不同地區的伺服器，紀錄的時間最好怎麼處理？",a:["全部校時，並統一用同一個時區（通常是 UTC）記錄","各自用當地時間就好","不需要記錄時間","每台伺服器都故意差幾分鐘，這樣攻擊者比較不容易看懂紀錄的順序"],why:"跨時區排查事件時，換算時間最容易出錯。統一時區加上校時，時間軸才拼得起來。"}
],[
 {q:"「即時權限」（Just-in-Time）的管理方式是什麼？",a:["平常沒有管理權限，需要時申請、核准後限時開通","每個人永久擁有最高權限","權限每十年檢查一次","只要是資訊部門的同仁，一到職就自動取得所有系統的管理權限"],why:"常駐的高權限帳號是攻擊者最想要的。改成臨時開通，帳號被盜時能做的事和時間都很有限。"},
 {q:"整個 AD 被攻擊者完全掌控過，而且無法確認每一個後門都清乾淨了。比較穩當的復原方向是？",a:["在乾淨的環境重建信任基礎，再分階段把資源遷過去","把所有人的密碼改一次就好","把網域控制站重開機","維持現狀繼續觀察半年，如果沒有再出現異常就代表已經安全了"],why:"無法證明乾淨，就只能當作不乾淨。重建代價很高，但殘留一個後門，等於整個清除白做。"},
 {q:"災難復原演練發現，實際恢復要 12 小時，但承諾的 RTO 是 4 小時。應該怎麼處理？",a:["如實報告，由管理階層決定要投資改善還是調整承諾","把演練紀錄改成 4 小時","以後不要再演練","請同仁在下一次演練的時候動作快一點，其他的不需要調整"],why:"演練的價值就是找出落差。要嘛投資縮短時間，要嘛讓業務單位知道真實數字並調整期待。"},
 {q:"機房全毀後要從備份重建。下列哪一類系統應該最先恢復？",a:["其他系統都依賴的基礎服務，例如身分驗證和 DNS","使用人數最少的系統","最新上線的系統","介面最漂亮、最常被高層主管稱讚的那一套系統"],why:"還原順序要照相依關係排。驗證和名稱解析沒起來，後面的應用就算還原了也沒人能登入。"},
 {q:"一支自動化腳本寫錯了，同時套用到 500 台伺服器，全部出問題。流程上應該怎麼預防？",a:["先套用少數幾台確認，再分批擴大","不要使用自動化","一次全部套用才有效率","把腳本交給最資深的同仁執行，資深的人寫的腳本就不需要測試"],why:"自動化放大效率，也放大錯誤。分批和金絲雀的觀念，在基礎設施變更上一樣適用。"},
 {q:"「錯誤預算」（Error Budget）的概念是什麼？",a:["依服務目標算出可容許的失敗量，用完就暫停變更、優先顧穩定","每年可以犯錯的人數","修 bug 的預算金額","只要預算還沒有用完，就代表系統完全沒有任何問題需要處理"],why:"目標 99.9% 就代表有 0.1% 可以用。它讓「要多快推新功能」和「要多穩」有共同的數字可以談。"},
 {q:"雲端主機有「隨需」和「預留」兩種計費。怎麼搭配比較合理？",a:["長期穩定的基本用量用預留，尖峰和臨時的用隨需","全部用隨需","全部用預留三年","每個月的月初用預留，到了月底再全部改成隨需的方式"],why:"預留便宜但要綁約，隨需彈性但貴。先看過去的用量曲線，把一定會用到的那一段鎖起來。"},
 {q:"虛擬化平台要升級版本，叢集裡有八台主機。比較穩當的做法是？",a:["一次升一台，把虛擬機移走、升級、驗證後再換下一台","八台同時升級比較快","全部關機再一起升","先升級其中七台，剩下的那一台永遠保持在舊版以防萬一"],why:"滾動升級期間服務不中斷，遇到問題也只影響一台。前提是叢集的餘裕夠讓一台離線。"}
]]},
{id:'neteng',lv:[[
 {q:"OSPF 是什麼？",a:["一種內部使用的動態路由協定","一種無線網路的加密方式","一種網路線的規格","防火牆廠商推出的一套專門用來過濾惡意網站的黑名單訂閱服務"],why:"OSPF 讓路由器自動交換路由資訊、計算最佳路徑，線路斷掉時會自動改走別條。"},
 {q:"靜態路由和動態路由相比，最主要的缺點是？",a:["線路中斷時不會自動改道，要人去改","比較耗費路由器的 CPU","安全性比較差","只能用在 IPv6 的網路環境，傳統的 IPv4 網路沒有辦法設定靜態路由"],why:"靜態路由簡單、好預測，但不會隨網路變化調整。規模一大或需要備援時就要用動態路由。"},
 {q:"ACL（存取控制清單）的規則是怎麼比對的？",a:["由上往下，符合第一條就執行並停止","全部比對完，取最嚴格的那一條","由下往上比對","隨機挑一條規則開始比對，所以每一次的結果都有可能會不一樣"],why:"順序決定結果，範圍大的規則放前面會把後面的蓋掉。而且清單最後通常有一條看不見的「全部拒絕」。"},
 {q:"STP（擴張樹協定）會選出一台根橋接器（Root Bridge）。它是依什麼選的？",a:["Bridge ID 最小的（先比優先權，再比 MAC）","開機時間最早的那一台","連接埠數量最多的那一台","價格最貴、效能最好的那一台交換器會自動被選出來"],why:"沒設定優先權的話，可能是 MAC 最小的那台舊交換器當選。核心交換器應該手動把優先權調低。"},
 {q:"HSRP 或 VRRP 的用途是什麼？",a:["讓兩台設備共用一個閘道 IP，一台故障另一台接手","加快無線網路的漫遊速度","把多條網路線綁成一條","自動幫用戶端的電腦分配 IP 位址以及 DNS 伺服器的設定"],why:"用戶端的預設閘道指向虛擬 IP，背後由兩台設備輪值。主要的那台掛了，使用者不用改任何設定。"},
 {q:"企業無線網路用 WPA2／WPA3-Enterprise，和大家共用一組密碼（PSK）相比，最大的好處是？",a:["每個人用自己的帳號驗證，可以個別停用和追查","訊號涵蓋的範圍比較大","不需要無線基地台","連線的速度會比較快，因為不需要花時間輸入那一組很長的共用密碼"],why:"共用密碼只要一個人外流或離職就得全部換掉。個別帳號驗證（802.1X）才知道是誰連的。"},
 {q:"Site-to-Site VPN 和 Remote Access VPN 的差別是？",a:["前者連接兩個據點的網路，後者讓個人裝置連回公司","前者比較便宜，後者比較貴","前者不加密，後者有加密","前者只能在同一棟大樓裡面使用，後者則只能在國外的時候才可以使用"],why:"分公司和總公司之間的固定通道是 Site-to-Site；同仁在家用筆電連回公司是 Remote Access。"},
 {q:"網路設備的紀錄，為什麼要用 Syslog 送到集中的伺服器？",a:["設備本身存得少、重開就不見，集中才能保存和交叉比對","這樣設備的轉送效能會提升","因為 Syslog 會自動修復設備上的設定錯誤","集中之後就不需要再對每一台設備做設定檔的備份，因為紀錄裡面都有"],why:"交換器的緩衝區很小，出事時紀錄常常已經被蓋掉。集中保存後，還能把多台設備的時間軸放在一起看。"}
],[
 {q:"路由表裡的 <code>0.0.0.0/0</code> 代表什麼？",a:["預設路由，找不到更明確的路徑時就走它","這條路由已經失效","只給網路管理用的路徑","代表這台路由器目前沒有設定任何的 IP 位址，需要重新設定"],why:"所有目的地都符合 0.0.0.0/0，但它的前綴最短，所以只有在沒有其他更明確的路由時才會用到。"},
 {q:"路由表同時有 <code>10.1.0.0/16</code> 和 <code>10.1.1.0/24</code> 兩條。要送往 10.1.1.50 的封包會走哪一條？",a:["/24 那一條","/16 那一條","兩條輪流走","先設定的那一條，路由器會依照每一條路由被加入的先後順序來決定"],why:"路由器選的是「最長前綴匹配」，也就是範圍最精確的那條。"},
 {q:"交換器的 Port Security 功能可以做到什麼？",a:["限制一個連接埠只能讓指定或一定數量的 MAC 位址使用","加快連接埠的速度","自動備份交換器的設定","把連接埠上面所有經過的流量都加密起來，防止被旁邊的人側錄"],why:"可以防止有人拔掉電腦改接自己的設備，或私接小型交換器。違規時可以設定關閉該埠或只發告警。"},
 {q:"新增了一個 VLAN，同一台交換器上的電腦互通正常，但到另一台交換器的同 VLAN 電腦就不通。最該檢查什麼？",a:["兩台交換器之間的 trunk 有沒有放行這個 VLAN","電腦的螢幕解析度","DNS 伺服器","兩台交換器的韌體版本是不是完全一樣，不一樣的話就沒有辦法互通"],why:"很多環境的 trunk 只允許清單上的 VLAN 通過。新增 VLAN 時，沿途每一段 trunk 都要加。"},
 {q:"使用者拿著筆電從辦公室走到會議室，明明旁邊就有基地台，筆電卻一直連著原本很遠的那一台、訊號很差。可能的原因是？",a:["基地台的發射功率設太大，裝置不願意換","筆電的硬碟快滿了","會議室的網路線太短","無線網路本來就不支援移動，每換一個地方都需要手動重新連線一次"],why:"這叫「黏著」。功率太大讓遠處的訊號看起來還可以，裝置就不漫遊。功率和最低連線速率要一起調。"},
 {q:"兩個據點之間的 IPsec VPN 通道一直建不起來。最常見的原因是？",a:["兩端的加密參數、金鑰或對端網段設定不一致","兩邊的網路線顏色不同","VPN 只能在晚上建立","兩個據點所在的縣市不同，所以依規定沒有辦法直接建立通道"],why:"IPsec 要求兩端的加密演算法、驗證方式、金鑰、保護的網段完全對得上。差一個就談不成。"},
 {q:"網路上設定 QoS，主要是為了什麼？",a:["頻寬不夠時，讓語音、視訊這類即時流量優先通過","讓所有流量都變快","阻擋病毒","讓每一位使用者不論在做什麼，都能平均分配到完全相同的頻寬"],why:"QoS 不會生出頻寬，它是在壅塞時決定誰先走。語音延遲一點就聽得出來，檔案下載慢幾秒沒差。"},
 {q:"為什麼網路設備的連接埠、線路都要標示，並維護一份拓樸圖？",a:["出問題時才能很快知道哪條線接到哪裡、影響到誰","只是為了看起來整齊","稽核規定要有圖","因為標示之後訊號比較不會衰減，網路的速度也會明顯變得比較快"],why:"半夜出事時，沒有標籤和圖，光是找線就要花掉大半時間，還可能拔錯。"}
],[
 {q:"BGP 主要用在什麼情境？",a:["不同網路營運者（自治系統）之間交換路由，例如同時接兩家 ISP","同一台交換器上的 VLAN 之間","無線基地台之間的漫遊","只用在家用的分享器上，企業的網路環境並不會使用到"],why:"網際網路就是靠 BGP 串起來的。企業有自己的 IP 區段、要接多家業者做備援時就會用到。"},
 {q:"OSPF 把網路切成多個區域（Area），主要目的是？",a:["縮小路由計算的範圍，一個區域變動不會讓全網重算","讓不同區域使用不同的密碼","增加網路的頻寬","讓每個區域可以各自使用不同廠牌的設備，否則不同廠牌無法互通"],why:"網路一大，每次變動全部重算會很耗資源。分區之後，區域內的細節不外傳，只交換彙整後的路由。"},
 {q:"資料中心常見的 Spine-Leaf 架構，相對於傳統三層式架構的優點是？",a:["任兩台伺服器之間的路徑長度固定，容易橫向擴充","需要的線路比較少","不需要設定路由","只需要一台交換器就可以完成，所以建置的成本是最低的"],why:"每台 Leaf 都接到每台 Spine，伺服器之間最多經過固定的跳數。流量不夠就加 Spine，埠不夠就加 Leaf。"},
 {q:"網路存取控制（NAC）除了驗證身分，還常用來做什麼？",a:["檢查設備是否合規，不合規的放到隔離網段","加快上網的速度","備份使用者的檔案","自動幫每一台連上網路的設備安裝公司指定的所有應用程式"],why:"沒裝防毒、沒更新的電腦先隔離，修好再放行。這樣一台有問題的設備就不會直接接上內網。"},
 {q:"IP 封包標頭裡的 TTL 欄位，主要是為了解決什麼問題？",a:["路由迴圈時，讓封包不會無限繞下去","讓封包傳得比較快","加密封包的內容","記錄這個封包的傳送總共花掉了多少電費，方便之後向使用者收費"],why:"每經過一台路由器 TTL 就減一，減到零就丟掉。<code>tracert</code> 也是利用這個機制找出每一站。"},
 {q:"兩台防火牆做主備援（Active-Passive）。要讓切換時使用者的連線不中斷，兩台之間必須同步什麼？",a:["連線狀態表","風扇的轉速","管理者的登入密碼","兩台設備的外殼序號以及出廠的日期"],why:"備援機接手時如果不認得既有的連線，所有人都得重新連。所以除了設定，連線狀態也要即時同步。"},
 {q:"公司只管理 IPv4，但電腦預設都開著 IPv6。這有什麼風險？",a:["有人可以利用沒在管的 IPv6 繞過既有的防護或進行攔截","完全沒有風險","網路會變慢一倍","電腦會因為同時使用兩種協定而經常當機，需要每天重新開機"],why:"防火牆規則、監控如果只看 IPv4，IPv6 就是一條沒人看的路。要嘛納管，要嘛明確關閉。"},
 {q:"SD-WAN 相較於傳統固定專線的做法，主要的特點是？",a:["集中管理，依線路品質和應用類型動態選擇路徑","只能使用一條線路","不需要任何設備","它是一種新的網路線材質，可以讓傳輸的距離變成原本的十倍"],why:"把多條線路（專線、寬頻、行動網路）當成資源池，重要的應用走品質好的，壞掉自動切換。"}
],[
 {q:"有業者錯誤宣告了不屬於自己的 IP 區段，導致流量被導走。網際網路上用什麼機制降低這種風險？",a:["RPKI，驗證路由宣告的來源是否有權宣告該區段","DHCP","NAT","請每一家業者的工程師每天互相打電話確認彼此的路由"],why:"BGP 本身是基於信任的。RPKI 讓 IP 持有者簽署「誰可以宣告我的位址」，其他業者就能據此過濾。"},
 {q:"「微分段」和傳統只在邊界放防火牆相比，差別是什麼？",a:["連內部主機之間的連線也逐一控管，只允許必要的","把防火牆換成更大台的","把內網全部開放","把每一台伺服器都搬到各自獨立的機房，彼此之間完全不連線"],why:"傳統做法進了內網就暢行無阻。微分段讓攻擊者拿下一台之後，橫向移動的每一步都被擋。"},
 {q:"用程式自動派送網路設備的設定。除了效率，最重要的保護機制是什麼？",a:["套用前自動檢查和模擬，並保留可以快速回復的版本","不需要任何保護機制","每次都由不同的人手動再打一次","只在星期五下班前執行，這樣出問題的話有整個週末可以處理"],why:"設定進版本控制、套用前驗證、分批推送、一鍵回復。少了這些，自動化只是讓出錯更快更廣。"},
 {q:"遭到大流量的 DDoS 攻擊，自己的對外線路已經被塞滿。這時最有效的緩解方式是？",a:["請上游業者或流量清洗服務，在流量進來之前就過濾掉","在自己的防火牆上加規則","把伺服器重開機","請公司內部的同仁暫時都不要上網，把頻寬讓給外面的使用者"],why:"線路都滿了，在自己這端擋已經太晚。要在更上游、頻寬更大的地方處理，所以要事先簽好服務。"},
 {q:"邊界防火牆只看得到進出的流量。要發現內部主機之間的異常，還需要什麼？",a:["內部東西向流量的可視性，例如流量紀錄或內部感測點","更高的對外頻寬","更長的網路線","每個月請各個部門的主管回報一次，他們有沒有覺得網路怪怪的"],why:"攻擊者進來之後的活動都在內網。看不到東西向流量，就等於只在大門裝監視器。"},
 {q:"為了「絕對不能斷」，網路設計了非常多層的備援和自動切換機制。可能有什麼反效果？",a:["太複雜，故障時行為難以預測，也沒人看得懂","完全沒有反效果","速度會變成兩倍","設備的保固期限會因為備援的層數太多而被原廠縮短"],why:"很多大型故障是備援機制本身造成的。簡單、可理解、有測試過的設計，往往比花俏的更可靠。"},
 {q:"要不要對員工上網的加密流量做解密檢查（TLS Inspection）？決定前必須考慮什麼？",a:["隱私和法律、憑證信任的管理、效能，以及哪些類別要排除","沒有什麼需要考慮的，直接全部解密","只要考慮設備的顏色","只需要考慮這個功能在設備的授權裡面是不是免費提供的"],why:"不解密看不到內容，解密又碰到隱私和技術問題。通常會排除金融、醫療等類別，並事先告知員工。"},
 {q:"規劃對外頻寬時，看「平均使用率」為什麼不夠？",a:["平均值會蓋掉尖峰，尖峰時段才是使用者覺得慢的時候","平均值永遠是零","因為頻寬不需要規劃","因為平均使用率這個數字，依規定只有電信業者才可以計算"],why:"平均 30% 可能代表白天滿載、半夜全空。規劃要看尖峰和高百分位數（例如第 95 百分位）。"}
]]},
{id:'blue',lv:[[
 {q:"SIEM 的主要功能是什麼？",a:["集中收集各種紀錄，關聯分析後產生告警","取代防火牆","自動幫所有電腦安裝更新","把公司所有的檔案都加密起來，只有通過驗證的人才可以解開閱讀"],why:"單看一台設備的紀錄常看不出問題。SIEM 把防火牆、端點、AD 的紀錄放在一起，才能拼出完整的攻擊過程。"},
 {q:"收到一個資安告警。分析的第一步是什麼？",a:["確認是不是真的，以及影響到哪些主機和帳號","馬上把那台電腦重灌","直接結案，告警大多是誤報","先寫一份完整的報告呈給主管，等主管批示之後再開始看告警的內容"],why:"這個步驟叫分流（Triage）。先判斷真假和範圍，才知道要投入多少人力、要不要升級處理。"},
 {q:"判斷一封信是不是釣魚信，下列哪一項最可靠？",a:["寄件者的實際網域，和連結真正指向的網址","信件的文筆通不通順","有沒有公司的標誌","信件裡面有沒有寫出收件人的全名，以及內容看起來是不是很緊急"],why:"顯示名稱、標誌、文筆都可以仿冒。網域和連結的真實目的地，還有 SPF、DKIM 的驗證結果比較難造假。"},
 {q:"把攻擊者用的 IP 加進黑名單，這個防禦的效果為什麼有限？",a:["換一個 IP 對攻擊者來說非常容易","防火牆的黑名單最多只能放十筆","IP 位址沒辦法被封鎖","因為只要封鎖了一個 IP，防火牆的效能就會明顯下降，所以不建議使用"],why:"這是「痛苦金字塔」的概念：雜湊值、IP、網域都很好換。能偵測攻擊者的手法和行為，才會讓他真的痛。"},
 {q:"調查事件時，發現各台設備的紀錄時間對不起來，差了好幾分鐘。平時應該做好什麼？",a:["所有設備都跟同一個 NTP 來源校時","每台設備使用不同的時區","每天手動調整一次時間","把所有設備的紀錄功能都關掉，只保留防火牆一台的紀錄，就不會有對不起來的問題"],why:"時間不準，就排不出事件的先後順序。校時是最基本、也最容易被忽略的調查前提。"},
 {q:"偵測上所說的「漏報」（False Negative）是指什麼？",a:["真的有攻擊，但沒有產生告警","沒有攻擊，卻產生了告警","告警產生得太慢","告警的內容寫得太過簡略，值班的人員看不懂到底發生了什麼事情"],why:"誤報浪費人力，漏報則是完全不知道被打了。兩個要一起看，把誤報壓到零通常代表漏報變多。"},
 {q:"要從一台被入侵的主機蒐集證據。依「揮發性」的順序，應該先取哪一種？",a:["記憶體內容","硬碟上的檔案","備份磁帶","列印出來的紙本文件，以及這台主機的採購和保固相關資料"],why:"越容易消失的越先取：記憶體、網路連線、執行中的程序，再來才是硬碟。關機後記憶體裡的東西就沒了。"},
 {q:"同仁回報收到可疑信件，結果有一位坦承自己已經點了連結。資安單位比較好的態度是？",a:["感謝他回報並立刻協助處理，不要責備","公開檢討他，讓其他人引以為戒","記一次缺失","告訴他下次如果再發生同樣的事情，就不需要再特地回報給資安單位了"],why:"回報會被罵，下次就沒人敢說，資安單位就少了最重要的早期警報。要罰的是隱瞞，不是誠實。"}
],[
 {q:"同一個帳號，10 分鐘前在台北登入，現在又從國外的 IP 登入成功。這個現象最需要懷疑什麼？",a:["帳號密碼已經外洩","使用者的電腦時間不準","網路速度太快","這是正常現象，使用者只要搭飛機的話十分鐘之內就可以抵達國外"],why:"這叫「不可能的移動」。先確認是不是 VPN 造成的，不是的話就要當成帳號被盜處理。"},
 {q:"端點紀錄裡看到 Office 程式啟動了 PowerShell，後面還帶一長串編碼過的參數。這代表什麼？",a:["很可疑，常見於惡意文件執行後續的指令","這是 Office 的正常更新","使用者在寫程式","代表這台電腦的 Office 授權已經過期，系統正在自動重新啟用授權"],why:"文件軟體正常不會叫出命令列工具，編碼參數又是為了躲避檢查。這個父子程序的組合是很經典的偵測點。"},
 {q:"「密碼噴灑」和一般的暴力破解，差別在哪裡？",a:["用少數幾組常見密碼去試很多個帳號，避免觸發鎖定","針對一個帳號試幾百萬組密碼","直接偷走密碼檔","先用電話假冒資訊人員，騙使用者親口把自己的密碼講出來"],why:"每個帳號只試一兩次，不會被鎖。所以要看的是「同一來源對很多帳號失敗」，不是單一帳號的失敗次數。"},
 {q:"偵測異常之前，為什麼要先建立「基準線」？",a:["要先知道平常是什麼樣子，才看得出哪裡不正常","基準線是防火牆的一種規則","為了減少紀錄的儲存量","因為法規要求每一年都要畫一條基準線，並且送交主管機關備查"],why:"半夜有主機大量對外連線算不算異常？要看它平常會不會這樣。沒有基準，告警只能靠猜。"},
 {q:"想偵測「有人在伺服器上新增管理員帳號」，寫好規則卻從來沒響過，實際上明明有人加過。最可能的原因是？",a:["相關的稽核紀錄根本沒有開，或沒有送進 SIEM","規則寫得太好了","攻擊者很有禮貌","SIEM 的授權只能同時啟用一條規則，其他的規則都會自動被停用"],why:"偵測的前提是有資料。每條規則都要確認對應的紀錄來源有開、有收、欄位有解析，並實際測試觸發一次。"},
 {q:"確認一台重要的業務主機疑似被入侵，隔離它會中斷服務。這個決定應該怎麼做？",a:["依事先訂好的授權和流程，由有權責的人決定","值班人員自己決定就好","不管影響，一律馬上隔離","先觀察一個星期看看，等到確定真的有資料外洩之後再來討論要不要隔離"],why:"圍堵常常要在「止血」和「業務中斷」之間取捨。誰能決定、多快要決定，要在平時就講好。"},
 {q:"一份好的資安事件報告，至少應該包含什麼？",a:["時間軸、影響範圍、根本原因、處置過程和後續改善","只要寫「已處理完畢」","犯錯人員的姓名和處分","攻擊者使用的工具的完整原始碼，以及重現整個攻擊的詳細操作步驟"],why:"報告是給管理階層做決定、也是給未來的自己查的。重點是發生了什麼、為什麼、之後怎麼不再發生。"},
 {q:"有一位同仁回報收到釣魚信。除了處理他的電腦，還應該做什麼？",a:["查還有誰收到同一封信，從信箱移除並封鎖相關網址","請他把信刪掉就結束","把他的信箱停用","回信給寄件者，請對方以後不要再寄這種信件到公司的信箱"],why:"釣魚信很少只寄一個人。一個人回報，代表可能有幾十個人收到、其中有人已經點了卻沒說。"}
],[
 {q:"AD 紀錄顯示，一個普通帳號在短時間內對大量服務帳號請求了服務票證，而且加密類型偏舊。最該懷疑什麼攻擊？",a:["Kerberoasting","釣魚郵件","阻斷服務","網站被置換首頁"],why:"攻擊者要票證是為了帶回去離線破解服務帳號的密碼。防禦上，服務帳號要用很長的隨機密碼。"},
 {q:"偵測到一台「不是網域控制站」的主機，對 DC 發出目錄複寫的請求。這代表什麼？",a:["可能有人在用 DCSync 倒出全網域的密碼雜湊","這是正常的備份行為","這台主機需要更新","代表這一台主機即將被自動升級成為新的網域控制站"],why:"複寫只該發生在 DC 之間（和少數已知的同步伺服器）。其他來源出現這個行為，是非常嚴重的警訊。"},
 {q:"攻擊者不帶自己的惡意程式，只用系統內建的工具（PowerShell、排程、遠端管理）行動。這種手法為什麼難偵測？",a:["用的都是合法工具，要從行為和脈絡才看得出異常","因為內建工具不會留下任何紀錄","因為防毒軟體會自動放行攻擊者","因為這些工具只能在半夜執行，而值班的人員那個時候通常都在休息"],why:"這叫「就地取材」。特徵比對擋不到，要靠基準線和行為規則：誰、在哪、什麼時間、叫了什麼。"},
 {q:"一條新的偵測規則上線前，最應該先做什麼？",a:["拿過去一段時間的紀錄回測，看會響多少次、準不準","直接上線，有問題再說","先關掉其他所有規則","請每一位同事各自提供一個他們覺得適合的告警門檻，再取平均值"],why:"沒回測就上線，常見結果是一天響幾千次或完全不響。回測也能順便確認資料來源是不是真的有。"},
 {q:"導入 SOAR 自動化處理告警。哪一類動作最適合先自動化？",a:["蒐集和補充資訊，例如查 IP 信譽、查帳號和資產資料","自動隔離任何觸發告警的主機","自動刪除使用者的檔案","自動把觸發告警的員工帳號永久刪除，並且通知人事單位"],why:"補充資訊沒有副作用，又最耗人工。會影響業務的處置動作，要等規則夠準、流程夠成熟再逐步放手。"},
 {q:"紀錄只保存 30 天。對事件調查最大的限制是什麼？",a:["攻擊者常潛伏好幾個月，等發現時最初入侵的紀錄已經沒了","紀錄檔會太小","調查會變得太快","沒有任何限制，因為所有的攻擊都會在三十天之內被發現"],why:"查不到最初怎麼進來的，就不知道洞在哪、有沒有補上。保存期限要考慮潛伏時間和法規要求。"},
 {q:"在 AD 裡放一個看起來很有價值、但實際沒人會用的帳號，並監控它有沒有被存取。這種做法的價值是？",a:["正常人不會碰它，一有動靜幾乎就確定有問題","可以增加帳號的總數","讓網域的效能變好","讓攻擊者以為公司的規模很大，因此不敢發動攻擊"],why:"這是誘餌（Honeytoken）。誤報極低，是少數「一響就要認真看」的告警。"},
 {q:"衡量資安監控成效的指標 MTTD 和 MTTR，分別是指？",a:["平均多久偵測到，以及平均多久完成處置","平均每天的告警數，以及平均每天的結案數","防火牆和防毒的授權到期日","資安人員平均每個月的加班時數，以及平均每年的離職率"],why:"攻擊者得手需要時間。偵測和回應越快，他能造成的損害越小。這兩個數字比「擋了幾次攻擊」更有意義。"}
],[
 {q:"要評估一個資安監控團隊的偵測能力夠不夠，比較好的方法是？",a:["對照攻擊手法的知識庫，盤點哪些偵測得到、哪些是缺口","看每天產生多少告警","看買了幾套產品","看資安監控中心的螢幕牆總共有幾面，以及畫面夠不夠壯觀"],why:"告警多不代表看得到。逐項盤點、實際測試，才知道下一步該補哪裡。"},
 {q:"確認攻擊者還在內部活動，而且掌握了多個立足點。清除時最忌諱什麼？",a:["發現一個清一個，讓攻擊者察覺後換個方式躲起來","事先規劃","同時行動","在行動之前先確認每一個立足點的位置和攻擊者使用的管道"],why:"要先摸清楚範圍，再選定時間一次同步處理：封鎖管道、重設憑證、移除後門。零散地清，只是提醒他躲好。"},
 {q:"威脅情資來源很多、每天幾千筆。怎麼用才有效？",a:["優先處理和自己產業、技術環境相關的，並轉成可以執行的偵測","全部匯入就好，越多越好","完全不用，自己看紀錄就夠了","每天挑選數量最多的那一類情資，印出來給全公司的同仁傳閱"],why:"不相關的情資只會製造雜訊。情資的價值在於能回答「這跟我有關嗎、我該做什麼」。"},
 {q:"監控員工行為來偵測內部威脅時，最需要平衡的是什麼？",a:["資安需求和員工隱私，監控的範圍和目的要明確並事先告知","監控畫面的解析度","監控人員的座位","監控系統的報表顏色，以及每個月的報表要印成幾份"],why:"過度監控傷害信任，也有法律風險。要有政策依據、限定目的、限制誰能看，並留下調閱紀錄。"},
 {q:"「桌上演練」（Tabletop Exercise）是在做什麼？",a:["相關人員坐下來，照假想的情境討論每一步誰做什麼決定","把桌子搬到機房","實際攻擊正式系統","請資安廠商到公司來展示他們最新推出的產品功能"],why:"不用動到系統，就能發現「誰有權決定斷網」「誰對外發言」這類流程上的漏洞。要找管理階層一起參加。"},
 {q:"查出攻擊者是利用某台伺服器的一個漏洞進來的，修補了那一台。這樣夠了嗎？",a:["不夠，要清查其他主機有沒有同樣的漏洞，以及為什麼沒被修補","夠了","不夠，應該把那台伺服器丟掉","夠了，而且這一台伺服器以後都不需要再安裝任何更新"],why:"一台有洞，通常不只一台。更重要的是修補流程哪裡漏掉了它，不解決這個，下次還是同樣的故事。"},
 {q:"數位證據的「保管鏈」（Chain of Custody）是在記錄什麼？",a:["證據從取得到提交，經過誰的手、何時、做了什麼","證據的檔案大小","證據要用什麼顏色的袋子裝","參與調查的每一位人員的年資、學歷以及專業證照"],why:"證據如果說不清楚中間有沒有被動過，在法律程序上就可能不被採信。雜湊值加上交接紀錄是基本要求。"},
 {q:"監控人員長期輪大夜班、每天看上千個告警，離職率很高。管理上最該優先改善什麼？",a:["減少無效告警和重複的人工作業，並調整輪值制度","提高告警的數量","禁止離職","在監控中心裡面多放幾台電視，讓值班人員可以一邊看一邊工作"],why:"疲勞會讓人漏看真正的攻擊。調校規則、自動化、合理輪值，是在保護人，也是在保護偵測能力。"}
]]},
{id:'red',lv:[[
 {q:"滲透測試開始之前，最重要的一件事是什麼？",a:["取得書面授權，並確認範圍和規則","先偷偷掃一下看有沒有洞","準備最新的攻擊工具","先在社群網站上公開宣布即將要對這個目標進行測試，以示透明"],why:"沒有授權就是入侵，在台灣會觸犯刑法妨害電腦使用罪。範圍、時間、禁止事項、緊急聯絡人都要白紙黑字。"},
 {q:"「被動偵察」（OSINT）的特點是什麼？",a:["只用公開資訊，不直接碰目標的系統","對目標做完整的連接埠掃描","直接嘗試登入目標的系統","寄送大量的釣魚信件給目標公司的全體員工，觀察有多少人會點擊"],why:"查公開的網域紀錄、徵才訊息、社群貼文，目標不會察覺。主動掃描才會在對方的紀錄上留下痕跡。"},
 {q:"測試過程中，你發現一台「不在授權範圍內」的主機似乎有嚴重漏洞。該怎麼做？",a:["不要動它，記錄下來並告知客戶","既然發現了就順便測一下","當作沒看到","先把它打下來取得證據，這樣向客戶報告的時候才會比較有說服力"],why:"範圍外的系統可能屬於別人，碰了就是未授權存取。告知客戶，由他們決定要不要擴大範圍。"},
 {q:"CVE 是什麼？",a:["公開漏洞的統一編號","一種加密演算法","一套防毒軟體","漏洞嚴重程度的評分，分數的範圍是從 0 分到 10 分"],why:"CVE 讓大家講同一個漏洞時有共同的名字。嚴重程度的分數是另一套，叫 CVSS。"},
 {q:"測試時你成功進入資料庫，裡面有大量真實的個資。正確的做法是？",a:["只取得足以證明的最少證據，不下載、不外流，如實記錄","全部下載回去當作成果","把資料分享給同事看","挑幾筆知名人士的資料截圖放進報告的封面，讓客戶感受到問題有多嚴重"],why:"目的是證明「拿得到」，不是真的去拿。證據截到欄位名稱和筆數就夠，內容要遮蔽。"},
 {q:"一份好的滲透測試報告，最重要的內容是什麼？",a:["每個弱點的風險、重現步驟和修補建議","測試人員用了多厲害的手法","使用的工具清單","攻擊畫面的截圖越多越好，文字的說明可以盡量省略以節省篇幅"],why:"報告是寫給要修的人看的。對方能照著重現、知道先修哪個、怎麼修，這份報告才有價值。"},
 {q:"OWASP Top 10 是什麼？",a:["最常見的網站應用程式安全風險清單","十大駭客組織的排名","十種最好用的攻擊工具","全世界前十名最安全的網站，每一年由各國政府共同評選出來"],why:"它是網站安全的入門地圖，像存取控制失效、注入攻擊都在上面。開發和測試人員都該看過。"},
 {q:"測試進行中，客戶的正式系統開始變慢、出現異常。你應該怎麼做？",a:["立刻停止測試，通知客戶的緊急聯絡人","繼續測完，結束後再一起報告","加快速度趕快測完","先不要講，默默觀察看看系統會不會自己恢復正常"],why:"測試不能造成實際損害。事前就要約定好緊急聯絡人和停止條件，出狀況第一時間通報。"}
],[
 {q:"「黑箱」和「白箱」滲透測試，差別在哪裡？",a:["黑箱事先不知道內部資訊，白箱會拿到架構、帳號甚至原始碼","黑箱在晚上做，白箱在白天做","黑箱不需要授權","黑箱只測試網路設備，白箱則是只測試網站，兩者的測試對象完全不同"],why:"黑箱接近外部攻擊者的視角；白箱效率高、涵蓋深。介於中間、給部分資訊的叫灰箱。"},
 {q:"弱點掃描工具回報了 200 個弱點。寫進報告之前應該做什麼？",a:["人工驗證，排除誤判並確認實際的風險","全部照抄進報告","只挑前十個","把工具的掃描強度調到最高之後重新再掃描一次，以數量比較多的那一次為準"],why:"掃描工具常靠版本號推測，誤判很多。沒驗證的報告會讓客戶花時間追不存在的問題，也失去信任。"},
 {q:"客戶委託做社交工程測試（釣魚演練）。下列哪一個原則最重要？",a:["同樣要有授權和範圍，而且不能對個人造成實質傷害","為了逼真，什麼手段都可以用","不需要告訴任何人","測試結束之後要公布每一位中招員工的姓名，這樣才能達到警惕的效果"],why:"演練的目的是找出流程和訓練的缺口，不是羞辱人。主題要避開會造成恐慌或傷害的內容，結果也不該針對個人。"},
 {q:"測試中你取得並破解了一批使用者的密碼。這些密碼應該怎麼處理？",a:["只用於授權範圍內的測試，報告中遮蔽，結束後銷毀","留著以後可能用得到","整份明文貼進報告","寄一封信給每一位使用者，信中附上他們的密碼，提醒他們密碼太弱了"],why:"這些是真實的憑證。報告只需要證明「破解得出來」和統計數字，明文留在你手上就是多一個外洩點。"},
 {q:"滲透測試結束後，為什麼一定要做「清理」？",a:["移除測試時建立的帳號、上傳的工具和修改的設定，避免變成真的漏洞","讓客戶看不出來你做過什麼","減少報告的頁數","把客戶系統上所有的紀錄檔都清除乾淨，這樣系統的硬碟空間才不會不足"],why:"忘了刪的測試帳號和後門，之後被真正的攻擊者撿去用，責任就在測試團隊。清理的項目也要列在報告裡。"},
 {q:"三個單獨看都只是「低風險」的弱點，串在一起卻能拿到管理員權限。報告應該怎麼呈現？",a:["說明整條攻擊鏈，並以串起來之後的實際風險評級","各自列為低風險就好","不用寫，客戶看不懂","只寫其中最嚴重的那一個，另外兩個因為風險比較低所以可以省略"],why:"真實的攻擊都是串起來打的。只看單點分數會嚴重低估風險，也讓客戶不知道為什麼要優先修。"},
 {q:"實務上，下列哪一種是最常見、也最容易得手的突破口？",a:["沒改掉的預設帳號密碼和弱密碼","全新的零時差漏洞","破解加密演算法","攻擊者親自潛入機房，把伺服器的硬碟直接拆下來帶走"],why:"大部分的入侵靠的不是高深技術，而是沒改的預設密碼、沒修的舊漏洞和設定錯誤。"},
 {q:"客戶修補完成後，安排一次「複測」。它的目的是什麼？",a:["確認弱點真的修好了，而且沒有因為修補產生新的問題","再收一次費用","重新做一次完整的測試","確認客戶有沒有把上一次的測試報告外流給其他的資安廠商"],why:"說修好了和真的修好了是兩回事。常見的狀況是只擋了報告裡的那個測試字串，換個寫法還是打得進去。"}
],[
 {q:"「假設已被入侵」（Assumed Breach）的測試，是從什麼狀態開始？",a:["直接給測試人員一個內部的立足點，例如一台電腦或一組一般帳號","從完全不知道目標是誰開始","從取得管理員權限之後開始","從客戶的系統已經全部被加密、業務完全停擺的狀態開始"],why:"邊界遲早會被突破。這種測試把時間花在「進來之後能走多遠、防守方看不看得到」。"},
 {q:"受駭主機會定期對外連到攻擊者的控制伺服器（C2）領取指令。防守方可以從什麼特徵發現它？",a:["固定間隔、規律的對外連線","連線的次數是偶數","主機的螢幕變暗","主機的硬碟容量會在每一次連線之後自動增加一倍"],why:"這種規律的「心跳」叫 Beaconing。就算內容加密，時間間隔和目的地的異常仍然看得出來。"},
 {q:"交戰規則（RoE）裡的「禁止事項」，通常會包含什麼？",a:["阻斷服務攻擊、異動或刪除正式資料","撰寫測試報告","使用筆記型電腦","在測試期間和客戶的窗口保持聯絡，並且定期回報測試的進度"],why:"測試是為了證明風險，不是造成損害。會讓服務中斷或資料毀損的動作，預設都不做，除非另外書面同意。"},
 {q:"「紫隊」演練是怎麼進行的？",a:["攻擊方和防守方一起，逐項執行手法並確認偵測和回應有沒有作用","攻擊方和防守方互不溝通","只有防守方參加","由第三方的裁判來決定攻擊方和防守方哪一邊獲勝，並且頒發獎金"],why:"目的是一起把偵測補起來：打一招、看有沒有告警、沒有就當場調整規則再打一次。"},
 {q:"測試目標是「證明能取得財務系統的資料」。你在過程中拿到了網域管理員權限。接下來應該怎麼做？",a:["完成約定的目標就停，不去碰範圍和目標以外的系統","既然有最高權限，把所有系統都逛一遍","順便幫客戶修改一些設定","把網域裡所有人的密碼都改掉，藉此向客戶證明問題的嚴重性"],why:"權限越大越要克制。多做的每一步都可能造成意外，也超出授權。把取得的過程記錄清楚就夠了。"},
 {q:"測試時，你發現系統裡有不是你留下的後門和可疑帳號。應該怎麼做？",a:["立刻暫停，通知客戶，這可能是真正的入侵","當作沒看到，繼續測試","把它刪掉","利用那一個後門繼續往內部深入，這樣可以節省很多測試的時間"],why:"這已經不是測試的範圍，而是事件應變。要保留現場，你繼續操作可能破壞證據，或被誤認是你做的。"},
 {q:"滲透測試報告通常分成「管理摘要」和「技術細節」。為什麼要分開？",a:["決策的人和動手修的人，需要的資訊不一樣","為了讓報告看起來比較厚","因為法律規定","因為管理階層依規定不可以閱讀任何含有技術內容的文件"],why:"主管要知道整體風險和該投入什麼資源；工程師要知道在哪、怎麼重現、怎麼修。混在一起兩邊都看不下去。"},
 {q:"你在測試之外，發現某個常用軟體的未公開漏洞。比較負責任的做法是？",a:["通報廠商或 TWCERT/CC 這類協調單位，給合理的修補時間再公開","立刻把細節公布在社群上","賣給出價最高的人","先用這個漏洞測試幾家不相關的公司，確認真的有效之後再說"],why:"這叫負責任的揭露。讓廠商有時間修、使用者有時間更新，公開細節才不會變成幫攻擊者的忙。"}
],[
 {q:"規劃紅隊演練時，目標最好怎麼訂？",a:["以業務衝擊為目標，例如「取得某項核心資料」或「能中斷某項關鍵服務」","找到越多漏洞越好","拿到任何一台電腦","讓客戶的資訊人員在演練的期間盡可能地感到緊張"],why:"紅隊是模擬真實的對手，對手要的是結果。目標對準組織最在意的東西，演練的結論才有意義。"},
 {q:"紅隊在演練中途就被藍隊發現並擋下了。這個結果應該怎麼看？",a:["這是有價值的結果，代表偵測和應變在這條路徑上有效","演練失敗，要重新來過","紅隊的能力太差","代表藍隊事先偷看了紅隊的計畫，所以這一次的結果不算數"],why:"演練的目的是驗證防禦，不是讓紅隊贏。被抓到的地方和沒被抓到的地方，都是要記錄的成果。"},
 {q:"紅隊演練時，組織內只有少數人（控制小組）事先知情。這個小組的作用是什麼？",a:["掌握進度、處理意外，並在必要時喊停","幫紅隊偷偷開後門","事先通知所有員工","在演練結束之後決定要處分哪幾位沒有發現攻擊的同仁"],why:"防守方不知情才測得出真實反應，但必須有人能分辨「這是演練還是真的」，並避免演練引發不必要的通報。"},
 {q:"演練計畫包含網路滲透、寄釣魚信、還有人員實地進入辦公室。授權上要注意什麼？",a:["每一種方式都要明確寫進授權，實體的部分還要準備可供查證的授權文件","只要網路的部分有授權就全部涵蓋","實體進入不需要授權","只要演練的人員穿著整齊並且態度有禮貌，就不需要額外的授權"],why:"實體滲透可能遇到保全甚至警察。身上要有授權書和緊急聯絡人，否則會變成真的刑事案件。"},
 {q:"「威脅模擬」（Threat Emulation）和一般滲透測試的差別是？",a:["刻意照某個真實攻擊族群的手法來做，測試對那個對手的防禦","只用自動化工具掃描","完全隨機地攻擊","模仿電影裡面駭客的打字速度和螢幕上的畫面效果"],why:"如果情資顯示某個族群專打你的產業，用他們的手法演一遍，比泛泛的測試更能回答「我們擋不擋得住」。"},
 {q:"演練找到二十條可以打到核心系統的攻擊路徑。給修補建議時，怎麼排最有效？",a:["找出很多條路徑都會經過的共同關鍵點，優先處理","依發現的先後順序","先修最簡單的","二十條路徑各自獨立修補，而且全部都要在同一天完成"],why:"很多路徑會匯集在少數幾個點，例如某個權限過大的帳號。處理一個點，可能同時切斷十條路。"},
 {q:"演練結束後，紅隊和藍隊一起開檢討會。最有價值的做法是？",a:["把雙方的時間軸對起來：哪一步有被看到、哪一步沒有、為什麼","由紅隊展示自己有多厲害","只發書面報告，不必開會","由雙方的主管各自發表感想，然後投票決定哪一隊表現比較好"],why:"紅隊知道自己做了什麼，藍隊知道自己看到了什麼。兩邊對起來，偵測的缺口就一目了然。"},
 {q:"客戶的系統架在公有雲上。測試之前，除了客戶的授權，還要確認什麼？",a:["雲端業者的測試政策允許哪些行為","雲端機房的地址","雲端業者的股價","不需要再確認任何事情，只要客戶同意就可以對雲端上的任何東西測試"],why:"底層設施是業者的，也跟其他客戶共用。超出業者允許的範圍（例如阻斷服務），客戶授權也沒有用。"}
]]},
{id:'dba',lv:[[
 {q:"資料庫的「慢查詢紀錄」是用來做什麼的？",a:["找出執行時間過長的 SQL，當作調校的依據","記錄誰登入過資料庫","讓查詢故意變慢","把執行太久的查詢自動刪除，避免佔用資料庫的儲存空間"],why:"調校要從最花時間、最常執行的查詢下手。沒有紀錄就只能憑感覺猜。"},
