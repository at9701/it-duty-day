['規劃',['建置無線網路之前要做現場勘測。','實際量測訊號的涵蓋範圍和干擾的狀況。','依結果決定基地台的數量和位置。'],'在平面圖上估計需要八台。現場勘測發現中間有一道鋼筋混凝土牆，而且鄰近公司的訊號很強，最後調整為十一台並更改位置。','依坪數套公式估算數量，然後照配線方便的位置安裝。上線後才發現有死角，有些地方又互相干擾。','訊號實際怎麼傳播，取決於建築的材質、隔間、家具，以及周圍有哪些其他的無線訊號。這些從平面圖上看不出來。事後再補救的成本，遠高於事前花時間量測。','建置前先現場勘測，量涵蓋和干擾。',['f',['現場量測｜訊號和干擾','決定基地台｜數量和位置','安裝','上線後｜再驗證一次'],null,['a','','','']]],
['頻道',['頻道寬度愈寬，單一台裝置的速度愈快。','但可以使用的不重疊頻道就愈少。','基地台密集的環境要用比較窄的頻寬，換取更多不重疊的頻道。'],'辦公室有三十台基地台。把 5GHz 的頻寬從 80MHz 改成 40MHz，可用的頻道變多，相鄰的基地台不再共用頻道，整體反而更順。','看規格表上寬頻道的速度比較高，就全部設成最寬。相鄰的基地台被迫使用相同的頻道，互相干擾。','頻段的總寬度是固定的，每個頻道切得愈寬，能切出的數量就愈少。基地台多的時候，相鄰的基地台要用不同的頻道才不會互相干擾。這時候頻道的數量比單一頻道的寬度更重要。','密集環境用窄頻寬，換更多不重疊的頻道。',['c',[['寬頻道','單機快｜可用頻道少、易干擾'],['窄頻道','頻道多｜適合基地台密集的環境','a']]]],
['容量',['很多人同時上網的場所，要規劃的是容量，不是涵蓋。','要算每一台基地台能負擔的連線數，以及總共需要多少頻寬。','需要多台基地台分擔，並控制每一台的功率。'],'兩百人的大會議室。一台基地台的訊號就能涵蓋整間，但依容量計算需要五台，並把功率調低，讓每台只服務附近的人。','「訊號有涵蓋到就好」。只放一台基地台，訊號是滿格的，但兩百個人同時用，誰都連不順。','涵蓋回答的是「訊號到不到得了」，容量回答的是「夠不夠這麼多人用」。高密度的場所訊號從來不是問題，問題在於所有人共用有限的空中時間。解法是把人分散到更多台、各自使用不同頻道的基地台上。','人多的場所算容量：要幾台、每台服務多少人。',['c',[['涵蓋','訊號到不到得了'],['容量','夠不夠這麼多人用','a']],'高密度場所：多台分擔、調低功率']],
['漫遊',['裝置換基地台的時候會有短暫的中斷。','對網路電話這類即時應用影響很大。','802.11r、k、v 這些標準可以讓裝置更快找到下一台並完成驗證。'],'啟用快速漫遊之後，邊走邊講網路電話，換基地台時的中斷從一兩秒縮短到幾乎聽不出來。','基地台開了這些功能就認為沒問題。用戶端裝置也要支援才有效果，有些舊裝置遇到這些功能反而會連線異常，要先測試。','換基地台時，裝置要先找到新的基地台，再重新完成驗證。這些標準分別是讓基地台告訴裝置附近有哪些候選、建議它什麼時候該換，以及把驗證的過程縮短。','快速漫遊標準（802.11r/k/v）縮短換基地台的中斷。',['c',[['802.11k','告訴裝置｜附近有哪些基地台'],['802.11v','建議裝置｜什麼時候該換'],['802.11r','縮短重新驗證｜的時間']]]],
['管理',['基地台數量多的時候，要用控制器或雲端平台集中管理。','好處是設定一致，可以統一調整頻道和功率。','也看得到全部的連線狀況。'],'四十台基地台由控制器管理。新增一個 SSID 只要設定一次；控制器會自動協調各台的頻道，避免相鄰的互相干擾。','一台一台登入設定。時間一久每台的設定都有一點不一樣，出問題時也不知道該看哪一台。','無線網路的品質取決於所有基地台之間的配合：頻道要錯開、功率要協調。每一台各自設定時，沒有任何一台知道整體的情況。集中管理才有全局的資訊。','基地台多就要集中管理：設定一致、頻道功率統一協調。',['c',[['逐台設定','設定不一致｜沒有全局資訊','w'],['集中管理','一次設定｜自動協調頻道和功率']]]],
['驗證',['企業無線網路用 802.1X 搭配憑證來驗證，比用帳號密碼更好。','憑證不會像密碼一樣被釣走。','而且可以確認連線的是公司管理的裝置。'],'憑證透過管理工具安裝在公司的筆電上。員工的私人手機即使知道他的帳號密碼，也連不上內部的無線網路。','用帳號密碼驗證。員工把帳號密碼輸入自己的私人裝置，這些沒有受管理的裝置就接上了內部網路。','密碼是「知道就能用」的東西，可以被告訴別人、被騙走、被輸入到任何裝置上。憑證是安裝在特定裝置上的，無法口頭告訴別人。所以它同時驗證了使用者和裝置。','憑證驗證：釣不走，也能確認是公司的裝置。',['c',[['帳號密碼','可能被釣走｜可以用在任何裝置','off'],['憑證','裝在受管理的裝置上｜釣不走','a']]]],
['攻擊',['邪惡雙子是有人架設一台和正常網路同名的假基地台。','目的是誘使裝置連上，藉此攔截流量或騙取帳號密碼。','防護的方法是用憑證驗證伺服器的身分，並偵測不明的基地台。'],'攻擊者在公司樓下的咖啡廳架了一台和公司 SSID 同名的基地台。員工的手機自動連上，並跳出要求輸入帳號密碼的畫面。','「網路名稱是對的，所以是公司的網路」。名稱任何人都可以設成一樣的。','裝置是依名稱來辨認網路的，而且會自動連到曾經連過的名稱。攻擊者只要用同樣的名稱、發出比較強的訊號，裝置就可能連過去。要防止這件事，裝置必須驗證對方真的是公司的網路，而不是只看名稱。','同名的假基地台會騙你連上；要驗證伺服器身分。',['f',['攻擊者架設｜同名的基地台','裝置自動連上','攔截流量｜或騙帳密'],'防護：用憑證驗證伺服器身分、偵測不明基地台',['w','w','w']]],
['供電',['基地台常常是由交換器透過網路線供電（PoE）。','規劃時要確認交換器的總供電瓦數，夠不夠所有的設備使用。','新一代的基地台耗電比較高。'],'把舊基地台換成新一代的機種之後，有幾台一直重開機。原因是交換器的總供電瓦數不夠，換了供電能力更高的交換器才解決。','只算連接埠的數量夠不夠，沒有算供電的瓦數。瓦數不夠時，部分設備會開不了機或自動降低效能。','每一台交換器能提供的總電力是有上限的，每個埠能提供的電力也依支援的標準而不同。基地台的功能愈強，需要的電力愈多。','PoE 要算交換器的總瓦數夠不夠。',['c',[['每埠的供電標準','要符合基地台需求'],['交換器總瓦數','要夠所有設備同時使用','a']]]]],
2:[
['診斷',['判斷無線網路慢的原因，不能只看訊號強度。','更重要的是頻道使用率和重傳率。','頻道被佔滿，或是一直在重傳，訊號再強也快不起來。'],'訊號強度很好，但頻道使用率高達 85%、重傳率 30%。問題是干擾和擁擠，不是涵蓋。','使用者抱怨慢就加裝基地台。如果原因是頻道擁擠，多一台基地台只會讓它更擁擠。','訊號強度告訴你「聽得清不清楚」，但無線網路的速度還取決於「有多少時間可以講」和「講了對方有沒有收到」。頻道使用率反映前者，重傳率反映後者。','無線慢要看頻道使用率和重傳率。',['c',[['訊號強度','聽得清不清楚','off'],['頻道使用率','空中時間｜被佔了多少','a'],['重傳率','傳了有沒有收到','a']]]],
['設計',['把每一台基地台的功率都開到最大，會造成兩個問題。','基地台之間互相干擾；裝置會黏在遠處的基地台不肯換。','功率要和用戶端裝置對稱。'],'把辦公區基地台的功率從最大調降到中等。涵蓋範圍縮小了，但每個區域的裝置都連到最近的那一台，整體的速度和穩定度反而提升。','「功率大訊號才好」。基地台傳得到手機，手機的小功率卻傳不回基地台，連線是單向良好。','無線通訊是雙向的。手機的發射功率比基地台小得多。基地台把功率開很大，只是讓手機在很遠的地方還「聽得到」，但基地台聽不清楚手機。結果就是裝置以為連得上而不漫遊，實際上連線品質很差。','功率要和裝置對稱；全開只會互相干擾。',['c',[['功率全開','互相干擾｜裝置黏著不換','w'],['和裝置對稱','雙向都聽得清楚｜正常漫遊']]]],
['相容性',['為了支援很舊的裝置而保留低速率，會拖累整個網路。','基地台的管理訊框會用最低的速率傳送，佔用大量的空中時間。','關掉最低的幾個速率，常常能明顯改善擁擠環境的效能。'],'把最低的幾個速率停用之後，同樣的環境頻道使用率下降了兩成。','為了「相容性最好」而把所有速率都保留。少數幾台舊裝置讓全部的人都變慢。','每一台基地台都會定時廣播自己的存在，這些訊框要讓所有可能的裝置都收得到，所以用最低的速率傳送。速率愈低，傳送同樣的內容花的時間愈長。在基地台很多的環境裡，光是這些廣播就會佔掉很可觀的空中時間。','停用最低速率，可以釋放空中時間。',['c',[['保留所有低速率','管理訊框很慢｜佔滿空中時間','w'],['停用最低的速率','釋放空中時間｜舊裝置可能要另外處理']]]],
['頻段',['6GHz 頻段的好處是頻道多、干擾少。','限制是需要新的裝置才支援，而且穿透力更弱。','各國開放的範圍不同，在台灣要依主管機關的規定。'],'新的辦公室在高密度的會議區使用 6GHz，基地台的間距比 5GHz 更密；同時保留 5GHz 給還不支援的裝置。','看到 6GHz 很快就全面改用。目前還有很多裝置不支援，而且因為穿透力弱，沿用原本的基地台位置會出現死角。','6GHz 是新開放的頻段，上面沒有舊設備，所以很乾淨。但頻率更高，訊號更容易被障礙物衰減。它提供的是大量的容量，適合人多、距離近的室內環境。','6GHz 乾淨、頻道多，但要新裝置、基地台要更密。',['c',[['好處','頻道多｜干擾少'],['限制','需要新裝置支援｜穿透力更弱','w'],['法規','依主管機關｜開放的範圍']]]],
['物聯網',['很多物聯網裝置只支援舊的加密方式。','不要為了它們降低主要網路的安全等級。','把它們放在獨立的網路和網段，並限制它們能連到的範圍。'],'為物聯網裝置另外建立一個 SSID 和 VLAN，只允許它們連到各自需要的那一台伺服器。','為了讓舊裝置連得上，把公司主要無線網路的加密方式調降到它們支援的程度。所有人的安全都被拉低了。','一個網路的安全性取決於它允許的最弱的設定。把無法升級的裝置隔離到自己的網路，它們的弱點就不會影響到其他人，而且即使被入侵，能接觸到的範圍也很有限。','物聯網裝置放獨立網路，不要為它降低主網路的安全。',['f',['只支援舊加密｜的裝置','獨立的 SSID｜和網段','只能連到｜必要的主機'],'主要網路維持原本的安全等級',['w','a','']]],
['驗證',['企業無線網路的用戶端，要驗證驗證伺服器的憑證。','否則裝置會把帳號密碼交給假冒的基地台。','這個設定要由管理工具統一派送，不能讓使用者自己決定。'],'管理工具把無線網路的設定檔派送到所有筆電，裡面指定了只信任公司驗證伺服器的憑證。遇到假的基地台，裝置會直接拒絕連線。','讓使用者自己設定。很多裝置遇到不認得的憑證會跳出「要不要信任」，而使用者幾乎都會按是。','802.1X 的驗證過程中，裝置會把帳號密碼的資訊送給驗證伺服器。如果裝置不確認對方是不是真的，假的基地台後面接一台假的伺服器，就能收下這些資訊。','用戶端要驗證伺服器憑證，並由管理工具統一設定。',['c',[['讓使用者自己按','多數人按「信任」｜帳密交給假基地台','w'],['管理工具統一設定','只信任公司的伺服器｜遇到假的直接拒絕']]]],
['排錯',['問題如果有固定的週期，先找週期性的原因。','某個區域一到中午就連不上，可能是微波爐這類設備的干擾。','也可能是用餐時間人數暴增。頻譜分析可以看出不是 Wi-Fi 的干擾來源。'],'茶水間旁的座位每天中午都斷線。用頻譜分析儀看到 2.4GHz 在微波爐運轉時被整片干擾。把那一區的裝置改用 5GHz 就解決了。','只看 Wi-Fi 的掃描工具。那類工具只看得到其他的 Wi-Fi 網路，看不到微波爐、無線電話這些干擾源。','2.4GHz 是開放的頻段，很多不是 Wi-Fi 的設備也在使用。這些設備不遵守 Wi-Fi 的規則，它們的訊號對 Wi-Fi 來說就是雜訊。要看到它們，需要直接觀察無線電訊號的工具。','週期性的問題找週期性的原因；頻譜分析看非 Wi-Fi 干擾。',['f',['固定時間｜出問題','那個時間｜有什麼在運作？','頻譜分析','找出干擾源'],null,['w','a','','']]],
['定位',['利用無線網路做室內定位，準確度是有限的。','而且位置資料涉及人員的隱私。','蒐集的目的、保存的期限、誰可以查看，都要有規範。'],'導入室內定位用於找尋設備。事先訂定規範：只追蹤設備標籤，不追蹤個人；紀錄保存三十天；查詢要留下紀錄。','技術上做得到就直接啟用對人員的定位。沒有告知、沒有限定用途，很容易引發爭議和法律問題。','定位系統記錄的是「誰在什麼時間在什麼地方」，這可以拼湊出一個人的行蹤和習慣，屬於個人資料。使用這類資料必須有明確的目的，而且要讓當事人知道。','定位資料是個資：要有目的、期限和查閱規範。',['c',[['準確度','有限｜不要期待太精確'],['隱私','位置是個資｜要有規範','a']]]]],
3:[
['架構',['大型場域的無線網路，使用者的流量有兩種處理方式。','集中到控制器：好管控，但控制器會成為瓶頸和單點。','在基地台就近轉送：效能好，但政策比較分散。可以依需求混用。'],'訪客的流量集中到控制器，統一做驗證和管控；員工大量的內部流量則在基地台就近轉送，不繞經控制器。','不考慮流量的大小，全部集中到控制器。控制器的處理能力成為整個無線網路的上限。','集中的好處是只有一個地方需要套用政策和檢查流量；缺點是所有流量都要繞一圈。就近轉送則相反。選擇哪一種，要看流量有多大、政策有多複雜、站點有多少。','集中好管但有瓶頸；就近轉送快但政策分散；可以混用。',['c',[['集中到控制器','好管控｜瓶頸和單點'],['基地台就近轉送','效能好｜政策較分散']]]],
['高密度',['體育館這類上萬人的場地，設計的核心不是涵蓋。','而是容量和干擾的控制。','做法是用指向性的天線把涵蓋範圍切小，讓每一台基地台服務的人數受到控制。'],'在觀眾席的上方和座位底下安裝指向性天線，每一台只涵蓋一小區的座位，相鄰的使用不同的頻道。','用一般辦公室的全向性基地台。訊號擴散到很大的範圍，幾百個人連到同一台，而且彼此嚴重干擾。','人非常密集時，任何一台基地台只要涵蓋範圍稍大，就會有太多人連上來。人體本身也會吸收訊號。所以要刻意把每一台的涵蓋範圍限制得很小，用很多個小區塊來分擔人數。','上萬人的場地：指向性天線切小範圍，控制每台的人數。',['f',['上萬人','指向性天線','切成很多｜小涵蓋區','每台服務的｜人數受控'],null,['w','a','','']]],
['生命週期',['規劃無線網路換代時，不能只看基地台。','要先確認：用戶端裝置支援新標準的比例、交換器的供電能力、交換器的上行頻寬。','任何一項跟不上，新基地台的效果就發揮不出來。'],'評估換新一代基地台。盤點後發現只有三成的筆電支援新標準，而且現有的交換器埠只有 1 Gbps、供電也不足。決定先汰換交換器，基地台分兩年更換。','只編列基地台的預算。換上去之後速度沒有明顯提升，因為裝置不支援，上行的埠也成了瓶頸。','無線網路是一條鏈：裝置、基地台、交換器、上行線路。整體的效能由最弱的一環決定。新標準的好處要兩端都支援才有，基地台更高的速度也需要後面的有線網路撐得住。','換代要一起看：裝置支援率、交換器供電和上行頻寬。',['c',[['用戶端','多少比例｜支援新標準'],['交換器供電','夠不夠新基地台'],['上行頻寬','會不會變成瓶頸']]]],
['安全',['無線入侵偵測或防禦系統，主要在找三種東西。','未經授權的基地台、假冒公司的網路、異常的無線行為。','員工自己接的分享器，等於在內部網路開了一個沒有人管的入口。'],'系統偵測到辦公室裡有一台不在清單上的基地台，而且它接在公司的有線網路上。追查後是某個部門為了方便自己接的。','只管理自己安裝的基地台。有人私接的設備、外面架設的假冒網路，都不在視線範圍內。','有線網路的入口是實體的連接埠，可以控管。無線訊號則是到處都有，任何人都可以架設一台。私接的基地台會繞過公司所有的無線安全設定，直接把內部網路暴露出去。','偵測未授權的基地台和假冒的網路。',['c',[['私接的基地台','內網多一個｜沒人管的入口','w'],['假冒的網路','誘騙裝置連線','w'],['異常行為','例如大量的｜斷線攻擊','w']]]],
['關鍵應用',['倉儲的手持設備、醫療的行動設備這類應用，對無線網路的要求和一般辦公不同。','重點是漫遊不中斷、涵蓋沒有死角。','而不是最高的速度。設計和驗收都要依實際的設備和動線來測試。'],'倉儲的無線網路驗收時，拿著實際使用的手持設備，沿著撿貨的路線走過每一條走道，確認全程沒有斷線。','用筆電在幾個定點測速，數字很好就驗收通過。實際的手持設備在貨架之間移動時頻頻斷線。','這類設備傳輸的資料量很小，但連線一中斷，作業就停擺。它們持續在移動，而且無線的能力通常比筆電弱。貨架上的貨物多寡也會改變訊號的狀況。只有用實際的設備在實際的條件下測試，才能確認可用。','關鍵應用重漫遊和無死角；用實際設備沿動線驗收。',['c',[['一般辦公','重視速度'],['關鍵行動應用','漫遊不中斷｜涵蓋無死角','a']],'用實際的設備、沿實際的動線測試']],
['維運',['無線網路上線之後，品質會隨環境改變。','要持續監控用戶端的體驗指標。','並且定期重新勘測。'],'辦公室重新隔間之後，有一區的連線品質明顯下降。監控的指標顯示了這個變化，重新勘測後調整了兩台基地台的位置。','驗收通過之後就不再檢視，直到使用者抱怨。','無線網路的設計是依當時的環境做的。隔間、家具、人數、鄰近的無線網路都會改變，每一項都會影響訊號。這些變化不會產生任何設備的告警，只會反映在使用者的體驗上。','環境會變；持續監控體驗指標，定期重新勘測。',['f',['持續監控｜用戶端體驗','環境改變','指標變差','重新勘測｜並調整'],null,['a','','w','']]],
['私有行動網路',['企業自建的私有行動網路，適合大範圍、需要穩定的移動連線和可預期品質的場域。','例如港口、大型廠區。','成本和複雜度比 Wi-Fi 高很多，頻譜也要依法規申請。它不是用來取代辦公室 Wi-Fi 的。'],'大型廠區有自動搬運車在戶外長距離移動，用 Wi-Fi 需要非常多的基地台而且漫遊不穩，評估後改用私有行動網路。','因為是新技術就想導入，用在一般的辦公室。得到的好處很少，付出的成本很高。','行動網路的技術本來就是為了大範圍的涵蓋和移動中的連線而設計的，使用的是需要執照的頻譜，所以干擾少、品質可預期。代價是設備、建置和維運都複雜得多。','專網適合大範圍、移動中、要穩定品質的場域。',['c',[['Wi-Fi','辦公室、室內｜成本低'],['私有行動網路','大範圍、移動中｜品質可預期｜成本高、要申請頻譜']]]],
['治理',['對外提供訪客無線網路，在法遵上要注意幾件事。','要有使用條款；要保存必要的紀錄；網路被用於不法行為時要有追溯的能力。','也要告知使用者蒐集了哪些資料。'],'訪客連線前要先同意使用條款並完成簡單的身分登記；連線紀錄依規定保存一定的期間。','開放一個不需要任何登記的免費網路。有人用它從事不法行為，調查單位找上門時，完全無法提供任何資訊。','從外部看，經由你的網路出去的流量，來源就是你的 IP 位址。提供網路的一方要有能力說明「當時是誰在使用」。同時，為此而蒐集的資料本身也是個資，要依規定告知和保管。','訪客網路要有使用條款、紀錄保存和追溯能力。',['c',[['使用條款','連線前同意'],['紀錄保存','依規定的期間'],['追溯能力','查得到｜當時是誰'],['告知','蒐集了｜哪些資料']]]]]};
LEARN.netsvc={0:[
['DHCP',['租約時間是裝置可以使用這個 IP 多久，到期前要續約。','訪客多的環境租約要短，IP 才回收得快；固定設備多的環境可以長一點。','DHCP 保留是依網路卡位址綁定固定的 IP，設備每次都拿到同一個位址，但設定仍由 DHCP 集中管理。'],'印表機用 DHCP 保留，每次都拿到 .50，使用者電腦上的印表機設定就不會失效；要改位址時只要在 DHCP 伺服器上改。','需要固定 IP 的設備都用手動設定。時間一久沒有人記得哪些位址被手動佔用了，很容易和 DHCP 配發的位址衝突。','IP 位址是有限的資源，租約讓沒有在使用的位址可以被收回再配給別人。保留則是在集中管理的前提下，讓特定設備得到固定的位址，兩種需求都能顧到。','租約決定 IP 多快回收；固定 IP 用 DHCP 保留。',['c',[['租約時間','訪客多：設短｜固定設備多：設長'],['DHCP 保留','依網路卡位址｜綁定固定 IP','a']]]],
['DNS',['DNS 紀錄的 TTL 是這筆查詢結果可以被快取多久。','在 TTL 之內，別人不會再來問你，所以修改紀錄之後要等舊的快取過期才會全部生效。','分割 DNS 是同一個名稱，在內部和外部查到不同的 IP。'],'公司網站的名稱，員工在內部查到的是內部位址，直接連線；外面的人查到的是對外的位址。','改了 DNS 紀錄就以為馬上生效。有些人還在用快取裡的舊位址，於是出現「有人連得到、有人連不到」。','每次連線都去問 DNS 太沒有效率，所以查到的結果會被暫存。TTL 是紀錄的擁有者告訴大家「這個答案可以用多久」。排錯時也要先確認自己問的是哪一台 DNS，因為內外的答案可能不同。','TTL 是可以快取多久；分割 DNS 是內外查到不同位址。',['c',[['TTL','結果可快取多久｜改了要等過期才全生效'],['分割 DNS','同一名稱｜內外查到不同 IP']]]],
['時間同步',['NTP 讓設備的時間和標準時間保持一致。','時間不準會造成很多問題。','登入驗證會失敗、憑證會被判定無效、各設備的紀錄也對不起來。'],'一台伺服器的時間慢了十分鐘。使用者無法用網域帳號登入它，憑證驗證也出現錯誤。校正時間之後全部恢復。','把時間同步當成不重要的小事。它出問題時的徵狀看起來都和時間無關，所以很難聯想到。','很多安全機制都依賴時間：票證有有效期間、憑證有起訖日期、一次性驗證碼依時間計算。這些機制假設雙方的時鐘是一致的。差距超過容許的範圍，就會被當成無效或可疑。','時間不準，登入、憑證、紀錄都會出問題。',['c',[['登入驗證','時間差太多｜會失敗','w'],['憑證','被判定｜尚未生效或已過期','w'],['紀錄','各設備的時間｜對不起來','w']]]],
['Proxy',['上網代理伺服器是讓公司內對外的網頁連線都經過它。','用途是集中管控和記錄。','可以過濾惡意和不當的網站，出事時也查得到誰在什麼時候連過哪裡。'],'資安單位收到情資，某個網域是惡意的。查詢 Proxy 的紀錄，馬上列出過去一個月有哪些電腦連過它。','把 Proxy 只當成限制員工上網的工具。它更重要的價值是留下紀錄，以及擋下連往惡意網站的連線。','所有對外的網頁流量都經過同一個點，這個點就可以套用一致的政策並留下完整的紀錄。沒有它的話，每台電腦各自直接連出去，既無法統一管控，事後也沒有地方可以查。','Proxy：集中管控和記錄對外的網頁連線。',['f',['內部電腦','Proxy｜過濾並記錄','網際網路'],'出事時查得到誰連過哪裡',['','a','']]],
['負載平衡',['負載平衡器把連線分散到多台後端的伺服器。','單一台撐不住的流量可以由多台分攤。','其中一台故障時，連線會被導到其他台，服務不中斷。'],'網站有三台伺服器，前面放一台負載平衡器。其中一台當機，負載平衡器發現後不再把連線分給它，使用者沒有感覺。','只有一台負載平衡器。它讓後端有了備援，但它自己變成新的單點，所以負載平衡器本身也要有備援。','一台伺服器能處理的量有上限，也一定會有故障和維護的時候。在前面放一個分配流量的角色，後面就可以用多台普通的伺服器組合出更大的容量，而且可以一台一台輪流維護。','負載平衡：分散流量，一台壞了服務不中斷。',['f',['使用者','負載平衡器','伺服器甲｜伺服器乙｜伺服器丙'],'一台故障就不再分配給它',['','a','']]],
['名稱解析',['電腦上的 hosts 檔可以手動指定名稱對應的 IP。','它的優先順序在 DNS 之前。','測試時很好用，但要記得改回來。'],'網站搬遷前，先在自己電腦的 hosts 檔把網站名稱指到新主機，測試沒問題再正式改 DNS。','測試完忘了把 hosts 檔改回來。幾個月後出現「只有這台連不到」的怪問題，查了很久才發現。','電腦要把名稱轉成位址時，會先看本機的 hosts 檔，沒有才去問 DNS。這讓你可以只改一台電腦的解析結果。也因為它優先於 DNS，惡意程式會修改它來把使用者導到假的網站。','hosts 檔優先於 DNS；測試完要改回來。',['f',['要解析名稱','先看 hosts 檔','沒有才問 DNS'],'「只有這台連不到」時，記得檢查 hosts 檔',['','a','']]]],

['DHCP',['DHCP 的位址範圍用完，電腦就拿不到 IP。常見原因是裝置變多，或租約太長。','處理方式是擴大範圍或縮短租約，也要留意有沒有異常的裝置大量索取位址。','DHCP 靠廣播運作，過不了路由器。伺服器和用戶端在不同網段時，要在路由設備上設定 DHCP 轉送。'],'新的樓層有獨立的網段，但 DHCP 伺服器在機房。在那個網段的閘道上設定 DHCP 轉送，指向 DHCP 伺服器，電腦就拿得到 IP 了。','看到電腦拿不到 IP 就重開 DHCP 服務。先看位址範圍的使用率，以及請求有沒有到達伺服器。','電腦還沒有 IP 的時候，只能用廣播的方式詢問，而廣播只在同一個網段內有效。轉送功能是由閘道代替電腦，把這個請求以一般的封包送到指定的伺服器，再把答案帶回來。','位址用完：擴大範圍或縮短租約；跨網段要設 DHCP 轉送。',['f',['電腦廣播｜索取 IP','閘道｜DHCP 轉送','另一個網段的｜DHCP 伺服器','配發 IP'],null,['','a','','']]],
['DNS',['內部 DNS 查不到的外部網域，會轉送給上游的 DNS 伺服器。上游故障時會出現「內部正常、外部全部不通」。','PTR 紀錄是用 IP 反查名稱，郵件伺服器常會檢查它。','要切換 IP 之前，先把 TTL 調短，切換完成後再調回來。'],'下週要把網站換到新的 IP。本週先把 TTL 從一天改成五分鐘。切換當天改了紀錄，五分鐘後所有人都連到新的位址。','切換當天才改紀錄，TTL 還是一天。接下來的二十四小時內，有些人連到新主機、有些人還連到舊主機。','TTL 的調整本身也要等舊的 TTL 過期才會生效，所以必須提前做。這個順序是：先縮短 TTL 並等它生效，再改位址，最後把 TTL 調回來，減少查詢的負擔。','切換 IP 前先調短 TTL；上游 DNS 掛了外網全掛。',['f',['提前調短 TTL','等舊 TTL 過期','切換 IP','再把 TTL 調回'],null,['a','','','']]],
['時間同步',['NTP 的階層（Stratum）數字，代表離標準時間來源有幾層。','數字愈小愈接近來源。','內部通常設幾台向外部校時，其他設備再向這幾台校時。'],'兩台內部時間伺服器向外部的來源校時，全公司的伺服器和網路設備都向這兩台校時。','每一台設備各自連到外部校時。這樣每台設備都要能連外，而且彼此的時間可能有微小的差異。','時間的準確度從來源一層一層往下傳遞，每多一層會多一點誤差。內部設置自己的時間伺服器，可以讓所有設備參照同一個來源，彼此的時間一致，而且只有少數幾台需要連到外部。','內部設時間伺服器，其他設備向它校時。',['f',['外部標準｜時間來源','內部時間伺服器','所有內部設備'],'階層數字愈小，離來源愈近',['','a','']]],
['Proxy',['有些內部系統經過 Proxy 反而連不上。','解決方式是設定例外清單，讓連往內部位址的連線不經過 Proxy。','用自動設定檔集中管理例外，比一台一台手動設定可靠。'],'用自動設定檔指定：內部網段和內部網域直接連線，其他的才經過 Proxy。新增內部系統時只要更新這一個檔案。','每台電腦手動設定例外清單。有的有設、有的沒設，新增系統時還要每台去改。','Proxy 是設計來處理對外連線的。內部系統的流量送到 Proxy，它可能不認得內部的名稱、沒有路由可以回到內部，或是多繞一圈造成問題。所以要明確區分哪些連線該經過它。','內部位址不走 Proxy；例外用自動設定檔集中管理。',['c',[['對外的連線','經過 Proxy'],['內部的位址','直接連線'],['管理方式','自動設定檔｜集中維護','a']]]],
['負載平衡',['使用者登入後，下一個請求被分到另一台伺服器，那台不認得他，就變成未登入。','解法一是連線黏著：同一位使用者固定分配到同一台。','解法二是把登入狀態存放在共用的地方，任何一台都讀得到。後者是比較好的長期做法。'],'把登入狀態改存到共用的快取服務。之後任何一台伺服器都可以處理任何使用者的請求，要增減伺服器也不會讓人被登出。','只靠連線黏著。那一台伺服器故障或重啟時，分配到它的使用者全部被登出；流量也可能分配不均。','負載平衡的前提是每一台伺服器都可以互相替代。如果伺服器在自己的記憶體裡記著某位使用者的狀態，它就不能被替代了。把狀態移到伺服器之外，才能真正自由地分配流量和增減主機。','登入狀態放共用的地方，任何一台都能處理。',['c',[['連線黏著','固定分到同一台｜那台壞了就被登出'],['狀態放共用處','任何一台都能處理｜好擴充','a']]]]],
2:[
['可用性',['DNS 是所有服務的前提。','內部只有一台 DNS 伺服器的話，它一故障，所有依賴名稱的服務都連不上。','至少要兩台，用戶端也要設定兩個以上的 DNS 位址。'],'DNS 伺服器當機。所有的伺服器其實都還在運作，但使用者什麼都連不上，因為名稱無法解析。','投入很多資源做應用系統的高可用，DNS 卻只有一台。應用系統的備援完全發揮不了作用。','幾乎所有的連線第一步都是把名稱轉成位址。這一步失敗，後面的系統再健全也沒有用。DNS 是其他所有服務共同依賴的東西，它的可用性是整體可用性的上限。','DNS 至少兩台，用戶端也要設兩個位址。',['c',[['只有一台 DNS','它壞了｜所有服務都連不上','w'],['兩台以上','用戶端設定｜兩個以上的位址']]]],
['安全',['DNS 幾乎在所有的網路都被放行，所以常被用來當成隱蔽的通道。','攻擊者把資料藏在 DNS 查詢裡偷偷傳出去。','偵測的方法是監控異常的查詢量，以及超長或看起來像隨機字串的網域名稱。'],'一台電腦一小時內對同一個網域發出上萬次查詢，每次查詢的子網域都是一長串沒有意義的字元。這是典型的 DNS 通道。','「DNS 只是查名稱，不需要監控」。它是少數幾乎不會被防火牆擋下的對外通道。','查詢的名稱會一路被轉送到負責那個網域的伺服器。攻擊者只要控制一個網域，就能從查詢的名稱裡讀到資料。正常的查詢名稱是有意義的、數量有限的，藏有資料的查詢則又長又亂、而且數量龐大。','DNS 會被拿來偷傳資料；看查詢量和超長、隨機的名稱。',['f',['把資料藏進｜查詢的名稱','DNS 查詢｜幾乎都被放行','送到攻擊者｜控制的網域'],'徵兆：查詢量暴增、名稱又長又亂',['w','','w']]],
['防護',['DNS 過濾是擋下對已知惡意網域的查詢。','查不到位址，連線就不會發生。','成本低、涵蓋的範圍廣，但不能取代其他的防護。'],'員工點了釣魚信的連結。瀏覽器查詢那個網域時，DNS 過濾服務回覆封鎖頁面，連線沒有建立。','以為有 DNS 過濾就夠了。它只認得已經被列為惡意的網域，新的網域或直接用 IP 連線的就擋不到。','大部分的惡意活動都需要先解析一個網域名稱：釣魚網站、惡意程式的下載點、中繼站。在這一步擋下，所有使用這台 DNS 的設備都受到保護，不需要在每台設備上安裝任何東西。','DNS 過濾在解析這一步就擋；便宜又廣，但不是全部。',['f',['查詢惡意網域','DNS 過濾｜比對清單','不回覆位址','連線不會發生'],null,['w','a','','']]],
['DHCP',['兩台 DHCP 伺服器要互為備援時，不能各自獨立配發同一個範圍。','否則會發出重複的位址。','要使用容錯機制讓兩台同步租約資訊，或是把位址範圍分割給兩台。'],'兩台 DHCP 伺服器設定容錯，共同管理同一個範圍並即時同步租約。其中一台故障，另一台繼續服務，而且知道哪些位址已經配出去了。','兩台設定相同的範圍但沒有同步。兩台各自記錄自己配出去的位址，把同一個位址配給了兩台不同的電腦。','DHCP 伺服器靠自己的紀錄來避免重複配發。兩台之間如果不交換這份紀錄，各自都以為那個位址還沒有人用。所以備援要嘛讓它們共享紀錄，要嘛讓它們管理互不重疊的位址。','DHCP 備援要同步租約或分割範圍，否則會重複發位址。',['c',[['各發同一範圍｜不同步','發出重複的位址','w'],['容錯機制','兩台同步租約','a'],['分割範圍','兩台管不同的位址']]]],
['時間同步',['內部要有自己的時間來源階層。','好處是所有設備的時間一致、可以控管，而且不必讓每台設備都能連到外部。','網域環境中，成員向網域控制站校時，最上層的再向可信的外部來源校時。'],'只有擔任最上層角色的網域控制站向外部校時，其他的網域控制站向它校時，所有成員電腦和伺服器再向網域控制站校時。','伺服器各自設定不同的外部時間來源。彼此的時間有落差，紀錄對不起來，有些驗證也偶爾失敗。','對內部的運作來說，設備之間「彼此一致」比「和世界標準完全一致」更重要，因為驗證和紀錄比對看的是相對的時間。建立單一的階層可以保證一致，也減少需要對外開放的連線。','內部建時間階層：最上層對外，其他層層往下。',['f',['可信的｜外部來源','最上層的｜網域控制站','其他｜網域控制站','成員電腦｜和伺服器'],null,['','a','','']]],
['負載平衡',['負載平衡器的健康檢查，如果只檢查連接埠有沒有開，是不夠的。','服務可能連接埠有開，但實際上已經無法正常回應。','要檢查應用層的實際回應，例如請求一個會確認後端相依狀態的頁面。'],'應用程式的資料庫連線失效了，但程式本身還在執行，連接埠是開的。改成請求一個會實際查詢資料庫的健康檢查頁面之後，這台就會被正確地判定為異常並移出。','只檢查連接埠。負載平衡器持續把使用者分配到一台其實已經無法提供服務的伺服器。','連接埠有開只代表程式還在執行。程式可能卡住、可能連不到它需要的資料庫或其他服務。健康檢查應該回答的問題是「這一台現在能不能正確地服務使用者」。','健康檢查要查應用層的實際回應，不是只看埠有沒有開。',['c',[['只檢查連接埠','埠開著｜服務可能已失效','w'],['檢查實際回應','確認後端相依｜也正常','a']]]],
['憑證',['在負載平衡器或代理伺服器上做 TLS 終結，管理上最容易出事的是憑證到期。','憑證到期沒有人更新，使用者就會看到安全性警告或無法連線。','到期日要納入監控，能自動更新的就自動化。'],'監控系統檢查所有對外憑證的到期日，到期前三十天開始告警；可以自動更新的憑證都設定成自動更新。','用行事曆提醒負責的人。那個人離職或請假，憑證就在沒有人注意的情況下過期，服務在假日中斷。','憑證的有效期限是固定的，到期的那一刻服務就會出問題，而且這件事完全可以預期。它之所以還是經常發生，是因為更新是一件隔很久才做一次的事，很容易被遺忘。把它交給監控和自動化才可靠。','憑證到期要納入監控，能自動更新就自動化。',['f',['盤點所有憑證','監控到期日','到期前告警','盡量｜自動更新'],null,['','a','','a']]],
['DNS',['對外公開的 DNS 區域和內部的區域，不要用同一台伺服器、同一份資料。','否則內部的主機名稱和位址會被外部查到。','內部的命名常常透露系統的用途和架構，是攻擊者偵察的好材料。'],'外部的人查得到公司內部有名為財務資料庫、備份主機、測試環境的主機和它們的位址，等於拿到一份內部的地圖。','為了管理方便，把所有紀錄放在同一個區域。內部的資訊就這樣公開在網際網路上。','攻擊者第一步是了解目標。內部主機的名稱會告訴他有哪些系統、哪些可能比較重要、哪些是測試用而可能比較鬆散的。內外分開之後，外部只查得到真正需要公開的那幾筆紀錄。','內部和對外的 DNS 區域要分開，內部名稱不外露。',['c',[['內外同一份','內部主機名稱｜被外部查到','w'],['內外分開','外部只看得到｜需要公開的紀錄']]]]],
3:[
['架構',['跨多個據點的 DNS 架構，核心考量是各據點可以就近解析。','而且廣域網路中斷時，據點內部仍然能運作。','所以各據點要有自己的 DNS 伺服器，並且有當地需要的資料。'],'分公司和總部之間的線路中斷。因為分公司有自己的 DNS 伺服器，分公司內部的檔案伺服器和印表機照常可以使用。','所有據點都指向總部的 DNS。線路一中斷，分公司連自己辦公室裡的設備都找不到。','線路中斷時，據點內部的設備之間其實還連得到，但如果名稱解析要靠遠端，它們就無法找到彼此。把解析的能力放到各個據點，可以讓每個據點在失去對外連線時仍然獨立運作。','各據點要能就近解析，線路斷了內部還能運作。',['c',[['全部指向總部','線路中斷｜據點內部也停擺','w'],['各據點有 DNS','線路中斷｜內部照常運作']]]],
['安全',['DNSSEC 解決的問題是確保查詢到的結果沒有被偽造或竄改。','它提供的是來源驗證和完整性。','它不提供機密性，查詢的內容還是看得到。查詢內容的加密是另一類技術。'],'啟用 DNSSEC 之後，解析器會驗證每一筆回應的數位簽章，簽章不對的回應會被丟棄。','以為 DNSSEC 會把 DNS 查詢加密，別人就看不到你查了什麼。它做的是簽章，不是加密。','傳統的 DNS 沒有辦法確認答案真的來自負責那個網域的伺服器，攻擊者可以搶先送出假的答案，把使用者導到別的地方。DNSSEC 讓網域的擁有者為紀錄簽章，收到答案的一方就可以驗證。','DNSSEC 驗證答案是真的；不加密。',['c',[['DNSSEC 提供','來源驗證｜完整性','a'],['DNSSEC 不提供','機密性（加密）','off']]]],
['加密 DNS',['瀏覽器可以自行使用加密的 DNS（例如 DoH），連到外部的解析服務。','這會繞過公司內部的 DNS 過濾和監控。','因應方式是用政策統一管理瀏覽器的設定，或是提供企業自己的加密解析服務。'],'公司用管理政策把瀏覽器的加密 DNS 設定指向公司自己的解析服務，保留了過濾和紀錄，同時查詢也有加密。','沒有注意到瀏覽器的這個功能。DNS 過濾明明有設定，卻擋不到某些使用者的連線，因為他們的查詢根本沒有經過公司的 DNS。','加密 DNS 是把查詢包在一般的網頁加密連線裡，看起來和普通的上網流量一樣，網路設備看不出來也無法攔截。它保護了使用者的隱私，但也讓原本依賴 DNS 的企業防護失去作用。','瀏覽器自己用加密 DNS 會繞過公司的過濾；要用政策統一管理。',['f',['瀏覽器自行｜使用加密 DNS','查詢不經過｜公司的 DNS','過濾和監控｜失效'],'用政策統一設定，或提供企業自己的加密解析',['','w','w']]],
['全域負載平衡',['用 DNS 來做全球或多站的流量導向（GSLB），是依查詢的來源回覆不同站點的位址。','限制是受到快取和 TTL 的影響，切換不是即時的。','有些用戶端和中間的解析器不遵守 TTL，關鍵的服務要搭配其他機制。'],'主站故障，GSLB 把名稱改指向備援站。TTL 是一分鐘，大部分使用者一分鐘內切換過去，但有一部分使用者過了半小時還連到舊的位址。','以為 DNS 的切換是即時的，把它當成唯一的備援機制。','DNS 的答案會被各個層級暫存：使用者的電腦、瀏覽器、業者的解析器。修改紀錄之後，要等所有的暫存都過期才會全部生效，而其中有些並不照規定的時間過期。這是 DNS 本身的特性，無法由服務的提供者控制。','用 DNS 導流受快取影響，切換不是即時的。',['c',[['優點','依來源導向｜不同站點'],['限制','受快取和 TTL 影響｜有些解析器不遵守','w']]]],
['位址管理',['IP 位址、DNS、DHCP 的資料分散在不同的地方，規模變大後一定會不一致。','後果是位址衝突、過期的 DNS 紀錄、沒有人知道用途的網段。','做法是導入整合的位址管理（IPAM），讓三者的資料保持一致。'],'導入 IPAM 之後，配發一個位址時會同時建立 DNS 紀錄和 DHCP 保留；回收時三者一起移除。','用試算表記錄位址的使用。每個人各有一份，更新不即時，查到的資訊不知道是不是最新的。','這三種資料描述的是同一件事：哪個位址給了誰、叫什麼名字。分開維護時，一個異動要改三個地方，只要漏掉一個就產生不一致。整合之後，一次異動自動反映到三者。','IP、DNS、DHCP 的資料要整合管理，才不會不一致。',['f',['配發位址','同時建立｜DNS 紀錄','同時建立｜DHCP 保留','回收時｜三者一起移除'],null,['a','','','']]],
['相依',['規劃災難復原的順序時，DNS、DHCP、時間同步要排在最前面。','因為其他的服務都依賴它們。','接著是驗證服務，再來才是應用系統。'],'復原演練的第一步先把 DNS 和時間伺服器恢復，再恢復網域控制站，然後才是資料庫和應用系統。','依業務的重要性排序，先恢復最重要的應用系統。結果它起不來，因為找不到 DNS、驗證服務也還沒有恢復。','每個系統啟動時都需要一些基礎的服務已經在運作：要能解析名稱、要能驗證身分、時間要正確。這些基礎服務彼此之間也有相依關係。復原的順序要依相依關係來排，而不是依業務的重要性。','復原順序：DNS、DHCP、時間同步最先，其他服務都靠它們。',['f',['DNS、DHCP｜時間同步','驗證服務','資料庫','應用系統'],'依相依關係排序，不是依業務重要性',['a','','','']]],
['零信任',['傳統的上網代理伺服器放在公司的網路裡。','遠距工作和雲端服務普及之後，流量不再經過公司的網路。','管控的位置要移到雲端或端點，所以出現了把代理、過濾和存取控制放在雲端的服務模式。'],'在家工作的員工直接連到雲端服務，完全沒有經過公司的 Proxy。改用雲端的安全閘道之後，不管人在哪裡，流量都先經過它。','要求所有在外的員工先連 VPN 回公司，再從公司的 Proxy 出去。流量繞了一大圈，速度慢，VPN 的負擔也很重。','Proxy 的前提是所有人都在公司的網路裡、所有對外流量都經過同一個出口。當使用者和服務都在公司外面時，把流量拉回公司只是為了讓它經過一台設備。把管控的功能放到流量本來就會經過的地方，才是合理的做法。','人和服務都在外面時，管控點要移到雲端或端點。',['c',[['傳統 Proxy','放在公司網路｜流量要繞回來','off'],['雲端的安全閘道','不管人在哪｜流量都先經過它','a']]]],
['治理',['DNS 紀錄長期只增加不清理，會留下指向已經不存在的資源的紀錄。','別人取得那個資源之後，就可以冒用你的子網域，稱為子網域接管。','DNS 紀錄要跟著資源的生命週期一起清理。'],'公司兩年前用過一個雲端服務，在 DNS 上有一筆紀錄指向它。服務停用了但紀錄沒有刪。有人在那個雲端平台註冊了相同的名稱，就在公司的子網域上放了一個釣魚頁面。','「留著舊紀錄沒有壞處」。指向不存在資源的紀錄，等於把那個子網域的控制權留給第一個去註冊的人。','DNS 紀錄只是說「這個名稱指向那裡」，它不知道那裡的東西還是不是你的。雲端上的資源名稱在釋出之後，別人可以重新註冊。這時候你的紀錄就指向了別人控制的內容，而瀏覽器和使用者看到的是你的網域。','停用資源時要一起刪 DNS 紀錄，避免子網域被接管。',['f',['停用雲端資源','DNS 紀錄沒刪','別人註冊｜同一個名稱','冒用你的｜子網域'],null,['','w','w','w']]]]};
// ===== 進階專科重點卡：資料庫與資料平台路線 =====
LEARN.dba={0:[
['查詢調校',['慢查詢紀錄會記下執行時間超過設定值的 SQL。','它是調校的依據。','調校要從最花時間、最常執行的查詢下手。'],'打開慢查詢紀錄一週後統計：有一句查詢每天執行兩萬次、每次三秒。先處理這一句，整體的負載就下降了一半。','憑感覺猜哪一句慢，或是看到哪一句就改哪一句。花了很多時間，改的卻不是真正造成負擔的查詢。','資料庫每天執行成千上萬種查詢，其中只有少數幾種佔了大部分的資源。沒有紀錄就不知道是哪幾種。先量測、再針對影響最大的下手，效果最明顯。','調校先看慢查詢紀錄，從最花時間、最常執行的下手。',['f',['開啟慢查詢紀錄','統計哪些｜最花時間','從影響最大的｜開始調校'],null,['a','','']]],
['權限',['人登入用的帳號和程式連線用的帳號要分開。','這樣才能分辨一個操作是誰做的。','權限也可以各自只給需要的。'],'開發人員用自己的個人帳號查詢資料，權限是唯讀；應用程式用它專屬的帳號。紀錄上可以清楚看出每一個操作是人做的還是程式做的。','大家都用應用程式的那一組帳號登入資料庫。紀錄上所有的操作都是同一個帳號，出事時無從追查，而且那組密碼很多人都知道。','稽核的基礎是每一個操作都能對應到一個負責的對象。帳號共用會讓這個對應消失。另外，人和程式需要的權限通常不同，分開之後才能各自限縮到最小。','人和程式的資料庫帳號要分開。',['c',[['共用程式帳號','分不出是誰做的｜密碼很多人知道','w'],['帳號分開','可以追查｜權限各自最小']]]],
['備份還原',['備份檔不能只放在資料庫所在的同一台主機上。','主機故障或被加密時，備份會一起消失。至少要有一份在別的機器，最好還有一份離線或異地。','交易紀錄檔一直變大，最常見的原因是沒有做交易紀錄的備份。'],'資料庫主機的磁碟被交易紀錄檔塞滿。原因是這個資料庫設定為保留完整紀錄，卻從來沒有排交易紀錄的備份。排上之後空間就可以重複使用了。','備份放在同一台主機的另一個資料夾，覺得這樣就有備份了。這只能防誤刪，防不了主機本身出事。','備份要防的是原本的資料不見了。如果造成資料不見的原因（硬體故障、勒索軟體、機房事故）同時也會影響到備份，這份備份就沒有意義。在需要保留完整紀錄的模式下，紀錄要備份之後空間才會釋放。','備份不放同一台主機；紀錄檔一直長是因為沒備份紀錄。',['c',[['備份放同一台','主機出事｜一起消失','w'],['至少一份在別處','最好還有離線或異地','a'],['紀錄檔一直變大','沒有排｜交易紀錄的備份','w']]]],
['結構變更',['在很大的資料表上新增欄位或索引，可能會長時間鎖住資料表。','要安排在離峰時段，並且先在複本上測試需要多久。','結構的變更要寫成腳本，放進版本控制，經過審查再執行。'],'要在幾千萬筆的表上加索引。先在測試環境的複本上執行，量出需要四十分鐘，於是排在週日凌晨執行。變更的腳本經過同事審查。','在上班時間直接對正式資料庫執行。資料表被鎖住，所有用到它的功能都卡住。','結構變更在小表上是瞬間完成的，所以很容易忽略它在大表上的影響。手動執行的變更沒有紀錄、無法重現，測試環境和正式環境的結構很快就會不一致。','大表的結構變更：先測要多久、排離峰、腳本化並審查。',['f',['寫成腳本｜進版本控制','在複本上｜測試要多久','審查','排離峰執行'],null,['','a','','']]],
['複寫與高可用',['大型的報表查詢會讀取大量資料，和線上交易搶資源。','常見的解法是把報表查詢導到唯讀的複本。','這叫讀寫分離。'],'月底跑報表時線上交易變得很慢。建立一台唯讀複本，把報表系統指向它之後，線上交易不再受影響。','讓報表和交易都連到同一台資料庫，然後不斷地升級硬體。兩種負載的特性不同，放在一起會互相干擾。','線上交易是大量、快速的小操作；報表是少量、長時間的大範圍讀取。報表會佔用記憶體、磁碟讀寫，有時還會持有鎖。把它們分到不同的主機，各自就不會影響對方。','報表導到唯讀複本，不跟線上交易搶資源。',['c',[['主要節點','線上交易｜（寫入和即時讀取）'],['唯讀複本','報表查詢','a']]]],
['資料保存',['資料庫裡超過保存期限的資料，要依規定歸檔或刪除。','並且留下處理的紀錄。','過期的個資繼續留著，只有風險沒有用處。'],'每年依資料保存規定，把超過期限的客戶資料刪除，執行的範圍、日期和人員都留下紀錄。','資料只進不出，認為「留著也沒差」。資料庫愈來愈大、愈來愈慢，外洩時受影響的範圍也愈大。','個資法要求蒐集的目的消失或期限屆滿之後，要刪除或停止利用。從技術的角度，資料量也直接影響備份的時間、查詢的效能和儲存的成本。','過期資料要歸檔或刪除，並留紀錄。',['f',['超過保存期限','依規定｜歸檔或刪除','留下處理紀錄'],null,['','a','']]]],
1:[
['權限',['只用來產生報表的帳號，只給需要的資料表或檢視表的讀取權限。','報表只需要讀取。','用檢視表還可以進一步只開放需要的欄位，把個資欄位排除在外。'],'建立一個不包含身分證字號和電話欄位的檢視表，報表帳號只能讀這個檢視表，讀不到原始的資料表。','為了方便給報表帳號整個資料庫的讀取權限。這個帳號的密碼外洩，或報表工具有漏洞，全部的資料都可以被讀走。','資料庫帳號的權限決定了它被濫用時的最大損害。把報表帳號限制在它真正需要的欄位，即使出事，敏感的欄位也不在它能接觸的範圍內。','報表帳號只給唯讀，並用檢視表排除個資欄位。',['c',[['整個資料庫可讀','出事時｜全部被讀走','w'],['只讀檢視表','敏感欄位｜不在範圍內','a']]]],
['備份還原',['備份檔的加密金鑰，不能和備份檔放在一起。','金鑰要和資料分開保管，而且金鑰本身也要備份。','還原演練要驗證：資料庫開得起來、資料筆數和內容正確、應用程式連得上。'],'還原演練時，除了看還原指令成功，還實際查詢幾張主要資料表的筆數、讓應用程式連上去操作，並記錄整個過程花了多久。','還原的指令顯示成功就認定演練通過。指令成功只代表檔案寫回去了，不代表資料是完整可用的。','加密把保護資料的問題變成保護金鑰的問題：拿到金鑰的人就能讀取，弄丟金鑰的人永遠打不開。還原演練的目的則是確認「真的出事時救得回來」，這要以應用程式能正常運作為標準。','金鑰和備份分開放；還原要驗證到應用程式連得上。',['c',[['金鑰和備份放一起','等於沒加密','w'],['金鑰分開保管','而且金鑰也要備份'],['還原驗證','開得起來｜資料正確｜應用程式連得上','a']]]],
['索引',['資料不斷新增、修改、刪除之後，索引會變得破碎。','統計資訊也會和實際的資料分布不一致。','所以要定期做索引維護和更新統計資訊，否則查詢效能會慢慢變差。'],'系統「什麼都沒改卻愈來愈慢」。檢查後發現統計資訊已經半年沒更新。排入每週的維護作業之後恢復正常。','只在出問題時才想到維護。效能是逐漸變差的，不容易察覺，等到明顯時已經累積很久了。','索引是排好順序的結構，資料異動會在裡面留下空隙和零散的頁面。資料庫決定怎麼執行查詢，靠的是對資料分布的估計，這個估計來自統計資訊。兩者都會隨著資料的變動而偏離實際。','索引和統計資訊要定期維護，不然會愈來愈慢。',['f',['資料持續異動','索引破碎｜統計失準','查詢慢慢變慢','定期維護'],null,['','w','w','a']]],
['監控',['監控資料庫不能只看 CPU 和記憶體。','更能提早發現問題的是：連線數、鎖定等待的時間、空間的成長、慢查詢的數量。','這些是出事之前的徵兆。'],'監控顯示鎖定等待的時間在過去一週逐漸變長，在使用者還沒有抱怨之前，就找到一支新上線的程式持有鎖的時間太久。','只設定 CPU 和記憶體的告警。資料庫因為連線數到達上限而無法連線時，這兩項都還很正常。','CPU 和記憶體是所有主機共通的指標，反映不出資料庫特有的問題。連線用完、互相等待鎖、空間不足，是資料庫最常見的故障原因，而它們在發生之前都有可以觀察到的趨勢。','資料庫要監控連線數、鎖等待、空間成長、慢查詢。',['c',[['連線數','快到上限了嗎'],['鎖定等待','等待時間變長了嗎'],['空間成長','成長速度加快了嗎'],['慢查詢','數量增加了嗎']]]],
['資料異動安全',['一次要更新幾百萬筆資料時，要分批執行。','每一批提交一次。','單一個巨大的交易會長時間鎖住資料、撐爆交易紀錄，失敗時回復也要很久。'],'要更新 500 萬筆。寫成每次處理一萬筆並提交的迴圈，中間可以隨時暫停，其他使用者幾乎沒有感覺。','一句 UPDATE 直接更新 500 萬筆。執行了一個小時還沒結束，這段時間相關的資料都被鎖住；取消之後，回復又花了一個小時。','交易的保證是全部成功或全部復原，所以資料庫要為整個交易保留所有的變更紀錄，並且持有鎖直到結束。交易愈大，這些代價愈高。分成小批之後，每一批很快完成並釋放資源。','大量更新要分批、每批提交。',['c',[['一次全部','長時間鎖定｜紀錄暴增｜回復很久','w'],['分批執行','每批很快完成｜可以隨時停','a']]]],
['稽核',['要能回答「誰在什麼時候查過這張資料表」，需要啟用存取稽核。','一般的紀錄只記錄錯誤和登入。','稽核紀錄要針對敏感的資料表設定，並且妥善保存。'],'針對客戶資料表啟用查詢稽核，紀錄送到獨立的日誌系統。發生疑似外洩時，可以列出那段期間所有查過這張表的帳號。','以為資料庫預設就會記錄所有的查詢。預設的紀錄通常不包含「誰讀了什麼」。','記錄每一次讀取會產生大量的資料並影響效能，所以資料庫預設不這樣做。要追蹤讀取行為，必須明確指定要稽核哪些物件。這件事要在平時就設定好，事後才有資料可以查。','要查「誰看過」，得另外啟用敏感資料表的存取稽核。',['c',[['一般紀錄','錯誤和登入','off'],['存取稽核','誰、何時｜讀了哪張表','a']]]],
['升級',['資料庫軟體的版本過了原廠的支援期限，新發現的漏洞就不會再有修補。','資料庫放的是最重要的資料，風險特別高。','升級需要測試應用程式的相容性，要提早規劃。'],'資料庫的版本一年後終止支援。現在就開始盤點有哪些應用程式使用它、建立測試環境、排定升級的時程。','等到終止支援之後才開始評估。升級需要好幾個月的測試，這段期間資料庫是在沒有修補的狀態下運作。','資料庫升級牽涉到所有使用它的應用程式，每一個都要驗證在新版本上是不是正常。這需要的時間遠比升級本身長。終止支援的日期是事先公布的，所以可以也應該提早安排。','資料庫版本終止支援前就要規劃升級。',['f',['確認終止｜支援的日期','盤點使用它｜的應用程式','測試相容性','排定升級'],null,['a','','','']]]],
2:[
['鎖定與並行',['同一個交易裡，同一筆資料查了兩次，結果不一樣，叫不可重複讀。要避免它，要提高交易的隔離等級。','隔離等級愈高，交易之間愈看不到彼此，但鎖定和衝突也愈多。','樂觀鎖定是不先鎖資料，更新時檢查版本，發現被別人改過就失敗重來。'],'兩個人同時編輯同一筆資料。用版本欄位做樂觀鎖定：後存檔的人會收到「資料已被更改，請重新載入」，而不是默默蓋掉前一個人的修改。','為了保險把所有交易都設成最高的隔離等級。系統的鎖定和死結大幅增加，效能明顯下降。','隔離等級是在「資料的一致性」和「同時能處理多少交易」之間做選擇。衝突不常發生時，先鎖住資料是浪費；樂觀鎖定假設不會衝突，只在真的發生時才處理，所以效能好很多。','隔離等級愈高愈一致也愈慢；衝突少時用樂觀鎖定。',['c',[['提高隔離等級','更一致｜鎖定和衝突變多'],['樂觀鎖定','不先鎖｜更新時比對版本','a']]]],
['索引',['複合索引是建立在多個欄位上的索引，欄位的順序很重要。','查詢條件沒有用到第一個欄位，就無法利用這個索引的主要效果。','覆蓋索引是查詢需要的欄位索引裡都有，不必再回資料表讀取。'],'在（部門、到職日）上建了複合索引。用部門查、或用部門加到職日查都很快；只用到職日查就用不上。','建了複合索引就以為這幾個欄位任意組合都會變快。','複合索引像電話簿：先依姓排序，同姓的再依名排序。知道姓就能直接翻到那一區；只知道名，就得從頭翻到尾。覆蓋索引則省掉了「依索引找到位置之後，再回資料表讀完整資料」這一步。','複合索引看欄位順序；覆蓋索引不用回表。',['c',[['條件有第一個欄位','可以利用索引','a'],['只有第二個欄位','用不到主要效果','w'],['覆蓋索引','需要的欄位都在索引裡｜不用回表']]]],
['複寫與高可用',['唯讀複本分擔的是讀取。','瓶頸如果在寫入，增加複本的幫助有限，因為寫入還是集中在主要節點。','要分散寫入，得把資料依某個鍵拆到多台（分片），或是調整架構，代價是複雜度高很多。'],'系統的寫入量已經超過單一主機的能力。加了三台複本之後讀取變快了，但寫入的瓶頸完全沒有改善。','「資料庫慢就加複本」。沒有先確認瓶頸是讀取還是寫入。','複寫的方式是所有的寫入先在主要節點完成，再把變更傳給複本。所以不管有多少台複本，每一筆寫入都還是由主要節點處理。要讓寫入也能分散，必須讓不同的資料由不同的主機負責。','複本分擔讀取；寫入的瓶頸要靠分片或改架構。',['c',[['瓶頸在讀取','加唯讀複本'],['瓶頸在寫入','複本沒幫助｜要分片或改架構','w']]]],
['備份還原',['完整備份加上多份交易紀錄備份，這些紀錄備份是一條鏈。','中間有一份損毀，就只能還原到那一份之前的時間點。','所以備份要驗證完整性，並且定期重新做完整備份，縮短鏈的長度。'],'每週做完整備份，每小時做紀錄備份。週四的某一份紀錄備份損毀，結果只能還原到那一份之前，之後的全部用不上。','很久才做一次完整備份，中間靠很長的紀錄備份鏈。鏈愈長，其中一份出問題的機率愈高，還原需要的時間也愈久。','每一份紀錄備份記錄的是「上一份之後」的變更，還原時要依序重播。少了中間的一份，後面的變更就失去了它們所依據的狀態，無法套用。','紀錄備份是一條鏈，斷一份後面全沒用；要驗證並定期重做完整備份。',['f',['完整備份','紀錄備份 1','紀錄備份 2｜（損毀）','紀錄備份 3｜（用不上）'],null,['a','','w','off']]],
['結構變更',['要在服務不停機的情況下修改欄位，可以用「擴充、遷移、收縮」的步驟。','先新增新的欄位，程式同時寫入新舊兩個欄位。','等所有程式都改用新欄位之後，再移除舊的。'],'要把欄位改名。第一步新增新欄位並同時寫入；第二步把舊資料搬過去、程式改成讀新欄位；第三步確認沒有任何程式使用舊欄位之後才刪除。','直接執行改名的指令。在程式更新完成之前，所有還在使用舊名稱的程式都會出錯。','程式和資料庫無法在同一瞬間一起更新，中間一定有新舊並存的時候。這個做法讓每一步完成之後，新版和舊版的程式都還能正常運作，任何一步出問題都可以退回。','不停機改欄位：先加新的、兩邊都寫、最後才刪舊的。',['f',['擴充：｜新增欄位','新舊欄位｜同時寫入','遷移：｜程式改用新欄位','收縮：｜移除舊欄位'],null,['a','','','']]],
['權限',['定期更換應用程式連資料庫的密碼，不能直接改。','還在使用舊密碼的程式會全部斷線。','做法是準備兩組帳號輪替，或是由密鑰管理系統讓程式動態取得密碼。'],'有甲、乙兩組帳號。應用程式目前使用甲。更換時先更新乙的密碼，把程式切換到乙，確認正常之後再更新甲的密碼備用。','因為更換會造成中斷，所以乾脆好幾年都不換。','密碼的變更在資料庫端是立即生效的，但所有使用這組密碼的程式無法在同一瞬間更新。用兩組帳號可以讓新舊重疊一段時間，程式可以分批切換。','換資料庫密碼不中斷：兩組帳號輪替，或用密鑰管理系統。',['f',['程式使用帳號甲','更新帳號乙｜的密碼','程式切換到乙','再更新甲備用'],null,['','a','','']]]],
3:[
['分散式資料庫',['CAP 定理說，分散式系統在網路分割發生時，只能在一致性和可用性之間選一個。','選一致性：拒絕服務，保證不會讀到不一致的資料。選可用性：繼續服務，但可能讀到舊的資料。','最終一致性是更新之後各節點可能短暫不同步，一段時間後會趨於一致。'],'按讚數用最終一致性，短時間內不同的人看到的數字略有不同沒有關係；帳戶餘額則必須選擇一致性。','把最終一致性當成缺點或優點。它是一種取捨，適不適合完全取決於業務能不能接受短暫的不一致。','節點之間的網路斷了，各邊無法得知對方有沒有新的寫入。這時候只有兩個選擇：停下來等，或是各自繼續。前者保住資料的正確，後者保住服務。這不是技術可以克服的限制，而是必須依業務的性質事先決定。','網路分割時：一致性和可用性只能選一個。',['c',[['選一致性','拒絕服務｜不會讀到錯的資料'],['選可用性','繼續服務｜可能讀到舊資料'],['最終一致性','短暫不同步｜之後會一致']]]],
['複寫與高可用',['兩個資料中心都可以寫入（多主架構）時，最難的問題是衝突：兩邊同時改了同一筆資料。','「以最後寫入的為準」會默默丟掉另一邊的修改。衝突的處理規則要在設計時決定，並取得業務單位的同意。','主要節點寫入、複本讀取的架構，會因為複寫延遲而讀不到自己剛寫的資料。'],'使用者送出修改後馬上重新整理，看到的是舊資料。解法是讓剛寫入的使用者，在接下來的幾秒內都從主要節點讀取。','採用多主架構卻沒有設計衝突的處理方式。資料被默默覆蓋，很久之後才被發現，已經無法還原。','複寫需要時間，在這段時間內，不同的節點有不同的資料。多主架構下兩邊可能各自接受了互相矛盾的修改，系統必須選擇保留哪一個。這個選擇是業務上的決定，因為它決定了哪一位使用者的修改會消失。','多主要先定衝突規則；讀寫分離會有「讀不到剛寫的」。',['c',[['多主架構','兩邊同時改同一筆｜要事先定衝突規則','w'],['複寫延遲','剛寫完馬上讀｜可能讀到舊的','w'],['常見解法','剛寫入的使用者｜短時間讀主要節點']]]],
['資料庫選型',['不同類型的資料庫是為不同的資料和查詢方式設計的。','選型要看資料的形狀和查詢的方式。','例如大量依時間寫入、查詢多半是某段時間的趨勢，適合用時序資料庫。'],'要儲存幾千個感測器每秒的讀數，查詢是「過去一週的平均值」。用時序資料庫，寫入和區間彙總都比一般的關聯式資料庫快很多，儲存空間也小得多。','不管什麼資料都用同一種資料庫，或是因為某種資料庫很流行就採用。','每一種資料庫都是針對特定的使用方式做了最佳化，也因此在其他方面做了犧牲。時序資料庫假設資料是依時間順序寫入、很少修改、查詢是一段區間，所以可以用特別的方式壓縮和儲存。','選資料庫看資料的形狀和查詢的方式。',['c',[['交易資料','關聯式資料庫'],['依時間的大量讀數','時序資料庫','a'],['彈性結構的文件','文件資料庫']]]],
['升級',['資料庫要跨大版本升級，又幾乎不能停機時，常見的做法是並行。','建立一套新版本的資料庫，用複寫把資料同步過去。','驗證之後把流量切過去，有問題還可以切回舊的。'],'新版本的資料庫和舊的並行運作兩週，資料持續同步。切換時只停機五分鐘。上線後發現一個問題，立刻切回舊的，沒有資料遺失。','直接在原本的主機上原地升級。升級失敗時，唯一的退路是從備份還原，停機時間以小時計。','原地升級是在唯一的一套系統上做不可逆的變更。並行的做法是讓新舊兩套同時存在，把「升級」變成「切換流量」。切換很快，而且舊的系統還完整地在那裡，可以隨時退回。','大版本升級：新舊並行、複寫同步、切換流量，可以退回。',['f',['建立新版本','複寫同步資料','驗證','切換流量｜有問題就切回'],null,['','','a','']]],
['資料治理',['一個欄位能不能開放給某個部門查詢，應該由資料的擁有者決定。','資料擁有者是負責這份資料的業務單位。','資料庫管理員是保管者，負責依決定去落實權限。'],'行銷部門想查詢客戶的消費紀錄。DBA 把申請轉給客戶資料的擁有者（業務部門主管）和法遵單位，核准之後才設定權限。','由 DBA 自己判斷可不可以給。DBA 不了解這份資料在業務和法規上的限制，也不應該承擔這個決定的責任。','資料能給誰用，取決於當初蒐集的目的、法規的限制和業務上的需要，這些是業務和法遵的判斷。DBA 有技術上的能力開放權限，但沒有決定的權責。把兩者分開，決定才有人負責。','資料給誰用由業務擁有者決定，DBA 負責落實。',['c',[['資料擁有者｜（業務單位）','決定能不能開放','a'],['DBA（保管者）','依決定｜設定權限']]]],
['成本',['依查詢量計費的雲端資料倉儲，費用是依掃描的資料量計算的。','帳單暴增時，先檢查有沒有查詢在掃描不必要的大量資料。','基本功是：使用分割區並在查詢中篩選、只選取需要的欄位、設定用量上限。'],'一句沒有加日期條件的查詢掃描了整張五年的資料表，單次就花了不少費用，而它被排程每小時執行一次。加上日期條件之後費用降到原本的百分之一。','沿用在自有主機上的習慣，隨意寫 <code>SELECT *</code> 和不加條件的查詢。在自有主機上只是慢一點，在依量計費的環境是直接變成帳單。','自有的主機是固定成本，查詢寫得不好只會讓它變慢。依量計費之後，每一次查詢都有價格，而且和掃描的資料量成正比。寫查詢的習慣直接影響費用。','依掃描量計費：篩選分割區、只選需要的欄位、設用量上限。',['c',[['篩選分割區','只掃需要的時間範圍'],['只選需要的欄位','不要 SELECT *'],['用量上限','避免單一查詢失控','a']]]]]};
LEARN.etl={0:[
['基礎',['ETL 是三個步驟：擷取、轉換、載入。','擷取是從來源把資料拿出來；轉換是整理成需要的樣子；載入是放進目的地。','它是把資料從業務系統搬到報表或分析環境的基本流程。'],'每天晚上從訂單系統擷取當天的訂單，轉換成統一的格式和代碼，再載入報表資料庫。','把 ETL 想成只是「複製資料」。中間的轉換才是最花工夫的部分，各系統的格式、代碼和定義都不一樣。','業務系統是為了處理每天的作業而設計的，資料的結構不適合拿來分析，而且通常分散在好幾個系統裡。ETL 把這些資料集中起來並整理成一致的樣子，後面的報表和分析才有辦法做。','ETL：擷取、轉換、載入。',['f',['擷取｜從來源取出','轉換｜整理成需要的樣子','載入｜放進目的地']]],
['資料清理',['同一位客戶有好幾筆、寫法略有不同，要做資料清理和去重複。','清理還包括：統一格式、補上或標記缺漏的值、修正明顯的錯誤。','資料品質的問題不在前面處理，後面的報表和分析都會是錯的。'],'「王小明」「王 小明」「Wang Xiaoming」其實是同一個人。清理時依身分識別欄位合併成一筆。','直接把來源的資料原封不動搬過去。報表上的客戶數比實際多、同一個人的消費被拆成好幾筆。','來源系統的資料是人輸入的，一定有不一致和錯誤。這些問題在單一筆交易時影響不大，但在彙總統計時會被放大，數字就不可信。在進入分析環境之前處理，只要處理一次。','資料要先清理、去重複，報表才可信。',['c',[['去重複','同一對象｜合併成一筆'],['統一格式','日期、代碼｜大小寫'],['處理缺漏','補上或標記']]]],
['排程',['從業務系統抽取資料會增加它的負載，要避開業務的尖峰時段。','步驟之間有先後相依時，要確認前一個步驟完成才執行下一個。','不能只靠固定的時間錯開。'],'抽取排在凌晨兩點；載入的步驟設定成「抽取成功之後才開始」，而不是固定排在三點。','抽取排兩點、載入排三點。某天抽取跑得比較久，三點時還沒完成，載入的是不完整的資料。','用時間錯開是假設每個步驟都會在預期的時間內完成，但資料量會成長、系統偶爾會變慢。讓後面的步驟由前面的成功來觸發，才能保證順序正確。','抽資料避開尖峰；下一步要等上一步成功才跑。',['c',[['固定時間錯開','上一步晚完成｜下一步拿到不完整的資料','w'],['依相依觸發','上一步成功｜才執行下一步','a']]]],
['來源保護',['從正式的業務資料庫抽取資料，使用的帳號只給唯讀權限。','抽取的程式寫錯，不應該有機會改壞來源系統。','也可以從唯讀複本抽取，連效能都不影響。'],'ETL 程式用的資料庫帳號只有讀取權限，而且連線的是唯讀複本。','為了方便沿用應用程式的帳號，它有寫入的權限。一支寫錯的轉檔程式把正式資料改掉了。','抽取資料只需要讀取。給了多餘的權限，就多了一種出錯的可能，而且出錯的地方是最重要的正式資料。把權限限制在唯讀，這類錯誤就不可能發生。','抽資料的帳號只給唯讀。',['c',[['有寫入權限','程式寫錯｜會改壞正式資料','w'],['只有唯讀','最多只是抽錯｜來源不受影響','a']]]],
['編碼',['匯入檔案後中文變成亂碼，最可能的原因是文字編碼不一致。','檔案是用一種編碼儲存的，讀取時卻當成另一種。','台灣的舊系統很多還在使用 Big5，新的系統多半用 UTF-8。讀檔時要指定正確的編碼。'],'舊系統匯出的 CSV 用預設方式開啟全是亂碼。讀取時指定編碼為 Big5 之後就正常了。','看到亂碼就以為檔案壞了，請對方重新產生。資料本身沒有問題，只是讀的方式不對。','電腦儲存的是數字，編碼是「哪個數字代表哪個字」的對照表。同樣的數字用不同的對照表解讀，會得到完全不同的字。檔案本身通常不會註明它用的是哪一種。','中文亂碼先查編碼：Big5 還是 UTF-8。',['c',[['Big5','台灣舊系統常用'],['UTF-8','現在的通用標準'],['亂碼','存和讀用了｜不同的編碼','w']]]],
['對應',['要把兩個系統的資料合在一起，最關鍵的前提是有可以對應的共同鍵值。','例如兩邊都有相同的客戶編號。','沒有可靠的共同鍵，就只能靠姓名這類會重複、會寫錯的欄位去猜。'],'會員系統和訂單系統都有會員編號，用它來合併資料，每一筆訂單都能準確地對應到會員。','用姓名和電話來比對。同名的人被合在一起，換了電話的人對不上。','合併資料的意思是「判斷兩筆紀錄指的是同一個對象」。這需要一個在兩邊都存在、不會重複、不會改變的識別值。姓名和電話都不符合這些條件。','合併資料靠共同的鍵值，不是靠姓名去猜。',['c',[['共同的編號','準確對應','a'],['姓名、電話','會重複｜會變、會寫錯','w']]]],
['監控',['排程執行的資料轉檔通常沒有人看著。','失敗的時候要自動通知負責的人。','最好連「沒有如期完成」也要通知。'],'轉檔失敗時自動發訊息給負責人；另外設定一個檢查：早上六點如果今天的資料還沒有產生，也發出通知。','沒有任何通知。轉檔失敗了，隔天早上主管打開報表是空的，才有人發現。','失敗的方式有兩種：程式回報錯誤，或是程式根本沒有跑、或卡住沒有結束。後者不會產生任何錯誤訊息，所以除了「失敗要通知」，還需要「該完成而沒有完成要通知」。','轉檔失敗要通知；沒有如期完成也要通知。',['c',[['失敗','自動通知負責人'],['沒有如期完成','也要通知','a']]]],
['驗證',['轉檔完成後，最基本的驗證是核對來源和目的兩邊。','比對資料的筆數，以及關鍵數字的總和（例如金額）。','沒有報錯不代表資料是對的。'],'來源有 15,203 筆、金額總和 482 萬；目的端只有 15,180 筆、479 萬。有 23 筆在過程中掉了，要去查原因。','程式顯示執行成功就當作沒問題。有些資料在轉換時被默默略過，沒有人知道。','轉檔的過程中有很多環節會讓資料遺失或重複：篩選條件寫錯、合併時對不上、格式不符被丟棄。這些通常不會造成程式錯誤。比對兩邊的總數是最簡單、也最有效的檢查。','轉完要對帳：筆數和金額總和要對得上。',['c',[['筆數','來源和目的｜要一致'],['關鍵數字的總和','例如金額總和｜要一致']]]]],
1:[
['載入策略',['全量載入是每次把所有資料重新處理一遍。','增量載入只處理上次之後有變動的資料。','資料量大時全量跑不完；增量比較快，但要有可靠的方法知道哪些資料變了。'],'訂單表有五千萬筆，每天新增或異動的只有三萬筆。用最後修改時間找出這三萬筆來處理，十分鐘就完成。','增量的判斷依據不可靠，例如來源的修改時間欄位並不是每次異動都會更新。有些變更就一直沒有被帶過來。','大部分的資料每天並沒有改變，重複處理它們是浪費。增量載入的困難在於「怎麼知道哪些變了」，包括被刪除的資料。這個判斷不可靠的話，兩邊的資料會逐漸不一致。','增量只處理有變動的；關鍵是可靠地知道哪些變了。',['c',[['全量載入','每次全部重來｜簡單但慢'],['增量載入','只處理變動的｜要能可靠判斷變動','a']]]],
['可靠性',['轉檔程式中途失敗再重跑，是很常發生的事。','程式要設計成可以安全地重跑：同一批資料跑兩次，結果和跑一次一樣。','做法例如先清除該批資料再載入，或是用鍵值來更新而不是直接新增。'],'載入某一天的資料之前，先刪除目的端那一天的資料。這樣不管重跑幾次，那一天的資料都只有一份。','程式只會「新增」。第一次跑到一半失敗，重跑之後，前半段的資料就重複了。','排程重複觸發、網路中斷、來源暫時無法連線，都會造成失敗和重跑。如果重跑需要人先手動清理，每次失敗都是一次容易出錯的人工作業。讓程式本身可以重複執行，失敗時的處理就只是「再跑一次」。','轉檔要能安全重跑：跑兩次結果一樣。',['c',[['只會新增','重跑就重複','w'],['先清除再載入｜或用鍵值更新','重跑幾次都一樣','a']]]],
['資料品質',['在轉檔流程中加入資料品質檢查，可以在問題資料進入報表之前就攔下來。','常見的檢查：必填欄位是不是空的、日期合不合理、數值在不在合理範圍內。','早一步發現，可以省下很多事後的解釋。'],'流程檢查出有三百筆訂單的金額是負數，把這批資料隔離並通知負責人，沒有讓它進入報表。','沒有任何檢查。錯誤的資料進入報表，主管在會議上發現數字不合理，之後對所有的報表都不再信任。','報表的可信度很容易失去、很難恢復。來源系統偶爾會產生有問題的資料，這無法完全避免。在流程中設檢查點，是讓問題在還沒有人看到之前就被發現。','在流程中檢查資料品質，問題資料不要進報表。',['c',[['必填欄位','是不是空的'],['日期','是不是合理'],['數值','在不在合理範圍']]]],
['架構',['分析和報表通常不直接在交易資料庫上執行，而是另外建立資料倉儲。','原因一是避免拖慢交易。','原因二是資料可以整理成適合分析的結構。'],'訂單系統的資料庫只處理線上交易。每天晚上資料被搬到資料倉儲，所有的報表和分析都在那裡執行。','直接在正式的交易資料庫上跑大型報表。月底結帳時，線上的交易跟著變慢。','交易系統的設計目標是快速處理單筆的新增和修改；分析的需求是跨大量資料做彙總。兩者對資料結構和資源的需求正好相反，放在一起會互相妨礙。','報表不在交易資料庫上跑，另外建資料倉儲。',['c',[['交易資料庫','快速的單筆讀寫'],['資料倉儲','大量資料的彙總分析','a']]]],
['資料模型',['資料倉儲常用事實表和維度表來組織資料。','事實表放可以加總的數值，例如銷售金額、數量。','維度表放描述用的屬性，例如日期、門市、商品。'],'銷售事實表的每一列是一筆銷售，有金額和數量，並連到日期、門市、商品三張維度表。要看「各門市每月的銷售額」就依門市和月份加總。','把所有欄位塞進一張很寬的大表，或是照搬交易系統的結構。查詢很難寫，也很慢。','分析的問題幾乎都是「依某些角度，加總某些數字」。把「數字」和「角度」分開放，這種查詢就可以用一致而簡單的方式表達。','事實表放數值，維度表放描述的屬性。',['c',[['事實表','可以加總的數值｜金額、數量'],['維度表','描述的屬性｜日期、門市、商品']]]],
['變更擷取',['變更資料擷取（CDC）是從資料庫的異動紀錄中，抓出新增、修改、刪除的資料。','比起每次比對整張表，它對來源系統的負擔小。','而且抓得到被刪除的資料。'],'CDC 讀取訂單資料庫的交易紀錄，每一筆異動在幾秒內就被送到資料倉儲，包括被刪除的訂單。','用「最後修改時間」來找變更的資料。被刪除的資料已經不在表裡，這個方法永遠找不到它們。','資料庫本來就會把每一筆異動寫進交易紀錄，用來確保資料不遺失。CDC 直接讀這份紀錄，所以不需要對資料表做任何查詢，也不會漏掉任何一種異動。','CDC 從異動紀錄抓變更，負擔小，也抓得到刪除。',['c',[['比對修改時間','抓不到刪除｜要查詢資料表','off'],['CDC','讀異動紀錄｜新增、修改、刪除都有','a']]]],
['資料血緣',['資料血緣記錄的是資料從哪裡來、經過哪些處理、被誰使用。','報表上的數字被質疑時，可以追回來源。','要修改某個欄位時，可以知道會影響到哪些下游。'],'主管問報表上的營收數字是怎麼算的。從血緣可以看到它來自哪兩個系統、經過哪些轉換步驟。','沒有任何紀錄。要回答「這個數字怎麼來的」只能去讀程式碼；要改一個欄位時，不知道有哪些報表會壞。','資料在很多個流程之間流動，每一個流程又產生新的資料。時間一久，沒有人記得一個欄位的來歷和去向。血緣把這些關係記錄下來，讓人可以往上追溯來源、往下評估影響。','血緣：資料哪裡來、怎麼處理、誰在用。',['f',['來源系統','轉換步驟','資料表','報表'],'往上追來源，往下看影響']],
['日期處理',['整合不同系統的日期資料，在台灣特別要注意民國年和西元年的轉換。','同一串數字可能有不同的意思，要先確認格式。','跨國的系統還要處理時區。'],'一個系統的日期欄位是「1130501」，代表民國 113 年 5 月 1 日；另一個系統是「20240501」。合併之前要先轉成同一種格式。','直接把字串當成日期解讀。民國年被當成西元年，日期差了 1911 年；或是排序的結果完全錯誤。','日期的寫法有很多種，而且同一種寫法在不同系統裡可能有不同的意義。欄位裡的值本身不會說明它用的是哪一種。必須向來源系統的負責人確認，而不是自己猜。','日期先確認是民國還是西元，再統一格式。',['c',[['民國年','1130501｜＝ 113 年 5 月 1 日'],['西元年','20240501'],['時區','跨國系統｜要統一']]]]],
2:[
['架構',['ETL 是先轉換再載入；ELT 是先把原始資料載入目的端，再在那裡轉換。','目的端的運算能力夠強時，ELT 比較有彈性。','而且原始的資料會保留下來。'],'原始資料先原封不動載入雲端資料倉儲，再用 SQL 在倉儲裡做轉換。之後轉換的邏輯要修改時，可以用保留的原始資料重新計算。','沿用舊的做法，在一台小的轉換主機上處理所有資料，而強大的資料倉儲只用來存放結果。','早期的資料倉儲運算能力有限又昂貴，所以要先在外面把資料整理好。現在的雲端資料倉儲可以處理大量的運算，把轉換放在裡面做，就不需要另外維護轉換用的主機。','ELT：先載入原始資料，再在目的端轉換。',['c',[['ETL','先轉換｜再載入'],['ELT','先載入原始資料｜再在目的端轉換｜原始資料保留','a']]]],
['排程',['資料流程之間有先後相依時，用固定時間錯開的方式排程是不可靠的。','上游延遲時，下游會用到不完整的資料。','應該用工作流程工具來表達相依關係，上游成功才觸發下游。'],'用工作流程工具把十幾個步驟的相依關係畫出來。某個步驟失敗時，依賴它的步驟自動不執行，修好之後可以從那個步驟接著跑。','每個步驟各自排一個時間，中間預留緩衝。資料量成長之後，緩衝不夠用，下游開始拿到不完整的資料。','用時間來排程是把相依關係藏在時間的間隔裡，沒有任何機制檢查它成不成立。明確地表達相依，系統才能在上游出問題時自動停下下游，也才看得出整個流程的全貌。','有相依的流程用工作流程工具，上游成功才觸發下游。',['f',['上游成功','觸發下游','上游失敗','下游不執行'],null,['a','','w','']]],
['結構變更',['來源系統新增或修改欄位，可能讓下游的轉檔壞掉。','降低衝擊的做法是：明確指定需要的欄位，不要用「全部欄位」。','並且監控來源結構的變化，和來源系統的負責人約定變更通知。'],'轉檔的查詢明確列出需要的十二個欄位。來源多了一個欄位，轉檔完全不受影響；同時結構監控發出通知，讓資料團隊知道有這個變動。','查詢寫 <code>SELECT *</code>。來源加了一個欄位，載入時欄位數對不上，整個流程失敗。','來源系統是別的團隊負責的，他們有自己的修改需求，不會想到下游有誰在使用。技術上讓流程不要依賴不需要的東西，流程上建立變更通知，兩者都要做。','明確指定欄位、監控來源結構、約定變更通知。',['c',[['SELECT *','來源一改就壞','w'],['明確列出欄位','多了欄位不受影響'],['約定變更通知','事先知道','a']]]],
['延遲資料',['有些資料會晚到，例如離線的裝置隔天才上傳。','處理上要允許回補，並讓彙總的結果可以重新計算。','要先決定「等多久」以及「晚到的要怎麼算」。'],'門市的離線收銀機隔天才上傳昨天的交易。流程會重新計算過去三天的彙總，所以昨天的營收數字會在隔天被更新。','每天只處理「今天收到的資料」並當成今天的。晚到的交易被算進錯誤的日期，或是完全沒有被算到。','資料發生的時間和系統收到它的時間不一定相同。報表通常要依發生的時間統計，所以晚到的資料會改變過去的數字。這個行為要事先定義並讓使用者知道。','晚到的資料要能回補、重算；先定好等多久。',['f',['資料晚到','回補到｜正確的日期','重新計算彙總','數字會被更新'],'要讓使用者知道近期的數字可能會變']],
['效能',['每晚的轉檔愈跑愈久，最先要檢查的是它是不是每次都在處理全部的歷史資料。','改成增量處理，以及把大表分割。','這通常比增加硬體有效。'],'轉檔從一小時變成六小時。檢查後發現它每天都重新計算五年來所有的資料。改成只處理最近三天之後，回到二十分鐘。','直接要求升級主機。資料持續成長，過幾個月又不夠用。','資料量每天都在增加，每次都處理全部資料的流程，執行時間會跟著無限增加。增量處理讓每次的工作量只和「一天的變動量」有關，不會隨著歷史資料的累積而變慢。','轉檔愈跑愈久：先看是不是每次都處理全部歷史資料。',['c',[['每次處理全部','時間隨資料量｜無限增加','w'],['增量＋分割','只和每天的｜變動量有關','a']]]],
['品質',['資料品質檢查發現異常時，流程的反應要依嚴重程度而定。','嚴重的：阻擋，不讓流程繼續。中等的：把那一批資料隔離。','輕微的：標記之後放行，並通知負責人。'],'主鍵重複是嚴重問題，流程停止；少數幾筆的地址欄位空白，則標記之後放行並通知。','所有的問題都讓流程停下來，結果經常因為小問題而沒有報表可看；或是所有的問題都只記錄不處理，沒有人去看。','不同的品質問題對下游的影響差很多。全部都擋，報表常常出不來；全部都放，錯誤的數字會被使用。依嚴重程度分級處理，才能同時顧到可用和正確。','品質異常依嚴重度處理：阻擋、隔離，或標記後放行。',['c',[['嚴重','阻擋流程','w'],['中等','隔離該批資料'],['輕微','標記後放行｜並通知']]]],
['個資',['把含有個資的資料抽到分析環境，只帶需要的欄位。','對可以識別個人的資料做遮罩或去識別化。','分析通常不需要知道是誰。'],'抽取客戶資料到分析環境時，不帶姓名、電話和身分證字號，客戶編號換成另一組無法回推的代碼。','把整張客戶資料表原封不動搬過去。分析環境的使用者多、權限也比較寬，個資的暴露範圍大幅增加。','分析要回答的通常是整體的問題：哪一類客戶買得多、趨勢如何。這些不需要知道個別的人是誰。分析環境的防護通常不如正式的業務系統，所以進去的個資愈少愈好。','進分析環境的資料：只帶需要的欄位，識別資料去識別化。',['f',['來源的｜客戶資料','只選需要的欄位','識別資料｜遮罩或換成代碼','載入分析環境'],null,['','a','a','']]],
['即時',['批次處理是累積一段時間的資料之後一次處理。','串流處理是在資料產生的時候持續處理。','即時不是免費的，複雜度和成本都高很多，要先確認業務真的需要多即時。'],'詐欺偵測需要在交易當下判斷，適合串流；每天的營收報表隔天早上看就可以，用批次就夠了。','因為「即時」聽起來比較好，就把所有流程都改成串流。維運的難度大增，而使用者其實一天只看一次。','批次處理的邏輯簡單，錯了可以整批重跑。串流要處理資料亂序、晚到、重複，系統要一直運作不能停，除錯也困難得多。所以只有在「晚幾分鐘知道就會造成損失」的情境才值得。','先問業務需要多即時；串流的成本和複雜度高很多。',['c',[['批次','累積後一次處理｜簡單、便宜'],['串流','產生時就處理｜複雜、成本高']]]]],
3:[
['架構',['資料湖是存放各種原始資料的地方，格式和結構不限。','資料倉儲存放的是整理好、結構化的資料。','湖有彈性但容易變得沒人看得懂；倉儲好用但前期要投入建模。'],'原始的紀錄檔、影像、各系統的匯出檔先放進資料湖；經過整理、有明確定義的銷售和客戶資料放在資料倉儲供報表使用。','認為有了資料湖就不需要資料倉儲，把所有資料倒進去就算完成了。','兩者解決不同的問題。湖的重點是先把資料留下來，因為事先不知道以後會怎麼用；倉儲的重點是讓已知的問題可以被快速、一致地回答。實務上通常兩者並存。','資料湖放原始資料，資料倉儲放整理好的。',['c',[['資料湖','各種原始資料｜有彈性、易失控'],['資料倉儲','整理好的結構化資料｜好用、要先建模']]]],
['治理',['沒有管理的資料湖，最後會堆滿沒有人知道內容、品質和來源的資料。','這種狀態常被稱為資料沼澤。','需要的管理包括：資料目錄、每份資料的擁有者、品質的標示、存取的控管。'],'資料湖裡每一份資料在目錄中都有說明、來源、負責人和更新頻率。使用者可以搜尋到需要的資料，並知道能不能信任它。','只管「把資料放進去」，沒有任何說明。兩年後裡面有幾千個資料夾，沒有人知道哪些還在用、哪個才是正確的版本。','資料湖沒有強制的結構，任何東西都放得進去，這是它的彈性，也是它的問題。資料要被使用，使用者必須知道它存在、知道它是什麼、知道它可不可靠。這些資訊不會自己產生。','資料湖沒治理會變沼澤：要有目錄、擁有者、品質標示。',['c',[['資料目錄','有哪些資料｜是什麼'],['擁有者','誰負責'],['品質標示','可不可信'],['存取控管','誰可以用']]]],
['資料契約',['資料契約是上下游團隊之間的約定。','內容包括：資料的結構、每個欄位的意義、品質的標準、變更時的通知方式。','它把口頭的默契變成可以自動檢查的規格。'],'訂單團隊和資料團隊訂定契約：訂單資料有哪些欄位、每天幾點前產生、欄位要變更時提前兩週通知。契約寫成檔案，每次產出時自動檢查。','上下游之間沒有任何約定。上游隨時可能修改，下游只能在流程壞掉之後才知道。','產生資料的團隊通常不知道有誰在使用，也不知道哪些變更會造成問題。契約讓雙方的期待明確：上游知道自己承諾了什麼，下游知道可以依賴什麼。','資料契約：把結構、意義、品質和變更通知寫成可檢查的規格。',['c',[['結構','有哪些欄位'],['意義','每個欄位｜代表什麼'],['品質','要達到的標準'],['變更通知','提前多久｜怎麼通知']]]],
['可重現',['半年後重新計算某個月的報表，結果和當時不同，表示流程不可重現。','要能重現，需要保留當時的原始資料。','以及當時處理邏輯的版本。'],'原始資料依日期保存、不覆蓋；處理的程式放在版本控制裡。要重算去年三月的數字時，用當時的資料和當時的程式版本，得到相同的結果。','原始資料每天被覆蓋，處理的邏輯直接在線上修改。過去的數字無法重新產生，也無法說明當時是怎麼算的。','報表的數字是由「資料」和「計算方式」共同決定的，兩者都會隨時間改變。只要其中一個沒有保留，過去的結果就無法重現。能重現才能接受稽核，發現計算錯誤時也才有辦法修正歷史數字。','要能重算過去的數字：保留原始資料和當時的處理邏輯。',['c',[['原始資料','依日期保存｜不覆蓋'],['處理邏輯','進版本控制']],'兩者都保留，才能重現過去的結果']],
['成本',['雲端資料平台的費用會快速成長。','治理上最有效的做法是讓各團隊看得到自己的用量。','並且淘汰沒有人使用的資料和流程。'],'每月把費用依團隊分攤並公布。檢查使用紀錄後發現，三成的流程產出的資料表在過去半年沒有被查詢過，把它們停掉之後費用明顯下降。','費用由一個中央的預算支付，沒有人知道是誰用掉的，也沒有人有動機去節省。','雲端的費用是依使用量計算的，而使用的人和付費的人常常不是同一個。讓使用的團隊看到自己造成的費用，他們才會去檢視哪些是不需要的。另外，流程只會增加不會減少，很多早已沒有人在看結果。','讓各團隊看到自己的用量，淘汰沒人用的資料和流程。',['f',['費用依團隊｜分攤並公布','檢查哪些資料｜沒有人用','停掉不需要的｜流程'],null,['a','','']]],
['主資料',['同一個對象（例如客戶）在好幾個系統裡各有一份，而且內容互相矛盾。','長期的解法是建立主資料管理。','定義哪一個系統是權威的來源，以及其他系統怎麼和它同步。'],'約定客戶的基本資料以客戶管理系統為準，其他系統不能自行修改，只能從它同步。','買一套工具，期待它自動解決。沒有先決定「哪一份才是對的、誰有權修改」，工具也無從運作。','每個系統都是為了自己的目的而建立的，各自維護需要的資料，彼此不知道對方的存在。要解決矛盾，必須有人決定每一種資料以誰為準、由誰負責維護。這是組織和流程的決定。','主資料：定義權威來源和同步規則；主要是治理問題。',['c',[['權威來源','哪個系統｜說了算','a'],['同步規則','其他系統｜怎麼跟它一致'],['工具','只是輔助','off']]]],
['可觀測',['資料流程除了「有沒有跑完」，還要監控資料本身。','新鮮度：資料是不是如期更新。筆數：有沒有異常的變化。','品質指標：例如空值的比例。'],'流程顯示成功，但監控發現今天載入的筆數只有平常的十分之一，立刻發出告警。原因是來源系統的匯出提前中斷了。','只監控流程的執行狀態。流程成功完成，但載入的是不完整或錯誤的資料，沒有人發現。','流程成功只代表程式沒有發生錯誤，不代表資料是對的。來源給了不完整的資料，流程會忠實地把它處理完並回報成功。要發現這種問題，必須直接觀察資料的特徵有沒有偏離平常的樣子。','除了有沒有跑完，還要看新鮮度、筆數和品質。',['c',[['新鮮度','有沒有如期更新'],['筆數','有沒有異常變化'],['品質指標','例如空值比例']]]],
['組織',['集中的資料團隊會成為所有需求的瓶頸。','常見的調整方向是由各業務領域負責自己的資料產品。','中央的團隊提供平台和共同的標準。'],'訂單資料由訂單團隊負責產出和維護品質；資料平台團隊提供共用的工具、資料目錄和規範。','把責任分散出去，卻沒有共同的標準。每個領域各做各的，資料之間無法串接。','中央的團隊不了解每個業務領域的細節，所有的需求又都要經過他們，很快就處理不完。把資料的責任交給最了解它的人，可以解決瓶頸。但資料要能互相使用，仍然需要共同的規範。','各領域負責自己的資料，中央提供平台和標準。',['c',[['各業務領域','負責自己的｜資料產品','a'],['中央團隊','提供平台｜和共同標準']]]]]};
LEARN.bi={0:[
['基礎',['報表提供的是詳細的資料。','儀表板是讓人快速掌握重點指標。','主管要一眼看到現況；承辦人要能往下查明細。'],'主管的儀表板只有五個數字和兩張趨勢圖；點進去才是可以篩選、匯出的明細報表。','把所有的明細都塞進儀表板，或是只給主管一份幾十頁的報表。','兩者回答不同的問題。儀表板回答「現在狀況如何、哪裡需要注意」，要能在幾秒內看懂。報表回答「具體是哪幾筆、細節是什麼」，重點是完整和可以查找。','儀表板看重點，報表查明細。',['c',[['儀表板','快速掌握｜重點指標'],['報表','詳細的資料｜可以查明細']]]],
['圖表',['圖表的選擇取決於要回答的問題。','看隨時間的變化用折線圖；比較不同類別用長條圖。','看占比才用圓餅圖，而且類別不能太多。'],'每月營收的趨勢用折線圖；各門市業績的比較用長條圖。','所有的資料都用圓餅圖，或是用立體的效果。圓餅圖超過五個類別就很難比較大小，立體效果會扭曲比例。','人的眼睛對不同的視覺特徵有不同的判斷能力：比較長度很準，比較角度和面積就差很多。折線能顯示連續的變化，長條能準確地比較高低。','趨勢用折線、比較用長條、占比才用圓餅。',['c',[['隨時間變化','折線圖'],['類別比較','長條圖'],['占比','圓餅圖｜類別要少']]]],
['統計',['資料裡有少數極端大的數值時，平均值會被拉高。','這時候平均值不能代表大多數的情況。','中位數更能反映一般的狀況。'],'案件的處理時間：大部分是一到兩天，但有少數幾件拖了三個月。平均是八天，中位數是一天半。後者才是一般案件的實際情況。','只報告平均值。聽的人以為「一般的案件要八天」，而實際上大多數都在兩天內完成。','平均值是把所有數值加起來除以個數，一個極端的數值就能把它拉離大多數資料所在的位置。中位數是排序之後正中間的那一個，不受極端值的影響。','有極端值時看中位數，不要只看平均。',['c',[['平均值','會被極端值拉走','off'],['中位數','排在正中間的值｜反映一般狀況','a']]]],
['一致性',['兩個部門的報表上，同一個指標的數字不一樣，最常見的原因是資料來源或計算的定義不同。','要先核對定義和來源。','這也是為什麼需要單一的事實來源。'],'業務部的「本月營收」是下單的金額，財務部的是已經收款的金額。兩個數字都沒有錯，只是定義不同。','一發現數字不同就爭論誰對誰錯。雙方都覺得自己的數字是正確的，討論沒有結果。','同一個名稱的指標，背後可以有很多種算法：什麼時間點計入、哪些要排除、用哪個系統的資料。每個部門會依自己的需要選擇算法。不把定義攤開來比較，數字的差異無法解釋。','數字不同先對定義和來源，不要先爭誰對。',['f',['兩邊數字不同','核對資料來源','核對計算定義','找出差異的原因'],null,['w','a','a','']]],
['呈現',['報表上的數字要同時標示它的時間範圍、篩選條件和資料更新的時間。','否則很容易被誤讀。','同一個數字，是本月還是今年、有沒有排除某些類別，意義差很多。'],'圖表的標題寫「2024 年 5 月營收（不含退貨）」，角落註明「資料更新至 5/31 23:00」。','只寫一個大大的數字和「營收」兩個字。看的人各自解讀成不同的時間範圍。','一個數字的意義來自它的上下文。製作報表的人知道這些條件，所以覺得不需要寫；但看報表的人不知道。報表也常常被截圖轉傳，離開了原本的頁面之後，這些資訊就完全消失了。','數字要標示：時間範圍、篩選條件、更新時間。',['c',[['時間範圍','哪一段期間'],['篩選條件','包含或排除了什麼'],['更新時間','資料到什麼時候']]]],
['個資',['給多人看的統計報表，只呈現彙總的結果。','避免出現能回推到個人的明細。','人數很少的分組也可能讓人被認出來，這種情況要合併或隱藏。'],'各部門的平均薪資報表中，有一個部門只有兩個人。把這個部門和其他部門合併顯示，避免被推算出個人的薪資。','認為「只有統計數字，沒有姓名」就沒有個資的問題。分組夠細時，一個數字對應的可能就是一兩個人。','彙總是把個人的資料隱藏在群體裡。群體太小時，這層保護就不存在了：知道某個分組只有一個人，那個分組的數字就是他的資料。','統計報表也要注意：人數太少的分組要合併或隱藏。',['c',[['彙總結果','可以呈現'],['人數很少的分組','合併或隱藏','w']]]],
['工具',['樞紐分析是把明細資料依不同的欄位分組並彙總。','同一份資料可以很快地換不同的角度來看。','例如依部門、依月份、依類別。'],'一份一萬筆的銷售明細，用樞紐分析幾秒鐘就可以看到各門市每個月的銷售額，再拖拉一下就換成各商品類別的銷售額。','用手動篩選和加總公式一個一個算。資料一更新就要全部重做。','分析的過程是不斷地換角度問問題。樞紐分析讓「換一個角度」變成拖拉欄位的動作，可以很快地探索資料，找到值得深入的地方。','樞紐分析：把明細依欄位分組彙總，快速換角度看。',['f',['明細資料','選擇分組的欄位','選擇要彙總的數值','得到彙總表']]],
['時效',['儀表板上要顯示資料更新的時間。','使用者才知道看到的是不是最新的。','資料停止更新卻沒有人發現，決策就會建立在過時的資訊上。'],'儀表板的右上角顯示「資料更新時間：今天 06:00」。某天顯示的是三天前，使用者一看就知道資料有問題。','儀表板沒有顯示更新時間。資料轉檔已經失敗了三天，主管每天還是照著上面的數字做決定。','儀表板看起來永遠是「正常」的：圖表在、數字在，沒有任何跡象顯示資料是舊的。顯示更新時間是成本最低的保護，讓每一位使用者都能自己確認。','儀表板要顯示資料更新時間。',['c',[['有顯示','使用者能判斷｜資料新不新','a'],['沒有顯示','過時了也沒人知道','w']]]]],

['指標定義',['各單位對同一個指標的算法不同時，要訂出統一的定義。','把定義記錄下來，讓所有的報表共用。','沒有共同的定義，每次開會都在爭論數字。'],'把「活躍使用者」定義為「過去三十天內至少登入一次的帳號」，寫進指標說明文件，所有報表都使用這個定義。','各單位繼續用自己的算法。會議的時間都花在解釋為什麼數字不一樣，而不是討論怎麼改善。','指標是用來溝通的，大家用同一個名稱卻指不同的東西，溝通就失效了。訂出統一的定義不是要判定哪個算法比較好，而是要讓所有人說的是同一件事。','同一個指標要有統一的定義，並寫下來共用。',['f',['各單位算法不同','訂出統一定義','記錄下來','所有報表共用'],null,['w','a','','']]],
['判讀',['兩件事有相關，不代表其中一件造成另一件。','冰淇淋賣得多的月份溺水事件也多，是因為兩者都受夏天影響。','看到相關就下因果的結論，是資料分析最常見的錯誤。'],'資料顯示參加訓練的員工績效比較好。這不一定是訓練的效果，可能是績效本來就好的人比較願意報名。','「數據顯示甲和乙一起上升，所以要增加甲來提升乙」。','兩個數字一起變動有很多可能的原因：甲造成乙、乙造成甲、兩者都被第三個因素影響，或只是巧合。資料只能顯示它們一起變動，無法告訴你是哪一種。','相關不等於因果。',['c',[['相關','兩者一起變動'],['因果','一個造成另一個'],['常見的陷阱','兩者都受｜第三個因素影響','w']]]],
['抽樣',['只用有回覆問卷的客戶的資料，來推論所有客戶的滿意度，樣本是有偏差的。','願意回覆的人不能代表全部。','特別滿意和特別不滿意的人比較會回覆。'],'問卷的回覆率是 5%，結果顯示滿意度很高。但這 5% 可能大多是本來就很滿意、願意花時間填寫的客戶。','直接把樣本的結果當成全體的結果，沒有說明資料是怎麼蒐集的。','從樣本推論全體的前提是樣本能代表全體。如果「會不會出現在樣本裡」這件事和你要量測的東西有關，樣本就會偏向某一邊。結論必須說明資料的來源和限制。','樣本有偏差時，結論不能直接推到全體。',['c',[['全體客戶','各種滿意程度都有'],['有回覆的人','偏向特別滿意｜或特別不滿意','w']],'結論要說明資料的限制']],
['權限',['同一份儀表板，不同的人只能看到自己權限範圍內的資料，需要列層級的權限。','它是依使用者的身分自動過濾資料。','一份報表套用權限規則，比維護幾十份副本可靠。'],'各分公司的主管打開同一份業績儀表板，系統依他們的身分，只顯示自己分公司的資料。','為每個分公司各做一份報表。修改時要改幾十份，很容易漏掉，也可能把錯的那一份給了錯的人。','每一份副本都是一個需要維護的東西，副本之間遲早會出現差異。把「誰能看什麼」定義成規則，由系統在查詢時自動套用，報表本身只需要一份。','用列層級權限，一份報表依身分顯示不同資料。',['c',[['每個單位一份副本','難維護、易出錯','w'],['列層級權限','一份報表｜依身分自動過濾','a']]]],
['自助分析',['開放各單位自己做報表之後，同樣的數字會出現很多個版本。','改善的方式是提供經過驗證的共用資料集和指標。','讓大家在這個基礎上自助。'],'資料團隊提供一份經過驗證的銷售資料集，裡面已經定義好營收、毛利這些指標。各單位用它來做自己的報表，數字是一致的。','讓每個人各自連到原始資料、各自計算。每個人算出來的營收都不一樣。','自助分析的好處是使用者可以自己回答問題，不用等待。但每個人都從原始資料開始，就會各自做出不同的處理。提供共同的基礎，讓彈性保留在「怎麼看」，一致性保留在「怎麼算」。','自助分析的前提：有經過驗證的共用資料集和指標。',['c',[['各自從原始資料算','同一個數字｜很多版本','w'],['共用的資料集','算法一致｜呈現方式自由','a']]]],
['效能',['儀表板每次打開都要即時彙總上億筆明細，所以很慢。','常見的解法是事先算好彙總表。','儀表板查詢的是彙總的結果。'],'每天凌晨把明細彙總成「每天、每門市、每類別」的表，只有幾十萬筆。儀表板查這張表，一秒內就顯示出來。','每次有人打開，都重新計算一次全部的明細。使用者等了三十秒，之後就不再使用。','儀表板顯示的通常是固定的幾種彙總方式，而且不需要即時到秒。這些結果可以事先算好存起來。使用者打開時只需要讀取已經算好的結果。','儀表板慢：事先彙總，查彙總的結果。',['f',['上億筆明細','定時預先彙總','彙總表｜筆數少很多','儀表板｜查彙總表'],null,['w','a','','']]],
['呈現',['長條圖的縱軸不從 0 開始，微小的差異會被放大。','這會誤導讀者對差距大小的判斷。','刻意或無意的截斷都會造成同樣的效果。'],'兩個數字是 96 和 98。縱軸從 95 開始的話，一根長條看起來是另一根的三倍高；從 0 開始，兩根幾乎一樣高。','為了讓圖表「看起來有變化」而調整縱軸。看的人會以為差距很大。','長條圖是用長度來表示數值的，人看的是長條之間的比例。截斷縱軸之後，長度的比例就不再等於數值的比例。折線圖看的是變化的趨勢，縱軸不從 0 開始通常是可以接受的。','長條圖的縱軸要從 0 開始。',['c',[['縱軸從 0 開始','長度比例｜等於數值比例','a'],['縱軸被截斷','小差異｜看起來很大','w']]]],
['需求',['主管說「幫我做一張業績報表」，開始做之前最該問的是他要用這張報表做什麼決定。','知道要回答什麼問題，才知道該放哪些指標。','也才知道要多詳細、多久更新一次。'],'問了之後才知道，主管是要決定下一季要增加哪一區的人力。於是報表的重點是各區的業績趨勢和人均產值。','直接把所有和業績有關的欄位都放進去。報表很完整，但主管找不到他要的答案。','報表是為了支援決策而存在的。同樣叫「業績報表」，要決定人力配置和要決定產品定價，需要的內容完全不同。先了解決策，才知道哪些資訊是必要的。','做報表前先問：要用它做什麼決定？',['f',['收到需求','問：要做｜什麼決定','決定指標｜和詳細程度','再開始製作'],null,['','a','','']]]],
2:[
['建模',['在商業智慧工具裡，先建立資料模型（資料表之間的關聯和量值的定義），再做報表。','好處是計算的邏輯集中定義在一個地方。','所有的報表使用同一個定義，結果是一致的。'],'「毛利率」在模型裡定義一次。之後二十張報表都引用它，要修改算法時只改一個地方。','每一張報表各自寫公式。過了一段時間，有幾張報表的公式被改過，同一個指標算出不同的數字。','同一個計算如果寫在很多地方，就要靠人保證它們都一樣，也要在修改時記得每一處。把它定義在模型裡，所有報表都是引用同一份定義，這個問題就不存在。','計算邏輯定義在模型裡，所有報表共用。',['c',[['每張報表各寫公式','遲早算出｜不同的數字','w'],['在模型定義一次','所有報表一致｜修改只改一處','a']]]],
['統計',['看到這個月的數字比上個月高 3%，下結論之前要先想這是不是正常的波動範圍。','任何指標本來就會上下波動。','沒有對照正常的變異，很容易把雜訊當成訊號。'],'過去兩年，這個指標每個月的變動都在正負 5% 之間。這個月上升 3% 在正常的範圍內，不需要特別解釋。','每個月都為數字的上升或下降找一個原因。大部分的時候只是隨機的波動，找出來的「原因」並不存在。','指標受到很多微小的因素影響，就算沒有任何實質的改變，每次量到的數字也不會完全相同。要判斷一個變化是不是有意義，需要知道它平常波動的範圍有多大。','先看是不是正常波動，再下結論。',['c',[['在正常範圍內','只是波動｜不必解釋'],['超出正常範圍','值得調查','a']]]],
['比較',['比較兩個對象時，不能只看總額。','它們的規模、條件可能不同，要用可以比較的基準。','例如換算成每坪、每人，或是看成長率。'],'甲店的營收是乙店的兩倍，但甲店的面積是乙店的四倍。換算成每坪營收，乙店的表現反而比較好。','依營收的總額排名並據此獎懲。大店永遠排在前面，和經營的好壞無關。','總額同時反映了規模和效率，兩者混在一起。要比較的通常是效率或表現，所以要把規模的影響除掉。','比較要用同一個基準：每坪、每人、成長率。',['c',[['只看總額','規模大的一定贏','off'],['每坪、每人｜成長率','可以公平比較','a']]]],
['悖論',['每一個分組的比率都上升，整體的比率卻下降，這是可能發生的。','原因是各組的占比改變了。','這叫辛普森悖論。'],'新客和舊客的轉換率都比上個月高。但這個月新客的比例大幅增加，而新客的轉換率本來就比較低，所以整體的轉換率下降了。','只看整體的數字就認為表現變差，或只看分組的數字就認為表現變好。','整體的比率是各組比率的加權平均，權重是各組的大小。各組的大小改變時，即使每一組都變好，表現比較差的那一組占比增加，就可能把整體拉低。','總數和分組的結論可能相反；兩個都要看。',['c',[['各分組','比率都上升'],['整體','比率卻下降','w'],['原因','各組的占比｜改變了']]]],
['設計',['一個儀表板放太多圖表，使用者會找不到重點。','先決定這一頁要回答的少數幾個問題。','其他的內容放到下一層。'],'首頁只放四個最重要的指標和它們的趨勢；想看更細的內容，點進去才是各個面向的詳細頁面。','把所有可能有人想看的東西都放在同一頁。四十個圖表擠在一起，每一個都很小，沒有人看得完。','人一次能注意的東西很有限。全部的資訊都以同樣的大小和位置呈現，等於沒有告訴使用者什麼是重要的。儀表板的價值在於幫使用者篩選和排序。','一頁只回答少數幾個問題，其餘放下一層。',['c',[['四十個圖表一頁','找不到重點','w'],['幾個重點＋下一層','一眼看懂｜需要再深入','a']]]],
['預測',['用過去的趨勢線直接外推未來，是假設未來會和過去一樣。','環境一改變，預測就不準了。','預測要附上它的假設和不確定的範圍。'],'報告寫：「依過去兩年的趨勢，預估下一季營收在 950 萬到 1,100 萬之間。這個預估假設市場條件沒有重大變化。」','只給一個確定的數字。聽的人把它當成一定會發生的事，並據此做了沒有彈性的規劃。','趨勢線描述的是過去發生的事。它能不能延伸到未來，取決於造成這個趨勢的條件會不會持續。預測的時間愈遠，不確定性愈大。','預測要附上假設和不確定的範圍。',['c',[['只給一個數字','被當成確定的事','w'],['附上假設和範圍','知道有多不確定','a']]]],
['即時',['主管要求所有儀表板都要即時更新時，要先確認哪些決策真的需要即時。','再評估需要的成本。','每天只看一次的報表，每秒更新只是多花錢。'],'逐一確認之後，只有客服的即時監控需要每分鐘更新，其他的儀表板每天更新一次就足夠了。','照字面的要求把所有儀表板都改成即時。系統的成本和複雜度大幅增加，使用的方式卻完全沒有改變。','資料多即時才有價值，取決於依據它做的決策多快會發生。一個每週開會討論的指標，即時更新對它沒有任何幫助。把資源放在真的需要即時的少數地方。','先確認哪些決策真的需要即時。',['f',['要求全部即時','逐一確認：｜多久看一次？','真的需要的｜才做即時','其他定時更新'],null,['','a','','']]],
['採用',['報表做了很多卻很少人打開，要檢討的是它有沒有回答使用者實際要做決定的問題。','方法是先看使用紀錄，再去詢問使用者。','沒有人使用的報表應該下架。'],'使用紀錄顯示六十張報表裡有四十張過去三個月沒有被打開。訪談之後下架了三十五張，並依使用者實際的需要重做了其中五張。','認為使用者不看是因為他們不夠重視資料，然後繼續做更多的報表。','報表沒有被使用，表示它沒有幫上忙：可能是回答了沒有人在問的問題，也可能是太難用。這只有問使用者才會知道。留著沒人用的報表還要持續花成本維護。','報表沒人看：查使用紀錄、問使用者、沒用的下架。',['f',['查使用紀錄','訪談使用者','依實際需要｜調整','沒人用的下架']]]],
3:[
['治理',['指標字典是為每一個指標記錄唯一的定義、計算方式和負責人。','有了它，開會時不再爭論數字的算法。','而是討論數字代表什麼、該怎麼做。'],'指標字典裡「客戶流失率」寫明：計算公式、使用的資料來源、排除的條件、負責維護的單位。任何人有疑問都查得到。','定義只存在於少數人的腦中或某一份報表的公式裡。人員異動之後，沒有人說得清楚數字是怎麼算的。','指標會被很多人、在很多地方使用。沒有一個權威的出處，各種版本就會自然產生。指定負責人是因為定義需要有人維護：業務改變時，要有人決定指標該怎麼調整。','指標字典：每個指標有唯一的定義、算法和負責人。',['c',[['定義','代表什麼'],['算法','怎麼計算'],['負責人','誰維護']]]],
['實驗',['要知道新的做法是不是真的比較好，最可靠的方法是隨機分組的對照實驗。','把對象隨機分成兩組，一組用新的、一組用舊的，同時進行。','沒有對照組，就分不出是改版的效果還是其他因素造成的。'],'把訪客隨機分成兩組，一半看到新版頁面、一半看到舊版，同時進行兩週，再比較兩組的轉換率。','全部換成新版，然後比較改版前後的數字。這段期間剛好有促銷活動，無法分辨是哪一個造成的。','改版前後的差異混合了很多因素：季節、活動、市場的變化。隨機分組讓兩組在所有其他條件上都相同，唯一的差別是有沒有用新的做法，所以結果的差異可以歸因於它。','要知道有沒有效：隨機分組做對照實驗。',['f',['隨機分成兩組','一組新版｜一組舊版','同時進行','比較兩組的結果'],null,['a','','','']]],
['因果',['用了某個功能的客戶留存率比較高，不能直接推論是這個功能提升了留存。','會去用這個功能的，可能本來就是比較投入的客戶。','這叫自我選擇偏誤。'],'使用進階功能的客戶留存率是 90%，沒有使用的是 60%。但使用進階功能的客戶本來就是重度使用者，就算沒有這個功能，他們的留存率也會比較高。','依據這個比較，投入大量資源推廣這個功能，結果整體的留存率沒有改變。','兩組客戶不是隨機分配的，是他們自己選擇的。會做出這個選擇的人，在其他方面本來就和不會選擇的人不同。觀察到的差異有多少來自功能本身、有多少來自這些原有的不同，從這個比較看不出來。','自己選擇的兩組不能直接比；可能本來就不一樣。',['c',[['觀察到的','用功能的人｜留存率較高'],['可能的原因','他們本來就｜比較投入','w'],['要確認因果','做實驗或｜控制差異','a']]]],
['決策',['資料分析的結論和資深主管的直覺相反時，分析人員要說明分析的方法、假設和限制。','讓決策者一起檢視。','資料可能有盲點，直覺也可能有。'],'分析人員向主管說明：這個結論是用哪些資料、怎麼算出來的、有哪些沒有涵蓋到。主管指出資料裡沒有包含某一個通路，補上之後結論改變了。','堅持「資料就是這樣說的」，或是因為主管不同意就放棄。兩種做法都沒有讓雙方的資訊被檢驗。','分析是建立在一連串的假設和資料的選擇上的，每一個都可能有問題。主管的直覺來自多年的經驗，可能包含資料裡沒有的資訊。把假設攤開來，雙方才能找出差異的來源。','結論和直覺相反時：攤開方法、假設和限制一起檢視。',['f',['結論和｜直覺相反','說明方法｜和資料','說明假設｜和限制','一起找出｜差異的來源'],null,['','a','a','']]],
['倫理',['用資料把客戶分群並給予不同的待遇，在倫理上要注意兩件事。','是否造成不公平的差別對待；是否符合當事人合理的期待。','合法不等於適當。'],'模型用居住地區來決定優惠的內容。檢視後發現居住地區和族群高度相關，等於間接依族群給了不同的待遇，於是移除這個變數。','「模型沒有用到性別或族群，所以沒有歧視」。其他的變數可能和這些特徵高度相關，效果是一樣的。','資料分析很擅長找出能區分人群的變數，但它不會判斷這樣區分是否公平。有些看起來中性的變數，實際上是受保護特徵的替代。客戶對自己的資料會被怎麼使用也有合理的期待。','分群差別待遇：注意公平性和當事人的合理期待。',['c',[['公平性','會不會造成｜不公平的差別對待'],['合理期待','當事人想得到｜資料會被這樣用嗎']],'有些變數會間接對應到受保護的特徵']],
['自助',['推動人人都能分析資料，最需要搭配的是基本的資料素養訓練。','以及可信的共用資料。','工具再好，不懂抽樣和因果的人只會更快地做出錯的結論。'],'開放自助分析工具的同時，提供課程：怎麼判斷樣本有沒有偏差、相關和因果的差別、怎麼看圖表不被誤導。','只提供工具和資料的存取權限。大家做出了很多圖表，其中不少的結論是錯的，而且因為有圖表，看起來很有說服力。','工具降低的是「做出一張圖」的門檻，沒有降低「正確解讀」的門檻。錯誤的分析配上精美的圖表，比沒有分析更危險。','人人分析要搭配資料素養訓練和可信的資料。',['c',[['只給工具','更快做出｜錯的結論','w'],['工具＋素養訓練｜＋可信的資料','結論才可靠','a']]]],
['指標',['只用單一指標來考核團隊，人會想辦法把指標做得好看。','而不是把事情做好。','被拿來當目標的指標，就不再是好的指標。要搭配制衡的指標。'],'客服只考核「平均通話時間」。客服人員開始盡快結束通話，問題沒有解決，客戶只好再打一次。加上「首次解決率」之後，這個行為就不划算了。','認為指標訂得夠明確，大家就會朝正確的方向努力。','指標是真正目標的簡化。當獎懲綁在指標上，人會找到提高指標卻不提升真正目標的方法，這不一定是刻意作假。用幾個互相制衡的指標，可以讓這種做法在某一個指標上付出代價。','指標變成目標就會失真；要搭配制衡的指標。',['c',[['單一指標','大家把數字做漂亮','w'],['互相制衡的指標','很難只衝一個','a']]]],
['價值',['要證明分析團隊的價值，要呈現的是分析結果促成了哪些決策。','以及帶來了哪些可以衡量的改變。','產出了多少報表是活動量，不是成果。'],'年度報告寫：「分析發現某類客戶的流失集中在第三個月，據此調整了關懷的時間點，該類客戶的留存率提升了 8 個百分點。」','報告寫「今年產出 240 張報表、回應 1,300 件資料需求」。聽的人無法判斷這些對組織有什麼幫助。','分析本身不產生價值，根據分析所做的決策才產生價值。把分析連結到具體的決策和結果，才能說明這個團隊對組織的貢獻。','分析的價值看促成了哪些決策和改變。',['c',[['活動量','產出幾張報表','off'],['成果','促成哪些決策｜帶來什麼改變','a']]]]]};
// ===== 進階專科重點卡：系統與基礎設施路線 =====

['目錄服務',['OU（組織單位）用來套用群組原則和委派管理。','群組用來授予存取資源的權限。','用戶端電腦是靠 DNS 找到網域控制站的，所以 AD 高度依賴 DNS。'],'要對會計部的電腦套用一條原則，把電腦帳號放進會計部的 OU；要讓會計部的人能存取帳務資料夾，把他們加進一個群組並授權給這個群組。','把 OU 當成群組用，以為放進 OU 就有權限。另外，用戶端的 DNS 如果指到外部的伺服器，會找不到網域控制站而無法登入。','OU 是管理上的容器，決定「誰來管、套什麼原則」；群組是安全上的單位，決定「能存取什麼」。網域控制站把自己的位置登記在 DNS 的服務紀錄裡，用戶端要查這些紀錄才知道該連到哪一台。','OU 套原則、群組給權限；找網域控制站靠 DNS。',['c',[['OU','套用群組原則｜委派管理'],['群組','授予資源權限'],['DNS','用戶端靠它｜找到網域控制站','a']]]],
['虛擬化',['線上移轉是在不停機的情況下，把虛擬機從一台實體主機搬到另一台。','實體主機要維護時，可以先把上面的虛擬機搬走。','主機之間的負載不平均時也可以用它來調整。'],'要更換一台實體主機的記憶體。先把上面的十台虛擬機線上移轉到其他主機，停機更換，再搬回來。使用者完全沒有感覺。','以為線上移轉可以在主機「突然故障」時保護虛擬機。它需要來源主機還在運作；突然故障要靠高可用機制在別台重新啟動。','虛擬機的磁碟放在共用的儲存上，移轉時只需要把記憶體的內容複製到另一台主機，最後在極短的時間內切換過去。所以它是用於「有計畫的」搬移。','線上移轉：不停機把虛擬機搬到另一台主機。',['f',['主機甲要維護','虛擬機線上｜移轉到主機乙','主機甲停機維護','再搬回來'],null,['','a','','']]],
['雲端',['雲端有三種服務模式。IaaS 提供運算、儲存、網路，上面的系統自己管。','PaaS 連執行環境都幫你顧好；SaaS 是直接使用現成的軟體。','共同責任模型：業者負責雲本身的安全，客戶負責自己放在雲上面的東西，包括資料的保護和存取權限的設定。'],'在雲端租一台虛擬機並自己安裝作業系統，屬於 IaaS：作業系統的更新、防火牆的設定、資料的權限都是自己的責任。','「放在雲端，安全就是業者的事」。把儲存空間設成公開而導致資料外洩，是客戶自己的責任。','雲端業者能控制的是機房、硬體和它提供的服務本身。客戶在上面怎麼設定、放了什麼資料、給了誰權限，業者無從得知也無法代為決定。服務的層級愈低，客戶自己要負責的部分愈多。','IaaS 自己管最多；雲本身歸業者，放上去的東西歸自己。',['c',[['IaaS','租運算和儲存｜系統自己管'],['PaaS','執行環境｜由業者管'],['SaaS','直接使用｜現成的軟體']],'不論哪一種，資料和存取權限都是客戶的責任']],
['備份',['增量備份只備份上一次備份（不論哪一種）之後有變動的資料。','最省空間，但還原時需要完整備份加上之後的每一份增量。','差異備份是備份上一次「完整備份」之後所有的變動。'],'週日做完整備份，週一到週六每天做增量。週四要還原時，需要週日的完整備份，加上週一、週二、週三的三份增量。','把增量備份和差異備份搞混。兩者還原時需要的份數不同，規劃時要算清楚。','兩種方式是在備份的大小和還原的複雜度之間取捨。增量每次只備最少的資料，但還原要依序套用很多份，任何一份損壞就接不下去。差異每次愈備愈大，但還原只需要兩份。','增量備「上次備份以來」的變動；差異備「上次完整備份以來」的變動。',['c',[['增量備份','上次備份以來的變動｜最省空間｜還原要每一份'],['差異備份','上次完整備份以來的變動｜還原只要兩份']]]],
['儲存',['LVM 是 Linux 上管理磁碟的一層抽象。','最主要的好處是可以彈性調整空間的大小，不用重新分割磁碟。','空間不夠時，加一顆磁碟進來就能線上擴充。'],'資料目錄快滿了。加一顆新的磁碟，把它加入同一個磁碟群組，再把邏輯磁區和檔案系統擴大，整個過程不用停機。','安裝系統時把磁碟直接切成固定大小的分割區。之後某一個分割區滿了，另一個還很空，卻很難調整。','傳統的分割區直接對應到實體磁碟上的一段位置，大小固定。LVM 在中間加了一層：先把多顆實體磁碟合成一個空間池，再從池裡切出需要的大小。大小不再受限於單一顆磁碟。','LVM：把磁碟合成空間池，可以線上擴充。',['f',['實體磁碟','合成磁碟群組｜（空間池）','切出邏輯磁區','不夠再加磁碟擴充'],null,['','a','','']]],
['憑證',['TLS 憑證有有效期限。','到期的那一天，所有連線的人會同時看到憑證錯誤的警告。','要把到期日放進監控，至少提前一個月提醒。'],'公司網站某天早上全部跳出憑證錯誤，前一天還正常。檢查後發現憑證在當天凌晨到期。','靠負責人的記憶或行事曆。人員異動之後沒有人記得，憑證在假日過期。','憑證裡寫明了有效的起訖時間，瀏覽器會檢查。過了期限它就不被信任，沒有任何緩衝。這個時間點是事先就確定的，所以完全可以預防。','憑證到期所有人同時出錯；到期日要監控並提前提醒。',['f',['盤點所有憑證','監控到期日','提前一個月提醒','更新憑證'],null,['','a','','']]]],
