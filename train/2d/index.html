 {t:"度量",q:"要證明資安意識計畫真的有效，應該用什麼衡量？",a:["行為指標的長期趨勢：回報率、回報速度和實際事件的變化","上課的滿意度","簡報的美觀","參加訓練的同仁在課後測驗當中的平均身高"],why:"滿意度高不代表行為改變。要看的是真實情境下怎麼做。"},
 {t:"風險導向",q:"資源有限時，資安意識的投入應該怎麼分配？",a:["依角色的風險分級，高風險族群給更深入的訓練","每個人完全一樣","只訓練新人","依照同仁的座位距離資訊單位的遠近來決定"],why:"財務、高階主管、系統管理者被針對的機率和後果都不同。"},
 {t:"人因",q:"「人是最弱的一環」這種說法，在現代資安觀念中為什麼被檢討？",a:["它把責任推給個人，忽略了系統和流程應該讓人不容易犯錯","因為人其實最強","因為不禮貌","因為這一句話當初在翻譯的時候發生了錯誤"],why:"好的設計讓安全的做法就是最容易的做法。"},
 {t:"深偽",q:"針對 AI 合成的聲音和影像詐騙，最可靠的防護是什麼？",a:["不依賴辨識真假，而是用事先約定的管道和程序驗證","訓練大家聽出假聲音","禁用視訊","可以請對方在視訊的那個時候把臉轉向左邊和右邊各一次"],why:"技術會越來越難分辨。能擋住的是「重大指示必須經過第二管道確認」的流程。"},
 {t:"內部威脅",q:"資安意識計畫談內部威脅時，應該避免什麼？",a:["把同仁都當成嫌疑人，破壞信任","提到案例","說明回報管道","說明公司對於資料保護有哪一些相關的規定"],why:"重點放在辨識異常跡象和提供求助、回報的管道。"},
 {t:"供應鏈",q:"廠商和合作夥伴的人員，需要納入資安意識的範圍嗎？",a:["需要，他們有存取權也會被當成攻擊跳板","不需要","只有清潔人員需要","只有在他們主動提出要求的時候才需要納入"],why:"可以在合約要求基本訓練，或提供教材並確認完成。"},
 {t:"成熟度",q:"一個資安文化成熟的組織，最明顯的特徵是什麼？",a:["同仁主動回報可疑狀況和自己的失誤，不怕被責怪","從來沒有人點過釣魚信","規定最多","每一位公司同仁全都能夠背出所有資安政策的條文編號"],why:"沒有人不犯錯。能不能在幾分鐘內知道，決定了損害的大小。"}
]]},
{id:'etl',lv:[[
 {t:"基礎",q:"ETL 的三個步驟是什麼？",a:["擷取、轉換、載入","編輯、測試、上線","加密、傳輸、解密","建立資料表、新增資料、最後再刪除資料表"],why:"從來源把資料拿出來，整理成需要的樣子，再放進目的地。"},
 {t:"資料清理",q:"轉換資料時發現同一位客戶有三筆、寫法略有不同。這屬於什麼工作？",a:["資料清理和去重複","資料加密","資料備份","資料壓縮，也就是讓檔案的大小變得比較小"],why:"資料品質的問題如果不在前面處理，後面的報表和分析都會是錯的。"},
 {t:"排程",q:"每天要從業務系統抽資料到報表資料庫。排程上要注意什麼？",a:["避開業務尖峰，並確認前一個步驟完成才執行下一個","選在最忙的時候跑","隨便什麼時候都可以","每個小時都把全部的資料重新完整抽取一次"],why:"抽資料會增加來源系統的負載。步驟之間有相依時，不能只靠固定時間錯開。"},
 {t:"來源保護",q:"從正式的業務資料庫抽取資料，帳號權限應該怎麼給？",a:["只給唯讀","給完整的讀寫權限","用管理員帳號","給予可以修改資料表結構的權限以方便日後調整"],why:"抽資料的程式寫錯，不應該有機會改壞來源系統。"},
 {t:"編碼",q:"匯入一份舊系統產生的 CSV，中文全變成亂碼。最可能的原因是？",a:["檔案的文字編碼和讀取時假設的不同，例如 Big5 和 UTF-8","檔案太大","網路太慢","檔案的副檔名當中使用了大寫的英文字母"],why:"台灣的舊系統很多還在用 Big5。讀檔時要指定正確的編碼。"},
 {t:"對應",q:"把兩個系統的資料合在一起，最關鍵的前提是什麼？",a:["有可以對應的共同鍵值","兩邊筆數一樣","兩邊欄位名稱一樣","兩個系統當初必須是由同一家廠商負責開發的"],why:"沒有可靠的共同鍵，只能靠姓名這類會重複、會寫錯的欄位去猜。"},
 {t:"監控",q:"半夜的資料轉檔失敗了，隔天早上報表是空的才被發現。應該補什麼？",a:["失敗時自動通知負責人","把報表關掉","請使用者晚點看","請值班的人員每一個小時手動檢查一次有沒有跑完"],why:"轉檔沒人看是常態，所以失敗一定要主動通知，最好連「沒有如期完成」也要通知。"},
 {t:"驗證",q:"轉檔完成後，最基本的驗證是什麼？",a:["核對來源和目的的筆數和關鍵數字的總和","看檔案大小","看執行時間","確認目的資料表的名稱有沒有拼寫正確、大小寫對不對"],why:"沒報錯不代表資料對。筆數和金額總和對不上，就是有東西掉了。"}
],[
 {t:"載入策略",q:"「增量載入」和「全量載入」的差別是？",a:["增量只處理上次之後有變動的資料，全量每次全部重來","增量比較慢","全量比較省資源","增量只能用在測試環境，全量只能用在正式環境"],why:"資料量大時全量跑不完。增量快，但要有可靠的方法知道「哪些變了」。"},
 {t:"可靠性",q:"轉檔程式中途失敗重跑，結果資料重複了。設計上應該怎麼避免？",a:["讓程式可以安全重跑，例如先清除該批資料或用鍵值更新","永遠不要重跑","重跑前先重開機","每一次重跑之前都先把整個資料庫刪除再重新建立"],why:"失敗重跑是日常。同一批資料跑兩次結果要一樣。"},
 {t:"資料品質",q:"在轉檔流程中加入資料品質檢查，是為了什麼？",a:["在問題資料進入報表之前就攔下來","讓流程變慢","增加程式行數","讓負責轉檔的同仁每天都有固定的工作可以做"],why:"例如必填欄位是空的、日期在未來、金額是負的。早一步發現，少很多解釋。"},
 {t:"架構",q:"為什麼分析和報表通常不直接在交易資料庫上跑，而是另外建資料倉儲？",a:["避免拖慢交易，資料也能整理成適合分析的結構","因為交易資料庫不能查詢","為了多買設備","因為交易資料庫裡面的資料每天晚上都會被自動清空"],why:"交易系統為快速的單筆讀寫設計；分析要跨大量資料彙總，兩者需求相反。"},
 {t:"資料模型",q:"資料倉儲常見的「事實表」和「維度表」，分別放什麼？",a:["事實表放可以加總的數值，維度表放描述用的屬性","事實表放文字，維度表放圖片","兩者相同","事實表放已經確認的資料，維度表放還沒有經過確認的"],why:"例如銷售金額是事實，日期、門市、商品是維度。"},
 {t:"變更擷取",q:"「變更資料擷取」（CDC）是在做什麼？",a:["從資料庫的異動紀錄抓出新增、修改、刪除的資料","壓縮資料","加密資料","定期把整個資料庫完整地複製一份到另外一台主機"],why:"比起每次比對整張表，它對來源的負擔小，也抓得到刪除的資料。"},
 {t:"資料血緣",q:"「資料血緣」記錄的是什麼？",a:["資料從哪裡來、經過哪些處理、被誰使用","資料的檔案大小","資料的顏色","負責維護這一份資料的同仁的家族成員名單"],why:"報表數字被質疑時，要能追回來源；要改一個欄位時，也要知道會影響誰。"},
 {t:"日期處理",q:"整合不同系統的日期資料，在台灣特別要注意什麼？",a:["民國年和西元年的轉換，以及時區","星期幾","農曆節氣","每一個日期當天的天氣是晴天還是雨天"],why:"「1130501」是民國 113 年還是別的意思，要先確認。跨國系統還要處理時區。"}

 {t:"架構",q:"ETL 和 ELT 的差別是什麼？",a:["ELT 先把原始資料載入目的端，再在那裡轉換","兩者只是拼字不同，做的事情和順序都完全一樣","ELT 不需要轉換","ELT 只能處理文字檔"],why:"目的端運算力夠強時，先載入再轉換比較有彈性，原始資料也留著。"},
 {t:"排程",q:"資料流程之間有先後相依。用「固定時間錯開」的方式排程，會有什麼問題？",a:["上游延遲時，下游會用到不完整的資料","沒有問題，只要每一個流程之間都間隔一個小時以上就一定安全","比較省資源","排程會自動調整"],why:"應該用工作流程工具表達相依，上游成功才觸發下游。"},
 {t:"結構變更",q:"來源系統加了一個欄位，下游的轉檔就壞了。設計上怎麼降低這種衝擊？",a:["明確指定需要的欄位，並監控來源結構的變化","永遠使用全部欄位，這樣不管來源怎麼改，下游的程式都一定可以自動適應","禁止來源變更","每天重寫程式"],why:"和來源系統的負責人約定變更通知，比事後救火有效。"},
 {t:"延遲資料",q:"有些資料會晚到（例如離線裝置隔天才上傳）。處理上要注意什麼？",a:["允許回補，並讓彙總結果可以重新計算","晚到的資料一律直接丟掉不處理，這樣報表上面的數字才不會一直變動","當作當天的資料","暫停整個流程"],why:"要先決定「等多久」和「晚到怎麼算」，報表的數字才解釋得清楚。"},
 {t:"效能",q:"每晚的轉檔越跑越久，快要跑不完。最先該檢查什麼？",a:["是否每次都在處理全部的歷史資料","伺服器的機殼顏色以及擺放的位置是不是有符合機房的管理規定","螢幕的大小","網路線的長度"],why:"改成增量處理和分割，通常比加硬體有效。"},
 {t:"品質",q:"資料品質規則檢查出異常。流程應該怎麼反應？",a:["依嚴重程度決定：阻擋、隔離該批資料，或標記後放行並通知","一律忽略，因為只要流程本身有順利跑完，就代表資料是正確的","一律刪除資料","一律重開機"],why:"不是所有問題都該讓流程停下來，但都要有人知道。"},
 {t:"個資",q:"把含個資的資料抽到分析環境。應該怎麼處理？",a:["只帶需要的欄位，並對識別資料做遮罩或去識別化","全部原樣複製過去，因為分析環境只有內部的同仁才可以登入使用","全部不能分析","放到公開的雲端"],why:"分析通常不需要知道是誰。少帶一個欄位，就少一份風險。"},
 {t:"即時",q:"「串流處理」和「批次處理」的差別是？",a:["串流在資料產生時持續處理，批次累積一段時間後一次處理","串流處理只能在每天半夜的固定時間執行一次，批次處理則是全天候持續執行","兩者相同","批次比較新"],why:"即時不是免費的，複雜度和成本都高。先確認業務真的需要多即時。"}
],[
 {t:"架構",q:"「資料湖」和「資料倉儲」的定位有什麼不同？",a:["資料湖存放各種原始資料，倉儲存放整理好、結構化的資料","資料湖只能存放和水資源相關的資料，資料倉儲則是只能存放庫存資料","兩者相同","資料湖比較小"],why:"湖有彈性但容易變成沒人看得懂的沼澤；倉儲好用但前期要投入建模。"},
 {t:"治理",q:"沒有管理的資料湖，最常見的下場是什麼？",a:["堆滿沒人知道內容、品質和來源的資料","資料會自動整理好，而且品質會隨著存放的時間越久變得越來越好","容量自動變小","查詢越來越快"],why:"需要目錄、擁有者、品質標示和存取控管。"},
 {t:"資料契約",q:"上下游團隊之間訂定「資料契約」，內容是什麼？",a:["資料的結構、意義、品質和變更通知的約定","雙方團隊每個月固定聚餐的時間地點以及費用要如何分攤的約定","薪資","授權費用"],why:"把口頭的默契變成可以自動檢查的規格。"},
 {t:"可重現",q:"半年後要重算某個月的報表，結果和當時不同。可能缺了什麼設計？",a:["保留當時的原始資料和處理邏輯的版本","保留當時負責的同仁，因為只有他才知道那一個月的數字是怎麼算出來的","更大的螢幕","更快的網路"],why:"能重現才能稽核，也才敢修正錯誤。"},
 {t:"成本",q:"雲端資料平台的費用快速成長。治理上最有效的做法是？",a:["讓各團隊看得到自己的用量，並淘汰沒人用的資料和流程","全面禁止所有的團隊執行任何查詢，等到下一個年度的預算核定之後再開放","全部搬回試算表","不看帳單"],why:"很多流程還在每天跑，但產出的表早就沒人查了。"},
 {t:"主資料",q:"「客戶」在五個系統裡各有一份、內容互相矛盾。長期的解法是什麼？",a:["建立主資料管理，定義權威來源和同步規則","每一個系統都各自維護自己的版本，需要用的時候再由承辦人憑經驗判斷","每月人工比對","隨機挑一份"],why:"這主要是治理和流程的問題，工具只是輔助。"},
 {t:"可觀測",q:"資料流程除了「有沒有跑完」，還應該監控什麼？",a:["資料的新鮮度、筆數的異常變化和品質指標","負責的同仁今天有沒有準時到辦公室上班以及中午休息了多久的時間","伺服器的顏色","檔案的名稱"],why:"流程成功但只載入了平常十分之一的資料，一樣是事故。"},
 {t:"組織",q:"集中的資料團隊成為所有需求的瓶頸。常見的調整方向是？",a:["各業務領域負責自己的資料產品，中央提供平台和標準","再招募更多人進入中央的資料團隊，一直到所有的需求都可以即時處理為止","停止提供資料","全部外包"],why:"把資料的責任放回最懂它的人身上，但要有共同的規範才不會各做各的。"}
]]},
{id:'bi',lv:[[
 {t:"基礎",q:"「報表」和「儀表板」的用途有什麼不同？",a:["報表提供詳細資料，儀表板讓人快速掌握重點指標","兩者相同","儀表板比較長","報表只能列印成紙本，儀表板只能在手機上面看"],why:"主管要一眼看到現況；承辦人要能往下查明細。兩種需求不同。"},
 {t:"圖表",q:"要呈現一項指標「隨時間的變化」，最適合用哪一種圖？",a:["折線圖","圓餅圖","文字雲","立體的三維圓柱圖並且加上陰影和漸層效果"],why:"圖表的選擇取決於要回答的問題：趨勢用折線，比較用長條，占比才用圓餅。"},
 {t:"統計",q:"資料裡有少數極端大的數值時，「平均值」會有什麼問題？",a:["被極端值拉高，不能代表大多數的情況","變成零","無法計算","平均值會自動變得和資料當中的最小值一樣"],why:"這時中位數更能反映一般狀況。例如薪資、處理時間都常有這種現象。"},
 {t:"一致性",q:"兩個部門的報表，同一個指標數字卻不一樣。最常見的原因是？",a:["資料來源或計算定義不同","電腦壞了","有人改數字","兩個部門所使用的螢幕尺寸和解析度不一樣"],why:"先對定義和來源，不要急著爭誰對。這也是為什麼需要單一的事實來源。"},
 {t:"呈現",q:"報表上的數字，應該同時標示什麼，才不會被誤讀？",a:["資料的時間範圍、篩選條件和更新時間","製表人的生日","使用的字型","製作這一份報表的時候總共花了多少個工作天"],why:"同一個數字，是本月還是今年、有沒有排除某些類別，意義差很多。"},
 {t:"個資",q:"製作給多人看的統計報表時，個資方面要注意什麼？",a:["只呈現彙總結果，避免能回推到個人的明細","把個資全部列出來比較完整","用小字顯示","直接把每一個人的姓名都改成粗體字以方便辨識"],why:"人數很少的分組也可能讓人被認出來，這種情況要合併或隱藏。"},
 {t:"工具",q:"「樞紐分析」主要用來做什麼？",a:["把明細資料依不同欄位分組彙總","畫流程圖","寄送郵件","把試算表當中的所有文字都翻譯成另外一種語言"],why:"同一份資料可以很快地換角度看：依部門、依月份、依類別。"},
 {t:"時效",q:"儀表板上顯示「資料更新時間」為什麼很重要？",a:["使用者才知道看到的是不是最新的","比較好看","佔版面","因為沒有顯示更新時間的儀表板依規定不能使用"],why:"資料停在三天前卻沒人發現，決策就建立在過時的資訊上。"}
],[
 {t:"指標定義",q:"各單位對「活躍使用者」的算法都不一樣。治理上應該怎麼處理？",a:["訂出統一的定義並記錄下來，所有報表共用","讓各單位自己決定","取平均","每個月輪流採用其中一個單位的算法以示公平"],why:"沒有共同定義，每次開會都在爭數字，而不是討論怎麼做。"},
 {t:"判讀",q:"資料顯示「冰淇淋賣得多的月份，溺水事件也多」。可以得出什麼結論？",a:["兩者有相關，但不代表有因果關係","吃冰淇淋會導致溺水","溺水會讓人想吃冰淇淋","只要禁止販售冰淇淋就可以有效減少溺水的事件"],why:"兩者都受夏天影響。看到相關就下因果結論，是資料分析最常見的錯誤。"},
 {t:"抽樣",q:"只用「有回覆問卷的客戶」的資料，推論所有客戶的滿意度。問題在哪裡？",a:["樣本有偏差，願意回覆的人不代表全部","樣本太多","問卷太短","問卷的題目使用了太多的專業術語客戶看不懂"],why:"特別滿意和特別不滿意的人比較會回覆。結論要說明資料的限制。"},
 {t:"權限",q:"同一份儀表板，各分公司主管只能看到自己分公司的資料。這需要什麼功能？",a:["依使用者身分過濾資料的列層級權限","做很多份報表","用不同顏色","請每一位主管自己自律不要去看別人的資料"],why:"一份報表套用權限規則，比維護幾十份副本可靠。"},
 {t:"自助分析",q:"開放各單位自己做報表後，同樣的數字出現很多版本。怎麼改善？",a:["提供經過驗證的共用資料集和指標，在此基礎上自助","收回所有權限","不管它","規定每一個單位每個月最多只能製作一份報表"],why:"自助分析的前提是有可信的共同基礎，否則只是把混亂變得更有效率。"},
 {t:"效能",q:"儀表板每次打開都要等很久，因為即時彙總上億筆明細。常見的解法是？",a:["事先算好彙總表，儀表板查彙總的結果","買更大的螢幕","減少使用者","請使用者改成只在半夜沒有人使用的時候才打開"],why:"大部分的儀表板不需要即時到秒。定時預先彙總，查詢就很快。"},
 {t:"呈現",q:"長條圖的縱軸從 95 開始而不是從 0。可能造成什麼問題？",a:["微小的差異被放大，誤導讀者","圖變得比較小","顏色會改變","圖表上面的文字會因此變得太小而無法閱讀"],why:"圖表也會說謊。刻意或無意的截斷，都會讓人對差距的大小有錯誤印象。"},
 {t:"需求",q:"主管說「幫我做一張業績報表」。開始做之前最該問什麼？",a:["他要用這張報表做什麼決定","要用什麼顏色","要幾頁","報表的標題要使用標楷體還是新細明體"],why:"知道要回答什麼問題，才知道該放哪些指標、多細、多久更新。"}
],[
 {t:"建模",q:"在商業智慧工具裡先建立好資料模型（關聯和量值），再做報表。好處是什麼？",a:["計算邏輯集中定義，所有報表一致","報表的顏色會變得比較鮮豔，而且字體也會自動調整成為主管喜歡的樣式","檔案比較大","不需要資料"],why:"每張報表各自寫公式，遲早會算出不同的數字。"},
 {t:"統計",q:"看到這個月的數字比上個月高 3%。下結論前要先想什麼？",a:["這是不是正常的波動範圍","只要數字有上升就代表措施有效，應該馬上擴大辦理並且對外發布","3% 很大","不用想"],why:"沒有對照正常的變異，很容易把雜訊當成訊號。"},
 {t:"比較",q:"比較兩家分店的業績，為什麼不能只看總額？",a:["規模、地點和客群不同，要用可比較的基準","因為總額的數字通常位數太多，放在報表上面會超出欄位的寬度","總額不準","總額會變"],why:"換成每坪、每人或成長率，才是公平的比較。"},
 {t:"悖論",q:"各分組的轉換率都上升，但整體的轉換率卻下降。這可能嗎？",a:["可能，各組的占比改變了","不可能，這一定是資料庫損壞或者是報表的公式寫錯所造成的結果","一定是算錯","只會發生在國外"],why:"這叫辛普森悖論。只看總數或只看分組，都可能得出錯的結論。"},
 {t:"設計",q:"一個儀表板放了四十個圖表。問題是什麼？",a:["使用者找不到重點","圖表的數量還不夠多，應該至少要放到一百個以上才能夠呈現完整的資訊","太省空間","載入太快"],why:"先決定這頁要回答的少數幾個問題，其他的放到下一層。"},
 {t:"預測",q:"用過去的趨勢線直接外推未來的數字。要注意什麼？",a:["假設未來和過去一樣，環境一變就不準","趨勢線往外延伸出去的結果一定正確，因為數學的計算是不會出錯的","一定偏高","沒有風險"],why:"預測要附上假設和不確定的範圍。"},
 {t:"即時",q:"主管要求所有儀表板都要「即時更新」。應該怎麼回應？",a:["先確認哪些決策真的需要即時，再評估成本","全部照做，而且應該要做到每一毫秒就自動重新整理一次所有的畫面","直接拒絕","假裝有做"],why:"每天看一次的報表，每秒更新只是多花錢。"},
 {t:"採用",q:"報表做了很多，但很少人打開。應該從哪裡檢討？",a:["是否回答了使用者實際要做決定的問題","報表使用的顏色是不是不夠鮮豔，以及標題的字體是不是不夠大","伺服器太慢","使用者太懶"],why:"看使用紀錄，再去問人。沒人用的報表應該下架。"}
],[
 {t:"治理",q:"建立「指標字典」的目的是什麼？",a:["每個指標有唯一的定義、算法和負責人","讓新進的同仁在到職的第一天有足夠多的文件可以閱讀打發時間","增加文件頁數","取代報表"],why:"開會時不再爭論數字，而是討論數字代表什麼。"},
 {t:"實驗",q:"要知道新版頁面是否真的比較好，最可靠的方法是什麼？",a:["隨機分組的對照實驗","直接上線之後看整體的數字有沒有上升，有上升就代表新版本比較好","問設計師","看競爭對手"],why:"沒有對照組，就分不出是改版的效果還是季節、活動造成的。"},
 {t:"因果",q:"資料顯示「用了某功能的客戶留存率較高」。可以直接推論該功能提升留存嗎？",a:["不行，會用該功能的可能本來就是比較投入的客戶","可以，而且應該立刻強制所有的客戶都必須使用這一項功能","一定可以","資料有錯"],why:"這是自我選擇偏誤。要用實驗或適當的方法控制差異。"},
 {t:"決策",q:"資料分析的結論和資深主管的直覺相反。分析人員應該怎麼做？",a:["說明方法、假設和限制，讓決策者一起檢視","修改分析的結果讓它符合主管的直覺，這樣報告才比較容易通過","堅持自己一定對","不報告"],why:"資料可能有盲點，直覺也可能有。把假設攤開來才能討論。"},
 {t:"倫理",q:"用資料對客戶分群並給予不同的待遇。倫理上要注意什麼？",a:["是否造成不公平的差別對待，以及當事人的合理期待","沒有任何需要注意的事情，因為資料本身是完全客觀而且中立的","只要有賺錢","只要合法"],why:"合法不等於適當。有些分群變數會間接對應到受保護的特徵。"},
 {t:"自助",q:"推動「人人都能分析資料」，最需要搭配什麼？",a:["基本的資料素養訓練和可信的共用資料","最新型的電腦以及解析度最高的螢幕，並且每個人至少要配備兩台","更多授權","更多報表"],why:"工具再好，不懂抽樣和因果的人只會更快做出錯的結論。"},
 {t:"指標",q:"只用單一指標考核團隊，會發生什麼事？",a:["人會想辦法把指標做漂亮，而不是把事情做好","團隊的表現一定會全面提升，因為目標變得非常明確而且沒有模糊空間","沒有影響","指標會消失"],why:"被拿來當目標的指標，就不再是好指標。要搭配制衡的指標。"},
 {t:"價值",q:"要證明分析團隊的價值，應該呈現什麼？",a:["分析結果促成了哪些決策和可衡量的改變","今年總共製作了幾張報表，以及每一張報表各自包含了多少個圖表","團隊人數","工具數量"],why:"產出多少報表是活動量，不是成果。"}
]]},
{id:'qa',lv:[[
 {t:"基礎",q:"軟體測試的主要目的是什麼？",a:["在使用者之前找出問題","證明程式完全沒有錯","拖延上線","讓測試人員有機會熟悉公司的各個部門"],why:"測試只能證明有錯，不能證明沒錯。目標是把風險降到可接受。"},
 {t:"測試層級",q:"單元測試、整合測試、系統測試，範圍由小到大的順序是？",a:["單元、整合、系統","系統、整合、單元","整合、單元、系統","三者的範圍完全相同只是負責執行的人不同"],why:"先確認每個小零件正確，再看組起來對不對，最後看整體符不符合需求。"},
 {t:"測試案例",q:"一個完整的測試案例，除了操作步驟，一定要有什麼？",a:["預期結果","測試者的姓名","程式碼行數","測試當天辦公室的溫度以及濕度的紀錄"],why:"沒有預期結果，就無法判斷通過還是失敗。"},
 {t:"回歸測試",q:"修了一個 bug 之後，為什麼還要重測原本正常的功能？",a:["修改可能意外影響到其他地方","為了增加工時","因為規定","因為原本正常的功能在放置一段時間之後會自己壞掉"],why:"這叫回歸測試。改 A 壞 B 是軟體最常見的事。"},
 {t:"缺陷回報",q:"回報 bug 時，最重要的是提供什麼？",a:["可重現的步驟、預期結果和實際結果","「不能用」三個字","自己的心情","發現這個問題的時候自己剛好正在吃什麼東西"],why:"開發人員重現不出來就修不了。環境、版本、畫面截圖也都有幫助。"},
 {t:"測試設計",q:"輸入欄位限制 1 到 100。測試時最應該試哪些值？",a:["邊界附近的值：0、1、100、101","只試 50","隨便試一個","只測試使用者最常輸入的那一個數字就足夠了"],why:"錯誤最常出現在邊界。大於和大於等於寫錯，中間的值是測不出來的。"},
 {t:"環境",q:"為什麼測試要在獨立的測試環境進行？",a:["不影響正式的資料和使用者","測試環境比較快","因為比較便宜","因為正式環境不允許測試人員使用鍵盤輸入"],why:"在正式環境測試，測試資料會混進真資料，測壞了就是事故。"},
 {t:"驗收",q:"「使用者驗收測試」（UAT）是由誰來確認什麼？",a:["由實際使用的人確認系統符合業務需求","由開發人員確認程式能編譯","由廠商確認已經收到款項","由資訊主管確認機房的溫度和濕度符合規定"],why:"功能都對，但流程不合實際作業，還是不能用。這只有使用者看得出來。"}
],[
 {t:"自動化",q:"「測試金字塔」的建議是什麼？",a:["大量快速的單元測試、適量的整合測試、少量的端到端測試","全部都用端到端測試","不需要單元測試","每一種類型的測試數量都必須要完全一樣多"],why:"端到端測試慢又容易壞。底層測得扎實，上層只需要驗證關鍵流程。"},
 {t:"測試資料",q:"自動化測試每次執行的結果不一樣，有時過有時不過。常見原因是？",a:["測試之間共用資料或彼此有相依","電腦太新","測試太少","執行測試的時候螢幕的亮度設定得不一樣"],why:"每個測試應該自己準備資料、自己清理，不依賴執行順序。"},
 {t:"缺陷管理",q:"bug 的「嚴重度」和「優先度」有什麼不同？",a:["嚴重度是影響多大，優先度是多快要修","兩者相同","優先度是影響多大","嚴重度是由測試人員的年資來決定的"],why:"首頁標題的錯字嚴重度低但優先度高；很少人用的功能當機則可能相反。"},
 {t:"測試方法",q:"「探索式測試」是什麼？",a:["不照腳本，邊操作邊依發現調整方向找問題","亂點一通","只看文件","只測試畫面上面最左上角的那一個按鈕"],why:"腳本只會找到預想得到的問題。有經驗的人自由探索，常能挖出意外的缺陷。"},
 {t:"效能",q:"「負載測試」和「壓力測試」的差別是？",a:["負載測試看預期用量下的表現，壓力測試找出極限和崩潰時的行為","兩者相同","壓力測試比較輕","負載測試是測試人員的抗壓性，壓力測試是測試主管的"],why:"上線前要知道能撐多少人，也要知道撐不住時是變慢還是直接倒。"},
 {t:"指標",q:"測試涵蓋率達到 90%，代表品質很好嗎？",a:["不一定，被執行到不代表有被正確地驗證","一定很好","代表沒有 bug","代表剩下的百分之十程式碼一定都有嚴重的問題"],why:"涵蓋率低是警訊，但高涵蓋率可以用沒有檢查結果的測試灌出來。"},
 {t:"持續整合",q:"把自動化測試放進持續整合流程，每次提交都跑。最大的價值是？",a:["問題在引入的當下就被發現","讓提交變慢","取代程式碼審查","讓測試人員可以不需要再參加任何的會議"],why:"剛改的時候最容易修。等到累積幾週才測，要從幾百個變更裡找原因。"},
 {t:"根因",q:"同類型的 bug 一再出現。除了一個一個修，還應該做什麼？",a:["分析根本原因，從流程或設計上預防","加派測試人員","延後上線","把負責的開發人員調到其他比較不重要的專案"],why:"是需求不清？缺少檢查？某個模組設計不良？找到共同原因才會真的變少。"}
],[
 {t:"策略",q:"「測試左移」是什麼意思？",a:["在開發更早的階段就開始測試和檢查","把負責測試的同仁的座位全部搬移到辦公室左邊靠窗的那一個區域","延後測試","只測左半邊"],why:"需求階段就檢視可測試性，寫程式時就有自動測試。"},
 {t:"需求",q:"測試人員參與需求審查，最大的價值是什麼？",a:["提早發現模糊、矛盾和無法驗證的需求","讓會議的出席人數變多，這樣會議紀錄看起來會比較正式也比較完整","增加工時","認識新同事"],why:"需求錯了，照著做出來再測，成本是最高的。"},
 {t:"風險",q:"時間不夠全部測完。應該怎麼決定測試範圍？",a:["依風險排序：影響大、改動多、過去常出錯的優先","依照功能在選單上面出現的順序，從第一個開始測，測到時間用完為止","隨機挑","全部不測"],why:"測不完是常態。要讓大家知道哪些沒測、風險在哪。"},
 {t:"不穩定",q:"自動化測試時過時不過，大家已習慣「重跑就好」。這會造成什麼？",a:["真正的失敗也會被當成不穩定而忽略","沒有任何不好的影響，而且重跑還可以順便確認測試環境是不是正常","測試變快","品質提升"],why:"不穩定的測試要修好或移除。"},
 {t:"環境",q:"測試環境和正式環境差異很大。風險是什麼？",a:["測試通過不代表正式環境沒問題","完全沒有風險，因為只要程式碼相同，在任何環境執行的結果就一定相同","比較省錢而已","測試比較快"],why:"資料量、設定、版本的差異，是「測試都過了卻上線出事」的主因。"},

 {t:"正式環境",q:"「在正式環境測試」聽起來危險，但現代做法中確實存在。指的是什麼？",a:["用小流量、功能開關和監控，在真實環境驗證","直接請所有的使用者幫忙測試還沒有經過任何檢查的新功能","不做任何測試","關閉監控"],why:"有些問題只在真實流量下出現。前提是能快速發現和回復。"},
 {t:"混沌工程",q:"「混沌工程」在做什麼？",a:["刻意製造故障，驗證系統的韌性是否如預期","讓辦公室的環境保持混亂，藉此訓練同仁在壓力之下工作的能力","隨機刪除程式碼","取消測試"],why:"與其等故障自己來，不如在可控的情況下先練習。"},

 {t:"自動化",q:"自動化測試的維護成本越來越高。通常是哪裡出了問題？",a:["太依賴從介面操作的脆弱測試","自動化測試的數量還不夠多，應該再增加十倍以上才能降低維護成本","測試太快","人太多"],why:"畫面一改就壞一片。把驗證往下移到介面以下的層級。"},
 {t:"AI",q:"用 AI 產生測試案例，要注意什麼？",a:["它可能照著程式碼現有的行為寫，把錯的也當成對的","完全沒有需要注意的地方，因為 AI 所產生的測試案例一定都是正確的","一定比人好","不能使用"],why:"測試要依據需求，不是依據現在的程式。AI 產出的仍要人審。"},
 {t:"法遵",q:"受法規管制的系統，測試上多了什麼要求？",a:["測試證據要可追溯：對應到需求、有紀錄、可稽核","測試的時間必須安排在主管機關上班的時段，並且要有人員在場","不需要測試","只要口頭確認"],why:"做了但沒留下證據，在稽核上等於沒做。"},
 {t:"決策",q:"上線前還有幾個已知的缺陷沒修。能不能上線應該由誰決定？",a:["由了解業務風險的負責人，依充分的資訊決定","由測試人員自己決定就可以，不需要讓其他任何人知道有這些缺陷","誰官大","抽籤"],why:"測試的責任是把風險講清楚，不是替業務做決定。"}

 {t:"部署",q:"靜態資源放到內容傳遞網路（CDN）的好處是什麼？",a:["從離使用者近的節點提供，減輕主機負擔","可以讓網站的內容自動翻譯成使用者所在國家的當地語言","加密資料庫","取代備份"],why:"更新時要處理快取失效，否則使用者會拿到舊檔。"},
 {t:"第三方",q:"頁面上嵌入很多第三方的追蹤和廣告程式。有什麼影響？",a:["拖慢載入，也把使用者資料和頁面的控制權交給別人","沒有任何影響，因為這些程式都是由知名的大公司所提供的","只會變快","只影響顏色"],why:"每一個外部程式都能讀取頁面內容。要定期檢視是否仍然需要。"},

 $('sDone').textContent=n+'／'+COURSES.length;$('sStar').textContent=ts;$('sScore').textContent=sc.toLocaleString();
 const ch=$('chips');ch.innerHTML='';
 COURSES.forEach(c=>{const t=titleOf(c),b=document.createElement('button');b.className='chip';b.innerHTML='<span class="ic" style="background:'+c.col+'">'+c.ic+'</span><span style="min-width:0"><b>'+c.name+'</b><small>'+c.npc+'・'+(t||'還沒有等級')+'</small></span>';b.onclick=()=>openTalk(c);ch.appendChild(b);});
 const ad=$('adv');ad.innerHTML='';
 TRACKS.forEach(tk=>{const h=document.createElement('h3');h.className='trk';h.innerHTML=tk+'<small>常見職稱：'+JOBS[tk]+'</small>';ad.appendChild(h);ADV.filter(c=>c.track===tk).forEach(c=>{const lk=lockedBy(c),t=titleOf(c),b=document.createElement('button');b.className='chip'+(lk.length?' lock':'');b.innerHTML='<span class="ic" style="background:'+(lk.length?'var(--panel2)':c.col)+'">'+(lk.length?'🔒':c.ic)+'</span><span style="min-width:0"><b>'+c.name+'</b><small>'+c.npc+'・'+(lk.length?'先修：'+lk.map(x=>x.name).join('、'):(t||'還沒有等級'))+'</small></span>';b.onclick=()=>openTalk(c);ad.appendChild(b);});});
 document.querySelectorAll('.npc').forEach(b=>{const c=COURSES.find(x=>x.id===b.dataset.c),t=tierOf(c);b.setAttribute('aria-label','找'+c.npc+'學'+c.name);
  b.innerHTML=(t>=0?'<span class="mk done">'+TIER[t]+'</span>':'<span class="mk">！</span>')+'<span class="roof"></span><span class="hut">'+c.ic+'</span><span class="tag">'+c.npc+'<small>'+c.name+'</small></span>';});
 const hn=$('hallN');if(hn)hn.textContent='已通過 '+n+'／'+COURSES.length+' 門';
 if(window.v3dRefresh)v3dRefresh();}
function closeTalk(){talk.hidden=true;talk.innerHTML='';}
function openTalk(c){$('lists').classList.remove('open');sfx.talk();const t=tierOf(c),ttl=titleOf(c),lk=lockedBy(c);
 const say=lk.length?'想走這一科，基礎要先夠。先去把「'+lk.map(x=>x.name).join('」「')+'」考過，再回來找我。':t<0?c.hi:t<3&&pool(c,t+1).length<NQ?TIER[t]+'過了，不錯。'+TIER[t+1]+'的題目我還在準備，好了再來找我。':t===3?'你已經是專家了，我沒什麼好教的，想複習隨時來。':TIER[t]+'過了，要不要挑戰'+TIER[t+1]+'？';
 const btn=[0,1,2,3].map(l=>{const has=pool(c,l).length>=NQ,open=!lk.length&&(l===0||rec(c.id,l-1).stars>=2),r=rec(c.id,l);
  return '<button data-l="'+l+'" '+(has&&open?'':'disabled')+'>'+TIER[l]+(has?(open?starsHTML(r.stars):'<span class="n">'+(lk.length?'🔒 未開放':'🔒 前一級先過')+'</span>'):'<span class="n">製作中</span>')+'</button>';}).join('');
 const les=lk.length?'':[0,1,2,3].filter(l=>(LEARN[c.id]||{})[l]).map(l=>'<button data-l="'+l+'">'+TIER[l]+'重點</button>').join('');
 talk.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-label="'+c.npc+'"><div class="who"><span class="face" style="background:'+c.col+'">'+c.ic+'</span><div style="min-width:0"><h2>'+c.npc+'</h2><small>'+c.name+'</small></div></div><p class="say">'+say+'</p><div class="ttl">'+(ttl?'你的技能等級：'+ttl:'通過初級，這項技能就會記上「初級」')+'</div><div class="tiers">'+btn+'</div>'+(les?'<div class="les"><span>📖 先聽課</span>'+les+'</div>':'')+'<label class="prac"><input type="checkbox" id="prac">練習模式：不扣命、不計成績，可以放心看解說</label><div class="row"><button class="btn ghost" id="tClose">先不要</button></div></div>';
 talk.hidden=false;talk.querySelectorAll('.tiers button').forEach(b=>b.onclick=()=>{const pr=$('prac').checked;closeTalk();start(c,+b.dataset.l,pr);});
 talk.querySelectorAll('.les button').forEach(b=>b.onclick=()=>{closeTalk();learn(c,+b.dataset.l);});
 $('tClose').onclick=closeTalk;talk.onclick=e=>{if(e.target===talk)closeTalk();};(talk.querySelector('.tiers button:not(:disabled)')||$('tClose')).focus();}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!talk.hidden)closeTalk();});

// LEARN[課程][級別] = [[主題, [重點…], 例子, 常見誤解]]，主題名稱和題目的主題標籤一致，考完才能從弱項點回來。
const LEARN={
hw:{0:[
['記憶體',['記憶體（RAM）是電腦的「工作桌」，程式執行時的資料暫時放在這裡。','關機或斷電，記憶體裡的東西就消失；要留下來的資料要存到硬碟或 SSD。','記憶體不夠時，系統會拿硬碟當暫存，速度就會明顯變慢。'],'同時開很多分頁和程式之後電腦變很卡，工作管理員看到記憶體用到九成以上，就是桌子不夠大。','記憶體和儲存空間是兩回事。「硬碟還有 500 GB」不代表記憶體夠用。'],
['儲存裝置',['傳統硬碟（HDD）靠碟片轉動和讀寫頭，SSD 是晶片，沒有會動的零件。','SSD 讀寫快、耐震、安靜；HDD 每 GB 比較便宜，適合放大量不常讀的資料。','兩種都會壞，重要資料一定要備份。'],'同一台舊電腦，把開機碟從 HDD 換成 SSD，開機時間常常從一兩分鐘縮到十幾秒。','SSD 不是不會壞，它壞的時候常常沒有預兆，一壞就整顆讀不到。'],
['開機自我檢測',['電腦一開機會先做自我檢測（POST），檢查記憶體、顯示卡這些基本零件。','檢測沒過時畫面出不來，主機板會用嗶聲或燈號告訴你是哪一類問題。','連續嗶聲加上沒畫面，最常見是記憶體沒插好或接觸不良。'],'把記憶體拔下來，用橡皮擦輕擦金手指再插緊，很多「開機嗶嗶叫」就好了。','嗶聲的意思各家主機板不一樣，要查那一片主機板的說明，不要背一套通用的。'],
['磁碟陣列',['RAID 是把多顆磁碟組在一起，換取容錯或速度。','RAID 1 是鏡射：兩顆寫一樣的內容，壞一顆資料還在。','RAID 5 至少要三顆，用同位元資料保護，最多可以壞一顆。','RAID 0 只求快，沒有容錯，壞一顆就全部沒了。'],'三顆 4 TB 做 RAID 5，可用空間大約是 8 TB，有一顆的容量拿去放同位元資料。','RAID 不是備份。誤刪、中毒、勒索軟體加密，陣列會把錯誤的結果同步寫到每一顆。'],
['電力與 UPS',['不斷電系統（UPS）在停電或電壓不穩時，用電池短暫供電。','它的目的是讓設備撐過瞬間斷電，或爭取時間正常關機，不是讓你繼續用好幾個小時。','電池會老化，要定期測試和更換。'],'停電時 UPS 撐十分鐘，並且通知伺服器自動正常關機，資料才不會因為突然斷電而損壞。','UPS 接上去就不管是不行的，電池放了幾年沒換，真的停電時可能幾秒就沒電。'],
['維修安全',['打開主機之前先關機，並且拔掉電源線。','碰零件之前先摸一下金屬機殼或戴防靜電手環，把身上的靜電放掉。','拆下來的螺絲和零件放好、做記號，裝回去才不會少。'],'換記憶體的順序：關機、拔電源線、按一下電源鍵放掉殘電、放靜電、再動手。','「只是換個小零件不用關機」是錯的，帶電插拔可能直接燒掉主機板。'],
['散熱',['處理器和顯示卡運作時會發熱，靠風扇和散熱片把熱帶走。','灰塵堵住風扇或散熱孔，溫度就會上升，系統為了保護自己會降速或自動關機。','用很久的機器，散熱膏乾掉也會讓溫度變高。'],'用一陣子就自動關機、機殼很燙，打開一看風扇卡滿灰塵，清乾淨就恢復正常。','過熱關機是保護機制在動作，不是「電腦壞了要重灌」。'],
['驅動程式',['驅動程式是作業系統和硬體之間的翻譯，讓系統知道怎麼使用這個裝置。','驅動沒裝或版本不對，裝置可能認不到、功能不完整或不穩定。','驅動程式要從原廠或系統更新取得。'],'印表機接上去卻印出亂碼，常常是裝到別的型號的驅動。','來路不明的「驅動更新工具」常常夾帶廣告或惡意程式，不要用。'],
['更新管理',['修補程式最主要是修掉已知的安全漏洞，其次才是修錯誤和加功能。','漏洞公開之後攻擊者也看得到，愈晚更新風險愈高。','公司環境通常會先測試再分批派送，避免更新造成系統異常。'],'很多大規模中毒事件，被打的漏洞其實幾個月前就有修補程式，只是沒裝。','「現在用得好好的就不要更新」是最常見也最危險的想法。'],
['執行環境',['很多程式要靠共用的執行環境才能跑，例如 .NET、Java、Visual C++ 可轉發套件。','錯誤訊息說缺少某個 DLL，通常是對應的執行環境沒裝或版本不對。','正確做法是從官方來源安裝對應版本的執行環境。'],'訊息說缺 <code>VCRUNTIME140.dll</code>，到微軟官網裝 Visual C++ 可轉發套件就能解決。','不要上網搜尋單一 DLL 檔下載來放，那是很常見的中毒管道。'],
['軟體安裝規範',['公司電腦要裝什麼軟體，依公司規定申請，使用核可的來源。','軟體要有合法授權，個人版、免費版不一定可以用在公司。','自己亂裝的軟體沒人管更新，會變成安全漏洞。'],'想用一套方便的小工具，先查公司有沒有核可清單，沒有就走申請流程。','「免費的」不等於「公司可以用」，很多軟體的免費授權只限個人非商業用途。'],
['相容性',['相容模式讓比較舊的程式，在新版 Windows 上用舊版的行為來執行。','它只是模擬一部分舊系統的行為，不是每個舊程式都救得回來。','真的不行，再考慮虛擬機或請廠商更新。'],'一套十年前的程式在新電腦上閃退，在內容裡把相容模式設成舊版 Windows 之後可以開。','相容模式不會讓舊程式變安全，舊程式該有的漏洞還是在。'],
['瀏覽器問題',['「只有這台怪怪的、別台正常」，先往這台的瀏覽器本身找。','常見原因是快取存了舊的檔案，或擴充功能干擾。','先清快取、用無痕視窗或換一個瀏覽器比對。'],'內部系統改版後畫面跑掉，按 Ctrl+F5 強制重新整理就正常了。','不要一開始就懷疑伺服器壞了。別人都正常，問題多半在自己這一端。'],
['作業系統架構',['32 位元系統最多只能用到大約 4 GB 的記憶體，64 位元可以用更多。','64 位元系統可以跑大部分 32 位元程式，反過來不行。','驅動程式的位元數要和作業系統一致。'],'電腦裝了 8 GB 記憶體，系統卻只顯示可用 3 點多 GB，就是裝到 32 位元的作業系統。','64 位元不代表「快兩倍」，主要差別是能用的記憶體變多。'],
['軟體授權',['開源軟體是原始碼公開，可以依授權條款使用、修改和散布。','開源不等於沒有規則，不同授權條款的義務差很多。','免費軟體不一定開源，開源軟體也不一定免費提供支援。'],'Linux、Firefox 都是開源軟體；有些免費軟體看不到原始碼，就不算開源。','「開源就可以隨便拿來用在產品裡」是錯的，有些授權要求你也要公開修改過的程式碼。']]},
os:{0:[
['網路指令',['<code>ipconfig</code> 看基本的 IP 設定，<code>ipconfig /all</code> 多了 DNS、MAC 位址、DHCP 伺服器等完整資訊。','<code>ping</code> 測試連不連得到對方，<code>nslookup</code> 查名稱解析。','Linux 上對應的是 <code>ip addr</code>。'],'使用者說網路不通，請他執行 <code>ipconfig /all</code>，一眼就看得出有沒有拿到 IP、DNS 設成什麼。','只打 <code>ipconfig</code> 是看不到 DNS 和 MAC 的，要加 <code>/all</code>。'],
['網域與驗證',['電腦加入網域後，帳號集中放在網域控制站（DC）管理。','使用者登入時，帳號密碼由網域控制站驗證，不是這台電腦自己驗。','好處是一組帳號可以登入公司裡的各台電腦，權限也能集中管理。'],'新人到職，資訊人員只要在網域開一個帳號，他就能登入公司任何一台加入網域的電腦。','本機帳號和網域帳號是兩套。本機的 Administrator 管不到網域。'],
['群組原則',['群組原則（GPO）可以從中央統一設定大量電腦和使用者，例如密碼規則、桌面限制、軟體派送。','原則會定期自動套用；要立刻套用，在用戶端執行 <code>gpupdate /force</code>。','<code>gpresult /r</code> 可以看這台實際套用到哪些原則。'],'公司規定十分鐘沒動就鎖定螢幕，不用一台一台設，一條群組原則就全部生效。','改完原則不會馬上生效，沒等更新週期或沒下 <code>gpupdate</code> 就以為「設定沒用」。'],
['事件紀錄',['Windows 的系統錯誤、服務啟動失敗、登入紀錄都記在「事件檢視器」。','常看的有三類：系統、應用程式、安全性。','查問題時先鎖定發生的時間，再看那個時間點前後的錯誤和警告。'],'某個服務每天早上起不來，到事件檢視器的系統紀錄裡找那個時間的錯誤，通常會寫出原因。','事件檢視器裡平常就有很多警告，不是每一條都跟你的問題有關，要對時間。'],
['系統修復',['<code>sfc /scannow</code> 會掃描 Windows 的系統檔，發現損壞或被改過就還原成正確版本。','要用系統管理員身分執行。','它只修系統檔，不會動你的個人檔案和安裝的程式。'],'Windows 內建功能莫名其妙打不開，先跑一次 <code>sfc /scannow</code> 再決定下一步。','sfc 不是掃毒，也不是重灌，它解決不了硬碟壞軌或中毒的問題。'],
['遠端桌面',['遠端桌面（RDP）預設使用 TCP 3389 連接埠。','它讓你從另一台電腦操作這台的桌面，方便遠端維護。','RDP 是很常被攻擊的服務，不要直接開放到網際網路。'],'在公司內部用遠端桌面連到伺服器做維護；在外面則要先連 VPN 再連。','把 3389 改成別的埠號不算防護，掃描工具一樣找得到。'],
['檔案權限',['Windows 共用資料夾有兩層：共用權限和 NTFS 權限。從網路連進來時，兩者取比較嚴格的那一個。','Linux 權限用三組數字表示擁有者、群組、其他人；讀 4、寫 2、執行 1 相加。','<code>chmod 755</code> 是擁有者可讀寫執行（7），群組和其他人可讀可執行（5）。'],'共用權限給「完全控制」、NTFS 只給「讀取」，使用者從網路進來就只能讀。','權限不是愈大愈方便。為了省事設成 777 或 Everyone 完全控制，等於沒有權限管理。'],
['檔案指令',['<code>ls</code> 列出檔案；<code>-l</code> 顯示詳細資訊，<code>-a</code> 連隱藏檔一起列，常合起來寫成 <code>ls -la</code>。','Linux 的隱藏檔是檔名以「.」開頭的檔案。','<code>cd</code> 切換目錄，<code>pwd</code> 看現在在哪個目錄。'],'找不到設定檔 <code>.bashrc</code>，用 <code>ls -la</code> 就看到了，因為它是隱藏檔。','Linux 指令和檔名有分大小寫，<code>LS</code> 和 <code>ls</code> 不一樣。'],
['日誌',['<code>tail -f 檔名</code> 會持續顯示檔案新增加的內容，適合盯著正在寫入的 log。','<code>tail -n 100</code> 只看最後 100 行；<code>less</code> 可以上下翻頁慢慢看。','系統日誌多半放在 <code>/var/log</code>。'],'重現問題的時候，另開一個視窗跑 <code>tail -f app.log</code>，錯誤一出來馬上看得到。','不要用 <code>cat</code> 去開很大的 log 檔，畫面會被洗掉，也看不到後續新增的內容。'],
['服務管理',['使用 systemd 的系統用 <code>systemctl</code> 管理服務。','常用的有 <code>start</code>、<code>stop</code>、<code>restart</code>、<code>status</code>；<code>enable</code> 是設定開機自動啟動。','服務起不來，先看 <code>systemctl status</code> 和 <code>journalctl -u 服務名稱</code>。'],'改完網站設定檔，執行 <code>systemctl restart nginx</code> 讓新設定生效。','<code>start</code> 只是這一次啟動。沒有 <code>enable</code>，重開機之後服務不會自己起來。'],
['磁碟空間',['<code>df -h</code> 看每個磁碟分割區的總量、已用和剩餘空間，<code>-h</code> 是用好讀的單位顯示。','<code>du -sh 目錄</code> 看某個目錄佔了多少空間。','磁碟滿了會造成服務寫不進資料而異常。'],'網站突然出錯，<code>df -h</code> 一看根目錄用到 100%，原來是 log 把磁碟寫滿了。','<code>df</code> 是看整個分割區，<code>du</code> 是看目錄，兩個用途不同，別搞混。'],
['權限提升',['<code>sudo</code> 讓有授權的使用者，暫時用管理員（root）權限執行一個指令。','誰可以用 sudo、可以執行哪些指令，都可以設定，而且會留下紀錄。','平常用一般帳號，需要時才 sudo，可以減少誤操作的傷害。'],'一般帳號要重啟服務，執行 <code>sudo systemctl restart nginx</code>，輸入自己的密碼即可。','不要因為方便就一直用 root 登入做事，打錯一個指令的後果會大很多。'],
['文字搜尋',['<code>grep 關鍵字 檔名</code> 會把含有關鍵字的那幾行找出來。','<code>-i</code> 不分大小寫，<code>-n</code> 顯示行號，<code>-r</code> 連子目錄一起找。','可以和其他指令用管線串起來，例如 <code>tail -f app.log | grep error</code>。'],'幾十萬行的 log 裡只想看錯誤，執行 <code>grep error app.log</code> 就只剩相關的行。','grep 預設有分大小寫，找 <code>error</code> 找不到 <code>ERROR</code>，要加 <code>-i</code>。'],
['行程管理',['<code>top</code> 即時顯示各個行程使用 CPU 和記憶體的狀況，預設依 CPU 用量排序。','<code>ps aux</code> 列出當下所有行程的快照。','<code>kill 行程編號</code> 可以結束一個行程。'],'主機突然變慢，執行 <code>top</code>，排在最上面的那個行程就是吃最多 CPU 的。','看到用量高不要馬上砍掉，先確認它是什麼、為什麼高，砍錯可能讓服務中斷。']]},
net:{0:[
['IP 與子網路',['IP 位址分成「網路」和「主機」兩部分，子網路遮罩用來劃分這條界線。','<code>/24</code> 表示前 24 個位元是網路部分，寫成遮罩就是 255.255.255.0。','同一個子網路的電腦可以直接互通，不同子網路要經過閘道。'],'192.168.1.10/24 和 192.168.1.200/24 在同一個網段；192.168.2.10 就不是。','IP 設對但遮罩設錯，會出現「有些連得到、有些連不到」的怪現象。'],
['DNS',['DNS 把好記的名稱（例如網址）轉換成電腦用的 IP 位址。','用 IP 連得到、用名稱連不到，問題多半出在 DNS。','<code>nslookup 名稱</code> 可以查這個名稱解析成什麼。'],'ping 伺服器的 IP 會通，但輸入伺服器名稱就說找不到，先查 DNS 設定和 DNS 伺服器。','「網路斷了」和「DNS 壞了」從使用者看起來很像，要用 IP 測一次才分得出來。'],
['DHCP',['DHCP 會自動分配 IP 位址、子網路遮罩、預設閘道和 DNS 給電腦。','Windows 電腦拿不到 DHCP 配發的位址時，會自己設成 169.254.x.x。','所以看到 169.254 開頭，代表它沒有連到 DHCP 伺服器。'],'電腦 IP 變成 169.254.10.5，先檢查網路線、交換器埠，再看 DHCP 伺服器有沒有正常。','169.254 不是「有拿到 IP」，那是電腦找不到 DHCP 時自己填的，通常上不了網。'],
['交換器',['交換器在同一個區域網路裡，依照 MAC 位址把資料送到正確的埠。','它會記住每個埠後面接了哪些 MAC 位址。','跨不同網段的轉送是路由器的工作，依據的是 IP 位址。'],'兩台在同一個辦公室網段的電腦互傳檔案，資料只經過交換器，不用經過路由器。','交換器看 MAC、路由器看 IP，這兩個常常被講反。'],
['路由與閘道',['預設閘道是電腦要連到「其他網段」時，把資料交出去的那個出口。','閘道沒設或設錯，同網段還是連得到，但出不了這個網段。','閘道通常是路由器或三層交換器的位址。'],'同辦公室的印表機印得出來，但外部網站全部打不開，先看預設閘道。','閘道的位址必須和電腦在同一個網段，不然電腦根本找不到它。'],
['連接埠與協定',['一台主機上有很多服務，用連接埠號碼來區分。','常見的有 HTTP 80、HTTPS 443、DNS 53、SSH 22、遠端桌面 3389。','HTTPS 是加密過的 HTTP，傳輸內容不會被中途看到。'],'防火牆要讓外面連得到公司網站，要開放的是 443。','連接埠有開不代表服務正常，連接埠沒開則一定連不到，兩件事要分開確認。']]},
sec:{0:[
['資安基本觀念',['資訊安全有三個基本要素，合稱 CIA。','機密性：只有該看的人看得到。','完整性：資料沒有被不當竄改。','可用性：需要的時候用得到。'],'資料外洩傷到機密性，資料被偷改傷到完整性，系統被打掛傷到可用性。','資安不只是「不要被偷看」。系統停擺、資料被改錯，一樣是資安事件。'],
['釣魚與社交工程',['社交工程是利用人的信任、好奇或緊張來騙取資料或誘使操作，不靠技術破解。','釣魚信常見的特徵是製造急迫感，要求你馬上點連結或開附件。','不要點信裡的連結，自己另外開官方網站或打電話查證，並依規定通報。'],'收到「帳號異常，請立即重設密碼」的信，不點連結，自己輸入官方網址登入確認，再把信通報給資安窗口。','寄件者名稱可以造假。看起來像主管或資訊單位寄的，不代表就是真的。'],
['多因素驗證',['驗證身分的因素分三種：你知道的（密碼）、你持有的（手機、金鑰）、你本身的（指紋、臉）。','多因素驗證是同時用兩種以上不同種類的因素。','即使密碼外洩，對方沒有第二個因素還是進不來。'],'輸入密碼之後，還要在手機的驗證器上按確認，這就是兩個因素。','密碼加上另一組密碼不算多因素，因為兩個都是「你知道的」。'],
['勒索軟體',['勒索軟體會把檔案加密，再要求付錢換解密金鑰。','懷疑中了，第一步是把這台電腦從網路隔離：拔網路線、關 Wi-Fi，避免擴散。','接著馬上通報，不要自己重灌或刪檔，證據要留給調查用。'],'發現檔案副檔名被改、桌面出現勒索訊息，先拔網路線，再打電話通報資安窗口。','先關機或重灌都不對。關機可能毀掉記憶體裡的證據，重灌則是把線索全部清光。'],
['最小權限',['最小權限原則：只給完成工作所需要的最低權限，不多給。','權限愈大，帳號被盜用或誤操作時的損害就愈大。','工作內容變了、人離職了，權限要跟著調整或收回。'],'只需要查報表的人給唯讀權限，不要因為方便就給管理員。','「先給大一點，之後再收」通常就不會收了，多出來的權限會一直留著。'],
['弱點管理',['弱點掃描是用工具自動找出已知的弱點，範圍廣、速度快。','滲透測試是由人模擬攻擊者，實際嘗試利用弱點，看能打到多深。','兩者互補：掃描適合定期做，滲透測試適合重要系統做深度驗證。'],'弱點掃描報告列出某台主機少了修補程式；滲透測試則會實際試試看能不能藉此拿到權限。','掃描報告沒有高風險，不代表系統安全，它只找得到工具認得的已知弱點。'],
['備份',['3-2-1 原則：至少 3 份資料、放在 2 種不同的媒體、其中 1 份放在異地。','備份要定期做還原測試，確定真的救得回來。','至少一份備份要離線或無法被竄改，才不會跟著被勒索軟體加密。'],'正式資料一份、機房的備份設備一份、另一份放到異地或雲端。','沒測過還原的備份不算備份，真的要用時才發現檔案壞了的例子很多。']]},
db:{0:[
['資料表設計',['主鍵（Primary Key）用來唯一識別資料表裡的每一筆資料。','主鍵的值不能重複，也不能是空值（NULL）。','一張資料表只有一個主鍵，但主鍵可以由多個欄位組成。'],'會員資料表用「會員編號」當主鍵，就算兩個人同名同姓也分得出來。','不要拿會變動的欄位（例如姓名、電話）當主鍵，之後要改會牽動很多地方。'],
['SQL 查詢',['<code>SELECT 欄位 FROM 資料表 WHERE 條件</code> 是查詢的基本句型。','<code>WHERE</code> 用來篩選符合條件的資料列。','<code>JOIN</code> 依照關聯欄位，把兩張資料表合在一起查。'],'<code>SELECT * FROM members WHERE age &gt; 65</code> 取出 65 歲以上的會員。','JOIN 忘了寫關聯條件，兩張表會全部互相配對，結果筆數暴增。'],
['資料異動安全',['執行 <code>UPDATE</code> 或 <code>DELETE</code> 之前，先確認 <code>WHERE</code> 條件對不對。','沒有 <code>WHERE</code> 的話，整張資料表都會被改掉或刪掉。','先用同樣的條件 <code>SELECT</code> 一次，確認筆數和內容再動手，並且先備份或用交易包起來。'],'想刪一筆測試資料，先 <code>SELECT</code> 確認只有一筆，再把 <code>SELECT *</code> 換成 <code>DELETE</code>。','「我只是改一筆」是最常聽到的事故開場白，少打一個條件就是整張表。'],
['交易',['交易把多個資料異動包成一組，確保資料前後一致。','ACID 是交易的四個特性：不可分割性（Atomicity）、一致性、隔離性、持久性。','A 的意思是整組動作要嘛全部成功，要嘛全部不做，不會只做一半。'],'轉帳時「甲扣款」和「乙入帳」放在同一個交易，其中一步失敗就整組復原。','交易沒有提交（COMMIT）之前，其他人看不到你的修改，連線斷了也會被復原。'],
['索引',['索引像書的目錄，讓資料庫不用整張表掃過一遍就能找到資料。','好處是查詢變快；代價是佔空間，而且新增、修改、刪除時要多維護索引，會變慢。','所以索引要建在常用來查詢或關聯的欄位，不是愈多愈好。'],'訂單資料表常常用「客戶編號」查詢，在這個欄位建索引後，查詢從幾秒變成瞬間。','每個欄位都建索引，查詢不見得變快，寫入一定變慢。'],
['SQL 注入',['SQL 注入是攻擊者把惡意的 SQL 片段塞進輸入欄位，讓程式執行到不該執行的指令。','最有效的防範是參數化查詢，把使用者輸入當成資料，不是指令的一部分。','另外搭配輸入檢查，以及資料庫帳號只給必要權限。'],'登入欄位輸入 <code>\' OR \'1\'=\'1</code> 就能登入，代表程式是直接把輸入字串接進 SQL。','只靠過濾特殊字元不夠，總有沒想到的寫法；要從寫法上根本避免字串拼接。'],
['備份還原',['完整備份是備份全部資料。','差異備份是備份「上一次完整備份之後」所有變動的資料。','還原時需要最近一次完整備份，加上最新的一份差異備份。'],'週日做完整備份、每天做差異備份。週三壞掉時，還原週日的完整備份再加週二的差異備份。','差異備份和增量備份不一樣。增量備份還原時，要把每一份依序全部套回去。']]},
code:{0:[
['自動化',['固定、重複、規則清楚的工作，最適合寫成腳本交給電腦做。','腳本可以搭配排程，在指定時間自動執行。','自動化之後要留下執行紀錄，失敗時要有人知道。'],'每天早上複製報表到另一個資料夾，寫成腳本加上排程，就不用再手動做。','自動化不是寫完就沒事了。來源檔案沒產生、路徑改了，腳本都要能發現並通知。'],
['程式基礎',['變數用來存放資料，之後可以拿出來用或修改。','<code>if</code> 是條件判斷：條件成立才執行某一段程式。','迴圈是把同一段程式重複執行很多次。','讀程式時由上往下、一行一行跟著變數的值走。'],'<code>if 剩餘空間 &lt; 10:</code> 接著寄出警告信，就是「空間不夠才通知」。','<code>=</code> 是把值放進變數，<code>==</code> 才是比較兩邊是否相等，新手很常寫錯。'],
['除錯',['錯誤訊息裡最重要的是「錯誤類型」和「發生在哪一行」。','Python 的錯誤訊息要看最後幾行，那裡才是真正的原因。','看懂訊息之後，再回到那一行檢查變數的值。'],'訊息最後一行寫 <code>FileNotFoundError</code> 和一個路徑，就知道是檔案路徑不對。','看到一大串紅字不要直接關掉重跑。訊息通常已經把答案告訴你了。'],
['測試環境',['會改資料的腳本，第一次一定在測試環境跑。','測試環境的資料壞了可以重來，正式環境不行。','沒有測試環境時，至少先備份，並用少量資料或只讀不寫的模式試跑。'],'批次改檔名的腳本，先複製一個資料夾出來試，確認結果正確再對正式資料夾執行。','「這支很簡單不會錯」正是最容易出事的時候，邏輯對但路徑打錯一樣會毀資料。'],
['版本控制',['版本控制會記錄檔案每一次的修改：誰改的、什麼時候、改了什麼。','改壞了可以回到之前的版本，也可以比較兩個版本差在哪裡。','多人一起改同一份程式時，可以合併彼此的修改。'],'腳本改完之後反而不能跑，用 Git 看一下和上一版差在哪，馬上找到改錯的那一行。','把檔名存成「最終版」「最終版2」不是版本控制，過一陣子沒有人分得出哪個才是對的。'],
['密碼與金鑰',['帳號密碼和金鑰不要直接寫在程式碼裡。','要放在程式以外的地方，例如環境變數、權限受限的設定檔，或專門的密碼管理服務。','含有密碼的檔案不要放進版本控制。'],'腳本從環境變數讀取資料庫密碼，程式碼本身分享給同事也不會洩漏密碼。','密碼一旦推上版本控制，就算之後刪掉，歷史紀錄裡還是查得到，必須換掉密碼。'],
['腳本安全',['腳本裡用到變數的地方，要想一下「如果它是空的會怎樣」。','刪除類的指令尤其危險：路徑變數是空的，可能會刪到上一層甚至根目錄。','執行前先檢查變數有沒有值，路徑對不對，不對就停下來。'],'<code>rm -rf "$DIR"/*</code> 如果 <code>DIR</code> 是空的，就變成 <code>rm -rf /*</code>，會從根目錄開始刪。','「平常都有值」不代表永遠有值。設定檔讀不到、打錯變數名稱，它就是空的。']]},
trouble:{0:[
['問診與分類',['先問清楚現象，再判斷是哪一類問題，不要一聽就動手。','「開不了機」可能是沒電、有電沒畫面、有畫面但進不了系統，三種方向完全不同。','追問「在這之前有沒有改過什麼、裝過什麼、發生過什麼」，最容易找到線索。'],'使用者說昨天還好好的，一問才知道昨天下班前裝了一個新軟體。','使用者講的是他的理解，不一定是事實。「開不了機」常常其實是「螢幕沒亮」。'],
['顯示問題',['主機有電、風扇在轉但沒畫面，先從最簡單、最外面的地方查起。','檢查螢幕有沒有開、電源燈亮不亮、訊號線有沒有鬆、輸入來源選對了沒。','外面都確認沒問題，再往主機裡面的記憶體、顯示卡查。'],'沒畫面的案子，很大一部分是螢幕訊號線鬆了，或螢幕切到別的輸入來源。','不要一開始就拆主機。由外而內、由簡單到複雜，才不會白忙。'],
['開機問題',['<code>No bootable device</code> 表示電腦找不到可以開機的磁碟。','可能是開機順序被改、磁碟的線鬆了、磁碟故障，或插著不能開機的隨身碟。','先拔掉外接裝置、進 BIOS 看有沒有認到磁碟。'],'電腦插著隨身碟開機就出現這個訊息，拔掉之後正常開機。','看到這個訊息不要馬上重灌。如果是磁碟快壞了，應該先救資料。'],
['變因控制',['排除問題時一次只改一個地方，改完就測試。','這樣才知道是哪一個改動讓問題解決，或讓問題變得更糟。','改了沒效果就改回去，再試下一個。'],'網路不通時先只換網路線測試；沒好就換回來，再試換交換器的埠。','同時改三個地方然後好了，等於不知道原因，下次遇到一樣不會修。'],
['效能問題',['電腦變慢，先看資源用在哪裡：CPU、記憶體、磁碟、網路。','Windows 用工作管理員，Linux 用 <code>top</code>，找出是哪個程式佔用最多。','再問是「突然變慢」還是「愈來愈慢」，兩種的原因方向不同。'],'工作管理員顯示磁碟使用率一直是 100%，往下看是某個程式在大量讀寫。','「慢」不要直接解讀成要加記憶體或換電腦，要先看數據。'],
['當機畫面',['藍底白字的當機畫面（BSOD）上有停止代碼，有時還有出問題的檔案名稱。','處理之前先把停止代碼記下來或拍照，它是找原因最重要的線索。','再回想當機前做了什麼，例如剛更新驅動程式或裝了新硬體。'],'停止代碼旁邊顯示某個驅動檔案的名稱，把那個驅動更新或回復到前一版就解決了。','重開機之後畫面就消失了。沒記下代碼，只能等它再當一次。'],
['結案確認',['處理完之後，請使用者實際操作一次，確認問題真的解決。','確認的是使用者原本要做的那件事，不是你自己測的那一項。','最後把原因和處理方式記錄下來，下次有人遇到可以參考。'],'印表機修好後，請使用者從他平常用的那個程式印一張，確認沒問題再結案。','「我這邊測是好的」不等於使用者那邊好了，沒確認就結案很容易被重開一次。']]},
svc:{0:[
['問診',['使用者的描述通常很模糊，要用具體的問題把現象問出來。','先問：看到什麼畫面或訊息、什麼時候開始、做了什麼動作之後發生。','再問影響範圍：只有他、還是旁邊的人也一樣。'],'「電腦怪怪的」追問之後，其實是「開某個系統時會跳出錯誤訊息」。','不要用自己的猜測代替發問，也不要一開始就問使用者聽不懂的技術問題。'],
['進度回報',['一時解決不了，要主動告訴使用者現在的狀況。','說清楚三件事：目前查到哪裡、接下來要做什麼、大概什麼時候會再回覆。','時間到了就算還沒解決，也要回報一次。'],'「目前確認不是您電腦的問題，我要再查伺服器那邊，下午三點前跟您回報。」','「我再看看」然後就沒消息，是使用者最不滿意的情況，比修不好還糟。'],
['交接',['交接要讓接手的人不用再問你，就能繼續處理。','內容要有：問題現象、已經做過什麼、目前的判斷、下一步要做什麼、使用者的聯絡方式。','已經試過但沒用的方法也要寫，免得對方重做一次。'],'「已換過網路線和交換器埠都沒改善，懷疑是網路卡，明天要帶備品去換，使用者分機某某某。」','只寫「某某的電腦有問題，還沒好」等於沒交接。'],
['向上報告',['對不懂技術的主管，先講結論和影響，再講原因和處理。','用對方關心的角度講：影響多少人、多久、現在恢復了沒、接下來要做什麼。','技術細節留到對方問的時候再說。'],'「今天上午九點到九點四十，報表系統無法使用，影響約五十人，現在已恢復。原因是磁碟空間不足，已清理並加上監控。」','從技術細節開始講，主管聽了三分鐘還不知道事情嚴不嚴重。'],
['情緒處理',['使用者生氣時，先讓他把話講完，不要急著解釋或反駁。','用一句話讓對方知道你有聽到他的困擾，再把話題帶回問題本身。','對方氣的通常是事情沒辦法做，不是針對你個人。'],'「造成您沒辦法作業真的很抱歉，我現在馬上幫您看，請問畫面上目前顯示什麼？」','一開口就說「這不是我們的問題」，即使是事實，也只會讓場面更僵。'],
['結案確認',['你覺得修好了，不代表使用者的問題解決了。','結案之前請使用者確認，並問一下還有沒有其他狀況。','確認之後再結案，並留下處理紀錄。'],'「我這邊已經處理好了，麻煩您再開一次試試看，沒問題的話我就結案。」','沒確認就結案，使用者發現沒好會覺得被敷衍，還要再報修一次。'],
['誠實回覆',['不確定的事就說不確定，不要用猜的回答。','同時告訴對方你會去查，以及什麼時候回覆。','答錯比晚一點回答的代價高，對方可能照著錯的資訊去做。'],'「這個我不確定，不想給您錯的答案。我查一下，今天下班前回覆您。」','怕被覺得不專業而硬答，之後被發現答錯，信任感損失更大。'],
['通報',['可能影響很多人的異常，一發現就要通報，不用等查出原因。','先報現象和影響範圍，原因查到再補。','主管愈早知道，愈能調度人力和對外說明。'],'發現多個單位同時回報系統登不進去，立刻通報主管「疑似大範圍異常，原因確認中」。','想等查清楚再報，結果主管是從別的單位口中才知道，這是最糟的狀況。']]},
gov:{0:[
['資通安全管理法',['《資通安全管理法》規範的對象是公務機關，以及特定非公務機關。','特定非公務機關包括關鍵基礎設施提供者、公營事業、特定財團法人，以及受政府控制的事業、團體或機構。','受規範的機關要訂定資通安全維護計畫，並依責任等級辦理應辦事項。'],'關鍵基礎設施目前公告九個領域：能源、水資源、通訊傳播、交通、金融、緊急救援與醫院、政府機關、科學園區與工業區、糧食。這些領域裡被指定的提供者，就是特定非公務機關。這裡依據的是 2025 年 9 月修正、同年 12 月 1 日施行的版本。','這部法不是只管政府機關，被指定的民間單位同樣要遵守。'],
['事件通報',['知道發生資通安全事件後，要在一小時內依規定方式通報。','資通安全事件依嚴重程度分成四級，第四級最嚴重。','通報之後還要在規定時限內完成損害控制或復原，並提出調查與改善報告。'],'晚上十點確認主機遭入侵，十一點前就要完成通報，不能等到隔天上班。','「先查清楚再通報」是錯的。通報時限是從「知悉」事件開始算，不是從查完開始算。'],
['個人資料保護法',['病歷、醫療、基因、性生活、健康檢查和犯罪前科，屬於特種個人資料。','特種個人資料原則上不得蒐集、處理或利用，只有法律明定的例外情形才可以。','一般個人資料的蒐集，也要有特定目的並且符合法定要件。'],'辦活動時想順便收集參加者的健康狀況，這屬於特種個資，沒有法定依據就不能收。','「當事人自己願意給」不代表怎麼用都可以，利用仍然要在特定目的的範圍內。'],
['ISO 27001',['ISO 27001 是資訊安全管理系統（ISMS）的國際標準。','它規範的是一套管理制度：辨識風險、選擇控制措施、持續檢討改善。','組織可以請第三方驗證機構稽核，通過後取得證書。'],'公司導入 ISO 27001，會盤點資訊資產、做風險評鑑、訂定管理程序，並定期內部稽核。','拿到證書不代表不會出事，它證明的是有一套在運作的管理制度。'],
['風險管理',['風險處理有四種方式：降低、移轉、避免、接受。','降低是加上控制措施；移轉是交給保險或委外；避免是乾脆不做那件事。','接受是評估後認為風險在可容忍範圍內，並由有權限的人核可。'],'舊系統無法修補：加上網路隔離是降低，直接汰換是避免，主管簽核後繼續使用是接受。','「接受風險」不是放著不管，它需要有評估、有核可、有紀錄。'],
['稽核',['稽核是確認實際做法有沒有符合規定，並找出可以改善的地方。','被問到還沒做到的事項，要據實說明現況，並提出改善的規劃。','受稽核時提供的資料和說法要真實，要有紀錄可以佐證。'],'「這一項目前還沒做到，我們預計下一季完成，這是目前的規劃。」','為了過關而臨時補假紀錄或說已經做了，被發現會比「沒做到」嚴重得多。'],
['存取權限',['帳號和權限會隨著人員調動、離職、專案結束而不再需要。','沒有定期清查，這些多出來的帳號和權限會一直留著，成為被濫用的入口。','清查時由主管確認每個人的權限是否仍然需要，不需要的就收回。'],'每半年把系統帳號清單交給各單位主管確認，把離職人員和已調職人員的權限移除。','有權限不代表可以隨便看。存取資料必須是職務上有需要。']]}};

const MORE={
hw:{
'記憶體':['處理器只能直接處理放在記憶體裡的資料。硬碟雖然容量大，但讀寫速度比記憶體慢很多，所以程式要先從硬碟載入到記憶體才能跑。記憶體是靠通電維持資料的，電一斷就全部清空。','記憶體是工作桌，硬碟是檔案櫃；桌子斷電就清空。'],
'儲存裝置':['HDD 要等碟片轉到位置、讀寫頭移過去才能讀，這個機械動作就是慢的原因，也是怕摔的原因。SSD 直接用電訊號讀寫晶片，沒有等待時間。','HDD 會轉所以慢又怕摔，SSD 是晶片所以快；兩個都要備份。'],
'開機自我檢測':['作業系統還沒載入之前，電腦沒辦法在螢幕上顯示詳細訊息，所以主機板只能用最原始的方式（嗶聲、燈號）回報。記憶體是開機最早用到的零件之一，它有問題就什麼都出不來。','沒畫面又嗶嗶叫，先重插記憶體。'],
'磁碟陣列':['RAID 1 是同一份資料寫兩次，所以壞一顆還有另一顆。RAID 5 是把資料分散到各顆，另外算出一份「同位元」；任何一顆壞了，都可以用剩下的資料加同位元算回來，但同時壞兩顆就算不回來了。','RAID 1 兩顆鏡射，RAID 5 至少三顆壞一顆沒事；RAID 不是備份。'],
'電力與 UPS':['電腦在寫入資料的瞬間斷電，檔案可能只寫了一半而損壞。UPS 平常讓市電通過並幫電池充電，一偵測到斷電就在極短時間內切換成電池供電，讓設備感覺不到中斷。','UPS 是用來撐過去和好好關機，不是讓你繼續上班。'],
'維修安全':['人體走動摩擦就會帶靜電，自己感覺不到的電壓就足以打壞晶片。電源線沒拔時，主機板上仍有待機電力，插拔零件可能短路。','關機、拔線、放靜電，三步做完才動手。'],
'散熱':['晶片溫度太高會運算出錯甚至燒毀，所以內建保護機制：先降速減少發熱，還是太熱就直接斷電。灰塵像棉被一樣蓋住散熱片，熱就散不出去。','突然關機先摸機殼、看風扇，清灰塵比重灌有用。'],
'驅動程式':['每一家廠商的硬體做法都不一樣，作業系統不可能認得全世界的裝置，所以由廠商寫一支「說明書程式」告訴系統怎麼跟它溝通，這就是驅動程式。','驅動是硬體的翻譯，型號要對、來源要原廠。'],
'更新管理':['修補程式一發布，攻擊者就能比對更新前後的差異，反推出漏洞在哪裡，接著去打還沒更新的電腦。所以修補程式公開之後，沒更新的機器反而更危險。','修補一公開，沒更新的就變成目標。'],
'執行環境':['很多程式都會用到同樣的基本功能，與其每支程式各帶一份，不如大家共用一套，這套共用的東西就是執行環境。程式啟動時找不到它，就會說缺少某個 DLL。','缺 DLL 就裝官方的執行環境，不要上網抓單一 DLL。'],
'軟體安裝規範':['公司要對電腦上的軟體負責：授權合不合法、有沒有漏洞、誰來更新。沒有經過申請的軟體，這三件事都沒有人管。','公司電腦裝軟體：先申請、用核可來源、看清楚授權。'],
'相容性':['新版 Windows 的某些行為和舊版不同，舊程式照舊的方式做事就會出錯。相容模式是讓系統在這支程式面前「假裝」成舊版，回答它預期的答案。','相容模式是讓 Windows 假裝成舊版，能救一部分，不會變安全。'],
'瀏覽器問題':['瀏覽器為了加快速度，會把網頁的檔案存一份在本機（快取）。網站改版後，如果瀏覽器還在用舊的那一份，畫面就會跑掉。擴充功能則會修改網頁內容，也可能造成異常。','只有這台怪：清快取、開無痕、換瀏覽器比對。'],
'作業系統架構':['32 位元表示位址只有 32 個位元可以用，能標示的記憶體位置最多就是 2 的 32 次方，大約 4 GB。超過的記憶體，系統根本沒有號碼可以指到它。','32 位元最多用到約 4 GB；64 位元可以跑 32 位元程式，反過來不行。'],
'軟體授權':['「免費」講的是價錢，「開源」講的是能不能看到並修改原始碼，兩件事各自獨立。開源授權還分寬鬆型和有「傳染性」的類型，後者要求你修改後也要公開。','免費講價錢，開源講原始碼；開源也有授權條款要遵守。']},
os:{
'網路指令':['排除網路問題時要知道四件事：IP、遮罩、閘道、DNS。只打 ipconfig 會少掉 DNS 和 DHCP 的資訊，而這兩項正好是很常出問題的地方。','查網路設定打 <code>ipconfig /all</code>，要看 DNS 一定要加 /all。'],
'網域與驗證':['如果每台電腦各自管理帳號，一百台電腦就要建一百次，改密碼也要改一百次。網域把帳號集中放在網域控制站，每台電腦登入時都去問它「這個人的帳號密碼對不對」。','加入網域後，帳號由網域控制站驗證，一組帳號到處登入。'],
'群組原則':['電腦開機和使用者登入時，會去網域控制站領取適用的原則並套用；之後每隔一段時間再自動檢查一次。所以改完原則要等下一次檢查才會生效，除非手動叫它馬上去領。','群組原則一次管全部；要馬上生效打 <code>gpupdate /force</code>。'],
'事件紀錄':['系統和服務出問題時，當下通常沒有人在看螢幕，所以它們會把發生的事寫進事件紀錄。事後要查原因，就是回來讀這份「黑盒子」。','Windows 出事先看事件檢視器，用發生時間去對。'],
'系統修復':['Windows 留有一份系統檔的正確版本。sfc 把目前的系統檔逐一和正確版本比對，不一樣就換回來，所以它只處理系統檔，不會碰你的資料。','系統檔壞了用 <code>sfc /scannow</code>，它不是掃毒也不是重灌。'],
'遠端桌面':['遠端桌面等於把這台電腦的鍵盤、滑鼠和螢幕延伸到網路上。只要連得到 3389 又猜得到帳號密碼，就能完全操作這台電腦，所以攻擊者會不停掃描這個埠。','遠端桌面是 3389，絕不直接開到網際網路，要走 VPN。'],
'檔案權限':['Windows 從網路存取共用資料夾，要先過「共用權限」這道門，再過「NTFS 權限」這道門，兩道都要通過，所以結果是比較嚴格的那個。Linux 的 7、5、5 則是把讀 4、寫 2、執行 1 加起來：7 是 4+2+1，5 是 4+1。','讀 4 寫 2 執行 1，加起來就是權限數字；Windows 兩層權限取嚴格的。'],
'檔案指令':['Linux 把檔名以「.」開頭的檔案當成隱藏檔，多半是設定檔，平常不顯示以免畫面太亂。<code>-a</code> 是 all 的意思，<code>-l</code> 是 long（詳細）的意思。','<code>ls -la</code>：l 看詳細，a 看全部含隱藏檔。'],
'日誌':['log 檔會一直往後面增加新的內容。一般的看法只會顯示打開當下的內容；<code>tail -f</code> 的 f 是 follow，會停在檔案尾端，一有新的行就立刻印出來。','盯 log 用 <code>tail -f</code>，f 就是 follow 跟著看。'],
'服務管理':['服務是在背景持續執行的程式，沒有視窗可以關。設定檔通常只在服務啟動時讀一次，所以改了設定要重新啟動，服務才會讀到新的內容。','改完設定要 <code>systemctl restart</code>；要開機自動啟動要 <code>enable</code>。'],
'磁碟空間':['程式執行時需要寫入 log、暫存檔和資料。磁碟滿了寫不進去，程式就會出現各種看起來不相干的錯誤，所以服務異常時檢查磁碟空間是基本動作。','<code>df -h</code> 看磁碟還剩多少，<code>du -sh</code> 看是誰佔的。'],
'權限提升':['root 可以做任何事，包括刪掉整個系統，而且不會多問一句。平常用一般帳號，等於多一層保護：真的需要時才用 sudo 明確表示「這一行我要用管理員權限」，系統也會記下是誰做的。','平常用一般帳號，需要時才 <code>sudo</code>，而且會留紀錄。'],
'文字搜尋':['log 檔動輒幾十萬行，用眼睛找不可能。grep 會一行一行檢查，只把含有關鍵字的行印出來，等於幫你做篩選。','大檔案找關鍵字用 <code>grep</code>，不分大小寫加 <code>-i</code>。'],
'行程管理':['每個執行中的程式都是一個行程，會佔用 CPU 和記憶體。主機變慢時，通常是某一個行程佔掉大部分資源，<code>top</code> 會把它排在最上面。','主機慢先打 <code>top</code>，最上面那個就是吃最多的。']},
net:{
'IP 與子網路':['IP 位址像「路名加門牌」。遮罩告訴電腦前面多少位元是路名（網路）、後面多少是門牌（主機）。電腦要傳資料時先比對路名：一樣就直接送，不一樣就交給閘道。','/24 就是前三段是網路、最後一段是主機，遮罩 255.255.255.0。'],
'DNS':['電腦之間其實只認 IP 位址，名稱是給人看的。每次你輸入名稱，電腦都要先問 DNS 伺服器「這個名稱的 IP 是多少」，問不到就不知道要連去哪裡。','用 IP 會通、用名稱不通，就是 DNS。'],
'DHCP':['電腦開機時還沒有 IP，會先對整個網段廣播「誰可以給我位址」。DHCP 伺服器聽到就回覆一組設定。如果一直沒人回，Windows 會自己挑一個 169.254 開頭的位址先頂著用。','看到 169.254 開頭，就是沒找到 DHCP 伺服器。'],
'交換器':['每張網路卡都有一個獨一無二的 MAC 位址。交換器會記下「哪個 MAC 接在哪個埠」，收到資料時查這張表，只送到目的地所在的那個埠，不會吵到其他人。','交換器看 MAC 管同網段，路由器看 IP 管跨網段。'],
'路由與閘道':['電腦只知道怎麼把資料送給同一個網段的鄰居。目的地不在同網段時，它不知道路怎麼走，就一律交給預設閘道，由閘道負責往外轉送。','同網段會通、對外不通，先看預設閘道。'],
'連接埠與協定':['IP 位址把資料送到正確的主機，但一台主機上同時有很多服務。連接埠就像大樓裡的門牌號碼，讓資料送到正確的那個服務。','HTTP 80、HTTPS 443、DNS 53、SSH 22、遠端桌面 3389。']},
sec:{
'資安基本觀念':['所有資安措施都是在保護這三件事的其中一件以上。分析一個事件或設計一項控制時，用 CIA 逐一檢查，可以避免只顧到「不被偷看」而漏掉其他兩項。','CIA：機密性不被偷看、完整性不被亂改、可用性要用時能用。'],
'釣魚與社交工程':['人在緊張或趕時間的時候，會跳過平常的判斷。攻擊者刻意製造「不馬上處理就會出事」的壓力，就是要你來不及想。所以愈急的信，愈要停下來查證。','愈急愈要停：不點信裡的連結，自己另外查證，然後通報。'],
'多因素驗證':['密碼可能被猜到、被側錄或在別的網站外洩。攻擊者要同時取得你的密碼和你手上的手機，難度高很多。兩個因素要不同種類才有意義，否則一次外洩就兩個都沒了。','多因素是不同「種類」：知道的、持有的、本身的，任兩種。'],
'勒索軟體':['勒索軟體會沿著網路去加密其他電腦和共用資料夾，所以每多連線一分鐘，受害範圍就可能擴大。拔掉網路可以立刻切斷它的擴散路徑。保留現場則是為了之後查出入侵管道。','中勒索：先斷網、再通報、不關機不重灌。'],
'最小權限':['帳號被盜或人員操作失誤時，能造成多大的損害，取決於這個帳號有多少權限。權限愈小，出事時的影響範圍就愈小。','只給做事需要的最低權限，用不到就收回。'],
'弱點管理':['弱點掃描是拿一份「已知弱點清單」逐一比對，快但只找得到清單上有的。滲透測試是由人思考怎麼把幾個小問題串起來打進去，能發現工具看不出來的路徑。','掃描是機器比對清單，滲透測試是人實際打打看。'],
'備份':['3 份是防單一份損壞；2 種媒體是防同一類設備同時故障；1 份異地是防火災、淹水或整個機房被勒索軟體加密。每一條都對應一種會把資料全部帶走的災難。','3 份資料、2 種媒體、1 份異地；沒測過還原不算備份。']},
db:{
'資料表設計':['資料表之間靠主鍵互相指認，例如訂單記的是「會員編號」而不是會員姓名。如果主鍵會重複或會變動，其他資料表就不知道指的是哪一筆。','主鍵：唯一、不可空、不要會變。'],
'SQL 查詢':['資料庫執行查詢時，是先決定從哪張表拿（FROM），再篩選哪些列（WHERE），最後才決定顯示哪些欄位（SELECT）。照這個順序想，比較不會寫錯。','SELECT 拿欄位，FROM 哪張表，WHERE 篩哪幾筆。'],
'資料異動安全':['資料庫不會問「你確定嗎」，指令一送出就執行。少了 WHERE，資料庫的理解就是「每一筆都要改」。先用 SELECT 驗證條件，是在動手前唯一的確認機會。','UPDATE、DELETE 之前，先用同樣的 WHERE 去 SELECT 一次。'],
'交易':['很多作業要改好幾筆資料才算完成，中途如果當機，就會停在「改了一半」的狀態。交易讓資料庫把這幾步當成一個整體，沒有全部完成就全部退回。','交易就是全有或全無，不會只做一半。'],
'索引':['沒有索引時，資料庫要把整張表從頭看到尾才能找到資料。索引是另外維護的一份排好序的清單，可以很快跳到正確位置；但每次資料異動，這份清單也要跟著更新。','索引讓查詢變快、寫入變慢，只建在常查的欄位。'],
'SQL 注入':['程式如果把使用者輸入的文字直接接進 SQL 字串，資料庫分不出哪些是程式原本的指令、哪些是使用者打的字。參數化查詢是先把指令的結構固定下來，輸入只能填進預留的位置當資料。','防 SQL 注入靠參數化查詢，不要用字串拼接。'],
'備份還原':['每天都做完整備份太花時間和空間，所以平日只備份「有變動的部分」。差異備份每次都是跟上一次完整備份比，所以愈後面愈大，但還原時只需要兩份。','還原差異備份：最近一次完整 + 最新一份差異。']},
code:{
'自動化':['人做重複的事會累、會漏、會打錯，電腦不會。把步驟寫成腳本，每次執行的動作都一樣，還能留下紀錄。判斷標準是：這件事是不是每次做法都相同。','固定、重複、規則清楚的事交給腳本，而且要留紀錄。'],
'程式基礎':['再複雜的程式，都是由三種結構組成：一行接一行執行、依條件決定做不做、重複做很多次。看不懂程式時，拿紙筆記下每個變數現在的值，一行一行往下走。','程式三件事：照順序、看條件、重複做。'],
'除錯':['錯誤訊息是程式在告訴你它卡在哪裡。Python 會把一路呼叫的過程列出來，最底下才是真正出錯的地方和原因，所以要從最後面往回讀。','錯誤訊息看最後一行：什麼錯、在哪一行。'],
'測試環境':['程式的邏輯正確，不代表對這一份資料執行的結果正確：路徑、權限、資料格式都可能和你想的不一樣。測試環境讓你在不會造成損失的地方先發現這些差異。','會改資料的腳本，第一次絕不在正式環境跑。'],
'版本控制':['版本控制系統把每一次修改都存成一個可以回去的時間點，並記下是誰、為什麼改。出問題時不用猜，直接比對兩個版本之間的差異。','每次修改都有紀錄，改壞了可以回到上一版。'],
'密碼與金鑰':['程式碼會被複製、分享、放進版本控制，看得到程式碼的人遠比應該知道密碼的人多。把密碼從程式碼分離出來，才能分別控管這兩樣東西。','密碼不寫在程式碼裡，也不放進版本控制。'],
'腳本安全':['腳本執行時，變數會被換成它的值再執行。變數是空的，換完之後那一段就消失了，指令的意思可能完全改變。刪除指令遇到這種情況，後果最嚴重。','刪除指令裡有變數，先檢查它是不是空的。']},
trouble:{
'問診與分類':['同一句「開不了機」，背後可能是電源、螢幕、硬碟或作業系統四種完全不同的問題。先花一分鐘把現象問清楚並分類，可以省下往錯誤方向查的一小時。','先問清楚現象再分類，也問「之前改過什麼」。'],
'顯示問題':['排除問題要從最容易檢查、最常發生的地方開始。線材鬆脫和螢幕設定的發生機率，遠高於主機板或顯示卡故障，而且十秒就能確認。','有電沒畫面：先看螢幕和線，再開主機。'],
'開機問題':['電腦自我檢測完成後，會依照開機順序一個一個找有沒有可以開機的磁碟。全部找完都沒有，就顯示這個訊息。所以原因不外乎：順序錯了、磁碟沒接好、磁碟壞了。','找不到開機裝置：拔外接、看 BIOS 有沒有認到磁碟。'],
'變因控制':['這和做實驗一樣：一次改兩個以上的條件，就無法判斷結果是哪一個造成的。一次只改一項，問題好了就知道原因，沒好就能確定排除這一項。','一次只改一個地方，改完就測。'],
'效能問題':['電腦慢一定是某一項資源不夠用：CPU、記憶體、磁碟或網路。看數據找出是哪一項滿了、是誰用掉的，才能對症處理，否則加錯資源也不會變快。','電腦慢先看數據：CPU、記憶體、磁碟、網路是誰滿了。'],
'當機畫面':['Windows 遇到無法繼續的嚴重錯誤時，會主動停止以免資料損壞，並把原因用停止代碼顯示出來。這個代碼直接指出問題的類別，比任何猜測都準。','藍白畫面先記下停止代碼再做別的。'],
'結案確認':['你測試的方式和使用者實際的用法不一定相同，可能你修好了其中一個原因，但他的操作路徑還會遇到另一個。只有請他照平常的方式做一次，才算驗證。','修好後請使用者自己操作一次，再結案。']},
svc:{
'問診':['使用者不知道哪些資訊對你有用，只會說出他的感覺。你要用問題引導他說出「看到什麼、何時開始、做了什麼」這三項可以拿來判斷的事實。','問三件事：看到什麼、什麼時候開始、做了什麼之後。'],
'進度回報':['等待的人最難受的是「不知道現在怎樣」。即使問題還沒解決，讓對方知道有人在處理、下一步是什麼、何時會再聯絡，他就能安排自己的工作。','沒解決也要回報：查到哪、接下來做什麼、何時再回覆。'],
'交接':['交接的目的是讓事情不會因為換人而中斷或重來。檢驗方式很簡單：接手的人看完之後，能不能不打電話問你就直接繼續做。','交接要寫到對方不用再問你：現象、做過什麼、下一步。'],
'向上報告':['主管要根據你的報告做決定，例如要不要對外說明、要不要調人力。他需要先知道「多嚴重、好了沒」，這些放在最前面，他才能在一開始就抓到重點。','對主管先講結論和影響，技術細節最後。'],
'情緒處理':['人在情緒高漲時聽不進解釋，任何說明都會被當成推託。先讓對方覺得被聽到，情緒降下來之後，才有辦法一起處理問題。','先聽完、先同理，再處理問題；不急著解釋。'],
'結案確認':['案件有沒有解決，是以使用者能不能完成他要做的事為準，不是以你做了什麼為準。多問一句確認，可以避免同一個問題被報修兩次。','你覺得好了不算，使用者確認才算。'],
'誠實回覆':['使用者會依照你說的去做。你說錯了，他可能做出錯誤的決定或白花時間，之後也會懷疑你說的每一句話。「我不確定，我去查」反而讓人覺得可靠。','不確定就說不確定，並說何時回覆。'],
'通報':['大範圍異常的處理需要協調很多人，愈早啟動損失愈小。主管不需要你先有答案，他需要的是儘早知道有這件事，才來得及調度和對外說明。','影響很多人的異常，先通報現象，原因後補。']},
gov:{
'資通安全管理法':['有些單位一旦資通系統出問題，會影響整個社會的運作，例如電力、通訊、金融、醫療。這部法律要求這類單位必須有制度地管理資安，而不是出事才處理。','資安法管公務機關和特定非公務機關，不是只管政府。'],
'事件通報':['資安事件可能同時發生在很多單位。主管機關愈早收到通報，就愈能判斷是不是大規模攻擊，並提醒其他單位防範。所以時限是從「知道」開始算，不等你查清楚。','知悉後一小時內通報，四級裡第四級最嚴重。'],
'個人資料保護法':['這幾類資料一旦外洩，可能讓當事人受到歧視或難以回復的傷害，而且無法像密碼一樣「換一組」。所以法律把規則倒過來：原則上不能碰，有明確依據才可以。','特種個資六類：病歷、醫療、基因、性生活、健康檢查、犯罪前科，原則禁止。'],
'ISO 27001':['標準要求的不是「買了哪些設備」，而是組織有沒有持續做這個循環：找出風險、決定怎麼處理、執行、檢查有沒有效、再改善。證書證明的是這個循環有在運作。','ISO 27001 是資安「管理制度」的標準，可以被驗證。'],
'風險管理':['風險不可能降到零，資源也有限，所以每一項風險都要做選擇。四種處理方式剛好涵蓋所有可能：想辦法變小、讓別人分擔、乾脆不做、或是評估後承擔。','風險四選一：降低、移轉、避免、接受；接受要有人核可。'],
'稽核':['稽核的價值在於找出制度和實際之間的落差。如果受稽核的一方把落差藏起來，問題不會消失，只是變成沒有人知道也沒有人改善的風險。','稽核照實回答，沒做到就說現況和改善規劃。'],
'存取權限':['給權限的時候通常有人申請、有人核准；但人員調動或離職時，往往沒有人記得去收回。時間一久，系統裡就累積很多沒人在用、卻還能登入的帳號。','權限要定期清查，人走了、調職了就收回。']}};

 }else{const m=mo[k[0]]||[],fig=FIG[s.c.id+'/'+k[0]];
  if(!s.ck[s.i]){const qs=pool(s.c,s.l).filter(q=>q.t===k[0]);if(qs.length){const q=qs[Math.floor(Math.random()*qs.length)];s.ck[s.i]={q,opts:shuf(q.a.map((t,z)=>({t,ok:z===0})))};}}

 play.innerHTML='<div class="bar"><span class="name">'+s.c.ic+' '+s.c.name+'・'+TIER[s.l]+'・聽課</span><span class="combo">'+(end?'複習':'第 '+(s.i+1)+'／'+n+' 張')+'</span></div><div class="prog"><i style="width:'+(Math.min(s.i,n)/n*100)+'%"></i></div>'+
  '<div class="qcard lesson">'+body+
  '<div class="topics nav">'+s.cards.map((x,j)=>'<button data-j="'+j+'" class="'+(j===s.i?'on ':'')+(s.ck[j]&&s.ck[j].pick!==undefined?(s.ck[j].ok?'ok':'no'):'')+'"'+(j===s.i?' aria-current="true"':'')+'>'+x[0]+'</button>').join('')+'</div>'+
  '<div class="row">'+(s.i>0?'<button class="btn ghost" id="lPrev">上一張</button>':'')+(end?'<button class="btn" id="lPrac">開始練習</button><button class="btn ghost" id="lExam">正式考試</button>':'<button class="btn" id="lNext">'+(s.i===n-1?'看複習':'下一張')+'</button>')+'<button class="btn ghost" id="lHome">回職訓中心</button></div></div>';
 const go=j=>{s.i=j;lesson();scrollTo(0,0);};play.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>go(+b.dataset.j));
 play.querySelectorAll('.chk .opt').forEach(b=>b.onclick=()=>{const ck=s.ck[s.i];ck.pick=+b.dataset.z;ck.ok=ck.opts[ck.pick].ok;const y=scrollY;lesson();scrollTo(0,y);});
 if($('lPrev'))$('lPrev').onclick=()=>go(s.i-1);if($('lNext'))$('lNext').onclick=()=>go(s.i+1);
 if($('lPrac')){$('lPrac').onclick=()=>start(s.c,s.l,true);$('lExam').onclick=()=>start(s.c,s.l,false);}
 $('lHome').onclick=goHub;}
function goHub(){play.hidden=true;document.body.classList.remove('inplay');hub.hidden=false;hub.style.display='flex';renderHub();scrollTo(0,0);}
// ===== 作答 =====
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let G=null;
function start(d,l,practice){G={d,l,practice:!!practice,qs:shuf(pool(d,l)).slice(0,NQ),i:0,lives:3,combo:0,score:0,right:0,miss:[]};hub.hidden=true;hub.style.display='none';document.body.classList.add('inplay');play.hidden=false;ask();scrollTo(0,0);}
function ask(){const g=G,q=g.qs[g.i];const opts=shuf(q.a.map((t,k)=>({t,ok:k===0})));
 play.innerHTML='<div class="bar"><span class="name">'+g.d.ic+' '+g.d.name+'・'+TIER[g.l]+(g.practice?'・練習':'')+'</span>'+(g.practice?'':'<span class="hearts" aria-label="剩 '+g.lives+' 條命">'+'❤️'.repeat(g.lives)+'<i>'+'❤️'.repeat(3-g.lives)+'</i></span>')+'<span class="combo">'+(g.combo>=2?'連對 ×'+g.combo:'')+'</span></div><div class="prog"><i style="width:'+(g.i/g.qs.length*100)+'%"></i></div>'+
  '<div class="qcard" id="qc"><span class="qno">第 '+(g.i+1)+'／'+g.qs.length+' 題　分數 '+g.score.toLocaleString()+'</span><p class="q">'+q.q+'</p>'+(q.code?'<pre>'+q.code+'</pre>':'')+'<div class="opts" id="opts"></div><div id="fb"></div></div>';
 const box=$('opts');opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t.replace(/&(?!amp;|lt;|gt;)/g,'&amp;');b.onclick=()=>answer(o,b,opts,q);box.appendChild(b);});}
function answer(o,btn,opts,q){const g=G;[...$('opts').children].forEach((b,k)=>{b.disabled=true;if(opts[k].ok)b.classList.add('right');});const qc=$('qc');
 if(o.ok){g.combo++;g.right++;const mul=g.combo>=6?2:g.combo>=4?1.5:g.combo>=2?1.2:1;g.score+=Math.round(100*mul);qc.classList.add('ok');sfx.good();}
 else{btn.classList.add('wrong');g.combo=0;if(!g.practice)g.lives--;g.miss.push(q);qc.classList.add('ng');sfx.bad();}
 const last=g.i===g.qs.length-1||g.lives<=0;
 $('fb').innerHTML='<div class="why'+(o.ok?'':' bad')+'"><b>'+(o.ok?'✔ 答對了':g.practice?'✘ 答錯了':'✘ 答錯了，扣一條命')+'</b>'+q.why+'</div><button class="btn" id="nx" style="margin-top:12px">'+(last?'看結果':'下一題')+'</button>';
 const nx=$('nx');nx.onclick=()=>{if(last)finish();else{g.i++;ask();scrollTo(0,0);}};nx.focus();}
function finish(){const g=G,n=g.qs.length,dead=g.lives<=0;const stars=dead?0:g.right===n?3:g.right>=n-1?2:1;
 const before=tierOf(g.d);if(!g.practice){SAVE[g.d.id]=SAVE[g.d.id]||{};const old=rec(g.d.id,g.l);SAVE[g.d.id][g.l]={stars:Math.max(old.stars,stars),best:Math.max(old.best,dead?0:g.score)};save();}(dead?sfx.lose:sfx.win)();
 const up=tierOf(g.d)>before,pass=stars>=2;
 const weak=[...new Set(g.miss.map(q=>q.t).filter(Boolean))],hasL=(LEARN[g.d.id]||{})[g.l];
 const head=g.practice?'練習結束':dead?'三條命用完了，這次沒過':pass?(up?'通過！技能升到「'+titleOf(g.d)+'」':'通過！'):'考完了，但錯超過一題，這一級還不算通過';
 play.innerHTML='<div class="qcard"><span class="qno">'+g.d.ic+' '+g.d.name+'・'+TIER[g.l]+'　'+g.d.npc+'</span><p class="q">'+head+'</p>'+(g.practice?'':'<div class="big">'+'★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i></div>')+'<div>答對 '+g.right+'／'+n+' 題'+(g.practice?'　<span class="note">練習不計成績</span>':'　分數 '+g.score.toLocaleString())+'</div>'+(up&&!g.practice?'<div class="note">技能等級代表通過這一級的知識測驗，不等於實作能力的認證。</div>':'')+(weak.length?'<div><b>這次比較弱的主題</b>'+(hasL?'（點了回去看重點）':'')+'<div class="topics">'+weak.map(w=>hasL&&hasL.some(x=>x[0]===w)?'<button data-w="'+w+'">'+w+'</button>':'<span>'+w+'</span>').join('')+'</div></div>':'')+
  (g.miss.length?'<div><b>答錯的題目</b>'+g.miss.map(q=>'<div class="miss">'+q.q+'<small>正確答案：'+q.a[0]+'</small><small>'+q.why+'</small></div>').join('')+'</div>':'')+
  '<div class="row"><button class="btn" id="again">'+(g.practice?'再練一次':'再考一次')+'</button><button class="btn ghost" id="home">回職訓中心</button></div></div>';
 $('again').onclick=()=>start(g.d,g.l,g.practice);$('home').onclick=goHub;play.querySelectorAll('.topics button').forEach(b=>b.onclick=()=>learn(g.d,g.l,b.dataset.w));}
if(window.initVillage3D){document.body.classList.add('full');const ls=$('lists'),lead=document.querySelector('#hub .lead');ls.insertBefore(lead,ls.children[1]);
 ['lsBtn','fsBtn','lsClose'].forEach(i=>$(i).hidden=false);$('lsBtn').onclick=()=>ls.classList.toggle('open');$('lsClose').onclick=()=>ls.classList.remove('open');
 $('fsBtn').onclick=()=>{const d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>{});};
 if(!document.documentElement.requestFullscreen)$('fsBtn').hidden=true;}
if(window.initVillage3D)initVillage3D({courses:COURSES,adv:ADV,locked:c=>lockedBy(c).length>0,talk:openTalk,tier:tierOf,TIER,busy:()=>!talk.hidden||hub.hidden||$('lists').classList.contains('open')});else build2D();
renderHub();
</script>
</body>
</html>
