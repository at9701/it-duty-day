 {t:"個人資料保護法",q:"公司想把含有個資的系統搬到國外的雲端機房。依《個人資料保護法》，最需要先確認什麼？",a:["有沒有主管機關限制國際傳輸的情形，以及接收地對個資的保護是否足夠","雲端機房的建築外觀","當地的天氣","只要國外雲端業者的報價比國內的便宜，就可以直接搬過去，不需要再確認其他的事情"],why:"個資法第 21 條：涉及國家重大利益、接受國保護不完善等情形，主管機關得限制國際傳輸。各產業可能還有自己的規定。"},
 {t:"境外法規",q:"一家設在台灣的公司，網站有對歐盟居民提供服務並蒐集他們的個資。法規上要注意什麼？",a:["除了我國個資法，還可能要遵守歐盟的 GDPR","只要遵守台灣的法律","完全不受任何法律管","只需要在網站的最下方加上一行英文的免責聲明就可以了"],why:"GDPR 有域外效力，對歐盟境內的人提供商品或服務，就算公司不在歐盟也可能適用。"},
 {t:"法律責任",q:"同一件資安事件，機關可能同時面對哪幾種法律責任？",a:["行政罰鍰、民事賠償、刑事責任，可能同時成立","只會有其中一種","完全沒有責任","只會有主管口頭上的責備，除此之外不會有任何後果"],why:"主管機關開罰是行政責任，當事人求償是民事責任，有人涉及犯罪是刑事責任。三者各走各的程序。"},
 {t:"法規遵循",q:"一個產業同時適用《資通安全管理法》、《個人資料保護法》和該產業主管機關的規定。應該怎麼遵循？",a:["各項要求都要符合，產業的特別規定比較嚴格時依特別規定","只挑最寬鬆的一個","只看最新公布的那一個","由公司內部的同仁投票決定今年要遵守哪一部法規，等到明年再換成另外一部"],why:"這些法規是疊加的，不是擇一。實務上會整理成對照表，取各項要求中最嚴格的來設計制度。"},
 {t:"數位證據與隱私",q:"要讓電腦上取得的紀錄在法律程序上被採信，蒐集時最重要的是什麼？",a:["確保完整性（例如計算雜湊值）並記錄取得的過程","檔案要用彩色列印","檔名要取得很長","由部門裡面年資最深的同仁負責操作，並且請其他人在旁邊拍照留念"],why:"對方一定會質疑「這是不是被改過」。能證明從取得到提出都沒變動，證據才有力量。"},
 {t:"合約",q:"和委外廠商簽約時，關於資安事件的條款，最應該談清楚什麼？",a:["通報的時限、配合調查的義務、損害賠償的責任和上限","廠商員工的制服顏色","簽約典禮的地點","廠商每一年的三節要贈送多少份禮品給負責這個案子的承辦人和主管"],why:"出事才發現合約沒寫，就只能協商。特別是責任上限，廠商的範本常寫得很低，要在簽約前談。"},
 {t:"法規遵循",q:"法規修正後，組織內部規章的更新，比較完整的流程是？",a:["差距分析、修訂規章、核准公告、教育訓練、留下紀錄","等稽核開缺失再修","只改文件上的日期","把新的法規條文直接轉寄給全體同仁，請大家自行閱讀並且遵守"],why:"改了文件但沒人知道、沒人照做，等於沒改。稽核會一路看到「同仁知不知道、有沒有照新的做」。"},
 {t:"事件通報",q:"發生應通報的事件，有人建議通報內容「寫輕一點」，淡化影響範圍。這樣做的風險是？",a:["事後被查出不實，法律責任和信任的損失都比事件本身更嚴重","沒有風險，可以減少麻煩","主管機關不會查","只要通報的文字寫得夠通順、格式也都正確，主管機關就不會再進一步追問細節"],why:"事件會過去，隱匿和不實會留下來。如實通報、後續更新，是對組織最有利的做法。"}
]]},
{id:'iam',lv:[[
 {t:"驗證與授權",q:"「驗證」和「授權」的差別是什麼？",a:["驗證是確認你是誰，授權是決定你能做什麼","兩個是同一件事","驗證是給權限，授權是輸入密碼","驗證只用在網站，授權只用在作業系統，兩者不會同時出現"],why:"登入成功只代表身分確認了。能不能看某份資料、能不能改設定，是授權在管。"},
 {t:"權限模型",q:"「以角色為基礎的存取控制」（RBAC）是怎麼給權限的？",a:["把權限給角色，再把人指派到角色","每個人各自設定不同的權限","所有人都給一樣的權限","由每一位使用者自己決定自己需要哪些權限，再自行開通"],why:"人會異動，角色相對穩定。換職務時只要換角色，不必一項一項調權限。"},
 {t:"單一登入",q:"單一登入（SSO）對使用者最直接的好處是？",a:["登入一次就能使用多個系統","再也不需要密碼","上網速度變快","每個系統都可以設定一組完全不同的密碼來提高安全性"],why:"少記幾組密碼，也讓停用帳號可以集中處理。相對地，那一組帳號更要保護好。"},
 {t:"多因素驗證",q:"多因素驗證的「因素」分成哪三類？",a:["你知道的、你擁有的、你本身的特徵","帳號、密碼、驗證碼","電腦、手機、平板","早上、中午、晚上三個不同的時段各登入一次"],why:"密碼是知道的，手機或金鑰是擁有的，指紋是特徵。兩組密碼只算一種因素。"},
 {t:"帳號生命週期",q:"帳號的「生命週期管理」指的是什麼？",a:["從到職建立、異動調整到離職停用的整個過程","帳號的密碼長度","帳號每天登入的次數","帳號建立之後永久保留，不需要再做任何的調整"],why:"三個時間點都要有流程。最常出問題的是異動和離職，權限沒收、帳號沒停。"},
 {t:"共用帳號",q:"好幾個人共用同一組帳號密碼，最大的問題是？",a:["出事時無法知道是誰做的","登入會比較慢","密碼比較難記","系統的授權費用會因為登入的人數變多而增加"],why:"沒有可歸責性，稽核紀錄就失去意義。而且有人離職時，密碼得全部重發。"},
 {t:"服務帳號",q:"「服務帳號」和一般人員帳號的差別是？",a:["給程式或服務用的，不是給人登入操作的","權限一定比較低","不需要密碼","只有在國定假日或是公司停班的時候才可以拿出來使用"],why:"它通常不會過期、權限不小、又沒人盯著，所以要列冊管理、權限給最小。"},
 {t:"密碼管理",q:"要管理幾十組不同系統的密碼，比較好的做法是？",a:["使用密碼管理工具","全部設成同一組","寫在筆記本放桌上","存在瀏覽器的書籤名稱裡面，這樣每次打開就看得到"],why:"每個系統不同密碼才不會一組外洩全部淪陷，靠人腦記不住，交給工具。"}
],[
 {t:"權限累積",q:"員工調過三個部門，每次都加新權限，舊的沒收。這種現象會造成什麼風險？",a:["一個人擁有遠超過工作所需的權限","帳號會自動被鎖定","電腦會變慢","他會因為權限太多而無法登入任何一個系統"],why:"這叫權限累積。帳號一旦被盜，損害範圍是他待過的所有部門。異動時要「先收再給」。"},
 {t:"特權帳號",q:"管理員日常收信、上網，和做系統管理，應該怎麼使用帳號？",a:["分成兩個帳號，管理帳號只做管理工作","都用管理員帳號比較方便","都用一般帳號","借用同事的帳號來做管理工作，自己的帳號只用來收信"],why:"收信上網最容易中招。管理權限不在那個帳號上，中招時損害就小很多。"},
 {t:"目錄服務",q:"LDAP 是什麼？",a:["查詢和存取目錄服務（例如帳號、群組資料）的協定","一種防毒軟體","一種備份格式","一種專門用來在不同國家之間傳送大型影片檔案的網路協定"],why:"很多系統靠 LDAP 向目錄查帳號和群組，AD 也支援它。"},
 {t:"群組授權",q:"設定共用資料夾權限時，為什麼建議授權給「群組」而不是個人？",a:["人員異動時只要調整群組成員，不必逐一改資料夾","群組的速度比較快","個人帳號不能設權限","因為作業系統規定每一個資料夾最多只能授權給一個人"],why:"直接授權給個人，幾年後沒人說得清楚誰為什麼有權限。"},
 {t:"多因素驗證",q:"攻擊者拿到密碼後，不斷送出手機驗證推播，使用者被吵到按了「允許」。要怎麼降低這種風險？",a:["改用需要輸入畫面數字的驗證方式，並教育使用者不是自己發起的不要按","把推播通知關掉","取消多因素驗證","請使用者把手機交給主管統一保管"],why:"這叫 MFA 疲勞攻擊。數字比對讓使用者必須看著登入畫面才能通過。"},
 {t:"權限審查",q:"定期的權限審查，應該由誰確認「這個人該不該有這個權限」？",a:["該系統或資料的擁有者，或當事人的主管","資訊人員自己判斷","當事人自己確認","由系統每一季隨機挑選一位同仁來負責確認所有人的權限"],why:"資訊人員知道誰有權限，但不知道業務上該不該有。這個判斷要回到業務端。"},
 {t:"帳號鎖定",q:"帳號鎖定門檻設成「錯 3 次就永久鎖定」，會有什麼副作用？",a:["容易被人故意輸錯來鎖住別人的帳號","完全沒有副作用","密碼會變簡單","使用者會因此連自己的帳號名稱都一起忘記"],why:"太嚴會變成阻斷服務的工具，太鬆又擋不住猜密碼。通常設合理次數加上自動解鎖時間。"},
 {t:"緊急帳號",q:"「緊急存取帳號」（Break Glass）是用來做什麼的？",a:["正常的驗證機制故障時，讓管理者還能進得去","讓使用者忘記密碼時使用","給廠商長期使用","讓每一位員工在趕時間的時候可以跳過驗證直接登入"],why:"例如 SSO 或 MFA 服務掛了。它要嚴格保管、平常不用，一被使用就要告警。"}
],[
 {t:"聯合身分",q:"使用 SAML 或 OIDC 做單一登入時，「身分提供者」（IdP）的角色是？",a:["負責驗證使用者，並告訴應用系統這個人是誰","負責儲存應用系統的資料","負責備份","負責向每一位使用者按月收取使用各個系統的費用"],why:"應用系統把驗證交給 IdP，自己不用存密碼。IdP 因此成為最關鍵的系統之一。"},
 {t:"條件式存取",q:"「條件式存取」是依據什麼來決定要不要放行？",a:["登入當下的條件，例如裝置、位置、風險程度","只看密碼對不對","只看使用者的職稱","只看使用者當天的出勤紀錄上面有沒有遲到或早退"],why:"同一個人從公司電腦登入直接放行，從陌生國家的陌生裝置登入就要求加驗或擋下。"},
 {t:"特權存取管理",q:"特權存取管理（PAM）系統通常提供哪些功能？",a:["保管特權密碼、定期輪替、側錄操作過程","加快電腦的開機速度","自動撰寫程式","統計每位員工每天使用電腦的時數來計算薪資"],why:"管理員不必知道真正的密碼，由系統代為登入並留下紀錄。"},
 {t:"職務區隔",q:"設計角色時發現，同一個角色既能「建立廠商資料」又能「核准付款」。問題是什麼？",a:["違反職務區隔，一個人就能完成舞弊","角色名稱太長","權限太少","這樣的設計會讓系統的執行速度明顯變慢"],why:"會互相制衡的權限不能落在同一個人身上。角色設計時就要檢查衝突。"},
 {t:"孤兒帳號",q:"要找出「人已經離職但帳號還在」的孤兒帳號，最有效的方法是？",a:["定期把帳號清單和人事資料比對","等使用者自己回報","看帳號名稱是不是很舊","把所有超過一年的帳號全部刪除，不論還有沒有人在使用"],why:"人事資料是「誰該存在」的依據。比對不上的帳號就要逐一確認。"},
 {t:"機器身分",q:"程式用的 API 金鑰、憑證這類「機器身分」，管理上最常見的問題是？",a:["數量很多、沒人列冊、從不更換","太容易記住","用完就自動消失","只能在每個月的第一天使用，其他時間會自動失效"],why:"機器身分往往比人的帳號多好幾倍。要有清冊、負責人、到期和輪替機制。"},
 {t:"權杖安全",q:"使用者已經用了多因素驗證，攻擊者仍然進得來，因為偷走了登入後的連線權杖。可以怎麼降低風險？",a:["縮短權杖效期，並把權杖綁定在裝置上","取消多因素驗證","把密碼改長","請使用者每天上班之前先把瀏覽器重新安裝一次"],why:"驗證只發生在登入那一刻。權杖被偷等於直接跳過驗證，所以權杖本身也要保護。"},
 {t:"最小權限",q:"要把「權限給太多」的現況收斂成最小權限，比較可行的做法是？",a:["依實際的使用紀錄，把長期沒用到的權限逐步移除","一次把所有人的權限全部收回","維持現狀","請每一位使用者自己申報覺得不需要的權限，沒申報的就全部保留"],why:"一次全收會癱瘓業務。看紀錄知道哪些真的沒在用，移除的風險最低。"}
],[
 {t:"零信任",q:"為什麼說「身分是新的邊界」？",a:["系統和使用者都不在公司網路裡了，能依靠的管制點變成身分","因為防火牆已經被禁用","因為身分證字號很重要","因為公司的辦公室已經不再設置實體的大門"],why:"雲端服務和遠距工作讓網路邊界失去意義。每次存取都依身分、裝置和情境判斷。"},
 {t:"可用性",q:"所有系統都接上同一套身分提供者之後，最大的架構風險是什麼？",a:["它一故障，所有系統都無法登入","使用者會太方便","密碼會變短","每個系統的畫面顏色和字型都會變得一模一樣"],why:"集中帶來單點失效。要有備援、監控，以及不依賴它的緊急存取方式。"},
 {t:"身分整合",q:"兩家公司合併，各有一套目錄和身分系統。初期比較務實的做法是？",a:["先建立信任或同步讓雙方能互相存取，再規劃長期整合","第一天就把其中一套關掉","永遠各用各的","請兩邊的員工都各自申請對方公司的帳號，每人維護兩組"],why:"一次切換風險太高。先讓業務能運作，再依優先順序逐步收斂。"},
 {t:"無密碼驗證",q:"FIDO2 通行金鑰這類「無密碼」驗證，為什麼能抵抗釣魚？",a:["驗證會綁定正確的網站，假網站拿不到可用的憑證","因為使用者記不住","因為它沒有任何加密","因為釣魚網站依照法律規定不可以要求使用者插入實體金鑰"],why:"密碼和簡訊驗證碼都能被騙去輸入在假網站上；綁定網域的金鑰不會對假網站回應。"},
 {t:"角色治理",q:"導入 RBAC 幾年後，角色數量比員工人數還多。這個問題要怎麼治理？",a:["定期檢視合併相似角色，並訂定新增角色的審核標準","再多建一些角色","取消 RBAC","把所有角色的名稱都改成數字編號，這樣可以節省資料庫的空間"],why:"這叫角色爆炸。每個例外都開新角色，最後跟直接授權給個人沒兩樣。"},
 {t:"身分治理",q:"身分治理（IGA）系統和人事系統串接，最主要的價值是？",a:["到職、異動、離職時，帳號和權限自動跟著調整","讓人事系統跑得更快","取代人事部門","讓員工可以自行登入修改自己的到職日期、部門和職稱"],why:"靠人工通知一定會漏。由人事異動直接驅動帳號，離職當天自動停用。"},
 {t:"第三方存取",q:"給委外廠商的帳號，治理上最重要的三件事是？",a:["專人專用、設有期限、行為有監控","共用一組、永久有效、不留紀錄","權限給最大方便作業","由廠商自己決定需要哪些權限並自行開通"],why:"廠商帳號是常見的入侵管道。合約結束或人員異動時要能即時停用。"},
 {t:"權限模型",q:"RBAC 之外，「以屬性為基礎」（ABAC）的存取控制適合什麼情況？",a:["規則要依部門、資料分類、時間等多種條件動態判斷時","使用者人數很少時","完全不需要權限控管時","所有的使用者都需要完全相同的權限時"],why:"ABAC 彈性高但也難管理和稽核。常見做法是 RBAC 為主，少數情境用屬性補充。"}
]]},
{id:'virt',lv:[[
 {t:"虛擬化基礎",q:"Hypervisor 是什麼？",a:["在實體主機上建立並管理多台虛擬機的軟體","一種高速的硬碟","一種網路線","一種專門用來測試螢幕顯示品質和色彩準確度的工具"],why:"它把實體的 CPU、記憶體、磁碟分配給各台虛擬機，並讓它們彼此隔離。"},
 {t:"虛擬化基礎",q:"把伺服器虛擬化，最主要的好處是什麼？",a:["一台實體主機可以跑多個系統，資源利用率高、調度彈性","每個系統一定會變快","不再需要備份","完全不需要任何實體的伺服器"],why:"省硬體、省電、省空間，建立和搬移也快。代價是多了一層要管理。"},
 {t:"範本",q:"虛擬機「範本」的用途是？",a:["快速建立設定一致的新虛擬機","加密虛擬機","刪除虛擬機","讓虛擬機可以在沒有電力的情況下繼續運作"],why:"作業系統、更新、基本設定都先做好，新機器幾分鐘就能上線，而且每台一致。"},
 {t:"資源配置",q:"一台實體主機有 16 個核心，上面的虛擬機總共配置了 40 個虛擬 CPU。這可行嗎？",a:["可行，因為虛擬機不會同時全部用滿，但超太多會互相等待","不可行，一定會當機","可行，而且不論配多少都不會有影響","不可行，法規禁止配置超過實體核心的數量"],why:"這叫超額配置，是虛擬化的常態。比例要看負載，過高時每台都會變慢。"},
 {t:"容器",q:"容器和虛擬機最主要的差別是？",a:["容器共用主機的作業系統核心，比較輕量","容器一定比較安全","容器不能跑程式","容器只能在筆記型電腦上面執行，伺服器不支援"],why:"虛擬機各有完整的作業系統；容器只包應用程式和它需要的東西，啟動快、佔用少。"},
 {t:"虛擬網路",q:"虛擬交換器的作用是？",a:["讓虛擬機之間、以及虛擬機和實體網路之間能夠連線","讓虛擬機的螢幕變大","取代防火牆","讓虛擬機可以不需要網路卡、也不需要設定 IP 位址就能上網"],why:"它在主機裡扮演交換器，VLAN 的設定也要在這一層對得上。"},
 {t:"虛擬磁碟",q:"虛擬磁碟的「精簡配置」是什麼意思？",a:["宣告的容量很大，但實際用多少才佔多少","磁碟一建立就佔滿全部容量","磁碟不能寫入","磁碟裡面的資料每天晚上都會被自動清空一次"],why:"省空間，但所有虛擬機加起來可能超過實際容量，要監控底層儲存的剩餘空間。"},
 {t:"客體工具",q:"在虛擬機裡安裝平台提供的客體工具（Guest Tools），主要目的是？",a:["讓虛擬機和平台配合得更好，例如正常關機、時間同步、驅動程式","讓虛擬機可以玩遊戲","取代防毒軟體","讓虛擬機可以不用安裝作業系統"],why:"沒裝的話，效能較差，備份時也無法通知系統先把資料寫入磁碟。"}
],[
 {t:"效能",q:"虛擬機的 CPU 使用率不高，但反應很慢，平台顯示它「等待 CPU 的時間」很長。原因是？",a:["主機上的虛擬 CPU 配置過多，大家在排隊","虛擬機的硬碟太大","網路線太短","虛擬機的螢幕解析度設定得太高"],why:"虛擬機想用 CPU 卻排不到。解法是減少超額配置，或移走部分虛擬機。"},
 {t:"高可用",q:"虛擬化叢集要做到主機故障時自動在別台重啟虛擬機，為什麼通常需要共用儲存？",a:["其他主機要能讀到同一份虛擬機檔案","共用儲存比較便宜","為了省電","因為共用儲存可以讓虛擬機不需要記憶體"],why:"虛擬機檔案如果只在壞掉的那台主機裡，別台就無從啟動它。"},
 {t:"高可用",q:"叢集的高可用（HA）功能在主機故障時，虛擬機會怎麼樣？",a:["在其他主機上重新開機，中間會中斷一小段時間","完全不中斷，使用者毫無感覺","永久消失","自動變成實體伺服器"],why:"HA 是重啟，不是不中斷。要零中斷得用容錯功能或在應用層做叢集。"},
 {t:"資源調度",q:"叢集的自動資源調度功能在做什麼？",a:["依負載把虛擬機在主機之間移動，讓資源使用平均","自動刪除不用的虛擬機","自動購買新主機","自動把所有的虛擬機都集中到同一台主機上面，以節省其他主機的電力"],why:"管理者不必手動調整。但規則沒設好時，也可能把不該放一起的虛擬機排在一起。"},
 {t:"儲存",q:"使用精簡配置的儲存空間被用滿了。虛擬機會發生什麼事？",a:["寫不進去，可能暫停或損毀","自動多出空間","速度變快","自動把最舊的資料刪除來騰出空間"],why:"這是精簡配置最大的風險，而且會同時影響很多台。要設容量告警並預留空間。"},
 {t:"放置規則",q:"兩台互為備援的伺服器（例如兩台網域控制站）都是虛擬機。放置上要注意什麼？",a:["設定規則讓它們不要在同一台實體主機上","放在同一台主機比較好管理","沒有需要注意的","讓它們共用同一顆虛擬磁碟以確保資料一致"],why:"放同一台，主機一壞兩台一起倒，備援就白做了。這叫反親和性規則。"},
 {t:"容器",q:"容器映像檔建好之後，要更新程式版本。正確的做法是？",a:["建一個新版本的映像檔，用它重新部署","登入正在執行的容器裡面直接改","把舊映像檔覆蓋掉且不留版本","請使用者自己進到正在執行的容器裡面手動下載更新"],why:"容器是可拋棄的。改動要進映像檔，才能重現、退版，每個環境也才一致。"},
 {t:"治理",q:"虛擬機很容易建立，幾年後出現一堆沒人知道用途的機器。要怎麼預防？",a:["建立時就登記負責人和用途，設到期日並定期清查","禁止建立虛擬機","不用管，反正是虛擬的","每個月隨機刪除一部分的虛擬機"],why:"這叫虛擬機蔓延。沒人管的機器吃資源、沒更新，還是資安的破口。"}
],[
 {t:"效能",q:"一台配置了很多 CPU 和記憶體的大型虛擬機，效能卻不如預期。和實體主機的哪個架構特性有關？",a:["NUMA，虛擬機的資源橫跨了多個節點","螢幕更新率","鍵盤配置","主機機殼的顏色，以及它在機櫃裡面擺放的方向"],why:"跨節點存取記憶體比較慢。大型虛擬機的規格要配合主機的實體配置。"},
 {t:"排錯",q:"虛擬機反應說磁碟很慢。排查時應該依序看哪幾層？",a:["虛擬機內部、主機、儲存網路、儲存設備","只看虛擬機內部","只看儲存設備","只看使用者的鍵盤和滑鼠有沒有接好、電池有沒有電"],why:"延遲可能出在任何一層。逐層比較延遲數字，才知道卡在哪。"},
 {t:"容量",q:"八台主機的叢集，為了能容忍一台故障，平常的資源使用率應該控制在多少以下？",a:["大約八分之七，留一台的餘裕","100%，全部用滿最有效率","10%","只要每一台主機都有開機就不需要控制使用率"],why:"沒留餘裕，一台故障時其他台接不下來，HA 就是空談。升級維護時也要用到這個空間。"},
 {t:"安全",q:"虛擬化的管理平台（管理所有主機和虛擬機的那套系統），安全等級應該怎麼定？",a:["最高等級，拿到它就等於拿到上面所有系統","跟一般辦公電腦一樣","不需要保護","只需要每一年更換一次管理者的密碼，其他的不需要特別處理"],why:"可以直接複製磁碟、開主控台、關機。攻擊者常以它為目標來加密整個環境。"},
 {t:"容器編排",q:"在容器編排平台上，容器隨時可能被重建。這對資料存放有什麼影響？",a:["要保留的資料必須放在容器之外的持久儲存","資料放在容器裡最安全","不需要儲存資料","資料會自動複製一份到每一位使用者的個人電腦上"],why:"容器重建後，裡面的檔案就不見了。資料庫檔案、上傳的檔案都要掛外部儲存。"},
 {t:"安全",q:"為什麼 Hypervisor 本身的安全性更新特別重要？",a:["它的漏洞可能讓攻擊者從一台虛擬機跳到主機或其他虛擬機","因為更新後畫面比較好看","因為不更新會過保固","因為更新可以讓虛擬機的數量自動增加"],why:"虛擬機之間的隔離全靠它。這類「逃逸」漏洞雖少見，但影響的是整台主機。"},
 {t:"備份",q:"備份虛擬機時，「應用程式一致性」的備份是指什麼？",a:["備份前先通知應用程式把記憶體中的資料寫入磁碟","備份檔的檔名一致","每次備份的大小一致","所有的虛擬機都在同一秒鐘開始備份"],why:"只做磁碟快照，資料庫可能有寫到一半的資料。需要客體工具配合才做得到。"},
 {t:"授權",q:"虛擬化和資料庫軟體常依「實體核心數」或「主機數」計費。這對架構設計有什麼影響？",a:["虛擬機能在哪些主機上跑，會直接影響授權成本","沒有任何影響","只影響畫面顏色","只會影響採購單位的作業，跟負責設計架構的技術人員沒有關係"],why:"把需要昂貴授權的系統集中在少數主機上，是常見的設計考量。搬移前要先確認授權。"}
],[
 {t:"平台策略",q:"評估要不要更換虛擬化平台。除了授權費，最不能忽略的成本是？",a:["遷移的人力和風險，以及周邊工具和人員技能的重建","新平台的標誌設計","機櫃的顏色","新平台的說明文件總共有幾頁"],why:"備份、監控、自動化腳本、人員經驗都綁在現有平台上。這些才是鎖定的來源。"},
 {t:"架構選型",q:"超融合架構（HCI）相對於「伺服器＋獨立儲存」的傳統架構，主要取捨是？",a:["部署和擴充簡單，但運算和儲存要一起擴","一定比較便宜","不需要網路","只能使用一台主機，無法擴充"],why:"只缺儲存不缺運算時，還是得整個節點一起買。適不適合要看兩者成長是否同步。"},
 {t:"多站架構",q:"把一個叢集延伸到兩個機房。兩地之間的線路中斷時，最需要靠什麼避免雙邊同時運作？",a:["位於第三地的見證機制","兩邊各派一個人講電話","把兩邊都關機","讓兩邊都繼續運作，等線路恢復之後再人工合併資料"],why:"沒有見證，兩邊都會以為對方掛了而各自啟動同一批虛擬機，造成資料分岔。"},
 {t:"容量規劃",q:"做三年的平台容量規劃，除了過去的使用趨勢，還要納入什麼？",a:["業務計畫，例如新系統上線、併購、汰換","只要看趨勢就夠了","同業買了幾台","機房管理人員個人對於未來三年的直覺判斷"],why:"趨勢只能反映過去。一個新專案的需求可能比三年的自然成長還多。"},
 {t:"技術選型",q:"一個新應用要選擇跑在虛擬機、容器還是無伺服器服務上。判斷的關鍵是？",a:["應用的特性和團隊的維運能力","哪一個最新","哪一個名稱最好聽","哪一種技術在最近一年的研討會上被提到最多次"],why:"狀態多、難改的舊系統適合虛擬機；無狀態、常更新的適合容器；零星觸發的適合無伺服器。"},
 {t:"升級策略",q:"規劃虛擬化平台的大版本升級時，最先要確認的是什麼？",a:["硬體、備份、監控等周邊和新版本的相容性","新版本的圖示好不好看","升級當天的天氣","新版本的安裝檔案大小是不是比舊的版本還要小"],why:"平台升上去了，備份軟體卻還不支援，就等於沒有備份。相容矩陣要先對過。"},
 {t:"多租戶",q:"同一個平台要同時服務好幾個部門或客戶，彼此不能互相影響。設計上要隔離哪些面向？",a:["運算資源、網路、儲存和管理權限","只要帳號名稱不同就好","只要放在不同的資料夾","只要讓每個部門使用不同的桌面背景圖片"],why:"資源沒限制，一個部門吃滿會拖垮別人；網路沒隔離，就能互相連線。"},
 {t:"治理",q:"開放讓各單位自助申請虛擬機之後，最需要搭配什麼機制？",a:["配額、到期回收和成本可視","取消所有限制","每台都由主管手動建立","規定每一個單位每天至少要申請一台"],why:"自助帶來速度，也帶來浪費。沒有上限和回收，資源很快被佔滿。"}
]]},
{id:'bcdr',lv:[[
 {t:"備份觀念",q:"「備份」和「封存」的目的有什麼不同？",a:["備份是為了出事時能還原，封存是為了長期保存不常用的資料","兩者完全一樣","備份是刪除資料，封存是複製資料","備份只能用在伺服器，封存只能用在個人電腦"],why:"備份會輪替覆蓋，重點是還原得回來；封存是把資料移到長期存放的地方，重點是查得到。"},
 {t:"復原目標",q:"RPO 是在問什麼？",a:["出事時，最多可以接受遺失多久的資料","多久之內要恢復服務","備份要花多少錢","備份的檔案總共要保留幾份"],why:"RPO 一小時，代表至少每小時要有一份可用的資料副本。"},
 {t:"復原目標",q:"RTO 是在問什麼？",a:["出事後，多久之內要恢復服務","最多可以遺失多少資料","備份要放在哪裡","一年之內總共可以發生幾次故障"],why:"RTO 決定備援要做到什麼程度：能等一天，還是只能等十分鐘，成本差很多。"},
 {t:"異地備份",q:"為什麼備份要有一份放在「異地」？",a:["同一個地點發生火災、水災或竊盜時，還有一份在別處","異地的電費比較便宜","為了讓備份跑得比較快","因為法律規定備份媒體不可以和伺服器放在同一個縣市之內"],why:"主機和備份放同一間機房，一場災害就一起沒了。"},
 {t:"備份觀念",q:"檔案放在會自動同步的雲端硬碟，算不算有備份？",a:["不算，刪除或被加密也會同步過去","算，而且是最好的備份","算，只要網路夠快","算，只要同步的資料夾名稱裡面有「備份」兩個字"],why:"同步是讓各處保持一致，錯的也一起一致。備份要能回到過去某個時間點。"},
 {t:"備份監控",q:"備份排程每天都有寄結果通知。為什麼一定要有人看？",a:["失敗了沒人處理，等到要還原時才發現沒有備份","因為信件會佔空間","因為要回信給系統","因為沒有人看通知的話，備份的執行速度會一天比一天慢"],why:"備份悄悄失敗好幾週，是很常見的事故原因。失敗要有人追、有紀錄。"},
 {t:"還原測試",q:"確認備份真的可以用，唯一可靠的方法是？",a:["實際還原一次","看備份檔的大小","看排程顯示成功","請廠商出具一份保證備份可以使用的書面文件"],why:"沒還原過的備份只是一個檔案。還原測試同時也讓人熟悉步驟、知道要花多久。"},
 {t:"保留期限",q:"備份的「保留期限」是在決定什麼？",a:["每一份備份要留多久才能刪除","備份要在幾點執行","備份要用哪個廠牌","備份檔的檔名最多可以有幾個字"],why:"留太短，發現問題時已經沒有夠早的版本；留太長，空間和成本會失控。也要對照法規要求。"}
],[
 {t:"備份原則",q:"「3-2-1-1-0」比 3-2-1 多出來的「1」和「0」是指什麼？",a:["一份離線或不可變的備份，以及還原驗證零錯誤","一位管理員和零預算","一台主機和零停機","一個星期只備份一次，以及完全不需要任何異地備份"],why:"多的那份是為了勒索軟體，零錯誤是要求備份都經過驗證。"},
 {t:"輪替",q:"「祖父-父-子」的備份輪替方式，是在做什麼？",a:["每日、每週、每月各保留不同數量的備份","由三個人輪流負責備份","一次備份三份","讓三台伺服器輪流當備份主機"],why:"近期的留得密、久遠的留得疏，在可還原的時間範圍和儲存成本之間取得平衡。"},
 {t:"備份視窗",q:"資料量越來越大，完整備份已經無法在夜間跑完。常見的調整是？",a:["改成平日增量、週末完整，或採用永久增量","不備份了","改到白天尖峰時段跑","把一半的資料刪除，讓備份可以在時間內跑完"],why:"備份視窗不夠時，減少每次要搬的資料量是最直接的方法。"},
 {t:"備份安全",q:"為什麼建議備份伺服器不要加入正式的網域，並使用獨立的管理帳號？",a:["網域被拿下時，攻擊者不會順便拿到備份","這樣備份比較快","為了節省授權","因為備份伺服器加入網域之後就不能備份了"],why:"勒索軟體集團會先找備份系統。和正式環境的帳號體系分開，才留得住最後一條路。"},
 {t:"一致性",q:"「當機一致性」的備份，還原後像是什麼狀態？",a:["像是主機突然斷電後重開","像是正常關機後開機","像是全新安裝","像是資料已經自動更新到最新的版本"],why:"磁碟上的資料是一致的，但記憶體中還沒寫入的就沒了。資料庫通常要做應用程式一致性的備份。"},
 {t:"儲存效率",q:"備份系統的「重複資料刪除」是怎麼省空間的？",a:["相同的資料區塊只存一份","把檔案壓縮成圖片","刪除較舊的檔案","只備份檔名，不備份檔案的內容"],why:"每天的完整備份大部分內容相同，去重後佔用的空間少很多。代價是運算資源和對索引的依賴。"},
 {t:"備份監控",q:"某台伺服器的備份已經連續失敗五天，沒有人處理。流程上應該補什麼？",a:["失敗要自動開單並指派負責人，超過期限要往上通報","把失敗通知關掉","等它自己好","把那一台伺服器從備份的清單中移除"],why:"通知不等於有人負責。要有明確的負責人和時限，備份失敗才不會變成背景雜訊。"},
 {t:"備份範圍",q:"新上線的系統三個月後出事，才發現從來沒被備份。應該怎麼預防？",a:["把「納入備份」列為系統上線的必要檢查項目","請大家多注意","每年檢查一次就好","規定所有的新系統都要等上線滿一年之後才開始備份"],why:"靠記得一定會漏。寫進上線流程，並定期拿資產清冊和備份清單比對。"}
],[
 {t:"勒索復原",q:"遭勒索軟體加密後要從備份還原。第一件要確認的事是什麼？",a:["要用的還原點是不是在攻擊者入侵之前","備份軟體的版本","還原要用哪一台螢幕","備份檔的檔名裡面有沒有包含當天的日期和星期"],why:"攻擊者常潛伏數週。還原到已經有後門的時間點，等於把他請回來。"},
 {t:"勒索復原",q:"不確定備份乾不乾淨時，比較安全的還原方式是？",a:["先還原到隔離的環境檢查，確認後再接回正式網路","直接還原到正式環境","不還原","還原之後立刻對外開放，請所有的使用者一起幫忙測試有沒有問題"],why:"隔離環境讓你可以掃描、檢查，不怕殘留的惡意程式再次擴散。"},
 {t:"備援站",q:"熱備援、暖備援、冷備援三種異地備援站，差別在哪裡？",a:["設備和資料準備的程度不同，恢復時間和成本也不同","機房的溫度不同","使用的廠牌不同","負責管理的人員的年資不同"],why:"熱備援隨時可接手、最貴；冷備援只有場地，要花很多時間才能啟用。依 RTO 選擇。"},
 {t:"切換",q:"服務已經切換到備援站運作。接下來容易被忽略的是什麼？",a:["怎麼切回主站，包含把這段期間的資料同步回去","慶祝切換成功","把主站報廢","通知所有的使用者，從今以後都永久改用備援站的系統"],why:"切過去只做了一半。切回的計畫沒想好，可能再造成一次中斷或資料遺失。"},
 {t:"相依關係",q:"災難復原計畫要列出系統之間的相依關係。主要是為了什麼？",a:["決定還原的先後順序","計算電費","安排座位","決定哪一個系統的畫面要優先重新設計"],why:"應用程式還原了，但它依賴的驗證、名稱解析、資料庫還沒起來，一樣不能用。"},
 {t:"金鑰管理",q:"備份有加密，而解密金鑰只存在正式環境的一台伺服器上。這有什麼風險？",a:["那台伺服器毀損，備份就永遠打不開","沒有風險","備份會變慢","備份檔的大小會因此變成原本的兩倍以上"],why:"金鑰要另外安全保存，並且自己也要有備份。災難時金鑰一起消失是很常見的疏忽。"},
 {t:"復原時間",q:"計畫上寫 RTO 四小時，但要從異地把 20TB 的資料傳回來。評估時最該確認什麼？",a:["以實際的頻寬和還原速度算，傳得完嗎","文件的格式對不對","備份軟體的介面語言","異地機房的工作人員在還原的當天有沒有排班上班"],why:"很多計畫的數字是填的，不是量的。資料量、頻寬、還原速度一算，可能要好幾天。"},
 {t:"雲端服務",q:"公司的郵件和文件都在 SaaS 雲端服務上。還需要自己備份嗎？",a:["需要，業者保證的是服務可用，資料誤刪或被加密通常是客戶的責任","不需要，雲端不會出事","不需要，業者會無限期保留所有版本","需要，但只要把帳號密碼抄下來就算是備份"],why:"共同責任模型下，資料是客戶的。資源回收筒的保留期限一過，業者也救不回來。"}
],[
 {t:"計畫範圍",q:"營運持續計畫（BCP）和災難復原計畫（DRP）的範圍有什麼不同？",a:["BCP 涵蓋整個業務怎麼繼續運作，DRP 聚焦在資訊系統的復原","兩者完全相同","DRP 的範圍比較大","BCP 只處理火災，DRP 只處理地震"],why:"系統恢復之前，業務要怎麼用人工或替代方式撐住，是 BCP 的事，不是資訊單位單獨能決定的。"},
 {t:"分級保護",q:"所有系統都採用最高等級的備援，是好的策略嗎？",a:["不是，應依業務衝擊分析分級，把資源放在真正關鍵的系統","是，越高越好","是，這樣最簡單","不是，所有的系統都應該一律採用最低的保護等級來節省成本"],why:"資源有限。全部最高等級不是做不到就是做不好，結果關鍵系統反而沒顧好。"},
 {t:"演練",q:"災難復原演練通常由淺到深安排。順序是？",a:["桌上推演、部分系統測試、完整切換","直接做完整切換","只做桌上推演","先做完整切換，如果失敗的話再回頭做桌上推演"],why:"先在會議桌上找出流程的問題，再動系統。一開始就完整切換，演練本身可能變成災難。"},
 {t:"區域風險",q:"主機房和備援機房相距五公里，接同一個變電所。這個設計的弱點是？",a:["區域性的災害或停電會同時影響兩邊","距離太遠","維護太方便","兩個機房的門牌號碼太過相近容易送錯貨"],why:"地震、淹水、大範圍停電的影響範圍常超過幾公里。備援要考慮共同的依賴。"},
 {t:"人員",q:"復原計畫假設「關鍵的五位工程師都能到場」。這個假設有什麼問題？",a:["災害時人可能也到不了，計畫要考慮人員不可用","沒有問題","五位太少，應該假設五十位","工程師到場之後可能會找不到停車位"],why:"疫情、地震、交通中斷時，人也是受影響的資源。要有代理人和別人看得懂的文件。"},
 {t:"成本取捨",q:"業務單位要求「一筆資料都不能掉、一秒都不能停」。資訊單位應該怎麼回應？",a:["說明要達到的成本，讓他們依實際衝擊決定合理的目標","直接答應","直接拒絕","先口頭答應下來，等到哪一天真的出事的時候再向他們解釋做不到"],why:"RPO 和 RTO 越接近零，成本上升得越快。要讓提出需求的人看到代價再決定。"},
 {t:"決策",q:"發生重大事故時，「要不要宣布啟動災難復原」為什麼要事先指定決策者和判斷標準？",a:["當下資訊不完整又有壓力，沒有授權會猶豫或各做各的","因為表單需要簽名","為了事後究責","因為宣布的時候需要有人負責拍照和錄影"],why:"切換有成本和風險，太早太晚都不好。誰能決定、依據什麼，要在平時講好。"},
 {t:"持續改善",q:"演練結束後，最重要的後續動作是什麼？",a:["把發現的問題更新到計畫並追蹤改善","把報告歸檔","慶功","明年用完全相同的劇本和人員再演練一次"],why:"演練的價值在找到落差。沒有改計畫的演練，下次會在同一個地方卡住。"}
]]},
{id:'itsm',lv:[[
 {t:"服務台",q:"設立「服務台」作為單一窗口，主要的好處是？",a:["使用者只要找一個地方，每件事也都有紀錄和追蹤","讓資訊人員不用接電話","增加部門人數","讓使用者必須等待比以前更久的時間，才能夠得到資訊人員的協助"],why:"沒有單一窗口，使用者各找各的熟人，沒紀錄、沒優先順序，也看不出整體狀況。"},
 {t:"工單",q:"很小的問題兩分鐘就處理完了，還需要開工單嗎？",a:["需要，才有紀錄可以統計和追溯","不需要，浪費時間","看心情","只有主管交辦的事情才需要開立工單"],why:"小問題累積起來才看得出趨勢。也許同一個小問題一個月發生了五十次。"},
 {t:"優先度",q:"工單的優先度通常由哪兩個因素決定？",a:["影響範圍和急迫程度","報修人的職位和年資","工單的編號和日期","報修人打電話來的時候說話的音量大小"],why:"一個人的小問題和整個部門停擺，處理順序不同。標準一致，才不會誰大聲誰優先。"},
 {t:"事件與問題",q:"在服務管理裡，「事件」和「問題」的差別是？",a:["事件是服務中斷要盡快恢復，問題是找出造成事件的根本原因","兩者一樣","問題比較小，事件比較大","事件是使用者造成的，問題則是資訊人員造成的"],why:"重開機讓服務恢復是處理事件；查出為什麼一直要重開，是處理問題。"},
 {t:"變更",q:"服務管理裡的「變更」是指什麼？",a:["對正式環境的新增、修改或移除","更換辦公室座位","修改工單的標題","資訊人員調整自己每天上下班的時間"],why:"很多事故是變更造成的，所以變更要評估、核准、記錄，並且能退回。"},
 {t:"組態管理",q:"CMDB（組態管理資料庫）記錄的是什麼？",a:["有哪些設備和系統，以及它們之間的關係","員工的薪資","使用者的密碼","公司每一年的營業收入、支出以及獲利的明細"],why:"知道「這台交換器後面接了哪些系統」，出事或變更時才評估得出影響範圍。"},
 {t:"知識管理",q:"把常見問題的處理方式寫進知識庫，最直接的效益是？",a:["同樣的問題不必每次重新摸索，新人也能處理","讓文件變多","讓稽核滿意","讓資深的同仁從此可以不用再回答任何人的問題"],why:"知識留在個人腦中，人不在就卡住。寫下來也是在減少自己被重複打擾。"},
 {t:"結案",q:"工單要結案之前，應該做什麼？",a:["和使用者確認問題已經解決","直接結案","等一個月","請主管代替使用者確認問題已經解決"],why:"資訊人員認為好了，不代表使用者能用了。沒確認就結案，只是讓他再報一次。"}
],[
 {t:"變更類型",q:"「標準變更」是指哪一種？",a:["風險低、做法固定、已經預先核准的例行變更","最重要的變更","最緊急的變更","任何一位資深同仁自己認為不需要經過審核的變更"],why:"例如照既定程序開通帳號。不必每次送審，審核的力氣就能放在真正有風險的變更上。"},
 {t:"變更管理",q:"月底結帳期間設定「變更凍結」，目的是什麼？",a:["在業務關鍵時段降低因變更造成中斷的風險","讓資訊人員放假","節省電費","因為每到月底的時候，系統就不允許任何人登入"],why:"這段期間出事的代價特別高。只允許緊急修復，其他的排到之後。"},
 {t:"重大事件",q:"什麼情況應該啟動「重大事件」的處理流程？",a:["影響範圍大或衝擊關鍵業務，需要跨團隊協調和專人指揮時","任何一張工單","只有主管報修時","只有在事件發生的時間剛好是上班時間的時候"],why:"重大事件要有指揮者、固定的溝通節奏和升級路徑。標準要事先定義，不能臨時判斷。"},
 {t:"升級",q:"工單的「功能性升級」和「階層性升級」有什麼不同？",a:["前者是轉給更專業的技術團隊，後者是往上通報管理階層","兩者相同","前者比較慢","前者是提供給內部人員使用，後者則是專門提供給外部廠商使用"],why:"技術上解不了就轉專業；時限快到或影響擴大就讓主管知道。兩者可以同時發生。"},
 {t:"組態管理",q:"CMDB 的資料長期沒更新、不準確。最直接的後果是什麼？",a:["評估變更影響和排查事件時，依據的資訊是錯的","資料庫會變大","沒有後果","使用者會因此無法登入自己的電腦"],why:"不準的 CMDB 比沒有還糟，因為大家會相信它。資料要有負責人和更新機制。"},
 {t:"服務水準",q:"工單在等使用者回覆資訊，SLA 的時間通常怎麼算？",a:["暫停計時，等使用者回覆後再繼續","繼續計時","直接算逾時","重新從零開始計算並且自動延長一倍的時間"],why:"等待不在資訊單位的掌控中。但暫停要有規則，避免被拿來規避時限。"},
 {t:"已知錯誤",q:"根本原因還沒解決，但已經有暫時的處理方式。這個狀態應該記錄成什麼？",a:["已知錯誤，並附上暫時的解決方法","已結案","新的事件","不需要記錄，等根本原因解決之後再一起補"],why:"第一線遇到同樣的問題可以直接套用，不必重查，也讓問題持續被追蹤。"},
 {t:"服務請求",q:"申請帳號、申請軟體這類重複性很高的請求，比較好的處理方式是？",a:["放進服務目錄，用固定的表單和流程，能自動化的就自動化","每次都用電話溝通","每次都開會討論","每一次都請使用者親自到資訊單位的辦公室填寫紙本的申請單"],why:"固定的流程才能量時間、自動核准、自動執行。人力留給真正需要判斷的事。"}
],[
 {t:"指標",q:"「變更失敗率」這個指標能反映什麼？",a:["變更的規劃和測試品質","員工的出勤狀況","硬體的使用年限","資訊部門每個月開會的次數以及會議的長度"],why:"失敗率高，代表測試不足、評估不確實或回復計畫沒準備。它比「做了幾個變更」有意義。"},
 {t:"問題管理",q:"分析過去半年的事件紀錄，發現某類事件反覆出現。這個結果應該用來做什麼？",a:["立案為問題，找出根本原因","證明第一線很忙","不做處理","把那一類事件的工單全部刪除以美化統計數字"],why:"趨勢分析是主動式問題管理的來源。不必等大事故才找原因。"},
 {t:"變更排程",q:"同一個晚上，網路團隊要升級交換器、系統團隊要升級資料庫。事前需要什麼機制？",a:["共同的變更行事曆，檢查彼此有沒有衝突或相依","各做各的","抽籤決定","由當天晚上最早到辦公室的那一個團隊先開始做"],why:"兩個變更疊在一起，出問題時分不清是誰造成的，也可能互相影響。"},
 {t:"事後檢討",q:"重大變更或重大事件之後做「實施後檢討」，重點是什麼？",a:["確認有沒有達到目的、過程哪裡可以改進","找出誰該被處分","填完表單","統計整個過程當中總共用掉了多少張紙和幾支筆"],why:"成功的也值得檢討。學到的東西要回到流程、範本或檢查表裡。"},
 {t:"服務水準",q:"對使用者承諾的 SLA，背後需要哪些協議來支撐？",a:["內部團隊之間的協議，以及和外部廠商的合約","只要對外承諾就夠了","使用者的簽名","資訊人員每個人各自私底下和使用者的口頭約定"],why:"對外承諾四小時修復，但廠商合約是隔日到場，這個 SLA 一開始就做不到。"},
 {t:"影子 IT",q:"各部門自己購買、使用未經資訊單位知道的雲端服務。這在管理上造成什麼問題？",a:["資料流向、權限和備份都不在管控之內","沒有任何問題","資訊單位的工作變少","公司對外的網路速度會因此變得比以前還要快"],why:"一味禁止通常只會轉入地下。要了解為什麼需要，提供合規的替代方案。"},
 {t:"組態管理",q:"要讓 CMDB 保持準確，比較可行的方式是？",a:["用自動探索工具更新，並和變更流程連動","每年人工盤點一次","請大家自律","規定所有的設備在購買之後都不可以再做任何更動"],why:"純人工維護一定會落後。自動探索抓現況，變更流程負責有意的更動，兩邊互相核對。"},
 {t:"指標",q:"只追求「首次接觸解決率」越高越好，可能有什麼副作用？",a:["為了衝數字草率結案，或不把該轉出去的問題轉出去","沒有副作用","使用者會更滿意","資訊人員的打字速度會因此變得越來越慢"],why:"單一指標容易被操弄。要搭配重開率和滿意度一起看。"}
],[
 {t:"流程設計",q:"所有變更不分大小都要經過同一個冗長的審核。長期會造成什麼？",a:["流程被視為阻礙，大家開始繞過它","變更品質大幅提升","完全沒有影響","所有的資訊人員都會因此更加喜歡提出變更"],why:"審核強度要跟風險成正比。低風險的走快速通道，審核的注意力才會留給高風險的。"},
 {t:"DevOps",q:"團隊採用自動化部署管線，一天上線好幾次。變更管理要怎麼配合？",a:["把管線中的自動測試和核准紀錄作為變更的證據，高風險的才另外審","要求每次上線都開會審核","完全取消變更管理","規定一個月最多只能上線一次，其餘的全部退回"],why:"管線本身就是受控的流程。變更管理的目的是控制風險，不是開會。"},
 {t:"體驗指標",q:"SLA 的數字全部達標，使用者卻普遍不滿意。這說明了什麼？",a:["量的是流程有沒有達標，不是使用者實際的體驗","使用者不講理","SLA 訂得太嚴","資訊單位應該停止蒐集使用者的任何意見和回饋"],why:"這叫西瓜效應：外面綠、裡面紅。要補上以體驗為主的指標。"},
 {t:"服務組合",q:"一項 IT 服務已經很少人用，維護成本卻很高。在服務管理上應該怎麼處理？",a:["評估後規劃退場，包含通知、替代方案和資料處置","永遠保留","直接關掉不通知","把維護的成本平均分攤給那些完全沒有在使用這項服務的部門"],why:"服務有生命週期。不退場的舊服務會持續佔用人力，也是資安上的負債。"},
 {t:"持續改善",q:"「持續服務改善」要有效，最關鍵的是什麼？",a:["有明確的衡量基準、負責人和追蹤，而不是一次性的活動","每年辦一次口號比賽","多買幾套工具","把去年的改善計畫換一個新的名稱再提出一次"],why:"先知道現在在哪、要去哪、怎麼量，改善才看得出效果。"},
 {t:"多供應商",q:"服務由好幾家廠商共同提供，出問題時互相推責。管理上需要什麼？",a:["有一個整合的角色負責端到端的協調和責任","讓廠商自己解決","每次都換廠商","規定各家廠商之間不可以互相交談以避免爭執"],why:"每家只顧自己那一段。要有人為整體結果負責，合約也要寫明協作義務。"},
 {t:"導入策略",q:"組織想導入一套昂貴的 ITSM 工具來解決流程混亂。先做什麼比較好？",a:["先釐清並簡化流程，再用工具落實","先買工具，流程以後再說","把所有模組一次全開","先請廠商把系統的畫面調整成公司喜歡的顏色"],why:"工具只會把現有的流程自動化。流程是亂的，就是更快地亂。"},
 {t:"文化",q:"要讓人願意如實回報變更失敗和操作錯誤，最重要的是什麼？",a:["不以懲罰個人為目的，把重點放在改善流程","加重處分","公開點名","規定所有的錯誤都必須在發生之前就先行回報"],why:"怕被罰就會隱瞞，問題只會越藏越大。能安心說出錯誤，組織才學得到東西。"}
]]},
{id:'mon',lv:[[
 {t:"監控觀念",q:"為系統建立監控，最主要的目的是？",a:["在使用者發現之前就知道出問題","讓機房看起來很專業","增加主機的負載","讓每一位同仁都必須整天盯著螢幕不能離開座位"],why:"等使用者打電話才知道，已經晚了。監控是把「被通知」變成「自己先知道」。"},
 {t:"告警",q:"監控的「門檻告警」是怎麼運作的？",a:["數值超過設定的界線時發出通知","每天固定時間通知一次","隨機通知","只有在主機完全關機之後才會發出一次通知"],why:"例如磁碟使用率超過 85% 就通知。門檻要讓人來得及處理，又不會一直誤響。"},
 {t:"監控觀念",q:"只用 ping 監控一台網站伺服器，會漏掉什麼？",a:["主機活著但網站服務其實已經掛了","主機的顏色","機房的地址","伺服器的型號以及當初購買時候的價格"],why:"ping 只證明主機有回應。要檢查的是服務本身，例如實際去要一次網頁看有沒有正常回應。"},
 {t:"日誌",q:"系統的日誌（log）記錄的是什麼？",a:["系統和程式執行過程中發生的事件","使用者的照片","電費","公司每一位員工每天中午各自吃了什麼便當"],why:"出事後要還原經過，主要靠它。平常沒人看，但沒有它就什麼都查不到。"},
 {t:"通訊協定",q:"SNMP 在監控上的用途是？",a:["向網路設備和主機查詢狀態數值，或接收它們主動送出的通知","傳送電子郵件","加密網頁","把監控畫面投影到會議室的大螢幕上面"],why:"交換器的流量、介面狀態、溫度，很多都是靠 SNMP 取得的。"},
 {t:"告警",q:"告警發出來了，但半夜沒有人收到。問題出在哪裡？",a:["通知沒有對應到值班的人","告警的顏色不夠紅","主機太多","告警的文字內容寫得不夠有禮貌"],why:"告警要送到「當下負責、而且收得到」的人。只寄到沒人看的群組信箱，等於沒有告警。"},
 {t:"視覺化",q:"監控的儀表板最大的用處是什麼？",a:["一眼看出整體狀態和趨勢","取代告警","裝飾辦公室","讓主管可以隨時檢查同仁有沒有在座位上"],why:"儀表板適合看趨勢和排查，但不能期待有人一直盯著，所以告警還是必要的。"},
 {t:"基準線",q:"為什麼要先知道系統「平常是什麼樣子」？",a:["才判斷得出現在的數值算不算異常","這樣比較省電","為了寫報告","因為平常的數值依規定必須每個月上報給主管機關"],why:"CPU 70% 對某台是日常、對另一台是警訊。沒有基準，門檻只能亂設。"}
],[
 {t:"監控方法",q:"「黑箱監控」和「白箱監控」的差別是？",a:["黑箱從外部模擬使用者看結果，白箱看系統內部的指標","黑箱用黑色螢幕","白箱只能用在白天","黑箱是由廠商負責監控，白箱則是由內部的同仁自己監控"],why:"黑箱回答「使用者有沒有受影響」，白箱回答「裡面哪裡不對」。兩種都需要。"},
 {t:"告警",q:"一條好的告警，最重要的條件是什麼？",a:["收到的人知道要做什麼","聲音越大越好","每分鐘重複一次","告警的內容越長、包含的數字越多越好"],why:"收到卻不知道該怎麼辦的告警只會被忽略。每條告警都該對應一個處理動作或文件。"},
 {t:"告警",q:"「CPU 很高」和「使用者開網頁要等十秒」，哪一個比較適合拿來叫人？",a:["後者，因為它代表使用者真的受影響","前者，因為數字比較明確","兩個都不要","兩個都要，而且每一個都要同時通知全公司的人"],why:"以症狀告警為主：使用者有感才叫人。原因類的指標留在儀表板幫忙排查。"},
 {t:"指標",q:"服務監控常說的「四個黃金訊號」是哪四個？",a:["延遲、流量、錯誤、飽和度","紅、黃、綠、藍","CPU、記憶體、硬碟、螢幕","早上、中午、下午、晚上四個時段的登入人數"],why:"反應多快、有多少請求、失敗多少、資源快滿了沒。先顧這四個，大部分的問題都看得到。"},
 {t:"日誌",q:"日誌的等級（例如 DEBUG、INFO、WARN、ERROR）有什麼用？",a:["依重要程度篩選，正式環境不必記下所有細節","讓檔案變大","加密日誌","讓不同職位的同仁只能看到屬於自己等級的紀錄"],why:"正式環境全開 DEBUG 會把磁碟塞滿、也淹沒重點。排查時再針對性地調高。"},
 {t:"日誌",q:"把日誌寫成有固定欄位的結構化格式（例如 JSON），好處是？",a:["容易被程式搜尋、篩選和統計","檔案比較小","人比較好讀","可以避免日誌被沒有權限的人打開來看"],why:"純文字要靠關鍵字硬搜。有欄位就能直接查「某使用者在某時段的所有錯誤」。"},
 {t:"監控架構",q:"監控系統本身當機了，會發生什麼事？怎麼預防？",a:["所有告警都不會發，要有另一個獨立的機制檢查它","不會怎樣","告警會加倍","監控系統在設計上是絕對不可能當機的"],why:"沒告警不代表沒事。常見做法是讓監控定時送出心跳，沒收到就由外部服務通知。"},
 {t:"告警",q:"預定的維護期間，告警一直響。應該怎麼處理？",a:["事先設定維護時段，暫停相關告警","把所有告警永久關閉","請值班的人忍耐","把值班人員的手機暫時交給主管統一保管"],why:"預期內的中斷不該叫人。但靜音要有範圍和期限，維護結束就自動恢復。"}
],[
 {t:"指標",q:"回應時間的「平均值」很好看，但常有使用者抱怨很慢。應該改看什麼？",a:["高百分位數，例如第 95 或第 99 百分位","最小值","總和","每天第一筆請求以及最後一筆請求各自的回應時間"],why:"平均會把少數很慢的請求蓋掉。第 99 百分位才看得到那 1% 受苦的使用者。"},
 {t:"告警",q:"核心交換器故障，後面兩百台主機同時告警。告警系統應該具備什麼能力？",a:["依相依關係抑制下游告警，只通知根源","全部照發","全部不發","從兩百台當中隨機挑選其中的十台主機發出告警通知"],why:"兩百封通知會淹沒真正的原因。設定相依或群組，讓值班的人只看到一則。"},
 {t:"追蹤",q:"分散式追蹤（Trace）能回答什麼問題？",a:["一個請求在各個服務之間花了多少時間、卡在哪一段","硬碟還剩多少空間","誰登入過主機","機房的冷氣目前設定在攝氏幾度"],why:"指標告訴你變慢了，追蹤告訴你慢在哪個服務的哪一步。"},
 {t:"指標",q:"在指標上加了「使用者編號」這種值非常多的標籤，會造成什麼問題？",a:["時間序列數量暴增，監控系統的資源和費用失控","指標會變得更準","告警會變少","監控的畫面會因此自動切換成另外一種語言來顯示"],why:"這叫高基數。每個不同的值都是一條獨立的序列，細到個人的資訊應該放在日誌或追蹤。"},
 {t:"服務水準",q:"SLI 和 SLO 的關係是？",a:["SLI 是實際量到的指標，SLO 是為它訂的目標","兩者相同","SLO 是量測值，SLI 是合約","SLI 是給內部看的報表，SLO 則是給外部客戶看的廣告文宣"],why:"例如 SLI 是「成功請求的比例」，SLO 是「每月要達到 99.9%」。"},
 {t:"追蹤",q:"流量很大的系統，追蹤資料為什麼通常只「取樣」保留一部分？",a:["全部保留的儲存和運算成本太高","因為法律禁止","因為追蹤資料不重要","因為取樣之後的資料看起來會比較整齊美觀"],why:"保留一小部分通常就足以看出問題。常見做法是錯誤和特別慢的請求優先保留。"},
 {t:"容量",q:"監控資料除了即時告警，還能用來做什麼規劃？",a:["依成長趨勢預測資源何時不夠","決定員工座位","設計公司標誌","決定下一年度員工旅遊的地點以及預算"],why:"容量問題不是突然發生的。趨勢線讓你提前幾個月知道要擴充。"},
 {t:"監控方法",q:"「合成監控」和「真實使用者監控」各自的強項是？",a:["前者沒人使用時也能發現問題，後者反映實際使用者的體驗","兩者完全相同","前者比較貴","前者只能在測試環境裡面使用，後者只能在正式環境裡面使用"],why:"合成監控定時模擬操作，半夜也測得到；真實使用者監控看得到各地區、各裝置的真實狀況。"}
],[
 {t:"可觀測性",q:"「可觀測性」和傳統監控最大的不同是什麼？",a:["能從系統輸出的資料回答事先沒預料到的問題","只是監控的新名字","不需要告警","只需要安裝一套軟體就可以自動達成，不需要任何設計"],why:"監控是檢查已知會壞的地方；可觀測性是在沒見過的故障發生時，還有足夠的資料可以追。"},
 {t:"告警治理",q:"告警越加越多，值班的人已經麻痺。治理上最有效的做法是？",a:["定期檢視每一條告警：有沒有人處理、有沒有用，沒用的就刪或改","再加更多告警","全部靜音","規定值班的人員每收到一則告警就要寫一份書面報告"],why:"每條告警都要有負責人和處理方式。長期沒人理的告警，本身就是該修的問題。"},
 {t:"成本",q:"日誌量每年翻倍，保存費用快速上升。比較合理的策略是？",a:["依用途分級：近期的放快速查詢，久遠的壓縮歸檔，沒用的不收","全部永久保留在最快的儲存","全部刪除","只保留檔案大小最小的那一些日誌"],why:"不是所有日誌都一樣有價值。同時要顧到法規和調查需要的最低保存期限。"},
 {t:"告警",q:"以 SLO 的「錯誤預算消耗速度」來告警，比固定門檻好在哪裡？",a:["短暫小波動不會叫人，持續消耗才會","永遠不會告警","每秒都告警","告警的次數一定會比固定門檻的方式多出十倍"],why:"它問的是「照這個速度，這個月的目標守不守得住」，更貼近業務真正在乎的事。"},
 {t:"監控即程式碼",q:"把告警規則和儀表板用程式碼管理並放進版本控制，主要好處是？",a:["變更有紀錄、可審查，環境之間能保持一致","畫面會比較漂亮","不需要監控系統","可以讓沒有權限的人完全看不到任何監控畫面"],why:"手動在介面上點出來的規則，沒人知道誰改過、為什麼改。"},
 {t:"持續改善",q:"每次重大事件之後，監控方面應該檢討什麼？",a:["為什麼沒有更早發現，缺了哪個訊號","誰該被處分","監控工具的顏色","這一次事件發生的時候值班的人是不是剛好在吃飯"],why:"每次事件都是在告訴你監控哪裡有洞。補上之後，同類問題下次會早幾分鐘被看到。"},
 {t:"業務監控",q:"所有技術指標都正常，但訂單數突然掉了一半。這說明監控還缺什麼？",a:["業務層面的指標","更多 CPU 圖表","更大的螢幕","更多負責二十四小時盯著螢幕看的值班人力"],why:"系統是為業務服務的。訂單數、登入成功率這類指標，常常比技術指標更早反映問題。"},
 {t:"工具策略",q:"每個團隊各用一套不同的監控工具。組織層面的問題是什麼？",a:["資料不互通，跨系統的問題難以關聯，授權和維護成本也高","沒有問題，越多越好","畫面風格不一致","每個團隊因此都會擁有屬於自己的專屬告警鈴聲"],why:"跨團隊的故障最需要把資料放在一起看。不必只剩一套，但資料至少要能關聯。"}
]]},
{id:'auto',lv:[[
 {t:"自動化觀念",q:"哪一種工作最適合優先自動化？",a:["重複、步驟固定、容易出錯的","一年只做一次、每次都不一樣的","需要大量人際溝通的","需要依照當下的情況做出重大決策的工作"],why:"做得越頻繁、步驟越固定，自動化的回報越高。"},
 {t:"腳本語言",q:"PowerShell 主要是用來做什麼的？",a:["用指令和腳本管理 Windows 和相關服務","編輯圖片","播放音樂","專門用來設計公司對外的宣傳網站版面"],why:"很多管理動作在圖形介面要點很久，用 PowerShell 一行就能對一百台做完。"},
 {t:"排程",q:"要讓腳本每天固定時間自動執行，要用什麼？",a:["作業系統的排程功能","每天請同事記得按","開機啟動資料夾","把腳本的檔名改成當天想要執行的時間"],why:"Windows 的工作排程器、Linux 的 cron 都是做這件事。"},
 {t:"腳本設計",q:"腳本裡的伺服器名稱、路徑，比較好的寫法是？",a:["寫成參數或變數，不要散落在程式各處","每個地方直接寫死","寫在註解裡","請使用者每一次執行之前自己打開腳本來修改"],why:"環境一變就要改很多地方，容易漏。集中成參數，換環境只改一處。"},
 {t:"測試",q:"會修改或刪除東西的腳本，正式執行前應該先做什麼？",a:["在測試環境試跑，或用只顯示不執行的模式確認","直接在正式環境跑","請主管先簽名","先把腳本的檔案複製十份分別存放在不同的資料夾"],why:"很多工具有預演模式，會列出「將要做什麼」而不真的做。"},
 {t:"版本控制",q:"管理用的腳本為什麼也應該放進版本控制？",a:["知道誰在什麼時候改了什麼，改壞了能退回","讓腳本跑得比較快","因為稽核要求","這樣腳本就可以在沒有安裝直譯器的電腦上執行"],why:"腳本散在各人電腦，最後沒人知道哪一份才是正在用的版本。"},
 {t:"可維護性",q:"腳本開頭寫清楚用途、參數和注意事項，是為了誰？",a:["之後接手的人，包括半年後的自己","電腦","稽核人員","當初設計和撰寫這一種腳本語言的原廠工程師"],why:"沒說明的腳本，別人不敢改也不敢跑，最後只能重寫。"},
 {t:"權限",q:"排程執行的自動化腳本，應該用什麼權限跑？",a:["只給完成這件工作需要的最小權限","一律用最高管理員","用離職同事的帳號","用部門裡面職位最高的那一位主管的帳號"],why:"腳本被竄改或有 bug 時，權限越大災情越大。"}
],[
 {t:"組態管理",q:"組態管理工具的「宣告式」寫法是什麼意思？",a:["描述系統最後應該是什麼狀態，由工具決定怎麼達成","一步一步寫出每個指令","用口頭宣布","每一次執行之前都要先向主管口頭報告並且取得書面同意"],why:"寫「這個套件要存在」而不是「執行安裝指令」。重複執行也只會補上差異。"},
 {t:"工具特性",q:"Ansible 這類「無代理程式」的工具，是怎麼管理遠端主機的？",a:["透過既有的遠端連線（例如 SSH）執行","在每台主機安裝常駐程式","用電子郵件傳指令","請當地的同仁依照指示在每一台主機上手動操作"],why:"不必先在每台裝東西，起步容易。代價是每次要建立連線，大量主機時速度較慢。"},
 {t:"清冊",q:"自動化工具裡的「主機清冊」是用來做什麼的？",a:["定義有哪些主機、怎麼分組，決定動作套用到誰","記錄主機的購買價格","存放密碼","統計每一台主機在每個月總共消耗了多少度的電力"],why:"分組做得好，就能說「先套用到測試組」，而不是每次手動列主機名稱。"},
 {t:"範本",q:"要產生一百份只有少數欄位不同的設定檔。比較好的做法是？",a:["用範本加上變數自動產生","手動複製貼上再逐一修改","只做一份給大家共用","請一百位同仁每個人各自負責撰寫其中的一份"],why:"手改一百份一定會有幾份改錯。範本讓差異只存在於變數裡。"},
 {t:"錯誤處理",q:"自動化腳本執行到第三步失敗了。預設應該怎麼處理？",a:["停下來並回報，不要帶著錯誤繼續往下做","忽略錯誤繼續執行","重開機","把失敗的那一步直接刪除，然後從頭再執行一次"],why:"前一步沒成功，後面的動作可能建立在錯誤的狀態上，越做越糟。"},
 {t:"機密管理",q:"自動化腳本需要用到密碼，放進版本控制時應該怎麼辦？",a:["用工具加密或從密鑰管理系統取得，不放明文","直接寫在腳本裡","寫在檔名上","另外存成一個純文字檔案，和腳本放在同一個資料夾"],why:"版本控制會永久保留歷史，明文密碼一進去就很難清乾淨。"},
 {t:"部署策略",q:"要把新設定套用到兩百台主機。比較安全的順序是？",a:["先套用少數幾台確認，再分批擴大","兩百台同時套用","從最重要的主機開始","依照主機名稱的筆畫順序一台一台慢慢套用"],why:"分批讓錯誤只影響一小部分，還來得及停。"},
 {t:"紀錄",q:"自動化執行的結果為什麼要留下紀錄？",a:["出問題時才知道對哪些主機做了什麼、哪些成功哪些失敗","讓硬碟有東西可存","為了計算加班費","因為沒有紀錄的話自動化工具就會拒絕執行"],why:"沒有紀錄，兩百台裡哪三台失敗了都不知道。"}
],[
 {t:"組態漂移",q:"「組態漂移」指的是什麼？",a:["主機的實際設定，逐漸偏離了應有的標準","主機被搬到別的機房","硬碟老化","主機的時間因為主機板電池沒電而越走越慢"],why:"有人手動改了幾台沒記錄，久了每台都不一樣。定期用工具比對和修正可以收斂回來。"},
 {t:"基礎設施即程式碼",q:"用程式碼定義基礎設施之後，「重建一套一模一樣的環境」會變得怎樣？",a:["可以重複執行同一份定義快速建立","還是要手動一台一台設定","完全不可能","需要先向原廠購買另外一套完全相同的硬體設備"],why:"這也是災難復原和測試環境的基礎：環境是可以從程式碼長出來的。"},
 {t:"變更流程",q:"基礎設施的程式碼要套用到正式環境。比較穩當的流程是？",a:["先產生變更計畫給人審查，核准後由管線自動套用","每個人在自己的電腦上直接套用","不需要審查","由最資淺的同仁在大家下班之後一個人獨自登入執行"],why:"計畫會列出「將新增、修改、刪除什麼」。審的是這份計畫，而不是事後才發現刪錯。"},
 {t:"狀態管理",q:"基礎設施即程式碼工具的「狀態檔」為什麼要特別保護？",a:["它記錄了實際資源的對應，常含機密，損毀或多人同時改會造成混亂","它只是暫存檔","它可以隨意刪除","它的檔案很大，會佔用掉大部分的硬碟空間"],why:"狀態檔要集中存放、加密、有鎖定機制，不能放在個人電腦上各改各的。"},
 {t:"模組化",q:"把常用的設定包成可重用的模組，主要好處是？",a:["各團隊用同一套經過驗證的做法，不必各自重寫","檔案數量變多","執行變慢","每一個團隊都可以依照自己的喜好任意修改模組的內容"],why:"標準化的模組也方便統一修正：改一處，所有使用的地方跟著更新。"},
 {t:"測試",q:"自動化的變更在套用到正式環境之前，應該怎麼驗證？",a:["先在和正式環境相近的測試環境套用並檢查結果","憑經驗判斷","直接套用再觀察","請撰寫的人自己口頭保證一定不會有任何的問題"],why:"語法正確不代表結果正確。實際跑過才知道服務有沒有起來。"},
 {t:"回復",q:"自動化套用新設定後服務異常。最快的回復方式通常是？",a:["把版本控制退回上一版，重新套用","登入每台主機手動改回來","等它自己恢復","把所有的主機全部重新安裝一次作業系統"],why:"設定都在版本控制裡，退版就是重跑一次上一版。這是自動化帶來的保險。"},
 {t:"機密管理",q:"管線執行時需要雲端的存取金鑰。比較安全的給法是？",a:["執行時動態取得短期憑證，不存長期金鑰","把長期金鑰寫在管線設定裡","用個人帳號的密碼","把金鑰直接貼在團隊的聊天群組方便大家取用"],why:"長期金鑰外洩後可以被一直使用。短期憑證就算被拿走，很快就失效。"}
],[
 {t:"優先順序",q:"團隊人力有限，要決定先自動化哪些工作。比較好的判斷依據是？",a:["發生頻率、每次耗時和出錯的風險","哪一個最有趣","哪一個最難","哪一個工作是由最資深的同仁目前在負責處理的"],why:"每天做十次的小事，可能比一年一次的大工程更值得先做。"},
 {t:"平台化",q:"把常見的需求（例如申請主機、開通權限）做成自助服務，對資訊單位的意義是？",a:["從重複執行請求，轉為維護平台和規則","工作會消失","權限管控會變差","使用者從此不需要再遵守任何的申請流程和規定"],why:"自助的前提是把規則寫進平台：配額、核准、命名、到期回收。"},
 {t:"政策即程式碼",q:"「政策即程式碼」的做法是什麼？",a:["把合規規則寫成可自動檢查的程式，在變更套用前攔下違規","把政策文件掃描成圖片","請大家背誦政策","把公司的所有政策文件全部翻譯成英文版本"],why:"例如「儲存桶不得公開」寫成規則，違反的變更在管線裡就被擋下，不必等稽核。"},
 {t:"風險控制",q:"自動化工具擁有對所有主機的管理權限。最需要注意的風險是？",a:["它被入侵或誤用時，影響的是全部主機","它會佔用太多螢幕空間","它需要定期重開機","它的操作介面沒有提供足夠多種的語言可以選擇"],why:"自動化平台是最高價值的目標之一。存取控制、變更審查、執行紀錄都要做到位。"},
 {t:"維護",q:"早年寫的大量腳本，原作者已離職，沒人敢動。這種狀況怎麼避免？",a:["把自動化當成正式的程式碼管理：有負責人、文件、審查和測試","禁止任何人寫腳本","把舊腳本全部刪掉","規定每一支腳本都只能由原作者本人執行和修改"],why:"沒人懂的自動化比手動更危險，因為它還在自動地跑。"},
 {t:"GitOps",q:"GitOps 的核心做法是什麼？",a:["以版本控制中的內容為唯一依據，由系統自動讓實際環境和它一致","用 Git 聊天","不再使用版本控制","每一次變更之前都要先把整個儲存庫刪除再重新建立"],why:"想改環境就改儲存庫。誰改的、為什麼改、怎麼退，全部都在版本紀錄裡。"},
 {t:"人工核准",q:"所有動作都應該全自動、不需要人介入嗎？",a:["不是，高風險或不可逆的動作應該保留人工核准","是，越自動越好","不是，所有動作都要人工執行","是，而且連核准的步驟也應該交給另外一支腳本來自動同意"],why:"自動化的目標是減少無意義的人工，不是拿掉判斷。刪除資料這類動作要有人確認。"},
 {t:"成效衡量",q:"要向管理階層說明自動化的成效，哪一組數字最有說服力？",a:["節省的工時、變更失敗率和處理時間的變化","腳本的總行數","使用了幾種工具","團隊裡面總共有幾位同仁通過了相關的認證考試"],why:"行數和工具數是投入，不是成果。成果是更快、更穩、更少出錯。"}
]]},
{id:'storage',lv:[[
 {t:"儲存架構",q:"NAS 和 SAN 的主要差別是？",a:["NAS 提供檔案分享，SAN 提供區塊層級的磁碟給主機","NAS 比較大台","SAN 不需要網路","NAS 只能給個人電腦使用，SAN 只能給手機和平板使用"],why:"NAS 像共用資料夾；SAN 讓主機看到一顆像是本機的磁碟，自己格式化使用。"},
 {t:"儲存類型",q:"區塊、檔案、物件三種儲存，哪一種最適合存放大量的備份檔和影音檔？",a:["物件儲存","區塊儲存","軟碟片","任何一種都完全相同，選擇上沒有差別"],why:"物件儲存容量容易擴充、成本低，適合大量不常修改的資料。資料庫這類則適合區塊儲存。"},
 {t:"容量",q:"買了十顆 4TB 的硬碟組成陣列，實際可用容量為什麼會少於 40TB？",a:["一部分要用來存放備援資料","廠商偷工減料","硬碟會縮水","作業系統在安裝的時候會固定扣除掉一半的容量"],why:"保護等級越高、預留的熱備援越多，可用容量越少。規劃時要用可用容量算。"},
 {t:"機房環境",q:"機房為什麼要控制溫度和濕度？",a:["過熱會讓設備故障，太乾有靜電、太濕會結露","讓工作人員比較舒服","節省電費","因為法律明確規定機房的溫度必須固定在攝氏十八度"],why:"設備有建議的運作範圍。溫濕度監控和告警是機房的基本配備。"},
 {t:"機櫃",q:"機櫃規格常說的「1U」是什麼單位？",a:["設備高度的單位，約 4.45 公分","重量單位","電力單位","代表這一台設備最多可以同時連接的使用者人數"],why:"標準機櫃常見 42U。規劃時要算設備高度，也要算重量和電力。"},
 {t:"機房環境",q:"機房採用「冷熱通道」的配置，目的是什麼？",a:["讓冷空氣和排出的熱空氣不要混在一起，提高冷卻效率","方便人員走動","增加可放的機櫃數","讓機房在視覺上看起來比較整齊，參觀的時候也比較有科技感"],why:"設備正面對正面吸冷氣、背面對背面排熱。混在一起冷氣就白吹了。"},
 {t:"消防",q:"機房通常不用灑水，而用氣體滅火系統。原因是？",a:["水會損壞運作中的電子設備","氣體比較便宜","水壓不夠","因為機房的位置通常都設在比較高的樓層接不到水管"],why:"氣體滅火不導電、不留殘渣。但要注意人員安全，啟動前要能撤離。"},
 {t:"電力",q:"伺服器接上 UPS，除了停電時撐一段時間，還有什麼作用？",a:["穩定電壓，濾掉突波和瞬間的電力波動","讓伺服器變快","取代冷氣","讓伺服器可以在完全不接任何電源的情況下永久運作"],why:"短暫的電壓不穩比完全停電更常發生，也會造成設備重開或損壞。"}
],[
 {t:"儲存網路",q:"iSCSI 是什麼？",a:["透過一般的 IP 網路傳送區塊儲存的協定","一種硬碟的尺寸","一種檔案格式","一種專門用來連接印表機和掃描器的傳輸線規格"],why:"它讓主機用乙太網路就能掛載遠端的磁碟，不必建置光纖通道網路。"},
 {t:"可用性",q:"主機到儲存設備之間設定「多重路徑」，是為了什麼？",a:["一條路徑故障時還有另一條，同時也能分散流量","讓資料加密","減少硬碟用量","讓同一份資料可以同時寫入到兩台不同廠牌的設備"],why:"單一條線或一張卡故障，就讓主機看不到磁碟，那整套備援就白做了。"},
 {t:"容量管理",q:"儲存設備使用精簡配置，最需要監控的數字是？",a:["實體容量的實際使用率","宣告出去的總容量","硬碟的轉速","儲存設備面板上面的指示燈目前是什麼顏色"],why:"宣告的容量可以超過實體容量。實體滿了，所有掛載它的系統一起出事。"},
 {t:"資料保護",q:"儲存設備的「快照」和「複製」有什麼不同？",a:["快照依賴原始資料、建立很快；複製是完整獨立的另一份","兩者完全相同","複製比較快","快照只能保留一個小時，複製則是可以永久保留"],why:"原始資料毀損時快照也跟著沒用，所以快照不能取代放在另一套設備上的複本。"},
 {t:"分層",q:"「分層儲存」是怎麼運作的？",a:["常用的資料放快速昂貴的媒體，少用的移到便宜的","所有資料都放最快的","依檔名排序","依照資料建立者在公司的職位高低來決定存放的位置"],why:"大部分資料寫入後很少再讀。把它們移到便宜的層級，快的空間留給真正需要的。"},
 {t:"電力",q:"機房同時有 UPS 和發電機。兩者怎麼搭配？",a:["UPS 先撐住瞬間斷電，發電機啟動後接手長時間供電","只需要其中一個","發電機先啟動","兩者輪流供電，每個小時固定切換一次以平均兩邊的使用壽命"],why:"發電機啟動要幾十秒，這段空檔靠 UPS。發電機也要定期帶載測試、確認油料。"},
 {t:"電力",q:"機櫃裡裝兩條 PDU（電源分配器），應該怎麼接？",a:["各接到不同的電力迴路，設備的兩顆電源分別插兩邊","兩條接同一個插座","只用其中一條","兩條串接在一起，可以延長使用的距離"],why:"兩條 PDU 接同一迴路，那個迴路跳電就全滅。備援要一路分開到源頭。"},
 {t:"維運",q:"機櫃裡的線材為什麼要整理並貼上標籤？",a:["維修時能快速找到正確的線，避免拔錯，也不擋住散熱","為了拍照好看","只是個人習慣","因為沒有貼標籤的線材在傳輸資料的時候速度會比較慢"],why:"亂成一團的線，會把五分鐘的維修變成一小時，還可能順手拔掉別人的。"}
],[
 {t:"資料保護",q:"磁碟容量越來越大，對 RAID 重建有什麼影響？",a:["重建時間拉長，期間再壞一顆的風險升高","重建變快","沒有影響","重建完成之後可用的容量會自動變成原本的兩倍"],why:"十幾 TB 的硬碟重建可能要好幾天。所以大容量常採雙重同位或其他保護方式。"},
 {t:"效能",q:"評估儲存效能時，IOPS、吞吐量、延遲三個指標，哪一個最直接反映使用者感受到的快慢？",a:["延遲","IOPS","吞吐量","儲存設備在機櫃中所佔用的高度"],why:"IOPS 很高但每次要等很久，應用程式還是慢。資料庫尤其對延遲敏感。"},
 {t:"儲存效率",q:"儲存設備的「重複資料刪除」和「壓縮」，對哪一類資料效果最差？",a:["已經加密或已經壓縮過的資料","大量相似的虛擬機映像","文字日誌","許多台電腦上面內容幾乎相同的作業系統檔案"],why:"加密後的資料看起來像亂數，找不到重複也壓不下去。規劃容量時不能假設都有同樣的節省率。"},
 {t:"儲存網路",q:"為什麼建議把儲存流量放在獨立的網路，不和一般流量混用？",a:["避免互相搶頻寬造成延遲，也方便隔離和保護","因為網路線顏色不同","沒有特別原因","因為儲存流量依規定不可以經過任何一台交換器"],why:"儲存流量延遲一高，上面所有系統都受影響。獨立網路也縮小了能碰到儲存的範圍。"},
 {t:"資料保護",q:"「抹除碼」（Erasure Coding）相對於傳統 RAID 或多份複本，主要優點是？",a:["用較少的額外空間達到很高的容錯","速度一定最快","不需要運算資源","完全不需要任何一顆額外的硬碟來存放備援的資料"],why:"它把資料切成多塊加上校驗塊分散存放。代價是運算較重，重建和小檔案效能要評估。"},
 {t:"電力規劃",q:"規劃機櫃時說「每櫃 6 kW」，這個數字限制的是什麼？",a:["這個機櫃的電力和散熱能承受的設備總耗電","機櫃的重量","網路頻寬","這一個機櫃裡面所有設備最多可以存放的資料總容量"],why:"空間還有不代表能再放。高密度設備很容易先用完電力和冷卻。"},
 {t:"能源效率",q:"資料中心的 PUE 是在量什麼？",a:["總用電量相對於資訊設備用電量的比值","伺服器的運算速度","網路延遲","資料中心每一年總共發生了幾次的停電事故"],why:"越接近 1 代表越多電真的用在運算上，而不是冷氣和電力轉換的損耗。"},
 {t:"環境監控",q:"機房除了溫濕度，還應該監控哪些環境項目？",a:["漏水、煙霧、門禁和電力狀態","牆壁顏色","地板花紋","機房管理人員每天進出機房的時候穿什麼顏色的衣服"],why:"冷氣漏水是機房很常見的事故來源。這些感測都要接到告警，不能只靠巡視。"}

 {t:"生命週期",q:"儲存設備即將終止支援，資料要遷到新設備。規劃時最關鍵的是什麼？",a:["遷移期間的服務影響、資料驗證和退回方案","新設備的外觀","舊設備能賣多少錢","新設備的操作手冊總共有多少頁以及使用的字體"],why:"儲存遷移牽動上面所有系統。分批、驗證、保留舊設備一段時間，是常見做法。"},
 {t:"資料保護",q:"物件儲存的「不可變」（WORM）功能，適合用在哪裡？",a:["備份和需要防竄改的紀錄","經常要修改的資料庫檔案","暫存檔","每天都需要重新覆寫更新內容的工作報表"],why:"設定期限內不能改也不能刪，可以防勒索軟體和內部誤刪，也符合部分法規的留存要求。"},
 {t:"多站架構",q:"兩個機房之間要做儲存的「同步複寫」。最大的限制因素是什麼？",a:["距離造成的延遲，每筆寫入都要等對方確認","硬碟品牌","機房樓層","兩個機房各自所在地區的電費單價有沒有差異"],why:"距離越遠延遲越高，直接拖慢每一筆寫入。太遠只能用非同步，接受少量資料差異。"},
 {t:"機房分級",q:"資料中心的分級（Tier I 到 IV）主要在區分什麼？",a:["電力和冷卻等基礎設施的備援程度和可維護性","機房的坪數","伺服器的數量","機房所在的建築物總共有幾層樓，以及它的屋齡"],why:"等級越高，越能在不停機的情況下維護和容忍故障，建置和營運成本也越高。"},
 {t:"部署策略",q:"評估系統要放在自建機房、代管機房還是公有雲。最應該比較的是什麼？",a:["整體成本、所需的維運能力、法規要求和彈性","哪一個聽起來最先進","同業怎麼選","哪一個選項的業務人員來公司拜訪的次數最多"],why:"沒有一定最好的選項。負載穩定且長期的，自建或代管可能較省；變動大的，雲端較有彈性。"},
 {t:"可用性",q:"機房宣稱「雙迴路供電」。要確認真的沒有單點，應該檢查到哪裡？",a:["一路追到源頭：配電盤、UPS、變壓器、進線是否都分開","只要設備有兩顆電源就夠","只要有兩條延長線","只要確認兩條電源線的顏色不一樣就可以了"],why:"很多「雙迴路」在上游某處匯在同一台設備或同一條進線，那裡就是單點。"},
 {t:"容量規劃",q:"儲存容量每年成長 40%。在預算規劃上應該怎麼做？",a:["依成長率預估未來需求，分階段擴充並提前編列","等滿了再緊急採購","一次買足十年份","每一年都固定編列和前一年完全相同金額的預算"],why:"採購有前置時間，等告警才買來不及。一次買太多又會遇到技術過時和保固到期。"},
 {t:"資料清除",q:"儲存設備退役送回原廠或報廢。資料上要怎麼處理？",a:["依規定清除或銷毀並取得證明，加密的設備可銷毀金鑰","直接送走","只刪除檔案","把設備上面貼的資產標籤撕掉就算是處理完成"],why:"退役設備是資料外洩的常見來源。清除方式和證明文件要寫進流程。"}

{id:'cloud',lv:[[
 {t:"部署模式",q:"「混合雲」指的是什麼？",a:["同時使用自有機房和公有雲，並讓兩邊協同運作","同時用兩種顏色的伺服器","只用公有雲","把同一台伺服器切成一半放在公司、一半放在國外"],why:"很多組織把核心或受法規限制的系統留在自有環境，其他放雲端。"},
 {t:"基礎觀念",q:"雲端的「區域」和「可用區」是什麼關係？",a:["一個區域裡有多個彼此隔離的可用區","兩者相同","可用區比區域大","區域是給企業用戶使用的，可用區則是給個人用戶使用的"],why:"可用區是獨立的機房群。把系統分散在多個可用區，單一機房出事不會全倒。"},
 {t:"計費",q:"雲端「用多少付多少」的計費方式，對哪一種負載最有利？",a:["用量起伏很大的","全年固定滿載的","完全不使用的","每天固定只在半夜執行一分鐘的小型測試"],why:"尖峰時擴充、離峰時縮減，不必為了尖峰長期養一堆閒置設備。"},
 {t:"資料保護",q:"雲端儲存桶最常見的資料外洩原因是什麼？",a:["被設定成公開存取","雲端業者機房失火","硬碟壞掉","儲存桶的名稱取得太長導致系統無法正確辨識"],why:"這是客戶自己的設定問題。新建的儲存桶應預設封鎖公開存取。"},
 {t:"計費",q:"雲端的虛擬機已經關機了，為什麼還在收費？",a:["掛著的磁碟、保留的 IP 等資源仍然計費","雲端業者算錯","關機要另外付手續費","因為虛擬機在關機之後會自動搬移到比較昂貴的機房"],why:"關機只停了運算的費用。不用的資源要刪除，不是只關機。"},
 {t:"網路安全",q:"雲端的「安全群組」作用類似什麼？",a:["虛擬機層級的防火牆規則","使用者群組","備份排程","用來設定哪些同仁可以收到帳單通知的郵件清單"],why:"它控制哪些來源可以連到哪些連接埠。對全世界開放管理埠是最常見的錯誤。"},
 {t:"資源管理",q:"幫雲端資源加上「標籤」（例如專案、負責人、環境），主要用途是？",a:["知道資源是誰的、做什麼用，也能依此分攤成本","讓資源跑得比較快","加密資源","讓資源在主控台的畫面上顯示成各種不同的形狀"],why:"沒標籤的資源，帳單來了沒人認，也沒人敢刪。"},
 {t:"帳號安全",q:"登入雲端管理主控台的帳號，最基本的保護是什麼？",a:["啟用多因素驗證","使用很短的密碼","大家共用一組","把登入的網址設成瀏覽器一開啟就自動顯示的首頁"],why:"主控台帳號被盜，攻擊者可以刪除一切或開大量資源挖礦，帳單由你付。"}

 {t:"網路",q:"雲端虛擬網路裡的「公有子網路」和「私有子網路」差別是？",a:["公有的可以直接對外連線，私有的不行","公有的比較便宜","私有的速度比較慢","公有的是所有客戶共用同一個，私有的需要另外付費申請"],why:"資料庫和應用程式放私有子網路，只有負載平衡這類入口放公有的。"},
 {t:"身分",q:"雲端上的程式要存取其他雲端服務。比較安全的授權方式是？",a:["指派角色給資源，自動取得短期憑證","把長期金鑰寫在程式裡","用管理員的帳號密碼","把金鑰存成一個文字檔案放在虛擬機的桌面"],why:"角色不必自己保管金鑰，憑證自動輪替。長期金鑰是雲端最常見的外洩來源。"},
 {t:"彈性",q:"「自動擴展」是在做什麼？",a:["依負載自動增加或減少運算資源","自動升級作業系統","自動備份","自動幫每一台虛擬機更換成比較好記的名稱"],why:"流量高時加機器、低時收回。前提是應用程式能多台同時運作、不把狀態存在單機。"},
 {t:"可用性",q:"負載平衡器除了分散流量，還有什麼重要功能？",a:["健康檢查，自動把故障的後端移出服務","加密硬碟","發送電子郵件","自動幫後端的每一台主機安裝最新的作業系統"],why:"後端一台故障時，使用者不會被導過去。這是多台備援真正生效的關鍵。"},
 {t:"託管服務",q:"使用雲端的「託管資料庫」服務，相對於自己在虛擬機上安裝，主要優點是？",a:["修補、備份、高可用這些維運工作由業者處理","一定比較便宜","可以取得作業系統的最高權限","資料庫的效能調校從此完全不需要任何人去理會"],why:"省下的是維運人力。代價是彈性較低、某些設定不能動。"},
 {t:"資料保護",q:"雲端資料的備份只放在同一個區域。風險是什麼？",a:["區域性的故障或帳號被入侵時，備份可能一起失去","沒有風險","還原比較慢","備份的檔案會因為放在同一個區域而自動被壓縮變小"],why:"重要資料要跨區域甚至跨帳號保存。攻擊者拿到主帳號時，常會連備份一起刪。"},
 {t:"成本管理",q:"要避免月底才發現雲端帳單爆增，最基本的設定是？",a:["設定預算和費用警示","每個月換一張信用卡","不看帳單","把所有的資源都移到同一個可用區以方便計算"],why:"異常通常是忘了關的資源或設定錯誤造成的。越早通知，損失越小。"},
 {t:"稽核",q:"雲端帳號的「操作稽核紀錄」為什麼一定要開啟並妥善保存？",a:["才查得到誰在什麼時候對資源做了什麼","這樣運算比較快","為了美觀","因為沒有開啟的話雲端業者會加收額外的罰款"],why:"沒有它，資源被刪或設定被改都無從追查。紀錄要存到攻擊者刪不到的地方。"}

 {t:"混合連線",q:"公司機房要連到雲端。「VPN」和「專線」怎麼選？",a:["VPN 便宜快速但走網際網路、品質不保證；專線穩定但貴且建置久","VPN 一定比較好","專線不需要加密","兩者的差別只在於連接線的顏色和接頭形狀不同"],why:"起步或流量不大用 VPN；延遲敏感或流量大再上專線，並保留 VPN 當備援。"},
 {t:"高可用",q:"雲端上的系統要能承受單一機房故障。最基本的設計是什麼？",a:["把資源分散部署在多個可用區","把虛擬機的規格加大","多買幾個儲存桶","把所有的資源都集中放在同一台實體主機上面"],why:"單一可用區故障並不罕見。資料庫、運算、負載平衡都要跨區。"},
 {t:"治理架構",q:"組織使用雲端的規模變大後，為什麼建議用多個帳號（或訂閱）分開管理？",a:["隔離不同環境和團隊，限制出事的影響範圍，也方便分帳","讓帳單看起來比較少","可以拿到比較多免費額度","因為一個帳號最多只能建立一台虛擬機"],why:"正式、測試、資安稽核各在不同帳號。一個帳號被入侵，不會直接波及其他。"},
 {t:"法規",q:"選擇雲端區域時，法規上最需要確認什麼？",a:["資料是否被要求存放在特定地區或境內","區域名稱好不好記","當地的時區","當地的雲端機房建築外觀是不是比較新穎"],why:"個資、政府、金融、醫療資料常有落地要求。備份和複本存放的區域也要一併確認。"},
 {t:"成本",q:"雲端帳單裡，哪一項費用最容易被低估？",a:["資料傳出雲端的流量費","建立帳號的費用","登入主控台的費用","幫資源取名字和修改名字的手續費"],why:"資料進去通常免費，出來要錢。大量對外傳輸、跨區複寫、搬離雲端時都會遇到。"},
 {t:"成本",q:"有一批主機會穩定地運作三年。怎麼降低費用？",a:["採用預留或承諾用量的方案","每天關機再開機","改用更大的規格","每個月把主機搬移到另外一個區域一次"],why:"承諾使用一段期間可以換到明顯的折扣。前提是用量真的穩定，否則反而浪費。"},
 {t:"部署",q:"雲端資源用主控台手動點選建立。規模變大後最大的問題是什麼？",a:["無法重現、沒有變更紀錄，環境之間不一致","畫面太漂亮","速度太快","主控台會因為建立的資源數量太多而無法登入"],why:"手動建立的環境沒人說得清楚有什麼。用程式碼定義，才能審查、重建和稽核。"},
 {t:"身分",q:"公司已有自己的身分系統。員工登入雲端主控台應該怎麼做？",a:["和公司的身分系統整合，用同一組身分登入","每人另外建一組雲端帳號","全公司共用一組","每一次需要登入的時候才臨時建立一個新的帳號"],why:"整合後離職停用一處即可，權限也能依公司的群組管理，不會留下孤兒帳號。"}

 {t:"遷移策略",q:"規劃把上百個系統搬到雲端。比較實際的做法是？",a:["逐一評估：直接搬、調整後搬、重構、改用現成服務或留在原地","全部原封不動搬上去","全部重新開發","依照系統名稱的字母順序每個星期固定搬移十個"],why:"每個系統的價值、技術和相依性都不同。不是每個都值得上雲，也不是每個都該重寫。"},
 {t:"多雲",q:"採用「多雲」策略（同時使用兩家以上業者），最主要的代價是什麼？",a:["維運複雜度和所需技能加倍，往往只能用各家的共同功能","一定比較便宜","完全沒有代價","兩家業者會因此互相競爭而主動調降一半的價格"],why:"為了避免鎖定而多雲，常常換來更高的複雜度。要有明確的理由再做。"},
 {t:"退場",q:"評估雲端服務時，為什麼要先想好「怎麼離開」？",a:["資料搬出的成本、格式和時間，決定了日後有沒有選擇","因為一定會離開","為了殺價","因為雲端業者依規定每三年就要更換一次"],why:"退場計畫不代表要走，而是知道自己的依賴有多深、談判時有沒有籌碼。"},
 {t:"成本治理",q:"FinOps 的核心觀念是什麼？",a:["讓工程、財務和業務共同為雲端成本負責，持續最佳化","由財務部門決定所有技術選型","盡量不要用雲端","每一年只在編列預算的那個時候才討論一次雲端的費用"],why:"雲端的花費是工程決策的結果。讓做決定的人看得到成本，才會有效率。"},
 {t:"架構",q:"把舊系統原封不動搬上雲端之後，發現費用比原本還高。最可能的原因是什麼？",a:["架構沒有利用雲端的彈性，等於租了一批全年開機的機器","雲端本來就比較貴","匯率變動","因為舊系統的程式碼行數太多所以被加收費用"],why:"雲端的優勢在彈性和託管服務。照搬只是換個地方放主機，還多了流量費。"},
 {t:"災難復原",q:"整個雲端區域發生長時間中斷。要能繼續服務，需要什麼設計？",a:["跨區域的資料複寫和可切換的部署","多買幾台同區域的主機","打電話給客服","把所有的資料同時備份到同一個區域的另外一個儲存桶"],why:"跨可用區防機房故障，跨區域才防區域級災難。成本高很多，要依業務衝擊決定。"},
 {t:"治理",q:"讓各團隊自由使用雲端又不失控，治理上最有效的做法是？",a:["用政策設好護欄：禁止的事自動擋下，其餘放手","每個資源都要人工審核","完全禁止","每一個團隊每天都要向資訊單位書面報告使用的狀況"],why:"護欄例如：不可公開儲存桶、只能用核准的區域、必須加標籤。在界線內團隊可以自己快速前進。"},
 {t:"廠商鎖定",q:"大量使用某家雲端業者的專屬服務，日後難以搬離。應該怎麼看待這件事？",a:["是取捨：換來開發速度和較少維運，但要清楚依賴程度並有意識地決定","絕對要避免任何專屬服務","完全不需要考慮","只要合約的期限簽得夠長就不會有任何鎖定的問題"],why:"完全不鎖定代表放棄很多好處。重點是知道鎖在哪裡、搬離要付出什麼。"}
]]},
{id:'api',lv:[[
 {t:"REST",q:"REST 風格的 API 裡，GET、POST、PUT、DELETE 分別對應什麼動作？",a:["讀取、新增、更新、刪除","登入、登出、註冊、付款","開機、關機、重開、休眠","上傳、下載、列印、傳真這四種不同的檔案操作"],why:"用 HTTP 動詞表達「要做什麼」，網址表達「對誰做」。"},
 {t:"HTTP",q:"API 回傳狀態碼 200 代表什麼？",a:["請求成功","找不到資源","伺服器錯誤","請求的次數太多所以暫時被系統拒絕"],why:"2 開頭是成功，4 開頭是請求端的問題，5 開頭是伺服器端的問題。"},
 {t:"資料格式",q:"API 最常用哪一種格式傳遞資料？",a:["JSON","Word 文件","圖片","經過掃描之後轉成 PDF 的紙本表單"],why:"JSON 輕量、人看得懂，幾乎所有程式語言都能處理。"},
 {t:"驗證",q:"呼叫 API 時附上的「API 金鑰」是用來做什麼的？",a:["讓服務端辨識是誰在呼叫","加快回應速度","壓縮資料","讓回傳的資料自動翻譯成呼叫端使用的語言"],why:"金鑰等同密碼，不能寫在前端網頁或公開的程式碼裡。"},
 {t:"文件",q:"OpenAPI（Swagger）文件的用途是？",a:["用標準格式描述 API 有哪些端點、參數和回應","加密 API","監控 API","統計每一位開發人員每天寫了幾行程式碼"],why:"有了它，別人不必問你就知道怎麼呼叫，也能自動產生測試和用戶端程式。"},
 {t:"測試",q:"開發前想先試打一支 API 看回應，會用哪一類工具？",a:["Postman 或 curl 這類 API 測試工具","試算表","簡報軟體","專門用來編輯影片和加上字幕的剪輯軟體"],why:"先用工具確認請求和回應，再寫進程式，可以省掉很多猜測。"},
 {t:"設計",q:"API 要回傳十萬筆資料。比較好的設計是？",a:["分頁，一次回傳一部分","一次全部回傳","只回傳第一筆","把十萬筆資料全部寫進回應的標頭裡面"],why:"一次吐十萬筆會拖垮兩邊的記憶體和網路。分頁讓呼叫端依需要取得。"},
 {t:"傳輸安全",q:"API 為什麼一定要走 HTTPS？",a:["避免傳輸中的資料和金鑰被竊聽或竄改","因為比較快","因為 HTTP 已經不能用了","因為使用 HTTPS 之後就不需要再做任何的身分驗證"],why:"金鑰和個資用明文傳輸，同一個網路上的人都能攔到。"}
],[
 {t:"HTTP",q:"API 回傳 401 和 403，差別是什麼？",a:["401 是沒有通過身分驗證，403 是身分確認了但沒有權限","兩者相同","401 是伺服器故障","401 代表請求的內容太長，403 則是代表請求的內容太短"],why:"401 要重新登入或換憑證；403 再登入也沒用，要去申請權限。"},
 {t:"設計",q:"用 PUT 更新同一筆資料，送一次和送三次結果應該一樣。這個特性叫什麼？",a:["冪等","加密","壓縮","負載平衡，也就是把請求平均分配給後端的多台主機"],why:"網路重送很常見。冪等的操作重送也安全；POST 新增通常不是，要另外處理。"},
 {t:"版本",q:"API 要做不相容的修改時，應該怎麼處理？",a:["推出新版本，舊版本保留一段時間並公告停用日期","直接改掉","不通知任何人","把舊版本的說明文件刪除，讓使用者自己去發現已經改版"],why:"呼叫你的系統不會跟你同一天上版。新舊並存才有轉換的空間。"},
 {t:"整合模式",q:"Webhook 和「定時去查詢」相比，差別在哪裡？",a:["事件發生時由對方主動通知你，不必一直去問","Webhook 比較慢","兩者相同","Webhook 只能在每天的固定時間通知一次"],why:"輪詢大部分時候是白問。Webhook 即時又省資源，但你要有對外的接收端並驗證來源。"},
 {t:"可靠性",q:"呼叫外部 API 失敗要重試。比較好的做法是？",a:["每次重試的間隔逐漸拉長，並設上限","立刻連續重試一千次","永遠不重試","固定每一秒鐘重試一次，一直到對方恢復為止"],why:"這叫指數退避。對方已經過載時，密集重試只會讓它更起不來。"},
 {t:"設計",q:"API 的錯誤回應應該怎麼設計？",a:["格式一致，包含錯誤代碼和看得懂的說明","每支 API 各自不同","一律回傳 200","直接把伺服器內部的完整錯誤堆疊原封不動地回傳"],why:"呼叫端要能用程式判斷錯在哪。格式不一，每支都要另外寫處理。"},
 {t:"安全",q:"API 收到的輸入資料，服務端應該怎麼對待？",a:["一律驗證格式和範圍，不信任呼叫端","相信前端已經檢查過","只檢查長度","只有來自外部公司的請求才需要檢查，內部的不必"],why:"任何人都能繞過你的前端直接打 API。驗證一定要在服務端做。"},
 {t:"HTTP",q:"API 回傳 429 代表什麼？呼叫端應該怎麼做？",a:["請求太頻繁，應該放慢並稍後再試","資源不存在，應該放棄","伺服器當機，應該通報","身分驗證失敗，應該立刻更換一組新的密碼"],why:"回應裡通常會告訴你多久之後可以再試。忽略它繼續打，可能被封鎖。"}
],[
 {t:"授權",q:"兩個後端系統之間互相呼叫 API，沒有使用者參與。OAuth 適合用哪一種方式？",a:["用戶端憑證（Client Credentials）","請使用者輸入密碼","用管理員的個人帳號","請值班的人員在每一次呼叫的時候手動核准"],why:"系統用自己的身分取得存取權杖。權杖有效期短、權限可限定範圍。"},
 {t:"訊息佇列",q:"訊息佇列保證「至少送達一次」。接收端因此必須處理什麼情況？",a:["同一則訊息可能收到不只一次","訊息永遠不會到","訊息會自動加密","訊息的內容會在傳送的過程中被隨機打亂順序"],why:"接收端要能辨識重複（例如用訊息編號），或把處理設計成重做也無妨。"},
 {t:"整合模式",q:"什麼情況適合用「非同步」的方式整合兩個系統？",a:["處理需要較久，或不希望對方故障時拖住自己","需要立刻得到結果才能繼續","兩個系統在同一台主機","兩個系統的開發人員彼此不認識，也都不想互相溝通"],why:"下單後寄通知信不必等信寄完才回應使用者。非同步讓兩邊各自獨立。"},
 {t:"API 閘道",q:"API 閘道通常集中處理哪些事？",a:["驗證、限流、路由和紀錄","撰寫商業邏輯","儲存資料","設計使用者介面的版面配置和顏色"],why:"把共同的事放在入口，後面每個服務就不必各做一套。"},
 {t:"測試",q:"「契約測試」是在驗證什麼？",a:["提供方和使用方對 API 格式的約定沒有被破壞","伺服器的硬體效能","使用者介面","開發人員有沒有在規定的時間之內完成工作"],why:"提供方改了欄位，使用方的系統就壞了。契約測試讓這種破壞在上線前被發現。"},
 {t:"資料整合",q:"兩個系統都有「客戶資料」但內容對不上。整合前要先決定什麼？",a:["哪一個系統是這份資料的權威來源","哪一個系統的畫面比較好看","哪一個比較新","哪一個系統當初花掉的建置費用比較高"],why:"沒有單一來源，兩邊互相覆蓋，資料只會越來越亂。"},
 {t:"整合模式",q:"每晚批次同步和即時 API 同步，怎麼選？",a:["看業務能接受多久的資料延遲，以及資料量和複雜度","一律用即時","一律用批次","看哪一種方式的名稱聽起來比較現代化"],why:"即時不一定比較好。大量資料的對帳，批次往往更簡單可靠。"},
 {t:"可靠性",q:"上游送資料的速度遠超過下游處理的速度。系統應該具備什麼機制？",a:["回壓或緩衝，讓上游慢下來或先排隊","把多的資料丟掉且不通知","讓下游當機","請上游的系統改成只在半夜的時候才送資料"],why:"沒有回壓，佇列無限成長，最後記憶體耗盡整個倒下。"}
],[
 {t:"整合架構",q:"系統之間全部用「點對點」直接串接。系統數量變多後會怎樣？",a:["連線數量快速增加，改一個系統牽動很多個","效能越來越好","完全沒有影響","每一條連線的傳輸速度會自動變成原本的兩倍"],why:"十個系統兩兩相接可能有幾十條介面。中樞或事件匯流排可以把關係理清楚。"},
 {t:"事件驅動",q:"事件驅動架構中，發布事件的系統需要知道誰在訂閱嗎？",a:["不需要，這正是它降低耦合的地方","需要，而且要逐一通知","只需要知道第一個","需要，而且每新增一個訂閱者都必須修改發布端的程式"],why:"新增訂閱者不必動到發布者。代價是整體流程比較難追蹤，需要好的可觀測性。"},
 {t:"生命週期",q:"要停用一支很多單位在用的舊 API。比較負責任的做法是？",a:["提前公告時程、提供替代方案，並監控還有誰在呼叫","選一天直接關掉","悄悄改成回傳錯誤","先把說明文件刪除，看看有沒有人來詢問"],why:"看呼叫紀錄就知道還有誰沒搬。逐一聯繫，比關掉後等人來抱怨好。"},
 {t:"一致性",q:"跨多個系統的流程無法用單一交易包起來。資料一致性通常怎麼處理？",a:["接受最終一致，並設計補償和對帳機制","假設不會失敗","全部鎖住直到完成","規定所有的系統都必須使用同一個資料庫帳號"],why:"分散式環境的失敗是常態。定期對帳能抓到補償沒涵蓋的漏網之魚。"},
 {t:"可觀測性",q:"一個請求經過閘道、三個服務和一個佇列。要能排查問題，設計時必須做到什麼？",a:["用同一個追蹤識別碼貫穿全程，並記錄在每一段","每個服務各記各的","不需要紀錄","請每一個服務的負責人在出問題的時候各自憑印象回憶"],why:"沒有共同的識別碼，各段的紀錄對不起來。"},
 {t:"API 安全",q:"使用者 A 把請求裡的訂單編號改成 B 的，就拿到了 B 的資料。這類 API 弱點的根本原因是？",a:["只驗證了身分，沒有檢查這個物件是否屬於他","沒有使用 HTTPS","密碼太短","訂單的編號沒有使用足夠長度的英文字母和數字來組成"],why:"物件層級的授權缺失是 API 最常見的弱點。每次存取都要在服務端檢查擁有者。"},
 {t:"架構",q:"劃分服務和 API 的邊界時，最好依據什麼？",a:["業務領域和資料的歸屬","資料庫表格的數量","開發人員的座位","每一支 API 的網址長度是不是差不多一樣"],why:"邊界切在業務自然的分界上，改動才不會一直跨服務。"},
 {t:"對外合作",q:"提供 API 給外部合作夥伴使用。除了技術文件，還需要約定什麼？",a:["服務水準、用量上限、變更通知和安全責任","夥伴的辦公室地址","夥伴員工的姓名","夥伴公司的官方網站使用的是哪一種顏色的配色"],why:"對外的 API 是一種承諾。可用率、改版通知期、資料用途都要白紙黑字。"}
]]},
{id:'ssdlc',lv:[[
 {t:"安全觀念",q:"資訊安全應該在軟體開發的哪個階段開始考慮？",a:["從需求和設計就開始","上線之後","被攻擊之後","等到客戶提出抱怨並且要求賠償的時候"],why:"越晚發現的安全問題，修起來越貴。設計錯了，後面補不回來。"},
 {t:"相依套件",q:"程式用到的第三方套件，為什麼需要持續更新？",a:["套件也會被發現漏洞","新版本的名字比較好聽","為了增加檔案大小","因為舊版本的套件在使用滿一年之後就會自動失效"],why:"現代程式大部分的程式碼來自別人的套件，它們的漏洞就是你的漏洞。"},
 {t:"機密管理",q:"連線密碼和金鑰，為什麼不能寫在程式碼裡？",a:["程式碼會被複製、分享和留存，密碼就跟著外流","這樣程式會變慢","語法不允許","因為這樣做的話整份程式碼的行數會變得太多"],why:"程式碼的權限通常比正式環境寬。密碼應該在執行時從安全的地方取得。"},
 {t:"輸入驗證",q:"對使用者輸入的資料，開發上的基本原則是？",a:["全部視為不可信，驗證後才使用","相信使用者不會亂填","只檢查有沒有填","只有在使用者是外部客戶的時候才需要檢查"],why:"大部分的注入類攻擊，都是因為把輸入直接拿去組指令或查詢。"},
 {t:"最小權限",q:"應用程式執行時使用的帳號，權限應該怎麼給？",a:["只給它運作需要的","給系統管理員權限最省事","給資料庫擁有者權限","給予和開發這支程式的工程師本人完全相同的權限"],why:"程式被攻破時，攻擊者拿到的就是這個帳號的權限。"},
 {t:"程式碼審查",q:"從安全的角度，程式碼審查主要是在抓什麼？",a:["作者自己沒注意到的邏輯漏洞和不安全的寫法","排版好不好看","變數名稱的長度","作者在撰寫這一段程式碼的時候總共花了多少時間"],why:"多一個人看，尤其是驗證、授權、輸入處理這些地方，能擋下很多問題。"},
 {t:"錯誤處理",q:"給使用者看的錯誤訊息，安全上要注意什麼？",a:["不要透露系統內部的細節","越詳細越好","用紅色顯示","一定要同時顯示出資料庫伺服器的名稱和版本"],why:"路徑、SQL 語句、版本號都是攻擊者的線索。詳細內容寫進內部的紀錄就好。"},
 {t:"測試資料",q:"開發和測試環境要用資料。比較安全的來源是？",a:["假資料，或去識別化後的資料","直接複製正式環境的個資","請使用者提供自己的資料","從網路上面下載其他公司外洩出來的資料"],why:"測試環境的防護通常比較鬆，真實個資放進去就是多一個外洩點。"}
],[
 {t:"測試工具",q:"SAST（靜態應用程式安全測試）是怎麼找問題的？",a:["不執行程式，直接分析原始碼","對執行中的網站發送攻擊請求","檢查硬體","請測試人員實際操作每一個畫面並記錄結果"],why:"寫完就能掃，回饋快。缺點是誤報多，也看不到執行時才出現的問題。"},
 {t:"測試工具",q:"DAST（動態應用程式安全測試）是怎麼找問題的？",a:["對執行中的應用程式從外部進行測試","閱讀原始碼","檢查文件","分析開發人員在版本控制中留下的提交訊息"],why:"它看到的是攻擊者會看到的樣子，能找到設定和執行環境造成的問題。"},
 {t:"測試工具",q:"SCA（軟體組成分析）是在檢查什麼？",a:["專案使用的第三方套件有沒有已知漏洞和授權問題","程式的執行速度","使用者介面","程式碼裡面的註解是不是都使用了正確的文法和標點"],why:"它列出你用了哪些套件、哪個版本，並比對漏洞資料庫。"},
 {t:"軟體物料清單",q:"SBOM 是什麼？",a:["一份列出軟體所有組成元件和版本的清單","一種加密演算法","一種程式語言","一份記錄了所有開發人員聯絡電話的內部通訊錄"],why:"爆出重大套件漏洞時，有 SBOM 幾分鐘就能回答「我們有沒有用到」。"},
 {t:"機密掃描",q:"在版本控制上啟用「機密掃描」，是為了防止什麼？",a:["金鑰、密碼這類機密被提交進儲存庫","檔案太大","程式有語法錯誤","開發人員在上班時間提交和工作無關的程式"],why:"在提交或推送時就擋下來，比事後清歷史紀錄容易得多。"},
 {t:"供應鏈",q:"攻擊者發布一個名稱和熱門套件只差一個字母的惡意套件。這種手法在防什麼疏失？",a:["安裝時打錯或沒確認套件名稱","密碼太短","沒有備份","開發人員沒有在規定的時間之內完成安裝"],why:"這叫名稱仿冒。安裝前確認名稱、來源和下載量，並鎖定版本。"},
 {t:"需求",q:"「安全需求」應該怎麼和功能需求一起處理？",a:["一開始就列出來並納入驗收","開發完再補","交給資安單位自己想","等到通過所有的功能測試之後再另外成立專案"],why:"例如「密碼錯五次要鎖定」「操作要留紀錄」。沒寫進需求，就不會被開發也不會被測。"},
 {t:"弱點處理",q:"掃描發現一個高風險漏洞。修補時限應該怎麼決定？",a:["依風險等級訂定並追蹤，等級越高期限越短","有空再修","一律一年內","等到下一次系統進行大改版的時候再一起處理"],why:"沒有期限的弱點會一直躺在報告裡。等級對應期限，逾期要升級處理。"}
],[
 {t:"威脅建模",q:"威脅建模常用的 STRIDE，是在提醒設計者思考什麼？",a:["六類威脅：冒用身分、竄改、否認、資訊洩漏、阻斷服務、權限提升","六種程式語言","六個開發階段","六種不同廠牌的資安設備各自的優缺點"],why:"照著逐項問「這裡會不會被冒用、被竄改……」，比憑空想更不會漏。"},
 {t:"管線",q:"在建置管線裡設「安全閘門」，是什麼意思？",a:["掃描結果超過設定的標準時，自動擋下不讓它上線","限制誰能進辦公室","加密管線","規定只有資安單位的人員可以觸發建置和部署的流程"],why:"讓標準被自動執行，而不是靠人記得去看報告。標準要務實，否則大家會想辦法繞過。"},
 {t:"誤報",q:"靜態掃描工具報了五百個問題，大部分是誤報。團隊應該怎麼做？",a:["調整規則並標記確認過的誤報，讓報告回到可處理的數量","關掉掃描","全部忽略","規定每一位開發人員都要把這五百個問題逐一手動修正完畢"],why:"沒人相信的工具等於沒有工具。持續調校，才能讓真正的問題被看到。"},
 {t:"容器",q:"容器映像的安全，最基本要顧哪兩件事？",a:["基底映像的來源和更新，以及掃描映像中的已知漏洞","映像的檔名和顏色","映像的建立時間","映像檔案在儲存庫中排列的先後順序"],why:"很多映像的漏洞來自過舊的基底。用精簡、可信、持續更新的基底映像。"},
 {t:"完整性",q:"對建置產出的成品進行簽章，可以確保什麼？",a:["部署的東西確實是自己的管線建出來的，沒有被替換","成品的體積比較小","執行比較快","成品可以在任何一種作業系統上面直接執行"],why:"部署端驗證簽章，沒簽或簽章不符的一律拒絕。"},
 {t:"相依套件",q:"使用私有的套件鏡像庫並鎖定版本，可以降低什麼風險？",a:["上游套件被植入惡意內容或突然消失","程式執行太快","檔案太小","開發人員彼此之間使用不同品牌的鍵盤和滑鼠"],why:"建置不直接依賴外部當下的狀態。新版本進來前可以先掃描和審核。"},
 {t:"流程",q:"把安全掃描放在「合併請求」階段執行，好處是什麼？",a:["問題在合併前就被發現，由作者當場修正","上線後才知道","減少程式行數","掃描的結果只有主管可以看到所以比較安全"],why:"作者對剛寫的程式最熟，這時候修的成本最低。"},
 {t:"弱點管理",q:"修補安全漏洞應該有「服務水準」的規定。它的作用是什麼？",a:["讓不同等級的漏洞有明確的修補期限和責任","限制可以發現的漏洞數量","取代掃描","規定每一位開發人員每個月最多只能修補幾個漏洞"],why:"有了期限，才量得出修得快不快，也才有依據去要資源。"}
],[
 {t:"組織",q:"在每個開發團隊裡設一位「安全冠軍」，目的是什麼？",a:["讓安全知識進到團隊內部，成為資安單位和開發之間的橋樑","取代資安單位","負責寫所有程式","負責在每一次出事的時候代表整個團隊接受處分"],why:"資安人力永遠不夠看每一行程式。讓每個團隊有人懂、有人顧，才擴展得開。"},
 {t:"供應鏈",q:"攻擊者入侵了建置系統，在編譯時植入後門。原始碼審查為什麼發現不了？",a:["惡意內容不在原始碼裡，而是在建置過程中加入的","因為審查的人不夠認真","因為程式碼太長","因為原始碼使用了審查人員完全看不懂的程式語言"],why:"所以建置環境本身要隔離、最小權限、可稽核，並驗證產出物的來源。"},
 {t:"來源證明",q:"軟體成品的「來源證明」（provenance）記錄的是什麼？",a:["它是由哪份原始碼、哪條管線、在什麼環境建置出來的","它的售價","使用者人數","負責撰寫這一份軟體的工程師的學歷背景"],why:"有了可驗證的來源，才能回答「這個執行檔真的對應那份審過的程式碼嗎」。"},
 {t:"開源治理",q:"組織大量使用開源套件。治理上最需要一份什麼？",a:["使用政策：可用的授權類型、引入的審核、維護和淘汰的責任","禁用清單，全部不准用","不需要任何規範","一份列出所有開源專案作者姓名和國籍的名單"],why:"授權義務、沒人維護的套件、沒人負責更新，都是實際會發生的風險。"},
 {t:"漏洞揭露",q:"對外公布「漏洞通報管道」和處理政策，對組織的好處是？",a:["讓外部發現問題的人有正當的途徑先告訴你","會吸引更多攻擊","沒有好處","可以保證以後再也不會有任何人發現任何的漏洞"],why:"沒有管道，善意的研究者只能公開或放棄。有管道，你才有機會在被利用前修補。"},
 {t:"度量",q:"要衡量安全開發做得好不好，哪一個指標比較有意義？",a:["漏洞從發現到修補的時間，以及上線後才發現的比例","掃描工具的數量","簡報的頁數","開發團隊每一季舉辦了幾次的資安宣導活動"],why:"工具和活動是投入。漏洞有沒有更早被發現、更快被修，才是結果。"},
 {t:"風險決策",q:"一個已知漏洞因為業務時程無法在期限內修補。正確的處理是？",a:["記錄風險和補償措施，由有權責的人核准例外並設期限","假裝沒看到","把掃描結果刪掉","請發現漏洞的同仁簽署保密協議不要再提起"],why:"風險可以被接受，但要被看見、有人負責、有到期日。"},
 {t:"生命週期",q:"系統依賴的某個元件，上游宣布不再維護。應該怎麼處理？",a:["評估風險並規劃替換，替換前加強隔離和監控","繼續用到壞掉","立刻把系統關閉","寫一封信請上游的開發者重新考慮並且繼續維護下去"],why:"不再維護代表未來的漏洞沒人修。這要列入風險登錄和技術債計畫。"}

 {t:"通報",q:"發現電腦疑似被入侵，第一件事應該做什麼？",a:["依程序通報資安或資訊單位","自己先研究幾天","當作沒看到","先把這件事情告訴隔壁座位的同事請他不要聲張"],why:"越早通報，能控制的範圍越大。自己處理很容易破壞證據。"},
 {t:"現場處理",q:"疑似中毒的電腦，使用者自己重灌了。這對調查造成什麼影響？",a:["入侵的途徑和範圍都無從查起","沒有影響","調查會比較快","重灌之後留下來的紀錄反而會比原本更加完整"],why:"重灌後那台是乾淨了，但不知道別台有沒有、是怎麼進來的、資料有沒有外流。"},
 {t:"現場處理",q:"等待處理人員到場之前，應該怎麼對待那台電腦？",a:["維持現狀，不要繼續操作或關機","趕快把可疑檔案刪掉","執行磁碟清理","先把電腦裡面所有的檔案都複製到自己的隨身碟"],why:"繼續操作會覆蓋痕跡。除非另有指示，先拔網路線隔離即可。"},
 {t:"紀錄",q:"處理事件的過程中，為什麼要隨時記下時間和做了什麼？",a:["事後才能還原經過，也是報告和法律程序的依據","為了計算加班費","為了證明自己很忙","因為沒有紀錄的話電腦就會自動重新開機一次"],why:"事後憑記憶補的紀錄不可靠。當下記，哪怕只是手寫的幾行。"},
 {t:"組織",q:"資安事件應變小組裡，除了技術人員，還需要哪些角色？",a:["管理階層、法務、公關或對外窗口","只要技術人員","只要主管","公司附近的便利商店店員以及大樓的保全人員"],why:"重大事件不只是技術問題：要不要通報、對外怎麼說、有沒有法律責任，都要有人決定。"},
 {t:"準備",q:"一份「緊急聯絡清單」平時就要準備好。上面應該有什麼？",a:["應變成員、主管、廠商和主管機關的聯絡方式","員工的生日","午餐菜單","公司每一位同仁家裡的地址，以及家人的姓名"],why:"事件發生時系統可能已經不能用。清單要有離線的版本。"},
 {t:"分級",q:"事件為什麼要分級？",a:["依嚴重程度決定投入的資源、通報對象和時限","為了填表","為了統計","為了讓不同等級的事件可以使用不同顏色的資料夾"],why:"一台電腦中毒和核心系統被加密，處理規格完全不同。分級標準要事先訂好。"},
 {t:"準備",q:"為什麼要定期做資安事件演練？",a:["確認流程走得通、人知道自己該做什麼","消耗預算","讓大家放鬆","因為演練的次數會直接影響到公司的股價"],why:"計畫沒演練過，常見的狀況是電話打不通、權限沒有、沒人敢決定。"}
],[
 {t:"圍堵",q:"事件處理中的「圍堵」目的是什麼？",a:["阻止損害繼續擴大","找出誰該負責","恢復所有服務","把所有受影響的電腦都立刻送回原廠維修"],why:"先止血。常見做法是隔離主機、停用帳號、封鎖惡意位址。"},
 {t:"鑑識",q:"為什麼要在關機之前先擷取記憶體？",a:["記憶體裡有執行中的程序、連線和金鑰，關機就消失","記憶體比較大","這樣開機比較快","因為記憶體裡面存放的是使用者最重要的那些文件檔案"],why:"很多惡意程式只存在記憶體裡，硬碟上找不到。"},
 {t:"鑑識",q:"製作硬碟的鑑識映像時，為什麼要計算雜湊值？",a:["證明映像和原始硬碟完全一致，之後也沒被改過","加快複製速度","壓縮檔案","讓映像檔可以在不同廠牌的電腦上面順利開啟"],why:"分析都在複本上做。雜湊值讓你能證明複本可信。"},
 {t:"分析",q:"調查時建立「時間軸」的用處是？",a:["把不同來源的紀錄依時間排列，看出攻擊的先後經過","計算工時","排班","統計每一位同仁在事件期間各自總共工作了幾個小時"],why:"什麼時候進來、做了什麼、碰了哪些主機，都要靠時間軸拼起來。"},
 {t:"資料來源",q:"調查一台主機被入侵的經過，通常需要哪些紀錄？",a:["系統和登入紀錄、端點防護紀錄、網路設備和代理的紀錄","員工出勤紀錄","採購紀錄","公司最近一年以來所有的會議紀錄以及簽到表"],why:"單一來源看不到全貌。主機上的和網路上的要互相對照。"},
 {t:"圍堵",q:"要隔離一台被入侵的主機。「拔網路」和「關機」相比，通常哪個比較好？",a:["拔網路或用端點防護工具隔離，保留記憶體中的證據","直接關機","兩者相同","先重新開機一次確認問題還在之後再做決定"],why:"關機會失去記憶體資料。隔離可以止血，同時保留調查所需。"},
 {t:"溝通",q:"事件處理期間，對外和對內的訊息應該怎麼管理？",a:["由指定的窗口統一發布，內容經過確認","每個人把知道的都說出去","完全不溝通","由第一個發現事件的同仁全權負責對外發言"],why:"不一致或未經確認的訊息，會造成恐慌和法律風險。"},
 {t:"證據",q:"蒐集到的證據為什麼要標記並記錄交接過程？",a:["確保證據的完整性和來源可以被證明","為了好看","為了方便丟棄","因為沒有標記的證據依規定不可以存放超過三天"],why:"說不清楚誰經手過的證據，在法律程序上可能不被採信。"}
],[
 {t:"鑑識",q:"取得硬碟映像時使用「寫入保護器」，是為了什麼？",a:["確保取證過程不會改動原始硬碟上的任何資料","加快複製速度","修復壞軌","讓硬碟在複製的過程當中不會因為過熱而損壞"],why:"只要掛載硬碟，作業系統就可能寫入東西。改動過的原始證據會被質疑。"},
 {t:"現場蒐證",q:"在還在運作的受害主機上直接執行蒐證工具，要注意什麼風險？",a:["工具本身會改變系統狀態，而且主機上的程式可能已被竄改","沒有風險","工具會太快","蒐證工具可能會把主機上的惡意程式全部刪除乾淨"],why:"用自備、可信的工具，並記錄執行了什麼。這是在保全和時效之間的取捨。"},
 {t:"分析",q:"清除惡意程式後過幾天又出現。最可能漏掉了什麼？",a:["攻擊者留下的持久化機制，例如排程、服務或啟動項目","防毒軟體太舊","硬碟太小","主機的時間設定和標準時間相差了幾秒鐘"],why:"只刪檔案不夠。要找出它是怎麼在重開機後再度執行的，還有攻擊者手上有沒有帳號。"},
 {t:"分析",q:"要判斷攻擊者有沒有從第一台主機移動到其他主機，主要看什麼？",a:["其他主機上來自該主機或該帳號的登入和遠端執行紀錄","該主機的螢幕解析度","其他主機的型號","其他主機上面安裝了哪些版本的文書處理軟體"],why:"網路登入、遠端桌面、遠端服務建立這類紀錄，是追橫向移動的主要線索。"},
 {t:"惡意程式",q:"取得可疑的惡意程式樣本，想知道它的行為。處理時要注意什麼？",a:["在隔離的環境分析，上傳到公開分析平台前先考慮會不會洩漏資訊","直接在自己的電腦上執行","寄給所有同事看","把樣本改成一個比較無害的檔名之後直接開啟"],why:"公開平台的樣本任何人都能下載，攻擊者也會去查自己的樣本有沒有被上傳。"},
 {t:"範圍判定",q:"從第一台受害主機找到了惡意檔案的雜湊值和連線位址。接下來要做什麼？",a:["用這些指標在全環境搜尋，找出其他受害主機","只處理這一台","把指標刪掉","等待攻擊者自己主動來聯絡，並且說明入侵的範圍"],why:"一台被發現，通常不是唯一的一台。範圍沒確定就清除，會漏掉別的立足點。"},
 {t:"根除",q:"什麼時候才適合開始「根除」（移除後門、重設密碼）？",a:["範圍掌握得差不多、可以一次同步處理的時候","發現第一個後門時立刻","永遠不要","等到所有的同仁都已經下班回家之後的深夜時段"],why:"太早動手會讓攻擊者察覺並換手法。準備好再一次清乾淨。"},
 {t:"法遵",q:"事件確認涉及個資外洩。除了技術處理，還有什麼必須同步進行？",a:["依法規評估通報主管機關和通知當事人的義務與時限","只要修好就好","等媒體報導再說","先請所有知道這件事情的同仁都簽署一份保密切結書"],why:"通報有時限，從知悉起算。技術和法遵要同時啟動，不能等查完才想。"}

 {t:"準備",q:"針對常見事件類型事先寫好「應變腳本」（Playbook），價值在哪裡？",a:["事件發生時不必從頭想，照既定步驟和分工執行","讓文件變多","取代人員訓練","讓稽核人員在檢查的時候可以比較容易找到文件"],why:"壓力下人的判斷會變差。事先想好的步驟，讓第一小時不會浪費在討論上。"},
 {t:"外部資源",q:"為什麼建議平時就和鑑識或應變廠商簽好合約？",a:["事件當下才找，簽約和議價會耽誤最關鍵的時間","因為比較便宜","因為法律規定","因為廠商在沒有事件的時候比較有空可以陪我們聊天"],why:"預先簽約也讓對方先了解你的環境，進場時不必從零開始。"},
 {t:"勒索事件",q:"遭勒索軟體攻擊，「要不要付贖金」應該由誰決定？",a:["最高管理階層，在法務和專業人員的建議下","值班的工程師","第一個發現的人","負責和攻擊者聯絡的那一位同仁自己決定就好"],why:"付了不保證能解密，也可能有法律問題。這是經營決策，不是技術決策。"},
 {t:"事後檢討",q:"重大事件結束後的檢討，最應該產出什麼？",a:["具體的改善項目、負責人和期限","一份歸檔的報告","處分名單","一份詳細記錄每個人在事件期間發言內容的逐字稿"],why:"沒有追蹤的改善項目，下次會在同一個地方再出事。"},
 {t:"證據保存",q:"事件相關的證據和紀錄，要保存多久？",a:["依法規、合約和可能的訴訟時效決定，不能結案就刪","結案當天刪除","永久且不設權限","只要保存到下一次事件發生的那個時候就可以全部刪除"],why:"事件過了幾個月才被提告或被主管機關調查，並不少見。"},
 {t:"雲端鑑識",q:"在公有雲上做鑑識，和自有機房相比，最大的差異是什麼？",a:["拿不到實體設備，要靠雲端提供的紀錄、快照和 API，而且紀錄要事先開","完全一樣","雲端不需要鑑識","雲端業者會主動幫客戶完成所有的調查並提供報告"],why:"很多紀錄預設沒開或只留很短。平時沒設定好，出事時就沒有資料。"},
 {t:"危機管理",q:"技術上的事件處理，什麼時候應該升級成組織層級的危機管理？",a:["影響到核心營運、大量個資、法遵或商譽時","任何事件都要","永遠不需要","只有在事件發生的時間剛好是上班時間的時候"],why:"這時的決策已經超出資訊單位的權責，需要經營層、法務和公關一起。"},
 {t:"成效",q:"要衡量事件應變能力有沒有進步，哪一組指標最有用？",a:["從發生到偵測、從偵測到圍堵、到完全復原各花多久","事件的總件數","報告的頁數","應變小組的成員總共持有幾張專業的證照"],why:"件數多可能只是偵測變好了。時間縮短，才代表反應能力真的進步。"}

 {t:"保密",q:"和廠商開始合作、提供內部資料之前，至少應該先簽什麼？",a:["保密協議","午餐訂單","場地租約","雙方員工一起出遊的活動同意書"],why:"保密義務要有書面依據，範圍、期限和違反的責任都要寫明。"},

 {t:"權限回收",q:"廠商的維護合約到期了。資訊單位要做什麼？",a:["停用帳號、收回權限和門禁，並確認資料已歸還或刪除","什麼都不用做","等他們自己通知","把這家廠商使用過的帳號保留下來，給下一家廠商繼續使用"],why:"合約結束後還有效的帳號，沒人在用也沒人在看，風險最高。"},
 {t:"窗口",q:"和廠商之間為什麼要指定固定的聯絡窗口？",a:["責任和資訊集中，不會各說各話","讓其他人不用工作","因為廠商要求","這樣廠商才知道逢年過節的時候禮品應該要寄給誰"],why:"每個人都能直接叫廠商改東西，最後沒人知道系統被改成什麼樣。"},

 {t:"合約",q:"服務水準協議如果只有目標、沒有罰則，會怎麼樣？",a:["沒達成也沒有後果，約束力很弱","廠商會更努力","沒有差別","廠商會因此主動把服務的價格調降百分之五十"],why:"罰則的目的是讓承諾有重量，也讓雙方先把「怎樣算沒做到」講清楚。"},
 {t:"資料處理",q:"委託廠商處理資料時，合約應該限定什麼？",a:["可處理的資料範圍、用途、地點和保存期限","廠商員工的服裝","資料的字體","廠商用來存放資料的伺服器外殼是什麼樣的顏色"],why:"沒有限定，廠商可能把資料用在別的地方、放在你不知道的地方、留到你不知道的時候。"},

 {t:"智慧財產",q:"委外開發的程式，著作財產權歸誰，應該在什麼時候確定？",a:["簽約時就明訂","開發完成後再談","發生爭議時再說","等到系統正式上線滿一年之後再由雙方協商"],why:"沒約定時，權利可能屬於實際開發的廠商。等到要換廠商才發現程式不是自己的，就太晚了。"},

 {t:"持續監督",q:"簽約時評估過廠商了，之後還需要做什麼？",a:["定期重新檢視：證書是否有效、是否發生過事件、服務是否達標","不用，評估一次就夠","只有續約時才看","只需要每一年寄一張賀卡維持良好的合作關係"],why:"廠商的狀況會變：人員流動、被併購、發生事件。評估是持續的事。"},

 {t:"合約",q:"廠商的合約範本把賠償責任上限訂為「一個月的服務費」。應該怎麼看待？",a:["評估可能的實際損失，協商合理的上限，特別是資料外洩的情形","直接接受","要求無上限否則不簽","只要合約的總頁數夠多就代表條款已經很完整"],why:"一個月服務費和一次個資外洩的損失可能差上千倍。這是簽約前最該談的條款之一。"},

 {t:"雲端服務",q:"大型雲端業者的標準合約幾乎不能談。這時候風險要怎麼管理？",a:["檢視對方公開的驗證和報告，並用自己能控制的措施補足","不使用任何雲端服務","直接接受所有風險","要求對方把機房的大門鑰匙複製一份，交給我們公司保管"],why:"合約談不動時，靠的是自己的設定：加密、金鑰自管、備份到別處、存取控管。"},
 {t:"情境規劃",q:"關鍵廠商突然倒閉或被併購後停止服務。事前可以做什麼準備？",a:["取得原始碼或約定代管、保有資料副本、了解替代方案","相信不會發生","多付一點錢","和廠商的負責人保持良好的私人交情"],why:"原始碼託管、定期匯出資料、文件齊全，都是在買「他不在了我還能活」的保險。"},
 {t:"關係管理",q:"只在出事時才找廠商。長期會有什麼問題？",a:["缺乏定期的檢視和溝通，小問題累積成大問題，也沒有改善的機制","沒有問題，省時間","廠商會自動變好","廠商會因此更加主動地提供各種免費的額外服務"],why:"定期的服務檢討會議，是發現趨勢、調整期待、要求改善的場合。"},
 {t:"法遵",q:"系統委外之後，法規上的責任是否也跟著移轉給廠商？",a:["沒有，委託方仍負有選任和監督的責任","全部移轉","各負一半","要看廠商的資本額是不是比委託的機關還要高"],why:"資通安全管理法和個資法都要求委託方監督受託者。出事時主管機關找的是你。"}

 {t:"部署",q:"新進一批相同機型的電腦，最有效率的安裝方式是？",a:["用做好的標準映像檔一次部署","每台從光碟慢慢安裝","請使用者自己處理","先安裝好一台，其他的等使用者來抱怨的時候再處理"],why:"映像檔讓每台電腦的系統、軟體和設定一致，之後也好維護。"},
 {t:"更新",q:"全公司電腦的系統更新，為什麼要由資訊單位集中派送？",a:["能掌握誰裝了、誰沒裝，也能控制時間","讓使用者不能關機","節省網路線","因為使用者自己安裝的更新依規定是無效的不能算數"],why:"各自更新就會有人永遠不更新。集中管理才看得到整體的修補狀況。"},

 {t:"遠端支援",q:"用遠端工具連到使用者的電腦協助處理，基本的原則是？",a:["讓使用者知道並同意，處理完就中斷連線","趁他不在時偷偷連","連上後不要斷","連線之後順便看一下他的電腦裡面有哪些檔案"],why:"遠端看得到對方的畫面和檔案。未告知的連線是信任問題，也可能有法律問題。"},
 {t:"軟體管控",q:"公司為什麼要管控員工電腦上可以安裝哪些軟體？",a:["避免惡意程式、授權糾紛和無法支援的軟體","限制員工自由","減少硬碟用量","因為安裝的軟體越多電腦的保固期限就會越短"],why:"來路不明的軟體是中毒的大宗來源，沒授權的軟體則是法律風險。"},
 {t:"汰換",q:"電腦汰換或轉給別人使用之前，資料上要怎麼處理？",a:["確實抹除原使用者的資料","直接交出去","只刪除桌面的檔案","請下一位使用者自己小心不要去看到之前的檔案"],why:"一般刪除救得回來。要用抹除工具或重新部署映像。"}

 {t:"行動裝置",q:"行動裝置管理（MDM）主要能做到什麼？",a:["集中套用設定、派送應用程式，並在遺失時遠端鎖定或抹除","讓手機電池更耐用","加快上網速度","讓公司可以隨時查看員工私人手機裡面的所有照片"],why:"手機和平板一樣存著公司資料和信箱，也需要被管理。"},

 {t:"設定基準",q:"「安全設定基準」是什麼？",a:["一組所有電腦都應套用的標準安全設定","電腦的最低硬體規格","軟體的價格清單","每一位同仁每天至少必須使用電腦的最短時數"],why:"例如螢幕逾時鎖定、關閉不必要的服務。用群組原則或管理工具統一套用和檢查。"},
 {t:"自帶裝置",q:"允許員工用自己的手機或筆電處理公務，最主要的風險是？",a:["公司管不到裝置的安全狀態，資料卻在上面","員工會太方便","電費增加","員工的私人裝置會因此變成公司的財產需要列帳"],why:"常見做法是限制可存取的範圍、要求基本條件，或把公司資料隔離在受管理的容器裡。"},
 {t:"遺失處置",q:"同仁回報公務筆電遺失。資訊單位第一時間要做什麼？",a:["遠端鎖定或抹除，停用相關憑證，並依程序通報","請他再找找看","補發一台新的就好","等到月底盤點的那個時候再一起處理並登記為遺失"],why:"越早處理，資料被讀取的機會越小。有沒有加密決定了這是設備遺失還是資料外洩。"},
 {t:"使用者資料",q:"把使用者的文件資料夾重新導向到伺服器或雲端，好處是？",a:["電腦壞了或換機，資料不會跟著不見","電腦會變輕","螢幕會變亮","使用者就可以不需要再輸入密碼登入自己的電腦"],why:"資料在集中的地方才備份得到。換機也只要登入就好。"},

 {t:"部署",q:"新電腦從原廠直接寄到同仁手上，開機登入後自動完成設定和軟體安裝。這種做法的前提是什麼？",a:["裝置已向管理平台註冊，設定和軟體都由雲端派送","每台都先由資訊人員開箱設定","使用者自己安裝","原廠的工程師必須先到公司來把每一台電腦都設定完成"],why:"零接觸部署省掉了映像檔和人工，但所有設定都要能用政策表達。"},
 {t:"修補",q:"某個更新派送後，一部分電腦出現藍色當機畫面。派送機制上應該具備什麼？",a:["分批派送，並能暫停和回復","一次全部派送","不再更新","先派送給公司裡面職位最高的那幾位主管試用"],why:"先給小範圍的測試群組，觀察沒問題再擴大。出事時影響有限也停得下來。"},
 {t:"權限",q:"使用者偶爾需要安裝軟體，又不想給他永久的管理員權限。可以怎麼做？",a:["用自助軟體中心或限時提升權限的機制","直接給管理員權限","一律拒絕","把管理員的密碼告訴他並且請他用完之後就忘記"],why:"核准過的軟體放進自助入口，使用者自己裝；真的需要權限時限時開通並留紀錄。"},
 {t:"加密",q:"全公司筆電都啟用了磁碟加密。「復原金鑰」的管理為什麼很重要？",a:["使用者忘記密碼或硬體更換時，沒有金鑰資料就救不回來","金鑰可以加快開機","金鑰沒有用處","因為沒有復原金鑰的電腦依規定不可以連上網路"],why:"金鑰要集中託管、限制存取、取用要留紀錄。"},
 {t:"合規",q:"端點管理平台上的「合規政策」通常用來做什麼？",a:["檢查裝置是否符合條件，不符合的限制存取公司資源","統計上班時間","控制螢幕亮度","決定每一位同仁可以使用哪一種顏色的桌面背景"],why:"例如沒加密、沒更新、防護沒開的裝置，不能收公司信。"},
 {t:"應用程式",q:"很多電腦上裝著早已不維護的舊版軟體。管理上應該怎麼處理？",a:["盤點後移除或升級，確實需要的要隔離並列管","不用管","全部重灌","把舊版軟體的捷徑從桌面上面刪除就算是處理完成"],why:"舊版瀏覽器外掛、執行環境是常見的入侵管道。先要知道哪些電腦裝了什麼。"},

 {t:"紀錄",q:"端點上的操作和事件紀錄，為什麼要送到集中的地方？",a:["電腦被入侵或重灌後，本機的紀錄就沒了","讓電腦變輕","方便使用者查看","因為電腦本機的硬碟空間依規定不可以存放紀錄"],why:"調查時最需要的那台，往往就是紀錄已經不在的那台。"}

 {t:"策略",q:"規劃端點管理策略時，「標準化」和「使用者彈性」怎麼取捨？",a:["依職務分成少數幾種標準配置，例外要有流程","每個人都客製","全部完全一樣","可以讓每一個部門各自採購並管理自己喜歡的設備"],why:"完全一致不符實際，完全自由無法管理。少數幾種角色型的配置通常是平衡點。"},
 {t:"現代化",q:"從「網域加入加群組原則」轉到「雲端管理」的端點模式，最大的挑戰通常是什麼？",a:["既有的政策、軟體派送和舊應用的相依要逐一盤點和轉換","新工具太貴","使用者不會開機","雲端管理的平台不支援任何一種作業系統"],why:"多年累積的設定沒人說得清用途。常見做法是新機用新模式，舊機逐步汰換。"},
 {t:"零信任",q:"在零信任架構中，端點的「裝置狀態」扮演什麼角色？",a:["作為每次存取決策的條件之一","只在採購時檢查一次","沒有作用","用來決定同仁的座位應該安排在辦公室的哪一個位置"],why:"身分對了還不夠，裝置是否受管理、是否健康，也決定能存取到什麼程度。"},
 {t:"生命週期",q:"規劃電腦汰換時，除了年限，還應該考慮什麼？",a:["作業系統的支援期限、硬體需求和故障率的趨勢","顏色是否流行","廠商的廣告","同仁各自對於新電腦外觀的個人喜好"],why:"系統終止支援的日期是硬期限。故障率上升代表維護成本開始超過汰換成本。"},
 {t:"體驗",q:"端點的安全控制加得很多，使用者開機要十分鐘、常被擋。這會造成什麼後果？",a:["使用者想辦法繞過，反而更不安全","更安全","沒有影響","使用者會因此更加喜歡並且主動配合所有的管控"],why:"安全措施要考慮可用性。量測開機和登入時間，把它當成指標管理。"},
 {t:"虛擬桌面",q:"什麼情況適合用虛擬桌面，而不是發實體電腦？",a:["資料不能落地、人員流動高或需要從各處存取同一環境","所有情況都適合","想省網路頻寬","使用者主要的工作是需要大量運算的影片剪輯"],why:"資料留在機房是它的優點；對網路品質的依賴和較高的建置成本是代價。"},
 {t:"韌體",q:"端點安全為什麼也要顧到韌體和開機流程？",a:["作業系統以下的層級被植入，一般防護看不到也清不掉","韌體比較大","為了省電","因為韌體決定了螢幕可以顯示的顏色數量"],why:"安全開機、韌體更新、硬體信任根，是確保系統從開機起就可信的基礎。"},
 {t:"度量",q:"要向管理階層呈現端點管理的成效，哪一組指標最有意義？",a:["修補合規率、納管率和從漏洞公布到完成修補的時間","電腦的總數","處理的工單數","資訊單位的同仁每個月總共加班了多少小時"],why:"沒納管的不會被修補。這幾個數字直接對應被攻擊的機會。"}

 {t:"檔案分享",q:"要寄一個 200MB 的檔案給外部廠商。比較好的做法是？",a:["放到公司核准的分享空間，寄連結並設定權限和期限","切成很多封信寄","用私人雲端硬碟","把檔案存進隨身碟之後用一般的平信寄給對方"],why:"大附件常被對方的信箱拒收。連結可以控制誰能看、什麼時候失效。"},

 {t:"郵件路由",q:"別人寄到公司網域的信，是靠 DNS 的哪一種紀錄找到收信伺服器？",a:["MX 紀錄","A 紀錄","TXT 紀錄","CNAME 紀錄"],why:"換郵件服務時改的就是 MX。改錯或 TTL 沒考慮好，信會寄到舊地方。"},
 {t:"排錯",q:"使用者說「對方說有寄，但我沒收到」。資訊人員應該先查什麼？",a:["郵件追蹤紀錄，看這封信有沒有到、被怎麼處理","重開使用者的電腦","重設他的密碼","可以請對方把同樣的內容連續再寄十次確保會收到"],why:"追蹤紀錄會顯示信是被收下、隔離、拒絕，還是根本沒到。"},
 {t:"外部分享",q:"雲端文件的分享連結設成「知道連結的任何人都能檢視」。風險是什麼？",a:["連結被轉傳或外流，任何人都看得到","沒有風險","檔案會變大","檔案的內容會被自動翻譯成其他國家的語言"],why:"敏感資料應該限定特定對象並設到期日。管理端也可以直接關閉這種公開連結。"},
 {t:"離職處理",q:"員工離職，他的信箱裡還有業務往來的信件。比較好的處理是？",a:["停用登入，依規定保留並把信箱交接給主管或轉為共用","立刻刪除","讓他繼續使用","直接把信箱的密碼交給接手的同事繼續用原本的身分寄信"],why:"直接刪除會遺失業務紀錄；讓人用離職者的身分寄信則會造成混淆和責任問題。"},
 {t:"保留政策",q:"郵件的「保留政策」和「訴訟保留」是用來做什麼的？",a:["依規定保存或刪除郵件，必要時防止相關資料被刪","增加信箱容量","加快寄信速度","讓使用者可以把已經寄出去的信件全部收回來重寫"],why:"有些資料法規要求留幾年；發生爭議時，相關信件不能被當事人刪掉。"},
 {t:"備份",q:"郵件和文件都放在雲端協作平台。還需要另外備份嗎？",a:["需要，誤刪或被惡意刪除超過保留期限後，平台也救不回","不需要，雲端永遠不會遺失資料","不需要，有資源回收筒就夠","需要，但只要請每位使用者自己把重要的信印出來就好"],why:"業者保證的是服務可用，資料的保護仍是客戶的責任。"}

 {t:"寄件者驗證",q:"DMARC 政策從「只監看」逐步調到「拒絕」，為什麼不能一步到位？",a:["要先確認所有合法的寄信來源都已通過驗證，否則自己的信會被擋","因為設定很難","因為要付費","因為 DMARC 的政策依規定每一年只能修改一次"],why:"行銷平台、系統通知、委外廠商代寄的信，常常是沒設定好的那些。"},
 {t:"帳號安全",q:"使用者的信箱被盜後，攻擊者最常做的一件事是什麼？",a:["建立隱藏的轉寄或收件匣規則，持續偷看信件","刪除所有信件","更改簽名檔","直接把信箱裡面所有的信件全部標示成為已讀取"],why:"所以處理被盜帳號時，除了改密碼，還要檢查規則、轉寄設定和已授權的應用程式。"},
 {t:"舊式驗證",q:"為什麼要停用郵件的舊式驗證協定（只用帳號密碼的那種）？",a:["它不支援多因素驗證，是密碼噴灑的主要目標","它太快","它太新","因為舊式的驗證協定會讓信件的字體變得比較小"],why:"開著它，等於多因素驗證有一個後門。"},
 {t:"資料治理",q:"協作平台上的團隊和共用空間越建越多，很多已經沒人用。應該怎麼治理？",a:["訂定建立規則、負責人和到期檢視機制","禁止建立","不管它","規定每一位同仁最多只能加入一個團隊或群組"],why:"沒人管的空間裡，常留著權限過寬的舊資料。"},
 {t:"外部協作",q:"要讓外部廠商加入協作平台一起工作。應該怎麼控管？",a:["以來賓身分邀請、限定可存取的範圍並定期檢視","給他一個內部員工帳號","把檔案全部公開","請廠商直接借用我們公司某一位同仁的個人帳號"],why:"合作結束後，來賓帳號和分享連結要收回。"},
 {t:"可用性",q:"郵件服務中斷時，組織應該事先準備什麼？",a:["替代的通訊管道和對外說明的方式","什麼都不用準備","更多的信箱容量","請每一位同仁在平常的時候就先把所有的信件列印出來"],why:"應變計畫常常寫「用郵件通知」，但郵件本身就是掛掉的那個。"},
 {t:"保護",q:"針對郵件中的惡意連結和附件，進階防護通常怎麼做？",a:["在隔離環境開啟附件，並在點擊時重新檢查連結","只看寄件者名稱","擋掉所有附件","直接把所有外部寄來的信件都延後二十四小時才送達"],why:"連結可能在寄達時是乾淨的、之後才被換成惡意內容，所以要在點擊當下再檢查。"},
 {t:"遷移",q:"把郵件系統搬到另一個平台。規劃上最容易被低估的是什麼？",a:["共用信箱、權限、轉寄規則和各系統寄信設定的盤點","新平台的標誌","信箱的顏色","新平台的登入畫面使用的是哪一種語言"],why:"信箱本身好搬。那些連著郵件的系統和多年累積的委派關係才是麻煩。"}

 {t:"策略",q:"組織裡同時有三套功能重疊的協作工具。應該怎麼處理？",a:["依用途訂出各自的定位或整併，避免資料散落","再多買一套","全部停用","讓每一位同仁自由選擇並且也不需要告訴任何人"],why:"資料分散在多個地方，找不到、管不到，離職交接也交不完整。"},
 {t:"合規",q:"法規要求特定通訊紀錄要保存數年且不可竄改。協作平台上要怎麼做到？",a:["設定保留政策和不可刪除的保存機制","請同仁不要刪","每天截圖","請每一位同仁每個月把自己的對話紀錄寄給主管一份"],why:"靠使用者自律做不到。保留要由平台強制，並包含聊天訊息。"},
 {t:"資料分類",q:"在協作平台上對文件套用「敏感度標籤」，可以達到什麼效果？",a:["依分類自動套用加密、浮水印和分享限制","讓文件變漂亮","加快搜尋","讓文件在列印出來的時候自動使用比較厚的紙張"],why:"保護跟著文件走，檔案被轉寄出去仍然有效。"},

 {t:"韌性",q:"所有通訊和文件都在同一家雲端平台上。韌性上要考慮什麼？",a:["該平台中斷或帳號被鎖時的替代方案和資料備份","沒有需要考慮的","多買授權","直接把平台的服務條款列印出來貼在辦公室的牆上"],why:"至少要有平台外的緊急聯絡方式和關鍵資料的獨立副本。"},
 {t:"AI 助理",q:"導入能讀取使用者所有文件和信件的 AI 助理之前，最該先檢查什麼？",a:["現有的權限是否過寬，因為它會把使用者「看得到」的都找出來","螢幕解析度","鍵盤配置","同仁平常習慣使用的輸入法是不是有被支援"],why:"原本靠「沒人知道在哪」保護的資料，會被 AI 一句話問出來。"},

 {t:"頻段",q:"2.4GHz 和 5GHz 兩個頻段，主要差別是？",a:["2.4GHz 傳得遠但干擾多、速度慢；5GHz 快但穿透力較差","兩者完全相同","5GHz 傳得比較遠","2.4GHz 只能給手機使用，5GHz 只能給筆電使用"],why:"辦公室通常以 5GHz 為主，2.4GHz 留給舊設備和物聯網裝置。"},
 {t:"加密",q:"無線網路應該使用哪一種安全性設定？",a:["WPA2 或 WPA3","WEP","不設密碼","只要把無線網路的名稱取得很難猜就夠安全了"],why:"WEP 幾分鐘就能破解。沒有加密的網路，旁邊的人可以看到你的流量。"},
 {t:"訪客網路",q:"提供給訪客的無線網路，應該怎麼設計？",a:["和內部網路隔離，只能上網際網路","和員工用同一個","直接給內部網路的密碼","讓訪客連上之後可以直接使用公司的印表機和檔案伺服器"],why:"訪客的裝置狀況未知。隔離之後，就算有問題也碰不到內部系統。"},

 {t:"部署",q:"無線基地台放在哪裡比較好？",a:["使用者所在區域的上方開闊處","鐵櫃裡面","地板角落","機房的最深處，這樣才不容易被別人偷走"],why:"金屬和厚牆會嚴重衰減訊號。裝在天花板朝下是常見做法。"},
 {t:"安全迷思",q:"把 SSID 設成「隱藏」，能提高安全性嗎？",a:["幾乎不能，用工具很容易找到","能，別人就完全找不到","能，等同於加密","能，而且設定之後就可以不需要再設定任何密碼"],why:"隱藏只是不廣播名稱，裝置連線時還是會把名稱送出去。安全要靠加密和驗證。"},
 {t:"公用網路",q:"在咖啡廳的公用 Wi-Fi 處理公務，要注意什麼？",a:["連線可能被監聽或是假冒的熱點，應使用 VPN","沒有需要注意的","只要訊號強就安全","只要咖啡廳的招牌看起來是知名的連鎖品牌就沒有問題"],why:"公用網路上你不知道旁邊是誰。VPN 把流量加密後才送出去。"}

 {t:"規劃",q:"建置無線網路前做「現場勘測」，目的是什麼？",a:["實際量測訊號涵蓋和干擾，決定基地台的數量和位置","確認牆壁顏色","估算電費","統計辦公室裡面的同仁各自使用哪一種品牌的手機"],why:"憑平面圖估的常常不準。隔間材質、鄰近的無線網路都要現場量。"},
 {t:"頻道",q:"在基地台很密集的環境，5GHz 的頻道寬度應該怎麼設？",a:["用較窄的頻寬，換取更多不重疊的頻道","一律用最寬的","隨機","每一台基地台都固定使用完全相同的一個頻道"],why:"頻寬越寬單機越快，但可用的頻道越少、互相干擾越嚴重。密集環境要取捨。"},
 {t:"容量",q:"大會議室有兩百人同時上網。規劃時最該算的是什麼？",a:["每台基地台能負擔的連線數和總頻寬需求","訊號能傳多遠","會議室的坪數","會議室裡面的椅子是不是都面向同一個方向"],why:"這是容量問題，不是涵蓋問題。需要多台基地台分擔，並控制每台的功率。"},
 {t:"漫遊",q:"使用者邊走邊用網路電話，換基地台時常常斷線。可以改善的技術是？",a:["快速漫遊相關標準（802.11r／k／v）","把所有基地台關掉一半","改用 2.4GHz","可以請使用者在講電話的時候盡量站在原地不要走動"],why:"這些標準讓裝置更快找到下一台並完成驗證，縮短切換的中斷時間。"},
 {t:"管理",q:"幾十台基地台用控制器或雲端平台集中管理，好處是？",a:["設定一致、能統一調整頻道功率，也看得到全部的連線狀況","每台可以不同密碼","不需要網路線","每一台基地台就都可以自己獨立決定要不要運作"],why:"一台一台設定很快就會不一致，出問題也不知道該看哪一台。"},
 {t:"驗證",q:"企業無線網路用 802.1X 搭配憑證驗證，相對於帳號密碼的優點是？",a:["不怕密碼被釣走，也能確認連線的是公司管理的裝置","比較便宜","不需要伺服器","使用者可以把憑證自由地借給外部的廠商使用"],why:"憑證裝在受管理的裝置上，私人裝置就算知道帳密也連不上。"},
 {t:"攻擊",q:"有人架了一台和公司同名的假基地台。這種攻擊想達到什麼目的？",a:["誘使裝置連上，藉此攔截流量或騙取帳號密碼","讓網路變快","幫公司擴大涵蓋","免費提供附近的居民使用高速的無線網路"],why:"這叫邪惡雙子。用憑證驗證伺服器身分、偵測不明基地台，是主要的防護。"},

 {t:"診斷",q:"要判斷無線網路慢的原因，除了訊號強度，最該看哪個指標？",a:["頻道使用率和重傳率","基地台的顏色","SSID 的長度","基地台距離最近的窗戶有幾公尺遠"],why:"頻道被佔滿或一直重傳，訊號再強也快不起來。"},
 {t:"設計",q:"辦公室每台基地台都把功率開到最大。會造成什麼問題？",a:["互相干擾，裝置也會黏在遠處的基地台不換","涵蓋最好","最省電","所有的裝置都會自動連到訊號最弱的那一台基地台"],why:"基地台聽得到手機，手機的小功率卻傳不回去。功率要和裝置對稱。"},
 {t:"相容性",q:"為了支援很舊的裝置而保留低速率，對整體有什麼影響？",a:["管理訊框用低速傳送，佔用大量空中時間","沒有影響","速度變快","新的裝置會因此自動降級成為和舊裝置相同的規格"],why:"關掉最低的幾個速率，常常能明顯改善擁擠環境的效能。"},
 {t:"頻段",q:"6GHz 頻段（Wi-Fi 6E 之後）的主要好處和限制是？",a:["頻道多、干擾少，但需要新裝置支援且穿透力更弱","傳得最遠","所有舊裝置都能用","只能在戶外使用，室內依規定全面禁止"],why:"適合高密度的室內環境，但規劃時基地台要更密。各國開放的頻段範圍不同，台灣要依主管機關的規定。"},
 {t:"物聯網",q:"大量只支援舊加密方式的物聯網裝置要上無線網路。應該怎麼規劃？",a:["放在獨立的網路和網段，限制它們能連到的範圍","和員工電腦同一個網路","直接對外開放","可以請製造這些裝置的廠商全部免費更換成新的型號"],why:"不要為了它們降低主要網路的安全等級。"},
 {t:"驗證",q:"企業無線網路的用戶端為什麼要驗證「驗證伺服器的憑證」？",a:["否則裝置會把帳密交給假冒的基地台","加快連線","節省電力","因為沒有驗證的話基地台的指示燈會一直閃爍"],why:"很多裝置預設會問使用者「要不要信任」，而使用者都按是。要由管理工具統一設定。"},
 {t:"排錯",q:"某個區域一到中午就連不上無線網路，其他時間正常。可能的原因是？",a:["微波爐等設備的干擾，或用餐時間人數暴增","基地台需要午休","訊號太強","中午的時候太陽的位置會影響到無線電波的方向"],why:"週期性的問題先找週期性的原因。頻譜分析可以看出非 Wi-Fi 的干擾源。"},
 {t:"定位",q:"利用無線網路做室內定位，要注意什麼？",a:["準確度有限，並涉及人員位置的隱私","完全沒有限制","一定比衛星定位準","定位的功能會讓每一台基地台的耗電量增加十倍"],why:"位置資料是個資。蒐集目的、保存期限和誰能看，都要有規範。"}

 {t:"架構",q:"大型場域的無線網路，使用者流量「集中到控制器」和「在基地台就近轉送」各有什麼取捨？",a:["集中好管控但控制器是瓶頸和單點，就近轉送效能好但政策較分散","集中一定比較好","就近轉送不需要交換器","兩種做法在實際上完全沒有任何的差別"],why:"依流量大小、政策需求和站點數量決定，也可以混用。"},
 {t:"高密度",q:"體育館這類上萬人的場地，無線設計的核心原則是什麼？",a:["用指向性天線切小涵蓋範圍，讓每台服務的人數受控","用最少的基地台","功率開到最大","可以讓所有的人全都連接到場地正中央的同一台基地台"],why:"重點從「涵蓋」變成「容量和干擾控制」。"},
 {t:"生命週期",q:"規劃無線網路換代（例如換到新一代標準）時，要先確認什麼？",a:["用戶端支援的比例、交換器的供電和上行頻寬","新基地台的外型","包裝的顏色","新一代的基地台在安裝的時候需要使用幾顆螺絲"],why:"基地台換了，交換器埠速和供電跟不上，或裝置都不支援，就發揮不出效果。"},
 {t:"安全",q:"無線入侵偵測／防禦系統主要在找什麼？",a:["未授權的基地台、假冒的網路和異常的無線行為","速度太慢的用戶","訊號太弱的角落","同仁在上班時間使用無線網路觀看影片"],why:"員工自己接的分享器，等於在內網開了一個沒人管的入口。"},
 {t:"關鍵應用",q:"倉儲的手持設備、醫療的行動設備這類關鍵應用，對無線網路的要求和一般辦公不同在哪？",a:["更重視漫遊不中斷和涵蓋無死角，而不是最高速度","只要速度快","不需要加密","其實只需要在每一天早上開始工作之前連線一次就可以"],why:"設計和驗收都要依實際的設備和動線來測。"},
 {t:"維運",q:"無線網路上線後，要怎麼持續確保品質？",a:["持續監控用戶端的體驗指標，並定期重新勘測","裝好就不用管","等有人抱怨","每一個月固定把所有的基地台全部重新開機一次"],why:"隔間、家具、鄰居的網路都會變。環境變了，原本的設計就不一定適用。"},
 {t:"私有行動網路",q:"企業自建私有行動網路（例如專網）和 Wi-Fi 相比，適合什麼情境？",a:["大範圍、需要穩定移動連線和可預期品質的場域","小型辦公室","家用","只有三到五個人使用的小型會議室"],why:"成本和複雜度高很多，頻譜也要依法規申請。不是用來取代辦公室 Wi-Fi 的。"},
 {t:"治理",q:"訪客無線網路在法遵上要注意什麼？",a:["使用條款、紀錄保存，以及被用於不法行為時的追溯能力","不需要任何規範","只要有密碼就好","只要在牆上貼出禁止從事不法行為的公告就可以"],why:"對外提供網路，出事時要能配合調查，也要告知使用者蒐集了什麼資料。"}

 {t:"DHCP",q:"DHCP 的「租約時間」是什麼意思？",a:["裝置可以使用這個 IP 多久，到期前要續約","網路的月租費","裝置的保固期","使用者每一天可以連線上網的總時數上限"],why:"訪客多的環境租約要短，IP 才回收得快；固定設備多的環境可以長一點。"},
 {t:"DNS",q:"DNS 紀錄的 TTL 值代表什麼？",a:["這筆查詢結果可以被快取多久","網站的連線速度","網域的到期日","這個網域最多可以建立幾筆不同的紀錄"],why:"TTL 內別人不會再來問你。所以改了紀錄，要等舊的快取過期才會全部生效。"},
 {t:"時間同步",q:"NTP 的用途是什麼？",a:["讓設備的時間和標準時間保持一致","傳送檔案","加密連線","統計每一台設備每天總共開機運作了多久"],why:"時間不準，登入驗證會失敗、憑證會被判定無效、紀錄也對不起來。"},
 {t:"Proxy",q:"公司的上網代理伺服器（Proxy）通常用來做什麼？",a:["集中管控和記錄對外的網頁連線","加快電腦開機","儲存使用者檔案","幫每一位同仁自動填寫網站上面的各種表單"],why:"可以過濾惡意和不當網站，出事時也查得到誰連過哪裡。"},
 {t:"負載平衡",q:"負載平衡器的基本作用是？",a:["把連線分散到多台後端伺服器","壓縮資料","備份資料","把所有的連線都集中導向到效能最好的那一台"],why:"單台撐不住的流量可以分攤，也讓其中一台故障時服務不中斷。"},
 {t:"DNS",q:"同一個網域名稱，在公司內部和外部查到不同的 IP。這種設計叫什麼？",a:["分割 DNS（Split DNS）","DNS 中毒","DNS 故障","動態 DNS，也就是 IP 會隨著時間自動變更"],why:"內部直接連內部位址，外部走對外的入口。排錯時要先確認自己問的是哪一台 DNS。"},
 {t:"DHCP",q:"印表機希望每次都拿到同一個 IP，又不想手動設定。可以用什麼功能？",a:["DHCP 保留","關閉 DHCP","每天重開機","把印表機的名稱設定成它想要使用的那一個 IP"],why:"依網路卡位址綁定固定的 IP，設定仍由 DHCP 集中管理。"},
 {t:"名稱解析",q:"電腦上的 hosts 檔有什麼作用？",a:["手動指定名稱對應的 IP，優先於 DNS","儲存瀏覽紀錄","記錄密碼","記錄這一台電腦曾經連接過的所有無線網路"],why:"測試時很好用，但忘了改回來就會出現「只有這台連不到」的怪問題，也是惡意程式常動手腳的地方。"}

 {t:"DHCP",q:"很多電腦突然拿不到 IP，查看發現 DHCP 的位址範圍用完了。常見原因和處理是？",a:["裝置變多或租約太長，可以擴大範圍或縮短租約","DHCP 伺服器中毒","網路線太短","使用者的電腦名稱取得太長超過了系統的限制"],why:"也要留意是不是有人私接設備或有異常裝置大量索取位址。"},
 {t:"DNS",q:"內部 DNS 伺服器查不到外部網域時，通常怎麼處理？",a:["把查詢轉送給上游的 DNS 伺服器","直接回答找不到","重開機","請使用者改用 IP 位址的方式連到所有的外部網站"],why:"這叫轉送器。上游掛了，內部就會出現「內網正常、外網全掛」的現象。"},
 {t:"DNS",q:"PTR 紀錄是做什麼用的？",a:["用 IP 反查對應的名稱","指定郵件伺服器","設定別名","記錄網域的擁有者姓名以及他的聯絡電話"],why:"郵件伺服器常會檢查寄件來源的反向解析，沒設好信容易被當成垃圾信。"},
 {t:"時間同步",q:"NTP 的「階層」（Stratum）數字代表什麼？",a:["離標準時間來源有幾層，數字越小越接近來源","同步的次數","時區","這一台伺服器目前同時服務的用戶端總數量"],why:"內部通常設幾台向外部校時，其他設備再向它們校時，而不是每台都自己連出去。"},
 {t:"Proxy",q:"有些內部系統經過 Proxy 反而連不上。通常怎麼解決？",a:["設定例外清單，讓內部位址不經過 Proxy","關掉整個 Proxy","每台電腦各自設定","可以請使用者每次要連內部系統之前先重新開機一次"],why:"用自動設定檔集中管理例外，比一台一台手動設定可靠。"},
 {t:"負載平衡",q:"使用者登入後，下一個請求被分到另一台伺服器，結果變成未登入。這需要什麼機制？",a:["連線黏著，或把登入狀態存在共用的地方","增加伺服器","關閉負載平衡","請使用者在每一個頁面都重新輸入一次帳號密碼"],why:"比較好的長期做法是讓伺服器不保存狀態，任何一台都能處理任何請求。"},
 {t:"DNS",q:"下週要把網站切換到新的 IP。DNS 上應該事先做什麼準備？",a:["提前把 TTL 調短，切換後再調回來","當天再處理","把 TTL 調到最長","把舊的紀錄提前一個星期先刪除，等切換的時候再新增"],why:"TTL 短，切換後大家很快就會查到新位址。忘了這步，舊快取可能撐上一整天。"},
 {t:"DHCP",q:"DHCP 伺服器和用戶端在不同網段。需要在路由設備上設定什麼？",a:["DHCP 轉送（Relay）","NAT","埠轉發","在每一個網段都各自安裝一台獨立的 DHCP 伺服器"],why:"DHCP 靠廣播，過不了路由器。轉送功能會把請求代為送到指定的伺服器。"}

 {t:"可用性",q:"內部只有一台 DNS 伺服器。風險是什麼？",a:["它一故障，所有依賴名稱的服務都連不上","沒有風險","查詢會比較快","每一個網域名稱都必須重新申請一次才可以使用"],why:"DNS 是所有服務的前提。至少兩台，用戶端也要設定兩個以上的位址。"},
 {t:"安全",q:"攻擊者把資料藏在 DNS 查詢裡偷偷傳出去。防守上可以怎麼發現？",a:["監控異常的查詢量、超長或隨機樣式的網域名稱","關閉 DNS","只允許 IP 連線","規定每一位公司同仁每一天最多只能查詢十個網域"],why:"DNS 幾乎到處都放行，所以常被拿來當隱蔽通道。"},
 {t:"防護",q:"「DNS 過濾」服務是怎麼提供保護的？",a:["擋下對已知惡意網域的查詢，連線就不會發生","加密所有流量","掃描檔案","直接把所有網域的名稱都翻譯成比較容易記的中文"],why:"在名稱解析這一步就擋，成本低、涵蓋廣，但不能取代其他防護。"},
 {t:"DHCP",q:"兩台 DHCP 伺服器要互為備援。設定上要注意什麼？",a:["使用容錯機制或分割位址範圍，避免發出重複的位址","設定完全相同的範圍各自運作","只開一台","兩台輪流，單數日使用第一台、雙數日使用第二台"],why:"各自獨立發同一個範圍，一定會發生位址衝突。"},
 {t:"時間同步",q:"為什麼內部應該有自己的時間來源階層，而不是每台設備各自連外部校時？",a:["一致、可控，也不必讓每台設備都能連外","外部時間不準","比較省電","因為外部的校時服務每一次查詢都需要支付費用"],why:"網域環境中，成員向網域控制站校時，最上層的再向可信的外部來源校時。"},
 {t:"負載平衡",q:"負載平衡器的「健康檢查」只檢查連接埠有沒有開。有什麼不足？",a:["服務可能埠有開但實際已經無法正常回應","沒有不足","太嚴格","檢查的次數太少，每天應該至少檢查一百萬次"],why:"要檢查應用層的實際回應，例如要求一個會確認後端相依狀態的頁面。"},
 {t:"憑證",q:"負載平衡器或代理伺服器上做 TLS 終結，管理上最容易出事的是什麼？",a:["憑證到期沒人更新","加密太強","連線太快","憑證的檔案名稱使用了太多的英文字母"],why:"到期日要納入監控，能自動更新的就自動化。"},
 {t:"DNS",q:"對外公開的 DNS 區域和內部區域用同一台伺服器、同一份資料。問題是什麼？",a:["內部的主機名稱和位址會被外部查到","沒有問題","查詢變慢","外部的使用者會因此沒有辦法查到公司的官方網站"],why:"內部的命名常透露系統用途和架構，是攻擊者偵察的好材料。"}

 {t:"架構",q:"設計跨多個據點的 DNS 架構時，核心考量是什麼？",a:["各據點就近解析、廣域網路中斷時仍能運作","全部集中在總部一台","每台電腦自己當 DNS","每一個據點都各自申請一個完全不同的網域名稱"],why:"線路斷了，據點內部的服務也不該因為查不到名稱而停擺。"},
 {t:"安全",q:"DNSSEC 解決的是什麼問題？",a:["確保查詢結果沒有被偽造或竄改","加密查詢內容","加快查詢速度","讓網域名稱可以使用中文以及各種特殊的符號"],why:"它提供來源驗證和完整性，不提供機密性。查詢內容的加密是另一類技術。"},
 {t:"加密 DNS",q:"瀏覽器自行使用加密的 DNS（例如 DoH）連到外部解析服務。對企業的影響是什麼？",a:["繞過了內部的 DNS 過濾和監控","沒有影響","速度變慢而已","公司內部的 DNS 伺服器會因此自動停止運作"],why:"要用政策統一管理瀏覽器的設定，或提供企業自己的加密解析服務。"},

 {t:"位址管理",q:"組織的 IP 位址、DNS、DHCP 資料分散在不同的試算表。規模變大後應該怎麼做？",a:["導入整合的位址管理（IPAM），讓三者資料一致","繼續用試算表","全部改用固定 IP","請每一個部門各自維護並且不需要互相同步"],why:"位址衝突、過期的 DNS 紀錄、沒人知道用途的網段，都來自資料不一致。"},
 {t:"相依",q:"規劃機房全毀後的復原順序。DNS、DHCP、時間同步這些服務應該排在哪裡？",a:["最前面，其他服務都依賴它們","最後面","不需要復原","排在所有的應用系統全部都已經復原完成之後"],why:"很多復原演練卡在第一步：驗證服務起不來，因為它找不到 DNS。"},
 {t:"零信任",q:"傳統的上網代理伺服器，在遠距工作和雲端服務普及後遇到什麼問題？",a:["流量不再經過公司網路，管控點要移到雲端或端點","代理伺服器太快","沒有問題","同仁在家工作的時候，依規定不可以瀏覽任何的網站"],why:"所以出現了把代理、過濾和存取控制放在雲端的服務模式。"},
 {t:"治理",q:"DNS 紀錄長年只增不減，留下大量指向已不存在資源的紀錄。風險是什麼？",a:["別人取得那個資源後，可以冒用你的子網域","佔用太多硬碟","查詢變慢","這些紀錄會自動指向公司裡面最重要的那一台主機"],why:"這叫子網域接管，常發生在已刪除的雲端服務上。DNS 紀錄要跟著資源的生命週期一起清。"}
]]},
{id:'netsec',lv:[[
 {t:"防火牆",q:"防火牆規則的基本原則應該是？",a:["預設全部拒絕，只開放需要的","預設全部開放，有問題再擋","只擋已知的壞人","每個月把所有的規則全部刪除之後重新建立一次"],why:"你不可能列出所有壞的東西。只允許明確需要的，其餘一律不通。"},
 {t:"網路分區",q:"DMZ（非軍事區）通常用來放什麼？",a:["需要對外提供服務的主機","最機密的資料庫","員工的個人電腦","公司裡面不再使用準備要報廢的舊設備"],why:"對外主機被攻破時，中間還隔著一層防火牆才到內部網路。"},
 {t:"偵測與防禦",q:"IDS 和 IPS 的差別是？",a:["IDS 只偵測並告警，IPS 還會主動阻擋","兩者相同","IPS 只能記錄","IDS 是安裝在使用者的電腦上，IPS 則是安裝在印表機上"],why:"IPS 擋錯會影響正常流量，所以常先用偵測模式觀察再開啟阻擋。"},
 {t:"VPN",q:"員工在外透過 VPN 連回公司，VPN 提供了什麼保護？",a:["在不可信的網路上建立加密的通道","讓上網速度變快","防止電腦中毒","讓員工的電腦不需要安裝任何的安全性更新"],why:"加密保護的是傳輸過程。連進來的電腦本身若有問題，一樣會把風險帶進內網。"},
 {t:"基本防護",q:"攻擊者最常利用的，往往是什麼樣的弱點？",a:["早就有修補程式、但一直沒更新的已知漏洞","全新的未知漏洞","量子電腦","只有在電影裡面才會出現的超高難度攻擊手法"],why:"持續修補是最不起眼、但最有效的防護。"},
 {t:"分段",q:"為什麼要把內部網路切成多個網段並控制互通？",a:["一個區域被入侵時，限制它能擴散的範圍","讓 IP 比較好記","增加網路速度","讓不同部門的同仁彼此之間完全沒有辦法互相聯絡"],why:"整個公司一個大網段，一台中毒就能碰到所有設備。"},
 {t:"管理介面",q:"防火牆、交換器這些設備的管理介面，應該怎麼保護？",a:["只允許從管理專用的網段或主機連線，不對外開放","開放給整個內網","直接對網際網路開放","直接把管理的密碼設定成和設備的型號名稱一模一樣"],why:"管理介面被拿下，整台設備就是別人的。對外開放更是常見的入侵原因。"},
 {t:"端點",q:"只靠網路邊界的防火牆，為什麼不夠？",a:["筆電會帶出去、威脅會從內部或加密流量進來","防火牆很貴","防火牆會過熱","這是因為防火牆每天晚上都必須關機休息八個小時"],why:"所以端點本身也要有防護和修補，不能假設內網就是安全的。"}
],[
 {t:"防火牆",q:"新增一條防火牆規則，「開放範圍」應該怎麼訂？",a:["指定明確的來源、目的和連接埠，越小越好","來源和目的都設為任意","連接埠全開","先全部開放，等到稽核的那個時候再回頭檢討"],why:"「任意到任意」的規則等於沒有防火牆。"},
 {t:"規則管理",q:"防火牆上有幾百條沒人說得清用途的舊規則。應該怎麼辦？",a:["定期清查：依使用紀錄和申請紀錄，停用並移除不需要的","全部保留比較安全","全部刪除","把所有規則的順序隨機重新排列一次，看看有沒有造成影響"],why:"每條規則都該有申請人、原因和到期日。長期沒流量的規則是首要檢討對象。"},
 {t:"網站防護",q:"WAF（網站應用程式防火牆）主要防護什麼？",a:["針對網站應用層的攻擊，例如注入和跨站腳本","硬碟故障","停電","員工在上班的時間使用公司電腦瀏覽購物網站"],why:"一般防火牆看的是 IP 和埠，WAF 看得懂 HTTP 內容。但它不能取代把程式本身修好。"},
 {t:"出站管控",q:"為什麼連「從內部連出去」的流量也要管控？",a:["限制惡意程式對外連線和資料外傳的管道","讓員工不能上網","節省電費","因為連出去的流量依規定需要向電信業者額外申報"],why:"伺服器通常不需要任意連到網際網路。限制出站，攻擊者拿下主機後也難以回連。"},
 {t:"弱點掃描",q:"對內部網路做弱點掃描之前，要先確認什麼？",a:["範圍、時間和授權，並通知相關單位","不用確認，直接掃","只在尖峰時段掃","先把所有的防護設備都關閉以免影響掃描的結果"],why:"掃描可能影響老舊設備，也會觸發告警。事先溝通避免誤判成真的攻擊。"},
 {t:"強化",q:"伺服器的「強化」（Hardening）包含哪些動作？",a:["關閉不需要的服務和帳號、套用安全設定、移除預設值","加大記憶體","換更快的硬碟","把伺服器搬到比較高的樓層以避免淹水"],why:"預設安裝通常開了很多用不到的東西，每一個都是多一個可以被打的地方。"},
 {t:"遠端存取",q:"對外開放的遠端存取入口（VPN、遠端桌面閘道），最基本的保護是什麼？",a:["強制多因素驗證","密碼設長一點就好","限制每天只能登入一次","把登入的頁面設計得比較複雜讓攻擊者看不懂"],why:"這類入口每天都被大量嘗試登入。只靠密碼，被撞開只是時間問題。"},
 {t:"紀錄",q:"防火牆和資安設備的紀錄，應該怎麼處理？",a:["送到集中的平台保存和分析","留在設備上就好","每天清空","列印成紙本之後交由各部門的主管分別保管"],why:"設備本身存不久，也無法和其他來源關聯。集中之後才看得出跨設備的攻擊軌跡。"}
],[
 {t:"架構",q:"「零信任網路存取」（ZTNA）和傳統 VPN 的主要差別是？",a:["只連到被授權的特定應用，而不是整個內部網路","ZTNA 不需要驗證","VPN 比較安全","ZTNA 只能在公司的辦公室裡面才可以使用"],why:"VPN 連上就進了內網；ZTNA 每個應用都要依身分和裝置狀態另外放行。"},
 {t:"可視性",q:"大部分流量都加密了。網路偵測還能看什麼？",a:["連線的對象、時間、流量大小和模式","什麼都看不到","只能看內容","只能看到流量是在白天還是在晚上發生的"],why:"不解密也能看出異常：連到罕見的目的地、規律的心跳、異常的資料量。"},
 {t:"東西向",q:"防火牆只擺在對外的邊界。內部主機之間的攻擊為什麼擋不住？",a:["內部互連的流量根本不經過邊界防火牆","防火牆太舊","規則太少","因為內部的攻擊流量通常都是在半夜才會發生"],why:"需要內部的分段、主機防火牆或微分段。"},
 {t:"管理網路",q:"伺服器的帶外管理介面（遠端管理卡）應該怎麼處理？",a:["放在獨立且嚴格限制的管理網段，並保持韌體更新","和業務網路放一起","直接對外","平常全部拔掉，等到伺服器壞掉的那個時候再接上去"],why:"它能直接開關機、掛載映像，等同站在機器前面。"},
 {t:"弱點管理",q:"弱點掃描每次都列出幾千項。怎麼決定先修什麼？",a:["結合嚴重度、是否已被實際利用和資產的暴露程度","依字母順序","只修最容易的","每一個月固定修補報表上面排在最前面的十項"],why:"已經有人在打的、又直接對外的，優先於分數高但碰不到的。"},
 {t:"DDoS",q:"面對大流量的阻斷服務攻擊，自己的設備通常擋不住。原因是什麼？",a:["流量在到達設備之前就把線路塞滿了","設備太貴","規則寫錯","因為攻擊的流量依規定不可以被任何設備阻擋"],why:"要靠上游業者或雲端清洗服務，在更大的管道處理。"},
 {t:"組態",q:"網路和資安設備的設定，為什麼要定期備份並比對差異？",a:["知道被改了什麼，出事能還原","讓檔案變多","因為稽核要求","因為沒有備份的設備會在滿一年之後自動恢復成原廠的設定"],why:"未經核准的變更，可能是失誤，也可能是入侵的跡象。"},
 {t:"誘捕",q:"在內部網路放「誘捕系統」（Honeypot）的價值是什麼？",a:["正常不會有人連它，一有連線就值得調查","加快網路","取代防火牆","讓攻擊者把所有的時間都花在上面就不會去攻擊別的地方"],why:"誤報極低，是偵測內部橫向移動的好幫手。"}
],[
 {t:"策略",q:"「縱深防禦」和「零信任」互相衝突嗎？",a:["不衝突，零信任是把驗證和最小權限貫穿到每一層","衝突，只能選一個","零信任不需要防禦","縱深防禦只適用於實體的機房不適用於網路"],why:"兩者都假設任何一層可能被突破。"},
 {t:"架構",q:"把網路安全功能和廣域網路整合成雲端服務（SASE）的主要動機是什麼？",a:["使用者和應用都分散了，把流量繞回總部檢查既慢又沒必要","雲端比較便宜","為了減少員工","因為傳統的防火牆設備已經全部停止生產"],why:"安全控制跟著使用者和應用走，而不是綁在機房的設備上。"},
 {t:"微分段",q:"推動微分段專案，最大的困難通常是什麼？",a:["不清楚應用之間實際的通訊關係，貿然阻擋會中斷服務","設備太便宜","規則太少","網路線的長度不夠連接到所有的伺服器"],why:"先觀察流量、建立相依圖，用只記錄不阻擋的模式驗證，再逐步收緊。"},
 {t:"工控與物聯網",q:"保護無法安裝防護軟體、也難以更新的設備（工控、醫材、物聯網），主要靠什麼？",a:["網路層的隔離、存取限制和行為監控","請廠商每天更新","不連網路","在每一台設備的旁邊都安排一位值班人員看守"],why:"能做的控制都在設備之外。被動式的監控可以在不影響設備的情況下看到異常。"},
 {t:"暴露面",q:"要從攻擊者的角度掌握組織「對外暴露了什麼」，應該怎麼做？",a:["持續從外部探查自己的網域、位址和雲端資產","只看防火牆規則","問資深同事","每一年請外部的廠商來做一次簡報就足夠了"],why:"沒人記得的測試主機、舊網域、雲端上忘了關的服務，最常是破口。"},
 {t:"驗證",q:"買了很多資安設備。要怎麼知道它們實際上有沒有在發揮作用？",a:["用模擬攻擊定期驗證偵測和阻擋的效果","看授權有沒有過期","看指示燈","看設備的操作手冊上面列出了多少項功能"],why:"設定錯誤、規則過期、紀錄沒送出去，都是有設備卻沒防護的常見原因。"},
 {t:"加密",q:"為什麼要開始盤點組織使用了哪些加密演算法？",a:["未來演算法被淘汰或被破解時，才知道要換哪裡","演算法會過期變質","為了增加預算","這是因為加密演算法依規定每個月都要重新申請一次"],why:"包含量子運算帶來的風險。資料如果要保密很多年，現在就要考慮。"},
 {t:"韌性",q:"假設攻擊者一定會進來，網路安全的目標應該怎麼調整？",a:["限制他能到達的範圍，並盡快發現和恢復","放棄防護","只做備份","把全部的預算都集中用來購買一台最貴的防火牆"],why:"預防仍然重要，但偵測、圍堵和復原的能力決定了損害大小。"}

{id:'dataprot',lv:[[
 {t:"資料分級",q:"為什麼要對資料做分級（例如公開、內部、機密）？",a:["不同等級採取不同強度的保護，資源才用在重點上","為了增加文件數量","為了好看","這是因為每一份文件依規定都必須蓋上不同顏色的印章"],why:"全部當機密，沒人做得到；全部不管，重要的又沒保護。"},
 {t:"加密",q:"資料「傳輸中」和「靜態」的加密，分別保護什麼情況？",a:["前者防止傳送途中被攔截，後者防止儲存媒體被拿走後被讀取","兩者相同","前者保護硬碟","前者只保護電子郵件，後者只保護紙本文件"],why:"兩種都要。只做其中一種，另一邊就是缺口。"},
 {t:"個資原則",q:"蒐集個資時的「最小化」原則是什麼意思？",a:["只蒐集達成目的所必要的資料","蒐集越多越好","蒐集後壓縮","只蒐集姓名當中筆畫數量最少的那一個字"],why:"沒蒐集的資料不會外洩。表單上每多一個欄位，都要問「真的需要嗎」。"},
 {t:"遮罩",q:"客服畫面只顯示身分證字號的部分號碼，其餘用星號代替。這個做法叫什麼？",a:["資料遮罩","資料備份","資料壓縮","資料同步，也就是讓兩個系統的資料保持一致"],why:"大部分工作不需要看到完整的號碼。遮罩降低了每天接觸資料的人造成外洩的機會。"},
 {t:"權限",q:"共用資料夾的權限，應該依什麼原則設定？",a:["只給工作上需要的人","全公司都能讀寫","依年資","依照同仁的座位距離資料夾所在的伺服器有多遠"],why:"「大家都看得到」的資料夾，是內部外洩和勒索軟體擴散的溫床。"},
 {t:"銷毀",q:"印有個資的紙本文件不再需要時，應該怎麼處理？",a:["用碎紙機或委託合格的銷毀服務","丟進一般垃圾桶","拿來當便條紙","整疊拿到回收場和一般的報紙放在一起回收"],why:"資料保護不只在電腦裡。紙本和廢棄設備是很常見的外洩來源。"},
 {t:"備份",q:"備份資料的保護等級，應該和正式資料相比如何？",a:["一樣，因為內容相同","可以比較低","不需要保護","只需要在備份的檔名後面加上機密兩個字就可以"],why:"攻擊者拿備份和拿正式資料是一樣的結果，而備份常常被放在保護較鬆的地方。"},
 {t:"實體安全",q:"離開座位時鎖定螢幕、桌上不留機密文件，是在防什麼？",a:["路過的人看到或拿走資料","電腦過熱","螢幕老化","打掃的人員不小心把桌上的文件當成垃圾收走"],why:"很多資料外洩不需要任何技術，只要有人經過。"}
],[
 {t:"外洩防護",q:"資料外洩防護（DLP）系統的作用是？",a:["偵測並阻擋敏感資料透過郵件、上傳、隨身碟等管道流出","加快網路速度","備份資料","自動幫每一份文件加上頁碼和公司的浮水印"],why:"它依內容特徵辨識敏感資料。要先知道自己要保護什麼，規則才訂得出來。"},
 {t:"金鑰管理",q:"加密做得再好，如果金鑰管理不當會怎樣？",a:["金鑰外洩等於沒加密，金鑰遺失則資料永遠打不開","沒有影響","資料會變大","加密的資料會隨著時間自動慢慢地解開"],why:"金鑰要和資料分開存放、限制存取、定期輪替，並且有備份。"},
