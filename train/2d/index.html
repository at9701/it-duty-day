<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>資訊訓練村</title>
<style>
/* 版面：上方進度，中間訓練村（2D 地圖或 3D 場景），下方課程一覽；作答時換成單一題目卡 */
:root{--bg:#eaf0f4;--panel:#ffffff;--panel2:#f0f5f8;--line:#d2dde6;--fg:#1c2a36;--muted:#617384;--accent:#17a07a;--warn:#c9860c;--crit:#d6453d;--info:#2a7fd4;
 --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Consolas,"Courier New",monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
header h1{font-size:24px;margin:0;flex:1 1 160px}
a.back{color:var(--muted);text-decoration:none;font-size:14px}a.back:hover{color:var(--fg)}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.pill b{color:var(--accent)}
.lead{color:var(--muted);margin:0;max-width:68ch}.lead a{color:var(--accent)}
h2.sec{font-size:16px;margin:6px 0 0}
.stars{color:var(--warn);letter-spacing:2px;font-size:14px}.stars i{color:var(--line);font-style:normal}
button:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--info);outline-offset:2px}
/* 2D 訓練村地圖 */
.map{position:relative;width:100%;aspect-ratio:100/62;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 24px rgba(28,42,54,.1);background:#8fc77e}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.npc{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;width:112px}
.npc .roof{width:74px;height:16px;border-radius:10px 10px 3px 3px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.npc .hut{width:62px;height:40px;background:#fff8ea;border:2px solid #b89c6a;border-top:0;border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .15s}
.npc:hover .hut{transform:translateY(-3px)}
.npc .tag{margin-top:3px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;line-height:1.35;text-align:center;white-space:nowrap}
.npc .tag small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.npc .mk{position:absolute;top:-14px;right:10px;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:0 7px;line-height:18px}
.npc .mk.done{background:var(--accent)}
.hall{position:absolute;left:50%;top:51.6%;transform:translate(-50%,-50%);background:#fff;border:2px solid #b89c6a;border-radius:14px;padding:6px 14px;text-align:center;font-weight:800;line-height:1.3;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.hall small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.gate{position:absolute;background:rgba(28,42,54,.72);color:#fff;border-radius:10px;padding:3px 10px;font-size:12px;line-height:1.4;text-align:center}
@media (max-width:700px){.map{display:none}}
/* 3D 訓練村 */
.v3d{position:relative;width:100%;aspect-ratio:16/9;max-height:72vh;min-height:300px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 24px rgba(28,42,54,.1);background:#bfe3f5;touch-action:none}
.v3d canvas{display:block;width:100%;height:100%}
.v3d .tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2}
.v3d .how{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.88);border-radius:10px;padding:3px 10px;font-size:12px;color:var(--muted);pointer-events:none}
/* 課程一覽 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;color:var(--fg);cursor:pointer;min-width:0}
.chip:hover{border-color:var(--accent)}
.chip .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.chip b{display:block;line-height:1.3}.chip small{color:var(--muted);display:block;line-height:1.3}
.chip.lock{cursor:default;opacity:.6;border-style:dashed}.chip.lock:hover{border-color:var(--line)}
/* 跟師傅對話 */
.talk{position:fixed;inset:0;z-index:20;background:rgba(28,42,54,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.talk .box{background:var(--panel);border-radius:18px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 40px rgba(28,42,54,.3)}
.talk .who{display:flex;gap:12px;align-items:center}
.talk .face{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.talk h2{margin:0;font-size:18px}.talk .who small{color:var(--muted)}
.talk .say{background:var(--panel2);border-radius:4px 14px 14px 14px;padding:10px 14px;margin:0}
.talk .ttl{font-weight:700;color:var(--accent)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiers button{min-width:0;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:12px;padding:8px 2px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tiers button:hover:not(:disabled){border-color:var(--accent)}
.tiers button:disabled{opacity:.5;cursor:not-allowed}
.tiers button span.n{font-size:11px;font-weight:400;color:var(--muted)}
/* 作答 */
#play{display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto;width:100%}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .name{font-weight:700;flex:1 1 140px}
.hearts{font-size:20px;letter-spacing:3px}.hearts i{font-style:normal;opacity:.2}
.combo{font-weight:800;color:var(--warn);min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(28,42,54,.1);display:flex;flex-direction:column;gap:14px}
.qno{color:var(--muted);font-size:13px}
.q{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
pre{margin:0;background:#16212b;color:#d7e3ee;border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13px;overflow-x:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--info)}
.opt.right{border-color:var(--accent);background:#dcf3ea}.opt.wrong{border-color:var(--crit);background:#fbe6e3}.opt:disabled{cursor:default}
.opt code,.q code,.why code{font-family:var(--mono);font-size:.92em;background:rgba(28,42,54,.08);border-radius:4px;padding:1px 5px}
.why{border-left:5px solid var(--accent);background:var(--panel2);border-radius:8px;padding:10px 14px}
.why.bad{border-color:var(--crit)}.why b{display:block;margin-bottom:2px}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;border-radius:12px;padding:11px 20px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big{font-size:44px;color:var(--warn);letter-spacing:8px;line-height:1}.big i{color:var(--line);font-style:normal}
.miss{border-top:1px solid var(--line);padding-top:10px}.miss small{color:var(--muted);display:block}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qcard.ok{animation:pop .25s}.qcard.ng{animation:shake .25s}
@media (prefers-reduced-motion:reduce){.qcard.ok,.qcard.ng{animation:none}.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
 <header><a class="back" href="../../">← 回首頁</a><h1>資訊訓練村</h1><div class="sum"><span class="pill">基礎課程 <b id="sDone">0</b></span><span class="pill">星星 <b id="sStar">0</b></span><span class="pill">總分 <b id="sScore">0</b></span><button class="btn ghost" id="snd" style="padding:4px 12px;border-radius:999px" aria-label="音效開關">🔊</button></div></header>
 <div id="hub" style="display:flex;flex-direction:column;gap:16px">
  <p class="lead">村子中央是基礎學堂，九位師傅各教一門每個資訊人員都該會的課。找師傅說話就能考試：一次 8 題、三條命，錯一題以內就拿到稱號，從初級一路考到專家。想在村子裡走動可以用 <a href="../">3D 版</a>，進度是共用的。</p>
  <div id="stage"></div>
  <h2 class="sec">基礎課程</h2>
  <div class="chips" id="chips"></div>
  <h2 class="sec">進階課程（專科）</h2>
  <div class="chips" id="adv"></div>
 </div>
 <div id="play" hidden></div>
</div>
<div class="talk" id="talk" hidden></div>

<script>
// ===== 題庫：每題 {q 題目, code 可省略, a 四個選項（第一個是正確答案，出題時會打亂）, why 解說} =====
const DOMAINS=[
{id:'trouble',ic:'🛠️',col:'#dcf3ea',name:'電腦異常排除',desc:'現場報修的判斷順序：先問、先分、再動手',ranks:['報修見習','現場工程員','排除高手'],lv:[[
 {q:'使用者只說「電腦開不了機」。你第一件事該確認什麼？',a:['電源燈有沒有亮、按了有沒有任何反應，分清楚是沒電、沒畫面還是進不了系統','不用問太多，直接幫他把作業系統重灌一次，重灌完大部分的問題都會消失','先把主機板換掉，開不了機最常見就是主機板壞','進 BIOS 把韌體更新到最新版本再說'],why:'「開不了機」可能是三種完全不同的狀況，先分清楚才知道往哪查。'},
 {q:'主機有電、風扇在轉，但螢幕完全沒畫面。最先檢查哪裡？',a:['螢幕的電源、訊號線有沒有鬆，輸入來源有沒有切對','把硬碟拆下來換一顆新的','把作業系統整個重灌一次','電源可能不夠力，換一顆瓦數更大的電源供應器'],why:'沒畫面最常見的原因是線鬆了或輸入來源切錯，先查最簡單、最便宜的。'},
 {q:'開機後畫面顯示 <code>No bootable device</code>，最可能的方向是？',a:['開機磁碟沒有被偵測到，或 BIOS 的開機順序設錯','記憶體容量不夠，系統載入不了','顯示卡驅動程式版本太舊','網路線沒有接好，電腦抓不到開機需要的資訊'],why:'這個訊息代表找不到可以開機的磁碟：先看 BIOS 有沒有認到硬碟、開機順序對不對。'},
 {q:'排除問題時，為什麼要「一次只改一個地方」？',a:['這樣才能確定是哪一個改動讓問題消失或出現','因為一次改太多設定，會讓電腦變得比較耗電','因為公司規定每次只能改一項設定','因為這樣做整體速度會比較快'],why:'同時改好幾樣，就算好了也不知道是哪一樣造成的，下次遇到還是不會。'},
 {q:'使用者說電腦突然變得很慢。你先看什麼？',a:['開工作管理員，看 CPU、記憶體、磁碟哪個被佔滿，是哪個程式','直接申請加裝記憶體，電腦變慢通常都是因為記憶體不夠用','直接重灌，重灌完一定會變快','換一條新的網路線試試看'],why:'先看是什麼資源被吃光、被誰吃光，再決定怎麼處理。'},
 {q:'使用者說「昨天還好好的」。最有用的追問是哪一句？',a:['從昨天到現在，有沒有裝過、改過、搬動過什麼東西？','這台電腦當初是哪一年買的？','你登入的密碼是多少？','你們單位總共有幾個人在用電腦，平常都用來做什麼？'],why:'昨天正常、今天不正常，中間的變動就是最大的線索。'},
 {q:'電腦出現藍底白字的當機畫面（BSOD）。處理前應該先記下什麼？',a:['畫面上的停止代碼，以及當機前正在做什麼','螢幕的廠牌和型號','鍵盤和滑鼠是有線的還是無線的','電腦主機外殼的顏色'],why:'停止代碼可以直接查到方向（驅動、記憶體、磁碟…），當機前的動作可以重現問題。'},
 {q:'問題處理完了。結案前最重要的一步是？',a:['請使用者實際操作一次確認正常，並把原因和處理方式記下來','趁使用者還沒發現其他問題之前趕快離開，免得被留下來','提醒使用者下次不要再打電話來','把電腦連續重開三次確保穩定'],why:'使用者確認才算修好；原因寫下來，下次自己或同事遇到就不用重查。'},
],[
 {q:"同一層樓有十幾個人同時說網路不通。比較好的處理方向是？",a:["找這些人的共通點，往上游的交換器或線路查","照報修順序，一台一台去現場把每台電腦的網路設定重新檢查過","請大家先重開機，沒好再說","先處理職位最高的那一位"],why:"很多人同時出事，問題通常在他們共用的東西上。一台一台修只是在浪費時間。"},
 {q:"問題「有時候會、有時候不會」。這種間歇性的問題，最有用的做法是？",a:["記下每次發生的時間和當時在做什麼，找出規律","等它完全壞掉再來修，那時候原因比較明顯","直接重灌，一次解決","跟使用者說這是正常現象，電腦用久了難免都會這樣，不用太在意"],why:"間歇性問題靠猜是猜不到的。有了時間和動作的紀錄，才能對到 log 或找出共同條件。"},
 {q:"螢幕沒畫面，你拿一台確定是好的螢幕和線來接。這個動作叫交叉測試，目的是？",a:["用確定正常的東西，分出問題在哪一段","順便幫使用者把螢幕換成新的","證明使用者沒有說謊","先讓使用者有螢幕可以用，至於真正壞在哪裡之後有空再慢慢查"],why:"把「確定好的」換上去：好了，就是原本那個壞；沒好，問題在別段。一次只換一樣。"},
 {q:"某位使用者登入後程式打不開，但換別人登入同一台電腦就正常。問題比較可能在哪？",a:["這個使用者的帳號設定或權限","主機板","這台電腦的記憶體有一條快要壞掉，剛好只有他登入的時候會用到","網路線"],why:"同一台電腦、不同人結果不同，硬體和網路就可以先排除，往使用者層級的設定檔和權限查。"},
 {q:"要動一項你不熟的設定之前，最該先做的是？",a:["把原本的設定記下來或備份，確保改壞了能改回去","先改改看，有問題再上網查怎麼復原","找一個沒人的時間偷偷改","問使用者同不同意"],why:"排除問題的底線是不要越修越糟。能還原，才敢動手。"},
 {q:"這個問題你處理不了，要往上轉給資深同事或廠商。轉的時候最該附上什麼？",a:["現象、已經做過的檢查和結果","只要案件編號","使用者的抱怨內容原文，一字不漏地轉過去，讓對方感受一下現場的壓力","你覺得是誰的錯"],why:"附上已做的檢查，接手的人才不用從頭再問一次、再做一次。"},
 {q:"伺服器硬碟滿了，你刪掉一些舊檔案，服務恢復了。這樣算處理完了嗎？",a:["還沒，要查是什麼一直在寫、之後會不會再滿","算，服務已經恢復，使用者也沒有再反應，可以結案了","算，但要記得下個月再來刪一次","不算，應該順便把硬碟換成更大的"],why:"刪檔是解決症狀。沒找到是誰在寫（log 沒輪替？程式異常？），過幾天一樣會再滿。"},
 {q:"你換了一條網路線之後問題好了，隔天同樣的問題又出現。這代表什麼？",a:["網路線可能不是原因，昨天好了也許只是巧合","新的網路線又壞了，再換一條","使用者一定又動了什麼","這種事情本來就查不出原因，只能等它下次再發生的時候再處理"],why:"「做了某件事之後好了」不等於「因為那件事才好」。問題重現，就要回頭重新驗證當初的判斷。"}
]]},
{id:'hw',ic:'🖥️',col:'#e3ecf8',name:'硬體',desc:'主機裡有什麼、壞掉會怎樣、怎麼安全地動它',ranks:['硬體見習','維修員','硬體達人'],lv:[[
 {q:'關於記憶體（RAM），下列哪一個敘述正確？',a:['斷電之後，裡面的資料就會消失','斷電之後資料仍然會保留','只能讀取，不能寫入','主要用來長期保存檔案'],why:'RAM 是揮發性儲存，只在通電時暫存運作中的資料。'},
 {q:'SSD 相對於傳統硬碟（HDD），最主要的優點是？',a:['沒有機械結構，隨機讀寫快，也比較耐震','同樣價格下容量一定比較大','每 GB 的價格一定比較便宜','使用壽命無限，不會損壞'],why:'SSD 沒有碟片和讀寫頭，所以快、安靜、耐震，但每 GB 通常比較貴，也有寫入壽命。'},
 {q:'開機時主機連續嗶嗶叫，而且沒有畫面。通常先檢查什麼？',a:['記憶體有沒有插好，或是不是壞了','鍵盤有沒有接上','主機喇叭的音量是不是調太大','網路卡的燈有沒有亮'],why:'連續嗶聲是主機板的自我檢測警告，最常見是記憶體接觸不良。'},
 {q:'RAID 1 的作用是什麼？',a:['兩顆磁碟互為鏡像，一顆壞掉資料還在','把資料拆開寫入加快速度，但沒有備援','自動壓縮資料節省空間','把整顆磁碟的內容加密'],why:'RAID 1 是鏡像；加快速度但沒有備援的是 RAID 0。'},
 {q:'RAID 5 最少需要幾顆磁碟？最多可以壞幾顆而資料不遺失？',a:['最少 3 顆，可以壞 1 顆','最少 2 顆，可以壞 1 顆','最少 4 顆，可以壞 2 顆','最少 3 顆，可以壞 2 顆'],why:'RAID 5 用一顆磁碟的容量存同位元資料，所以最少 3 顆、容許壞 1 顆。可壞 2 顆的是 RAID 6。'},
 {q:'不斷電系統（UPS）的主要用途是？',a:['停電時撐一小段時間，讓設備正常關機或等發電機接手','提升網路的傳輸速度，讓伺服器的回應變得比較快','降低機房的溫度','攔截病毒和惡意程式'],why:'UPS 靠電池供電，只能撐幾分鐘到幾十分鐘，重點是爭取時間。'},
 {q:'要打開主機更換零件之前，應該先做什麼？',a:['關機、拔掉電源線，並先摸金屬釋放身上的靜電','讓電腦保持開機，更換時比較方便測試','只要戴上橡膠手套就可以直接動手','先把硬碟格式化避免資料外洩'],why:'帶電操作會燒零件，靜電也會打壞記憶體和主機板。'},
 {q:'電腦用一陣子就自動關機，摸起來很燙。最常見的原因是？',a:['風扇或散熱片積滿灰塵，或散熱膏乾掉了','硬碟的容量太大','螢幕的亮度調得太高，連帶讓主機溫度上升','鍵盤有按鍵卡住'],why:'過熱保護會強制關機。清灰塵、確認風扇有轉、必要時重塗散熱膏。'},
],[
 {q:"電腦跳出硬碟 S.M.A.R.T. 警告，但目前還能正常開機。該怎麼做？",a:["先把資料備份出來，再安排換硬碟","還能開機就代表沒事，等真的壞了再處理就好","重灌作業系統","把警告關掉"],why:"S.M.A.R.T. 警告是硬碟在預告自己快壞了。趁還讀得到，先救資料。"},
 {q:"電腦記憶體長期用到九成以上，硬碟燈一直閃，整台很慢。最直接有效的改善是？",a:["加記憶體","換一顆更快的 CPU","把螢幕解析度調低，減少顯示卡的負擔，系統就會有比較多資源","換一條網路線"],why:"記憶體不夠時，系統會拿硬碟當記憶體用（虛擬記憶體），速度差非常多，所以硬碟燈狂閃又很慢。"},
 {q:"要幫一台電腦加裝 M.2 的 SSD，購買前最需要確認什麼？",a:["主機板的 M.2 插槽支援 SATA 還是 NVMe","SSD 的外殼顏色","只要是 M.2 的規格就一定都能用，挑容量最大、價格最便宜的買就可以了","電源供應器的瓦數"],why:"M.2 只是插槽的形狀，裡面走的可能是 SATA 或 NVMe，主機板不支援就抓不到。"},
 {q:"有人說「我們有做 RAID 1，所以不用備份」。這句話哪裡有問題？",a:["RAID 只防硬碟故障，誤刪和勒索軟體會同步到另一顆","沒有問題，RAID 1 就是兩顆硬碟互相備份，壞一顆還有另一顆","RAID 1 的速度太慢","RAID 1 至少要三顆硬碟"],why:"RAID 是為了硬碟壞掉時不中斷服務。檔案被刪、被加密，兩顆會一起變，所以不能取代備份。"},
 {q:"拿記憶體、介面卡這類零件之前，為什麼要先摸一下機殼的金屬？",a:["把身上的靜電放掉","確認主機有沒有漏電","讓手的溫度降下來，避免手太熱把零件上的晶片燙壞","這只是習慣，沒有實際作用"],why:"靜電可能把晶片打壞，而且當下看不出來。冬天和冷氣房特別容易帶靜電。"},
 {q:"公司買了一套單機版授權的軟體，同事想裝在部門的十台電腦上。可以嗎？",a:["不行，超出授權範圍，違反授權合約也可能違反著作權法","可以，反正是公司付錢買的，裝在公司的電腦上都算合理使用","可以，只要不要同時開就好","只要主管口頭同意就可以"],why:"買幾套授權就只能裝幾台（依合約）。超裝在台灣一樣有著作權的法律責任，公司和個人都可能被追究。"},
 {q:"作業系統「終止支援」（例如 Windows 10 在 2025 年 10 月終止支援）之後，繼續使用最大的問題是？",a:["不再有安全性更新，新的漏洞不會修","電腦當天就會無法開機","所有的軟體都會立刻不能執行，資料也會被微軟鎖起來不能存取","螢幕解析度會被限制"],why:"終止支援後系統還是能用，但新發現的漏洞不會再修補，等於門壞了沒人修。"},
 {q:"更新顯示卡驅動程式之後，畫面開始閃爍。最快的處理方式是？",a:["在裝置管理員把驅動程式回復到上一版","整台重灌","馬上把顯示卡送修，更新後才出問題代表硬體本來就快要壞了","換一台螢幕"],why:"更新後才出問題，先退回上一版確認。Windows 的裝置管理員有「回復驅動程式」可以用。"}
]]},
{id:'sw',ic:'📦',col:'#fbf1d9',name:'軟體',desc:'安裝、驅動、更新、相容性和授權',ranks:['軟體見習','安裝員','軟體達人'],lv:[[
 {q:'驅動程式（driver）是做什麼用的？',a:['讓作業系統能夠控制並使用硬體裝置','讓電腦上網和下載的速度變得比較快','偵測並清除電腦病毒','定期備份使用者的檔案'],why:'沒有正確的驅動，硬體接上去作業系統也不會用。'},
 {q:'廠商定期釋出的軟體更新（修補程式），最主要的目的是？',a:['修正安全漏洞和程式錯誤','讓程式的圖示變得比較好看','增加硬碟可以使用的容量','降低電腦的耗電量'],why:'沒修補的漏洞是被入侵最常見的入口，所以更新要按時上。'},
 {q:'程式安裝完打不開，訊息說缺少某個 DLL 或執行環境。先怎麼處理？',a:['安裝它需要的執行環境，例如 VC++ 可轉散發套件或 .NET','表示系統已經損壞，要把 Windows 整個重灌一次','換一台新的電腦再安裝','把防毒軟體關掉再開一次'],why:'很多程式依賴共用的執行環境，補裝對應版本就能執行。'},
 {q:'在公司的電腦上安裝軟體，哪一個做法正確？',a:['只安裝經過核准、有合法授權、來源可信的軟體','網路上找得到安裝檔的就可以裝','試用版到期後，用破解的方式延長使用沒有關係','同事用隨身碟給的版本最快最方便'],why:'來路不明或盜版軟體是惡意程式的主要來源，也有法律責任。'},
 {q:'Windows 的「相容模式」是用來做什麼的？',a:['讓舊版程式用舊版 Windows 的方式執行','加快電腦的開機速度','讓筆電的電池撐比較久','切換作業系統和程式的顯示語言'],why:'有些老程式在新版 Windows 跑不起來，可以先試相容模式。'},
 {q:'用瀏覽器開內部系統，畫面顯示怪怪的，但別人的電腦正常。先試什麼？',a:['清除快取，或用無痕視窗開一次，看是不是快取或擴充套件造成','把作業系統重灌','換一台解析度比較高、尺寸比較大的螢幕再試','換一條新的網路線'],why:'無痕視窗不帶快取和擴充套件，能很快分出是不是瀏覽器本身的問題。'},
 {q:'32 位元和 64 位元作業系統，最主要的差別是？',a:['64 位元可以使用超過 4GB 的記憶體','64 位元的系統耗電量比較低','32 位元的安全性比較高','兩者在功能上沒有任何差別'],why:'32 位元的定址空間只有 4GB，裝再多記憶體也用不到。'},
 {q:'「開源軟體」（open source）指的是？',a:['原始碼公開，依照授權條款可以使用和修改','一定免費，而且使用上沒有任何限制','沒有著作權，任何人都可以佔為己有','只能個人使用，不可以用在商業用途'],why:'開源仍然有著作權和授權條款（GPL、MIT…），用之前要看清楚條款。'},
]]},
{id:'net',ic:'🌐',col:'#dcefff',name:'網路',desc:'IP、DNS、DHCP、交換器和基本排錯',ranks:['網路見習','網路值班','網路負責人'],lv:[[
 {q:'IP 位址寫成 <code>192.168.1.10/24</code>，它的子網路遮罩是？',a:['255.255.255.0','255.255.0.0','255.0.0.0','255.255.255.255'],why:'/24 代表前 24 個位元是網路位址，也就是 255.255.255.0。'},
 {q:'DNS 的功能是什麼？',a:['把網域名稱轉換成 IP 位址','自動分配 IP 位址給電腦','把傳輸的資料加密','過濾網路上的病毒'],why:'電腦靠 IP 連線，人記名稱，DNS 負責中間的翻譯。'},
 {q:'DHCP 的功能是什麼？',a:['自動分配 IP、遮罩、閘道、DNS 給設備','把使用者輸入的網域名稱解析成 IP 位址','決定封包要往哪一條路送','阻擋外部不明的連線'],why:'沒有 DHCP 的話，每台設備都要手動設定網路參數。'},
 {q:'電腦的 IP 變成 <code>169.254.x.x</code>，代表什麼？',a:['沒有從 DHCP 拿到位址，系統自己給了一個','一切正常，這是公司內部網路常用的私有網段','這台電腦被防火牆封鎖了','DNS 伺服器故障了'],why:'169.254.0.0/16 是 APIPA：要不到 DHCP 時自動產生的位址，通常代表線路或 DHCP 有問題。'},
 {q:'用 IP 可以 ping 到伺服器，但用名稱就連不上。最可能是哪裡的問題？',a:['DNS 解析有問題','網路線接觸不良','交換器整台故障','預設閘道設定錯誤'],why:'IP 通代表線路和路由沒事，只有名稱不通就是名稱解析的問題。'},
 {q:'交換器（switch）主要是依據什麼來轉送資料？',a:['MAC 位址','IP 位址','連接埠號碼','網域名稱'],why:'一般交換器工作在第二層，靠 MAC 位址表決定從哪個埠送出。'},
 {q:'「預設閘道」（default gateway）的作用是？',a:['把要送到其他網段的封包轉送出去','把網域名稱轉換成 IP 位址','自動發放 IP 位址給電腦','把封包內容加密'],why:'同網段直接送；不同網段的封包都交給預設閘道。閘道設錯會變成只能連同網段。'},
 {q:'HTTPS 預設使用哪一個連接埠？',a:['TCP 443','TCP 80','TCP 22','TCP 3389'],why:'80 是 HTTP、22 是 SSH、3389 是遠端桌面。'},
],[
 {q:"<code>192.168.10.0/26</code> 這個網段，可以分配給主機使用的 IP 有幾個？",a:["62","64","126","254"],why:"/26 剩 6 個位元給主機，2 的 6 次方是 64，扣掉網路位址和廣播位址，可用 62 個。"},
 {q:"VLAN 的作用是什麼？",a:["在同一批交換器上切出彼此隔開的網段","讓網路的速度變成兩倍","把無線網路的訊號延伸到比較遠的樓層和角落，改善收訊不良的問題","幫每台電腦自動分配 IP"],why:"VLAN 把一台實體交換器在邏輯上切成好幾個廣播網域，不同 VLAN 要互通得經過路由。"},
 {q:"電腦 ping <code>168.95.1.1</code> 會通，但瀏覽器打網址全部開不了。最可能是哪裡有問題？",a:["DNS","網路線","網路卡壞了","電腦完全沒有連上網路，所以不管是用 IP 還是用網址都一樣連不出去"],why:"168.95.1.1 是中華電信的 DNS，ping 得到代表對外是通的。IP 通、名稱不通，就往 DNS 設定查。"},
 {q:"<code>tracert</code>（Linux 是 <code>traceroute</code>）主要用來看什麼？",a:["封包一路經過哪些節點、卡在哪一站","這台電腦開了哪些連接埠","目前的下載和上傳速度","網域名稱對應到的 IP"],why:"它會列出到目的地沿途的每一站。從哪一站開始沒回應，就是往哪裡查的線索。"},
 {q:"NAT 的主要用途是？",a:["讓使用私有 IP 的內部電腦，共用對外的 IP 上網","把網址轉換成 IP 位址","幫內部的電腦自動分配 IP、遮罩、閘道和 DNS 這些網路設定","防止交換器之間形成迴圈"],why:"私有 IP（像 192.168.x.x、10.x.x.x）在網際網路上不能直接用，出去時由 NAT 轉成對外的 IP。"},
 {q:"兩台電腦被設成同一個 IP。會出現什麼狀況？",a:["兩台的網路都會時通時不通","兩台都完全正常，速度各分一半","交換器會自動幫其中一台換一個沒有人在用的 IP，使用者不會有感覺","整個網段的電腦都會當機"],why:"IP 衝突時，網路上其他設備一下認這台、一下認那台，所以兩邊都斷斷續續。"},
 {q:"有人把一條網路線的兩頭都插在同一台交換器上，結果整層樓網路癱瘓。原因是？",a:["形成迴圈，造成廣播風暴","那條線太長，訊號衰減","交換器的連接埠全部被這一條線佔滿了，其他電腦沒有位置可以用","DHCP 的 IP 發完了"],why:"迴圈會讓廣播封包無限繞圈、越來越多。交換器開啟 STP 或迴圈偵測就是為了防這個。"},
 {q:"DNS 的 MX 紀錄是用來指定什麼？",a:["這個網域的郵件要送到哪台主機","網域名稱對應的 IPv4 位址","這個網域的別名","負責這個網域的名稱伺服器"],why:"MX 管收信。對應 IPv4 是 A 紀錄、別名是 CNAME、名稱伺服器是 NS。"}
]]},
{id:'sec',ic:'🛡️',col:'#fbe6e3',name:'資訊安全',desc:'基本觀念、常見攻擊，以及遇到事情的第一步',ranks:['資安見習','資安值班','資安守門員'],lv:[[
 {q:'資訊安全的三個基本要素（CIA）是？',a:['機密性、完整性、可用性','控制性、識別性、稽核性','加密、身分、授權','成本、效益、風險'],why:'Confidentiality、Integrity、Availability：不外洩、不被竄改、要用的時候用得到。'},
 {q:'收到一封信說「帳號異常，請立即點連結重設密碼」。應該怎麼做？',a:['不點連結，自己從官方管道登入確認，並通報資訊單位','馬上點連結把密碼改掉比較安全','先轉寄給其他同事，問他們有沒有收到一樣的信再決定','直接回信問寄件人是不是真的'],why:'這是典型的釣魚信。不點、不回、通報；轉寄會讓更多人中招。'},
 {q:'「多因素驗證」（MFA）指的是？',a:['用兩種以上不同類型的方式驗證身分，例如密碼加手機','設定兩組不同的密碼，登入時兩組都要輸入才能通過','使用一組非常長的密碼','規定每天都要更換一次密碼'],why:'因素分三類：你知道的、你持有的、你本身的。兩組密碼都屬於同一類，不算多因素。'},
 {q:'懷疑電腦中了勒索軟體。第一步應該做什麼？',a:['馬上斷開網路，不要關機，然後通報資安人員','依照畫面上的指示先付贖金，把檔案救回來再說','把電腦重新開機看會不會恢復','先把手上的工作做完再處理'],why:'斷網是為了不要擴散到別台；不關機是為了保留記憶體裡的證據。'},
 {q:'「最小權限原則」是什麼意思？',a:['只給完成工作所需要的最低權限','為了方便，每個人都給管理員權限','權限給得越多，工作效率越高','只有主管才可以擁有系統權限'],why:'權限越大，帳號被盜時的損害越大。'},
 {q:'弱點掃描和滲透測試，差別在哪裡？',a:['掃描是工具自動找已知弱點；滲透測試是人實際嘗試入侵來驗證','兩個是同一件事的不同說法','弱點掃描一定會真的入侵系統；滲透測試只是看報告','滲透測試不需要事先取得授權'],why:'兩者都要授權。掃描廣而淺，滲透測試深而有針對性。'},
 {q:'「社交工程」是什麼？',a:['利用人的信任、恐懼或好奇，騙取資料或讓人做出某些操作','一種把資料加密的技術','在社群網站上經營帳號、吸引人點擊的行銷方法','一種防火牆的規則設定'],why:'攻擊的對象是人，不是系統，所以技術再好也擋不住，要靠訓練和流程。'},

 {q:'這段 Python 會印出什麼？',code:'for i in range(3):\n    print(i)',a:['0、1、2 各一行','1、2、3 各一行','只印一個 3','印三次 i 這個字'],why:'<code>range(3)</code> 是從 0 開始數三個數：0、1、2。很多語言都是從 0 開始算。'},

 {q:'寫好一支會改資料的腳本，第一次執行應該在哪裡跑？',a:['測試環境，或先拿一份複本來跑','直接在正式環境跑，有問題再說','找離峰時間在正式環境跑就很安全了，因為那時候沒有人在用','在主管的電腦上跑'],why:'會改資料的東西先在不怕壞的地方試。離峰只是影響的人少，資料壞了一樣是壞了。'},
 {q:'版本控制（例如 Git）最主要是幫你做什麼？',a:['記錄每一次改了什麼、誰改的，改壞了可以退回去','讓程式執行的速度變快','自動幫你把程式裡的錯誤修好','把程式碼加密，讓別人沒有辦法看到內容'],why:'版本控制記的是「變更的歷史」。出事時能知道是哪一次改動造成的，也能退回上一版。'},

 {q:"這段 Python 會印出什麼？",code:"a = [10, 20, 30]\nprint(a[1])",a:["20","10","30","會出錯"],why:"串列的位置從 0 開始算，<code>a[0]</code> 是 10，<code>a[1]</code> 是 20。"},
 {q:"JSON 是什麼？",a:["一種用文字表示資料的格式，常用在系統之間交換資料","一種程式語言","微軟推出的一套資料庫管理軟體，主要用來儲存大量的結構化資料","一種加密的方法"],why:"JSON 用大括號、中括號和「名稱：值」來表示資料，人看得懂、程式也好處理，API 幾乎都用它。"},
 {q:"「API」是用來做什麼的？",a:["讓程式和程式之間，用約定好的方式互相要資料或下指令","讓使用者用滑鼠點選操作的畫面","用來測試網路速度的工具","一種專門用來掃描電腦病毒並且自動把受感染檔案隔離起來的防護軟體"],why:"API 是給程式用的窗口：照規定的格式送出請求，就會拿到約定好的回應。"},
 {q:"程式裡的 <code>try</code>／<code>except</code>（其他語言叫 try／catch）是用來做什麼的？",a:["出錯的時候接住它，自己決定要怎麼處理","讓程式重複執行","讓這一段程式執行得比較快，因為系統會優先處理包在裡面的指令","把變數的值清空"],why:"沒接住的錯誤會讓整支程式直接中斷。接住之後可以記 log、重試，或給使用者看得懂的訊息。"},
 {q:"排程自動執行的腳本，為什麼應該把執行過程寫成 log？",a:["沒人在看畫面，出事時要靠紀錄才知道做到哪、錯在哪","這樣腳本會跑得比較快","因為沒有寫 log 的腳本，作業系統的排程功能會拒絕執行它","可以讓檔案看起來比較專業"],why:"半夜自己跑的東西，隔天有問題只能靠 log。至少要記開始、結束、處理了幾筆、錯誤訊息。"},
 {q:"多人一起改同一份程式，用 Git 時比較好的做法是？",a:["各自開分支修改，測試沒問題再合併回主線","大家都直接改主線，誰先改完就誰先上傳，有衝突的時候再說","每個人各自複製一份資料夾來改","用通訊軟體把檔案傳來傳去"],why:"分支讓每個人的修改互不干擾，合併前還可以先讓別人看過。主線就能一直保持在可以用的狀態。"},
 {q:"指令或腳本執行完的「結束代碼」（exit code）是 0，代表什麼？",a:["執行成功","執行失敗","沒有任何輸出","被使用者中斷"],why:"慣例上 0 是成功，其他數字代表各種錯誤。排程和自動化工具就是靠它判斷上一步有沒有成功。"}
]]},

 const before=tierOf(g.d);SAVE[g.d.id]=SAVE[g.d.id]||{};const old=rec(g.d.id,g.l);SAVE[g.d.id][g.l]={stars:Math.max(old.stars,stars),best:Math.max(old.best,dead?0:g.score)};save();(dead?sfx.lose:sfx.win)();
 const up=tierOf(g.d)>before,pass=stars>=2;
 const head=dead?'三條命用完了，這次沒過':pass?(up?'通過！你現在是「'+titleOf(g.d)+'」':'通過！'):'考完了，但錯超過一題，還拿不到稱號';
 play.innerHTML='<div class="qcard"><span class="qno">'+g.d.ic+' '+g.d.name+'・'+TIER[g.l]+'　'+g.d.npc+'</span><p class="q">'+head+'</p><div class="big">'+'★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i></div><div>答對 '+g.right+'／'+n+' 題　分數 '+g.score.toLocaleString()+'</div>'+
  (g.miss.length?'<div><b>答錯的題目</b>'+g.miss.map(q=>'<div class="miss">'+q.q+'<small>正確答案：'+q.a[0]+'</small><small>'+q.why+'</small></div>').join('')+'</div>':'')+
  '<div class="row"><button class="btn" id="again">再考一次</button><button class="btn ghost" id="home">回訓練村</button></div></div>';
 $('again').onclick=()=>start(g.d,g.l);$('home').onclick=()=>{play.hidden=true;hub.hidden=false;hub.style.display='flex';renderHub();scrollTo(0,0);};}
if(window.initVillage3D)initVillage3D({courses:COURSES,talk:openTalk,tier:tierOf,TIER,busy:()=>!talk.hidden||hub.hidden});else build2D();
renderHub();
</script>
</body>
</html>
