['行動裝置',['行動裝置管理（MDM）可以集中套用設定、派送應用程式。','並且在裝置遺失時遠端鎖定或抹除。','手機和平板一樣存著公司的資料和信箱，也需要被管理。'],'公務手機都納入 MDM：強制螢幕鎖定、加密、自動安裝公司的應用程式。手機遺失時，從管理平台遠端抹除。','只管理電腦。手機上有公司的郵件、通訊錄和文件，卻沒有任何管理，也沒有鎖定密碼。','行動裝置能存取的資料和電腦差不多，但更容易遺失，而且常常連接各種不受管理的網路。它們和電腦一樣需要基本的安全設定和遺失時的處置能力。','手機平板也要管：套用設定、派送應用、遺失可遠端抹除。',['c',[['集中套用設定','螢幕鎖定、加密'],['派送應用程式','統一安裝和更新'],['遺失時','遠端鎖定或抹除','a']]]],
['修補',['修補合規率的報表顯示 85% 時，要關注的是剩下的 15%。','是哪些電腦、為什麼沒有更新。','沒有更新的往往是長期離線、更新失敗，或被排除的電腦。'],'逐一檢視那 15%：有些是長期出差沒有連回來、有些是磁碟空間不足而更新失敗、有些是幾年前被設為例外而沒有人記得。','看到 85% 覺得已經不錯了。攻擊者需要的只是一台沒有修補的電腦。','合規率的數字會讓人把注意力放在已經完成的部分，但風險完全來自沒有完成的部分。那些電腦通常有特定的原因，不處理原因就會一直在名單上。','合規率要看沒更新的那些：是誰、為什麼。',['c',[['85% 已更新','不是重點','off'],['15% 沒更新','長期離線｜更新失敗｜被排除','w']]]],
['端點防護',['端點防護軟體採用集中管理，除了統一設定之外還有一個重要的好處。','可以看到全公司哪些電腦偵測到威脅。','也看得到哪些電腦的防護沒有在運作。'],'管理主控台顯示：三台電腦今天偵測到惡意程式、十二台的防護元件已經一個月沒有更新、兩台的防護被停用了。','使用各自獨立的單機版防毒軟體。偵測到威脅時只有使用者自己看得到警告，而他很可能直接關掉。','單一台電腦的偵測結果是孤立的。集中之後，可以看出同樣的威脅是不是出現在很多台。防護有沒有正常運作，也只有集中管理才看得出來。','端點防護要集中管理：看得到誰中了、誰的防護沒在跑。',['c',[['單機版','警告只有｜使用者看到','w'],['集中管理','全公司的狀況｜一目了然','a']]]],
['設定基準',['安全設定基準是一組所有電腦都應該套用的標準安全設定。','例如螢幕逾時自動鎖定、關閉不必要的服務。','用群組原則或管理工具統一套用和檢查。'],'公司訂定設定基準，由管理工具套用到所有電腦，並定期檢查有沒有電腦偏離了基準。','每一台電腦的設定取決於當初是誰安裝的。有的有螢幕鎖定、有的沒有。','作業系統的預設值是為了方便而不是為了安全設計的。把需要調整的項目整理成一份明確的清單，並用工具來套用和檢查，才不依賴每個人記得去設定。','設定基準：所有電腦都套用的標準安全設定。',['f',['訂定設定基準','用工具統一套用','定期檢查','偏離的修正'],null,['a','','','']]],
['自帶裝置',['允許員工用自己的手機或筆電處理公務，最主要的風險是公司管不到裝置的安全狀態。','而資料卻在上面。','常見的做法是限制可以存取的範圍、要求基本的條件，或是把公司資料隔離在受管理的容器裡。'],'個人手機要收公司的信，必須先安裝管理元件：公司的資料放在一個獨立的工作區裡，離職時只清除那個工作區。','直接讓員工在自己的裝置上登入所有的公司系統。那台裝置有沒有更新、有沒有鎖定、家裡還有誰在用，公司完全不知道。','公司的裝置有管理、有防護。個人的裝置這些都不保證，而公司又不適合全面管理員工的私人設備。折衷的做法是只管理和公司資料有關的部分。','自帶裝置：限制範圍、要求基本條件，或把公司資料隔離。',['c',[['風險','公司管不到裝置｜資料卻在上面','w'],['做法','限制存取範圍｜要求基本條件｜隔離公司資料','a']]]],
['遺失處置',['同仁回報公務筆電遺失，資訊單位第一時間要做三件事。','遠端鎖定或抹除、停用相關的憑證、依程序通報。','有沒有加密，決定了這是設備遺失還是資料外洩。'],'接到回報後，立刻從管理平台送出遠端抹除的指令，重設使用者的密碼並撤銷這台裝置的憑證，然後通報資安窗口。','同仁怕被責怪，過了三天才回報。這三天內，上面的帳號和資料都處於沒有保護的狀態。','筆電上除了檔案，還有已經登入的帳號、保存的密碼和憑證。愈早處理，這些被利用的機會愈小。平常要讓同仁知道：遺失要立刻回報。','筆電遺失：遠端鎖定或抹除、停用憑證、通報。',['f',['回報遺失','遠端鎖定｜或抹除','停用憑證｜重設密碼','依程序通報'],null,['w','a','a','']]],
['使用者資料',['把使用者的文件資料夾重新導向到伺服器或雲端。','電腦故障或更換時，資料不會跟著不見。','資料在集中的地方才備份得到。'],'使用者的文件實際上存放在雲端。電腦突然故障，換一台新的登入之後，所有文件都在。','文件都存在各自電腦的硬碟上。硬碟故障時，才發現那台電腦從來沒有被備份。','使用者的電腦數量多、位置分散，一台一台備份很不實際。把資料集中起來，就只需要保護那一個地方。電腦變成可以隨時替換的東西。','使用者的資料導到伺服器或雲端，電腦壞了資料還在。',['c',[['存在本機','硬碟壞了就沒了｜很難備份','w'],['導到伺服器或雲端','集中備份｜換機只要登入','a']]]],
['標準化',['公司的電腦盡量採用少數幾種標準機型。','映像檔、驅動程式、備品都可以共用。','問題也比較容易重現。'],'全公司只有三種機型：一般文書、行動辦公、高效能。每一種各有一份映像檔，並各準備幾台備品。','每次採購都買當時最便宜的機型。幾年後有十幾種不同的機型，每一種都有自己的驅動、自己的問題，備品也無法通用。','每多一種機型，就多一份要維護的映像檔、一套要測試的驅動程式、一種要準備的備品。機型愈少，每一種累積的經驗愈多。','機型愈少愈好維護：映像檔、驅動、備品都能共用。',['c',[['少數標準機型','共用映像檔和備品｜問題好重現','a'],['十幾種機型','各有各的驅動｜和怪問題','w']]]]],
2:[
['部署',['零接觸部署是新電腦從原廠直接寄到同仁手上。','開機登入之後，自動完成設定和軟體的安裝。','前提是裝置已經向管理平台註冊，設定和軟體都由雲端派送。'],'新人在家收到新筆電，開機、連上網路、用公司帳號登入。接下來的一小時電腦自動套用政策、安裝軟體，完全不需要資訊人員經手。','想要採用零接觸部署，但很多設定和軟體只能在公司的內部網路裡手動處理。','傳統的做法是資訊人員先把電腦準備好再交給使用者。零接觸把這些步驟改由雲端自動完成，所以所有要做的事都必須能用政策來表達、能透過網際網路派送。','零接觸部署：電腦直接寄給使用者，登入後自動設定。',['f',['原廠直接寄出','使用者開機登入','雲端派送｜設定和軟體','自動完成'],'前提：裝置已註冊，一切都能用政策表達']],
['修補',['更新派送要分批進行，並且能夠暫停和回復。','先派給小範圍的測試群組，觀察沒有問題再擴大。','出事時影響的範圍有限，也停得下來。'],'更新先派給 5% 的電腦，兩天後有幾台出現當機。立刻暫停派送，沒有影響到其餘 95%。','一次派送給所有電腦。更新和某個驅動程式衝突，全公司有三成的電腦同時無法開機。','更新在絕大多數的電腦上沒有問題，但總有某些硬體或軟體的組合會出狀況，事前很難預測。分批派送等於讓一小部分電腦先替大家測試。','更新分批派送，要能暫停和回復。',['f',['先派給｜測試群組','觀察','有問題就暫停','沒問題再擴大'],null,['a','','w','']]],
['權限',['使用者偶爾需要安裝軟體，又不想給他永久的管理員權限。','可以用自助的軟體中心：核准過的軟體放在裡面，使用者自己安裝。','或是限時提升權限的機制，並留下紀錄。'],'使用者需要一套清單上沒有的工具。提出申請並核准後，取得三十分鐘的管理權限來安裝，時間到自動收回。','因為使用者常常來要求安裝，乾脆把他加入管理員群組，之後就一直留著。','大部分的時間使用者不需要管理權限，只有少數的時刻需要。為了這些時刻而永久給予，等於讓風險一直存在。把需求分成兩類處理：常見的做成自助，少見的用限時的方式。','要裝軟體：自助軟體中心，或限時提升權限。',['c',[['永久管理員','風險一直存在','w'],['自助軟體中心','核准過的自己裝','a'],['限時提升權限','時間到自動收回｜有紀錄','a']]]],
['加密',['全公司的筆電都啟用磁碟加密之後，復原金鑰的管理就很重要。','使用者忘記密碼或硬體更換時，沒有復原金鑰，資料就救不回來。','金鑰要集中託管、限制存取，取用要留下紀錄。'],'每台電腦的復原金鑰在啟用加密時自動上傳到管理平台。使用者被鎖在外面時，資訊人員驗證身分後查出金鑰，這次查詢會被記錄。','啟用加密時請使用者自己把金鑰印出來保管。需要的時候大部分的人都找不到。','加密的保護來自「沒有金鑰就讀不到」，這對擁有者自己也成立。主機板更換、韌體更新都可能觸發要求輸入復原金鑰。同時，這把金鑰可以解開整顆磁碟，要管控誰能取得。','復原金鑰集中託管、限制存取、取用留紀錄。',['c',[['沒有託管','需要時找不到｜資料救不回來','w'],['集中託管','限制誰能查｜查詢留紀錄','a']]]],
['合規',['端點管理平台的合規政策，是用來檢查裝置是否符合條件。','不符合的裝置，限制它存取公司的資源。','例如沒有加密、沒有更新、防護沒有開啟的裝置，不能收公司的信。'],'一台筆電的磁碟加密被關閉了。它被標記為不合規，無法再存取公司的郵件和文件，直到重新啟用加密。','訂了安全的規定但沒有任何強制的機制，是否遵守取決於每個人的自覺。','規定如果不遵守也沒有後果，就會逐漸失去效力。把合規的狀態和存取的權限連結起來，使用者自己就有動機讓裝置維持在合規的狀態。','不合規的裝置不能存取公司資源。',['f',['檢查裝置狀態','是否加密｜是否更新','不合規','限制存取｜公司資源'],null,['','','w','a']]],
['應用程式',['很多電腦上裝著早已不再維護的舊版軟體。','要先盤點哪些電腦裝了什麼，然後移除或升級。','確實還需要的，要隔離並列管。'],'盤點發現兩百台電腦上有一個已經終止支援的執行環境。其中一百八十台其實用不到，直接移除；二十台因為舊系統還需要，放在受限的網段並列冊追蹤。','不知道電腦上裝了什麼。一個舊軟體爆出嚴重漏洞時，無法回答「我們有多少台受影響」。','終止支援的軟體不會再有修補，它的漏洞會一直存在。舊的瀏覽器外掛和執行環境是很常見的入侵管道。要處理它們，第一步是知道它們在哪裡。','先盤點裝了什麼；舊軟體移除或升級，必要的隔離列管。',['f',['盤點安裝的軟體','找出不再｜維護的','移除或升級','必要的｜隔離並列管'],null,['a','','','']]],
['遠端',['同仁長期在家工作，電腦很少連回公司的網路。','更新和管理要使用可以經由網際網路運作的平台，不依賴內部網路。','只能在內網管理的工具，對遠距工作的電腦等於沒有管理。'],'改用雲端的端點管理平台之後，在家工作的電腦只要連上網際網路，就能收到更新和政策，並回報狀態。','更新伺服器只在公司的內部網路。在家工作的同仁半年沒有進辦公室，電腦也半年沒有更新。','傳統的管理工具假設電腦都在公司的網路裡。電腦長期在外面的話，這些工具就接觸不到它們。管理的通道必須和電腦實際所在的網路一致。','遠距電腦要用能經網際網路管理的平台。',['c',[['只在內網的工具','在外面的電腦｜等於沒管','w'],['經網際網路的平台','人在哪都管得到','a']]]],
['紀錄',['端點上的操作和事件紀錄，要送到集中的地方保存。','電腦被入侵或重灌之後，本機的紀錄就沒有了。','調查時最需要的那台，往往就是紀錄已經不在的那台。'],'一台電腦被入侵後，使用者自己重灌了。因為端點的紀錄平常就持續送到集中的系統，調查人員仍然可以還原入侵的經過。','紀錄只留在每一台電腦上。電腦被重灌、硬碟故障，或攻擊者清除了紀錄，就什麼都查不到了。','發生事件的電腦最有可能遭遇紀錄遺失：攻擊者會清除痕跡、使用者會重灌、設備可能故障。把紀錄即時送出去，這些情況就不會影響調查。','端點紀錄要集中保存，重灌或被清除也查得到。',['f',['端點產生紀錄','即時送到｜集中系統','電腦被重灌｜或入侵','紀錄仍然查得到'],null,['','a','w','a']]]],
3:[
['策略',['端點管理要在標準化和使用者的彈性之間取捨。','常見的平衡點是依職務分成少數幾種標準的配置。','例外要有流程。'],'公司有四種配置：一般行政、業務、開發人員、高階主管。每一種有對應的硬體、軟體和權限。特殊的需求要申請並定期重新檢視。','所有人用完全相同的配置，開發人員無法工作；或是每個人都可以要求客製，最後每一台都不一樣。','不同職務的需求確實不同。但每一種配置都要維護和測試，數量愈多成本愈高。依職務歸納出幾種類型，可以涵蓋大部分的需求。','依職務分成少數幾種標準配置；例外走流程。',['c',[['完全一致','不符合實際需求','off'],['完全自由','無法管理','w'],['少數幾種角色配置','例外走流程','a']]]],
['現代化',['從「加入網域、用群組原則」轉換到「雲端管理」的端點模式，最大的挑戰是既有的東西要逐一盤點和轉換。','包括既有的政策、軟體派送的方式、舊應用程式的相依。','常見的做法是新的電腦用新的模式，舊的電腦逐步汰換。'],'盤點出四百多條群組原則，其中一半已經沒有人知道用途。逐一檢視後只保留並轉換了一百二十條。新採購的電腦一律用雲端管理。','想要在一個週末把所有電腦一次轉換過去。大量依賴舊有設定的應用程式出現問題。','運作多年的環境累積了大量的設定，很多已經過時，但沒有人敢確定可以拿掉。轉換是清理這些的機會，但也代表每一項都要重新判斷。讓新舊兩種模式並存一段時間，可以把這個工作分散開來。','轉換到雲端管理：盤點既有政策，新機用新模式、舊機逐步汰換。',['f',['盤點既有的｜政策和派送','淘汰過時的','轉換需要的','新機用新模式｜舊機逐步汰換'],null,['a','','','']]],
['零信任',['在零信任的架構中，端點的裝置狀態是每一次存取決策的條件之一。','身分正確還不夠。','裝置是不是受管理、是不是健康，也決定了可以存取到什麼程度。'],'同一位使用者：用公司管理的、合規的筆電，可以存取所有系統；用個人的手機，只能看郵件；用一台不合規的電腦，什麼都不能存取。','只驗證使用者的身分。合法的使用者在一台已經中毒的電腦上登入，攻擊者就透過那台電腦存取了公司的資料。','存取是由「人」透過「裝置」進行的，兩者都可能有問題。帳號是真的，但裝置被入侵了，資料一樣會外洩。把裝置的狀態納入判斷，可以依風險給予不同程度的存取。','零信任除了看身分，也看裝置的狀態。',['c',[['受管理且合規','完整存取','a'],['個人裝置','有限的存取'],['不合規的裝置','拒絕','w']]]],
['生命週期',['規劃電腦的汰換，不能只看使用的年限。','還要考慮：作業系統的支援期限、新系統的硬體需求、故障率的趨勢。','作業系統終止支援的日期是硬性的期限。'],'現有的作業系統兩年後終止支援，而新版本要求的硬體規格有三成的電腦不符合。這三成列為優先汰換，並分兩年編列預算。','固定每五年汰換一次。有些電腦四年就不符合新系統的需求，有些六年還很好用。','年限只是一個粗略的指標。真正決定電腦還能不能用的，是它能不能執行受支援的作業系統，以及維修的成本。前者有明確的日期，可以提前規劃。','汰換看：系統支援期限、硬體需求、故障率，不只看年限。',['c',[['系統支援期限','硬性的期限','a'],['硬體需求','跑不跑得動新系統'],['故障率','維護成本｜是否超過汰換成本']]]],
['體驗',['端點的安全控制加得太多，會讓電腦變得很慢、使用者經常被阻擋。','結果是使用者想辦法繞過，反而更不安全。','要量測開機和登入的時間，把它當成指標來管理。'],'量測發現開機到可以工作平均要九分鐘。檢討後整併了三套功能重疊的防護軟體，時間降到三分鐘。','每發生一次事件就再加一套工具。電腦愈來愈慢，使用者開始用自己的電腦和私人的雲端空間來工作。','使用者的目標是完成工作。當安全措施讓工作變得很困難時，他們會找其他的路，而這些路通常完全不在公司的控管之內。可用性是安全的一部分。','安全控制太多會被繞過；使用體驗也要量測和管理。',['f',['控制愈加愈多','電腦變慢｜常被阻擋','使用者繞過','反而更不安全'],null,['','w','w','w']]],
['虛擬桌面',['虛擬桌面是使用者的桌面環境在機房裡執行，使用者的裝置只負責顯示。','適合的情況：資料不能落地、人員流動高、需要從各處存取同一個環境。','代價是對網路品質的依賴，以及比較高的建置成本。'],'客服中心使用虛擬桌面：資料都留在機房，人員流動時不用處理電腦，任何座位登入都是同樣的環境。','為了省錢而全面改用虛擬桌面。後端需要的伺服器、儲存和授權費用，常常比發實體電腦還高。','虛擬桌面把運算和資料從使用者的裝置移到機房。資料不在終端裝置上，遺失也沒有關係。但每一個操作都要經過網路，網路不好時體驗很差。','虛擬桌面適合資料不能落地、流動高的情境；代價是網路依賴和成本。',['c',[['適合','資料不能落地｜人員流動高｜多處存取'],['代價','依賴網路品質｜建置成本高','w']]]],
['韌體',['端點的安全也要顧到韌體和開機的流程。','作業系統以下的層級被植入惡意程式，一般的防護軟體看不到也清不掉。','安全開機、韌體更新、硬體信任根，是確保系統從開機起就可信的基礎。'],'所有電腦都啟用安全開機，韌體更新納入每季的更新作業，並設定韌體的管理密碼防止設定被更改。','只管理作業系統和應用程式的更新，韌體從出廠之後就沒有更新過。','防護軟體是在作業系統裡執行的，它信任作業系統提供給它的資訊。如果作業系統啟動之前就已經有惡意的程式在執行，它可以欺騙上面的一切，重灌也無法清除。','韌體和開機流程也要管：安全開機、韌體更新。',['c',[['作業系統以上','防護軟體看得到'],['韌體和開機流程','被植入時｜看不到也清不掉','w'],['做法','安全開機｜韌體更新','a']]]],
['度量',['向管理階層呈現端點管理的成效，最有意義的是三個指標。','修補合規率、納管率、從漏洞公布到完成修補的時間。','沒有納管的電腦不會被修補。'],'報告呈現：納管率 97%、重大更新的合規率 94%、重大漏洞從公布到九成電腦完成修補平均是九天，並和上一季比較。','報告寫「本季派送了多少個更新、處理了多少件報修」。這些是工作量，看不出風險是升高還是降低。','這三個數字直接對應被攻擊的機會：有多少電腦在管理範圍之外、有多少沒有修補、漏洞公開之後暴露多久。管理階層看得懂，可以用來追蹤改善。','端點成效看：納管率、修補合規率、修補所需時間。',['c',[['納管率','有多少在管理之內'],['修補合規率','有多少已經修補'],['修補所需時間','漏洞公布後｜暴露多久']]]]]};
LEARN.collab={0:[
['郵件協定',['寄信使用的協定是 SMTP。','收信使用 IMAP 或 POP3。','IMAP 把信留在伺服器上，多個裝置看到的內容是同步的；POP3 傳統上是把信下載到本機。'],'用 IMAP 設定信箱，在手機上讀過的信，回到電腦上也顯示為已讀。','用 POP3 並且設定下載後從伺服器刪除。信只存在那一台電腦上，電腦故障信就全部遺失。','寄信和收信是兩件獨立的事，由不同的協定處理。IMAP 的設計是信箱在伺服器上，各個裝置只是檢視它；POP3 的設計來自以前伺服器空間很小、要把信取走的年代。','寄信 SMTP，收信 IMAP 或 POP3；IMAP 多裝置同步。',['c',[['SMTP','寄信'],['IMAP','收信｜信留在伺服器｜多裝置同步'],['POP3','收信｜傳統上下載到本機']]]],
['信箱管理',['使用者的信箱滿了就收不到信。','比較好的處理是協助封存或清理舊信，並了解是不是需要調整容量。','封存是把舊信移到另一個空間，查得到又不佔用主要的信箱。'],'設定自動封存：超過兩年的信自動移到封存信箱。使用者仍然可以搜尋到這些信。','直接把容量調大。過一陣子又滿了，而且信箱愈大，搜尋和同步愈慢。','大部分的舊信很少再被打開，但使用者不願意刪除，因為「說不定哪天要用」。封存同時滿足了兩個需求：信還在、查得到，但主要的信箱保持在合理的大小。','信箱滿了：封存舊信，查得到又不佔空間。',['f',['信箱快滿了','舊信自動封存','主要信箱｜恢復空間','封存的信｜仍然查得到'],null,['w','a','','']]],
['垃圾信',['垃圾信過濾偶爾會把正常的信擋掉。','處理方式是從隔離區放行。','必要時把寄件者加入允許清單。'],'廠商說寄了報價單但沒有收到。到隔離區找到那封信並放行，並把這家廠商的網域加入允許清單。','因為誤擋了一封重要的信，就要求把過濾關掉。接下來收到的是大量的垃圾信和釣魚信。','過濾是用規則和統計來判斷的，不可能完全準確。誤判的代價是偶爾要去隔離區找信；關掉過濾的代價是每個人每天都要自己面對所有的惡意郵件。','信被誤擋：從隔離區放行，不要關掉過濾。',['c',[['從隔離區放行','加入允許清單','a'],['關掉過濾','垃圾信和釣魚信｜全部進來','w']]]],
['共用信箱',['部門對外的服務信箱要給好幾個人一起收，正確的做法是建立共用信箱。','並授權給這幾個人。','每個人用自己的身分存取。'],'客服信箱是共用信箱，授權給五位客服人員。每個人用自己的帳號登入就看得到，誰回了哪封信都有紀錄。','建立一個一般的帳號，把密碼告訴五個人。誰回了什麼信查不出來；有人離職時要改密碼並通知其他四個人。','共用密碼會失去可歸責性，也讓人員異動變得麻煩。共用信箱把「信箱」和「登入的身分」分開：信箱是大家共用的，但每個人用自己的帳號進入。','多人共收一個信箱用共用信箱，不要共用密碼。',['c',[['共用帳號密碼','查不出誰做的｜異動要改密碼','w'],['共用信箱','各用自己的身分｜異動只調權限','a']]]],
['資料外洩',['員工把公司信箱設定成自動轉寄到私人信箱，公司的資料會持續流到管不到的地方。','很多組織會直接禁止自動轉寄到外部。','這也是帳號被盜之後常見的竊取信件手法。'],'管理端設定禁止自動轉寄到外部網域，並監控有沒有新建立的轉寄規則。','為了在家方便看信而設定自動轉寄。所有的公司信件，包括機密的內容，都複製了一份到沒有任何保護的私人信箱。','自動轉寄設定一次之後就會無聲地持續運作。信一旦到了外部的信箱，公司就無法收回、無法得知誰看過。攻擊者取得帳號之後也會設定轉寄，這樣即使密碼被改了，他仍然持續收到信。','禁止自動轉寄到外部信箱。',['c',[['自動轉寄到外部','資料持續外流｜也是被盜後的常見手法','w'],['做法','禁止外部轉寄｜監控新的轉寄規則','a']]]],
['協作功能',['會議室、公務車這類資源，用行事曆的資源功能來管理。','大家看得到誰在什麼時候借用。','系統會自動擋下重複的預約。'],'要借用會議室時，在行事曆上直接看到它哪些時段有空，預約之後其他人就無法再選同一個時段。','用紙本登記或口頭約定。兩組人同時出現在同一間會議室，都說自己有預約。','共用的資源需要一個所有人都看得到、而且即時更新的狀態。行事曆本來就是用來管理時間的，把資源也當成一個可以被預約的對象，就能用同一套機制處理。','會議室等資源用行事曆管理，避免撞期。',['c',[['紙本或口頭','看不到｜容易撞期','w'],['行事曆的資源功能','看得到誰借了｜自動擋重複','a']]]],
['檔案分享',['要寄很大的檔案給外部的人，比較好的做法是放到公司核准的分享空間。','寄連結給對方，並設定權限和期限。','大的附件常常被對方的信箱拒收。'],'把 200 MB 的檔案放到公司的雲端空間，產生一個只有對方可以開啟、七天後失效的連結，用信件寄出連結。','把檔案拆成好幾封信寄，或是用個人的免費傳檔服務。前者很容易失敗，後者把公司的檔案放到了不受控管的地方。','附件寄出去之後就無法控制了。分享連結則可以設定誰能開、什麼時候失效，發現寄錯時還可以撤銷。','大檔案放核准的分享空間，寄有權限和期限的連結。',['f',['檔案放到｜核准的分享空間','設定權限｜和期限','寄出連結','到期自動失效'],null,['','a','','']]],
['釣魚信',['收到可疑的信，不確定是不是釣魚，最好的做法是不點連結也不開附件。','用回報的功能，或是轉給資訊單位。','回報讓資訊單位可以順便清掉其他人信箱裡的同一封信。'],'按下郵件軟體上的「回報釣魚」按鈕。資安單位確認是釣魚信後，把它從所有人的信箱移除。','自己判斷覺得可疑就直接刪除。自己是安全了，但其他收到同一封信的人沒有得到任何提醒。','釣魚信通常是同時寄給很多人的。一個人的回報讓資訊單位知道這封信的存在，可以在更多人點擊之前處理。','可疑的信：不點、不開，回報。',['f',['收到可疑的信','不點連結｜不開附件','回報','資訊單位｜清除同樣的信'],null,['w','','a','']]]],
1:[
['寄件者驗證',['SPF 是宣告哪些伺服器可以代表這個網域寄信。','DKIM 是為信件加上數位簽章。','DMARC 是規定驗證失敗的信要怎麼處理。三者要搭配使用。'],'公司的網域設定了這三項。有人冒用公司的網域寄信給客戶，收信方檢查之後發現沒有通過驗證，依 DMARC 的政策拒收了這封信。','只設定了 SPF。它無法單獨防止別人偽造顯示的寄件者，要搭配 DKIM 和 DMARC。','電子郵件原本的設計沒有驗證寄件者的機制，任何人都可以在寄件者欄位填上你的網域。這三項是後來加上的：前兩者讓收信方可以檢查信是不是真的來自你，第三者告訴收信方檢查不通過時該怎麼做。','SPF 宣告誰能寄、DKIM 加簽章、DMARC 定失敗時怎麼辦。',['c',[['SPF','哪些伺服器｜可以代表網域寄信'],['DKIM','為信件加簽章'],['DMARC','驗證失敗的信｜怎麼處理']]]],
['郵件路由',['別人寄到公司網域的信，是靠 DNS 的 MX 紀錄找到收信的伺服器。','更換郵件服務時，修改的就是 MX 紀錄。','改錯，或是沒有考慮 TTL，信會寄到舊的地方。'],'更換郵件服務之前，先把 MX 紀錄的 TTL 調短。切換當天修改 MX，並讓舊的伺服器繼續運作幾天，接收還在使用舊紀錄的來信。','切換當天修改 MX 之後立刻關閉舊的伺服器。接下來的一天內，還在使用快取的寄件方把信寄到已經關閉的伺服器。','寄信的伺服器要先查詢收件網域的 MX 紀錄，才知道信要送到哪裡。這個查詢的結果會被快取，所以修改之後不會立刻全部生效。','收信靠 MX 紀錄；切換時要考慮 TTL，舊伺服器先別關。',['f',['寄件方查詢｜MX 紀錄','得到收信伺服器','把信送過去'],'換郵件服務就是改 MX；注意 TTL',['','a','']]],
['排錯',['使用者說對方有寄信但自己沒收到，要先查郵件追蹤紀錄。','紀錄會顯示這封信有沒有到達、被怎麼處理。','是被收下、被隔離、被拒絕，還是根本沒有到。'],'查追蹤紀錄，發現這封信有到達，但因為附件的類型被隔離了。把它放行並告知使用者。','沒有查紀錄就請對方再寄一次，或是開始檢查使用者的電腦。同樣的原因下，再寄一次還是收不到。','一封信從寄出到出現在收件匣，中間經過很多個環節。追蹤紀錄記下了信在自己這一端的處理過程，可以直接回答「它到了沒有、去了哪裡」。','沒收到信先查郵件追蹤紀錄。',['c',[['有到，被隔離','放行'],['有到，被拒絕','看拒絕的原因'],['根本沒到','問題在寄件方']]]],
['外部分享',['雲端文件的分享連結設成「知道連結的任何人都能檢視」，風險是連結被轉傳或外流。','任何拿到連結的人都看得到。','敏感的資料要限定特定的對象，並設定到期日。'],'分享給廠商的文件設定為「只有指定的電子郵件帳號可以開啟」，並在專案結束時到期。','為了省事都用「任何人都可以檢視」的連結。連結被轉寄、被貼到群組裡，最後不知道有多少人看過。','這種連結本身就是唯一的通行證，沒有任何身分的確認。連結會被轉寄、被留在聊天紀錄和瀏覽紀錄裡。管理端也可以直接關閉這種公開連結的功能。','敏感文件不用「任何人可檢視」的連結；限定對象並設期限。',['c',[['知道連結的任何人','連結外流｜誰都看得到','w'],['限定特定對象','要登入才能開'],['設定到期日','到期自動失效','a']]]],
['離職處理',['員工離職時，他的信箱裡還有業務往來的信件。','比較好的處理是停用登入，依規定保留信箱。','並把信箱交接給主管，或轉成共用信箱。'],'離職當天停用帳號的登入；信箱轉為共用信箱並授權給他的主管，保留一年；設定自動回覆告知來信者新的聯絡窗口。','直接刪除帳號，信箱裡的業務紀錄全部消失；或是把密碼交給接手的人，讓他用離職者的身分繼續收發信。','信箱裡有兩種東西要處理：過去的業務紀錄，以及之後還會寄來的信。刪除會失去前者；讓別人用原帳號登入，則會讓「誰寄的信」變得混亂，也有責任歸屬的問題。','離職：停用登入、保留信箱、交接給主管或轉共用。',['f',['停用登入','保留信箱','交接給主管｜或轉共用信箱','設定自動回覆'],null,['a','','','']]],
['保留政策',['郵件的保留政策是依規定保存或刪除郵件。','訴訟保留是在必要時防止相關的資料被刪除。','有些資料法規要求保存幾年；發生爭議時，相關的信件不能被當事人刪掉。'],'設定保留政策：所有郵件保存七年，使用者即使刪除，系統仍然保留副本。發生法律爭議時，對相關人員的信箱啟用訴訟保留。','完全交給使用者自己決定要不要刪信。需要調閱某一段期間的信件時，才發現當事人早就刪掉了。','郵件是很多業務往來的正式紀錄，有法規和訴訟上的保存需求。這種保存不能依賴個人。由系統強制執行，才能確保該留的有留下來。','保留政策由系統強制執行；有爭議時啟用訴訟保留。',['c',[['保留政策','依規定保存｜或到期刪除'],['訴訟保留','相關資料｜不能被刪除','a']]]],
['備份',['郵件和文件放在雲端協作平台上，還是需要另外備份。','資料被誤刪或被惡意刪除，超過保留的期限之後，平台也救不回來。','業者保證的是服務可以使用，資料的保護仍然是客戶的責任。'],'公司另外用備份服務每天備份所有信箱和文件。一位離職員工在離開前刪除了大量檔案，三個月後才被發現，從備份完整還原。','認為「放在雲端，業者會處理」。資源回收筒的保留期限過了之後，資料就永久消失了。','雲端平台的備援是為了它自己的服務不中斷，不是為了讓個別客戶回到過去的某個時間點。使用者刪除檔案是正常的操作，平台會照做。','雲端協作平台上的資料也要另外備份。',['c',[['業者保證','服務可以使用'],['客戶負責','資料的誤刪｜和惡意刪除','w']]]]],
2:[
['寄件者驗證',['DMARC 的政策要從「只監看」逐步調整到「拒絕」，不能一步到位。','要先確認所有合法的寄信來源都已經通過驗證。','否則自己的信會被擋掉。'],'先設定為只監看並收集報告三個月。報告顯示行銷平台和某個內部系統寄的信沒有通過驗證。把它們設定好之後，才逐步改成隔離、再改成拒絕。','一開始就設定為拒絕。公司的電子報、系統的通知信、委外廠商代寄的信全部被收信方拒收。','代表公司網域寄信的來源，通常比想像中多。這些來源很多沒有設定好驗證。監看模式會回報所有以公司網域寄出的信和它們的驗證結果，讓你先把清單找齊。','DMARC 先監看、找齊合法的寄信來源，再逐步改成拒絕。',['f',['只監看｜收集報告','找出所有｜合法的寄信來源','逐一設定好驗證','再改成隔離｜和拒絕'],null,['a','','','']]],
['帳號安全',['使用者的信箱被盜之後，攻擊者最常做的是建立隱藏的轉寄或收件匣規則。','用來持續偷看信件。','所以處理被盜的帳號，除了改密碼，還要檢查規則、轉寄設定和已經授權的應用程式。'],'處理被盜的帳號時發現一條規則：把所有含「發票」的來信轉寄到外部信箱並從收件匣刪除。移除這條規則並撤銷所有的登入工作階段。','只改了密碼就當作處理完成。攻擊者設定的轉寄規則還在，每一封信仍然持續送到他那裡。','攻擊者知道密碼遲早會被改，所以登入後的第一件事就是建立不依賴密碼的持續存取。轉寄規則一旦設定，就會自動運作。授權給第三方應用程式的存取權也是一樣，改密碼不會讓它失效。','帳號被盜：改密碼之外，檢查規則、轉寄和已授權的應用。',['c',[['改密碼','只是第一步'],['收件匣規則｜和轉寄設定','要檢查並移除','a'],['已授權的應用程式','要檢查並撤銷','a']]]],
['舊式驗證',['郵件的舊式驗證協定只使用帳號和密碼，不支援多因素驗證。','它是密碼噴灑攻擊的主要目標。','開著它，等於多因素驗證有一個後門。'],'公司全面啟用了多因素驗證，但舊式的驗證還開著。攻擊者透過舊式協定只用密碼就登入了信箱。停用舊式驗證之後這條路才關閉。','認為「我們已經啟用多因素驗證了」，沒有注意到舊的協定還允許只用密碼登入。','多因素驗證是加在新式的登入流程上的。舊的協定設計在這之前，沒有辦法進行第二個步驟的驗證，所以只要它還開著，就可以只用密碼登入。','停用舊式驗證，否則 MFA 有後門。',['c',[['新式驗證','支援多因素驗證'],['舊式驗證','只用密碼｜繞過多因素驗證','w']]]],
['資料治理',['協作平台上的團隊和共用空間會愈建愈多，很多已經沒有人在使用。','要訂定建立的規則、指定負責人。','並有到期檢視的機制。'],'每個團隊空間建立時要有兩位負責人，每年要確認是否還需要，沒有回應的空間會被封存。','任何人都可以隨意建立，沒有任何管理。幾年後有幾千個空間，其中很多的負責人已經離職。','建立一個空間很容易，但沒有任何事件會促使人去關閉它。沒有人管理的空間裡留著舊的資料，權限還是當初設定的樣子。','共用空間要有建立規則、負責人和到期檢視。',['f',['建立時｜指定負責人','定期確認｜是否還需要','沒有回應｜就封存'],null,['a','','']]],
['外部協作',['要讓外部的廠商加入協作平台一起工作，應該以來賓的身分邀請。','限定他們可以存取的範圍，並定期檢視。','合作結束之後，來賓帳號和分享連結要收回。'],'廠商的人員以來賓身分加入特定的專案空間，只看得到那個空間裡的內容。每季檢視來賓的清單，專案結束時全部移除。','直接幫廠商的人員建立公司的正式帳號。他們可以看到公司內部很多不相關的內容，專案結束後帳號也沒有人記得刪除。','外部人員需要的只是和這個專案有關的東西。來賓的身分讓他們的存取範圍和內部員工有明確的區別。他們不在公司的人事流程裡，所以需要另外的定期檢視。','外部人員用來賓身分、限定範圍、定期檢視、結束收回。',['c',[['來賓身分','和內部員工區隔'],['限定範圍','只看得到專案的內容'],['定期檢視','結束就收回','a']]]],
['可用性',['郵件服務中斷時，組織要有事先準備的替代通訊管道。','以及對外說明的方式。','應變計畫常常寫「用郵件通知」，但郵件本身就是掛掉的那一個。'],'應變計畫規定：郵件中斷時改用指定的通訊群組和電話聯絡，並有一份不存放在郵件系統裡的緊急聯絡清單。','所有的通知和聯絡清單都在郵件系統裡。郵件中斷時，連「郵件中斷了」這件事都無法通知大家。','郵件是大部分組織預設的溝通管道，應變計畫很自然地假設它存在。但它也是會中斷的服務。替代的管道要事先約定好、大家都知道，而且不能依賴中斷的那個系統。','郵件中斷的替代管道要事先約定，而且不能依賴郵件。',['c',[['替代的通訊管道','事先約定好'],['緊急聯絡清單','不存放在郵件系統裡','a'],['對外說明','怎麼通知客戶']]]],
['保護',['針對郵件中的惡意連結和附件，進階的防護有兩種做法。','附件：先在隔離的環境裡開啟，觀察它的行為。','連結：在使用者點擊的當下重新檢查。'],'一封信在寄達時連結指向的是正常的頁面，兩小時後被換成釣魚頁面。使用者點擊時，系統重新檢查並擋了下來。','只在信件寄達的時候掃描一次。攻擊者刻意在寄出之後才把連結的內容換成惡意的。','傳統的掃描是比對已知的惡意特徵，新的惡意附件沒有特徵可以比對，所以改成實際執行它看它做什麼。連結指向的內容可以隨時改變，所以要在使用者真正要連過去的那一刻判斷。','附件在隔離環境開啟；連結在點擊當下再檢查。',['c',[['附件','在隔離環境開啟｜觀察行為'],['連結','點擊的當下｜重新檢查','a']]]],
['遷移',['把郵件系統搬到另一個平台，信箱本身是比較容易的部分。','最容易被低估的是周邊的盤點：共用信箱、權限和委派關係、轉寄規則。','以及各個系統寄信的設定。'],'遷移前盤點出：四十個共用信箱、兩百多筆「誰可以代理誰」的權限、六十個會寄通知信的內部系統。這些都要逐一處理。','只計算有多少個信箱和多少資料量。切換之後，多功能事務機寄不出掃描檔、系統的通知信全部失敗、助理看不到主管的行事曆。','郵件系統運作多年之後，有很多東西依附在它上面，大部分是當初個別設定的，沒有集中的紀錄。這些才是遷移工作的主要部分。','郵件遷移最難的是周邊：共用信箱、權限、規則、系統寄信。',['c',[['信箱本身','好搬','off'],['共用信箱和權限','要逐一盤點','a'],['系統的寄信設定','最容易漏掉','a']]]]],
3:[
['策略',['組織裡同時有好幾套功能重疊的協作工具時，資料會散落在各處。','要依用途訂出各自的定位，或是整併。','資料分散，就找不到、管不到，離職交接也交不完整。'],'公司訂定：正式的文件放在甲平台、即時討論用乙工具、對外的檔案傳輸用丙服務，其他的工具不得用於公務。','各部門各自選用喜歡的工具。同一個專案的資料分散在三個地方，新加入的人不知道要去哪裡找。','每一套工具都是一個資料存放的地方，都需要管理權限、備份和保留。工具愈多，這些工作愈多，而且資料會不可避免地散開。','協作工具要定位或整併，避免資料散落。',['c',[['多套重疊的工具','資料散落｜找不到、管不到','w'],['訂出定位或整併','知道什麼放哪裡','a']]]],
['合規',['法規要求特定的通訊紀錄保存數年而且不可竄改時，要由平台強制執行。','設定保留政策和不可刪除的保存機制。','範圍要包含聊天的訊息。'],'平台設定：特定部門的郵件和聊天訊息保存七年，期間內使用者無法永久刪除，管理者也無法修改保存的內容。','只規定「同仁不得刪除相關的紀錄」。實際上有人會刪，而且無從得知。另外只處理了郵件，沒有涵蓋聊天工具。','靠使用者自律無法滿足法規的要求。保存要做在平台的層次，讓刪除在技術上不可能。現在很多重要的業務溝通發生在聊天工具裡，這些同樣屬於要保存的紀錄。','法規要求的保存要由平台強制，並包含聊天訊息。',['c',[['靠使用者自律','做不到','w'],['平台強制保留','期間內無法刪除｜包含聊天訊息','a']]]],
['資料分類',['在協作平台上對文件套用敏感度標籤，可以依分類自動套用保護。','例如加密、浮水印、分享的限制。','保護是跟著文件走的，檔案被轉寄出去之後仍然有效。'],'標記為「機密」的文件會自動加密，只有公司內部的帳號可以開啟。即使檔案被寄到外部，對方也打不開。','只在儲存的位置設定權限。檔案被下載之後，原本的權限就不存在了。','傳統的權限是設定在資料夾或系統上的，檔案一離開就失去保護。標籤把保護的規則附加在檔案本身，不管檔案被複製到哪裡，開啟時都要通過同樣的檢查。','敏感度標籤：保護跟著文件走，寄出去也有效。',['f',['套用敏感度標籤','自動加密｜和限制分享','檔案被轉寄出去','保護仍然有效'],null,['a','','','a']]],
['身分',['協作平台是組織最常被攻擊的入口。','除了多因素驗證，還需要條件式存取和異常登入的偵測。','登入之後的行為也要注意：不尋常的地點、大量下載、新增的轉寄規則。'],'一個帳號從沒去過的國家登入，接著建立了一條轉寄規則並開始大量下載文件。系統偵測到這個模式，自動中止工作階段並要求重新驗證。','啟用多因素驗證之後就認為帳號安全了。權杖被竊取、使用者被騙去核准，都可以繞過它。','驗證只在登入的那一刻發生。攻擊者有很多方法取得一個已經通過驗證的工作階段。所以還需要持續觀察：這個帳號現在的行為像不像它平常的樣子。','除了 MFA，還要條件式存取，並監看登入後的異常行為。',['c',[['多因素驗證','基本'],['條件式存取','依裝置、位置判斷'],['行為偵測','異常地點、大量下載｜新增轉寄規則','a']]]],
['第三方應用',['使用者授權第三方應用程式讀取他的信箱，那個應用程式就取得了持續的存取權。','這種授權不需要密碼，改密碼也不會失效。','治理上要限制使用者可以授權的範圍，並定期檢視。'],'設定為使用者只能授權經過核准的應用程式，其他的要由管理者審核。每季檢視所有已經授權的應用程式和它們的權限。','讓使用者可以自由授權任何應用程式。攻擊者做了一個看起來像正常工具的應用，騙使用者按下同意，從此可以讀取他所有的信件。','授權是使用者主動給予的，所以不需要他的密碼，也不會觸發多因素驗證。它是獨立於密碼之外的存取途徑。攻擊者利用這一點，把騙取密碼改成騙取授權。','限制可授權的第三方應用，並定期檢視。',['c',[['風險','取得持續的存取權｜改密碼也不會失效','w'],['治理','只能授權核准的應用｜定期檢視','a']]]],
['韌性',['所有的通訊和文件都在同一家雲端平台上時，要考慮兩種狀況。','平台中斷，以及帳號被鎖定。','至少要有平台之外的緊急聯絡方式，以及關鍵資料的獨立副本。'],'準備了不依賴這個平台的緊急聯絡管道；最關鍵的文件（例如應變計畫、聯絡清單）另外保存一份在平台之外。','應變計畫本身就存放在這個平台上。平台中斷時，連計畫都打不開。','把所有東西集中在一個平台有很多好處，但也讓這個平台成為單一的依賴。它出問題時，溝通和資料會同時失去。需要為「它不在的時候」保留最低限度的能力。','平台之外要有：緊急聯絡方式、關鍵資料的獨立副本。',['c',[['平台中斷｜或帳號被鎖','通訊和文件同時失去','w'],['準備','平台外的聯絡管道｜關鍵資料的獨立副本','a']]]],
['AI 助理',['導入能讀取使用者所有文件和信件的 AI 助理之前，最該先檢查現有的權限是不是過寬。','它會把使用者「看得到」的內容都找出來。','原本靠「沒有人知道放在哪裡」保護的資料，會被一句話問出來。'],'導入前盤點權限，發現有一個存放薪資資料的資料夾被設定為「全公司都可以讀取」。過去沒有人注意到它，但 AI 助理會把裡面的內容納入回答。先修正權限再導入。','直接啟用。員工問了一個一般的問題，助理的回答裡引用了他本來不應該看到的文件。','AI 助理是用使用者本人的權限去搜尋的，所以技術上它沒有越權。問題在於很多資料的權限設定本來就太寬，只是因為沒有人會去翻而沒有造成問題。助理移除了「找不到」這一層實際上的保護。','導入 AI 助理前先收斂過寬的權限。',['f',['盤點現有權限','找出過寬的','修正','再導入 AI 助理'],null,['a','w','','']]],
['度量',['評估協作平台的導入是否成功，要看的是實際的使用行為。','以及業務流程是不是因此改善。','買了沒有人用，或只是把舊的習慣搬到新的工具上，都不算成功。'],'觀察發現：文件仍然以附件的方式在郵件裡來回傳送，共同編輯的功能幾乎沒有人用。於是針對這個情境安排實作訓練，並追蹤使用方式的變化。','用「已啟用的帳號數」來宣告導入成功。所有人都有帳號，但工作的方式完全沒有改變。','導入工具的目的是改變工作的方式，讓協作更有效率。授權數和登入次數只能說明工具可以被使用，不能說明它有沒有被用來解決問題。','導入成不成功，看工作方式有沒有真的改變。',['c',[['啟用的帳號數','只是可以使用','off'],['實際的使用行為','工作方式｜有沒有改變','a']]]]]};
LEARN.dev={0:[
['需求',['需求還沒講清楚就開始寫，最常見的後果是做出來的不是對方要的。','動手之前先確認「做到什麼程度算完成」。','用對方的話複述一次，是最便宜的確認方式。'],'對方說「要一張報表」。先問清楚：給誰看、多久看一次、要哪些欄位、資料從哪裡來。問完發現他要的其實是每天自動寄出的一封通知信。','覺得先做出來再改比較快。做了一個星期，展示時對方說「我要的不是這個」。','寫程式的成本遠高於問問題的成本。需求的誤解愈晚發現，要重做的東西愈多。花一小時問清楚，常常可以省掉一個星期的重工。','先確認「做到什麼算完成」再動手。',['f',['聽到需求','問清楚｜完成的標準','複述給對方確認','開始寫'],null,['','a','a','']]],
['測試',['單元測試是確認每一小段程式的行為符合預期。','改動程式時，測試能馬上告訴你有沒有改壞。','它不能取代整合測試和實際操作的驗證。'],'修改了計算折扣的函式，執行測試後有兩個測試失敗：原來的寫法處理了一個自己沒有注意到的特殊情況。','覺得寫測試浪費時間。半年後沒有人敢修改那段程式，因為不知道改了會影響什麼。','程式會一直被修改，而人記不住每一段程式原本要處理的所有情況。測試把這些預期寫成可以自動執行的檢查，每次修改後重跑一次，就知道原本的行為還在不在。','有測試保護，才敢放心改舊程式。',['f',['修改程式','執行測試','失敗：改壞了','通過：行為沒變'],null,['','a','w','']]],
['版本控制',['Git 合併時出現衝突，代表兩邊改到了同一段程式。','Git 沒有辦法自動決定要保留哪一個。','衝突不是錯誤，是 Git 請你來判斷。'],'合併時出現衝突：同事修改了一個函式的參數，你修改了同一個函式的內容。看懂兩邊各改了什麼之後，把兩個修改都保留下來。','看到衝突就選擇「全部用我的版本」。同事的修改被整段蓋掉，而且沒有人發現。','兩個人修改不同的地方，Git 可以自動合併。修改同一個地方時，哪一個才是對的取決於程式的意圖，這只有人能判斷。直接蓋掉其中一邊，等於把別人的工作刪除。','衝突是請你判斷：看懂兩邊改了什麼再決定。',['c',[['衝突的意思','兩邊改到｜同一段程式'],['正確的處理','看懂兩邊的修改｜再決定怎麼合','a'],['錯誤的處理','整段蓋掉別人的','w']]]],
['HTTP',['HTTP 狀態碼 404 是找不到這個資源。','500 是伺服器端的程式出錯。','4 開頭通常是請求這一邊的問題，5 開頭是伺服器那一邊的問題。'],'使用者回報網頁打不開。看到狀態碼是 404，先檢查網址有沒有打錯；如果是 500，就去看伺服器的錯誤紀錄。','不看狀態碼，只看到「網頁壞了」就開始到處檢查。','狀態碼的第一個數字直接指出問題在哪一邊，這是排錯時最快的第一步。2 開頭是成功，3 開頭是轉址。','4 開頭是請求端的問題，5 開頭是伺服器端的問題。',['c',[['2xx','成功'],['4xx','請求端的問題｜404 找不到'],['5xx','伺服器端的問題｜500 程式出錯','w']]]],
['API',['刪除資料不應該用 GET 來做。','GET 應該只用來讀取。','瀏覽器、爬蟲、掃描工具都可能自動去開啟連結。'],'把「刪除」做成一個 GET 的連結。搜尋引擎的爬蟲沿著頁面上的連結逐一開啟，資料就被刪除了。改用 DELETE 或 POST 之後，爬蟲不會觸發它。','認為「反正都是送出一個請求，用哪一種方法都一樣」。','GET 被預期是安全、可以重複執行而沒有副作用的，所以很多軟體會主動去開啟 GET 的連結：瀏覽器的預先載入、搜尋引擎、郵件的連結掃描。會改變資料的動作要用其他的方法。','GET 只用來讀取；會改變資料的動作用其他方法。',['c',[['GET','只讀取｜可能被自動觸發'],['POST、PUT、DELETE','新增、更新、刪除','a']]]],
['日誌',['密碼、金鑰、完整的身分證字號這類敏感資料，不應該寫進 log。','log 的存取權限通常比資料庫寬鬆。','log 還會被送到其他系統。'],'寫 log 時記錄「使用者 A 登入成功」，而不是把整個登入請求的內容（包含密碼）印出來。','為了除錯方便，把收到的請求內容完整寫進 log。裡面包含了使用者的密碼和信用卡號。','資料庫有嚴格的存取控制，但 log 常常是很多人都能看的，而且會被複製到監控系統、備份和問題單裡。敏感資料寫進去，等於多了好幾個外洩的地方。','敏感資料不寫進 log。',['c',[['可以寫','誰、何時、做了什麼｜結果是什麼','a'],['不能寫','密碼、金鑰｜完整的身分證字號','w']]]],
['輸入驗證',['網頁上用 JavaScript 檢查過輸入，後端還是要再檢查一次。','前端的檢查可以被繞過。','前端的檢查是為了使用體驗，後端的檢查才是為了安全。'],'網頁限制數量只能輸入 1 到 10。有人不經過網頁，直接對 API 送出數量為 -5 的請求。因為後端也做了檢查，這個請求被拒絕。','認為「網頁上已經擋住了，使用者不可能輸入不合法的值」。','前端的程式是在使用者自己的瀏覽器裡執行的，使用者可以修改它，也可以完全不使用網頁而直接送出請求。伺服器收到的任何資料都可能是任意的內容。','前端檢查是體驗，後端檢查才是安全；兩邊都要做。',['c',[['前端檢查','為了使用體驗｜可以被繞過'],['後端檢查','一定要做','a']]]],
['執行環境',['開發、測試、正式環境要分開。','避免還沒測好的程式或測試資料影響到正式的服務。','分開之後可以放心嘗試，試壞了也沒有關係。'],'新功能先在開發環境完成，再到測試環境驗證，確認沒有問題才部署到正式環境。','為了快，直接在正式環境上修改程式。一個小錯誤讓整個服務中斷。','正式環境上有真實的使用者和資料，任何錯誤都會直接造成影響。開發的過程一定會出錯，所以需要一個出錯也沒有後果的地方。','開發、測試、正式環境分開，不在正式環境直接改。',['f',['開發環境','測試環境','正式環境'],'每一關確認沒問題才往下走',['','','a']]]],
1:[
['網站安全',['網頁把使用者輸入的內容原封不動顯示出來，別人開啟頁面時就可能被執行惡意的 JavaScript。','這是跨站腳本（XSS）。','防護的方法是輸出到頁面時依情境做編碼。'],'有人在留言裡輸入一段 script 標籤。因為輸出時做了編碼，瀏覽器把它顯示成一串文字，沒有執行。','只在輸入的時候過濾掉幾個危險的字串。攻擊者換一種寫法就繞過了。','瀏覽器無法分辨頁面上的內容哪些是網站原本的程式、哪些是使用者輸入的資料。編碼把有特殊意義的字元轉換成只會被顯示的形式，讓瀏覽器把它當成文字而不是程式。','XSS：輸出到頁面時要編碼，讓它是文字不是程式。',['c',[['沒有編碼','輸入的內容｜被當成程式執行','w'],['輸出時編碼','只會被顯示成文字','a']]]],
['錯誤處理',['把完整的錯誤堆疊和 SQL 語句顯示在使用者的畫面上，會洩漏系統內部的結構。','這些是攻擊者需要的線索。','詳細的錯誤寫進 log；給使用者的只要一句看得懂的訊息和一個可以回報的代碼。'],'程式出錯時，使用者看到「系統忙碌中，請稍後再試（代碼 A1B2）」。工程師用這個代碼在 log 裡找到完整的錯誤內容。','把資料庫的錯誤訊息直接顯示出來，裡面有資料表的名稱、欄位的名稱和查詢的語句。','錯誤訊息的詳細內容是給開發人員排錯用的，對使用者沒有幫助，卻告訴了攻擊者系統使用什麼技術、資料長什麼樣子。用代碼把兩者連結起來，可以同時滿足兩邊的需要。','詳細錯誤寫進 log；使用者只看到簡單的訊息和代碼。',['c',[['給使用者','看得懂的訊息｜和回報用的代碼','a'],['寫進 log','完整的錯誤內容'],['不要做','把堆疊和 SQL｜顯示在畫面上','w']]]],
['版本控制',['正式環境要緊急修正時，從正式的版本開一個修補分支。','修好之後合併回正式和開發兩邊。','語意化版本的格式是「主版號.次版號.修訂號」，主版號變動代表有不相容的重大變更。'],'正式環境出現嚴重的問題，而開發分支上有很多還沒測完的新功能。從正式版本開分支只修這一個問題，上版之後再把修正合併回開發分支。','直接把開發分支上版來修正問題，同時也把沒有測試過的新功能帶上去了。或是修完沒有合回開發分支，下次上版時問題又出現。','緊急修正要愈小愈好，只包含必要的改動。開發分支上的內容還沒有準備好。修正也必須回到開發分支，否則下一個版本是從沒有修正的程式產生的。','緊急修正從正式版本開分支，修完合回兩邊。',['f',['從正式版本｜開修補分支','只修這個問題','合併回正式','也合併回開發'],'2.4.1 → 3.0.0：主版號變動，有不相容的變更',['a','','','a']]],
['密碼儲存',['儲存密碼不該用 MD5 或 SHA-1，要用 bcrypt、Argon2 這類演算法。','後者是刻意設計得很慢，讓暴力破解的成本變高。','它們的運算成本可以調整，而且內建加鹽。'],'資料庫外洩了。因為密碼是用 Argon2 處理的，攻擊者每秒只能嘗試很少的組合，大部分的密碼在合理的時間內無法被破解。','用 SHA-256 計算密碼的雜湊值就存起來，認為「雜湊是不可逆的所以安全」。','一般的雜湊演算法是為了速度設計的，顯示卡一秒可以計算幾十億次。攻擊者不需要反推，只要把常見的密碼逐一算過來比對。密碼專用的演算法讓每一次嘗試都很昂貴。','密碼用 bcrypt、Argon2：刻意慢，又內建加鹽。',['c',[['MD5、SHA-1','算得很快｜容易被暴力破解','w'],['bcrypt、Argon2','刻意設計得很慢｜內建加鹽','a']]]],
['授權檢查',['使用者把網址上的 id 改成別的號碼就看到別人的資料，問題出在只檢查了有沒有登入。','沒有檢查這筆資料是不是他的。','驗證是「你是誰」，授權是「你能做什麼」。'],'查詢訂單時，後端除了確認使用者已經登入，還檢查這張訂單的擁有者是不是這位使用者。不是的話就拒絕。','認為「使用者不會知道別人的編號」。編號通常是連續的，改一個數字就能試出來。','登入只證明了使用者的身分，不代表他可以存取所有的資料。每一次存取資料，都要在後端檢查這位使用者和這筆資料的關係。不能依賴隱藏網址或在畫面上不顯示。','每次存取資料都要在後端檢查「這筆是不是他的」。',['c',[['驗證','你是誰'],['授權','你能做什麼','a'],['常見的漏洞','只檢查登入｜沒檢查擁有者','w']]]],
['測試',['程式要呼叫第三方的金流 API，自動化測試時要用模擬的替身，或對方提供的測試環境。','測試要能重複執行，不能產生真實的副作用。','把外部服務隔開，也才能測到對方回應錯誤或逾時的情況。'],'測試時用替身模擬金流服務：分別設定它回應成功、回應失敗、完全沒有回應，確認程式在這三種情況下的行為都正確。','測試時直接呼叫正式的金流服務。每跑一次測試就產生一筆真實的交易。','自動化測試會被執行很多次，不能每次都對外部產生影響。真實的服務也很難配合產生錯誤的情況，但程式處理錯誤的部分正是最需要測試的。','外部服務用替身或測試環境，也要測失敗和逾時。',['c',[['呼叫正式服務','產生真實的交易','w'],['用替身或測試環境','可以重複執行｜能模擬錯誤和逾時','a']]]],
['文件',['一個專案的 README，最基本要讓讀的人知道這是什麼，並且能把它執行起來。','內容包括：這是做什麼的、怎麼安裝、怎麼啟動、設定放在哪裡。','接手的人也包括半年後的自己。'],'新同事拿到專案，照著 README 的步驟，三十分鐘內就在自己的電腦上把系統執行起來。','沒有 README，或是內容已經過時。新同事花了三天，問了五個人，才把環境建立起來。','開發的人很清楚怎麼執行自己的專案，所以不覺得需要寫下來。但這些知識只存在他的腦中，人員異動或時間久了就會消失。','README：這是什麼、怎麼安裝、怎麼啟動、設定在哪。',['c',[['這是什麼','用途'],['怎麼跑起來','安裝和啟動的步驟','a'],['設定','放在哪裡、要改什麼']]]]],
2:[
['網站安全',['使用者登入網站之後又開啟了惡意網站，惡意網站偷偷以他的身分送出請求。','這是跨站請求偽造（CSRF）。','常見的防護是防偽權杖和 SameSite Cookie。'],'轉帳的表單裡有一個伺服器產生的隨機權杖。惡意網站送出的請求沒有這個權杖，伺服器拒絕處理。','認為「使用者已經登入了，他送來的請求就是他本人的意思」。','瀏覽器對某個網站送出請求時會自動帶上這個網站的 Cookie，不管請求是從哪一個頁面發起的。所以伺服器光看 Cookie 無法分辨請求是不是來自自己的頁面，需要另外的方法確認。','CSRF：用防偽權杖和 SameSite Cookie 確認請求來自自己的頁面。',['f',['使用者已登入','開啟惡意網站','惡意網站送出請求｜自動帶上 Cookie','沒有防偽權杖｜伺服器拒絕'],null,['','w','w','a']]],
['API',['付款 API 要讓用戶端帶一個唯一的請求識別碼（冪等鍵），伺服器對同一個識別碼只處理一次。','這樣逾時重送就不會扣兩次款。','對外的 API 要加上速率限制，防止單一來源在短時間內大量呼叫。'],'付款請求逾時，用戶端帶著同一個識別碼重送。伺服器發現這個識別碼已經處理過，直接回傳上一次的結果。','假設網路是可靠的、請求只會送達一次。使用者被扣了兩次款。','網路逾時的時候，用戶端無法知道請求有沒有被處理，只能重送。所以重送一定會發生，設計上要讓它是安全的。速率限制則是保護服務不被一支寫壞的程式或攻擊者拖垮，也防止登入的 API 被用來猜密碼。','冪等鍵讓重送安全；速率限制防止被打掛。',['c',[['冪等鍵','同一個識別碼｜只處理一次','a'],['速率限制','限制單一來源｜的呼叫頻率','a']]]],
['快取',['把查詢結果放進快取可以加速。','最需要小心的是原始資料變更時，快取要怎麼更新或失效。','要想清楚三件事：多久過期、資料改了由誰去清除、可以接受多舊的資料。'],'商品的價格快取五分鐘，而修改價格時會主動清除這項商品的快取。','把資料放進快取之後就沒有再處理。價格已經修改了，使用者看到的還是舊的價格。','快取是資料的一份副本，副本和原始資料會有不一致的時候。快取的每一個設計決定，都是在速度和資料的新舊之間取捨。不同的資料可以接受的程度不一樣。','用快取要想清楚：資料改了，快取怎麼辦。',['c',[['多久過期','可以接受多舊'],['資料改了','誰去清除快取','a'],['沒處理','使用者看到舊資料','w']]]],
['系統整合',['兩個系統之間改用訊息佇列傳遞工作，而不是直接互相呼叫。','對方暫時故障或變慢時，工作先排著，不會一起被拖垮。','尖峰時佇列也是緩衝。'],'訂單系統把「寄送通知」的工作放進佇列就繼續處理下一筆。通知系統故障了一小時，恢復之後把佇列裡累積的工作逐一處理完。','訂單系統直接呼叫通知系統並等待結果。通知系統變慢時，下訂單也跟著變慢，最後兩個都無法使用。','直接呼叫讓兩個系統的可用性綁在一起。佇列讓兩邊解耦：送出的一方不必等待，接收的一方依照自己的速度處理。','訊息佇列讓兩邊解耦：對方掛了，工作先排著。',['f',['送出方｜放進佇列','佇列｜暫存工作','接收方｜依自己的速度處理'],'接收方故障時，工作留在佇列裡',['','a','']]],
['部署策略',['這次上版同時修改了資料庫的結構和程式。','資料庫的變更要同時相容新舊兩個版本的程式。','這樣才能逐步切換，也才能退版。'],'要把一個欄位改名。分成三次上版：先新增新的欄位並同時寫入兩邊；再把程式改成讀取新的欄位；確認穩定後才移除舊的欄位。','一次上版就把欄位改名。部署的過程中舊版的程式找不到欄位而出錯；想要退版時，舊的程式也無法執行了。','部署不是瞬間完成的，過程中新舊兩個版本的程式會同時存在。退版時則是舊的程式要面對新的資料庫結構。不相容的變更要拆成多次，每一次都維持相容。','資料庫變更要同時相容新舊程式；不相容的拆成多次上版。',['f',['新增新欄位｜兩邊都寫','程式改讀新欄位','確認穩定','移除舊欄位'],'每一步都能退版',['a','','','']]],
['可觀測性',['一個請求會經過好幾個服務。','每個請求帶一個追蹤識別碼，一路傳下去，並寫進每一筆紀錄。','排查問題時，用這個識別碼就能把各個服務的紀錄串在一起。'],'使用者回報下單失敗。用這個請求的追蹤識別碼搜尋，看到它經過了四個服務，在第三個服務出現逾時。','用時間來比對各個服務的紀錄。請求量一大，同一秒有幾百筆紀錄，無法分辨哪些屬於同一個請求。','每個服務只知道自己處理了什麼，不知道這個請求之前和之後發生的事。共同的識別碼是把這些片段連接起來的唯一可靠方法。','每個請求帶追蹤識別碼，一路傳下去並寫進紀錄。',['f',['請求進入｜產生識別碼','服務 A｜記錄識別碼','服務 B｜記錄識別碼','用識別碼｜搜尋全程'],null,['a','','','a']]],
['身分驗證',['系統需要登入和授權的功能時，採用成熟的標準和框架。','例如 OAuth 2.0 和 OpenID Connect。','身分驗證的細節非常容易出錯。'],'使用經過廣泛使用和檢驗的函式庫來實作登入，並依照它的建議設定。','自己設計一套登入和權杖的機制。看起來可以運作，但有好幾個沒有想到的漏洞。','身分驗證有非常多的細節，每一個處理不好都是漏洞，而且很多攻擊手法不是直覺想得到的。成熟的標準和函式庫已經被大量的人檢驗和攻擊過，問題大多已經被發現和修正。','登入和授權用成熟的標準和函式庫，不要自己發明。',['c',[['自己發明','幾乎一定有漏洞','w'],['成熟的標準','OAuth 2.0｜OpenID Connect','a']]]]],
3:[
['架構',['把單體系統拆成微服務，主要的代價是部署、監控、除錯和資料一致性都變得複雜很多。','微服務換來的是團隊可以獨立部署和擴充。','汰換舊系統時，逐步把功能一塊一塊搬到新系統（絞殺者模式），風險比一次全部重寫低。'],'十幾年的舊系統要汰換。先把「查詢」的功能搬到新系統，新舊並行；確認穩定後再搬下一個功能，直到舊系統可以關閉。','五個人的團隊把系統拆成二十個微服務，大部分的時間花在處理服務之間的問題。或是決定全部重寫、一次切換，做了兩年還無法上線。','微服務解決的是很多團隊同時開發同一個系統時互相牽制的問題。團隊小、系統不大時，單體通常更簡單也更可靠。逐步搬遷讓每一步都可以驗證，也隨時可以調整方向。','微服務的代價是複雜；舊系統汰換要逐步搬遷。',['c',[['微服務的好處','團隊獨立部署和擴充'],['微服務的代價','部署、監控、除錯｜資料一致性都變複雜','w'],['絞殺者模式','一塊一塊搬｜新舊並行','a']]]],
['系統整合',['跨多個服務的流程沒有辦法用同一個資料庫交易包起來。','常見的設計是 Saga：每一步都有對應的補償動作，失敗時反向取消已經完成的步驟。','事件的格式要演進時，只新增選填的欄位，不移除或改變既有欄位的意義。'],'訂單流程：付款成功、扣庫存成功、出貨失敗。於是執行補償：釋放庫存、退款。','假設三個服務會一起成功或一起失敗。出貨失敗時，款項已經扣了，庫存也已經扣了，沒有人處理。','跨服務沒有真正的回滾，已經完成的步驟只能用另一個動作來抵銷。事件的發布者和訂閱者不會同時升級，所以格式的變更必須讓舊的訂閱者還能正常運作。','跨服務用補償取代回滾；事件格式只加不改。',['f',['付款','扣庫存','出貨失敗','補償：釋放庫存｜退款'],'事件格式：只新增選填欄位',['','','w','a']]],
['錯誤處理',['下游服務開始大量逾時的時候，需要斷路器。','它暫時停止呼叫並快速回應失敗。','避免自己的資源被耗盡而跟著倒下。'],'下游的服務連續逾時。斷路器打開，接下來的請求直接回應失敗而不去呼叫。三十秒後放一個請求去試探，成功了就恢復正常。','每一個請求都等到逾時才放棄。等待中的請求佔滿了所有的執行緒和連線，自己也無法回應任何請求了。','等待逾時的過程中，資源是被佔用的。下游故障時，每個請求都在等，資源很快用完，故障就擴散到上游。快速失敗釋放了資源，也讓下游有機會恢復。','斷路器：下游故障時快速失敗，避免連鎖倒下。',['f',['下游大量逾時','斷路器打開｜快速失敗','過一陣子試探','恢復了就關閉'],null,['w','a','','']]],
['安全開發',['威脅建模最應該在設計階段進行，在開始寫程式之前。','要問的是：誰會想攻擊這裡、怎麼攻擊、我們怎麼擋。','設計上的問題愈晚發現，修改的成本愈高。'],'設計新功能時畫出資料的流向，逐一檢視每一個環節可能被怎麼攻擊，並在設計裡加入對應的防護。','系統開發完成之後才請人做安全檢測。發現的問題出在架構上，要修正就得大幅重寫。','程式的錯誤可以單獨修正，設計的錯誤則影響很多建立在它上面的東西。在設計階段修改只是改一張圖，上線之後修改則是一個專案。','威脅建模在設計階段做：誰會攻擊、怎麼攻擊、怎麼擋。',['c',[['設計階段','修改的成本最低','a'],['上線之後','可能要大幅重寫','w']]]],
['效能',['系統很慢而想要優化時，第一步是量測。','找出時間實際花在哪裡。','有了量測的數據，修改之後才知道有沒有效果。'],'量測發現一個頁面的三秒裡，有二點七秒花在同一個資料庫查詢上。為這個查詢加上索引之後，頁面降到零點四秒。','憑感覺認為某一段程式很慢，花了兩個星期重寫。量測之後發現那一段只佔全部時間的百分之二。','人對於程式哪裡慢的直覺常常是錯的。時間通常集中在少數幾個地方，找到它們才有效果。量測也提供了修改前後比較的基準。','優化之前先量測，找出時間花在哪裡。',['f',['量測','找出瓶頸','只改瓶頸','再量測確認'],null,['a','','','a']]],
['供應鏈安全',['建置和部署的管線（CI/CD）是重要的保護對象。','它能把程式送上正式環境，被入侵等於可以在所有的產出裡植入惡意程式。','做法：最小權限、保護密鑰、審查管線設定的變更、對產出的成品簽章。'],'管線使用的憑證只有部署所需的權限；管線的設定檔修改需要經過審查；產出的成品都有簽章，部署前會驗證。','把管線當成內部的工具，權限開得很大，任何人都可以修改它的設定。','管線握有金鑰和部署的權限，而且它產出的東西會被信任並直接放上正式環境。攻擊者入侵管線，就不需要再入侵正式環境了。它應該受到和正式環境同等級的保護。','CI/CD 管線要當成正式環境來保護。',['c',[['為什麼重要','握有金鑰和部署權限｜被入侵可植入惡意程式','w'],['做法','最小權限、保護密鑰｜審查變更、成品簽章','a']]]]]};
LEARN.api={0:[
['REST',['REST 風格的 API 用 HTTP 的動詞表達要做什麼。','GET 讀取、POST 新增、PUT 更新、DELETE 刪除。','網址表達的是對誰做。'],'對 /orders/15 送出 GET 是讀取第 15 號訂單；對同一個網址送出 DELETE 是刪除它。','把動作寫在網址裡，全部用 POST：/getOrder、/deleteOrder。可以運作，但每一支 API 的用法都要另外記。','HTTP 本來就有一組意義明確的動詞。照著使用，其他開發人員和工具不必看說明就能猜到這支 API 的行為。','動詞說做什麼，網址說對誰做。',['c',[['GET','讀取'],['POST','新增'],['PUT','更新'],['DELETE','刪除']]]],
['HTTP',['API 回傳狀態碼 200 代表請求成功。','2 開頭是成功。','4 開頭是請求端的問題，5 開頭是伺服器端的問題。'],'呼叫 API 之後先檢查狀態碼：200 就處理回傳的資料，其他的就依類別處理錯誤。','不檢查狀態碼，直接把回應當成資料來解析。API 回傳的是錯誤訊息，程式把它當成正常的資料處理。','狀態碼是 API 告訴呼叫端結果的標準方式。第一個數字就說明了大方向，程式可以先依此分類處理。','200 成功；4 開頭請求端的問題，5 開頭伺服器端的問題。',['c',[['2xx','成功','a'],['4xx','請求端的問題'],['5xx','伺服器端的問題','w']]]],
['資料格式',['API 最常用 JSON 格式傳遞資料。','它輕量、人看得懂。','幾乎所有的程式語言都能處理。'],'API 回傳一筆訂單的資料，內容是用大括號包起來的一組「名稱：值」。','以為 JSON 只能在 JavaScript 裡使用。它是一種獨立的文字格式。','系統之間交換資料需要一個雙方都能產生和解析的格式。JSON 的結構簡單，只有物件、陣列和幾種基本的值，所以很容易實作和閱讀。','API 最常用 JSON。',['t',['{','  "id": 15,','  "status": "已出貨",','  "items": ["鍵盤", "滑鼠"]','}']]],
['驗證',['呼叫 API 時附上的 API 金鑰，是讓服務端辨識是誰在呼叫。','金鑰等同密碼。','不能寫在前端的網頁或公開的程式碼裡。'],'金鑰放在後端伺服器的設定裡，由後端去呼叫外部的 API。瀏覽器裡的程式看不到金鑰。','把金鑰寫在網頁的 JavaScript 裡，或是上傳到公開的程式碼倉庫。任何人都可以取得它並以你的名義呼叫。','服務端用金鑰來決定是否允許呼叫，以及把用量算在誰的帳上。拿到金鑰的人就能做這個金鑰允許的所有事。前端的程式是送到使用者的電腦上執行的，內容完全公開。','API 金鑰等同密碼，不能放在前端或公開的程式碼。',['c',[['放在後端設定','外部看不到','a'],['寫在前端網頁｜或公開的程式碼','任何人都能取得','w']]]],
['文件',['OpenAPI（Swagger）文件是用標準的格式描述 API。','內容包括有哪些端點、參數和回應。','別人不必問你就知道怎麼呼叫，也能自動產生測試和用戶端的程式。'],'合作的團隊拿到 OpenAPI 文件，用工具直接產生呼叫這組 API 的程式，並在文件的頁面上試著呼叫。','用一份文字檔說明 API，內容和實際的行為已經不一致。對方照著文件呼叫卻一直失敗。','API 是給別人的程式使用的，對方需要精確地知道要送什麼、會收到什麼。標準的格式讓工具可以讀懂這份描述，進而自動完成很多工作。','OpenAPI：用標準格式描述 API，人和工具都看得懂。',['c',[['描述','端點、參數、回應'],['用途','不必問就知道怎麼呼叫｜可自動產生測試和程式','a']]]],
['測試',['開發前想先試著呼叫一支 API 看回應，會用 Postman 或 curl 這類工具。','先用工具確認請求和回應。','確認之後再寫進程式。'],'先用工具送出請求，確認需要哪些標頭、回應的格式是什麼。弄清楚之後才開始寫程式。','直接在程式裡寫呼叫的程式碼。失敗的時候，不確定是 API 的問題還是自己程式的問題。','用工具可以把「這支 API 怎麼運作」和「我的程式有沒有寫對」分開來確認。一次只處理一個未知數，排錯會快很多。','先用工具試 API，再寫進程式。',['t',['$ curl -i https://api.example.com/orders/15','HTTP/1.1 200 OK','Content-Type: application/json','','{"id":15,"status":"已出貨"}']]],
['設計',['API 要回傳非常多筆資料時，比較好的設計是分頁。','一次回傳一部分。','呼叫端依需要取得下一頁。'],'查詢訂單的 API 每次回傳一百筆，並告訴呼叫端如何取得下一頁。','一次回傳十萬筆。伺服器要把它們全部載入記憶體，傳輸要很久，呼叫端也要一次處理全部。','一次回傳的資料量愈大，兩邊使用的記憶體、傳輸的時間和失敗的機率都愈高。而且呼叫端常常只需要前面幾筆。','資料多就分頁。',['c',[['一次全部回傳','拖垮兩邊的｜記憶體和網路','w'],['分頁','一次一部分','a']]]],
['傳輸安全',['API 一定要使用 HTTPS。','避免傳輸中的資料和金鑰被竊聽或竄改。','用明文傳輸，同一個網路上的人都能攔截到。'],'API 只接受 HTTPS 的連線，使用 HTTP 的請求會被拒絕。','認為「這是內部使用的 API，不需要加密」。內部網路上的任何一台被入侵的電腦都可以側錄到金鑰。','API 的請求裡通常有金鑰或權杖，內容常常有個人資料。HTTP 的內容在網路上是明文，經過的每一個設備都看得到。','API 一律走 HTTPS。',['c',[['HTTP','明文｜金鑰和資料會被攔截','w'],['HTTPS','加密｜防竊聽和竄改','a']]]]],
1:[
['HTTP',['401 是沒有通過身分驗證，403 是身分確認了但沒有權限。','429 是請求太頻繁，應該放慢並稍後再試。','回應裡通常會告訴你多久之後可以再試。'],'收到 401，重新取得權杖後再試。收到 403，去申請權限，重試沒有用。收到 429，依照回應指示的時間等待之後再送。','收到 429 之後立刻重送，而且送得更密集。最後整個來源被封鎖。','這三個狀態碼的處理方式完全不同，所以要分清楚。401 是憑證的問題；403 是權限的問題；429 是速度的問題。','401 重新驗證、403 申請權限、429 放慢。',['c',[['401','沒通過身分驗證｜重新登入'],['403','沒有權限｜再登入也沒用'],['429','太頻繁｜放慢再試','w']]]],
['設計',['用 PUT 更新同一筆資料，送一次和送三次的結果一樣，這個特性叫冪等。','冪等的操作重送也安全；POST 新增通常不是，要另外處理。','錯誤回應的格式要一致，包含錯誤代碼和看得懂的說明。'],'所有的錯誤回應都是同樣的結構：一個代碼、一段說明。呼叫端用同一段程式處理所有 API 的錯誤。','每一支 API 的錯誤格式都不一樣：有的回傳文字、有的回傳 JSON、有的狀態碼是 200 但內容寫著失敗。','網路重送很常見，設計時要知道哪些操作重送是安全的。錯誤回應是給程式判斷的，格式不一致，呼叫端就要為每一支 API 另外撰寫處理。','冪等：重送結果一樣。錯誤回應格式要一致。',['c',[['冪等','送一次和送三次｜結果一樣','a'],['錯誤回應','格式一致｜有代碼和說明','a']]]],
['版本',['API 要做不相容的修改時，推出新的版本。','舊的版本保留一段時間，並公告停用的日期。','呼叫你的系統不會和你同一天上版。'],'推出第二版的 API，第一版繼續運作一年，並在回應裡加上即將停用的提示。','直接修改現有的 API。所有呼叫它的系統在同一時間出錯。','API 的提供方無法控制呼叫方什麼時候修改程式。新舊並存，讓每個呼叫方可以依自己的時程轉換。','不相容的修改要出新版本，舊版保留並公告停用日。',['f',['推出新版本','新舊並存','公告停用日期','停用舊版'],null,['a','','','']]],
['整合模式',['Webhook 是事件發生時由對方主動通知你。','不必一直去詢問。','你需要有一個對外的接收端，並且驗證通知的來源。'],'金流服務在付款完成時主動呼叫你提供的網址。你驗證這個請求的簽章確實來自金流服務，才更新訂單狀態。','每五秒去查詢一次付款的狀態。大部分的查詢都沒有新的結果，白白耗費兩邊的資源。或是收到 Webhook 沒有驗證來源，任何人都可以偽造通知。','定時查詢的頻率很難設定：太慢不夠即時，太快浪費資源。Webhook 只在有事情發生時才通知。但它是一個開放在網路上的入口，必須確認通知真的來自對方。','Webhook：有事才通知；接收端要驗證來源。',['c',[['定時查詢','大部分是白問','off'],['Webhook','事件發生時｜對方主動通知','a'],['注意','要驗證來源','w']]]],
['可靠性',['呼叫外部的 API 失敗要重試時，每次重試的間隔要逐漸拉長，並設定上限。','這叫指數退避。','對方已經過載時，密集的重試只會讓它更無法恢復。'],'第一次失敗等一秒，第二次等兩秒，第三次等四秒，最多重試五次，之後就記錄錯誤並放棄。','失敗就立刻重試，無限次。對方的服務短暫故障時，所有用戶端同時瘋狂重試，讓它完全無法恢復。','服務過載時最需要的是負載減少。固定而密集的重試讓負載變成原來的好幾倍。逐漸拉長間隔，讓對方有時間恢復。','重試要逐漸拉長間隔並設上限。',['f',['失敗','等 1 秒重試','等 2 秒重試','等 4 秒重試｜到上限就放棄'],null,['w','','','']]],
['安全',['API 收到的輸入資料，服務端一律要驗證格式和範圍。','不信任呼叫端。','任何人都可以繞過你的前端，直接呼叫 API。'],'API 檢查每一個欄位：型別是否正確、長度是否在限制內、數值是否在合理的範圍。不符合就回傳 400。','認為「只有我們自己的 App 會呼叫這支 API，送來的資料一定是正確的」。','API 是開放在網路上的，服務端無法確定請求是由哪一個程式送出的。所有的輸入都要當成可能是任意的內容。','服務端一律驗證輸入，不信任呼叫端。',['c',[['信任呼叫端','任何人都能直接打 API','w'],['服務端驗證','格式和範圍都檢查','a']]]]],
2:[
['授權',['兩個後端系統之間互相呼叫 API，沒有使用者參與。','OAuth 適合使用用戶端憑證（Client Credentials）的方式。','系統用自己的身分取得存取權杖，權杖的有效期短，權限可以限定範圍。'],'排程系統用自己的用戶端識別碼和密鑰向授權伺服器取得一個一小時有效、只能讀取訂單的權杖，再用它呼叫訂單的 API。','兩個系統之間用一組永遠不會過期、什麼都能做的固定金鑰。金鑰外洩之後，要更換非常困難。','沒有使用者在場，就沒有人可以登入和同意，所以系統要以自己的身分取得授權。短期的權杖限制了外洩之後可以被利用的時間，限定範圍則限制了可以做的事。','系統對系統：用戶端憑證，取得短期、限定範圍的權杖。',['f',['系統用自己的｜憑證','向授權伺服器｜取得權杖','用權杖呼叫 API'],'權杖有效期短、權限有範圍',['','a','']]],
['訊息佇列',['訊息佇列保證「至少送達一次」。','接收端因此必須處理同一則訊息可能收到不只一次的情況。','做法是辨識重複（例如用訊息編號），或把處理設計成重做也沒有影響。'],'接收端記錄已經處理過的訊息編號。收到編號相同的訊息時直接略過。','假設每一則訊息只會收到一次。同一筆扣款的訊息被處理了兩次。','佇列要確保訊息不會遺失，所以沒有收到確認時會重送。但確認本身也可能遺失，這時訊息其實已經被處理過了。「不遺失」和「不重複」很難同時保證，佇列選擇了前者。','至少送達一次：接收端要能處理重複的訊息。',['f',['佇列送出訊息','接收端處理完成','確認遺失','佇列重送｜接收端要認得重複'],null,['','','w','a']]],
['整合模式',['處理需要比較久，或不希望對方故障時拖住自己，適合用非同步的方式整合。','每晚批次同步和即時同步怎麼選，看業務可以接受多久的資料延遲。','也要看資料量和複雜度。'],'下訂單之後寄送通知信，使用者不必等信寄完才看到結果，所以用非同步。每天的對帳涉及幾十萬筆資料，用批次處理。','認為即時一定比較好，把所有的整合都做成即時的。大量資料的對帳用即時的方式既複雜又不穩定。','每一種方式都有成本。同步簡單但讓兩邊綁在一起；非同步解耦但流程比較難追蹤；批次有延遲但適合處理大量的資料。選擇的依據是業務真正的需求。','非同步：處理久或要解耦。批次或即時：看能接受多久的延遲。',['c',[['同步','馬上要結果'],['非同步','處理久｜或不想被對方拖住','a'],['批次','大量資料｜可以接受延遲']]]],
['API 閘道',['API 閘道集中處理共同的事。','包括驗證、限流、路由和紀錄。','後面的每個服務就不必各自做一套。'],'所有的請求先經過閘道：檢查權杖、套用速率限制、記錄請求，再轉送到對應的服務。','每一個服務各自實作驗證和限流。做法不一致，有的服務漏掉了。','這些功能是每一支 API 都需要的。放在共同的入口，只需要實作和維護一次，行為也會一致。','閘道集中處理：驗證、限流、路由、紀錄。',['f',['請求','API 閘道｜驗證、限流｜路由、紀錄','後端的服務'],null,['','a','']]],
['測試',['契約測試是驗證提供方和使用方對 API 格式的約定沒有被破壞。','提供方修改了欄位，使用方的系統就會出錯。','契約測試讓這種破壞在上線前被發現。'],'提供方要移除一個欄位，執行契約測試時失敗：有一個使用方還在使用這個欄位。於是先聯繫對方。','提供方只測試自己的功能是否正常。上線之後，使用方的系統因為欄位不見而出錯。','提供方通常不清楚使用方實際用了哪些欄位。契約把使用方的期待明確地記錄下來，並變成提供方可以自動執行的檢查。','契約測試：改 API 之前就知道會不會弄壞使用方。',['f',['使用方記錄｜它的期待','提供方修改 API','執行契約測試','破壞了就失敗'],null,['','','a','w']]],
['資料整合',['兩個系統都有「客戶資料」但內容不一致。','整合之前要先決定哪一個系統是這份資料的權威來源。','沒有單一的來源，兩邊互相覆蓋，資料只會愈來愈亂。'],'決定客戶的基本資料以會員系統為準。其他系統只能從會員系統取得資料，不能自行修改。','讓兩個系統互相同步。同一位客戶在兩邊被修改成不同的地址，同步之後誰蓋掉誰取決於時間的先後。','同一份資料如果有兩個地方都可以修改，就一定會出現不一致，而且沒有規則可以判斷哪一個是對的。指定一個權威的來源，其他的都是它的副本。','整合前先決定誰是權威來源。',['c',[['沒有權威來源','兩邊互相覆蓋','w'],['指定一個權威來源','其他都是副本','a']]]],
['可靠性',['上游送資料的速度遠超過下游處理的速度時，系統需要回壓或緩衝的機制。','讓上游慢下來，或是先排隊。','沒有回壓，佇列會無限成長。'],'佇列的長度超過設定的門檻時，上游收到「請放慢」的訊號，降低送出的速度。','佇列沒有上限。尖峰時累積的訊息把記憶體用完，整個系統當掉，累積的訊息也全部遺失。','緩衝可以吸收短暫的尖峰，但速度的落差是持續的話，任何大小的緩衝都會滿。所以最終需要讓上游知道下游的狀況並配合調整。','上游太快：要有回壓或緩衝，不能讓佇列無限成長。',['f',['上游送得太快','佇列持續成長','回壓：請上游放慢'],'沒有回壓：記憶體耗盡',['w','w','a']]]],
3:[
['整合架構',['系統之間全部用點對點直接串接，系統數量變多之後連線的數量會快速增加。','修改一個系統會牽動很多個。','中樞或事件匯流排可以把關係整理清楚。'],'十個系統原本互相直接串接，有幾十條介面。改成都連接到整合平台之後，每個系統只需要維護一條。','每次有新的整合需求就再加一條點對點的介面。幾年後沒有人說得清楚哪個系統連到哪個系統。','點對點的介面數量隨著系統數量的平方成長。每一條介面都有自己的格式和邏輯，要分別維護。集中之後，數量只隨著系統的數量成長。','點對點串接愈多愈亂；用中樞或匯流排整理。',['c',[['點對點','十個系統｜可能幾十條介面','w'],['中樞或匯流排','每個系統｜只連一條','a']]]],
['事件驅動',['事件驅動的架構中，發布事件的系統不需要知道誰在訂閱。','這正是它降低耦合的地方。','代價是整體的流程比較難追蹤，需要好的可觀測性。'],'訂單系統發布「訂單已成立」的事件。後來新增了一個分析系統來訂閱它，訂單系統完全不需要修改。','用了事件驅動的架構，但沒有追蹤的機制。出問題時，不知道一個事件被哪些系統處理了、處理到哪裡。','發布者只說「發生了什麼事」，不指定誰要做什麼，所以新增或移除訂閱者不影響它。但也因此沒有任何一個地方描述了完整的流程。','事件驅動：發布者不必知道誰訂閱；代價是流程難追蹤。',['c',[['好處','新增訂閱者｜不必動發布者','a'],['代價','整體流程難追蹤｜需要可觀測性','w']]]],
['生命週期',['要停用一支很多單位在使用的舊 API。','負責任的做法是提前公告時程、提供替代方案。','並且監控還有誰在呼叫。'],'公告半年後停用並提供新版的說明。每個月檢視呼叫紀錄，逐一聯繫還在使用舊版的單位，確認都轉換完成才關閉。','公告之後時間到了就直接關閉。有幾個單位根本沒有看到公告，系統在關閉當天出錯。','公告不保證對方有看到或有處理。呼叫紀錄可以明確地顯示還有誰沒有轉換，主動聯繫比關閉之後等對方來反應好得多。','停用 API：公告、給替代方案、看紀錄追還在用的人。',['f',['提前公告時程','提供替代方案','監控還有誰在呼叫','逐一聯繫後才關閉'],null,['','','a','']]],
['一致性',['跨多個系統的流程無法用單一的交易包起來。','做法是接受最終一致，並設計補償和對帳的機制。','定期對帳能找出補償沒有涵蓋到的問題。'],'每天晚上比對訂單系統和金流系統的資料，找出一邊有、另一邊沒有的紀錄，由人員或程式處理。','設計了補償的流程就認為資料一定會一致。補償本身也會失敗，有一些情況是設計時沒有想到的。','在分散式的環境裡，任何一步都可能失敗，包括用來處理失敗的那一步。對帳不依賴流程是否正確執行，直接比對最後的結果，是最後一道防線。','跨系統：接受最終一致，用補償加對帳。',['c',[['補償','失敗時取消｜已完成的步驟'],['對帳','定期比對｜抓出漏網的','a']]]],
['可觀測性',['一個請求經過閘道、好幾個服務和一個佇列。','設計時要用同一個追蹤識別碼貫穿全程。','並記錄在每一段。'],'識別碼在閘道產生，經由請求的標頭傳給每個服務，也放進佇列的訊息裡。排查時用它搜尋就看到完整的經過。','識別碼只在同步的呼叫之間傳遞，放進佇列時沒有帶上。請求進入佇列之後就追蹤不到了。','追蹤要有用，必須在每一個環節都不中斷。非同步的部分最容易遺漏，因為它不是直接的呼叫。這要在設計時就規劃，事後補很困難。','追蹤識別碼要貫穿全程，包括佇列。',['f',['閘道｜產生識別碼','服務','佇列｜訊息也帶識別碼','服務'],null,['a','','a','']]],
['API 安全',['使用者把請求裡的訂單編號改成別人的，就取得了別人的資料。','根本的原因是只驗證了身分，沒有檢查這個物件是否屬於他。','物件層級的授權缺失是 API 最常見的弱點。'],'每一支會存取特定物件的 API，都在服務端檢查「目前的使用者是否有權存取這一個物件」。','認為 App 的畫面上只會顯示使用者自己的訂單，所以不需要另外檢查。攻擊者直接修改請求裡的編號。','API 直接接受物件的識別碼作為參數，而識別碼通常可以被猜到或列舉。服務端如果沒有逐一檢查擁有者，任何已登入的使用者都可以存取所有的資料。','每次存取物件都要在服務端檢查擁有者。',['c',[['只驗證身分','改編號｜就拿到別人的資料','w'],['檢查物件的擁有者','每一次存取都檢查','a']]]],
['架構',['劃分服務和 API 的邊界，最好依據業務領域和資料的歸屬。','邊界切在業務自然的分界上。','這樣修改才不會一直跨越服務。'],'依業務劃分為訂單、庫存、會員。每個服務擁有自己的資料，大部分的需求變更只需要修改一個服務。','依技術的層次劃分：一個服務負責所有的資料存取，一個負責所有的商業邏輯。每一個需求都要同時修改好幾個服務。','服務之間的邊界是修改成本最高的地方。需求的變更通常是沿著業務的範圍發生的。邊界和業務一致，變更就能留在一個服務之內。','服務邊界依業務領域和資料歸屬來切。',['c',[['依業務領域劃分','變更留在一個服務內','a'],['依技術層次劃分','每個需求都跨服務','w']]]],
['對外合作',['提供 API 給外部的合作夥伴使用，除了技術文件還需要約定幾件事。','服務水準、用量上限、變更通知和安全責任。','對外的 API 是一種承諾。'],'合約載明：可用率的目標、每分鐘的呼叫上限、不相容的變更要在九十天前通知、資料只能用於約定的用途。','只給對方技術文件和金鑰。服務中斷時對方要求賠償、對方的用量拖垮了服務，雙方對責任沒有共識。','對方會把自己的業務建立在這組 API 上。它什麼時候可用、可以用多少、會不會改變，直接影響對方。這些事先講清楚，出狀況時才有依據。','對外 API 要約定：服務水準、用量、變更通知、安全責任。',['c',[['服務水準','可用率的目標'],['用量上限','每分鐘可以呼叫幾次'],['變更通知','提前多久告知'],['安全責任','資料的用途和保護']]]]]};
LEARN.ssdlc={0:[
['安全觀念',['資訊安全要從需求和設計階段就開始考慮。','愈晚發現的安全問題，修正的成本愈高。','設計錯了，後面很難補救。'],'設計會員功能時就決定：密碼怎麼儲存、哪些操作要留紀錄、誰可以看到哪些資料。','功能都做完了，上線前才請人檢查安全。發現資料的存取完全沒有權限的設計，要大幅重寫。','安全不是可以最後再加上去的一層。很多安全的性質取決於系統的結構，結構定下來之後再改，等於重做。','安全從需求和設計就開始。',['f',['需求','設計','開發','測試','上線'],'愈往右才發現，修正愈貴',['a','a','','','w']]],
['相依套件',['程式用到的第三方套件要持續更新。','套件也會被發現漏洞。','套件的漏洞就是你的漏洞。'],'每個月檢查專案使用的套件有沒有新的安全更新，並安排更新。','套件「能用就不要動」。三年沒有更新，其中好幾個有已經公開的嚴重漏洞。','現代的程式大部分的程式碼來自別人撰寫的套件。這些套件和你自己的程式在同一個地方執行，擁有同樣的權限。','第三方套件要持續更新。',['c',[['自己寫的程式','只佔一小部分'],['第三方套件','佔大部分｜它的漏洞就是你的','w']]]],
['機密管理',['連線密碼和金鑰不能寫在程式碼裡。','程式碼會被複製、分享和留存，密碼就跟著外流。','密碼應該在執行時從安全的地方取得。'],'程式啟動時從密鑰管理系統讀取資料庫的密碼。程式碼裡只有「去哪裡取得」，沒有密碼本身。','把密碼直接寫在程式裡並提交到版本控制。所有能看到程式碼的人、每一份複本、每一筆歷史紀錄裡都有這組密碼。','程式碼的存取權限通常比正式環境寬鬆得多，而且會存在很多地方。把機密和程式碼分開，才能分別管理。','密碼和金鑰不寫在程式碼裡。',['c',[['寫在程式碼裡','隨著程式碼到處複製','w'],['執行時取得','從密鑰管理系統讀取','a']]]],
['輸入驗證',['使用者輸入的資料全部視為不可信。','驗證之後才使用。','大部分的注入類攻擊，都是因為把輸入直接拿去組合指令或查詢。'],'查詢資料庫時使用參數化的查詢，輸入的內容只會被當成資料，不會成為查詢語句的一部分。','把使用者輸入的文字直接接在 SQL 語句後面。有人輸入了一段 SQL，查詢的意思就被改變了。','程式把指令和資料組合在一起時，如果資料裡含有指令的語法，接收的一方就無法分辨。把兩者分開處理，是解決這一類問題的根本方法。','輸入一律不可信：先驗證，並把資料和指令分開。',['c',[['直接組合','輸入變成｜指令的一部分','w'],['驗證並分開處理','輸入只是資料','a']]]],
['最小權限',['應用程式執行時使用的帳號，只給它運作需要的權限。','程式被攻破時，攻擊者取得的就是這個帳號的權限。','不要為了方便而使用最高權限的帳號。'],'網站連線資料庫的帳號只能讀寫它需要的幾張資料表，不能刪除資料表、不能存取其他的資料庫。','為了方便，網站用資料庫的最高權限帳號連線。網站有一個漏洞，攻擊者就可以對整個資料庫做任何事。','任何程式都可能有漏洞。權限決定了漏洞被利用時損害的上限。','程式的帳號只給運作需要的權限。',['c',[['最高權限','被攻破就是全部','w'],['最小權限','損害有上限','a']]]],
['程式碼審查',['從安全的角度，程式碼審查是要找出作者自己沒有注意到的邏輯漏洞和不安全的寫法。','特別要看驗證、授權和輸入處理的部分。','審查的重點是邏輯，不是排版和命名。'],'審查時發現一支新的 API 沒有檢查使用者是否有權存取該筆資料。在合併之前就修正了。','審查只看排版和命名。真正有風險的邏輯沒有人仔細看。','作者是照著「正常使用」的想法寫程式的，很難同時用攻擊者的角度檢視自己的作品。另一個人沒有這個盲點。','多一個人看：重點在驗證、授權、輸入處理。',['c',[['驗證','有沒有確認身分'],['授權','有沒有檢查權限'],['輸入處理','有沒有驗證輸入']]]],
['錯誤處理',['給使用者看的錯誤訊息不要透露系統內部的細節。','路徑、SQL 語句、版本號都是攻擊者的線索。','詳細的內容寫進內部的紀錄。'],'使用者看到「發生錯誤，請稍後再試」。完整的錯誤內容記錄在伺服器的 log 裡。','錯誤頁面顯示了檔案的完整路徑、使用的框架和版本。','攻擊的第一步是了解目標。詳細的錯誤訊息直接提供了系統使用的技術和內部的結構，讓攻擊者可以針對性地尋找漏洞。','錯誤訊息不透露內部細節。',['c',[['給使用者','簡單的訊息','a'],['寫進內部紀錄','完整的細節'],['不要顯示','路徑、SQL、版本號','w']]]],
['測試資料',['開發和測試環境要使用假資料，或是去識別化之後的資料。','測試環境的防護通常比較寬鬆。','真實的個人資料放進去，就多了一個外洩的地方。'],'用工具產生一批格式正確但內容是假的會員資料，供開發和測試使用。','把正式資料庫整份複製到測試環境。測試環境的密碼很簡單、很多人可以存取。','開發和測試的環境是為了方便而設計的，存取的人多、管控少。資料的保護不應該依賴一個本來就不嚴格的環境。','測試用假資料或去識別化的資料。',['c',[['複製正式資料','多一個外洩點','w'],['假資料｜或去識別化','外洩也沒有個資','a']]]]],

['測試工具',['SAST 不執行程式，直接分析原始碼。','DAST 對執行中的應用程式從外部進行測試。','SCA 檢查專案使用的第三方套件有沒有已知的漏洞和授權問題。'],'提交程式時 SAST 掃描原始碼；部署到測試環境之後 DAST 從外部測試；SCA 比對套件的版本和漏洞資料庫。','只使用其中一種工具就認為已經涵蓋了。三者看的東西不一樣。','SAST 寫完就能掃描、回饋快，但誤報多，也看不到執行時才出現的問題。DAST 看到的是攻擊者會看到的樣子，能找到設定和執行環境造成的問題。SCA 處理的是不是你寫的那一大部分程式碼。','SAST 看原始碼、DAST 測執行中的程式、SCA 查套件。',['c',[['SAST','分析原始碼｜不執行'],['DAST','從外部測試｜執行中的程式'],['SCA','第三方套件的｜漏洞和授權']]]],
['軟體物料清單',['SBOM 是一份列出軟體所有組成元件和版本的清單。','某個套件爆出重大漏洞時，有 SBOM 幾分鐘就能回答「我們有沒有用到」。','清單要能用程式查詢，並隨著每次建置更新。'],'一個廣泛使用的套件公布了嚴重漏洞。查詢所有系統的 SBOM，十分鐘內就列出受影響的系統。','沒有清單。漏洞公布之後，每個團隊要各自去翻自己的專案，花了好幾天才確認。','軟體使用的套件還會使用其他的套件，一層一層下去，很多元件是開發人員自己也不知道的。清單把它們全部列出來，並且可以用程式查詢。','SBOM：軟體的成分表，出事時查得到有沒有用到。',['f',['套件爆出漏洞','查詢 SBOM','找出受影響的系統'],'沒有 SBOM 要查好幾天',['w','a','']]],
['機密掃描',['在版本控制上啟用機密掃描，是為了防止金鑰和密碼被提交進儲存庫。','在提交或推送的時候就擋下來。','這比事後清除歷史紀錄容易得多。'],'開發人員不小心把含有金鑰的設定檔提交了。推送時被掃描工具擋下來，並提示是哪一行。','金鑰已經進了儲存庫才發現。即使把檔案刪除，它還在歷史紀錄裡；唯一安全的做法是更換金鑰。','版本控制會保留所有的歷史，而且儲存庫會被複製到很多地方。機密一旦進去，就應該假設已經外洩。','機密掃描：在提交時就擋下金鑰和密碼。',['f',['提交的內容｜含有金鑰','機密掃描','擋下來'],'已經進去的：要更換金鑰',['w','a','']]],
['供應鏈',['攻擊者會發布名稱和熱門套件只差一個字母的惡意套件。','這是名稱仿冒，利用的是安裝時打錯字或沒有確認名稱。','安裝前確認名稱、來源和下載量，並鎖定版本。'],'安裝套件前核對名稱和官方文件上的是否完全相同，並查看它的發布者和下載量。','照著印象輸入套件名稱就安裝。打錯一個字母，安裝到的是惡意的套件。','套件庫任何人都可以發布，名稱只要沒有被使用就可以註冊。安裝套件等於執行別人的程式，裝錯就是直接讓惡意程式進入開發環境。','安裝套件前確認名稱和來源，並鎖定版本。',['c',[['名稱仿冒','只差一個字母的｜惡意套件','w'],['防範','確認名稱和來源｜鎖定版本','a']]]],
['需求',['安全需求要一開始就列出來，並且納入驗收。','例如「密碼錯誤五次要鎖定」「操作要留下紀錄」。','沒有寫進需求，就不會被開發，也不會被測試。'],'需求文件裡有一節安全需求，每一項都有對應的驗收條件。','需求只描述功能。安全被當成「本來就應該要有」，但沒有人被指派去做，驗收時也沒有人檢查。','開發和測試是依據需求進行的。沒有被明確寫下來的東西，在時程的壓力下很自然會被省略。','安全需求要寫下來並納入驗收。',['f',['列出安全需求','納入開發','納入驗收'],'沒寫進需求就不會被做',['a','','']]],
['弱點處理',['掃描發現的漏洞，修補的時限依風險等級訂定並追蹤。','等級愈高，期限愈短。','逾期要升級處理。'],'規定：嚴重等級七天內修補、高等級三十天、中等級九十天。每週檢視逾期的項目並向上報告。','掃描報告產生之後沒有人追蹤。同樣的漏洞在每一期的報告裡重複出現。','發現漏洞不會降低風險，修補才會。沒有期限的工作會一直被其他的事排擠。','漏洞依等級訂修補期限，逾期升級。',['c',[['嚴重','期限最短','w'],['高','較短'],['中、低','較長'],['逾期','升級處理','a']]]]],
2:[
['威脅建模',['STRIDE 提醒設計者思考六類威脅。','冒用身分、竄改、否認、資訊洩漏、阻斷服務、權限提升。','照著逐項檢視，比憑空想更不容易遺漏。'],'針對登入功能逐項提問：有沒有可能被冒用？傳輸的資料會不會被竄改？使用者能不能否認做過？…','威脅建模時大家自由發想，只想到最近新聞上看到的幾種攻擊。','人在思考風險時會偏向自己熟悉的類型。一份固定的分類清單強迫每一類都被檢視。','STRIDE：六類威脅逐項問一遍。',['c',[['S 冒用身分','T 竄改'],['R 否認','I 資訊洩漏'],['D 阻斷服務','E 權限提升']]]],
['管線',['在建置管線裡設定安全閘門，是指掃描結果超過設定的標準時自動擋下，不讓它上線。','標準被自動執行，不依賴人記得去看報告。','標準要務實，否則大家會想辦法繞過。'],'管線設定：出現嚴重等級的漏洞就中止建置。開發人員必須先修正才能繼續。','一開始就把標準訂為「任何問題都不能有」。每一次建置都失敗，最後閘門被關掉了。','報告如果只是產生出來，看不看取決於個人。閘門讓標準成為流程的一部分。但過於嚴格的標準會阻礙正常的工作，產生繞過的壓力。','安全閘門：超過標準自動擋下；標準要務實。',['f',['建置','安全掃描','超過標準｜擋下','通過｜繼續部署'],null,['','a','w','']]],
['誤報',['靜態掃描工具報出大量問題而大部分是誤報時，要調整規則並標記確認過的誤報。','讓報告回到可以處理的數量。','沒有人相信的工具等於沒有工具。'],'花兩個星期檢視報告，關閉不適用的規則，標記確認的誤報。報告從五百項降到三十項，團隊開始逐一處理。','每次掃描都是五百項，沒有人去看。其中十個真正的問題被埋在裡面。','人對大量而且多數不正確的警告會很快失去注意力。工具的價值取決於它的結果有沒有被處理。','誤報要調校，讓真正的問題被看到。',['c',[['五百項｜多數是誤報','沒有人看','w'],['調校之後','數量可以處理｜真問題被看到','a']]]],
['容器',['容器映像的安全最基本要顧兩件事。','基底映像的來源和更新。','掃描映像中的已知漏洞。'],'使用官方提供的精簡基底映像，每週重新建置以取得更新，並在建置時掃描漏洞。','使用兩年前從網路上找到的映像作為基底，之後沒有更新過。','容器映像包含了作業系統的函式庫和工具，這些都會有漏洞。很多映像的漏洞不是來自應用程式，而是來自過舊的基底。','容器：用可信且持續更新的基底映像，並掃描漏洞。',['c',[['基底映像','來源可信｜精簡、持續更新','a'],['掃描','映像中的已知漏洞','a']]]],
['完整性',['對建置產出的成品進行簽章，可以確保部署的東西確實是自己的管線建置出來的。','沒有被替換。','部署端要驗證簽章，沒有簽章或不符的一律拒絕。'],'管線建置完成後對成品簽章。部署時驗證簽章，有人放進成品庫的未簽章檔案被拒絕部署。','成品庫裡的檔案被直接信任。有人取得成品庫的寫入權限，把成品換成含有後門的版本。','成品從建置到部署中間會經過儲存和傳輸。簽章讓部署端可以確認它拿到的和管線產出的是同一個東西。','成品要簽章，部署前驗證。',['f',['管線建置','對成品簽章','部署前驗證','不符就拒絕'],null,['','a','a','w']]],
['相依套件',['使用私有的套件鏡像庫並鎖定版本。','可以降低上游的套件被植入惡意內容或突然消失的風險。','新的版本進來之前可以先掃描和審核。'],'建置時只從公司的鏡像庫取得套件，版本固定。上游某個套件的新版本被植入惡意程式時，公司的建置沒有受到影響。','每次建置都直接從公開的套件庫取得「最新版」。上游出問題的那一天，所有的建置都受到影響。','直接依賴外部的套件庫，等於建置的結果取決於外部當下的狀態。鏡像庫和鎖定版本讓「使用哪一個版本」成為自己可以控制的決定。','私有鏡像庫加鎖定版本：建置不受上游當下的狀態影響。',['f',['上游套件庫','私有鏡像庫｜先掃描和審核','建置使用｜鎖定的版本'],null,['','a','']]],
['流程',['把安全掃描放在合併請求的階段執行。','問題在合併之前就被發現，由作者當場修正。','作者對剛寫的程式最熟悉，這時候修正的成本最低。'],'開發人員提出合併請求，幾分鐘後就看到掃描的結果，直接在同一個請求裡修正。','每季掃描一次。報告裡的問題是三個月前寫的程式，作者已經不記得當時的想法。','修正問題需要理解那段程式。時間隔得愈久、中間累積的修改愈多，要重新理解的成本愈高。','在合併請求時掃描，作者當場修。',['f',['提出合併請求','自動掃描','作者當場修正','合併'],null,['','a','a','']]],
['弱點管理',['修補安全漏洞要有服務水準的規定。','讓不同等級的漏洞有明確的修補期限和責任。','有了期限，才量得出修得快不快，也才有依據要求資源。'],'報告顯示：高等級漏洞的平均修補時間是四十五天，超過規定的三十天。用這個數字爭取到每個迭代固定保留處理的時間。','只說「漏洞要盡快修補」。沒有人知道現在算快還是慢。','沒有標準就無法判斷表現，也無法說明資源不足。明確的期限把模糊的期望變成可以量測和管理的事。','修補要有服務水準：有期限才量得出來。',['c',[['沒有期限','「盡快」｜無法衡量','w'],['有服務水準','可以量測｜可以要求資源','a']]]]],
3:[
['組織',['在每個開發團隊裡設一位安全冠軍。','讓安全的知識進到團隊的內部。','成為資安單位和開發之間的橋樑。'],'每個團隊有一位對安全有興趣的開發人員，接受額外的訓練，在設計和審查時提出安全的考量，並和資安單位保持聯繫。','所有的安全問題都要等資安單位來檢查。資安單位只有三個人，要面對二十個開發團隊。','資安人員的數量永遠不足以檢視每一行程式。把基本的安全判斷放進每一個團隊，才能隨著開發的規模擴展。','安全冠軍：每個團隊裡有人懂、有人顧。',['c',[['只靠資安單位','人力永遠不夠','w'],['每個團隊有安全冠軍','安全知識在團隊內','a']]]],
['供應鏈',['攻擊者入侵建置系統，在編譯時植入後門。','原始碼審查發現不了，因為惡意的內容不在原始碼裡。','建置環境本身要隔離、最小權限、可稽核，並驗證產出物的來源。'],'建置在每次都重新建立的隔離環境中執行，建置的過程有完整的紀錄，產出物附有可驗證的來源資訊。','只保護原始碼的儲存庫。建置伺服器是一台很多人可以登入、很久沒有更新的機器。','原始碼要經過建置才會變成實際執行的程式。這個轉換的過程如果被控制，產出的東西就可以和原始碼不一致，而一般的檢查都是針對原始碼的。','建置系統也要保護：後門可以在建置時才加入。',['f',['原始碼｜沒有問題','建置系統｜被入侵','成品｜含有後門'],'審查原始碼發現不了',['','w','w']]],
['來源證明',['軟體成品的來源證明，記錄它是由哪一份原始碼、哪一條管線、在什麼環境建置出來的。','有了可以驗證的來源，才能回答「這個執行檔真的對應那份審查過的程式碼嗎」。','部署之前驗證來源證明，不符合的不部署。'],'部署前檢查成品的來源證明：確認它是由公司的管線、從主要分支的特定版本建置的。','只知道成品的檔名和版本號。無法確認它是不是真的從那一版的原始碼產生的。','簽章只證明成品是誰簽的。來源證明進一步說明它是怎麼產生的，把成品和經過審查的原始碼連結起來。','來源證明：哪份原始碼、哪條管線、什麼環境建的。',['c',[['哪一份原始碼','對應到審查過的版本'],['哪一條管線','是不是自己的'],['什麼環境','建置的條件']]]],
['開源治理',['大量使用開源套件的組織，需要一份使用政策。','內容包括：可以使用的授權類型、引入時的審核、維護和淘汰的責任。','每一個引入的套件都要有內部的負責人。'],'政策規定：某些授權類型不得用於對外發布的產品；引入新的套件要確認它還有人維護；每個套件要有內部的負責人。','任何人都可以引入任何套件。產品裡用了一個授權條款要求公開原始碼的套件，發布之後才發現。','開源套件是免費取得的，但不是沒有條件和成本。授權有義務要遵守；沒有人維護的套件不會再有修補；引入之後沒有人負責，就沒有人會更新它。','開源要有政策：授權、審核、誰負責維護。',['c',[['授權類型','哪些可以用'],['引入的審核','還有沒有人維護'],['維護和淘汰','誰負責更新','a']]]],
['漏洞揭露',['對外公布漏洞通報的管道和處理政策。','讓外部發現問題的人有正當的途徑先告訴你。','你才有機會在漏洞被利用之前修補。'],'網站上公布通報的信箱和處理的原則：收到後幾天內回覆、不對善意的通報者採取法律行動。','沒有任何通報的管道。研究人員發現漏洞後找不到聯絡的對象，最後直接公開。','外部一定會有人發現你的漏洞。沒有管道時，善意的人只能選擇公開或放棄，而惡意的人本來就不會通知你。','公布漏洞通報管道，讓發現的人先告訴你。',['c',[['沒有管道','只能公開或放棄','w'],['有管道','被利用前｜有機會修補','a']]]],
['度量',['衡量安全開發做得好不好，比較有意義的指標有兩個。','漏洞從發現到修補的時間。','上線之後才發現的比例。'],'報告顯示：上線後才發現的漏洞比例從四成降到一成五，高等級漏洞的平均修補時間從六十天降到二十天。','報告「導入了五種掃描工具、舉辦了十場訓練」。這些是投入，看不出結果。','工具和活動本身不是目的。目的是漏洞更早被發現、更快被修正。這兩個數字直接量測這個結果。','看結果：多快修好、多少是上線後才發現。',['c',[['投入','工具和訓練的數量','off'],['結果','修補所需的時間｜上線後才發現的比例','a']]]],
['風險決策',['已知的漏洞因為業務時程無法在期限內修補時，要記錄風險和補償措施。','由有權責的人核准例外，並設定期限。','風險可以被接受，但要被看見、有人負責、有到期日。'],'填寫例外申請：說明漏洞、無法如期修補的原因、暫時的補償措施。由系統的業務負責人簽核，有效期三個月。','開發團隊自己決定「這個先不修」，沒有記錄，沒有告訴任何人。','接受風險是一個業務的決定，應該由對業務結果負責的人來做。記錄和期限確保這個決定不會被遺忘而變成永久的狀態。','例外要記錄、有人核准、有到期日。',['f',['無法如期修補','記錄風險｜和補償措施','有權責的人核准','設定到期日'],null,['w','','a','a']]],
['生命週期',['系統依賴的元件，上游宣布不再維護時，要評估風險並規劃替換。','替換之前加強隔離和監控。','這要列入風險登錄和技術債的計畫。'],'得知使用的框架將在一年後終止支援。評估替換的工作量，排入明年的計畫，並在這段期間限制該系統的對外存取。','「目前還能運作」就不處理。兩年後出現嚴重漏洞而沒有修補可用，才被迫緊急替換。','不再維護代表未來發現的漏洞不會有人修正。替換通常需要很長的時間，等到出事才開始就來不及了。','元件不再維護：規劃替換，之前先隔離和監控。',['f',['上游宣布｜不再維護','評估風險','規劃替換','替換前｜隔離和監控'],null,['w','','a','']]]]};
LEARN.auto={0:[
['自動化觀念',['最適合優先自動化的是重複、步驟固定、容易出錯的工作。','做得愈頻繁、步驟愈固定，自動化的回報愈高。','很少做、每次情況都不同的工作，不適合優先自動化。'],'每天早上要手動檢查二十台伺服器的磁碟空間。寫成腳本自動檢查並在異常時通知。','花一個月把一件一年只做一次、每次情況都不同的工作自動化。','自動化需要投入時間撰寫和維護。重複的次數多，節省的時間才會超過投入；步驟固定，才能寫成程式。','重複、固定、易出錯的先自動化。',['c',[['適合','重複、步驟固定｜容易出錯','a'],['不適合','很少做｜每次都不一樣','off']]]],
['腳本語言',['PowerShell 是用指令和腳本管理 Windows 和相關服務的工具。','很多管理動作在圖形介面要點選很久，用 PowerShell 一行就能對很多台完成。','指令可以保存成腳本，下次直接重複使用。'],'要查詢一百台電腦的作業系統版本。用一行指令對清單上的所有電腦查詢並輸出成表格。','一台一台用遠端桌面登入，打開設定頁面抄下來。','圖形介面是為了一次操作一台而設計的。指令可以被重複執行、可以對一份清單逐一執行、可以保存下來下次再用。','PowerShell：用指令和腳本管理 Windows。',['t',['PS> Get-Service -Name Spooler','Status   Name      DisplayName','------   ----      -----------','Running  Spooler   Print Spooler']]],
['排程',['要讓腳本每天固定時間自動執行，使用作業系統的排程功能。','Windows 是工作排程器，Linux 是 cron。','排程也讓工作可以在沒有人上班的時間執行。'],'備份的腳本設定在每天凌晨兩點由排程執行。','每天提醒自己手動執行一次。放假或忙碌的時候就忘記了。','固定時間要做的事交給系統來記，比交給人可靠。排程也讓工作可以在沒有人上班的時間執行。','定時執行用排程：Windows 工作排程器、Linux cron。',['c',[['Windows','工作排程器'],['Linux','cron']]]],
['腳本設計',['腳本裡的伺服器名稱和路徑，要寫成參數或變數。','不要散落在程式的各處。','換環境時只需要修改一個地方。'],'腳本的開頭定義伺服器名稱和路徑的變數，後面都使用變數。要用在另一個環境時只改開頭的幾行。','伺服器名稱直接寫在腳本裡的十幾個地方。換伺服器時漏改了兩處。','同一個值出現在很多地方，修改時就必須全部找到。集中成一個變數，值只存在一個地方。','會變的值寫成參數或變數，集中在一處。',['c',[['散落各處','環境一變｜要改很多地方','w'],['集中成參數','只改一處','a']]]],
['測試',['會修改或刪除東西的腳本，正式執行前要先在測試環境試跑。','或是用只顯示不執行的模式確認。','很多工具有預演模式，會列出「將要做什麼」而不真的執行。'],'清理舊檔案的腳本先用預演模式執行，檢查列出的檔案是不是預期的那些，確認後才真的執行。','寫完就直接在正式環境執行。篩選的條件寫錯，刪除了不該刪的檔案。','腳本會忠實而快速地執行寫下的指令，包括寫錯的。會造成改變的動作無法輕易復原，所以要先看到它打算做什麼。','會改東西的腳本先預演或在測試環境試跑。',['f',['寫好腳本','預演模式｜或測試環境','確認結果','正式執行'],null,['','a','a','']]],
['版本控制',['管理用的腳本也要放進版本控制。','可以知道誰在什麼時候改了什麼，改壞了能退回。','排程執行的版本，要和儲存庫裡的是同一份。'],'腳本都放在團隊的儲存庫裡。排程執行的是儲存庫裡的版本，修改都有紀錄。','腳本散落在每個人的電腦和各台伺服器上，有好幾個內容略有不同的版本。','腳本就是程式，會被修改、會改壞、會有多人經手。沒有版本控制，最後沒有人知道哪一份才是正在使用的版本。','腳本也要進版本控制。',['c',[['散在各人電腦','不知道哪份是對的','w'],['放進版本控制','誰改了什麼｜改壞能退回','a']]]],
['可維護性',['腳本的開頭要寫清楚用途、參數和注意事項。','這是為了之後接手的人，包括半年後的自己。','沒有說明的腳本，別人不敢修改也不敢執行。'],'腳本開頭有幾行說明：這是做什麼的、需要哪些參數、執行前要注意什麼。','沒有任何說明。接手的人不敢修改也不敢執行，最後只能重寫。','腳本的作者在撰寫的當下很清楚它的用途和限制，但這些不會自動留在程式裡。幾行說明的成本很低。','腳本開頭寫用途、參數、注意事項。',['t',['# 用途：清除 30 天以前的暫存檔','# 參數：-Path 目標資料夾','# 注意：會直接刪除，先用 -WhatIf 預演']]],
['權限',['排程執行的自動化腳本，只給完成這件工作需要的最小權限。','腳本被竄改或有錯誤時，權限愈大，災情愈大。','不要所有的排程都用管理員帳號執行。'],'備份腳本使用的帳號只能讀取要備份的資料夾，以及寫入備份的目的地。','所有的排程都用系統管理員的帳號執行。一支腳本有錯誤，刪除了系統的檔案。','自動執行的腳本沒有人在旁邊看著，出錯時不會有人即時阻止。它使用的帳號決定了最壞的情況有多壞。','排程腳本用最小權限的帳號。',['c',[['管理員權限','出錯時災情最大','w'],['最小權限','只做得到該做的事','a']]]]],
1:[
['組態管理',['組態管理工具的宣告式寫法，是描述系統最後應該是什麼狀態。','由工具決定怎麼達成。','重複執行也只會補上差異。'],'寫「這個套件要存在、這個服務要在執行中」。套件已經安裝的主機，工具什麼都不做。','寫成一連串的安裝指令。第二次執行時因為已經安裝過而出錯。','指令式的寫法假設了起始的狀態。宣告式只描述目標，工具會先檢查現況再決定要做什麼，所以不管起始狀態是什麼，結果都一樣。','宣告式：寫「要是什麼樣子」，不寫「怎麼做」。',['c',[['指令式','執行安裝指令｜重複執行可能出錯','off'],['宣告式','這個套件要存在｜重複執行只補差異','a']]]],
['工具特性',['Ansible 這類無代理程式的工具，是透過既有的遠端連線（例如 SSH）來管理主機。','不必先在每台主機上安裝東西。','代價是每次要建立連線，主機很多時速度比較慢。'],'只要主機開放 SSH 並有對應的帳號，就可以立刻用工具管理它。','以為所有的自動化工具都要先在每台主機上安裝代理程式。','有代理程式的工具需要先部署和維護代理程式，但之後反應快。無代理程式的工具起步容易，但每一次執行都要逐台連線。','無代理程式：走既有的 SSH，不必先裝東西。',['c',[['無代理程式','走既有的遠端連線｜起步容易'],['代價','每次要建立連線｜大量主機時較慢','off']]]],
['清冊',['主機清冊定義有哪些主機、怎麼分組。','它決定動作套用到誰。','分組做得好，就可以說「先套用到測試組」。'],'清冊裡把主機分成測試組和正式組、網頁伺服器和資料庫伺服器。執行時指定「測試組的網頁伺服器」。','每次執行都手動輸入主機名稱。漏掉幾台，或是打錯而套用到不該套用的主機。','自動化的動作通常是針對一類主機的。把分類事先定義好，執行時只要指定類別。','清冊：有哪些主機、怎麼分組。',['c',[['測試組','先套用'],['正式組','確認後再套用'],['依角色分組','網頁、資料庫…']]]],
['範本',['要產生很多份只有少數欄位不同的設定檔，用範本加上變數自動產生。','差異只存在於變數裡。','要修改共同的部分時，只需要改範本。'],'一份範本加上一張每台主機的變數表，產生一百份設定檔。要修改共同的部分時只改範本。','複製一份再手動修改，重複一百次。其中幾份改錯了。','大量重複的手動修改一定會出錯。範本把相同的部分只寫一次，把不同的部分明確地列出來。','範本加變數：共同的寫一次，不同的放變數。',['f',['一份範本','加上每台的變數','產生一百份設定檔'],null,['a','','']]],
['錯誤處理',['自動化腳本執行到某一步失敗時，預設要停下來並回報。','不要帶著錯誤繼續往下執行。','後面的步驟通常假設前面的步驟已經成功。'],'腳本的第三步「備份現有設定」失敗，腳本立刻停止，沒有執行第四步「覆蓋設定」。','腳本忽略錯誤繼續執行。備份失敗了，但設定還是被覆蓋了。','後面的步驟通常假設前面的步驟已經成功。前提不成立時繼續執行，結果無法預期，而且會讓問題更難復原。','失敗就停下來回報，不要帶著錯誤往下做。',['f',['第一步','第二步','第三步失敗','停止並回報'],null,['','','w','a']]],
['機密管理',['自動化腳本需要的密碼，放進版本控制時要用工具加密。','或是在執行時從密鑰管理系統取得。','不放明文。'],'儲存庫裡的密碼是加密過的，只有執行自動化的系統持有解密的金鑰。','把密碼用明文寫在設定檔裡提交。之後即使刪除，它仍然在歷史紀錄裡。','版本控制會永久保留歷史，而且儲存庫會被很多人複製。明文的密碼一旦進去就很難清除乾淨。','自動化的密碼：加密，或執行時才取得。',['c',[['明文進版本控制','永遠留在歷史裡','w'],['加密｜或執行時取得','儲存庫裡沒有明文','a']]]],
['部署策略',['要把新設定套用到很多台主機，先套用少數幾台確認。','再分批擴大。','分批讓錯誤只影響一小部分，還來得及停止。'],'兩百台主機：先套用兩台，確認正常；再套用二十台；最後才是其餘的。','一次套用到兩百台。設定有一個錯誤，兩百台同時出問題。','自動化可以很快地把正確的設定套用到所有主機，也可以同樣快地把錯誤套用上去。分批是對這種速度的保護。','套用設定要分批：先少數、再擴大。',['f',['先 2 台','確認','再 20 台','其餘全部'],null,['a','','','']]],
['紀錄',['自動化執行的結果要留下紀錄。','出問題時才知道對哪些主機做了什麼、哪些成功、哪些失敗。','紀錄要能回答：哪幾台失敗、為什麼失敗。'],'執行完成後的報告顯示：一百九十七台成功、三台失敗，並列出失敗的主機和原因。','沒有紀錄。兩百台裡有三台失敗了，但沒有人知道是哪三台。','自動化一次處理很多台主機，人不可能逐一觀察。紀錄是知道實際發生了什麼的唯一方式。','自動化要留紀錄：對誰做了什麼、成功或失敗。',['c',[['成功','197 台'],['失敗','3 台｜哪幾台、為什麼','w']]]]],
2:[
['組態漂移',['組態漂移是主機的實際設定逐漸偏離了應有的標準。','原因通常是有人手動修改了幾台而沒有記錄。','定期用工具比對和修正，可以收斂回來。'],'每天由組態管理工具檢查所有主機，發現有三台的設定和定義不同，自動修正並記錄。','主機建立之後就沒有再檢查。兩年後每一台的設定都有一點不一樣，同樣的操作在不同主機上結果不同。','每一次手動的修改都很小，也都有當下的理由。但它們會累積，而且沒有人知道全貌。','組態漂移：實際設定偏離標準；定期比對修正。',['f',['標準的設定','有人手動修改','每台愈來愈不同','工具比對並修正'],null,['','w','w','a']]],
['基礎設施即程式碼',['用程式碼定義基礎設施之後，可以重複執行同一份定義。','快速建立一套一模一樣的環境。','這也是災難復原和測試環境的基礎。'],'需要一套和正式環境相同的測試環境。用同一份定義、換一組參數，一小時內就建立完成。','環境是幾年來手動一步一步建立的。沒有人能完整說出它是怎麼設定的，也無法再建立一套相同的。','手動建立的環境，它的「定義」只存在於它本身。寫成程式碼之後，定義和環境分開了，環境可以隨時依照定義重新產生。','環境寫成程式碼，就能重複建立。',['f',['一份定義','執行','正式環境','再執行一次｜測試環境'],null,['a','','','']]],
['變更流程',['基礎設施的程式碼要套用到正式環境時，先產生變更計畫給人審查。','核准之後由管線自動套用。','計畫會列出將要新增、修改、刪除什麼。'],'計畫顯示這次的變更會刪除一個資料庫。審查的人發現這不是預期的，在套用之前就攔下來。','修改完程式碼就直接套用。套用之後才發現一個資源被刪除並重新建立，上面的資料沒有了。','程式碼的修改和它對實際環境造成的影響，中間的關係不一定直觀。計畫把實際會發生的事明確地列出來。','先看變更計畫，核准後再自動套用。',['f',['修改程式碼','產生變更計畫','人審查','管線自動套用'],null,['','a','a','']]],
['狀態管理',['基礎設施即程式碼工具的狀態檔，記錄了程式碼和實際資源的對應。','它常常含有機密；損毀或多人同時修改會造成混亂。','要集中存放、加密，並有鎖定的機制。'],'狀態檔放在有加密和存取控制的遠端儲存空間。有人正在套用變更時，其他人會被鎖定而無法同時執行。','狀態檔放在各自的電腦上。兩個人各自套用變更，彼此的狀態不一致，工具開始嘗試刪除對方建立的資源。','工具依靠狀態檔來知道哪些資源是它管理的。狀態檔錯了，工具對現況的認知就是錯的。','狀態檔：集中存放、加密、要有鎖定。',['c',[['放在個人電腦','各改各的｜狀態不一致','w'],['集中存放','加密、存取控制｜鎖定機制','a']]]],
['模組化',['把常用的設定包成可以重複使用的模組。','各個團隊使用同一套經過驗證的做法。','修正時改一個地方，所有使用的地方跟著更新。'],'公司有一個「標準網頁伺服器」的模組，已經包含了安全的設定和監控。各團隊直接使用。','每個團隊各自撰寫建立伺服器的程式碼。做法各不相同，有些遺漏了安全設定。','同樣的需求被重複實作，每一份都要分別維護，品質也不一致。模組把最好的做法集中在一個地方。','常用的設定做成模組，大家共用。',['c',[['各自撰寫','做法不一｜品質不一','w'],['共用模組','經過驗證｜改一處全部更新','a']]]],
['測試',['自動化的變更在套用到正式環境之前，先在和正式環境相近的測試環境套用。','並檢查結果。','語法正確不代表結果正確。'],'變更先套用到測試環境，並自動檢查服務是否正常回應。通過之後才進入正式環境的流程。','只做了語法的檢查就套用。語法沒有問題，但服務在新的設定下無法啟動。','語法檢查只能確認程式碼寫得合乎規則。變更的實際效果，只有真的執行之後才看得到。','先在相近的測試環境實際套用並檢查。',['f',['語法檢查','套用到測試環境','檢查服務正常','套用到正式環境'],null,['','a','a','']]],
['回復',['自動化套用新設定之後服務異常，最快的回復方式通常是把版本控制退回上一版。','然後重新套用。','不要登入主機手動改回去，那會產生沒有記錄的狀態。'],'套用之後服務異常。退回上一個版本並重新執行管線，五分鐘後恢復。','登入主機手動把設定改回去。改得不完整，而且主機的狀態和版本控制裡的不一致了。','設定都在版本控制裡，上一個可以正常運作的狀態是明確而且可以重現的。手動修改則會產生一個沒有記錄的新狀態。','出問題就退回上一版重新套用。',['f',['套用新設定','服務異常','版本控制｜退回上一版','重新套用'],null,['','w','a','a']]],
['機密管理',['管線執行時需要雲端的存取金鑰，比較安全的做法是在執行時動態取得短期的憑證。','不儲存長期的金鑰。','短期憑證即使被取得，很快就失效。'],'管線執行時向雲端平台證明自己的身分，取得一組十五分鐘有效的憑證。','把一組永久有效的金鑰存放在管線的設定裡。金鑰外洩之後被使用了好幾個月。','長期的金鑰需要保存，保存就有外洩的可能，而且外洩之後可以一直被使用。短期的憑證即使被取得，很快就失效。','管線用短期憑證，不存長期金鑰。',['c',[['長期金鑰','外洩後可以一直用','w'],['短期憑證','很快就失效','a']]]]],
3:[
['優先順序',['決定先自動化哪些工作，依據是發生的頻率、每次耗費的時間和出錯的風險。','每天做十次的小事，可能比一年一次的大工程更值得先做。','先列出所有重複的工作，估算一年花費的總時間再排序。'],'列出所有重複的工作，估算每一項一年花費的總時間和出錯的後果，依此排序。','先自動化技術上最有趣的那一項。','人力有限，自動化本身也要花時間。把投入放在回報最高的地方。','自動化的順序看：頻率、耗時、出錯的風險。',['c',[['頻率','多常做'],['耗時','每次多久'],['風險','出錯的後果']]]],
['平台化',['把常見的需求（例如申請主機、開通權限）做成自助服務。','資訊單位從重複執行請求，轉為維護平台和規則。','前提是把規則寫進平台：配額、核准、命名、到期回收。'],'開發人員在入口網站選擇規格，十分鐘後取得一台符合公司標準的主機。三十天後系統詢問是否還需要。','做了自助服務但沒有任何規則。資源被大量建立而沒有人回收。','大部分的請求是標準的，處理它們不需要判斷。自助服務把這些交給使用者自己完成，但原本由人把關的事情必須改由平台來執行。','自助服務：把規則寫進平台。',['c',[['以前','逐一執行請求','off'],['自助服務','維護平台和規則','a'],['規則','配額、核准｜命名、到期回收']]]],
['政策即程式碼',['政策即程式碼是把合規的規則寫成可以自動檢查的程式。','在變更套用之前攔下違規的。','每一次變更都會被檢查，不必等到稽核。'],'「儲存空間不得公開存取」寫成規則。有人提交了會開放公開存取的變更，在管線裡被擋下。','規則寫在文件裡，每年稽核時才檢查。違規的設定已經存在了好幾個月。','文件上的規則依賴人去閱讀和遵守，稽核只能事後發現。寫成程式之後，每一次變更都會被檢查，違規在發生之前就被阻止。','規則寫成程式，違規的變更在管線裡就被擋下。',['f',['提交變更','政策檢查','違規｜擋下','合規｜套用'],null,['','a','w','']]],
['風險控制',['自動化工具擁有對所有主機的管理權限。','它被入侵或誤用時，影響的是全部的主機。','存取控制、變更審查、執行紀錄都要做到位。'],'自動化平台的存取需要多因素驗證；套用到正式環境的變更需要另一個人審查；所有的執行都有紀錄。','把自動化平台當成一般的內部工具，很多人有完整的權限，密碼也很簡單。','自動化平台集中了對所有系統的控制權，是攻擊者最有價值的目標之一，也是一個錯誤可以造成最大影響的地方。','自動化平台是最高價值的目標，要嚴格保護。',['c',[['風險','被入侵或誤用｜影響全部主機','w'],['做法','存取控制｜變更審查｜執行紀錄','a']]]],
['維護',['早年寫的大量腳本，原作者離職之後沒有人敢動。','要避免這種狀況，就把自動化當成正式的程式碼來管理。','有負責人、文件、審查和測試。'],'每一支自動化程式都有登記的負責人和說明，修改要經過審查。','腳本是某個人為了自己方便寫的，後來變成每天的作業都依賴它。他離職之後沒有人了解它。','沒有人懂的自動化比手動更危險，因為它還在自動地執行。它做的事不再有人能確認是否正確，出問題時也沒有人能處理。','自動化要當成正式的程式管理：負責人、文件、審查、測試。',['c',[['負責人','誰在維護'],['文件','做什麼、怎麼用'],['審查和測試','修改前有人看、有驗證']]]],
['GitOps',['GitOps 是以版本控制中的內容為唯一的依據。','由系統自動讓實際的環境和它一致。','想要修改環境，就修改儲存庫。'],'要調整服務的數量，提出一個修改設定檔的合併請求。合併之後系統自動把環境調整成新的設定。','直接用指令修改環境。儲存庫和實際的環境不一致，沒有人知道哪一個才是對的。','所有的變更都經過版本控制，所以誰改的、為什麼改、怎麼退回，全部都在版本紀錄裡。系統持續比對，也會修正手動造成的偏離。','GitOps：改環境就是改儲存庫。',['f',['修改儲存庫','審查並合併','系統自動同步','環境和儲存庫一致'],null,['a','','','']]],
['人工核准',['不是所有的動作都應該全自動。','高風險或不可逆的動作要保留人工核准。','自動化的目標是減少無意義的人工，不是拿掉判斷。'],'管線自動完成建置、測試和部署到測試環境。部署到正式環境，以及任何刪除資料的動作，需要一個人按下核准。','追求完全不需要人介入。一個自動觸發的清理程序刪除了正式的資料。','重複而明確的工作不需要人的判斷。但有些動作的後果很嚴重而且無法復原，這時候一個人的確認是很便宜的保險。','高風險、不可逆的動作保留人工核准。',['c',[['可以全自動','重複、可回復的'],['保留人工核准','高風險｜不可逆的','a']]]],
['成效衡量',['向管理階層說明自動化的成效，最有說服力的是三個數字的變化。','節省的工時、變更失敗率、處理時間。','腳本的行數和工具的數量是投入，不是成果。'],'報告顯示：建立主機從三天縮短到十五分鐘，變更失敗率從百分之十二降到百分之三，每個月節省約兩百個工時。','報告「寫了三百支腳本、導入了四套工具」。','行數和工具的數量是投入。管理階層關心的是結果：是不是更快、更穩定、更少出錯。','自動化的成果：更快、更穩、更少出錯。',['c',[['節省的工時','人力用在別處'],['變更失敗率','更穩定'],['處理時間','更快']]]]]};

['基礎',['軟體測試的主要目的是在使用者之前找出問題。','測試只能證明有錯，不能證明沒有錯。','目標是把風險降到可以接受的程度。'],'上線前測試發現了十五個問題，其中三個會讓使用者無法完成結帳。','認為「測試通過就代表沒有 bug」。測試只檢查了被測試到的情況。','軟體可能的輸入和狀態是無限多的，不可能全部測試。測試是用有限的資源，盡可能找出最重要的問題。','測試是在使用者之前找出問題；不能證明沒有錯。',['c',[['目的','在使用者之前｜找出問題','a'],['限制','只能證明有錯｜不能證明沒錯','off']]]],
['測試層級',['測試的範圍由小到大是單元測試、整合測試、系統測試。','先確認每個小零件正確，再看組合起來對不對。','最後看整體是否符合需求。'],'計算運費的函式有單元測試；訂單和庫存兩個模組之間有整合測試；整個下單的流程有系統測試。','只做最後的系統測試。發現問題時，很難判斷是哪一個部分造成的。','範圍愈小的測試，執行愈快，失敗時愈容易找到原因。範圍愈大的測試愈接近實際的使用，但愈慢、愈難定位問題。','單元、整合、系統：範圍由小到大。',['f',['單元測試｜一個小零件','整合測試｜零件組合起來','系統測試｜整體'],null,['','','']]],
['測試案例',['一個完整的測試案例，除了操作的步驟，一定要有預期的結果。','沒有預期的結果，就無法判斷是通過還是失敗。','預期結果要在執行之前就寫下來。'],'測試案例：「輸入錯誤的密碼五次。預期結果：帳號被鎖定，並顯示鎖定的訊息。」','測試案例只寫「測試登入功能」。兩個人執行，對於結果算不算正確有不同的看法。','測試是比較「實際發生的」和「應該發生的」。後者沒有事先寫下來，就會變成執行的人當下的主觀判斷。','測試案例一定要有預期結果。',['c',[['操作步驟','做什麼'],['預期結果','應該看到什麼','a']]]],
['回歸測試',['修正一個 bug 之後，還要重新測試原本正常的功能。','修改可能意外影響到其他的地方。','這叫回歸測試。'],'修正了折扣計算的問題。重新執行全部的自動化測試，發現運費的計算因此出錯了。','只確認修正的那個問題已經解決就上線。','程式的各個部分互相關聯，很多關聯是修改的人不知道的。修改 A 而讓 B 出錯，是軟體最常見的狀況。','改了之後，原本正常的也要重測。',['f',['修正 A','重測 A','也重測 B、C','確認沒有改壞'],null,['','','a','']]],
['缺陷回報',['回報 bug 時最重要的是提供可以重現的步驟、預期的結果和實際的結果。','環境、版本、畫面截圖也都有幫助。','開發人員重現不出來，就無法修正。'],'回報：「在 Chrome 的某個版本，登入後點選『我的訂單』再點『匯出』。預期：下載檔案。實際：出現空白頁。附上截圖。」','回報：「匯出壞了。」開發人員試了一下可以正常匯出，把問題退回。','開發人員要先看到問題才能修正它。很多問題只在特定的條件下發生，回報的人知道這些條件，但沒有寫下來。','回報 bug：重現步驟、預期結果、實際結果。',['c',[['重現步驟','怎麼做會發生','a'],['預期結果','應該怎樣'],['實際結果','實際怎樣']]]],
['測試設計',['輸入欄位限制 1 到 100，最應該測試邊界附近的值。','0、1、100、101。','錯誤最常出現在邊界。'],'測試 0 和 101 應該被拒絕，1 和 100 應該被接受。發現 100 被拒絕了：程式把「小於等於」寫成了「小於」。','只測試 50。它在任何寫法下都會通過。','範圍的檢查是用比較運算寫成的，最常見的錯誤是大於和大於等於寫錯。這種錯誤只會在邊界上表現出來。','測邊界：0、1、100、101。',['c',[['0','應拒絕','w'],['1','應接受','a'],['100','應接受','a'],['101','應拒絕','w']]]],
['環境',['測試要在獨立的測試環境進行。','不影響正式的資料和使用者。','在正式環境測試，測試資料會混進真實的資料。'],'在測試環境建立大量的測試訂單，測試結束後直接清除整個資料庫。','在正式環境測試。測試的訂單出現在營運的報表裡，測試時還不小心修改了真實客戶的資料。','測試需要建立、修改和刪除資料，也會刻意嘗試錯誤的操作。這些在正式環境都會造成實際的影響。','測試在獨立的環境做。',['c',[['正式環境','測試資料混進真資料｜測壞就是事故','w'],['測試環境','可以放心測','a']]]],
['驗收',['使用者驗收測試（UAT）是由實際使用的人確認系統符合業務的需求。','功能都正確，但流程不符合實際的作業，還是不能用。','這只有每天實際做這件工作的人看得出來。'],'實際使用系統的承辦人員照著平常的工作流程操作一遍，發現有一個步驟的順序和實際作業不同。','由開發團隊自己做驗收。所有的功能都符合規格，但上線後使用者說無法照這樣工作。','開發和測試人員驗證的是系統有沒有照規格做。規格是否正確描述了實際的工作，只有每天做這件工作的人才能判斷。','UAT：使用的人確認符不符合實際作業。',['c',[['開發和測試','有沒有照規格做'],['使用者驗收','符不符合實際作業','a']]]]],

['自動化',['測試金字塔的建議：大量而快速的單元測試、適量的整合測試、少量的端到端測試。','端到端的測試很慢，而且容易失敗。','底層測得扎實，上層只需要驗證關鍵的流程。'],'專案有兩千個單元測試（一分鐘執行完）、兩百個整合測試、二十個端到端測試（只涵蓋最重要的流程）。','所有的測試都是從畫面操作的端到端測試。執行一次要四個小時，而且每次都有幾個莫名失敗。','愈上層的測試涉及的部分愈多，愈慢，也愈容易因為無關的原因失敗。把大部分的驗證放在快速而穩定的底層。','金字塔：單元測試多、整合適量、端到端少。',['c',[['端到端','少量｜慢、容易壞'],['整合測試','適量'],['單元測試','大量｜快、穩定','a']]]],
['測試資料',['自動化測試有時通過有時不通過，常見的原因是測試之間共用資料，或彼此有相依。','每個測試應該自己準備資料、自己清理。','不依賴執行的順序。'],'每個測試開始時建立自己需要的帳號和訂單，結束時刪除。測試可以用任何順序、甚至同時執行。','測試 B 使用測試 A 建立的資料。A 失敗或順序改變時，B 也跟著失敗。','測試之間有隱含的相依，結果就取決於執行的順序和時機，而這些不是固定的。每個測試獨立，結果才只取決於被測試的程式。','每個測試自己準備資料、自己清理。',['c',[['共用資料｜互相依賴','時過時不過','w'],['各自準備和清理','結果穩定','a']]]],
['缺陷管理',['bug 的嚴重度是影響有多大。','優先度是多快要修正。','兩者不一定一致。'],'首頁標題的錯字：嚴重度低，但優先度高。一個很少人使用的功能會當機：嚴重度高，但優先度可能比較低。','只用一個「等級」欄位。嚴重但很少發生的問題和輕微但人人看到的問題無法區分。','嚴重度是問題本身的性質，由技術的角度判斷。優先度是業務的決定，還要考慮有多少人受影響、對形象的影響、有沒有替代的做法。','嚴重度是影響多大，優先度是多快要修。',['c',[['嚴重度','影響有多大'],['優先度','多快要修'],['例子','首頁錯字：｜嚴重度低、優先度高']]]],
['測試方法',['探索式測試是不照腳本，一邊操作一邊依照發現調整方向來找問題。','腳本只會找到預想得到的問題。','有經驗的人自由探索，常常能找出意外的缺陷。'],'測試人員花一小時自由操作新功能：嘗試不尋常的順序、中途返回、同時開兩個分頁。發現了三個腳本沒有涵蓋的問題。','只執行事先寫好的測試案例。所有案例都通過，但使用者第一天就遇到了問題。','測試案例是依據設計時的理解寫的，反映的是當時想得到的情況。實際操作時觀察到的現象，會提示新的、原本沒有想到的方向。','探索式測試：邊操作邊找，挖出腳本想不到的問題。',['c',[['照腳本','找到預想得到的問題'],['探索式','依發現調整方向｜找到意外的問題','a']]]],
['效能',['負載測試是看預期用量下的表現。','壓力測試是找出極限，以及崩潰時的行為。','上線前要知道能支撐多少人，也要知道撐不住時是變慢還是直接當掉。'],'負載測試：模擬預期的一千人同時使用，回應時間符合要求。壓力測試：持續增加到三千人時開始出錯，系統是逐漸變慢而不是直接當掉。','只測試了預期的用量。活動當天流量是預期的三倍，系統直接當掉而且無法自行恢復。','上線前需要知道兩件事：正常的情況下夠不夠快，以及超過負荷時會發生什麼。後者決定了意外發生時的損害。','負載測試看預期用量；壓力測試找極限。',['c',[['負載測試','預期用量下的表現'],['壓力測試','極限在哪｜撐不住時怎樣','a']]]],
['指標',['測試涵蓋率達到 90% 不代表品質很好。','程式被執行到，不代表有被正確地驗證。','涵蓋率低是警訊，但高涵蓋率可以用沒有檢查結果的測試做出來。'],'檢視測試的內容，發現很多測試只是呼叫函式而沒有檢查回傳的結果。涵蓋率很高，但這些測試找不到任何錯誤。','把涵蓋率訂為考核的目標。大家開始寫只為了提高數字的測試。','涵蓋率量測的是測試執行時經過了哪些程式，不是測試檢查了什麼。它適合用來找出完全沒有被測試的部分。','涵蓋率高不等於品質好：執行到不代表有驗證。',['c',[['涵蓋率低','警訊：有地方沒測到','w'],['涵蓋率高','不保證有驗證結果','off']]]],
['持續整合',['把自動化測試放進持續整合的流程，每一次提交都執行。','問題在被引入的當下就被發現。','剛修改的時候最容易修正。'],'提交之後十分鐘，測試失敗的通知就到了。問題一定在剛才的那次提交裡。','每個月測試一次。失敗時要從幾百個變更裡找出是哪一個造成的。','剛修改的時候，作者還記得改了什麼，可能的原因也只有這一次的變更。時間愈久，累積的變更愈多，找原因愈困難。','每次提交都跑測試，問題當下就發現。',['f',['提交','自動執行測試','失敗：馬上知道','原因就在這次提交'],null,['','a','w','']]],
['根因',['同一類型的 bug 一再出現時，除了一個一個修正，還要分析根本的原因。','從流程或設計上預防。','常見的共同原因：需求不清楚、缺少檢查、某個模組設計不良。'],'發現近三個月有八個 bug 都和日期的處理有關。分析後統一改用一個共用的日期處理元件，並加入審查的檢查項目。','每次都只修正眼前的那一個。同樣的錯誤在不同的地方繼續出現。','重複出現的問題通常有共同的來源：需求不清楚、缺少某種檢查、某個模組的設計不良。只處理個別的問題，來源還在。','同類 bug 一再出現：找共同原因，從源頭預防。',['f',['同類 bug｜一再出現','分析共同原因','從流程或設計｜預防'],null,['w','a','']]]],
2:[
['策略',['測試左移是在開發更早的階段就開始測試和檢查。','需求階段就檢視可測試性。','寫程式時就有自動化測試。'],'需求討論時測試人員就參與，並同步撰寫測試案例。開發完成時測試已經準備好了。','開發全部完成之後才交給測試。發現的問題很多要回到需求重新討論。','問題存在的時間愈長，建立在它上面的東西愈多，修正的成本愈高。把檢查的時間點往前移，問題在還很便宜的時候就被發現。','測試左移：愈早開始檢查愈好。',['f',['需求','設計','開發','測試'],'把檢查往左邊移',['a','a','','']]],
['需求',['測試人員參與需求審查，最大的價值是提早發現模糊、矛盾和無法驗證的需求。','需求錯了，照著做出來再測試，成本是最高的。','無法驗證的需求，通常就是不夠清楚的需求。'],'測試人員問：「『系統要夠快』是指幾秒以內？」這個問題讓需求被明確地定義。','需求寫「系統應該容易使用」。開發完成後，沒有人能說它算不算符合。','測試人員的工作是判斷結果對不對，所以會自然地從「這要怎麼驗證」的角度看需求。無法驗證的需求通常就是不夠清楚的需求。','測試參與需求審查：找出模糊和無法驗證的需求。',['c',[['模糊的','「要夠快」是幾秒？','w'],['矛盾的','兩項需求互相衝突','w'],['無法驗證的','「容易使用」怎麼測？','w']]]],
['風險',['時間不夠全部測完時，依風險排序決定測試的範圍。','影響大、改動多、過去常出錯的優先。','要讓大家知道哪些沒有測、風險在哪裡。'],'這次的修改集中在付款模組，而它過去問題最多。把大部分的時間放在這裡，並在報告中列出沒有測試的部分。','每個功能平均分配時間。最重要的部分沒有測試得足夠深入。','測試的資源永遠不夠。問題比較可能出現在剛修改過和以前常出錯的地方；出現在重要功能上的問題損害比較大。','測不完就依風險排序，並說明哪些沒測。',['c',[['優先測','影響大｜改動多｜過去常出錯','a'],['沒測的','要明確告知','w']]]],
['不穩定',['自動化測試有時通過有時不通過，而大家習慣了「重跑就好」。','後果是真正的失敗也會被當成不穩定而忽略。','不穩定的測試要修好或移除。'],'把所有不穩定的測試列出來，逐一修正；修不好的先移出主要的流程。測試失敗重新代表「真的有問題」。','測試失敗時第一個反應是重新執行。有一次是真的 bug，重跑第三次剛好通過，就上線了。','測試的價值在於失敗時傳達了訊息。失敗常常沒有意義的話，人就會停止相信它。','不穩定的測試要修好或移除，否則沒人相信失敗。',['f',['測試時過時不過','習慣重跑','真的失敗｜也被忽略'],null,['w','w','w']]],
['環境',['測試環境和正式環境差異很大時，測試通過不代表正式環境沒有問題。','資料量、設定、版本的差異，是「測試都通過卻上線出事」的主要原因。','測試環境的版本、設定和資料量要盡量接近正式環境。'],'讓測試環境使用和正式環境相同的版本和設定，並準備接近實際數量的資料。','測試環境只有一百筆資料。查詢在測試時很快，在有一千萬筆資料的正式環境要兩分鐘。','測試的結論只對被測試的環境成立。兩個環境的差異愈大，結論能套用到正式環境的程度愈低。','測試環境要盡量接近正式環境。',['c',[['資料量','差很多：效能問題測不到','w'],['設定和版本','不同：行為可能不同','w']]]],
['安全',['功能測試之外還需要安全測試。','功能正確不代表不能被濫用。','功能測試驗證「該做的有做」，安全測試驗證「不該做的做不到」。'],'功能測試確認使用者可以看到自己的訂單。安全測試嘗試查看別人的訂單，確認會被拒絕。','所有功能測試都通過就上線。使用者只要修改網址上的編號，就可以看到其他人的資料。','功能測試是照著預期的使用方式進行的。攻擊者做的是預期之外的事。這需要用不同的角度去測試。','安全測試：確認不該做的做不到。',['c',[['功能測試','該做的有做'],['安全測試','不該做的做不到','a']]]],
['相容',['要支援的瀏覽器和裝置組合太多、無法全部測試時，依使用者實際的分布挑選主要的組合。','使用統計會告訴你哪些組合值得花時間。','主要的組合完整測試，其餘的做基本確認。'],'使用統計顯示九成的使用者集中在四種組合。完整測試這四種，其餘的只做基本的確認。','想要測試所有的組合，時間不夠，結果每一種都只是稍微看一下。','每一種組合的使用者數量差異很大。把時間放在多數人使用的組合上。','相容性測試：照使用者實際的分布挑組合。',['c',[['主要的組合','完整測試','a'],['其餘的','基本確認','off']]]],
['驗收',['使用者驗收時發現「做出來的不是我要的」，根本的原因通常在需求階段沒有對齊。','中間也沒有讓使用者提早看到。','愈早讓使用者看到可以操作的東西，落差愈小。'],'每兩個星期讓使用者操作一次已經完成的部分。落差在一開始就被發現並調整。','開發了六個月，驗收時使用者才第一次看到系統。','文字描述的需求，每個人想像的畫面都不一樣。只有實際看到、操作到，使用者才能確定這是不是他要的。','愈早讓使用者看到可以操作的東西，落差愈小。',['f',['需求對齊','提早給使用者看','逐步調整','驗收'],null,['a','a','','']]]],
3:[
['文化',['「品質是測試人員的責任」這種想法的問題在於，品質是整個團隊做出來的，不是測試出來的。','測試只能發現問題。','問題是在需求、設計和開發的時候產生的。'],'團隊把品質當成共同的責任：需求要清楚、設計要審查、開發人員自己寫測試。','出現問題時追究「測試為什麼沒有測到」。','測試不會讓產品變好，只會告訴你它有多不好。要減少問題，必須在產生問題的地方改善。','品質是做出來的，不是測出來的。',['c',[['問題產生的地方','需求、設計、開發','a'],['測試','只能發現問題','off']]]],
['正式環境',['現代的做法中，「在正式環境測試」是指用小流量、功能開關和監控，在真實的環境驗證。','有些問題只在真實的流量下出現。','前提是能夠快速發現和回復。'],'新功能先對百分之一的使用者開啟，監控錯誤率和回應時間。沒有異常才逐步擴大；有異常就立刻關閉開關。','沒有任何保護就直接對所有使用者開啟。','測試環境無法完全模擬真實的資料、流量和使用方式。有控制地在真實環境驗證，可以發現這些問題，同時把影響限制在很小的範圍。','在正式環境驗證：小流量、功能開關、監控。',['f',['對少數使用者開啟','監控','有異常｜關閉開關','正常｜逐步擴大'],null,['a','','w','']]],
['混沌工程',['混沌工程是刻意製造故障，驗證系統的韌性是否如預期。','與其等故障自己發生，不如在可以控制的情況下先練習。','要在有人看著、可以隨時停止的情況下進行。'],'在上班時間、有人看著的情況下，刻意關閉一台伺服器。確認流量自動轉移、告警有發出。','備援機制設計好之後從來沒有實際測試過。真的故障時才發現切換的設定是錯的。','容錯的機制平常不會被用到，所以它有沒有正常運作沒有人知道。故障一定會發生，問題只是第一次發現它無效的時機。','混沌工程：刻意製造故障，驗證韌性。',['f',['刻意製造故障','觀察系統的反應','如預期：確認','不如預期：修正'],null,['w','','a','']]],
['度量',['最能反映測試和品質成效的指標，是上線後才被發現的缺陷數量和嚴重度。','案例數是投入。','每一個漏到使用者面前的問題，都要分析為什麼沒有先被發現。'],'追蹤每一次上線後由使用者回報的問題數量和嚴重度，並分析每一個為什麼沒有在上線前被發現。','報告「本期執行了五千個測試案例，通過率百分之九十八」。','測試的目的是不讓問題到達使用者。這個指標直接量測了這個目的達成的程度。','看結果：有多少問題漏到使用者面前。',['c',[['投入','執行了多少測試案例','off'],['結果','上線後才發現的缺陷','a']]]],
['自動化',['自動化測試的維護成本愈來愈高，通常是因為太依賴從介面操作的脆弱測試。','畫面一修改，測試就大量失敗。','要把驗證往下移到介面以下的層級。'],'把大部分的商業邏輯驗證改成直接呼叫 API 的測試。介面的測試只保留少數關鍵的流程。','所有的驗證都透過模擬點擊畫面來進行。每次調整版面，就有上百個測試要修改。','介面是變動最頻繁的部分，而透過介面測試又要依賴很多容易改變的細節。同樣的邏輯在比較下層驗證，穩定而且快速得多。','別太依賴介面測試；把驗證往下移。',['c',[['從介面操作','畫面一改就壞一片','w'],['介面以下的層級','穩定、快速','a']]]],
['AI',['用 AI 產生測試案例時要注意：它可能照著程式碼現有的行為撰寫。','把錯的也當成對的。','測試要依據需求。AI 的產出仍然要由人審查。'],'請 AI 依據需求文件產生測試案例，由測試人員審查每一個案例的預期結果是否正確。','把程式碼交給 AI 產生測試，全部通過就認為程式是正確的。程式裡有一個計算錯誤，測試把這個錯誤的結果當成了預期值。','測試的作用是比較「程式做的」和「應該做的」。如果預期的結果是從程式本身推導出來的，測試只是確認程式和自己一致。','AI 產生的測試要依據需求，並由人審查。',['c',[['依據程式碼產生','把錯的也當成對的','w'],['依據需求｜人審查','才是真的驗證','a']]]],
['法遵',['受法規管制的系統，測試的證據要可以追溯。','對應到需求、有紀錄、可以稽核。','做了但沒有留下證據，在稽核上等於沒有做。'],'每一項需求都對應到測試案例，每一個案例的執行都留有紀錄：誰、什麼時候、用哪一個版本、結果是什麼。','測試確實做了，但沒有留下紀錄。稽核時無法證明。','稽核的人無法回到過去觀察，只能依據留下來的紀錄判斷。追溯的關係讓人可以確認每一項需求都有被驗證。','受管制的系統：需求、測試、紀錄要對得起來。',['f',['需求','對應的測試案例','執行的紀錄','可以稽核'],null,['','','a','']]],
['決策',['上線前還有已知的缺陷沒有修正時，能不能上線由了解業務風險的負責人依據充分的資訊決定。','測試的責任是把風險說清楚，不是替業務做決定。','報告要列出未修正的缺陷、各自的影響和替代的做法。'],'測試報告列出未修正的缺陷、每一個的影響和可能的替代做法。業務負責人據此決定延後一週上線。','由測試人員決定「可以上線」或「不能上線」。','是否上線需要權衡缺陷的風險和延後的代價，這是業務的判斷。測試人員掌握的是關於風險的資訊。','測試把風險講清楚；上不上線由業務負責人決定。',['c',[['測試的責任','把風險講清楚'],['決定的人','了解業務風險的負責人','a']]]]]};
LEARN.web={0:[
['基礎',['HTML 負責結構。','CSS 負責外觀。','JavaScript 負責互動的行為。'],'一個按鈕：HTML 定義「這裡有一個按鈕」，CSS 定義它是藍色圓角的，JavaScript 定義按下去之後要做什麼。','把樣式和行為都直接寫在 HTML 的標籤裡。要統一修改外觀時，必須逐一修改每一個頁面。','三者分工清楚，修改樣式不必動到內容，修改行為不必動到樣式。同一份樣式也可以套用到很多頁面。','HTML 結構、CSS 外觀、JavaScript 行為。',['c',[['HTML','結構'],['CSS','外觀'],['JavaScript','互動行為']]]],
['架構',['前端在使用者的瀏覽器執行。','後端在伺服器執行。','前端的一切使用者都看得到、改得了，重要的檢查要放在後端。'],'價格的計算在後端進行。前端只負責顯示後端回傳的金額。','在前端的 JavaScript 裡計算折扣後的價格再送給後端。有人修改了送出的金額。','前端的程式是送到使用者的電腦上執行的，使用者可以閱讀和修改它。只有在自己的伺服器上執行的程式，才是自己可以控制的。','前端在瀏覽器、後端在伺服器；重要的檢查放後端。',['c',[['前端','在瀏覽器執行｜使用者看得到、改得了'],['後端','在伺服器執行｜重要的檢查放這裡','a']]]],
['響應式',['響應式網頁設計是版面會依螢幕的大小自動調整。','同一份網頁在手機、平板、桌機都能正常使用。','不必為每一種裝置各做一套。'],'在桌機上是三欄並排的版面，在手機上自動變成一欄由上往下排列。','只針對桌機設計。在手機上字非常小，要不斷放大和左右滑動。','使用者用各種大小的螢幕瀏覽網頁，而且手機的比例很高。維護好幾套版本的成本很高，內容也容易不一致。','響應式：一份網頁，依螢幕大小自動調整。',['c',[['桌機','多欄並排'],['平板','欄數減少'],['手機','單欄由上往下']]]],
['工具',['瀏覽器的開發者工具可以檢查網頁的結構。','也可以查看網路請求和錯誤訊息。','網頁有問題時，先按 F12 看主控台有沒有紅字、請求有沒有失敗。'],'按鈕按了沒有反應。開啟開發者工具，主控台顯示一行紅色的錯誤，指出是哪一個檔案的哪一行。','只看畫面猜測原因。','網頁的問題很多不會顯示在畫面上。開發者工具直接顯示瀏覽器內部發生的事：載入了什麼、哪些失敗了、程式在哪裡出錯。','網頁怪怪的先按 F12：看主控台和網路請求。',['c',[['元素','檢查網頁結構和樣式'],['主控台','錯誤訊息（紅字）','w'],['網路','每個請求成功或失敗']]]],
['HTTP',['瀏覽器開啟網頁時，是送出請求，伺服器回傳內容。','一個頁面通常包含幾十個請求。','網頁本身、樣式、程式、圖片，各是一個請求。'],'在開發者工具的網路頁籤看到：開啟一個頁面共發出了六十個請求，其中一張圖片的請求失敗了。','以為開啟一個網頁就是下載一個檔案。','網頁的 HTML 裡引用了其他的檔案，瀏覽器讀到之後會再逐一去取得。頁面的載入速度取決於所有這些請求。','開網頁：瀏覽器送請求，伺服器回內容；一頁有幾十個請求。',['f',['瀏覽器送出請求','伺服器回傳 HTML','再請求樣式｜程式和圖片','組合成畫面'],null,['','','','']]],
['Cookie',['Cookie 主要用來讓伺服器記得這個瀏覽器。','例如維持登入的狀態。','Cookie 被偷，等於身分被偷。'],'登入之後伺服器給瀏覽器一個 Cookie。之後的每一個請求瀏覽器都自動帶上它，伺服器就知道這是同一位已經登入的使用者。','認為 Cookie 只是用來記錄喜好設定的小資料，不需要保護。','HTTP 本身不會記得前後的請求是不是同一個人送出的。Cookie 帶著識別的資訊，讓伺服器可以認出來。拿到這個 Cookie 的人，在伺服器看來就是這位使用者。','Cookie 讓伺服器記得你；被偷等於身分被偷。',['f',['登入','伺服器發給 Cookie','之後的請求｜自動帶上','伺服器認得你'],null,['','a','','']]],
['無障礙',['網頁上的圖片加上替代文字（alt），是為了使用螢幕閱讀器的人。','圖片載入失敗時也會顯示它。','台灣各級政府機關、機構和學校的網站，依規定要通過無障礙檢測並取得認證標章。'],'圖片的替代文字寫「本月各科門診人次的長條圖，內科最高」。螢幕閱讀器會把這段文字讀出來。','替代文字留空，或寫「圖片」。視覺障礙的使用者完全不知道這張圖的內容。','螢幕閱讀器把網頁的內容轉換成語音，但它無法理解圖片。替代文字是圖片內容的文字版本。','圖片要有替代文字；無障礙不是加分項。',['c',[['替代文字','螢幕閱讀器讀得到｜圖片失敗時顯示','a'],['台灣的規定','政府機關和學校網站｜要通過無障礙檢測']]]],
['快取',['網站已經更新，使用者卻還看到舊的畫面，最常見的原因是瀏覽器或中間的快取還保留著舊版。','可以請使用者強制重新整理。','開發上用檔名加上版本號的方式，讓更新之後一定取得新的檔案。'],'樣式檔的名稱裡含有版本的代碼，每次更新名稱就不同。瀏覽器看到新的名稱，就會重新下載。','更新了檔案但名稱不變。有些使用者好幾天都還在使用舊的版本。','瀏覽器會把下載過的檔案保存起來，下次直接使用以加快速度。它是用網址來判斷是不是同一個檔案的。','看到舊畫面多半是快取；檔名加版本號可以避免。',['c',[['檔名不變','瀏覽器沿用舊檔','w'],['檔名加版本號','更新後一定抓新的','a']]]]],
1:[
['瀏覽器安全',['瀏覽器的同源政策，限制網頁上的程式不能隨意讀取其他網站的資料。','這是瀏覽器安全的基礎。','需要跨網站存取時，由對方的伺服器用 CORS 明確允許。'],'前端在 a.example 的網頁要呼叫 b.example 的 API。b 的伺服器在回應裡加上允許 a.example 的標頭，瀏覽器才讓程式讀取結果。','遇到跨來源的錯誤，就在伺服器設定「允許所有來源」。任何網站上的程式都可以讀取這支 API 的回應。','使用者同時開著很多網站，瀏覽器裡有他在各個網站的登入狀態。沒有同源政策，任何一個惡意網站都可以用他的身分讀取其他網站的資料。','同源政策：網頁的程式不能亂讀別的網站；要跨站由對方用 CORS 允許。',['c',[['同源政策','預設不能讀取｜其他網站的資料','a'],['CORS','對方伺服器｜明確允許誰可以'],['不要','允許所有來源','w']]]],
['登入狀態',['Session 的做法是把狀態存在伺服器。','Token 的做法是把資訊帶在用戶端。','Token 方便多台伺服器和行動應用，但發出去之後不容易撤銷，效期要短。'],'行動 App 使用十五分鐘有效的 Token，到期時用另一個可以被撤銷的更新權杖換取新的。','發出效期一年的 Token。使用者的手機遺失了，沒有辦法讓那個 Token 失效。','Session 的資料在伺服器上，刪除它就立刻失效，但每台伺服器都要能查到它。Token 本身帶著資訊並由伺服器簽章，伺服器不必保存，但也因此無法直接讓它失效。','Session 狀態在伺服器；Token 帶在用戶端，效期要短。',['c',[['Session','狀態存在伺服器｜可以立刻撤銷'],['Token','資訊帶在用戶端｜不易撤銷，效期要短']]]],
['HTTPS',['HTTPS 的網頁裡載入 HTTP 的資源，瀏覽器會警告或擋下。','這叫混合內容。','沒有加密的內容可能被竄改，破壞整個頁面的安全。'],'把頁面上所有資源的網址都改成 HTTPS。','頁面是 HTTPS，但其中一個程式檔用 HTTP 載入。在咖啡廳的網路上，這個檔案被換成惡意的版本。','頁面上的程式可以讀取和修改整個頁面。只要有一個程式檔是經由沒有加密的連線載入的，攻擊者竄改它就可以控制整個頁面。','HTTPS 頁面的所有資源也都要是 HTTPS。',['c',[['全部 HTTPS','整頁安全','a'],['混合內容','一個 HTTP 的程式檔｜就能控制整頁','w']]]],
['建置',['前端程式上線前會打包和壓縮。','目的是減少檔案的數量和大小，加快載入。','壓縮不是安全措施，程式碼還是看得到。'],'一百個程式檔打包成三個並壓縮，總大小減少七成。','認為壓縮之後別人看不懂，就把 API 金鑰寫在前端的程式裡。','每一個檔案都是一個請求，檔案愈大傳輸愈久。壓縮只是移除空白和縮短名稱，程式的邏輯和裡面的字串都還在。','打包壓縮是為了速度，不是為了保密。',['c',[['目的','檔案更少更小｜載入更快','a'],['不是','安全措施｜機密不能放前端','w']]]],
['效能',['網頁載入很慢而原因是圖片很大時，要壓縮並調整成適當的尺寸。','畫面以外的圖片延後載入。','圖片通常是網頁最大的負擔。'],'把十幾 MB 的照片調整成實際顯示的尺寸並壓縮，每張剩下一兩百 KB。頁面下方的圖片等到使用者捲動到附近才載入。','把相機拍的原始照片直接放上網頁，用 CSS 把它縮小顯示。檔案還是完整下載了。','顯示的尺寸縮小不會讓下載的檔案變小。在手機的網路上，幾十 MB 的頁面要等很久，也耗費使用者的流量。','圖片要壓縮、調整尺寸、延後載入。',['f',['原始照片｜十幾 MB','調整尺寸','壓縮','畫面外的｜延後載入'],null,['w','','','a']]],
['防護',['內容安全政策（CSP）限制網頁可以載入和執行哪些來源的程式。','即使被注入了惡意的程式碼，瀏覽器也不會執行不在允許清單上的來源。','它是 XSS 的第二道防線。'],'網站設定只允許執行來自自己網域的程式。攻擊者注入了一段載入外部惡意程式的內容，瀏覽器拒絕執行。','認為有做輸出編碼就不需要 CSP。只要有一個地方遺漏了編碼，就沒有其他的保護。','輸出編碼要在每一個輸出的地方都做對，很難保證沒有遺漏。CSP 是由瀏覽器執行的整體限制，不依賴每一段程式都正確。','CSP：限制網頁能執行哪些來源的程式。',['c',[['允許清單上的來源','可以執行','a'],['其他來源','瀏覽器拒絕','w']]]],
['無障礙',['檢查網頁能不能只用鍵盤操作很重要。','有些使用者無法使用滑鼠，輔助工具也依賴鍵盤操作。','能用 Tab 走完所有功能、看得到目前的焦點，是最基本的檢查。'],'不使用滑鼠，只按 Tab 和 Enter 完成整個表單的填寫和送出，過程中始終看得到目前在哪一個欄位。','自己製作的下拉選單只能用滑鼠點選。使用鍵盤的人無法選擇。','很多輔助工具是透過模擬鍵盤來操作網頁的。鍵盤可以操作，大部分的輔助工具就可以使用。','只用鍵盤要能走完所有功能，並看得到焦點。',['c',[['Tab','能走到每一個功能','a'],['焦點','看得到目前在哪裡','a'],['只能用滑鼠的元件','擋住一部分使用者','w']]]],
['相容性',['網頁在自己的電腦上正常，使用者卻說版面跑掉。','要先確認對方的瀏覽器種類、版本和螢幕尺寸。','上線前要在主要的幾種環境測試過。'],'問了之後得知對方用的是舊版的瀏覽器。用同樣的版本測試，重現了問題。','回覆「我這邊是正常的」。','不同的瀏覽器和版本對網頁功能的支援程度不同，螢幕的大小也會影響版面。要重現問題，必須先知道對方的環境。','版面跑掉先問：什麼瀏覽器、哪個版本、多大的螢幕。',['c',[['瀏覽器種類','各家支援程度不同'],['版本','舊版可能不支援'],['螢幕尺寸','影響版面']]]]],
2:[
['效能',['核心網頁指標量測三件事。','載入的速度、互動的回應、版面的穩定。','量的是使用者實際的感受，不是伺服器的數字。'],'伺服器的回應時間很短，但指標顯示主要內容要四秒才出現，而且載入的過程中版面會跳動。問題在前端。','只監控伺服器的回應時間，認為它很快就代表網站很快。','伺服器回應之後，瀏覽器還要下載資源、執行程式、繪製畫面。使用者感受到的是整個過程。','核心網頁指標：載入、互動、版面穩定。',['c',[['載入速度','主要內容多久出現'],['互動回應','操作後多久有反應'],['版面穩定','載入時會不會跳動']]]],
['架構',['伺服器端渲染是由伺服器產生完整的頁面。','用戶端渲染是由瀏覽器執行程式來產生頁面。','前者首次載入快、對搜尋引擎友善；後者互動流暢但初次載入比較重。'],'以內容為主、需要被搜尋到的頁面使用伺服器端渲染；登入之後的管理介面使用用戶端渲染。','不考慮用途，所有的頁面都用同一種方式。','兩種方式的差別在於工作在哪裡完成。伺服器先做好，使用者馬上看到內容；交給瀏覽器做，要先下載和執行程式，但之後的操作不必每次回到伺服器。','伺服器端渲染首次載入快；用戶端渲染互動流暢。',['c',[['伺服器端渲染','首次載入快｜搜尋引擎友善'],['用戶端渲染','互動流暢｜初次載入較重']]]],
['狀態',['前端應用愈做愈大，資料到處傳遞而很難追蹤時，需要集中而明確的狀態管理方式。','誰可以修改資料要有清楚的規則。','修改之後會影響誰也要清楚。'],'購物車的內容集中存放在一個地方，只能透過幾個明確的動作修改。任何元件要顯示購物車都從這裡讀取。','每個元件各自保存一份購物車的資料並互相傳遞。有的地方顯示三件，有的地方顯示兩件。','同一份資料有好幾個副本，就會出現不一致。任何地方都可以修改，就無法追蹤是誰改的。','資料集中在一處，修改的方式要明確。',['c',[['各自保存','副本不一致｜不知道誰改的','w'],['集中管理','一個來源｜明確的修改方式','a']]]],
['安全',['登入用的 Cookie 要設定三個屬性。','HttpOnly：防止被前端的程式讀取。','Secure：只在加密的連線傳送。SameSite：防止被跨站的請求帶出。'],'登入的 Cookie 同時設定這三個屬性。頁面即使被注入了惡意程式，也讀不到這個 Cookie。','沒有設定任何屬性。一個 XSS 漏洞就讓攻擊者取得了使用者的登入 Cookie。','這三個屬性分別對應 Cookie 被取得或被濫用的三種途徑：被頁面上的程式讀取、在未加密的連線上被側錄、被其他網站發起的請求利用。','登入 Cookie：HttpOnly、Secure、SameSite。',['c',[['HttpOnly','前端程式讀不到'],['Secure','只走加密連線'],['SameSite','跨站請求不帶出']]]],
['相依',['前端專案安裝了上千個套件。','任何一個被植入惡意內容或出現漏洞，都會影響你。','做法：鎖定版本、掃描漏洞、移除沒有使用的套件。'],'專案有鎖定檔記錄每個套件的確切版本；管線裡自動掃描漏洞；每季清理不再使用的套件。','需要一個小功能就安裝一個套件，從來不清理。','直接安裝的套件各自又依賴其他的套件，總數很容易達到上千個。其中每一個都是由不認識的人維護的，都在你的網站上執行。','套件：鎖版本、掃漏洞、沒用的移除。',['c',[['鎖定版本','不會突然換成別的'],['掃描漏洞','知道哪些有問題'],['移除沒用的','減少風險的來源']]]],
['部署',['靜態資源放到內容傳遞網路（CDN），是從離使用者近的節點提供。','也減輕主機的負擔。','更新時要處理快取失效，否則使用者會拿到舊的檔案。'],'圖片和程式檔由 CDN 提供。更新時檔名帶有新的版本代碼，使用者一定取得新的檔案。','更新了檔案，但 CDN 上還保留著舊的。一部分使用者看到新版的頁面搭配舊版的程式而出錯。','CDN 在各地保存檔案的副本，使用者從最近的節點取得，所以快。但這些副本就是快取，原始的檔案更新時它們不會自動跟著更新。','CDN 讓靜態資源更快；更新時要處理快取。',['f',['使用者','最近的 CDN 節點','主機'],'更新時要讓節點上的舊檔失效',['','a','']]],
['第三方',['頁面上嵌入很多第三方的追蹤和廣告程式，會拖慢載入。','也把使用者的資料和頁面的控制權交給了別人。','每一個外部的程式都能讀取頁面的內容。'],'每半年檢視頁面上所有的第三方程式：是誰加的、現在還需不需要。移除了一半。','各個部門陸續要求加入各種追蹤程式，從來沒有移除過。頁面載入了三十個外部程式。','嵌入的程式和自己的程式有同樣的權限。它的提供者可以隨時修改它的內容，而它被入侵時，你的網站也受到影響。','第三方程式能讀整個頁面；定期檢視是否還需要。',['c',[['效能','拖慢載入','w'],['安全和隱私','能讀取頁面內容｜控制權交給別人','w'],['做法','定期檢視、移除不需要的','a']]]],
['測試',['前端的自動化測試，最值得投資的是元件和關鍵流程的測試。','把每個畫面都做端到端的測試，維護的成本會壓垮團隊。','關鍵流程例如登入、結帳。'],'每個共用的元件都有測試；端到端的測試只有登入、搜尋、結帳三個流程。','為每一個畫面的每一個操作都撰寫端到端的測試。每次調整介面就有大量的測試要修改。','元件的測試快速而穩定，而且元件會被重複使用。端到端的測試最接近真實的使用，但很慢也很脆弱，適合用在少數最重要的流程。','前端測試：元件測試為主，端到端只測關鍵流程。',['c',[['元件測試','快、穩定｜值得多寫','a'],['端到端測試','只測關鍵流程'],['每個畫面都端到端','維護成本過高','w']]]]],
3:[
['架構',['大型前端由多個團隊開發時，可以考慮拆成微前端。','主要的代價是一致性、共用的相依和整體的效能都更難維持。','這是為了組織的獨立性付出的技術成本。'],'五個團隊共同開發一個大型的入口網站，互相等待對方才能上線。拆成微前端之後各自部署，但花了很多力氣維持外觀一致和避免重複載入相同的函式庫。','只有一個六人的團隊，也把前端拆成好幾個微前端。','微前端解決的是很多團隊修改同一份程式而互相牽制的問題。拆開之後，原本自然一致的東西都需要額外的協調才能維持。團隊不大時通常不值得。','微前端換來團隊獨立，代價是一致性和效能。',['c',[['好處','各團隊獨立開發和部署'],['代價','一致性、共用相依｜整體效能更難維持','w']]]],
['設計系統',['建立共用的設計系統和元件庫，讓各個產品的外觀和行為一致。','不必重複開發。','也是把無障礙和安全的做法一次做對、大家共用的方式。'],'公司的按鈕、表單、對話框都來自同一個元件庫，已經處理好鍵盤操作和對比度。各產品直接使用。','每個產品各自製作自己的按鈕和表單。外觀各不相同，無障礙的問題在每個產品裡各自出現。','同樣的元件被重複製作，每一份的品質都不同。集中製作一次並做好，所有使用的地方都受益；修正時也只需要修改一個地方。','設計系統：元件做對一次，大家共用。',['c',[['各自製作','外觀不一｜問題各自出現','w'],['共用元件庫','一致｜無障礙一次做對','a']]]],
['無障礙',['把無障礙當成最後再補的項目，很多問題要重做結構才能修正。','語意結構、鍵盤操作、對比度，一開始就要納入設計。','台灣的政府機關和學校網站有法規要求；其他機構也常被要求比照。'],'設計階段就確認色彩的對比符合標準、每個互動的元件都可以用鍵盤操作、標題的層級正確。','上線前才做無障礙檢測。發現整個頁面的結構都要調整。','無障礙的很多要求是關於頁面的結構，而不是可以另外加上去的東西。結構在一開始就決定了，之後要改等於重做。','無障礙要一開始就納入，不是最後補。',['f',['設計時納入','開發時檢查','上線前檢測'],'最後才補：要重做結構',['a','a','']]],
['效能預算',['效能預算是為頁面的大小和載入時間設定上限。','超過就不能上線。','沒有上限，頁面只會隨著功能增加而愈來愈肥。'],'規定首頁的程式檔總共不超過三百 KB。新功能會超過時，必須先從其他地方減少。','沒有任何限制。每一次只增加一點點，兩年後頁面的大小是原來的五倍。','每一個新功能增加的量都很小，單獨看都可以接受。但沒有人為累積的結果負責。預算把整體的限制變成每一次變更都要面對的條件。','效能預算：設上限，超過不上線。',['f',['設定上限','每次變更檢查','超過｜不能上線'],null,['a','','w']]],
['安全',['前端架構上最重要的安全觀念：用戶端的一切都不可信。','真正的管制必須在後端。','隱藏按鈕不是權限控管。'],'一般使用者的畫面上不顯示「刪除」的按鈕，同時後端的刪除 API 也檢查呼叫者是否有權限。','只在前端把按鈕隱藏。使用者直接呼叫刪除的 API，後端沒有檢查就執行了。','前端的程式在使用者的裝置上執行，他可以修改它，也可以完全繞過它。前端可以做的只是改善體驗；能不能做某件事，只能由後端決定。','前端不可信；權限的管制在後端。',['c',[['前端隱藏按鈕','只是體驗｜可以繞過','w'],['後端檢查權限','真正的管制','a']]]],
['漸進',['漸進增強的理念：基本的功能在任何環境都能使用。','再依照環境的能力加上進階的體驗。','程式載入失敗、網路很慢、裝置很舊時，使用者仍然可以完成主要的事。'],'表單在沒有 JavaScript 的情況下也能送出。有 JavaScript 時，再加上即時的檢查和自動完成。','整個頁面完全依賴 JavaScript。程式檔載入失敗時，使用者看到一片空白。','使用者的環境差異很大，而且網路上任何一個資源都可能載入失敗。以最基本的技術完成核心的功能，其他的當成加強。','漸進增強：基本功能到處能用，進階體驗再往上加。',['c',[['基本功能','任何環境都能用','a'],['進階體驗','環境支援再加上']]]],
['監控',['網站上線之後，要蒐集真實使用者的效能和錯誤資料。','才知道使用者實際遇到了什麼問題。','很多前端的錯誤只發生在特定的瀏覽器或裝置。'],'監控顯示：某一款手機瀏覽器的使用者有三成在結帳頁遇到程式錯誤。開發人員用同樣的環境重現並修正。','只依靠使用者的回報。大部分遇到問題的人不會回報，只是離開。','前端的程式在使用者的裝置上執行，環境千差萬別，開發人員無法事先全部測試，也看不到那裡發生的事。只有把資料蒐集回來才知道。','蒐集真實使用者的效能和錯誤資料。',['f',['使用者的瀏覽器','回報效能和錯誤','彙整分析','找出特定環境｜的問題'],null,['','a','','']]],
['技術選型',['評估要不要採用一個很新的前端框架，最該考慮三件事。','社群和維護的持續性。','團隊的能力，以及轉換的成本。'],'評估時查看：這個框架有沒有穩定的維護者、有多少人使用、團隊有沒有人熟悉、現有的程式要改寫多少。','因為它是現在最熱門的就採用。兩年後它不再有人維護。','框架的生命週期可能比你的系統短。系統要運作和維護很多年，而採用之後要更換的成本很高。','選框架看：維護的持續性、團隊能力、轉換成本。',['c',[['持續性','社群和維護者'],['團隊能力','有沒有人會'],['轉換成本','要改寫多少']]]]]};
LEARN.mgmt={0:[
['服務管理',['ITIL 是一套 IT 服務管理的實務做法，整理了事件、問題、變更、服務台這些流程。','不必全部照抄，挑選適合自己組織的使用。','事件是「本來能用的壞了」；服務請求是「申請一項標準的服務」。'],'「我的電腦開不了機」是事件，要盡快恢復。「我要申請一個新帳號」是服務請求，照流程處理。','把兩者混在一起排隊處理。申請帳號的請求排在電腦故障的前面。','兩者的性質不同：事件是服務中斷，有急迫性；服務請求是預期中的工作，可以依照固定的流程和時程處理。分開之後才能各自設定適當的處理方式。','事件是壞了要修；服務請求是照流程申請。',['c',[['事件','本來能用的壞了｜盡快恢復','w'],['服務請求','申請標準的服務｜照流程處理','a']]]],
['專案管理',['專案有三個互相牽動的限制：範圍、時間、成本。','範圍變大，時間或成本一定要跟著調整。','只增加需求、不增加時間也不增加人，最後犧牲的是品質。'],'使用單位要求增加一項功能。專案經理說明：可以，但要延後兩週，或是拿掉另一項功能。','答應增加需求，時程和人力都不變。團隊加班趕工，上線後問題很多。','工作量是由範圍決定的，而能完成的工作量是由時間和人力決定的。其中一個改變而其他不變，等式就不成立，差額會以品質下降的形式出現。','範圍、時間、成本：動一個，其他要跟著動。',['c',[['範圍','要做什麼'],['時間','多久完成'],['成本','多少人力和經費']],'三者都不讓：犧牲的是品質']],
['採購',['採購規格如果寫成只有某一家廠牌的產品才能符合，就沒有競爭。','價格和服務都容易被牽著走，也可能違反採購的規定。','規格應該寫「需要的功能和效能」。'],'規格寫「每秒可以處理的交易量」「支援的標準協定」，而不是某一個產品的型號。','直接把某一家廠商的型錄內容貼成規格。','只有一家可以投標時，買方沒有比較和議價的空間。適用政府採購法的機關，法規也禁止不當限制競爭的規格。綁規格是稽核的重點。','規格寫需要的功能和效能，不是抄某一家的型錄。',['c',[['綁規格','沒有競爭｜可能違反採購規定','w'],['寫功能和效能','多家可以競爭','a']]]],
['合約',['簽訂系統的維護合約時，最需要寫清楚的是服務水準。','多久回應、多久到場、沒有做到怎麼辦。','「盡快處理」不是承諾。'],'合約載明：上班時間報修後三十分鐘內回應、四小時內到場、八小時內修復，未達成依比例扣款。','合約只寫「乙方應盡速處理」。系統故障了兩天，廠商說已經盡速了。','沒有明確的數字，雙方對「夠快」的認定會不一樣，而且沒有依據可以要求。服務的時段和罰則也要寫明。','維護合約寫清楚：多久回應、多久修復、沒做到怎麼辦。',['c',[['回應時間','多久內回覆'],['修復時間','多久內恢復'],['罰則','沒做到怎麼辦','a']]]],
['成本',['總持有成本（TCO）是購買、建置、維護、人力、汰換全部加起來的成本。','購買時便宜的，維護費、授權費和需要的人力可能貴得多。','要看整個使用年限的總花費。'],'甲方案購買價格較低，但每年的維護費是乙方案的兩倍，而且需要一位專職的管理人員。以五年計算，乙方案比較便宜。','只比較購買的價格。','系統會使用很多年，購買只是第一筆支出。每年持續發生的成本累積起來，常常超過購買的價格。','看總持有成本，不只看購買價格。',['c',[['購買','只是第一筆'],['建置和維護','每年持續發生'],['人力和汰換','常被忽略','w']]]],
['供應商管理',['廠商鎖定是指太依賴單一廠商的技術或格式。','之後想更換會非常困難而且昂貴。','評估時要先想「退場要怎麼退」。'],'採購前確認：資料可以用標準的格式匯出、有其他的廠商能夠維護、合約有資料移轉的條款。','系統使用廠商專屬的資料格式，只有原廠能維護。續約時廠商大幅漲價，沒有其他選擇。','更換的成本愈高，買方的談判能力愈低。專屬的格式、專屬的技術、只有原廠會維護，都會提高這個成本。','廠商鎖定：換不掉就沒有談判的籌碼。',['c',[['來源','專屬格式｜專屬技術｜只有原廠會維護','w'],['預防','採購前就想好退場','a']]]],
['績效指標',['訂定 KPI 最重要的原則有兩個。','量得出來。','真的和要達成的目標有關。'],'目標是提升服務的穩定性，指標訂為「重大事件的次數」和「平均修復時間」。','指標訂為「處理的工單數量」。大家開始把一件事拆成好幾張工單。','量不出來的指標無法追蹤。和目標無關的指標會把大家的努力引導到沒有意義的事情上，因為人會朝著被衡量的方向行動。','KPI：量得出來，而且和目標有關。',['c',[['量得出來','才能追蹤','a'],['和目標有關','否則引導到錯的方向','a']]]]],
