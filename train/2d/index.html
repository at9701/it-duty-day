['演練',['桌上演練是相關人員坐下來，依照假想的情境，討論每一步由誰做什麼決定。','它不需要動到任何系統。','可以發現流程上的漏洞，例如誰有權決定斷網、誰負責對外發言、聯絡清單對不對。管理階層要一起參加。'],'演練情境是「週五晚上發現勒索軟體」。討論到要不要關閉對外服務時，發現沒有人確定誰有權決定，聯絡清單上主管的電話也是舊的。','只讓技術人員參加。真正出事時，最難的決定通常不是技術上的，而是業務、法務和對外溝通上的，這些人沒有參加就沒有演練到。','事件應變計畫寫在文件裡的時候看起來都很合理，實際套用到具體情境時才會發現缺漏。桌上演練用很低的成本，讓這些缺漏在平時就暴露出來，同時讓相關的人事先想過一次自己要做什麼。','桌上演練：照情境討論誰做什麼決定，管理階層要參加。',['f',['設定｜假想情境','逐步討論｜誰決定什麼','找出流程的｜漏洞','修正計畫'],null,['','a','w','']]],
['弱點管理',['找到攻擊者利用的漏洞並修補那一台之後，還有兩件事要做。','第一，清查其他主機有沒有同樣的漏洞。','第二，找出這台為什麼沒有被修補，修正流程上的缺口。'],'攻擊者利用一台網站伺服器的已知漏洞進來。清查後發現還有四台有同樣的漏洞。進一步追查，原來這幾台不在資產清單裡，所以從來沒有被納入修補排程。','修補了被打的那一台就結案。同樣的漏洞還在其他主機上，造成漏洞沒被修補的流程問題也還在。','被利用的那個漏洞是結果，不是原因。它存在是因為修補的流程在某個地方漏掉了這台主機：可能不在清單裡、可能沒有負責人、可能修補一直被延後。這個原因不處理，下一個漏洞還是會以同樣的方式被留下來。','修了那一台還不夠：查其他主機，也查為什麼漏掉。',['f',['修補被利用的｜那一台','清查其他主機｜有沒有同樣漏洞','找出為什麼｜沒被修補','修正流程'],null,['','a','a','']]],
['證據保全',['保管鏈是記錄證據從取得到提交的完整過程。','內容包括：誰取得的、什麼時候、交給了誰、每個人對它做了什麼。','再加上取得時計算的雜湊值，用來證明證據的內容沒有被更動過。'],'製作硬碟映像檔後立即計算雜湊值，填寫證據交接單。之後每一次移交都由雙方簽名並記錄時間，分析一律在複本上進行。','「我們自己內部調查，不需要這麼正式」。但事件之後有可能發展成法律程序，那時候才發現證據的來源說不清楚，就無法補救了。','證據要能被採信，必須能證明它從取得那一刻到現在都沒有被更動。如果中間有一段時間說不出它在誰手上、有沒有被動過，對方就可以質疑它的真實性。保管鏈和雜湊值就是用來回答這個質疑的。','保管鏈：誰、何時、做了什麼，加上雜湊值證明沒被動過。',['f',['取得證據｜計算雜湊值','填寫｜交接紀錄','每次移交｜雙方簽名','在複本上｜分析'],null,['a','','','']]],
['團隊管理',['監控人員長期輪大夜班，每天處理大量告警，會造成疲勞和高離職率。','疲勞的人會漏看真正的攻擊。','管理上要優先減少無效的告警和重複的人工作業，並調整輪值制度。'],'分析後發現七成的告警來自五條規則，而且幾乎都是誤報。調校這五條規則，再把補充資訊的步驟自動化，每人每天要處理的告警減少一半以上。','把高離職率歸因於「年輕人抗壓性低」，然後不斷招募新人。新人需要時間訓練，資深的人持續離開，整體的偵測能力只會愈來愈差。','監控工作需要持續的注意力和判斷，這正是疲勞最先影響的能力。每天面對幾千個大部分是誤報的告警，人會自然地開始略過。所以改善工作條件不是福利問題，而是維持偵測能力的必要條件。','減少無效告警、自動化重複工作、合理輪值，是在保護偵測能力。',['c',[['無效告警太多','人會開始略過｜漏看真的攻擊','w'],['調校、自動化｜合理輪值','留住人｜也維持偵測能力']]]]]};
LEARN.red={0:[
['授權與範圍',['滲透測試開始之前，一定要取得書面授權。','授權書要寫明：範圍、時間、可以用的方法、禁止事項、緊急聯絡人。','發現範圍外的主機有漏洞，不要動它，記錄並告知客戶。測試造成系統異常時，立刻停止並通知緊急聯絡人。'],'測試到一半客戶的系統開始變慢。馬上停止所有測試動作，打電話給約定的緊急聯絡人，說明剛才在做什麼。','「反正都授權了，順便看一下隔壁那台」是越界。範圍外的主機可能屬於別的單位，沒有授權去碰它就是未授權存取。','滲透測試做的事和真正的攻擊在技術上一樣，差別只在有沒有得到同意。書面授權把同意的內容固定下來，同時保護雙方：客戶知道會發生什麼，測試人員有憑證證明自己的行為是被允許的。','沒有書面授權就是入侵；範圍外不碰，出狀況立刻停。',['c',[['開始之前','書面授權｜範圍、時間、禁止事項'],['發現範圍外的漏洞','不動它｜記錄並告知客戶'],['系統出現異常','立刻停止｜通知緊急聯絡人','w']]]],
['偵察',['被動偵察只使用公開的資訊，不直接接觸目標的系統。','來源包括：網域註冊資料、DNS 紀錄、徵才訊息、社群貼文、公開的文件。','目標不會察覺。主動掃描則會在對方的紀錄上留下痕跡。'],'從公司的徵才啟事看到「需熟悉某某防火牆和某某資料庫」，就知道對方用了哪些產品，完全不用碰對方的任何系統。','很多單位只注意自己系統上的弱點，沒有注意自己在網路上公開了多少資訊。員工的社群貼文、放在公開網站的文件，都是攻擊者的情報來源。','攻擊的第一步是了解目標。資訊愈多，後面的攻擊愈精準，例如知道員工的姓名和職稱，就能寫出很可信的釣魚信。被動偵察完全不會觸發任何防護，所以防守方只能從減少公開的資訊著手。','被動偵察只看公開資訊，對方不會知道。',['c',[['被動偵察','只用公開資訊｜目標不會察覺'],['主動掃描','直接接觸目標｜會留下紀錄']]]],
['弱點識別',['CVE 是公開漏洞的統一編號，讓大家談論同一個漏洞時有共同的名稱。','CVSS 是另一套東西，用來評估漏洞嚴重程度的分數。','OWASP Top 10 是最常見的網站應用程式安全風險清單，是網站安全的入門參考。'],'廠商公告寫「已修補某個 CVE 編號」，資安人員用這個編號去查自己有沒有受影響的版本，再看它的 CVSS 分數決定多快要修。','CVE 編號只是名字，不代表嚴重程度。另外 OWASP Top 10 是風險的類別，不是完整的檢查清單，通過了也不代表網站沒有問題。','同一個漏洞，不同的廠商和研究人員可能有不同的叫法，很難確定大家講的是不是同一件事。統一編號解決了溝通的問題；評分系統則讓大家可以用一致的標準排優先順序。','CVE 是漏洞的編號，CVSS 是嚴重程度的分數，OWASP Top 10 是網站常見風險。',['c',[['CVE','漏洞的｜統一編號'],['CVSS','嚴重程度的｜分數'],['OWASP Top 10','網站最常見的｜安全風險']]]],
['資料處理',['測試時取得真實的敏感資料，只蒐集足以證明的最少證據。','不下載、不帶走、不外流。','證據截到欄位名稱和資料筆數就夠了，內容要遮蔽，並如實記錄在報告裡。'],'成功進入會員資料庫。截一張顯示資料表名稱、欄位名稱和總筆數的畫面，資料內容打上馬賽克，然後就離開。','把整份資料匯出來「當作證據」。這樣測試人員自己就成了外洩的來源，也超出了測試的目的。','測試的目的是證明「這裡拿得到資料」，讓客戶知道要修。這件事不需要真的把資料拿走就能證明。測試人員手上的資料愈少，之後因為保管不當而造成的風險就愈小。','證明拿得到就好，不要真的去拿；證據最少化、內容遮蔽。',['f',['進入資料庫','截圖：欄位名稱｜和筆數','遮蔽內容','如實記錄｜不下載'],null,['','a','a','']]],
['報告',['滲透測試報告是寫給要修補的人看的。','每個弱點都要有三樣：風險說明、重現的步驟、修補建議。','讓對方能照著重現、知道哪個先修、知道怎麼修。'],'報告裡一個弱點的寫法：說明它可以讓未登入的人讀到其他使用者的資料（風險）；列出第一步到第五步怎麼操作（重現）；建議在伺服器端檢查權限（修補）。','只列出弱點名稱和工具輸出的截圖。開發人員看了不知道問題在哪裡、也無法重現，這份報告就沒有辦法使用。','測試的價值不在於找到多少弱點，而在於這些弱點最後有沒有被修好。修補的人如果無法重現問題，就無法確認自己修對了；如果不知道風險多高，就不知道該放在什麼優先順序。','報告每個弱點要有：風險、重現步驟、修補建議。',['c',[['風險','可能造成什麼'],['重現步驟','照著做｜就能看到'],['修補建議','具體怎麼修']]]]],
1:[
['測試類型',['黑箱測試：測試人員事先不知道內部的資訊，接近外部攻擊者的視角。','白箱測試：測試人員會拿到架構資料、帳號，甚至原始碼，效率高、涵蓋比較深。','介於兩者之間、只給部分資訊的，叫灰箱。'],'想知道外部攻擊者能做到什麼程度，選黑箱；想在有限的時間內把一套系統盡量查透，選白箱。','「黑箱比較真實所以比較好」不一定對。黑箱會把大量的時間花在摸索上，同樣的預算能找到的問題通常比較少。','真正的攻擊者沒有時間限制，可以花好幾個月慢慢摸索。測試只有幾天到幾週。給測試人員愈多資訊，就愈能把有限的時間花在找問題上。所以要選哪一種，取決於這次測試想回答的問題是什麼。','黑箱沒資訊、像外部攻擊者；白箱有資訊、查得深；中間是灰箱。',['c',[['黑箱','不給內部資訊｜接近外部攻擊者'],['灰箱','給部分資訊'],['白箱','給架構、帳號｜甚至原始碼']]]],
['弱點識別',['掃描工具的結果要經過人工驗證才能寫進報告。','工具常常只靠版本號推測有沒有弱點，誤判很多。','實務上最常見、最容易得手的突破口是：沒有改掉的預設帳號密碼、弱密碼、沒有修補的舊漏洞、設定錯誤。'],'掃描回報 200 個弱點。逐一驗證後，確認真正存在而且可以利用的是 23 個，其中最嚴重的是一台設備還在用出廠的預設密碼。','把掃描工具的輸出直接整理成報告。客戶花了很多時間追查根本不存在的問題，之後也不會再相信這份報告。','掃描工具的做法是比對特徵，例如看到某個版本號就回報它有某個漏洞，但它不知道這個漏洞實際上有沒有被修掉、能不能真的被利用。人工驗證是實際去試，才能確定這是不是真的風險。','掃描結果要人工驗證；最常得手的是預設密碼和弱密碼。',['f',['掃描工具｜回報 200 項','人工驗證','排除誤判','確認實際風險｜再寫進報告'],null,['off','a','','']]],
['社交工程',['社交工程測試一樣需要授權和範圍。','不能對個人造成實質的傷害。主題要避開會引起恐慌或傷害的內容。','結果的用途是找出流程和訓練的缺口，不應該針對個人公布或懲處。'],'釣魚演練用「系統密碼即將到期」當主題，結果只公布各部門的點擊比例，並針對比例高的部門加強訓練。','用「您的薪資有異動」「家人發生意外」「裁員名單」當主題，點擊率一定很高，但會造成真實的恐慌，員工也會覺得被公司欺騙。','演練要衡量的是組織整體的防護程度，再據此改善訓練和流程。如果演練變成公開羞辱或懲罰，員工學到的不是辨識釣魚信，而是不信任資安單位，之後真的遇到問題也不願意回報。','釣魚演練也要授權；不傷害人、不針對個人。',['c',[['可以','授權範圍內｜合理的主題｜只看整體統計'],['不可以','造成恐慌的主題｜公布或懲處個人','w']]]],
['資料處理',['測試中取得或破解的密碼是真實的憑證。','只能用在授權範圍內的測試。','報告裡要遮蔽，只呈現「破解得出來」和統計數字。測試結束後要銷毀。'],'報告寫「取得 500 組密碼雜湊，其中 180 組在一小時內破解，最常見的型式是公司名稱加年份」，不列出任何一組明文。','把破解出來的明文密碼完整列在報告的附錄裡。這份報告會被很多人傳閱，等於把全公司的密碼公開了。','客戶需要知道的是「我們的密碼強度有問題，問題的型態是什麼」，這用統計數字就能說明。明文密碼留在測試人員的電腦或報告裡，只會多一個外洩的機會，對改善沒有任何幫助。','取得的密碼：只在授權內用、報告遮蔽、結束後銷毀。',['f',['取得密碼','只用於｜授權範圍內','報告只寫｜統計數字','結束後銷毀'],null,['w','','a','a']]],
['清理',['測試結束後一定要做清理。','要移除：測試時建立的帳號、上傳的工具和檔案、修改過的設定。','清理的項目要列在報告裡，讓客戶可以核對。'],'測試過程中每建立一個帳號、上傳一個檔案就記錄下來。結束時依照這份清單逐一移除，並把清單附在報告裡。','忘記刪除的測試帳號和工具，之後被真正的攻擊者發現並利用，責任會在測試團隊身上。','測試人員為了證明弱點，會在系統裡留下一些東西，這些東西本身就是弱點。如果不移除，測試反而讓系統變得更不安全。清理要靠測試過程中的記錄，等到結束才回想一定會有遺漏。','測試完要清理：帳號、工具、設定都復原，並列在報告。',['f',['測試中｜記錄每個變更','結束時｜逐一移除','還原設定','清單列入報告'],null,['a','','','']]],
['報告',['真實的攻擊是把多個弱點串起來使用的。','三個單獨看都是低風險的弱點，串在一起可能就能取得管理員權限。','報告要說明整條攻擊鏈，並依串起來之後的實際風險來評級。'],'一個資訊洩漏加一個弱密碼加一個權限設定錯誤。報告把它們寫成一條攻擊路徑，標示為高風險，並說明切斷其中任何一個就能阻止。','照工具給的分數把三個弱點分別列在「低風險」的區塊。客戶看到低風險就排到最後處理，而實際上這是一條可以拿下系統的路。','單一弱點的評分是假設它獨立存在。但系統裡的弱點是可以組合的，一個弱點提供的資訊或權限，可以成為利用另一個弱點的條件。只有把組合的結果呈現出來，客戶才知道實際的風險有多高。','弱點要看攻擊鏈：依串起來的實際風險評級。',['f',['低風險：｜資訊洩漏','低風險：｜弱密碼','低風險：｜權限設定錯誤','串起來：｜管理員權限'],'切斷其中一個就能阻止整條路',['','','','w']]],
['複測',['客戶修補之後要安排複測。','目的是確認弱點真的修好了，而且沒有因為修補而產生新的問題。','複測要用不同的方式嘗試，不能只重複報告裡的那一個測試字串。'],'報告指出某個輸入欄位有注入弱點。複測時原本的測試字串被擋下來了，但換一種寫法還是成功，原來對方只是把那個特定的字串加入過濾。','客戶回覆「已修補」就把弱點標記為已結案。說修好了和真的修好了是兩回事。','修補的人看到的是報告裡的那個例子，很容易只針對那個例子處理，而沒有處理根本的原因。複測是用攻擊者的角度再確認一次：同一類的問題，換個方式還打不打得進去。','複測確認真的修好；換個寫法再試，不能只測原本那一招。',['f',['客戶修補','用原本的方式｜測試','換其他方式｜再測','確認沒有｜新的問題'],null,['','','a','']]]],
2:[
['測試類型',['「假設已被入侵」的測試，是直接給測試人員一個內部的立足點。','例如一台一般員工的電腦，或是一組一般權限的帳號。','測試的重點是：進來之後能走多遠、防守方看不看得到。'],'測試從一台標準配置的員工筆電和一組一般帳號開始，目標是看能不能取得網域管理員權限，以及過程中觸發了多少告警。','「我們的邊界防護很強，不需要測試內部」。邊界遲早會因為一封釣魚信或一個漏洞被突破，內部的防護才決定損害會多大。','傳統的測試把大部分的時間花在突破邊界上，如果沒有突破，內部就完全沒有被檢視。但實際的入侵幾乎都會越過邊界。直接從內部開始，才能把時間花在回答更重要的問題：被突破之後會發生什麼。','假設已被入侵：從內部一個立足點開始，看能走多遠。',['c',[['一般測試','從外部開始｜重點在突破邊界'],['假設已被入侵','從內部立足點開始｜重點在能走多遠｜和偵不偵測得到']]]],
['攻擊手法',['被入侵的主機會定期對外連到攻擊者的控制伺服器（C2）領取指令。','這種固定間隔、規律的對外連線叫 Beaconing。','就算連線的內容有加密，時間間隔的規律和目的地的異常還是看得出來。'],'流量紀錄顯示某台電腦每隔 60 秒就連到同一個外部位址，連續好幾天、不分日夜。正常的使用者行為不會這麼規律。','「流量都加密了所以看不出來」是不對的。不需要看內容，光是連線的時間、頻率、目的地和資料量，就能提供很多線索。攻擊者會加入隨機的延遲來躲避，所以偵測也要容許一定的變動。','控制伺服器無法主動連進受害的主機，因為防火牆通常會擋住從外面進來的連線。所以改由受害主機定期主動連出去詢問「有沒有新的指令」。這個「定期詢問」的行為就是它的特徵。','C2 的心跳：固定間隔的對外連線；加密也藏不住規律。',['f',['受害主機','每隔固定時間｜對外連線','控制伺服器｜（C2）','領取指令'],'看的是時間間隔和目的地，不是內容',['w','w','','']]],
['授權與範圍',['交戰規則（RoE）的禁止事項通常包括：阻斷服務攻擊、異動或刪除正式資料。','達成約定的目標就停止，即使手上有更高的權限，也不去碰目標以外的系統。','發現不是自己留下的後門或可疑帳號，立刻暫停並通知客戶，這可能是真正的入侵。'],'測試中發現一個不是自己建立的管理員帳號和一支不明的程式。立即停止所有操作，通知客戶，並說明自己最後做了哪些動作。','拿到網域管理員權限之後「順便」多看幾個系統。每多做一步都可能造成意外，而且已經超出了授權。','測試的目的是證明風險，不是實際造成損害。權限愈大，一個失誤的後果愈嚴重，所以愈要克制。而發現真正的入侵時，情況已經從測試變成事件，繼續操作會破壞證據，也可能讓你被誤認為是入侵者。','不做會造成損害的事；達成目標就停；發現真入侵立刻通報。',['c',[['禁止事項','阻斷服務｜異動、刪除正式資料','w'],['達成目標','就停止｜不碰範圍外的系統'],['發現真的入侵','暫停｜通知客戶｜保留現場','w']]]],
['紫隊',['紫隊演練是攻擊方和防守方一起合作進行。','做法是逐項執行攻擊手法，每做一項就確認防守方有沒有偵測到、有沒有回應。','沒有偵測到就當場調整規則，再執行一次。'],'紅隊執行一種橫向移動的手法，藍隊確認沒有告警。雙方一起檢查，發現需要的紀錄沒有收進來。補上之後再做一次，告警正確觸發。','紫隊不是一支獨立的團隊，而是一種合作的方式。它也不能取代紅隊演練，因為防守方事先知情，測不出真實情況下的反應。','傳統的紅隊演練結束後，防守方拿到一份報告，再自己想辦法改善，中間隔了很久。紫隊把這個回饋的時間縮短到幾分鐘：攻擊的人就在旁邊，可以馬上重做、馬上驗證，偵測能力提升得最快。','紫隊：打一招、看有沒有告警、沒有就當場修、再打一次。',['f',['執行一種手法','有沒有告警？','沒有：｜當場調整規則','再執行一次｜確認'],null,['','a','','']]],
['報告',['滲透測試報告通常分成管理摘要和技術細節兩個部分。','管理摘要是給決策的人看的：整體的風險、對業務的影響、需要投入什麼資源。','技術細節是給動手修補的人看的：弱點在哪裡、怎麼重現、怎麼修。'],'管理摘要用一頁寫：「外部攻擊者可以在兩天內取得客戶資料，主要原因是三個問題，建議優先處理以下兩項。」後面才是每個弱點的詳細說明。','整份報告都是技術細節，主管看不懂也沒有時間看，最後不知道問題有多嚴重，也就不會分配資源去修。','做決策的人和動手修的人要回答的問題不同。前者要決定「這件事有多重要、要投入多少」，後者要知道「具體要做什麼」。把兩種資訊混在一起，兩邊都要從不需要的內容裡找自己要的東西。','報告分兩部分：給主管的摘要、給工程師的細節。',['c',[['管理摘要','整體風險｜業務影響｜需要的資源'],['技術細節','弱點在哪裡｜怎麼重現｜怎麼修']]]],
['漏洞揭露',['在測試之外發現某個軟體的未公開漏洞，負責任的做法是先通報廠商。','也可以通報 TWCERT/CC 這類協調單位，由他們協助聯繫。','給廠商合理的時間修補，之後再公開細節。'],'發現一套常用軟體的漏洞。通報廠商並約定九十天後公開。廠商在第六十天發布修補程式，之後才公布技術細節。','發現之後立刻公開所有細節，或是完全不通報。前者讓攻擊者在修補程式出現之前就能利用，後者讓漏洞一直存在。','漏洞的細節一公開，攻擊者和防守者同時得到資訊，但攻擊者的行動通常比較快。先私下通報，是讓廠商有時間修、使用者有時間更新。設定期限則是避免廠商無限期拖延。','發現未公開漏洞：先通報廠商或協調單位，給修補時間再公開。',['f',['發現漏洞','通報廠商或｜TWCERT/CC','給合理的｜修補時間','修補後｜再公開細節'],null,['','a','','']]]],
3:[
['演練目標',['紅隊演練的目標要以業務衝擊來訂。','例如「取得某項核心資料」或「能夠中斷某項關鍵服務」。','紅隊中途被藍隊發現並擋下，是有價值的結果，代表這條路徑上的偵測和應變有效。'],'演練目標訂為「取得客戶資料庫的內容」。紅隊在第三天被藍隊發現並阻斷。報告同時記錄了哪些步驟被偵測到、哪些沒有。','把目標訂成「取得網域管理員權限」這類技術性的目標。拿到了又怎樣，管理階層聽不出它和業務的關係。另外，紅隊「贏」不是演練的目的。','真正的攻擊者要的是結果：資料、金錢、中斷服務。用同樣的角度訂目標，演練才能回答組織真正關心的問題。演練的目的是驗證防禦，所以防守成功和防守失敗的地方都是成果。','紅隊目標對準業務衝擊；被擋下也是有價值的結果。',['c',[['好的目標','取得核心資料｜中斷關鍵服務'],['不好的目標','只講技術權限｜和業務無關','off'],['被藍隊擋下','代表這條路徑的｜防禦有效']]]],
['演練管理',['紅隊演練時，組織內只有少數人事先知情，這些人組成控制小組。','防守方不知情，才能測出真實的反應。','控制小組的作用是：掌握進度、處理意外、分辨「這是演練還是真的攻擊」，並在必要時喊停。'],'藍隊發現異常準備對外通報主管機關。控制小組確認這是演練的活動，及時介入說明，避免錯誤的通報。','完全沒有人知情。演練期間如果剛好發生真正的攻擊，沒有人能分辨；防守方也可能把演練當成真的而啟動對外通報。','演練要真實，所以要對防守方保密；但演練也有風險，所以必須有人掌握全貌。控制小組就是在這兩個要求之間的安排：人數要少到不影響真實性，但要有足夠的權限在出狀況時立刻處理。','控制小組：少數知情的人，掌握進度、處理意外、必要時喊停。',['f',['紅隊行動','藍隊不知情｜真實反應','控制小組｜掌握全貌','必要時喊停'],null,['','','a','w']]],
['授權與範圍',['演練如果包含多種方式（網路、釣魚、實體進入），每一種都要明確寫進授權。','實體滲透要隨身攜帶可以查證的授權文件和緊急聯絡人。','系統在公有雲上時，還要確認雲端業者的測試政策允許哪些行為。'],'執行實體滲透的人員被保全攔下。出示授權書，保全依上面的電話聯絡到客戶的負責人確認之後放行。','「客戶已經授權了」不代表什麼都可以做。雲端的底層設施屬於業者，並且和其他客戶共用，超出業者允許的範圍，客戶的授權沒有效力。','授權只能由有權利的人給予。客戶可以授權測試他自己的系統，但不能授權測試屬於別人的東西，例如雲端業者的設施或大樓的公共區域。實體滲透還會遇到不知情的第三方，所以要有當場就能查證的文件。','每種手法都要寫進授權；實體要帶授權書；雲端要看業者政策。',['c',[['網路、釣魚','各自寫進授權'],['實體進入','隨身帶授權書｜和緊急聯絡人','a'],['雲端環境','確認業者的｜測試政策']]]],
['測試類型',['威脅模擬是刻意依照某一個真實攻擊族群的手法來進行。','目的是測試對那個特定對手的防禦能力。','選擇模擬的對象，要依據威脅情資：誰最可能攻擊你的產業。'],'情資顯示某個攻擊族群專門針對同產業。演練就依照公開報告中這個族群使用的工具和手法，從初始入侵到資料外傳完整執行一遍。','威脅模擬不是要找出最多的弱點。它刻意只使用那個對手會用的方法，即使測試人員知道有更容易的路也不走。','一般的滲透測試回答的是「有哪些弱點」。但防守的資源有限，更實際的問題是「最可能來打我的那個對手，我擋不擋得住」。照著對手實際的做法演一遍，可以直接驗證針對他的偵測和防護有沒有作用。','威脅模擬：照最可能來打你的對手的手法演一遍。',['f',['從情資選定｜對手','整理他的｜手法','照著執行','檢視哪些｜擋住、哪些沒有'],null,['a','','','']]],
['報告',['演練常常會找到很多條可以到達核心系統的攻擊路徑。','修補建議不要一條一條分別處理，而是找出很多條路徑都會經過的共同關鍵點。','優先處理這些關鍵點，一次可以切斷很多條路徑。'],'二十條攻擊路徑裡有十四條都經過同一個權限過大的服務帳號。把這個帳號的權限縮小，十四條路徑同時失效。','依照發現的順序或單一弱點的分數，一項一項修。這樣要修很久，而且每修一個只切斷一條路。','攻擊路徑是由很多步驟串成的，不同的路徑常常會共用其中的某幾步。這些被共用的步驟就是瓶頸。把修補的資源集中在瓶頸上，效果會遠大於平均分散到每一個弱點。','找出很多條路都經過的關鍵點，優先處理。',['f',['二十條｜攻擊路徑','找出共同｜經過的點','優先處理｜這個點','同時切斷｜很多條路'],null,['w','a','','']]],
['紫隊',['演練結束後，紅隊和藍隊要一起開檢討會。','最有價值的做法是把雙方的時間軸對照起來。','逐一檢視紅隊的每一步：藍隊有沒有看到、有沒有告警、有沒有處理，以及為什麼。'],'紅隊列出 12 個步驟和時間。對照藍隊的紀錄：3 個有告警並處理、4 個有紀錄但沒有告警、5 個完全沒有紀錄。後兩類就是要改善的清單。','紅隊交出報告就結束，藍隊自己讀報告猜測當時發生了什麼。雙方沒有對照，很多偵測的缺口不會被發現。','紅隊知道自己實際做了什麼，但不知道防守方看到了多少；藍隊知道自己看到了什麼，但不知道漏掉了什麼。任何一方單獨都看不到完整的情況。把兩邊的時間軸放在一起，缺口就會明確地顯示出來。','檢討會：把紅藍雙方的時間軸對起來，缺口一目了然。',['c',[['有告警並處理','偵測有效'],['有紀錄沒告警','要補規則','w'],['完全沒紀錄','要補資料來源','w']],'紅隊的每一步都對照藍隊看到了什麼']]]};
LEARN.ir={0:[
['通報',['發現電腦疑似被入侵，第一件事是依程序通報資安或資訊單位。','愈早通報，能控制住的範圍愈大。','不要自己嘗試處理，很容易破壞證據。'],'發現桌面多了不明的檔案、滑鼠自己在動。立刻打電話給資安窗口，說明看到什麼、什麼時候開始。','「先自己掃毒看看，沒事就不用報」。掃毒可能刪掉關鍵的檔案，拖延的時間則讓攻擊者有機會擴散。','使用者只看得到自己這一台，資安單位才有工具和權限去看其他主機有沒有同樣的狀況。通報讓組織可以從「一台電腦的問題」提升到「整體有沒有被入侵」的層次來處理。','疑似被入侵：先通報，不要自己處理。',['f',['發現異常','依程序通報','維持現狀','等待指示'],null,['w','a','','']]],
['現場處理',['等待處理人員到場之前，維持那台電腦的現狀。','不要繼續操作、不要關機、不要重灌。除非另有指示，拔掉網路線隔離即可。','自己重灌會讓入侵的途徑和範圍都無從查起。'],'懷疑中毒後，把網路線拔掉、關閉無線網路，電腦保持開機，在旁邊貼一張「請勿使用」的紙條，然後通報。','「重灌最快也最乾淨」。那一台是乾淨了，但不知道攻擊者是怎麼進來的、其他電腦有沒有受害、資料有沒有被帶走。','被入侵的電腦是唯一能告訴你「發生了什麼」的來源。繼續使用會覆蓋痕跡，關機會清空記憶體，重灌則是全部消除。隔離網路可以阻止它繼續造成損害，同時把這些資訊完整保留下來。','拔網路線、不關機、不操作、不重灌。',['c',[['要做','拔網路線隔離｜維持開機'],['不要做','繼續操作｜關機｜重灌','w']]]],
['紀錄',['處理事件的過程中，要隨時記下時間和做了什麼。','這份紀錄是事後還原經過的依據，也是報告和法律程序的基礎。','要在當下記，不要事後憑記憶補。'],'在筆記本上逐行寫下：「14:05 接獲通報」「14:12 到場，拔除網路線」「14:20 開始擷取記憶體」。','「先處理，等一下再一起補記」。事後補的紀錄時間不準、順序會錯、細節會漏，在需要證明處理過程的時候沒有說服力。','事件處理時很多事同時發生，人處在壓力下，記憶很不可靠。當下的紀錄有兩個用途：一是讓其他人知道已經做過什麼，避免重複或互相干擾；二是在日後被問到「當時為什麼這樣做」時，有憑據可以回答。','當下記：幾點幾分、做了什麼。',['f',['每做一個動作','記下時間','記下做了什麼','事後還原｜報告、法律依據']]],
['組織',['資安事件應變小組不能只有技術人員。','還需要：管理階層、法務、公關或對外窗口。','重大事件有很多不是技術上的決定：要不要通報、對外怎麼說明、有沒有法律責任。'],'事件確認有客戶資料外洩。技術人員負責圍堵和調查；法務確認通報義務；公關準備對外的說明；管理階層做最後的決定。','「這是資訊單位的事」。技術人員被迫去決定要不要對外公布、要不要通知客戶，這些既不是他們的專業，也不在他們的權責之內。','資安事件造成的影響是多方面的：系統、業務、法律、商譽。每一個面向都需要懂的人來處理，而且彼此會互相影響。事先把這些角色納入小組，出事的時候才不用臨時找人、從頭解釋。','應變小組要有技術、管理階層、法務、公關。',['c',[['技術人員','圍堵、調查｜復原'],['管理階層','做決定'],['法務','通報義務｜法律責任'],['公關','對外說明']]]],
['準備',['緊急聯絡清單要在平時準備好。','上面要有：應變小組成員、主管、廠商、主管機關的聯絡方式。','清單要有離線的版本。另外要定期演練，確認流程走得通、每個人知道自己要做什麼。'],'聯絡清單除了放在內部網站，也印出紙本，並存在每位成員的手機裡。每半年演練時順便核對電話號碼。','清單只放在公司的系統上。發生勒索軟體事件時，那套系統正好也被加密了，沒有人查得到任何人的電話。','事件發生時，平常理所當然可以用的東西可能都不能用：電子郵件、通訊錄、內部網站。準備工作就是假設這些都不在了，還有什麼可以依靠。演練則是在平時先發現「電話打不通」「沒有權限」這類問題。','聯絡清單要有離線版；計畫要定期演練。',['c',[['聯絡清單','成員、主管、廠商｜主管機關'],['離線版本','系統不能用時｜還查得到','a'],['定期演練','確認流程走得通']]]],
['分級',['事件要依嚴重程度分級。','等級決定：要投入多少資源、要通報哪些對象、處理的時限。','分級的標準要事先訂好。'],'一台一般電腦中毒是低等級，由資訊單位處理；核心系統被加密是最高等級，要啟動完整的應變小組並通報管理階層。','每一件事都用最高規格處理，人力很快耗盡；或是把重大事件當成小事處理，延誤了通報和決策。','不同事件的影響差距非常大，用同一套方式處理是不合理的。事先定好標準，出事時值班的人就可以照標準判斷並啟動對應的流程，不需要在壓力下臨時討論「這個算不算嚴重」。','事件分級決定資源、通報對象和時限；標準要事先訂。',['f',['判斷｜嚴重程度','對應的等級','決定資源｜和通報對象','依時限處理'],null,['','a','','']]]],
1:[
['圍堵',['圍堵的目的是阻止損害繼續擴大。','常見的做法是：隔離主機、停用帳號、封鎖惡意的位址。','隔離主機時，拔網路或用端點防護工具隔離，比直接關機好，因為可以保留記憶體裡的證據。'],'確認一台主機被入侵後，用端點防護工具把它隔離：它無法和其他主機通訊，但資安人員仍然可以遠端對它進行調查。','一發現就關機。損害是停止了，但記憶體裡的程序、連線和金鑰也都消失了，很多調查就做不下去。','圍堵要同時達成兩個目標：讓攻擊者無法繼續行動，以及保留調查所需的資訊。關機只達成第一個。隔離網路讓主機無法對外連線、也無法擴散到其他主機，但主機本身的狀態完整保留。','圍堵先止血：隔離主機、停用帳號、封鎖位址；隔離優於關機。',['c',[['隔離網路','止血｜保留記憶體證據','a'],['直接關機','止血｜記憶體證據消失','w']],'其他圍堵措施：停用帳號、封鎖惡意位址']],
['鑑識',['關機之前要先擷取記憶體，因為裡面有執行中的程序、網路連線和金鑰，關機就消失。','很多惡意程式只存在記憶體裡，硬碟上找不到。','製作硬碟映像時要計算雜湊值，用來證明映像和原始硬碟完全一致，之後也沒有被修改。'],'擷取記憶體之後製作硬碟映像，兩者都計算雜湊值並記錄。之後所有的分析都在複本上進行，原始證據封存。','直接在原始硬碟上分析。分析的動作會改變硬碟上的資料，之後就無法證明哪些是原本就有的。','鑑識的原則是原始證據不能被改動。所以要先製作完全相同的複本，並且用雜湊值證明它相同。任何人日後對同一份映像再計算一次，得到相同的值，就能確認內容沒有被動過。','先擷取記憶體再關機；映像要算雜湊值，分析都在複本上做。',['f',['擷取記憶體','製作硬碟映像','計算雜湊值','在複本上分析'],null,['a','','a','']]],
['分析',['時間軸是把不同來源的紀錄依照時間排列在一起。','從時間軸可以看出攻擊的經過：什麼時候進來、做了什麼、接觸了哪些主機。','它也能顯示哪些時段缺少紀錄，需要再找其他來源補上。'],'把郵件紀錄、端點紀錄、登入紀錄合併排序：09:02 收到釣魚信、09:15 開啟附件、09:16 對外連線、10:40 登入檔案伺服器。','各種紀錄分開看，每一份都只是一堆零散的事件，看不出彼此的關係。','攻擊是一連串有因果關係的動作，前一步的結果是後一步的條件。把所有紀錄放到同一條時間線上，這些關係才會顯現，也才能回答「他是怎麼從這裡到那裡的」。','時間軸：把各來源的紀錄依時間排起來，看出攻擊經過。',['f',['09:02｜收到釣魚信','09:15｜開啟附件','09:16｜對外連線','10:40｜登入伺服器'],'把不同來源的紀錄合併排序',['','w','w','w']]],
['資料來源',['調查一台主機被入侵的經過，需要多種來源的紀錄。','主機上的：系統紀錄、登入紀錄、端點防護的紀錄。','網路上的：防火牆、代理伺服器、DNS 的紀錄。兩邊要互相對照。'],'主機上的紀錄顯示一支可疑程式在 14:03 執行。對照代理伺服器的紀錄，同一時間這台主機連到一個外部位址下載了檔案。','只看主機上的紀錄。主機已經被攻擊者控制，上面的紀錄可能被刪除或修改過。','每一種紀錄只記錄它那個位置看得到的事。主機知道執行了什麼程式，但不一定知道資料傳到哪裡；網路設備知道連到哪裡，但不知道是哪支程式發起的。而且網路設備上的紀錄不在受害主機上，攻擊者比較難竄改。','主機上的和網路上的紀錄要互相對照。',['c',[['主機上','系統、登入紀錄｜端點防護紀錄'],['網路上','防火牆、代理｜DNS 紀錄']],'單一來源看不到全貌，而且主機上的紀錄可能被竄改']],
['溝通',['事件處理期間，對內和對外的訊息要由指定的窗口統一發布。','發布的內容要先經過確認。','參與處理的人不要各自對外說明。'],'指定一位發言人。所有對員工、客戶和媒體的說明都由他發出，內容事先經過技術負責人和法務確認。','處理人員各自回答同事或客戶的詢問，每個人說的不一樣，還有人把尚未確認的推測當成事實說出去。','事件初期的資訊不完整而且一直在變。未經確認的說法一旦傳出去，之後即使更正，也會造成不信任，甚至有法律上的風險。統一窗口可以確保所有人聽到的是同一個、確認過的版本。','訊息由指定窗口統一發布，內容要先確認。',['f',['處理人員｜回報事實','技術和法務｜確認內容','指定窗口','統一發布'],null,['','','a','']]],
['證據',['蒐集到的證據要標記，並記錄每一次交接的過程。','目的是確保證據的完整性和來源可以被證明。','說不清楚誰經手過的證據，在法律程序上可能不被採信。'],'每一項證據貼上編號標籤，填寫交接紀錄表：取得人、時間、地點；之後每一次移交，雙方都簽名並記錄時間。','「先收起來，要用的時候再說」。幾個月後要提交時，已經說不出這顆硬碟中間放在哪裡、有誰碰過。','證據的價值取決於它能不能被信任。對方可以主張證據在保管期間被修改或調換過，這時候需要有紀錄證明它從取得到現在一直在可以交代的人手上。這份紀錄只能在當下建立，無法事後補做。','證據要標記、記錄每次交接。',['f',['取得證據','貼上標籤｜編號','填寫交接紀錄','每次移交｜雙方簽名']]]],
2:[
['鑑識',['製作硬碟映像時要使用寫入保護器。','它確保取證的過程不會改動原始硬碟上的任何資料。','因為只要把硬碟接上電腦，作業系統就可能自動寫入一些東西。'],'把證物硬碟接到寫入保護器，再接到鑑識工作站製作映像。寫入保護器會擋下所有寫入的指令。','「我只是讀取，不會寫入」。作業系統在掛載磁碟時會自動更新存取時間、建立系統資料夾，這些都不是你主動做的。','原始證據只要有任何改動，對方就可以質疑其他部分是不是也被改過。寫入保護器從硬體的層次阻擋寫入，讓「原始硬碟沒有被改動」這件事不需要依賴操作人員的小心，而是有機制保證。','取硬碟映像要用寫入保護器，確保原始硬碟不被改動。',['f',['證物硬碟','寫入保護器｜擋下所有寫入','鑑識工作站','製作映像'],null,['','a','','']]],
['現場蒐證',['在還在運作的受害主機上執行蒐證工具，有兩個風險。','第一，工具本身的執行會改變系統的狀態。','第二，主機上原有的程式可能已經被攻擊者竄改，執行結果不可信。','所以要使用自備、可信的工具，並記錄執行了什麼。'],'從自備的隨身碟執行蒐證工具，而不使用受害主機上的系統指令，並在紀錄中寫明幾點執行了哪一支工具。','直接用受害主機上的指令查看程序和連線。攻擊者可能已經替換了這些指令，讓它們不顯示他的程序。','這是保全和時效之間的取捨。最嚴謹的做法是完全不碰運作中的系統，但這樣會失去只存在於記憶體的資訊。折衷的做法是接受一定程度的改變，但要讓這些改變降到最少、可以解釋，而且用的工具是可以信任的。','現場蒐證用自備的可信工具，並記錄做了什麼。',['c',[['主機上的工具','可能已被竄改｜結果不可信','w'],['自備的工具','可信｜並記錄執行了什麼']],'工具執行本身會改變系統，要降到最少']],
['分析',['惡意程式清除後又出現，通常是漏掉了持久化機制。','持久化是攻擊者讓程式在重開機後能再度執行的方法，例如排程工作、服務、啟動項目。','判斷攻擊者有沒有移動到其他主機，要查其他主機上來自受害主機或受害帳號的登入和遠端執行紀錄。'],'刪除惡意檔案三天後它又出現。檢查後發現有一個排程工作，每天從外部重新下載並執行。','只刪除被偵測到的那個檔案。攻擊者留下的機制和他手上的帳號都還在，等於什麼都沒有處理。','攻擊者知道他的程式可能被發現和刪除，所以會安排讓它自動回來的方法，而且常常不只一種。清除的重點不是那個檔案，而是「它是怎麼被執行的」以及「攻擊者還能用什麼方式回來」。','清了又回來：找持久化機制；追橫向移動：查其他主機的登入紀錄。',['c',[['持久化','排程、服務｜啟動項目','w'],['橫向移動','其他主機上的｜網路登入｜遠端執行紀錄','w']]]],
['惡意程式',['分析可疑的惡意程式樣本，要在隔離的環境裡進行。','上傳到公開的分析平台之前要先考慮：上傳的樣本任何人都可以下載。','攻擊者也會去查自己的樣本有沒有被上傳，藉此知道自己被發現了。'],'先只用樣本的雜湊值去公開平台查詢有沒有既有的分析結果，不上傳檔案本身。需要動態分析時，使用內部隔離的沙箱。','拿到可疑檔案就直接上傳到公開平台。如果這是針對你的單位特製的樣本，裡面可能含有內部的資訊，而且等於通知攻擊者。','公開平台的運作方式是分享：上傳的樣本會提供給所有訂閱的研究人員和廠商。對一般大量散布的惡意程式這沒有問題，但針對性攻擊的樣本是獨一無二的，上傳就會暴露你的調查，也可能洩漏樣本中內含的組織資訊。','樣本在隔離環境分析；先查雜湊值，上傳公開平台前要三思。',['f',['取得樣本','先用雜湊值｜查詢','在隔離環境｜分析','上傳前評估｜會不會洩漏'],null,['','a','','w']]],
['範圍判定',['從第一台受害主機取得的線索（檔案雜湊值、連線位址），要用來在整個環境裡搜尋。','目的是找出其他受害的主機。','範圍還沒確定就開始清除，會漏掉攻擊者其他的立足點。'],'在第一台主機上找到惡意檔案的雜湊值和它連線的網域。用這兩項搜尋所有端點和 DNS 紀錄，又找到五台主機。','把被發現的那一台處理完就結案。攻擊者很少只控制一台，其他的主機會繼續被使用。','第一台被發現的主機通常只是因為它剛好觸發了告警，不代表它是唯一的一台，也不代表它是最早的一台。它的價值在於提供了可以辨識這次攻擊的特徵，用這些特徵可以把其他還沒被發現的主機找出來。','一台被發現不是唯一一台；用找到的指標搜尋全環境。',['f',['第一台｜受害主機','取出指標：｜雜湊值、位址','搜尋全環境','找出其他｜受害主機'],null,['w','a','','w']]],
['根除',['根除是移除後門、重設密碼、修補入侵管道。','要等到範圍掌握得差不多、可以一次同步處理的時候才開始。','太早動手會讓攻擊者察覺，改用其他方式躲藏。'],'確認受影響的是八台主機和五個帳號之後，選在週六凌晨一次執行：封鎖中繼站、隔離主機、重設所有相關帳號的密碼。','每發現一個後門就馬上移除。攻擊者發現自己的工具消失，就知道被發現了，會改用還沒被找到的管道並變得更隱密。','根除要成功，必須讓攻擊者同時失去所有回來的方法。只要留下一個，他就能重新建立其他的。所以要先把所有的立足點都找出來，再同時處理，不給他反應的時間。','範圍摸清楚再一次同步根除，不要邊找邊清。',['f',['調查範圍','範圍大致｜掌握','一次同步：｜封鎖、隔離、重設','確認｜沒有殘留'],null,['','','a','']]],
['法遵',['事件確認涉及個資外洩時，技術處理之外，法遵的工作要同步啟動。','要評估依法規是否有通報主管機關和通知當事人的義務，以及時限。','通報的時限是從知悉起算，不能等調查完成才開始考慮。'],'週一下午確認有個資外洩的可能。技術團隊繼續調查範圍的同時，法務當天就開始確認適用的法規和通報時限。','「等全部查清楚再一起處理通報」。調查可能要好幾週，而通報的時限早就過了。','法規設定通報時限，是為了讓主管機關和當事人能及早因應，所以不要求通報時已經掌握全部的事實，可以先通報已知的部分再補充。技術調查和法遵評估需要的時間都很長，只有同時進行才來得及。','個資外洩：技術和法遵同時啟動，時限從知悉起算。',['c',[['技術處理','圍堵、調查｜確認範圍'],['法遵評估','通報主管機關｜通知當事人','a']],'兩者同時進行；時限從知悉起算']]],
3:[
['準備',['應變腳本（Playbook）是針對常見的事件類型，事先寫好的處理步驟和分工。','事件發生時不必從頭思考，照既定的步驟執行。','常見的腳本有：勒索軟體、帳號被盜用、釣魚信、資料外洩。'],'勒索軟體的腳本寫明：第一步隔離哪些網段、通知哪些人、誰負責確認備份、多久之內要決定是否啟動復原。','腳本寫好就放著。環境和人員都會變動，沒有演練和更新的腳本，真正要用的時候發現裡面的系統已經換掉、負責人已經離職。','人在高壓和資訊不足的情況下，判斷力會下降，而且事件的第一個小時通常最關鍵。事先在冷靜的時候把步驟想清楚並寫下來，可以避免把這段時間花在討論「現在該做什麼」。','常見事件事先寫好應變腳本，並定期演練更新。',['f',['選定常見的｜事件類型','寫好步驟｜和分工','定期演練','依結果更新'],null,['','a','','']]],
['外部資源',['鑑識或事件應變的廠商，要在平時就簽好合約。','事件發生時才開始找，簽約和議價會耽誤最關鍵的時間。','預先簽約也讓廠商先了解你的環境，進場時不用從零開始。'],'和應變廠商簽訂年度的待命合約，約定四小時內回應。廠商事先取得了網路架構圖和聯絡窗口。','「等真的出事再找」。到時候要在最緊急的情況下找廠商、比價、走採購流程、簽保密協議，可能要好幾天。','重大事件需要的專業能力，大多數單位平常用不到，也不可能自己養。這些能力必須向外取得，而取得的過程（評選、簽約、了解環境）需要時間。把這些工作移到平時完成，事件發生時就只剩下「打電話」。','應變廠商平時就簽好約，出事時只要打電話。',['c',[['事件時才找','簽約議價｜耽誤關鍵時間','w'],['平時簽好約','約定回應時間｜廠商已了解環境']]]],
['勒索事件',['遭到勒索軟體攻擊時，要不要付贖金是經營上的決策。','應該由最高管理階層決定，並參考法務和專業人員的建議。','要考慮的包括：付了不保證能解密、可能有法律問題、以及有沒有可用的備份。'],'資訊單位向管理階層報告：備份的狀況、預估的復原時間、付款的風險。法務說明法律上的考量。最後由總經理決定。','由資訊主管自己決定付或不付。這個決定牽涉到金錢、法律責任和公司的聲譽，超出了資訊單位的權責。','付贖金有很多不確定性：對方可能不給金鑰、金鑰可能無法完整解密、資料可能還是被公開，付款本身也可能違反法規。這是在多種風險之間做選擇，需要對整個組織負責的人來做。資訊單位的角色是提供做決定所需要的事實。','付不付贖金是經營決策，由最高管理階層決定。',['f',['資訊單位：｜備份狀況、復原時間','法務：｜法律風險','專業人員：｜付款的不確定性','最高管理階層｜決定'],null,['','','','a']]],
['事後檢討',['重大事件結束後的檢討，最重要的產出是具體的改善項目。','每一項都要有負責人和完成期限。','並且要有人定期追蹤這些項目的進度。'],'檢討會列出六項改善，例如「三個月內完成所有對外主機的多因素驗證，負責人某某某」，並排入每月的管理會議追蹤。','檢討會開完，大家都同意「以後要更小心」，然後沒有任何具體的行動。下一次事件會在同一個地方發生。','事件剛結束時，大家對問題的認識最清楚、改善的意願也最高，但這個狀態很快就會消退，日常的工作會重新佔滿所有時間。把檢討的結論轉換成有名字、有日期的項目，它才不會隨著時間被遺忘。','檢討要產出改善項目、負責人、期限，並追蹤。',['c',[['改善項目','具體要做什麼'],['負責人','誰來做'],['期限','何時完成'],['追蹤','定期檢視進度']]]],
['證據保存',['事件相關的證據和紀錄，不能在結案時就刪除。','保存期限要依法規、合約，以及可能發生訴訟的時效來決定。','保存期間仍然要維持保管的紀錄。'],'事件結案後，把映像檔、紀錄和報告加密封存，註明依規定保存的年限，到期才依程序銷毀。','結案後為了節省空間把映像檔刪掉。半年後主管機關來函調查，或是當事人提出訴訟，已經拿不出任何證據。','事件在技術上結束，不代表在法律上結束。受害人提出求償、主管機關展開調查、保險理賠的審核，都可能在好幾個月甚至幾年之後才發生，那時候需要的就是當初的證據。','證據保存期限看法規、合約和訴訟時效，不是結案就刪。',['f',['事件結案','依法規和｜訴訟時效定期限','加密封存','到期才｜依程序銷毀'],null,['','a','','']]],
['雲端鑑識',['在公有雲上做鑑識，拿不到實體的設備。','要依靠雲端服務提供的紀錄、快照和 API。','很多紀錄預設沒有開啟，或是只保留很短的時間，要在平時就設定好。'],'發現雲端上的主機被入侵，想查是誰在什麼時候修改了防火牆規則，才發現管理操作的紀錄只保留了預設的天數，更早的已經查不到。','「雲端業者會有紀錄」。業者有他自己的紀錄，但不一定會提供給你，而且你需要的那種紀錄可能要你自己開啟才會產生。','在自己的機房，可以直接把硬碟拆下來、把記憶體擷取出來。在雲端，這些實體的東西都在業者手上，你能取得的只有業者透過服務提供的資料。所以能不能調查，完全取決於事先開了哪些紀錄、保留多久。','雲端鑑識靠紀錄和快照，而紀錄要事先開、保存期要事先設。',['c',[['自有機房','可以取得｜實體硬碟和記憶體'],['公有雲','只能靠紀錄｜快照和 API','w']],'紀錄要在平時就開啟，並設定足夠的保存期限']],
['危機管理',['事件影響到核心營運、大量個資、法規遵循或公司商譽時，要從技術處理升級為組織層級的危機管理。','這時候的決策已經超出資訊單位的權責。','需要經營層、法務和公關一起參與。'],'原本以為是單一系統的故障，調查後確認大量客戶資料外洩。立即啟動危機管理小組，由總經理主持。','資訊單位覺得「我們可以處理」而沒有往上升級，等到媒體報導或客戶來電，管理階層才知道。','技術人員的目標是把系統修好，但這類事件還牽涉到：要不要通知客戶、怎麼回應媒體、法律上要負什麼責任、營運要怎麼維持。這些決定影響整個組織，必須由有權責的人來做，而且愈早讓他們知道，可以選擇的做法愈多。','影響營運、個資、法遵、商譽，就要升級到危機管理。',['f',['技術事件','影響核心營運｜大量個資、商譽？','升級為｜危機管理','經營層、法務｜公關一起'],null,['','w','a','']]],
['成效',['衡量事件應變能力有沒有進步，要看時間。','從事件發生到被偵測、從偵測到圍堵、到完全復原，各花了多久。','事件的件數不適合當成指標。'],'去年從發生到偵測平均是 18 天，今年是 4 天；從偵測到圍堵從 3 天縮短到 6 小時。','「今年的事件件數比去年多，表示資安變差了」。件數增加可能只是因為偵測能力變好，以前沒發現的現在發現了。','攻擊者在環境裡停留得愈久，能造成的損害愈大。應變能力的本質就是縮短這段時間。把整個過程拆成幾個階段分別量測，還可以看出瓶頸在哪一段：是發現得太慢，還是發現之後處理得太慢。','應變成效看時間：多久偵測、多久圍堵、多久復原。',['f',['發生','偵測','圍堵','完全復原'],'每一段各花多久？時間縮短才代表進步']]]};
LEARN.netsec={0:[
['防火牆',['防火牆規則的基本原則是：預設全部拒絕，只開放明確需要的連線。','這叫白名單的做法。','不要反過來「預設全部允許，只擋已知不好的」。'],'新建的網段先設定為全部拒絕。之後有人申請、說明用途，再逐條開放需要的來源、目的和連接埠。','「先全開，有問題再擋」。你不可能列出所有不好的東西，這種做法永遠慢攻擊者一步。','不好的連線種類是無限的，而且不斷有新的出現；但一個系統實際需要的連線是有限、可以列舉的。只允許列得出來的那些，其他的不管是什麼、不管以後出現什麼新手法，都自動被擋下。','防火牆：預設拒絕，只開需要的。',['c',[['預設拒絕','只開放明確需要的','a'],['預設允許','只擋已知不好的｜永遠擋不完','w']]]],
['網路分區',['DMZ 是放置需要對外提供服務的主機的區域，例如網站、郵件閘道。','它和內部網路之間隔著一層防火牆。','對外的主機被攻破時，攻擊者還要再突破一層才能到達內部。'],'公司網站放在 DMZ。外面的人可以連到網站，網站只能連到後端資料庫的特定連接埠，不能連到辦公室的電腦。','把對外的網站主機直接放在內部網路。它一被入侵，攻擊者就直接站在內部網路裡。','對外提供服務的主機是最容易被攻擊的，因為任何人都連得到。既然它被入侵的機率最高，就應該假設它會被入侵，並且事先限制它被入侵之後能接觸到什麼。','對外的主機放 DMZ，和內網之間再隔一層防火牆。',['f',['網際網路','防火牆','DMZ｜對外的主機','防火牆','內部網路'],null,['','','a','','']]],
['偵測與防禦',['IDS（入侵偵測系統）只偵測並發出告警。','IPS（入侵防禦系統）除了偵測，還會主動阻擋。','IPS 擋錯會影響正常的流量，所以通常先用偵測模式觀察一段時間，再開啟阻擋。'],'新的 IPS 先以只偵測的模式運作一個月，檢視它會擋到哪些正常的流量並調整，確認之後才切換成阻擋模式。','「能擋當然比只告警好，所以一開始就全部開阻擋」。誤判的規則會把正常的業務流量切斷。','IDS 判斷錯誤的代價是多一個誤報；IPS 判斷錯誤的代價是服務中斷。在不了解規則在自己的環境裡準確度如何之前，先觀察再阻擋是比較安全的做法。','IDS 只告警，IPS 會阻擋；IPS 先觀察再開阻擋。',['c',[['IDS','偵測並告警'],['IPS','偵測並阻擋｜擋錯會影響正常流量']],'IPS 通常先用偵測模式觀察，再開啟阻擋']],
['VPN',['VPN 是在不可信的網路上建立一條加密的通道。','它保護的是資料在傳輸過程中不被看到或竄改。','它不會檢查連進來的那台電腦本身有沒有問題。'],'員工在咖啡廳用公用無線網路連回公司，VPN 讓同一個無線網路上的其他人看不到傳輸的內容。','「有連 VPN 所以是安全的」。如果那台筆電已經中毒，VPN 反而成為惡意程式進入公司內網的通道。','加密解決的是「中間有沒有人偷看」的問題，但通道兩端的設備是不是可信，是另一個問題。VPN 把遠端的電腦接進內部網路，等於把那台電腦上的所有風險也一起帶進來。','VPN 保護傳輸過程，不保證連進來的電腦是乾淨的。',['f',['外面的電腦','加密通道｜（VPN）','公司內網'],'保護的是傳輸過程；電腦本身有問題一樣會帶進內網',['','a','']]],
['基本防護',['攻擊者最常利用的，是早就有修補程式、但一直沒有更新的已知漏洞。','持續修補是最不起眼、但最有效的防護。','對外的系統尤其要優先修補。'],'一次大規模的入侵事件，被利用的漏洞在半年前就已經有修補程式，受害的都是還沒更新的單位。','把資源都投入新的資安產品，基本的修補卻沒有做好。攻擊者不需要高明的技術，用現成的工具打舊漏洞就夠了。','已知漏洞的利用方法通常是公開的，甚至有現成的工具，攻擊者使用它幾乎沒有成本。相對地，尋找未知的漏洞又貴又難。只要還有大量沒修補的系統，攻擊者就沒有理由用更難的方法。','最常被打的是早就有修補、卻沒更新的舊漏洞。',['f',['漏洞公開','修補程式發布','一直沒更新','被現成的工具｜打進來'],null,['','a','w','w']]],
['分段',['把內部網路切成多個網段，並且控制網段之間可以互通的連線。','目的是一個區域被入侵時，限制攻擊能擴散的範圍。','常見的切法是依功能：辦公室、伺服器、管理、訪客。'],'辦公室的電腦只能連到伺服器網段的特定服務，不能直接連到資料庫，也不能連到其他樓層的電腦。','整個公司放在同一個大網段。一台電腦中毒，就能直接接觸到所有的設備，包括伺服器和印表機。','攻擊者進來之後要移動到真正有價值的目標，需要網路上「連得到」。分段就是事先決定哪些設備之間不需要互通，並把這些路切斷。這樣即使某一台被入侵，他能到達的也只有那個區域。','內網要分段：一區被入侵，擴散不到別區。',['c',[['一個大網段','一台中毒｜能碰到全部','w'],['切成多個網段','限制擴散的範圍']]]],
['管理介面',['防火牆、交換器這類設備的管理介面，只允許從管理專用的網段或主機連線。','不可以對網際網路開放。','並且要改掉預設的密碼，使用加密的管理協定。'],'設備的管理介面只接受來自管理網段的連線。管理人員要先登入跳板機，才能連到這些設備。','為了方便遠端維護，把防火牆的管理頁面直接對外開放。這是很常見的入侵原因。','取得設備的管理權限，就等於擁有那台設備：可以改規則、看流量、把它當成跳板。管理介面是設備上價值最高的入口，所以要讓能接觸到它的範圍愈小愈好。','管理介面只給管理網段連，絕不對外開放。',['c',[['對外開放','任何人都能嘗試登入','w'],['只限管理網段','接觸得到的範圍最小']]]],
['端點',['只靠網路邊界的防火牆是不夠的。','筆電會被帶到外面使用；威脅也會從內部、從隨身碟、或藏在加密的流量裡進來。','所以每台端點本身也要有防護和修補，不能假設內部網路就是安全的。'],'員工的筆電在家裡中毒，隔天帶回公司接上內部網路。邊界的防火牆完全沒有機會看到這個威脅。','「我們的防火牆很好，內部是安全的」。這個想法會讓內部的防護被忽略，一旦有東西進來就毫無阻擋。','邊界防火牆只能檢查經過它的流量。現在的工作方式讓很多東西不經過它：帶進帶出的設備、加密的連線、雲端的服務。防護必須延伸到每一台設備本身，才不會有東西繞過檢查。','邊界防火牆擋不了帶進來的威脅；端點自己也要有防護。',['c',[['邊界防火牆','只看得到｜經過它的流量'],['繞過邊界的','帶回來的筆電｜隨身碟｜加密流量','w'],['所以','端點本身｜也要防護和修補']]]]],
1:[
['防火牆',['新增防火牆規則時，要指定明確的來源、目的和連接埠。','開放的範圍愈小愈好。','「任意來源到任意目的」的規則等於沒有防火牆。'],'申請「讓報表主機可以連到資料庫」。規則寫成：來源是報表主機的位址，目的是資料庫的位址，連接埠是資料庫用的那一個。','為了省事寫成「這個網段到那個網段全部允許」。當下是通了，但同時開放了幾百台主機之間所有不需要的連線。','規則開放的每一條多餘的路，都是攻擊者可以利用的路。寫得精確需要先弄清楚實際的需求，這比較費工，但也只有這樣才能在出問題時說得出每一條規則為什麼存在。','規則要寫明來源、目的、連接埠，愈小愈好。',['c',[['來源','哪一台或｜哪個網段'],['目的','哪一台'],['連接埠','哪個服務']],'任意到任意的規則等於沒有防火牆']],
['規則管理',['防火牆的規則會隨時間累積。','要定期清查：依使用紀錄和申請紀錄，停用並移除不再需要的。','每條規則都應該有申請人、原因和到期日。長期沒有流量的規則優先檢討。'],'每半年清查一次。先找出六個月內沒有任何流量的規則，聯絡申請人確認，沒有需要的先停用觀察一個月再刪除。','「不知道那條規則是做什麼的，所以不敢動」。結果規則只增不減，裡面藏著很多早就不需要、卻還開著的通道。','新增規則有人推動，因為有人需要；移除規則卻沒有人會主動提，因為留著不會造成任何人的不便。如果沒有固定的清查機制，規則的數量只會增加，而每一條過時的規則都是沒有人看管的入口。','規則要有申請人、原因、到期日；定期清查沒在用的。',['f',['找出長期｜沒流量的規則','向申請人確認','先停用｜觀察','確認後移除']]],
['網站防護',['WAF 是網站應用程式防火牆，防護針對網站應用層的攻擊。','例如 SQL 注入、跨站腳本。','一般的防火牆只看 IP 位址和連接埠，WAF 看得懂 HTTP 的內容。'],'網站被掃描工具大量嘗試注入攻擊。WAF 辨識出請求裡的攻擊字串並擋下，這些請求沒有到達網站的程式。','「前面有 WAF，程式有漏洞也沒關係」。WAF 可以被繞過，它是多一層防護，不能取代把程式本身修好。','對外的網站一定要開放 80 和 443 連接埠，一般的防火牆對這些流量只能放行。攻擊藏在合法連線的內容裡，例如表單的輸入值。要擋這種攻擊，設備必須能解讀 HTTP 的內容並判斷它是不是在攻擊。','WAF 看得懂 HTTP，擋應用層攻擊；但程式本身還是要修。',['c',[['一般防火牆','看 IP 和連接埠'],['WAF','看 HTTP 的內容｜擋注入、跨站腳本']],'WAF 不能取代把程式本身修好']],
['出站管控',['從內部連出去的流量也要管控。','目的是限制惡意程式對外連線，以及資料外傳的管道。','伺服器通常不需要任意連到網際網路，只開放它實際需要的目的地。'],'資料庫伺服器被設定成完全不能連到網際網路。即使它被入侵，攻擊者的程式也無法連回他的控制伺服器。','只管「進來」的流量，認為「自己人連出去沒有風險」。攻擊者拿下主機之後的每一步幾乎都需要對外連線。','被入侵的主機要接受攻擊者的指令、下載更多工具、把資料傳出去，都要主動對外連線。限制出站流量不能阻止最初的入侵，但可以讓入侵之後的這些步驟很難進行，也讓異常的嘗試更容易被發現。','連出去的也要管：伺服器只開必要的對外連線。',['f',['主機被入侵','嘗試連回｜控制伺服器','出站規則｜擋下','攻擊者無法｜下指令'],null,['w','w','a','']]],
['弱點掃描',['對內部網路做弱點掃描之前，要先確認範圍、時間和授權。','並且通知相關的單位。','掃描可能影響老舊的設備，也會觸發資安告警。'],'排定週六凌晨掃描伺服器網段，事前通知系統負責人和監控中心，並把幾台已知不穩定的老設備排除在外另行處理。','沒有通知就直接掃描。監控中心看到大量的探測行為以為是真的攻擊而啟動應變；一台老舊的設備被掃到當機。','弱點掃描的行為在網路上看起來和攻擊者的探測一模一樣。事先溝通讓監控人員知道這是預期的活動，也讓系統負責人有機會提醒哪些設備比較脆弱。','掃描前確認範圍、時間、授權，並通知相關單位。',['c',[['範圍','掃哪些主機'],['時間','什麼時段'],['授權','誰核准的'],['通知','系統負責人｜監控中心']]]],
['強化',['強化是把系統調整成比較安全的狀態。','做法包括：關閉不需要的服務和帳號、套用安全的設定、移除預設值。','可以參考公開的安全設定基準。'],'新安裝的伺服器依照設定基準處理：停用用不到的服務、移除範例頁面、改掉預設帳號密碼、關閉不需要的連接埠。','「預設安裝就能用，不用再調整」。預設值是為了方便使用而設計的，不是為了安全。','每一個執行中的服務、每一個開放的連接埠、每一個帳號，都是攻擊者可以嘗試的入口。預設安裝通常會開啟很多用不到的功能。把用不到的全部關掉，可以攻擊的地方就少了。','強化：關掉不需要的、改掉預設值、套用安全設定。',['f',['預設安裝','關閉不需要的｜服務和帳號','移除預設值','套用安全｜設定基準'],null,['w','','','a']]],
['遠端存取',['對外開放的遠端存取入口，例如 VPN、遠端桌面閘道，最基本的保護是強制多因素驗證。','這類入口每天都會被大量嘗試登入。','只靠密碼，被撞開只是時間的問題。'],'VPN 登入除了帳號密碼，還要在手機的驗證器上確認。攻擊者即使拿到員工外洩的密碼，也無法登入。','「我們有密碼複雜度的規定就夠了」。密碼可能在別的網站外洩、被釣魚騙走，複雜度完全幫不上忙。','遠端存取入口的作用就是讓人從外面進到內部，一旦被突破，攻擊者得到的是和員工一樣的內部存取。它又必須對外開放。這樣的入口只靠一個可以被偷、被猜的密碼來保護，風險太高。','對外的遠端存取入口一律強制多因素驗證。',['c',[['只有密碼','外洩或被釣走｜就進來了','w'],['密碼＋第二因素','拿到密碼｜也進不來']]]],
['紀錄',['防火牆和資安設備的紀錄，要送到集中的平台保存和分析。','設備本身能保存的時間很短。','集中之後才能和其他來源關聯，看出跨設備的攻擊軌跡。'],'防火牆的紀錄即時送到集中日誌平台，保存一年。調查時可以把防火牆、代理伺服器和端點的紀錄放在一起查。','紀錄只留在設備上。要查的時候才發現只有最近幾天的，而且一台一台登入去查非常沒有效率。','網路設備的儲存空間很小，流量又大，紀錄很快就會被新的覆蓋。而且單一設備的紀錄只是攻擊過程的一個片段，必須和其他來源放在一起才看得出完整的經過。','設備的紀錄要集中保存，才留得久、對得起來。',['f',['各台設備｜的紀錄','送到｜集中平台','長期保存','跨設備｜關聯分析'],null,['','a','','']]]],
2:[
['架構',['傳統的 VPN 連上之後，就進到整個內部網路。','零信任網路存取（ZTNA）只讓使用者連到被授權的特定應用。','每一個應用都要依身分和裝置的狀態另外放行。'],'業務人員透過 ZTNA 只能連到客戶管理系統和郵件，看不到也連不到其他的伺服器。','把 ZTNA 當成「比較新的 VPN」直接替換。它的重點是存取控制的方式不同：從「連上網路」變成「連到應用」。','VPN 的設計是把遠端的電腦接進內部網路，之後它能連到什麼，由內部的網路規則決定，通常很寬鬆。一個帳號被盜用，攻擊者就站在內網裡。只給應用層級的存取，被盜用時能接觸到的範圍就小很多。','VPN 進到整個內網；ZTNA 只到被授權的應用。',['c',[['傳統 VPN','連上就進入｜整個內部網路','w'],['ZTNA','只到授權的應用｜每個應用個別放行']]]],
['可視性',['大部分的流量都加密之後，網路偵測還是有東西可以看。','可以看：連線的對象、時間、流量的大小和模式。','不解密也能看出異常，例如連到罕見的目的地、規律的心跳、異常的資料量。'],'一台主機每 5 分鐘連到同一個境外位址，每次的資料量幾乎一樣。內容雖然看不到，這個模式本身就很可疑。','「都加密了，網路層就沒什麼好監控的」。放棄之後，等於完全看不到主機之間和對外的通訊狀況。','加密隱藏的是通訊的內容，但通訊這件事本身無法隱藏：封包還是要送到某個位址、在某個時間、帶著某個大小。這些外圍的資訊累積起來，就足以描繪出行為的模式。','加密看不到內容，但看得到對象、時間、大小和規律。',['c',[['看不到','通訊的內容','off'],['看得到','連到哪裡｜什麼時間｜多大、多規律']]]],
['東西向',['只在對外的邊界放防火牆，擋不住內部主機之間的攻擊。','因為內部互相連線的流量根本不經過邊界防火牆。','需要內部的分段、主機上的防火牆，或是微分段。'],'攻擊者拿下一台內部電腦之後，直接連到同一個網段的其他電腦。這些連線都在內部交換器上完成，邊界防火牆完全看不到。','把所有的防護預算都放在邊界。內部一旦有一台被入侵，接下來的移動完全沒有任何阻擋和紀錄。','進出網路的流量稱為南北向，內部主機之間的稱為東西向。邊界設備只在南北向的路徑上。攻擊者進來之後的橫向移動全部是東西向的，所以必須在內部也設置檢查點。','內部主機互連不經過邊界；要靠內部分段和主機防火牆。',['c',[['南北向','進出網路｜經過邊界防火牆'],['東西向','內部主機之間｜不經過邊界','w']]]],
['管理網路',['伺服器的帶外管理介面（遠端管理卡）可以直接開關機、掛載映像檔、操作主控台。','它的權限等同於站在機器前面。','要放在獨立而且嚴格限制的管理網段，並保持韌體更新。'],'所有伺服器的遠端管理卡都接在獨立的管理網路，只有管理用的跳板機可以連線，而且每台都改掉了預設密碼。','把遠端管理卡接在和伺服器相同的一般網段，甚至還在使用出廠的預設密碼。','遠端管理卡是獨立於作業系統之外運作的，作業系統上的防護軟體和紀錄都管不到它。取得它的控制權，就可以繞過作業系統的所有安全機制，例如從外部的映像檔開機。','遠端管理卡等同站在機器前；要放獨立管理網段。',['f',['遠端管理卡','可以開關機｜掛載映像','等同站在｜機器前面','放獨立的｜管理網段'],null,['','w','w','a']]],
['弱點管理',['弱點數量很多時，決定優先順序要結合三件事。','嚴重程度、是否已經有人在實際利用、資產暴露的程度。','已經有人在利用、又直接對外的，優先於分數高但接觸不到的。'],'兩個弱點：一個 CVSS 9.8 但在隔離的內部網段；一個 7.5 但在對外的主機上，而且已經有公開的攻擊工具。先修後者。','只依 CVSS 分數由高到低處理。分數反映的是弱點本身的嚴重性，不是它在你的環境裡實際被攻擊的可能性。','每年公開的漏洞有好幾萬個，但真正被攻擊者拿來使用的只是其中很小的一部分。把修補的資源集中在「真的有人在打」而且「打得到」的漏洞上，降低風險的效果最大。','先修：有人在打的、又對外的。',['c',[['嚴重程度','CVSS 分數'],['是否被利用','有沒有人｜實際在打','a'],['暴露程度','是不是｜直接對外','a']]]],
['DDoS',['大流量的阻斷服務攻擊，自己的設備通常擋不住。','原因是流量在到達設備之前，就已經把對外的線路塞滿了。','要靠上游的網路業者或雲端的清洗服務，在頻寬更大的地方處理。'],'公司的線路是 1 Gbps，攻擊流量是 10 Gbps。防火牆再好也沒有用，因為正常的流量根本擠不進這條線路。','「買一台更好的防火牆就能擋 DDoS」。設備是放在線路的末端，線路被塞滿時它什麼也做不了。','這種攻擊消耗的是頻寬這個資源。處理的位置必須在頻寬比攻擊流量更大的地方，也就是上游。清洗服務把流量先導到它們的大型設施，過濾掉攻擊流量之後再把正常的送回來。','大流量 DDoS 會先塞滿線路；要靠上游或清洗服務。',['f',['攻擊流量','塞滿對外線路','自己的設備｜在線路末端','來不及處理'],'要在上游、頻寬更大的地方清洗',['w','w','','w']]],
['組態',['網路和資安設備的設定要定期備份。','並且比對前後的差異，知道被改了什麼。','未經核准的變更可能是失誤，也可能是入侵的跡象。'],'每天自動備份所有設備的設定並和前一天比對。某天發現防火牆多了一條沒有人申請的規則，立即展開調查。','只在設備故障時才想到要備份。更常見的問題是設定被改了卻沒有人知道。','設備的設定決定了它的行為，一條規則的改變就可能開出一個洞。人工檢查幾百台設備的設定不可行，但自動比對差異很容易。任何不在變更紀錄裡的差異，都是需要解釋的事。','設備設定要定期備份並比對差異。',['f',['每天自動備份','和前一天比對','有差異','對照變更紀錄｜沒有就調查'],null,['','a','w','']]],
['誘捕',['誘捕系統是放在內部網路、看起來像真實系統的假目標。','正常情況下不會有人連到它。','一有連線就值得調查，誤報非常低，很適合用來偵測內部的橫向移動。'],'在伺服器網段放一台看起來像檔案伺服器的誘捕系統。某天它收到來自一台辦公室電腦的連線嘗試，調查後發現那台電腦已被入侵。','誘捕系統要和實際環境隔離好，不能讓它反過來被攻擊者利用。它也只偵測得到「碰到它」的攻擊者。','攻擊者進入陌生的網路之後，要先探索有哪些主機和服務。他無法分辨哪些是真的、哪些是誘餌。而正常的使用者和系統只會連到自己需要的地方，不會去探索。','誘捕系統沒人會連，一有連線就調查。',['f',['放置｜誘捕系統','正常使用者｜不會連','攻擊者探索時｜連到','高可信度的｜告警'],null,['a','','w','a']]]],
3:[
['策略',['縱深防禦和零信任並不衝突。','縱深防禦是設置多層不同的防護。','零信任是把驗證和最小權限貫穿到每一層，不因為位置而給予信任。兩者都假設任何一層都可能被突破。'],'保留網路分段和端點防護這些層次（縱深防禦），同時在每一層都要求驗證身分和裝置（零信任）。','「我們要導入零信任，所以原本的防火牆和分段可以拿掉」。零信任是加強每一層的做法，不是減少層次。','兩個概念處理的是不同的問題。縱深防禦回答「要有幾道防線」，零信任回答「每一道防線要依據什麼放行」。把兩者合起來，就是多道防線，而且每一道都不預設信任。','縱深防禦講層次，零信任講每層都要驗證；兩者互補。',['c',[['縱深防禦','多層不同的防護'],['零信任','每一層都驗證｜最小權限']],'共同的假設：任何一層都可能被突破']],
['架構',['SASE 是把網路安全功能和廣域網路連線整合成雲端服務。','動機是使用者和應用程式都分散了：人在各地、應用在雲端。','把所有流量繞回總部的機房檢查，既慢又沒有必要。'],'在家工作的員工要用雲端的辦公軟體。以前流量要先連回公司再出去；改用 SASE 之後，在離他最近的服務節點完成檢查就直接連到雲端。','把 SASE 當成一個產品名稱，買了就算完成。它是一種架構上的改變，需要重新設計流量怎麼走、政策怎麼套用。','傳統的架構假設使用者和應用都在公司內部，所以把安全設備集中放在機房。當兩者都不在機房時，流量被迫繞一大圈回來接受檢查。更合理的做法是讓安全控制跟著使用者和應用移動。','SASE：安全控制跟著使用者和應用走，不用繞回機房。',['c',[['傳統架構','流量繞回總部檢查｜又慢又沒必要','w'],['SASE','在就近的節點檢查｜直接連到應用']]]],
['微分段',['微分段是把存取控制細到每一台主機或每一個應用。','推動時最大的困難，是不清楚應用之間實際的通訊關係。','貿然阻擋會中斷服務。要先觀察、建立相依圖，用只記錄不阻擋的模式驗證，再逐步收緊。'],'先收集三個月的流量資料，畫出各系統之間的相依關係；規則先以監看模式運作，確認不會擋到正常流量之後才啟用阻擋。','憑架構圖和文件直接寫規則並啟用。實際上系統之間有很多沒有被記錄的連線，一啟用就有服務中斷。','運作多年的環境裡，系統之間的連線關係沒有人完全清楚：有排程、有備份、有監控、有早已被遺忘的整合。唯一可靠的資訊來源是實際的流量。所以微分段專案大部分的工作不是技術，而是弄清楚現況。','微分段先觀察流量、畫相依圖、監看模式驗證，再收緊。',['f',['觀察實際流量','建立相依圖','只記錄不阻擋｜驗證','逐步啟用阻擋'],null,['','a','','']]],
['工控與物聯網',['有些設備無法安裝防護軟體，也很難更新，例如工業控制設備、醫療器材、物聯網裝置。','保護它們主要靠網路層的措施：隔離、限制存取、監控行為。','被動式的監控可以在不影響設備的情況下看出異常。'],'產線的控制設備放在獨立的網段，只有指定的工程站可以連線；另外用被動監聽的方式分析流量，發現有設備開始連到不該連的地方就告警。','用對待一般電腦的方式處理這類設備，例如主動掃描或安裝代理程式。這可能造成設備異常甚至停機。','這類設備的設計壽命長達十幾年，運算資源有限，而且穩定性的要求遠高於一般電腦，任何變動都要經過廠商驗證。既然不能改變設備本身，所有的控制就只能放在設備的外面。','改不了的設備：靠網路隔離、存取限制和被動監控。',['c',[['隔離','獨立的網段'],['存取限制','只有指定的主機｜可以連線'],['被動監控','不影響設備｜看出異常']]]],
['暴露面',['要掌握組織對外暴露了什麼，要持續從外部探查。','範圍包括自己的網域、位址和雲端上的資產。','沒有人記得的測試主機、舊的網域、雲端上忘記關閉的服務，最常成為破口。'],'定期從外部掃描公司所有的網域和位址。某次發現一台三年前專案留下的測試主機還在線上，而且用的是有漏洞的舊版軟體。','只依照內部的資產清單來評估風險。清單上沒有的東西，才是最危險的。','攻擊者不會看你的資產清單，他看到的是實際暴露在網際網路上的東西。內部的清單和外部的實際狀況之間幾乎總是有差距，尤其是雲端資源可以由任何部門自行建立。從外部看，才能看到和攻擊者相同的畫面。','從外面看自己：沒人記得的資產最常是破口。',['f',['從外部持續探查','找出所有｜對外的資產','比對內部清單','清單上沒有的｜優先處理'],null,['a','','','w']]],
['驗證',['買了資安設備，要定期驗證它實際上有沒有發揮作用。','方法是用模擬攻擊，確認偵測和阻擋的效果。','設定錯誤、規則過期、紀錄沒有送出，都是有設備卻沒有防護的常見原因。'],'定期執行一組模擬的攻擊動作，檢查端點防護有沒有攔下、SIEM 有沒有產生告警。某次發現一半的端點因為更新失敗，防護早就沒有在運作。','「設備裝了、燈號正常，就是有在保護」。設備在運作和設備在提供有效的防護是兩回事。','資安設備的防護效果取決於設定和持續的維護，而這些會隨著時間偏離：有人改了設定、授權過期了、新的主機沒有納入。這些問題都是無聲的，設備不會告訴你它現在其實沒在保護。只有實際測試才會發現。','設備有沒有用，要用模擬攻擊定期驗證。',['f',['執行模擬攻擊','有沒有被擋下？','有沒有告警？','沒有就找原因｜並修正'],null,['','a','a','']]],
['加密',['組織要盤點自己使用了哪些加密演算法、用在哪些地方。','這樣未來某個演算法被淘汰或被破解時，才知道要更換哪裡。','其中包括量子運算帶來的風險。需要保密很多年的資料，現在就要開始考慮。'],'盤點後列出：哪些系統用了哪種憑證、哪些連線用了哪個版本的加密協定、哪些資料需要保密超過十年。','「等到量子電腦真的出現再處理」。攻擊者可以現在先把加密的資料收集起來，等將來有能力時再解開。','更換加密演算法是很大的工程，因為它散布在各種系統、設備和程式裡，而且很多地方沒有人記得。過去幾次演算法的淘汰都花了很多年。先有一份清單，是將來能夠更換的前提。','先盤點用了哪些加密，將來要換才知道換哪裡。',['f',['盤點使用的｜加密演算法','記錄用在哪裡','找出需要｜長期保密的資料','規劃更換｜的順序'],null,['a','','','']]],
['韌性',['假設攻擊者一定會進來，網路安全的目標要跟著調整。','重點是：限制他能到達的範圍，並且盡快發現、盡快恢復。','預防仍然重要，但偵測、圍堵和復原的能力決定了損害的大小。'],'除了加強邊界，也投入資源做內部分段、偵測、備份和復原演練，目標是即使被入侵，也能在一天內發現、三天內恢復。','把所有資源都投入「不要被打進來」。一旦預防失效，沒有任何後續的能力，小事件就變成大災難。','沒有任何預防措施是完美的，資源充足的攻擊者總會找到一條路。所以要問的不只是「怎麼不被入侵」，還有「被入侵之後會怎樣」。同樣的入侵，在一個能快速發現和恢復的組織裡，造成的損害可以小很多。','假設會被入侵：限制範圍、快速發現、快速恢復。',['f',['預防','限制範圍','快速發現','快速恢復'],'預防會失效，後面三項決定損害大小',['','a','a','a']]]]};
LEARN.dataprot={0:[
['資料分級',['資料分級是把資料依敏感程度分成幾個等級，例如公開、內部、機密。','不同等級採取不同強度的保護。','這樣保護的資源才能用在最重要的資料上。'],'公司把資料分三級：公開的可以放官網；內部的只限員工；機密的（例如客戶個資）要加密、限制存取並記錄。','把所有資料都標成機密，結果規定嚴到沒有人做得到，大家乾脆都不遵守；或是完全不分，重要的資料和一般文件用一樣的方式處理。','保護措施都有成本，也會造成不便。沒有分級，就只能全部用最高標準或全部用最低標準，兩種都行不通。分級讓組織可以明確說出「哪些資料最重要」，並把嚴格的控制集中在那裡。','資料分級：等級不同，保護強度不同。',['c',[['公開','可以對外'],['內部','限員工使用'],['機密','加密、限制存取｜留下紀錄','a']]]],
['加密',['傳輸中的加密，是防止資料在傳送途中被攔截。','靜態的加密，是防止儲存媒體被拿走之後資料被讀取。','兩種都要做。'],'網站用 HTTPS 是傳輸中的加密；筆電的硬碟全碟加密是靜態的加密。筆電遺失時，撿到的人讀不出裡面的資料。','「我們網站有 HTTPS，資料有加密了」。那只保護傳輸的過程，資料到了伺服器上如果是明文存放，硬碟或備份被拿走就全部曝光。','資料有兩種狀態會面臨不同的威脅：在網路上移動時，可能被中間的人看到；存放在設備上時，設備可能遺失或被偷。兩種威脅需要不同的保護方式，做了一種並不會涵蓋另一種。','傳輸中的加密防攔截，靜態的加密防媒體被拿走。',['c',[['傳輸中','防傳送途中｜被攔截'],['靜態','防儲存媒體｜被拿走後讀取']],'兩種都要做']],
['個資原則',['最小化原則：只蒐集達成目的所必要的資料。','表單上的每一個欄位，都要能說明為什麼需要。','沒有蒐集的資料不會外洩。'],'辦活動的報名表只需要姓名和聯絡方式。原本還列了身分證字號和生日，檢討後發現根本用不到，就刪掉了。','「順便多收一點，以後說不定用得到」。多收的資料不會帶來好處，只會增加保管的責任和外洩時的損害。','保有的每一筆個資都是責任：要保護它、要回應當事人的請求、外洩時要通知和賠償。資料愈少，這些責任愈輕。在蒐集的時候就把關，是最便宜也最有效的保護。','只收必要的；沒收的資料不會外洩。',['f',['列出要收｜的欄位','每個都問：｜真的需要嗎','用不到的｜就不收','保管責任｜跟著變小'],null,['','a','','']]],
['遮罩',['資料遮罩是只顯示一部分，其餘用符號代替。','例如身分證字號只顯示前幾碼和後幾碼。','大部分的工作不需要看到完整的資料。'],'客服畫面上的身分證字號顯示為 A12*****89，足以向客戶核對身分，但客服人員看不到完整的號碼。','遮罩只做在畫面上，匯出的報表卻還是完整的資料。要確認所有輸出的管道都有一致的處理。','每天接觸資料的人很多，每多一個人看到完整的資料，就多一分外洩的可能，不論是有意還是無意。遮罩讓這些人仍然可以完成工作，但手上沒有完整的敏感資料。','遮罩：只顯示工作需要的那一部分。',['c',[['完整顯示','每個接觸的人｜都看得到全部','w'],['遮罩','只看到一部分｜工作照樣能做']]]],
['權限',['共用資料夾的權限，只給工作上需要的人。','依部門或專案設定群組，不要開放給所有人。','人員調動時要跟著調整。'],'人事資料夾只有人事部門的群組可以存取。有人調到其他部門時，當天就從群組移除。','為了方便，把資料夾設成「所有人都可以讀寫」。內部任何一個人都能拿走，勒索軟體也可以從任何一台中毒的電腦加密整個資料夾。','一個資料夾能被多少人存取，就等於它暴露在多少個帳號和電腦的風險之下。其中任何一個帳號被盜、任何一台電腦中毒，都會影響到這個資料夾。縮小範圍就是直接降低這個數字。','共用資料夾只給需要的人，不要全公司開放。',['c',[['所有人可讀寫','任何一台中毒｜整個資料夾遭殃','w'],['只給需要的群組','影響範圍有限']]]],
['銷毀',['印有個資的紙本文件不再需要時，要用碎紙機，或委託合格的銷毀服務。','不可以直接丟進回收桶。','資料保護不只在電腦裡，紙本和報廢的設備也是。'],'每個辦公室設置上鎖的待銷毀文件箱，定期由合格的廠商到場銷毀並出具證明。','把印錯的客戶名單拿來當回收紙，背面再利用。這些紙會被帶回家、被傳到別的部門、最後出現在不該出現的地方。','資料外洩只看結果，不看形式。紙本沒有存取控制，也不會留下任何紀錄，誰拿走了完全無從得知。報廢的電腦、影印機和隨身碟也一樣，裡面的資料不會因為設備不用了就消失。','紙本和報廢設備也要銷毀，不是丟掉就好。',['f',['不再需要的｜紙本個資','放入上鎖的｜待銷毀箱','碎紙或｜合格廠商銷毀','留下紀錄'],null,['','','a','']]],
['備份',['備份資料的保護等級，要和正式資料一樣。','因為裡面的內容是相同的。','加密、存取控制、存放地點的實體安全，都要比照辦理。'],'正式的資料庫有嚴格的存取控制和加密。備份檔同樣加密，存放備份的位置只有少數人有權限。','正式資料庫保護得很好，備份檔卻放在一個很多人都能存取的共用資料夾，而且沒有加密。','攻擊者要的是資料，不在乎是從哪裡拿到的。備份是一份完整的複本，拿到它和拿到正式資料的結果完全相同。而備份通常會被複製到好幾個地方、保存很久，如果保護比較鬆，反而成為最容易下手的目標。','備份的內容和正式資料一樣，保護也要一樣。',['c',[['正式資料','加密｜存取控制'],['備份資料','同樣要加密｜同樣要控制存取','a']]]],
['實體安全',['離開座位時要鎖定螢幕。','桌上不留機密文件，下班前收好。','這是防止路過的人看到或拿走資料。'],'去開會之前按下鎖定螢幕的快速鍵，把桌上的客戶資料收進上鎖的抽屜。','「我只離開一下」「辦公室裡都是同事」。訪客、清潔人員、廠商都會經過，而且不是每一位同事都應該看到你手上的資料。','很多資料外洩不需要任何技術，只需要有人經過一台沒有鎖定的電腦或一份攤在桌上的文件。這類行為不會觸發任何告警，也不會留下紀錄。','離開座位鎖螢幕，桌上不留機密文件。',['c',[['離開座位','鎖定螢幕'],['桌面','不留機密文件'],['下班前','文件收進｜上鎖的地方']]]]],
1:[
['外洩防護',['資料外洩防護（DLP）會偵測並阻擋敏感資料從各種管道流出。','管道包括：電子郵件、網頁上傳、隨身碟、列印。','它是依內容的特徵來辨識，所以要先定義清楚要保護的是什麼。'],'員工要把含有大量身分證字號的檔案寄到私人信箱，DLP 辨識出內容後擋下這封信並通知資安單位。','買了 DLP 就以為資料不會外洩。沒有先做資料分級和盤點，規則訂不出來；規則太寬則每天產生上千個誤報。','DLP 的運作方式是檢查經過它的內容符不符合規則。它不知道什麼對你的組織是敏感的，這要由你告訴它。所以它的效果取決於你對自己的資料有多了解。','DLP 依內容擋敏感資料外流；要先知道要保護什麼。',['f',['定義敏感資料','設定規則','檢查郵件、上傳｜隨身碟、列印','符合就阻擋｜並通知'],null,['a','','','']]],
['金鑰管理',['加密的安全性取決於金鑰。','金鑰外洩，加密等於沒有做；金鑰遺失，資料永遠打不開。','金鑰要和資料分開存放、限制存取、定期輪替，並且要有備份。'],'資料庫的加密金鑰存放在專用的金鑰管理系統，和資料庫在不同的主機，只有兩個人有權限，並有離線的備份。','把加密金鑰和加密的資料放在同一台伺服器上。攻擊者入侵這台伺服器，資料和金鑰一起拿走。','加密是把「保護資料」的問題轉換成「保護金鑰」的問題。金鑰很小，比較容易嚴格保護，但前提是真的有保護它。金鑰管理有兩個方向相反的風險要同時處理：不能被不該拿的人拿到，也不能讓該用的人弄丟。','金鑰和資料分開放、限制存取、要輪替、要備份。',['c',[['金鑰外洩','等於沒加密','w'],['金鑰遺失','資料永遠打不開','w'],['做法','分開存放｜限制存取｜輪替、備份']]]],
['去識別化',['假名化是把可以直接識別個人的欄位換成代碼，但保留對照表，需要時可以對應回本人。','匿名化是處理到無法再識別出個人。','假名化的資料只要對照表還在，通常仍然被視為個資，保護不能放鬆。'],'研究用的資料把姓名換成編號，對照表由另一個單位保管。這是假名化，資料仍然要依個資的標準保護。','「把姓名和身分證字號拿掉就是匿名了」。剩下的出生日期、郵遞區號、性別組合起來，常常就足以認出特定的人。','能不能識別出個人，不只看單一欄位，還要看欄位的組合以及能不能和其他資料比對。要做到真正無法識別其實很難，所以大部分所謂的「去識別化」資料實際上是假名化，還是要小心保護。','假名化還能對回本人，仍是個資；匿名化才是認不出來。',['c',[['假名化','換成代碼｜對照表另外保管｜仍然是個資'],['匿名化','無法再識別個人']]]],
['保存期限',['個資超過保存期限，或蒐集的特定目的已經消失，就應該刪除或銷毀。','並留下處理的紀錄。','這是個人資料保護法的要求（第 11 條）。'],'活動結束滿一年後，依規定把報名資料刪除，並在紀錄表上註明刪除的日期、範圍和執行的人。','「留著也沒壞處」。資料留得愈久，累積得愈多，外洩時的損害和責任愈大。','個資是為了特定目的才能蒐集和使用的，目的不存在了，繼續保有就沒有正當性。從風險的角度看也是一樣：已經刪除的資料不可能外洩，也不需要再花成本保護。','目的消失或期限到了就刪除，並留下紀錄。',['f',['保存期限屆滿｜或目的消失','刪除或銷毀','記錄日期｜範圍、執行人'],null,['','a','']]],
['存取紀錄',['對敏感資料的存取要留下紀錄：誰、什麼時候、看了或改了什麼。','用途是事後可以追查，也可以發現異常的大量存取。','沒有紀錄，發生外洩時連範圍都無法確認。'],'系統記錄每一次查詢客戶資料的帳號和時間。某位員工一天內查詢了三千筆和他業務無關的資料，被異常偵測標示出來。','只記錄「登入」而不記錄「查了什麼」。發生外洩時只知道誰登入過，不知道哪些人的資料被看過，也就無法通知當事人。','外洩事件發生後，第一個要回答的問題是「哪些人的哪些資料受到影響」。這個問題只有存取紀錄能回答。答不出來的話，只能假設全部的資料都受影響，通知和處理的範圍就會大很多。','敏感資料的存取要記錄：誰、何時、看了什麼。',['c',[['誰','哪個帳號'],['何時','時間'],['做了什麼','查詢、修改｜匯出了哪些資料']]]],
['資料盤點',['個資盤點是找出組織裡有哪些個資、存放在哪裡、誰在使用、保存多久。','這是所有保護工作的前提。','盤點常常會發現很多沒有人知道的副本。'],'盤點後發現，除了正式的系統，客戶資料還存在於：測試環境、幾位同仁電腦裡的匯出檔、一台已經不用的舊伺服器。','只盤點正式的系統。真正的風險常常在那些沒有人管理的副本：測試資料、個人電腦上的試算表、郵件的附件。','保護措施是針對特定的資料和位置設置的。不在清單上的資料不會被加密、不會被納入存取控制、不會在期限到了之後被刪除。這些沒有人知道的資料，就是保護的漏洞。','先盤點：有哪些個資、在哪裡、誰在用、留多久。',['f',['有哪些個資','存放在哪裡','誰在使用','保存多久'],'也要找出測試環境、個人電腦、舊系統裡的副本']],
['存取控制',['知悉必要原則：只能接觸自己工作需要的資料。','即使職級相同，或職位比較高，也是一樣。','存取權限是依工作內容決定的，不是依身分地位。'],'兩位同職級的業務人員，各自只能看到自己負責的客戶資料。部門主管可以看到部門的統計數字，但不一定需要看到每一位客戶的完整個資。','「他是主管，當然可以看全部」。職位高代表責任大，不代表工作上需要接觸所有的資料。','每多一個人能接觸到資料，就多一個可能外洩的點。高階主管的帳號還是攻擊者特別想取得的目標。把權限和實際的工作需要綁在一起，可以讓這個風險降到最低，而且不影響任何人完成工作。','權限看工作需要，不看職級。',['c',[['依工作需要','只接觸自己｜業務相關的資料','a'],['依職級','職位高｜不代表需要看全部','w']]]],
['事件處理',['發現資料可能外洩，第一時間要依程序通報。','同時保留證據、確認範圍。','通報有時限，不要自己悶著調查。'],'發現一份客戶名單被寄到外部的信箱。立刻通報資安窗口，保留那封信和相關的紀錄，不自行刪除或聯絡收件人。','想先自己查清楚再報告。調查的過程可能破壞證據，而且法定的通報時限是從知悉的時候起算的。','資料外洩的處理牽涉到法律上的義務，例如通知當事人，這些義務有時間的限制。發現的人通常沒有足夠的資訊判斷嚴重性，也沒有權限調查。及早通報讓有權責的人可以啟動完整的處理。','疑似外洩：先通報、保留證據、確認範圍。',['f',['發現｜可能外洩','依程序通報','保留證據','確認範圍'],null,['w','a','','']]]],
2:[
['分類',['自動化的資料分類工具，是依格式、關鍵字和內容特徵來辨識敏感資料。','例如身分證字號的格式、信用卡號的檢查碼。','會有誤判，所以需要調校。'],'工具掃描檔案伺服器，找出含有十個以上身分證字號格式的檔案，自動標記為機密。','完全相信工具的結果。一串剛好符合格式的產品編號會被誤判為身分證字號；而用自由文字描述的敏感內容，工具可能認不出來。','檔案的數量太多，不可能靠人工逐一分類。工具的做法是尋找可以用規則描述的特徵，所以對格式固定的資料很有效，對格式不固定的就比較弱。它適合當成第一道篩選，再由人處理不確定的部分。','自動分類靠格式和特徵比對，會誤判，要調校。',['f',['掃描檔案','比對格式｜關鍵字、特徵','自動標記','人工檢視｜並調校'],null,['','a','','']]],
['加密',['整個資料庫的加密，防的是儲存媒體或備份檔被拿走。','欄位層級的加密，是針對特定的敏感欄位另外加密。','這樣即使是有資料庫存取權限的人，沒有金鑰也看不到那個欄位的內容。'],'資料庫已啟用整庫加密。身分證字號這個欄位另外做欄位層級加密，連資料庫管理員直接查詢也只看到密文。','「資料庫有加密了，所以管理員也看不到」。整庫加密對通過資料庫正常登入的人是透明的，他們看到的是明文。','兩種加密防護的對象不同。整庫加密防的是繞過資料庫、直接拿檔案的人；欄位加密防的是通過資料庫、但不應該看到這個欄位的人。特別敏感的資料需要兩種都做。','整庫加密防檔案被偷；欄位加密連有資料庫權限的人也看不到。',['c',[['整庫加密','防媒體、備份外流｜登入者看到明文'],['欄位層級加密','沒有金鑰｜登入者也看不到','a']]]],
['權杖化',['權杖化是用一個沒有意義的替代值（權杖）來取代敏感資料。','權杖和真實資料的對應關係，另外保管在受嚴格保護的地方。','系統之間流通的是權杖，不是真實的資料。'],'訂單系統裡存的不是信用卡號，而是一個權杖。只有付款系統可以拿權杖去換回真正的卡號。訂單系統被入侵，拿到的權杖沒有任何用處。','把權杖化和加密混為一談。加密的資料只要有金鑰就能算回原文；權杖和原文之間沒有數學上的關係，只能去查對應表。','很多系統只是需要一個能代表某筆資料的識別值，並不需要資料本身。用權杖取代之後，這些系統就不再持有敏感資料，需要嚴格保護的範圍就縮小到保管對應表的那一個地方。','權杖化：用無意義的替代值流通，真資料集中保管。',['f',['真實的卡號','換成權杖','各系統只存｜權杖','只有指定系統｜能換回真資料'],null,['w','a','','']]],
['當事人權利',['當事人可以依法請求查詢、更正或刪除他的個資。','組織要能回應，前提是知道這個人的資料存放在哪些系統。','備份和日誌裡的資料也要考慮怎麼處理。'],'收到刪除個資的請求。依資料盤點的結果，知道這位客戶的資料在三個系統裡，逐一處理並記錄，備份則依既定的輪替週期到期覆蓋。','等收到請求才開始找資料在哪裡。沒有事先的盤點和對應，光是找齊就要花很多時間，而且很可能有遺漏。','當事人的請求有回覆的期限，而一個人的資料通常分散在很多地方。要在期限內完整地回應，必須事先就建立「資料在哪裡」的對應。這也是為什麼資料盤點是所有個資工作的基礎。','回應當事人請求的前提：知道他的資料在哪些系統。',['f',['收到請求','查盤點清冊：｜資料在哪些系統','逐一處理','記錄並回覆'],null,['','a','','']]],
['影響評估',['會大量處理個資的新系統，上線前要做個資或隱私衝擊評估。','評估的內容是：蒐集了什麼、怎麼使用、有什麼風險、要採取什麼保護措施。','在設計階段發現問題，比上線之後補救便宜得多。'],'新的會員系統在設計階段做評估，發現原本規劃蒐集的生日欄位其實沒有用途，而且存取紀錄的設計不足，兩項都在開發前就修正了。','系統都開發完成、快要上線了才做評估。這時候發現的問題，不是花大錢修改，就是帶著風險上線。','系統怎麼處理個資，大部分在設計時就決定了：蒐集哪些欄位、存在哪裡、誰可以存取。這些決定在設計階段修改幾乎沒有成本，開發完成之後修改則要重做很多工作。','大量處理個資的系統，上線前先做衝擊評估。',['f',['設計階段','做衝擊評估','辨識風險','決定保護措施｜再開發'],null,['','a','','']]],
['設計原則',['隱私設計是從設計的一開始，就把隱私保護做進系統裡。','預設值要採用最保護隱私的設定。','使用者不需要做任何事，就已經受到保護。'],'新的服務預設不公開使用者的個人資料，定位功能預設關閉，要使用者自己選擇才會開啟。','把保護隱私的選項都做了，但預設全部關閉，要使用者自己去設定頁面一個一個打開。大部分的人不會去改預設值。','絕大多數使用者會一直使用預設的設定。所以預設值實際上就決定了大部分人的隱私狀態。如果保護是要使用者主動開啟的，那它對多數人來說等於不存在。','隱私設計：一開始就做進去，預設就是最保護的。',['c',[['預設最保護','不蒐集、不公開｜使用者不用做任何事','a'],['預設最開放','要使用者自己關｜多數人不會去改','w']]]],
['雲端',['資料放在雲端時，可以選擇由客戶自己管理加密金鑰。','意義是金鑰由自己掌控，可以撤銷雲端業者對資料的存取。','需不需要這樣做，取決於資料的敏感程度和法規的要求。'],'機敏的資料庫使用自己管理的金鑰。合約終止時，把金鑰撤銷，留在業者那邊的資料就無法再被讀取。','「自己管金鑰比較安全」所以全部都改用。自己管理也代表要自己負責金鑰的保護、備份和輪替，弄丟了資料就永遠打不開。','使用業者管理的金鑰時，業者在技術上有能力讀取資料。自己管理金鑰是把這個能力拿回自己手上。這是在控制權和管理責任之間的取捨，並不是對所有資料都值得。','自管金鑰：掌控權在自己，責任也在自己。',['c',[['業者管理金鑰','方便｜業者技術上讀得到'],['客戶自管金鑰','可以撤銷業者的存取｜要自己負責保管']]]],
['監控',['內部人員每一次的存取，單獨看都是合法的。','要發現不當的存取，要和他平常的存取模式比較。','找出異常的大量存取，或是超出他業務範圍的存取。'],'一位員工平常每天查詢約二十筆客戶資料，某天查詢了兩千筆，而且包含不是他負責的區域。系統把這個偏離標示出來。','設定一個固定的門檻，例如「一天超過五百筆就告警」。對某些職務這是正常的工作量，對另一些職務則是五十筆就很異常。','內部人員本來就有權限，所以無法用「有沒有權限」來判斷。能區分正常和異常的只有行為的模式：這個人平常做什麼、同樣職務的人平常做什麼。偏離這個模式的行為才值得檢視。','內部不當存取：和他平常的模式比，找出異常。',['f',['記錄每個人｜平常的存取量','建立基準','出現大量或｜跨範圍的存取','標示並檢視'],null,['','a','w','']]]],
3:[
['治理',['資料保護要做得好，每一類資料都要有明確的擁有者。','資料擁有者負責決定這類資料的用途、保護等級、誰可以使用、保存多久。','擁有者通常是業務單位，不是資訊單位。'],'客戶資料的擁有者是業務部門的主管。有人申請使用客戶資料做分析，由他決定是否核准；資訊單位依他的決定設定權限。','「資料在系統裡，所以是資訊單位負責」。資訊單位不知道資料在業務上的用途，無法判斷誰該使用、該保留多久。','資料保護有很多決定是業務上的：這個用途合不合理、這個人需不需要、可以保留多久。這些要由了解業務、也對業務結果負責的人來決定。資訊單位能提供的是執行這些決定的工具和機制。','每類資料要有擁有者：業務單位決定，資訊單位執行。',['c',[['資料擁有者｜（業務單位）','決定用途、等級｜誰能用、留多久','a'],['資訊單位','提供工具｜執行這些決定']]]],
['跨境',['把個資傳輸到境外處理，要考量幾個面向。','接收地的法規對個資的保護程度；主管機關有沒有限制；合約上有什麼保障。','個資法授權主管機關在特定情形下限制國際傳輸，各產業也可能有另外的規定。'],'評估使用一項境外的雲端服務。先確認資料會存放在哪些國家、主管機關對所屬產業有沒有限制，再在合約裡約定保護的義務和稽核的權利。','只看服務的功能和價格，沒有確認資料實際上會被存放和處理的地點。','資料一旦離開國境，就會受到當地法律的管轄，當事人依本國法律享有的保護可能無法落實。所以要事先確認對方的保護程度，並用合約補足不夠的部分。不同的產業還可能有主管機關另外規定的限制。','個資出境要看：當地法規、主管機關限制、合約保障。',['c',[['當地法規','保護程度夠不夠'],['主管機關','有沒有限制'],['合約','保護義務｜稽核權利']]]],
['隱私強化技術',['把姓名拿掉不代表資料就匿名了。','少數幾個欄位的組合，就足以認出特定的人。','差分隱私這類技術的目標，是在提供統計結果的同時，讓人無法從結果推回個別的人。'],'一份去掉姓名的資料裡有出生日期、性別和郵遞區號。和另一份公開的名冊比對之後，大部分的人都可以被重新識別出來。','「去識別化的資料可以放心公開」。公開之後就無法收回，而未來可能出現新的資料可以拿來比對。','重新識別的方法是把這份資料和其他來源的資料連結起來。只要資料裡還保留著夠細的資訊，這種連結就有可能。差分隱私的做法是在結果裡加入經過計算的雜訊，使得任何單一個人有沒有在資料裡，對結果幾乎沒有影響。','拿掉姓名不等於匿名；欄位組合起來就能認出人。',['f',['去掉姓名｜的資料','還有生日、性別｜郵遞區號','和其他資料比對','重新識別出｜個人'],null,['','','w','w']]],
['最小化',['「資料愈多愈好，以後可能用得到」在資料保護上有兩個問題。','每多保留一份資料，就多一份外洩的風險和法遵的責任。','沒有明確目的的蒐集和保存，本身就可能不合法。'],'系統保留了十五年來所有已經終止往來的客戶資料。外洩發生時，受影響的人數是現有客戶的五倍，其中大部分早就沒有保留的必要。','把儲存成本很低當成保留所有資料的理由。真正的成本不在儲存，而在保護的責任和出事時的損害。','資料的價值是不確定的，而且隨時間下降；資料帶來的風險是確定的，而且隨數量上升。個資法也要求蒐集要有特定的目的。保留沒有用途的資料，等於承擔了風險卻沒有得到任何好處。','資料不是愈多愈好：多留一份，就多一份風險和責任。',['c',[['多保留','外洩風險增加｜法遵責任增加','w'],['有目的才留','到期就刪｜風險跟著變小']]]],
['AI',['使用包含個資的資料來訓練或查詢 AI 模型，有兩件事要注意。','資料可能被模型記住，並在之後的回答中洩漏出來。','使用的方式要符合當初蒐集個資的目的。'],'想用客服對話紀錄訓練模型。先確認這個用途有沒有在當初告知客戶的範圍內，並在訓練前把姓名、電話、身分證字號等內容移除。','把含有客戶個資的資料直接貼到外部的 AI 服務裡詢問。這些資料等於傳給了第三方，而且可能被用於對方的模型訓練。','模型是從資料中學習的，有可能把訓練資料裡的具體內容記下來，之後被別人用特定的問法問出來。另外，個資的使用受到蒐集目的的限制，用於訓練模型是不是在原本的目的範圍內，需要事先確認。','個資進 AI：可能被記住並洩漏；用途要符合原本的目的。',['f',['確認用途｜符合原目的','去識別化','控制誰能｜存取模型','檢查輸出｜有沒有洩漏'],null,['a','','','']]],
['事件',['確認發生大量個資外洩時，決策上最關鍵的是依法定時限完成通報和通知。','通報主管機關、通知當事人。','並由高層主導對外的溝通。延遲和隱瞞造成的傷害，常常比事件本身更大。'],'確認外洩後，由總經理召集危機小組。法務確認通報的時限和對象，在期限內完成通報，並以清楚的說明通知受影響的客戶該怎麼自保。','希望事情不要被發現，所以不通報、不通知。之後被媒體或當事人揭露，除了事件本身，還多了隱匿的責任和信任的全面崩壞。','通知當事人的目的是讓他們能保護自己，例如更改密碼、留意詐騙。每延遲一天，他們就多暴露在風險中一天。組織在事件之後是否被信任，很大程度取決於它是不是主動、誠實地面對。','大量外洩：依時限通報主管機關、通知當事人，高層主導。',['c',[['通報','主管機關｜依法定時限'],['通知','當事人｜告知如何自保'],['溝通','由高層主導'],['不要','延遲、隱瞞','w']]]],
['第三方',['把個資委託給廠商處理，要用合約明訂處理的範圍和安全上的要求。','並且持續監督廠商實際的執行情形。','依個資法，受託者的行為視同委託機關，出事時責任仍然在委託的一方。'],'委外合約寫明：只能為指定的目的處理資料、要採取哪些安全措施、發生事故幾小時內要通知、契約終止時要刪除資料，並保留稽核的權利。','簽了合約就不再過問。合約寫得再完整，沒有實際去確認廠商有沒有照做，等於沒有監督。','當事人是把資料交給委託的組織，不是交給廠商。法律把廠商當成委託者的延伸來看待，所以委託者要對廠商的行為負責。這個責任要靠挑選、約定和監督這三件事來落實。','個資委外：合約寫明範圍和要求，並持續監督；責任仍在自己。',['f',['挑選適當｜的廠商','合約明訂｜範圍和安全要求','持續監督','出事責任｜仍在委託方'],null,['','','a','w']]],
['度量',['要讓管理階層了解資料保護的現況，要提供看得見風險的資訊。','例如：敏感資料分布在哪些地方、權限過寬的比例、沒有加密的數量。','有了這些，才有依據決定資源要投入在哪裡。'],'報告呈現：全公司共有多少個含個資的資料夾、其中百分之多少開放給所有人存取、多少台存有個資的筆電還沒有加密，以及和上一季相比的變化。','報告只寫「我們導入了某某系統」「完成了某某訓練」。這些是做了什麼，不是現況如何，管理階層看不出風險在哪裡。','管理階層需要決定優先順序和資源的分配，這需要知道目前的風險在哪裡、有多大。活動的數量無法回答這個問題。能反映實際狀態、而且可以追蹤變化的指標，才能支持決策。','給管理階層看：敏感資料在哪、權限多寬、多少沒加密。',['c',[['分布','敏感資料｜在哪些地方'],['權限','過寬的比例'],['加密','未加密的數量']],'要能和上一期比較，看出變化']]]};
LEARN.aware={0:[
['釣魚',['釣魚信最常見的共同特徵是製造急迫感。','它催你馬上點連結或開附件，讓你來不及思考。','常見的說法是「帳號即將停用」「包裹無法配送」「有一筆款項待確認」。'],'收到「您的信箱容量已滿，請於今日內點此驗證，否則將停用」。這種催促的語氣本身就是警訊。','「我會看寄件者和有沒有錯字」。現在的釣魚信可以做得沒有任何破綻，唯一不變的是它一定要你趕快做某件事。','攻擊者需要你在還沒起疑之前就完成動作。人在覺得有時間壓力時，會跳過平常會做的檢查。所以不管信的內容怎麼變，「現在不處理就來不及」這個手法幾乎都會出現。','愈催你快，愈要慢下來。',['f',['收到催促的信','停一下','不點信裡的連結','自己從官方管道｜確認'],null,['w','a','','']]],
['電話詐騙',['有人來電自稱資訊人員並向你要驗證碼或密碼，不要提供。','掛斷之後，用公司公布的電話自己打回去確認。','正當的資訊人員不會向你要密碼或驗證碼。'],'來電說「我們正在處理你的帳號問題，請把手機收到的六位數驗證碼唸給我」。回答「我等一下自己打資訊室分機確認」，然後掛斷。','「他知道我的名字、分機和員工編號，應該是真的」。這些資訊都可以事先查到；來電顯示的號碼也可以偽造。','驗證碼是用來證明「正在登入的人是你」。有人向你要驗證碼，表示他正在用你的帳號登入，而且只差這一步。真正的資訊人員有管理的權限，處理問題不需要你的密碼或驗證碼。','驗證碼和密碼不給任何人；掛斷後自己打回去確認。',['f',['來電要｜驗證碼或密碼','不提供','掛斷','用公布的電話｜自己打回去'],null,['w','a','','']]],
['實體安全',['刷卡進門時有不認識的人想跟著進來，這叫尾隨。','應該請他自己刷卡，或帶他到櫃台辦理訪客登記。','門禁系統再好，有人幫忙開門就沒有用。'],'一位拿著紙箱的人在你刷卡時說「麻煩幫我扶一下門」。回答：「不好意思，訪客要先到櫃台登記，我帶你過去。」','「不幫忙扶門很沒禮貌」。攻擊者就是利用大家不想失禮的心理，雙手拿滿東西是很常用的手法。','進到辦公室裡面的人，可以接觸到沒有鎖定的電腦、桌上的文件、內部的網路孔。門禁的作用是確認每一個進來的人的身分，替別人開門等於用你的身分幫他通過了檢查。','不幫陌生人開門；請他刷卡或帶去櫃台登記。',['c',[['幫忙扶門','門禁等於沒有','w'],['請他自己刷卡','或帶去櫃台登記']]]],
['密碼',['不要把自己的帳號借給別人使用，包括同事。','同事的帳號有問題，請他聯絡資訊單位處理。','用你的帳號做的每一件事，紀錄上都是你做的。'],'同事的帳號被鎖了，想借你的帳號查一筆資料。回答：「我幫你打電話給資訊室解鎖，很快就好。」','「只是幫個忙，而且是認識的同事」。如果他用你的帳號做了不該做的事，或是不小心出了錯，紀錄上顯示的人是你。','帳號的作用是把行為對應到人，所有的權限控管和稽核都建立在「一個帳號就是一個人」這個前提上。共用帳號會讓這個對應失效，出事時無法釐清責任，你也無法證明那不是你做的。','帳號不外借；紀錄上寫的是你的名字。',['c',[['借帳號給同事','他做的事｜都算在你名下','w'],['請他找資訊單位','各自用自己的帳號']]]],
['附件',['收到陌生人寄來的壓縮檔，或是要求「啟用巨集」「啟用內容」的文件，不要開啟。','回報給資訊單位。','這是惡意程式最常見的進入方式。'],'一封標題是「報價單」的信附了一個文件，打開後畫面要求「請點選啟用內容才能正常顯示」。關閉文件並回報。','「我只是打開看一下，又沒有安裝什麼」。按下啟用巨集的那一刻，文件裡的程式就已經執行了。','文件本身通常不能執行程式，所以攻擊者需要你幫忙做最後一步：啟用巨集，或是解壓縮後點兩下裡面的檔案。文件裡那些「無法顯示，請啟用內容」的說明，就是設計來騙你做這一步的。','不明的壓縮檔和「請啟用巨集」的文件：不開、回報。',['f',['收到不明附件','要求啟用巨集｜或解壓縮執行','不要照做','回報資訊單位'],null,['','w','a','']]],
['社群',['在社群網站公開職稱、負責的系統、主管的姓名，會被攻擊者拿來量身打造詐騙。','針對性的釣魚信會提到你真的認識的人和真的在做的事。','所以很難分辨。'],'攻擊者從公開的個人檔案知道某人負責薪資系統、主管是誰，就冒充那位主管寄信：「薪資系統的廠商要更新，請用這個連結登入確認。」','「這些又不是機密」。單獨看都不是機密，但組合起來，足以讓一封假信看起來完全合理。','一般的釣魚信容易被識破，是因為內容和你無關。攻擊者只要知道你的工作內容和往來的對象，就能寫出和真實工作信件沒有差別的信。這些資訊最容易的來源就是當事人自己公開的內容。','公開的工作細節，會變成詐騙信的素材。',['f',['公開職稱、系統｜主管姓名','攻擊者蒐集','寫出很合理｜的假信','很難分辨'],null,['','','w','w']]],
['回報',['不小心點了可疑連結或輸入了密碼，要立刻回報並更改密碼。','愈早回報，愈能減少損害。','隱瞞只會讓攻擊者多出好幾天的時間。'],'輸入密碼後才發現網址不對。馬上打電話給資訊單位，並立刻改掉密碼；其他地方用同一組密碼的也一起改。','怕被罵所以不說，想說「應該沒事」。攻擊者拿到密碼後通常很快就會使用，每拖一小時他就多一小時。','輸入密碼到攻擊者實際使用之間有一段時間。在這段時間內改掉密碼，他拿到的就沒有用了。資訊單位知道之後，還可以檢查帳號有沒有被登入過，並提醒其他收到同一封信的人。','點了、輸入了：立刻回報、立刻改密碼。',['f',['點了連結｜或輸入了密碼','立刻回報','馬上改密碼','檢查帳號｜有無異常登入'],null,['w','a','a','']]],
['可攜式媒體',['來源不明的儲存裝置，不要直接插到公司的電腦上。','包括贈品的隨身碟、撿到的隨身碟、別人借你的充電線。','有需要使用時，交給資訊單位在隔離的環境檢查。'],'展覽會場拿到廠商贈送的隨身碟。不直接使用，需要裡面的資料時請資訊單位先檢查。','「是合作廠商送的，應該沒問題」。廠商本身可能沒有惡意，但隨身碟在生產或經手的過程中可能已經被動過手腳。','儲存裝置插上電腦的那一刻，電腦就會開始和它互動，有些惡意的裝置還會偽裝成鍵盤自動輸入指令。這個管道直接繞過了所有的網路防護。','來路不明的隨身碟不插公司電腦。',['c',[['贈品、撿到的｜別人借的','不直接插公司電腦','w'],['真的需要','交給資訊單位｜在隔離環境檢查']]]]],
1:[
['演練',['社交工程演練的目的，是讓同仁練習辨識和回報。','並且找出組織需要加強的地方。','演練不是考試，也不應該變成懲罰。'],'演練結束後，資安單位公布整體的點擊率和回報率，說明這封信的可疑之處，並針對回報率低的單位安排加強訓練。','把點擊的人列出名單公布，或納入考績。大家學到的是「點了不要承認」，而不是怎麼辨識。','演練的價值在於讓同仁在安全的情況下，實際體驗一次遇到釣魚信的過程，並養成回報的習慣。如果點擊會帶來懲罰，同仁在真的遇到釣魚信並且點了的時候，就會選擇隱瞞，這正好和演練想達到的效果相反。','演練是練習辨識和回報，不是抓人處罰。',['c',[['目的','練習辨識和回報｜找出要加強的地方','a'],['不要','公布名單｜懲處個人','w']]]],
['攻擊手法',['魚叉式釣魚是針對特定的對象，事先蒐集資料之後量身製作的。','內容會提到你的專案、你的主管、你正在往來的廠商。','看起來完全合理，所以成功率比一般的釣魚信高很多。'],'信裡寫：「王經理您好，附上上週會議提到的合約修訂版，請在週五前確認。」會議、合約、時間都是真的，只有附件是惡意的。','「釣魚信都是那種一看就知道的中獎通知」。針對性的攻擊完全不同，它讀起來就是一封普通的工作信。','一般的釣魚信是大量發送、碰運氣，內容必須通用，所以容易識破。魚叉式釣魚只鎖定少數人，攻擊者願意花時間研究目標。當一封信的所有細節都對得上，人沒有理由起疑。','魚叉式釣魚：針對你量身製作，看起來完全合理。',['c',[['一般釣魚','大量發送｜內容通用'],['魚叉式釣魚','鎖定特定對象｜提到真實的人和事','w']]]],
['詐騙',['商務電子郵件詐騙是冒充主管或往來廠商，要求匯款或變更收款帳戶。','特徵是緊急、要求保密、帳戶和以往不同。','正確的處理是用另一個已知的管道（例如打電話）向本人確認。'],'財務收到「總經理」的信，要求今天之內匯款到一個新的帳戶，並說明這是機密的併購案。財務人員打總經理的手機確認，結果他完全不知情。','直接回信問「這是真的嗎」。如果信箱已經被冒用或被入侵，回信的對象就是攻擊者。','這種詐騙不需要任何惡意程式，只需要一封看起來合理的信。它利用的是對主管的服從和時間壓力。回信確認之所以無效，是因為確認的管道和被懷疑的管道是同一個。必須換一個攻擊者無法控制的管道。','匯款或改帳戶的指示：用另一個管道向本人確認。',['f',['來信要求｜緊急匯款','要求保密｜帳戶是新的','打電話向｜本人確認','不要用回信確認'],null,['w','w','a','']]],
['新型手法',['現在聲音可以用 AI 合成，所以不能只憑聲音判斷來電的人是誰。','遇到重要的要求，要回撥確認，或用只有雙方知道的方式驗證。','依靠流程，比依靠自己的辨識能力可靠。'],'接到聲音和主管一模一樣的電話，要你立刻開通某個權限。回答「我等一下回撥給您」，然後撥打通訊錄上主管的號碼。','「我跟他共事這麼多年，他的聲音我不會認錯」。合成的聲音只需要一小段公開的錄音就能做出來，而且愈來愈難分辨。','過去聲音是很可靠的身分證明，因為很難模仿。這個前提已經不成立了。當任何一種「看起來、聽起來像」都可以偽造時，唯一可靠的驗證就是由你主動發起、透過你已經知道的管道去聯絡對方。','聲音可以合成；重要的要求要回撥確認。',['f',['接到像主管｜的來電','重要的要求','掛斷','用已知的號碼｜回撥確認'],null,['','w','','a']]],
['教材設計',['資安教育訓練的內容，要依不同職務實際會遇到的情境來設計。','財務人員會遇到匯款詐騙，客服人員會遇到套資料的電話。','和自己的工作有關的內容才記得住。'],'給財務部門的訓練用「廠商來信變更匯款帳戶」當案例；給櫃台人員的訓練用「自稱維修人員要求進入機房」當案例。','全公司看同一支通用的影片，然後做同一份測驗。內容和大部分人的日常工作沒有關係，看完就忘了。','人會記住和自己有關、將來用得上的資訊。一般性的原則很難轉換成具體情境下的行動。直接用同仁工作中真的會遇到的情境來教，他在遇到的時候才認得出來。','訓練內容要對應職務：財務教匯款詐騙，客服教套話電話。',['c',[['財務','匯款詐騙'],['客服','套資料的電話'],['櫃台','冒充進入的訪客'],['管理者','權限相關的要求']]]],
['成效',['評估資安意識的成效，不能只看點擊率。','更重要的是回報率，以及從收到信到有人回報花了多久。','總會有人點，有沒有人很快回報，決定了組織能不能及時反應。'],'演練的結果：點擊率 8%，回報率 35%，第一個人在收到信後 4 分鐘回報。之後追蹤的重點是讓回報率上升、回報的時間縮短。','把目標訂成「點擊率降到零」。這個目標做不到，而且只要有一個人點，攻擊者就進來了。','點擊率會隨演練信件的難易程度大幅變動，很難比較。而在真實的攻擊中，組織能不能及時處理，取決於有沒有人告訴資安單位。一個人在幾分鐘內回報，資安單位就可以在其他人點擊之前把信移除。','除了點擊率，更要看回報率和回報速度。',['c',[['點擊率','總會有人點｜受信件難度影響','off'],['回報率','多少人回報','a'],['回報速度','多快有人回報','a']]]],
['到職訓練',['新進人員的資安訓練，要在到職後盡快進行。','最好在他取得系統權限的前後。','新人不熟悉環境和同事，是冒充和詐騙最容易得手的對象。'],'新人到職第一天的行程裡就排入三十分鐘的資安說明：怎麼辨識可疑的信、遇到狀況找誰、公司不會用什麼方式向你要密碼。','等到每年一次的全員訓練才一起上課。新人可能已經工作了好幾個月，這段時間完全沒有接受過任何說明。','新人不知道哪些要求是正常的、誰是誰、公司的流程是什麼，所以很難判斷一個要求合不合理。他們通常也比較不敢質疑自稱是主管或資訊人員的人。攻擊者可以從公開的訊息知道誰是新進人員。','新人到職就要訓練，不要等年度課程。',['f',['到職','盡快完成｜資安訓練','取得系統權限','開始工作'],null,['','a','','']]],
['高風險對象',['有些人員應該接受加強的訓練。','包括：能動用資金的人、權限高的人、經常對外聯絡的人。','例如財務、主管和他們的助理、系統管理者、人資。'],'除了全員的基本訓練，另外為財務部門和高階主管的助理安排專門的課程，內容是匯款詐騙和冒充主管的案例。','所有人接受完全相同的訓練。被攻擊機率最高、出事後果最嚴重的那些人，得到的訓練和其他人一樣。','攻擊者會挑選目標。他們要的是錢、權限或資料，所以會優先鎖定能直接提供這些東西的人。主管的助理常常被忽略，但他們能代替主管處理很多事。把訓練的資源依風險分配，效果最好。','財務、主管與助理、系統管理者、人資，要加強訓練。',['c',[['能動用資金','財務'],['權限高','主管、助理｜系統管理者'],['經常對外','人資、客服、採購']]]]],
2:[
['心理',['社交工程最常利用四種心理：急迫、權威、好奇、樂於助人。','「主管急著要」是急迫加權威；「看看這是不是你」是好奇；「可以幫我一個忙嗎」是樂於助人。','認得這些套路，比背誦釣魚信的特徵有用。'],'收到一封信，發現自己有「必須馬上處理」的感覺。意識到這個感覺本身就是警訊，於是先停下來查證。','「我夠聰明，不會被騙」。社交工程利用的是人正常的反應，和聰不聰明無關，愈有責任感的人有時愈容易中招。','攻擊的手法和包裝會不斷改變，但背後利用的心理是固定的。這些反應在平常是有益的：尊重主管、幫助同事、準時完成工作。攻擊者做的是在錯誤的情境下觸發它們。學會察覺自己被觸發，就能應付沒有見過的新手法。','四種套路：急迫、權威、好奇、樂於助人。',['c',[['急迫','現在不處理｜就來不及'],['權威','主管或官方｜要求的'],['好奇','看看這是什麼'],['樂於助人','可以幫個忙嗎']]]],
['手法',['有些攻擊分成好幾個階段、使用好幾種管道。','例如先打電話冒充廠商建立關係，幾天後才寄出帶有惡意附件的信。','目的是讓目標放下戒心，覺得這封信是預期中的。'],'週一接到電話：「我是某某廠商的新窗口，之後會寄報價單給您。」週四果然收到報價單。因為事先被告知，收件人沒有懷疑就打開了。','只對「突然出現的陌生信件」有警覺。經過鋪陳之後，這封信已經不是陌生的、也不是突然的。','人判斷一封信可不可疑，很大程度是看它是不是意料之外的。攻擊者先用一個無害的接觸建立預期，後續真正的攻擊就會被當成正常往來的一部分。使用不同的管道（電話加郵件）還會讓人覺得這個來源已經被驗證過了。','先打電話鋪陳、再寄信：讓你覺得是預期中的。',['f',['第一次接觸：｜無害的電話','建立關係｜和預期','幾天後：｜寄出惡意附件','收件人｜不疑有他'],null,['','','w','w']]],
['多因素',['開了多因素驗證還是可能被釣魚。','攻擊者架設即時轉送的釣魚網站：你輸入的帳號密碼和驗證碼，它立刻轉送到真正的網站登入。','因應的方向是採用能抵抗釣魚的驗證方式（例如實體金鑰），並教使用者核對網址。'],'使用者在假網站輸入帳號密碼，手機收到驗證碼也照樣輸入。假網站同步把這些送到真的網站，攻擊者就登入成功了。','「有開多因素驗證就不怕釣魚」。簡訊驗證碼、驗證器上的數字，都可以被當場騙走並轉用。','驗證碼只證明「知道這組數字」，而使用者把數字打在哪裡，它無法分辨。實體金鑰這類方式會把驗證和網站的網址綁在一起，在假的網站上根本無法完成驗證，所以騙不走。','多因素也會被即時轉送騙走；要用抗釣魚的驗證並核對網址。',['f',['使用者在假網站｜輸入帳密','也輸入驗證碼','假網站即時｜轉送到真網站','攻擊者登入成功'],'實體金鑰會核對網址，在假網站上無法完成驗證',['w','w','w','w']]],
['行動裝置',['透過簡訊或通訊軟體傳來的詐騙連結，比電子郵件更容易得手。','手機的螢幕小，網址常常只顯示一部分，很難辨認。','而且這些管道沒有經過公司的郵件過濾。'],'手機收到「您的包裹地址有誤，請點此更新」的簡訊。在手機上網址只顯示開頭的一小段，看起來很像真的物流網站。','只針對電子郵件做訓練和演練。同仁對郵件有警覺，對簡訊和通訊軟體的訊息卻完全沒有防備。','公司的電子郵件會經過過濾、有警示標記，使用者也在電腦上用比較大的螢幕閱讀。手機上的訊息這些條件都沒有，而且人在使用手機時通常比較隨意、比較快速。攻擊者自然會轉向防護比較弱的管道。','簡訊和通訊軟體的連結更難辨認，訓練不能只教郵件。',['c',[['電子郵件','有過濾和警示｜螢幕大、看得到網址'],['簡訊、通訊軟體','沒有過濾｜螢幕小、網址難辨認','w']]]],
['演練設計',['釣魚演練的難度要由易到難。','內容要貼近實際會收到的攻擊樣態。','每一次演練要有明確想訓練的重點。'],'第一季用比較明顯的包裹通知信；第二季用假冒內部系統的密碼到期通知；第三季用模仿真實廠商往來的信件。','一開始就用極難辨識的信，大部分的人都中招，然後得到「大家資安意識很差」的結論。同仁只會覺得被設計，對演練產生反感。','演練的目的是讓人學會辨識。學習需要循序漸進：先在簡單的例子上建立信心和基本的判斷方法，再逐步面對更難的。難度和實際的威脅脫節，學到的東西也用不上。','演練由易到難，貼近真實的攻擊樣態。',['f',['明顯的｜釣魚信','假冒｜內部通知','模仿真實｜往來的信'],'每一次有明確的訓練重點']],
['回饋',['同仁在演練中點了連結，最有效的做法是當下立刻給予簡短的說明。','指出這封信有哪些可疑的地方。','在犯錯的當下，學習的效果最好。'],'點下演練信的連結後，馬上看到一個頁面：「這是一次演練。這封信有三個可疑的地方：寄件網域、催促的語氣、連結的網址。」','幾週之後才收到一份統計報告，或是被主管約談。那時候已經不記得當時的信長什麼樣子、自己為什麼會點。','人在剛做完一個決定時，對當時的情境和自己的想法記得最清楚，這時候指出哪裡可以注意，最容易和實際的經驗連結起來。回饋的語氣要是教學的，而不是責備的，否則人會把注意力放在自我辯護上。','點了就當下說明哪裡可疑；不要羞辱。',['c',[['當下說明','記憶最清楚｜學習效果最好','a'],['事後才通知','已經不記得｜當時的情境','off'],['羞辱或處罰','以後不敢承認','w']]]],
['流程',['防詐的做法（例如匯款前電話確認）要真的被執行，必須寫進正式的流程。','並且讓同仁知道，照流程做會得到支持。','面對「老闆很急」的壓力，人需要制度當靠山。'],'公司規定：變更收款帳戶一律要電話向對方既有的窗口確認，沒有例外。總經理在會議上公開說明，即使是他本人的指示也要照做。','只在訓練時告訴大家「要記得確認」。真的遇到自稱主管的人催促時，同仁不敢冒著得罪主管的風險堅持確認。','個人很難對抗權威和時間的壓力，尤其當要求看起來是來自主管。把確認變成每個人都必須做的固定步驟，同仁就不需要自己判斷「這次要不要確認」，也可以用「這是公司規定」來回應催促。','防詐要寫進流程，而且照做的人要被支持。',['f',['寫進正式流程','主管公開支持','同仁敢說｜「要先確認」','詐騙被擋下'],null,['a','a','','']]],
['文化',['主管自己不遵守資安規定，同仁會認為規定只是形式。','主管的行為比任何教材都有說服力。','資安文化是由上而下建立的。'],'主管要求助理幫他保管密碼、要求資訊單位替他關閉多因素驗證。同仁看在眼裡，結論是「這些規定不是認真的」。','認為資安意識是基層同仁的事，主管只要簽核訓練計畫就好。','人判斷一件事重不重要，看的是周圍的人實際怎麼做，尤其是有權力的人。規定和實際行為不一致時，人會相信行為。另外，主管正好是攻擊者最想取得的帳號，他們的例外造成的風險最大。','主管不遵守，規定就變成形式。',['c',[['主管帶頭遵守','同仁認為｜這是認真的','a'],['主管要求例外','同仁認為｜只是形式','w']]]]],
3:[
['策略',['全年度的資安意識計畫，比一年上一次課有效的做法是：短而頻繁、多種形式。','並且結合時事和實際發生的事件。','例如每月一則短訊息、每季一次演練、遇到新的詐騙手法時即時提醒。'],'每個月發一則兩分鐘可以看完的提醒，內容取材自當月的真實案例；每季做一次演練；新聞報導重大詐騙時，隔天就發一則相關的說明。','每年安排一次兩小時的課程，所有人簽到、做測驗、留下紀錄。兩週之後內容就被忘記了，剩下的五十週沒有任何提醒。','習慣是靠重複建立的，不是靠一次大量的資訊。短而頻繁的接觸讓資安一直在人的注意範圍內。結合時事，則是利用人對正在發生的事本來就有的興趣。','意識計畫要短而頻繁、形式多樣、結合時事。',['c',[['一年一次長課程','兩週就忘了','w'],['短而頻繁','每月提醒｜每季演練｜時事即時說明','a']]]],
['度量',['要證明資安意識計畫有效，要看行為指標的長期趨勢。','包括：回報率、回報的速度、實際發生的事件數量和類型的變化。','課程的滿意度和測驗分數，不能代表行為真的改變了。'],'兩年的資料顯示：回報率從 12% 上升到 41%，第一次回報的時間從 40 分鐘縮短到 5 分鐘，因為釣魚信造成的帳號盜用事件減少了一半。','報告寫「完訓率 100%、測驗平均 95 分、滿意度 4.6」。這些數字都很好看，但沒有回答「同仁遇到真的攻擊時會怎麼做」。','計畫的目的是改變行為，所以要量測的就是行為。知道正確的答案和在真實情境下做出正確的動作是兩回事。要看趨勢，是因為單一次的數字受很多因素影響，持續的變化才能說明成效。','成效看行為的長期趨勢，不是完訓率和滿意度。',['c',[['活動指標','完訓率、測驗分數｜滿意度','off'],['行為指標','回報率、回報速度｜實際事件的變化','a']]]],
['風險導向',['資源有限時，資安意識的投入要依角色的風險來分配。','高風險的族群要給更深入、更頻繁的訓練。','風險取決於被針對的機率，以及出事之後的後果。'],'把人員分成三級：全體同仁接受基本訓練；經常對外的人員加上進階的釣魚辨識；財務、高階主管和系統管理者另外有專屬的情境演練。','為了公平，所有人投入相同的時數和內容。結果是低風險的人花了不需要的時間，高風險的人得到的又不夠。','不同角色面對的威脅差異很大。系統管理者的帳號被盜和一般同仁的帳號被盜，後果完全不同；財務人員收到的詐騙信和其他人收到的也不同。把有限的訓練資源集中在風險最高的地方，降低的整體風險最多。','依角色風險分級，高風險的給更深入的訓練。',['f',['全體同仁：｜基本訓練','經常對外：｜進階辨識','財務、主管｜管理者：專屬演練'],'風險愈高，訓練愈深、愈頻繁',['','','a']]],
['人因',['「人是最弱的一環」這種說法現在受到檢討。','問題在於它把責任推給個人，忽略了系統和流程應該設計成讓人不容易犯錯。','好的設計是讓安全的做法就是最容易的做法。'],'與其反覆要求同仁「不要點可疑連結」，不如同時導入抗釣魚的驗證方式，讓密碼即使被騙走也無法登入。','每次出事都歸咎於「同仁資安意識不足」，然後加開訓練課程。同樣的事件還是持續發生。','人每天要處理大量的訊息，在疲勞和壓力下出錯是必然的。一個只要有一個人點錯一次就會被入侵的系統，問題在於它的設計。訓練仍然有用，但它應該是多層防護之一，而不是唯一的防線。','不要把錯都推給人；讓安全的做法變成最容易的做法。',['c',[['責怪個人','加開訓練｜事件照樣發生','w'],['改善設計','人犯錯時｜系統仍然擋得住','a']]]],
['深偽',['面對 AI 合成的聲音和影像，最可靠的防護不是辨識真假。','而是用事先約定的管道和程序來驗證。','例如規定重大的指示必須經過第二個管道確認。'],'公司規定：任何涉及匯款或權限變更的指示，不論是透過電話、視訊還是訊息，都要用通訊錄上的號碼回撥確認之後才能執行。','訓練同仁「注意影像裡不自然的眨眼和嘴型」。合成的技術進步得很快，這些破綻很快就不存在了。','要求一般人去分辨愈來愈逼真的偽造內容，是一場必輸的競賽。程序性的驗證不需要判斷內容的真假：不管對方看起來、聽起來多像，都要經過另一個獨立的管道確認。這個做法不會因為技術進步而失效。','深偽靠流程擋：重大指示一律第二管道確認。',['f',['收到重大指示｜（電話、視訊）','不判斷真假','用約定的｜第二管道確認','確認後才執行'],null,['','','a','']]],
['內部威脅',['資安意識計畫談到內部威脅時，要避免把同仁都當成嫌疑人。','那樣會破壞信任。','重點應該放在：怎麼辨識異常的跡象，以及提供求助和回報的管道。'],'教材說明：如果發現同事的行為有明顯的改變，或自己遇到財務、工作上的壓力，可以找誰談、有哪些協助的資源。','教材的語氣是「你身邊的每個人都可能是內賊」。同仁會覺得不被信任，彼此之間也變得猜疑。','多數的內部事件不是出於惡意，而是疏忽，或是當事人在某種壓力下做了錯誤的決定。在問題變大之前，周圍的人通常會看到一些跡象。讓同仁知道可以去哪裡求助或反映，比要大家互相監視更能預防事件。','談內部威脅不要把人當嫌疑人；提供求助和回報的管道。',['c',[['把同仁當嫌疑人','破壞信任','w'],['教辨識異常跡象','提供求助管道｜和回報管道','a']]]],
['供應鏈',['廠商和合作夥伴的人員，也需要納入資安意識的範圍。','他們有存取你的系統或資料的權限，也可能被當成攻擊的跳板。','做法可以是在合約裡要求基本的訓練，或是提供教材並確認完成。'],'駐點的維護廠商人員在取得帳號之前，要先完成公司的資安說明並簽署遵守規定的文件。','只訓練自己的員工。每天在公司裡工作、帳號權限還很高的廠商人員，卻完全沒有被告知任何規定。','攻擊者會找防護最弱的入口。廠商的人員擁有進入你環境的途徑，但他們接受的訓練和要求可能遠低於你自己的員工。對攻擊者來說，先騙到廠商的人，再利用他的權限進來，是很有效的路線。','有存取權的廠商人員也要納入訓練。',['f',['廠商人員｜有存取權限','合約要求｜基本訓練','取得帳號前｜完成說明','定期確認'],null,['','a','','']]],
['成熟度',['資安文化成熟的組織，最明顯的特徵是同仁會主動回報。','回報可疑的狀況，也回報自己的失誤，而且不怕被責怪。','沒有人不犯錯，能不能在幾分鐘內知道，決定了損害的大小。'],'一位同仁發現自己把含有客戶資料的檔案寄錯人，五分鐘內就通知資安單位。因為知道得早，對方還沒有開啟，信件被及時收回。','用「沒有人回報問題」來判斷資安狀況良好。沒有回報更可能代表的是大家不敢說，或覺得說了也沒用。','技術上的偵測總有看不到的地方，而第一個知道出事的人通常是當事人自己。他願不願意立刻說出來，取決於過去說出來的人被怎麼對待。能做到這一點，代表組織已經把「及早知道」看得比「追究責任」更重要。','成熟的文化：大家主動回報，包括自己的失誤。',['c',[['沒人回報','可能是不敢說','w'],['主動回報｜含自己的失誤','幾分鐘內就知道｜損害最小','a']]]]]};
// ===== 進階專科重點卡：網路與通訊路線 =====
LEARN.neteng={0:[
['路由',['靜態路由是人工一條一條設定的，簡單、好預測，但線路中斷時不會自動改道。','動態路由協定讓路由器自動交換路由資訊、計算路徑，線路斷了會自動改走別條。','OSPF 是在組織內部使用的動態路由協定。'],'總部和分公司之間有兩條線路。用 OSPF 之後，主要線路中斷時，幾秒內流量自動改走備援線路，不用任何人動手。','「靜態路由比較穩定，所以全部用靜態」。規模小時可以，但有備援線路時，靜態路由無法在主線中斷時自動切換。','路由器要知道每個目的地該往哪裡送。靜態路由是把答案寫死；動態路由是讓路由器彼此告知自己連得到哪些網段，再各自算出最佳路徑。網路有變化時，它們會重新交換資訊並重算。','靜態路由不會自動改道；OSPF 是內部用的動態路由。',['c',[['靜態路由','人工設定｜線路斷了不會改道'],['動態路由（OSPF）','自動交換路由｜線路斷了自動改道','a']]]],
['存取控制清單',['ACL 的規則是由上往下逐條比對。','符合第一條就執行並停止，不會再看後面的。','清單的最後通常有一條看不見的「全部拒絕」。'],'想要「拒絕某一台、允許其他全部」。如果把「允許全部」寫在第一條，後面那條拒絕就永遠不會被比對到。','以為 ACL 是「所有規則一起看，取最嚴格的」。實際上順序決定結果，而且沒有被任何一條允許的流量會被最後隱藏的拒絕擋掉。','設備要對每個封包很快做出決定，所以採用最簡單的方式：照順序看，第一條符合的就算數。這讓寫規則的人必須把範圍小、比較明確的規則放在前面，範圍大的放後面。','ACL 由上往下、符合就停；最後有隱藏的全部拒絕。',['f',['第一條｜符合？','第二條｜符合？','…','最後：｜全部拒絕'],'符合哪一條就執行那一條，不再往下看',['','','','w']]],
['交換與 STP',['STP 會在交換器之中選出一台根橋接器，作為計算無迴圈路徑的基準。','選的方式是 Bridge ID 最小的當選：先比優先權，一樣再比 MAC 位址。','沒有設定優先權時，可能是 MAC 最小的舊交換器當選。'],'網路偶爾不穩，檢查後發現根橋接器竟然是一台放在角落的舊交換器。把核心交換器的優先權調低之後，流量路徑恢復合理。','不去設定，讓它自動選。自動選的結果和設備的效能、位置完全無關，常常選到最不適合的那台。','所有交換器會以根橋接器為中心決定哪些埠要轉送、哪些要封鎖，所以流量會傾向經過它。優先權預設都一樣，這時只能比 MAC 位址，而較舊的設備 MAC 往往比較小。','核心交換器要手動把 STP 優先權調低，確保它是根橋接器。',['c',[['不設定','可能由 MAC 最小的｜舊交換器當選','w'],['手動調低優先權','核心交換器｜當根橋接器']]]],
['閘道備援',['HSRP、VRRP 讓兩台設備共用一個虛擬的閘道 IP。','用戶端的預設閘道指向這個虛擬 IP。','主要的那台故障時，另一台自動接手，使用者不用改任何設定。'],'兩台核心交換器共用閘道位址 .1。其中一台當機，另一台在幾秒內接手 .1，電腦完全沒有感覺。','只有一台設備當閘道。它一故障，整個網段的電腦都出不去，就算旁邊還有另一台正常的設備也沒用。','電腦只會設定一個預設閘道的位址。如果這個位址綁在某一台實體設備上，那台設備就是單點。虛擬 IP 把「閘道位址」和「實體設備」分開，位址可以在設備之間移動。','HSRP／VRRP：兩台共用一個閘道 IP，一台掛了另一台接。',['f',['電腦的閘道｜指向虛擬 IP','主要設備｜負責回應','主要設備故障','備援設備｜接手虛擬 IP'],null,['','','w','a']]],
['無線網路',['WPA2／WPA3-Enterprise 是每個人用自己的帳號驗證（802.1X）。','共用密碼（PSK）是所有人用同一組密碼。','個別驗證可以針對單一使用者停用，也查得到是誰連線的。'],'員工離職時，只要停用他的帳號，他就連不上公司的無線網路，其他人完全不受影響。','公司的無線網路用一組大家都知道的密碼。有人離職或密碼外流，就得更換並通知所有人，所以實際上通常都不會換。','共用的密碼無法區分使用者，知道密碼的人愈來愈多，卻無法只撤銷其中一個人。個別帳號把連線和個人對應起來，權限可以個別管理，紀錄上也看得出是誰。','企業無線用個別帳號驗證，不要全公司共用一組密碼。',['c',[['共用密碼（PSK）','一人外流｜全部要換','w'],['Enterprise（802.1X）','個別帳號｜可單獨停用、可追查']]]],
['VPN',['Site-to-Site VPN 連接的是兩個據點的網路，通道是固定的。','Remote Access VPN 是讓個人的裝置連回公司。','兩者用途不同，設定和管理的方式也不同。'],'分公司和總公司之間用 Site-to-Site，兩邊的電腦互連不需要各自撥號；同仁在家用筆電則是用 Remote Access 連回公司。','把兩種混為一談。規劃時要先確定是「兩個網路要相連」還是「個人要連回來」。','Site-to-Site 是由兩端的網路設備建立通道，後面的電腦不知道 VPN 的存在。Remote Access 是由使用者的裝置自己建立通道，所以需要驗證每一位使用者的身分。','Site-to-Site 連兩個據點；Remote Access 連個人裝置。',['c',[['Site-to-Site','兩個據點的網路相連｜固定通道'],['Remote Access','個人裝置連回公司｜要驗證使用者']]]],
['日誌',['網路設備本身能保存的紀錄很少，而且重新開機就不見了。','要用 Syslog 把紀錄送到集中的伺服器。','集中之後可以長期保存，也能把多台設備的紀錄放在一起比對。'],'交換器昨晚重開機，想查原因，設備上的紀錄已經清空。幸好紀錄有送到 Syslog 伺服器，上面留著重開前的錯誤訊息。','只在出問題時登入設備看紀錄。交換器的緩衝區很小，出事時關鍵的紀錄常常已經被新的蓋掉。','網路設備的儲存空間是為了執行，不是為了保存紀錄。而一個網路問題通常牽涉好幾台設備，要把它們的紀錄依時間排在一起才看得出因果。','設備紀錄用 Syslog 集中保存，才留得住、對得起來。',['f',['各台網路設備','Syslog','集中伺服器','長期保存｜交叉比對'],null,['','a','','']]]],
1:[
['路由',['路由器選路的原則是最長前綴匹配：選範圍最精確的那一條。','0.0.0.0/0 是預設路由，所有目的地都符合它，但它的前綴最短。','所以只有在沒有其他更明確的路由時才會用到。'],'路由表有 10.1.0.0/16 和 10.1.1.0/24。送往 10.1.1.50 的封包兩條都符合，會走 /24 那一條。','以為路由表是由上往下比對、符合第一條就用。路由表看的是哪一條最精確，和排列的順序無關。','一個目的地可能同時符合好幾條路由。範圍愈小的路由代表的資訊愈具體，所以優先採用。這也讓設定可以很有彈性：用一條大範圍的路由處理一般情況，再用小範圍的路由處理例外。','路由選最精確的那條；0.0.0.0/0 是最後才用的預設路由。',['c',[['10.1.1.0/24','最精確｜優先採用','a'],['10.1.0.0/16','範圍較大'],['0.0.0.0/0','預設路由｜都不符合才用','off']],'目的地 10.1.1.50：三條都符合，走 /24']],
['交換與 STP',['Port Security 可以限制一個連接埠只能讓指定的、或一定數量的 MAC 位址使用。','用來防止有人拔掉電腦改接自己的設備，或是私接小型交換器。','違規時可以設定成關閉該埠，或只發出告警。'],'辦公室每個埠限制最多兩個 MAC 位址（電腦加電話）。有人私接一台小交換器並接上三台設備，那個埠立刻被關閉。','設定成違規就關閉，但沒有搭配監控和復原的流程。埠被關閉之後使用者報修，沒有人知道原因。','交換器預設會接受任何接上來的設備。限制 MAC 位址的數量，等於規定「這個埠後面只應該有這幾台設備」。超過就代表實體的連接被改動了。','Port Security：限制一個埠能用的 MAC 數量。',['f',['設定每埠｜最多幾個 MAC','有人私接｜交換器','超過上限','關閉該埠｜或告警'],null,['a','w','','']]],
['VLAN',['新增 VLAN 之後，同一台交換器上互通，跨交換器卻不通，要檢查 trunk。','很多環境的 trunk 只允許清單上的 VLAN 通過。','新增 VLAN 時，沿途每一段 trunk 都要加入允許清單。'],'新增 VLAN 50。兩台交換器上都建了，但兩台之間的 trunk 允許清單只有 10、20、30，所以 VLAN 50 過不去。','只在需要的交換器上建立 VLAN，忘記中間經過的交換器和 trunk 也要設定。','trunk 的允許清單是為了避免不需要的 VLAN 流量到處傳送。副作用是每次新增 VLAN 都要記得更新它。資料從一台交換器到另一台，中間每一段 trunk 都要放行才會通。','新 VLAN 跨交換器不通：檢查沿途每一段 trunk 的允許清單。',['f',['交換器甲｜VLAN 50','trunk｜允許清單沒有 50','交換器乙｜VLAN 50'],'沿途每一段 trunk 都要放行',['','w','']]],
['無線網路',['裝置一直連著很遠的基地台不肯換，叫做黏著。','常見原因是基地台的發射功率設太大，遠處的訊號看起來還可以。','發射功率和最低連線速率要一起調整。'],'把基地台的功率調低、提高最低連線速率之後，筆電走到會議室時會主動換到附近的基地台。','覺得訊號不好就把功率調到最大。訊號格數是變多了，但裝置更不願意漫遊，互相干擾也更嚴重。','要不要換基地台是由用戶端裝置自己決定的，它通常要等到目前的訊號很差才會換。功率太大讓它覺得還可以接受。而且裝置本身的發射功率比較小，基地台聽它的訊號其實很吃力，所以連線品質不好。','功率不是愈大愈好；太大會讓裝置黏著不漫遊。',['c',[['功率太大','裝置黏在遠處的基地台｜互相干擾','w'],['適當的功率｜＋最低速率','裝置會換到｜附近的基地台']]]],
['VPN',['IPsec VPN 通道建不起來，最常見的原因是兩端的設定不一致。','要對得上的有：加密演算法、驗證方式、金鑰、保護的網段。','只要有一項不同，協商就會失敗。'],'通道一直建不起來。逐項比對後發現一端設定保護的網段是 /24，另一端設的是 /16。改成一致之後就通了。','一直檢查線路和防火牆。先看設備的紀錄，通常會直接寫出是哪一個階段、哪一個參數不符。','IPsec 建立通道之前，兩端要先協商出一套共同的參數。這是嚴格的比對，不會自動取折衷。兩端常常是不同的人、不同廠牌的設備，預設值也不一樣。','IPsec 建不起來：逐項比對兩端的參數。',['c',[['加密演算法','要一致'],['驗證方式｜和金鑰','要一致'],['保護的網段','兩端要對應']]]],
['服務品質',['QoS 是在頻寬不夠時，決定哪些流量優先通過。','語音、視訊這類即時流量對延遲很敏感，要優先。','QoS 不會增加頻寬。'],'線路壅塞時，檔案下載被放慢，網路電話的封包優先通過，通話維持清楚。','頻寬長期不夠卻想靠 QoS 解決。QoS 只是在分配不足的資源，一定有流量被犧牲。','不同的應用對延遲的容忍度差很多。語音延遲超過零點幾秒就明顯聽得出來；檔案傳輸慢幾秒沒有人在意。壅塞時讓不能等的先走，整體的使用感受最好。','QoS 在壅塞時決定誰先走，不會生出頻寬。',['c',[['語音、視訊','不能等｜優先通過','a'],['檔案傳輸、備份','可以等｜排後面']],'只在頻寬不夠時才有差別']],
['文件與標示',['網路設備的連接埠和線路都要標示。','並且維護一份和現況相符的拓樸圖。','出問題時才能很快知道哪條線接到哪裡、影響到誰。'],'每條線的兩端都貼上相同的編號，機櫃門內貼著配線對照表，拓樸圖放在大家都找得到的地方並標註更新日期。','「我都記得」。半夜出事時處理的可能是別人，而且沒有標籤很容易拔錯線，讓問題擴大。','排除網路問題最花時間的常常是弄清楚現況：這個埠接到哪裡、這條線通往哪台設備。有標示和圖，這個步驟只要幾秒。施工或異動後沒有同步更新的圖，比沒有圖更危險。','線路要標示、拓樸圖要維護，而且要和現況一致。',['c',[['線路標示','兩端同一個編號'],['配線對照表','埠接到哪裡'],['拓樸圖','異動後同步更新']]]]],
2:[
['路由',['BGP 用在不同的網路營運者（自治系統）之間交換路由，例如企業同時接兩家 ISP。','OSPF 把網路切成多個區域，是為了縮小路由計算的範圍。','封包標頭裡的 TTL 每經過一台路由器減一，減到零就丟棄，用來避免路由迴圈時封包無限繞行。'],'公司有自己的 IP 區段，同時接兩家業者，用 BGP 向兩家宣告。其中一家中斷時，外面的流量自動改從另一家進來。','把 BGP 和 OSPF 當成可以互相替代的東西。OSPF 處理組織內部的路由，BGP 處理組織之間的路由，考量完全不同。','內部路由的目標是找最短的路徑，所有設備彼此信任。組織之間則有商業和政策的考量：哪些路要走、哪些不走，由各自決定。區域的設計是因為網路一大，每次變動都全部重算太耗資源。','BGP 管組織之間、OSPF 管組織內部；TTL 防止封包無限繞圈。',['c',[['BGP','不同營運者之間｜例如接兩家 ISP'],['OSPF 分區','縮小路由計算的範圍'],['TTL','每站減一｜到零就丟棄']]]],
['資料中心架構',['Spine-Leaf 架構分成兩層：每一台 Leaf 都連接到每一台 Spine。','任兩台伺服器之間的路徑長度是固定的。','容易橫向擴充：頻寬不夠加 Spine，連接埠不夠加 Leaf。'],'伺服器接在 Leaf 上。任兩台伺服器之間的流量都是 Leaf、Spine、Leaf 三步，不論它們在哪兩個機櫃。','用傳統的核心、匯聚、接取三層式架構來承載大量伺服器之間的流量。伺服器互連要往上繞到核心再下來，路徑長短不一。','傳統架構是為了「用戶端連到伺服器」的流量設計的。現在資料中心裡大部分的流量是伺服器和伺服器之間的。Spine-Leaf 讓這種流量有一致而且短的路徑，並且可以用增加設備的方式平順地擴充。','Spine-Leaf：任兩台伺服器的路徑長度固定，好擴充。',['f',['伺服器','Leaf','Spine','Leaf','伺服器'],'每台 Leaf 都接到每台 Spine；路徑長度固定']],
['網路存取控制',['NAC 除了驗證身分，還會檢查設備是不是符合規定。','例如有沒有裝防毒、系統有沒有更新。','不合規的設備先放到隔離的網段，修正之後再放行。'],'筆電放假兩週後帶回來接上網路，NAC 發現它少了重要的更新，先把它放到只能連更新伺服器的網段，更新完成後才進入內部網路。','只驗證「是不是我們的人」，不檢查「這台設備現在安不安全」。合法使用者的電腦一樣可能帶著問題。','設備的狀態會隨時間改變：離線一段時間、防護軟體被關閉、在外面感染了東西。每次連線時重新檢查，可以確保接上內部網路的設備都達到基本的要求。','NAC 驗身分也驗設備；不合規先隔離。',['f',['設備接上網路','驗證身分','檢查是否合規','不合規：｜放到隔離網段'],null,['','','a','w']]],
['防火牆',['兩台防火牆做主備援時，除了設定，還要同步連線狀態表。','這樣備援機接手時認得既有的連線。','使用者的連線才不會中斷。'],'主要的防火牆故障，備援機在一秒內接手。因為有同步連線狀態，使用者正在進行的視訊會議沒有中斷。','只同步設定。切換的時候備援機不認得任何既有的連線，所有人的連線都斷掉，要重新建立。','狀態式防火牆是依連線狀態表決定封包能不能通過的。備援機如果只有規則而沒有狀態表，切換後收到的封包都屬於它沒看過開頭的連線，會全部被擋下。','防火牆主備援要同步連線狀態，切換才不斷線。',['c',[['只同步設定','切換時｜既有連線全斷','w'],['也同步連線狀態','切換時｜使用者沒感覺']]]],
['IPv6',['很多公司只管理 IPv4，但電腦預設都開著 IPv6。','防火牆規則和監控如果只看 IPv4，IPv6 就是一條沒有人看的路。','做法只有兩種：把 IPv6 也納入管理，或是明確地關閉它。'],'攻擊者在內部網路發送假的 IPv6 路由通告，讓電腦把流量送到他那裡。因為沒有人監控 IPv6，這件事完全沒被發現。','「我們沒有在用 IPv6，所以不用管它」。你沒有在用，不代表它沒有在運作。','作業系統預設會啟用 IPv6 並且優先使用它。只要網路上有設備回應，電腦就會開始用 IPv6 通訊。安全控制都是針對 IPv4 建置的話，這些流量就完全繞過了檢查。','IPv6 預設是開的：要嘛納管，要嘛明確關閉。',['c',[['放著不管','一條沒人看的路','w'],['納入管理','規則和監控都涵蓋'],['明確關閉','確定不使用時']]]],
['廣域網路',['SD-WAN 把多條線路（專線、寬頻、行動網路）當成一個資源池。','由中央統一管理，依線路的品質和應用的類型動態選擇路徑。','線路中斷或品質變差時會自動切換。'],'分公司有一條專線和一條寬頻。視訊會議走品質好的專線，一般上網走寬頻；專線品質變差時，視訊自動改走寬頻。','把 SD-WAN 當成「用便宜的寬頻取代專線」。線路的品質還是要看需求，SD-WAN 的重點是集中管理和依應用選路。','傳統的做法是每一台分公司的設備個別設定，一條主線、一條備援，備援平常閒置。SD-WAN 持續量測每條線路的延遲和遺失率，讓所有線路同時被使用，並由中央下達政策。','SD-WAN：集中管理多條線路，依品質和應用選路。',['f',['多條線路｜專線、寬頻','持續量測品質','依應用選路','變差自動切換'],null,['','a','','']]]],
3:[
['路由',['BGP 本身是建立在信任上的，沒有機制確認宣告路由的人真的擁有那個 IP 區段。','有業者錯誤或惡意地宣告了別人的區段，流量就會被導走。','RPKI 讓 IP 的持有者簽署「誰可以宣告我的位址」，其他業者依此過濾不合法的宣告。'],'公司為自己的 IP 區段建立路由來源授權。之後即使有其他業者錯誤宣告這個區段，有做驗證的業者會拒絕那個宣告。','「這是業者的事，和企業無關」。有自己 IP 區段的企業，要自己去建立授權紀錄，別人才有依據驗證。','網際網路的路由是各個業者互相告知「我這邊可以到哪些位址」，收到的一方預設會相信。只要有一方說錯，錯誤的資訊就會擴散出去。RPKI 加上了一個可以驗證的依據。','RPKI：驗證誰有權宣告某段 IP，防止路由被劫持。',['f',['IP 持有者｜簽署授權','某業者宣告｜這段 IP','其他業者驗證｜來源','不合法的宣告｜被過濾'],null,['a','','','w']]],
['網段隔離',['傳統做法只在邊界放防火牆，進了內網就可以自由連線。','微分段是連內部主機之間的連線也逐一控管，只允許必要的。','攻擊者拿下一台主機之後，橫向移動的每一步都會被擋。'],'網頁伺服器只能連到應用伺服器的特定連接埠，應用伺服器只能連到資料庫。網頁伺服器被入侵，攻擊者也無法直接連到資料庫或其他主機。','把微分段當成「切更多 VLAN」。同一個 VLAN 裡的主機還是可以互連，微分段是連這一層都要控管。','邊界防火牆保護的是「裡面和外面」之間。但實際的攻擊大多是先進來一台，再往內移動。把控制點細到每一台主機，等於每一台周圍都有自己的邊界。','微分段：連內部主機之間也只開必要的連線。',['c',[['只有邊界防火牆','進來之後｜暢行無阻','w'],['微分段','每台主機之間｜只允許必要的連線']]]],
['網路自動化',['用程式自動派送網路設備的設定，效率很高，風險也很高。','最重要的保護機制是：套用前自動檢查和模擬、分批推送、保留可以快速回復的版本。','設定要放進版本控制。'],'修改設定後，先由工具做語法和政策檢查，在模擬環境驗證，再先推到兩台設備，確認正常才推到其餘的；每一步都可以一鍵回復。','寫一支腳本一次推到所有設備。腳本裡有一個錯誤，幾秒之內全公司的網路設備同時被改壞。','人工一台一台改，出錯通常只影響一台，而且改到第二台時可能就會發現。自動化把速度和範圍都放大了，錯誤也一樣。所以自動化的同時要把檢查和回復的機制也做進去。','網路自動化要有：事前驗證、分批推送、快速回復。',['f',['設定進｜版本控制','套用前｜檢查和模擬','分批推送','有問題｜一鍵回復'],null,['','a','a','a']]],
['DDoS',['大流量的 DDoS 攻擊把對外線路塞滿時，在自己這一端擋已經太晚。','要請上游業者或流量清洗服務，在流量進來之前就過濾掉。','這類服務要事先簽好，攻擊發生時才來得及啟用。'],'攻擊發生後十分鐘內啟用清洗服務，流量先被導到清洗中心，過濾後只把正常的流量送回來。','等到被攻擊才開始找清洗服務。簽約、設定、測試都需要時間，這段期間服務是中斷的。','攻擊流量超過線路的頻寬時，正常的流量根本到不了你的設備。處理的位置必須在頻寬比攻擊大的地方。啟用清洗還需要改變路由或 DNS，這些都要事先規劃和演練。','大流量 DDoS 靠上游清洗，而且要事先簽好。',['f',['事先簽約｜並演練','攻擊發生','流量導到｜清洗中心','只把正常的｜送回來'],null,['a','w','','']]],
['流量可視性',['邊界防火牆只看得到進出網路的流量。','攻擊者進來之後的活動都在內部網路，要有東西向流量的可視性才看得到。','做法包括流量紀錄，或在內部設置感測點。'],'在核心交換器啟用流量紀錄。調查時發現一台辦公室電腦在半夜連到二十幾台伺服器的遠端管理埠，這在邊界設備上完全看不到。','所有的監控都集中在對外的出口。內部主機互連的流量不經過那裡，等於只在大門裝了監視器。','入侵之後的偵察、橫向移動、蒐集資料，都發生在內部主機之間。這些階段持續的時間最長，也是最有機會發現攻擊者的時候。沒有內部流量的資料，這整段過程都是看不到的。','只看邊界等於只在大門裝監視器；內部流量也要看得到。',['c',[['邊界設備','只看得到｜進出的流量'],['內部感測點｜或流量紀錄','看得到主機｜之間的活動','a']]]],
['備援設計',['備援機制愈多愈複雜，不一定愈可靠。','太複雜的設計，故障時的行為很難預測，也沒有人看得懂。','簡單、可以理解、實際測試過的設計，往往比花俏的更可靠。'],'一次大範圍的中斷，事後發現原因是兩種自動切換機制互相干擾，各自不斷地切換。簡化成一種之後就穩定了。','「再加一層備援總是比較保險」。每增加一個機制，就增加了它本身出錯，以及和其他機制互相影響的可能。','備援機制本身也是會出錯的元件，而且它只在異常的時候才啟動，平常很少被驗證。機制之間的互動更是很難事先想清楚。很多大型故障的起因不是設備壞掉，而是備援機制在不該啟動的時候啟動，或是啟動後的行為不如預期。','備援不是愈多愈好；簡單、看得懂、測試過才可靠。',['c',[['層層疊加的備援','行為難以預測｜機制互相干擾','w'],['簡單的設計','看得懂｜定期實際測試']]]],
['加密流量',['要不要對員工上網的加密流量做解密檢查，需要權衡。','不解密，看不到內容，惡意程式可以藏在裡面；解密則會碰到隱私、法律和技術上的問題。','通常會排除金融、醫療這類網站，並且事先告知員工。'],'公司政策寫明會對上網流量做安全檢查，並列出不解密的類別（網路銀行、醫療院所）。員工到職時簽署知悉。','沒有告知就全面解密，或是因為覺得麻煩就完全不做。前者有法律和信任的問題，後者讓大部分的流量沒有被檢查。','解密檢查的做法是設備在中間分別和兩端建立加密連線，所以它看得到所有內容，包括密碼和個人的敏感資訊。這個能力很強，也很敏感，所以範圍和用途都要有明確的界線。','解密檢查要權衡：告知員工、排除敏感類別。',['c',[['要考慮','隱私和法律｜憑證信任的管理｜效能'],['做法','事先告知｜排除金融、醫療類別']]]],
['容量規劃',['規劃頻寬時只看平均使用率是不夠的。','平均值會把尖峰蓋掉，而尖峰時段才是使用者覺得慢的時候。','要看尖峰，以及高百分位數（例如第 95 百分位）。'],'對外線路的平均使用率只有 30%，但每天早上九點到十一點都是滿載。報表改看第 95 百分位，數字是 92%，才反映出實際的狀況。','看到平均 30% 就認為頻寬很充裕，然後不理解為什麼使用者一直抱怨慢。','使用者是在特定的時段使用網路，他們感受到的是那個時段的狀況。半夜沒有人用的時間會把平均值拉得很低，但對使用者的體驗沒有任何意義。','頻寬看尖峰和第 95 百分位，不看平均。',['c',[['平均使用率','半夜的空檔｜把數字拉低','off'],['尖峰｜第 95 百分位','反映使用者｜實際的感受','a']]]]]};
LEARN.mon={0:[
['監控觀念',['監控的目的是在使用者發現之前，自己就先知道出問題。','只用 ping 監控是不夠的，它只證明主機有回應。','要檢查服務本身，例如實際去要一次網頁，看有沒有正常回應。'],'網站的主機 ping 得到，但網站程式已經當掉，使用者看到的是錯誤頁面。改成每分鐘實際請求首頁並檢查回應內容之後，這種狀況就偵測得到。','「主機有回應就是服務正常」。主機活著和服務可以用是兩件事，中間還有程式、資料庫、憑證等很多環節。','使用者要的是「功能可以用」，所以監控應該盡量從使用者的角度檢查。愈接近使用者實際的操作，愈能發現真正影響他們的問題。','監控要查服務本身，不是只 ping 主機。',['c',[['只 ping 主機','主機活著｜服務可能已經掛了','w'],['檢查服務本身','實際請求｜並確認回應正確','a']]]],
['告警',['門檻告警是數值超過設定的界線時發出通知。','門檻要讓人來得及處理，又不會一直誤響。','告警要送到當下負責、而且收得到的人。'],'磁碟使用率超過 85% 發出告警，通知會送到當週值班人員的手機，而不是只寄到一個沒有人看的群組信箱。','告警有設定，但通知的對象是一個郵件群組。半夜發生問題時，沒有任何人看到。','告警的價值在於有人採取行動。從偵測到通知到有人處理，中間任何一段斷掉，結果都和沒有監控一樣。所以要確認的不只是「有沒有發出」，而是「對的人有沒有收到」。','告警要送到當下值班、收得到的人。',['f',['數值超過門檻','發出告警','送到值班的人','有人處理'],'任何一段斷掉，都等於沒有告警',['','','a','']]],
['日誌',['日誌記錄的是系統和程式執行過程中發生的事件。','出事之後要還原經過，主要靠它。','平常沒有人看，但沒有它就什麼都查不到。'],'使用者說昨天下午三點操作失敗。到日誌裡找那個時間點，看到當時資料庫連線逾時的錯誤訊息。','覺得平常用不到就不記錄，或是記錄了但很快就被覆蓋。等到需要查的時候才發現沒有資料。','監控的數值告訴你「現在的狀態」，日誌告訴你「發生過什麼事」。排除問題時需要知道事情的經過，而這些只有在發生的當下被記錄下來才會存在。','日誌是事後還原經過的依據，沒記就查不到。',['c',[['指標','現在的狀態'],['日誌','發生過什麼事','a']]]],
['通訊協定',['SNMP 是用來向網路設備和主機查詢狀態數值的協定。','設備也可以主動送出通知（Trap）。','交換器的流量、介面狀態、溫度，很多都是用它取得的。'],'監控系統每分鐘用 SNMP 查詢交換器每個埠的流量，畫成趨勢圖；埠斷線時交換器主動送出通知。','還在使用舊版本和預設的社群字串。舊版本沒有加密，預設的字串等於公開的密碼。','網路設備的種類和廠牌很多，需要一個共通的方式讓監控系統讀取狀態。SNMP 定義了這個方式，所以同一套監控系統可以監控不同廠牌的設備。','SNMP：查詢設備狀態，或接收設備主動送的通知。',['c',[['查詢','監控系統定時｜向設備要數值'],['通知（Trap）','設備有狀況時｜主動送出']],'使用有加密的版本，不要用預設的社群字串']],
['視覺化',['儀表板的用處是一眼看出整體的狀態和趨勢。','它適合用來觀察趨勢和排查問題。','不能期待有人一直盯著看，所以告警還是必要的。'],'值班人員收到告警後打開儀表板，看到流量在十分鐘前突然上升，同時錯誤率也跟著上升。','做了很漂亮的儀表板掛在牆上，就當成監控完成了。沒有人會二十四小時盯著螢幕。','人擅長從圖形看出模式和異常，這是儀表板的價值。但人的注意力無法持續。所以分工是：告警負責在有狀況時把人叫來，儀表板負責讓被叫來的人很快了解情況。','儀表板看趨勢和排查；叫人還是要靠告警。',['c',[['儀表板','看整體狀態和趨勢｜排查問題'],['告警','有狀況時｜主動通知人','a']]]],
['基準線',['要判斷現在的數值算不算異常，要先知道系統平常是什麼樣子。','同樣的數字，對不同的系統意義不同。','沒有基準線，門檻只能憑感覺設定。'],'一台批次主機的 CPU 平常就在 70% 上下，這是正常的；另一台網頁伺服器平常只有 15%，到 70% 就代表有狀況。','所有主機都套用同一組門檻，例如 CPU 超過 80% 就告警。有些主機天天誤報，有些主機出問題卻不會響。','異常的意思是偏離正常。每個系統的工作型態不同，正常的範圍也不同。先觀察一段時間，知道它在不同時段的正常範圍，才能設出有意義的門檻。','先知道平常的樣子，門檻才設得準。',['f',['觀察一段時間','知道正常的範圍','依此設定門檻','偏離才告警'],null,['','a','','']]]],
1:[
['監控方法',['黑箱監控是從外部模擬使用者，看結果對不對。','白箱監控是看系統內部的指標。','黑箱回答「使用者有沒有受影響」，白箱回答「裡面哪裡不對」，兩種都需要。'],'黑箱監控發現登入頁面回應變慢；白箱監控顯示資料庫的連線數已經到上限。兩者合起來才知道發生了什麼、原因在哪。','只有白箱監控。內部每個指標都正常，但使用者其實連不進來，因為問題出在沒有被監控的地方。','黑箱監控不管內部怎麼運作，只看最終的結果，所以不會漏掉任何影響使用者的問題，但它不知道原因。白箱監控知道細節，但只涵蓋有設定的項目。','黑箱看使用者有沒有受影響，白箱看裡面哪裡不對。',['c',[['黑箱監控','從外部模擬使用者｜有沒有受影響'],['白箱監控','看內部指標｜哪裡不對']]]],
['告警',['好的告警，收到的人知道要做什麼。每一條都要對應一個處理動作或文件。','以症狀告警為主：使用者真的受影響才叫人。原因類的指標留在儀表板幫助排查。','預定的維護期間要事先設定靜音，並且有範圍和期限。'],'「網頁回應時間超過 5 秒」會叫人，並附上處理手冊的連結；「CPU 偏高」只顯示在儀表板上。','每個指標都設告警。值班的人每天收到上百則通知，大部分不需要處理，最後全部都不看。','每一次告警都打斷一個人，要求他做判斷。如果大部分的告警不需要行動，人會學到忽略它們。把叫人的條件限定在「使用者受影響、而且需要人處理」，每一則告警才會被認真對待。','告警要可以行動；以使用者受影響的症狀為主。',['c',[['叫人','使用者受影響的症狀｜附處理方式','a'],['放儀表板','CPU 高這類原因指標'],['維護期間','事先靜音｜有範圍和期限']]]],
['指標',['服務監控有四個黃金訊號。','延遲：回應要多久。流量：有多少請求。','錯誤：失敗了多少。飽和度：資源快滿了沒。'],'為一個新的服務建立監控，先做這四項：回應時間、每秒請求數、錯誤率、連線池使用率。','一開始就收集幾百個指標，卻沒有先把最基本的這幾個做好。資料很多，但回答不了「服務現在正不正常」。','這四個訊號是從使用者和容量兩個角度描述一個服務：使用者感受到的是快不快、有沒有成功；系統的角度是負載多大、還有多少餘裕。大部分的問題都會反映在其中至少一個上面。','四個黃金訊號：延遲、流量、錯誤、飽和度。',['c',[['延遲','回應要多久'],['流量','有多少請求'],['錯誤','失敗了多少'],['飽和度','資源快滿了沒']]]],
['日誌',['日誌有等級，例如 DEBUG、INFO、WARN、ERROR，用來依重要程度篩選。','正式環境通常不記錄 DEBUG，排查時再針對性地調高。','把日誌寫成有固定欄位的結構化格式（例如 JSON），程式就能搜尋、篩選和統計。'],'結構化日誌有時間、等級、使用者、動作這些欄位，可以直接查詢「某位使用者昨天下午所有的錯誤」。','正式環境把 DEBUG 全部打開。磁碟很快被塞滿，重要的訊息也被淹沒在大量的細節裡。','日誌要給兩種對象使用：人和程式。等級讓人可以先看重要的；結構化讓程式可以處理。純文字的日誌只能用關鍵字搜尋，資料量一大就很難用。','日誌分等級、寫成結構化格式。',['c',[['等級','ERROR、WARN｜INFO、DEBUG｜正式環境不全開'],['結構化','固定欄位｜程式可查詢、統計']]]],
['監控架構',['監控系統本身當機時，所有的告警都不會發出。','沒有告警不代表沒有事。','要有另一個獨立的機制來檢查監控系統，常見做法是定時送出心跳，沒收到就由外部服務通知。'],'監控系統每分鐘向一個外部服務送出心跳。某天監控主機當機，五分鐘後外部服務因為沒收到心跳而通知值班人員。','監控系統和它監控的對象放在同一台主機、同一個機房、同一條電源。它們會同時故障。','一般的告警是「發生了某件事就通知」。監控系統自己故障時，問題是「沒有任何事發生」，這無法由它自己偵測。所以需要反過來的機制：平常持續報平安，一旦沒有報就告警。','監控系統也要被監控：定時送心跳，沒收到就通知。',['f',['監控系統｜定時送心跳','外部服務接收','沒收到心跳','通知值班人員'],null,['','a','w','']]]],
2:[
['指標',['回應時間不要只看平均值，要看高百分位數，例如第 95 或第 99 百分位。','平均值會把少數很慢的請求蓋掉。','在指標上加上值非常多的標籤（例如使用者編號），會讓時間序列的數量暴增，稱為高基數問題。'],'平均回應時間是 200 毫秒，看起來很好；第 99 百分位卻是 8 秒，代表每一百個請求就有一個要等八秒以上。','為了查詢方便，把使用者編號、請求編號都加到指標的標籤上。監控系統的記憶體和儲存用量很快失控。','平均值描述的是「典型」的情況，但使用者抱怨的是最差的情況。高百分位數才看得到那些人。標籤的每一種不同的值都會產生一條獨立的資料序列；細到個別使用者或個別請求的資訊應該放在日誌或追蹤裡。','看第 95、99 百分位；高基數的資訊不要放進指標標籤。',['c',[['平均值','蓋掉少數｜很慢的請求','off'],['第 99 百分位','看得到最慢的｜那 1%','a'],['高基數標籤','序列數暴增｜成本失控','w']]]],
['告警',['一個上游設備故障，下游可能有幾百台主機同時告警。','告警系統要能依相依關係抑制下游的告警，只通知根源。','也可以把相關的告警合併成一則。'],'核心交換器故障。值班人員只收到一則「核心交換器無回應」的通知，後面兩百台主機的告警被自動抑制。','沒有設定相依關係。值班人員的手機同時收到兩百多則通知，真正的原因被淹沒在裡面。','下游的告警都是同一個原因造成的，對處理沒有額外的幫助，只會製造干擾。把系統之間的相依關係告訴告警系統，它就能判斷哪一個是根源、哪些只是連帶的結果。','設定相依關係：只通知根源，抑制下游。',['f',['上游設備故障','下游兩百台｜同時告警','依相依關係｜抑制','只通知根源'],null,['w','w','a','']]],
['追蹤',['分散式追蹤記錄一個請求經過每一個服務的時間。','它可以回答：這個請求總共花了多久、卡在哪一段。','流量很大的系統通常只取樣保留一部分，錯誤和特別慢的請求優先保留。'],'使用者下單要等六秒。追蹤顯示：訂單服務 0.2 秒、庫存服務 0.3 秒、付款服務 5.4 秒。問題在付款服務。','把每一個請求的追蹤資料全部保留。資料量非常大，儲存和運算的成本很快就無法負擔。','一個請求會經過很多個服務，每個服務只知道自己花了多少時間。追蹤用一個共同的編號把這些片段串起來。正常的請求彼此很相似，保留一小部分就足以代表；有問題的請求才是需要詳細檢視的。','追蹤看一個請求在各服務花多久；資料用取樣保留。',['f',['訂單服務｜0.2 秒','庫存服務｜0.3 秒','付款服務｜5.4 秒','總共 5.9 秒'],'一眼看出慢在哪一段',['','','w','']]],
['服務水準',['SLI 是實際量測到的指標，例如成功請求的比例。','SLO 是為這個指標訂定的目標，例如每個月要達到 99.9%。','先有可以量測的 SLI，才訂得出 SLO。'],'SLI 定為「在一秒內成功回應的請求比例」，SLO 定為「每月 99.5% 以上」。每週檢視實際的數字離目標還有多遠。','訂了一個聽起來很好的目標（例如「高可用」），卻沒有定義怎麼量測。結果沒有人說得出目前有沒有達標。','目標要能驗證才有意義。SLI 規定了「量什麼、怎麼量」，SLO 規定了「要到多少」。兩者都明確，團隊才能判斷現在的表現夠不夠好，以及資源該投入在新功能還是穩定性。','SLI 是量到的數字，SLO 是訂的目標。',['c',[['SLI','實際量到的指標｜例如成功請求比例'],['SLO','為它訂的目標｜例如每月 99.9%']]]],
['容量',['監控資料除了即時告警，還可以用來做容量規劃。','依成長的趨勢，預測資源什麼時候會不夠。','容量問題不是突然發生的。'],'磁碟使用量過去一年每個月增加 3%。照這個趨勢，五個月後會用完，於是現在就開始採購。','等到資源用到九成、告警響了才處理。採購和安裝需要時間，這時候往往已經來不及。','資源的使用量通常是穩定成長的，從過去的資料可以推估未來。即時告警只能告訴你「現在快滿了」，趨勢分析可以提前幾個月告訴你「什麼時候會滿」。','用趨勢預測何時不夠，不要等告警響。',['f',['收集長期的｜使用量','畫出成長趨勢','預測何時用完','提前擴充'],null,['','a','','']]],
['監控方法',['合成監控是定時模擬使用者的操作，沒有人使用的時候也能發現問題。','真實使用者監控是收集實際使用者的體驗資料。','後者可以看到不同地區、不同裝置的真實狀況。'],'合成監控在凌晨三點發現登入功能故障，在早上有人使用之前就修好了。真實使用者監控則顯示，某一款手機瀏覽器的使用者載入特別慢。','只用其中一種。只有合成監控，看不到真實環境的多樣性；只有真實使用者監控，沒有人使用的時段發生的問題就沒有資料。','合成監控的條件是固定的，適合用來持續確認「功能有沒有壞」。真實使用者的環境千變萬化，網路、裝置、地點都不同，只有收集實際的資料才看得到這些差異造成的問題。','合成監控半夜也測得到；真實使用者監控反映實際體驗。',['c',[['合成監控','定時模擬操作｜沒人用時也能發現'],['真實使用者監控','實際的體驗｜各地區、各裝置']]]]],
3:[
['可觀測性',['傳統監控是檢查已知會出問題的地方。','可觀測性是能夠從系統輸出的資料，回答事先沒有預料到的問題。','也就是在沒有見過的故障發生時，還有足夠的資料可以追查。'],'發生一個從來沒遇過的問題。因為有詳細的紀錄、指標和追蹤，可以依使用者、版本、地區等各種條件切分資料，逐步縮小範圍找到原因。','把可觀測性當成「更多的儀表板和告警」。重點不在數量，而在資料夠不夠豐富、能不能自由地查詢。','系統愈複雜，可能的故障方式愈多，不可能事先為每一種都設好檢查。可觀測性的想法是：不預設會出什麼問題，而是讓系統把足夠的資訊輸出來，到時候再依實際的狀況去問問題。','可觀測性：能回答事先沒想到的問題。',['c',[['傳統監控','檢查已知｜會壞的地方'],['可觀測性','沒見過的故障｜也有資料可以追','a']]]],
['告警治理',['告警會愈加愈多，值班的人逐漸麻痺。','要定期檢視每一條告警：有沒有人處理、有沒有用。','沒有用的就刪除或修改。每一條告警都要有負責人和處理方式。'],'每季檢視過去三個月的告警統計。有一條告警響了四百次，沒有一次需要處理，就把它刪除。','「多一條告警總比漏掉好」。不需要處理的告警會稀釋所有告警的可信度，包括那些真正重要的。','每一條告警在建立的時候都有理由，但環境會改變，當初的理由可能已經不存在。沒有固定的檢視機制，告警只會增加不會減少。而人處理告警的能力是有限的。','定期檢視告警：沒人處理、沒用的就刪或改。',['f',['統計每條告警｜響了幾次','有幾次需要處理？','沒用的｜刪除或修改','每條都有｜負責人'],null,['','a','','']]],
['成本',['日誌的量會快速成長，保存的費用也跟著上升。','合理的策略是依用途分級。','近期的放在可以快速查詢的地方，久遠的壓縮歸檔，沒有用的不要收。同時要符合法規和調查所需的最低保存期限。'],'最近三十天的日誌放在可以即時搜尋的系統；三十天到一年的壓縮後放到便宜的儲存；除錯用的詳細日誌只保留七天。','全部的日誌都用最高規格保存一樣長的時間，或是為了省錢全部只留很短的時間。','不同的日誌價值不同，查詢的頻率也隨時間下降：最近的資料常常要查，一年前的幾乎不會查但不能沒有。依這個特性把資料放在不同成本的儲存上，可以在費用和需求之間取得平衡。','日誌分級保存：近期快查、久遠歸檔、沒用不收。',['c',[['近期','快速查詢'],['較久遠','壓縮歸檔'],['沒有用途','不要收'],['底線','法規和調查｜的保存期限','a']]]],
['告警',['固定門檻的告警，遇到短暫的小波動也會叫人。','以 SLO 的錯誤預算消耗速度來告警，是看「照這個速度，目標守不守得住」。','短暫的波動不會叫人，持續的消耗才會。'],'這個月允許的失敗量是 0.1%。如果目前消耗的速度會讓整個月的額度在兩天內用完，就立刻叫人；如果只是慢慢消耗，就開一張單在上班時間處理。','錯誤率一超過 1% 就叫人。一個持續三十秒的小波動在半夜把人叫醒，而它對整個月的目標幾乎沒有影響。','業務在乎的是一段時間內的整體表現。固定門檻只看當下的數值，無法分辨「短暫的尖峰」和「持續的惡化」。用消耗速度來判斷，可以依嚴重程度決定要多快反應。','依錯誤預算消耗速度告警：小波動不叫人，持續消耗才叫。',['c',[['固定門檻','短暫波動｜也會叫人','off'],['消耗速度','消耗很快：立刻叫人｜消耗慢：開單處理','a']]]],
['監控即程式碼',['把告警規則和儀表板用程式碼來定義，並放進版本控制。','好處是每次變更都有紀錄、可以審查。','不同的環境之間也能保持一致。'],'要調整一條告警的門檻，就修改設定檔、提出合併請求、由同事審查後自動套用。之後可以查到是誰、為什麼改的。','在監控系統的介面上手動點出規則。沒有人知道誰改過什麼、為什麼改，測試環境和正式環境的規則也愈來愈不一樣。','監控的設定和程式碼一樣，會隨時間不斷修改，也一樣會改錯。用管理程式碼的方法來管理它，就能得到同樣的好處：歷史、審查、回復、一致性。','告警規則和儀表板寫成程式碼、進版本控制。',['f',['修改設定檔','提出合併請求','審查','自動套用'],null,['','','a','']]],
['持續改善',['每一次重大事件之後，都要檢討監控。','要問：為什麼沒有更早發現？缺了哪一個訊號？','把缺口補上，同類的問題下一次就會更早被看到。'],'事件檢討發現，問題發生後四十分鐘才由使用者回報。原因是缺少對登入成功率的監控。補上之後，下一次類似的問題在三分鐘內就被發現。','事件處理完就結束，沒有回頭檢視監控。同樣的盲點繼續存在。','每一次事件都清楚地指出了監控的缺口：如果有對的訊號，應該可以更早發現。這是最有依據的改善機會，因為它不是猜測可能出什麼問題，而是已經發生的事實。','每次事件後問：為什麼沒更早發現？缺了哪個訊號？',['f',['事件結束','多久才發現？','缺了哪個訊號？','補上監控'],null,['','a','a','']]],
['業務監控',['所有技術指標都正常，不代表業務正常。','還需要業務層面的指標，例如訂單數、登入成功率。','這類指標常常比技術指標更早反映出問題。'],'CPU、記憶體、錯誤率都正常，但訂單數突然掉了一半。查出是付款頁面上的一個按鈕在新版本裡失效了，系統本身沒有產生任何錯誤。','只監控技術指標，認為「系統正常就是服務正常」。有些問題不會產生任何技術上的錯誤。','系統是為了完成業務而存在的，業務的結果才是最終要確保的東西。很多問題（功能的邏輯錯誤、使用者流程被阻斷）在技術指標上完全看不出來，但會直接反映在業務的數字上。','技術指標正常不夠，還要監控訂單數這類業務指標。',['c',[['技術指標','CPU、記憶體｜錯誤率'],['業務指標','訂單數｜登入成功率','a']],'有些問題只會反映在業務指標上']],
['工具策略',['每個團隊各用一套不同的監控工具，資料之間不互通。','跨系統的問題很難關聯，授權和維護的成本也高。','不一定要只剩一套工具，但資料至少要能夠關聯。'],'一次跨三個系統的故障，三個團隊各自看著自己的工具，花了一小時才把時間軸對起來。之後約定所有系統使用共同的請求編號和時間格式。','為了統一而強迫所有團隊改用同一套工具，不考慮各自的需求；或是完全放任，每個團隊各做各的。','故障很少只發生在一個團隊的範圍內。跨團隊的問題最需要把各系統的資料放在一起看，而這正是分散的工具做不到的。重點是資料能不能互相對照，而不是工具的數量。','工具可以不只一套，但資料要能關聯。',['c',[['各用各的','資料不互通｜跨系統問題難查','w'],['約定共同的｜編號和格式','資料可以對照']]]]]};
LEARN.wifi={0:[
['基礎',['SSID 是無線網路的名稱。','同一個 SSID 可以由很多台基地台共同提供。','所以使用者在不同的地點看到的是同一個名稱，可以走到哪連到哪。'],'公司每一層樓都有好幾台基地台，全部使用同一個 SSID。員工從三樓走到五樓，筆電自動換到附近的基地台，不用重新選擇網路。','每一台基地台設一個不同的名稱。使用者移動時要手動切換，裝置也不會自動換到訊號比較好的那一台。','SSID 只是一個名稱，和實體的基地台沒有一對一的關係。裝置認的是名稱和安全設定，只要這兩者相同，它就會把這些基地台當成同一個網路。','SSID 是網路名稱；多台基地台可以用同一個。',['f',['基地台甲','同一個 SSID','基地台乙','裝置自動切換'],null,['','a','','']]],
['頻段',['2.4GHz 傳得比較遠、穿透力比較好，但干擾多、速度慢。','5GHz 速度快、頻道多，但穿透力比較差。','辦公室通常以 5GHz 為主，2.4GHz 留給舊設備和物聯網裝置。'],'筆電和手機連 5GHz，速度快而且穩定；舊型的條碼掃描器只支援 2.4GHz，另外放在專用的網路。','覺得 2.4GHz 訊號比較強就都用它。它的頻道少，又和藍牙、微波爐共用，在辦公室通常是最擁擠的。','頻率愈高，能攜帶的資料愈多，但愈容易被牆壁吸收。2.4GHz 因為早期設備都使用它，加上可用的頻道很少，所以最擁擠。','2.4GHz 遠但慢又擠，5GHz 快但穿透差。',['c',[['2.4GHz','傳得遠、穿透好｜干擾多、速度慢'],['5GHz','速度快、頻道多｜穿透力較差','a']]]],
['加密',['無線網路要使用 WPA2 或 WPA3。','WEP 已經過時，幾分鐘就能破解。','沒有加密的網路，旁邊的人可以看到你的流量。'],'檢查公司的基地台，發現有一台舊設備還在用 WEP，立刻汰換。','「有設密碼就是安全的」。用的是 WEP 的話，那個密碼幾乎沒有保護作用。','無線訊號是向四周發送的，範圍內的任何人都收得到。加密是唯一能讓別人收到也看不懂的方法。WEP 的設計有根本的缺陷，只要收集夠多的封包就能算出金鑰。','無線網路用 WPA2 或 WPA3；WEP 等於沒加密。',['c',[['WEP、不加密','幾分鐘可破解｜流量被看光','w'],['WPA2、WPA3','目前應使用的','a']]]],
['訪客網路',['提供給訪客的無線網路，要和內部網路隔離。','只讓它連到網際網路。','訪客的裝置狀況是未知的。'],'訪客連上「Guest」網路後可以上網，但連不到公司的任何伺服器、印表機或其他人的電腦。','為了方便，直接把公司內部無線網路的密碼告訴訪客。訪客的裝置就直接接在內部網路上了。','公司對自己的裝置有管理：有更新、有防護軟體。訪客的裝置完全沒有這些保證。隔離之後，不管那台裝置上有什麼，都接觸不到內部的系統。','訪客網路要隔離，只能上網。',['c',[['給內部網路密碼','未知的裝置｜直接進內網','w'],['獨立的訪客網路','只能上網｜碰不到內部']]]],
['排錯',['訊號滿格只代表收得到訊號，不代表速度快。','上網慢的常見原因是同一台基地台連了太多人。','或是頻道受到干擾。'],'會議室訊號滿格但很慢。查看後發現那一台基地台同時連了六十台裝置。加裝一台分擔之後就改善了。','看到訊號滿格就排除無線網路的問題，轉去查別的地方。','無線網路是大家共用同一段空中的時間，同一時間只能有一台裝置傳送。人愈多，每個人輪到的時間愈少。附近其他無線網路使用相同的頻道時，也要一起分。','訊號滿格還是慢：人太多，或頻道被干擾。',['c',[['訊號強度','只代表收得到'],['連線人數','大家分享｜同一段時間','w'],['頻道干擾','和鄰近網路｜互相影響','w']]]],
['部署',['無線基地台要放在使用者所在區域的上方、開闊的地方。','裝在天花板、朝下是常見的做法。','金屬和厚牆會嚴重衰減訊號。'],'基地台裝在辦公區的天花板中央，而不是放在角落的機櫃裡或金屬檔案櫃上面。','為了美觀或配線方便，把基地台藏在天花板上方的金屬輕鋼架裡，或放在機房。訊號大部分被擋住了。','無線訊號遇到障礙物會衰減，金屬和鋼筋混凝土的影響最大。基地台和使用者之間的障礙愈少愈好。天線的設計通常是朝下方和四周發射，所以裝在上方效果最好。','基地台裝在使用者上方的開闊處，避開金屬和厚牆。',['c',[['好的位置','天花板、朝下｜開闊無遮蔽','a'],['不好的位置','機櫃裡｜金屬旁、牆角','w']]]],
['安全迷思',['把 SSID 設成隱藏，幾乎不能提高安全性。','隱藏只是基地台不主動廣播名稱。','裝置連線時還是會把名稱送出去，用工具很容易看到。'],'用無線分析工具掃描，隱藏的網路一樣列在清單上，只要等到有裝置連線，名稱就顯示出來了。','把隱藏 SSID 當成一種保護措施，因此放鬆了加密和驗證的設定。','安全要靠的是別人無法偽造或破解的東西，例如加密和身分驗證。網路的名稱本來就不是秘密，而且是以明文在空中傳送的。隱藏還會讓裝置到處詢問「某某網路在不在」，反而洩漏資訊。','隱藏 SSID 不是防護；安全靠加密和驗證。',['c',[['隱藏 SSID','用工具｜很容易找到','off'],['加密和驗證','真正的防護','a']]]],
['公用網路',['在公用 Wi-Fi 上，連線可能被監聽。','也可能連到的是假冒的熱點。','處理公務時要使用 VPN，把流量加密之後才送出去。'],'在機場連上免費 Wi-Fi 之後，先開啟公司的 VPN，再開始收信和使用內部系統。','「網站都有 HTTPS 了，公用網路沒差」。HTTPS 保護了大部分的內容，但假冒的熱點還是可以把你導到假的登入頁面。','公用網路上你不知道其他的使用者是誰，也無法確認基地台是不是真的屬於那個場所。VPN 在你的裝置和公司之間建立加密的通道，中間的網路不管是誰的，都只看得到加密過的資料。','公用 Wi-Fi 辦公要開 VPN。',['f',['公用 Wi-Fi','可能被監聽｜或是假熱點','開啟 VPN','流量加密後｜才送出'],null,['','w','a','']]]],
1:[
